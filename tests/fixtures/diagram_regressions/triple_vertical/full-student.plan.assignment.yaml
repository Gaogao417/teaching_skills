meta:
  title: "三垂直相似模型 专项练习"
  subtitle: "母模型 $a\\cdot d = b\\cdot c$：比例信息藏在哪里——五类变式 + 压缩交叉模型"
  grade: "初三"
  subject: "数学"
  duration: "45分钟"
  total_points: 100
  version: "student"
  notes:
    - "本练习基于「三垂直相似 / 比例中项」母模型（$AB\\perp BD,DE\\perp BD,AC\\perp CE\\Rightarrow\\triangle ABC\\sim\\triangle CDE$，核心 $AB\\cdot DE=BC\\cdot CD$）的五类变式与压缩交叉模型 $BC^2=AB\\cdot CD$；与同目录全等版结构分析互补。"

render:
  template: "exam-zh-practice"
  paper_size: "a4paper"
  answer_key_position: "after_page_break"

sections:
  - id: "choice"
    title: "一、选择题（每题 4 分）"
    type: "practice"
    visibility: "student"
    blocks:
      - type: "choice"
        id: "c1"
        points: 4
        stem: "如图，$AB\\perp BD$，$DE\\perp BD$，$AC\\perp CE$，$B,C,D$ 三点共线。记 $AB=a$，$BC=b$，$CD=c$，$DE=d$。下列式子一定成立的是"
        choices:
          A: "$a\\cdot c = b\\cdot d$"
          B: "$a\\cdot b = c\\cdot d$"
          C: "$a\\cdot d = b\\cdot c$"
          D: "$\\dfrac{a}{c}=\\dfrac{d}{b}$"
        hints:
          - content: "先找两个直角三角形相似，再盯紧对应边：$AB\\leftrightarrow CD$，$BC\\leftrightarrow DE$。"
        diagram_slot: &slot_mother
          slot_id: "c1.prompt"
          diagram_ref: "c1.prompt"
          variant: "prompt"
          disclosure_policy: "clean"
          required: true
          on_failure: "fail_assignment"
          placement: "diagram_col"
          layout_role: "question_sidecar"
          display_profile: "worksheet_geometry_sidecar"
          caption: "三垂直母图。"
          diagram_kind: "synthetic_geometry"
          teaching_intent: "practice_prompt"
          semantic_constraints:
            given_objects: ["A", "B", "C", "D", "E"]
            given_constraints: ["B,C,D collinear", "AB⊥BD", "DE⊥BD", "AC⊥CE"]
          visual_requirements:
            required_visible_annotations:
              markers:
                - {type: right_angle, vertex: B, arms: [A, D]}
                - {type: right_angle, vertex: C, arms: [A, E]}
                - {type: right_angle, vertex: D, arms: [B, E]}
      - type: "choice"
        id: "c2"
        points: 4
        stem: "在上一题的图形条件下，若再增加 $AB=DE$，且 $BC=2$，$CD=8$，则 $AB=$"
        choices:
          A: "$2$"
          B: "$4$"
          C: "$5$"
          D: "$16$"
        hints:
          - content: "把 $AB=DE$ 代入母公式，会得到一个「平方 = 乘积」的式子。"
        diagram_slot:
          <<: *slot_mother
          slot_id: "c2.prompt"
          diagram_ref: "c2.prompt"
          caption: "三垂直母图，$AB=DE$。"
          semantic_constraints:
            given_objects: ["A", "B", "C", "D", "E"]
            given_constraints: ["B,C,D collinear", "AB⊥BD", "DE⊥BD", "AC⊥CE", "AB=DE"]
          visual_requirements:
            required_visible_annotations:
              markers:
                - {type: right_angle, vertex: B, arms: [A, D]}
                - {type: right_angle, vertex: C, arms: [A, E]}
                - {type: right_angle, vertex: D, arms: [B, E]}
                - {type: equal_ticks, segments: [[A, B], [D, E]]}
      - type: "choice"
        id: "c3"
        points: 4
        stem: "在母图条件下，若 $\\tan\\angle BAC=\\dfrac12$，则"
        choices:
          A: "$AB=2\\,BC$"
          B: "$BC=2\\,AB$"
          C: "$AB=BC$"
          D: "$AB=4\\,BC$"
        hints:
          - content: "在 $\\triangle ABC$ 中 $\\angle B=90^\\circ$，$\\tan\\angle BAC$ 的对边与邻边分别是哪两条？"
        diagram_slot:
          <<: *slot_mother
          slot_id: "c3.prompt"
          diagram_ref: "c3.prompt"
          caption: "三垂直母图，给 $\\tan\\angle BAC$。"
          semantic_constraints:
            given_objects: ["A", "B", "C", "D", "E"]
            given_constraints: ["B,C,D collinear", "AB⊥BD", "DE⊥BD", "AC⊥CE"]

  - id: "fillin"
    title: "二、填空题（每题 4 分）"
    type: "practice"
    visibility: "student"
    blocks:
      - type: "fillin"
        id: "f1"
        points: 4
        stem: "如图（母图），$AB=3$，$BC=4$，$CD=6$，则 $DE=\\underline{\\hspace{2em}}$。"
        hints:
          - content: "四条直角边知三求一，直接交叉相乘。"
        diagram_slot:
          <<: *slot_mother
          slot_id: "f1.prompt"
          diagram_ref: "f1.prompt"
          caption: "知三求一。"
          semantic_constraints:
            given_objects: ["A", "B", "C", "D", "E"]
            given_constraints: ["B,C,D collinear", "AB⊥BD", "DE⊥BD", "AC⊥CE"]
      - type: "fillin"
        id: "f2"
        points: 4
        stem: "如图（母图），$AB=DE$，$BC=3$，$CD=12$，则 $AB=\\underline{\\hspace{2em}}$。"
        hints:
          - content: "令 $AB=DE=x$，母公式就变成 $x^2=BC\\cdot CD$。"
        diagram_slot:
          <<: *slot_mother
          slot_id: "f2.prompt"
          diagram_ref: "f2.prompt"
          caption: "两侧等边 $a=d$，平方根型。"
          semantic_constraints:
            given_objects: ["A", "B", "C", "D", "E"]
            given_constraints: ["B,C,D collinear", "AB⊥BD", "DE⊥BD", "AC⊥CE", "AB=DE"]
          visual_requirements:
            required_visible_annotations:
              markers:
                - {type: right_angle, vertex: B, arms: [A, D]}
                - {type: right_angle, vertex: C, arms: [A, E]}
                - {type: right_angle, vertex: D, arms: [B, E]}
                - {type: equal_ticks, segments: [[A, B], [D, E]]}
      - type: "fillin"
        id: "f3"
        points: 4
        stem: "如图（母图），$C$ 是 $BD$ 的中点，$AB=2$，$DE=8$，则 $BC=\\underline{\\hspace{2em}}$。"
        hints:
          - content: "$C$ 为中点意味着 $BC=CD$，母公式变成 $BC^2=AB\\cdot DE$。"
        diagram_slot:
          <<: *slot_mother
          slot_id: "f3.prompt"
          diagram_ref: "f3.prompt"
          caption: "底边中点 $b=c$，比例中项型。"
          semantic_constraints:
            given_objects: ["A", "B", "C", "D", "E"]
            given_constraints: ["B,C,D collinear", "AB⊥BD", "DE⊥BD", "AC⊥CE", "C midpoint of BD"]
          visual_requirements:
            required_visible_annotations:
              markers:
                - {type: right_angle, vertex: B, arms: [A, D]}
                - {type: right_angle, vertex: C, arms: [A, E]}
                - {type: right_angle, vertex: D, arms: [B, E]}
                - {type: equal_ticks, segments: [[B, C], [C, D]]}

  - id: "problem"
    title: "三、解答题"
    type: "practice"
    visibility: "student"
    blocks:
      - type: "problem"
        id: "p1"
        points: 10
        label: "第 7 题"
        stem_latex: |
          如图，$AB\\perp BC$，$CD\\perp BC$，$AC\\perp BD$（两条斜线交叉且垂直）。已知 $AB=3$，$CD=12$。
          \begin{enumerate}[label=(\arabic*)]
            \item 求 $BC$ 的长；
            \item 求 $AC$ 的长。
          \end{enumerate}
        hints:
          - content: "这是三垂直的「压缩交叉模型」：公共直角边 $BC$ 是 $AB$ 与 $CD$ 的比例中项。"
        answer_space:
          type: "steps"
          height: "55mm"
          step_count: 4
        diagram_slot:
          slot_id: "p1.prompt"
          diagram_ref: "p1.prompt"
          variant: "prompt"
          disclosure_policy: "clean"
          required: true
          on_failure: "fail_assignment"
          placement: "diagram_col"
          layout_role: "question_sidecar"
          display_profile: "worksheet_geometry_sidecar"
          caption: "压缩交叉模型：$AC\\perp BD$。"
          diagram_kind: "synthetic_geometry"
          teaching_intent: "practice_prompt"
          semantic_constraints:
            given_objects: ["A", "B", "C", "D"]
            given_constraints: ["B,C base line", "AB⊥BC", "CD⊥BC", "AC⊥BD"]
          visual_requirements:
            required_visible_annotations:
              markers:
                - {type: right_angle, vertex: B, arms: [A, C]}
                - {type: right_angle, vertex: C, arms: [B, D]}
      - type: "problem"
        id: "p2"
        points: 10
        label: "第 8 题"
        stem_latex: |
          如图，在正方形 $ABCD$ 中，$E$ 是 $BC$ 的中点，过 $E$ 作 $EF\\perp AE$ 交 $CD$ 于 $F$。若正方形边长为 $4$，求 $DF$ 的长。
        hints:
          - content: "正方形给了 $\\angle B=\\angle C=90^\\circ$，$EF\\perp AE$ 给了第三个直角——这是三垂直相似。"
        answer_space:
          type: "steps"
          height: "55mm"
          step_count: 4
        diagram_slot:
          slot_id: "p2.prompt"
          diagram_ref: "p2.prompt"
          variant: "prompt"
          disclosure_policy: "clean"
          required: true
          on_failure: "fail_assignment"
          placement: "diagram_col"
          layout_role: "question_sidecar"
          display_profile: "worksheet_geometry_sidecar"
          caption: "正方形 $ABCD$，$E$ 为 $BC$ 中点，$EF\\perp AE$。"
          diagram_kind: "synthetic_geometry"
          teaching_intent: "practice_prompt"
          semantic_constraints:
            given_objects: ["A", "B", "C", "D", "E", "F"]
            given_constraints: ["ABCD square", "E on BC", "BE=EC", "F on CD", "EF⊥AE"]
          visual_requirements:
            required_visible_annotations:
              markers:
                - {type: right_angle, vertex: A, arms: [B, D]}
                - {type: right_angle, vertex: B, arms: [A, C]}
                - {type: right_angle, vertex: C, arms: [B, D]}
                - {type: right_angle, vertex: D, arms: [A, C]}
                # 题干要求：EF⊥AE → E 处直角
                - {type: right_angle, vertex: E, arms: [A, F]}
                - {type: equal_ticks, segments: [[A, B], [B, C], [C, D], [D, A]]}
                - {type: equal_ticks, segments: [[B, E], [E, C]]}
      - type: "problem"
        id: "p3"
        points: 10
        label: "第 9 题"
        stem_latex: |
          如图（母图），$AB=DE$，$BC=4$，$CD=9$。
          \begin{enumerate}[label=(\arabic*)]
            \item 求 $AB$ 的长；
            \item 求 $AC$ 的长。
          \end{enumerate}
        hints:
          - content: "先由 $AB=DE$ 解出 $AB$（平方根型），再用勾股求斜边 $AC$。"
        answer_space:
          type: "steps"
          height: "55mm"
          step_count: 4
        diagram_slot:
          <<: *slot_mother
          slot_id: "p3.prompt"
          diagram_ref: "p3.prompt"
          caption: "$AB=DE$，求斜边 $AC$。"
          semantic_constraints:
            given_objects: ["A", "B", "C", "D", "E"]
            given_constraints: ["B,C,D collinear", "AB⊥BD", "DE⊥BD", "AC⊥CE", "AB=DE"]
          visual_requirements:
            required_visible_annotations:
              markers:
                - {type: right_angle, vertex: B, arms: [A, D]}
                - {type: right_angle, vertex: C, arms: [A, E]}
                - {type: right_angle, vertex: D, arms: [B, E]}
                - {type: equal_ticks, segments: [[A, B], [D, E]]}
      - type: "problem"
        id: "p4"
        points: 10
        label: "第 10 题"
        stem_latex: |
          如图（母图），$\\tan\\angle BAC=\\dfrac12$，$BC=3$，$CD=4$，求 $DE$ 的长。
        hints:
          - content: "先把 $\\tan\\angle BAC$ 翻译成 $AB$ 与 $BC$ 的边比，再用母公式。"
        answer_space:
          type: "steps"
          height: "50mm"
          step_count: 3
        diagram_slot:
          <<: *slot_mother
          slot_id: "p4.prompt"
          diagram_ref: "p4.prompt"
          caption: "给 $\\tan\\angle BAC$，求 $DE$。"
          semantic_constraints:
            given_objects: ["A", "B", "C", "D", "E"]
            given_constraints: ["B,C,D collinear", "AB⊥BD", "DE⊥BD", "AC⊥CE"]
      - type: "problem"
        id: "p5"
        points: 12
        label: "第 11 题"
        stem_latex: |
          如图（母图），已知 $\\triangle ABC$ 的面积为 $6$，$\\triangle CDE$ 的面积为 $24$，且 $BC=3$，$CD=8$。
          \begin{enumerate}[label=(\arabic*)]
            \item 求 $AB$ 与 $DE$ 的长；
            \item 求 $\\triangle ABC$ 与 $\\triangle CDE$ 的相似比，并说明它与面积比的关系。
          \end{enumerate}
        hints:
          - content: "直角三角形面积 $=\\dfrac12\\times$两直角边之积；面积比等于相似比的平方。"
        answer_space:
          type: "steps"
          height: "65mm"
          step_count: 5
        diagram_slot:
          <<: *slot_mother
          slot_id: "p5.prompt"
          diagram_ref: "p5.prompt"
          caption: "比例藏在面积里。"
          semantic_constraints:
            given_objects: ["A", "B", "C", "D", "E"]
            given_constraints: ["B,C,D collinear", "AB⊥BD", "DE⊥BD", "AC⊥CE"]
      - type: "problem"
        id: "p6"
        points: 12
        label: "第 12 题"
        stem_latex: |
          如图（母图），$AB=4$，$DE=9$，且 $BD=BC+CD=13$，求 $BC$ 与 $CD$ 的长。
        hints:
          - content: "母公式给 $BC\\cdot CD$，$BD$ 给 $BC+CD$；知「积」与「和」，想到什么？"
        answer_space:
          type: "steps"
          height: "60mm"
          step_count: 4
        diagram_slot:
          <<: *slot_mother
          slot_id: "p6.prompt"
          diagram_ref: "p6.prompt"
          caption: "知「积」与「和」，两解讨论。"
          semantic_constraints:
            given_objects: ["A", "B", "C", "D", "E"]
            given_constraints: ["B,C,D collinear", "AB⊥BD", "DE⊥BD", "AC⊥CE"]
      - type: "problem"
        id: "p7"
        points: 12
        label: "第 13 题"
        stem_latex: |
          如图，在平面直角坐标系中，$A(0,3)$，$B(0,0)$，$C(4,0)$，$D(7,0)$，$AC\\perp CE$，且点 $E$ 在过 $D$ 且垂直于 $x$ 轴的直线上。求点 $E$ 的坐标。
        hints:
          - content: "把坐标翻成四条直角边 $a=AB,b=BC,c=CD$，再套母公式求 $d=DE$。"
        answer_space:
          type: "steps"
          height: "55mm"
          step_count: 4
        diagram_slot:
          slot_id: "p7.prompt"
          diagram_ref: "p7.prompt"
          variant: "prompt"
          disclosure_policy: "clean"
          required: true
          on_failure: "fail_assignment"
          placement: "diagram_col"
          layout_role: "question_sidecar"
          display_profile: "worksheet_geometry_sidecar"
          caption: "三垂直迁移到坐标系。"
          diagram_kind: "coordinate_geometry"
          teaching_intent: "practice_prompt"
          analytic_requirements:
            coordinate_ir:
              viewport:
                x_min: -2
                x_max: 9
                y_min: -1
                y_max: 6
                preserve_aspect: true
              axes:
                x: true
                y: true
                grid: false
                show_ticks: true
                x_label: "x"
                y_label: "y"
              objects:
                - {type: point, id: A, x: 0, y: 3, label: "A"}
                - {type: point, id: B, x: 0, y: 0, label: "B"}
                - {type: point, id: C, x: 4, y: 0, label: "C"}
                - {type: point, id: D, x: 7, y: 0, label: "D"}
                - {type: point, id: E, x: 7, y: 4, label: "E"}
