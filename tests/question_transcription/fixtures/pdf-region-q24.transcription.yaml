        content:
          stem_latex: >-
            如图，在平面直角坐标系$xOy$中，已知抛物线$y=ax^2+bx+c$经过点$A$、$B$、$C$，
            其中$A(-1,0)$、$B(3,0)$、$C(0,3)$。求这条抛物线的表达式。
          answer: $y=-x^2+2x+3$
          clue: 用待定系数法，由两根式设$y=a(x+1)(x-3)$再代入$C(0,3)$。
          solution_steps:
            - 设$y=a(x+1)(x-3)$，其中$a\neq 0$。
            - 代入$C(0,3)$得$3=a\cdot 1\cdot(-3)$，故$a=-1$。
            - 所以$y=-(x+1)(x-3)=-x^2+2x+3$。
          solution_notes: []
