      - question_ref: "18"
        question_number: 18
        question_type: short_answer
        points: 4
        content:
          stem_latex: >-
            如图，在$\triangle ABC$中，$\angle C=90^\circ$，$AC=6$，$BC=4$，以$A$为圆心、$2$为半径作圆，
            点$D$是圆$A$上一点，联结$CD$，点$E$是$CD$的中点，联结$BE$，那么$BE$长度的取值范围是
            $\underline{\quad\quad}$。
          answer: $4\leqslant BE\leqslant 6$
          clue: 取$AC$的中点$F$并使用三角形中位线，再由勾股定理求出$BF$。
          solution_steps:
            - 取$AC$的中点$F$，连接$EF$。
            - 因为$E,F$分别为$DC,AC$的中点，所以$EF$为$\triangle ADC$的中位线。
            - 因此$EF=\dfrac12 AD=1$。
            - 点$E$在以$F$为圆心、$1$为半径的圆上运动。
            - 由勾股定理得$BF=\sqrt{BC^2+CF^2}=\sqrt{4^2+3^2}=5$。
            - 所以$4\leqslant BE\leqslant 6$。
          solution_notes: []
