  - type: problem
    id: Q020
    points: 10
    stem_latex: 解不等式组：$\begin{cases}3x-1\leqslant x-5\\\dfrac{x+5}{3}>\dfrac{x}{2}+1\end{cases}$．
    answer: $-2\leqslant x<4$
    solution_steps:
    - title: 解第一个不等式
      content: $3x-1\leqslant x-5$，$2x\leqslant -4$，$x\leqslant -2$
    - title: 解第二个不等式
      content: $\dfrac{x+5}{3}>\dfrac{x}{2}+1$，$2(x+5)>3x+6$，$2x+10>3x+6$，$x<4$
    - title: 取交集
      content: 不等式组的解集为$-2\leqslant x<4$。
    clue: 分别解两个不等式，取公共部分。
