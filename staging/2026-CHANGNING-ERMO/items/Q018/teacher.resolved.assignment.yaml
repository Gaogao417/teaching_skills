  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 如图，在$\triangle ABC$中，$\angle ACB=90°$，$BC<AC$．将$\triangle ABC$绕着点$C$旋转，点$A$、$B$的对应点分别是点$D$、$E$，如果点$A$恰好在直线$DE$上，且$CE\parallel AB$，那么$\dfrac{AE}{AD}$的值为\underline{\hspace{2cm}}．
    answer: $\dfrac{1}{3}$
    solution_steps:
    - title: 旋转性质
      content: 由旋转得$\angle D=\angle BAC$，$AC=CD$，$\angle ECD=\angle ACB=90°$，$AB=DE$。
    - title: 角度关系
      content: 由$\angle D=\angle CAD$，$CE\parallel AB$得$\angle ACE=\angle BAC$，故$\angle CAE=\angle ACE=\angle D$。
    - title: 内角和
      content: 在$\triangle ACD$中，$\angle CAE+\angle ACE+90°+\angle D=180°$，$3\angle CAE=90°$，$\angle CAE=30°$。
    - title: 求比值
      content: $AB=2BC$，$DE=2AE$，即$AD=3AE$，$\dfrac{AE}{AD}=\dfrac{1}{3}$。
    clue: 利用旋转性质、平行线性质和等腰三角形性质求角，再用内角和定理。
