  blocks:
  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 已知正八边形的中心是点$O$，连接$OA$，$OB$，$OC$，点$G$是$\triangle OAB$的重心，如果$OA=2$，那么线段$CG$的长等于\underline{\hspace{2cm}}．
    answer: $\sqrt{2+\sqrt{2}}$
    solution_steps:
    - title: 确定位置关系
      content: 正八边形所有顶点在以$O$为圆心的圆上，中心角$45°$。
    - title: 计算关键长度
      content: $OA=OB=2$，$\triangle OAB$为等腰三角形，$AB=2\sqrt{2-\sqrt{2}}$。
    - title: 求重心位置
      content: $G$为$\triangle OAB$重心，$OG=\dfrac{2}{3}\times$高。利用余弦定理求$OC$与$OG$的关系，最终$CG=\sqrt{2+\sqrt{2}}$。
    clue: 利用正八边形性质确定顶点共圆，结合重心性质和勾股定理计算。
