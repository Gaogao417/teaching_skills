  - type: short_answer
    id: Q008
    points: 4
    stem_latex: 请写出使代数式$\dfrac{\sqrt{a}}{a-1}$有意义的$a$的一个值为：\underline{\hspace{2cm}}．
    answer: $2$（答案不唯一）
    solution_steps:
    - title: 确定定义域
      content: 由题意得，$a\geqslant 0$且$a-1\neq 0$，解得$a\geqslant 0$且$a\neq 1$，故取$a=2$。
    clue: 二次根式要求$a\geqslant 0$，分母要求$a-1\neq 0$，在取值范围内任取一值。
