  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 方程组$\begin{cases}x+2y=3\\x^2-4y^2+9=0\end{cases}$的解是\underline{\hspace{2cm}}．
    answer: $\begin{cases}x=0\\y=\dfrac{3}{2}\end{cases}$
    solution_steps:
    - title: 因式分解
      content: 将$x^2-4y^2+9=0$化为$(x+2y)(x-2y)+9=0$
    - title: 代入求解
      content: 由$x+2y=3$得$x-2y=-3$，联立$\begin{cases}x+2y=3\\x-2y=-3\end{cases}$，解得$x=0$，$y=\dfrac{3}{2}$。
    clue: 利用平方差公式因式分解第二个方程，结合第一个方程求解。
