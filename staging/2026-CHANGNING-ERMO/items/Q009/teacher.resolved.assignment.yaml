  - type: short_answer
    id: Q009
    points: 4
    stem_latex: 方程$\dfrac{x}{x-3}+1=\dfrac{7}{x-3}$的解是\underline{\hspace{2cm}}．
    answer: $x=5$
    solution_steps:
    - title: 去分母
      content: $x+(x-3)=7$
    - title: 化简求解
      content: $2x-3=7$，$2x=10$，解得$x=5$
    - title: 检验
      content: 当$x=5$时，$x-3=2\neq 0$，$x=5$是原分式方程的解。
    clue: 分式方程去分母转化为一元一次方程，求解后检验。
