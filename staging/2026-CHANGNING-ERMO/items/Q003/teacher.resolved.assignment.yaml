  - type: choice
    id: Q003
    points: 4
    stem_latex: 已知$\odot O$及其所在平面内的直线$l$，$P$为直线$l$上的一点，如果$\odot O$半径为$3$，且$PO=3$，那么下列对直线$l$的表述不正确的是（\quad）
    choices:
    - 直线$l$可能经过圆心$O$
    - 直线$l$可能与$\odot O$相交
    - 直线$l$可能与$\odot O$相切
    - 直线$l$可能与$\odot O$相离
    answer: D
    clue: 设圆心到直线距离为$d$，由垂线段最短得$d \leqslant PO = 3 = r$，而相离要求$d>r$。
