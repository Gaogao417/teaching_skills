  - type: problem
    id: Q019
    points: 10
    stem_latex: 计算：$\sqrt{12}+\left(\dfrac{1}{2}\right)^{-2}-|2-\sqrt{3}|-6\cot60°$．
    answer: $2+\sqrt{3}$
    solution_steps:
    - title: 分别化简
      content: $\sqrt{12}=2\sqrt{3}$，$\left(\dfrac{1}{2}\right)^{-2}=4$，$|2-\sqrt{3}|=2-\sqrt{3}$，$\cot60°=\dfrac{\sqrt{3}}{3}$
    - title: 合并
      content: $2\sqrt{3}+4-(2-\sqrt{3})-6\times\dfrac{\sqrt{3}}{3}=2\sqrt{3}+4-2+\sqrt{3}-2\sqrt{3}=2+\sqrt{3}$
    clue: 先分别计算二次根式、负整数指数幂、绝对值和三角函数值，再合并。
