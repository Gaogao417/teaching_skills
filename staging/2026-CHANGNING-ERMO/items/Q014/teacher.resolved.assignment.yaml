  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 已知点$A(-3,m)$在反比例函数$y=\dfrac{k}{x}$的图像上，那么在每个象限内，该函数的值$y$随$x$的值增大而\underline{\hspace{2cm}}．（填"增大"或"减小"）
    answer: 增大
    solution_steps:
    - title: 确定$k$的符号
      content: 点$A(-3,m)$在图像上，$k=-3m$。由$k>0$（点在第二象限）知$m<0$，$k>0$。
    - title: 判断增减性
      content: 当$k>0$时，在每个象限内$y$随$x$的增大而增大。
    clue: 由点的坐标确定$k$的符号，再根据反比例函数性质判断增减性。
