            - title: 计算概率
              content: '五个数中只有$5$满足条件，概率为$\dfrac{1}{5}$。但注意$a=3,b=4$，$c$为斜边时$c=5$在集合中，$c$为直角边且$b$为斜边时$c=\sqrt{7}$不在集合中。实际上$c=5$时$(3,4,5)$是直角三角形，$c=\dfrac{10}{3}$时$(3,4,\dfrac{10}{3})$也可构成直角三角形（$\dfrac{10}{3}$为斜边，$\sqrt{9+16}=5\neq \dfrac{10}{3}$，需验证），最终满足条件的有$5$和$\dfrac{10}{3}$，概率为$\dfrac{2}{5}$。'
          clue: 分$c$为斜边和$c$为直角边两种情况，利用勾股定理逐一验证五个数。
