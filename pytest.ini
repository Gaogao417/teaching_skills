[pytest]
# Review-server 性能重构（docs/review-server-performance-redesign.md §11 阶段 0）
# 的测试基线配置。当前所有测试在 tests/ 下，依赖 sys.path.insert 指向 skills scripts，
# 因此无需额外 pythonpath；固定 testpaths 让 `./.venv/bin/python -m pytest` 行为稳定。
testpaths = tests
addopts = -q
markers =
    # question-ingestion LangGraph workflow: live provider/canary tests that call
    # real model APIs (qwen-vl-ocr / MiMo / GLM-5.2 via OpenCode or direct API).
    # Skipped by default to keep the offline suite network-free; enable with
    # `pytest -m live` after loading shell env (source ~/.zshrc) and confirming keys.
    live: question-ingestion workflow tests that call real model provider APIs
filterwarnings =
    # starlette/httpx 弃用噪声与本仓库测试无关，压到 summary 不刷屏。
    ignore::DeprecationWarning:fastapi.testclient
