      = \\frac{BC}{AC}$，∴$\\frac{2\\sqrt{3x}}{y} = \\frac{6}{\\sqrt{-x^2 + 12x + 36}}$，∴$6y = 2\\sqrt{3x} \\cdot \\sqrt{-x^2 + 12x + 36}$，整理得：$y = \\frac{\\sqrt{3x^3 + 36x^2 + 108x}}{3}$；","②以线段$BD$、$AE$为边的正多边形是双同正多边形，理由如下：由①过程得：$\\angle BCD = \\angle ACE$，$AC = EC$，$AB = DG$。∵$BC = CD = 6$，$\\angle BCF$是一个正多边形的中心角，将梯形$ABCD$绕点$C$按顺时针方向旋转，使点$B$与点$D$重合，此时点$A$、$D$的对应点分别是点$E$、$F$，∴$\\angle BCD = \\angle DCF$，∴$\\angle BCD$也是一个正多边形的中心角，∴以线段$BD$、$AE$为边，以点$C$为中心的两个正多边形的中心角也相等，即这两个正多边形是双同正多边形。∵这两个正多边形也是相似多边形，当这两个正多边形的面积比是$4:5$时，∴$\\frac{BC}{AC} = \\sqrt{\\frac{4}{5}} = \\frac{2\\sqrt{5}}{5}$，∴$AC = BC \\cdot \\frac{5}{2\\sqrt{5}} = 6 \\cdot \\frac{\\sqrt{5}}{2} = 3\\sqrt{5}$，∴$AB = DG = \\sqrt{AC^2 - BC^2} = \\sqrt{(3\\sqrt{5})^2 - 6^2} = 3$，∴$\\sin \\angle BCD = \\frac{DG}{CD} = \\frac{3}{6} = \\frac{1}{2}$，∴$\\angle BCD = 30^\\circ$，∴这两个正多边形的中心角$= 30^\\circ$，∴这两个正多边形的边数$= \\frac{360^\\circ}{30^\\circ} = 12$，∴当这两个正多边形的面积比是$4:5$时，双同正多边形的边数为$12$。"]'
