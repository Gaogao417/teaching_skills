      AC^2} = \\sqrt{36 - AC^2}$，","∵$AB = DE$，$DE = CD - CE = 6 - AC$，","∴$\\sqrt{36 - AC^2} = 6 - AC$，","解得：$AC = 3$（$AC = 0$舍去），","∴$AE = 3\\sqrt{2}$，","∵$AD = x$，$AE = y$，","∴$y = \\dfrac{\\sqrt{-3x^3 + 36x^2 + 108x}}{3}$；","②理由：由①过程得：$AC = CE$，$AC \\perp BC$，$AC = 3$，","∵$\\angle BCF$是一个正多边形的中心角，将梯形$ABCD$绕点$C$按顺时针方向旋转，使点$B$与点$D$重合，此时点$A$、$D$的对应点分别是点$E$、$F$，","∴$\\angle BCF = \\angle BCD = 60^\\circ$，","∴$\\angle BCF$也是一个正多边形的中心角，","∴以线段$BD$、$AE$为边，以点$C$为的中心的两个正多边形的中心角也相等，即这两个正多边形是双同正多边形，","∴这两个正多边形也是相似多边形，","∵当这两个正多边形的面积比是$4:5$时，","∴$\\dfrac{S_{\\text{以}BD\\text{为边的正多边形}}}{S_{\\text{以}AE\\text{为边的正多边形}}} = \\dfrac{4}{5}$，","∴$\\dfrac{BD^2}{AE^2} = \\dfrac{4}{5}$，","∴$\\dfrac{BD}{AE} = \\dfrac{2}{\\sqrt{5}}$，","∴$BD = \\dfrac{2}{\\sqrt{5}} AE = \\dfrac{2}{\\sqrt{5}} \\cdot 3\\sqrt{2} = \\dfrac{6\\sqrt{10}}{5}$，","∴这两个正多边形的中心角$\\theta$满足$\\cos \\theta = \\dfrac{\\dfrac{BD}{2}}{BC} = \\dfrac{3\\sqrt{10}}{30} = \\dfrac{\\sqrt{10}}{10}$，","∴$\\theta = 72^\\circ$，","∴这两个正多边形的边数$n = \\dfrac{360^\\circ}{\\theta}
