  - type: choice
    id: Q005
    points: 4
    stem_latex: 已知 $\triangle ABC$ 中，$AH$ 为 $BC$ 边上的高，在添加下列条件中的一个后，仍不能判断 $\triangle ABC$ 是等腰三角形的是(    )
    choices:
    - $BH = HC$
    - $\angle BAH = \angle CAH$
    - $\angle B = \angle HAC$
    - $S_{\triangle ABH} = S_{\triangle AHC}$
    answer: C
    clue: 原卷未提供提示
    solution_steps:
    - A、$\because AH \perp BC$，$BH = CH$，$\therefore AH$ 是 $BC$ 的垂直平分线，$\therefore AB = AC$，$\therefore \triangle ABC$ 是等腰三角形，故A不符合题意；
    - B、$\because \angle BAH = \angle CAH$，$AH = AH$，$\angle AHB = \angle AHC = 90^\circ$，$\therefore \triangle ABH \cong \triangle ACH$ (ASA)，$\therefore AB = AC$，$\therefore \triangle ABC$ 是等腰三角形，故B不符合题意；
    - C、$\angle B = \angle HAC$ 无法判断 $\triangle ABC$ 是等腰三角形，故C符合题意；
    - D、$\because S_{\triangle ABH} = S_{\triangle AHC}$，$AH$ 是边 $BC$ 上的高，$\therefore BH = HC$，$\therefore AH$ 是 $BC$ 的垂直平分线，$\therefore \triangle ABC$ 是等腰三角形，故D不符合题意；
