  - type: problem
    id: Q023
    points: 0
    stem_latex: '已知：如图，四边形 $ABCD$ 中，$AB // CD$，点 $E$ 在边 $AD$ 上，$CE$ 与 $BA$ 的延长线交于点 $F$，$\frac{FA}{AB} = \frac{AE}{ED}$．

      （1）求证：四边形 $ABCD$ 为平行四边形；

      （2）联结 $FD$，分别延长 $FD$、$BC$ 交于点 $G$，如果 $FC^2 = FD \cdot FG$，求证：$AD \cdot CG = BF \cdot CD$．'
    answer: '（1）见解析

      （2）见解析'
    clue: 原卷未提供提示
    solution_steps:
    - 证明：$\because AB \parallel CD$，
    - $\therefore \angle CFE = \angle FBA$，
    - $\therefore \angle BFE = \angle FBA$，
    - $\because \angle CFE = \angle BFE$，
    - $\therefore \angle CFE = \angle FBA$，
    - $\therefore AB = CD$，
    - $\therefore$ 四边形$ABCD$是平行四边形；
    - 【小问 2 详解】
    - 证明：如图所示，
    - $\because FC^2 = FD \cdot FG$，
    - 即$\frac{FC}{FD} = \frac{FG}{FC}$，
    - 又$\because \angle CFD = \angle GFC$，
    - $\therefore \triangle CFD \sim \triangle GFC$，
    - $\therefore \angle FCD = \angle FGC$，$\frac{CG}{CD} = \frac{GF}{CF}$，
    - $\because AB \parallel CD$，
    - $\therefore \angle BFC = \angle FCD$，
    - $\therefore \angle BFC = \angle FGC$，
    - 又$\because \angle FBC = \angle GBF$，
    - $\therefore \triangle FBC \sim \triangle GBF$，
    - $\therefore \frac{BC}{BF} = \frac{FC}{FG}$，
    - $\therefore \frac{CG}{CD} = \frac{BF}{BC}$，
    - 又$\because AD = BC$，
    - $\therefore \frac{CG}{CD} = \frac{BF}{AD}$，
    - 即$AD \cdot CG = BF \cdot CD$。
