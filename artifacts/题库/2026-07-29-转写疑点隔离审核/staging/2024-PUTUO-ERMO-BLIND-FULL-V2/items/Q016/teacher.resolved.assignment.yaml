  - type: fillin
    id: Q016
    points: 4
    stem_latex: 如图，梯形$ABCD$中，$AD \parallel BC$，过点$A$作$AE \parallel DC$分别交$BD$、$BC$于点$F$、$E$，$\frac{BE}{BC}=\frac{2}{3}$，设$\overrightarrow{AD}=\vec{a}$，$\overrightarrow{AB}=\vec{b}$，那么向量$\overrightarrow{FE}$用向量$\vec{a}$、$\vec{b}$表示为______。
    answer: \frac{4}{3}\vec{a} + \frac{2}{3}\vec{b}
    clue: 原卷未提供提示
    solution_steps:
    - 因为$AD \parallel BC$，$AE \parallel DC$，所以四边形$AECD$是平行四边形。
    - 所以$EC = AD$。
    - 因为$\frac{BE}{BC}=\frac{2}{3}$，所以$\frac{BE}{EC} = \frac{BE}{AD} = \frac{2}{1}$。
    - 因为$AD \parallel BC$，所以$\triangle FAD \sim \triangle FEB$。
    - 所以$\frac{BF}{DF} = \frac{BE}{AD} = 2$，则$BF = \frac{2}{3} BD$，$BE = 2AD$。
    - 因为$\overrightarrow{AD}=\vec{a}$，$\overrightarrow{AB}=\vec{b}$，所以$\overrightarrow{BF} = \frac{2}{3} \overrightarrow{BD} = \frac{2}{3} (\overrightarrow{BA} + \overrightarrow{AD}) = \frac{2}{3} (-\vec{b} + \vec{a})$，$\overrightarrow{BE} = 2\vec{a}$。
    - 所以$\overrightarrow{FE} = \overrightarrow{BE} - \overrightarrow{BF} = 2\vec{a} - \frac{2}{3} (-\vec{b} + \vec{a}) = \frac{4}{3}\vec{a} + \frac{2}{3}\vec{b}$。
