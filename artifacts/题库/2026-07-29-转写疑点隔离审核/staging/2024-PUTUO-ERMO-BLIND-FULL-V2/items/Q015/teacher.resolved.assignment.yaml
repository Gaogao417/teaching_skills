  - type: fillin
    id: Q015
    points: 4
    stem_latex: 学校为了解本校九年级学生阅读课外书籍的情况，对九年级全体学生进行“最喜欢阅读的课外书籍类型”的问卷调查（每人只选一个类型），如图是收集数据后绘制的扇形图．如果喜欢阅读漫画类书籍所在扇形的圆心角是$72^\circ$，喜欢阅读小说类书籍的学生有72人，那么该校九年级喜欢阅读科技类书籍的学生有______人。
    answer: '27'
    clue: 原卷未提供提示
    solution_steps:
    - 喜欢阅读漫画类书籍的百分比为：$72^\circ \div 360^\circ = 20\%$。
    - 喜欢阅读科技类书籍的学生的百分比为：$1 - 40\% - 20\% - 15\% - 10\% = 15\%$。
    - 被调查的总人数为：$72 \div 40\% = 180$（人）。
    - 所以，喜欢阅读科技类书籍的学生数为：$180 \times 15\% = 27$（人）。
    source_solution_images: []
