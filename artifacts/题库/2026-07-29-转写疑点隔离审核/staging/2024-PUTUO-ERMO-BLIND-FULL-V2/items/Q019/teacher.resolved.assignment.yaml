    stem_latex: 计算：$-2^2 + 8^{\frac{1}{2}} + \left(\frac{1}{4}\right)^{-2} - \frac{2}{2-\sqrt{2}}$．
    answer: $10 + \sqrt{2}$
    clue: 原卷未提供提示
    solution_steps:
    - $-2^{2} + 8^{\frac{1}{2}} + \left(\frac{1}{4}\right)^{-2} - \frac{2}{2-\sqrt{2}}$
    - $=-4 + 2\sqrt{2} + 16 - \frac{2(2+\sqrt{2})}{(2-\sqrt{2})(2+\sqrt{2})}$
    - $=-4 + 2\sqrt{2} + 16 - (2+\sqrt{2})$
    - $=10 + \sqrt{2}$
