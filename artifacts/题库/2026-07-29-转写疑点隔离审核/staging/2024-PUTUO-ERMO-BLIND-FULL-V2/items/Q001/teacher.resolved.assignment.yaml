  - type: choice
    id: Q001
    points: 4
    stem_latex: 下列二次根式中，与$\sqrt{3a}$是同类二次根式的是（    ）
    choices:
    - $\sqrt{\dfrac{a}{9}}$
    - $\sqrt{9a}$
    - $\sqrt{3a}$
    - $\sqrt{12a}$
    answer: D
    clue: 原卷未提供提示
    solution_steps:
    - A. $\sqrt{\dfrac{a}{9}}=\dfrac{\sqrt{a}}{3}$ 与 $\sqrt{3a}$ 不是同类二次根式，故A错误，不符合题意；
    - B. $\sqrt{9a}=3\sqrt{a}$ 与 $\sqrt{3a}$ 不是同类二次根式，故B错误，不符合题意；
    - C. $\sqrt{3a}$，与 $\sqrt{3a}$ 不是同类二次根式，故C错误，不符合题意；
    - D. $\sqrt{12a}=2\sqrt{3a}$ 与 $\sqrt{3a}$ 是同类二次根式，故D正确，符合题意；
    - 故选：D．
