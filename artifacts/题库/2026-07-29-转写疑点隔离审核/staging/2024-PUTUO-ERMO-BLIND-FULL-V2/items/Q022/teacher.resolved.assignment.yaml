  - type: problem
    id: Q022
    points: 0
    stem_latex: 甲外卖平台的外卖员小张看到乙外卖平台外卖员小王的月工资收入比自己高，于是想跳槽去乙外卖平台工作，如果不考虑其他因素，仅根据以下信息，请你帮助小张来决策是否需要跳槽到乙外卖平台，并说明理由。
    answer: 不需要跳槽
    clue: 原卷未提供提示
    solution_steps:
    - 小张在甲外卖平台日均送单数为 $\frac{2 \times 54 + 2 \times 58 + 60 \times 6 + 62 \times 3 + 65 \times 2}{2 + 2 + 6 + 3 + 2} = 60$ 单
    - 小张月违规送单数平均数为：$\frac{9 \times 2 + 10 \times 1 + 11 \times 1 + 12 \times 3 + 13 \times 2 + 14 \times 2 + 15 \times 1}{2 + 1 + 1 + 3 + 2 + 2 + 1} = 12$ 单
    - 根据信息二：设送单天数为 $x$ 天，$(50 + 6 \times 61)x - 32 \times 10 = 8832$
    - 解得：$x = 22$
    - 小张在甲外卖平台的工资为 $(70 + 5.5 \times 60) \times 22 - 10 \times 12 = 8680$（元）
    - 若小张在乙外卖平台工资为 $(50 + 6 \times 60) \times 22 - 32 \times 12 = 8636$（元）
    - 因为 $8680 > 8636$，所以不需要跳槽
