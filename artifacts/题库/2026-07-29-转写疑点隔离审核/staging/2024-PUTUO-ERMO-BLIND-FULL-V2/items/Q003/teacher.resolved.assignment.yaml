  - type: choice
    id: Q003
    points: 4
    stem_latex: 下列方程中，有两个不相等的实数根的是（    ）
    choices:
    - $x^2 = 0$
    - $x^2 - 1 = 0$
    - $x^2 - 2x + 2 = 0$
    - $x^2 - 2x + 1 = 0$
    answer: B
    clue: 原卷未提供提示
    solution_steps:
    - A. $\because \Delta = 0^2 - 4 \times 1 \times 0 = 0$，$\therefore$ 方程有两个相等的实数根，不合题意；
    - B. $\because \Delta = 0^2 - 4 \times 1 \times (-1) = 4 > 0$，$\therefore$ 方程有两个不相等的实数根，符合题意；
    - C. $\because \Delta = (-2)^2 - 4 \times 1 \times 2 = -4 < 0$，$\therefore$ 方程没有实数根，不合题意；
    - D. $\because \Delta = (-2)^2 - 4 \times 1 \times 1 = 0$，$\therefore$ 方程有两个相等的实数根，不合题意．
    - 故选：B．
