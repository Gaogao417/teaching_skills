    id: Q013
    points: 0
    stem_latex: 已知直线 $y = 2x + 4$ 与直线 $y = 1$ 相交于点 $A$，那么点 $A$ 的横坐标是______。
    answer: -\frac{3}{2}
    clue: 原卷未提供提示
    solution_steps:
    - 将 $y = 1$ 代入 $y = 2x + 4$ 得：$1 = 2x + 4$。
    - 解得 $x = -\frac{3}{2}$。
    - 点 $A$ 的横坐标是 $-\frac{3}{2}$。
