  - type: fillin
    id: Q014
    points: 4
    stem_latex: 在直角坐标平面内，将点$A(x,y)$先向右平移4个单位，再向上平移6个单位得到点$B$，如果点$A$和点$B$恰好关于原点对称，那么点$B$的坐标是______。
    answer: (2,3)
    clue: 原卷未提供提示
    solution_steps:
    - 设 $A(x, y)$，则 $B(x+4, y+6)$。
    - 因为 $A$、$B$ 关于原点对称，所以 $x + x + 4 = 0$，$y + y + 6 = 0$。
    - 解得 $x = -2$，$y = -3$。
    - 所以 $A(-2, -3)$，$B(2, 3)$。
    source_solution_images: []
