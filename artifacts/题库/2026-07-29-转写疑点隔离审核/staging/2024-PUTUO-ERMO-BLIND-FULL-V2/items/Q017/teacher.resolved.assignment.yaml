    id: Q017
    points: 4
    stem_latex: 已知正方形 $ABCD$ 的边长为 $4$，点 $E$、$F$ 在直线 $BC$ 上（点 $E$ 在点 $F$ 的左侧），$\angle EAF = 45^\circ$，如果 $BE = 1$，那么 $CF$ 的长是______。
    answer: $\frac{8}{5}$ 或 $\frac{8}{3}$
    clue: 原卷未提供提示
    solution_steps:
    - 【分析】本题考查了正方形的性质，全等三角形的性质与判定，勾股定理的应用；先证明 $\triangle AEB \cong \triangle AGD(SAS)$，进而证明 $\triangle EAF \cong \triangle GAF(SAS)$。设 $CF = x$，分两种情况讨论，在 $Rt\triangle FGC$ 中根据勾股定理即可求解。
    - 【详解】解：如图所示，当 $E$ 在 $B$ 点的左侧时，
    - 取 $DG = EB = 1$，连接 $AG, GF$，
    - ∵ 四边形 $ABCD$ 是正方形，
    - $\therefore AB = AD, \angle D = \angle ABC = \angle ABE = 90^\circ$，
    - $\therefore \triangle AEB \cong \triangle AGD(SAS)$，
    - $\therefore AG = AE, \angle DAG = \angle BAE$
    - $\because \angle EAF = 45^\circ$，
    - $\therefore \angle GAF = 90^\circ - \angle DAG - \angle BAF = 90^\circ - \angle BAE - \angle BAF = 90^\circ - \angle EAF = 45^\circ$
    - $\therefore \angle BAF = \angle EAF$，
    - 在 $\triangle EAF, \triangle GAF$ 中，
    - $\begin{cases} AE = AG \\ \angle EAF = \angle GAF \\ AF = AF \end{cases}$
    - $\therefore \triangle EAF \cong \triangle GAF(SAS)$
    - $\therefore EF = FG$，
    - 设 $CF = x$，则 $BF = BC - FC = 4 - x$，
    - $\therefore FG = EF = BE + FB = 5 - x$，
    - 在 $Rt\triangle FGC$ 中，$CG = CD - DG = 4 - 1 = 3$
    - $\therefore GF^2 = CG^2 + FC^2$
    - 即 $(5 - x)^2 = 3^2 + x^2$
    - 解得：$x = \frac{8}{5}$；
    - 当 $E$ 在 $B$ 点的右侧时，如图所示
    - 同理可得 $\triangle EAF \cong \triangle GAF(SAS)$，则 $EF = GF = 3 + x$，$CG = 4 + 1 = 5$，
    - 在 $Rt\triangle FGC$ 中，$GF^2 = CG^2 + FC^2$
    - 即 $(3 + x)^2 = 5^2 + x^2$
    - 解得：$x = \frac{8}{3}$；
    - 综上所述，$CF$ 的长为 $\frac{8}{5}$ 或 $\frac{8}{3}$
