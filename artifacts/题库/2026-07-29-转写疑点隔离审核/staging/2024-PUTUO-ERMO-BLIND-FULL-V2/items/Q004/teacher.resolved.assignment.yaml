  - type: choice
    id: Q004
    points: 4
    stem_latex: 已知正比例函数$y = kx$ ($k$是常数，$k \neq 0$)的图象经过点$A(2,6)$，那么下列坐标所表示的点在这个正比例函数图象上的是(    )
    choices:
    - $(-1,-3)$
    - $(1,-3)$
    - $(6,2)$
    - $(6,-2)$
    answer: A
    clue: 原卷未提供提示
    solution_steps:
    - 解：$\because$ 正比例函数$y = kx$ ($k$是常数，$k \neq 0$)的图象经过点$A(2,6)$，
    - $\therefore 6 = 2k$
    - 解得：$k = 3$，
    - $\therefore$ 正比例函数解析式为$y = 3x$；
    - A. 当$x = -1$时，$y = 3 \times (-1) = -3$，$\therefore$点$(-1,-3)$这个正比例函数图象上，选项A符合题意；
    - B. 当$x = 1$时，$y = 3 \times 1 = 3$，$3 \neq -3$，$\therefore$点$(1,-3)$不在这个正比例函数图象上，选项B不符合题意；
    - C. 当$x = 6$时，$y = 3 \times 6 = 18$，$18 \neq 2$，$\therefore$点$(6,2)$不在这个正比例函数图象上，选项C不符合题意；
    - D. 当$x = 6$时，$y = 3 \times 6 = 18$，$18 \neq -2$，$\therefore$点$(6,-2)$不在这个正比例函数图象上，选项D不符合题意。
