  - type: fillin
    id: Q008
    points: 4
    stem_latex: 方程 $\sqrt{2x + 3} = x$ 的解为 ______。
    answer: $3$
    clue: 原卷未提供提示
    solution_steps:
    - 两边平方得：$2x + 3 = x^{2}$。
    - $\therefore x^{2} - 2x - 3 = 0$。
    - 解方程得：$x_{1} = 3$，$x_{2} = -1$。
    - 检验：当 $x_{1} = 3$ 时，方程的左边 = 右边，所以 $x_{1} = 3$ 为原方程的解。
    - 当 $x_{2} = -1$ 时，原方程的左边 $\neq$ 右边，所以 $x_{2} = -1$ 不是原方程的解。
    solution_notes:
    - 解无理方程需检验增根。
