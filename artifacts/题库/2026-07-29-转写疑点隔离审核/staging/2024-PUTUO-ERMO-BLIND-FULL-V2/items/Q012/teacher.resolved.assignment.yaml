    stem_latex: 现有四张分别是等边三角形、菱形、直角梯形、等腰梯形的纸片，从这四张纸片中任意抽取一张恰好是轴对称图形的概率是______。
    answer: $\frac{3}{4}$
    clue: 原卷未提供提示
    solution_steps:
    - 在等边三角形、菱形、直角梯形、等腰梯形中，轴对称图形有：等边三角形、菱形、等腰梯形，共3种。
    - 从这4张纸片中随机抽取一张，抽到轴对称图形的概率为$\frac{3}{4}$。
