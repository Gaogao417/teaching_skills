    id: Q009
    points: 4
    stem_latex: 不等式组 $\begin{cases} 3x + 6 > 0 \\ 1 - 2x > 0 \end{cases}$ 的解集是 ______。
    answer: $-2 < x < \frac{1}{2}$
    clue: 原卷未提供提示
    solution_steps:
    - 解不等式①得：$x > -2$
    - 解不等式②得：$x < \frac{1}{2}$
    - 不等式组的解集为：$-2 < x < \frac{1}{2}$
    solution_notes:
    - 分别解两个不等式，取公共解集。
