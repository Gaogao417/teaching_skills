  - type: fillin
    id: Q011
    points: 0
    stem_latex: 已知一个角的余角是这个角的两倍，那么这个角的补角是______度。
    answer: '150'
    clue: 原卷未提供提示
    solution_steps:
    - 设这个角的度数为$x$，则这个角的余角的度数为$90-x$。
    - 根据题意得$2x = 90 - x$。
    - 解得$x = 30$。
    - 这个角的度数为$30^\circ$，则它的补角是$180^\circ - 30^\circ = 150^\circ$。
