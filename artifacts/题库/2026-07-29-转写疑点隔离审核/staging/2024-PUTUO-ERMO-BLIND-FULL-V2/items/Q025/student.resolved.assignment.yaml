  - type: problem
    id: Q025
    points: 0
    stem_latex: '如图，在梯形 $ABCD$ 中， $AD \parallel BC$ ( $AD<BC$ ) ， $\angle A=90^{\circ}$ ， $BC=CD=6$ ．将梯形 $ABCD$ 绕点 $C$ 按顺时针方向旋转，使点 $B$ 与点 $D$ 重合，此时点 $A$ 、 $D$ 的对应点分别是点 $E$ 、 $F$ ．

      （1）当点 $F$ 正好落在 $AD$ 的延长线上时，求 $\angle BCD$ 的度数；

      （2）联结 $AE$ ，设 $AD=x$ ， $AE=y$ ．

      ①求 $y$ 关于 $x$ 的函数解析式；

      ②定义：同中心同边数的两个正多边形称为双同正多边形．设 $\angle BCF$ 是一个正多边形的中心角，联结 $BD$ ，请说明以线段 $BD$ 、 $AE$ 为边的正多边形是双同正多边形的理由．当这两个正多边形的面积比是 $4:5$ 时，求双同正多边形的边数．'
