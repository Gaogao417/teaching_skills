      - $\therefore AG = AE, \angle DAG = \angle BAE$
      - $\because \angle EAF = 45^\circ$，
      - $\therefore \angle GAF = 90^\circ - \angle DAG - \angle BAF = 90^\circ - \angle BAE - \angle BAF = 90^\circ - \angle EAF = 45^\circ$
      - $\therefore \angle BAF = \angle EAF$，
      - 在 $\triangle EAF, \triangle GAF$ 中，
      - $\begin{cases} AE = AG \\ \angle EAF = \angle GAF \\ AF = AF \end{cases}$
      - $\therefore \triangle EAF \cong \triangle GAF(SAS)$
      - $\therefore EF = FG$，
