      - 【小问1详解】解：依题意，$\triangle PAB$ 是等腰直角三角形，当点 $P$ 的坐标为 $(4,3)$ 时，则 $y=a(x-4)^2+3$ 抛物线的对称轴为直线 $x=4$，如图所示，过点 $P$ 作 $PC \perp x$ 轴于点 $C$，$\therefore PC = \frac{1}{2}AB = AC = CB = 3$，$\therefore A(1,0)$，$B(7,0)$，将 $A(1,0)$ 代入 $y=a(x-4)^2+3$，$0=a(1-4)^2+3$，解得：$a=-\frac{1}{3}$，$\therefore$ 抛物线解析式为 $y=-\frac{1}{3}(x-4)^2+3$；
      - 【小问2详解】解：$\because$ 抛物线 $y=a(x-m)^2+n(a \neq 0)$ 与 $x$ 轴交于点 $A$、$B$，抛物线的顶点 $P$ 在第一象限，且 $\angle APB=90^\circ$，$\therefore \triangle PBC$ 是等腰直角三角形，抛物线的顶点坐标为 $(m,n)$，$PC = AC = n$，$\therefore A(m-n,0)$，代入 $y=a(x-m)^2+n(a \neq 0)$，$\therefore a(m-n-m)^2+n=0$，即 $an^2+n=0$，$\because$ 抛物线的顶点 $P$ 在第一象限，则 $n>0$，$\therefore a=-\frac{1}{n}$；
