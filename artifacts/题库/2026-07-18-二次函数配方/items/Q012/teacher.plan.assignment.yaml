  - type: short_answer
    id: Q012
    points: 10
    label: 首项系数不为1
    stem_latex: 将 $Q(x)=10x^2-20x+9$ 配方。
    answer_space:
      type: steps
      height: 42mm
      step_count: 3
    answer: $Q(x)=10\left(x-1\right)^2-1$，其中 $m=-1$。
    explanation: 五类系数外观不同，但始终使用同一套三步配方。
    solution_steps:
    - title: 提二次项系数
      content_latex: $Q(x)=10\left(x^2-2x\right)+9$。
    - title: 写成 $x^2+2mx$ 并配方
      content_latex: $2m=-2$，所以 $m=-1$，$x^2-2x=\left(x-1\right)^2-1$。
    - title: 拆中括号并合并
      content_latex: $Q(x)=10\left[\left(x-1\right)^2-1\right]+9=10\left(x-1\right)^2-1$。
    teaching:
      teaching_goal: 用统一三步完成二次函数配方
      category: 首项系数不为1
      entry_point: factor_a_then_match_2m_then_expand_brackets
      number_policy:
        largest_prime_factor_max: 5
        fraction_relation: same_denominator_or_same_numerator_within_source_expression
