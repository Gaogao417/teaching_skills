  - type: problem
    id: Q019
    points: 10
    label: a、b为同分母分数
    stem_latex: 将 $y=\dfrac{1}{2}x^2-\dfrac{3}{2}x+1$ 配方。
    answer_space:
      type: steps
      height: 42mm
      step_count: 3
    answer: $y=\dfrac{1}{2}\left(x-\dfrac{3}{2}\right)^2-\dfrac{1}{8}$，其中 $m=-\dfrac{3}{2}$。
    explanation: 五类系数外观不同，但始终使用同一套三步配方。
    solution_steps:
    - title: 提二次项系数
      content_latex: $y=\dfrac{1}{2}\left(x^2-3x\right)+1$。
    - title: 写成 $x^2+2mx$ 并配方
      content_latex: $2m=-3$，所以 $m=-\dfrac{3}{2}$，$x^2-3x=\left(x-\dfrac{3}{2}\right)^2-\dfrac{9}{4}$。
    - title: 拆中括号并合并
      content_latex: $y=\dfrac{1}{2}\left[\left(x-\dfrac{3}{2}\right)^2-\dfrac{9}{4}\right]+1=\dfrac{1}{2}\left(x-\dfrac{3}{2}\right)^2-\dfrac{1}{8}$。
    teaching:
      teaching_goal: 用统一三步完成二次函数配方
      category: a、b为同分母分数
      entry_point: factor_a_then_match_2m_then_expand_brackets
      number_policy:
        largest_prime_factor_max: 5
        fraction_relation: same_denominator_or_same_numerator_within_source_expression
