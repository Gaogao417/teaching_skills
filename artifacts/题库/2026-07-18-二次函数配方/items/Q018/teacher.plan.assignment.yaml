  - type: short_answer
    id: Q018
    points: 10
    label: b/a不是偶数
    stem_latex: 将 $Q(x)=10x^2+9x+2$ 配方。
    answer_space:
      type: steps
      height: 42mm
      step_count: 3
    answer: $Q(x)=10\left(x+\dfrac{9}{20}\right)^2-\dfrac{1}{40}$，其中 $m=\dfrac{9}{20}$。
    explanation: 五类系数外观不同，但始终使用同一套三步配方。
    solution_steps:
    - title: 提二次项系数
      content_latex: $Q(x)=10\left(x^2+\dfrac{9}{10}x\right)+2$。
    - title: 写成 $x^2+2mx$ 并配方
      content_latex: $2m=\dfrac{9}{10}$，所以 $m=\dfrac{9}{20}$，$x^2+\dfrac{9}{10}x=\left(x+\dfrac{9}{20}\right)^2-\dfrac{81}{400}$。
    - title: 拆中括号并合并
      content_latex: $Q(x)=10\left[\left(x+\dfrac{9}{20}\right)^2-\dfrac{81}{400}\right]+2=10\left(x+\dfrac{9}{20}\right)^2-\dfrac{1}{40}$。
    teaching:
      teaching_goal: 用统一三步完成二次函数配方
      category: b/a不是偶数
      entry_point: factor_a_then_match_2m_then_expand_brackets
      number_policy:
        largest_prime_factor_max: 5
        fraction_relation: same_denominator_or_same_numerator_within_source_expression
