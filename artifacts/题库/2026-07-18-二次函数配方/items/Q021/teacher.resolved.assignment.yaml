  - type: short_answer
    id: Q021
    points: 10
    label: a、b为同分母分数
    stem_latex: 将 $P(x)=\dfrac{3}{4}x^2-\dfrac{5}{4}x$ 配方。
    answer_space:
      type: steps
      height: 42mm
      step_count: 3
    answer: $P(x)=\dfrac{3}{4}\left(x-\dfrac{5}{6}\right)^2-\dfrac{25}{48}$，其中 $m=-\dfrac{5}{6}$。
    explanation: 五类系数外观不同，但始终使用同一套三步配方。
    solution_steps:
    - title: 提二次项系数
      content_latex: $P(x)=\dfrac{3}{4}\left(x^2-\dfrac{5}{3}x\right)$。
    - title: 写成 $x^2+2mx$ 并配方
      content_latex: $2m=-\dfrac{5}{3}$，所以 $m=-\dfrac{5}{6}$，$x^2-\dfrac{5}{3}x=\left(x-\dfrac{5}{6}\right)^2-\dfrac{25}{36}$。
    - title: 拆中括号并合并
      content_latex: $P(x)=\dfrac{3}{4}\left[\left(x-\dfrac{5}{6}\right)^2-\dfrac{25}{36}\right]=\dfrac{3}{4}\left(x-\dfrac{5}{6}\right)^2-\dfrac{25}{48}$。
    teaching:
      teaching_goal: 用统一三步完成二次函数配方
      category: a、b为同分母分数
      entry_point: factor_a_then_match_2m_then_expand_brackets
      number_policy:
        largest_prime_factor_max: 5
        fraction_relation: same_denominator_or_same_numerator_within_source_expression
