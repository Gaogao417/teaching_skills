  - type: problem
    id: Q020
    points: 10
    label: a、b为同分母分数
    stem_latex: 将 $y=\dfrac{2}{3}x^2+\dfrac{5}{3}x+1$ 配方。
    answer_space:
      type: steps
      height: 42mm
      step_count: 3
    answer: $y=\dfrac{2}{3}\left(x+\dfrac{5}{4}\right)^2-\dfrac{1}{24}$，其中 $m=\dfrac{5}{4}$。
    explanation: 五类系数外观不同，但始终使用同一套三步配方。
    solution_steps:
    - title: 提二次项系数
      content_latex: $y=\dfrac{2}{3}\left(x^2+\dfrac{5}{2}x\right)+1$。
    - title: 写成 $x^2+2mx$ 并配方
      content_latex: $2m=\dfrac{5}{2}$，所以 $m=\dfrac{5}{4}$，$x^2+\dfrac{5}{2}x=\left(x+\dfrac{5}{4}\right)^2-\dfrac{25}{16}$。
    - title: 拆中括号并合并
      content_latex: $y=\dfrac{2}{3}\left[\left(x+\dfrac{5}{4}\right)^2-\dfrac{25}{16}\right]+1=\dfrac{2}{3}\left(x+\dfrac{5}{4}\right)^2-\dfrac{1}{24}$。
    teaching:
      teaching_goal: 用统一三步完成二次函数配方
      category: a、b为同分母分数
      entry_point: factor_a_then_match_2m_then_expand_brackets
      number_policy:
        largest_prime_factor_max: 5
        fraction_relation: same_denominator_or_same_numerator_within_source_expression
