  - type: problem
    id: Q008
    points: 10
    label: 首项系数不为1
    stem_latex: 将 $y=3x^2-12x+10$ 配方。
    answer_space:
      type: steps
      height: 42mm
      step_count: 3
    answer: $y=3\left(x-2\right)^2-2$，其中 $m=-2$。
    explanation: 五类系数外观不同，但始终使用同一套三步配方。
    solution_steps:
    - title: 提二次项系数
      content_latex: $y=3\left(x^2-4x\right)+10$。
    - title: 写成 $x^2+2mx$ 并配方
      content_latex: $2m=-4$，所以 $m=-2$，$x^2-4x=\left(x-2\right)^2-4$。
    - title: 拆中括号并合并
      content_latex: $y=3\left[\left(x-2\right)^2-4\right]+10=3\left(x-2\right)^2-2$。
    teaching:
      teaching_goal: 用统一三步完成二次函数配方
      category: 首项系数不为1
      entry_point: factor_a_then_match_2m_then_expand_brackets
      number_policy:
        largest_prime_factor_max: 5
        fraction_relation: same_denominator_or_same_numerator_within_source_expression
