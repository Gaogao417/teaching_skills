  - type: problem
    id: Q013
    points: 10
    label: b/a不是偶数
    stem_latex: 将 $y=3x^2+5x+2$ 配方。
    answer_space:
      type: steps
      height: 42mm
      step_count: 3
    answer: $y=3\left(x+\dfrac{5}{6}\right)^2-\dfrac{1}{12}$，其中 $m=\dfrac{5}{6}$。
    explanation: 五类系数外观不同，但始终使用同一套三步配方。
    solution_steps:
    - title: 提二次项系数
      content_latex: $y=3\left(x^2+\dfrac{5}{3}x\right)+2$。
    - title: 写成 $x^2+2mx$ 并配方
      content_latex: $2m=\dfrac{5}{3}$，所以 $m=\dfrac{5}{6}$，$x^2+\dfrac{5}{3}x=\left(x+\dfrac{5}{6}\right)^2-\dfrac{25}{36}$。
    - title: 拆中括号并合并
      content_latex: $y=3\left[\left(x+\dfrac{5}{6}\right)^2-\dfrac{25}{36}\right]+2=3\left(x+\dfrac{5}{6}\right)^2-\dfrac{1}{12}$。
    teaching:
      teaching_goal: 用统一三步完成二次函数配方
      category: b/a不是偶数
      entry_point: factor_a_then_match_2m_then_expand_brackets
      number_policy:
        largest_prime_factor_max: 5
        fraction_relation: same_denominator_or_same_numerator_within_source_expression
