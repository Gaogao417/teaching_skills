  - type: short_answer
    id: Q027
    points: 10
    label: a为整数、b含根号
    stem_latex: 将 $P(x)=4x^2-4\sqrt{5}x+4$ 配方。
    answer_space:
      type: steps
      height: 42mm
      step_count: 3
    answer: $P(x)=4\left(x-\dfrac{\sqrt{5}}{2}\right)^2-1$，其中 $m=-\dfrac{\sqrt{5}}{2}$。
    explanation: 五类系数外观不同，但始终使用同一套三步配方。
    solution_steps:
    - title: 提二次项系数
      content_latex: $P(x)=4\left(x^2-\sqrt{5}x\right)+4$。
    - title: 写成 $x^2+2mx$ 并配方
      content_latex: $2m=-\sqrt{5}$，所以 $m=-\dfrac{\sqrt{5}}{2}$，$x^2-\sqrt{5}x=\left(x-\dfrac{\sqrt{5}}{2}\right)^2-\dfrac{5}{4}$。
    - title: 拆中括号并合并
      content_latex: $P(x)=4\left[\left(x-\dfrac{\sqrt{5}}{2}\right)^2-\dfrac{5}{4}\right]+4=4\left(x-\dfrac{\sqrt{5}}{2}\right)^2-1$。
    teaching:
      teaching_goal: 用统一三步完成二次函数配方
      category: a为整数、b含根号
      entry_point: factor_a_then_match_2m_then_expand_brackets
      number_policy:
        largest_prime_factor_max: 5
        fraction_relation: same_denominator_or_same_numerator_within_source_expression
