  - type: short_answer
    id: Q015
    points: 10
    label: b/a不是偶数
    stem_latex: 将 $P(x)=4x^2-6x+2$ 配方。
    answer_space:
      type: steps
      height: 42mm
      step_count: 3
    answer: $P(x)=4\left(x-\dfrac{3}{4}\right)^2-\dfrac{1}{4}$，其中 $m=-\dfrac{3}{4}$。
    explanation: 五类系数外观不同，但始终使用同一套三步配方。
    solution_steps:
    - title: 提二次项系数
      content_latex: $P(x)=4\left(x^2-\dfrac{3}{2}x\right)+2$。
    - title: 写成 $x^2+2mx$ 并配方
      content_latex: $2m=-\dfrac{3}{2}$，所以 $m=-\dfrac{3}{4}$，$x^2-\dfrac{3}{2}x=\left(x-\dfrac{3}{4}\right)^2-\dfrac{9}{16}$。
    - title: 拆中括号并合并
      content_latex: $P(x)=4\left[\left(x-\dfrac{3}{4}\right)^2-\dfrac{9}{16}\right]+2=4\left(x-\dfrac{3}{4}\right)^2-\dfrac{1}{4}$。
    teaching:
      teaching_goal: 用统一三步完成二次函数配方
      category: b/a不是偶数
      entry_point: factor_a_then_match_2m_then_expand_brackets
      number_policy:
        largest_prime_factor_max: 5
        fraction_relation: same_denominator_or_same_numerator_within_source_expression
