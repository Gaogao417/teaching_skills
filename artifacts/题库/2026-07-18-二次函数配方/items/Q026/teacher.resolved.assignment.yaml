  - type: problem
    id: Q026
    points: 10
    label: a为整数、b含根号
    stem_latex: 将 $y=3x^2+6\sqrt{2}x+5$ 配方。
    answer_space:
      type: steps
      height: 42mm
      step_count: 3
    answer: $y=3\left(x+\sqrt{2}\right)^2-1$，其中 $m=\sqrt{2}$。
    explanation: 五类系数外观不同，但始终使用同一套三步配方。
    solution_steps:
    - title: 提二次项系数
      content_latex: $y=3\left(x^2+2\sqrt{2}x\right)+5$。
    - title: 写成 $x^2+2mx$ 并配方
      content_latex: $2m=2\sqrt{2}$，所以 $m=\sqrt{2}$，$x^2+2\sqrt{2}x=\left(x+\sqrt{2}\right)^2-2$。
    - title: 拆中括号并合并
      content_latex: $y=3\left[\left(x+\sqrt{2}\right)^2-2\right]+5=3\left(x+\sqrt{2}\right)^2-1$。
    teaching:
      teaching_goal: 用统一三步完成二次函数配方
      category: a为整数、b含根号
      entry_point: factor_a_then_match_2m_then_expand_brackets
      number_policy:
        largest_prime_factor_max: 5
        fraction_relation: same_denominator_or_same_numerator_within_source_expression
