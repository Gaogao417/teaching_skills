- id: t1
  title: 角平分线 + 等腰外角：AA 证相似，平行转移比例
  author: mvp-phase3-dogfood
  status: approved
  goal: 掌握"角平分线给公共角、等腰给外角"的组合：AA 判定证 △CEA∽△CDB， 再用 CF∥AE 的平行条件把比例转移到目标比例式。
  entry_signal: CD 平分 ∠ACB → ∠ACE=∠DCB 是现成的公共角。
  steps:
  - step_id: S1
    intent: 找公共角（角平分线）
    narration: 由 $CD$ 平分 $\angle ACB$ 得 $\angle ACE=\angle DCB$，这是 $\triangle CEA$ 与 $\triangle CDB$ 的第一组等角。
    expected_student_reasoning: 学生能立刻把角平分线条件翻译成两个三角形的公共等角。
    accepted_alternatives: []
    common_errors:
    - 平分线两侧的角与三角形顶点对应错
    skill_ids:
    - SKILL-SMV-008
    origin: manual
  - step_id: S2
    intent: 等腰外角配第二组角，AA 判定
    narration: 由 $AE=AD$ 得 △AED 等腰，$\angle CEA$ 与 $\angle CDB$ 是其两个外角， 均等于 $2\angle EAD$，故 $\angle CEA=\angle CDB$； 两组对应角相等，AA 判定证得 $\triangle CEA\sim\triangle CDB$。
    expected_student_reasoning: 学生能用"等腰 + 外角"补出第二组角并写明判定依据。
    accepted_alternatives:
    - 用内错角/同位角另证第二组等角
    common_errors:
    - 把外角当成底角本身
    - 顶点对应关系写错
    skill_ids:
    - SKILL-SMV-002
    origin: manual
  - step_id: S3
    intent: 平行转移比例，规划证明路线
    narration: 由 $CF\parallel AE$ 得新的等角与比例，结合第一问相似比 $\frac{CE}{CD}=\frac{CA}{CB}$ 逐层转移，最终证得 $\frac{BD}{AD}=\frac{BF}{CF}$。
    expected_student_reasoning: 学生能规划"先相似比、再平行比"的转移顺序，而不是硬凑。
    accepted_alternatives: []
    common_errors:
    - 平行线截得的比例上下位写反
    - 不用第一问结论另起炉灶
    skill_ids:
    - SKILL-SMV-009
    - SKILL-SMV-007
    origin: manual
  steps_origin: manual
  polished_text: "先观察图形，明确已知条件：在 $\\triangle ABC$ 中，$CD$ 平分 $\\angle ACB$，点 $E$ 在 $CD$ 的延长线上，且 $AE=AD$；点 $F$ 在 $AB$ 的延长线上，连接 $CF$。  \n\n第（1）问要求证明 $\\triangle CEA\\sim\\triangle CDB$。  \n首先看角：因为 $CD$ 平分 $\\angle ACB$，所以 $\\angle ACE=\\angle BCD$。  \n再找另一组相等的角：由 $AE=AD$，得 $\\triangle AED$ 是等腰三角形，故 $\\angle AED=\\angle ADE$；又 $\\angle ADE$ 与 $\\angle CDB$ 是对顶角，所以 $\\angle AED=\\angle CDB$。  \n于是 $\\triangle CEA$ 和 $\\triangle CDB$ 有两组对应角分别相等，即 $\\angle ACE=\\angle BCD$，$\\angle AED=\\angle CDB$，根据 AA 相似判定法，可得 $\\triangle CEA\\sim\\triangle CDB$。  \n\n第（2）问已知 $CF\\parallel AE$，要求证明 $\\frac{BD}{AD}=\\frac{BF}{CF}$。  \n先利用第（1）问结论：由 $\\triangle CEA\\sim\\triangle CDB$，得对应边成比例，即 $\\frac{BD}{AE}=\\frac{BC}{AC}$；又 $AE=AD$，所以 $\\frac{BD}{AD}=\\frac{BC}{AC}$。  \n再利用平行条件：由 $CF\\parallel AE$，得 $\\angle BCF=\\angle CAD$（同位角相等），且 $\\angle F$ 为公共角，故 $\\triangle CFB\\sim\\triangle AFC$，从而 $\\frac{BF}{CF}=\\frac{BC}{AC}$。  \n综上，$\\frac{BD}{AD}=\\frac{BC}{AC}=\\frac{BF}{CF}$，即 $\\frac{BD}{AD}=\\frac{BF}{CF}$。"
