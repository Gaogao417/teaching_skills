    intent: 比例转移收尾
    narration: 由 $\triangle CFB\sim\triangle AFC$ 得 $\frac{BF}{CF}=\frac{CF}{AF}$，结合第(1)问 $\triangle CEA\sim\triangle CDB$ 的相似比 $\frac{CE}{CD}=\frac{CA}{CB}$ 逐层转移，最终证得 $\frac{BD}{AD}=\frac{BF}{CF}$。
    expected_student_reasoning: 学生能规划「先相似比、再平行比」的转移顺序，不硬凑。
