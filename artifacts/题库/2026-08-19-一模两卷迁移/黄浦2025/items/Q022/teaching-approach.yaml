  part_id: '2'
  goal: 由 $CF\parallel AE$ 得新等角并做外角和分解，证 $\triangle CFB\sim\triangle AFC$ 后逐层转移比例，得 $\frac{BD}{AD}=\frac{BF}{CF}$。
  entry_signal: 学生能把平行条件翻译成等角，并寻找公共角。
  steps:
  - step_id: S1
    intent: 平行给新等角
    narration: 由 $CF\parallel AE$ 得 $\angle E=\angle DCF$。
    expected_student_reasoning: 学生能指出平行线截哪两条线产生这对内错角。
    skill_ids:
    - SKILL-SMV-005
  - step_id: S2
    intent: 外角和分解 + 公共角配相似
    narration: $\angle DCF=\angle DCB+\angle BCF$，$\angle E=\angle CDF=\angle ACE+\angle CAD$，相减得 $\angle BCF=\angle CAD$；又 $\angle F=\angle F$（公共），故 $\triangle CFB\sim\triangle AFC$。
    expected_student_reasoning: 学生能完成「分解 → 相减 → 公共角」的三步配角。
    skill_ids:
