      transcript: 第一问证三角形 JAR 相似于三角形 CDB，CD 平分角 ACB，所以角 A 等于角 DCB，这是第一组角。又因为 AE 等于 AT，三角形 EAT 是等腰三角形，底角相等，于是角 JAR 和角 CDB 分别是它的两个外角，都等于两倍的底角，所以角 JAR 等于角 CDB，两组角对应相等，AA 判定相似的证。第二问 CF 平行于 AE，要证 BD 比 AT 等于 BF 比 CF，利用平行线和第一问的相似比，把线段之间的比例一层层转移过去，先把 BD 与 AT 的比通过相似换成别的线段比，再用平行线分出新的比例，两边接上就得到目标比例式。
