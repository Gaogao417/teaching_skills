    stem_latex: （题号与分值标注未出现在给定页文本中，由本大题满分 78 分推知满分为 12 分）已知在 $\triangle ABC$ 中，$CD$
      平分 $\angle ACB$，$E$ 是 $CD$ 延长线上一点，$AE=AD$，$F$ 是 $AB$ 延长线上的点，联结 $CF$ . (1) 求证：$\triangle
      CEA\sim\triangle CDB$；(2) 如果 $CF\parallel AE$，求证：$\frac{BD}{AD}=\frac{BF}{CF}$
      .
    answer: (1) 得证（见解题步骤）；(2) 得证（见解题步骤）
    clue: 角平分线 + 等腰三角形，两次相似（$\triangle CEA\sim\triangle CDB$、$\triangle CFB\sim\triangle
      AFC$）传递比例
    solution_steps:
    - (1) ∵ $AE=AD$，∴ $\angle E=\angle ADE$ .
    - ∵ $\angle ADE=\angle CDB$，∴ $\angle E=\angle CDB$ .
    - ∵ $CD$ 平分 $\angle ACB$，∴ $\angle ACE=\angle BCD$，∴ $\triangle CEA\sim\triangle
      CDB$ .
    - (2) ∵ $CF\parallel AE$，∴ $\angle E=\angle DCF$ .
    - ∵ $\angle DCF=\angle DCB+\angle BCF$，$\angle E=\angle CDF=\angle ACE+\angle
      CAD$，∴ $\angle BCF=\angle CAD$ .
    - 又 $\angle F=\angle F$，∴ $\triangle CFB\sim\triangle AFC$，∴ $\frac{BF}{CF}=\frac{BC}{AC}$
      .
    - 由 $\triangle CEA\sim\triangle CDB$，∴ $\frac{BC}{AC}=\frac{BD}{AE}$；又 $AE=AD$，∴
      $\frac{BC}{AC}=\frac{BD}{AD}$，∴ $\frac{BD}{AD}=\frac{BF}{CF}$ .
