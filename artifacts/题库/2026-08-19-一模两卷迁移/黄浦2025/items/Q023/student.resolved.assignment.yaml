    stem_latex: 在平面直角坐标系 $xOy$ 中，已知抛物线 $y=-x^{2}+4x+c$（$c>0$）与 $x$ 轴交于 $A$、$B$ 两点（点 $A$ 在点 $B$ 的右侧），与 $y$ 轴交于点 $C$，顶点为 $P$，直线 $PC$ 与 $x$ 轴交于点 $D$ . (1) 用含 $c$ 的代数式表示点 $P$ 及点 $D$ 的坐标；(2) 将该抛物线进行上下、左右两次平移，所得的新抛物线的顶点 $P'$ 落在线段 $PC$ 的延长线上，新抛物线与 $y$ 轴交于点 $E$，且 $P'E\perp PP'$ . ① 求该抛物线两次平移的方向和距离；② 点 $A$ 在新抛物线上的对应点 $A'$，如果 $DA'$ 被 $y$ 轴平分，求原抛物线的表达式 .
