  - type: problem
    id: Q021
    points: 10
    stem_latex: 某校初三学生开展主题为“测量校园内树木高度的方案设计”的数学综合与实践活动 . 甲、乙、丙三位同学制作出一个简易测高仪：取两根小木条钉在一起，使它们互相垂直，其中木条
      $AB$ 长 $40\,\mathrm{cm}$，木条 $CD$ 长 $60\,\mathrm{cm}$，$DB$ 长 $20\,\mathrm{cm}$（接头处忽略不计）.
      为了便于校正竖直位置，在点 $B$ 处悬挂一个铅垂，如图 1 所示，这样就制作出一个简易测高仪 . 任务：测量校园内某棵大树 $MN$ 的高度（树顶端
      $M$ 与树根部 $N$ 的距离）. 工具：简易测高仪、卷尺（如图 2 所示）. 要求：测量得到的长度用字母 $a,b,c\cdots\cdots$ 表示
      . 第一次实践：甲手持测高仪，$C$ 端朝上 $D$ 端朝下，从测高仪的点 $A$ 经过点 $C$ 望向树顶端 $M$，调整人到树的距离，使得点 $M$
      恰好与点 $C$、$A$ 在一条直线上，然后标记铅垂线的下端刚好接触地面的点 $E$ 的位置，如图 3 所示 . 乙负责测量，得到点 $B$ 到地面的垂直距离
      $BE=a\,\mathrm{cm}$，还需要测量得到的相关数据有：______；利用得到的数据表示树 $MN$ 的高度：$MN=$ ______ $\mathrm{cm}$
      . 反思：这种方法需要能够一直走到大树的底下，有时因为有障碍物，无法走到大树底下 . 于是三位同学讨论如果不走到大树底下也可以测量出大树的高度，经过讨论得到第二种测量方案，具体如下：第二次实践：甲重复第一次实践操作，然后将测高仪的
      $D$ 端朝上 $C$ 端朝下，从测高仪的点 $A$ 经过点 $D$ 望向树顶端 $M$，向后走调整人到树的距离，使得点 $M$ 恰好与点 $D$、$A$
      在一条直线上，然后标记铅垂线的下端刚好接触地面的点 $F$ 的位置 . 丙提醒甲注意：两次测量时点 $B$ 到地面的垂直距离保持不变；点 $E$、$F$
      和树根部 $N$ 三点要保持在同一直线上，如图 4 所示 . 获取数据：点 $B$ 到地面的垂直距离 $BE=a\,\mathrm{cm}$，乙还需要测量得到的相关数据有：______
      . 利用得到的数据表示树 $MN$ 的高度 .（写出求解过程）
    answer: 第一次实践：还需测量 $NE=b\,\mathrm{cm}$，$MN=(a+b+40)\,\mathrm{cm}$；第二次实践：还需测量 $EF=c\,\mathrm{cm}$，$MN=(c+a)\,\mathrm{cm}$
    clue: 测量方案设计综合实践：利用测高仪的竖直摆放与两次视角差建立方程
    solution_steps:
    - 第一次实践：需要测量得到的相关数据有：$NE=b\,\mathrm{cm}$ . 利用得到的数据表示树 $MN$ 的高度：$MN=(a+b+40)\,\mathrm{cm}$
      .
    - 第二次实践：需要测量得到的相关数据有：$EF=c\,\mathrm{cm}$ .
    - 解决问题：设 $MH=x$ . 由题意可知 $BC=AB=40\,\mathrm{cm}$，$BD=20\,\mathrm{cm}$，$AB\perp
      CD$，∴ $\tan\angle CAB=1$，$\tan\angle D_{1}A_{1}B_{1}=\frac{1}{2}$ .
    - ∵ $AH\perp MN$，∴ $AH=MH=x$；$\tan\angle D_{1}A_{1}B_{1}=\frac{MH}{A_{1}H}=\frac{1}{2}$，∴
      $A_{1}H=2x$ .
    - ∵ $A_{1}H-AH=A_{1}A=B_{1}B=EF$，∴ $x=c$ .
    - ∴ $MN=(c+a)\,\mathrm{cm}$ .（以上两次实践活动方案合理，可操作，答案酌情给分）
