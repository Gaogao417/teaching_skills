      transcript: 这是一道综合实践题。先读仪器，两根木条钉成互相垂直，A、B 长40cm，C、D 长60cm，D、B 长20cm，B 处挂铅锤保证竖直。测量时利用木条构造出的平行关系，视线与树形成 A 字形的相似三角形。第一次实践，沿着 C、D 的方向瞄准树顶 M，由平行的相似对应边成比例，可以推出还需要测量 b 的长度，记作 b 厘米，树高 M、N 就等于 r 加 b 加40cm，这里的 r 是已经量出的一高相关量。第二次实践换一种摆放，同样构造 A 字形相似，推出还需要测量 E、F 的长度记作 c 厘米，树高 M、N 等于 c 加 r 厘米，两次实践的结果互相印证，这也是实践作业的检验习惯。
