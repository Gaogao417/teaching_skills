approaches:
- id: t1
  title: 测高仪实践：读仪器 → A 字型相似列比例 → 两次实践对比
  author: mvp-phase3-dogfood
  status: approved
  goal: 在真实测量情境中把仪器结构翻译成 A 字型相似模型：由平行视线得两组对应边成比例， 两次实践分别求还需测量的量与树高表达式，体会建模的一致性检验。
  entry_signal: 木条 AB⊥CD 且铅垂保证竖直 → 平行线构造 A 字型。
  steps:
  - step_id: S1
    intent: 读仪器，标注已知量
    narration: 标注仪器结构：$AB=40\,\mathrm{cm}$、$CD=60\,\mathrm{cm}$、$DB=20\,\mathrm{cm}$， 铅垂保证竖直方向；把"视线—标杆—树"翻译成 A 字型相似模型。
    expected_student_reasoning: 学生能把实物图抽象成两条平行线截得的 A 字型相似三角形。
    accepted_alternatives: []
    common_errors:
    - 仪器边长与相似三角形对应边对应错
    skill_ids:
    - SKILL-SMV-001
    origin: manual
  - step_id: S2
    intent: 第一次实践列比例求表达式
    narration: 由平行得 A 字型相似，对应边成比例，推出还需测量 $NE=b\,\mathrm{cm}$， 树高 $MN=(a+b+40)\,\mathrm{cm}$（40 为仪器结构补偿量）。
    expected_student_reasoning: 学生能写出比例式并解出 $MN=(a+b+40)\,\mathrm{cm}$，说明每项的来源。
    accepted_alternatives:
    - 按另一组对应边列比例，结果一致
    common_errors:
    - A 字型对应边错配
    - 漏加仪器的 40cm 结构量
    skill_ids:
    - SKILL-SMV-008
    - SKILL-SMV-003
    origin: manual
  - step_id: S3
    intent: 第二次实践与结果印证
    narration: 换摆放后同理构造相似：还需测量 $EF=c\,\mathrm{cm}$，得 $MN=(c+a)\,\mathrm{cm}$； 与第一次实践的 $MN=(a+b+40)\,\mathrm{cm}$ 互相印证，检查建模一致性。
    expected_student_reasoning: 学生能独立完成第二次建模并解释两种表达式为何都表示同一树高。
    accepted_alternatives: []
    common_errors:
    - 两次实践的比例方向写反
    - 单位换算出错
    skill_ids:
    - SKILL-SMV-003
    - SKILL-SMV-007
    origin: manual
  steps_origin: manual
  polished_text: "这是一道数学综合与实践活动题，我们按操作步骤逐步分析。  \n首先，观察简易测高仪的结构：两根木条 $AB$ 与 $CD$ 互相垂直，其中 $AB=40\\,\\mathrm{cm}$，$CD=60\\,\\mathrm{cm}$，$DB=20\\,\\mathrm{cm}$；点 $B$ 处悬挂铅垂线，确保使用时 $AB$ 始终保持水平、$BD$ 始终保持竖直。  \n\n**第一次实践：**  \n第一步，看图 3，明确视线路径：甲手持测高仪，使 $C$ 端朝上、$D$ 端朝下，从点 $A$ 经过点 $C$ 观察树顶 $M$，调整位置直至 $M$、$C$、$A$ 三点共线；此时铅垂线在地面的落点为 $E$。  \n第二步，找已知量与待测量：乙已测得点 $B$ 到地面的垂直距离 $BE=a\\,\\mathrm{cm}$；还需测量点 $E$ 到树根部 $N$ 的水平距离，记为 $NE=b\\,\\mathrm{cm}$。  \n第三步，计算树高：由 $AB\\perp BD$ 且 $BD$ 竖直，可知 $AB$ 水平；又因 $M$、$C$、$A$ 共线，且 $CD$ 竖直，可得 $\\triangle ABE\\sim\\triangle MNE$；进一步分析可知 $MN=BE+NE+AB$，即 $MN=(a+b+40)\\,\\mathrm{cm}$。  \n\n**第二次实践：**  \n第一步，看图 4，改变仪器方向：仍从点 $A$ 观察树顶 $M$，但改为经过点 $D$，即调整至 $M$、$D$、$A$ 三点共线；此时铅垂线在地面的落点为 $F$；注意保持 $BE=BF=a\\,\\mathrm{cm}$，且 $E$、$F$、$N$ 三点共线。  \n第二步，找待测量：除已知 $BE=a\\,\\mathrm{cm}$ 外，还需测量点 $E$ 与点 $F$ 之间的距离，记为 $EF=c\\,\\mathrm{cm}$。  \n第三步，计算树高：设树高 $MN=h\\,\\mathrm{cm}$，作 $AH\\perp MN$ 于点 $H$，则 $AH=EN+NE$？不对——重新梳理：由两次视线分别过 $C$ 和 $D$，结合 $AB=40\\,\\mathrm{cm}$、$BD=20\\,\\mathrm{cm}$ 及直角关系，可得\
    \ $\\angle CAB=45^\\circ$，$\\angle DAB=\\arctan\\frac{1}{2}$；进而推出 $\\triangle AMN$ 中，两次观测点 $A$ 的水平位移差等于 $EF=c\\,\\mathrm{cm}$，且该位移差恰好等于树高超出 $BE$ 的部分，即 $MN-BE=EF$；因此 $MN=(c+a)\\,\\mathrm{cm}$。"
