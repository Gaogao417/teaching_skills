    stem_latex: 如图，将矩形 $ABCD$ 平移到矩形 $EFGH$ 的位置（点 $A$ 对应点 $E$，点 $B$ 对应点 $F$，点 $C$ 对应点
      $G$），边 $EH$ 与 $CD$ 交于点 $M$，边 $EF$ 与 $BC$ 交于点 $N$，其中 $DM:MC=3:2$，$BN:CN=3:2$，如果
      $M$、$N$ 两点的距离为 $a$，那么 $A$、$E$ 两点的距离为 ______ .（用含 $a$ 的代数式表示）
    answer: $\frac{3}{2}a$
    clue: 平移对应点连线平行且相等，由 $MN$ 与平移距离的比例关系求解
