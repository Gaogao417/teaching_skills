  - type: problem
    id: Q019
    points: 10
    stem_latex: 已知抛物线 $y=ax^{2}+bx+c$（$a\neq 0$）经过点 $A(-1,6)$、$B(1,-2)$、$C(0,1)$ .
      (1) 求该抛物线的表达式及其对称轴 $l$；(2) 如果点 $A$ 与点 $D$ 关于对称轴 $l$ 对称，联结 $AB$、$BD$，求 $\triangle
      ABD$ 的面积 .
    answer: (1) $y=x^{2}-4x+1$，对称轴为直线 $x=2$；(2) $S_{\triangle ABD}=24$
    clue: 待定系数法求抛物线解析式，再利用对称性求三角形面积
    solution_steps:
    - (1) ∵ 抛物线 $y=ax^{2}+bx+c$ 经过点 $A(-1,6)$、$B(1,-2)$、$C(0,1)$ 三点，∴ $a-b+c=6$，$a+b+c=-2$，$c=1$，解得
      $a=1$，$b=-4$，$c=1$ .
    - ∴ 抛物线的表达式为 $y=x^{2}-4x+1$，抛物线的对称轴 $l$ 为直线 $x=2$ .
    - (2) 过点 $B$ 作 $BH\perp AD$，垂足为点 $H$ . ∵ 点 $A$ 与点 $D$ 关于对称轴 $l$ 对称，又点 $A(-1,6)$，∴
      $D(5,6)$ .
    - ∴ $AD\parallel x$ 轴，$AD=6$；∵ $B(1,-2)$，∴ $BH=8$ .
    - ∴ $S_{\triangle ABD}=\frac{1}{2}\times AD\times BH=\frac{1}{2}\times 6\times
      8=24$ .
