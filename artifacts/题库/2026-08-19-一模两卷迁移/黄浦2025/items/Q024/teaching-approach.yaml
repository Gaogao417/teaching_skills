    narration: $\triangle APC\sim\triangle EFC$ 且 $\angle PEC=\angle APE<90^\circ$，故 $\angle APC=\angle EFC$；同加直角得 $\angle BPC=\angle PFC$。
    expected_student_reasoning: 学生能核对待定相似的对应顶点后再用条件。
