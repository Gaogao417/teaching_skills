- id: t3
  title: 第(2)问：等角平移锁相似，余切解 BP
  author: migration-agent
  status: approved
  part_id: '2'
  goal: 由平行与第(1)问等角把角平移到 $\triangle BPC$ 与 $\triangle PFC$，用余切列比例解出 $BP=\frac{17}{3}$。
  entry_signal: 学生能把「已证等角」当作第二问的现成工具。
  steps:
  - step_id: S1
    intent: 平行 + 等角平移
    narration: $AB\parallel CD$ 得 $\angle BAC=\angle ACD$；结合第(1)问 $\angle PCF=\angle BAC$ 得 $\angle PCF=\angle ACD$，同减 $\angle ACP$ 得 $\angle PCA=\angle FCD$。
    expected_student_reasoning: 学生能写出「平行内错角 + 已证等角 → 差角相等」的链条。
