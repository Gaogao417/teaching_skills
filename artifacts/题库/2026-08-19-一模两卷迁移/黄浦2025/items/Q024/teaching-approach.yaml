- id: t4
  title: 第(3)问：面积比转化 + F 位置两分类
  author: migration-agent
  status: approved
  part_id: '3'
  goal: "把 $\\frac{S_{\\triangle HFC}}{S_{\\triangle PHC}}=\\frac{1}{3}$ 转成 $\\frac{FH}{PH}=\\frac{1}{3}$，按 F 在 $PH$ 延长线/线段上两分类，解得 $\\frac{AH}{AC}=\frac{2}{7}$ 或 $\\frac{1}{5}$。"
  entry_signal: 学生能把面积比转成同高线段比。
  steps:
  - step_id: S1
    intent: 面积比转线段比
    narration: $\triangle HFC$ 与 $\triangle PHC$ 共顶点 $C$，底 $FH$、$PH$ 同在直线 $PE$ 上（等高），故 $\frac{S_{\triangle HFC}}{S_{\triangle PHC}}=\frac{1}{3}$ 即 $\frac{FH}{PH}=\frac{1}{3}$。
    expected_student_reasoning: 学生能识别共顶点、底共线的等高结构并把面积比化成线段比。
    skill_ids:
    - SKILL-SMV-003
    - SKILL-SMV-005
  - step_id: S2
    intent: 类一：F 在 PH 延长线上
    narration: 过 $H$ 作 $HM\perp AB$；$\angle MPH=\angle PCG$ 且 $\angle HMP=\angle CGP=90^\circ$，$\triangle MPH\sim\triangle GCP$。此时 $\frac{PH}{PC}=\frac{1}{2}$，设 $MH=a$ 得 $GP=2a$、$MP=2$、$AM=\frac{3}{2}a$，由 $2a+\frac{3}{2}a+2+3=9$ 得 $a=\frac{8}{7}$，故 $\frac{AH}{AC}=\frac{MH}{CG}=\frac{2}{7}$。
    expected_student_reasoning: 学生能用相似把 MH/GP 建立倍数关系并列一元方程。
    skill_ids:
    - SKILL-SMV-002
    - SKILL-SMV-007
  - step_id: S3
    intent: 类二：F 在 PH 上与总结
    narration: 此时 $PH=PC$，设 $MH=b$ 得 $GP=b$、$MP=4$、$AM=\frac{3}{2}b$，由 $b+\frac{3}{2}b+4+3=9$ 得 $b=\frac{4}{5}$，故 $\frac{AH}{AC}=\frac{1}{5}$。综上 $\frac{AH}{AC}=\frac{2}{7}$ 或 $\frac{1}{5}$。
    expected_student_reasoning: 学生能完整分两类并把两解分别代回检验。
    skill_ids:
    - SKILL-SMV-009
    common_errors:
    - 漏掉 F 在延长线上的情形
