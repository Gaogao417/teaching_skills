    stem_latex: 已知平行四边形 $ABCD$ 中，$AB=9$，$BC=5$，$\sin B=\frac{4}{5}$，$P$ 是边 $AB$ 上一动点，过点 $P$ 作 $PE\perp PC$，交射线 $CD$ 于点 $E$，交 $AC$ 于点 $H$，$F$ 是 $PE$ 上的点，$\frac{FP}{PC}=\frac{2}{3}$，联结 $CF$ . (1) 求证：$\angle BAC=\angle PCF$；(2) 当 $\triangle APC\sim\triangle EFC$ 时，求线段 $BP$ 的长；(3) 当 $\frac{S_{\triangle HFC}}{S_{\triangle PHC}}=\frac{1}{3}$ 时，求 $\frac{AH}{AC}$ 的值 .
