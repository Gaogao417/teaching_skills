- id: t3
  title: 第(2)问：构矩形转移直角求正弦
  author: migration-agent
  status: approved
  part_id: '2'
  goal: 过 $A$ 作 $AF\perp BC$ 构造矩形 $ADCF$，把 $\angle ABC$ 放进 Rt$\triangle ABF$ 中求 $\sin\angle ABC=\frac{2\sqrt{5}}{5}$。
  entry_signal: 学生能由 $AD\perp CD$、$AD\parallel BC$ 想到补出矩形。
  steps:
  - step_id: S1
    intent: 数据准备
    narration: 在 Rt$\triangle ADC$ 中 $AD=4$、$\tan\angle DAC=\frac{1}{2}$，得 $CD=2$。
    expected_student_reasoning: 学生能由正切与已知直角边解出另一直角边。
    skill_ids:
    - SKILL-SMV-001
    - SKILL-SMV-007
  - step_id: S2
    intent: 构矩形转移
    narration: 过点 $A$ 作 $AF\perp BC$；$\angle FAD=90^\circ$ 且 $AD\perp CD$，四边形 $ADCF$ 是矩形，故 $AF=CD=2$、$FC=AD=4$；$BC=5$ 得 $BF=1$，$AB=\sqrt{AF^{2}+BF^{2}}=\sqrt{5}$。
    expected_student_reasoning: 学生能说明矩形从哪两个垂直条件来，并解出 AB。
    skill_ids:
    - SKILL-SMV-008
    - SKILL-SMV-002
  - step_id: S3
    intent: 直角三角形求正弦
    narration: 在 Rt$\triangle ABF$ 中，对边 $AF=2$、斜边 $AB=\sqrt{5}$，由 $\frac{2}{\sqrt{5}}$ 分母有理化，得 $\sin\angle ABC=\frac{2\sqrt{5}}{5}$。
    expected_student_reasoning: 学生能选对对边/斜边并完成分母有理化。
    skill_ids:
    - SKILL-SMV-007
