  - type: choice
    id: Q004
    points: 4
    stem_latex: 在 $\triangle ABC$ 中，点 $D$、$E$ 分别在边 $AB$、$AC$ 上，如果 $AD=1$，$BD=3$，那么下列条件中能够推得
      $DE\parallel BC$ 的是（　）
    choices:
    - $\frac{DE}{BC}=\frac{1}{3}$
    - $\frac{DE}{BC}=\frac{1}{4}$
    - $\frac{EC}{AC}=\frac{2}{3}$
    - $\frac{AE}{AC}=\frac{1}{4}$
    answer: D
    clue: 平行线分线段成比例定理的逆用，需 $\frac{AE}{AC}=\frac{AD}{AB}=\frac{1}{4}$
