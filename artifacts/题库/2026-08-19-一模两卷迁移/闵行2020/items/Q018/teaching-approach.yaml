      transcript: 同学你好，我们看这道折叠题，先标条件，三角形ABC是等腰的，AB等于AC等于四，底边BC等于六。题目还告诉我们角D等于角ACD，看到等角对等边，马上得到AD等于DC，我们设它为t。接着抓翻折的不变量，翻折不改变长度和角度，所以AE等于AC等于四，得等于DC等于t，角OD等于角ADC。然后设未知数列方程，把D点位置设出来，用勾股定理列方程可以解出t等于8/3，BD等于10/3。最后一步是关键转折，在三角形BDE里，角BDE可以由外角和翻折角拼出来，代入余弦定理，算出来b等于一。注意最后一定要带回图形检验一下折叠后的位置。
