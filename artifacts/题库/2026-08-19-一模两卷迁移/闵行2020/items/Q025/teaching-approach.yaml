approaches:
- id: t1
  title: 母子型压轴：共边相似导角 → 函数关系式 → 等腰分类
  author: mvp-phase3-dogfood
  status: draft
  goal: 综合训练三小问递进结构：共边相似导角、设 AD=x 建 $y$ 与 $x$ 的函数关系式、 等腰三角形存在性分类讨论，体会"证据递进"的压轴题节奏。
  entry_signal: 看到 Rt△ 与重心、射线交点，先用共边相似把角的关系立起来。
  steps:
  - step_id: S1
    intent: 共边相似导角
    narration: 由 Rt$\triangle ABC$ 与 Rt$\triangle ACD$ 共边的结构导角（等角的余角相等）， 证得 $\angle DAB = \angle DCF$。
    expected_student_reasoning: 学生能在双直角共边结构中找到互余的角对，写出完整导角链。
    accepted_alternatives: []
    common_errors:
    - 直角结构里漏看互余关系
    skill_ids:
    - SKILL-SMV-008
    - SKILL-SMV-005
    origin: manual
  - step_id: S2
    intent: 设元建立函数关系式
    narration: 设 $AD=x$、$CE=y$，由相似（母子型）对应边成比例建立等量关系， 整理得 $y = \frac{x^{2} + 4}{x + 2}$，自变量范围 $0 < x \leq 2$。
    expected_student_reasoning: 学生能选对相似三角形组列出比例，解出 y 并求定义域 $0 < x \leq 2$。
    accepted_alternatives:
    - 用面积法或勾股关系另建等式
    common_errors:
    - 母子型对应边错配（与 002 混淆）
    - 漏求自变量范围
    skill_ids:
    - SKILL-SMV-005
    - SKILL-SMV-007
    origin: manual
  - step_id: S3
    intent: 等腰存在性分类讨论
    narration: 按 $GA=GD$、$AD=AG$、$DA=DG$ 三类分别画图、列式，结合函数关系式解方程并按范围取舍， 解得 $AD = 1$ 或 $\sqrt{14}$。
    expected_student_reasoning: 学生能不重不漏地分三类讨论，且解出的值逐一代回范围检验。
    accepted_alternatives: []
    common_errors:
    - 分类遗漏
    - 解出后不检验 0<x≤2 导致多解
    skill_ids:
    - SKILL-SMV-009
    origin: manual
  steps_origin: manual
  polished_text: "我们来逐步分析这道题。请先观察图形，明确已知条件和各点位置关系。\n\n第一步：看图并标记已知信息。  \n在图中找到两个直角三角形：Rt$\\triangle ABC$ 和 Rt$\\triangle ACD$；其中 $\\angle ACB = 90^\\circ$，$\\angle ADC = 90^\\circ$，且 $AC = BC$；点 $A$、$B$ 分别在直线 $CD$ 的两侧；$CD = 2$；射线 $CD$ 与边 $AB$ 相交于点 $E$；点 $G$ 是 Rt$\\triangle ABC$ 的重心；射线 $CG$ 与边 $AB$ 相交于点 $F$；设 $AD = x$，$CE = y$。\n\n第二步：证明 $\\angle DAB = \\angle DCF$。  \n先找出关键线段的性质：因为 $G$ 是 Rt$\\triangle ABC$ 的重心，所以 $CF$ 是 Rt$\\triangle ABC$ 的中线；又因为在 Rt$\\triangle ABC$ 中，$AC = BC$ 且 $\\angle ACB = 90^\\circ$，所以 $\\triangle ABC$ 是等腰直角三角形，斜边为 $AB$，因此中线 $CF$ 同时也是高线和角平分线，即 $CF \\perp AB$，故 $\\angle AFC = 90^\\circ$。  \n再观察四边形或相关角：由于 $\\angle ADE = 90^\\circ$（因 $\\angle ADC = 90^\\circ$），$\\angle EFC = 90^\\circ$（因 $CF \\perp AB$），所以在 $\\triangle ADE$ 和 $\\triangle CFE$ 中，$\\angle DAE$ 与 $\\angle ECF$ 都是其余角，从而 $\\angle DAB = \\angle DAE = \\angle DCF$。  \n\n第三步：当点 $E$ 在线段 $CD$ 上时，求 $y$ 关于 $x$ 的函数关系式，并写出 $x$ 的取值范围。  \n先过点 $B$ 作 $BH \\perp CD$，垂足为 $H$；由 $\\triangle CAD \\cong \\triangle BCH$（ASA），可得\
    \ $BH = CD = 2$，$CH = AD = x$，所以 $DH = CD - CH = 2 - x$；  \n再由 $AD \\parallel BH$（同垂直于 $CD$），得 $\\frac{AD}{BH} = \\frac{DE}{EH}$，即 $\\frac{x}{2} = \\frac{DE}{EH}$；整理得 $\\frac{x + 2}{2} = \\frac{DH}{EH}$，解得 $EH = \\frac{4 - 2x}{x + 2}$；  \n最后计算 $y = CE = CH + HE = x + \\frac{4 - 2x}{x + 2} = \\frac{x^{2} + 4}{x + 2}$；  \n由于点 $E$ 在线段 $CD$ 上，且 $C$、$D$ 为端点，$CH = x > 0$，$DH = 2 - x \\geq 0$，所以 $x$ 的取值范围是 $0 < x \\leq 2$。\n\n第四步：若 $\\triangle CDG$ 是以 $CG$ 为腰的等腰三角形，求 $AD$ 的长。  \n“以 $CG$ 为腰”说明等腰三角形的两条相等边中必有一条是 $CG$，因此分两种情况讨论：  \n① 当 $CG = GD$ 时，取 $AC$ 中点 $M$，连接 $MD$、$MG$；由等腰直角三角形性质可知 $MD = MC$，且 $MG \\perp CD$，又 $BH \\parallel MG$，结合 $CH = AD$，可得 $AD = CH = 1$；  \n② 当 $CG = CD$ 时，即 $CG = 2$；因 $G$ 是 $\\triangle ABC$ 的重心，故 $CF = \\frac{3}{2} CG = 3$；又 $CF$ 是等腰直角三角形斜边上的中线，所以 $AB = 2CF = 6$，进而 $AC = \\frac{\\sqrt{2}}{2} AB = 3\\sqrt{2}$；在 Rt$\\triangle ACD$ 中，由勾股定理得 $AD = \\sqrt{AC^{2} - CD^{2}} = \\sqrt{18 - 4} = \\sqrt{14}$；  \n综上，满足条件的 $AD$ 的长为 $1$ 或 $\\sqrt{14}$。"
