- id: t4
  title: 第(3)问：以 CG 为腰的等腰分类
  author: migration-agent
  status: approved
  part_id: '3'
  goal: 按 $GC=GD$、$CG=CD$ 两类画图列式，结合函数关系式求解并按范围取舍，得 $AD = 1$ 或 $\sqrt{14}$。
  entry_signal: 学生能对「以 CG 为腰」枚举两种等腰可能并分别画图。
  steps:
  - step_id: S1
    intent: 分类起点与图形
    narration: $\triangle CDG$ 以 $CG$ 为腰 → 两类：$GC=GD$ 与 $CG=CD$；先明确 $CD=2$ 恒定，分类只改变 G 的位置。
    expected_student_reasoning: 学生能不重不漏列出两类并说明分类依据（腰的两个端点）。
    skill_ids:
    - SKILL-SMV-009
  - step_id: S2
    intent: 类一 GC=GD
    narration: 取 $AC$ 的中点 $M$，联结 $MD$，则 $MD=MC$；联结 $MG$ 则 $MG \perp CD$ 且直线 $MG$ 经过点 $B$，$BH$ 与 $MG$ 共线；又 $CH=AD$，得 $AD=CH=1$。
    expected_student_reasoning: 学生能用「到两端等距 → 垂直」识别中垂线结构。
    skill_ids:
    - SKILL-SMV-005
    - SKILL-SMV-001
  - step_id: S3
    intent: 类二 CG=CD 与总结
    narration: $CG=CD=2$；G 为重心，$CF=\frac{3}{2}CG=3$，等腰直角得 $AC=\frac{\sqrt{2}}{2}AB=3\sqrt{2}$，$AD=\sqrt{AC^{2}-CD^{2}}=\sqrt{14}$。综上 $AD = 1$ 或 $\sqrt{14}$，均满足 $0 < x \leq 2$。
    expected_student_reasoning: 学生能代回函数范围检验两解均合法。
    skill_ids:
    - SKILL-SMV-007
    common_errors:
    - 漏一类，或解后不代回范围
