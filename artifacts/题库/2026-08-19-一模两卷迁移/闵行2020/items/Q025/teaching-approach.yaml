  - step_id: S3
    intent: 收尾书写
    narration: $\angle DAE$ 即 $\angle DAB$、$\angle ECF$ 即 $\angle DCF$，故 $\angle DAB = \angle DCF$ 得证。
    expected_student_reasoning: 学生能核对角的记号转换（DAE→DAB、ECF→DCF）后落笔。
    skill_ids:
    - SKILL-SMV-009
