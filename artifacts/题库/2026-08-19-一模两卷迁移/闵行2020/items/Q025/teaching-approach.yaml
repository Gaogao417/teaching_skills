    - SKILL-SMV-008
  - step_id: S2
    intent: 外角和分解对齐
    narration: $\angle DEF=\angle ADE+\angle DAE$（外角），$\angle DEF=\angle EFC+\angle ECF$；其中 $\angle ADE=\angle EFC=90^\circ$，两式相减得 $\angle DAE=\angle ECF$。
    expected_student_reasoning: 学生能对同一个角写两条分解式并相减。
    skill_ids:
