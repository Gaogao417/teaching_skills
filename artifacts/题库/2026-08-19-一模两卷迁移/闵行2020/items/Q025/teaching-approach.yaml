- id: t3
  title: 第(2)问：构全等 + 平行导比例建函数式
  author: migration-agent
  status: approved
  part_id: '2'
  goal: 作 $BH \perp CD$ 构造全等转移线段，由 $AD \parallel BH$ 导比例，解出 $y = \frac{x^{2} + 4}{x + 2}$（$0 < x \leq 2$）。
  entry_signal: 学生知道函数关系式要「设元 → 找等量 → 消元」。
  steps:
  - step_id: S1
    intent: 构造高线全等转移
    narration: 过点 $B$ 作 $BH \perp CD$ 于点 $H$，可证 $\triangle CAD \cong \triangle BCH$，得 $BH=CD=2$、$CH=AD=x$、$DH=2-x$。
    expected_student_reasoning: 学生能想到作高构造全等，把 BC 侧的量转到 CD 轴上。
    skill_ids:
    - SKILL-SMV-001
    - SKILL-SMV-008
  - step_id: S2
    intent: 平行导比例
    narration: $AD \parallel BH$ 得 $\frac{AD}{BH}=\frac{DE}{EH}$，即 $\frac{x}{2}=\frac{DE}{EH}$；合比得 $\frac{DH}{EH}=\frac{x+2}{2}$，解出 $EH=\frac{4-2x}{x+2}$。
    expected_student_reasoning: 学生能用合比性质把 DE/EH 转成 DH/EH。
    skill_ids:
    - SKILL-SMV-003
    - SKILL-SMV-007
  - step_id: S3
    intent: 合并成函数并定范围
    narration: $y=CE=CH+HE=x+\frac{4-2x}{x+2}$，整理得 $y = \frac{x^{2} + 4}{x + 2}$；由点 $E$ 在边 $CD$ 上得自变量范围 $0 < x \leq 2$。
    expected_student_reasoning: 学生能合并分式并说明范围来自 E 的位置约束。
    skill_ids:
    - SKILL-SMV-007
    common_errors:
    - 范围写成 0<x<2（漏端点）
