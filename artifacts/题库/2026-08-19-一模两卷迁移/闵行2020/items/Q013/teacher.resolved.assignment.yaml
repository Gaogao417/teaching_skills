    stem_latex: 已知正方形 $ABCD$ 的边长为 2，如果将线段 $BD$ 绕着点 $B$ 旋转后，点 $D$ 落在 $BC$ 的延长线上的点 $E$
      处，那么 $\tan\angle BAE=$______。
    answer: $\sqrt{2}$
    clue: $BE=BD=2\sqrt{2}$，$\angle ABE=90^\circ$，用正切定义 $\tan\angle BAE=\frac{BE}{AB}$
