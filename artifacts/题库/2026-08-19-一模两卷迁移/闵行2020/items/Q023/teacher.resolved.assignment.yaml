  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，在 $\triangle ABC$ 中，$BD$ 是 $AC$ 边上的高，点 $E$ 在边 $AB$ 上，联结 $CE$ 交
      $BD$ 于点 $O$，且 $AD \cdot OC = AB \cdot OD$，$AF$ 是 $\angle BAC$ 的平分线，交 $BC$ 于点
      $F$，交 $DE$ 于点 $G$。求证：(1) $CE \perp AB$；(2) $AF \cdot DE = AG \cdot BC$。
    answer: (1) $CE \perp AB$ 得证（见解答）；(2) $AF \cdot DE = AG \cdot BC$ 得证
    clue: (1) 由 $\frac{AD}{OD} = \frac{AB}{OC}$ 证 Rt$\triangle ADB \sim$ Rt$\triangle
      ODC$，再由三角形内角和证垂直；(2) 结合角平分线与相似三角形证比例式
    solution_steps:
    - (1) $\because AD \cdot OC = AB \cdot OD$，$\therefore \frac{AD}{OD} = \frac{AB}{OC}$
    - $\because BD$ 是 $AC$ 边上的高，$\therefore \angle BDC = 90^\circ$，$\triangle ADB$
      和 $\triangle ODC$ 是直角三角形，$\therefore$ Rt$\triangle ADB \sim$ Rt$\triangle ODC$，$\therefore
      \angle ABD = \angle OCD$
    - 又 $\because \angle EOB = \angle DOC$，$\angle DOC + \angle OCD + \angle ODC =
      180^\circ$，$\angle EOB + \angle ABD + \angle OEB = 180^\circ$，$\therefore \angle
      OEB = 90^\circ$
    - $\therefore CE \perp AB$
    - (2) 在 $\triangle DAE$ 和 $\triangle BAC$ 中，$\because \frac{AD}{AB} = \frac{AE}{AC}$，$\angle
      DAE = \angle BAC$，$\therefore \triangle DAE \sim \triangle BAC$；$\because AF$
      是 $\angle BAC$ 的平分线，$\therefore \frac{AG}{AF} = \frac{DE}{BC}$，即 $AF \cdot DE
      = AG \cdot BC$ .
