approaches:
- id: t1
  title: 双垂直交叉：等积式改比例配相似，再证垂直与比例式
  author: mvp-phase3-dogfood
  status: approved
  goal: 掌握"等积式 → 比例式 → 配相似三角形"的标准路径：先由 AD·OC=AB·OD 配出 Rt△ADB∽Rt△ODC 证 $CE \perp AB$，再用角平分线与相似转移证比例式。
  entry_signal: 见到 $AD \cdot OC = AB \cdot OD$ 先交叉改比例，再找夹角。
  steps:
  - step_id: S1
    intent: 等积式改比例，配 SAS 相似
    narration: 由 $AD \cdot OC = AB \cdot OD$ 得 $\frac{AD}{OD}=\frac{AB}{OC}$； 又 $\angle ADB=\angle ODC=90^\circ$，两边成比例且夹角相等， 所以 Rt$\triangle ADB \sim$ Rt$\triangle ODC$。
    expected_student_reasoning: 学生能先交叉改比例，再在图中找到以 D 为公共直角顶点的两个直角三角形配相似。
    accepted_alternatives: []
    common_errors:
    - 等积式不改比例直接硬找相似
    - 比例上下位写反
    skill_ids:
    - SKILL-SMV-008
    origin: manual
  - step_id: S2
    intent: 导角证 CE⊥AB
    narration: 由相似得角相等，结合对顶角与互余关系导角，推出 $\angle AEC=90^\circ$， 即证得 $CE \perp AB$。
    expected_student_reasoning: 学生能写全导角链条（相似对应角 → 互余 → 垂直），不跳步。
    accepted_alternatives:
    - 用等腰 + 三线合一另证垂直
    common_errors:
    - 8 字交叉结构里把对顶角当特征角
    - 导角跳步直接写结论
    skill_ids:
    - SKILL-SMV-006
    origin: manual
  - step_id: S3
    intent: 规划第二问比例式路线
    narration: 目标 $AF \cdot DE = AG \cdot BC$ 改写为 $\frac{AF}{AG}=\frac{BC}{DE}$； 由 $AF$ 平分 $\angle BAC$ 与第一问相似提供的角关系，找出分别含这四条边的相似三角形组， 两次比例相乘约分，即证 $AF \cdot DE = AG \cdot BC$。
    expected_student_reasoning: 学生能先改比例、再规划"哪两组相似各贡献哪条边"，而不是随机试三角形。
    accepted_alternatives: []
    common_errors:
    - 比例式不交叉就找相似
    - 第二问丢掉第一问的结论不用
    skill_ids:
    - SKILL-SMV-009
    - SKILL-SMV-007
    origin: manual
  steps_origin: manual
  polished_text: "先观察图形：在 $\\triangle ABC$ 中，$BD$ 是 $AC$ 边上的高，因此 $\\angle ADB = 90^\\circ$，$\\angle CDB = 90^\\circ$；点 $E$ 在 $AB$ 上，连接 $CE$，交 $BD$ 于点 $O$；已知条件为 $AD \\cdot OC = AB \\cdot OD$。  \n第一步：将已知等式 $AD \\cdot OC = AB \\cdot OD$ 改写为比例式 $\\frac{AD}{OD} = \\frac{AB}{OC}$。  \n第二步：注意到 $\\triangle ADB$ 和 $\\triangle ODC$ 都是直角三角形，且 $\\angle ADB = \\angle ODC = 90^\\circ$，又由上式得 $\\frac{AD}{OD} = \\frac{AB}{OC}$，即两组直角边对应成比例，因此 $\\triangle ADB \\sim \\triangle ODC$（SAS 相似）。  \n第三步：由相似得对应角相等，即 $\\angle ABD = \\angle OCD$；又 $\\angle EOB = \\angle DOC$（对顶角相等），在 $\\triangle EOB$ 中，$\\angle EOB + \\angle ABD + \\angle OEB = 180^\\circ$；在 $\\triangle ODC$ 中，$\\angle DOC + \\angle OCD + \\angle ODC = 180^\\circ$；将前两式中的等角代入，可得 $\\angle OEB = \\angle ODC = 90^\\circ$；所以 $CE \\perp AB$。  \n\n再看第（2）问：$AF$ 是 $\\angle BAC$ 的平分线，交 $BC$ 于点 $F$，交 $DE$ 于点 $G$；要证 $AF \\cdot DE = AG \\cdot BC$。  \n第一步：将待证等式改写为比例式 $\\frac{AG}{AF} = \\frac{DE}{BC}$。  \n第二步：观察 $\\triangle DAE$ 与 $\\triangle BAC$，发现 $\\angle DAE =\
    \ \\angle BAC$（公共角），再结合第（1）问结论 $CE \\perp AB$ 可推出 $\\angle AED = \\angle ACB$，从而 $\\triangle DAE \\sim \\triangle BAC$（AA 相似），于是有 $\\frac{DE}{BC} = \\frac{AD}{AB} = \\frac{AE}{AC}$。  \n第三步：由于 $AF$ 平分 $\\angle BAC$，且 $G$ 是 $AF$ 与 $DE$ 的交点，在相似三角形 $\\triangle DAE$ 和 $\\triangle BAC$ 中，对应角平分线之比等于相似比，即 $\\frac{AG}{AF} = \\frac{DE}{BC}$；因此 $AF \\cdot DE = AG \\cdot BC$。"
