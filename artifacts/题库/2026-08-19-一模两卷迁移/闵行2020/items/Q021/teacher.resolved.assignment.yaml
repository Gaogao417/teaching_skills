  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，梯形 $ABCD$ 中，$AD\parallel BC$，$\angle ADC = 90^\circ$，$AD = 2$，$BC
      = 4$，$\tan B = 3$。以 $AB$ 为直径作 $\odot O$，交边 $DC$ 于 $E$、$F$ 两点。(1) 求证：$DE = CF$；(2)
      求直径 $AB$ 的长。
    answer: (1) $DE = CF$（证明见解答）；(2) $AB = 2\sqrt{10}$
    clue: (1) 过圆心作 $DC$ 的垂线，用平行线等分与垂径定理；(2) 过 $A$ 作 $BC$ 的垂线，在 Rt$\triangle AGB$ 中用
      $\tan B$ 及勾股定理
    solution_steps:
    - (1) 过点 $O$ 作 $OH \perp DC$，垂足为 $H$
    - $\because AD \parallel BC$，$\angle ADC = 90^\circ$，$OH \perp DC$，$\therefore
      \angle BCD = \angle OHC = \angle ADC = 90^\circ$，$\therefore AD \parallel OH
      \parallel BC$
    - 又 $\because OA = OB$，$\therefore DH = HC$
    - $\because OH \perp DC$，$OH$ 过圆心，$\therefore EH = HF$
    - $\therefore DH - EH = HC - HF$，即 $DE = CF$
    - (2) 过点 $A$ 作 $AG \perp BC$，垂足为点 $G$，$\angle AGB = 90^\circ$；$\because \angle
      AGB = \angle BCD = 90^\circ$，$\therefore AG \parallel DC$
    - $\because AD \parallel BC$，$\therefore AD = CG$；$\because AD = 2$，$BC = 4$，$\therefore
      BG = BC - CG = 2$
    - 在 Rt$\triangle AGB$ 中，$\because \tan B = 3$，$\therefore AG = BG \cdot \tan B
      = 2 \times 3 = 6$
    - 在 Rt$\triangle AGB$ 中，$AB^2 = AG^2 + BG^2$，$\therefore AB = 2\sqrt{10}$
