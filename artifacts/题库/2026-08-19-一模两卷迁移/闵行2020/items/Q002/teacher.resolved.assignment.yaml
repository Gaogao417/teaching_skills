    id: Q002
    points: 4
    stem_latex: 已知 $P$ 是线段 $AB$ 的黄金分割点，且 $AP > BP$，那么下列比例式能成立的是（　）
    choices:
    - $\frac{AB}{AP} = \frac{AP}{BP}$
    - $\frac{AB}{AP} = \frac{BP}{AB}$
    - $\frac{BP}{AP} = \frac{AB}{BP}$
    - $\frac{AB}{AP} = \frac{\sqrt{5}-1}{2}$
    answer: A
    clue: 黄金分割点分线段时较长段是全线段与较短段的比例中项
