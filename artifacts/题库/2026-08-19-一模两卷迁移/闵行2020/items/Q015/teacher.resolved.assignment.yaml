    stem_latex: '设抛物线 $l: y=ax^{2}+bx+c$（$a \neq 0$）的顶点为 $D$，与 $y$ 轴的交点是 $C$，我们称以
      $C$ 为顶点，且过点 $D$ 的抛物线为抛物线 $l$ 的“伴随抛物线”，请写出抛物线 $y=x^{2}-4x+1$ 的伴随抛物线的解析式______。'
    answer: $y = -x^{2} + 1$
    clue: 原抛物线顶点 $D(2,-3)$，$y$ 轴交点 $C(0,1)$，待定系数求以 $C$ 为顶点且过 $D$ 的抛物线
