  - type: choice
    id: Q005
    points: 4
    stem_latex: 下列命题是真命题的是（　）
    choices:
    - 经过平面内任意三点可作一个圆
    - 相等的圆心角所对的弧一定相等
    - 相交两圆的公共弦一定垂直于两圆的连心线
    - 内切两圆的圆心距等于两圆的半径的和
    answer: C
    clue: 逐项判断：三点共线时不能确定圆；等弧需在同圆或等圆中；连心线垂直平分公共弦；内切时圆心距等于半径之差
