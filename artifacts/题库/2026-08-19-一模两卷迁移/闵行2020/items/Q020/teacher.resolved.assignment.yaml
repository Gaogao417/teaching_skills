    id: Q020
    points: 10
    stem_latex: '已知：在平行四边形 $ABCD$ 中，$AB : BC = 3 : 2$。(1) 根据条件画图：作 $\angle BCD$ 的平分线，交边
      $AB$ 于点 $E$，取线段 $BE$ 的中点 $F$，联结 $DF$ 交 $CE$ 于点 $G$；(2) 设 $AB = \vec{a}$，$AD
      = \vec{b}$，那么向量 $\vec{CG} =$______（用向量 $\vec{a}$、$\vec{b}$ 表示），并在图中画出向量 $\vec{DG}$
      在向量 $AB$ 和 $AD$ 方向上的分向量。'
    answer: (1) 作图见解答；(2) $\vec{CG} = -\frac{1}{2}\vec{a} - \frac{3}{4}\vec{b}$
    clue: 按角平分线与中点条件作图，再利用平面向量的线性运算与分解
    solution_steps:
    - (1) 作 $\angle BCD$ 的平分线交边 $AB$ 于点 $E$，取线段 $BE$ 的中点 $F$，联结 $DF$ 交 $CE$ 于点 $G$（画图整体正确）
    - (2) $\vec{CG} = -\frac{1}{2}\vec{a} - \frac{3}{4}\vec{b}$
    - 画图及结论正确
