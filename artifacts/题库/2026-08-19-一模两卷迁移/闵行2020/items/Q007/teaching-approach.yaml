approaches:
- id: t1
  title: 比例中项：定义 → 代入 → 开方取正
  author: mvp-phase3-dogfood
  status: approved
  goal: 巩固比例中项的定义性计算：b²=ac，代入后开平方并按线段取正值。
  entry_signal: 看到「比例中项」四个字，直接写平方关系。
  steps:
  - step_id: S1
    intent: 定义回忆
    narration: 比例中项定义：$b^2=ac$（即 $\frac{a}{b}=\frac{b}{c}$），本题即求 满足 $b^2=4\times 9$ 的线段 $b$。
    expected_student_reasoning: 学生能默写比例中项的两种等价表达并选用平方形式。
    accepted_alternatives: []
    common_errors:
    - 与算术平均数混淆
    skill_ids:
    - SKILL-SMV-001
    origin: manual
  - step_id: S2
    intent: 代入计算
    narration: 代入 $a=4$、$c=9$，$b^2=36$。
    expected_student_reasoning: 学生能正确完成乘法 4×9=36。
    accepted_alternatives: []
    common_errors:
    - 乘法口误成 35
    skill_ids:
    - SKILL-SMV-007
    origin: manual
  - step_id: S3
    intent: 开方取正值
    narration: $b=\sqrt{36}$，线段长度取正值，得比例中项为 $6$ 厘米。
    expected_student_reasoning: 学生能说明为什么开方后只取正值（线段长非负且非零）。
    accepted_alternatives: []
    common_errors:
    - 写出 ±6 忘记取舍
    skill_ids:
    - SKILL-SMV-007
    origin: manual
  steps_origin: manual
  polished_text: "先看题干：已知线段 $a=4$ 厘米，$c=9$ 厘米，要求线段 $a$ 和 $c$ 的比例中项。  \n再回忆定义：若线段 $b$ 是 $a$ 与 $c$ 的比例中项，则满足 $b^2 = a \\cdot c$。  \n然后代入已知数据：$b^2 = 4 \\times 9 = 36$。  \n接着对等式两边开平方：$b = \\sqrt{36}$。  \n最后注意线段长度必须为正数，所以取正值，得 $b = 6$ 厘米。  \n特别提醒：比例中项是几何概念，不是算术平均数；开方后只取正根，不可写 $b = \\pm 6$。"
