      transcript: 这道填空题考比例中项，线段 r 等于四厘米，c 等于九厘米，求它们的比例中项。第一步回忆定义，如果 b 是 r 和 c 的比例中项，那么 b 的平方等于 r 乘 c。第二步代入，r 乘 c 等于4×9=36。第三步开平方，注意线段长度取正值，所以比例中项是六厘米。这类题最容易错的就是开方后带了负值，或者把比例中项和平均数混淆。
