        libraries: []
    - title: 解第二组相似
      content: 由 $AF\parallel EP$，得 $\triangle DAF\sim\triangle DPB$（AA），结合第一组的份数得 $BP$ 占 $2$ 份、$PE$ 占 $1$ 份。
      diagram_col:
