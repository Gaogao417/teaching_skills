        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:2f038ea5e18ba0a2ae10f25f669237e84e12c5d5e071fdfd9823afbb9d1f976c
        packages:
        - tikz
        libraries: []
    - title: 比较份数，写出答案
      content: 直接比较图中所求两条边的份数并化简，因此 $AP:PD=4:3$。
