    id: Q006
    points: 10
    label: 由两组对应边比求 AP:PD
    stem_latex: 如图，点 $D$ 在线段 $BC$ 上，点 $E$ 在线段 $AC$ 上，$AD$ 与 $BE$ 交于点 $P$。已知 $AE:EC=2:3$，$BP:PE=5:2$，求
      $AP:PD$。
    answer_space:
      type: steps
      height: 36mm
      step_count: 4
    answer: $AP:PD=4:3$。
    explanation: 第一组相似标共同边，第二组沿用它，只给另一条目标边新增份数。
    solution_steps:
    - title: 作辅助线
      content: 过 A 作 AF 平行 EP，交直线 BC 于 F。蓝字标出题目给出的两组比。
