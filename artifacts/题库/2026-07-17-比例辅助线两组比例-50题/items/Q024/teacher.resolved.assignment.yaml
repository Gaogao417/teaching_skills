    - title: 解第二组A字
      content: 由蓝色已知比解 A字 $\triangle EFP\sim\triangle ECB$。保留前一步全部份数，本步用绿色补出 $BC=10$
        份，$BD=5$ 份，使所求两边的份数同时显示。
      diagram_col:
        kind: tikz
