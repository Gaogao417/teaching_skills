        width: 60mm
        caption: 解第二组8字：已有份数保持不变；本步补出绿色 BP=6份、PE=5份，所求两边均已标清。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:d3a317a64a4890f7650c337ba98882ad0720ea95e4f23577f8afaf2de5aadff3
        packages:
        - tikz
        libraries: []
    - title: 比较份数写出结论
      content: 比较所求两条边的份数并化简，得 $BP:PE=6:5$。
