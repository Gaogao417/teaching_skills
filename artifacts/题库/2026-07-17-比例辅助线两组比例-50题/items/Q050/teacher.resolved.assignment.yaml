        width: 60mm
        caption: 解第一组A字：沿用已标边，只新增 EF=5/3份。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:dd87a0a4eb2898492dc1d64f8a53b5151c05fbb889817f770f55ff2bdf401734
        packages:
        - tikz
        libraries: []
    - title: 解第二组相似
      content: 由 $EF\parallel CB$，得 $\triangle PEF\sim\triangle PBD$（AA），结合第一组的份数得 $BP$ 占 $6$ 份、$PE$ 占 $5$ 份。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q050-model2/rendered/solution.fragment.tex
        diagram_ref: question_bank.auxiliary50.q050.model2
