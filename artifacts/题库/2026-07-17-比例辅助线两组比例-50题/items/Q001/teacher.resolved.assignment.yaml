        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:79d45ae8e21020f0da1a2e17484e79c26c992f50b22658117cbcbd7e21534fe8
        packages:
        - tikz
        libraries: []
    - title: 比较份数写出结论
      content: 比较所求两条边的份数并化简，得 $AP:PD=2:1$。
