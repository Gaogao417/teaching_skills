        libraries: []
    - title: 解第二组相似
      content: 由 $CF\parallel AD$，得 $\triangle BDP\sim\triangle BCF$（AA），结合第一组的份数得 $PD$ 占 $\frac{1}{2}$ 份。
      diagram_col:
        kind: tikz
