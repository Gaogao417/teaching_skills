    - title: 解第二组8字
      content: 由蓝色已知比解 8字 $\triangle PEF\sim\triangle PBD$。保留前一步全部份数，本步用绿色补出 $BP=8$
        份，$PE=5$ 份，使所求两边的份数同时显示。
      diagram_col:
