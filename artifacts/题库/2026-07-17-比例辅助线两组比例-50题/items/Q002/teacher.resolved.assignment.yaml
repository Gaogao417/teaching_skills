        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:dcfc5546b383d3da2a1afb62a1a286800e2fb0bde866270eb88e6ae27154e154
        packages:
        - tikz
        libraries: []
    - title: 比较份数，写出答案
      content: 直接比较图中所求两条边的份数并化简，因此 $BP:PE=8:5$。
