    - title: 解第二组相似
      content: 由 $CF\parallel AD$，得 $\triangle EAP\sim\triangle ECF$（AA），结合第一组的份数得 $AE$ 占 $5$ 份、$EC$ 占 $4$ 份。
      diagram_col:
