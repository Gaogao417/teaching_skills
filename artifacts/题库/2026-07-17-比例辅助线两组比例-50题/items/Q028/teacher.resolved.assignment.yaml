        width: 60mm
        caption: 解第二组A字：已有份数保持不变；本步补出绿色 BP=1/3份、PE=2/3份，所求两边均已标清。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:65dca6c593755b2c10e3c98021191d4acf7ef421cbe35a9f067e60d69ba1a327
        packages:
        - tikz
        libraries: []
    - title: 比较份数，写出答案
      content: 直接比较图中所求两条边的份数并化简，因此 $BP:PE=1:2$。
