        - tikz
        libraries: []
    - title: 解第二组A字
      content: 由蓝色已知比解 A字 $\triangle DAF\sim\triangle DPB$。保留前一步全部份数，本步用绿色补出 $BP=\frac{1}{3}$
        份，$PE=\frac{2}{3}$ 份，使所求两边的份数同时显示。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q028-model2/rendered/solution.fragment.tex
