    id: Q005
    points: 10
    label: 由两组对应边比求 BD:DC
    stem_latex: 如图，点 $D$ 在线段 $BC$ 上，点 $E$ 在线段 $AC$ 上，$AD$ 与 $BE$ 交于点 $P$。已知 $AE:EC=1:1$，$BP:PE=3:2$，求
      $BD:DC$。
    answer_space:
      type: steps
      height: 36mm
      step_count: 4
    answer: $BD:DC=3:4$。
    explanation: 第一组相似标共同边，第二组沿用它，只给另一条目标边新增份数。
    solution_steps:
    - title: 作平行辅助线
      content: 过 $E$ 作 $EF\parallel CB$，交直线 $AD$ 于 $F$。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q005-helper/rendered/solution.fragment.tex
        diagram_ref: question_bank.auxiliary50.q005.helper
        diagram_job_id: question_bank-auxiliary50-q005-helper
        width: 60mm
        caption: 蓝字标出题目给出的两组比；先完成辅助线。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:65ff7a1fc3e022b68b5fbf0818dabe49f208fc675caf5f19388acdcffae61bbe
        packages:
        - tikz
        libraries: []
    - title: 解第一组相似
      content: 由 $EF\parallel CB$，得 $\triangle AEF\sim\triangle ACD$（AA），故 $EF:DC=1:2$。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q005-model1/rendered/solution.fragment.tex
        diagram_ref: question_bank.auxiliary50.q005.model1
        diagram_job_id: question_bank-auxiliary50-q005-model1
        width: 60mm
        caption: 解第一组A字：两条边都未标，补出一对红色份数。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:20115be31d02c83e10e8a8bb97016ec72260b631a072d0c544ab285c5ec1a663
        packages:
        - tikz
        libraries: []
    - title: 解第二组相似
      content: 由 $EF\parallel CB$，得 $\triangle PEF\sim\triangle PBD$（AA），结合第一组的份数得 $BD$ 占 $\frac{3}{2}$ 份。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q005-model2/rendered/solution.fragment.tex
        diagram_ref: question_bank.auxiliary50.q005.model2
        diagram_job_id: question_bank-auxiliary50-q005-model2
        width: 60mm
        caption: 解第二组8字：已有份数保持不变；本步补出绿色 BD=3/2份，所求两边均已标清。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:28562e26e3d7ded4116c418b2edc5663a6bc2d46d35fcd681a4dd62af3052cf9
        packages:
        - tikz
        libraries: []
    - title: 比较份数写出结论
      content: 比较所求两条边的份数并化简，得 $BD:DC=3:4$。
