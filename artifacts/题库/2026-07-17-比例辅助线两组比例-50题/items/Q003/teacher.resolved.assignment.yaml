    label: 由两组对应边比求 BD:DC
    stem_latex: 如图，点 $D$ 在线段 $BC$ 上，点 $E$ 在线段 $AC$ 上，$AD$ 与 $BE$ 交于点 $P$。已知 $AE:EC=3:4$，$AP:PD=3:2$，求
      $BD:DC$。
    answer_space:
      type: steps
      height: 36mm
      step_count: 4
    answer: $BD:DC=1:1$。
    explanation: 第一组相似标共同边，第二组沿用它，只给另一条目标边新增份数。
    solution_steps:
    - title: 作平行辅助线
      content: 过 $C$ 作 $CF\parallel AD$，交直线 $BE$ 于 $F$。
