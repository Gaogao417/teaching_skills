        packages:
        - tikz
        libraries: []
    - title: 解第一组相似
      content: 由 $EF\parallel CB$，得 $\triangle PEF\sim\triangle PBD$（AA），得 $EF$ 占 $\frac{5}{2}$ 份。
      diagram_col:
        kind: tikz
        tikz_code: ''
