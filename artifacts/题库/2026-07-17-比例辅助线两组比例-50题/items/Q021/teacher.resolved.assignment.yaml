        width: 60mm
        caption: 解第二组A字：已有份数保持不变；本步补出绿色 AE=1份、EC=1份，所求两边均已标清。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:869e5378fba80bd47194fdb58d1b8ae60e0bb0690e408b669a002d89d2ffc56e
        packages:
        - tikz
        libraries: []
    - title: 比较份数写出结论
      content: 比较所求两条边的份数并化简，得 $AE:EC=1:1$。
