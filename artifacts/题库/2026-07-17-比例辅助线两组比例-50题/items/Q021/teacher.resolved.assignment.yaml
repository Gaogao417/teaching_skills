        diagram_job_id: question_bank-auxiliary50-q021-model1
        width: 60mm
        caption: 解第一组8字：沿用已标边，只新增 EF=5/2份。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:915518a87cb2b50c26f5030879411dd97c169ca1b100a988e5f831969dd514d9
        packages:
        - tikz
        libraries: []
    - title: 解第二组相似
      content: 由 $EF\parallel CB$，得 $\triangle AEF\sim\triangle ACD$（AA），结合第一组的份数得 $AE$ 占 $1$ 份、$EC$ 占 $1$ 份。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q021-model2/rendered/solution.fragment.tex
