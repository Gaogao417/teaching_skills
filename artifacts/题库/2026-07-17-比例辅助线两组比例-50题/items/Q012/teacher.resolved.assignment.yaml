    id: Q012
    points: 10
    label: 由两组对应边比求 BD:DC
    stem_latex: 如图，点 $D$ 在线段 $BC$ 上，点 $E$ 在线段 $AC$ 上，$AD$ 与 $BE$ 交于点 $P$。已知 $AP:PD=3:1$，$BP:PE=5:3$，求
      $BD:DC$。
    answer_space:
      type: steps
      height: 36mm
      step_count: 4
    answer: $BD:DC=1:1$。
    explanation: 第一组相似标共同边，第二组沿用它，只给另一条目标边新增份数。
    solution_steps:
    - title: 作平行辅助线
      content: 过 $P$ 作 $PF\parallel DB$，交直线 $AC$ 于 $F$。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q012-helper/rendered/solution.fragment.tex
        diagram_ref: question_bank.auxiliary50.q012.helper
        diagram_job_id: question_bank-auxiliary50-q012-helper
        width: 60mm
        caption: 蓝字标出题目给出的两组比；先完成辅助线。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:b2acfdafce8c3264258ab05d0d87f663f9e768a1946bfc834c0cf779ce6cac7e
        packages:
        - tikz
        libraries: []
    - title: 解第一组相似
      content: 由 $PF\parallel DB$，得 $\triangle APF\sim\triangle ADC$（AA），故 $PF:DC=3:4$。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q012-model1/rendered/solution.fragment.tex
        diagram_ref: question_bank.auxiliary50.q012.model1
        diagram_job_id: question_bank-auxiliary50-q012-model1
        width: 60mm
        caption: 解第一组A字：两条边都未标，补出一对红色份数。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:7030fd31877fdd7b7d3a29a2fb00f52c7a97fa65da3ede5ff446f57b14b6e46d
        packages:
        - tikz
        libraries: []
    - title: 解第二组相似
      content: 由 $PF\parallel DB$，得 $\triangle EFP\sim\triangle ECB$（AA），结合第一组的份数得 $BC$ 占 $8$ 份、$BD$ 占 $4$ 份。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q012-model2/rendered/solution.fragment.tex
        diagram_ref: question_bank.auxiliary50.q012.model2
        diagram_job_id: question_bank-auxiliary50-q012-model2
        width: 60mm
        caption: 解第二组A字：已有份数保持不变；本步补出绿色 BC=8份、BD=4份，所求两边均已标清。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:1471af560c13fcedcb65697a5d60ac2907ea2edaee6d500e2c4d0ddb24dc5311
        packages:
        - tikz
        libraries: []
    - title: 比较份数写出结论
      content: 比较所求两条边的份数并化简，得 $BD:DC=1:1$。
