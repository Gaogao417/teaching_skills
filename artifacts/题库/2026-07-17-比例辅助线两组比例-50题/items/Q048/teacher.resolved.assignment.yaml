    id: Q048
    points: 10
    label: 由两组对应边比求 BD:DC
    stem_latex: 如图，点 $D$ 在线段 $BC$ 上，点 $E$ 在线段 $AC$ 上，$AD$ 与 $BE$ 交于点 $P$。已知 $AP:PD=5:1$，$BP:PE=3:5$，求
      $BD:DC$。
    answer_space:
      type: steps
      height: 36mm
      step_count: 4
    answer: $BD:DC=1:3$。
    explanation: 第一组相似标共同边，第二组沿用它，只给另一条目标边新增份数。
    solution_steps:
    - title: 作平行辅助线
      content: 过 $P$ 作 $PF\parallel DB$，交直线 $AC$ 于 $F$。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q048-helper/rendered/solution.fragment.tex
        diagram_ref: question_bank.auxiliary50.q048.helper
        diagram_job_id: question_bank-auxiliary50-q048-helper
        width: 60mm
        caption: 蓝字标出题目给出的两组比；先完成辅助线。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:69d3b6117065d7a86b9db634d38ab9d1088c9841ac328d58ede34ee93bedecaf
        packages:
        - tikz
        libraries: []
    - title: 解第一组相似
      content: 由 $PF\parallel DB$，得 $\triangle APF\sim\triangle ADC$（AA），故 $PF:DC=5:6$。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q048-model1/rendered/solution.fragment.tex
        diagram_ref: question_bank.auxiliary50.q048.model1
        diagram_job_id: question_bank-auxiliary50-q048-model1
        width: 60mm
        caption: 解第一组A字：两条边都未标，补出一对红色份数。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:e67a06d534592e261d0a86c6e4b3b4584526acbb3b01f2f119881e234f85d234
        packages:
        - tikz
        libraries: []
    - title: 解第二组相似
      content: 由 $PF\parallel DB$，得 $\triangle EFP\sim\triangle ECB$（AA），结合第一组的份数得 $BC$ 占 $8$ 份、$BD$ 占 $2$ 份。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q048-model2/rendered/solution.fragment.tex
        diagram_ref: question_bank.auxiliary50.q048.model2
        diagram_job_id: question_bank-auxiliary50-q048-model2
        width: 60mm
        caption: 解第二组A字：已有份数保持不变；本步补出绿色 BC=8份、BD=2份，所求两边均已标清。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:4732e321a6b3c8a5d6855167970b748896ae035447d76a1424ba0ed6a8d6ae91
        packages:
        - tikz
        libraries: []
    - title: 比较份数写出结论
      content: 比较所求两条边的份数并化简，得 $BD:DC=1:3$。
