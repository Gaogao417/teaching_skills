    id: Q031
    points: 10
    label: 由两组对应边比求 AE:EC
    stem_latex: 如图，点 $D$ 在线段 $BC$ 上，点 $E$ 在线段 $AC$ 上，$AD$ 与 $BE$ 交于点 $P$。已知 $BD:DC=3:2$，$AP:PD=4:3$，求
      $AE:EC$。
    answer_space:
      type: steps
      height: 36mm
      step_count: 4
    answer: $AE:EC=4:5$。
    explanation: 第一组相似标共同边，第二组沿用它，只给另一条目标边新增份数。
