        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:d58f828a1a4d1f682ef73a7179a7f3879f6c30962b57e14725cc49988a8ec1d7
        packages:
        - tikz
        libraries: []
    - title: 比较份数，写出答案
      content: 直接比较图中所求两条边的份数并化简，因此 $BP:PE=1:1$。
