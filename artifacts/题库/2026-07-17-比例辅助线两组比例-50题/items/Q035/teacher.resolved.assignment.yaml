      content: 由蓝色已知比解 A字 $\triangle CAF\sim\triangle CEB$。保留前一步全部份数，本步用绿色补出 $BE=3$
        份，$AE=1$ 份，$EC=2$ 份，使所求两边的份数同时显示。
