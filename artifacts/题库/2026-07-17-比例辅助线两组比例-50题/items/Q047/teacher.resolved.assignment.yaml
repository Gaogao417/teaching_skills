        width: 60mm
        caption: 解第二组A字：已有份数保持不变；本步补出绿色 BE=6份、AE=1份、EC=3份，所求两边均已标清。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:30085e7ff2363638eba60e268eaf992c82374b04086ef9f5b449c0235700610d
        packages:
        - tikz
        libraries: []
    - title: 比较份数写出结论
      content: 比较所求两条边的份数并化简，得 $AE:EC=1:3$。
