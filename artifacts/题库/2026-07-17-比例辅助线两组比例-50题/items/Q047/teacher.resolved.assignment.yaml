        width: 60mm
        caption: 解第一组A字：沿用已标边，只新增 AF=8份。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:f775d89d3f8545a243de9b602e327138ab1072c9af18567c3c4474596da918da
        packages:
