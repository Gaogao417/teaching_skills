        libraries: []
    - title: 解第二组相似
      content: 由 $AF\parallel EP$，得 $\triangle CAF\sim\triangle CEB$（AA），结合第一组的份数得 $BE$ 占 $6$ 份、$AE$ 占 $1$ 份、$EC$ 占 $3$ 份。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q047-model2/rendered/solution.fragment.tex
