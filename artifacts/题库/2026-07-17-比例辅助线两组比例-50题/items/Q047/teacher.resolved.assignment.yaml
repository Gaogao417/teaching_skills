        artifact_hash: sha256:815f64372051efed2052a067acda94804f53b06623fb0c737fce4749f349b7d7
        packages:
        - tikz
        libraries: []
    - title: 解第一组相似
      content: 由 $AF\parallel EP$，得 $\triangle DAF\sim\triangle DPB$（AA），得 $AF$ 占 $8$ 份。
      diagram_col:
        kind: tikz
        tikz_code: ''
