    - title: 解第二组A字
      content: 由蓝色已知比解 A字 $\triangle DAF\sim\triangle DPB$。保留前一步全部份数，本步用绿色补出 $AP=2$
        份，$PD=1$ 份，使所求两边的份数同时显示。
      diagram_col:
        kind: tikz
