        width: 60mm
        caption: 解第二组A字：已有份数保持不变；本步补出绿色 BP=4/7份、PE=3/7份，所求两边均已标清。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:d2140b0138acc3e9b66547a73112fb0b6a47ef30fcd79f6528e6f67914dd01ea
        packages:
        - tikz
        libraries: []
    - title: 比较份数，写出答案
      content: 直接比较图中所求两条边的份数并化简，因此 $BP:PE=4:3$。
