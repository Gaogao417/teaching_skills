        diagram_job_id: question_bank-auxiliary50-q045-model1
        width: 60mm
        caption: 解第一组8字：沿用已标边，只新增 EF=4/3份。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:53956d5f7828122baf272dd7b270bd4ae789da2d2aecab3a085d05a3f82e37aa
        packages:
        - tikz
        libraries: []
    - title: 解第二组相似
      content: 由 $EF\parallel CB$，得 $\triangle AEF\sim\triangle ACD$（AA），结合第一组的份数得 $AE$ 占 $4$ 份、$EC$ 占 $5$ 份。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q045-model2/rendered/solution.fragment.tex
        diagram_ref: question_bank.auxiliary50.q045.model2
