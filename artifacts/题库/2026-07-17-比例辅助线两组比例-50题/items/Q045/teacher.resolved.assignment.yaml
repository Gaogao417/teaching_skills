    id: Q045
    points: 10
    label: 由两组对应边比求 AE:EC
    stem_latex: 如图，点 $D$ 在线段 $BC$ 上，点 $E$ 在线段 $AC$ 上，$AD$ 与 $BE$ 交于点 $P$。已知 $BD:DC=1:3$，$BP:PE=3:4$，求
      $AE:EC$。
    answer_space:
      type: steps
      height: 36mm
      step_count: 4
    answer: $AE:EC=4:5$。
    explanation: 第一组相似标共同边，第二组沿用它，只给另一条目标边新增份数。
    solution_steps:
    - title: 作平行辅助线
      content: 过 $E$ 作 $EF\parallel CB$，交直线 $AD$ 于 $F$。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q045-helper/rendered/solution.fragment.tex
        diagram_ref: question_bank.auxiliary50.q045.helper
        diagram_job_id: question_bank-auxiliary50-q045-helper
        width: 60mm
        caption: 蓝字标出题目给出的两组比；先完成辅助线。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:ab16255a172c958f3423bcb5bc912faeb34ed0d69130fa0258b04424e01a4518
        packages:
        - tikz
        libraries: []
    - title: 解第一组相似
      content: 由 $EF\parallel CB$，得 $\triangle PEF\sim\triangle PBD$（AA），得 $EF$ 占 $\frac{4}{3}$ 份。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/question_bank-auxiliary50-q045-model1/rendered/solution.fragment.tex
