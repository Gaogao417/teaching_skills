        width: 60mm
        caption: 解第二组A字：已有份数保持不变；本步补出绿色 AE=4份、EC=5份，所求两边均已标清。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:d92646145e46c6236773a4cc227b7854dee46ab5159cd25225e0cfb64a0d9980
        packages:
        - tikz
        libraries: []
    - title: 比较份数写出结论
      content: 比较所求两条边的份数并化简，得 $AE:EC=4:5$。
