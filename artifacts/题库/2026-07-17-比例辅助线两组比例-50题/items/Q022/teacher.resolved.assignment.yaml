        libraries: []
    - title: 解第二组相似
      content: 由 $PF\parallel DB$，得 $\triangle APF\sim\triangle ADC$（AA），结合第一组的份数得 $AP$ 占 $7$ 份、$PD$ 占 $5$ 份。
      diagram_col:
        kind: tikz
