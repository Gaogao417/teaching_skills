        page_number: 35
      - page_image: documents/初三/2014届-上海市徐汇区-初三一模数学-试卷及参考答案/word/pages/036.png
        page_number: 36
    block:
      stem_latex: 在 $\triangle ABC$ 中，$D$ 是 $BC$ 的中点，且 $AD=AC$，$DE \perp BC$，与 $AB$ 相交于点 $E$，$EC$ 与 $AD$ 相交于点 $F$。（1）求证：$\triangle ABC\sim\triangle FCD$；（2）若 $DE=3$，$BC=8$，求 $\triangle FCD$ 的面积。
      answer: $S_{\triangle FCD}=\frac{9}{2}$
      clue: 相似三角形的判定与性质、等腰三角形
      solution_steps:
      - (1) $\because D$ 是 $BC$ 的中点，$DE\perp BC$，$\therefore BE=CE$，$\therefore \angle B=\angle DCF$；$\because AD=AC$，$\therefore \angle FDC=\angle ACB$，$\therefore \triangle ABC\sim\triangle FCD$
      - (2) 过 $A$ 作 $AG\perp CD$ 于 $G$，$\because AD=AC$，$\therefore DG=CG$，$BD:BG=2:3$；$\because ED\perp BC$，$\therefore ED\parallel AG$，$\triangle BDE\sim\triangle BGA$，$ED:AG=BD:BG=2:3$，$\because DE=3$，$\therefore AG=\frac{9}{2}$
      - $S_{\triangle ABC}=\frac{1}{2}\times BC\times AG=\frac{1}{2}\times 8\times\frac{9}{2}=18$，$\because \triangle ABC\sim\triangle FCD$，$BC=2CD$，$\frac{S_{\triangle FCD}}{S_{\triangle ABC}}=(\frac{CD}{BC})^2=\frac{1}{4}$，$\therefore S_{\triangle FCD}=\frac{1}{4}\times 18=\frac{9}{2}$。
