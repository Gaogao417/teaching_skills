    official_solution:
      start_anchor: $\overrightarrow{AF}=\frac{1}{2}\overrightarrow{b}$
      end_anchor: $\overrightarrow{BM}$ 与 $\overrightarrow{BN}$ 即为所求
      word_evidence:
      - page_image: documents/初三/2014届-上海市徐汇区-初三一模数学-试卷及参考答案/word/pages/029.png
        page_number: 29
      - page_image: documents/初三/2014届-上海市徐汇区-初三一模数学-试卷及参考答案/word/pages/030.png
        page_number: 30
    block:
      stem_latex: 如图，点 $D$、$E$ 分别在 $\triangle ABC$ 的边 $BA$、$CA$ 的延长线上，且 $DE \parallel BC$，$\frac{AE}{AC}=\frac{1}{2}$，$F$ 为 $AC$ 的中点。（1）设 $\overrightarrow{BF}=\overrightarrow{a}$，$\overrightarrow{AC}=\overrightarrow{b}$，试用 $x\overrightarrow{a}+y\overrightarrow{b}$ 的形式表示 $\overrightarrow{AB}$、$\overrightarrow{ED}$；（2）作出 $\overrightarrow{BF}$ 在 $\overrightarrow{BA}$、$\overrightarrow{BC}$ 上的分向量。
      answer: （1）$\overrightarrow{AB}=\frac{1}{2}\overrightarrow{b}-\overrightarrow{a}$，$\overrightarrow{ED}=\frac{1}{2}\overrightarrow{a}+\frac{1}{4}\overrightarrow{b}$；（2）过 $F$ 作 $FN\parallel AB$、$FM\parallel BC$ 得分向量 $\overrightarrow{BM}$、$\overrightarrow{BN}$
      clue: 平面向量的三角形法则与平行四边形法则
      solution_steps:
      - (1) $\because \overrightarrow{AC}=\overrightarrow{b}$，$F$ 为 $AC$ 的中点，$\therefore \overrightarrow{AF}=\frac{1}{2}\overrightarrow{b}$
      - $\because \overrightarrow{BF}=\overrightarrow{a}$，$\therefore \overrightarrow{AB}=\overrightarrow{AF}-\overrightarrow{BF}=\frac{1}{2}\overrightarrow{b}-\overrightarrow{a}$，$\overrightarrow{BC}=\overrightarrow{BF}+\overrightarrow{FC}=\overrightarrow{a}+\frac{1}{2}\overrightarrow{b}$
      - $\because DE\parallel BC$，$\frac{AE}{AC}=\frac{1}{2}$，$\therefore \overrightarrow{ED}=\frac{1}{2}\overrightarrow{BC}=\frac{1}{2}(\overrightarrow{a}+\frac{1}{2}\overrightarrow{b})=\frac{1}{2}\overrightarrow{a}+\frac{1}{4}\overrightarrow{b}$
      - (2) 过点 $F$ 作 $FN\parallel AB$ 交 $BC$ 于 $N$，作 $FM\parallel BC$ 交 $AB$ 于 $M$，则 $\overrightarrow{BM}$ 与 $\overrightarrow{BN}$ 即为 $\overrightarrow{BF}$ 在 $\overrightarrow{BA}$、$\overrightarrow{BC}$ 上的分向量。
