        page_number: 34
    block:
      stem_latex: 已知：如图，$\triangle ABC$ 中，点 $D$、$E$ 是边 $AB$ 上的点，$CD$ 平分 $\angle ECB$，且 $BC^2=BD\cdot BA$。（1）求证：$\triangle CED\sim\triangle ACD$；（2）求证：$\frac{AB}{BC}=\frac{CE}{ED}$。
      answer: 见证明
      clue: 相似三角形的判定与性质
      solution_steps:
      - (1) $\because BC^2=BD\cdot BA$，$\therefore BD:BC=BC:BA$，又 $\angle B$ 是公共角，$\therefore \triangle BCD\sim\triangle BAC$，$\therefore \angle BCD=\angle A$
      - $\because CD$ 平分 $\angle ECB$，$\therefore \angle ECD=\angle BCD=\angle A$，又 $\angle EDC=\angle CDA$，$\therefore \triangle CED\sim\triangle ACD$
      - (2) 由 $\triangle BCD\sim\triangle BAC$ 得 $\frac{AB}{BC}=\frac{AC}{CD}$；由 $\triangle CED\sim\triangle ACD$ 得 $\frac{CE}{ED}=\frac{AC}{CD}$，$\therefore \frac{AB}{BC}=\frac{CE}{ED}$。
