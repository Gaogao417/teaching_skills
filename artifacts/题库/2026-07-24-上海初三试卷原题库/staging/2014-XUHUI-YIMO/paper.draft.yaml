    official_solution:
      start_anchor: $\triangle BCD\sim\triangle BAC$
      end_anchor: $\frac{AB}{BC}=\frac{CE}{ED}$
      word_evidence:
      - page_image: documents/初三/2014届-上海市徐汇区-初三一模数学-试卷及参考答案/word/pages/032.png
        page_number: 32
