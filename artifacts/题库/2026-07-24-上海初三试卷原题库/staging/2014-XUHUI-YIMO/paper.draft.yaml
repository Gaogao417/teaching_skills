      stem_latex: 计算：$\frac{2\sin^2 30^\circ+\tan 60^\circ\cdot\tan 30^\circ+\sin^2 60^\circ}{\cos^2 45^\circ+\cot 60^\circ\cdot\cos 30^\circ}$。
