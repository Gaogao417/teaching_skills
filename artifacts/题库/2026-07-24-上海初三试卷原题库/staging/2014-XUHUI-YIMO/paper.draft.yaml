    block:
      stem_latex: 如图，直线 $y=x+3$ 与 $x$ 轴、$y$ 轴分别交于点 $A$、$C$，经过 $A$、$C$ 两点的抛物线 $y=ax^2+bx+c$ 与 $x$ 轴的负半轴上另一交点为 $B$，且 $\tan\angle CBO=3$。（1）求该抛物线的解析式及抛物线的顶点 $D$ 的坐标；（2）若点 $P$ 是射线 $BD$ 上一点，且以点 $P$、$A$、$B$ 为顶点的三角形与 $\triangle ABC$ 相似，求点 $P$ 的坐标。
      answer: （1）$y=x^2+4x+3$，顶点 $D(-2,-1)$；（2）$P(-\frac{5}{3},-\frac{2}{3})$ 或 $(-4,-3)$
      clue: 二次函数与相似三角形综合
      solution_steps:
      - (1) 令 $y=0$ 得 $x=-3$，令 $x=0$ 得 $y=3$，$\therefore A(-3,0)$，$C(0,3)$，$OA=OC=3$
      - $\because \tan\angle CBO=\frac{OC}{OB}=3$，$\therefore OB=1$，$B(-1,0)$
      - 把 $A$、$B$、$C$ 代入得 $a=1$，$b=4$，$c=3$，解析式 $y=x^2+4x+3=(x+2)^2-1$，顶点 $D(-2,-1)$
      - (2) $\because \angle ABD=45^\circ$，分两种情形：当 $\triangle ABC\sim\triangle BPA$ 时，$\frac{2}{BP}=\frac{3\sqrt{2}}{2}$，$BP=\frac{2\sqrt{2}}{3}$，$P(-\frac{5}{3},-\frac{2}{3})$
      - 当 $\triangle ABC\sim\triangle BAP$ 时，$BP=3\sqrt{2}$，$P(-4,-3)$；综上 $P(-\frac{5}{3},-\frac{2}{3})$ 或 $(-4,-3)$。
