    block:
      stem_latex: 某商场为了方便顾客使用购物车，将滚动电梯由坡角 $30^\circ$ 的坡面改为坡度为 $1:2.4$ 的坡面。如图，$BD$ 表示水平面，$AD$ 表示电梯的铅直高度，如果改动后电梯的坡面 $AC$ 长为 13 米，求改动后电梯水平宽度增加部分 $BC$ 的长（结果保留根号）。
      answer: $BC=12-5\sqrt{3}$ 米
      clue: 解直角三角形—坡度坡角
      solution_steps:
      - 在 Rt$\triangle ADC$ 中，$\because AD:DC=1:2.4$，$AC=13$，由 $AD^2+DC^2=AC^2$ 得 $AD^2+(2.4AD)^2=13^2$，$\therefore AD=5$，$DC=12$
      - 在 Rt$\triangle ABD$ 中，$\because \angle ABD=30^\circ$，$\therefore AD:BD=\sqrt{3}:3$，$BD=\frac{5\times 3}{\sqrt{3}}=5\sqrt{3}$
      - $\therefore BC=DC-BD=12-5\sqrt{3}$，即改动后电梯水平宽度增加部分 $BC$ 的长为 $(12-5\sqrt{3})$ 米。
