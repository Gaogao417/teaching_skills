    block:
      stem_latex: 如图，$\triangle ABC$ 中，$AB=5$，$BC=11$，$\cos B=\frac{3}{5}$，点 $P$ 是 $BC$ 边上的一个动点，联结 $AP$，取 $AP$ 的中点 $M$，将线段 $MP$ 绕点 $P$ 顺时针旋转 $90^\circ$ 得到线段 $PN$，联结 $AN$、$NC$。（1）当点 $N$ 恰好落在 $BC$ 边上时，求 $NC$ 的长；（2）若点 $N$ 在 $\triangle ABC$ 内部（不含边界），设 $BP=x$，$CN=y$，求 $y$ 关于 $x$ 的函数关系式，并求出函数的定义域；（3）若 $\triangle PNC$ 是等腰三角形，求 $BP$ 的长。
      answer: （1）$NC=6$；（2）$y=\frac{\sqrt{5x^2-78x+333}}{2}$，$3<x<6$；（3）$BP=7$ 或 $\frac{41-4\sqrt{19}}{3}$ 或 $-5+4\sqrt{11}$
      clue: 相似形综合、分类讨论
      solution_steps:
      - (1) $\because \angle APN=90^\circ$，$\cos B=\frac{BP}{AB}=\frac{3}{5}$，$AB=5$，$\therefore BP=3$，$AP=4$，$PN=MP=\frac{1}{2}AP=2$，$\therefore NC=11-3-2=6$
      - (2) 过 $A$、$N$ 作 $BC$ 的垂线，垂足为 $H$、$G$，$BH=3$，$HP=x-3$，$AH=4$，由 $\triangle APH\sim\triangle PGN$ 得 $\frac{AP}{PN}=\frac{AH}{PG}=\frac{PH}{NG}=2$，$\therefore PG=2$，$NG=\frac{x-3}{2}$，$CG=9-x$，$y=\sqrt{(\frac{x-3}{2})^2+(9-x)^2}=\frac{\sqrt{5x^2-78x+333}}{2}$，定义域 $3<x<6$
      - (3) 当 $PN=NC$ 时，$PG=CG$，$9-x=2$，$x=7$；当 $PN=PC$ 时，$3x^2-82x+459=0$，$x=\frac{41-4\sqrt{19}}{3}$；当 $NC=PC$ 时，$x^2+10x-151=0$，$x=-5+4\sqrt{11}$。综上 $BP=7$ 或 $\frac{41-4\sqrt{19}}{3}$ 或 $-5+4\sqrt{11}$。
