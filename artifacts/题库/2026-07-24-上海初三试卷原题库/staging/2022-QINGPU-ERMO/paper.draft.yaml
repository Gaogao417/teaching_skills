      - (2) $b=2$，顶点 $(2,2-4a)$，$2-4a\leqslant0$，$a\geqslant\dfrac{1}{2}$。
      - (3) 联立得 $C\left(4+\dfrac{1}{a},6+\dfrac{1}{a}\right)$、$D(0,2)$，作 $PH\perp
        AB$，由余切与垂直条件解得 $a=-1$，$\therefore y=-x^{2}+4x+2$。
