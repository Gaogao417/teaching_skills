        在 $BC$ 上，以 $P$ 为圆心 $PC$ 为半径作 $\odot P$，若 $\odot P$ 与 $\odot E$（半径1）有公共点且与
        $AD$ 只有一个交点，则 $PC$ 范围是______
      answer: $3\leqslant PC\leqslant4$
      clue: 相切时最小，内切时最大。
