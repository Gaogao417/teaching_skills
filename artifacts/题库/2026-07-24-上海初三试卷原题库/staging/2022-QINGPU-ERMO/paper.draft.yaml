        平分 $\angle ABC$，$\angle ABD=\angle ADB$，$AB=AD$，$\therefore$ 是菱形。
      - (2) $\triangle ADE\cong\triangle GDE$，$AE=GE$；$\triangle ADE\sim\triangle
        CBE$，$\triangle ABE\sim\triangle FDE$，$\dfrac{AD}{BC}=\dfrac{EF}{AE}$，$AD\cdot
        AE=BC\cdot EF$，即 $BG\cdot EG=BC\cdot EF$。
