  - type: problem
    id: Q021
    points: 10
    stem_latex: '某区3200名学生体育运动情况，在W校（600人）抽取40名调查。项目频数：乒乓4、篮球16、足球10、羽毛球4、健美操6；运动时间频率直方图。

      (1) 总体与样本容量；(2) 从加强班抽样是否合适；(3) 估计W校篮球兴趣人数；(4) 中位数落在第几组；(5) 甲乙投篮数据谁更稳定（用何统计量）。'
    answer: (1) 该区3200名学生体运情况，样本容量40；(2) 不合适，非随机样本；(3) $240$；(4) 第三组；(5) 方差，选乙
    clue: 统计概念+方差。
    solution_steps:
    - (1) 总体为该区3200名学生体运情况，样本容量40。
    - (2) 不合适，样本非随机抽样。
    - (3) $600\times\dfrac{16}{40}=240$。
    - (4) 中位数落在第三组。
    - (5) 用方差，$S^{2}_{甲}=5.2$，$S^{2}_{乙}=0.4$，选乙。
