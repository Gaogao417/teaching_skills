  - type: problem
    id: Q019
    points: 10
    stem_latex: 先化简 $\dfrac{x^{2}+3x}{x^{2}+6x+9}\div\dfrac{x^{2}-2x}{x^{2}-9}$，再从 $\sqrt{2}+4$、$3$、$-3$、$2$、$0$ 中选一个代入求值。
    answer: $\dfrac{x-3}{x-2}$；取 $x=\sqrt{2}+4$ 时原式 $=\dfrac{\sqrt{2}}{2}$
    clue: 分式化简，注意使分母有意义的取值。
    solution_steps:
    - 原式 $=\dfrac{x(x+3)}{(x+3)^{2}}\cdot\dfrac{(x+3)(x-3)}{x(x-2)}=\dfrac{x-3}{x-2}$。
    - 取 $x=\sqrt{2}+4$（其余使分母为0），原式 $=\dfrac{\sqrt{2}+1}{\sqrt{2}+2}=\dfrac{\sqrt{2}}{2}$。
