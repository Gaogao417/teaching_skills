  - type: problem
    id: Q024
    points: 12
    stem_latex: '直线 $y=kx+b$ 过 $A(-2,0)$、$B(1,3)$，抛物线 $y=ax^{2}-4ax+b$ 与直线交于 $C$、$D$（$C$ 在 $D$ 右侧），顶点 $P$。

      (1) 求直线表达式；

      (2) 若抛物线顶点不在第一象限，求 $a$ 范围；

      (3) 若直线 $DP$ 与 $AB$ 夹角余切为3，求抛物线表达式。'
    answer: (1) $y=x+2$；(2) $a\geqslant\dfrac{1}{2}$；(3) $y=-x^{2}+4x+2$
    clue: (1) 待定系数；(2) 顶点纵坐标；(3) 距离+垂直。
    solution_steps:
    - (1) 代入 $A$、$B$ 得 $y=x+2$。
    - (2) $b=2$，顶点 $(2,2-4a)$，$2-4a\leqslant0$，$a\geqslant\dfrac{1}{2}$。
    - (3) 联立得 $C\left(4+\dfrac{1}{a},6+\dfrac{1}{a}\right)$、$D(0,2)$，作 $PH\perp AB$，由余切与垂直条件解得 $a=-1$，$\therefore y=-x^{2}+4x+2$。
