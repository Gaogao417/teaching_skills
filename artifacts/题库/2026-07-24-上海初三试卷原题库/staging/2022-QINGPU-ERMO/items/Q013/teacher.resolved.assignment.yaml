  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 如图，平行四边形 $ABCD$ 中，$E$ 在 $AD$ 上，$ED=2AE$，$BE$ 交 $AC$ 于 $F$，设 $\vec{BA}=\vec{a}$，$\vec{BC}=\vec{b}$，则 $\vec{FA}=$______
    answer: $\dfrac{1}{4}\vec{a}-\dfrac{1}{4}\vec{b}$
    clue: $\triangle AEF\sim\triangle CBF$。
    solution_steps:
    - $\dfrac{FA}{CF}=\dfrac{AE}{BC}=\dfrac{1}{3}$，$\vec{FA}=\dfrac{1}{4}\vec{CA}=\dfrac{1}{4}\vec{a}-\dfrac{1}{4}\vec{b}$。
