  - type: problem
    id: Q022
    points: 12
    stem_latex: 如图，$AB$ 是 $\odot O$ 直径，$P$ 在 $AO$ 上，$C$、$D$ 在直径两侧圆周上，$PB$ 平分 $\angle CPD$，求证：劣弧 $BC$ 与劣弧 $BD$ 相等。
    answer: 见证明
    clue: 角平分线性质+HL全等。
    solution_steps:
    - 作 $OE\perp PC$、$OF\perp PD$，$PB$ 平分 $\angle CPD$，$OE=OF$。
    - $OC=OD$，$\triangle EOC\cong\triangle FOD$（HL），$\angle C=\angle D$，$\angle BOC=\angle BOD$，$\therefore \overset{\frown}{BC}=\overset{\frown}{BD}$。
