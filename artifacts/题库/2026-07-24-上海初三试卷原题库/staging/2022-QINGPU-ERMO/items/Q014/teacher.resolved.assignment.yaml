  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 如图，$\triangle ABC$ 中 $D$ 在 $AC$ 上，$DB\perp BC$，$\angle ADB=\angle ABC$，$\tan C=\dfrac{1}{2}$，则 $\dfrac{AC}{AB}=$______
    answer: '2'
    clue: $\triangle ADB\sim\triangle ABC$。
    solution_steps:
    - $\triangle ADB\sim\triangle ABC$，$\dfrac{AC}{AB}=\dfrac{BC}{DB}$，$\tan C=\dfrac{BD}{BC}=\dfrac{1}{2}$，$\therefore \dfrac{AC}{AB}=2$。
