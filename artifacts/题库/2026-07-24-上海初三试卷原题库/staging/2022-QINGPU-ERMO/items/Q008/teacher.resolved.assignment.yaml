  - type: short_answer
    id: Q008
    points: 4
    stem_latex: 将抛物线 $C$ 向左平移2个单位、向上平移1个单位后得 $y=(x-1)^{2}$，则抛物线 $C$ 的解析式为______
    answer: $y=(x-3)^{2}-1$
    clue: 反向平移。
    solution_steps:
    - 反向（右移2、下移1）：$y=(x-1+2)^{2}-1=(x-3)^{2}-1$。
