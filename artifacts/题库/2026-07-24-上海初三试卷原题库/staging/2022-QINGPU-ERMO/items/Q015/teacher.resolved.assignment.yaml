  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 在 $A$ 点测得树顶仰角 $\alpha$，向前100米到 $B$ 点测得仰角 $\beta$，则树高为______米
    answer: $\dfrac{100\tan\alpha\tan\beta}{\tan\beta-\tan\alpha}$
    clue: 列方程组消去水平距离。
    solution_steps:
    - $\dfrac{CD}{AD}=\tan\alpha$，$\dfrac{CD}{AD-100}=\tan\beta$，消去 $AD$ 得 $CD=\dfrac{100\tan\alpha\tan\beta}{\tan\beta-\tan\alpha}$。
