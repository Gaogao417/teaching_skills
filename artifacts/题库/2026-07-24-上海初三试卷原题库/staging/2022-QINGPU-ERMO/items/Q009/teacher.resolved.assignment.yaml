    stem_latex: 抛物线 $y=(a-1)x^{2}-2x+3$ 在对称轴左侧 $y$ 随 $x$ 增大而增大，则 $a$ 的取值范围是______
    answer: $a<1$
    clue: 开口向下 $a-1<0$。
    solution_steps:
    - 对称轴左侧递增需开口向下，$a-1<0$，$a<1$。
