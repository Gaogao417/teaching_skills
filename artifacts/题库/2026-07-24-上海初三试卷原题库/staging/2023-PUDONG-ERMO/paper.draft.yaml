        $\angle DCF$ 的正弦值等于 ______
      answer: $\dfrac{3}{5}$
      clue: 证 $\triangle AEF\cong\triangle CDF$ 得 $AF=CF$，用勾股列方程求边长比。
      solution_steps:
      - 设 $AB=a$，$AD=2a$；$\triangle AEF\cong\triangle CDF$，$AF=CF$，设 $DF=b$，则 $CF=2a-b$。
      - Rt$\triangle AEF$：$a^{2}+b^{2}=(2a-b)^{2}$，$b=\dfrac{3}{4}a$，$CF=\dfrac{5}{4}a$，$\sin\angle
        DCF=\dfrac{DF}{CF}=\dfrac{3}{5}$。
