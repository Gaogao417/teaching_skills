  - type: choice
    id: Q003
    points: 4
    stem_latex: 一元二次方程 $x^{2}-2\sqrt{2}x-1=0$ 的根的情况是（\quad）
    choices:
    - 有两个不相等的实数根
    - 有两个相等的实数根
    - 只有一个实数根
    - 没有实数根
    answer: A
    clue: 计算判别式 $\Delta$ 判断。
    solution_steps:
    - $\Delta=(2\sqrt{2})^{2}-4\times1\times(-1)=12>0$，有两不等实根。
