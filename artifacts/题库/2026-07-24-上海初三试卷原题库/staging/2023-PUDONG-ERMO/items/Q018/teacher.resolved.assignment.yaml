  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 规定两个正多边形的中心之间的距离叫中心距。边长都为6的正三角形和正方形，当它们的一边重合时，中心距为 ______
    answer: $3-\sqrt{3}$ 或 $3+\sqrt{3}$
    clue: 两中心在公共边的垂直平分线上，分同侧、异侧两种位置。
    solution_steps:
    - 正方形中心到边距离3，正三角形中心到边距离 $\sqrt{3}$。
    - 同侧时中心距 $3-\sqrt{3}$，异侧时 $3+\sqrt{3}$。
