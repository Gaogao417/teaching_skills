  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，$AD$ 过 $\triangle ABC$ 的重心 $G$，设 $\vec{AB}=\vec{a}$，$\vec{BC}=\vec{b}$，那么 $\vec{AG}=$ ______（用 $\vec{a},\vec{b}$ 表示）
    answer: $\dfrac{2}{3}\vec{a}+\dfrac{1}{3}\vec{b}$
    clue: 重心向量 $\vec{AG}=\dfrac13(\vec{AB}+\vec{AC})$。
    solution_steps:
    - $\vec{AC}=\vec{AB}+\vec{BC}=\vec{a}+\vec{b}$。
    - $\vec{AG}=\dfrac13(\vec{AB}+\vec{AC})=\dfrac13(\vec{a}+\vec{a}+\vec{b})=\dfrac23\vec{a}+\dfrac13\vec{b}$。
