  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，梯形 $ABCD$ 中 $AD\parallel BC$，过 $B$ 作 $BE\perp AD$ 于 $E$，$G$ 在 $AD$ 上，连 $BG,CG$，对角线 $AC$ 与 $BE,BG$ 分别交于 $F,H$，且 $AE\cdot BG=AF\cdot BE$。（1）求证：$BG\perp AC$；（2）若 $\angle DGC=2\angle DCG$ 且 $DC$ 是 $DG$ 与 $DA$ 的比例中项，求证：四边形 $ABCG$ 是菱形．
    answer: (1)(2) 见解析
    clue: (1) 由 $AE\cdot BG=AF\cdot BE$ 证 $\triangle AEF\sim\triangle BEG$ 转角；(2) 由比例中项证 $\triangle ADC\sim\triangle CDG$，结合角关系证四边等。
    solution_steps:
    - (1) 由比例式及勾股推 $\dfrac{AE}{BE}=\dfrac{AF}{BG}=\dfrac{EF}{EG}$，$\triangle AEF\sim\triangle BEG$，$\angle EAF=\angle EBG$，进而 $\angle BFH=90\degree$，$BG\perp AC$。
    - (2) $DC$ 为比例中项 $\Rightarrow \triangle ADC\sim\triangle CDG\Rightarrow \angle DCG=\angle DAC$；结合 $\angle DGC=2\angle DCG$ 与平行推 $AG=CG$；由(1) $BG\perp AC$ 得 $BG$、$AC$ 互相垂直平分，四边形 $ABCG$ 为菱形。
