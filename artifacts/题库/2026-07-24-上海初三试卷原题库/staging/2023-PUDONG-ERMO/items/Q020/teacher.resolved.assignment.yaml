  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程：$\dfrac{2x}{x-2}-\dfrac{8}{x^{2}-2x}=1$
    answer: $x=-4$
    clue: 去分母转化为整式方程，注意检验。
    solution_steps:
    - $\dfrac{2x}{x-2}-\dfrac{8}{x(x-2)}=1$，去分母 $2x^{2}-8=x^{2}-2x$，$x^{2}+2x-8=0$。
    - $x=2$（增根，舍）或 $x=-4$（检验合格）。
