  - type: choice
    id: Q005
    points: 4
    stem_latex: 如图，正方形 $DEFG$ 的 $D,E$ 在 $\triangle ABC$ 的边 $BC$ 上，$G,F$ 分别在 $AB,AC$ 上，$BC=8$，$\triangle ABC$ 面积为32，则正方形边长为（\quad）
    choices:
    - $4$
    - $8$
    - $\dfrac{8}{3}$
    - $\dfrac{16}{3}$
    answer: A
    clue: 由面积求高 $AH$，由 $\triangle AGF\sim\triangle ABC$ 列方程求边长。
    solution_steps:
    - $AH=8$，设边长 $x$，$\dfrac{x}{8}=\dfrac{8-x}{8}$，$x=4$。
