  - type: problem
    id: Q025
    points: 14
    stem_latex: $\odot O$ 的直径 $AB=10$，$C$ 是 $\overset{\frown}{AB}$ 的中点，$D$ 是 $\odot O$ 上动点（不与 $A,B,C$ 重合），射线 $CD$ 交射线 $AB$ 于 $E$。（1）如图1，当 $BE=AB$，求 $CD$；（2）如图2，当 $D$ 在 $\overset{\frown}{BC}$ 上运动时，$\triangle BCD$ 中是否存在度数不变的角？若存在指出并求度数；（3）连 $OD$，当 $\triangle ODE$ 是以 $DE$ 为腰的等腰三角形时，求 $\triangle ODE$ 与 $\triangle CBE$ 面积的比值．
    answer: (1) $CD=\sqrt{10}$；(2) 存在，$\angle BDC=135\degree$；(3) $\dfrac{3+\sqrt{3}}{4}$
    clue: (1) 由 $C$ 为弧中点得 $OC\perp AB$，用勾股及相似求 $CD$；(2) 由 $\overset{\frown}{BAC}$ 度数 $270\degree$ 得圆周角 $135\degree$；(3) 分 $OD=DE$、$DE=OE$ 讨论（后者不成立）。
    solution_steps:
    - (1) $OC\perp AB$，$CE=5\sqrt{10}$；$\triangle AED\sim\triangle CEB\Rightarrow DE=4\sqrt{10}$，$CD=CE-DE=\sqrt{10}$。
    - (2) $\overset{\frown}{BC}=90\degree\Rightarrow \overset{\frown}{BAC}=270\degree$，$\angle BDC=\dfrac12\times270\degree=135\degree$。
    - (3) 当 $OD=DE=5$ 时 $\triangle OCD$ 等边，$CE=10$，$OE=5\sqrt{3}$，$S_{\triangle ODE}=\dfrac{25}{4}\sqrt{3}$，$S_{\triangle CBE}=\dfrac{25}{2}\sqrt{3}-\dfrac{25}{2}$，比值为 $\dfrac{3+\sqrt{3}}{4}$（$DE=OE$ 不成立）。
