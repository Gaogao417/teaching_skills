  - type: choice
    id: Q006
    points: 4
    stem_latex: 顺次联结四边形 $ABCD$ 各边中点所得四边形是矩形，那么四边形 $ABCD$ 一定是（\quad）
    choices:
    - 菱形
    - 对角线相等的四边形
    - 对角线互相垂直的四边形
    - 对角线互相垂直且平分的四边形
    answer: C
    clue: 中点四边形为矩形 $\Rightarrow$ 原四边形对角线互相垂直。
    solution_steps:
    - 中位线分别平行于对角线，矩形邻边垂直 $\Rightarrow AC\perp BD$。
