  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 汽车新车价20万元，第一年折旧20%，第二、三年年折旧率同为 $x$，第三年年末价值11.56万元，列出方程为______
    answer: $20(1-20\%)(1-x)^{2}=11.56$
    clue: 逐年折旧。
    solution_steps:
    - 第一年后 $20(1-20\%)$，第三年后 $20(1-20\%)(1-x)^{2}=11.56$。
