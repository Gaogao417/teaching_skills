    stem_latex: 计算：$|\sqrt{3}-2|+2022^{0}-\left(-\dfrac{1}{2}\right)^{-1}+2\cos30^{\circ}$
    answer: '5'
    clue: 绝对值、零指数幂、负指数幂、特殊角三角比。
    solution_steps:
    - $|\sqrt{3}-2|=2-\sqrt{3}$，$2022^{0}=1$，$\left(-\dfrac{1}{2}\right)^{-1}=-2$，$2\cos30^{\circ}=\sqrt{3}$。
    - 原式 $=(2-\sqrt{3})+1-(-2)+\sqrt{3}=5$。
