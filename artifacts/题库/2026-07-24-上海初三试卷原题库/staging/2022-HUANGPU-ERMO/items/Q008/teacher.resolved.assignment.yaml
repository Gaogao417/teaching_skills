    stem_latex: 如果分式 $\dfrac{2x}{x+3}$ 有意义，那么 $x$ 的取值范围是______
    answer: $x\neq-3$
    clue: 分母不为零。
    solution_steps:
    - $x+3\neq0$，$\therefore x\neq-3$。
