  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程：$\dfrac{4x}{x^{2}-9}=1+\dfrac{2}{x-3}-\dfrac{2}{x+3}$
    answer: $x=1$
    clue: 去分母化为整式方程，检验增根。
    solution_steps:
    - 两边乘 $(x+3)(x-3)$：$4x=x^{2}-9+2(x+3)-2(x-3)$，即 $x^{2}-4x+3=0$。
    - $x=1$ 或 $x=3$，检验 $x=3$ 为增根舍去，$\therefore x=1$。
