  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 如图，$AB\parallel DE$，$\angle ABC=70^{\circ}$，$\angle CDE=147^{\circ}$，则 $\angle BCD=$______
    answer: $37^{\circ}$
    clue: 延长 $ED$ 交 $BC$ 于 $F$，用三角形外角。
    solution_steps:
    - 延长 $ED$ 交 $BC$ 于 $F$，$\angle BFD=\angle B=70^{\circ}$。
    - $\angle CDF=180^{\circ}-147^{\circ}=33^{\circ}$。
    - $\angle BCD=\angle BFD-\angle CDF=70^{\circ}-33^{\circ}=37^{\circ}$。
