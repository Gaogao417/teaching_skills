  - type: problem
    id: Q024
    points: 12
    stem_latex: '抛物线 $y=ax^{2}+bx+c$（$a\neq0$）经过 $A(4,0)$，顶点 $H(2,4)$，对称轴 $l$ 与 $x$ 轴交于 $B$，$C$、$P$ 是抛物线上第一象限内的点。

      (1) 求抛物线表达式；

      (2) $C$ 在对称轴左侧，$\angle CHB=\angle CAO$，求 $C$；

      (3) 在 (2) 条件下，$P$ 在对称轴右侧，过 $P$ 作 $PQ\parallel CH$ 交 $l$ 于 $Q$，且 $S_{\triangle POQ}:S_{\triangle PAQ}=1:5$，求直线 $PQ$ 的表达式。'
    answer: (1) $y=-x^{2}+4x$；(2) $C(1,3)$；(3) $y=x-\dfrac{2}{3}$ 或 $y=x+1$
    clue: (1) 顶点式；(2) 正切相等列方程；(3) 面积比转距离比。
    solution_steps:
    - (1) 设 $y=a(x-2)^{2}+4$，代入 $A(4,0)$ 得 $a=-1$，$\therefore y=-x^{2}+4x$。
    - (2) 设 $C(m,-m^{2}+4m)$，由 $\tan\angle CHB=\tan\angle CAO$ 得 $\dfrac{2-m}{m^{2}-4m+4}=\dfrac{-m^{2}+4m}{4-m}$，$m=1$，$C(1,3)$。
    - (3) $CH$：$y=x+2$，设 $PQ$：$y=x+h$。延长 $PQ$ 交 $x$ 轴于 $D$。
    - ① 两三角形在 $PQ$ 两侧：$\dfrac{OD}{AD}=\dfrac{1}{5}$，$OD=\dfrac{2}{3}$，$D\left(\dfrac{2}{3},0\right)$，$h=-\dfrac{2}{3}$，$PQ$：$y=x-\dfrac{2}{3}$。
    - ② 同侧：$\dfrac{OD}{AD}=\dfrac{1}{5}$，$OD=1$，$D(-1,0)$，$h=1$，$PQ$：$y=x+1$。
