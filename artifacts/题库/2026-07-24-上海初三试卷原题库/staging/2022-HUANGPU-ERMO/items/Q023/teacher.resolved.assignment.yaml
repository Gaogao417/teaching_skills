  - type: problem
    id: Q023
    points: 12
    stem_latex: '如图，$A$、$B$、$C$ 是 $\odot O$ 上三点，$AB=AC$，$M$、$N$ 分别为 $AB$、$AC$ 中点，$E$、$F$ 分别在 $OM$、$ON$ 上。

      (1) 求证：$\angle AOM=\angle AON$；

      (2) 若 $AE\parallel ON$，$AF\parallel OM$，求证：$OE\cdot OM=\dfrac{1}{2}AO^{2}$。'
    answer: 见证明
    clue: (1) HL全等；(2) 菱形+相似。
    solution_steps:
    - (1) $OM\perp AB$，$ON\perp AC$，$AM=AN$，$\mathrm{Rt}\triangle AOM\cong\mathrm{Rt}\triangle AON$（HL），$\angle AOM=\angle AON$。
    - (2) $AE\parallel ON$，$AF\parallel OM$，四边形 $AEOF$ 是平行四边形；$\angle EAO=\angle AON=\angle AOM$，$AE=EO$，$\therefore$ 四边形 $AEOF$ 是菱形，$EF\perp AO$，$OP=\dfrac{1}{2}AO$。
    - $\triangle EPO\sim\triangle AMO$，$\dfrac{OE}{AO}=\dfrac{OP}{OM}$，$\therefore OE\cdot OM=AO\cdot OP=\dfrac{1}{2}AO^{2}$。
