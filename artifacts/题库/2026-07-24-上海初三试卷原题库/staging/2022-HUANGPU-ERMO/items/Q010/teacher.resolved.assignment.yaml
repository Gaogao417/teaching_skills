  - type: short_answer
    id: Q010
    points: 4
    stem_latex: 不等式组 $\begin{cases} x+1>0 \\ x-4<2 \end{cases}$ 的解集是______
    answer: $-1<x<6$
    clue: 分别解再取交集。
    solution_steps:
    - 由 $x+1>0$ 得 $x>-1$；由 $x-4<2$ 得 $x<6$。
    - $\therefore -1<x<6$。
