  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 在 $\triangle ABC$ 中，$AB=AC$，$BC=10$，$\cot B=\dfrac{5}{12}$，若 $C$ 在 $\odot B$ 内、$A$ 在 $\odot B$ 外，则 $\odot B$ 半径 $r$ 的取值范围是______
    answer: $10<r<13$
    clue: 求 $BC$、$AB$ 长。
    solution_steps:
    - $BD=5$，$AD=\dfrac{5}{\cot B}=12$，$AB=\sqrt{12^{2}+5^{2}}=13$。
    - $C$ 在圆内、$A$ 在圆外，$\therefore BC<r<AB$，即 $10<r<13$。
