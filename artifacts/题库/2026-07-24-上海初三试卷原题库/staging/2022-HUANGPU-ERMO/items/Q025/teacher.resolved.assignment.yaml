  - type: problem
    id: Q025
    points: 14
    stem_latex: '梯形 $ABCD$ 中，$AD\parallel BC$，$\angle ABC=90^{\circ}$，$AB=6$，$BC:AD=1:3$，$O$ 为 $AC$ 中点，过 $O$ 作 $OE\perp OB$ 交 $BC$ 延长线于 $E$。

      (1) 当 $BC=EC$ 时，求证：$AB=OE$；

      (2) 设 $BC=a$，用 $a$ 表示 $BE$ 并写出 $a$ 的取值范围；

      (3) 联结 $OD$、$DE$，当 $\triangle DOE$ 是以 $DE$ 为直角边的直角三角形时，求 $BC$。'
    answer: (1) 见证明；(2) $BE=\dfrac{a^{2}+36}{2a}$（$0<a<6$）；(3) $BC=2\sqrt{3}$ 或 $\dfrac{6\sqrt{3}}{5}$
    clue: (1) 全等；(2) 相似+勾股；(3) 分 $\angle OED=90^{\circ}$、$\angle ODE=90^{\circ}$。
    solution_steps:
    - (1) $\angle ABC=90^{\circ}$，$O$ 为 $AC$ 中点，$BO=CO$，$\angle OBC=\angle OCB$。$OE\perp OB$，$\angle BOE=90^{\circ}$。$BC=EC$ 时 $CO=BC$，$BO=BC$，$\triangle ABC\cong\triangle EOB$，$AB=OE$。
    - (2) $\triangle ABC\sim\triangle EOB$，$\dfrac{BC}{OB}=\dfrac{AC}{BE}$。$AC=\sqrt{a^{2}+36}$，$OB=\dfrac{1}{2}AC$，$\therefore BE=\dfrac{a^{2}+36}{2a}$（$0<a<6$）。
    - (3) 设 $BC=a$，$AD=3a$。① $\angle OED=90^{\circ}$：延长 $BO$ 交 $AD$ 于 $G$，可推得方程解得 $a=2\sqrt{3}$。
    - ② $\angle ODE=90^{\circ}$：过 $O$、$E$ 作 $OM\perp AD$、$EN\perp AD$，由 $\triangle OMD\sim\triangle DNE$ 列方程解得 $a=\dfrac{6\sqrt{3}}{5}$。
    - 综上，$BC=2\sqrt{3}$ 或 $\dfrac{6\sqrt{3}}{5}$。
