  blocks:
  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 如图，梯形 $ABCD$ 中，$AB\parallel CD$，$AB=2CD$，$\overrightarrow{AD}=\vec{a}$，$\overrightarrow{AB}=\vec{b}$，用 $\vec{a}$、$\vec{b}$ 表示 $\overrightarrow{AC}=$______
    answer: $\vec{a}+\dfrac{1}{2}\vec{b}$
    clue: $\overrightarrow{AC}=\overrightarrow{AD}+\overrightarrow{CD}$。
    solution_steps:
    - $\overrightarrow{CD}=\dfrac{1}{2}\overrightarrow{AB}=\dfrac{1}{2}\vec{b}$。
    - $\overrightarrow{AC}=\overrightarrow{AD}+\overrightarrow{CD}=\vec{a}+\dfrac{1}{2}\vec{b}$。
