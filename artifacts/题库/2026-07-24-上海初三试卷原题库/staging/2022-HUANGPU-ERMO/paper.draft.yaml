      - $\angle CAC'=\angle DAD'=30^{\circ}$，$AC'=AC=\sqrt{2}$，$CE=\dfrac{1}{2}AC=\dfrac{\sqrt{2}}{2}$。
      - $S_{\triangle ACC'}=\dfrac{1}{2}\cdot\sqrt{2}\cdot\dfrac{\sqrt{2}}{2}=\dfrac{1}{2}$。
