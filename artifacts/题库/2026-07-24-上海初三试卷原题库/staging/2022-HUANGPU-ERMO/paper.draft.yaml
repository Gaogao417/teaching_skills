        =______
      answer: $\dfrac{1}{2}$
      clue: $\triangle OAB$ 等边，旋转角30°。
      solution_steps:
      - $OA=OB=AB=1$，$\triangle OAB$ 等边，$\angle OAB=60^{\circ}$，$\angle OAD=30^{\circ}$，$\angle
