  - id: Q019
    source_key: 2025-YANGPU-YIMO-Q19
    question_number: 19
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [特殊角三角比]
    stem_latex: '计算：$\cos30^\circ-2\sin^2 45^\circ+\dfrac2{2\sin60^\circ-\tan45^\circ}$。'
    answer: '$\dfrac{3\sqrt3}{2}$'
    official_solution_latex: [{title: 计算, content: '原式 $=\dfrac{\sqrt3}{2}-2\times\dfrac12+\dfrac2{\sqrt3-1}=\dfrac{3\sqrt3}{2}$。'}]
