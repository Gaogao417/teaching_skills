  - id: Q023
    source_key: 2025-YANGPU-YIMO-Q23
    question_number: 23
    question_type: problem
    section_title: 三、解答题
    points: 12
    difficulty: challenge
    skill_tags: [相似三角形, 证明]
    stem_latex: '已知：如图，$\triangle ABC$ 中，$\angle A=90^\circ$，点 $D$ 是 $AB$ 边上一点，过点 $B$ 作 $BE\perp CD$，交 $CD$ 延长线于点 $E$，$AD\cdot BC=BE\cdot CD$。（1）求证：$BE^2=ED\cdot EC$；（2）求证：$AB\cdot BC=2CE\cdot BE$。'
    answer: 证明见解析。
    official_solution_latex:
      - {title: 第（1）问, content: '由 $AD\cdot BC=BE\cdot CD$ 得 $\dfrac{AD}{BE}=\dfrac{CD}{BC}$。在直角三角形 $ADC$ 与 $BEC$ 中可证相似，继而得 $\angle EDB=\angle EBC$，所以 $\triangle EBD\sim\triangle ECB$，故 $BE^2=ED\cdot EC$。'}
      - {title: 第（2）问, content: '延长 $CA$、$BE$ 交于点 $H$。由角关系得 $BC=CH$，又 $BH=2BE=2EH$。可证 $\mathrm{Rt}\triangle ABH\sim\mathrm{Rt}\triangle BEC$，所以 $\dfrac{AB}{CE}=\dfrac{BH}{BC}$，即 $AB\cdot BC=2BE\cdot CE$。'}
    question_crops: [{source: documents/初三/2025届-上海市杨浦区-初三一模数学-试卷及参考答案/005.png, box: [100, 90, 970, 440], file: source-question.png}]
    prompt_crops: [{source: documents/初三/2025届-上海市杨浦区-初三一模数学-试卷及参考答案/005.png, box: [590, 180, 950, 430], file: prompt-01.png, width: 68mm}]
    solution_crops: [{source: documents/初三/2025届-上海市杨浦区-初三一模数学-试卷及参考答案/007.png, box: [150, 720, 950, 1450], file: official-solution-01.png}]
  - id: Q024
    source_key: 2025-YANGPU-YIMO-Q24
    question_number: 24
    question_type: problem
    section_title: 三、解答题
    points: 12
    difficulty: challenge
    skill_tags: [二次函数, 相似三角形]
    stem_latex: '在平面直角坐标系 $xOy$ 中，抛物线 $y=mx^2+6mx+n\ (m<0)$ 与 $x$ 轴交于点 $A(-1,0)$ 和点 $B$，顶点为 $D$。（1）求此抛物线的对称轴及点 $B$ 的坐标；（2）点 $P$ 是该抛物线上的一点，设对称轴与 $x$ 轴交于点 $E$，如果 $BP$ 恰好平分线段 $DE$，求点 $P$ 的坐标（用含 $m$ 的式子表示）；（3）在（2）的条件下，联结 $PD$、$AP$，当 $\angle DPB=\angle PAB$ 时，求 $m$ 的值。'
    answer: '（1）对称轴 $x=-3$，$B(-5,0)$；（2）$P(-2,-3m)$；（3）$m=\pm\dfrac{\sqrt3}{3}$。'
    official_solution_latex:
      - {title: 第（1）问, content: '对称轴为 $x=-3$。由对称性得 $B(-5,0)$。'}
      - {title: 第（2）问, content: '由题意可得 $n=5m$，$E(-3,0)$，$D(-3,-4m)$。利用中点及相似关系解得点 $P(-2,-3m)$。'}
      - {title: 第（3）问, content: '延长 $DP$ 交 $x$ 轴于点 $H$，可得 $H(1,0)$。由 $\angle DPB=\angle PAB$ 得 $\triangle BPH\sim\triangle HAP$，所以 $PH^2=AH\cdot BH=12$，解得 $m=\pm\dfrac{\sqrt3}{3}$。'}
    question_crops: [{source: documents/初三/2025届-上海市杨浦区-初三一模数学-试卷及参考答案/005.png, box: [100, 420, 970, 880], file: source-question.png}]
    prompt_crops: [{source: documents/初三/2025届-上海市杨浦区-初三一模数学-试卷及参考答案/005.png, box: [730, 470, 970, 850], file: prompt-01.png, width: 52mm}]
    solution_crops: [{source: documents/初三/2025届-上海市杨浦区-初三一模数学-试卷及参考答案/008.png, box: [150, 80, 950, 720], file: official-solution-01.png}]
  - id: Q025
    source_key: 2025-YANGPU-YIMO-Q25
    question_number: 25
    question_type: problem
    section_title: 三、解答题
    points: 14
    difficulty: challenge
    skill_tags: [直角三角形, 相似三角形, 分类讨论]
    stem_latex: '已知 $\triangle ABC$ 中，$\angle B=90^\circ$，点 $D$ 在边 $BC$ 上，$CD=3BD$。（1）如图1，当 $AB=6$，$\sin C=\dfrac{\sqrt5}{5}$ 时，求 $AD$ 的长；（2）点 $E$ 是 $AC$ 边上一点，满足 $\angle ADB=\angle ADE$。①如图2，当 $CD^2=CE\cdot CA$ 时，求 $\dfrac{AB}{BC}$ 的值；②当 $\triangle CDE$ 是等腰三角形时，求 $\angle C$ 的余弦值。'
    answer: '（1）$AD=3\sqrt5$；（2）①$\dfrac{AB}{BC}=\dfrac{\sqrt{11}}4$；②$\cos C=\dfrac45$ 或 $\dfrac{4\sqrt{10}-4}{9}$。'
    official_solution_latex:
      - {title: 第（1）问, content: '在直角三角形 $ABC$ 中，由 $AB=6$、$\sin C=\dfrac{\sqrt5}{5}$ 得 $AC=6\sqrt5$、$BC=12$。由 $CD=3BD$ 得 $BD=3$，所以在直角三角形 $ABD$ 中 $AD=3\sqrt5$。'}
      - {title: 第（2）问①, content: '设 $BD=a$，则 $CD=3a$。由 $CD^2=CE\cdot CA$ 得 $\triangle CDE\sim\triangle CAD$，结合 $\angle ADB=\angle ADE$ 推得比例关系，解得 $\dfrac{AB}{BC}=\dfrac{\sqrt{11}}4$。'}
      - {title: 第（2）问②, content: '分类讨论等腰三角形 $CDE$。当 $DE=DC$ 时与题设位置矛盾，舍去；当 $ED=EC$ 时得 $\cos C=\dfrac45$；当 $CE=CD$ 时得 $\cos C=\dfrac{4\sqrt{10}-4}{9}$。'}
    question_crops: [{source: documents/初三/2025届-上海市杨浦区-初三一模数学-试卷及参考答案/005.png, box: [100, 850, 970, 1450], file: source-question.png}]
    prompt_crops: [{source: documents/初三/2025届-上海市杨浦区-初三一模数学-试卷及参考答案/005.png, box: [140, 1130, 950, 1430], file: prompt-01.png, width: 0.92\linewidth}]
    solution_crops:
      - {source: documents/初三/2025届-上海市杨浦区-初三一模数学-试卷及参考答案/008.png, box: [150, 680, 950, 1450], file: official-solution-01.png}
