  - id: Q020
    source_key: 2025-YANGPU-YIMO-Q20
    question_number: 20
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [二次函数, 图像平移]
    stem_latex: '已知抛物线 $y=ax^2+bx+c\ (a\ne0)$ 经过点 $A(0,3)$、点 $B(4,3)$、点 $C(1,0)$。（1）求此抛物线的表达式；（2）将上述抛物线平移，使它的顶点移动到点 $(-2,2)$ 的位置，那么平移的方法是怎样的？'
    answer: '（1）$y=x^2-4x+3$；（2）向左平移4个单位，再向上平移3个单位。'
    official_solution_latex:
      - {title: 第（1）问, content: '代入三点得 $c=3$，$16a+4b+c=3$，$a+b+c=0$，解得 $a=1$，$b=-4$，$c=3$，所以 $y=x^2-4x+3$。'}
      - {title: 第（2）问, content: '原顶点为 $(2,-1)$，故向左平移4个单位，再向上平移3个单位。'}
    question_crops: [{source: documents/初三/2025届-上海市杨浦区-初三一模数学-试卷及参考答案/004.png, box: [100, 90, 970, 320], file: source-question.png}]
    solution_crops: [{source: documents/初三/2025届-上海市杨浦区-初三一模数学-试卷及参考答案/006.png, box: [150, 620, 950, 950], file: official-solution-01.png}]
  - id: Q021
    source_key: 2025-YANGPU-YIMO-Q21
    question_number: 21
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [梯形, 解直角三角形]
    stem_latex: '如图，已知在梯形 $ABCD$ 中，$AD\parallel BC$，$\angle BCD=90^\circ$，$BC=8$，$AC=2\sqrt{10}$，$\sin\angle DAC=\dfrac{3\sqrt{10}}{10}$。（1）求 $BD$ 的长；（2）求 $\angle ABD$ 的正切值。'
    answer: '（1）$BD=10$；（2）$\tan\angle ABD=\dfrac17$。'
    official_solution_latex:
      - {title: 第（1）问, content: '由 $AD\parallel BC$ 与 $\angle BCD=90^\circ$ 得 $\angle ADC=90^\circ$。在 $\mathrm{Rt}\triangle ADC$ 中求得 $CD=6$，再在 $\mathrm{Rt}\triangle BCD$ 中由勾股定理得 $BD=10$。'}
      - {title: 第（2）问, content: '由第（1）问得 $AD=2$，$\cos\angle DBC=\dfrac45$。过点 $A$ 作 $AE\perp BD$，可得 $AE=\dfrac65$，$DE=\dfrac85$，$BE=\dfrac{42}{5}$，所以 $\tan\angle ABD=\dfrac17$。'}
    question_crops: [{source: documents/初三/2025届-上海市杨浦区-初三一模数学-试卷及参考答案/004.png, box: [100, 280, 970, 650], file: source-question.png}]
    prompt_crops: [{source: documents/初三/2025届-上海市杨浦区-初三一模数学-试卷及参考答案/004.png, box: [590, 330, 930, 640], file: prompt-01.png, width: 64mm}]
    solution_crops: [{source: documents/初三/2025届-上海市杨浦区-初三一模数学-试卷及参考答案/006.png, box: [150, 900, 950, 1450], file: official-solution-01.png}]
  - id: Q022
    source_key: 2025-YANGPU-YIMO-Q22
    question_number: 22
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: challenge
    skill_tags: [最佳视野点, 解直角三角形]
    stem_latex: '定义：如图1，点 $Q$、$R$ 是 $\angle MON$ 的边 $ON$ 上的两个定点，点 $P$ 是边 $OM$ 上的一个动点，当 $OP^2=OQ\cdot OR$ 时，称点 $P$ 是线段 $QR$ 的最佳视野点。如图2，巨型显示屏 $AB$ 的点 $A$ 到水平地面的距离 $AC$ 为5米，在水平地面 $CD$ 的 $E$ 处有自动扶梯 $EF$，点 $A$、$B$、$C$ 在同一直线上。自动扶梯坡度为 $1:2$，点 $E$ 到点 $C$ 的距离为10米。（1）行人在水平地面 $CE$ 上的点 $H$ 处发现点 $H$ 恰好是屏幕 $AB$ 的最佳视野点，且测得点 $B$ 的仰角为 $60^\circ$，求 $AB$ 的长；（2）在（1）的条件下，有人说“最佳视野点就是屏幕 $AB$ 的垂直平分线与 $EF$ 的交点”。你同意吗？请通过计算说明理由。'
    answer: '（1）$AB=10$ 米；（2）不同意。'
    official_solution_latex:
      - {title: 第（1）问, content: '设 $CH=x$，则 $BC=\sqrt3x$。由最佳视野点定义得 $CH^2=CA\cdot CB$，即 $x^2=5\sqrt3x$，取 $x=5\sqrt3$，所以 $BC=15$，$AB=10$ 米。'}
      - {title: 第（2）问, content: '作 $AB$ 的垂直平分线交 $AB$ 于 $K$、交 $EF$ 于 $G$。由坡度 $1:2$ 与 $CE=10$ 得 $CL=5$、$KL=15$、$AL=10$、$BL=20$，且 $LG=15\sqrt5$。因为 $LG^2=1125\ne LA\cdot LB=200$，所以点 $G$ 不是最佳视野点，不同意。'}
    question_crops: [{source: documents/初三/2025届-上海市杨浦区-初三一模数学-试卷及参考答案/004.png, box: [100, 620, 970, 1450], file: source-question.png}]
