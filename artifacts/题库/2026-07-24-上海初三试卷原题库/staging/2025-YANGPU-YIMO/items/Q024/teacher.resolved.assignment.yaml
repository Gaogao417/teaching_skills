  - type: problem
    id: Q024
    points: 12
    stem_latex: 在平面直角坐标系 $xOy$ 中，抛物线 $y=mx^2+6mx+n\ (m<0)$ 与 $x$ 轴交于点 $A(-1,0)$ 和点 $B$，顶点为 $D$。（1）求此抛物线的对称轴及点 $B$ 的坐标；（2）点 $P$ 是该抛物线上的一点，设对称轴与 $x$ 轴交于点 $E$，如果 $BP$ 恰好平分线段 $DE$，求点 $P$ 的坐标（用含 $m$ 的式子表示）；（3）在（2）的条件下，联结 $PD$、$AP$，当 $\angle DPB=\angle PAB$ 时，求 $m$ 的值。
    answer: （1）对称轴 $x=-3$，$B(-5,0)$；（2）$P(-2,-3m)$；（3）$m=\pm\dfrac{\sqrt3}{3}$。
    solution_steps:
    - title: 第（1）问
      content: 对称轴为 $x=-3$。由对称性得 $B(-5,0)$。
    - title: 第（2）问
      content: 由题意可得 $n=5m$，$E(-3,0)$，$D(-3,-4m)$。利用中点及相似关系解得点 $P(-2,-3m)$。
    - title: 第（3）问
      content: 延长 $DP$ 交 $x$ 轴于点 $H$，可得 $H(1,0)$。由 $\angle DPB=\angle PAB$ 得 $\triangle BPH\sim\triangle HAP$，所以 $PH^2=AH\cdot BH=12$，解得 $m=\pm\dfrac{\sqrt3}{3}$。
