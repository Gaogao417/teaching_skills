  - type: problem
    id: Q023
    points: 12
    stem_latex: 已知：如图，$\triangle ABC$ 中，$\angle A=90^\circ$，点 $D$ 是 $AB$ 边上一点，过点 $B$ 作 $BE\perp CD$，交 $CD$ 延长线于点 $E$，$AD\cdot BC=BE\cdot CD$。（1）求证：$BE^2=ED\cdot EC$；（2）求证：$AB\cdot BC=2CE\cdot BE$。
    answer: 证明见解析。
    solution_steps:
    - title: 第（1）问
      content: 由 $AD\cdot BC=BE\cdot CD$ 得 $\dfrac{AD}{BE}=\dfrac{CD}{BC}$。在直角三角形 $ADC$ 与 $BEC$ 中可证相似，继而得 $\angle EDB=\angle EBC$，所以 $\triangle EBD\sim\triangle ECB$，故 $BE^2=ED\cdot EC$。
    - title: 第（2）问
      content: 延长 $CA$、$BE$ 交于点 $H$。由角关系得 $BC=CH$，又 $BH=2BE=2EH$。可证 $\mathrm{Rt}\triangle ABH\sim\mathrm{Rt}\triangle BEC$，所以 $\dfrac{AB}{CE}=\dfrac{BH}{BC}$，即 $AB\cdot BC=2BE\cdot CE$。
