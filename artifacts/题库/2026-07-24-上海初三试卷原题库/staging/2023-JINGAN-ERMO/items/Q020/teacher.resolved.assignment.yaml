  - type: problem
    id: Q020
    points: 10
    stem_latex: 已知反比例函数 $y=\dfrac{k}{x}$ 的图像经过点 $(-1,4)$。（1）求 $k$ 的值；（2）解不等式组 $\begin{cases} x+3>1 \\ \dfrac{k}{x}>1 \end{cases}$（画反比例函数大致图像，写出解集）．
    answer: (1) $k=-4$；(2) ① $x>-2$；② $-4<x<0$；不等式组解集 $-2<x<0$
    clue: (1) 代入求 $k$；(2) 分别解两个不等式，借助图像求公共部分。
    solution_steps:
    - (1) $k=-1\times4=-4$。
    - (2) ① $x+3>1\Rightarrow x>-2$；② $-\dfrac{4}{x}>1\Rightarrow -4<x<0$。
    - 公共部分 $-2<x<0$。
