    id: Q009
    points: 4
    stem_latex: 已知 $f(x)=x^{-1}$，那么 $f(\sqrt{3})=$ ______
    answer: $\dfrac{\sqrt{3}}{3}$
    clue: 负整数指数幂 + 分母有理化。
    solution_steps:
    - $f(\sqrt{3})=(\sqrt{3})^{-1}=\dfrac{1}{\sqrt{3}}=\dfrac{\sqrt{3}}{3}$。
