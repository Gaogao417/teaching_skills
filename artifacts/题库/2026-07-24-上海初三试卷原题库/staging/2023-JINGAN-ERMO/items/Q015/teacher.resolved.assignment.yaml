  blocks:
  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如图，四边形 $ABCD$ 中，$P$、$Q$、$R$ 分别是对角线 $AC$、$BD$ 和边 $CD$ 的中点。设 $\vec{AD}=\vec{a}$，$\vec{BC}=\vec{b}$，那么 $\vec{PQ}=$ ______（用 $\vec{a}$、$\vec{b}$ 表示）
    answer: $\dfrac{1}{2}\vec{a}-\dfrac{1}{2}\vec{b}$
    clue: 用三角形中位线向量 $\vec{PR}=\frac12\vec{a}$、$\vec{QR}=\frac12\vec{b}$ 作差。
    solution_steps:
    - $\vec{PR}=\dfrac{1}{2}\vec{AD}=\dfrac{1}{2}\vec{a}$，$\vec{QR}=\dfrac{1}{2}\vec{BC}=\dfrac{1}{2}\vec{b}$。
    - $\vec{PQ}=\vec{PR}-\vec{QR}=\dfrac{1}{2}\vec{a}-\dfrac{1}{2}\vec{b}$。
