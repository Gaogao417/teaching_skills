  - type: short_answer
    id: Q010
    points: 4
    stem_latex: 方程 $\sqrt{2x-1}=x$ 的解是 ______
    answer: $x=1$
    clue: 两边平方化为一元二次方程，注意检验。
    solution_steps:
    - $2x-1=x^{2}$，$(x-1)^{2}=0$，$x=1$（满足 $x\geqslant\dfrac{1}{2}$）。
