  - type: choice
    id: Q005
    points: 4
    stem_latex: 油电混合汽车纯用电电费25元、纯燃油燃油费75元，每千米纯燃油比纯用电多0.6元。设每千米纯用电 $x$ 元，正确方程是（\quad）
    choices:
    - $\dfrac{75}{x-0.6}=\dfrac{25}{x}$
    - $\dfrac{75}{x}=\dfrac{25}{x-0.6}$
    - $\dfrac{75}{x}=\dfrac{25}{x+0.6}$
    - $\dfrac{75}{x+0.6}=\dfrac{25}{x}$
    answer: D
    clue: 以路程为等量，纯燃油单价 $x+0.6$。
    solution_steps:
    - 路程 $=\dfrac{75}{x+0.6}=\dfrac{25}{x}$。
    source_solution_images: []
