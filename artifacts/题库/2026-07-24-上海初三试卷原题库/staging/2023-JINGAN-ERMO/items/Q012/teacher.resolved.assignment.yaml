    stem_latex: 100个和尚分100个馒头，大和尚一人分3个，小和尚三人分1个，那么大和尚有 ______ 人
    answer: '25'
    clue: 列二元一次方程组求解。
    solution_steps:
    - 设大和尚 $x$ 人，$\begin{cases}3x+\dfrac{1}{3}y=100\\x+y=100\end{cases}$，解得 $x=25$。
