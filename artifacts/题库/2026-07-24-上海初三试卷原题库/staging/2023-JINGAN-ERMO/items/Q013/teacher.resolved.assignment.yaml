    stem_latex: 李明、王红、张立3位同学随机站成一排，王红恰好站在中间的概率是 ______
    answer: $\dfrac{1}{3}$
    clue: 列举排列总数与王红居中的情况数。
    solution_steps:
    - 共6种排列，王红居中2种，$P=\dfrac{2}{6}=\dfrac{1}{3}$。
