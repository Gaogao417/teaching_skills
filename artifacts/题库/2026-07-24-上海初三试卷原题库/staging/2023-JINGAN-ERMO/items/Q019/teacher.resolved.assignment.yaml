  - type: problem
    id: Q019
    points: 10
    stem_latex: 化简求值：$\dfrac{x^{2}-4x+4}{x^{2}-x}\div\left(\dfrac{2x-2}{x}-1\right)$，其中 $x=\sqrt[3]{-8}$
    answer: $\dfrac{4}{3}$
    clue: 分解因式、除法转乘法约分化简，再代入求值。
    solution_steps:
    - 原式 $=\dfrac{(x-2)^{2}}{x(x-1)}\div\dfrac{x-2}{x}=\dfrac{(x-2)^{2}}{x(x-1)}\cdot\dfrac{x}{x-2}=\dfrac{x-2}{x-1}$。
    - $x=\sqrt[3]{-8}=-2$，原式 $=\dfrac{-4}{-3}=\dfrac{4}{3}$。
