  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，$CE$、$CF$ 分别是平行四边形 $ABCD$ 的边 $AB$、$AD$ 上的高，对角线 $AC$、$BD$ 交于 $O$，且 $CE=CF$。（1）求证：四边形 $ABCD$ 是菱形；（2）当 $AB:BE=3:2$，$CE=5$ 时，求 $\angle CAE$ 的余切值．
    answer: (1) 见解析；(2) $\cot\angle CAE=\sqrt{5}$
    clue: (1) 由等面积法及 $CE=CF$ 得 $AD=AB$；(2) 设 $AB=3x$，由勾股求 $x$ 再求余切。
    solution_steps:
    - (1) $S_{ABCD}=\dfrac12 AD\cdot CF=\dfrac12 AB\cdot CE$，$CE=CF\Rightarrow AD=AB$，平行四边形为菱形。
    - (2) 设 $AB=3x$，$BE=2x$，$BC=AB=3x$；Rt$\triangle BCE$ 中 $5^{2}+(2x)^{2}=(3x)^{2}$，$x=\sqrt{5}$。
    - $AE=AB+BE=5\sqrt{5}$，$\cot\angle CAE=\dfrac{AE}{CE}=\sqrt{5}$。
