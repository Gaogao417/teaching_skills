    stem_latex: 能说明甲运动员成绩较好且更稳定的是（\quad）
    choices:
    - $\overline{x_{\text{甲}}}>\overline{x_{\text{乙}}}$ 且 $S^{2}_{\text{甲}}<S^{2}_{\text{乙}}$
    - $\overline{x_{\text{甲}}}>\overline{x_{\text{乙}}}$ 且 $S^{2}_{\text{甲}}>S^{2}_{\text{乙}}$
    - $\overline{x_{\text{甲}}}<\overline{x_{\text{乙}}}$ 且 $S^{2}_{\text{甲}}<S^{2}_{\text{乙}}$
    - $\overline{x_{\text{甲}}}<\overline{x_{\text{乙}}}$ 且 $S^{2}_{\text{甲}}>S^{2}_{\text{乙}}$
    answer: A
    clue: 成绩好→平均数大；更稳定→方差小。
    solution_steps:
    - 甲平均数大于乙且方差小于乙。
