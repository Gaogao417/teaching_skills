    stem_latex: 化简 $\left(-x^{3}\right)^{2}$ 的结果是（\quad）
    choices:
    - $-x^{6}$
    - $-x^{5}$
    - $x^{6}$
    - $x^{5}$
    answer: C
    clue: 积的乘方与幂的乘方，负数的偶次幂为正。
    solution_steps:
    - $\left(-x^{3}\right)^{2}=(-1)^{2}\cdot(x^{3})^{2}=x^{6}$。
