    stem_latex: 如图，扇形 $MON$ 半径为 $r$，圆心角 $\angle MON=90\degree$，$A$ 是 $\overset{\frown}{MN}$ 上动点（不与 $M,N$ 重合），$B,C$ 分别在 $OM,ON$ 上，四边形 $ABOC$ 为矩形，$G$ 在 $BC$ 上且 $CG=2BG$。（1）求证：$CG=\dfrac{2}{3}r$；（2）以 $A$ 为顶点、$AC$ 为一边作 $\angle CAP=\angle BCO$，射线 $AP$ 交射线 $ON$ 于 $P$，联结 $AN,OG$：① 当 $\angle BGO=\angle ANP$ 时，求 $\triangle OBG$ 与 $\triangle ANP$ 面积之比；② 把 $\triangle OGB$ 沿 $OG$ 翻折得 $\triangle OGB'$，当 $OB'\perp BC$ 时，求 $\angle P$ 的正切值．
