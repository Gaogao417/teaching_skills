  - type: problem
    id: Q025
    points: 14
    stem_latex: 如图，扇形 $MON$ 半径为 $r$，圆心角 $\angle MON=90\degree$，$A$ 是 $\overset{\frown}{MN}$ 上动点（不与 $M,N$ 重合），$B,C$ 分别在 $OM,ON$ 上，四边形 $ABOC$ 为矩形，$G$ 在 $BC$ 上且 $CG=2BG$。（1）求证：$CG=\dfrac{2}{3}r$；（2）以 $A$ 为顶点、$AC$ 为一边作 $\angle CAP=\angle BCO$，射线 $AP$ 交射线 $ON$ 于 $P$，联结 $AN,OG$：① 当 $\angle BGO=\angle ANP$ 时，求 $\triangle OBG$ 与 $\triangle ANP$ 面积之比；② 把 $\triangle OGB$ 沿 $OG$ 翻折得 $\triangle OGB'$，当 $OB'\perp BC$ 时，求 $\angle P$ 的正切值．
    answer: (1) 见解析；(2)① $\dfrac{4}{9}$；② $\tan\angle P=\dfrac{2\sqrt{5}}{5}$
    clue: (1) 矩形 $BC=OA=r$，$CG=\frac23 BC$；(2)① 证 $\triangle BGO\sim\triangle PNA$ 并由 $\triangle AOC\sim\triangle POA$ 求 $PN$；(2)② 翻折构造全等，列勾股方程求 $OB$ 再求正切。
    solution_steps:
    - (1) 矩形 $ABOC$ 中 $BC=OA=r$，$CG=\dfrac{2}{3}BC=\dfrac{2}{3}r$。
    - (2)① 证 $\angle PAO=90\degree$，$\triangle BGO\sim\triangle PNA$；由 $\triangle AOC\sim\triangle POA$ 得 $PO=\dfrac{3}{2}r$，$PN=\dfrac{1}{2}r$，面积比 $=\left(\dfrac{\frac13 r}{\frac12 r}\right)^{2}=\dfrac{4}{9}$。
    - (2)② 延长 $B'G$ 交 $OB$ 于 $Q$，由翻折及 $OB'\perp BC$ 证 $\triangle GQO\cong\triangle GHO$（ASA），列 $BQ^{2}+GQ^{2}=BG^{2}$ 解得 $OB=\dfrac{\sqrt{5}}{3}r$，$OC=\dfrac{2}{3}r$，$\tan\angle P=\dfrac{OC}{OB}=\dfrac{2\sqrt{5}}{5}$。
