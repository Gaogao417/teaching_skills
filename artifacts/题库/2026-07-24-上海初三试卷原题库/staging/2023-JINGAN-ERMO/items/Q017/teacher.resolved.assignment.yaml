  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 如图，$\triangle ABC$ 中 $AB=AC$，将 $\triangle ABC$ 绕点 $B$ 旋转，点 $C$ 落在 $AC$ 上的点 $E$，点 $A$ 落在点 $D$，$DE$ 与 $AB$ 交于 $F$，如果 $BE=BF$，那么 $\angle DBC=$ ______
    answer: $108\degree$
    clue: 用旋转保角保长 + 等腰设角，列方程求角。
    solution_steps:
    - 设 $\angle A=x$，由旋转与等腰推得 $\angle ABC=\angle C=2x$。
    - $2x+2x+x=180\degree$，$x=36\degree$，$\angle DBC=3x=108\degree$。
