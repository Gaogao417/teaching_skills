    stem_latex: 关于 $x$ 的一元二次方程 $x^{2}-3x+k=0$ 有两个不相等的实数根，则 $k$ 的取值范围是 ______
    answer: $k<\dfrac{9}{4}$
    clue: 两不等实根则 $\Delta>0$。
    solution_steps:
    - $\Delta=9-4k>0$，$k<\dfrac{9}{4}$。
