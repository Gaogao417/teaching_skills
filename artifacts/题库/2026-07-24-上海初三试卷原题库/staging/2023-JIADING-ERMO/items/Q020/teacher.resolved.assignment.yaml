  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases} x - 3y = 5 \\ x^{2} - 2xy + y^{2} = 4 \end{cases}$
    answer: $\begin{cases} x=-\dfrac{11}{2} \\ y=-\dfrac{7}{2} \end{cases}$ 或 $\begin{cases} x=\dfrac{1}{2} \\ y=-\dfrac{3}{2} \end{cases}$
    clue: ②化为 $(x-y)^{2}=4$，拆为两个一次方程组。
    solution_steps:
    - 由② $(x-y)^{2}=4$，$x-y=\pm2$，即 $x=y-2$ 或 $x=y+2$。
    - 与① $x-3y=5$ 联立，解得 $\begin{cases} x=-\dfrac{11}{2} \\ y=-\dfrac{7}{2} \end{cases}$ 或 $\begin{cases} x=\dfrac{1}{2} \\ y=-\dfrac{3}{2} \end{cases}$。
