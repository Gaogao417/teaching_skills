  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如图，在 $\triangle ABC$ 中，点 $D$ 是 $AC$ 边上一点，且 $AD:DC=2:1$。设 $\vec{BA}=\vec{a}$，$\vec{BC}=\vec{b}$，那么 $\vec{BD}=$ ______（用 $\vec{a}$、$\vec{b}$ 表示）
    answer: $\dfrac{1}{3}\vec{a}+\dfrac{2}{3}\vec{b}$
    clue: $\vec{BD}=\vec{BA}+\vec{AD}$，其中 $\vec{AD}=\dfrac{2}{3}\vec{AC}$。
    solution_steps:
    - $\vec{BD}=\vec{BA}+\dfrac{2}{3}(\vec{BC}-\vec{BA})=\dfrac{1}{3}\vec{a}+\dfrac{2}{3}\vec{b}$。
