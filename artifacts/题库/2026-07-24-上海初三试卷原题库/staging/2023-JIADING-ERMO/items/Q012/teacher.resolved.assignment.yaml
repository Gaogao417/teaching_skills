  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 如果函数 $y=x^{2}+k$ 的图像向左平移2个单位后经过原点，那么 $k=$ ______
    answer: $-4$
    clue: 左移2得 $y=(x+2)^{2}+k$，过原点代入 $(0,0)$。
    solution_steps:
    - 平移后 $y=(x+2)^{2}+k$，代入 $(0,0)$ 得 $4+k=0$，$k=-4$。
