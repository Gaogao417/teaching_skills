  - type: short_answer
    id: Q010
    points: 4
    stem_latex: 方程 $\sqrt{x+7}-x=1$ 的根是 ______
    answer: $x=2$
    clue: 移项后两边平方，注意检验（舍增根）。
    solution_steps:
    - $\sqrt{x+7}=x+1$，平方得 $x^{2}+x-6=0$，$x=-3$ 或 $x=2$。
    - 由 $x+1\geqslant0$ 舍去 $x=-3$，$\therefore x=2$。
