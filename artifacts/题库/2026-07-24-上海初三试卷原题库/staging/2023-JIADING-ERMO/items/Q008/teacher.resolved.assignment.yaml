    stem_latex: 如果分式 $\dfrac{1}{2x-3}$ 有意义，那么实数 $x$ 的取值范围是 ______
    answer: $x\neq\dfrac{3}{2}$
    clue: 分式有意义则分母不为零。
    solution_steps:
    - $2x-3\neq0$，$x\neq\dfrac{3}{2}$。
