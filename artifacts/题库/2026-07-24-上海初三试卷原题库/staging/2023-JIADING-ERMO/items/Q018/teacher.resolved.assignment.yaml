  blocks:
  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 如图，在 Rt$\triangle ABC$ 中，$\angle C=90\degree$，$AC=4$，$BC=2$，$D$、$E$ 分别是 $BC$、$BA$ 的中点，联结 $DE$。将 $\triangle BDE$ 绕点 $B$ 顺时针旋转，对应点为 $D_{1}$、$E_{1}$，如果 $E_{1}$ 落在线段 $AC$ 上，那么 $CD_{1}=$ ______
    answer: $\dfrac{3\sqrt{5}}{5}$
    clue: 旋转保长保角，证 $\triangle ABE_{1}\sim\triangle CBD_{1}$ 求比例。
    solution_steps:
    - $AB=2\sqrt{5}$，$BD=1$，$BE=\sqrt{5}$；旋转得 $\dfrac{BD_{1}}{BE_{1}}=\dfrac{BC}{BA}=\dfrac{1}{\sqrt{5}}$。
    - $\triangle ABE_{1}\sim\triangle CBD_{1}$，$CE_{1}=1$，$AE_{1}=3$，$\dfrac{AE_{1}}{CD_{1}}=\sqrt{5}$，$CD_{1}=\dfrac{3\sqrt{5}}{5}$。
