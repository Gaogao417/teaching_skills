    stem_latex: 计算：$\left(\sqrt{3}-\sqrt{2}\right)^{-1}-2\sin45\degree+\left|\sqrt{3}-2\right|-(1-\pi)^{0}$
    answer: $1$
    clue: 负指数幂分母有理化、特殊角三角函数、绝对值、零指数幂。
    solution_steps:
    - 原式 $=\dfrac{1}{\sqrt{3}-\sqrt{2}}-2\times\dfrac{\sqrt{2}}{2}+(2-\sqrt{3})-1$。
    - $=(\sqrt{3}+\sqrt{2})-\sqrt{2}+2-\sqrt{3}-1=1$。
