  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，在 Rt$\triangle ABC$ 中，$\angle C=90\degree$，$AB=13$，$\sin A=\dfrac{5}{13}$，以 $C$ 为圆心 $R$ 为半径作圆，使 $A$、$B$ 一点在圆内一点在圆外，那么 $R$ 的取值范围是 ______
    answer: $5<R<12$
    clue: 求 $CA$、$CB$，一点内一点外则 $R$ 介于两者之间。
    solution_steps:
    - $BC=13\times\dfrac{5}{13}=5$，$AC=\sqrt{13^{2}-5^{2}}=12$。
    - $5<R<12$。
