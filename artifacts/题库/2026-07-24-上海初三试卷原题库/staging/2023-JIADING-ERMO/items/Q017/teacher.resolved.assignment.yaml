  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 规定：函数图象上点 $P(x,y)$ 的 $y-x$ 称为"坐标差"，所有点"坐标差"的最大值称为该函数的"特征值"。一次函数 $y=2x+3$（$-2\leqslant x\leqslant1$）的"特征值"是 ______
    answer: '4'
    clue: 特征值 $=y-x=x+3$ 在区间上的最大值。
    solution_steps:
    - $y-x=2x+3-x=x+3$，在 $-2\leqslant x\leqslant1$ 上 $x=1$ 时最大。
    - 特征值 $=1+3=4$。
