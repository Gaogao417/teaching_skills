    stem_latex: 下列图形中既是轴对称图形又是中心对称图形的是（\quad）
    choices:
    - 等边三角形
    - 等腰梯形
    - 矩形
    - 正五边形
    answer: C
    clue: 矩形既是轴对称又是中心对称。
