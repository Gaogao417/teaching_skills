  - type: choice
    id: Q004
    points: 4
    stem_latex: 从 $1,2,3,4$ 四个数中任意取出2个数做加法，其和为奇数的概率是（\quad）
    choices:
    - $\dfrac{1}{2}$
    - $\dfrac{1}{3}$
    - $\dfrac{2}{3}$
    - $\dfrac{3}{4}$
    answer: C
    clue: 列举所有两数之和，数奇数结果占比。
    solution_steps:
    - 两数之和共6种等可能结果：$3,4,5,5,6,7$，其中奇数4种。
    - $P=\dfrac{4}{6}=\dfrac{2}{3}$。
