  - type: choice
    id: Q006
    points: 4
    stem_latex: 如图，$D$、$E$ 分别在 $\triangle ABC$ 的边 $AB$、$AC$ 上，$DE\parallel BC$，$AD:DB=1:3$，那么 $S_{\triangle DEC}:S_{\triangle DBC}$ 等于（\quad）
    choices:
    - $1:2$
    - $1:3$
    - $2:3$
    - $1:4$
    answer: D
    clue: 两三角形共高（$D$ 到 $BC$、$EC$ 距离关系），面积比等于底之比 $DE:BC$... 由 $AD:DB=1:3$ 得 $DE:BC=1:4$。
    solution_steps:
    - $DE\parallel BC\Rightarrow \triangle ADE\sim\triangle ABC$，$DE:BC=AD:AB=1:4$。
    - $S_{\triangle DEC}$ 与 $S_{\triangle DBC}$ 同高（以 $D$ 为顶点），面积比 $=EC:BC$；由共高关系得 $1:4$。
