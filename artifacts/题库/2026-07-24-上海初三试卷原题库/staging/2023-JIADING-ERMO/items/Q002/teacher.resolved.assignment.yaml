    stem_latex: 下列关于 $x$ 的方程一定有实数解的是（\quad）
    choices:
    - $x^{2}+1=0$
    - $x^{2}-x+1=0$
    - $x^{2}-bx+1=0$（$b$ 为常数）
    - $x^{2}-bx-1=0$（$b$ 为常数）
    answer: D
    clue: 逐项计算判别式 $\Delta$。
    solution_steps:
    - D 的 $\Delta=b^{2}+4>0$ 恒成立，一定有实数解。
