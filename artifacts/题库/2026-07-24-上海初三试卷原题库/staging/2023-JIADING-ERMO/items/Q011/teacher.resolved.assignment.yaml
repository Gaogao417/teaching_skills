  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 如果反比例函数 $y=\dfrac{a-1}{x}$ 的图像经过点 $(1,-2)$，那么这个反比例函数的解析式为 ______
    answer: $y=-\dfrac{2}{x}$
    clue: 代入点求 $a-1$。
    solution_steps:
    - $a-1=1\times(-2)=-2$，$\therefore y=-\dfrac{2}{x}$。
