  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，$CE$、$CF$ 分别是 $\angle ACB$ 和它的邻补角 $\angle ACD$ 的角平分线，$AE\perp CE$ 于 $E$，$AF\parallel EC$，连接 $EF$ 分别交 $AB$、$AC$ 于 $G$、$H$。（1）求证：四边形 $AECF$ 是矩形；（2）求 $GH$ 与 $BC$ 的数量关系．
    answer: (1) 四边形 $AECF$ 是矩形；(2) $GH=\dfrac{1}{2}BC$
    clue: (1) 由角平分线及邻补角得 $\angle ECF=90\degree$，结合垂直与平行得矩形；(2) 由矩形得 $H$ 为 $EF$ 中点，证 $\triangle AGH\sim\triangle ABC$。
    solution_steps:
    - (1) $\angle ECA+\angle ACF=\dfrac{1}{2}\times180\degree=90\degree$，$\angle ECF=90\degree$；$AF\parallel CE\Rightarrow \angle AFC=90\degree$；又 $\angle AEC=90\degree$，四边形 $AECF$ 是矩形。
    - (2) 矩形 $AECF$ 中 $HC=HF$，$\angle HCF=\angle HFC=\angle FCD\Rightarrow EF\parallel BD$；$\triangle AGH\sim\triangle ABC$，$AH=\dfrac{1}{2}AC$，$\therefore GH=\dfrac{1}{2}BC$。
