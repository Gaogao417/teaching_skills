  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 某区1200名学生参加"垃圾分类"竞赛，随机抽取部分成绩绘制频率分布直方图（如图）。估计该区成绩在 $89.5\sim99.5$ 分的学生有 ______ 名
    answer: '180'
    clue: 由各组频率之和为1求该组频率，再乘总数。
    solution_steps:
    - 该组频率 $=1-(0.01+0.02+0.025+0.03)\times10=0.15$。
    - $1200\times0.15=180$（名）。
