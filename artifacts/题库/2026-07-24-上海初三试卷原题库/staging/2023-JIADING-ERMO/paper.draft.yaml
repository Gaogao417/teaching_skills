        ECF=90\degree$；$AF\parallel CE\Rightarrow \angle AFC=90\degree$；又 $\angle
        AEC=90\degree$，四边形 $AECF$ 是矩形。
      - (2) 矩形 $AECF$ 中 $HC=HF$，$\angle HCF=\angle HFC=\angle FCD\Rightarrow EF\parallel
        BD$；$\triangle AGH\sim\triangle ABC$，$AH=\dfrac{1}{2}AC$，$\therefore GH=\dfrac{1}{2}BC$。
