        是矩形；（2）求 $GH$ 与 $BC$ 的数量关系．
      answer: (1) 四边形 $AECF$ 是矩形；(2) $GH=\dfrac{1}{2}BC$
      clue: (1) 由角平分线及邻补角得 $\angle ECF=90\degree$，结合垂直与平行得矩形；(2) 由矩形得 $H$ 为 $EF$ 中点，证
