        BCA$ 转化比值。
      solution_steps:
      - (1)① $\angle BAC=90\degree$，$\angle ACB=45\degree\Rightarrow AB=AC$；$\triangle
        BCE\cong\triangle FCE$（ASA），$BE=\frac12 BF$；$\triangle FBA\cong\triangle DPA$（ASA），$BF=PD$，$\therefore
        BE=\frac12 PD$。
      - ② 过 $P$ 作 $PM\parallel AC$ 交 $AB$ 于 $N$、交 $BF$ 于 $M$，同理证 $\triangle BPE\cong\triangle
        MPE$ 得 $BE=\frac12 BM$，$\triangle MBN\cong\triangle DPN$ 得 $BM=DP$，$\therefore
        BE=\frac12 DP$。
      - (2) 过 $P$ 作 $PH\parallel AC$ 交 $AB$ 于 $G$、交 $BF$ 于 $H$；$\triangle BEP\cong\triangle
        HEP$，$BE=\frac12 BH$；$\triangle PGD\sim\triangle BGH$，$\dfrac{BH}{PD}=\dfrac{BG}{GP}$；又
        $\triangle BPG\sim\triangle BCA$，$\dfrac{BG}{GP}=\dfrac{AB}{AC}=n$。
      - $\therefore \dfrac{2BE}{PD}=n$，即 $\dfrac{BE}{PD}=\dfrac{n}{2}$。
