      answer: (1) ① 见解析；② 仍成立；(2) $\dfrac{BE}{PD}=\dfrac{n}{2}$
      clue: (1)① 用 ASA 全等转化 $BE=\frac12 BF$ 且 $BF=PD$；② 过 $P$ 作 $PM\parallel AC$ 化归①；(2)
