      stem_latex: $A$、$B$ 两城铁路路程1800千米，列车提速后速度比提速前每小时增加20千米。（1）若提速前速度为每小时80千米，提速后行驶时间减少
        $t$ 小时，求 $t$；（2）若提速后行驶时间减少3小时，且规定安全速度不超过每小时140千米，提速后速度是否符合规定？
      answer: (1) $t=4.5$；(2) 符合规定
      clue: (1) 分别求前后时间作差；(2) 列分式方程求提速前后速度，注意检验。
      solution_steps:
      - (1) 提速前 $1800\div80=22.5$ 时，提速后 $1800\div100=18$ 时，$t=4.5$。
      - (2) 设提速前 $x$ 千米/时，$\dfrac{1800}{x}-\dfrac{1800}{x+20}=3$，$x=100$（$x=120$ 舍），提速后
        $120<140$，符合。
