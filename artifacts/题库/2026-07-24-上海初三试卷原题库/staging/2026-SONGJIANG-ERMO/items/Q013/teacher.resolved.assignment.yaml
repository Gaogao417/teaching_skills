  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 如图，已知点$G$是$\triangle ABC$的重心，如果$\overrightarrow{AB}=\vec{a}$，$\overrightarrow{BC}=\vec{b}$，那么$\overrightarrow{AG}=$______。（结果含$a$、$b$的式子表示）
    answer: $\dfrac{2}{3}\vec{a}+\dfrac{1}{3}\vec{b}$
    explanation: 官方参考答案：$\dfrac{2}{3}\vec{a}+\dfrac{1}{3}\vec{b}$。
    solution_steps:
    - 延长$AG$交$BC$于点$D$，
    - $\because$ 点$G$是$\triangle ABC$的重心，$\overrightarrow{BC}=\vec{b}$，
    - $\therefore AD$是$\triangle ABC$的中线，
    - $\therefore \overrightarrow{BD}=\dfrac{1}{2}\overrightarrow{BC}=\dfrac{1}{2}\vec{b}$，
    - 又$\overrightarrow{AB}=\vec{a}$，
    - $\therefore \overrightarrow{AD}=\vec{a}+\dfrac{1}{2}\vec{b}$，
    - $\because$ 点$G$是$\triangle ABC$的重心，
    - $\therefore \overrightarrow{AG}=2\overrightarrow{GD}$，
    - $\therefore \overrightarrow{AG}=\dfrac{2}{3}\left(\vec{a}+\dfrac{1}{2}\vec{b}\right)=\dfrac{2}{3}\vec{a}+\dfrac{1}{3}\vec{b}$。
    clue: 延长$AG$交$BC$于点$D$，先求出$\overrightarrow{BD}$，再利用三角形法则求出$\overrightarrow{AD}$，然后利用三角形重心的性质求解即可。
