  blocks:
  - type: short_answer
    id: Q009
    points: 4
    stem_latex: 函数$y=\dfrac{1}{2x-1}$的定义域是______。
    answer: $x\neq \dfrac{1}{2}$
    explanation: 官方参考答案：$x\neq \dfrac{1}{2}$。
    solution_steps:
    - 根据题意得：$2x-1\neq 0$，
    - 解得：$x\neq \dfrac{1}{2}$。
    - 故答案为：$x\neq \dfrac{1}{2}$。
    clue: 由于函数解析式是分式，则要求分母不为零，则可求得自变量的取值范围即函数的定义域。
