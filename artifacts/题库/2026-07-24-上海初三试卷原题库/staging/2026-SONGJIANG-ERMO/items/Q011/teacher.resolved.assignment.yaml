    id: Q011
    points: 4
    stem_latex: 如图，正五边形与正方形的两邻边相交，如果$\angle \alpha=110^\circ$，那么$\angle \beta=$______$^\circ$。
    answer: '52'
    explanation: 官方参考答案：52。
    solution_steps:
    - 根据题意得，$\angle A=\dfrac{180^\circ\times(4-2)}{4}=90^\circ$，$\angle B=\dfrac{180^\circ\times(5-2)}{5}=108^\circ$，
    - $\therefore \angle ADB+\angle ACB+\angle A+\angle B=360^\circ$，$\angle ACB=\angle \alpha=110^\circ$，
    - $\therefore \angle ADB=360^\circ-110^\circ-90^\circ-108^\circ=52^\circ$，
    - $\therefore \angle \beta=\angle ADB=52^\circ$。
    clue: 先根据正多边形每个内角为$\dfrac{180^\circ(n-2)}{n}$得到正五边形和正方形每个内角的度数，再结合四边形的内角和以及对顶角的性质可得答案。
