  blocks:
  - type: choice
    id: Q004
    points: 4
    stem_latex: 已知数据：$x_1$，$x_2$，$\cdots$，$x_n$的平均数是$m$，方差是$n$，那么数据$x_1+2$，$x_2+2$，$\cdots$，$x_n+2$的平均数和方差分别是（\quad）
    choices:
    - $m$，$n$
    - $m$，$n+2$
    - $m+2$，$n$
    - $m+2$，$n+2$
    answer: C
    explanation: 官方参考答案：C。
    solution_steps:
    - 数据$x_1$，$x_2$，$\cdots$，$x_n$的平均数是$m$，方差是$n$，
    - $\therefore\dfrac{x_1+x_2+\cdots+x_n}{n}=m$，即$x_1+x_2+\cdots+x_n=mn$，$\dfrac{(x_1-m)^2+(x_2-m)^2+\cdots+(x_n-m)^2}{n}=n$，
    - 那么数据$x_1+2$，$x_2+2$，$\cdots$，$x_n+2$的平均数为：$\dfrac{(x_1+2)+(x_2+2)+\cdots+(x_n+2)}{n}=\dfrac{(x_1+x_2+\cdots+x_n)+2n}{n}=\dfrac{mn+2n}{n}=m+2$；
    - 方差为：$\dfrac{[x_1+2-(m+2)]^2+[x_2+2-(m+2)]^2+\cdots+[x_n+2-(m+2)]^2}{n}=\dfrac{(x_1-m)^2+(x_2-m)^2+\cdots+(x_n-m)^2}{n}=n$。
    clue: 根据方差和平均数的计算公式求解即可。
