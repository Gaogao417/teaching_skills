    id: Q018
    points: 4
    stem_latex: 联结抛物线上任意两点的线段叫做抛物线的弦。如果抛物线的一条弦$AB$与抛物线的对称轴垂直，垂足为点$C$，抛物线的顶点为$D$，当$AB=4CD$时，$AB$的长称为这条抛物线的特征值。我们知道，平移不改变抛物线的特征值，那么抛物线$y=3x^2-2x+1$的特征值是______。
    answer: $\dfrac{1}{3}$
    explanation: 官方参考答案：$\dfrac{1}{3}$。
    solution_steps:
    - $\because$ 平移不改变抛物线的特征值，
    - $\therefore$ 抛物线$y=3x^2-2x+1$的特征值即为抛物线$y=3x^2$的特征值，
    - 此时抛物线$y=3x^2$的对称轴为$y$轴，
    - $\because AB=4CD$，$AB\perp y$轴，
    - $\therefore AB=2BC=4CD$，即$BC=2CD$
    - 设$BC=m$，则$CD=\dfrac{1}{2}m$，
    - $\therefore B\left(m,\dfrac{1}{2}m\right)$，
    - 将点$B\left(m,\dfrac{1}{2}m\right)$代入$y=3x^2$，则$3m^2=\dfrac{1}{2}m$，
    - 解得$m=\dfrac{1}{6}$或$m=0$（舍去）
    - $\therefore AB=2\times\dfrac{1}{6}=\dfrac{1}{3}$。
    clue: 由于平移不改变抛物线的特征值，抛物线$y=3x^2-2x+1$的特征值即为抛物线$y=3x^2$的特征值，据此画出图象结合新定义求解即可。
