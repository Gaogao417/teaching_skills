  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 现有三张卡片，上面分别写着2、3、6，随机选择其中的两张，较大数能被较小数整除的概率是______。
    answer: $\dfrac{2}{3}$
    explanation: 官方参考答案：$\dfrac{2}{3}$。
    solution_steps:
    - 根据题意，从写有2，3，6的三张卡片中随机抽取两张，所有等可能的结果为：$(2,3)$，$(2,6)$，$(3,6)$，共3种等可能的结果，
    - 其中较大数能被较小数整除的结果有：$(2,6)$，$(3,6)$，共2种，
    - 根据概率公式，可得所求概率为$\dfrac{2}{3}$。
    clue: 先列举出随机抽取两张卡片所有等可能的结果，再找出其中满足较大数能被较小数整除的结果个数，最后根据概率公式计算即可。
