  blocks:
  - type: choice
    id: Q003
    points: 4
    stem_latex: 下列函数中，$y$是$x$的反比例函数的是（\quad）
    choices:
    - $y=x^2$
    - $y=\dfrac{1}{x+2}$
    - $y=\dfrac{2}{x}$
    - $y=\dfrac{x}{2}$
    answer: C
    explanation: 官方参考答案：C。
    solution_steps:
    - A、$y=x^2$是二次函数，不符合反比例函数定义，该选项不符合题意；
    - B、$y=\dfrac{1}{x+2}$的分母不是$x$的单项式，不符合反比例函数定义，该选项不符合题意；
    - C、$y=\dfrac{2}{x}$，符合反比例函数定义，该选项符合题意；
    - D、$y=\dfrac{x}{2}$是正比例函数，不符合反比例函数定义，该选项不符合题意。
    clue: 根据反比例函数的定义，逐一判断各选项即可得出结论。
