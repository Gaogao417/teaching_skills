    stem_latex: 【问题提出】把一个长、宽分别为$a$、$b$（$b<a<4b$）的长方形（如图1），剪拼成一个正方形（拼接的时候无缝隙、不重叠，裁剪的损耗忽略不计）\n【方案设计】某学习小组提出以下设计思考：\n（1）根据剪拼前后图形面积不变，可知剪拼后正方形的边长为______。（用含$a$、$b$的代数式表示）\n如图2，延长$BC$至点$E$，使$CE=b$，以$BE$为直径作半圆$O$。延长$CD$交$\odot O$于点$F$，联结$BF$、$EF$，可得$\angle BFE=90^\circ$（后续说理如需用到这一结论，可直接使用），他们认为：“就是所求正方形的边长”；\n如图3，以为边，在左侧作正方形$CFGH$，$BF$分别与$GH$、$AD$交于点$M$、$N$，沿虚线$BN$、$HM$裁剪，$\triangle BHM$、$\triangle ABN$可以通过适当的图形运动分别与$\triangle NDF$、$\triangle GMF$叠合，拼成正方形$CFGH$。\n【论证说明】\n（2）如图2，该学习小组认为：“$CF$是所求正方形的边长”，试说明理由；\n（3）$\triangle BHM$可以通过怎样的图形运动与$\triangle NDF$叠合，并说明它们能够叠合的理由。
    explanation: 官方参考答案：（1）$\sqrt{ab}$；（2）见解析；（3）$\triangle BHM$可以通过平移运动与$\triangle NDF$叠合，见解析。
