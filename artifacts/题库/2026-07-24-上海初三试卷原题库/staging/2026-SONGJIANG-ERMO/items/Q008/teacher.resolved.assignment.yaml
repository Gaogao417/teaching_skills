  blocks:
  - type: short_answer
    id: Q008
    points: 4
    stem_latex: 分解因式：$x^2-2xy+y^2-1=$______。
    answer: $(x-y+1)(x-y-1)$
    explanation: 官方参考答案：$(x-y+1)(x-y-1)$。
    solution_steps:
    - $x^2-2xy+y^2-1$
    - $=(x^2-2xy+y^2)-1$
    - $=(x-y)^2-1^2$
    - $=(x-y+1)(x-y-1)$。
    clue: 先分组，然后将前三项利用完全平方公式分解，得到一个整体的平方，再利用平方差公式继续分解即可。
