  title: 一、选择题（本大题共6题，每题4分，满分24分）
  type: practice
  visibility: both
  blocks:
  - type: choice
    id: Q001
    points: 4
    stem_latex: 下列计算正确的是（\quad）
    choices:
    - $a^3-a^2=a$
    - $a^2\cdot a^3=a^6$
    - $\sqrt{a^2}=a$
    - $\sqrt[3]{a^3}=a$
    answer: D
    explanation: 官方参考答案：D。
    solution_steps:
    - A、$a^3$与$a^2$不是同类项，不能合并，该选项不符合题意；
    - B、$a^2\cdot a^3=a^5\neq a^6$，该选项不符合题意；
    - C、$\sqrt{a^2}=|a|\neq a$，该选项不符合题意；
    - D、$\sqrt[3]{a^3}=a$，该选项符合题意。
    clue: 根据整式运算、同底数幂乘法、二次根式与立方根的性质，逐一判断各选项。
