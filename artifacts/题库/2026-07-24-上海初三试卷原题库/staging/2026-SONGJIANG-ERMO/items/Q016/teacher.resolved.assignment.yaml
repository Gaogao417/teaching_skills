  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 一个水池的容积是90m$^3$，水池内蓄有一定量的水，现在保持一定的速度向水池中蓄水，1小时后水池的水量是15m$^3$，5小时后水池的水量是35m$^3$，那么8小时后水池的水量是______m$^3$。
    answer: '50'
    explanation: 官方参考答案：50。
    solution_steps:
    - 设水池内原有的水量为$x$，则1小时注入水量为$(15-x)$，
    - $5(15-x)+x=35$
    - 解得$x=10$，
    - 8小时后水池的水量是$8\times(15-10)+10=50$（m$^3$）。
    clue: 设水池内原有的水量为$x$，则1小时注入水量为$(15-x)$，根据题意列方程求出$x=10$，再计算8小时后水池的水量即可。
