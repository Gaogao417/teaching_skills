    id: Q014
    points: 4
    stem_latex: 小明准备去距离学校10千米的博物馆，已知汽车的速度比骑自行车的速度快30千米/小时，乘汽车去比骑自行车去可以早$\dfrac{3}{4}$小时到达。设骑自行车的速度为$x$千米/小时，可列方程为______。
    answer: $\dfrac{10}{x}-\dfrac{10}{x+30}=\dfrac{3}{4}$
    explanation: 官方参考答案：$\dfrac{10}{x}-\dfrac{10}{x+30}=\dfrac{3}{4}$。
    solution_steps:
    - 设骑自行车的速度为$x$千米/小时，
    - $\because$ 汽车的速度比骑自行车的速度快30千米/小时，
    - $\therefore$ 汽车的速度为$(x+30)$千米/小时。
    - $\because$ 路程为10千米，
    - $\therefore$ 骑自行车所需时间为$\dfrac{10}{x}$小时，乘汽车所需时间为$\dfrac{10}{x+30}$小时。
    - 根据题意，乘汽车去比骑自行车去可以早$\dfrac{3}{4}$小时到达，
    - 即骑自行车的时间减去乘汽车的时间等于$\dfrac{3}{4}$小时，
    - $\therefore$ 可列方程为$\dfrac{10}{x}-\dfrac{10}{x+30}=\dfrac{3}{4}$。
    clue: 设骑自行车的速度为$x$千米/小时，则汽车的速度为$(x+30)$千米/小时，根据时间=路程$\div$速度，分别表示出骑自行车和乘汽车所需的时间，再根据乘汽车比骑自行车早到$\dfrac{3}{4}$小时列出方程即可。
