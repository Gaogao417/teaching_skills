  title: 一、选择题（本大题共6题，每题4分，满分24分）
  type: practice
  visibility: both
  blocks:
  - type: choice
    id: Q005
    points: 4
    stem_latex: 已知命题：\textcircled{1}垂直于弦的直径平分这条弦；\textcircled{2}平分弦的直径垂直于这条弦，下列对这两个命题的判断，正确的是（\quad）
    choices:
    - \textcircled{1}是真命题，\textcircled{2}是假命题
    - \textcircled{1}是假命题，\textcircled{2}是真命题
    - \textcircled{1}和\textcircled{2}都是真命题
    - \textcircled{1}和\textcircled{2}都是假命题
    answer: A
    explanation: 官方参考答案：A。
    solution_steps:
    - 根据垂径定理，垂直于弦的直径平分这条弦，因此命题\textcircled{1}是真命题；
    - 对于命题\textcircled{2}，当被平分的弦是直径时，任意两条直径互相平分，但不一定垂直，该命题缺少“被平分的弦不是直径”的条件，因此命题\textcircled{2}是假命题，
    - 综上，\textcircled{1}是真命题，\textcircled{2}是假命题。
    clue: 根据垂径定理及其推论求解即可。
