  blocks:
  - type: short_answer
    id: Q010
    points: 4
    stem_latex: 统计数据显示，截至2026年3月30日，电影《飞驰人生3》的票房总收入约为44亿元。如果该电影的平均票价是每张40元，那么售出的电影票大约______张。（用科学记数法表示）
    answer: $1.1\times 10^8$
    explanation: 官方参考答案：$1.1\times 10^8$。
    solution_steps:
    - 44亿元$=4400000000$元$=4.4\times 10^9$元，
    - 根据题意计算售出电影票的张数：$\dfrac{4.4\times 10^9}{40}=1.1\times 10^8$。
    clue: 先将总票房统一单位为元，再根据售票张数等于总票房除以平均票价计算结果，最后将结果用科学记数法表示即可。
