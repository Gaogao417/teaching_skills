    block:
      stem_latex: "在平面直角坐标系$xOy$中，一次函数$y=\\dfrac{1}{2}x+2$与$x$轴交于点$A$，与$y$轴交于点$B$，$C$是直线$AB$上一点（不与点$A$重合），且$AB=BC$，抛物线$y=ax^2+bx-2$经过$A$、$C$两点。\\n（1）求抛物线的表达式；\\n（2）点$D$在抛物线上，且位于第一象限，如果四边形$OBCD$是梯形，求梯形$OBCD$的面积；\\n（3）点$P$、$Q$都在第三象限，其中点$P$在抛物线上，点$Q$在抛物线的对称轴上，如果$\\triangle APQ$与$\\triangle AOB$相似，且边$PQ$与边$OB$对应，求点$Q$的坐标。"
      answer: "（1）$y=\\dfrac{1}{4}x^2+\\dfrac{1}{2}x-2$；（2）$4+2\\sqrt{2}$；（3）$Q(-1,-1)$，$Q(-1,8-2\\sqrt{19})$"
      explanation: "官方参考答案：（1）$y=\\dfrac{1}{4}x^2+\\dfrac{1}{2}x-2$；（2）$4+2\\sqrt{2}$；（3）$Q(-1,-1)$，$Q(-1,8-2\\sqrt{19})$。"
      solution_steps:
      - "【小问1详解】"
      - "解：由题可知，一次函数$y=\\dfrac{1}{2}x+2$与$x$轴交于点$A$，与$y$轴交于点$B$，"
      - "则点$A(-4,0)$，$B(0,2)$，"
      - "$\\because C$是直线$AB$上一点，且$AB=BC$，"
      - "$\\therefore$ 点$B$是线段$AC$的中点，"
      - "设点$C(m,n)$，"
      - "$\\therefore$ 点$B\\left(\\dfrac{m+(-4)}{2},\\dfrac{n+0}{2}\\right)$，"
