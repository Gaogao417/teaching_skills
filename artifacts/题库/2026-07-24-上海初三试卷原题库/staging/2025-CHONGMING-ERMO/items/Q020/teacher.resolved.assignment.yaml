  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程：$\dfrac{2x}{x^{2}-1}-\dfrac{1}{x+1}=1$
    solution_steps:
    - 去分母（乘 $x^2-1$）：$2x-(x-1)=x^2-1$。
    - 整理：$x^2-x-2=0$，$(x-2)(x+1)=0$。
    - $x_1=2$，$x_2=-1$。
    - 检验：$x=-1$ 使分母为零，舍去。$\therefore x=2$。
    clue: 分式方程去分母后解一元二次方程，必须检验增根。
    answer: $x=2$
    source_solution_images: []
