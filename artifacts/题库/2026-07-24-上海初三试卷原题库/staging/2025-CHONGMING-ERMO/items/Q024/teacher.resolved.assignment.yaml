  - type: problem
    id: Q024
    points: 12
    stem_latex: '"倒数点"：横纵坐标互为倒数。直线 $l: y=-x-c\;(c>0)$ 上有且只有一个"倒数点" $P$。

      (1) 求直线 $l$ 的解析式及点 $P$ 的坐标；

      (2) 抛物线 $y=ax^2+bx+c$ 经过 $P$ 和 $Q(1,7)$，顶点为 $M$。

      ① 求顶点 $M$ 的坐标；

      ② 抛物线上是否存在点 $N$，使得 $\triangle PMN$ 是以 $PM$ 为直角边的直角三角形，若存在求出 $N$ 的坐标。'
    solution_steps:
    - (1) 设 $P(t,\frac{1}{t})$ 代入：$t^2+ct+1=0$，$\Delta=c^2-4=0$，$c=2$，$P(-1,-1)$。
    - (2) ① $P(-1,-1)$，$Q(1,7)$，$c=2$ 代入解方程组得 $a=1,b=4,c=2$。
    - $y=x^2+4x+2=(x+2)^2-2$，$M(-2,-2)$。
    - ② 设 $N(m,m^2+4m+2)$，分 $\angle PMN=90^{\circ}$ 和 $\angle NPM=90^{\circ}$。
    - $\angle PMN=90^{\circ}$：$m^2+5m+6=0$，$m=-3$，$N(-3,-1)$。
    - $\angle NPM=90^{\circ}$：$m^2+5m+4=0$，$m=-4$，$N(-4,2)$。
    clue: 判别式唯一交点条件+待定系数法+直角三角形分类讨论。
    answer: (1) $y=-x-2$，$P(-1,-1)$；(2) ① $M(-2,-2)$；② $N(-3,-1)$ 或 $N(-4,2)$
