  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 在平面直角坐标系 $xOy$ 中，点 $A(1,m)$ 是反比例函数 $y=\dfrac{k}{x}\;(k>0)$ 图像上一点，点 $B$ 是 $y$ 轴上一点，$AO=AB$，将 $\triangle AOB$ 绕点 $O$ 旋转 $180^{\circ}$，对应点为 $C,D$。当四边形 $ABCD$ 的面积等于8时，点 $C$ 的坐标是______
    answer: $(-1,-2)$
    clue: 旋转得平行四边形，$S_{\triangle AOB}=2$，$BO=2m$，$m=2$，$C(-1,-2)$。
    solution_steps:
    - $S_{\triangle AOB}=\frac{1}{4}\times8=2$，$BO=2m$。
    - $\frac{1}{2}\times2m\times1=2$，$m=2$，$C(-1,-2)$。
