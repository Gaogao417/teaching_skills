    stem_latex: 计算：$\dfrac{x}{x^2 - 4} + \dfrac{2}{x^2 - 4} =$______
    answer: $\dfrac{1}{x-2}$
    clue: 同分母分式相加后约分。
    solution_steps:
    - $=\dfrac{x+2}{(x+2)(x-2)}=\dfrac{1}{x-2}$。
