  - type: problem
    id: Q022
    points: 10
    stem_latex: '消防机器狗搜救应用。楼梯横断面：$BC \parallel AD$，$CD \perp AD$，$AB=6$ 米，$BC=2$ 米，$AD=(3\sqrt{3}+2)$ 米。

      (1) 求斜坡 $AB$ 的坡比；

      (2) 探测仪在斜坡上点 $M,N$ 处，$\angle$ 仰角 $15^{\circ}$，$PG=5$ 米，$GC=0.52$ 米，$PM=QN$，$PM \perp AB$，$QN \perp AB$，求 $MN$ 的长。（$\sin 15^{\circ} \approx 0.26$，$\cos 15^{\circ} \approx 0.97$，$\tan 15^{\circ} \approx 0.27$）'
    solution_steps:
    - (1) 过 $B$ 作 $BE\perp AD$ 于 $E$，矩形 $BCDE$，$DE=2$，$AE=3\sqrt{3}$。
    - $BE=\sqrt{36-27}=3$，坡比 $i=\dfrac{BE}{AE}=\dfrac{3}{3\sqrt{3}}=\dfrac{1}{\sqrt{3}}$ 即 $1:\sqrt{3}$。
    - (2) $\angle A=30^{\circ}$，$GF=5\sin15^{\circ}\approx1.3$，$HP=CF=1.3-0.52=0.78$。
    - $\angle HQP=30^{\circ}$，$QP=2HP=1.56$，$MN=QP=1.56$ 米。
    clue: 解直角三角形+矩形判定+坡比。
    answer: (1) $1:\sqrt{3}$；(2) $MN \approx 1.56$ 米
