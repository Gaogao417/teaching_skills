    stem_latex: '消防机器狗搜救应用。楼梯横断面：$BC \parallel AD$，$CD \perp AD$，$AB=6$ 米，$BC=2$ 米，$AD=(3\sqrt{3}+2)$ 米。

      (1) 求斜坡 $AB$ 的坡比；

      (2) 探测仪在斜坡上点 $M,N$ 处，$\angle$ 仰角 $15^{\circ}$，$PG=5$ 米，$GC=0.52$ 米，$PM=QN$，$PM \perp AB$，$QN \perp AB$，求 $MN$ 的长。（$\sin 15^{\circ} \approx 0.26$，$\cos 15^{\circ} \approx 0.97$，$\tan 15^{\circ} \approx 0.27$）'
