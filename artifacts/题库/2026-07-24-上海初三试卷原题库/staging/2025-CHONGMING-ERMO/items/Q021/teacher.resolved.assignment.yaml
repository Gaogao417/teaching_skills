  - type: problem
    id: Q021
    points: 10
    stem_latex: '在 $\mathrm{Rt}\triangle ABC$ 中，$\angle ACB=90^{\circ}$，$AC=5$，$BC=8$。点 $D$ 在边 $AC$ 上运动（不与 $A$、$C$ 重合），$DE \parallel BC$，交 $AB$ 于点 $E$，设 $AD=x$，$\triangle BDE$ 的面积为 $y$。

      (1) 求 $y$ 关于 $x$ 的函数关系式，及自变量 $x$ 的取值范围；

      (2) 设 $BD$ 与 $CE$ 相交于点 $G$，当点 $G$ 是 $\triangle ABC$ 的重心时，求 $\triangle BEG$ 的面积。'
    solution_steps:
    - (1) $\triangle ADE \sim \triangle ACB$，$\dfrac{DE}{BC}=\dfrac{AD}{AC}$，$DE=\dfrac{8}{5}x$。
    - $CD=5-x$，$y=\dfrac{1}{2}\cdot DE \cdot CD=\dfrac{1}{2}\cdot\dfrac{8}{5}x\cdot(5-x)=-\dfrac{4}{5}x^2+4x$（$0<x<5$）。
    - (2) 重心 $G$：$\dfrac{BG}{BD}=\dfrac{2}{3}$，$AD=\dfrac{5}{2}$，$y=5$。
    - $\dfrac{S_{\triangle BEG}}{S_{\triangle BDE}}=\dfrac{BG}{BD}=\dfrac{2}{3}$，$S_{\triangle BEG}=\dfrac{2}{3}\times5=\dfrac{10}{3}$。
    clue: 相似三角形+重心性质，同高面积比。
    answer: (1) $y=-\dfrac{4}{5}x^2+4x$（$0<x<5$）；(2) $\dfrac{10}{3}$
