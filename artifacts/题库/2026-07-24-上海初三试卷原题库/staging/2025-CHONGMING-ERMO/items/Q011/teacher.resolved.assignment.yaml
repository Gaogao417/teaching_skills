    id: Q011
    points: 4
    stem_latex: 已知正比例函数 $y = kx$（$k$ 是常数，且 $k \neq 0$）的函数值 $y$ 随 $x$ 的增大而增大，且不经过点 $(1,1)$，那么这个正比例函数的解析式可以是______（只需写一个）
    answer: $y = 2x$（答案不唯一）
    clue: $k>0$ 且 $k \neq 1$。
    solution_steps:
    - $k>0$ 且 $k \neq 1$，取 $k=2$，$y=2x$。
