  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如果二次函数 $y=ax^{2}+bx\;(a\neq 0)$ 的图像向左平移1个单位长度后关于 $y$ 轴对称，那么 $b=$______。（用含 $a$ 的代数式表示）
    answer: $-2a$
    clue: 平移后对称轴 $x=-\frac{b}{2a}-1=0$，得 $b=-2a$。
    solution_steps:
    - 对称轴 $x=-\frac{b}{2a}$，左移1后 $x=-\frac{b}{2a}-1=0$。
    - $\therefore b=-2a$。
    source_solution_images: []
