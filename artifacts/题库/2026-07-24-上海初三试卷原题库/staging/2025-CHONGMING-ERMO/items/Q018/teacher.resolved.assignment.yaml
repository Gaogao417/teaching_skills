  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 在矩形 $ABCD$ 中，$AB=8$，$BC=6$，$AC$ 与 $BD$ 相交于点 $O$，点 $P$ 是在直线 $AB$ 上方到 $AB$ 距离等于3的一个动点，当点 $O$ 在以点 $A$ 为圆心、$AP$ 为半径长的圆上时，$BP$ 的长为______
    answer: $5$ 或 $3\sqrt{17}$
    clue: $AO=5$，$AP=5$，$AE=4$，$BE=4$，$PB=5$；另一位置 $BP'=3\sqrt{17}$。
    solution_steps:
    - $AO=\frac{1}{2}AC=5$，$AP=AO=5$，$AE=\sqrt{25-9}=4$。
    - $BE=4$，$PB=\sqrt{9+16}=5$；或 $BF=12$，$BP'=\sqrt{9+144}=3\sqrt{17}$。
