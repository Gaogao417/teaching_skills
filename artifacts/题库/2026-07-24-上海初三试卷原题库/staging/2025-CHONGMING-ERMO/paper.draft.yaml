    block:
      stem_latex: 计算：$|\sqrt{3}-1|-\dfrac{2}{\sqrt{3}}-8^{\frac{1}{3}}+(-1)^{0}$
      solution_steps:
      - $|\sqrt{3}-1|=\sqrt{3}-1$
      - $\dfrac{2}{\sqrt{3}}=\dfrac{2\sqrt{3}}{3}$
      - $8^{\frac{1}{3}}=2$
      - $(-1)^0=1$
      - 原式 $= \sqrt{3}-1-\dfrac{2\sqrt{3}}{3}-2+1=\dfrac{\sqrt{3}}{3}-2$
      clue: 绝对值、分母有理化、立方根、零指数幂。
      answer: $\dfrac{\sqrt{3}}{3}-2$
