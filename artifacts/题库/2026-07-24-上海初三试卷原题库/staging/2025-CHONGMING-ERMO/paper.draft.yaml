      - $\overrightarrow{FC}=\overrightarrow{FB}+\overrightarrow{BC}=\frac{1}{2}\vec{a}+\frac{1}{4}\vec{b}-\vec{b}=\frac{1}{2}\vec{a}-\frac{3}{4}\vec{b}$。
