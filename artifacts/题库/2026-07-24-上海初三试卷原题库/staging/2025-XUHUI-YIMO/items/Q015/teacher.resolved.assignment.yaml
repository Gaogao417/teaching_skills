    stem_latex: 如图，热气球探测器显示，从热气球 $A$ 处测得一栋楼顶部 $C$ 处的仰角是 $37^\circ$，测得这栋楼底部 $B$ 处的俯角是 $60^\circ$，热气球与这栋楼的水平距离是30米，那么这栋楼的高度是 \underline{\hspace{2cm}} 米（精确到0.1米；参考数据：$\sin37^\circ\approx0.60$，$\cos37^\circ\approx0.80$，$\tan37^\circ\approx0.75$，$\sqrt3\approx1.7$）。
