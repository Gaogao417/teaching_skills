  - type: problem
    id: Q023
    points: 12
    stem_latex: '如图，在梯形 $ABCD$ 中，$AD\parallel BC$，$BD$ 是梯形 $ABCD$ 对角线，$BD^2=AD\cdot BC$。

      \begin{enumerate}

      \item 求证：$AD\cdot CD=AB\cdot BD$；

      \item 以 $CD$ 为一边作 $\angle CDE=\angle ADB$，$DE$ 交边 $BC$ 于点 $E$，求证：$\dfrac{CD^2}{BD^2}=\dfrac{CE}{AD}$。

      \end{enumerate}

      '
    answer: 见证明。
    solution_steps:
    - title: 第（1）问
      content: 由 $AD\parallel BC$，得 $\angle ADB=\angle CBD$。又 $BD^2=AD\cdot BC$，所以 $\dfrac{AD}{BD}=\dfrac{BD}{BC}$，故 $\triangle ADB\sim\triangle DBC$，从而 $\dfrac{AD}{BD}=\dfrac{AB}{CD}$，即 $AD\cdot CD=AB\cdot BD$。
    - title: 第（2）问
      content: 由角关系得 $\triangle CDE\sim\triangle CBD$，所以 $CD^2=EC\cdot BC$。又 $BD^2=AD\cdot BC$，故 $\dfrac{CD^2}{BD^2}=\dfrac{CE}{AD}$。
