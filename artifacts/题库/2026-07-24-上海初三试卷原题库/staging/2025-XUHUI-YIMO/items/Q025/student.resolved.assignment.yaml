    stem_latex: '如图，在 $\triangle ABC$ 中，$AB=AC=\sqrt5$，$BC=2$，点 $D$ 是边 $AC$ 的中点，点 $M$、$N$ 是射线 $BD$ 上的动点（点 $M$ 在左边），以 $CM$ 为一边作 $\angle MCN=\angle ABC$。

