  - id: Q022
    source_key: 2025-XUHUI-YIMO-Q22
    question_number: 22
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [特殊角三角比, 解直角三角形]
    stem_latex: |
      \begin{enumerate}
      \item 计算：$\dfrac{\cot30^\circ-\cot45^\circ}{\tan60^\circ+2\sin30^\circ}$；
      \item 如图，在 $\mathrm{Rt}\triangle ABC$ 和 $\mathrm{Rt}\triangle DEF$ 中，$\angle B=\angle E=90^\circ$，$\angle A=30^\circ$，$\angle D=45^\circ$，$DE=AC=2$。将边 $DE$ 和 $AC$ 重合，拼接成四边形 $ABCF$，求 $\sin15^\circ$ 和 $\tan75^\circ$ 的值。
      \end{enumerate}
    answer: '（1）$2-\sqrt3$；（2）$\sin15^\circ=\dfrac{\sqrt6-\sqrt2}{4}$，$\tan75^\circ=2+\sqrt3$。'
    official_solution_latex:
      - title: 第（1）问
        content: '原式$=\dfrac{\sqrt3-1}{\sqrt3+1}=2-\sqrt3$。'
      - title: 第（2）问
        content: '作辅助垂线，计算得 $AH=\sqrt3-1$，$AF=2\sqrt2$，$HF=\sqrt3+1$，所以 $\sin15^\circ=\dfrac{\sqrt6-\sqrt2}{4}$，$\tan75^\circ=2+\sqrt3$。'
    question_crops: [{source: documents/初三/2025届-上海市徐汇区-初三一模数学-试卷及参考答案/004.png, box: [140, 980, 950, 1450], file: source-question.png}]
