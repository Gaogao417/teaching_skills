  - id: Q020
    source_key: 2025-XUHUI-YIMO-Q20
    question_number: 20
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [二次函数, 待定系数法, 图像平移]
    stem_latex: |
      为了得出滑行距离 $s$（米）与滑行时间 $t$（秒）之间的关系式，测得数据：
      $t=0,1,2,3,4$ 时，$s=0,4.5,14,28.5,48$。以 $t$ 为横轴、$s$ 为纵轴描点，并用平滑曲线连接。
      \begin{enumerate}
      \item 设该条曲线的表达式为 $s=at^2+bt+c\ (a\ne0)$，求 $s$ 与 $t$ 的函数关系式；
      \item 若将抛物线先向右平移2个单位，再向上平移20个单位，求平移后所得抛物线的表达式。
      \end{enumerate}
    answer: '（1）$s=\dfrac52t^2+2t$；（2）$s=\dfrac52(t-\dfrac85)^2-\dfrac{98}{5}$。'
    official_solution_latex:
      - title: 第（1）问
        content: '代入三组数据，解得 $a=2.5$，$b=2$，$c=0$，所以 $s=2.5t^2+2t$。'
      - title: 第（2）问
        content: '$s=\dfrac52(t+\dfrac25)^2-\dfrac25$，先右移2个单位再上移20个单位，得 $s=\dfrac52(t-\dfrac85)^2-\dfrac{98}{5}$。'
    question_crops: [{source: documents/初三/2025届-上海市徐汇区-初三一模数学-试卷及参考答案/004.png, box: [140, 130, 950, 660], file: source-question.png}]
