  - id: Q023
    source_key: 2025-XUHUI-YIMO-Q23
    question_number: 23
    question_type: problem
    section_title: 三、解答题
    points: 12
    difficulty: challenge
    skill_tags: [梯形, 相似三角形]
    stem_latex: |
      如图，在梯形 $ABCD$ 中，$AD\parallel BC$，$BD$ 是梯形 $ABCD$ 对角线，$BD^2=AD\cdot BC$。
      \begin{enumerate}
      \item 求证：$AD\cdot CD=AB\cdot BD$；
      \item 以 $CD$ 为一边作 $\angle CDE=\angle ADB$，$DE$ 交边 $BC$ 于点 $E$，求证：$\dfrac{CD^2}{BD^2}=\dfrac{CE}{AD}$。
      \end{enumerate}
    answer: 见证明。
    official_solution_latex:
      - title: 第（1）问
        content: '由 $AD\parallel BC$，得 $\angle ADB=\angle CBD$。又 $BD^2=AD\cdot BC$，所以 $\dfrac{AD}{BD}=\dfrac{BD}{BC}$，故 $\triangle ADB\sim\triangle DBC$，从而 $\dfrac{AD}{BD}=\dfrac{AB}{CD}$，即 $AD\cdot CD=AB\cdot BD$。'
      - title: 第（2）问
        content: '由角关系得 $\triangle CDE\sim\triangle CBD$，所以 $CD^2=EC\cdot BC$。又 $BD^2=AD\cdot BC$，故 $\dfrac{CD^2}{BD^2}=\dfrac{CE}{AD}$。'
    question_crops: [{source: documents/初三/2025届-上海市徐汇区-初三一模数学-试卷及参考答案/005.png, box: [140, 130, 950, 420], file: source-question.png}]
