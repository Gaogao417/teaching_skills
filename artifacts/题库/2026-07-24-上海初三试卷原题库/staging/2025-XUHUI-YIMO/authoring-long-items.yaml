  - id: Q019
    source_key: 2025-XUHUI-YIMO-Q19
    question_number: 19
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: foundation
    skill_tags: [比例式]
    stem_latex: |
      已知：$\dfrac a2=\dfrac b3=\dfrac c5$。
      \begin{enumerate}
      \item 求代数式 $\dfrac{2a+3b-5c}{a-2b+3c}$ 的值；
      \item 当 $2a+b+3c=44$ 时，求 $a$、$b$、$c$ 的值。
      \end{enumerate}
    answer: '（1）$-\dfrac{12}{11}$；（2）$a=4$，$b=6$，$c=10$。'
    official_solution_latex:
      - title: 第（1）问
        content: '设 $a=2k$，$b=3k$，$c=5k$，则 $\dfrac{2a+3b-5c}{a-2b+3c}=-\dfrac{12}{11}$。'
      - title: 第（2）问
        content: '由 $2a+b+3c=44$ 得 $4k+3k+15k=44$，所以 $k=2$，故 $a=4$，$b=6$，$c=10$。'
    question_crops: [{source: documents/初三/2025届-上海市徐汇区-初三一模数学-试卷及参考答案/003.png, box: [140, 1180, 950, 1450], file: source-question.png}]
