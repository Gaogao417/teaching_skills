  - id: Q021
    source_key: 2025-XUHUI-YIMO-Q21
    question_number: 21
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [平行线, 相似三角形, 平面向量]
    stem_latex: |
      如图，$AD$ 与 $BE$ 相交于点 $C$，$DE\parallel AB$，点 $F$ 在线段 $BC$ 上，且 $EC^2=CF\cdot BC$，联结 $DF$、$EA$。
      \begin{enumerate}
      \item 求证：$DF\parallel EA$；
      \item 设 $\overrightarrow{AB}=\vec a$，$\overrightarrow{BC}=\vec b$，当 $BC=2EC$ 时，求向量 $\overrightarrow{CD}$（用 $\vec a$、$\vec b$ 表示）。
      \end{enumerate}
    answer: '（1）见证明；（2）$\overrightarrow{CD}=\dfrac12\vec a+\dfrac12\vec b$。'
    official_solution_latex:
      - title: 第（1）问
        content: '$\because DE\parallel AB$，$\therefore\dfrac{CD}{AC}=\dfrac{EC}{BC}$。又 $EC^2=CF\cdot BC$，所以 $\dfrac{EC}{BC}=\dfrac{CF}{EC}$，故 $\dfrac{CD}{AC}=\dfrac{CF}{EC}$，所以 $DF\parallel EA$。'
      - title: 第（2）问
        content: '由 $BC=2EC$，得 $\dfrac{EC}{BC}=\dfrac12$，所以 $\dfrac{CD}{AC}=\dfrac12$。又 $\overrightarrow{AC}=\vec a+\vec b$，故 $\overrightarrow{CD}=\dfrac12\vec a+\dfrac12\vec b$。'
    question_crops: [{source: documents/初三/2025届-上海市徐汇区-初三一模数学-试卷及参考答案/004.png, box: [140, 650, 950, 1010], file: source-question.png}]
