    solution_crops: [{source: documents/初三/2025届-上海市徐汇区-初三一模数学-试卷及参考答案/007.png, box: [140, 820, 950, 1450], file: official-solution-01.png}]
  - id: Q024
    source_key: 2025-XUHUI-YIMO-Q24
    question_number: 24
    question_type: problem
    section_title: 三、解答题
    points: 12
    difficulty: challenge
    skill_tags: [二次函数, 定点, 直角三角形]
    stem_latex: |
      抛物线 $y=ax^2+(1-a)x-2a+1\ (a\ne0)$ 经过两个定点，其中一个位于 $x$ 轴上，记作点 $A$，另一个位于第一象限内，记作点 $B$。
      \begin{enumerate}
      \item 求点 $A$、$B$ 的坐标；
      \item 当 $a<0$ 时，抛物线的顶点为 $D$，与 $x$ 轴的另一个交点为 $C$：
      \begin{enumerate}
      \item 如果 $\angle ABC=90^\circ$，求 $a$ 的值；
      \item 当 $\angle ADB=90^\circ$ 时，求 $a$ 的值。
      \end{enumerate}
      \end{enumerate}
    answer: '（1）$A(-1,0)$，$B(2,3)$；（2）①$a=-\dfrac13$；②$a=-\dfrac{\sqrt5}{3}$。'
    official_solution_latex:
      - title: 第（1）问
        content: '令 $a$ 的各项之和为0，解 $x^2-x-2=0$ 得 $x=-1,2$，代入得 $A(-1,0)$，$B(2,3)$。'
      - title: 第（2）问①
        content: '由 $\angle ABC=90^\circ$ 的几何关系得到另一交点 $C(5,0)$，代入抛物线，解得 $a=-\dfrac13$。'
      - title: 第（2）问②
        content: '由顶点坐标及 $\angle ADB=90^\circ$ 建立比例关系，化简得 $81a^4-54a^2+5=0$。结合 $a<0$ 及图形位置，得 $a=-\dfrac{\sqrt5}{3}$。'
    question_crops: [{source: documents/初三/2025届-上海市徐汇区-初三一模数学-试卷及参考答案/005.png, box: [140, 380, 950, 1010], file: source-question.png}]
    prompt_crops: [{source: documents/初三/2025届-上海市徐汇区-初三一模数学-试卷及参考答案/005.png, box: [630, 850, 950, 1080], file: prompt-01.png, width: 62mm}]
    solution_crops: [{source: documents/初三/2025届-上海市徐汇区-初三一模数学-试卷及参考答案/008.png, box: [140, 130, 950, 1200], file: official-solution-01.png}]
  - id: Q025
    source_key: 2025-XUHUI-YIMO-Q25
    question_number: 25
    question_type: problem
    section_title: 三、解答题
    points: 14
    difficulty: challenge
    skill_tags: [等腰三角形, 重心, 相似三角形]
    stem_latex: |
      如图，在 $\triangle ABC$ 中，$AB=AC=\sqrt5$，$BC=2$，点 $D$ 是边 $AC$ 的中点，点 $M$、$N$ 是射线 $BD$ 上的动点（点 $M$ 在左边），以 $CM$ 为一边作 $\angle MCN=\angle ABC$。
      \begin{enumerate}
      \item 求 $BD$ 的长；
      \item 当点 $M$ 是 $\triangle ABC$ 的重心时，求 $CN:BN$ 的值；
      \item 如果 $\triangle MCN$ 是以 $MN$ 为腰的等腰三角形，求 $BM$ 的长。
      \end{enumerate}
    answer: '（1）$BD=\dfrac{\sqrt{13}}2$；（2）$\dfrac{\sqrt5}{4}$；（3）$BM=\dfrac{4\sqrt{13}}{13}$ 或 $\dfrac{3\sqrt{13}}{13}$。'
    official_solution_latex:
      - title: 第（1）问
        content: '作辅助垂线，得 $CD=BD=1$、$CH=\dfrac12$、$DH=1$，所以 $BD=\dfrac{\sqrt{13}}2$。'
      - title: 第（2）问
        content: '当 $M$ 是重心时，由角关系证 $\triangle CND\sim\triangle BNC$，得 $\dfrac{CN}{BN}=\dfrac{CD}{BC}=\dfrac{\sqrt5}{4}$。'
      - title: 第（3）问
        content: '分类讨论 $MN=CN$ 与 $MN=CM$，分别解得 $BM=\dfrac{4\sqrt{13}}{13}$ 或 $\dfrac{3\sqrt{13}}{13}$。'
    question_crops: [{source: documents/初三/2025届-上海市徐汇区-初三一模数学-试卷及参考答案/005.png, box: [140, 990, 950, 1450], file: source-question.png}]
