  - type: fillin
    id: Q014
    points: 4
    stem_latex: 如果关于 $x$ 的方程 $\dfrac{2}{x-1}=1+\dfrac{m}{1-x}$ 有增根，那么 $m$ 的值是______。
    answer: $\dfrac{2}{3}$
    explanation: 官方参考答案：$\dfrac{2}{3}$。
    solution_steps:
    - 方程两边同乘 $x-1$，得 $2=x-1-m$，即 $x=m+3$。
    - 因为方程有增根，所以 $x=1$，即 $m+3=1$，解得 $m=-2$。
