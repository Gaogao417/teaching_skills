  - type: fillin
    id: Q012
    points: 4
    stem_latex: 已知二次函数 $y=ax^2+c$ 的图像经过点 $(1,2)$ 和 $(2,-4)$，则该二次函数的解析式是______。
    answer: $y=-2x^2+4$
    explanation: 官方参考答案：$y=-2x^2+4$。
    solution_steps:
    - 将 $(1,2)$ 和 $(2,-4)$ 代入 $y=ax^2+c$，得 $\begin{cases} a+c=2 \\ 4a+c=-4 \end{cases}$。
    - 解得 $a=-2$，$c=4$，所以 $y=-2x^2+4$。
