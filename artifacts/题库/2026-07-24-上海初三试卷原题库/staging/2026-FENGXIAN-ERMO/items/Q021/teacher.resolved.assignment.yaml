  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在 $\triangle ABC$ 中，$AB=AC$，$\angle BAC=120^{\circ}$，点 $D$ 在边 $BC$ 上，$BD=1$，$CD=2$，求 $AD$ 的长。
    answer: 见解析
    explanation: 官方参考答案：见解析。
    solution_steps:
    - 过点 $A$ 作 $AE\perp BC$ 于 $E$。
    - 因为 $AB=AC$，$\angle BAC=120^{\circ}$，所以 $\angle B=\angle C=30^{\circ}$，$BE=EC=\dfrac{3}{2}$。
    - 在 $\triangle ABE$ 中，$AE=BE\cdot\tan30^{\circ}=\dfrac{3}{2}\cdot\dfrac{\sqrt{3}}{2}=\dfrac{\sqrt{3}}{2}$。
    - $DE=BD-BE=1-\dfrac{3}{2}=-\dfrac{1}{2}$（取绝对值 $\dfrac{1}{2}$）。
    - 在 $\triangle ADE$ 中，$AD=\sqrt{AE^2+DE^2}=\sqrt{\left(\dfrac{\sqrt{3}}{2}\right)^2+\left(\dfrac{1}{2}\right)^2}=1$。
