  blocks:
  - type: choice
    id: Q006
    points: 4
    stem_latex: 已知点 $H$ 在 $\triangle ABC$ 内，如果点 $H$ 到边 $AB$、$AC$ 的距离相等，且 $S_{\triangle ABH}=S_{\triangle BCH}$，那么点 $H$ 的位置是（\quad）
    choices:
    - $\angle BAC$ 的角平分线与 $AC$ 边上中线的交点
    - $\angle BAC$ 的角平分线与 $AB$ 边上中线的交点
    - $\angle ABC$ 的角平分线与 $AB$ 边上中线的交点
    - $\angle ABC$ 的角平分线与 $BC$ 边上中线的交点
    answer: A
    explanation: 官方参考答案：A。
    solution_steps:
    - 点 $H$ 到边 $AB$、$AC$ 的距离相等，则点 $H$ 在 $\angle BAC$ 的角平分线上。
    - $S_{\triangle ABH}=S_{\triangle BCH}$，则点 $H$ 到 $AB$ 和 $BC$ 的距离之比为 $BC:AB$。
    - 结合角平分线的性质，点 $H$ 应为 $\angle BAC$ 的角平分线与 $AC$ 边上中线的交点。
