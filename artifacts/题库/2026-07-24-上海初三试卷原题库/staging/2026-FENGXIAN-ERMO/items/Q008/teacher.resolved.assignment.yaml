  blocks:
  - type: fillin
    id: Q008
    points: 4
    stem_latex: 如果单项式 $A$ 与单项式 $2a^2b$ 是同类项，那么 $A$ 可以是______。（只需写出一个即可）
    answer: $a^2b$（答案不唯一）
    explanation: 官方参考答案：$a^2b$（答案不唯一）。
    solution_steps:
    - 根据同类项的定义可知，单项式 $A$ 需满足：所含字母为 $a$ 和 $b$，$a$ 的次数为2，$b$ 的次数为1，系数不为0。
    - 取系数为1，可得符合条件的单项式 $A=a^2b$。
