  - type: problem
    id: Q022
    points: 10
    stem_latex: 某校为了解学生每天课外阅读的时间，随机抽取了部分学生进行调查，将调查结果整理后绘制了以下两幅不完整的统计图。请根据统计图提供的信息，解答下列问题：\n(1) 本次调查共抽取了______名学生；\n(2) 补全条形统计图；\n(3) 在扇形统计图中，$D$ 组所对应的圆心角的度数为______。
    answer: 见解析
    explanation: 官方参考答案：见解析。
    solution_steps:
    - (1) $C$ 组有 $12$ 人，占 $24\%$，所以总人数为 $12\div24\%=50$（名）。
    - (2) $A$ 组人数为 $50\times10\%=5$（名），$B$ 组人数为 $50\times30\%=15$（名），补全条形图。
    - (3) $D$ 组人数为 $50-5-15-12=18$（名），$D$ 组所对应的圆心角为 $360^{\circ}\times\dfrac{18}{50}=129.6^{\circ}$。
