  - type: fillin
    id: Q013
    points: 4
    stem_latex: 在 $\triangle ABC$ 中，$\angle A=40^{\circ}$，$AB=AC$，则 $\angle B=$______。
    answer: $70^{\circ}$
    explanation: 官方参考答案：$70^{\circ}$。
    solution_steps:
    - 因为 $AB=AC$，所以 $\angle B=\angle C$。
    - $\angle A+\angle B+\angle C=180^{\circ}$，所以 $40^{\circ}+2\angle B=180^{\circ}$，解得 $\angle B=70^{\circ}$。
