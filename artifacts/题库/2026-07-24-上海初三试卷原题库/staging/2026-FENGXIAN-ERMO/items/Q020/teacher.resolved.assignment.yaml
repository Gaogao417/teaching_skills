    stem_latex: 解不等式组：$\begin{cases} 2x-1>0 \\ x+3\leq5 \end{cases}$，并在数轴上表示解集。
    answer: 见解析
    explanation: 官方参考答案：见解析。
    solution_steps:
    - 解 $2x-1>0$，得 $x>\dfrac{1}{2}$。
    - 解 $x+3\leq5$，得 $x\leq2$。
    - 所以不等式组的解集为 $\dfrac{1}{2}<x\leq2$。
