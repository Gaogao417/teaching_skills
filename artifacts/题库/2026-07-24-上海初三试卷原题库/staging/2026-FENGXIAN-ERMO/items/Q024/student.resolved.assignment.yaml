    stem_latex: 如图，在平面直角坐标系中，直线 $y=-x+4$ 与 $x$ 轴交于点 $A$，与 $y$ 轴交于点 $B$，点 $C$ 在 $x$ 轴的正半轴上，且 $BC=AB$。\n(1) 求点 $C$ 的坐标；\n(2) 求过点 $A$、$B$、$C$ 的抛物线的解析式；\n(3) 在抛物线上是否存在点 $P$，使得 $\triangle PAB$ 的面积等于 $\triangle ABC$ 的面积的一半？若存在，求出点 $P$ 的坐标；若不存在，请说明理由。
