  - type: fillin
    id: Q017
    points: 4
    stem_latex: 如图，在 $\triangle ABC$ 中，$\angle C=90^{\circ}$，$AC=4$，$BC=3$，点 $D$ 在边 $AB$ 上，$AD=2$，则 $CD=$______。
    answer: $\dfrac{12}{5}$
    explanation: 官方参考答案：$\dfrac{12}{5}$。
    solution_steps:
    - 在 $\triangle ABC$ 中，$AB=\sqrt{AC^2+BC^2}=\sqrt{4^2+3^2}=5$。
    - 因为 $\angle C=90^{\circ}$，所以 $S_{\triangle ABC}=\dfrac{1}{2}AC\cdot BC=\dfrac{1}{2}\times4\times3=6$。
    - 设 $CD\perp AB$ 于 $D$，则 $S_{\triangle ABC}=\dfrac{1}{2}AB\cdot CD$，所以 $6=\dfrac{1}{2}\times5\times CD$，解得 $CD=\dfrac{12}{5}$。
