  - type: fillin
    id: Q016
    points: 4
    stem_latex: 如果一个正多边形的每个内角都等于 $140^{\circ}$，那么这个正多边形的边数是______。
    answer: $9$
    explanation: 官方参考答案：$9$。
    solution_steps:
    - 设正多边形的边数为 $n$，则 $\dfrac{(n-2)\cdot180^{\circ}}{n}=140^{\circ}$。
    - 解得 $n=9$。
