  title: 一、选择题（本大题共6题，每题4分，满分24分）
  type: practice
  visibility: both
  blocks:
  - type: choice
    id: Q004
    points: 4
    stem_latex: 甲、乙两位同学在相同条件下各射击10次，两人的成绩（单位：环）如图所示。小华同学根据图形写出了以下三个推断：①甲的成绩更稳定；②乙的平均成绩更高；③每人再射击一次，乙的成绩一定比甲高。其中正确的是（\quad）
    choices:
    - ①②
    - ①③
    - ②③
    - ①②③
    answer: A
    explanation: 官方参考答案：A。
    solution_steps:
    - 由折线统计图可知，甲的成绩在2.5和5之间波动，乙的成绩在2.5和10之间波动，所以甲的成绩更稳定，故①结论正确。
    - 乙的10次成绩中有9次成绩大于甲，其中一次略低，可推知②正确。
    - 每人再射击一次，乙的成绩不一定比甲高，故③的结论错误。
