      - "$\\sqrt{\\dfrac{1}{2}}$"
      answer: B
      explanation: "官方参考答案：B。"
      solution_steps:
      - "A: $\\sqrt{20}=\\sqrt{4\\times5}=2\\sqrt{5}$，被开方数含能开得尽方的因数4，不是最简二次根式，故不符合题意。"
      - "B: $\\sqrt{2}$ 满足最简二次根式的两个条件，是最简二次根式，故符合题意。"
      - "C: $\\sqrt{0.2}=\\sqrt{\\dfrac{1}{5}}$，被开方数含分母，不是最简二次根式，故不符合题意。"
      - "D: $\\sqrt{\\dfrac{1}{2}}$ 被开方数含分母，不是最简二次根式，故不符合题意。"
