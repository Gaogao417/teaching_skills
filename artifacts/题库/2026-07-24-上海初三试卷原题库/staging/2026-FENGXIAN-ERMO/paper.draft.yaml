      stem_latex: "计算 $\\left(m^3\\right)^2 \\div m^2$ 的结果是（\\quad）"
      choices:
      - "$m^8$"
      - "$m^7$"
      - "$m^4$"
      - "$m^3$"
      answer: C
      explanation: "官方参考答案：C。"
      solution_steps:
      - "幂的乘方，底数不变，指数相乘，$\\left(m^3\\right)^2=m^{3\\times2}=m^6$。"
      - "同底数幂相除，底数不变，指数相减，$m^6\\div m^2=m^{6-2}=m^4$。"
