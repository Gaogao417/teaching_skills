      - "①③"
      - "②③"
      - "①②③"
      answer: A
      explanation: "官方参考答案：A。"
      solution_steps:
      - "由折线统计图可知，甲的成绩在2.5和5之间波动，乙的成绩在2.5和10之间波动，所以甲的成绩更稳定，故①结论正确。"
      - "乙的10次成绩中有9次成绩大于甲，其中一次略低，可推知②正确。"
      - "每人再射击一次，乙的成绩不一定比甲高，故③的结论错误。"
