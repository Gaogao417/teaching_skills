      - "正四边形"
      - "正六边形"
      - "正八边形"
      answer: D
      explanation: "官方参考答案：D。"
      solution_steps:
      - "设这个正多边形的边数为 $n$。"
      - "正 $n$ 边形的中心角总和为 $360^{\\circ}$，每个中心角为 $\\dfrac{360^{\\circ}}{n}$。"
      - "正 $n$ 边形的内角和为 $(n-2)\\cdot180^{\\circ}$，每个内角为 $\\dfrac{(n-2)\\cdot180^{\\circ}}{n}$。"
      - "根据题意得 $\\dfrac{(n-2)\\cdot180^{\\circ}}{n}=\\dfrac{360^{\\circ}}{n}\\times3$，解得 $n=8$，故这个正多边形是正八边形。"
