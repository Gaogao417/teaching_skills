  - type: problem
    id: Q019
    points: 10
    stem_latex: 计算：$\sqrt{18}-\left(\dfrac{1}{3}\right)^{-1}+\dfrac{1}{2-\sqrt{3}}+|\sqrt{3}-2|$
    answer: $3\sqrt{2}+1$
    clue: 二次根式化简、负指数幂、分母有理化、绝对值分别计算。
    solution_steps:
    - $\sqrt{18}=3\sqrt{2}$，$\left(\dfrac{1}{3}\right)^{-1}=3$，$\dfrac{1}{2-\sqrt{3}}=2+\sqrt{3}$，$|\sqrt{3}-2|=2-\sqrt{3}$。
    - 原式 $=3\sqrt{2}-3+2+\sqrt{3}+2-\sqrt{3}=3\sqrt{2}+1$。
