  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，点 $G$ 是 $\triangle ABC$ 的重心，$BG$ 的延长线交 $AC$ 于点 $D$，过点 $G$ 作 $GE\parallel BC$，交 $AC$ 于点 $E$，则 $\dfrac{S_{\triangle DGE}}{S_{\triangle ABD}}=$\u3000\u3000\u3000\u3000。
    answer: $\dfrac{1}{9}$
    clue: $\triangle DEG\sim\triangle DBC$，$\dfrac{DG}{BD}=\dfrac{1}{3}$。
    solution_steps:
    - $\dfrac{BG}{BD}=\dfrac{2}{3}$，$\therefore\dfrac{DG}{BD}=\dfrac{1}{3}$。
    - $\triangle DEG\sim\triangle DBC$，$\dfrac{S_{\triangle DGE}}{S_{\triangle DBC}}=\left(\dfrac{1}{3}\right)^2=\dfrac{1}{9}$，又 $S_{\triangle DBC}=S_{\triangle ABD}$，$\therefore\dfrac{1}{9}$。
