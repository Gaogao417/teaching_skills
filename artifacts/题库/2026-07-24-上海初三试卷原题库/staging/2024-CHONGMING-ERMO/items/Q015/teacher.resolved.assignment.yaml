  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如图，在梯形 $ABCD$ 中，$AD\parallel BC$，$2BC=5AD$，若 $\overrightarrow{DA}=\vec{a}$，$\overrightarrow{DC}=\vec{b}$，用 $\vec{a}$、$\vec{b}$ 表示 $\overrightarrow{DB}=$\u3000\u3000\u3000\u3000。
    answer: $\vec{b}+\dfrac{5}{2}\vec{a}$
    clue: $\overrightarrow{DB}=\overrightarrow{DC}+\overrightarrow{CB}$，$\overrightarrow{CB}=\dfrac{5}{2}\overrightarrow{DA}$。
    solution_steps:
    - $\overrightarrow{CB}=\dfrac{5}{2}\vec{a}$，$\overrightarrow{DB}=\vec{b}+\dfrac{5}{2}\vec{a}$。
