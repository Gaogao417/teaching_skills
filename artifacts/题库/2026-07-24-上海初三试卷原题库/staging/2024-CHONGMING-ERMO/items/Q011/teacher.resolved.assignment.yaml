    stem_latex: 已知关于 $x$ 的方程 $x^{2}-4x+3k=0$ 没有实数根，则实数 $k$ 的取值范围为\u3000\u3000\u3000\u3000。
    answer: $k>\dfrac{4}{3}$
    clue: $\Delta=16-12k<0$。
    solution_steps:
    - $\Delta=(-4)^2-4\times3k<0$，$16<12k$，$k>\dfrac{4}{3}$。
