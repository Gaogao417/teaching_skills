  - type: problem
    id: Q024
    points: 12
    stem_latex: '在平面直角坐标系 $xOy$ 中，直线 $y=\dfrac{\sqrt{3}}{3}x+3$ 与 $x$ 轴交于点 $A$，与 $y$ 轴交于点 $B$，抛物线 $C_1:y=\dfrac{1}{3}x^2+bx+c$ 经过点 $B$ 和点 $C(1,0)$，顶点为 $D$。

      (1) 求抛物线 $C_1$ 的表达式及顶点 $D$ 的坐标；

      (2) 设抛物线与 $x$ 轴的另一个交点为 $E$，若点 $P$ 在 $y$ 轴上，当 $\angle PED=90°$ 时，求点 $P$ 的坐标；

      (3) 将 $C_1$ 平移得到 $C_2$，顶点 $D$ 落在 $x$ 轴上点 $M$ 处，将 $\triangle MAB$ 沿直线 $AB$ 翻折得到 $\triangle QAB$，若 $Q$ 恰好落在 $C_2$ 上，求 $C_2$ 的表达式。'
    answer: (1) $y=\dfrac{1}{3}x^2-\dfrac{10}{3}x+3$，$D(5,-\dfrac{16}{3})$；(2) $P(0,\dfrac{27}{4})$；(3) $y=\dfrac{1}{3}(x-3\sqrt{3})^2$
    clue: (1) 待定系数；(2) $\angle PED=90°$ 用勾股定理 $PD^2=PE^2+DE^2$；(3) 翻折构造等边 $\triangle QAM$。
    solution_steps:
    - (1) $B(0,3)$，$C(1,0)$ 代入：$c=3$，$\dfrac{1}{3}+b+3=0$，$b=-\dfrac{10}{3}$，$D(5,-\dfrac{16}{3})$。
    - (2) $E(9,0)$，$P(0,y_P)$，$PD^2=PE^2+DE^2$ 解得 $y_P=\dfrac{27}{4}$。
    - (3) $A(-3\sqrt{3},0)$，$\angle BAO=30°$，翻折 $\triangle QAM$ 等边，$Q(\dfrac{t-3\sqrt{3}}{2},\dfrac{\sqrt{3}t+9}{2})$。
    - 代入 $C_2:y=\dfrac{1}{3}(x-t)^2$ 解得 $t=3\sqrt{3}$，$\therefore y=\dfrac{1}{3}(x-3\sqrt{3})^2$。
