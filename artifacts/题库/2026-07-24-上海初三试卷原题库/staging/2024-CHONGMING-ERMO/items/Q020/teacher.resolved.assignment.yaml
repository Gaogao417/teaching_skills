  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases} x-2y=4 \text{①} \\ x^{2}-xy-6y^{2}=0 \text{②} \end{cases}$
    answer: $\begin{cases} x=12 \\ y=4 \end{cases}$ 或 $\begin{cases} x=2 \\ y=-1 \end{cases}$
    clue: ②因式分解 $(x-3y)(x+2y)=0$。
    solution_steps:
    - 由②$(x-3y)(x+2y)=0$，得 $x=3y$ 或 $x=-2y$。
    - $x=3y$ 代入①：$y=4$，$x=12$。
    - $x=-2y$ 代入①：$-4y=4$，$y=-1$，$x=2$。
