  - type: problem
    id: Q021
    points: 10
    stem_latex: '如图，正比例函数 $y=\dfrac{3}{4}x$ 的图像与反比例函数 $y=\dfrac{k}{x}$（$k\neq0$，$x>0$）的图像相交于点 $A(a,3)$，点 $B$ 为直线 $OA$ 上位于点 $A$ 右侧的一点，且 $OA=2AB$，过点 $B$ 作 $BD\perp x$ 轴，垂足为 $D$，交反比例函数的图像于点 $C$。

      (1) 求反比例函数 $y=\dfrac{k}{x}$ 的解析式；

      (2) 试判断 $\triangle ABC$ 的形状。'
    answer: (1) $y=\dfrac{12}{x}$；(2) $\triangle ABC$ 为等腰三角形
    clue: (1) 正比例函数求 $A(4,3)$ 再代入反比例；(2) $\triangle AOE\sim\triangle BOD$ 求 $B$、$C$，$AB=BC$。
    solution_steps:
    - (1) $A(a,3)$ 代入 $y=\dfrac{3}{4}x$ 得 $a=4$，$A(4,3)$，$k=12$，$\therefore y=\dfrac{12}{x}$。
    - (2) $OA=5$，$\dfrac{OA}{OB}=\dfrac{2}{3}$，$\triangle AOE\sim\triangle BOD$，$BD=\dfrac{9}{2}$，$OD=6$。
    - $C(6,2)$，$BC=BD-CD=\dfrac{9}{2}-2=\dfrac{5}{2}$，$AB=\dfrac{1}{2}OA=\dfrac{5}{2}$，$AB=BC$，等腰三角形。
