    stem_latex: 新定义：抛物线 $y=ax^{2}+bx+c$（$ab\neq0$）与 $y=bx^{2}+ax+c$ 称为\u201c关联抛物线\u201d。已知抛物线 $C_{1}$：$y=6ax^{2}+ax+9a-4$（$a>0$）的关联抛物线为 $C_{2}$，$C_{2}$ 顶点为 $P$ 且与 $x$ 轴交于 $M$、$N$，点 $P$ 关于 $x$ 轴对称点为 $Q$，若四边形 $PMQN$ 是正方形，那么 $C_{1}$ 的表达式为\u3000\u3000\u3000\u3000。
