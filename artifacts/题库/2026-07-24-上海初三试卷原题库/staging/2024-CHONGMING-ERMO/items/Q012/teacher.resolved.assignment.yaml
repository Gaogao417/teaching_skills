    id: Q012
    points: 4
    stem_latex: 一个不透明的箱子里放着分别标有数字 $1$，$2$，$3$，$4$，$5$，$6$，$7$ 的七个球，从中任意摸出一个球，摸出的球上所标数字为偶数的概率为\u3000\u3000\u3000\u3000。
    answer: $\dfrac{3}{7}$
    clue: 偶数有 $2,4,6$ 共 $3$ 个。
    solution_steps:
    - 偶数球 $3$ 个（$2,4,6$），$P=\dfrac{3}{7}$。
