      answer: (1) $y=\dfrac{12}{x}$；(2) $\triangle ABC$ 为等腰三角形
      clue: (1) 正比例函数求 $A(4,3)$ 再代入反比例；(2) $\triangle AOE\sim\triangle BOD$ 求 $B$、$C$，$AB=BC$。
      solution_steps:
