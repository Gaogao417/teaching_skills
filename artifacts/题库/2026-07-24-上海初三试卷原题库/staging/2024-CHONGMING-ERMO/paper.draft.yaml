        \end{cases}$
      answer: $\begin{cases} x=12 \\ y=4 \end{cases}$ 或 $\begin{cases} x=2 \\ y=-1
        \end{cases}$
      clue: ②因式分解 $(x-3y)(x+2y)=0$。
      solution_steps:
