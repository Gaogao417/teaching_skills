    block:
      stem_latex: 如图，已知梯形 $ABCD$ 中，$AB\parallel CD$，$\angle DAB=90^{\circ}$，$AD=4$，$AB=2CD=6$，$E$ 是边 $BC$ 上一点，过点 $D$、$E$ 分别作 $BC$、$CD$ 的平行线交于点 $F$，联结 $AF$ 并延长，与射线 $DC$ 交于点 $G$。(1) 当点 $G$ 与点 $C$ 重合时，求 $CE:BE$ 的值；(2) 当点 $G$ 在边 $CD$ 上时，设 $CE=m$，求 $\triangle DFG$ 的面积（用含 $m$ 的代数式表示）；(3) 当 $\triangle AFD\sim\triangle ADG$ 时，求 $\angle DAG$ 的余弦值。
      answer: (1) $1$；(2) $\frac{6m^{2}}{25-5m}$；(3) $\frac{3}{5}$
      clue: 平行四边形、相似三角形与锐角三角函数综合
      solution_steps:
      - (1) $DC\parallel EF$，$DF\parallel CE$，四边形 $DCEF$ 是平行四边形，$CD=EF$；$AB=2CD=6$，$AB=2EF$，$EF\parallel AB$，$\triangle CFE\sim\triangle CAB$，$\frac{CE}{CB}=\frac{EF}{AB}=\frac{1}{2}$，$BE=CE$，故 $CE:BE=1$。
      - (2) 延长 $AG,BC$ 交于 $M$，过 $C$ 作 $CN\perp AB$ 于 $N$ 交 $EF$ 于 $H$。四边形 $ADCN$ 是矩形，$AD=CN=4$，$CD=AN=3$，$BN=3$，$BC=5$；$BE=5-m$，$ME=BE=5-m$，$MC=5-2m$，$HC=\frac{4}{5}m$；$GC=\frac{15-6m}{5-m}$，$DG=CD-GC=\frac{3m}{5-m}$，故 $S_{\triangle DFG}=\frac{1}{2}\cdot DG\cdot CH=\frac{6m^{2}}{25-5m}$。
      - (3) 由 $\triangle AFD\sim\triangle ADG$ 得 $\angle AFD=\angle ADG=90^{\circ}$，$DF\perp AG$；$DF\parallel BC$，$AG\perp BC$，$\angle B=\angle DAG$，故 $\cos\angle DAG=\cos B=\frac{BN}{BC}=\frac{3}{5}$。
