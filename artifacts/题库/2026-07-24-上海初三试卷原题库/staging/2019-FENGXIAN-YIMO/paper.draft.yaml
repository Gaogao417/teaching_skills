    block:
      stem_latex: 如图，已知 $AD$ 是 $\triangle ABC$ 的中线，$G$ 是重心。(1) 设 $\overrightarrow{AB}=\overrightarrow{a}$，$\overrightarrow{BC}=\overrightarrow{b}$，用向量 $\overrightarrow{a}$、$\overrightarrow{b}$ 表示 $\overrightarrow{BG}$；(2) 如果 $AB=3$，$AC=2$，$\angle GAC=\angle GCA$，求 $BG$ 的长。
      answer: (1) $\overrightarrow{BG}=\frac{1}{3}\overrightarrow{a}+\frac{1}{3}\overrightarrow{b}$；(2) $BG=\frac{4\sqrt{2}}{3}$
      clue: 重心向量表示与等腰三角形性质
      solution_steps:
      - (1) $AD$ 是 $\triangle ABC$ 的中线，$\overrightarrow{BD}=\frac{1}{2}\overrightarrow{b}$；$\overrightarrow{AD}=\overrightarrow{a}+\frac{1}{2}\overrightarrow{b}$；$G$ 是重心，$\overrightarrow{AG}=\frac{2}{3}\overrightarrow{AD}=\frac{2}{3}\overrightarrow{a}+\frac{1}{3}\overrightarrow{b}$，故 $\overrightarrow{BG}=\frac{1}{3}\overrightarrow{a}+\frac{1}{3}\overrightarrow{b}$。
      - (2) 延长 $BG$ 交 $AC$ 于 $H$，由 $\angle GAC=\angle GCA$ 得 $GA=GC$；$AH=\frac{1}{2}AC=1$，$BH\perp AC$；在 Rt$\triangle ABH$ 中 $BH=\sqrt{AB^{2}-AH^{2}}=2\sqrt{2}$，故 $BG=\frac{2}{3}BH=\frac{4\sqrt{2}}{3}$。
