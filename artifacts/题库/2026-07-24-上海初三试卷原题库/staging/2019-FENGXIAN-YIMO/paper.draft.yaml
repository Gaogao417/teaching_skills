    block:
      stem_latex: “滑块铰链”是一种连杆式活动链接装置。图 2 是其平面示意图，滑轨 $MN$ 安装在窗框上，悬臂 $DE$ 安装在窗扇上，支点 $B$、$C$、$D$ 始终在一条直线上，已知托臂 $AC=20$ 厘米，托臂 $BD=40$ 厘米，支点 $C$、$D$ 之间的距离是 10 厘米，张角 $\angle CAB=60^{\circ}$。(1) 求支点 $D$ 到滑轨 $MN$ 的距离（精确到 1 厘米）；(2) 将滑块 $A$ 向左侧移动到 $A'$，当张角 $\angle C'A'B=45^{\circ}$ 时，求滑块 $A$ 向左侧移动的距离（精确到 1 厘米）。
      answer: (1) 约 23 厘米；(2) 约 6 厘米
      clue: 解直角三角形、相似三角形与勾股定理
      solution_steps:
      - (1) 过 $C$ 作 $CG\perp AB$ 于 $G$，过 $D$ 作 $DH\perp AB$ 于 $H$。$AC=20$，$\angle CAB=60^{\circ}$，$AG=10$，$CG=10\sqrt{3}$；$BC=BD-CD=30$；由 $CG\parallel DH$ 得 $\triangle BCG\sim\triangle BDH$，$\frac{30}{40}=\frac{10\sqrt{3}}{DH}$，$DH=\frac{40\sqrt{3}}{3}\approx 23$ 厘米。
      - (2) 过 $C'$ 作 $C'S\perp MN$ 于 $S$。$A'C'=20$，$\angle C'A'S=45^{\circ}$，$A'S=C'S=10\sqrt{2}$；$BS=\sqrt{BC'^{2}-C'S^{2}}=10\sqrt{7}$，$A'B=10\sqrt{2}+10\sqrt{7}$；又 $AB=10+10\sqrt{6}$，故 $AA'=A'B-AB\approx 6$ 厘米。
