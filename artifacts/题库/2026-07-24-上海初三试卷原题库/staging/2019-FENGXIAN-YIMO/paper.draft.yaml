    block:
      stem_latex: 已知抛物线 $y=x(x-2)+2$。(1) 用配方法把这个抛物线的表达式化成 $y=a(x+m)^{2}+k$ 的形式，并写出它的顶点坐标；(2) 将抛物线 $y=x(x-2)+2$ 上下平移，使顶点移到 $x$ 轴上，求新抛物线的表达式。
      answer: (1) $y=(x-1)^{2}+1$，顶点 $(1,1)$；(2) $y=(x-1)^{2}$
      clue: 配方法与二次函数平移
      solution_steps:
      - (1) $y=x(x-2)+2=x^{2}-2x+2=(x-1)^{2}+1$，它的顶点坐标为 $(1,1)$。
      - (2) 将抛物线 $y=x(x-2)+2$ 上下平移，使顶点移到 $x$ 轴上，图象向下平移 1 个单位得到 $y=(x-1)^{2}$。
