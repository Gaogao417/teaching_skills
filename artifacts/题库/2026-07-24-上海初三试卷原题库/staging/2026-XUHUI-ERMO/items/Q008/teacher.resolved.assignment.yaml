    stem_latex: 因式分解：$3b-3b^3=$__________.
    answer: $3b(1+b)(1-b)$
    explanation: 官方参考答案：$3b(1+b)(1-b)$.
    solution_steps:
    - 先提公因式，再利用平方差公式法进行因式分解即可.
    - $3b-3b^3=3b(1-b^2)=3b(1+b)(1-b)$.
