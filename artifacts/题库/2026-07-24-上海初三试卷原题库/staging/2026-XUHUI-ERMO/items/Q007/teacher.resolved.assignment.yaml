  blocks:
  - type: short_answer
    id: Q007
    points: 4
    stem_latex: 计算：$2^{-1}=$__________.
    answer: $\dfrac{1}{2}$
    explanation: 官方参考答案：$\dfrac{1}{2}$.
    solution_steps:
    - 当$a\neq 0$，$p$为正整数时，$a^{-p}=\dfrac{1}{a^p}$.
    - $2^{-1}=\dfrac{1}{2^1}=\dfrac{1}{2}$.
