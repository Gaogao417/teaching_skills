  - type: short_answer
    id: Q009
    points: 4
    stem_latex: 分式方程$\dfrac{x^2-1}{x^2+2x}=\dfrac{3}{x(x+2)}$的解是__________.
    answer: $x=2$
    explanation: 官方参考答案：$x=2$.
    solution_steps:
    - 先将分式方程化为整式方程求解，最后检验所得根是否使原分式方程分母不为零.
    - $\dfrac{x^2-1}{x^2+2x}=\dfrac{3}{x(x+2)}$，
    - 对分母因式分解得$\dfrac{x^2-1}{x(x+2)}=\dfrac{3}{x(x+2)}$，
    - 方程两边同乘最简公分母$x(x+2)$，得$x^2-1=3$
    - 整理得$x^2=4$
    - 解得$x_1=2,x_2=-2$
    - 检验：当$x=-2$时，$x(x+2)=0$，原分式方程分母为零，
    - 因此$x=-2$是增根，舍去；
    - 当$x=2$时，$x(x+2)=2\times4=8\neq 0$，满足原分式方程分母不为零的要求.
