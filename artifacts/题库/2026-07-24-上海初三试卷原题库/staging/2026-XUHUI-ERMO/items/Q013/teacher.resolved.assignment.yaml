  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 商场抽奖箱里三个完全一样的小球里面装着小纸条，其中两个写着\u201c谢谢参与\u201d，一个写着\u201c小礼品一份\u201d. 某顾客随机摸出两个小球，都是\u201c谢谢参与\u201d的概率是__________.
    answer: $\dfrac{1}{3}$
    explanation: 官方参考答案：$\dfrac{1}{3}$.
    solution_steps:
    - 先列举出随机摸出两个小球的所有等可能结果，再找出两个都是\u201c谢谢参与\u201d的结果数，根据概率公式计算即可.
    - 记两个写有\u201c谢谢参与\u201d的小球为$A_{1}$，$A_{2}$，写有\u201c小礼品一份\u201d的小球为$B$，
    - 随机摸出两个小球，所有等可能的结果为：$\left(A_{1},A_{2}\right)$，$\left(A_{1},B\right)$，$\left(A_{2},B\right)$，共$3$种，
    - 其中两个都是\u201c谢谢参与\u201d的结果有$1$种，即$\left(A_{1},A_{2}\right)$，
    - 根据概率公式可得所求概率为$\dfrac{1}{3}$.
