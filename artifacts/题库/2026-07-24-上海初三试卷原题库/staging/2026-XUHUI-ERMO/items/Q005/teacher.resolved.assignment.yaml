- id: question
  title: 一、选择题（本大题共6题，每题4分，满分24分）
  type: practice
  visibility: both
  blocks:
  - type: choice
    id: Q005
    points: 4
    stem_latex: 某学校组织了一场体能测试，抽出$50$个人的成绩（分数）进行统计，结果如图所示. 关于这$50$人的分数，下列说法正确的是（\quad）
    choices:
    - 中位数是$15$
    - 众数是$15$
    - 中位数是$75$
    - 众数是$85$
    answer: C
    explanation: 官方参考答案：C。
    solution_steps:
    - 众数是一组数据中出现次数最多的数，中位数是将一组数据从小到大排列后，处于中间位置的数，若数据个数为偶数，则为中间两个数的平均数.
    - 将$50$人的成绩从小到大排序，第$25$、$26$位均为$75$分，因此中位数是$\dfrac{75+75}{2}=75$，
    - 故A选项说法错误，不合题意，C选项说法正确，符合题意；
    - $75$，$85$均出现了$15$次，因此众数是$75$，$85$，
    - 故B，D选项说法错误，不合题意.
    diagram_col:
      image_path: assets/prompt-01.png
      width: 58mm
      variant: prompt
      disclosure_policy: clean
