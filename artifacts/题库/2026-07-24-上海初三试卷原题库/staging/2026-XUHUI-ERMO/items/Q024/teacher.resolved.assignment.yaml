  title: 三、解答题（本大题共7题，满分78分）
  type: practice
  visibility: both
  blocks:
  - type: problem
    id: Q024
    points: 12
    stem_latex: 如图，在平面直角坐标系$xOy$中，抛物线$C_{1}$：$y=x^{2}+bx+c$经过点$A\left(-1,0\right)$和点$B\left(3,0\right)$，顶点为$M$. 直线$l$经过点$A$，且$l\perp AM$.（1）求直线$l$的表达式；（2）已知抛物线$C_{2}$：$y=ax^{2}+mx+n$也经过$A$、$B$两点，且开口向下，顶点为$N$. 设$D$为抛物线$C_{2}$与直线$l$的交点，连接$AN$、$DN$、$DM$，当四边形$ANDM$是梯形时，求抛物线$C_{2}$的表达式.
    answer: （1）直线$l$的表达式$y=\dfrac{1}{2}x+\dfrac{1}{2}$；（2）抛物线$C_{2}$：$y=\dfrac{-7-3\sqrt{5}}{8}\left(x^{2}-2x-3\right)$或$y=-\dfrac{5}{4}\left(x^{2}-2x-3\right)$.
    explanation: 官方参考答案：（1）$y=\dfrac{1}{2}x+\dfrac{1}{2}$；（2）$y=\dfrac{-7-3\sqrt{5}}{8}\left(x^{2}-2x-3\right)$或$y=-\dfrac{5}{4}\left(x^{2}-2x-3\right)$.
    solution_steps:
    - （1）根据待定系数法求得抛物线$C_{1}$：$y=x^{2}-2x-3=\left(x-1\right)^{2}-4$，即可知点$M\left(1,-4\right)$，过点$M$作$MC\perp x$轴，交$x$轴于点$C$，交直线$l$于点$N$，可证明$\triangle NAC\sim\triangle AMC$，有$\dfrac{NC}{AC}=\dfrac{AC}{MC}$，结合两点之间距离求得$NC=1$，利用待定系数法即可求得直线$l$的表达式；
    - （2）根据题意的$a<0$，利用待定系数法求得抛物线$y=ax^{2}-2ax-3a$，则点$N\left(1,-4a\right)$，联立方程求得点$D\left(3+\dfrac{1}{2a},2+\dfrac{1}{4a}\right)$，结合梯形的性质若$AN\parallel DM$，过点$N$作$NC\perp x$轴于点$C$，过点$M$作平行于$x$轴的直线与过点$D$作$DE\perp ME$轴于点$C$，线段$DM$与$x$轴交于点$F$，则点$E\left(\dfrac{6a+1}{2a},-4\right)$，且$\triangle NAC\sim\triangle DME$，有$\dfrac{AC}{NC}=\dfrac{ME}{DE}$，两点之间距离公式求得$a$（当$a$值接近$0$时不满足题干要求的梯形字母顺序，故舍去）；若$ND\parallel AM$，过点$M$作$MG\perp x$轴于点$G$，过点$D$作平行于$x$轴的直线与过点$N$作$NH\perp DH$轴于点$H$，同理可得$\triangle NHD\sim\triangle MGA$，点$H\left(1,\dfrac{8a+1}{4a}\right)$，求得$a$即可.
    - 【小问1详解】$\because$抛物线$C_{1}$：$y=x^{2}+bx+c$经过点$A\left(-1,0\right)$和点$B\left(3,0\right)$，
    - $\therefore\begin{cases}\left(-1\right)^{2}-b+c=0\\3^{2}+3b+c=0\end{cases}$，解得$\begin{cases}b=-2\\c=-3\end{cases}$，
    - 则抛物线$C_{1}$：$y=x^{2}-2x-3=\left(x-1\right)^{2}-4$，
    - $\therefore$点$M\left(1,-4\right)$，
    - 如图，过点$M$作$MC\perp x$轴，交$x$轴于点$C$，交直线$l$于点$N$，
    - 则$\angle ACM=\angle ACN=90^{\circ}$，$\angle MAC+\angle AMC=90^{\circ}$，
    - $\because l\perp AM$，
    - $\therefore\angle NAC+\angle CAM=90^{\circ}$，
    - $\therefore\angle NAC=\angle AMC$，
    - 则$\triangle NAC\sim\triangle AMC$，
    - $\therefore\dfrac{NC}{AC}=\dfrac{AC}{MC}$，
    - $\because$点$M\left(1,-4\right)$和点$A\left(-1,0\right)$，
    - $\therefore CM=4$，$AC=2$，
    - 则$\dfrac{NC}{2}=\dfrac{2}{4}$，解得$NC=1$，
    - $\therefore$点$N\left(1,1\right)$，
    - 设直线$l$的解析式为$y=kx+b\left(k\neq 0\right)$，
    - $\because$直线$l$经过点$A$和点$N$，
    - $\therefore\begin{cases}-k+b=0\\k+b=1\end{cases}$，解得$\begin{cases}k=\dfrac{1}{2}\\b=\dfrac{1}{2}\end{cases}$，
    - 则直线$l$的表达式$y=\dfrac{1}{2}x+\dfrac{1}{2}$；
    - 【小问2详解】$\because$抛物线$C_{2}$：$y=ax^{2}+mx+n$开口向下，
    - $\therefore a<0$，
    - $\because$抛物线$C_{2}$：$y=ax^{2}+mx+n$经过$A\left(-1,0\right)$、$B\left(3,0\right)$两点，
    - $\therefore\begin{cases}a\times\left(-1\right)^{2}+m\times\left(-1\right)+n=0\\a\times 3^{2}+3m+n=0\end{cases}$，解得$\begin{cases}m=-2a\\n=-3a\end{cases}$，
    - 则抛物线$C_{2}$：$y=ax^{2}-2ax-3a=a\left(x-1\right)^{2}-4a$，
    - $\because$抛物线$C_{2}$：$y=ax^{2}+mx+n$顶点为$N$，
    - $\therefore N\left(1,-4a\right)$，
    - 联立$\begin{cases}y=\dfrac{1}{2}x+\dfrac{1}{2}\\y=ax^{2}-2ax-3a\end{cases}$，解得$\begin{cases}x_{1}=-1\\y_{1}=0\end{cases}$，$\begin{cases}x_{2}=3+\dfrac{1}{2a}\\y_{2}=2+\dfrac{1}{4a}\end{cases}$，
    - 则点$D\left(3+\dfrac{1}{2a},2+\dfrac{1}{4a}\right)$，
    - $\because$四边形$ANDM$是梯形，
    - $\therefore AN\parallel DM$，或$ND\parallel AM$，
    - ①若$AN\parallel DM$，过点$N$作$NC\perp x$轴于点$C$，过点$M$作平行于$x$轴的直线与过点$D$作$DE\perp ME$轴于点$C$，线段$DM$与$x$轴交于点$F$，
    - 则$\angle E=\angle ACN=90^{\circ}$，$\angle NAC=\angle DFB=\angle DME$，点$C\left(1,0\right)$，点$E\left(\dfrac{6a+1}{2a},-4\right)$，
    - $\therefore\triangle NAC\sim\triangle DME$，
    - $\therefore\dfrac{AC}{NC}=\dfrac{ME}{DE}$，
    - $\because$点$D\left(3+\dfrac{1}{2a},2+\dfrac{1}{4a}\right)$，点$N\left(1,-4a\right)$，点$A\left(-1,0\right)$，点$M\left(1,-4\right)$，点$C\left(1,0\right)$，
    - $\therefore AC=2$，$NC=-4a$，$ME=\dfrac{6a+1}{2a}-1=\dfrac{4a+1}{2a}$，$DE=\dfrac{8a+1}{4a}+4=6+\dfrac{1}{4a}$，
    - 则$\dfrac{2}{-4a}=\dfrac{\frac{4a+1}{2a}}{6+\frac{1}{4a}}$，
    - 解得$a_{1}=\dfrac{-7-3\sqrt{5}}{8}$，$a_{2}=\dfrac{-7+3\sqrt{5}}{8}$（构不成梯形，舍去），
    - 那么，抛物线$C_{2}$：$y=\dfrac{-7-3\sqrt{5}}{8}\left(x^{2}-2x-3\right)$；
    - ②若$ND\parallel AM$，过点$M$作$MG\perp x$轴于点$G$，过点$D$作平行于$x$轴的直线与过点$N$作$NH\perp DH$轴于点$H$，
    - 同理可得$\triangle NHD\sim\triangle MGA$，点$H\left(1,\dfrac{8a+1}{4a}\right)$，点$M\left(1,-4\right)$，
    - $\therefore\dfrac{NH}{MG}=\dfrac{HD}{GA}$，$AG=2$，$MG=4$，$NH=-4a-\dfrac{8a+1}{4a}=-\dfrac{16a^{2}+8a+1}{4a}$，$DH=\dfrac{6a+1}{2a}-1=\dfrac{4a+1}{2a}$，
    - 则$\dfrac{-\frac{16a^{2}+8a+1}{4a}}{4}=\dfrac{\frac{4a+1}{2a}}{2}$，
    - 解得$a_{1}=-\dfrac{5}{4}$，$a_{2}=-\dfrac{1}{4}$（构不成梯形，舍去），
    - 那么，抛物线$C_{2}$：$y=-\dfrac{5}{4}\left(x^{2}-2x-3\right)$.
