  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 已知关于$x$的一元二次方程$x^{2}+3x+\left(m-2\right)=0$有两个不相等的实数根，则$m$的取值范围是__________.
    answer: $m<\dfrac{17}{4}$
    explanation: 官方参考答案：$m<\dfrac{17}{4}$.
    solution_steps:
    - 根据方程有两个不相等的实数根，直接得到判别式$\Delta=b^{2}-4ac>0$，即可求解本题.
    - $\because$关于$x$的一元二次方程$x^{2}+3x+\left(m-2\right)=0$有两个不相等的实数根，
    - $\therefore\Delta=b^{2}-4ac=9-4\left(m-2\right)>0$，
    - 解得：$m<\dfrac{17}{4}$.
