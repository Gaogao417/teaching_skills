        page_image: documents/初三/2026届-上海市徐汇区-初三二模数学-试卷及解析/word/pages/016.png
    block:
      stem_latex: 如图，在$\triangle ABC$中，$AB=AC=5$，$BC=8$，点$O$在边$AB$上，如果$\odot O$与$\triangle ABC$的一边所在的直线相切，且经过$\triangle ABC$的一个顶点，那么$OB$的长是__________.
      answer: $\dfrac{25}{8}$或$\dfrac{120}{49}$
      explanation: 官方参考答案：$\dfrac{25}{8}$或$\dfrac{120}{49}$.
      solution_steps:
      - 分两种情况讨论，当$\odot O$与$BC$相切于点$D$时，则$OD\perp BC$，设$OB=x$，则$OA=OD=5-x$，根据$\sin\angle ABC=\dfrac{OD}{OB}=\dfrac{AE}{AB}$列出比例式，求得$x$的值；当$\odot O$与$AC$相切于点$F$时，则$OF\perp AC$，过点$B$作$BG\perp AC$于点$G$，证明$\triangle AOF\sim\triangle ABG$，进而求得$x$的值，即可求解.
      - 如图，过点$A$作$AE\perp BC$于点$E$，
      - 当$\odot O$与$BC$相切于点$D$时，则$OD\perp BC$，
      - $\because AB=AC=5$，$BC=8$，
      - $\therefore BE=\dfrac{1}{2}BC=4$，
      - $\therefore AE=\sqrt{AB^{2}-BE^{2}}=\sqrt{5^{2}-4^{2}}=3$，
      - 设$OB=x$，则$OA=OD=5-x$，
      - $\because OD\perp BC$，$AE\perp BC$，
      - $\therefore\sin\angle ABC=\dfrac{OD}{OB}=\dfrac{AE}{AB}$，即$\dfrac{5-x}{x}=\dfrac{3}{5}$，
      - 解得：$x=\dfrac{25}{8}$，
      - 当$\odot O$与$AC$相切于点$F$时，则$OF\perp AC$，过点$B$作$BG\perp AC$于点$G$，
      - $\because AB=AC$，
      - $\therefore\angle ABC=\angle C$，
      - $\therefore BG=BC\cdot\sin C=8\times\dfrac{3}{5}=\dfrac{24}{5}$，
      - 设$OB=x$，则$OF=OB=x$，$OA=AB-OB=5-x$，
      - $\because OF\parallel BG$，
      - $\therefore\triangle AOF\sim\triangle ABG$，
      - $\therefore\dfrac{OF}{BG}=\dfrac{OA}{AB}$，即$\dfrac{x}{\frac{24}{5}}=\dfrac{5-x}{5}$，
      - 解得：$x=\dfrac{120}{49}$，
      - 综上所述，$OB$的长是$\dfrac{25}{8}$或$\dfrac{120}{49}$.
