      solution_steps:
      - 先分别解出不等式组中两个一元一次不等式的解集，再取两个解集的公共部分，即可得到原不等式组的解集.
      - 解不等式$2x+1\geqslant 0$，移项得$2x\geqslant -1$，系数化为1得$x\geqslant -\dfrac{1}{2}$，
      - 解不等式$-x+1\geqslant 0$，移项得$-x\geqslant -1$，系数化为1得$x\leqslant 1$，
      - 取两个解集的公共部分，可得原不等式组的解集为$-\dfrac{1}{2}\leqslant x\leqslant 1$.
