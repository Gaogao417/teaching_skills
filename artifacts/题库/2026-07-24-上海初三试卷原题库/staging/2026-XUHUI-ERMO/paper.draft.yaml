      explanation: 官方参考答案：C。
      solution_steps:
      - 众数是一组数据中出现次数最多的数，中位数是将一组数据从小到大排列后，处于中间位置的数，若数据个数为偶数，则为中间两个数的平均数.
      - 将$50$人的成绩从小到大排序，第$25$、$26$位均为$75$分，因此中位数是$\dfrac{75+75}{2}=75$，
      - 故A选项说法错误，不合题意，C选项说法正确，符合题意；
      - $75$，$85$均出现了$15$次，因此众数是$75$，$85$，
      - 故B，D选项说法错误，不合题意.
