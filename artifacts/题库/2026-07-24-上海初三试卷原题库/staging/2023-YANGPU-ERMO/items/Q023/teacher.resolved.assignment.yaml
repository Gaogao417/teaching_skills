  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，直角梯形 $ABCD$ 中 $AD\parallel BC$，$\angle A=90\degree$，$\triangle ABD$ 沿 $BD$ 翻折后 $A$ 落在腰 $CD$ 上的点 $E$。（1）当 $E$ 是 $CD$ 中点时，求证：$\triangle BCD$ 是等边三角形；（2）延长 $BE$ 交 $AD$ 延长线于 $F$，连 $CF$，若 $CE^{2}=DE\cdot DC$，求证：四边形 $ABCF$ 是矩形．
    answer: (1)(2) 见解析
    clue: (1) 由垂直平分线 + 折叠 + 平行证三角均为 $60\degree$；(2) 证全等与相似得 $AF=BC$ 且 $\angle A=90\degree$。
    solution_steps:
    - (1) $E$ 为 $CD$ 中点，$BE$ 垂直平分 $CD\Rightarrow DB=BC$；折叠 $\angle ADB=\angle BDE=\angle C=60\degree$，$\triangle BCD$ 等边。
    - (2) 作 $DH\perp BC$，$\triangle BCE\cong\triangle DCH$（AAS），$DC=BC,CE=CH$；$\triangle FDE\sim\triangle BCE$ 结合 $CE^{2}=DE\cdot DC$ 得 $DF=CE=CH$，$AF=BC$，$\angle A=90\degree$，$ABCF$ 为矩形。
