    stem_latex: 如图，扇形 $AOB$ 中 $\angle AOB=60\degree$，$OA=8$，$P$ 在弧 $AB$ 上，$PC\perp OA$ 于 $C$，$PD\perp OB$ 于 $D$，那么 $CD=$ ______
    answer: $4\sqrt{3}$
    clue: 取 $PO$ 中点 $E$，$P,C,O,D$ 四点共圆 $\odot E$，由圆心角求弦长。
    solution_steps:
    - $CE=DE=4$，$\angle CED=120\degree$，$\angle CDE=30\degree$，$DH=2\sqrt3$，$CD=4\sqrt3$。
