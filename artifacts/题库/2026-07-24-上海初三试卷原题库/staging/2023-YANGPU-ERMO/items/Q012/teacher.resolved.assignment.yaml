  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 如果关于 $x$ 的二次三项式 $x^{2}-5x+k$ 在实数范围内不能因式分解，那么 $k$ 的取值范围是 ______
    answer: $k>\dfrac{25}{4}$
    clue: 不能因式分解即 $\Delta<0$。
    solution_steps:
    - $\Delta=25-4k<0$，$k>\dfrac{25}{4}$。
