  blocks:
  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 在 $\triangle ABC$ 中，$D$ 是 $AC$ 中点，$\vec{AB}=\vec{a}$，$\vec{BC}=\vec{n}$，那么 $\vec{BD}=$ ______（用 $\vec{a},\vec{n}$ 表示）
    answer: $\dfrac{1}{2}(\vec{n}-\vec{a})$
    clue: $\vec{BD}=\vec{BA}+\vec{AD}$，$\vec{AD}=\dfrac12\vec{AC}$。
    solution_steps:
    - $\vec{AC}=\vec{a}+\vec{n}$，$\vec{AD}=\dfrac12(\vec{a}+\vec{n})$，$\vec{BD}=-\vec{a}+\dfrac12(\vec{a}+\vec{n})=\dfrac12(\vec{n}-\vec{a})$。
    source_solution_images: []
