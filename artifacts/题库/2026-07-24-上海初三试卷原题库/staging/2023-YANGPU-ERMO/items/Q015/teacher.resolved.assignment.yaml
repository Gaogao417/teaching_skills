    stem_latex: 规定1兆 $=1万\times1万\times1亿$，那么2兆用科学记数法表示为 ______
    answer: $2\times10^{16}$
    clue: 1万 $=10^4$，1亿 $=10^8$。
    solution_steps:
    - $2兆=2\times10^{4}\times10^{4}\times10^{8}=2\times10^{16}$。
