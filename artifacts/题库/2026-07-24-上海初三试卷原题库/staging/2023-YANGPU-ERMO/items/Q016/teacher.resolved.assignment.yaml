  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，地下停车库入口，$AC\perp CD$，坡道 $AB$ 坡比 $i=1:2.4$，$AC=7.2$ 米，$CD=0.4$ 米，求点 $D$ 到 $AB$ 的距离 $DH$ 的值 ______ 米
    answer: '2.4'
    clue: 由坡比求 $CE$，再由 $\cos$ 求 $DH$。
    solution_steps:
    - $\tan\angle CAE=\dfrac{5}{12}$，$CE=3$，$DE=2.6$；$\cos\angle EDH=\dfrac{12}{13}$，$DH=2.6\times\dfrac{12}{13}=2.4$。
