  - type: problem
    id: Q021
    points: 10
    stem_latex: 一次函数 $y=kx+b$ 与反比例函数 $y=\dfrac{4}{x}$ 交于 $A(1,m),B(n,2)$。（1）求一次函数解析式；（2）过 $A$ 作直线 $AC$ 交 $y$ 轴于 $D$、交第三象限反比例图象于 $C$，若 $CD=2AD$，求 $BC$．
    answer: (1) $y=-2x+6$；(2) $BC=4\sqrt{2}$
    clue: (1) 由反比例求 $A,B$ 再待定系数；(2) 作 $AE\perp y$ 轴、$CF\perp y$ 轴，由相似求 $C$ 坐标。
    solution_steps:
    - (1) $A(1,4),B(2,2)$，代入得 $y=-2x+6$。
    - (2) $\triangle AED\sim\triangle CFD$，$CD=2AD\Rightarrow CF=2AE=2$，$C(-2,-2)$，$BC=\sqrt{4^{2}+4^{2}}=4\sqrt2$。
