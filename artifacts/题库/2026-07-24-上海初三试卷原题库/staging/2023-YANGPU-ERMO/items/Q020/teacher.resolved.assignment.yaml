  - type: problem
    id: Q020
    points: 10
    stem_latex: 解不等式组 $\begin{cases} 1-\dfrac{x-2}{3}\geqslant\dfrac{1}{6}x \\ \dfrac{1-x}{2}<x \end{cases}$，并求出它的正整数解．
    answer: $\dfrac{1}{3}<x\leqslant\dfrac{10}{3}$；正整数解为 $1,2,3$
    clue: 分别解两个不等式取交集，再取正整数。
    solution_steps:
    - ① $x\leqslant\dfrac{10}{3}$；② $x>\dfrac13$；解集 $\dfrac13<x\leqslant\dfrac{10}{3}$。
    - 正整数解 $1,2,3$。
