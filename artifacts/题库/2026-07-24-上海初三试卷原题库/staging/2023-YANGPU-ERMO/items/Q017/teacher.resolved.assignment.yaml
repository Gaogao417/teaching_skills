  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 如图，正五边形 $ABCDE$ 边长为2，以 $C,D$ 为圆心 $CD$ 为半径画弧交于 $F$，则 $\overset{\frown}{BF}$ 的长为 ______（保留 $\pi$）
    answer: $\dfrac{8}{15}\pi$
    clue: $\triangle CFD$ 等边得 $\angle FCD=60\degree$，正五边形内角 $108\degree$，$\angle BCF=48\degree$。
    solution_steps:
    - $\angle BCF=108\degree-60\degree=48\degree$，$\overset{\frown}{BF}=\dfrac{48\pi\times2}{180}=\dfrac{8}{15}\pi$。
