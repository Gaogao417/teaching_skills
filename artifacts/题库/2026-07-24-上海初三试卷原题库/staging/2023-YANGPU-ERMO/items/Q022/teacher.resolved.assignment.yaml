  - type: problem
    id: Q022
    points: 10
    stem_latex: 如图，水渠横断面是以 $AB$ 为直径的半圆 $O$，水面截线 $MN\parallel AB$，在 $A$ 处测得 $B$ 处树顶 $C$ 仰角 $14\degree$，树高 $1.75$ 米。（1）求直径 $AB$；（2）若最大水深 $2.8$ 米，求水面宽 $MN$（精确到 $0.1$ 米，$\tan76\degree=4$，$\sqrt6=2.4$）．
    answer: (1) $7$ 米；(2) 约 $6.7$ 米
    clue: (1) $\angle ACB=76\degree$，$AB=BC\tan76\degree$；(2) 垂径定理 + 勾股求 $MN$。
    solution_steps:
    - (1) $\angle ACB=76\degree$，$AB=1.75\times4=7$ 米。
    - (2) $OM=3.5$，$OD=0.7$，$MD=\sqrt{3.5^{2}-0.7^{2}}=1.4\sqrt6\approx3.36$，$MN\approx6.7$ 米。
