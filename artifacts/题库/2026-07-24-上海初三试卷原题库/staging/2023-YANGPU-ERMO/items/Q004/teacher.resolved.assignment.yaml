  - type: choice
    id: Q004
    points: 4
    stem_latex: 下列函数中，函数值 $y$ 随自变量 $x$ 增大而增大的是（\quad）
    choices:
    - $y=\dfrac{x}{2}$
    - $y=-\dfrac{x}{2}$
    - $y=\dfrac{2}{x}$
    - $y=-\dfrac{2}{x}$
    answer: A
    clue: 一次函数 $k>0$ 时 $y$ 随 $x$ 增大而增大（全局成立）。
    solution_steps:
    - $y=\dfrac{x}{2}$ 中 $k=\dfrac12>0$，全局递增。
