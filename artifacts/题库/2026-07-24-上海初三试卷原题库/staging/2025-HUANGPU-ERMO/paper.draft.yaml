      end_anchor: 如图，在平面直角坐标系
    block:
      stem_latex: 解方程：$\dfrac{2}{x+3}+\dfrac{6}{x^2-9}=\dfrac{1}{x-3}+1$
      solution_steps:
      - 去分母乘 $(x+3)(x-3)$：$2(x-3)+6=x+3+x^2-9$。
      - 整理：$x^2-x-6=0$，$(x-3)(x+2)=0$。
      - $x=3$（增根舍去）或 $x=-2$。检验：$x=-2$ 是原方程解。
      clue: 分式方程去分母+检验增根。
      answer: $x=-2$
