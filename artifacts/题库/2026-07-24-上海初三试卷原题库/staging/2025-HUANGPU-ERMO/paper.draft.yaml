      start_anchor: 本题考查了绝对值
      end_anchor: 解方程
    block:
      stem_latex: 计算：$\left|1-\sqrt{2}\right|+27^{\frac{1}{2}}-\dfrac{1}{2+\sqrt{3}}+(\pi-3)^0$
      solution_steps:
      - $\left|1-\sqrt{2}\right|=\sqrt{2}-1$
      - $27^{\frac{1}{2}}=3\sqrt{3}$
      - $\dfrac{1}{2+\sqrt{3}}=2-\sqrt{3}$
      - $(\pi-3)^0=1$
      - 原式 $=\sqrt{2}-1+3\sqrt{3}-(2-\sqrt{3})+1=\sqrt{2}+4\sqrt{3}-2$
      clue: 绝对值、分数指数幂、分母有理化、零指数幂。
      answer: $\sqrt{2}+4\sqrt{3}-2$
