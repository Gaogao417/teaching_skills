  - type: problem
    id: Q021
    points: 10
    stem_latex: '直线 $l: y=kx+3$ 与 $x$ 轴、$y$ 轴交于 $A$、$B$，反比例函数 $y=\dfrac{8}{x}$（$x>0$）经过 $P(2,n)$。

      (1) 求直线 $l$ 的表达式；

      (2) 点 $C$ 在 $y=\dfrac{8}{x}$（$x>0$）上，$\angle BOC=\angle ABO$，求 $C$ 的坐标。'
    solution_steps:
    - (1) $P(2,n)$ 代入 $y=\frac{8}{x}$ 得 $n=4$，$P(2,4)$ 代入 $y=kx+3$ 得 $k=\frac{1}{2}$。
    - 直线 $l: y=\frac{1}{2}x+3$。
    - (2) $\angle BOC=\angle ABO \Rightarrow OC\parallel AB$，$OC: y=\frac{1}{2}x$。
    - 联立 $\frac{1}{2}x=\frac{8}{x}$，$x=4$，$C(4,2)$。
    clue: 反比例+一次函数+平行线。
    answer: (1) $y=\dfrac{1}{2}x+3$；(2) $C(4,2)$
