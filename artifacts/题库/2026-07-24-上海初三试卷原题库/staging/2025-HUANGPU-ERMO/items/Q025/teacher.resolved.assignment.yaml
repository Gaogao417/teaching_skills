  - type: problem
    id: Q025
    points: 14
    stem_latex: '$\triangle ABC$ 中 $AC=5$，$AB=7$，$\cos A=\dfrac{3}{5}$，$D$ 在 $AB$ 上，$O$ 在 $CD$ 上 $\dfrac{CO}{OD}=\dfrac{4}{5}$，$\odot O$ 以 $CO$ 为半径交 $AC$ 于 $E$。

      (1) $D$ 与 $A$ 重合时，$\odot O$ 与 $AB$ 的位置关系；

      (2) $F$ 在 $\odot O$ 上，$\overset{\frown}{CE}=\overset{\frown}{CF}$，$EF$ 过 $O$ 交 $BC$ 于 $H$，求 $\dfrac{EH}{EF}$；

      (3) $DP\parallel AC$ 交 $BC$ 于 $P$，$\odot O$ 与 $DP$ 只有一个交点时，求 $BD$ 的范围。'
    solution_steps:
    - (1) $\sin A=\frac{4}{5}$，$CO=\frac{4}{5}AO=OU$，$\odot O$ 与 $AB$ 相切。
    - (2) $CD\perp EF$，$\triangle ECH\sim\triangle BCA$，$\frac{EH}{EF}=\frac{7}{8}$。
    - (3) 相切时 $BD=\frac{17}{6}$；经过 $P$ 时 $BD=\frac{7}{2}$。
    - $\therefore \frac{7}{2}<BD<7$ 或 $BD=\frac{17}{6}$。
    clue: 圆与直线位置关系+垂径定理+相似+分类讨论。
    answer: (1) 相切；(2) $\dfrac{7}{8}$；(3) $\dfrac{7}{2}<BD<7$ 或 $BD=\dfrac{17}{6}$
