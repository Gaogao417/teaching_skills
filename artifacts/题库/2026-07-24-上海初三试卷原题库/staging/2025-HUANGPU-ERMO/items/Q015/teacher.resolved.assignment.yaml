    stem_latex: $AB$ 是 $\odot O$ 的直径，$AB \perp CD$ 于 $H$。如果 $AH=CD=8$，那么 $AO$ 的长为______
    answer: '5'
    clue: $CH=4$，$AO^2=16+(8-AO)^2$，$AO=5$。
    solution_steps:
