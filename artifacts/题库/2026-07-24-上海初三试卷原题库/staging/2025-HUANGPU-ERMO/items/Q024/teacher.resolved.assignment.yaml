  - type: problem
    id: Q024
    points: 12
    stem_latex: '抛物线 $y=-\dfrac{1}{4}x^2+bx+c$ 与 $x$ 轴交于 $A(2,0)$、$B$（$A$ 在 $B$ 右侧），与 $y$ 轴正半轴交于 $C$，顶点 $P$。

      (1) $AB=6$，求抛物线表达式；

      (2) 用含 $b$ 的代数式表示 $P$ 的坐标；

      (3) $BC=EC$，直线 $PC$ 交 $x$ 轴于 $E$，求抛物线表达式。'
    solution_steps:
    - (1) $B(-4,0)$，$b=-\frac{1}{2}$，$c=2$，$y=-\frac{1}{4}x^2-\frac{1}{2}x+2$。
    - (2) $c=1-2b$，$P(2b, b^2-2b+1)$。
    - (3) $C(0,1-2b)$，$B(4b-2,0)$，$E(2-4b,0)$。$CE: y=-\frac{1}{2}x+1-2b$。
    - $P$ 在 $CE$ 上：$b=-1$，$y=-\frac{1}{4}x^2-x+3$。
    clue: 二次函数综合+待定系数法。
    answer: (1) $y=-\dfrac{1}{4}x^2-\dfrac{1}{2}x+2$；(2) $P(2b, b^2-2b+1)$；(3) $y=-\dfrac{1}{4}x^2-x+3$
