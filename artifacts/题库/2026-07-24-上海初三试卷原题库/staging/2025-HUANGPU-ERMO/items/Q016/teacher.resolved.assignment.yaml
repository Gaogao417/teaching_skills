    stem_latex: 平行四边形 $ABCD$（$AB=6$，$AD=9$）的四个内角平分线组成四边形 $EFGH$，连接 $HF$，那么 $HF$ 的长为______
    answer: '3'
    clue: 四边形 $EFGH$ 为矩形，$HF=EG=MC=9-6=3$。
    solution_steps:
    - 角平分线交出矩形 $EFGH$，$BM=AB=6$，$MC=3$，$HF=EG=MC=3$。
