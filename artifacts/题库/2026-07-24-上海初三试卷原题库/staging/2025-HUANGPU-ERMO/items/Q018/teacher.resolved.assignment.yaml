    id: Q018
    points: 4
    stem_latex: 矩形 $ABCD$ 中 $AB=3$，$AD=8$，$O$ 在 $BC$ 上 $BO=2$，$\odot O$ 半径为 $2$。翻折使 $D$ 落在 $\odot O$ 上为 $D'$，折痕与 $AD$ 交于 $M$，$DD'$ 过 $O$，则 $DM=$______
    answer: $\dfrac{15}{4}-\dfrac{\sqrt{5}}{2}$ 或 $\dfrac{15}{4}+\dfrac{\sqrt{5}}{2}$
    clue: $OD=3\sqrt{5}$，$DD'=3\sqrt{5}\pm2$，相似三角形分类讨论。
    solution_steps:
    - $OD=\sqrt{9+36}=3\sqrt{5}$，$DD'=3\sqrt{5}\pm2$。
    - $\triangle DMK\sim\triangle DON$，$DM=\frac{15}{4}\mp\frac{\sqrt{5}}{2}$。
