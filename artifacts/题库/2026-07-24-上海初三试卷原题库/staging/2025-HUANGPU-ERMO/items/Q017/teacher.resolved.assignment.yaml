  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 抛物线 $y=ax^2+bx+c$（$a\neq 0$）的"$k$ 倍衍生抛物线"的表达式为______
    answer: $y=\dfrac{a}{k}x^2+bx+ck$
    clue: 横纵坐标扩大 $k$ 倍，代入整理。
    solution_steps:
    - 设 $P'(x,y)$ 对应 $P(\frac{x}{k},\frac{y}{k})$，$y=\frac{a}{k}x^2+bx+ck$。
