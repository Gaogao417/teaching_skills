  - type: problem
    id: Q023
    points: 12
    stem_latex: '梯形 $ABCD$（$AD\parallel BC$），$OA\cdot BE=OE\cdot CE$。

      (1) 求证：四边形 $AECD$ 是平行四边形；

      (2) $\angle BDE=\angle DAE$，求证：$OB\cdot CD=BE\cdot DE$。'
    solution_steps:
    - (1) $\triangle ADO\sim\triangle EBO$，$\frac{OA}{OE}=\frac{CE}{BE}$，$\triangle OBE\sim\triangle DBC$，$OE\parallel CD$。
    - (2) $\triangle DOE\sim\triangle ADE$，$\frac{DE}{CD}=\frac{OB}{BE}$。
    clue: 梯形+相似三角形+平行四边形判定。
    answer: 证明见详解
