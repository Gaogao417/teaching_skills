  - type: problem
    id: Q021
    points: 10
    stem_latex: '一次函数 $y=k_1x+b$ 与反比例函数 $y=\dfrac{k_2}{x}$ 交于 $A(-2,4)$、$B(4,n)$。

      (1) 求一次函数表达式；

      (2) 求 $\triangle AOB$ 面积。'
    solution_steps:
    - $k_2=-8$，$B(4,-2)$，$k_1=-1$，$b=2$，$y=-x+2$。
    - 与 $x$ 轴交 $C(2,0)$，$S=\frac{1}{2}\times2\times4+\frac{1}{2}\times2\times2=6$。
    clue: 反比例+一次函数+三角形面积。
    answer: (1) $y=-x+2$；(2) $6$
