  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 抛物线 $y=x^2-4x+t$（$t<0$），$A(0,1)$、$B(2t+5,t)$，线段 $AB$ 与抛物线有交点时 $t$ 的范围是______
    answer: $t\leqslant -\dfrac{5}{2}$ 或 $-\dfrac{1}{2}\leqslant t<0$
    clue: 联立求临界值。
    solution_steps:
    - $t=-\frac{1}{2}$ 或 $t=-\frac{5}{2}$ 为临界。
    - $t\leq-\frac{5}{2}$ 或 $-\frac{1}{2}\leq t<0$。
