    id: Q025
    points: 14
    stem_latex: '$AB$ 为 $\odot O$ 直径（$AB=5$），$C$ 在 $\odot O$ 上，$OD\parallel BC$ 交 $\odot O$ 于 $D$。

      (1) $\angle ABC=60^{\circ}$ 时证 $OCBD$ 是菱形；

      (2) $DE\perp OB$ 于 $E$。

      ① $DC$ 交 $OB$ 于 $F$，$\angle OCD=\frac{1}{2}\angle CAB$，求 $EF$；

      ② $S_2=7S_1$ 时求 $AC$。'
    solution_steps:
    - (1) $\triangle BOC$、$\triangle BOD$ 均等边，$OC=CB=OD=DB$，菱形。
    - (2)① $\angle DOE=45^{\circ}$，$OE=\frac{5\sqrt{2}}{4}$，$EF=\frac{10-5\sqrt{2}}{4}$。
    - ② $OE=\frac{5}{3}$，$OH=\frac{5\sqrt{5}}{6}$，$AC=2OH=\frac{5\sqrt{5}}{3}$。
    clue: 圆综合+菱形+圆周角定理+面积比。
    answer: (1) 证明见详解；(2)① $EF=\dfrac{10-5\sqrt{2}}{4}$；② $AC=\dfrac{5\sqrt{5}}{3}$
