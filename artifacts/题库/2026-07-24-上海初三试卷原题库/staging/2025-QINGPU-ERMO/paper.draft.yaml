        page_number: 17
      start_anchor: 原式
      end_anchor: 解方程组
    block:
      stem_latex: 计算：$\left(\dfrac{1}{2}\right)^{-2} - |\sqrt{3}-2| + \dfrac{2}{\sqrt{3}-1} - 27^{\frac{1}{2}}$
      solution_steps:
      - $(\frac{1}{2})^{-2}=4$，$|\sqrt{3}-2|=2-\sqrt{3}$，$\frac{2}{\sqrt{3}-1}=\sqrt{3}+1$，$27^{1/2}=3\sqrt{3}$。
      - 原式 $=4-2+\sqrt{3}+\sqrt{3}+1-3\sqrt{3}=3-\sqrt{3}$。
      clue: 负指数幂+绝对值+分母有理化+分数指数幂。
      answer: $3-\sqrt{3}$
