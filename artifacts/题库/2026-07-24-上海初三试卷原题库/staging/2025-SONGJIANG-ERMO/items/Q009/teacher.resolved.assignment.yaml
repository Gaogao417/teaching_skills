    id: Q009
    points: 4
    stem_latex: 方程组 $\begin{cases} x^2 - y^2 = 5 \\ x + y = 1 \end{cases}$ 的解是______
    answer: $\begin{cases} x=3 \\ y=-2 \end{cases}$
    clue: 因式分解后代入。
    solution_steps:
    - $(x+y)(x-y)=5$，$x-y=5$，$x=3$，$y=-2$。
