    stem_latex: '抛物线 $y=-x^2+4x+c$ 与 $x$ 轴交于 $A$（右）、$B$，顶点 $P$。

      (1) 求 $PC$ 长（$C$ 为与 $y$ 轴交点）；

      (2) $AC\perp PC$ 时求抛物线表达式；

      (3) 平移后顶点 $P_1$ 在 $y$ 轴上且与 $C$ 关于原点对称，$P_1D\parallel PC$，求 $\triangle PP_1C$ 面积。'
