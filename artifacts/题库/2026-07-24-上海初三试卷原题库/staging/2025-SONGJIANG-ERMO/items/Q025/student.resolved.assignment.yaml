    stem_latex: '$AB$ 是半圆 $O$ 直径，$P$ 在弦 $AC$ 延长线上。

      (1) $PO$ 交半圆于 $D$。① $C$ 是弧 $AB$ 中点，$\tan P=\frac{1}{3}$，$PC=2\sqrt{2}$，求 $PD$；

      ② $C$ 是弧 $AD$ 中点，$PA=PO$，求 $\frac{PC}{PD}$。

      (2) $M$ 是 $AC$ 中点，$\odot A$（半径 $AP$）与 $\odot O$ 相切，$\odot P$（半径 $PM$）与 $AB$ 相切，求 $\sin\angle PAB$。'
