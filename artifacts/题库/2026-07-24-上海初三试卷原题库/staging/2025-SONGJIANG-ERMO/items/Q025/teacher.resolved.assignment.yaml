  - type: problem
    id: Q025
    points: 14
    stem_latex: '$AB$ 是半圆 $O$ 直径，$P$ 在弦 $AC$ 延长线上。

      (1) $PO$ 交半圆于 $D$。① $C$ 是弧 $AB$ 中点，$\tan P=\frac{1}{3}$，$PC=2\sqrt{2}$，求 $PD$；

      ② $C$ 是弧 $AD$ 中点，$PA=PO$，求 $\frac{PC}{PD}$。

      (2) $M$ 是 $AC$ 中点，$\odot A$（半径 $AP$）与 $\odot O$ 相切，$\odot P$（半径 $PM$）与 $AB$ 相切，求 $\sin\angle PAB$。'
    solution_steps:
    - (1)① $OA=2$，$PO=2\sqrt{5}$，$PD=2\sqrt{5}-2$。
    - ② $\triangle AOC\sim\triangle APO$，$\frac{PC}{PD}=\frac{1+\sqrt{5}}{2}$。
    - (2) $\triangle PMO\cong\triangle PEO$（HL），$\triangle OAM\sim\triangle PAE$，$\sin\angle PAB=\frac{3}{5}$。
    clue: 半圆+弧中点+相似三角形+两圆相切+切线。
    answer: (1)① $PD=2\sqrt{5}-2$；② $\dfrac{PC}{PD}=\dfrac{1+\sqrt{5}}{2}$；(2) $\sin\angle PAB=\dfrac{3}{5}$
