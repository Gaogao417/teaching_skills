  - type: problem
    id: Q021
    points: 10
    stem_latex: '$\triangle ABC$（$\angle A=90^{\circ}$，$\angle B=30^{\circ}$），$O$ 在 $BC$ 上，$\odot O$（半径 $OC$）交 $AC$ 于 $D$、切 $AB$ 于 $E$。

      (1) $BC=12$ 时求半径；

      (2) 求 $\dfrac{AD}{CD}$。'
    solution_steps:
    - (1) $OB=2OC$，$3OC=12$，$OC=4$。
    - (2) $\triangle COD$、$\triangle EOD$ 等边，$\angle AED=30^{\circ}$，$AD=\frac{1}{2}CD$。
    clue: 切线性质+等边三角形+30度直角三角形。
    answer: (1) 半径为 $4$；(2) $\dfrac{AD}{CD}=\dfrac{1}{2}$
