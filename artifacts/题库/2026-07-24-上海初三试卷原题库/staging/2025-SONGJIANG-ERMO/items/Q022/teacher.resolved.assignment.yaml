  - type: problem
    id: Q022
    points: 10
    stem_latex: '展板横断面：$AC=CB=50$cm，$CM=125$cm，$\angle CME=53^{\circ}$，$\angle ACM=106^{\circ}$。

      (1) 求 $B$ 到地面 $EF$ 距离；

      (2) $PQ=160$cm，$PC\perp AB$（最佳观察点），求 $B$ 到 $PQ$ 距离。（$\sin53^{\circ}\approx\frac{4}{5}$，$\cos53^{\circ}\approx\frac{3}{5}$，$\tan53^{\circ}\approx\frac{4}{3}$）'
    solution_steps:
    - (1) $CH=100$cm，$CN=40$cm，$BG=CH-CN=60$cm。
    - (2) $\tan53^{\circ}=\frac{x+30}{60}=\frac{4}{3}$，$x=50$cm。
    clue: 解直角三角形应用+辅助线构造。
    answer: (1) $60$cm；(2) $50$cm
