    stem_latex: 计算：$8^{\frac{1}{2}} + |\sqrt{2} - 2| + \left(\dfrac{1}{2 + \sqrt{2}}\right)^0 - (\sqrt{2} - 1)^{-1}$
    solution_steps:
    - $8^{1/2}=2\sqrt{2}$
    - $|\sqrt{2}-2|=2-\sqrt{2}$
    - $(\frac{1}{2+\sqrt{2}})^0=1$
    - $(\sqrt{2}-1)^{-1}=\sqrt{2}+1$
    - 原式 $=2\sqrt{2}+2-\sqrt{2}+1-\sqrt{2}-1=2$
    clue: 分数指数幂+绝对值+零指数幂+负指数幂。
    answer: '2'
    source_solution_images: []
