  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 矩形 $ABCD$（$AB=8$，$AD=5$），$\triangle ADE$ 沿 $AE$ 翻折 $D\to F$，$\triangle BCF$ 以 $BF$ 为腰等腰，$DE=$______
    answer: $\dfrac{5}{2}$ 或 $\dfrac{5\sqrt{3}}{3}$
    clue: 分类讨论 $BF=BC$ 和 $BF=CF$。
    solution_steps:
    - 情况1 $BF=BC$：$DE=\frac{5}{2}$。
    - 情况2 $BF=CF$：等边 $\triangle ADF$，$DE=\frac{5\sqrt{3}}{3}$。
