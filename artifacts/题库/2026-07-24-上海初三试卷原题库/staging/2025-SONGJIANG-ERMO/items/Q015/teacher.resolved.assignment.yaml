  - type: short_answer
    id: Q015
    points: 4
    stem_latex: $\triangle ABC$ 中 $DE\parallel BC$，$BD=2AD$，$\overrightarrow{BA}=\vec{a}$，$\overrightarrow{BC}=\vec{b}$，$\overrightarrow{BE}=$______
    answer: $\dfrac{2}{3}\vec{a}+\dfrac{1}{3}\vec{b}$
    clue: $\overrightarrow{BD}=\frac{2}{3}\vec{a}$，$\overrightarrow{DE}=\frac{1}{3}\vec{b}$。
    solution_steps:
    - $\overrightarrow{BE}=\overrightarrow{BD}+\overrightarrow{DE}=\frac{2}{3}\vec{a}+\frac{1}{3}\vec{b}$。
