    stem_latex: 解不等式组：$\begin{cases} 3x - 2 < 2(1 - x) \\ \dfrac{x - 10}{3} < 2x \end{cases}$
    solution_steps:
    - ① $5x<4$，$x<\frac{4}{5}$。
    - ② $x-10<6x$，$x>-2$。
    - $\therefore -2<x<\frac{4}{5}$。
    clue: 分别解后取交集。
    answer: $-2 < x < \dfrac{4}{5}$
