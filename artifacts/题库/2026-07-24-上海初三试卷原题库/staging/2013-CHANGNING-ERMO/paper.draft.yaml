    block:
      stem_latex: '如图，直线 $AB$ 交 $x$ 轴于点 $A$，交 $y$ 轴于点 $B$，$O$ 是坐标原点，$A(-3,0)$ 且 $\sin\angle ABO=\frac{3}{5}$，抛物线 $y=ax^2+bx+c$ 经过 $A$、$B$、$C$ 三点，$C(-1,0)$。

        (1) 求直线 $AB$ 和抛物线的解析式；

        (2) 若点 $D(2,0)$，在直线 $AB$ 上有点 $P$，使得 $\triangle ABO$ 和 $\triangle ADP$ 相似，求出点 $P$ 的坐标；

        (3) 在 (2) 的条件下，以 $A$ 为圆心，$AP$ 长为半径画 $\odot A$，再以 $D$ 为圆心，$DO$ 长为半径画 $\odot D$，判断 $\odot A$ 和 $\odot D$ 的位置关系，并说明理由。'
      answer: (1) $AB:y=\frac{4}{3}x+4$，抛物线 $y=\frac{4}{3}x^2+\frac{16}{3}x+4$；(2) $P(2,\frac{20}{3})$ 或 $P(-\frac{6}{5},\frac{12}{5})$；(3) 当 $P(2,\frac{20}{3})$ 时两圆内含，当 $P(-\frac{6}{5},\frac{12}{5})$ 时两圆外切
      clue: 二次函数综合、相似三角形、圆与圆的位置关系
      solution_steps:
      - (1) 由 $\sin\angle ABO=\frac{3}{5}$ 及 $OA=3$ 得 $OB=4$，即 $B(0,4)$。设直线 $AB$ 为 $y=kx+b$，代入 $A(-3,0)$、$B(0,4)$ 得 $k=\frac{4}{3},b=4$，$\therefore AB:y=\frac{4}{3}x+4$。
      - 将 $A(-3,0)$、$C(-1,0)$、$B(0,4)$ 代入 $y=ax^2+bx+c$，解得 $a=\frac{4}{3},b=\frac{16}{3},c=4$，$\therefore$ 抛物线解析式为 $y=\frac{4}{3}x^2+\frac{16}{3}x+4$。
      - (2) 设 $P(x,\frac{4}{3}x+4)$。若 $\triangle ABO\sim\triangle APD$，则 $\frac{AO}{AD}=\frac{BO}{PD}$，即 $\frac{3}{5}=\frac{4}{DP}$，$DP=\frac{20}{3}$，$\therefore P(2,\frac{20}{3})$。
      - 若 $\triangle ABO\sim\triangle ADP$，则 $\frac{AB}{AD}=\frac{AO}{AP}$，即 $\frac{5}{5}=\frac{3}{AP}$，$AP=3$；由 $(x+3)^2+\left(\frac{4}{3}x+4\right)^2=9$ 解得 $x=-\frac{6}{5}$，$\therefore P(-\frac{6}{5},\frac{12}{5})$。
      - (3) $\odot D$ 半径 $r=DO=2$。当 $P(2,\frac{20}{3})$ 时 $AP=\frac{25}{3}$，$AD=5<\frac{25}{3}-2$，两圆内含；当 $P(-\frac{6}{5},\frac{12}{5})$ 时 $AP=3$，$AD=5=3+2$，两圆外切。
