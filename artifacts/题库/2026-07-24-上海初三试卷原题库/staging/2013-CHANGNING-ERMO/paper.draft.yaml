    block:
      stem_latex: '$\triangle ABC$ 和 $\triangle DEF$ 的顶点 $A$ 与 $D$ 重合，已知 $\angle B=90^\circ$，$\angle BAC=30^\circ$，$BC=6$，$\angle FDE=90^\circ$，$DF=DE=4$。

        (1) 如图①，$EF$ 与边 $AC$、$AB$ 分别交于点 $G$、$H$，且 $FG=EH$。设 $\overrightarrow{DF}=\vec{a}$，在射线 $DF$ 上取一点 $P$，记 $\overrightarrow{DP}=x\vec{a}$，联结 $CP$。设 $\triangle DPC$ 的面积为 $y$，求 $y$ 关于 $x$ 的函数解析式，并写出定义域；

        (2) 在 (1) 的条件下，求当 $x$ 为何值时 $PC\parallel AB$；

        (3) 如图②，先将 $\triangle DEF$ 绕点 $D$ 逆时针旋转，使点 $E$ 恰好落在 $AC$ 边上，在保持 $DE$ 边与 $AC$ 边完全重合的条件下，使 $\triangle DEF$ 沿着 $AC$ 方向移动。当 $\triangle DEF$ 移动到什么位置时，以线段 $AD$、$FC$、$BC$ 的长度为边长的三角形是直角三角形。'
      answer: (1) $y=12x\ (x>0)$；(2) $x=\sqrt{3}$；(3) $AD=\frac{31}{6}$
      clue: 几何变换综合、全等三角形、锐角三角函数、勾股定理
      solution_steps:
      - (1) 过 $P$ 作 $PH'\perp AC$ 于 $H'$。由 $DF=DE$ 得 $\angle DFE=\angle E$，又 $FG=EH$，可证 $\triangle DFG\cong\triangle DEH$（SAS），$\therefore \angle FDG=\angle EDH$。
      - 结合 $\angle FDE=90^\circ$ 与 $\angle BAC=30^\circ$ 可得 $\angle FDG=30^\circ$。
      - $DP=|\overrightarrow{DP}|=x|\vec{a}|=x|\overrightarrow{DF}|=4x$；在 Rt$\triangle DPH'$ 中，$\angle FDG=30^\circ$，$\therefore PH'=\frac{1}{2}DP=2x$。
      - 由 $\angle B=90^\circ,\angle BAC=30^\circ,BC=6$ 得 $AC=DC=12$，$\therefore y=S_{\triangle PDC}=\frac{1}{2}\cdot DC\cdot PH'=\frac{1}{2}\times 12\times 2x=12x\ (x>0)$。
      - (2) 当 $PC\parallel AB$ 时，$\angle DCP=\angle BAC=30^\circ=\angle FDG$，可推得 $DP=PC$。
      - 作 $PH\perp AB$ 交 $DC$ 于 $M$，则 $M$ 为 $DC$ 中点，$DM=6$；在 Rt$\triangle DPM$ 中，$\cos\angle FDM=\frac{DM}{DP}=\frac{6}{DP}=\frac{\sqrt{3}}{2}$，$\therefore DP=4\sqrt{3}$，故 $x=\frac{DP}{4}=\sqrt{3}$。
      - (3) 设 $AD=t$，则 $DC=12-t\ (0<t<8)$，$FC^2=DF^2+DC^2=16+(12-t)^2$。
      - 若 $AD$ 为斜边：$t^2=16+(12-t)^2+36$，解得 $t=\frac{49}{6}$（超出范围，舍去）；若 $BC$ 为斜边：$36=16+(12-t)^2+t^2$，无解；若 $FC$ 为斜边：$16+(12-t)^2=36+t^2$，解得 $t=\frac{31}{6}$。
      - $\therefore$ 当 $\triangle DEF$ 移动到 $AD=\frac{31}{6}$ 时，以 $AD$、$FC$、$BC$ 为边长的三角形是直角三角形。
