      stem_latex: 如图，已知等腰直角 $\triangle ABC$ 中，$\angle BAC=90^\circ$，圆心 $O$ 在 $\triangle ABC$ 内部，且 $\odot O$ 经过 $B$、$C$ 两点，若 $BC=8$，$AO=1$，求 $\odot O$ 的半径。
      answer: $\odot O$ 的半径为 5
      clue: 勾股定理、垂径定理
      solution_steps:
      - 连结 $BO$、$CO$，延长 $AO$ 交 $BC$ 于 $D$。
      - $\because \triangle ABC$ 是等腰直角三角形，$\therefore AB=AC$；又 $O$ 是圆心，$\therefore OB=OC$，故直线 $OA$ 是线段 $BC$ 的垂直平分线。
      - $\therefore AD\perp BC$ 且 $D$ 是 $BC$ 的中点。在 Rt$\triangle ABC$ 中，$AD=BD=\frac{1}{2}BC=\frac{1}{2}\times 8=4$。
      - $\because AO=1$，$\therefore OD=AD-AO=4-1=3$。
      - 在 Rt$\triangle BDO$ 中，$OB=\sqrt{OD^2+BD^2}=\sqrt{3^2+4^2}=5$，即 $\odot O$ 的半径为 $5$。
