    block:
      stem_latex: '周末，小明和爸爸骑电动自行车从家里出发到郊外踏青。从家出发 0.5 小时后到达 $A$ 地，游玩一段时间后再前往 $B$ 地。小明和爸爸离家 1.5 小时后，妈妈驾车沿相同路线直接前往 $B$ 地，如图是他们离家的路程 $y$（千米）与离家时间 $t$（小时）的函数图象。

        (1) 根据函数图象写出小明和爸爸在 $A$ 地游玩的时间；

        (2) 分别求小明和爸爸骑车的速度及妈妈的驾车速度；

        (3) 妈妈出发时，小明和爸爸距离 $B$ 地有多远？'
      answer: (1) 0.5 小时；(2) 骑车 20 千米/小时，驾车 60 千米/小时；(3) 10 千米
      clue: 一次函数的应用
      solution_steps:
      - (1) 由函数图象得：小明和爸爸在 $A$ 地游玩的时间为 $0.5$ 小时。
      - (2) 骑车速度 $=10\div 0.5=20$ 千米/小时；驾车速度 $=30\div 0.5=60$ 千米/小时。
      - (3) 妈妈出发时小明和爸爸在路上行驶了 $1$ 小时，行驶路程 $=1\times 20=20$ 千米，距 $B$ 地 $=30-20=10$ 千米。
