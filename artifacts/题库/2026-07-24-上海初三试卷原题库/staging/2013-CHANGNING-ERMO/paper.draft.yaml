      stem_latex: '如图，$\triangle ABC$ 中，$\angle ACB=90^\circ$，$D$、$E$ 分别是 $BC$、$BA$ 的中点，连接 $DE$，$F$ 在 $DE$ 延长线上，且 $AF=AE$。

        (1) 求证：四边形 $ACEF$ 是平行四边形；

        (2) 若四边形 $ACEF$ 是菱形，求 $\angle B$ 的度数。'
      answer: (2) $\angle B=30^\circ$
      clue: 平行四边形的判定、菱形的性质
      solution_steps:
      - (1) $\because \angle ACB=90^\circ$，$E$ 是 $BA$ 的中点，$\therefore CE=AE=BE$；又 $AF=AE$，$\therefore AF=CE$。
      - 在等腰 $\triangle BEC$ 中，$D$ 是 $BC$ 的中点，$\therefore ED$ 既是底边中线也是顶角平分线，$\therefore \angle 1=\angle 2$。
      - $\because AF=AE$，$\therefore \angle F=\angle 3$；又 $\angle 1=\angle 3$，$\therefore \angle 2=\angle F$，$\therefore CE\parallel AF$。
      - 又 $CE=AF$，$\therefore$ 四边形 $ACEF$ 是平行四边形。
      - (2) 四边形 $ACEF$ 是菱形，$\therefore AC=CE$；又 $AE=CE$，$\therefore AC=CE=AE$，$\triangle AEC$ 是等边三角形，$\therefore \angle CAE=60^\circ$。
      - 在 Rt$\triangle ABC$ 中，$\angle B=90^\circ-\angle CAE=90^\circ-60^\circ=30^\circ$。
