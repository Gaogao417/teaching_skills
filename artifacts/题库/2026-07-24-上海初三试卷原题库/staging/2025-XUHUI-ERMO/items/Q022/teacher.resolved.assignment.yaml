  - type: problem
    id: Q022
    points: 10
    stem_latex: '矩形 $ABCD$ 内点 $M$，过 $M$ 作 $MN\parallel AB$ 使 $MN=AB$，连 $BN$、$CN$ 得四边形 $MBNC$。

      (1) 判断小杰作法是否正确并说明理由；

      (2) 菱形 $ABCD$ 内点 $N$，提出类似问题并解决。'
    solution_steps:
    - (1) 正确。$ABNM$、$CDMN$ 为平行四边形，$AM=BN$，$DM=CN$，$MBNC$ 四边为 $AM,BM,CM,DM$。
    - (2) 菱形中类似作法。
    clue: 矩形+平行四边形+探究。
    answer: (1) 正确；(2) 见详解
