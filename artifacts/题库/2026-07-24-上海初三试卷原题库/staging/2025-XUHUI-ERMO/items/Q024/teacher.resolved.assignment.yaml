  - type: problem
    id: Q024
    points: 12
    stem_latex: '抛物线 $y=ax^2+bx-2$ 与直线 $y=-\frac{3}{4}x+\frac{5}{2}$ 交于 $A(-2,n)$、$B(m,1)$。

      (1) 求抛物线表达式；

      (2) $D$ 在 $y$ 轴上，$ABOD$ 为矩形时求 $D$ 到 $AC$ 距离；

      (3) $E$ 为直线与 $x$ 轴交点，$P$、$Q$ 在 $CE$ 上且 $PQ=\sqrt{34}$，$BQ=AP$，求 $P$、$Q$。'
    solution_steps:
    - (1) $A(-2,4)$，$B(2,1)$，$a=\frac{9}{8}$，$b=-\frac{3}{4}$，$y=\frac{9}{8}x^2-\frac{3}{4}x-2$。
    - (2) $D(0,5)$，$C(0,-2)$，距离 $h=\frac{7\sqrt{10}}{10}$。
    - (3) $P(\frac{5}{2},-\frac{1}{2})$，$Q(-\frac{5}{2},-\frac{7}{2})$。
    clue: 二次函数+矩形+距离+一次函数。
    answer: (1) $y=\dfrac{9}{8}x^2-\dfrac{3}{4}x-2$；(2) $\dfrac{7\sqrt{10}}{10}$；(3) $P(\dfrac{5}{2},-\dfrac{1}{2})$，$Q(-\dfrac{5}{2},-\dfrac{7}{2})$
