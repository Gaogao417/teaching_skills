    stem_latex: 梯形 $ABCD$（$BC\parallel AD$），$AC\perp BD$，$AC=4$，$BD=3$，$\sin\angle BDA=$______
    answer: $\dfrac{4}{5}$
    clue: 平移 $BD$ 得 $CE=3$，$\sin=\frac{AC}{AE}=\frac{4}{5}$。
    solution_steps:
