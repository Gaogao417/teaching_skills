    id: Q014
    points: 4
    stem_latex: 甲乙楼间距10米，甲底测乙顶仰角 $60^{\circ}$，乙底测甲顶仰角 $45^{\circ}$，乙比甲高______米
    answer: $10\sqrt{3}-10$
    clue: $BC=10\sqrt{3}$，$AD=10$。
    solution_steps:
    - $BC=10\tan60^{\circ}=10\sqrt{3}$，$AD=10\tan45^{\circ}=10$。
    - $BC-AD=10\sqrt{3}-10$。
