    stem_latex: 方程组 $\begin{cases} x+y=5 \\ xy=6 \end{cases}$ 的解是______
    answer: $\begin{cases}x=2\\y=3\end{cases}$ 或 $\begin{cases}x=3\\y=2\end{cases}$
    clue: $t^2-5t+6=0$。
    solution_steps:
    - $x,y$ 是 $t^2-5t+6=0$ 的根，$t=2$ 或 $3$。
