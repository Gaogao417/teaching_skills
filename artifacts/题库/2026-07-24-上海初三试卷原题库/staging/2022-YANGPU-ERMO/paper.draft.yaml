      start_anchor: $(x-y)^{2}-4y^{2}=0$
      end_anchor: $\begin{cases} x_{2}=3 \\ y_{2}=1 \end{cases}$
    block:
      stem_latex: 解方程组：$\begin{cases} x-y=2 \\ x^{2}-2xy-3y^{2}=0 \end{cases}$
      answer: $\begin{cases} x_{1}=1 \\ y_{1}=-1 \end{cases}$ 或 $\begin{cases} x_{2}=3
        \\ y_{2}=1 \end{cases}$
      clue: ②因式分解。
      solution_steps:
      - ②化为 $(x-3y)(x+y)=0$，$x=3y$ 或 $x=-y$。
      - $x=3y$ 代入①：$2y=2$，$y=1$，$x=3$；$x=-y$ 代入①：$-2y=2$，$y=-1$，$x=1$。
