  - type: problem
    id: Q025
    points: 14
    stem_latex: '在 $\odot O$ 中，半径 $OA=10$，$\angle AOB=130^{\circ}$，$C$、$D$ 在弧 $AB$ 上（不与 $A$、$B$ 重合），$\overset{\frown}{CD}=2\overset{\frown}{AC}$。

      (1) 当 $OD\perp OA$ 时，求弦 $CD$；

      (2) 当 $OD\parallel AC$ 时，$AD$ 与 $OC$ 交于 $E$，求 $\dfrac{AE}{DE}$；

      (3) 若四边形 $BOCD$ 是梯形，$AC$ 能否成为 $\odot O$ 内接正多边形的边？若能求边数。'
    answer: (1) $CD=10$；(2) $\dfrac{AE}{DE}=\dfrac{\sqrt{5}-1}{2}$；(3) 能，边数为 $18$
    clue: (1) 弧角关系得等边三角形；(2) 相似；(3) 分梯形两种情况。
    solution_steps:
    - (1) 设 $\angle AOC=\alpha$，$\overset{\frown}{CD}=2\overset{\frown}{AC}$，$OD\perp OA$ 得 $3\alpha=90^{\circ}$，$\alpha=30^{\circ}$，$\angle COD=60^{\circ}$，$\triangle COD$ 等边，$CD=10$。
    - (2) $OD\parallel AC$ 得 $\alpha=36^{\circ}$，$\angle AOD=108^{\circ}$，$\triangle AOE\sim\triangle ADO$，$\dfrac{AE}{DE}=\dfrac{\sqrt{5}-1}{2}$。
    - (3) $BD\parallel OC$ 时 $\alpha=50^{\circ}$ 不合题意舍去；$CD\parallel OB$ 时 $\alpha=20^{\circ}$，$n=\dfrac{360}{20}=18$，能。
