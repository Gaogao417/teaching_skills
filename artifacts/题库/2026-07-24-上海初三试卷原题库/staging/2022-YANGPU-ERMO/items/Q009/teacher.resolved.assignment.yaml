    stem_latex: 方程 $\sqrt{2x+3}=x$ 的解为______
    answer: $x=3$
    clue: 两边平方后检验。
    solution_steps:
    - $2x+3=x^{2}$，$x^{2}-2x-3=0$，$x=3$ 或 $x=-1$，检验 $x=3$。
