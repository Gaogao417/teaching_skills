  - type: problem
    id: Q022
    points: 10
    stem_latex: '学生注意力指标数 $y$ 随时间 $x$（分）变化：$0\leqslant x<10$ 和 $10\leqslant x<20$ 为线段，$20\leqslant x\leqslant40$ 为双曲线一部分（$C(20,48)$）。

      (1) 点 $A$ 的注意力指标数；(2) 求 $0\leqslant x<10$ 时 $y$ 关于 $x$ 的解析式；(3) 讲解一道综合题需21分钟，能否安排使注意力指标数都不低于36？'
    answer: (1) $24$；(2) $y=\dfrac{12}{5}x+24$；(3) 能
    clue: (1) 双曲线求 $D$；(2) 待定系数；(3) 解不等式看时长。
    solution_steps:
    - (1) 双曲线 $y=\dfrac{960}{x}$，$D(40,24)$，$A$ 纵坐标 $24$。
    - (2) $A(0,24)$、$B(10,48)$，$y=\dfrac{12}{5}x+24$。
    - (3) $y\geqslant36$ 时 $5\leqslant x\leqslant\dfrac{80}{3}$，时长 $\dfrac{65}{3}>21$，能。
