    id: Q008
    points: 4
    stem_latex: 不等式组 $\begin{cases} 3-x<0 \\ 2x-12<0 \end{cases}$ 的解集是______
    answer: $3<x<6$
    clue: 分别解再取交集。
    solution_steps:
    - 由 $3-x<0$ 得 $x>3$；由 $2x-12<0$ 得 $x<6$，$\therefore 3<x<6$。
