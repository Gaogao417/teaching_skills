  blocks:
  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如图，$\triangle ABC$ 中 $D$、$E$ 在 $AB$、$AC$ 上，$DE\parallel BC$，$BD=2AD$，设 $\overrightarrow{AB}=\boldsymbol{m}$，$\overrightarrow{DE}=\boldsymbol{n}$，则 $\overrightarrow{AC}=$______
    answer: $\boldsymbol{m}+3\boldsymbol{n}$
    clue: $\overrightarrow{BC}=3\overrightarrow{DE}$。
    solution_steps:
    - $\dfrac{AD}{AB}=\dfrac{1}{3}$，$\overrightarrow{BC}=3\boldsymbol{n}$，$\overrightarrow{AC}=\overrightarrow{AB}+\overrightarrow{BC}=\boldsymbol{m}+3\boldsymbol{n}$。
