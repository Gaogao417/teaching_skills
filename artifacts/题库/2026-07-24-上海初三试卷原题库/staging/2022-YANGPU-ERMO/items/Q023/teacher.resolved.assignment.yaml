  - type: problem
    id: Q023
    points: 12
    stem_latex: '矩形 $ABCD$ 对角线 $AC$、$BD$ 交于 $O$，$E$、$F$ 分别为 $OC$、$OD$ 中点，联结 $AF$、$BE$。

      (1) 求证：四边形 $ABEF$ 是等腰梯形；

      (2) 过 $O$ 作 $OM\perp AB$ 于 $M$，联结 $ME$，若 $\angle OME=\angle BAC$，求证：四边形 $AMEF$ 是菱形。'
    answer: 见证明
    clue: (1) 中位线+等腰；(2) 平行四边形+邻边相等。
    solution_steps:
    - (1) $EF\parallel AB$，$OE=OF$，$BF=AE$，四边形 $ABEF$ 是等腰梯形。
    - (2) $EF=\dfrac{1}{2}CD$，$M$ 为 $AB$ 中点，$EF=AM$，$EF\parallel AM$，四边形 $AMEF$ 是平行四边形；由 $\angle OME=\angle BAC$ 推得邻边相等，$\therefore$ 是菱形。
