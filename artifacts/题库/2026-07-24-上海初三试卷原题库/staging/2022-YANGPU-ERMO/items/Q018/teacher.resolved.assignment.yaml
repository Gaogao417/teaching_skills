    id: Q018
    points: 4
    stem_latex: 钝角 $\triangle ABC$ 内接于 $\odot O$，$AB=BC$，将 $\triangle ABC$ 沿 $AO$ 翻折得 $\triangle AB^{\prime}C^{\prime}$，若 $BB^{\prime}:CC^{\prime}=4:3$，则 $\tan\angle BAC=$______
    answer: $\dfrac{\sqrt{55}}{11}$
    clue: 翻折+全等+相似+勾股。
    solution_steps:
    - 由翻折与全等、相似求得 $\tan\angle BAC=\dfrac{\sqrt{55}}{11}$。
