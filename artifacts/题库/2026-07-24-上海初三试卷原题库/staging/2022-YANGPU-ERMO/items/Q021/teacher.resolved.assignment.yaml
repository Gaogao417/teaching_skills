  - type: problem
    id: Q021
    points: 10
    stem_latex: '如图，平行四边形 $ABCD$，过 $D$ 作 $DE\perp AB$ 于 $E$，$AD=17$，$AB=20$，$\cos A=\dfrac{8}{17}$。

      (1) 求平行四边形 $ABCD$ 面积；

      (2) 联结 $CE$，求 $\sin\angle BCE$。'
    answer: (1) $300$；(2) $\sin\angle BCE=\dfrac{36}{85}$
    clue: (1) 解直角三角形求高；(2) 作 $EF\perp BC$。
    solution_steps:
    - (1) $AE=17\times\dfrac{8}{17}=8$，$DE=\sqrt{17^{2}-8^{2}}=15$，$S=AB\cdot DE=300$。
    - (2) $EB=12$，$EF=EB\sin A=12\times\dfrac{15}{17}=\dfrac{180}{17}$，$EC=25$，$\sin\angle BCE=\dfrac{EF}{EC}=\dfrac{36}{85}$。
