  - type: problem
    id: Q019
    points: 10
    stem_latex: 先化简再计算：$\dfrac{a^{2}-4a+4}{a^{2}-1}\div\dfrac{a^{2}-2a}{a+1}+\dfrac{1}{a-1}$，其中 $a=\sqrt{2}$。
    answer: $\dfrac{2}{a}$；代入得 $\sqrt{2}$
    clue: 分式化简。
    solution_steps:
    - 原式 $=\dfrac{(a-2)^{2}}{(a+1)(a-1)}\cdot\dfrac{a+1}{a(a-2)}+\dfrac{1}{a-1}=\dfrac{a-2}{a(a-1)}+\dfrac{1}{a-1}=\dfrac{2}{a}$。
    - $a=\sqrt{2}$ 时，原式 $=\dfrac{2}{\sqrt{2}}=\sqrt{2}$。
