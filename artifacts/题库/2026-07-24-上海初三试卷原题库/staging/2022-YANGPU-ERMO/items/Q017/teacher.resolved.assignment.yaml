  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 新定义\u201c中内弧\u201d：$\mathrm{Rt}\triangle ABC$（$\angle A=90^{\circ}$，$AB=AC=2\sqrt{2}$），$D$、$E$ 为 $AB$、$AC$ 中点，$\overset{\frown}{DE}$ 是中内弧，其长度最大值等于______
    answer: $\pi$
    clue: 以 $DE$ 为直径的半圆弧最长。
    solution_steps:
    - $DE=2$，最长中内弧为以 $DE$ 为直径的半圆，长 $\dfrac{1}{2}\times2\pi=\pi$。
