  - type: choice
    id: Q006
    points: 4
    stem_latex: 如图，梯形 $ABCD$ 中 $AD\parallel BC$，$AD=3$，$BC=9$，$AB=6$，$CD=4$，分别以 $AB,CD$ 为直径作圆，两圆位置关系是（\quad）
    choices:
    - 内切
    - 外切
    - 相交
    - 外离
    answer: D
    clue: 圆心距为梯形中位线长，与半径和比较。
    solution_steps:
    - 圆心距 $=\dfrac{3+9}{2}=6$，半径 $3,2$，$3+2=5<6$，外离。
