  blocks:
  - type: choice
    id: Q004
    points: 4
    stem_latex: 点 $(-2,y_{1}),(-1,y_{2}),(2,y_{3})$ 在反比例函数 $y=\dfrac{k}{x}$（$k<0$）图像上，那么（\quad）
    choices:
    - $y_{1}>y_{2}>y_{3}$
    - $y_{2}>y_{1}>y_{3}$
    - $y_{3}>y_{1}>y_{2}$
    - $y_{3}>y_{2}>y_{1}$
    answer: B
    clue: $k<0$ 时二象限点纵坐标为正、四象限为负，同象限内比较。
    solution_steps:
    - $(-2,y_1),(-1,y_2)$ 在二象限且 $y_2>y_1>0$，$(2,y_3)$ 在四象限 $y_3<0$，$\therefore y_2>y_1>y_3$。
