  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，$AD,AE$ 分别是 $\triangle ABC$ 边 $BC$ 上的高和中线，$BC=8$，$\tan B=\dfrac13$，$\angle C=45\degree$。（1）求 $AD$；（2）求 $\sin\angle BAE$．
    answer: (1) $AD=2$；(2) $\sin\angle BAE=\dfrac{\sqrt{5}}{5}$
    clue: (1) 由 $\tan B$ 与 $\angle C=45\degree$ 用 $BD=3AD,CD=AD$ 求 $AD$；(2) 作 $EF\perp AB$ 解直角三角形。
    solution_steps:
    - (1) $BD=3AD,CD=AD$，$BC=4AD=8$，$AD=2$。
    - (2) $BE=CE=4$，$EF=\dfrac{2\sqrt{10}}{5}$，$DE=2$，$AE=2\sqrt2$，$\sin\angle BAE=\dfrac{EF}{AE}=\dfrac{\sqrt5}{5}$。
