  - type: short_answer
    id: Q010
    points: 4
    stem_latex: 方程组 $\begin{cases} x^{2}-3xy+2y^{2}=0 \\ x+y=3 \end{cases}$ 的解是 ______
    answer: $\begin{cases}x=\dfrac32\\y=\dfrac32\end{cases}$ 或 $\begin{cases}x=2\\y=1\end{cases}$
    clue: ①分解为 $(x-y)(x-2y)=0$ 拆成两个方程组。
    solution_steps:
    - $(x-y)(x-2y)=0$，与 $x+y=3$ 联立解得两组。
