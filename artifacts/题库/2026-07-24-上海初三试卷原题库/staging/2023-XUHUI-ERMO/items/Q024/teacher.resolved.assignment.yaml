  - type: problem
    id: Q024
    points: 12
    stem_latex: 抛物线 $y=x^{2}+bx+c$ 经过 $A(-2,7)$，与 $x$ 轴交于 $B,C(5,0)$。（1）求顶点 $M$ 坐标；（2）$E$ 在对称轴上且在 $x$ 轴上方，将 $\triangle BCE$ 沿 $BE$ 翻折，$C$ 的对应点 $F$ 恰落对称轴上，求 $E$；（3）$P$ 在对称轴上，$Q$ 是第四象限抛物线上的点，当 $\triangle CPQ$ 为等边三角形时，求直线 $BQ$ 表达式．
    answer: (1) $M(2,-9)$；(2) $E(2,\sqrt{3})$；(3) $y=-\dfrac{\sqrt{3}}{3}x-\dfrac{\sqrt{3}}{3}$
    clue: (1) 待定系数 + 顶点式；(2) 由翻折 $FB=CB$ 及勾股求 $F,E$；(3) 证 $\triangle BCQ\cong\triangle FCP$ 转角，用待定系数求直线。
    solution_steps:
    - (1) 代入得 $b=-4,c=-5$，$y=(x-2)^{2}-9$，$M(2,-9)$。
    - (2) $B(-1,0)$，$BC=6$，$H(2,0)$，$BH=3$；翻折 $FB=6$，$FH=3\sqrt3$，$F(2,3\sqrt3)$，$\angle FBH=60\degree$，$EH=\sqrt3$，$E(2,\sqrt3)$。
    - (3) $\triangle FCB$ 等边，证 $\triangle BCQ\cong\triangle FCP$，$\angle CBQ=30\degree$，$BQ$ 交 $y$ 轴于 $K(0,-\dfrac{\sqrt3}{3})$，$y=-\dfrac{\sqrt3}{3}x-\dfrac{\sqrt3}{3}$。
