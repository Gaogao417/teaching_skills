  - type: choice
    id: Q003
    points: 4
    stem_latex: 如图，数轴上点 $A,B$ 分别在原点左、右两侧，对应实数 $a,b$，下列结论一定成立的是（\quad）
    choices:
    - $a+b<0$
    - $b-a<0$
    - $-2a>-2b$
    - $|a|>|b|$
    answer: C
    clue: 由数轴定 $a,b$ 符号与大小，再用不等式性质判断。
    solution_steps:
    - $a<0<b$，$a<b\Rightarrow -2a>-2b$。
