  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 如图，$\triangle ABC$ 中 $D$ 在 $AC$ 上且 $CD=2AD$，设 $\vec{BA}=\vec{a}$，$\vec{BC}=\vec{b}$，那么 $\vec{BD}=$ ______（用 $\vec{a},\vec{b}$ 表示）
    answer: $\dfrac{2}{3}\vec{a}+\dfrac{1}{3}\vec{b}$
    clue: $\vec{BD}=\vec{BC}+\vec{CD}$，$\vec{CD}=\dfrac23\vec{CA}$。
    solution_steps:
    - $\vec{CA}=\vec{a}-\vec{b}$，$\vec{CD}=\dfrac23(\vec{a}-\vec{b})$，$\vec{BD}=\vec{b}+\dfrac23\vec{a}-\dfrac23\vec{b}=\dfrac23\vec{a}+\dfrac13\vec{b}$。
