  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 如图，某校抽样调查做家务时间频数直方图。若该校有1500名学生，估计平均每周做家务时间少于2小时的学生约 ______ 人
    answer: '720'
    clue: 用样本中少于2小时的频率估计总体。
    solution_steps:
    - 样本中少于2小时 $4+20=24$ 人，$1500\times\dfrac{24}{50}=720$。
