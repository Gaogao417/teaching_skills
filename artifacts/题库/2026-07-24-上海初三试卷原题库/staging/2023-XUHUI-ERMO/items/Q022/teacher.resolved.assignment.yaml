  - type: problem
    id: Q022
    points: 10
    stem_latex: 花洒安装在离地160厘米的 $A$ 处，花洒 $AD$ 长20厘米。（1）若 $\angle BAD=120\degree$，水流 $CD$ 与 $AD$ 成 $90\degree$ 时，求 $C$ 到墙面距离（保留根号）；（2）店铺上月销售额2400元，本月每个便宜20元、多卖8个且销售额涨400元，求花洒原价．
    answer: (1) $\dfrac{200}{3}\sqrt{3}$ 厘米；(2) $120$ 元
    clue: (1) 构造矩形与含 $30\degree,60\degree$ 直角三角形；(2) 列分式方程，注意检验。
    solution_steps:
    - (1) 作 $DH\perp BC,AE\perp DH$，$DE=10,AE=BH=10\sqrt3,DH=170$；$CH=\dfrac{170}{\sqrt3}=\dfrac{170}{3}\sqrt3$，$BC=10\sqrt3+\dfrac{170}{3}\sqrt3=\dfrac{200}{3}\sqrt3$。
    - (2) $\dfrac{2800}{x-20}-\dfrac{2400}{x}=8$，$x=120$（检验合格）。
