  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 如图，$A(8,0),B(0,6)$，$\odot A$ 半径为5，$C$ 是 $\odot A$ 上动点，$P$ 是 $BC$ 中点，那么 $OP$ 长的取值范围是 ______
    answer: $2.5\leqslant OP\leqslant7.5$
    clue: 取 $B$ 关于原点的对称点 $B'$，由中位线 $B'C=2OP$，求 $B'C$ 范围。
    solution_steps:
    - 取 $B'(0,-6)$，$B'A=10$，$B'C=2OP$；$5\leqslant B'C\leqslant15$，$\therefore 2.5\leqslant OP\leqslant7.5$。
