  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，$\odot O$ 是 $\triangle ABC$ 外接圆，连 $AO$ 延长交 $BC$ 于 $D$，连 $OC$，且 $DC^{2}=OD\cdot AD$。（1）求证：$AC=BC$；（2）当 $AB=AD$ 时，过 $A$ 作 $BC$ 平行线交 $\odot O$ 于 $E$，连 $OE$ 交 $AC$ 于 $F$，求证：$AD\cdot AE=BC\cdot EF$．
    answer: (1)(2) 见解析
    clue: (1) 由 $DC^{2}=OD\cdot AD$ 证 $\triangle DOC\sim\triangle DCA$ 转角，结合垂径证等腰；(2) 证 $\triangle AEF\sim\triangle CBA$ 转化比例。
    solution_steps:
    - (1) $\triangle DOC\sim\triangle DCA\Rightarrow \angle ACO=\angle DCO$，延长 $CO$ 交 $AB$ 于 $H$，由垂径 $CH\perp AB$，$\angle CBA=\angle CAB$，$AC=BC$。
    - (2) 设角 $x$，证 $\angle EAO=\angle ADB,\angle AEF=\angle ABC,\angle EAF=\angle ACB$，$\triangle AEF\sim\triangle CBA$，$\dfrac{AE}{BC}=\dfrac{EF}{AB}$，$AB=AD\Rightarrow AD\cdot AE=BC\cdot EF$。
