  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，$\odot O$ 内接正方形 $ABCD$，$F$ 是 $\overset{\frown}{CD}$ 中点，$AF$ 交 $DC$ 于 $E$，那么 $\dfrac{EF}{AE}=$ ______
    answer: $\dfrac{\sqrt{2}-1}{2}$
    clue: 连 $OF$ 交 $CD$ 于 $G$，由 $GF\parallel AD$ 证 $\triangle ADE\sim\triangle FGE$。
    solution_steps:
    - $GF=\dfrac12(\sqrt2-1)a$，$\dfrac{EF}{AE}=\dfrac{GF}{AD}=\dfrac{\sqrt2-1}{2}$。
