      answer: (1) $M(2,-9)$；(2) $E(2,\sqrt{3})$；(3) $y=-\dfrac{\sqrt{3}}{3}x-\dfrac{\sqrt{3}}{3}$
      clue: (1) 待定系数 + 顶点式；(2) 由翻折 $FB=CB$ 及勾股求 $F,E$；(3) 证 $\triangle BCQ\cong\triangle
        FCP$ 转角，用待定系数求直线。
