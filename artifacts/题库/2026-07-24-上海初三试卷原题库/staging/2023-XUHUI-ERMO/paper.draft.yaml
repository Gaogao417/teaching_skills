      end_anchor: $\dfrac{3}{2}$
    block:
      stem_latex: 先化简 $\left(\dfrac{1}{x+3}-1\right)\div\dfrac{x^{2}-4}{x^{2}+6x+9}$，再从
        $-3,-2,0,2,3$ 中选一个合适的数代入求值．
      answer: $-\dfrac{x+3}{x-2}$；取 $x=0$ 时值为 $\dfrac{3}{2}$
      clue: 通分、分解因式后约分化简，选不使分母为零的值代入。
      solution_steps:
      - 原式 $=\dfrac{-(x+2)}{x+3}\cdot\dfrac{(x+3)^{2}}{(x+2)(x-2)}=-\dfrac{x+3}{x-2}$。
      - 取 $x=0$（避开 $-3,\pm2$），原式 $=\dfrac{3}{2}$。
