    block:
      stem_latex: 如图，已知四边形$ABCD$是矩形，$\cot\angle ADB=\dfrac{3}{4}$，$AB=16$。点$E$在射线$BC$上，点$F$在线段$BD$上，且$\angle DEF=\angle ADB$。(1) 求线段$BD$的长；(2) 设$BE=x$，$\triangle DEF$的面积为$y$，求$y$关于$x$的函数关系式，并写出函数定义域；(3) 当$\triangle DEF$为等腰三角形时，求线段$BE$的长。
      answer: $BD=20$；$y=\dfrac{x^{3}-24x^{2}+400x}{50}$（$0<x\leq 24$）；$BE=20$或$24$或$\dfrac{50}{3}$
      clue: 四边形综合题
      solution_steps:
      - (1) $\because$四边形$ABCD$是矩形，$\therefore \angle A=90^{\circ}$
      - 在Rt$\triangle BAD$中，$\cot\angle ADB=\dfrac{AD}{AB}=\dfrac{3}{4}$，$AB=16$，$\therefore AD=12$
      - $\therefore BD=\sqrt{AD^{2}+AB^{2}}=\sqrt{12^{2}+16^{2}}=20$
      - (2) $\because AD\parallel BC$，$\therefore \angle ADB=\angle DBC$
      - $\because \angle DEF=\angle ADB$，$\therefore \angle DEF=\angle DBC$
      - $\because \angle EDF=\angle BDE$，$\therefore \triangle EDF\sim\triangle BDE$
      - $\therefore \dfrac{S_{\triangle DEF}}{S_{\triangle BDE}}=\left(\dfrac{DE}{BD}\right)^{2}$
      - $\because BC=AD=12$，$BE=x$，$\therefore CE=|x-12|$
      - $\because CD=AB=16$，在Rt$\triangle CDE$中，$DE=\sqrt{16^{2}+(x-12)^{2}}=\sqrt{x^{2}-24x+400}$
      - $\therefore S_{\triangle BDE}=\dfrac{1}{2}\cdot BE\cdot CD=\dfrac{1}{2}\cdot x\cdot 16=8x$
      - $\therefore \dfrac{y}{8x}=\left(\dfrac{\sqrt{x^{2}-24x+400}}{20}\right)^{2}$，$\therefore y=\dfrac{x^{3}-24x^{2}+400x}{50}$，定义域为$0<x\leq 24$
      - (3) $\because \triangle EDF\sim\triangle BDE$，$\therefore$当$\triangle DEF$是等腰三角形时，$\triangle BDE$也是等腰三角形
      - ①当$BE=BD$时，$\because BD=20$，$\therefore BE=20$
      - ②当$DE=DB$时，$\because DC\perp BE$，$\therefore BC=CE=12$，$\therefore BE=24$
      - ③当$EB=ED$时，作$EH\perp BD$于$H$，则$BH=\dfrac{1}{2}BD=10$，$\cos\angle HBE=\cos\angle ADB$，即$\dfrac{AD}{BD}=\dfrac{BH}{BE}$，$\therefore \dfrac{12}{20}=\dfrac{10}{BE}$，解得$BE=\dfrac{50}{3}$
      - 综上所述，线段$BE$的长为$20$或$24$或$\dfrac{50}{3}$
