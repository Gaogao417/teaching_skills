      - $\therefore \dfrac{S_{\triangle BEF}}{S_{\triangle ABC}}=\left(\dfrac{BF}{BC}\right)^{2}$
      - $\because \dfrac{BF}{CF}=\dfrac{2}{3}$，$\therefore \dfrac{BF}{BC}=\dfrac{2}{5}$
      - $\because S_{\triangle BEF}=4$，$\therefore \dfrac{4}{S_{\triangle ABC}}=\left(\dfrac{2}{5}\right)^{2}$，$\therefore S_{\triangle ABC}=25$
