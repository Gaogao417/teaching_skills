      - $\because \triangle BEF$和$\triangle CEF$同高，且$S_{\triangle BEF}:S_{\triangle CEF}=2:3$，$\therefore \dfrac{CF}{BF}=\dfrac{3}{2}$
      - $\therefore \dfrac{CE}{DE}=\dfrac{CF}{BF}$，$\therefore EF\parallel BD$
      - $\therefore \dfrac{EF}{BD}=\dfrac{CF}{BC}$，$\dfrac{EF}{4}=\dfrac{3}{5}$，$\therefore EF=\dfrac{12}{5}$
