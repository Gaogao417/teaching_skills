    block:
      stem_latex: 如图，抛物线$y=-x^{2}+bx+c$过点$B(3,0)$、$C(0,3)$，$D$为抛物线的顶点。(1) 求抛物线的解析式以及顶点坐标；(2) 点$C$关于抛物线$y=-x^{2}+bx+c$对称轴的对称点为$E$点，联结$BC$、$BE$，求$\angle CBE$的正切值；(3) 点$M$是抛物线对称轴上一点，且$\triangle DMB$和$\triangle BCE$相似，求点$M$坐标。
      answer: $y=-x^{2}+2x+3$，顶点$D(1,4)$；$\tan\angle CBE=\dfrac{1}{2}$；$M\left(1,\dfrac{2}{3}\right)$或$(1,-2)$
      clue: 二次函数综合题
      solution_steps:
      - (1) 抛物线$y=-x^{2}+bx+c$经过点$B(3,0)$和点$C(0,3)$，$\therefore \begin{cases}-9+3b+c=0\\ c=3\end{cases}$
      - 解得$\begin{cases}b=2\\ c=3\end{cases}$，$\therefore$抛物线解析式为$y=-x^{2}+2x+3$
      - $y=-x^{2}+2x+3=-(x-1)^{2}+4$，$\therefore$抛物线顶点$D$的坐标为$(1,4)$
      - (2) 抛物线对称轴为直线$x=1$，点$E$与点$C(0,3)$关于直线$x=1$对称，$\therefore$点$E(2,3)$
      - 过点$E$作$EH\perp BC$于点$H$，$\because OC=OB=3$，$\therefore BC=3\sqrt{2}$
      - $S_{\triangle BCE}=\dfrac{1}{2}BC\cdot EH=\dfrac{1}{2}CE\cdot OC$，$CE=2$，$\therefore 3\sqrt{2}\cdot EH=2\times 3$，解得$EH=\sqrt{2}$
      - $\because \angle ECH=\angle CBO=45^{\circ}$，$\therefore CH=EH=\sqrt{2}$，$\therefore BH=2\sqrt{2}$
      - 在Rt$\triangle BEH$中，$\tan\angle CBE=\dfrac{EH}{BH}=\dfrac{\sqrt{2}}{2\sqrt{2}}=\dfrac{1}{2}$
      - (3) 设$M(1,m)$，对称轴交$x$轴于点$P$，则$P(1,0)$，$BP=2$，$DP=4$
      - $\tan\angle BDP=\dfrac{1}{2}$，$\therefore \angle CBE=\angle BDP$
      - $\triangle DMB$与$\triangle BEC$相似，$\therefore \dfrac{DM}{DB}=\dfrac{BE}{BC}$或$\dfrac{DM}{DB}=\dfrac{BC}{BE}$
      - ①$\dfrac{DM}{DB}=\dfrac{BE}{BC}$，$DM=4-m$，$DB=2\sqrt{5}$，$BC=3\sqrt{2}$，$BE=\sqrt{10}$，$\dfrac{4-m}{2\sqrt{5}}=\dfrac{\sqrt{10}}{3\sqrt{2}}$，解得$m=\dfrac{2}{3}$，点$M\left(1,\dfrac{2}{3}\right)$
      - ②$\dfrac{DM}{DB}=\dfrac{BC}{BE}$，$\dfrac{4-m}{2\sqrt{5}}=\dfrac{3\sqrt{2}}{\sqrt{10}}$，解得$m=-2$，点$M(1,-2)$
      - 当点$M$在点$D$的上方时，点$M$不存在。综上所述，点$M$的坐标为$\left(1,\dfrac{2}{3}\right)$或$(1,-2)$
