    block:
      stem_latex: 某大型购物商场在一楼和二楼之间安装自动扶梯$AC$，截面如图所示，一楼和二楼地面平行（即$AB$所在的直线与$CD$平行），层高$AD$为$8$米，$\angle ACD=20^{\circ}$。(1) 要使身高$2.26$米的姚明乘坐自动扶梯时不碰头，那么$A$、$B$之间的距离至少要多少米？（精确到$0.1$米）(2) 如果自动扶梯改为由$AE$、$EF$、$FC$三段组成，中间段$EF$为平台（即$EF\parallel DC$），$AE$段和$FC$段的坡度$i=1:2$，求平台$EF$的长度。（精确到$0.1$米）（参考数据：$\sin 20^{\circ}\approx 0.34$，$\cos 20^{\circ}\approx 0.94$，$\tan 20^{\circ}\approx 0.36$）
      answer: $AB\approx 6.3$米；$EF\approx 6.2$米
      clue: 解直角三角形的应用-坡度坡角问题
      solution_steps:
      - (1) 连接$AB$，作$BG\perp AB$交$AC$于点$G$，则$\angle ABG=90^{\circ}$
      - $\because AB\parallel CD$，$\therefore \angle BAG=\angle ACD=20^{\circ}$
      - 在Rt$\triangle ABG$中，$\tan\angle BAG=\dfrac{BG}{AB}$
      - $\because BG=2.26$，$\tan 20^{\circ}\approx 0.36$，$\therefore 0.36=\dfrac{2.26}{AB}$，$\therefore AB\approx 6.3$
      - (2) 设直线$EF$交$AD$于点$P$，作$CQ\perp EF$于点$Q$
      - $\because AE$和$FC$的坡度为$1:2$，$\therefore \dfrac{AP}{PE}=\dfrac{CQ}{FQ}=\dfrac{1}{2}$
      - 设$AP=x$，则$PE=2x$，$PD=8-x$
      - $\because EF\parallel DC$，$\therefore CQ=PD=8-x$，$\therefore FQ=2(8-x)=16-2x$
      - 在Rt$\triangle ACD$中，$\tan\angle ACD=\dfrac{AD}{CD}$，$\because AD=8$，$\angle ACD=20^{\circ}$，$\therefore CD\approx 22.22$
      - $\because PE+EF+FQ=CD$，$\therefore 2x+EF+16-2x=22.22$，$\therefore EF=6.22\approx 6.2$
