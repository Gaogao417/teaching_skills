      solution_steps: [{title: 官方解答, content: '（1）正确结论为①③。（2）由作图得 $AD$ 平分 $\angle BAC$，$DE\perp AC$，从而 $BD=DE$、$AE=AB=3$。由 $\cos C=0.8$ 且 $AB=3$ 得 $BC=4$、$AC=5$。设 $DE=BD=x$，由直角三角形比例得 $x=\frac32$，所以 $AD=\sqrt{AE^2+DE^2}=\frac{3\sqrt5}{2}$。'}]
