  - type: problem
    id: Q022
    points: 10
    stem_latex: 闪电发生瞬间，在地面点 $O$ 处测得始发点 $A$ 的仰角为 $15^\circ$，8秒后收到雷声；另一始发点 $B$ 的仰角为 $75^\circ$，15秒后收到雷声。点 $A、B、O$ 在同一垂直于地面的平面内，声速为340米/秒。（1）按图中模型求 $A、B$ 两点间的距离；（2）判断点 $A、B$ 的位置是否存在另一种情形；若存在，画草图并求距离，否则说明理由。
    answer: （1）$5780$米；（2）存在，另一距离为$4420$米
    solution_steps:
    - title: 官方解答
      content: 记340米/秒为 $a$，则 $OA=8a$、$OB=15a$。第一种位置中 $\angle AOB=90^\circ$，故 $AB=17a=5780$ 米。另一种位置中 $\angle AOB=60^\circ$，作高后计算得 $AB=13a=4420$ 米。
