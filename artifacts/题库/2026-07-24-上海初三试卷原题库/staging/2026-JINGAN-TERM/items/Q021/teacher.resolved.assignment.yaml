  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，以点 $O$ 为圆心的两个同心圆中，不经过圆心的线段与两圆相交，自左向右的交点依次为 $A、B、C、D$。（1）证明：$AB=CD$；（2）连接 $OA、OB$，如果 $\angle OAD=30^\circ$，$\angle OBC=45^\circ$，$AB=2$，求小圆半径 $r$。
    answer: （1）结论成立；（2）$r=\sqrt{6+\sqrt2}$
    solution_steps:
    - title: 官方解答
      content: 过点 $O$ 作 $OH\perp BC$，由垂径定理得 $BH=CH$、$AH=DH$，所以 $AB=CD$。连接 $AO、BO$，利用两个直角三角形和给定角，设 $OH=x$，由 $AH-BH=2$ 得 $x=\sqrt3+1$，从而 $OB=\sqrt{OH^2+BH^2}=\sqrt{6+\sqrt2}$。
