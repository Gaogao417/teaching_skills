  - type: problem
    id: Q025
    points: 14
    stem_latex: 在 $\triangle ABC$ 中，$\angle BAC=60^\circ$，射线 $AP$ 在 $\angle BAC$ 内部，射线 $AQ$ 与 $AP$ 在边 $AB$ 两侧，$\angle QAP=\angle BAC$，点 $E、D$ 分别在射线 $AP、AQ$ 上，且 $AD\cdot AC=AB\cdot AE$。（1）连接 $DB、CE$，证明 $\angle ABC-\angle AEC=\angle BDE$；（2）如果 $AP$ 平分 $\angle BAC$，$AE$ 与 $BC$ 的公共点为 $G$，$AB=AG=6$，$AE=x$，$DE=y$，求 $y$ 关于 $x$ 的函数解析式并写出定义域；（3）如果 $AP\perp BC$，垂足为 $K$，且 $DE\parallel AC$，$AC=6$，$EK=\sqrt2$，求 $DE$。
    answer: （1）结论成立；（2）$y=\frac{3\sqrt2-\sqrt6}{2}x\ (x\ge6)$；（3）$DE=12-4\sqrt3$ 或 $6-2\sqrt3$
    solution_steps:
    - title: 官方解答
      content: （1）由 $AD\cdot AC=AB\cdot AE$ 和夹角相等证明 $\triangle BAC\sim\triangle DAE$，再证 $\triangle ADB\sim\triangle AEC$，整理角关系即得结论。（2）由角平分线和 $AB=AG=6$ 求得 $AC=3+3\sqrt3$、$BC=3\sqrt6$，再由相似比例得 $y=\frac{3\sqrt2-\sqrt6}{2}x$，定义域为 $x\ge6$。（3）由 $AP\perp BC$、$AC=6$ 得 $AK=CK=3\sqrt2$。按 $AE=AK\pm KE$ 分类，分别得到 $DE=12-4\sqrt3$ 或 $6-2\sqrt3$。
