  - type: problem
    id: Q020
    points: 10
    stem_latex: 如图，在 $\triangle ABC$ 中，$\angle B=90^\circ$，通过尺规作图作出线段 $AD$、射线 $DE$。（1）判断下列结论正确的是哪些：①$\triangle ABC\sim\triangle DEC$；②$AD=DC$；③$AB+EC=AC$。（请填写编号）（2）如果 $\cos C=0.8$，$AB=3$，求 $AD$ 的长。
    answer: （1）①③；（2）$\frac{3\sqrt5}{2}$
    solution_steps:
    - title: 官方解答
      content: （1）正确结论为①③。（2）由作图得 $AD$ 平分 $\angle BAC$，$DE\perp AC$，从而 $BD=DE$、$AE=AB=3$。由 $\cos C=0.8$ 且 $AB=3$ 得 $BC=4$、$AC=5$。设 $DE=BD=x$，由直角三角形比例得 $x=\frac32$，所以 $AD=\sqrt{AE^2+DE^2}=\frac{3\sqrt5}{2}$。
