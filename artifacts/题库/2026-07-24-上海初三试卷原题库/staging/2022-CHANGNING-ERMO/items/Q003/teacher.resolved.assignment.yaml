    stem_latex: 如图1，已知 $A$、$B$、$C$ 是直线 $l$ 上的三点，$P$ 是直线 $l$ 外的一点，$BC=2AB$，$\overrightarrow{PA}=\vec{m}$，$\overrightarrow{PB}=\vec{n}$，那么 $\overrightarrow{PC}$ 等于（\quad）
    choices:
    - $-2\vec{m}+3\vec{n}$
    - $-\vec{m}+2\vec{n}$
    - $2\vec{m}-\vec{n}$
    - $4\vec{m}-3\vec{n}$
    answer: A
    clue: $\overrightarrow{PC}=\overrightarrow{PA}+3\overrightarrow{AB}=\vec{m}+3(\vec{n}-\vec{m})=-2\vec{m}+3\vec{n}$。
