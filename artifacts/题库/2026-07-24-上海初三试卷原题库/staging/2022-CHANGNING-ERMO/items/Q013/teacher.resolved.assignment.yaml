    stem_latex: $1\mathrm{nm}=10^{-9}\mathrm{m}$，一根头发直径约 $0.005\mathrm{cm}$，那么 $0.005\mathrm{cm}=$______ $\mathrm{nm}$。（科学记数法）
    answer: $5\times10^{4}$
    clue: $0.005\mathrm{cm}=5\times10^{-5}\mathrm{m}=5\times10^{4}\mathrm{nm}$。
    solution_steps:
    - $0.005\mathrm{cm}=5\times10^{-5}\mathrm{m}=5\times10^{-5}\times10^{9}\mathrm{nm}=5\times10^{4}\mathrm{nm}$。
