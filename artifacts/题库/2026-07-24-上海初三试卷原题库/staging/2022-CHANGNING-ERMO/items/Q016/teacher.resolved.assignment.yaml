  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 在梯形 $ABCD$ 中，$AD\parallel BC$，$AB=CD=AD$，$BD=BC$，那么 $\angle A$ 等于______度。
    answer: '108'
    clue: 设 $\angle A=\alpha$，由等腰关系列方程。
    solution_steps:
    - 由 $AB=AD$ 得 $\angle ABD=\angle ADB$，结合 $BD=BC$、$AB=CD$ 可推得 $\angle A=108^{\circ}$。
