  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 矩形 $ABCD$ 是黄金矩形（邻边之比为 $\dfrac{\sqrt{5}-1}{2}$），$E$ 在 $BC$ 上，沿 $AE$ 折叠使 $B$ 落在 $AD$ 上的点 $F$ 处，那么 $EF$ 与 $CE$ 的比值等于______
    answer: $\dfrac{\sqrt{5}+1}{2}$
    clue: 黄金矩形折叠，$EF=AF$，结合比例求解。
    solution_steps:
    - 由折叠 $AB=AF$、$EF=BE$，结合黄金比 $\dfrac{AB}{BC}=\dfrac{\sqrt{5}-1}{2}$，可推得 $\dfrac{EF}{CE}=\dfrac{\sqrt{5}+1}{2}$。
