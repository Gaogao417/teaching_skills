  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 销售一辆A型车获利 $2.4$ 万元，一辆B型车获利 $2$ 万元。若A型售 $6$ 辆、B型售 $9$ 辆，那么销售一辆汽车平均可获利______万元。
    answer: '2.16'
    clue: 加权平均。
    solution_steps:
    - $\dfrac{2.4\times6+2\times9}{6+9}=\dfrac{32.4}{15}=2.16$ 万元。
    source_solution_images: []
