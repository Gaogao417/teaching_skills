    stem_latex: '如图7，在 $\triangle ABC$ 中，$D$ 是边 $BC$ 上一点，$G$ 是线段 $AD$ 上一点，且 $AG=2GD$，联结 $BG$ 并延长交边 $AC$ 于点 $E$。

      (1) 求证：$\dfrac{AE}{CE}=\dfrac{2BD}{BC}$；

      (2) 如果 $D$ 是边 $BC$ 的中点，$P$ 是边 $BC$ 延长线上一点，且 $CP=BC$，延长线段 $BE$，交线段 $AP$ 于点 $F$，联结 $CF$、$CG$，求证：四边形 $AGCF$ 是平行四边形。'
