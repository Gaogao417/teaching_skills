    stem_latex: 将直线 $y=-2x+6$ 向左平移三个单位后，所得直线的表达式为______
    answer: $y=-2x$
    clue: 左移3个单位，$x$ 换成 $x+3$。
    solution_steps:
    - $y=-2(x+3)+6=-2x$。
