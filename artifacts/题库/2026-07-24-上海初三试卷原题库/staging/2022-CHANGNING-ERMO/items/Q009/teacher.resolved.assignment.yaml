    stem_latex: 方程 $\sqrt{7-x}=3$ 的解是______
    answer: $-2$
    clue: 两边平方后求解并检验。
    solution_steps:
    - 两边平方 $7-x=9$，$\therefore x=-2$。检验：$\sqrt{7-(-2)}=3$ 成立。
