    stem_latex: '甲车从A地驶往B地，乙车从B地驶往A地，同时出发匀速行驶。甲车行驶 $2$ 小时后停车一段时间，再按原速继续，最后两车同时到达。甲车速度比乙车每小时快 $10$ 千米，图中折线为甲车离A地路程 $S$（千米）与时间 $t$（时）的函数关系（$t=6$ 时 $S=300$）。

      (1) 甲、乙两车速度分别为每小时多少千米？

      (2) 两车在离A地多少千米处相遇？（结果保留三位有效数字）'
