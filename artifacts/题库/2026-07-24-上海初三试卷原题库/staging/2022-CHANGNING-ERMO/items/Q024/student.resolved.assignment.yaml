    stem_latex: '如图8，菱形 $ABCD$ 的顶点 $A$、$B$ 分别在 $x$ 轴、$y$ 轴的正半轴上，点 $D(4,1)$，抛物线 $y=\dfrac{5}{6}x^{2}+bx+c$ 经过 $A$、$B$、$D$，对称轴为 $x=\dfrac{23}{10}$。

      (1) 求抛物线的表达式；

      (2) 求证：菱形 $ABCD$ 是正方形；

      (3) 联结 $OC$，$P$ 是 $x$ 轴上一点且横坐标大于点 $D$ 的横坐标，$\angle PCD=\angle BCO$，求点 $P$ 的坐标。'
