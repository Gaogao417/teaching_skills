  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 如图4，$M$ 是 $\mathrm{Rt}\triangle ABC$ 斜边 $AB$ 的中点，将 $\mathrm{Rt}\triangle ABC$ 绕点 $B$ 旋转，使点 $C$ 落在射线 $CM$ 上的点 $D$ 处，点 $A$ 落在点 $E$ 处，边 $ED$ 的延长线交边 $AC$ 于点 $F$。如果 $BC=6$，$AC=8$，那么 $CF$ 的长等于______
    answer: $\dfrac{9}{2}$
    clue: 旋转不变量+中位线/相似。
    solution_steps:
    - $AB=10$，$M$ 为 $AB$ 中点。由旋转及 $D$ 在 $CM$ 上，利用相似可求得 $CF=\dfrac{9}{2}$。
