    id: Q015
    points: 4
    stem_latex: 一个正多边形的中心角为 $45^{\circ}$，边长为 $5$，那么它的周长等于______
    answer: '40'
    clue: 中心角 $45^{\circ}$ 得边数 $8$。
    solution_steps:
    - 边数 $n=\dfrac{360^{\circ}}{45^{\circ}}=8$，周长 $=8\times5=40$。
