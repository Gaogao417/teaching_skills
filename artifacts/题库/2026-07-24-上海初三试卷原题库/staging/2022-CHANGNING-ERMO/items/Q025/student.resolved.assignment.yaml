    stem_latex: '如图9，在 $\mathrm{Rt}\triangle ABC$ 中，$\angle C=90^{\circ}$，$P$ 是边 $BC$ 上一点，$\angle APC=45^{\circ}$，$PD\perp AB$，垂足为点 $D$，$AB=4\sqrt{5}$，$BP=4$。

      (1) 求线段 $PD$ 的长；

      (2) 如果 $\angle C$ 的平分线 $CQ$ 交线段 $PD$ 的延长线于点 $Q$，求 $\angle CQP$ 的正切值；

      (3) 过点 $D$ 作 $\mathrm{Rt}\triangle ABC$ 的直角边的平行线，交直线 $AP$ 于点 $E$，作射线 $CE$，交直线 $PD$ 于点 $F$，求 $\dfrac{CE}{EF}$ 的值。'
