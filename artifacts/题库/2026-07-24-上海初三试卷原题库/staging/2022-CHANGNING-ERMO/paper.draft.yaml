      end_anchor: $\dfrac{7}{2}$
    block:
      stem_latex: 计算：$5^{\frac{1}{2}}+2^{-1}-|\sqrt{5}-2|+(2022-\pi)^{0}$
      answer: $\dfrac{7}{2}$
      clue: 分数指数幂、负指数幂、绝对值、零指数幂。
      solution_steps:
      - $5^{\frac{1}{2}}=\sqrt{5}$，$2^{-1}=\dfrac{1}{2}$，$|\sqrt{5}-2|=\sqrt{5}-2$，$(2022-\pi)^{0}=1$。
      - 原式 $=\sqrt{5}+\dfrac{1}{2}-(\sqrt{5}-2)+1=\sqrt{5}+\dfrac{1}{2}-\sqrt{5}+2+1=\dfrac{7}{2}$。
