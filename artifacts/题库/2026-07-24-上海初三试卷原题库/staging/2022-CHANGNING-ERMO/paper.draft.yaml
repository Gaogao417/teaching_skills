      start_anchor: 乙车的速度
      end_anchor: 约 $136$ 千米
    block:
      stem_latex: '甲车从A地驶往B地，乙车从B地驶往A地，同时出发匀速行驶。甲车行驶 $2$ 小时后停车一段时间，再按原速继续，最后两车同时到达。甲车速度比乙车每小时快
        $10$ 千米，图中折线为甲车离A地路程 $S$（千米）与时间 $t$（时）的函数关系（$t=6$ 时 $S=300$）。

        (1) 甲、乙两车速度分别为每小时多少千米？

        (2) 两车在离A地多少千米处相遇？（结果保留三位有效数字）'
      answer: (1) 甲 $60$ 千米/时，乙 $50$ 千米/时；(2) 约 $136$ 千米
      clue: 由总路程与时间求速度；用相遇时路程相等列方程。
      solution_steps:
      - (1) 乙车速度 $=\dfrac{300}{6}=50$ 千米/时，$\therefore$ 甲车速度 $=60$ 千米/时。
      - (2) 甲车停车 $1$ 小时。设两车在离A地 $x$ 千米处相遇，由相遇时乙车比甲车多行（含停车）列 $\dfrac{300-x}{50}-\dfrac{x}{60}=1$。
      - 解得 $x=\dfrac{1500}{11}\approx136$ 千米。
