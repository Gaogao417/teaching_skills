    stem_latex: 如图，在 $\triangle ABC$ 中，$BC$、$AC$ 上的中线 $AE$、$BD$ 相交于点 $F$，如果 $\angle BAE=\angle C$，那么 $\dfrac{AF}{AC}$ 的值为\u3000\u3000\u3000\u3000。
