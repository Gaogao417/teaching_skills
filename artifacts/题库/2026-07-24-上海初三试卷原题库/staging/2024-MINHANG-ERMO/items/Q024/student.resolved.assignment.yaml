    stem_latex: '已知抛物线 $y=\dfrac{1}{2}x^2+bx+c$ 与 $x$ 轴交于 $A(-1,0)$、$B$，与 $y$ 轴交于 $C(0,-2)$。

      (1) 求抛物线的表达式；

      (2) 点 $D$ 在 $x$ 正半轴上，$\angle ADC=2\angle ACO$，四边形 $AQCD$ 是菱形，直接写出 $D$、$Q$ 坐标；

      (3) 点 $E$ 在抛物线对称轴上（纵坐标 $t$），四边形 $ACBE$ 是凹四边形（$AE$ 与 $BC$ 不相交），求 $t$ 的取值范围。'
