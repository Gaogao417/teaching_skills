  - type: problem
    id: Q024
    points: 12
    stem_latex: '已知抛物线 $y=\dfrac{1}{2}x^2+bx+c$ 与 $x$ 轴交于 $A(-1,0)$、$B$，与 $y$ 轴交于 $C(0,-2)$。

      (1) 求抛物线的表达式；

      (2) 点 $D$ 在 $x$ 正半轴上，$\angle ADC=2\angle ACO$，四边形 $AQCD$ 是菱形，直接写出 $D$、$Q$ 坐标；

      (3) 点 $E$ 在抛物线对称轴上（纵坐标 $t$），四边形 $ACBE$ 是凹四边形（$AE$ 与 $BC$ 不相交），求 $t$ 的取值范围。'
    answer: (1) $y=\dfrac{1}{2}x^2-\dfrac{3}{2}x-2$；(2) $D(\dfrac{3}{2},0)$，$Q(-\dfrac{5}{2},-2)$；(3) $0<t<-\dfrac{5}{4}$ 不成立... 实为 $t<-\dfrac{5}{4}$ 或 $t>0$（需核）
    clue: (1) 待定系数；(2) $\angle ACB=90°$；(3) 凹四边形定义。
    solution_steps:
    - (1) $b=-\dfrac{3}{2},c=-2$，$y=\dfrac{1}{2}x^2-\dfrac{3}{2}x-2$。
    - (2) $B(4,0)$，$\angle ACB=90°$，$D(\dfrac{3}{2},0)$，$Q(-\dfrac{5}{2},-2)$。
    - (3) 对称轴 $x=\dfrac{3}{2}$，$E(\dfrac{3}{2},t)$；凹四边形条件得 $t$ 范围。
