  - type: problem
    id: Q019
    points: 10
    stem_latex: 计算：$\sqrt{8}-2024^0+\left(\dfrac{1}{2}\right)^{-1}+|\sqrt{2}-2|$
    answer: $\sqrt{2}+3$
    clue: 二次根式、零指数幂、负指数幂、绝对值。
    solution_steps:
    - $\sqrt{8}=2\sqrt{2}$，$2024^0=1$，$(\dfrac{1}{2})^{-1}=2$，$|\sqrt{2}-2|=2-\sqrt{2}$。
    - 原式 $=2\sqrt{2}-1+2+2-\sqrt{2}=\sqrt{2}+3$。
