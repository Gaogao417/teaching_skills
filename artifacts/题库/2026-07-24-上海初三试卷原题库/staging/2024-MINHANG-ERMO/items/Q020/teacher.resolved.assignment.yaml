  - type: problem
    id: Q020
    points: 10
    stem_latex: 先化简，再求值：$\dfrac{1}{a-1}+\dfrac{a^2+a}{a^2-2a+1}\div\dfrac{a+1}{a-1}$，其中 $a=\sqrt{2}$。
    answer: $3+2\sqrt{2}$
    clue: 分式化简后代入分母有理化。
    solution_steps:
    - 原式 $=\dfrac{1}{a-1}+\dfrac{a}{a-1}=\dfrac{a+1}{a-1}$。
    - $a=\sqrt{2}$：$\dfrac{\sqrt{2}+1}{\sqrt{2}-1}=3+2\sqrt{2}$。
