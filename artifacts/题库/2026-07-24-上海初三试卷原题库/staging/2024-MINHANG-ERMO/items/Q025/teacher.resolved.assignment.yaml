  - type: problem
    id: Q025
    points: 14
    stem_latex: '如图，$OB$ 是 $\odot O$ 的半径，弦 $AB\perp BC$，$M$ 是 $BC$ 中点，过 $M$ 作 $OB$ 的平行线交 $\odot O$ 于 $E$、$F$。

      (1) 当 $AB=BC$ 时，①求 $\angle ABO$；②连接 $OE$，求证 $\angle OEF=30°$；

      (2) 当 $AB\leqslant BC$ 时，$\tan\angle OEF=x$，$\dfrac{AB}{BC}=y$，求 $y$ 关于 $x$ 的函数关系式及定义域。'
    answer: (1)①$45°$；②证明见详解；(2) $y=\dfrac{\sqrt{x^2+1}-\sqrt{1-3x^2}}{2x}$，$0<x\leqslant\dfrac{\sqrt{3}}{3}$
    clue: (1)①$A,O,C$ 共线，$OB$ 平分 $\angle ABC$；②$OH=\dfrac{1}{2}OE$；(2) $\triangle AOG\sim\triangle ONP$。
    solution_steps:
    - (1)①$A,O,C$ 共线，$OB$ 平分 $\angle ABC=90°$，$\angle ABO=45°$。
    - (1)②$EF\perp AC$，$OH=\dfrac{1}{2}OC=\dfrac{1}{2}OE$，$\sin\angle OEF=\dfrac{1}{2}$，$\angle OEF=30°$。
    - (2) $OP=\dfrac{x}{\sqrt{x^2+1}}r$，$\triangle AOG\sim\triangle ONP$，$AG=2OP$，$y=\dfrac{\sqrt{x^2+1}-\sqrt{1-3x^2}}{2x}$，$0<x\leqslant\dfrac{\sqrt{3}}{3}$。
