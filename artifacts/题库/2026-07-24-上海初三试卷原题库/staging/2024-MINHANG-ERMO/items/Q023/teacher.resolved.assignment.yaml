  - type: problem
    id: Q023
    points: 12
    stem_latex: '探究用尺规作圆的内接正六边形和正五边形。

      (1) 用符号语言写出证明六边形 $ABCDEF$ 是正六边形所需的两个条件；

      (2) 已知 $\odot O$ 半径为 $2$，求正五边形的边 $AB$ 的长，并证明五边形 $ABCDE$ 是正五边形。'
    answer: (1) $AB=BC=CD=DE=EF=FA$，$\angle A=\angle B=\angle C=\angle D=\angle E=\angle F$；(2) $AB=\sqrt{10-2\sqrt{5}}$，证明见详解
    clue: (2) $AM=\sqrt{5}$，$AN=\sqrt{10-2\sqrt{5}}$，$\angle AOB=72°$。
    solution_steps:
    - (1) 各边相等、各角相等。
    - (2) $OM=1$，$AM=\sqrt{5}$，$ON=\sqrt{5}-1$，$AN=\sqrt{10-2\sqrt{5}}=AB$；$\angle AOB=72°$，全等得各边等各角等 $108°$。
