  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 如图，在 $Rt\triangle ABC$ 中，$\angle B=90°$，$AB=6$，$\sin C=\dfrac{3}{5}$，$D$ 为 $AB$ 上动点，将 $DA$ 绕 $D$ 旋转使 $A$ 落在 $AC$ 上 $E$ 处，过 $E$ 作 $EF\perp DE$ 交 $BC$ 于 $F$，当 $\triangle DEF$ 是等腰三角形时，$CF=$\u3000\u3000\u3000\u3000。
    answer: $\dfrac{25}{7}$
    clue: $AC=10,BC=8$，$DE=EF=CF=x$，$(6-x)^2+(8-x)^2=2x^2$。
    solution_steps:
    - $DE=EF=CF=x$，$(6-x)^2+(8-x)^2=(\sqrt{2}x)^2$，$x=\dfrac{25}{7}$。
