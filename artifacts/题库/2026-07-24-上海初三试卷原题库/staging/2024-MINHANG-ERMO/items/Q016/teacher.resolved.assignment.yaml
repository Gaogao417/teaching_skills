  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 已知 $y=x^2+bx+1$，从 $0$、$1$、$2$ 中随机取一个作 $b$，得到的抛物线顶点在坐标轴上的概率是\u3000\u3000\u3000\u3000。
    answer: $\dfrac{2}{3}$
    clue: $b=0$ 顶点 $(0,1)$ 在 $y$ 轴；$b=2$ 顶点 $(-1,0)$ 在 $x$ 轴。
    solution_steps:
    - $b=0,2$ 时顶点在坐标轴上，$P=\dfrac{2}{3}$。
