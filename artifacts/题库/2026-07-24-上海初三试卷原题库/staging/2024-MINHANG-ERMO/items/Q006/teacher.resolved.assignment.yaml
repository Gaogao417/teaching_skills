  - type: choice
    id: Q006
    points: 4
    stem_latex: 在矩形 $ABCD$ 中，$AB<BC$，点 $E$ 在 $AB$ 上，点 $F$ 在 $BC$ 上，$AB=a$，$BE=CF=b$，$DE=c$，$\angle BEF=\angle DFC$。结论①$(a+b)^2+(a-b)^2=c^2$；②$a+b>\dfrac{\sqrt{2}}{2}c$。判断正确的是（　　）
    choices:
    - ①②都正确
    - ①②都错误
    - ①正确，②错误
    - ①错误，②正确
    answer: A
    clue: $\triangle BEF\cong\triangle CFD$，$\triangle DEF$ 等腰直角，$a^2+b^2=\dfrac{1}{2}c^2$。
