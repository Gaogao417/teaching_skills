    stem_latex: 某小组 $6$ 名学生一分钟跳绳个数为 $166$、$160$、$160$、$150$、$134$、$130$，那么这组数据的平均数和中位数分别是（　　）
    choices:
    - $150$，$150$
    - $155$，$155$
    - $150$，$160$
    - $150$，$155$
