    stem_latex: 下列图形中，是中心对称图形且旋转 $240\degree$ 后能与自身重合的是（\quad）
    choices:
    - 等边三角形
    - 正方形
    - 正八边形
    - 正十二边形
    answer: D
    clue: 中心对称 + $240\degree$ 是 $\dfrac{360\degree}{n}$ 的整数倍。
    solution_steps:
    - 正十二边形 $\dfrac{360\degree}{12}=30\degree$，$240\degree$ 是 $30\degree$ 的整数倍。
