  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 如图，$AD,BE$ 是 $\triangle ABC$ 的中线交于 $G$，当 $\angle AEG=\angle ADC$ 时，$\dfrac{AC}{AD}$ 的值等于 ______
    answer: $\dfrac{2\sqrt{3}}{3}$
    clue: 由 $\angle AEG=\angle ADC$ 证 $\triangle AEG\sim\triangle ADC$，结合重心比求比值。
    solution_steps:
    - $\triangle AEG\sim\triangle ADC$，$\dfrac{AG}{AC}=\dfrac{AE}{AD}$；重心 $AG=\dfrac{2}{3}AD$，$AE=\dfrac{1}{2}AC$。
    - $\dfrac{2}{3}AD\cdot AD=\dfrac{1}{2}AC^{2}$，$\dfrac{AC^{2}}{AD^{2}}=\dfrac{4}{3}$，$\dfrac{AC}{AD}=\dfrac{2\sqrt{3}}{3}$。
