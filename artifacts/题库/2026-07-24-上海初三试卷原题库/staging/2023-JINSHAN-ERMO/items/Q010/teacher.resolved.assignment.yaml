  - type: short_answer
    id: Q010
    points: 4
    stem_latex: 分式方程 $\dfrac{x^{2}}{x-1}+\dfrac{1}{1-x}=0$ 的解是 ______
    answer: $x=-1$
    clue: 去分母转化为整式方程，注意检验。
    solution_steps:
    - 去分母 $x^{2}-1=0$，$x=\pm1$；检验 $x=1$ 为增根，$\therefore x=-1$。
