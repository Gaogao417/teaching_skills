  - type: problem
    id: Q022
    points: 10
    stem_latex: 某地区2022年11月30天日均 $AQI$ 频率分布直方图（如图，分5组，后三组天数均为3，频率均为0.1）。（1）求轻度污染天数及 $a,b,c,d$（优、良天数与频率）；（2）绿化面积20万亩，到2024年底比2022年增加50%，求年增长率（精确到0.01）．
    answer: (1) 轻度污染3天，$a=12$，$b=9$，$c=0.4$，$d=0.3$；(2) $0.22$
    clue: (1) 由频率和为1求各组频率再求天数；(2) 平均增长率模型 $20(1+x)^{2}=20\times1.5$。
    solution_steps:
    - (1) 样本容量 $\dfrac{3}{0.1}=30$；良频率 $0.3$，$b=9$；优频率 $1-0.3-0.3=0.4$，$a=12$，$c=0.4$，$d=0.3$。
    - (2) $20(1+x)^{2}=30$，$1+x=\dfrac{\sqrt{6}}{2}$，$x\approx0.22$。
