  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases} x+2y=5 \\ x^{2}-2xy+y^{2}=4 \end{cases}$
    answer: $\begin{cases} x=3 \\ y=1 \end{cases}$ 或 $\begin{cases} x=\dfrac{1}{3} \\ y=\dfrac{7}{3} \end{cases}$
    clue: ②化为 $(x-y)^{2}=4$ 拆为两个一次方程组。
    solution_steps:
    - $(x-y)^{2}=4\Rightarrow x-y=\pm2$。
    - 与 $x+2y=5$ 联立，解得 $\begin{cases} x=3 \\ y=1 \end{cases}$ 或 $\begin{cases} x=\dfrac{1}{3} \\ y=\dfrac{7}{3} \end{cases}$。
