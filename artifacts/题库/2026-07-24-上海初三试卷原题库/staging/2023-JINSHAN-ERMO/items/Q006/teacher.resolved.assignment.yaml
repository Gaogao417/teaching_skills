    id: Q006
    points: 4
    stem_latex: 如图，球放在长方体纸盒内，截面如图，已知 $EF=CD=8$，那么球的半径长是（\quad）
    choices:
    - $4$
    - $5$
    - $6$
    - $8$
    answer: B
    clue: 垂径定理 + 勾股定理列半径方程。
    solution_steps:
    - 作 $OM\perp EF$ 于 $M$，$EM=4$，$OM=8-OE$。
    - $OE^{2}=4^{2}+(8-OE)^{2}$，$OE=5$。
