  - type: choice
    id: Q004
    points: 4
    stem_latex: 已知函数 $y=kx$（$k\neq0$）的函数值 $y$ 随 $x$ 增大而减小，那么这个函数图像可能经过的点是（\quad）
    choices:
    - $(0.5,1)$
    - $(2,1)$
    - $(-2,4)$
    - $(-2,-2)$
    answer: C
    clue: $y$ 随 $x$ 增大而减小则 $k<0$，$x,y$ 异号。
    solution_steps:
    - $k<0$，$x,y$ 异号，只有 $(-2,4)$ 满足。
