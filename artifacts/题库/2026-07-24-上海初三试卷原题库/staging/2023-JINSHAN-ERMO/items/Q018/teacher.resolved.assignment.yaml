  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 如图，$\triangle ABC$ 中 $\angle BAC=90\degree$，$AB=3$，$\tan C=\dfrac{3}{4}$，$D$ 是 $BC$ 上动点，$E$ 在 $AC$ 上，如果 $E$ 关于直线 $AD$ 的对称点 $F$ 恰好落在 $BC$ 上，那么 $CE$ 的最大值为 ______
    answer: $\dfrac{8}{5}$
    clue: 由对称 $AF=AE$，$F$ 在 $BC$ 上，$AF$ 最小时 $CE$ 最大（$F$ 与垂足重合）。
    solution_steps:
    - $AC=4$，$BC=5$，$A$ 到 $BC$ 距离 $AG=\dfrac{12}{5}$。
    - $F$ 与 $G$ 重合时 $AF=AG$ 最小，$AE=AG=\dfrac{12}{5}$，$CE_{\max}=4-\dfrac{12}{5}=\dfrac{8}{5}$。
