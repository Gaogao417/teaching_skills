    stem_latex: 抛物线 $y=-\dfrac{1}{2}x^{2}+1$ 在 $y$ 轴的右侧呈 ______ 趋势（填"上升"或"下降"）
    answer: 下降
    clue: 开口向下、对称轴为 $y$ 轴，右侧递减。
    solution_steps:
    - 开口向下，$y$ 轴右侧 $y$ 随 $x$ 增大而减小，呈下降趋势。
