    stem_latex: 如图，小明和小亮分别从书店东西两侧同时出发到书店，离书店距离 $y_{1},y_{2}$（米）与时间 $x$（分）的关系如图，当两人离书店距离相同时，所用时间是 ______ 分钟
    answer: '5'
    clue: 分别求两一次函数解析式，求交点横坐标。
    solution_steps:
    - $y_{1}=-200x+1300$，$y_{2}=-60x+600$。
    - 联立解得 $x=5$。
