  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，$AB=AC=6$，$BC=4$，$E,F$ 分别是 $AB,AC$ 的中点，$CD\parallel AB$ 交 $EF$ 延长线于 $D$，联结 $AD$。（1）求 $\angle B$ 的正弦值；（2）求 $AD$ 的长．
    answer: (1) $\sin B=\dfrac{2\sqrt{2}}{3}$；(2) $AD=\sqrt{17}$
    clue: (1) 等腰三线合一 + 勾股求高；(2) 证四边形 $ADCE$ 为平行四边形，$AD=EC$。
    solution_steps:
    - (1) $BM=2$，$AM=\sqrt{6^{2}-2^{2}}=4\sqrt{2}$，$\sin B=\dfrac{AM}{AB}=\dfrac{2\sqrt{2}}{3}$。
    - (2) $F$ 为 $AC$ 中点，$CD\parallel AB\Rightarrow EF=FD$，四边形 $ADCE$ 为平行四边形，$AD=EC$。
    - 作 $CN\perp AB$，$CN=\dfrac{8\sqrt{2}}{3}$，$EN=\dfrac{5}{3}$，$EC=\sqrt{17}$，$\therefore AD=\sqrt{17}$。
