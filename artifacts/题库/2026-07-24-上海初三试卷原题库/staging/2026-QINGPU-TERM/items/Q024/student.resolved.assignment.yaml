    stem_latex: 如图10，在平面直角坐标系 $xOy$ 中，抛物线 $M_1:y=-x^2+bx+3$ 与 $x$ 轴交于点 $A(-1,0)、B$，与 $y$ 轴交于点 $C$，顶点为点 $D$。（1）求 $b$ 的值和点 $D$ 的坐标；（2）已知以点 $G$ 为顶点的抛物线 $M_2:y=-(x-m)^2+5-m$ 与抛物线 $M_1$ 相交。①设交点为 $E$，在抛物线 $M_2$ 上，如果点 $E$ 与点 $G$ 之间的部分是上升的，求 $m$ 的取值范围；②联结 $AD、AG$，过点 $G$ 作 $AD$ 的平行线交抛物线 $M_2$ 于点 $N$，如果 $AG$ 平分 $\angle NAD$，求 $m$ 的值。
