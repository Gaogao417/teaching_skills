  - type: problem
    id: Q020
    points: 10
    stem_latex: 已知抛物线 $y=(x-1)(x+3)$。（1）写出这条抛物线的开口方向、对称轴，以及它的变化情况；（2）将这条抛物线平移，使其顶点 $P$ 移到点 $Q(-3,1)$ 的位置，求抛物线平移的距离。
    answer: （1）开口向上，对称轴为直线 $x=-1$；在 $x=-1$ 左侧下降，右侧上升；（2）平移距离为 $\sqrt{29}$。
    solution_steps:
    - title: 第（1）问
      content: $y=(x-1)(x+3)=(x+1)^2-4$，所以抛物线开口向上，对称轴为直线 $x=-1$；在对称轴左侧下降，右侧上升。
    - title: 第（2）问
      content: 顶点为 $P(-1,-4)$，抛物线平移距离等于 $PQ=\sqrt{(-1+3)^2+(-4-1)^2}=\sqrt{29}$。
