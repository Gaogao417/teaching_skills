    stem_latex: 学校在操场上举行升旗仪式，每个学生均站立在旗杆前方的水平地面上面向国旗行注目礼。已知国旗的初始位置距地面高度均大于或等于每个学生的身高。如果将看向国旗的视线与水平视线所形成的夹角定义为注视角，那么国旗从初始位置开始匀速上升至顶端的过程中，以下说法正确的是（　）。
    choices:
    - 每个学生的注视角大小不变
    - 每个学生的注视角逐渐减小
    - 每个学生的注视角逐渐增大
    - 同一时刻相同身高学生的注视角相等
    answer: C
    explanation: 官方参考答案：C。
