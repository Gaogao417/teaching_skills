    block:
      stem_latex: '计算：$2(1-\cot30^\circ)+\dfrac{4\sin60^\circ}{3\tan30^\circ-\tan45^\circ}$。'
      answer: '$5-\sqrt3$'
      solution_steps:
      - title: 计算
        content: '原式 $=2(1-\sqrt3)+\dfrac{4\times\dfrac{\sqrt3}{2}}{3\times\dfrac{\sqrt3}{3}-1}=5-\sqrt3$。'
  - item_id: Q020
