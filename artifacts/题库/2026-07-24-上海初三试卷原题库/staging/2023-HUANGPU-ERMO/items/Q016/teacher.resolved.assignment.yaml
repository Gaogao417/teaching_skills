  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 在直角坐标平面内，已知 $A(1,-3)$、$B(4,-1)$，将线段 $AB$ 平移得 $A_{1}B_{1}$（$A\to A_{1}$、$B\to B_{1}$），如果 $A_{1}(-2,0)$，那么 $B_{1}$ 的坐标是 ______
    answer: $(1,2)$
    clue: 由 $A\to A_{1}$ 确定平移规律，同规律得 $B_{1}$。
    solution_steps:
    - $A(1,-3)\to A_{1}(-2,0)$：左移3、上移3。
    - $B(4,-1)\to B_{1}(4-3,-1+3)=(1,2)$。
