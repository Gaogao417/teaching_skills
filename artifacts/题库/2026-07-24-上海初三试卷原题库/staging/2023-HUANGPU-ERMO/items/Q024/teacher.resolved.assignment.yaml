  - type: problem
    id: Q024
    points: 12
    stem_latex: 如图，直线 $y=-x-4$ 与 $x$ 轴、$y$ 轴分别交于 $A$、$B$，抛物线 $y=x^{2}+bx+c$ 经过 $A$、$B$。（1）求抛物线表达式；（2）抛物线与 $x$ 轴另一交点为 $C$，点 $P$ 是 $\triangle ABC$ 外接圆圆心，求 $P$ 坐标；（3）点 $D(0,4)$，$M,N$ 在抛物线上且四边形 $MBND$ 是平行四边形，求 $MN$ 的长．
    answer: (1) $y=x^{2}+3x-4$；(2) $P\left(-\dfrac{3}{2},-\dfrac{3}{2}\right)$；(3) $MN=4\sqrt{10}$
    clue: (1) 待定系数；(2) 外心在 $AC$ 垂直平分线（对称轴）上，由 $PA=PB$ 求 $P$；(3) 平行四边形对角线互相平分，$M,N$ 关于原点对称。
    solution_steps:
    - (1) $A(-4,0)$、$B(0,-4)$；代入得 $b=3$，$c=-4$，$y=x^{2}+3x-4$。
    - (2) 对称轴 $x=-\dfrac{3}{2}$；设 $P\left(-\dfrac{3}{2},a\right)$，由 $PA=PB$ 得 $a=-\dfrac{3}{2}$，$P\left(-\dfrac{3}{2},-\dfrac{3}{2}\right)$。
    - (3) $O$ 为 $BD$ 中点即平行四边形对角线交点，$M,N$ 关于原点对称；设 $M(m,m^{2}+3m-4)$，$N(-m,-m^{2}-3m+4)$，代入抛物线得 $m=2$。
    - $M(2,6)$、$N(-2,-6)$，$MN=\sqrt{4^{2}+12^{2}}=4\sqrt{10}$。
