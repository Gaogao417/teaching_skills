  - type: choice
    id: Q001
    points: 4
    stem_latex: 下列各数中，最小的数是（\quad）
    choices:
    - $0$
    - $-2$
    - $1$
    - $-\sqrt{3}$
    answer: B
    clue: 正数大于一切负数；两个负数绝对值大的反而小。
    solution_steps:
    - $-2$ 与 $-\sqrt{3}$ 比较，$|-2|>|\sqrt{3}|$，$\therefore -2<-\sqrt{3}$，最小的是 $-2$。
