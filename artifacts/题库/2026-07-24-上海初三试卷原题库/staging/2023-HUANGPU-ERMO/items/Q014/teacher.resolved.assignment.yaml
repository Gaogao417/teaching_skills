  blocks:
  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 某校随机抽取40名七年级学生调查某天书面作业完成时间并绘制频数分布直方图（如图）。估计该校200名七年级学生中这一天作业完成时间少于90分钟的约有多少人 ______
    answer: '170'
    clue: 用样本中少于90分钟的频率估计总体。
    solution_steps:
    - 样本中少于90分钟的有 $4+10+20=34$ 人。
    - $200\times\dfrac{34}{40}=170$（人）。
