    stem_latex: 计算：$\sqrt[3]{-\dfrac{1}{8}}=$ ______
    answer: $-\dfrac{1}{2}$
    clue: 立方根的定义。
    solution_steps:
    - $\left(-\dfrac{1}{2}\right)^{3}=-\dfrac{1}{8}$，$\therefore \sqrt[3]{-\dfrac{1}{8}}=-\dfrac{1}{2}$。
