    stem_latex: 函数 $y=-x^{3}$ 的图像经过（\quad）
    choices:
    - 第一、二象限
    - 第三、四象限
    - 第一、三象限
    - 第二、四象限
    answer: D
    clue: $x<0$ 时 $y>0$（二象限），$x>0$ 时 $y<0$（四象限）。
