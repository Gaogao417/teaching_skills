  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 已知一次函数的图像经过点 $(1,3)$，且与直线 $y=2x+6$ 平行，那么这个一次函数的解析式是 ______
    answer: $y=2x+1$
    clue: 平行则 $k$ 相同，再代入点求 $b$。
    solution_steps:
    - $k=2$，代入 $(1,3)$ 得 $2+b=3$，$b=1$，$y=2x+1$。
