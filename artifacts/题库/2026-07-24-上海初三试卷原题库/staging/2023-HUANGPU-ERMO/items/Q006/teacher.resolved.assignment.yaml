  blocks:
  - type: choice
    id: Q006
    points: 4
    stem_latex: 要检验一个四边形桌面是矩形，可行的测量方案是（\quad）
    choices:
    - 任选两个角，测量它们的角度
    - 测量四条边的长度
    - 测量两条对角线的长度
    - 测量两条对角线的交点到四个顶点的距离
    answer: D
    clue: 对角线互相平分且相等的四边形是矩形。
    solution_steps:
    - 交点到四顶点距离相等 $\Rightarrow$ 对角线互相平分（平行四边形）且相等，故为矩形。
