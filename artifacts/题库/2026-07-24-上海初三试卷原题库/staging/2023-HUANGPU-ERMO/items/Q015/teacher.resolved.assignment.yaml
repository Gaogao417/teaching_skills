  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 已知点 $G$ 是 $\triangle ABC$ 的重心，设 $\vec{CA}=\vec{a}$，$\vec{CB}=\vec{b}$，那么 $\vec{CG}$ 用 $\vec{a}$、$\vec{b}$ 可表示为 ______
    answer: $\dfrac{1}{3}\vec{a}+\dfrac{1}{3}\vec{b}$
    clue: 重心把中线分为 $2:1$，先求中线向量 $\vec{CD}$。
    solution_steps:
    - $D$ 为 $AB$ 中点，$\vec{CD}=\dfrac{1}{2}(\vec{CA}+\vec{CB})=\dfrac{1}{2}\vec{a}+\dfrac{1}{2}\vec{b}$。
    - $\vec{CG}=\dfrac{2}{3}\vec{CD}=\dfrac{1}{3}\vec{a}+\dfrac{1}{3}\vec{b}$。
