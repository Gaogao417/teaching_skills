  - type: choice
    id: Q003
    points: 4
    stem_latex: 设 $a$ 是一个不为零的实数，下列式子中一定成立的是（\quad）
    choices:
    - $3-a>2-a$
    - $3a>2a$
    - $-3a>-2a$
    - $\dfrac{3}{a}>\dfrac{2}{a}$
    answer: A
    clue: 不等式两边加同一个数方向不变；乘除 $a$ 需看 $a$ 的正负。
    solution_steps:
    - A、两边同减 $a$，$3>2$ 恒成立。
    - B、C、D 随 $a$ 正负而变，不一定成立。
