  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 规定：在四边形 $ABCD$ 中，$O$ 在边 $BC$ 上，如果 $\triangle OAB\cong\triangle OCD$，那么 $O$ 叫做该四边形的"等形点"。在四边形 $EFGH$ 中，$\angle EFG=90\degree$，$EF\parallel GH$，$EF=1$，$FG=3$，如果"等形点"在边 $FG$ 上，那么四边形 $EFGH$ 的周长是 ______
    answer: $8$ 或 $6+\sqrt{10}$
    clue: 分两种全等对应关系讨论，平行四边形情形与一般情形。
    solution_steps:
    - 情形一 $\triangle OEF\cong\triangle OHG$：$EF=HG=1$，$EFGH$ 为平行四边形，周长 $(1+3)\times2=8$。
    - 情形二 $\triangle OEF\cong\triangle HOG$：$OG=1$，$OF=GH=2$，$OE=OH=\sqrt{5}$，$EH=\sqrt{10}$，周长 $1+3+2+\sqrt{10}=6+\sqrt{10}$。
