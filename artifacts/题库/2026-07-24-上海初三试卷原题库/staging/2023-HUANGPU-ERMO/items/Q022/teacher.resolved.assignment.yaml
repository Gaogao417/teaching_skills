  - type: problem
    id: Q022
    points: 10
    stem_latex: 如图，$\odot O$ 的半径为 $2$，半径 $OP$ 被弦 $AB$ 垂直平分，交点为 $Q$，点 $C$ 在圆上，且 $\overset{\frown}{BC}=\overset{\frown}{BP}$。（1）求弦 $AB$ 的长；（2）求图中阴影部分面积（结果保留 $\pi$）
    answer: (1) $AB=2\sqrt{3}$；(2) $S_{\text{阴}}=\dfrac{2}{3}\pi$
    clue: (1) 垂径定理+勾股求半弦长；(2) 由等弧得等边三角形，平行线等积转化求扇形面积。
    solution_steps:
    - (1) $OQ=1$，Rt$\triangle OBQ$ 中 $BQ=\sqrt{2^{2}-1^{2}}=\sqrt{3}$，$AB=2\sqrt{3}$。
    - (2) $\cos\angle POB=\dfrac{1}{2}\Rightarrow \angle POB=60\degree$；$\overset{\frown}{BC}=\overset{\frown}{BP}\Rightarrow \angle BOC=60\degree$，$\triangle OBC$ 等边。
    - $\angle BCO+\angle POC=180\degree\Rightarrow BC\parallel OP$，$S_{\triangle PBC}=S_{\triangle OBC}$，$S_{\text{阴}}=S_{\text{扇形}OBC}=\dfrac{60}{360}\pi\cdot2^{2}=\dfrac{2}{3}\pi$。
    diagram_col:
      image_path: assets/prompt-01.png
      width: 60mm
      variant: prompt
      disclosure_policy: clean
