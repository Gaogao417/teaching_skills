  - type: choice
    id: Q004
    points: 4
    stem_latex: 50个数据的课外书本数与人数（本1人10、本2人10、本3人20、本4人5、本5人5），下列判断正确的是（\quad）
    choices:
    - 众数和平均数相等
    - 中位数和平均数相等
    - 中位数和众数相等
    - 中位数、众数和平均数都相等
    answer: C
    clue: 分别计算众数、中位数、平均数比较。
    solution_steps:
    - 众数为3，中位数为3，平均数 $=\dfrac{10+20+60+20+25}{50}=2.7$。
    - 中位数与众数相等。
