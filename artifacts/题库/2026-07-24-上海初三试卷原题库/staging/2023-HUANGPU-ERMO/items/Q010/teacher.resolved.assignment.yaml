    stem_latex: 已知关于 $x$ 的方程 $x^{2}-3x+k=0$ 无实数根，那么 $k$ 的取值范围是 ______
    answer: $k>\dfrac{9}{4}$
    clue: 无实数根则判别式 $\Delta<0$。
    solution_steps:
    - $\Delta=(-3)^{2}-4k<0$，$k>\dfrac{9}{4}$。
