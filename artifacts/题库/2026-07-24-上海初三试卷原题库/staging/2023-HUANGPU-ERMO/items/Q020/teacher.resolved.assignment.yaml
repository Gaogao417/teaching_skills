  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases} x^{2} - 2y^{2} - y = -1 \\ x - y = 1 \end{cases}$
    answer: $\begin{cases} x_{1}=0 \\ y_{1}=-1 \end{cases}$，$\begin{cases} x_{2}=3 \\ y_{2}=2 \end{cases}$
    clue: 用代入消元将①化为关于 $y$ 的方程。
    solution_steps:
    - 由② $x=y+1$，代入①得 $(y+1)^{2}-2y^{2}-y=-1$，$y_{1}=-1$，$y_{2}=2$。
    - 回代得 $\begin{cases} x_{1}=0 \\ y_{1}=-1 \end{cases}$，$\begin{cases} x_{2}=3 \\ y_{2}=2 \end{cases}$。
