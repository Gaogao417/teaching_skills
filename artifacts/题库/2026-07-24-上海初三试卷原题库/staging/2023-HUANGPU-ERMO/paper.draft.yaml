      start_anchor: 解：原式
      end_anchor: $\dfrac{x-2}{x-3}$
    block:
      stem_latex: 计算：$\left(\dfrac{x+2}{x-3} - \dfrac{8x}{x^{2} - x - 6}\right) \div
        \dfrac{x-2}{x+2}$
      answer: $\dfrac{x-2}{x-3}$
      clue: 分解因式、通分后除法转乘法约分。
      solution_steps:
      - 原式 $=\left[\dfrac{(x+2)^{2}}{(x+2)(x-3)}-\dfrac{8x}{(x+2)(x-3)}\right]\cdot\dfrac{x+2}{x-2}=\dfrac{(x-2)^{2}}{(x+2)(x-3)}\cdot\dfrac{x+2}{x-2}$。
      - $=\dfrac{x-2}{x-3}$。
