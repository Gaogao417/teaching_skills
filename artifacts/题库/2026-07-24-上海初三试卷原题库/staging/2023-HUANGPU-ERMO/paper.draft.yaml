      start_anchor: 证明：$\because$ 四边形 $ABCD$ 是正方形
      end_anchor: $\dfrac{BF}{FG} = \dfrac{AD}{AE}$
    block:
      stem_latex: 已知：如图，在正方形 $ABCD$ 中，点 $E$ 在对角线 $BD$ 的延长线上，作 $AF\perp AE$，且 $AF=AE$，连接
        $BF$。（1）求证：$BF=DE$；（2）延长 $AB$ 交射线 $EF$ 于点 $G$，求证：$\dfrac{BF}{FG}=\dfrac{AD}{AE}$．
      answer: (1)(2) 见解析
      clue: (1) 由 $\angle BAF=\angle EAD$ 及 $AB=AD$、$AF=AE$ 证 $\triangle ABF\cong\triangle
        ADE$；(2) 证 $\triangle ADE\sim\triangle AFG$ 转化比例。
      solution_steps:
      - (1) $\angle BAD=\angle EAF=90\degree\Rightarrow \angle BAF=\angle EAD$；又 $AB=AD$，$AF=AE$，$\triangle
        ABF\cong\triangle ADE$（SAS），$\therefore BF=DE$。
      - (2) $\angle ADE=\angle AFG=135\degree$，$\angle EAD=\angle BAF\Rightarrow \triangle
        ADE\sim\triangle AFG$，$\dfrac{DE}{FG}=\dfrac{AD}{AF}$。
      - 由(1) $DE=BF$、$AF=AE$，$\therefore \dfrac{BF}{FG}=\dfrac{AD}{AE}$。
