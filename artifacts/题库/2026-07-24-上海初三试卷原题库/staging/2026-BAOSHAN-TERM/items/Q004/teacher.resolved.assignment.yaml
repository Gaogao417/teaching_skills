    stem_latex: 下列关于向量的说法中，正确的是（　）。
    choices:
    - 如果 $k\vec a=\vec0$，那么 $k=0$
    - 如果 $\vec a=-3\vec b$（$\vec b$ 为非零向量），那么 $\vec a\parallel\vec b$
    - 如果 $\vec e$ 是单位向量，那么 $\vec e=1$
    - 如果 $\vec a$ 与 $\vec b$ 互为相反向量，那么 $\vec a+\vec b=0$
    answer: B
