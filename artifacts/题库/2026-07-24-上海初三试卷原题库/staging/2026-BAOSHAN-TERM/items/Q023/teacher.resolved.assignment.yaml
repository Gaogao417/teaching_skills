    stem_latex: 如图，在菱形 $ABCD$ 中，$E$ 是 $CD$ 上一点，联结 $BE$ 并延长，交 $AD$ 的延长线于点 $G$，交 $AC$
      于点 $F$。（1）求证：$BE\cdot BF=BG\cdot EF$；（2）若 $E$ 是 $CD$ 的中点，且 $AF\cdot CF=2BF^2$，求证：$BE\perp
      CD$。
    answer: （1）由相似三角形得比例后交叉相乘；（2）$BE\perp CD$。
    solution_steps:
    - title: 解答
      content: $\because$ 依据题设逐步计算或证明，$\therefore$ 结论为：（1）由相似三角形得比例后交叉相乘；（2）$BE\perp
        CD$。
