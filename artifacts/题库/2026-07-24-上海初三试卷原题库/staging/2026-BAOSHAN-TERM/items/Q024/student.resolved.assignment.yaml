    stem_latex: 在平面直角坐标系 $xOy$ 中，将抛物线 $C_1$ 绕其顶点旋转 $180^\circ$ 后再适当平移得到抛物线 $C_2$。如果 $C_2$ 经过 $C_1$ 的顶点，则称 $C_2$ 是 $C_1$ 的“子抛物线”。已知抛物线 $C_1:y=\dfrac13x^2+bx+c$ 与 $x$ 轴交于点 $A(2,0),B(-4,0)$，顶点为 $D$。（1）求 $C_1$ 的表达式和点 $D$ 的坐标；（2）如果 $C_2$ 是 $C_1$ 的“子抛物线”，且 $C_2$ 经过原点，顶点为 $E$：①证明 $C_1$ 也是 $C_2$ 的“子抛物线”；②设直线 $x=k$ 与 $C_1,C_2$ 分别交于点 $M,N$，探究四边形 $DMEN$ 为平行四边形时 $k$ 的值。
