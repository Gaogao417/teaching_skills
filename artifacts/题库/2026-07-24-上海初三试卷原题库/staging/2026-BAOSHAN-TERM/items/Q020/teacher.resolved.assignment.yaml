  - type: problem
    id: Q020
    points: 10
    stem_latex: 将抛物线 $y=-x^2$ 平移，使平移后的抛物线经过点 $A(0,-10)$、$B(8,-10)$。（1）求平移后的抛物线的表达式；（2）说明由抛物线
      $y=-x^2$ 如何平移得到新抛物线。
    answer: （1）$y=-(x-4)^2+6$；（2）向右平移 $4$ 个单位，再向上平移 $6$ 个单位。
    solution_steps:
    - title: 解答
      content: $\because$ 依据题设逐步计算或证明，$\therefore$ 结论为：（1）$y=-(x-4)^2+6$；（2）向右平移 $4$
        个单位，再向上平移 $6$ 个单位。
