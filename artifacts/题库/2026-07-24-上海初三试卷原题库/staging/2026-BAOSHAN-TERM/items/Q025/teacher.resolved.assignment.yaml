    stem_latex: 如图，已知 $\triangle ABC$ 中，$\angle ACB=90^\circ$，$AC=3$，$BC=4$，点 $D$
      在线段 $AB$ 上（不与端点重合），$BE\perp AB$，且 $\angle CDE=\angle A$。（1）当 $DE\parallel AC$
      时，求 $BE$；（2）点 $D$ 运动时，探究 $\dfrac{CD}{DE}$ 是否不变；（3）直线 $DE$ 与直线 $AC$ 交于 $F$，若
      $\triangle CDF$ 是等腰三角形，求 $EF$。
    answer: （1）$BE=\dfrac{10}{3}$；（2）$\dfrac{CD}{DE}=\dfrac35$；（3）$EF=\dfrac{32\sqrt5}{11}$。
    solution_steps:
    - title: 解答
      content: $\because$ 依据题设逐步计算或证明，$\therefore$ 结论为：（1）$BE=\dfrac{10}{3}$；（2）$\dfrac{CD}{DE}=\dfrac35$；（3）$EF=\dfrac{32\sqrt5}{11}$。
