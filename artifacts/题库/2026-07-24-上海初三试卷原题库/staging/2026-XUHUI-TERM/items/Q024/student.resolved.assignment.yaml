    stem_latex: 如图，抛物线 $y=\frac12x^2+bx+c$ 与 $x$ 轴交于 $A、B$ 两点，与 $y$ 轴交于点 $C$，且经过点 $D$。已知 $A(-2,0)、D(4,-6)$。（1）求抛物线的表达式及顶点 $M$ 的坐标；（2）将抛物线向上平移，设点 $D$ 的对应点为 $E$，射线 $BE$ 交线段 $AD$ 于点 $F$。①如果 $AD$ 恰好平分 $\angle CAE$，求平移后的抛物线表达式；②如果 $\triangle DEF\sim\triangle ABD$，求平移距离。
