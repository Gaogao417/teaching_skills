  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在梯形 $ABCD$ 中，$AB\parallel CD$，$\angle ADC=90^\circ$，对角线 $AC$ 与 $BD$ 相交于点 $O$。已知 $AB=2$，$AD=8$，$BC=10$。（1）求
      $\triangle AOB$ 与 $\triangle COD$ 的面积之比；（2）求 $\angle DBC$ 的正弦值。
    answer: （1）$1:16$；（2）$\frac{16\sqrt{17}}{85}$。
    solution_steps:
    - title: 解答
      content: 过点 $B$ 作 $BE\perp DE$，则 $BE=AD=8,DE=AB=2$，$EC=\sqrt{BC^2-BE^2}=6$，故 $DC=8$。由 $AB\parallel CD$，$\triangle AOB\sim\triangle
        COD$，面积比为 $(\frac{AB}{DC})^2=\frac1{16}$。又 $BD=2\sqrt{17}$，由面积法得 $CF=\frac{64}{2\sqrt{17}}$，故 $\sin\angle DBC=\frac{CF}{BC}=\frac{16\sqrt{17}}{85}$。
