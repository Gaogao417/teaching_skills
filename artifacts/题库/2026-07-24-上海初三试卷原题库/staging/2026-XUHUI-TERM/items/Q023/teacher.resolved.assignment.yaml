  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，在四边形 $ABCD$ 中，$\angle BAD=90^\circ$，$CD\perp BD$，$BD^2=AD\cdot BC$，点 $H$ 在边 $BD$ 上，且 $\angle DBC=\angle
      C+\angle BAH$。（1）求证：$AH=AD$；（2）过点 $B$ 作射线 $BE$ 交边 $CD$ 于点 $F$，交 $AD$ 的延长线于点 $E$，若 $\angle DBE=\angle ABD$，求证：$BD\cdot
      DE=EF\cdot CD$。
    answer: 见证明。
    solution_steps:
    - title: 解答
      content: （1）由 $BD^2=AD\cdot BC$ 及两直角可得 $\mathrm{Rt}\triangle ABD\sim\mathrm{Rt}\triangle DCB$，故 $\angle ADB=\angle DBC$，$\angle
        ABD=\angle C$。结合题设可得 $\angle AHD=\angle ADB$，所以 $AH=AD$。（2）由角关系得 $\triangle DEF\sim\triangle BED$，又 $\triangle DBF\sim\triangle
        DCB$，故 $\frac{EF}{DE}=\frac{BD}{CD}$，即 $BD\cdot DE=EF\cdot CD$。
      diagram_col:
        image_path: assets/solution-figure.png
        width: 62mm
        variant: solution
        disclosure_policy: teacher_only
