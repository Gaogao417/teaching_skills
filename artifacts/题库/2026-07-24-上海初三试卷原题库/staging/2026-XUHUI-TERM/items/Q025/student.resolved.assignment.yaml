    stem_latex: 如图，在 $\triangle ABC$ 中，$AC=4\sqrt2$，$BC=6$，$\angle C=45^\circ$，点 $E$ 在边 $AB$ 上且 $AE=2BE$，点 $D$ 是边 $BC$ 上的动点，以 $D$ 为直角顶点、$DE$ 为腰在其右侧作等腰直角三角形 $DEF$，射线 $EF$ 与边 $AC$ 交于点 $P$。（1）当 $EF\parallel BC$ 时，求 $\triangle DEF$ 的面积；（2）当点 $F$ 落在 $\triangle ABC$ 内部（不含边界）时，求 $BD$ 的取值范围；（3）联结 $CF$，如果 $\triangle DFC$ 是直角三角形，直接写出 $DP$ 的长。
