  - type: problem
    id: Q019
    points: 10
    stem_latex: 如图，$\triangle ABC$ 中，$D、E、F$ 分别是边 $BC、AC、AB$ 上的点，已知 $BD=2CD$，且四边形 $AEDF$ 是平行四边形。设 $\overrightarrow{BA}=\vec
      a$，$\overrightarrow{BC}=\vec b$。（1）用 $\vec a、\vec b$ 分别表示 $\overrightarrow{BD}、\overrightarrow{AC}、\overrightarrow{EF}$；（2）联结
      $BE$ 交 $DF$ 于点 $G$，在图中求作 $\overrightarrow{BG}$ 分别在 $\vec a、\vec b$ 方向上的分向量。
    answer: （1）$\overrightarrow{BD}=\frac23\vec b$，$\overrightarrow{AC}=-\vec a+\vec b$，$\overrightarrow{EF}=\vec a-\frac23\vec
      b$；（2）见作图。
    solution_steps:
    - title: 解答
      content: （1）由 $BD=2CD$ 得 $\overrightarrow{BD}=\frac23\vec b$；$\overrightarrow{AC}=-\vec a+\vec b$；平行四边形给出 $\overrightarrow{EF}=\vec
        a-\frac23\vec b$。（2）按平行四边形法则在图中作出两个分向量。
