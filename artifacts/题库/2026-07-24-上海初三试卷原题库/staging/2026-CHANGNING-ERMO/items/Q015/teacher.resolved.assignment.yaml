    id: Q015
    points: 4
    stem_latex: 在正方形$ABCD$中，$AC$是其对角线，那么$\left|\overrightarrow{CD}\right|:\left|\overrightarrow{AB}+\overrightarrow{AC}\right|$的值为______ .
    answer: $\dfrac{\sqrt{5}}{5}$
    explanation: 官方参考答案：$\dfrac{\sqrt{5}}{5}$。
    solution_steps:
    - 设正方形$ABCD$的边长为1，建立平面直角坐标系，令$A(0,0)$，$B(1,0)$，$C(1,1)$，$D(0,1)$，
    - 可得$\overrightarrow{CD}=(0-1,1-1)=(-1,0)$，$\left|\overrightarrow{CD}\right|=\sqrt{(-1)^2+0^2}=1$，
    - $\overrightarrow{AB}=(1,0)$，$\overrightarrow{AC}=(1,1)$，
    - $\overrightarrow{AB}+\overrightarrow{AC}=(1+1,0+1)=(2,1)$，
    - $\left|\overrightarrow{AB}+\overrightarrow{AC}\right|=\sqrt{2^2+1^2}=\sqrt{5}$，
    - $\therefore \left|\overrightarrow{CD}\right|:\left|\overrightarrow{AB}+\overrightarrow{AC}\right|=\dfrac{1}{\sqrt{5}}=\dfrac{\sqrt{5}}{5}$。
