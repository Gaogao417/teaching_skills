  - type: problem
    id: Q020
    points: 10
    stem_latex: 解不等式组：$\begin{cases}3x-1\geqslant x-5\\\dfrac{x+5}{3}>\dfrac{x}{2}+1\end{cases}$。
    answer: $-2\leqslant x<4$
    explanation: 官方参考答案：$-2\leqslant x<4$。
    solution_steps:
    - 解不等式①：$3x-1\geqslant x-5$，$3x-x\geqslant -5+1$，$2x\geqslant -4$，解得$x\geqslant -2$，
    - 解不等式②：$\dfrac{x+5}{3}>\dfrac{x}{2}+1$，$2(x+5)>3x+6$，$2x+10>3x+6$，解得$x<4$，
    - $\therefore$ 原不等式组的解集为$-2\leqslant x<4$。
