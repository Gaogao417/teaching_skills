    stem_latex: 已知线段$AB$是$\odot O$的一条弦，点$C$是$\odot O$上的一点。 （1）连接$AC$、$BC$，如图1，如果$AC=BC$，$\angle C=45^{\circ}$，且$AB=4\sqrt{2}$，求$\odot O$的半径长； （2）当圆心$O$在线段$AB$上时。 ①如图2，已知点$D$在$\odot O$上，满足$DA=DC$，且$S_{\triangle ADC}=S_{\triangle ACB}$，如果$BC=2$，求$AC$的长； ②如图3，已知点$E$在线段$AB$上，满足$AE:BE=2:3$，如果沿着弦$BC$翻折$\odot O$后的弧线恰好经过点$E$，求$\tan\angle ABC$的值。
    explanation: 官方参考答案：（1）4；（2）①$4\sqrt{2}$；②$\dfrac{1}{2}$。
