  blocks:
  - type: choice
    id: Q001
    points: 4
    stem_latex: 下列实数中，比3小的无理数是（\quad）
    choices:
    - $\sqrt{4}$
    - $\sqrt{8}$
    - $\pi$
    - $\sqrt{(-3)^2}$
    answer: B
    explanation: 官方参考答案：B。
    solution_steps:
    - A：$\sqrt{4}=2$是有理数，不符合题意；
    - B：$\sqrt{8}<\sqrt{9}=3$，且$\sqrt{8}$是无理数，符合题意；
    - C：$\pi>3$，不符合题意；
    - D：$\sqrt{(-3)^2}=3$，不符合题意。
