  - type: fillin
    id: Q013
    points: 4
    stem_latex: 如果关于$x$的方程$x^2-4cx+2c-2=0$有一根是$x=0$，那么该方程的另一根是______ .
    answer: 4
    explanation: 官方参考答案：4。
    solution_steps:
    - 将0代入方程$x^2-4cx+2c-2=0$中，得$2c-2=0$，解得$c=1$，
    - 设方程的另一根为$x_2$，其中一根为$x_1=0$，
    - $\therefore x_1+x_2=4c$，即$0+x_2=4\times1$，解得$x_2=4$。
