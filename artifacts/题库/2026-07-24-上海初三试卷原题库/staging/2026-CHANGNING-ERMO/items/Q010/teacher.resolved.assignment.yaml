    stem_latex: 数据90、91、92、93、94的标准差是______ .
    answer: $\sqrt{2}$
    explanation: 官方参考答案：$\sqrt{2}$。
    solution_steps:
    - 首先计算这组数据的平均数，得$\bar{x}=\frac{1}{5}(90+91+92+93+94)=92$，
    - 再根据方差的计算公式计算方差，得
    - $s^2=\frac{1}{5}\times[(90-92)^2+(91-92)^2+(92-92)^2+(93-92)^2+(94-92)^2]$
    - $=\frac{1}{5}\times10=2$，
    - 标准差是方差的算术平方根，因此该组数据的标准差为$\sqrt{2}$。
