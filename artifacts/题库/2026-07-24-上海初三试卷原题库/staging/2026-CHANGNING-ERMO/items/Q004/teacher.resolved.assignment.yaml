  title: 一、选择题（本大题共6题，每题4分，满分24分）
  type: practice
  visibility: both
  blocks:
  - type: choice
    id: Q004
    points: 4
    stem_latex: 在2026年春季社会实践活动中，某校九（1）班共分成5个活动小组，小组人数分别为6，6，7，5，6，那么对上述小组人数数据，下列说法中错误的是（\quad）
    choices:
    - 平均数是6
    - 中位数是6
    - 众数是6
    - 方差是6
    answer: D
    explanation: 官方参考答案：D。
    solution_steps:
    - A、平均数是$(6+6+7+5+6)\div5=6$，故本选项说法正确，不符合题意；
    - B、把这些数从小到大排列为：5，6，6，6，7，中位数是6，故本选项说法正确，不符合题意；
    - C、6出现了3次，出现的次数最多，众数是6，故本选项说法正确，不符合题意；
    - D、方差为：$\frac{1}{5}\times[(5-6)^2+3\times(6-6)^2+(7-6)^2]=\frac{2}{5}$，本选项说法错误，符合题意。
