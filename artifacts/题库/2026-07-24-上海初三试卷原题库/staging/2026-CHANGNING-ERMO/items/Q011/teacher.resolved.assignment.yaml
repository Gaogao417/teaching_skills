  - type: fillin
    id: Q011
    points: 4
    stem_latex: 方程组$\begin{cases}x+2y=3\\x^2-4y^2+9=0\end{cases}$的解是______ .
    answer: $\begin{cases}x=0\\y=\dfrac{3}{2}\end{cases}$
    explanation: 官方参考答案：$\begin{cases}x=0\\y=\dfrac{3}{2}\end{cases}$。
    solution_steps:
    - 将$x^2-4y^2+9=0$化为$(x+2y)(x-2y)+9=0$，
    - 进而根据$x+2y=3$得到$x-2y=-3$，
    - 联立$\begin{cases}x+2y=3\\x-2y=-3\end{cases}$，求解即可。
    - 解得：$\begin{cases}x=0\\y=\dfrac{3}{2}\end{cases}$。
