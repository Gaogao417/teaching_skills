  - type: fillin
    id: Q012
    points: 4
    stem_latex: 已知线段$a=\sqrt{3}$，$b=2$，从1，$\sqrt{5}$，$\sqrt{7}$，$\sqrt{13}$，5这五个数中任意选取一个数作为线段$c$的长度，那么$a$，$b$，$c$是某直角三角形三边的长度的概率是______ .
    answer: $\dfrac{2}{5}$
    explanation: 官方参考答案：$\dfrac{2}{5}$。
    solution_steps:
    - 线段$a$，$b$，$c$组成直角三角形时，
    - 当$c$为斜边时，$c=\sqrt{a^2+b^2}=\sqrt{7}$
    - 当$b$为斜边时，$c=\sqrt{2^2-(\sqrt{3})^2}=1$
    - $\therefore$ 1，$\sqrt{5}$，$\sqrt{7}$，$\sqrt{13}$，5这五个数中任意选取一个数作为线段$c$的长度，$a$，$b$，$c$是某直角三角形三边的长度的概率是$\dfrac{2}{5}$。
