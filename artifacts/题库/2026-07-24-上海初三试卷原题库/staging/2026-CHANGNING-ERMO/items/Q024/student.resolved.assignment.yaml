    stem_latex: 已知抛物线$C_1:y=\dfrac{1}{4}x^2-x-3$与$x$轴交于点$A$，$B$（点$A$在点$B$左侧），与$y$轴交于点$C$。（1）求$\triangle ABC$的面积；（2）如图，点$D$是抛物线第四象限上的一点，直线$AD$分别交$OC$、$BC$于点$E$、$F$，如果$\text{Cot}\angle DEC=\dfrac{3}{4}$，求直线$AD$的表达式；（3）在第（2）小题的基础上，将抛物线$C_1:y=\dfrac{1}{4}x^2-x-3$向左平移得到抛物线$C_2$，直线$AD$与抛物线$C_2$交于$M$、$N$两点（点$M$在点$N$的上方）。如果点$A$恰好是线段$MN$的中点，求抛物线$C_2$的表达式。
    explanation: 官方参考答案：（1）12；（2）$y=-\dfrac{3}{4}x-\dfrac{3}{2}$；（3）$y=\dfrac{1}{4}x^2+\dfrac{1}{4}x-\dfrac{63}{16}$。
