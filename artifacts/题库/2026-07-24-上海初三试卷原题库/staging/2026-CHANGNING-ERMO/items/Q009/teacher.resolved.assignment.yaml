    id: Q009
    points: 4
    stem_latex: 方程$\dfrac{x}{x-3}+1=\dfrac{7}{x-3}$的解是______ .
    answer: $x=5$
    explanation: 官方参考答案：$x=5$。
    solution_steps:
    - $\dfrac{x}{x-3}+1=\dfrac{7}{x-3}$
    - $x+(x-3)=7$
    - $2x-3=7$
    - $2x=10$
    - 解得$x=5$，
    - 检验：当$x=5$时，$x-3=2\neq 0$，
    - $\therefore x=5$是原分式方程的解。
