  - type: problem
    id: Q019
    points: 10
    stem_latex: 计算：$\sqrt{12}+\left(\dfrac{1}{2}\right)^{-2}-|2-\sqrt{3}|-6\cot60^{\circ}$。
    answer: $2+\sqrt{3}$
    explanation: 官方参考答案：$2+\sqrt{3}$。
    solution_steps:
    - $\sqrt{12}+\left(\dfrac{1}{2}\right)^{-2}-|2-\sqrt{3}|-6\cot60^{\circ}$
    - $=2\sqrt{3}+4-(2-\sqrt{3})-6\times\dfrac{1}{\tan60^{\circ}}$
    - $=2\sqrt{3}+4-2+\sqrt{3}-6\times\dfrac{\sqrt{3}}{3}$
    - $=2\sqrt{3}+4-2+\sqrt{3}-2\sqrt{3}$
    - $=2+\sqrt{3}$。
