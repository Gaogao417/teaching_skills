  blocks:
  - type: fillin
    id: Q008
    points: 4
    stem_latex: 请写出使代数式$\dfrac{\sqrt{a}}{a-1}$有意义的$a$的一个值为：______ .
    answer: 2（答案不唯一）
    explanation: 官方参考答案：2（答案不唯一）。
    solution_steps:
    - 由题意得，$a\geqslant 0$且$a-1\neq 0$，
    - 解得$a\geqslant 0$且$a\neq 1$，
    - $\therefore a=2$。
