  - type: fillin
    id: Q014
    points: 4
    stem_latex: 已知点$A(-4,m^2+1)$在反比例函数$y=\dfrac{k}{x}$的图像上，那么在每个象限内，该函数的值$y$随$x$的值增大而______ .（填\u201c增大\u201d或\u201c减小\u201d）
    answer: 增大
    explanation: 官方参考答案：增大。
    solution_steps:
    - 点$A(-4,m^2+1)$在反比例函数$y=\dfrac{k}{x}$的图像上，
    - $\therefore k=xy=-4(m^2+1)$，
    - $\because m^2\geqslant 0$，$\therefore m^2+1>0$，
    - $\therefore k=-4(m^2+1)<0$，
    - 根据反比例函数的性质，当$k<0$时，在每个象限内，$y$随$x$的增大而增大。
