      stem_latex: 先化简，再求值：$\left(1+\frac{2}{x-1}\right)\div \frac{x^{2}+x}{x^{2}-2x+1}$，其中 $x=\sqrt{2}+1$
      answer: $2-\sqrt{2}$
      clue: 分式化简求值
      solution_steps:
      - $\left(1+\frac{2}{x-1}\right)\div\frac{x^{2}+x}{x^{2}-2x+1}=\frac{x-1+2}{x-1}\cdot\frac{(x-1)^{2}}{x(x+1)}=\frac{x+1}{x-1}\cdot\frac{(x-1)^{2}}{x(x+1)}=\frac{x-1}{x}$
      - 当 $x=\sqrt{2}+1$ 时，原式 $=\frac{\sqrt{2}+1-1}{\sqrt{2}+1}=\frac{\sqrt{2}}{\sqrt{2}+1}=\sqrt{2}(\sqrt{2}-1)=2-\sqrt{2}$
