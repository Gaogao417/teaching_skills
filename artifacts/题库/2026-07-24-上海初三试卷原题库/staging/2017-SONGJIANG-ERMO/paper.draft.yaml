      stem_latex: 已知抛物线 $y=-x^{2}+bx+c$ 与 $x$ 轴交于点 $A$ 和点 $B(3,0)$，与 $y$ 轴交于点 $C(0,3)$，$P$ 是线段 $BC$ 上一点，过点 $P$ 作 $PN\parallel y$ 轴交 $x$ 轴于点 $N$，交抛物线于点 $M$。(1) 求该抛物线的表达式；(2) 如果点 $P$ 的横坐标为 2，点 $Q$ 是第一象限抛物线上的一点，且 $\triangle QMC$ 和 $\triangle PMC$ 的面积相等，求点 $Q$ 的坐标；(3) 如果 $PM=\frac{3}{2}PN$，求 $\tan\angle CMN$ 的值。
      answer: (1) $y=-x^{2}+2x+3$；(2) $Q(1+\sqrt{3},1)$；(3) $\tan\angle CMN=2$
      clue: 二次函数综合
      solution_steps:
      - (1) 将 $B(3,0)$、$C(0,3)$ 代入 $y=-x^{2}+bx+c$，得 $\begin{cases}-9+3b+c=0\\c=3\end{cases}$，解得 $b=2,c=3$，抛物线为 $y=-x^{2}+2x+3$
      - (2) 直线 $BC$ 为 $y=-x+3$，$P(2,1)$，$M(2,3)$，$S_{\triangle PCM}=\frac{1}{2}\times 2\times 2=2$
      - 由 $\triangle QMC$ 与 $\triangle PMC$ 面积相等，$Q$ 纵坐标为 $1$，由 $-x^{2}+2x+3=1$ 得 $x=1\pm\sqrt{3}$，第一象限取 $x=1+\sqrt{3}$，$Q(1+\sqrt{3},1)$
      - (3) 设 $M(m,-m^{2}+2m+3)$，$P(m,-m+3)$，由 $PM=\frac{3}{2}PN$ 得 $m+3=\frac{2}{5}(-m^{2}+2m+3)$，解得 $m=\frac{3}{2}$
      - $P\left(\frac{3}{2},\frac{3}{2}\right)$，$M\left(\frac{3}{2},\frac{15}{4}\right)$，过 $C$ 作 $CH\perp MN$，$MH=\frac{15}{4}-3=\frac{3}{4}$，$CH=\frac{3}{2}$，$\tan\angle CMN=\frac{CH}{MH}=2$
