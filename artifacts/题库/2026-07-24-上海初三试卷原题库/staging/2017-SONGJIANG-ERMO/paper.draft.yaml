      - (2) 设圆 $O$ 半径为 $x$ 厘米，在 $\mathrm{Rt}\triangle AOC$ 中，$\sin 37^{\circ}=\frac{CO}{AO}=\frac{57+x}{110+x}=\frac{3}{5}$
      - 解得 $x=22.5\approx 23$ 厘米，水箱半径 $OD$ 的长度约为 23 厘米
