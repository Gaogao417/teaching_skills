      answer: (1) $GF\parallel AB$；(2) 四边形 $AEFG$ 是菱形
      clue: 相似三角形与菱形判定
      solution_steps:
      - (1) $\because CF^{2}=CD\cdot CB$，$\therefore \frac{CD}{CF}=\frac{CF}{CB}$
      - $\because EF\parallel AD$，$\therefore \frac{CG}{CE}=\frac{CD}{CF}$，$\therefore \frac{CF}{CB}=\frac{CG}{CE}$，$\therefore GF\parallel AB$
      - (2) 联结 $AF$，$\because GF\parallel AB$，$\therefore \angle CFG=\angle B$，又 $\angle CAG=\angle CFG$，$\therefore \angle CAG=\angle B$
      - $\because \angle ACD=\angle ACB$，$\therefore \triangle CAD\sim\triangle CBA$，$\therefore CA^{2}=CD\cdot CB$
      - $\because CF^{2}=CD\cdot CB$，$\therefore CA=CF$，$\therefore \angle CAF=\angle CFA$，进而 $\angle GAF=\angle GFA$，$\therefore GA=GF$
      - $\because GF\parallel AB$，$EF\parallel AD$，四边形 $AEFG$ 是平行四边形，又 $GA=GF$，故四边形 $AEFG$ 是菱形
