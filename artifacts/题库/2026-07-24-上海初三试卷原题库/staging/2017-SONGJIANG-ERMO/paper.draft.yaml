    block:
      stem_latex: 如图，已知在 $\mathrm{Rt}\triangle ABC$ 中，$\angle ACB=90^{\circ}$，$\cos B=\frac{3}{5}$，$BC=3$，$P$ 是射线 $AB$ 上的一个动点，以 $P$ 为圆心，$PA$ 为半径的 $\odot P$ 与射线 $AC$ 的另一个交点为 $D$，直线 $PD$ 交直线 $BC$ 于点 $E$。(1) 当 $PA=1$ 时，求 $CE$ 的长；(2) 如果点 $P$ 在边 $AB$ 上，当 $\odot P$ 与以点 $C$ 为圆心，$CE$ 为半径的 $\odot C$ 内切时，求 $\odot P$ 的半径；(3) 设线段 $BE$ 的中点为 $Q$，射线 $PQ$ 与 $\odot P$ 相交于点 $F$，点 $P$ 在运动过程中，当 $PE\parallel CF$ 时，求 $AP$ 的长。
      answer: (1) $CE=\frac{9}{5}$；(2) $\odot P$ 半径为 $\frac{35}{12}$；(3) $AP=\frac{20}{13}$ 或 $\frac{20}{3}$
      clue: 圆的综合
      solution_steps:
      - (1) 作 $PH\perp AC$，由 $\cos B=\frac{3}{5},BC=3$ 得 $AB=5,AC=4$，$\because PH\parallel BC$，$\frac{PH}{BC}=\frac{PA}{AB}$，$PH=\frac{3}{5}$，$AH=DH=\frac{4}{5}$，$DC=\frac{12}{5}$
      - 由 $\frac{PH}{CE}=\frac{DH}{DC}$ 得 $CE=\frac{9}{5}$
      - (2) 作 $PG\perp AC$，设 $PA=x$，则 $PG=\frac{3}{5}x$，$AG=DG=\frac{4}{5}x$，$CD=\frac{8}{5}x-4$，由 $\frac{CE}{PG}=\frac{DC}{DG}$ 得 $CE=\frac{6}{5}x-3$
      - $\odot P$ 与 $\odot C$ 内切，$PA-CE=PC$，即 $x-\left(\frac{6}{5}x-3\right)=\sqrt{\left(\frac{3}{5}x\right)^{2}+\left(4-\frac{4}{5}x\right)^{2}}$，得 $24x^{2}-130x+175=0$，$x=\frac{35}{12}$ 或 $\frac{5}{2}$，半径为 $\frac{35}{12}$
      - (3) 由角的关系得 $\angle ABC=\angle PEC$，$\therefore PB=PE$，$Q$ 为 $BE$ 中点，$\therefore PQ\perp BC$，$PQ\parallel AC$
      - 当 $PE\parallel CF$ 时，四边形 $PDCF$ 为平行四边形，$PF=CD$；当 $P$ 在 $AB$ 上时 $x=4-\frac{8}{5}x$，$x=\frac{20}{13}$；当 $P$ 在 $AB$ 延长线上时 $x=\frac{8}{5}x-4$，$x=\frac{20}{3}$，故 $AP$ 为 $\frac{20}{13}$ 或 $\frac{20}{3}$
