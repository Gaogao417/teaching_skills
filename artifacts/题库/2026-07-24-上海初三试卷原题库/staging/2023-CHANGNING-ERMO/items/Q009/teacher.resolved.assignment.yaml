    stem_latex: 已知 $f(x)=\dfrac{x}{x^{2}-1}$，那么 $f(\sqrt{5})=$ ______
    answer: $\dfrac{\sqrt{5}}{4}$
    clue: 代入函数解析式计算。
    solution_steps:
    - $f(\sqrt{5})=\dfrac{\sqrt{5}}{(\sqrt{5})^{2}-1}=\dfrac{\sqrt{5}}{4}$。
