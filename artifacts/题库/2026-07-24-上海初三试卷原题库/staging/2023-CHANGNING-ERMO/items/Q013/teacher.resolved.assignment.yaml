    id: Q013
    points: 4
    stem_latex: 某区九年级3000名学生中随机调查200名"4分钟跳绳"，仅45名未获满分，估计该区九年级能获满分的人数约为 ______
    answer: $2325$
    clue: 用样本中满分比例估计总体。
    solution_steps:
    - $3000\times\dfrac{200-45}{200}=2325$（名）。
