  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，在菱形 $ABCD$ 中，对角线 $AC$ 与 $BD$ 交于点 $O$，已知 $BD = 16$，$\tan\angle OCD = \dfrac{4}{3}$，如果点 $E$ 是边 $AB$ 的中点，那么 $OE =$ ______
    answer: $5$
    clue: 菱形对角线垂直平分，由 $\tan$ 求 $OC$，再用直角三角形斜边中线定理。
    solution_steps:
    - 菱形中 $AC\perp BD$，$BO=DO=8$。
    - Rt$\triangle OCD$ 中 $\tan\angle OCD=\dfrac{OD}{OC}=\dfrac{4}{3}$，$OC=6$，$OA=6$。
    - $AB=\sqrt{OA^{2}+OB^{2}}=10$，$E$ 为 $AB$ 中点，Rt$\triangle AOB$ 中 $OE=\dfrac{1}{2}AB=5$。
