  - type: problem
    id: Q024
    points: 12
    stem_latex: 已知抛物线 $y = ax^2 + 2x + 6$ 与 $x$ 轴交于点 $A$、点 $B$（点 $A$ 在点 $B$ 的左侧，点 $B$ 在原点 $O$ 右侧），与 $y$ 轴交于点 $C$，且 $OB = OC$。（1）求抛物线的表达式；（2）如图1，点 $D$ 是抛物线上一点，直线 $BD$ 恰好平分 $\triangle ABC$ 的面积，求点 $D$ 的坐标；（3）如图2，点 $E(0,-2)$，抛物线上存在点 $P$ 满足 $\angle OBP = 2\angle OBE$，请直接写出直线 $BP$ 的表达式．
    answer: (1) $y=-\dfrac{1}{2}x^{2}+2x+6$；(2) $D\left(-\dfrac{8}{7},\dfrac{150}{49}\right)$；(3) $y=-\dfrac{3}{4}x+\dfrac{9}{2}$ 或 $y=\dfrac{3}{4}x-\dfrac{9}{2}$
    clue: (1) 待定系数法；(2) 平分面积 $\Rightarrow$ 中点，求直线与抛物线交点；(3) 角平分线+全等构造，分 $P$ 在 $x$ 轴上、下方两类。
    solution_steps:
    - (1) $x=0\Rightarrow C(0,6)$，$OB=OC=6$，$B(6,0)$；代入 $0=36a+12+6$，$a=-\dfrac{1}{2}$，$y=-\dfrac{1}{2}x^{2}+2x+6$。
    - (2) 令 $y=0$ 得 $x_1=-2,x_2=6$，$A(-2,0)$；$BD$ 平分面积 $\Rightarrow F$ 为 $AC$ 中点 $F(-1,3)$。
    - 直线 $BD$：$\begin{cases}6k+b=0\\-k+b=3\end{cases}\Rightarrow k=-\dfrac{3}{7},b=\dfrac{18}{7}$，与抛物线联立得 $D\left(-\dfrac{8}{7},\dfrac{150}{49}\right)$（$x=6$ 舍去）。
    - (3) $P$ 在 $x$ 轴上方时，在 $y$ 轴取 $OG=OE=2$，作 $\angle GBM=\angle GBO$（$BP$ 交 $y$ 轴于 $M$），$GH\perp BM$。
    - 由角平分线 $GH=OG=2$，Rt$\triangle OBG\cong$ Rt$\triangle OHG$（HL），$BH=BO=6$。
    - 设 $MH=x$，$\left(\sqrt{x^{2}+4}+2\right)^{2}+6^{2}=(x+6)^{2}$，$x=\dfrac{3}{2}$，$MO=\dfrac{9}{2}$，$M\left(0,\dfrac{9}{2}\right)$，直线 $BP$：$y=-\dfrac{3}{4}x+\dfrac{9}{2}$。
    - $P$ 在 $x$ 轴下方时同理 $y=\dfrac{3}{4}x-\dfrac{9}{2}$。
