  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如图，在梯形 $ABCD$ 中，$AD \parallel BC$，$AD = \dfrac{1}{2}BC$，对角线 $AC$ 与 $BD$ 交于点 $O$，设 $\overrightarrow{AD} = \vec{a}$，$\overrightarrow{CO} = \vec{b}$，那么 $\overrightarrow{AB} =$ ______（结果用 $\vec{a}$、$\vec{b}$ 表示）
    answer: $-2\vec{a}-\dfrac{3}{2}\vec{b}$
    clue: 由平行得相似求 $AO:CO$，再用向量合成 $\overrightarrow{AB}=\overrightarrow{AC}+\overrightarrow{CB}$。
    solution_steps:
    - $\because AD\parallel BC$，$AD=\dfrac{1}{2}BC$，$\therefore \triangle AOD\sim\triangle COB$，$\dfrac{AO}{CO}=\dfrac{1}{2}$。
    - $\overrightarrow{CB}=-2\overrightarrow{AD}=-2\vec{a}$，$\overrightarrow{AO}=-\dfrac{1}{2}\overrightarrow{CO}=-\dfrac{1}{2}\vec{b}$。
    - $\overrightarrow{AB}=\overrightarrow{AO}+\overrightarrow{OC}+\overrightarrow{CB}=-\dfrac{3}{2}\vec{b}-2\vec{a}$。
