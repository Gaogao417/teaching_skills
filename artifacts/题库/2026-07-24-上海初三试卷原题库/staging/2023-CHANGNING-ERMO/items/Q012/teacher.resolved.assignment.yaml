  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 已知线段 $a=3$，$b=4$，从 $1,2,3,4,5,6,7,8$ 这八个数中任意选取一个数作为线段 $c$ 的长度，那么 $a$、$b$、$c$ 不能组成三角形的概率是 ______
    answer: $\dfrac{3}{8}$
    clue: 由三角形三边关系定能组成的 $c$ 范围，再用概率公式。
    solution_steps:
    - 能组成三角形则 $1<c<7$，$c$ 可取 $2,3,4,5,6$ 共5个。
    - 不能组成则 $c\in\{1,7,8\}$ 共3个，概率 $\dfrac{3}{8}$。
