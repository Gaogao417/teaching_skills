    id: Q014
    points: 4
    stem_latex: 已知点 $A(-4,m)$ 在反比例函数 $y=\dfrac{k}{x}$ 的图像上，点 $A$ 关于 $y$ 轴的对称点 $A_1$ 恰好在直线 $y=\dfrac{1}{2}x$ 上，那么 $k$ 的值为 ______
    answer: $-8$
    clue: 关于 $y$ 轴对称横坐标变号，先求 $m$ 再求 $k$。
    solution_steps:
    - $A_1(4,m)$，代入 $y=\dfrac{1}{2}x$ 得 $m=2$。
    - $A(-4,2)$，$k=-4\times2=-8$。
