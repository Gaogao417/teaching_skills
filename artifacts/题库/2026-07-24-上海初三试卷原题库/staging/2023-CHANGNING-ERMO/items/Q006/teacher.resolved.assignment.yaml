  blocks:
  - type: choice
    id: Q006
    points: 4
    stem_latex: 已知抛物线 $y=ax^{2}+bx+c\,(a\neq0)$ 经过点 $A(2,t)$、$B(3,t)$、$C(4,2)$，那么 $a+b+c$ 的值是（\quad）
    choices:
    - $2$
    - $3$
    - $4$
    - $t$
    answer: A
    clue: 由 $A,B$ 纵坐标相同得对称轴 $x=2.5$，$C(4,2)$ 关于对称轴的对称点为 $(1,2)$，故 $f(1)=a+b+c=2$。
    solution_steps:
    - $A(2,t)$、$B(3,t)$ 纵坐标相同，对称轴 $x=\dfrac{2+3}{2}=2.5$。
    - $C(4,2)$ 关于对称轴的对称点为 $(1,2)$，故 $f(1)=a+b+c=2$。
