    stem_latex: 下列命题中，假命题的是（\quad）
    choices:
    - 对角线互相垂直的平行四边形是菱形
    - 对角线互相垂直的梯形是等腰梯形
    - 对角线平分一组对角的平行四边形是菱形
    - 对角线平分一组对角的矩形是正方形
    answer: B
    clue: 逐项用特殊四边形的判定定理判断真假。
    solution_steps:
    - A、对角线互相垂直的平行四边形是菱形，真命题。
    - B、对角线互相垂直的梯形不一定是等腰梯形（可为直角梯形等），假命题。
    - C、D 均为真命题。
