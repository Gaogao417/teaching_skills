  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases} x + y = 2 \\ x^{2} - 9y^{2} = 0 \end{cases}$
    answer: $\begin{cases} x_1=3 \\ y_1=-1 \end{cases}$ 或 $\begin{cases} x_2=\dfrac{3}{2} \\ y_2=\dfrac{1}{2} \end{cases}$
    clue: 用平方差公式将②分解，拆成两个二元一次方程组。
    solution_steps:
    - 由② $(x+3y)(x-3y)=0$，即 $x+3y=0$ 或 $x-3y=0$。
    - 与① $x+y=2$ 联立，解得 $\begin{cases} x_1=3 \\ y_1=-1 \end{cases}$ 或 $\begin{cases} x_2=\dfrac{3}{2} \\ y_2=\dfrac{1}{2} \end{cases}$。
