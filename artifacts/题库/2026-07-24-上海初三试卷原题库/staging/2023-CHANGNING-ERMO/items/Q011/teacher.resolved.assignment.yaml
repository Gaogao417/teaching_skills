  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 不等式组 $\begin{cases}x<3x-4\\\dfrac{2+x}{2}\leqslant x-1\end{cases}$ 的正整数解是 ______
    answer: $3$，$4$
    clue: 分别解两个不等式求交集，再取正整数。
    solution_steps:
    - 解①得 $x>2$；解②得 $x\leqslant4$。
    - 故 $2<x\leqslant4$，正整数解为 $3$、$4$。
