    stem_latex: 计算：$8^{\frac{1}{3}} + \dfrac{1}{\sqrt{2}+1} - (\sqrt{2023} - 1)^{0} \times \sqrt{18}$
    answer: $1-2\sqrt{2}$
    clue: 分数指数幂、分母有理化、零指数幂、化简二次根式，逐项计算。
    solution_steps:
    - 原式 $=2+(\sqrt{2}-1)-1\times3\sqrt{2}$
    - $=1+\sqrt{2}-3\sqrt{2}=1-2\sqrt{2}$。
