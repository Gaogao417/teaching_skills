    id: Q010
    points: 4
    stem_latex: 如果关于 $x$ 的方程 $x^{2}-4x+2c=0$ 有实数根，那么实数 $c$ 的取值范围是 ______
    answer: $c\leqslant2$
    clue: 一元二次方程有实数根则判别式 $\Delta\geqslant0$。
    solution_steps:
    - $\Delta=16-8c\geqslant0$，解得 $c\leqslant2$。
