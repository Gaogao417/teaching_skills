      start_anchor: 【详解】解
      end_anchor: 故选：B
    block:
      stem_latex: 用换元法解方程 $\dfrac{x-1}{x^{2}}-\dfrac{x^{2}}{x-1}=3$ 时，如果设 $\dfrac{x-1}{x^{2}}=y$，那么原方程可化为关于
        $y$ 的方程是（\quad）
      choices:
      - $y^{2}+3y-1=0$
      - $y^{2}-3y-1=0$
      - $y^{2}-3y+1=0$
      - $y^{2}+3y+1=0$
      answer: B
      clue: 换元后 $\dfrac{x^{2}}{x-1}$ 是 $\dfrac{x-1}{x^{2}}$ 的倒数，再去分母。
      solution_steps:
      - 设 $y=\dfrac{x-1}{x^{2}}$，则 $\dfrac{x^{2}}{x-1}=\dfrac{1}{y}$。
      - 原方程化为 $y-\dfrac{1}{y}=3$，去分母得 $y^{2}-3y-1=0$。
