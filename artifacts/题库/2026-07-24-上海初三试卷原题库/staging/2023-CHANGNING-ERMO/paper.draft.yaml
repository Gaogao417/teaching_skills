      - 作 $OF\perp CD$ 于 $F$，连 $OD$，作 $DH\perp AB$ 于 $H$。
      - $\angle OEF=45\degree$，$\triangle OEF$ 等腰直角，$OE=3\sqrt{2}\Rightarrow OF=EF=3$。
      - $DE=7\Rightarrow DF=4$，$OD=\sqrt{3^{2}+4^{2}}=5$，$OB=5$，$BE=5+3\sqrt{2}$。
      - $\triangle DEH$ 等腰直角，$EH=DH=\dfrac{7\sqrt{2}}{2}$。
      - $BH=BE-EH=5-\dfrac{\sqrt{2}}{2}$，$\cot\angle ABD=\dfrac{BH}{DH}=\dfrac{5\sqrt{2}-1}{7}$。
