      start_anchor: 【分析】根据无理数的概念判断
      end_anchor: 故选：C
    block:
      stem_latex: 下列实数中，比 $3$ 大的有理数是（\quad）
      choices:
      - $|-3|$
      - $\pi$
      - $\dfrac{22}{7}$
      - $\sqrt{17}$
      answer: C
      clue: 区分有理数与无理数，再比较大小。
      solution_steps:
      - $|-3|=3$；$\pi$、$\sqrt{17}$ 是无理数。
      - $\dfrac{22}{7}>3$ 且为有理数，故选 C。
  - item_id: Q002
