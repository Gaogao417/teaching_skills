      solution_steps:
      - (1) $x=0\Rightarrow C(0,6)$，$OB=OC=6$，$B(6,0)$；代入 $0=36a+12+6$，$a=-\dfrac{1}{2}$，$y=-\dfrac{1}{2}x^{2}+2x+6$。
      - (2) 令 $y=0$ 得 $x_1=-2,x_2=6$，$A(-2,0)$；$BD$ 平分面积 $\Rightarrow F$ 为 $AC$ 中点
        $F(-1,3)$。
      - 直线 $BD$：$\begin{cases}6k+b=0\\-k+b=3\end{cases}\Rightarrow k=-\dfrac{3}{7},b=\dfrac{18}{7}$，与抛物线联立得
        $D\left(-\dfrac{8}{7},\dfrac{150}{49}\right)$（$x=6$ 舍去）。
      - (3) $P$ 在 $x$ 轴上方时，在 $y$ 轴取 $OG=OE=2$，作 $\angle GBM=\angle GBO$（$BP$ 交 $y$
        轴于 $M$），$GH\perp BM$。
      - 由角平分线 $GH=OG=2$，Rt$\triangle OBG\cong$ Rt$\triangle OHG$（HL），$BH=BO=6$。
      - 设 $MH=x$，$\left(\sqrt{x^{2}+4}+2\right)^{2}+6^{2}=(x+6)^{2}$，$x=\dfrac{3}{2}$，$MO=\dfrac{9}{2}$，$M\left(0,\dfrac{9}{2}\right)$，直线
        $BP$：$y=-\dfrac{3}{4}x+\dfrac{9}{2}$。
      - $P$ 在 $x$ 轴下方时同理 $y=\dfrac{3}{4}x-\dfrac{9}{2}$。
