        $BD$ 恰好平分 $\triangle ABC$ 的面积，求点 $D$ 的坐标；（3）如图2，点 $E(0,-2)$，抛物线上存在点 $P$ 满足
        $\angle OBP = 2\angle OBE$，请直接写出直线 $BP$ 的表达式．
      answer: (1) $y=-\dfrac{1}{2}x^{2}+2x+6$；(2) $D\left(-\dfrac{8}{7},\dfrac{150}{49}\right)$；(3)
        $y=-\dfrac{3}{4}x+\dfrac{9}{2}$ 或 $y=\dfrac{3}{4}x-\dfrac{9}{2}$
      clue: (1) 待定系数法；(2) 平分面积 $\Rightarrow$ 中点，求直线与抛物线交点；(3) 角平分线+全等构造，分 $P$ 在 $x$
