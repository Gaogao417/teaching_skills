      - ① $x^2-4\leq x^2-2x+1$，$2x\leq5$，$x\leq\frac{5}{2}$。
      - ② $3(x-1)<18+4x$，$-x<21$，$x>-21$。
      - $\therefore -21<x\leq\frac{5}{2}$。
      clue: 展开不等式后分别求解取交集。
      answer: $-21 < x \leq \dfrac{5}{2}$
