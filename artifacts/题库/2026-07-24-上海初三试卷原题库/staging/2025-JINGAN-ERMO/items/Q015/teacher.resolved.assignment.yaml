  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 点 $G$ 是 $\triangle ABC$ 的重心，$\overrightarrow{AB}=\vec{a}$，$\overrightarrow{AG}=\vec{b}$，那么 $\overrightarrow{BC}=$______（用 $\vec{a}$、$\vec{b}$ 表示）
    answer: $3\vec{b}-2\vec{a}$
    clue: $\overrightarrow{AD}=\frac{3}{2}\vec{b}$，$\overrightarrow{BC}=2\overrightarrow{BD}=2(\frac{3}{2}\vec{b}-\vec{a})$。
    solution_steps:
    - $\overrightarrow{AD}=\frac{3}{2}\vec{b}$，$\overrightarrow{BD}=\frac{3}{2}\vec{b}-\vec{a}$。
    - $\overrightarrow{BC}=2\overrightarrow{BD}=3\vec{b}-2\vec{a}$。
