  - type: problem
    id: Q024
    points: 12
    stem_latex: '抛物线 $y_1=4ax^2+8ax+m$，$y_2=ax^2-4ax+n$（$a>0$），顶点分别为 $A$、$B$，都经过 $y$ 轴上点 $C$。

      (1) $y_1$ 过 $(-2,2)$，$y_2$ 过 $(3,-1)$，求两抛物线表达式；

      (2) $\angle OCB=45^{\circ}$，求 $a$；

      (3) $\angle ACB=90^{\circ}$ 时，能否确定 $a$、$m$、$n$？'
    solution_steps:
    - (1) $m=n=2$，$a=1$，$y_1=4x^2+8x+2$，$y_2=x^2-4x+2$。
    - (2) $B(2,n-4a)$，$C(0,n)$，等腰直角 $\triangle BCD$，$4a=2$，$a=\frac{1}{2}$。
    - (3) $A(-1,m-4a)$，$AB\perp y$ 轴，$\triangle ADC\sim\triangle CDB$，$(4a)^2=1\times2$，$a=\frac{\sqrt{2}}{4}$，$m$、$n$ 不能确定。
    clue: 双抛物线+等腰直角三角形+相似三角形。
    answer: (1) $y_1=4x^2+8x+2$，$y_2=x^2-4x+2$；(2) $a=\dfrac{1}{2}$；(3) $a=\dfrac{\sqrt{2}}{4}$，$m$、$n$ 不能确定
