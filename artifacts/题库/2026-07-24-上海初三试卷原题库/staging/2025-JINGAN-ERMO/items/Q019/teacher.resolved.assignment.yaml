  - type: problem
    id: Q019
    points: 10
    stem_latex: 解不等式组：$\begin{cases}(x+2)(x-2) \leq (x-1)^2 \\ \dfrac{x-1}{2} < 3 + \dfrac{2x}{3}\end{cases}$
    solution_steps:
    - ① $x^2-4\leq x^2-2x+1$，$2x\leq5$，$x\leq\frac{5}{2}$。
    - ② $3(x-1)<18+4x$，$-x<21$，$x>-21$。
    - $\therefore -21<x\leq\frac{5}{2}$。
    clue: 展开不等式后分别求解取交集。
    answer: $-21 < x \leq \dfrac{5}{2}$
