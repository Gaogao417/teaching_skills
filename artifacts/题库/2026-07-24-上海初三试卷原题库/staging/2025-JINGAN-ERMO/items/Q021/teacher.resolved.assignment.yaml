  - type: problem
    id: Q021
    points: 10
    stem_latex: '菱形 $ABCD$，对角线交于 $O$，$F$ 是 $BC$ 中点，$OF$ 延长至 $E$ 使 $EF=OF$，连接 $BE$、$CE$。

      (1) 求证：四边形 $OBEC$ 是矩形；

      (2) $M$ 在 $OC$ 上，$\angle OBC=\angle FOC+\angle MFC$，$AC=10$，$BD=6$，求 $OM$。'
    solution_steps:
    - (1) $BF=CF$，$EF=OF$，四边形 $OBEC$ 为平行四边形，$\angle BOC=90^{\circ}$，$\therefore$ 矩形。
    - (2) $OC=5$，$OB=3$，$BC=\sqrt{34}$，$OE=BC=\sqrt{34}$。
    - $\triangle OMF\sim\triangle OCE$，$\frac{OM}{OE}=\frac{OF}{OC}$，$OM=\frac{17}{5}$。
    clue: 菱形对角线垂直+矩形判定+相似三角形。
    answer: (1) 证明见详解；(2) $OM=\dfrac{17}{5}$
