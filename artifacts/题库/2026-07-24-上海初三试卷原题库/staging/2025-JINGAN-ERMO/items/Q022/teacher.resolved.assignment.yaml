  - type: problem
    id: Q022
    points: 10
    stem_latex: '车辆平均速度 $y$（千米/时）与每百米车辆数 $x$（辆）的一次函数关系（过点 $(10,60)$ 和 $(20,40)$）。

      (1) 求 $y$ 关于 $x$ 的解析式及定义域；

      (2) 平均速度30千米/时时，① 每百米车辆数；② 每4分钟增加1辆，速度小于20时严重拥堵，最晚几分钟启动限流？'
    solution_steps:
    - (1) $y=-2x+80$，$0<x\leq40$ 且 $x$ 为整数。
    - (2)① $y=30$ 时 $x=25$。
    - ② $y<20$ 时 $x>30$，$(30-25)\times4=20$ 分钟。
    clue: 一次函数应用+不等式。
    answer: (1) $y=-2x+80$（$0<x\leq40$，整数）；(2) ① 25辆；② 20分钟
