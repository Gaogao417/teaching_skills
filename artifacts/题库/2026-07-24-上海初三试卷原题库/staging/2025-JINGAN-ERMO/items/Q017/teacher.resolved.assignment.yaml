  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 同时掷红绿两枚骰子（$1\sim6$），红为 $m$，绿为 $n$，方程 $x^2+mx+n=0$ 有两个相等实数根的概率是______
    answer: $\dfrac{1}{18}$
    clue: $\Delta=m^2-4n=0$ 即 $m^2=4n$，共 $(2,1)$ 和 $(4,4)$ 两种。
    solution_steps:
    - $m^2=4n$：$(m,n)=(2,1),(4,4)$，共2种。
    - $P=\dfrac{2}{36}=\dfrac{1}{18}$。
    source_solution_images: []
