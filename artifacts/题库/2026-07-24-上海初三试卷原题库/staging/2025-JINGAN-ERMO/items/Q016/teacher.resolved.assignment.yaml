    stem_latex: 斜坡坡度 $i=1:0.75$，最高点到地面距离 $2.4$ 米，斜坡长度为______米
    answer: '3'
    clue: 水平距离 $=2.4\times0.75=1.8$，斜坡 $=\sqrt{2.4^2+1.8^2}=3$。
    solution_steps:
    - $x=2.4\times0.75=1.8$，$L=\sqrt{5.76+3.24}=3$。
