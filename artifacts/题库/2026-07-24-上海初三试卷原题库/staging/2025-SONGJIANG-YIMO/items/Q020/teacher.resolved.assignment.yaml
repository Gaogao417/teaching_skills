  - type: problem
    id: Q020
    points: 10
    stem_latex: 已知一条抛物线的顶点为 $A(1,3)$，且经过点 $B(0,2)$。（1）求抛物线的表达式；（2）若点 $C(3,t)$ 在抛物线上，求 $\triangle ABC$ 的面积。
    answer: （1）$y=-(x-1)^2+3$；（2）$3$。
    solution_steps:
    - title: 第（1）问
      content: 设 $y=a(x-1)^2+3$，代入 $B(0,2)$ 得 $a=-1$，所以 $y=-(x-1)^2+3$。
    - title: 第（2）问
      content: 代入 $x=3$ 得 $t=-1$，所以 $C(3,-1)$。计算得 $AB=\sqrt2,BC=3\sqrt2,AC=2\sqrt5$，且 $\angle ABC=90^\circ$，故 $S_{\triangle
        ABC}=3$。
      diagram_col:
        image_path: assets/solution-01.png
        width: 0.72\linewidth
        variant: solution
        disclosure_policy: teacher_only
