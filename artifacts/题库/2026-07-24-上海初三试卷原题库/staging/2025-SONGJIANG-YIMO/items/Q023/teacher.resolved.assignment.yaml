  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，在 $\triangle ABC$ 中，$AB=AC$，$AD\perp BC$，$BE\perp AC$，垂足分别为 $D、E$；$AF\parallel BC$，交 $BE$ 的延长线于点 $F$。（1）求证：$\dfrac{AE}{AF}=\dfrac{CD}{AC}$；（2）求证：$2AB\cdot
      AD=BF\cdot BC$。
    answer: 结论均成立。
    solution_steps:
    - title: 第（1）问
      content: 由 $AD\perp BC,BE\perp AC,AF\parallel BC$，可得 $\triangle AEF\sim\triangle CDA$，所以 $\dfrac{AE}{AF}=\dfrac{CD}{AC}$。
      diagram_col:
        image_path: assets/solution-01.png
        width: 0.72\linewidth
        variant: solution
        disclosure_policy: teacher_only
    - title: 第（2）问
      content: 利用角关系证明 $\triangle ABF\sim\triangle GBA$ 及 $\triangle AFG\sim\triangle DAB$，得到比例；又 $AB=AC$ 且 $BD=\dfrac12BC$，整理得
        $2AB\cdot AD=BF\cdot BC$。
