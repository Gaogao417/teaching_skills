    stem_latex: 在平面直角坐标系 $xOy$ 中，二次函数 $y=ax^2+bx+2$ 的图像与 $x$ 轴负半轴交于点 $A$，与 $y$ 轴交于点 $B$，且 $OA=OB$。（1）当 $x=-\dfrac1a$ 时，求函数值；（2）定义满足 $f(x)=x$ 的实数 $x$ 为函数的不动点。若该二次函数存在唯一不动点，求此不动点；（3）将 $\triangle AOB$ 绕点 $B$ 逆时针旋转，点 $O、A$ 分别落在 $C、D$。当四边形 $ABCD$ 是梯形且点 $C$ 在抛物线上时，求解析式。
