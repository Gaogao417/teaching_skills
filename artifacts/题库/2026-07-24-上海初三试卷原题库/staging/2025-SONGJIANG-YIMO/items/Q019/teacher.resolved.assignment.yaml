  - type: problem
    id: Q019
    points: 10
    stem_latex: 已知 $\dfrac ab=\dfrac cd$（$a\ne b$）。（1）如果 $a=1,b=2,c+d=6$，求 $c、d$；（2）求证：$\dfrac{b-a}{d-c}=\dfrac bd$。
    answer: （1）$c=2,d=4$；（2）结论成立。
    solution_steps:
    - title: 第（1）问
      content: 由 $\dfrac ab=\dfrac cd$ 及 $a=1,b=2$，得 $\dfrac cd=\dfrac12$。又 $c+d=6$，解得 $c=2,d=4$。
    - title: 第（2）问
      content: 设 $\dfrac ab=\dfrac cd=k(k\ne1)$，则 $a=bk,c=dk$。所以 $\dfrac{b-a}{d-c}=\dfrac{b(1-k)}{d(1-k)}=\dfrac bd$。
