    stem_latex: 已知 $\vec a+\vec b=2\vec c$，$\vec a-\vec b=3\vec c$，且 $\vec c$ 是非零向量。那么下列说法中正确的是
    choices:
    - $\vec a\parallel\vec b\parallel\vec c$
    - $\vec a\parallel\vec b$，$\vec a$ 与 $\vec c$ 不平行
