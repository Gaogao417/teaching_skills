    stem_latex: '如图2，已知 $\triangle ABC$，$\angle ACB=90^\circ$，$BC=2AC$，延长 $AC$ 至点 $D$，使 $AD=AB$，以 $CD$ 为边作正方形 $CDEF$，联结 $BD$、$BE$，$BD$ 交 $EF$ 于点 $G$。某同学得到以下两个结论：

      ① $G$ 是线段 $BF$ 的黄金分割点；

      ② $\dfrac{S_{\triangle BGE}}{S_{\triangle BDE}}=\dfrac{S_{\triangle BGF}}{S_{\triangle DEG}}$。

      关于结论①和②，下列说法正确的是（　）

      '
