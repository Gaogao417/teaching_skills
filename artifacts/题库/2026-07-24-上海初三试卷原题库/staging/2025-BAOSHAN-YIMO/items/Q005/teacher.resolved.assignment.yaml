    stem_latex: 如图1，在梯形 $ABCD$ 中，$AD\parallel BC$，$AB=CD=AD$，$\angle B=60^\circ$，设 $\overrightarrow{AB}=\vec a$，$\overrightarrow{AD}=\vec b$，用向量 $\vec a$、$\vec b$ 的线性组合表示向量 $\overrightarrow{DC}$，结果正确的是（　）
    answer: B
    choices:
      A: $\overrightarrow{DC}=\vec a-\vec b$
      B: $\overrightarrow{DC}=\vec a+\vec b$
      C: $\overrightarrow{DC}=\vec a-\dfrac12\vec b$
      D: $\overrightarrow{DC}=\vec a+\dfrac12\vec b$
    explanation: 参考答案：B。
