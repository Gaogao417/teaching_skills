  - type: fillin
    id: Q017
    points: 4
    stem_latex: 一个二次函数的图像经过点 $(t,0)$，则称 $t$ 的值是这个函数的“零点”。例如二次函数 $y=a(x-3)(x+2)\ (a\ne0)$，无论 $a$ 取何值，这个函数的图像总经过点 $(3,0)$ 和点 $(-2,0)$，所以3和$-2$是这个函数的“零点”。如果一个二次函数有且只有一个“零点”$-1$，那么这个二次函数的解析式可以是 \underline{\hspace{2cm}}。（写出一个符合要求的函数解析式即可）
    answer: $y=(x+1)^2$（答案不唯一）
    explanation: 参考答案：$y=(x+1)^2$ 等。
