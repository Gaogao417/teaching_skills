  - type: problem
    id: Q019
    points: 10
    stem_latex: '一副三角尺由两块直角三角尺组成，其中一块是含 $30^\circ$ 角的直角三角形，另一块是含 $45^\circ$ 角的直角三角形。用这两块三角尺可以拼成一个四边形 $ABCD$（如图8），设 $AB=a$。

      \begin{enumerate}

      \item 用含 $a$ 的代数式直接表示：$AD=$ \underline{\hspace{2cm}}；

      \item 求 $\angle BDC$ 的正切值。

      \end{enumerate}

      '
    answer: （1）$AD=\dfrac{2\sqrt6}{3}a$；（2）$\tan\angle BDC=2\sqrt3-3$。
    solution_steps:
    - title: 第（1）问
      content: $AD=\dfrac{2\sqrt6}{3}a$。
    - title: 第（2）问
      content: 延长 $DC$，过点 $B$ 作 $BE\perp DC$，垂足为点 $E$。$\because\angle ACD=90^\circ,\ \angle ACB=45^\circ$，$\therefore\angle BCE=45^\circ$。$\because BE\perp DC,\ BC=a$，$\therefore BE=BC\cdot\sin\angle BCE=\dfrac{\sqrt2}{2}a$，$EC=BC\cdot\cos\angle BCE=\dfrac{\sqrt2}{2}a$。$\because\angle ACD=90^\circ,\ \angle DAC=30^\circ,\ AD=\dfrac{2\sqrt6}{3}a$，$\therefore CD=\dfrac{\sqrt6}{3}a$。在 $\mathrm{Rt}\triangle BED$ 中，$\tan\angle BDC=\dfrac{BE}{DE}=\dfrac{\frac{\sqrt2}{2}a}{\frac{\sqrt2}{2}a+\frac{\sqrt6}{3}a}=2\sqrt3-3$。
