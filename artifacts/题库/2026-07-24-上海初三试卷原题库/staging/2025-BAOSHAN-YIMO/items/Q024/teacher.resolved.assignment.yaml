  blocks:
  - type: problem
    id: Q024
    points: 12
    stem_latex: '如图13，在平面直角坐标系 $xOy$ 中，已知抛物线 $y=ax^2+4$ 的顶点为 $D$，点 $A$、$B$ 在抛物线上，且都在 $y$ 轴右侧，横坐标分别是 $m$、$m+1$。

      \begin{enumerate}

      \item 联结 $AD$、$BD$，求 $\cot\angle ODA-\cot\angle ODB$ 的值（结果用含 $a$ 的代数式表示）；

      \item 如果 $y$ 轴上存在点 $C$，使得 $AC\perp BC$，且 $AC=BC$：

      \begin{enumerate}

      \item 求抛物线的表达式；

      \item 若 $AB=\sqrt{10}$，点 $E$ 在 $y$ 轴上，且 $\triangle ADE$ 与 $\triangle ABC$ 相似，求点 $E$ 的坐标。

      \end{enumerate}

      \end{enumerate}

      '
    answer: （1）$a$；（2）①$y=-x^2+4$；②$E(0,3)$或$E(0,2)$。
    solution_steps:
    - title: 第（1）问
      content: 过点 $A$ 作 $AG\perp y$ 轴，垂足为点 $G$。根据题意可得 $D(0,4)$，$A(m,am^2+4)$，$G(0,am^2+4)$，所以 $AG=m$，$DG=-am^2$。在 $\mathrm{Rt}\triangle AGD$ 中，$\cot\angle ODA=\dfrac{DG}{AG}=-am$。同理 $\cot\angle ODB=-a(m+1)$。所以 $\cot\angle ODA-\cot\angle ODB=a$。
    - title: 第（2）问①
      content: 过点 $A$ 作 $AM\perp y$ 轴，垂足为点 $M$；过点 $B$ 作 $BN\perp y$ 轴，垂足为点 $N$。由 $\angle AMC=\angle BNC=90^\circ$，$AC\perp BC$，$AC=BC$，得 $\triangle AMC\cong\triangle BNC$。所以 $AM=CN=m$，$CM=BN=m+1$，$MN=2m+1$。又 $MN=am^2+4-[a(m+1)^2+4]=-a(2m+1)$，所以 $a=-1$，抛物线为 $y=-x^2+4$。
    - title: 第（2）问②
      content: 由 $A(m,-m^2+4)$、$B(m+1,-(m+1)^2+4)$，且 $AB=\sqrt{10}$，解得 $m=1$（负值不合题意，舍去）。所以 $A(1,3)$，$B(2,0)$，$C(1,0)$。由 $\triangle ADE$ 与 $\triangle ABC$ 相似分类讨论，可得 $E(0,3)$ 或 $E(0,2)$。
