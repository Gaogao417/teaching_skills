    stem_latex: '如图14，已知 $\triangle ABC$ 中，$\angle ACB=90^\circ$，$BC=2$，$AC=3$，点 $E$、$F$ 分别在边 $AC$、$AB$ 上（不与端点重合），$BE\perp CF$，垂足为点 $D$。

      \begin{enumerate}

      \item 当 $CE=1$ 时，求 $AF$ 的长；

      \item 当 $BE=CF$ 时，求 $\tan\angle CBE$ 的值；

      \item 联结 $EF$，如果 $\triangle AEF$ 是直角三角形，求这时四边形 $BCEF$ 的面积。

      \end{enumerate}

      '
