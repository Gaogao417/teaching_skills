  blocks:
  - type: problem
    id: Q021
    points: 10
    stem_latex: '在平面直角坐标系 $xOy$ 中，已知 $A(-1,n)$、$B(5,n)$ 是抛物线 $y=a(x-m)^2+k\ (a>0)$ 上的两点。

      \begin{enumerate}

      \item $m=$ \underline{\hspace{2cm}}；

      \item 如果该抛物线与 $x$ 轴交于点 $C$、$D$（点 $C$ 在点 $D$ 的右侧），且 $CD=4$，四边形 $ABCD$ 的面积是25，求这个抛物线的表达式。

      \end{enumerate}

      '
    answer: （1）$m=2$；（2）$y=(x-2)^2-4$。
    solution_steps:
    - title: 第（1）问
      content: $m=2$。
    - title: 第（2）问
      content: 由 $m=2$ 可知抛物线的对称轴是直线 $x=2$。抛物线与 $x$ 轴交于点 $C$、$D$，且 $CD=4$，可得 $C(4,0)$、$D(0,0)$。由 $A(-1,n)$、$B(5,n)$ 可知四边形 $ABCD$ 是梯形，且 $AB=6$。于是 $S_{\text{梯形 }ABCD}=\dfrac{n(AB+CD)}2=\dfrac{n(6+4)}2=25$，解得 $n=5$。将 $D(0,0)$、$B(5,5)$ 代入 $y=a(x-2)^2+k$，得 $\begin{cases}4a+k=0,\\9a+k=5,\end{cases}$ 解得 $a=1,\ k=-4$。所以抛物线的表达式为 $y=(x-2)^2-4$。
