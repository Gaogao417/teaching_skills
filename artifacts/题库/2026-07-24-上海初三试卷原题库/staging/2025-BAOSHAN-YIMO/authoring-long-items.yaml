  - id: Q019
    source_key: 2025-BAOSHAN-YIMO-Q19
    question_number: 19
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [特殊角三角形, 锐角三角比]
    stem_latex: |
      一副三角尺由两块直角三角尺组成，其中一块是含 $30^\circ$ 角的直角三角形，另一块是含 $45^\circ$ 角的直角三角形。用这两块三角尺可以拼成一个四边形 $ABCD$（如图8），设 $AB=a$。
      \begin{enumerate}
      \item 用含 $a$ 的代数式直接表示：$AD=$ \underline{\hspace{2cm}}；
      \item 求 $\angle BDC$ 的正切值。
      \end{enumerate}
    answer: '（1）$AD=\dfrac{2\sqrt6}{3}a$；（2）$\tan\angle BDC=2\sqrt3-3$。'
    official_solution_latex:
      - title: 第（1）问
        content: '$AD=\dfrac{2\sqrt6}{3}a$。'
      - title: 第（2）问
        content: '延长 $DC$，过点 $B$ 作 $BE\perp DC$，垂足为点 $E$。$\because\angle ACD=90^\circ,\ \angle ACB=45^\circ$，$\therefore\angle BCE=45^\circ$。$\because BE\perp DC,\ BC=a$，$\therefore BE=BC\cdot\sin\angle BCE=\dfrac{\sqrt2}{2}a$，$EC=BC\cdot\cos\angle BCE=\dfrac{\sqrt2}{2}a$。$\because\angle ACD=90^\circ,\ \angle DAC=30^\circ,\ AD=\dfrac{2\sqrt6}{3}a$，$\therefore CD=\dfrac{\sqrt6}{3}a$。在 $\mathrm{Rt}\triangle BED$ 中，$\tan\angle BDC=\dfrac{BE}{DE}=\dfrac{\frac{\sqrt2}{2}a}{\frac{\sqrt2}{2}a+\frac{\sqrt6}{3}a}=2\sqrt3-3$。'
    question_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/004.png, box: [150, 870, 970, 1450], file: source-question.png}]
    prompt_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/004.png, box: [560, 1030, 940, 1420], file: prompt-01.png, width: 72mm}]
    solution_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/010.png, box: [150, 560, 950, 1380], file: official-solution-01.png}]

  - id: Q020
    source_key: 2025-BAOSHAN-YIMO-Q20
    question_number: 20
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [解直角三角形, 坡度, 棱柱体积]
    stem_latex: |
      为了方便居民出入小区，小区业委会决定对大门口的一段斜坡进行改造。原坡面是矩形 $ABCD$（如图9），$AB=4$ 米，$AD=2$ 米，斜坡 $AB$ 的坡角为 $30^\circ$。计划将斜坡 $AB$ 改造成坡比为 $1:2.5$ 的斜坡 $AE$（如图10所示），坡面的宽度 $AD$ 不变。
      \begin{enumerate}
      \item 求改造后斜面底部延伸出来的部分 $BE$ 的长度；
      \item 改建这条斜坡需要多少立方米的混凝土材料？
      \end{enumerate}
    answer: '（1）$BE=5-2\sqrt3$米；（2）$10-4\sqrt3$立方米。'
    official_solution_latex:
      - title: 第（1）问
        content: '延长 $EB$，过点 $A$ 作 $AF\perp EB$，垂足为点 $F$。在 $\mathrm{Rt}\triangle ABF$ 中，$\angle ABF=30^\circ$，$AB=4$，所以 $AF=\dfrac12AB=2$，$BF=AB\cos30^\circ=2\sqrt3$。在 $\mathrm{Rt}\triangle AEF$ 中，$\dfrac{AF}{EF}=\dfrac1{2.5}$，所以 $EF=2.5AF=5$。故 $BE=EF-BF=5-2\sqrt3$ 米。'
      - title: 第（2）问
        content: '混凝土体积为 $\dfrac12\cdot BE\cdot AF\cdot AD=\dfrac12(5-2\sqrt3)\cdot2\cdot2=10-4\sqrt3$ 立方米。'
    question_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/005.png, box: [150, 100, 970, 820], file: source-question.png}]
