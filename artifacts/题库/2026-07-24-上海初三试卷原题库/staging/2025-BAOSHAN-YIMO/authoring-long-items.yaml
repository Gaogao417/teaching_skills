    solution_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/011.png, box: [150, 100, 950, 650], file: official-solution-01.png}]

  - id: Q021
    source_key: 2025-BAOSHAN-YIMO-Q21
    question_number: 21
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [二次函数, 梯形面积, 待定系数法]
    stem_latex: |
      在平面直角坐标系 $xOy$ 中，已知 $A(-1,n)$、$B(5,n)$ 是抛物线 $y=a(x-m)^2+k\ (a>0)$ 上的两点。
      \begin{enumerate}
      \item $m=$ \underline{\hspace{2cm}}；
      \item 如果该抛物线与 $x$ 轴交于点 $C$、$D$（点 $C$ 在点 $D$ 的右侧），且 $CD=4$，四边形 $ABCD$ 的面积是25，求这个抛物线的表达式。
      \end{enumerate}
    answer: '（1）$m=2$；（2）$y=(x-2)^2-4$。'
    official_solution_latex:
      - title: 第（1）问
        content: '$m=2$。'
      - title: 第（2）问
        content: '由 $m=2$ 可知抛物线的对称轴是直线 $x=2$。抛物线与 $x$ 轴交于点 $C$、$D$，且 $CD=4$，可得 $C(4,0)$、$D(0,0)$。由 $A(-1,n)$、$B(5,n)$ 可知四边形 $ABCD$ 是梯形，且 $AB=6$。于是 $S_{\text{梯形 }ABCD}=\dfrac{n(AB+CD)}2=\dfrac{n(6+4)}2=25$，解得 $n=5$。将 $D(0,0)$、$B(5,5)$ 代入 $y=a(x-2)^2+k$，得 $\begin{cases}4a+k=0,\\9a+k=5,\end{cases}$ 解得 $a=1,\ k=-4$。所以抛物线的表达式为 $y=(x-2)^2-4$。'
    question_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/005.png, box: [150, 815, 970, 1450], file: source-question.png}]
    solution_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/011.png, box: [150, 640, 950, 1400], file: official-solution-01.png}]

  - id: Q022
    source_key: 2025-BAOSHAN-YIMO-Q22
    question_number: 22
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [正方形, 相似三角形, 锐角三角比]
    stem_latex: |
      如图11，正方形 $ABCD$ 的边长是3，点 $E$、$F$ 分别在边 $AD$、$CD$ 上，$\angle EBF=45^\circ$，$BE$、$BF$ 分别与对角线 $AC$ 交于点 $G$、$H$。
      \begin{enumerate}
      \item 当 $\angle ABE=$ \underline{\hspace{2cm}} 时，$AG=CH$，先补全条件，再说明理由；
      \item 如果 $CH=\sqrt2$，求 $BG$ 的长。
      \end{enumerate}
    answer: '（1）$22.5^\circ$；（2）$BG=\dfrac{3\sqrt{10}}4$。'
    official_solution_latex:
      - title: 第（1）问
        content: '$\angle ABE=22.5^\circ$。在正方形 $ABCD$ 中，$AB=BC$，$\angle BAD=\angle BCD=90^\circ$，且 $\angle BAG=\angle EAG=\dfrac12\angle BAD$，$\angle BCH=\dfrac12\angle BCD$。又 $\angle ABC=90^\circ$，$\angle EBF=45^\circ$，$\angle ABE=22.5^\circ$，所以 $\angle CBH=22.5^\circ$。于是 $\angle BAG=\angle BCH=45^\circ$，且 $\angle ABG=\angle CBH$，故 $\triangle ABG\cong\triangle CBH$，所以 $AG=CH$。'
      - title: 第（2）问
        content: '过点 $H$ 作 $HM\perp BC$，垂足为点 $M$。在 $\mathrm{Rt}\triangle HMC$ 中，$\angle BCH=45^\circ$，$CH=\sqrt2$，所以 $HM=CM=1$，$BM=BC-CM=2$，从而 $\sin\angle HBM=\dfrac{HM}{BM}=\dfrac12$。在 $\mathrm{Rt}\triangle BCF$ 中，$\sin\angle FBC=\dfrac{CF}{BC}=\dfrac12$，所以 $CF=\dfrac32$。又 $\angle BCH=\angle EBF=45^\circ$，$\angle AGE=\angle BGH$，所以 $\triangle BGH\sim\triangle CFH$。由相似关系得 $\dfrac{BG}{CF}=\dfrac{BH}{CH}=\dfrac{\sqrt5}{\sqrt2}$，故 $BG=\dfrac{3\sqrt{10}}4$。'
    question_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/006.png, box: [150, 100, 970, 760], file: source-question.png}]
    prompt_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/006.png, box: [570, 390, 950, 740], file: prompt-01.png, width: 72mm}]
    solution_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/012.png, box: [150, 100, 950, 1400], file: official-solution-01.png}]

  - id: Q023
    source_key: 2025-BAOSHAN-YIMO-Q23
    question_number: 23
    question_type: problem
    section_title: 三、解答题
    points: 12
    difficulty: challenge
    skill_tags: [相似四边形, 面积比, 矩形]
    stem_latex: |
      学完“相似三角形”之后，小明和同学尝试探索相似四边形的判定与性质。定义：如果两个四边形的四个角对应相等，四条边对应成比例，那么这两个四边形相似；两个相似四边形对应边的比叫做相似比。

      他们提出猜想：①四条边对应成比例，且有一组角对应相等的两个四边形相似；②三个角对应相等，且有两条相邻的边对应成比例的两个四边形相似；③相似四边形面积的比等于相似比的平方。
      \begin{enumerate}
      \item 请完成猜想③的证明：已知四边形 $ABCD$ 与四边形 $A'B'C'D'$ 相似，点 $A$、$B$、$C$、$D$ 分别与点 $A'$、$B'$、$C'$、$D'$ 对应，相似比为 $k$。求证：$\dfrac{S_{\text{四边形 }ABCD}}{S_{\text{四边形 }A'B'C'D'}}=k^2$；
      \item 如图12，已知矩形 $ABCD$，$E$、$F$ 分别是 $AD$、$AB$ 上的点，$AE=\dfrac12AB$，$AF=\dfrac12AD$，联结 $BE$、$DF$ 交于点 $G$，求 $\dfrac{S_{\text{四边形 }AEGF}}{S_{\text{四边形 }CDGB}}$ 的值。
      \end{enumerate}
    answer: '（1）见证明；（2）$\dfrac14$。'
    official_solution_latex:
      - title: 第（1）问
        content: '联结 $BD$、$B''D''$。因为四边形 $ABCD$ 与四边形 $A''B''C''D''$ 相似，所以 $\angle A=\angle A''$，且 $\dfrac{AB}{A''B''}=\dfrac{AD}{A''D''}=k$，从而 $\triangle ABD\sim\triangle A''B''D''$，故 $\dfrac{S_{\triangle ABD}}{S_{\triangle A''B''D''}}=k^2$。同理 $\dfrac{S_{\triangle BCD}}{S_{\triangle B''C''D''}}=k^2$。所以 $\dfrac{S_{\triangle ABD}+S_{\triangle BCD}}{S_{\triangle A''B''D''}+S_{\triangle B''C''D''}}=k^2$，即 $\dfrac{S_{\text{四边形 }ABCD}}{S_{\text{四边形 }A''B''C''D''}}=k^2$。'
      - title: 第（2）问
        content: '在矩形 $ABCD$ 中，$\angle A=\angle C=90^\circ$，$AD\parallel BC$，$AB\parallel CD$，$AD=BC$，$AB=CD$。由平行线得 $\angle AEG=\angle CBG$，$\angle AFG=\angle CDG$。又 $\dfrac{AE}{AB}=\dfrac12$，$\dfrac{AF}{AD}=\dfrac12$，所以 $\dfrac{AE}{CD}=\dfrac{AF}{BC}=\dfrac12$。由角关系可得四边形 $AEGF$ 与四边形 $CDGB$ 相似，相似比为 $\dfrac12$，故 $\dfrac{S_{\text{四边形 }AEGF}}{S_{\text{四边形 }CDGB}}=(\dfrac12)^2=\dfrac14$。'
    question_crops:
      - {source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/006.png, box: [150, 750, 970, 1450], file: source-question-01.png}
      - {source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/007.png, box: [150, 100, 970, 1450], file: source-question-02.png}
