  - id: Q024
    source_key: 2025-BAOSHAN-YIMO-Q24
    question_number: 24
    question_type: problem
    section_title: 三、解答题
    points: 12
    difficulty: challenge
    skill_tags: [二次函数, 全等三角形, 相似三角形]
    stem_latex: |
      如图13，在平面直角坐标系 $xOy$ 中，已知抛物线 $y=ax^2+4$ 的顶点为 $D$，点 $A$、$B$ 在抛物线上，且都在 $y$ 轴右侧，横坐标分别是 $m$、$m+1$。
      \begin{enumerate}
      \item 联结 $AD$、$BD$，求 $\cot\angle ODA-\cot\angle ODB$ 的值（结果用含 $a$ 的代数式表示）；
      \item 如果 $y$ 轴上存在点 $C$，使得 $AC\perp BC$，且 $AC=BC$：
      \begin{enumerate}
      \item 求抛物线的表达式；
      \item 若 $AB=\sqrt{10}$，点 $E$ 在 $y$ 轴上，且 $\triangle ADE$ 与 $\triangle ABC$ 相似，求点 $E$ 的坐标。
      \end{enumerate}
      \end{enumerate}
    answer: '（1）$a$；（2）①$y=-x^2+4$；②$E(0,3)$或$E(0,2)$。'
    official_solution_latex:
      - title: 第（1）问
        content: '过点 $A$ 作 $AG\perp y$ 轴，垂足为点 $G$。根据题意可得 $D(0,4)$，$A(m,am^2+4)$，$G(0,am^2+4)$，所以 $AG=m$，$DG=-am^2$。在 $\mathrm{Rt}\triangle AGD$ 中，$\cot\angle ODA=\dfrac{DG}{AG}=-am$。同理 $\cot\angle ODB=-a(m+1)$。所以 $\cot\angle ODA-\cot\angle ODB=a$。'
      - title: 第（2）问①
        content: '过点 $A$ 作 $AM\perp y$ 轴，垂足为点 $M$；过点 $B$ 作 $BN\perp y$ 轴，垂足为点 $N$。由 $\angle AMC=\angle BNC=90^\circ$，$AC\perp BC$，$AC=BC$，得 $\triangle AMC\cong\triangle BNC$。所以 $AM=CN=m$，$CM=BN=m+1$，$MN=2m+1$。又 $MN=am^2+4-[a(m+1)^2+4]=-a(2m+1)$，所以 $a=-1$，抛物线为 $y=-x^2+4$。'
      - title: 第（2）问②
        content: '由 $A(m,-m^2+4)$、$B(m+1,-(m+1)^2+4)$，且 $AB=\sqrt{10}$，解得 $m=1$（负值不合题意，舍去）。所以 $A(1,3)$，$B(2,0)$，$C(1,0)$。由 $\triangle ADE$ 与 $\triangle ABC$ 相似分类讨论，可得 $E(0,3)$ 或 $E(0,2)$。'
    question_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/008.png, box: [150, 100, 970, 1450], file: source-question.png}]
    prompt_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/008.png, box: [210, 570, 530, 1050], file: prompt-01.png, width: 72mm}]
    solution_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/014.png, box: [150, 100, 950, 1400], file: official-solution-01.png}]

  - id: Q025
    source_key: 2025-BAOSHAN-YIMO-Q25
    question_number: 25
    question_type: problem
    section_title: 三、解答题
    points: 14
    difficulty: challenge
    skill_tags: [相似三角形, 解直角三角形, 分类讨论]
    stem_latex: |
      如图14，已知 $\triangle ABC$ 中，$\angle ACB=90^\circ$，$BC=2$，$AC=3$，点 $E$、$F$ 分别在边 $AC$、$AB$ 上（不与端点重合），$BE\perp CF$，垂足为点 $D$。
      \begin{enumerate}
      \item 当 $CE=1$ 时，求 $AF$ 的长；
      \item 当 $BE=CF$ 时，求 $\tan\angle CBE$ 的值；
      \item 联结 $EF$，如果 $\triangle AEF$ 是直角三角形，求这时四边形 $BCEF$ 的面积。
      \end{enumerate}
    answer: '（1）$AF=\dfrac{3\sqrt{13}}7$；（2）$\tan\angle CBE=3$；（3）$\dfrac{4\sqrt{13}-8}{3}$或$\dfrac{44\sqrt{10}-80}{27}$。'
    official_solution_latex:
      - title: 第（1）问
        content: '过点 $F$ 作 $FG\perp AC$，垂足为点 $G$。由角关系得 $\angle1=\angle3$，且 $\angle FGC=\angle ECB=90^\circ$，所以 $\triangle FGC\sim\triangle ECB$，得 $\dfrac{FG}{GC}=\dfrac{CE}{BC}=\dfrac12$。设 $FG=x$，则 $GC=2x$，$AG=3-2x$。在 $\mathrm{Rt}\triangle ABC$ 中，$AB=\sqrt{13}$。又 $\triangle AFG\sim\triangle ACB$，所以 $\dfrac{x}{2}=\dfrac{3-2x}{3}=\dfrac{AF}{\sqrt{13}}$，解得 $x=\dfrac67$，所以 $AF=\dfrac{3\sqrt{13}}7$。'
      - title: 第（2）问
        content: '由角关系和 $BE=CF$ 可得 $\triangle FGC\cong\triangle ECB$，所以 $GC=BC=2$，$FG=CE$。由 $\triangle AFG\sim\triangle ACB$，得 $\dfrac{FG}{BC}=\dfrac{AG}{AC}$，即 $\dfrac{FG}{2}=\dfrac{3-2}{3}$，所以 $FG=\dfrac23$，$CE=\dfrac23$。在 $\mathrm{Rt}\triangle ECB$ 中，$\cot\angle CBE=\dfrac{CE}{BC}=\dfrac13$，故 $\tan\angle CBE=3$。'
      - title: 第（3）问
        content: '分类讨论。①当 $\angle AFE=90^\circ$ 时，可得 $EF=EC=x$，$AE=3-x$，且 $BF=BC=2$。由 $x^2+(\sqrt{13}-2)^2=(3-x)^2$，解得 $x=\dfrac{2\sqrt{13}-4}{3}$，所以 $S_{\text{四边形 }BCEF}=3-\dfrac{(\sqrt{13}-2)^2}{3}=\dfrac{4\sqrt{13}-8}{3}$。②当 $\angle AEF=90^\circ$ 时，可得 $EC=\sqrt2x$，$AE=3-\sqrt2x$，并由相似关系解得 $x=\dfrac{22-4\sqrt{10}}9$。所以 $S_{\text{四边形 }BCEF}=3-\dfrac{(11-2\sqrt{10})^2}{27}=\dfrac{44\sqrt{10}-80}{27}$。'
    question_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/009.png, box: [150, 100, 970, 1450], file: source-question.png}]
