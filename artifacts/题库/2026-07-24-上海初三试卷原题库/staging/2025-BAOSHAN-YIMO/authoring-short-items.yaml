  - id: Q017
    source_key: 2025-BAOSHAN-YIMO-Q17
    question_number: 17
    question_type: fillin
    section_title: 二、填空题
    points: 4
    difficulty: standard
    skill_tags: [二次函数, 零点]
    stem_latex: '一个二次函数的图像经过点 $(t,0)$，则称 $t$ 的值是这个函数的“零点”。例如二次函数 $y=a(x-3)(x+2)\ (a\ne0)$，无论 $a$ 取何值，这个函数的图像总经过点 $(3,0)$ 和点 $(-2,0)$，所以3和$-2$是这个函数的“零点”。如果一个二次函数有且只有一个“零点”$-1$，那么这个二次函数的解析式可以是 \underline{\hspace{2cm}}。（写出一个符合要求的函数解析式即可）'
    answer: '$y=(x+1)^2$（答案不唯一）'
    official_solution_latex: '参考答案：$y=(x+1)^2$ 等。'
    question_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/004.png, box: [150, 310, 970, 540], file: source-question.png}]
    solution_crops: [{source: documents/初三/2025届-上海市宝山区-初三一模数学-试卷及参考答案/010.png, box: [550, 475, 740, 535], file: official-solution-01.png}]

  - id: Q018
    source_key: 2025-BAOSHAN-YIMO-Q18
    question_number: 18
    question_type: fillin
    section_title: 二、填空题
    points: 4
    difficulty: challenge
    skill_tags: [旋转, 直角三角形, 分类讨论]
