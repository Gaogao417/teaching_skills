    points: 4
    difficulty: challenge
    skill_tags: [正方形, 黄金分割, 面积比]
    stem_latex: |
      如图2，已知 $\triangle ABC$，$\angle ACB=90^\circ$，$BC=2AC$，延长 $AC$ 至点 $D$，使 $AD=AB$，以 $CD$ 为边作正方形 $CDEF$，联结 $BD$、$BE$，$BD$ 交 $EF$ 于点 $G$。某同学得到以下两个结论：
