    stem_latex: 在平面直角坐标系中，如果两条抛物线关于直线 $x=m$ 对称，那么称一条抛物线为另一条抛物线关于直线 $x=m$ 的镜像抛物线。（1）如图11，已知抛物线 $y=x^2-2x$，顶点为 $A$。①求该抛物线关于 $y$ 轴的镜像抛物线表达式；②已知该抛物线关于直线 $x=m$ 的镜像抛物线顶点为 $B$，如果 $\tan\angle OBA=\frac14$（锐角），求 $m$；（2）抛物线 $y=\frac14x^2+bx+c$（$b>0$）的顶点为 $C$，它的一条镜像抛物线顶点为 $D$，两抛物线交于 $E(2,1)$。如果 $\triangle CDE$ 是直角三角形，求该抛物线表达式。
