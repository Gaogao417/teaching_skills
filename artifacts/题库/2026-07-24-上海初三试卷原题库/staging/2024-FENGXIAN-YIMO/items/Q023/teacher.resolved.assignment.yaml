  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图10，在 $\triangle ABC$ 中，$AB=AC$，点 $D$ 在边 $BC$ 上，已知 $\angle AFD=\angle B$，边 $DF$ 交 $AC$ 于点 $E$。（1）求证：$AF\cdot CE=CD\cdot FE$；（2）联结 $AD$，如果 $\frac{AB}{AF}=\frac{BC}{DF}$，求证：$AD^2=AE\cdot AC$。
    answer: 见证明。
    solution_steps:
    - title: 第（1）问
      content: $\because AB=AC$，$\therefore\angle B=\angle C$。又 $\angle AFD=\angle B$，所以 $\angle AFD=\angle C$。由 $\angle AEF=\angle DEC$，得 $\triangle AEF\sim\triangle DEC$，所以 $\frac{AF}{CD}=\frac{EF}{CE}$，故 $AF\cdot CE=CD\cdot FE$。
    - title: 第（2）问
      content: 由 $\frac{AB}{AF}=\frac{BC}{DF}$ 且 $\angle AFD=\angle B$，得 $\triangle ABC\sim\triangle AFD$，所以 $\angle ADF=\angle C$。又 $\angle CAD=\angle DAE$，得 $\triangle ADE\sim\triangle ACD$，所以 $\frac{AE}{AD}=\frac{AD}{AC}$，故 $AD^2=AE\cdot AC$。
