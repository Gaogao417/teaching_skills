  section_title: 三、解答题
  stem_latex: 如图8，在 $\triangle ABC$ 中，$G$ 是 $\triangle ABC$ 的重心，联结 $AG$ 并延长交 $BC$ 于点 $D$。（1）如果 $\overrightarrow{AB}=\vec a$，$\overrightarrow{AC}=\vec b$，那么 $\overrightarrow{AD}=$\fillin（用向量 $\vec a,\vec b$ 表示）；（2）已知 $AD=6,AC=8$，点 $E$ 在边 $AC$ 上，且 $\angle AGE=\angle C$，求 $AE$ 的长。
  answer: （1）$\frac12\vec a+\frac12\vec b$；（2）3。
  official_solution_latex:
  - title: 第（1）问
    content: $\overrightarrow{AD}=\frac12\vec a+\frac12\vec b$。
  - title: 第（2）问
    content: "$\\because$ 点 $G$ 是重心，$\\therefore AG=2DG$，即 $AG=\\frac23AD=4$。又 $\\angle AGE=\\angle C,\angle A=\angle A$，所以 $\\triangle AEG\\sim\\triangle ACD$，故 $\\frac{AG}{AC}=\\frac{AE}{AD}$，得 $AE=3$。"
