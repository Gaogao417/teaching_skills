- id: Q020
  source_key: 2024-FENGXIAN-YIMO-Q20
  question_number: 20
  question_type: problem
  points: 10
  section_title: 三、解答题
  stem_latex: 已知抛物线 $y=x^2+bx+c$ 经过点 $A(3,0)$、$B(0,-3)$。（1）求抛物线表达式并写出顶点坐标；（2）联结 $AB$，与该抛物线的对称轴交于点 $P$，求点 $P$ 的坐标。
  answer: （1）$y=x^2-2x-3$，顶点 $(1,-4)$；（2）$P(1,-2)$。
  official_solution_latex:
  - title: 第（1）问
    content: 将 $A(3,0),B(0,-3)$ 代入，得 $c=-3,\ 9-3b+c=0$，解得 $b=-2,c=-3$。所以 $y=x^2-2x-3$，顶点坐标为 $(1,-4)$。
  - title: 第（2）问
    content: 直线 $AB$ 为 $y=x-3$，抛物线对称轴为 $x=1$，所以交点 $P(1,-2)$。
