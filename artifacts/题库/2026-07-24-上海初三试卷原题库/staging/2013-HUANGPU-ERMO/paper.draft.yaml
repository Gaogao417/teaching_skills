        page_number: 36
    block:
      stem_latex: 已知二次函数 $y=-x^{2}+bx+c$ 的图象经过点 $P(0,1)$ 与 $Q(2,-3)$。(1) 求此二次函数的解析式；(2) 若点 $A$ 是第一象限内该二次函数图象上一点，过点 $A$ 作 $x$ 轴的平行线交二次函数图象于点 $B$，分别过点 $B$、$A$ 作 $x$ 轴的垂线，垂足分别为 $C$、$D$，且所得四边形 $ABCD$ 恰为正方形。①求正方形 $ABCD$ 的面积；②联结 $PA$、$PD$，$PD$ 交 $AB$ 于点 $E$，求证：$\triangle PAD\sim \triangle PEA$。
      answer: (1) $y=-x^{2}+1$；(2)① 面积为 $12-8\sqrt{2}$；② 得证 $\triangle PAD\sim \triangle PEA$
      clue: 二次函数综合题；待定系数法；正方形性质；相似三角形的判定
      solution_steps:
      - (1) $\because$ 二次函数 $y=-x^{2}+bx+c$ 的图象经过 $P(0,1)$ 与 $Q(2,-3)$，$\therefore \begin{cases} c=1 \\ -4+2b+c=-3 \end{cases}$，解得 $b=0$，$c=1$，$\therefore$ 解析式为 $y=-x^{2}+1$
      - (2)① $\because$ 二次函数图象关于 $y$ 轴对称，$\therefore$ 正方形 $ABCD$ 关于 $y$ 轴对称。设 $A(m,2m)$，则 $-m^{2}+1=2m$，解得 $m=\sqrt{2}-1$（舍去负值），正方形边长 $2m=2\sqrt{2}-2$，面积 $=(2\sqrt{2}-2)^{2}=12-8\sqrt{2}$
      - (2)② 设 $AB$ 与 $y$ 轴交于点 $F$。$A(\sqrt{2}-1,2\sqrt{2}-2)$，$AF=\sqrt{2}-1$，$PF=1-(2\sqrt{2}-2)=3-2\sqrt{2}$。$\frac{PF}{AF}=\frac{3-2\sqrt{2}}{\sqrt{2}-1}=\sqrt{2}-1=\frac{OD}{OP}$，$\therefore \triangle APF\sim \triangle PDO$，$\therefore \angle PAF=\angle DPO$
      - $\because AD\parallel y$ 轴，$\therefore \angle DPO=\angle ADP$，$\therefore \angle PAF=\angle ADP$。又 $\angle APE=\angle DPA$，$\therefore \triangle PAD\sim \triangle PEA$
