    block:
      stem_latex: 如图，在梯形 $ABCD$ 中，$AD=BC=10$，$\tan D=\frac{4}{3}$，$E$ 是腰 $AD$ 上一点，且 $AE:ED=1:3$。(1) 当 $AB:CD=1:3$ 时，求梯形 $ABCD$ 的面积；(2) 当 $\angle ABE=\angle BCE$ 时，求线段 $BE$ 的长；(3) 当 $\triangle BCE$ 是直角三角形时，求边 $AB$ 的长。
      answer: (1) 面积为96；(2) $BE=5$；(3) $AB=\frac{7}{6}$ 或 $\sqrt{21}-\frac{9}{2}$
      clue: 四边形综合题；等腰梯形性质；相似三角形；勾股定理；分类讨论
      solution_steps:
      - (1) 作梯形的高 $AH$、$BG$。$\because AD=10$，$\tan D=\frac{4}{3}$，$\therefore \frac{AH}{DH}=\frac{4}{3}$。设 $AH=4t$，$DH=3t$，则 $AD=5t=10$，$t=2$，$\therefore DH=6$，$AH=8$，同理 $BG=8$，$CG=6$。由 $AB:CD=1:3$ 设 $AB=x$，$CD=3x$，$6+x+6=3x$，$x=6$，面积 $=\frac{1}{2}(AB+CD)\cdot AH=\frac{1}{2}\times 24\times 8=96$
      - (2) 作 $EK\parallel CD$ 交 $BC$ 于 $K$。$\because AE:ED=1:3$，$AD=10$，$\therefore AE=\frac{5}{2}$，$ED=\frac{15}{2}$。$\because AB\parallel CD$，$\therefore \angle ABE=\angle BEK$，又 $\angle ABE=\angle BCE$，$\therefore \angle BEK=\angle BCE$，$\triangle BEK\sim \triangle BCE$，$BE^{2}=BK\cdot BC$
      - 梯形 $ABCD$ 为等腰梯形，$BK=AE=\frac{5}{2}$，$\therefore BE^{2}=\frac{5}{2}\times 10$，$BE=5$
      - (3)① 当 $\angle EBC=90^{\circ}$ 时，延长 $BE$ 交 $CD$ 延长线于 $F$。$AB:DF=AE:ED=1:3$，$DF=3AB$。设 $AB=x$，$HG=x$，Rt$\triangle FBG\sim$ Rt$\triangle BGC$，$BG^{2}=GF\cdot GC$，即 $8^{2}=(3x+6+x)\times 6$，解得 $x=\frac{7}{6}$
      - (3)② 当 $\angle CEB=90^{\circ}$ 时，延长 $BE$ 交 $CD$ 延长线于 $F$，作 $EN\perp CD$ 于 $N$。设 $AB=x$，$DF=3x$，$DC=12+x$。在 Rt$\triangle EDN$ 中，$EN=6$，$DN=\frac{9}{2}$，$NC=x+\frac{15}{2}$。Rt$\triangle FEN\sim$ Rt$\triangle ECN$，$EN^{2}=NF\cdot NC$，即 $6^{2}=(3x+\frac{9}{2})(x+\frac{15}{2})$，解得 $AB=\sqrt{21}-\frac{9}{2}$
      - $\therefore$ 边 $AB$ 的长为 $\frac{7}{6}$ 或 $\sqrt{21}-\frac{9}{2}$
