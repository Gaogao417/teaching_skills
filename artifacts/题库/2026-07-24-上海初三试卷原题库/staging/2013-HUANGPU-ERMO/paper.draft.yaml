    block:
      stem_latex: 如图，$MN$ 是 $\odot O$ 的直径，点 $A$ 是弧 $\widehat{MN}$ 的中点，$\odot O$ 的弦 $AB$ 交直径 $MN$ 于点 $C$，且 $\angle ACO=2\angle CAO$。(1) 求 $\angle CAO$ 的度数；(2) 若 $\odot O$ 的半径长为 $\sqrt{3}$，求 $AB$ 的长。
      answer: (1) $\angle CAO=30^{\circ}$；(2) $AB=3$
      clue: 圆周角定理；垂径定理；勾股定理
      solution_steps:
      - (1) $\because MN$ 是 $\odot O$ 的直径，点 $A$ 是弧 $\widehat{MN}$ 的中点，$\therefore \angle AOM=\frac{1}{4}\times 360^{\circ}=90^{\circ}$，$\therefore \angle ACO+\angle CAO=90^{\circ}$。$\because \angle ACO=2\angle CAO$，$\therefore 3\angle CAO=90^{\circ}$，$\angle CAO=30^{\circ}$
      - (2) 过点 $O$ 作 $OD\perp AB$ 于点 $D$。$\because O$ 是圆心，$\therefore AD=\frac{1}{2}AB$。在 Rt$\triangle AOD$ 中，$OA=\sqrt{3}$，$\angle CAO=30^{\circ}$，$AD=OA\cdot \cos 30^{\circ}=\sqrt{3}\times \frac{\sqrt{3}}{2}=\frac{3}{2}$，$\therefore AB=2AD=3$
