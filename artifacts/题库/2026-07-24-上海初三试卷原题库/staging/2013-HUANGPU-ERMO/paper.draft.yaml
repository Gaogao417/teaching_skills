    official_solution:
      start_anchor: 运用待定系数法
      end_anchor: 客车60、轿车90千米/小时
      word_evidence:
      - page_image: documents/初三/2013届-上海市黄浦区-初三二模数学-试卷及参考答案/word/pages/028.png
        page_number: 28
