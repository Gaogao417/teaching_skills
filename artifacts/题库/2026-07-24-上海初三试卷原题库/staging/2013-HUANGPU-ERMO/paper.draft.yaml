      - page_image: documents/初三/2013届-上海市黄浦区-初三二模数学-试卷及参考答案/word/pages/033.png
        page_number: 33
    block:
      stem_latex: 如图，在梯形 $ABCD$ 中，$AD\parallel BC$，$AB=CD$，对角线 $AC$ 与 $BD$ 交于点 $O$，$OE\perp BC$，垂足是 $E$。(1) 求证：$E$ 是 $BC$ 的中点；(2) 若在线段 $BO$ 上存在点 $P$，使得四边形 $AOEP$ 为平行四边形，求证：四边形 $ABED$ 是平行四边形。
      answer: (1)(2) 均得证
      clue: 全等三角形的判定与性质；等腰梯形的性质；平行四边形的判定
      solution_steps:
      - (1) 在梯形 $ABCD$ 中，$AD\parallel BC$，$AB=CD$，$\therefore AC=DB$。在 $\triangle ABC$ 和 $\triangle DCB$ 中，$AB=DC$，$AC=DB$，$BC=CB$，$\therefore \triangle ABC\cong \triangle DCB$ (SSS)，$\therefore \angle ACB=\angle DBC$，$\therefore OB=OC$。$\because OE\perp BC$，$\therefore$ 点 $E$ 是 $BC$ 的中点（三线合一）
      - (2) $\because$ 四边形 $AOEP$ 是平行四边形，$\therefore AP=OE$。在 $\triangle APD$ 和 $\triangle EOB$ 中，$\angle ADP=\angle EBO$，$\angle APD=\angle EOB$，$AP=EO$，$\therefore \triangle APD\cong \triangle EOB$ (AAS)，$\therefore AD=BE$
      - 又 $\because AD\parallel BC$，$\therefore$ 四边形 $ABED$ 是平行四边形
