    block:
      stem_latex: 解方程组 $\begin{cases} x^{2}+y^{2}=20 \\ x^{2}-5xy+6y^{2}=0 \end{cases}$。
      answer: $\begin{cases} x_{1}=4 \\ y_{1}=2 \end{cases}$，$\begin{cases} x_{2}=-4 \\ y_{2}=-2 \end{cases}$，$\begin{cases} x_{3}=3\sqrt{2} \\ y_{3}=\sqrt{2} \end{cases}$，$\begin{cases} x_{4}=-3\sqrt{2} \\ y_{4}=-\sqrt{2} \end{cases}$
      clue: 高次方程，因式分解降次为两个方程组
      solution_steps:
      - 原方程组第二个方程可化为 $(x-2y)(x-3y)=0$，即 $x=2y$ 或 $x=3y$，故原方程组可化为 $\begin{cases} x^{2}+y^{2}=20 \\ x=2y \end{cases}$ 或 $\begin{cases} x^{2}+y^{2}=20 \\ x=3y \end{cases}$
      - 解 $x=2y$ 的方程组得 $\begin{cases} x_{1}=4 \\ y_{1}=2 \end{cases}$，$\begin{cases} x_{2}=-4 \\ y_{2}=-2 \end{cases}$
      - 解 $x=3y$ 的方程组得 $\begin{cases} x_{3}=3\sqrt{2} \\ y_{3}=\sqrt{2} \end{cases}$，$\begin{cases} x_{4}=-3\sqrt{2} \\ y_{4}=-\sqrt{2} \end{cases}$
