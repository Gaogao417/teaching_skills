        page_number: 30
    block:
      stem_latex: 如图，线段 $AB$、$CD$ 分别是一辆轿车和一辆客车在行驶过程中油箱内的剩余油量 $y_{1}$（升）、$y_{2}$（升）关于行驶时间 $x$（小时）的函数图象。(1) 分别求 $y_{1}$、$y_{2}$ 关于 $x$ 的函数解析式，并写出定义域；(2) 如果两车同时从相距300千米的甲、乙两地出发，相向而行，匀速行驶，已知轿车的行驶速度比客车的行驶速度快30千米/小时，且当两车在途中相遇时，它们油箱中所剩余的油量恰好相等，求两车的行驶速度。
      answer: (1) $y_{1}=-15x+60\ (0\leqslant x\leqslant 4)$，$y_{2}=-30x+90\ (0\leqslant x\leqslant 3)$；(2) 客车60千米/小时，轿车90千米/小时
      clue: 一次函数的应用；待定系数法；分式方程需检验
      solution_steps:
      - (1) 设线段 $AB$、$CD$ 的解析式分别为 $y_{1}=k_{1}x+b_{1}$，$y_{2}=k_{2}x+b_{2}$。由图象得 $b_{1}=60$，$0=4k_{1}+b_{1}$；$b_{2}=90$，$0=3k_{2}+b_{2}$。解得 $k_{1}=-15$，$b_{1}=60$；$k_{2}=-30$，$b_{2}=90$，$\therefore y_{1}=-15x+60\ (0\leqslant x\leqslant 4)$，$y_{2}=-30x+90\ (0\leqslant x\leqslant 3)$
      - (2) 设客车速度为 $x$ 千米/时，则轿车速度为 $(x+30)$ 千米/时，相遇时间为 $\frac{300}{x+(x+30)}$。轿车每小时耗油 $60\div 4=15$ 升，客车每小时耗油 $90\div 3=30$ 升
      - 相遇时剩余油量相等：$90-30\times \frac{300}{x+(x+30)}=60-15\times \frac{300}{x+(x+30)}$，解得 $x=60$，经检验 $x=60$ 是原方程的解，轿车速度为 $60+30=90$ 千米/时
      - 答：客车60千米/小时，轿车90千米/小时
