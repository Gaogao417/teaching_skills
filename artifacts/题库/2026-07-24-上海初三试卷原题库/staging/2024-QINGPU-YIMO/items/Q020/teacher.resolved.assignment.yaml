  - type: problem
    id: Q020
    points: 10
    stem_latex: 如图，在梯形 $ABCD$ 中，$AD\parallel BC$，对角线 $AC、BD$ 相交于点 $O$，$BC=2AD$，$OD=1$。（1）求
      $BD$ 的长；（2）设 $\overrightarrow{AB}=\vec a$，$\overrightarrow{BC}=\vec b$，用 $\vec
      a、\vec b$ 表示向量 $\overrightarrow{OB}$。
    answer: （1）$BD=3$；（2）$\overrightarrow{OB}=\dfrac23\vec b-\vec a$。
    solution_steps:
    - title: 官方解答
      content: （1）$\because AD\parallel BC$，$\therefore\dfrac{AD}{BC}=\dfrac{OD}{OB}$。又
        $BC=2AD$，故 $OD:OB=1:2$。由 $OD=1$ 得 $OB=2$，所以 $BD=3$。（2）$\overrightarrow{AD}=\dfrac12\vec
        b$，$\overrightarrow{DB}=\vec b-\vec a$，且 $\overrightarrow{OB}=\dfrac23\overrightarrow{DB}=\dfrac23\vec
        b-\vec a$。
