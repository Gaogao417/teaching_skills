  blocks:
  - type: problem
    id: Q024
    points: 12
    stem_latex: 如图，在平面直角坐标系 $xOy$ 中，抛物线 $y=ax^2+bx+1$ 经过点 $A(1,2)$ 和点 $B(2,1)$，与 $y$
      轴交于点 $C$。（1）求 $a、b$ 的值和点 $C$ 的坐标；（2）点 $P$ 在该抛物线上，当 $\angle PCB=\angle ACB$ 时，求点
      $P$ 的坐标；（3）在（2）的条件下，平移该抛物线，使其顶点在射线 $CA$ 上，设平移后的抛物线的顶点为点 $D$，当 $\triangle CDP$
      与 $\triangle CAP$ 相似时，求平移后的抛物线的表达式。
    answer: （1）$a=-1,b=2,C(0,1)$；（2）$P(3,-2)$；（3）$y=-x^2+18x-71$。
    solution_steps:
    - title: 官方解答
      content: （1）代入 $A、B$ 得 $a+b+1=2$，$4a+2b+1=1$，解得 $a=-1,b=2$；$C=(0,1)$。（2）由角条件及抛物线方程求得
        $P=(3,-2)$。（3）相似关系给出顶点 $D=(9,10)$，故平移后的抛物线为 $y=-x^2+18x-71$。
