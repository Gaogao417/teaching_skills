    stem_latex: 如图，在平面直角坐标系 $xOy$ 中，抛物线 $y=ax^2+bx+1$ 经过点 $A(1,2)$ 和点 $B(2,1)$，与 $y$ 轴交于点 $C$。（1）求 $a、b$ 的值和点 $C$ 的坐标；（2）点 $P$ 在该抛物线上，当 $\angle PCB=\angle ACB$ 时，求点 $P$ 的坐标；（3）在（2）的条件下，平移该抛物线，使其顶点在射线 $CA$ 上，设平移后的抛物线的顶点为点 $D$，当 $\triangle CDP$ 与 $\triangle CAP$ 相似时，求平移后的抛物线的表达式。
