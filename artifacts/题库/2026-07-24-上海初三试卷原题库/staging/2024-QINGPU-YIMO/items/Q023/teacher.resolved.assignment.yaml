  - type: problem
    id: Q023
    points: 12
    stem_latex: 已知，如图，在 $\triangle ABC$ 中，点 $D、E$ 分别在边 $BC、AB$ 上，$AD$ 与 $CE$ 相交于点
      $F$，$CD=CF$，$AC^2=AE\cdot AB$。（1）求证：$\triangle ABD\sim\triangle ACF$；（2）如果 $\angle
      CFD=2\angle ACF$，求证：$AB\cdot EF=AD\cdot AE$。
    answer: 见官方证明。
    solution_steps:
    - title: 官方解答
      content: （1）由 $AC^2=AE\cdot AB$ 得 $AC/AB=AE/AC$，又 $\angle BAC=\angle CAE$，所以
        $\triangle ACB\sim\triangle AEC$，继而结合 $CD=CF$ 得 $\angle BDA=\angle CFA$，故
        $\triangle ABD\sim\triangle ACF$。（2）由（1）及 $\angle CFD=2\angle ACF$ 推得 $\triangle
        AEF\sim\triangle ECA$，从而 $AB/AD=AE/EF$，即 $AB\cdot EF=AD\cdot AE$。
