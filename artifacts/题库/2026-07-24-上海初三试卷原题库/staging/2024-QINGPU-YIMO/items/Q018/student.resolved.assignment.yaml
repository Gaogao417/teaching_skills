    stem_latex: 规定：平面上一点到一个图形的距离是指这点与这个图形上各点的距离中最短的距离。如图②，在 $\triangle ABC$ 中，$\angle C=90^\circ$，$AC=3\sqrt5$，$\tan B=2$，点 $D$ 为边 $AC$ 上一点，$AD=2DC$。如果点 $Q$ 为边 $AB$ 上一点，且点 $Q$ 到线段 $DC$ 的距离不超过 $\dfrac{6\sqrt5}{5}$，设 $AQ$ 的长为 $d$，那么 $d$ 的取值范围为 $\fillin$。
