  - type: problem
    id: Q022
    points: 10
    stem_latex: 北淀浦河上的浦仓路桥是一座融合江南水乡文化气息的现代空间钢结构人行廊桥。某校九年级数学兴趣小组开展了测量“浦仓路桥顶部到水面的距离”的实践活动。如图，在河的一侧选取 $B、C$ 两点，在 $B$ 处测得浦仓路桥顶部点 $A$ 的仰角为 $22^\circ$，再往桥顶所在方向前进17米至 $C$ 处，在 $C$ 处测得点 $A$ 的仰角为 $37^\circ$；在 $D$ 处测得地面 $BD$ 到水面 $EF$ 的距离 $DE$ 为1.2米（点 $B、C、D$ 在一条直线上，$BD\parallel EF$，$DE\perp EF$，$AF\perp EF$）。求浦仓路桥顶部 $A$ 到水面的距离 $AF$（精确到0.1米）。参考数据：$\sin22^\circ\approx0.37$，$\cos22^\circ\approx0.93$，$\tan22^\circ\approx0.40$；$\sin37^\circ\approx0.60$，$\cos37^\circ\approx0.80$，$\tan37^\circ\approx0.75$。
