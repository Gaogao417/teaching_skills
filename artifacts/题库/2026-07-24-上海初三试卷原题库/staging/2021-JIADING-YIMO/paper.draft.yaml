      - (1) $\because AD\parallel BC$，$\therefore \triangle AOD\sim\triangle COB$，$\therefore \frac{S_{\triangle AOD}}{S_{\triangle COB}}=(\frac{OA}{OC})^{2}=\frac{4}{9}$，解得 $\frac{OA}{OC}=\frac{2}{3}$。
      - $\therefore \frac{S_{\triangle AOB}}{S_{\triangle BOC}}=\frac{OA}{OC}=\frac{2}{3}$，即 $\frac{S_{\triangle ABO}}{9}=\frac{2}{3}$，解得 $S_{\triangle ABO}=6$。
      - (2) $\because S_2$ 是 $S_1$ 与 $S_3$ 的比例中项，$\therefore \frac{S_{\triangle AOB}}{S_{\triangle AOD}}=\frac{S_{\triangle BOC}}{S_{\triangle AOB}}$，$\therefore \frac{OB}{OD}=\frac{OC}{OA}$，$\therefore AD\parallel BC$。
