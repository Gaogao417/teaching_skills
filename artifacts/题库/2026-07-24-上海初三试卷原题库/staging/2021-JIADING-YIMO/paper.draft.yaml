    block:
      stem_latex: 我们已经知道二次函数 $y=ax^{2}+bx+c(a\neq0)$ 的图象是一条抛物线，研究二次函数的图象与性质，我们主要关注抛物线的对称轴、抛物线的开口方向、抛物线的最高点（或最低点）的坐标、抛物线与坐标轴的交点坐标、抛物线的上升或下降情况（沿 $x$ 轴的正方向看）。已知一个二次函数 $y=ax^{2}+bx+c(a\neq0)$ 的大致图象如图所示。(1) 你可以获得该二次函数的哪些信息？（写出四条信息即可）(2) 依据目前的信息，你可以求出这个二次函数的解析式吗？如果可以，请求出这个二次函数的解析式；如果不可以，请补充一个条件，并求出这个二次函数的解析式。
      answer: $y=-(x-2)^{2}+7$（补充条件如点 $C(0,3)$）
      clue: 由图象读出对称轴、开口、顶点等性质，再用待定系数法求解析式
      solution_steps:
      - (1) 由图象可得：该函数图象的对称轴是直线 $x=2$；抛物线开口向下；抛物线有最高点，最高点的坐标为 $(2,7)$；当 $x<2$ 时 $y$ 随 $x$ 的增大而增大，当 $x>2$ 时 $y$ 随 $x$ 的增大而减小。
      - (2) 依据目前的信息，不可以求出这个二次函数的解析式。补充条件：点 $C$ 的坐标为 $(0,3)$。
      - 设该函数解析式为 $y=a(x-2)^{2}+7$，则 $3=a(0-2)^{2}+7$，解得 $a=-1$。
      - 即该函数解析式为 $y=-(x-2)^{2}+7$。
