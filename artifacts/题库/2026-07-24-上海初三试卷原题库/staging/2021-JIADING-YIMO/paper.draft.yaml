    block:
      stem_latex: 在矩形 $ABCD$ 中，$AB=6$，$AD=8$，点 $E$ 在 $CD$ 边上，$\tan\angle EAD=\frac{1}{2}$。点 $F$ 是线段 $AE$ 上一点，联结 $BF$、$CF$。(1) 如图1，如果 $\tan\angle CBF=\frac{3}{4}$，求线段 $AF$ 的长；(2) 如图2，如果 $CF=\frac{1}{2}BC$，① 求证：$\angle CFE=\angle DAE$；② 求线段 $EF$ 的长。
      answer: (1) $AF=\frac{12\sqrt{5}}{5}$；(2)② $EF=\frac{6\sqrt{5}}{5}$
      clue: 矩形的性质、相似三角形、勾股定理、锐角三角函数，方程思想
      solution_steps:
      - (1) 过点 $F$ 作 $FG\perp AB$ 于 $G$，则 $AD\parallel GF\parallel BC$，$\angle DAE=\angle AFG$。$\because \tan\angle EAD=\frac{1}{2}$，$\therefore \tan\angle AFG=\frac{1}{2}$。
      - 设 $AG=m$，则 $FG=2m$。$\because FG\parallel BC$，$\therefore \angle BFG=\angle CBF$。$\because \tan\angle CBF=\frac{3}{4}$，$\therefore \tan\angle BFG=\frac{BG}{FG}=\frac{3}{4}$，$\therefore BG=\frac{3}{2}m$。
      - $\because AB=AG+BG=6$，$\therefore m+\frac{3}{2}m=6$，$m=\frac{12}{5}$。$\therefore AF=\sqrt{AG^{2}+FG^{2}}=\frac{12\sqrt{5}}{5}$。
      - (2)① 在 Rt$\triangle ADE$ 中，$\tan\angle DAE=\frac{DE}{AD}=\frac{1}{2}$，$\therefore DE=4$，$CE=2$。
      - 延长 $AE$、$BC$ 交于 $H$。$\because AD\parallel BC$，$\therefore \triangle ADE\sim\triangle HCE$，$\therefore \frac{AD}{CH}=\frac{DE}{CE}=\frac{4}{2}$，$\therefore CH=4$。
      - $\because CF=\frac{1}{2}BC=4$，$\therefore CF=CH$，$\therefore \angle H=\angle CFE$。$\because AD\parallel BC$，$\therefore \angle H=\angle DAE$，$\therefore \angle CFE=\angle DAE$。
      - (2)② 过点 $F$ 作 $FP\perp CD$ 于 $P$，则 $\angle PFE=\angle DAE$，$\tan\angle PFE=\frac{1}{2}$。设 $PE=n$，则 $PF=2n$，$CP=n+2$。
      - 在 Rt$\triangle CPF$ 中，$CF=4$，$CF^{2}=PF^{2}+CP^{2}$，即 $16=(2n)^{2}+(n+2)^{2}$，解得 $n=\frac{6}{5}$。$\therefore EF=\sqrt{PE^{2}+PF^{2}}=\frac{6\sqrt{5}}{5}$。
