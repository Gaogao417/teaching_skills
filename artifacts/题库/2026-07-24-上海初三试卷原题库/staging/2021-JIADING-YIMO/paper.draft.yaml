      - $\therefore \frac{GF}{BC}+\frac{EF}{AH}=\frac{AF+FC}{AC}=1$。$\because GF=DE=n\cdot EF$，$\therefore \frac{n\cdot EF}{BC}+\frac{EF}{AH}=1$，$\therefore \frac{n}{BC}+\frac{1}{AH}=\frac{1}{EF}$。
