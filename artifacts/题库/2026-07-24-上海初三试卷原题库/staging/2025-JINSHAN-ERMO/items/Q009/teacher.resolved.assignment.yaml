  - type: short_answer
    id: Q009
    points: 4
    stem_latex: 函数 $f(x)=\dfrac{\sqrt{x-2}}{x-5}$ 的定义域为______
    answer: $x \geq 2$ 且 $x \neq 5$
    clue: 被开方数非负且分母不为零。
    solution_steps:
    - $x-2\geq0$ 且 $x-5\neq0$，$\therefore x\geq2$ 且 $x\neq5$。
