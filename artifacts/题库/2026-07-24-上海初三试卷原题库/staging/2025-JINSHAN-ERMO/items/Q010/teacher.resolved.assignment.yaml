    stem_latex: 方程组 $\begin{cases}x-y=1\\x^2-y^2=5\end{cases}$ 的解为______
    answer: $\begin{cases}x=3\\y=2\end{cases}$
    clue: 因式分解 $(x-y)(x+y)=5$，$x+y=5$。
    solution_steps:
    - $(x-y)(x+y)=5$，$x+y=5$，$x=3$，$y=2$。
