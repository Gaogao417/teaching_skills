    stem_latex: 企业产值分配：生产成本36万占45%，管理成本占30%。税前利润是______万元
    answer: '20'
    clue: 总产值 $=36\div45\%=80$万，利润占比 $25\%$，$80\times25\%=20$。
    solution_steps:
