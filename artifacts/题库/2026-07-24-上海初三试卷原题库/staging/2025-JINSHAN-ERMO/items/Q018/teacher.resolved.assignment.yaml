    stem_latex: $\mathrm{Rt}\triangle ABC$（$\angle C=90^{\circ}$，$AC=6$，$BC=8$）沿过 $AB$ 中点的直线 $l$ 翻折，重心 $P$ 到 $AB$ 距离等于重心 $G$ 到 $AB$ 距离，$D$ 到 $l$ 的距离为______
    answer: $\dfrac{24}{5}$ 或 $5$
    clue: $AB=10$，两种翻折情况讨论。
