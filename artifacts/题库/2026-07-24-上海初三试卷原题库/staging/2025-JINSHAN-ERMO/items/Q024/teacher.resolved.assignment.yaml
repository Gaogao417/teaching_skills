  - type: problem
    id: Q024
    points: 12
    stem_latex: '$C(m,-1)$ 在 $y=-x+2$ 上，抛物线 $y=x^2-2kx+k^2-1$ 与 $x$ 轴交于 $E$（左）、$F$（右），顶点 $D$。

      (1) 抛物线过 $C$，求表达式；

      (2) 求证 $\triangle DEF$ 面积为定值；

      (3) $N(\frac{3}{5},0)$，$D$ 在 $\angle CNO$ 平分线上，四边形 $DEGF$ 为梯形，求 $G$。'
    solution_steps:
    - (1) $m=3$，$k=3$，$y=x^2-6x+8$。
    - (2) $EF^2=4k^2-4(k^2-1)=4$，$EF=2$，$S=\frac{1}{2}\times2\times1=1$。
    - (3) $k=\frac{2}{5}$，$E(-\frac{3}{5},0)$，$F(\frac{7}{5},0)$，$D(\frac{2}{5},-1)$。
    - $DF\parallel EG$ 或 $DE\parallel FG$，$G(\frac{12}{5},3)$ 或 $(-\frac{8}{5},3)$。
    clue: 二次函数+定值证明+角平分线+梯形分类讨论。
    answer: (1) $y=x^2-6x+8$；(2) 定值为1；(3) $G(\dfrac{12}{5},3)$ 或 $G(-\dfrac{8}{5},3)$
