  - type: problem
    id: Q025
    points: 14
    stem_latex: '矩形 $ABCD$ 对角线 $AC$ 与以 $A$ 为圆心 $AD$ 为半径的圆弧交于 $F$，过 $F$ 作 $AC$ 的垂线交 $BC$、$AD$、$CD$ 于 $G$、$P$、$E$。

      (1) ① 联 $AE$ 与 $DF$ 交于 $M$，求证 $DM=MF$；

      ② $GB:CG=1:10$，求 $AB:AD$；

      (2) 联 $AG$，$\triangle PAG$ 为等腰三角形，求 $\tan^2\angle ACD$。'
    solution_steps:
    - (1)① $\triangle ADE\cong\triangle AFE$，$\angle DAE=\angle FAE$，$DM=MF$。
    - ② 设 $GB=k$，$CG=10k$，$BC=9k=AD=AF$，$\triangle CFG\sim\triangle CBA$，$CF=6k$，$AB=12k$，$AB:AD=4:3$。
    - (2) 分类讨论等腰三角形，$\tan^2\angle ACD=\frac{1}{3}$ 或 $1$ 或 $\frac{-1+\sqrt{17}}{2}$。
    clue: 矩形+圆弧+全等+相似+等腰三角形分类讨论。
    answer: (1)① 证明见详解；② $AB:AD=4:3$；(2) $\tan^2\angle ACD=\dfrac{1}{3}$ 或 $1$ 或 $\dfrac{-1+\sqrt{17}}{2}$
