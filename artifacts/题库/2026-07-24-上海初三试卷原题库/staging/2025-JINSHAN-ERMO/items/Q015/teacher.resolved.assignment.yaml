  blocks:
  - type: short_answer
    id: Q015
    points: 4
    stem_latex: $\mathrm{Rt}\triangle ABC$ 中 $\angle C=90^{\circ}$，$D$ 是 $AB$ 中点，$\overrightarrow{CA}=\vec{a}$，$\overrightarrow{CD}=\vec{b}$，$\overrightarrow{AB}=$______
    answer: $2\vec{b}-2\vec{a}$
    clue: $\overrightarrow{AD}=\vec{b}-\vec{a}$，$\overrightarrow{AB}=2\overrightarrow{AD}$。
    solution_steps:
    - $\overrightarrow{AB}=2(\vec{b}-\vec{a})=2\vec{b}-2\vec{a}$。
