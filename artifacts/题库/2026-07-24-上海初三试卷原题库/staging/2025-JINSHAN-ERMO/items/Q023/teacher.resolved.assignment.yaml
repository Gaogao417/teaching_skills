  - type: problem
    id: Q023
    points: 12
    stem_latex: '等腰梯形 $ABCD$（$AD\parallel BC$，$AB=CD$），$AC$、$BD$ 交于 $F$，$E$ 在 $BF$ 上，$\angle AED=\angle ABC$。

      (1) 求证：$AB^2=BE\cdot BD$；

      (2) $BE=DF$，求证：$AB=AD$。'
    solution_steps:
    - (1) $\angle BAD=\angle AEB$，$\triangle BAE\sim\triangle BDA$，$AB^2=BE\cdot BD$。
    - (2) $CD^2=DF\cdot BD$，$\triangle DCF\sim\triangle DBC$，$\angle DBC=\angle ABD=\angle ADB$，$AB=AD$。
    clue: 相似三角形+等腰梯形性质+全等。
    answer: 证明见详解
