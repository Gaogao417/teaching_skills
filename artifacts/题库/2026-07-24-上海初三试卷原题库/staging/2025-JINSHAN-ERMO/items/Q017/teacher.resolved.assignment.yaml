    stem_latex: 测塔高，仰角 $\alpha$ 和 $\beta$（$\beta>\alpha>0$），前进 $m$ 米。塔高为______米
    answer: $\dfrac{m}{\cot\alpha-\cot\beta}$
    clue: $AC=x\cot\alpha$，$BC=x\cot\beta$，$AB=AC-BC=m$。
    solution_steps:
    - $x\cot\alpha-x\cot\beta=m$，$x=\frac{m}{\cot\alpha-\cot\beta}$。
