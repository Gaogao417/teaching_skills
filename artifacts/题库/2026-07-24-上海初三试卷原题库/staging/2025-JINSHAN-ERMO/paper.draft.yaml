    block:
      stem_latex: 计算：$|\sqrt{3}-2|-27^{\frac{1}{3}}+\dfrac{2}{\sqrt{3}+1}-\left(\dfrac{1}{2}\right)^{-2}$
      solution_steps:
      - $|\sqrt{3}-2|=2-\sqrt{3}$
      - $27^{\frac{1}{3}}=3$
      - $\dfrac{2}{\sqrt{3}+1}=\sqrt{3}-1$
      - $(\frac{1}{2})^{-2}=4$
      - 原式 $=2-\sqrt{3}-3+\sqrt{3}-1-4=-6$
      clue: 绝对值+立方根+分母有理化+负指数幂。
      answer: $-6$
