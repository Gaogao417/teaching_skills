  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，在等腰梯形 $ABCD$ 中，$AD\parallel BC$，$AB=CD$，点 $E$ 在边 $AB$ 上，$AC$ 与 $DE$ 交于点 $F$，$\angle ADE=\angle DCA$。（1）求证：$AF\cdot
      AC=AE\cdot CD$；（2）如果点 $E$ 是边 $AB$ 的中点，求证：$AB^2=2DF\cdot DE$。
    answer: 见证明。
    solution_steps:
    - title: 解答
      content: （1）由等腰梯形角关系及题设得 $\triangle AED\sim\triangle DAC$，又 $\triangle ADF\sim\triangle ACD$，从而 $AD^2=AE\cdot CD=AF\cdot
        AC$。（2）当 $E$ 为 $AB$ 中点时，$AB=CD=2AE$；再由 $\triangle AFD\sim\triangle EAD$ 得 $AD^2=DF\cdot DE$，结合 $AD^2=AE\cdot CD=\frac{AB^2}{2}$，所以
        $AB^2=2DF\cdot DE$。
