  - type: problem
    id: Q025
    points: 14
    stem_latex: 如图，正方形 $ABCD$ 中，点 $P$ 是边 $BC$ 上的一个动点（不与点 $B、C$ 重合），点 $E$ 在 $DP$ 上，满足 $AE=AB$，延长 $BE$ 交 $CD$ 于点 $F$。（1）求证：$\angle
      BED=135^\circ$；（2）联结 $CE$：①当 $CE\perp BF$ 时，求 $\frac{BP}{PC}$；②当 $\triangle CEF$ 是以 $CE$ 为腰的等腰三角形时，求 $\tan\angle FBC$。
    answer: （1）见证明；（2）①$2$；②$2-\sqrt3$ 或 $\sqrt2-1$。
    solution_steps:
    - title: 解答
      content: （1）设 $\angle EAB=\alpha$，由正方形和 $AE=AB=AD$ 的等腰三角形角关系得 $\angle BED=135^\circ$。（2）①联结 $BD$，由相似三角形及 $CE\perp BF$
        得 $CF=DF$，再作平行线求得 $\frac{BP}{PC}=2$。②若 $CE=EF$，由几何关系得 $\tan\angle FBC=2-\sqrt3$；若 $CE=CF$，得 $\tan\angle FBC=\sqrt2-1$。
