    stem_latex: 已知 $\vec a、\vec b$ 都是非零向量，且 $|\vec a|\ne|\vec b|$，下列说法正确的是
    choices:
    - $\vec0$ 与 $\vec a$ 是平行向量
    - $\vec a+\vec b$ 一定是非零向量
    - 若 $\vec a=-2\vec b$，则 $|\vec a|=2|\vec b|$
    - 若 $|\vec a|=2|\vec b|$，则 $\vec a=-2\vec b$
