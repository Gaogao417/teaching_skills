  - type: problem
    id: Q020
    points: 10
    stem_latex: 已知二次函数 $y=-x^2+4x-3$。（1）用配方法将解析式化为 $y=a(x+m)^2+k$ 的形式，并指出图像的对称轴和顶点坐标；（2）图像与 $x$ 轴交于点 $A、B$（点 $A$ 在点 $B$ 左侧），与
      $y$ 轴交于点 $C$，顶点记作 $D$，求四边形 $ADBC$ 的面积。
    answer: （1）$y=-(x-2)^2+1$，对称轴为直线 $x=2$，顶点为 $(2,1)$；（2）$S_{\text{四边形}ADBC}=4$。
    solution_steps:
    - title: 解答
      content: （1）配方得 $y=-(x^2-4x+4)+1=-(x-2)^2+1$，所以对称轴为直线 $x=2$，顶点为 $(2,1)$。（2）令 $y=0$ 得 $A(1,0)、B(3,0)$，并有 $C(0,-3)、D(2,1)$。将四边形分成
        $\triangle ADB$ 与 $\triangle ABC$，面积和为 $1+3=4$。
