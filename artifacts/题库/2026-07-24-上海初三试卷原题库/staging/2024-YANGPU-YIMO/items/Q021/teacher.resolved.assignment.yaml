  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在 $\triangle ABC$ 中，$AB=AC=4$，$\cos B=\frac14$，$AB$ 的垂直平分线交边 $AB$ 于点 $D$，交边 $AC$ 于点 $F$，交边 $BC$ 的延长线于点
      $E$。（1）求 $CE$；（2）求 $\sin\angle EFC$。
    answer: （1）$CE=6$；（2）$\sin\angle EFC=\frac78$。
    solution_steps:
    - title: 解答
      content: 由 $AB=AC=4$ 且 $\cos B=\frac14$，结合垂直平分线与等腰三角形关系求得 $CE=6$；再利用相似三角形和三角比关系，得 $\sin\angle EFC=\frac78$。
