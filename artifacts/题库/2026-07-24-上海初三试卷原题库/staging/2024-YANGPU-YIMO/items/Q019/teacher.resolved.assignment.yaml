  - type: problem
    id: Q019
    points: 10
    stem_latex: 如图，在 $\triangle ABC$ 中，点 $D、E、F$ 分别在边 $AB、AC、BC$ 上，$DE\parallel BC$，$AB=15$，$\frac{AE}{EC}=\frac23$。（1）求 $AD$
      的长；（2）如果 $BF=4、CF=6$，求四边形 $BDEF$ 的周长。
    answer: （1）$AD=6$；（2）四边形 $BDEF$ 的周长为 $26$。
    solution_steps:
    - title: 解答
      content: （1）由 $DE\parallel BC$，得 $\frac{AD}{DB}=\frac{AE}{EC}=\frac23$。又 $AB=15$，所以 $AD=6、DB=9$。（2）由 $\frac{BF}{CF}=\frac23=\frac{AE}{EC}$
        得 $EF\parallel AB$；又 $DE\parallel BC$，所以四边形 $BDEF$ 是平行四边形，其周长为 $2(BD+BF)=2(9+4)=26$。
