  - type: problem
    id: Q024
    points: 12
    stem_latex: 抛物线 $y=ax^2-2ax-3(a\ne0)$ 与 $x$ 轴交于 $A、B$（$A$ 在左），与 $y$ 轴交于 $C$，顶点为 $D$，且 $AB=4$。（1）求表达式；（2）$P$ 在线段 $BC$ 上，若
      $\angle PAC=45^\circ$，求 $P$；（3）将抛物线向左平移，点 $D$ 平移到 $E$，过 $E$ 作 $EF\perp AP$ 交 $AP$ 于 $F$，且 $\tan\angle PEF=\frac12$，求平移后表达式。
    answer: （1）$y=x^2-2x-3$；（2）$P(\frac53,-\frac43)$；（3）$y=(x+\frac{17}{9})^2-4$。
    solution_steps:
    - title: 解答
      content: （1）对称轴为 $x=1$，由 $AB=4$ 得 $A(-1,0),B(3,0)$，代入得 $a=1$。（2）由 $\angle PAC=45^\circ$ 及相似三角形求得 $P(\frac53,-\frac43)$。（3）设平移后顶点为
        $E(m,-4)$，作辅助垂线并由 $\tan\angle PEF=\frac12$ 建立直角三角形关系，解得 $m=-\frac{17}{9}$，故表达式为 $y=(x+\frac{17}{9})^2-4$。
