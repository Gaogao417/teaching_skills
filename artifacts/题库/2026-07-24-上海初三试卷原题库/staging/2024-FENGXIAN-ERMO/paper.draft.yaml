    block:
      stem_latex: 如图，$\triangle OAB$ 是等腰直角三角形，$\angle AOB=90°$，$OA=OB=3\sqrt{2}$，点
        $C$、$D$ 分别在 $OA$、$OB$ 上且 $CD\parallel AB$，$\triangle CDE$ 是等边三角形且 $E$ 在 $\triangle
        OAB$ 形内，$G$ 是 $\triangle CDE$ 的重心，那么线段 $OG$ 的取值范围是\u3000\u3000\u3000\u3000。
      answer: $0<OG<\sqrt{3}$
      clue: $OG=\dfrac{3+\sqrt{3}}{6}x$，$0<x<3\sqrt{3}-3$。
      solution_steps:
      - 设 $CD=x$，$OF=\dfrac{x}{2}$，$FG=\dfrac{\sqrt{3}}{6}x$，$OG=\dfrac{3+\sqrt{3}}{6}x$。
      - $E$ 在形内：$\dfrac{\sqrt{3}}{2}x<3-\dfrac{x}{2}$，$x<3\sqrt{3}-3$。
      - $OG<\dfrac{3+\sqrt{3}}{6}(3\sqrt{3}-3)=\sqrt{3}$，$\therefore 0<OG<\sqrt{3}$。
