    id: Q015
    points: 4
    stem_latex: 如图，点 $A$、$B$、$C$ 在直线 $l$ 上，点 $P$ 在直线 $l$ 外，$BC=2AB$，$\overrightarrow{PA}=\vec{a}$，$\overrightarrow{PB}=\vec{b}$，那么 $\overrightarrow{PC}=$\u3000\u3000\u3000\u3000（用 $\vec{a}$、$\vec{b}$ 表示）。
    answer: $3\vec{b}-2\vec{a}$
    clue: $\overrightarrow{AB}=\vec{b}-\vec{a}$，$\overrightarrow{AC}=3\overrightarrow{AB}$。
    solution_steps:
    - $\overrightarrow{AB}=\vec{b}-\vec{a}$，$\overrightarrow{AC}=3(\vec{b}-\vec{a})=3\vec{b}-3\vec{a}$。
    - $\overrightarrow{PC}=\vec{a}+3\vec{b}-3\vec{a}=3\vec{b}-2\vec{a}$。
