    stem_latex: 下列函数中，能同时满足：①过点 $(1,-1)$；②经过第二象限；③当 $x>0$ 时 $y$ 随 $x$ 增大而增大的是（　　）
    choices:
    - $y=-x$
    - $y=x-2$
    - $y=-\dfrac{1}{x}$
    - $y=x^2-1$
    answer: C
    clue: $y=-\dfrac{1}{x}$ 过 $(1,-1)$，经二四象限，$x>0$ 时递增。
