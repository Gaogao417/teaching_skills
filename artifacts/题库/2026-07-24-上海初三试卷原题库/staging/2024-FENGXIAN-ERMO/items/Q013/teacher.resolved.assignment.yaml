  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 在四张背面相同的卡片上分别印有等腰三角形、平行四边形、菱形和圆，混合后随机抽取两张，则抽到卡片上图案都是轴对称图形的概率为\u3000\u3000\u3000\u3000。
    answer: $\dfrac{1}{2}$
    clue: 轴对称图形：等腰三角形、菱形、圆（$3$ 个），共 $12$ 种，符合 $6$ 种。
    solution_steps:
    - 轴对称图形有等腰三角形、菱形、圆共 $3$ 个；$C_4^2=6$ 种，符合 $3$ 种。
    - $P=\dfrac{3}{6}=\dfrac{1}{2}$。
