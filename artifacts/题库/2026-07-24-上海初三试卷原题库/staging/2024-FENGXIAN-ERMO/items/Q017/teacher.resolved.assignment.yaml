  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 如图，正方形 $ABCD$ 的边长为 $1$，点 $P$ 在 $AD$ 延长线上（$PD<CD$），连接 $PB$、$PC$，如果 $\triangle CDP$ 与 $\triangle PAB$ 相似，那么 $\tan\angle BPA=$\u3000\u3000\u3000\u3000。
    answer: $\dfrac{\sqrt{5}-1}{2}$
    clue: $\dfrac{DP}{AB}=\dfrac{CD}{PA}$，$x^2+x-1=0$。
    solution_steps:
    - 设 $DP=x$，$PA=x+1$，$\dfrac{x}{1}=\dfrac{1}{x+1}$，$x^2+x-1=0$，$x=\dfrac{\sqrt{5}-1}{2}$。
    - $\tan\angle BPA=\dfrac{AB}{PA}=\dfrac{1}{( \sqrt{5}+1)/2}=\dfrac{\sqrt{5}-1}{2}$。
