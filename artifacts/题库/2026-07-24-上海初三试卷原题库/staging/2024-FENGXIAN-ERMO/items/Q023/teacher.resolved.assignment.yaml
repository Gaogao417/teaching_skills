  - type: problem
    id: Q023
    points: 12
    stem_latex: '如图，在四边形 $ABCD$ 中，$AB\parallel DC$，$\angle B=\angle ADC$，点 $E$、$F$ 分别在边 $AB$、$BC$ 上，且 $\angle ADE=\angle CDF$。

      (1) 求证：$CF\cdot CB=AE\cdot AB$；

      (2) 连接 $AC$、$EF$，如果 $EF\parallel AC$，求证：四边形 $ABCD$ 是菱形。'
    answer: (1)(2) 证明见详解
    clue: (1) $\triangle ABC\sim\triangle CDA$，$\triangle CDF\sim\triangle ADE$；(2) $EF\parallel AC$ 得比例推 $AB=BC$。
    solution_steps:
    - (1) $\angle BAC=\angle DCA$，$\angle B=\angle ADC$，$\triangle ABC\sim\triangle CDA$，$\dfrac{AB}{BC}=\dfrac{DC}{AD}$。
    - $\angle ADC=\angle B$，$\angle ADE=\angle CDF$，$\triangle CDF\sim\triangle ADE$，$\dfrac{CF}{AE}=\dfrac{CD}{AD}=\dfrac{AB}{BC}$，$\therefore CF\cdot CB=AE\cdot AB$。
    - (2) $EF\parallel AC$ 得 $\dfrac{AE}{AB}=\dfrac{CF}{BC}$，结合(1)得 $AB=BC$；再证 $\triangle ABC\cong\triangle ADC$ 得 $AB=BC=CD=AD$，菱形。
