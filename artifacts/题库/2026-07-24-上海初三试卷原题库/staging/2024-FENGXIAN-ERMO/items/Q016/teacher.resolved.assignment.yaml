  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 已知两个半径都为 $4$ 的 $\odot A$ 与 $\odot B$ 交于点 $C$、$D$，$CD=6$，那么圆心距 $AB$ 的长是\u3000\u3000\u3000\u3000。
    answer: $2\sqrt{7}$
    clue: 连心线垂直平分公共弦，$AM=\sqrt{4^2-3^2}=\sqrt{7}$。
    solution_steps:
    - $CM=3$，$AM=\sqrt{AC^2-CM^2}=\sqrt{16-9}=\sqrt{7}$。
    - $AB=2AM=2\sqrt{7}$。
