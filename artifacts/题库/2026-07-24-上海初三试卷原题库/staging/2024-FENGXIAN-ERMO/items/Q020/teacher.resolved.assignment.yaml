    stem_latex: 解方程组：$\begin{cases} x+2y=1 \\ x^2-4y^2=-3 \end{cases}$
    answer: $\begin{cases} x=-1 \\ y=1 \end{cases}$
    clue: 由① $x=1-2y$ 代入②。
    solution_steps:
    - $x=1-2y$ 代入②：$(1-2y)^2-4y^2=-3$，$1-4y=-3$，$y=1$。
    - $x=1-2=-1$。
