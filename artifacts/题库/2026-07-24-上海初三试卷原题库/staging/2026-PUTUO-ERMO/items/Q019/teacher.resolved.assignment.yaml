  - type: problem
    id: Q019
    points: 10
    stem_latex: 解方程：$\dfrac{2}{x-1}-\dfrac{3}{x}=0$．
    answer: $x=3$
    explanation: 官方参考答案：$x=3$。
    solution_steps:
    - title: 详解
      content: 原方程可化为$\dfrac{2}{x-1}=\dfrac{3}{x}$。方程两边同乘$x(x-1)$，得$2x=3(x-1)$，解得$x=3$。检验：$x=3$时$x(x-1)=6\neq0$，是原方程的解。
