    stem_latex: 解方程：$\dfrac{x^2-4x+4}{x^2-4}-\dfrac{1}{x-2}=\dfrac{x-1}{x+2}$。
    answer: $x=-\dfrac{3}{2}$
    explanation: 两边同乘 $(x+2)(x-2)$，展开整理得 $x^2-4x-3=0$，$x=-\dfrac{3}{2}$ 或 $x=2$，$x=2$ 为增根。
    solution_steps:
    - title: 解方程
      content: 原方程化为 $x^2-4x+4-(x+2)=(x-1)(x-2)$，展开整理因式分解。需人工核实。
