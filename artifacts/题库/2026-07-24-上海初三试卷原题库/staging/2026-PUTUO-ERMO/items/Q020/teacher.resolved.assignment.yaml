    stem_latex: 如图，在四边形$ABCD$中，$AB\parallel CD$，点$E$在$BC$边上，$AE\perp BC$，$BE=CE=2$，$CD=3$．（1）求$AD$的长；（2）如果$\angle DAE=\angle B$，$\sin\angle B=\dfrac{3}{5}$，求$\tan\angle DAE$的值．
    answer: 见详解
    explanation: 官方参考答案：见详解。
    solution_steps:
    - title: 第（1）问
      content: 证明$\triangle ABE\cong\triangle DCE$（或利用平行线性质），进而求出$AD$的长。
    - title: 第（2）问
      content: 过点$E$作$EH\perp AD$于点$H$，利用$\sin\angle B=\dfrac{3}{5}$和勾股定理求解。
