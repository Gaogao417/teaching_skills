  blocks:
  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 有3张分别写有数字2、3、5的卡片，如果从这三张卡片中任意抽取两张卡片，卡片上的数字的积恰好为偶数的概率是________．
    answer: $\dfrac{2}{3}$
    explanation: 官方参考答案：$\dfrac{2}{3}$。
    solution_steps:
    - title: 详解
      content: 从三张卡片中任抽两张，共有3种等可能结果：(2,3)积6偶数、(2,5)积10偶数、(3,5)积15奇数。积为偶数的结果有2种，概率为$\dfrac{2}{3}$。
