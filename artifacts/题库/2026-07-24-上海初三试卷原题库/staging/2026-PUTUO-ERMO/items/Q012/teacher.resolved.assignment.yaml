    stem_latex: 有 3 张分别写有数字 $2$、$3$、$5$ 的卡片。如果从这三张卡片中任意抽取两张卡片，卡片上的数字的积恰好为偶数的概率是\fillin。
    answer: $\dfrac{2}{3}$
    explanation: 共 3 种等可能结果 $(2,3)$、$(2,5)$、$(3,5)$，积为偶数的有 2 种。
