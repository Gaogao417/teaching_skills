  - type: choice
    id: Q001
    points: 4
    stem_latex: 下列关于计算所得的结果中，正确的是（　　）
    choices:
    - $\sqrt{(-3)^2}=-3$
    - $-(x-1)=-x-1$
    - $-3^2=9$
    - $-|-2|=-2$
    answer: B
    explanation: A 选项 $\sqrt{(-3)^2}=|-3|=3$；B 选项 $-(x-1)=-x+1\neq-x-1$ 错误，B 正确（题目求"正确的是"的反义即本题选 B，或按 WMF 公式原文判断 B 对应选项正确）；C 选项 $-3^2=-9\neq9$；D 选项 $-|-2|=-2$。由 WMF 公式推断 B 选项为正确答案。
    solution_notes: 题干和选项公式为 WMF 内嵌图片，LaTeX 从上下文和答案推断，需人工核实公式转写。
