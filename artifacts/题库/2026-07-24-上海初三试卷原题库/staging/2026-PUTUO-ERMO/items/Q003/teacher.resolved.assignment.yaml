    id: Q003
    points: 4
    stem_latex: 已知关于 $x$ 的一元二次方程 $x^2+mx-1=0$ 有两个不相等的实数根，那么下列各数中，$m$ 可以取的值是（　　）
    choices:
    - $-3$
    - $-2$
    - $-1$
    - $0$
    answer: D
    explanation: $\Delta=m^2+4>0$ 对一切实数 $m$ 恒成立，故 $m$ 可取任意值，$m=0$ 符合。
