    stem_latex: 小普同学在物理课上学习光的折射知识后，知道了近视眼镜的镜片是凹透镜。\n\n【生活观察】生活中配眼镜时需要先验光，如图是店家提供的验光单的一部分，其中"S-2.75"中的"$-$"表示该镜片为近视眼镜的镜片，"$2.75$"表示该镜片的透镜焦度是 $2.75$（焦度是表示透镜对光线偏折能力强弱的物理量，用 $\Phi$ 表示）。平时说的眼镜镜片的度数 $y$ 关于透镜焦度 $\Phi$ 的函数解析式为 $y=-100\Phi$。\n\n（1）根据上图验光单的一部分，直接写出右眼和左眼眼镜镜片的度数。\n\n【问题解决】小普同学为了验证一副近视眼镜和一张标记左眼、右眼均为 $S-2.75$ 的验光单是否匹配。\n\n材料一：近视眼镜镜片的度数 $y$（度）与镜片焦距 $f$（米）成反比例。已知 400 度的近视眼镜镜片的焦距为 $0.25$ 米。\n\n材料二：平行于主轴的光通过凹透镜后，这些光的反向延长线相交于凹透镜的虚焦点 $F$。\n\n材料三：把这副近视眼镜的镜片看作一个圆，把发光物、镜片和光屏放置在光具底座上。用一束平行于主光轴 $GE$ 的光线射向镜片，镜片光心为点 $O$，在镜片另一侧的光屏上形成了一个圆形光斑。\n\n（2）根据材料一，求近视眼镜镜片的透镜焦度关于镜片焦距 $f$ 的函数解析式。\n\n（3）根据材料三抽象出数学模型（如图），镜片直径 $AB$ 与光斑直径 $CD$ 平行，$AB\parallel CD$，测得 $GE=0.12$ 米，$EF=0.03$ 米，镜片光心 $O$ 到光屏的距离为 $0.3$ 米。结合材料二，请判断这副近视眼镜的度数是否与这张验光单匹配？并阐述理由。
    answer: （1）右眼度数为 $275$ 度，左眼度数为 $275$ 度；（2）$\Phi=\dfrac{100}{y}$；（3）匹配
    explanation: （1）$y=-100\times(-2.75)=275$。（2）$y$ 与 $f$ 成反比例，$y=100/f$，$\Phi=100/y=100/(100/f)=100/y$，即 $\Phi=100/y$，化简得。（3）由相似三角形求焦距 $f=0.3$ 米，$\Phi=100/0.3\approx333.3$，需用公式推导。
    solution_steps:
    - title: 第（1）问
      content: 右眼焦度 $-2.75$，$y=-100\times(-2.75)=275$ 度；左眼同理。
    - title: 第（2）问
      content: 设 $y=k/f$，代入 $400=k/0.25$ 得 $k=100$，$\Phi=1/f=100/y$，代入 $\Phi=100/y$ 得最终解析式。
    - title: 第（3）问
      content: 延长 $GD$ 交 $AB$ 于点 $H$，由对称性 $P$ 是 $AB$ 中点，由相似三角形求焦距 $f=0.27$ 米，代入 $\Phi=100/0.27$ 得焦度，与验光单比较。
    solution_notes: 本题含大量 WMF 公式和物理背景文字，LaTeX 从解析和文本骨架推断，需人工仔细核实所有数值、公式和推导过程。prompt 仅含验光单（image302.png），材料二凹透镜图（image305.png）、材料三实验装置（image306.png）和数学模型图（image313.png）暂未绑定为 prompt，需人工审核时决定是否补充。
