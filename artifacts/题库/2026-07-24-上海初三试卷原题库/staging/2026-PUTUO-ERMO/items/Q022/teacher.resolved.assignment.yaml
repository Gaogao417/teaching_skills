  - type: problem
    id: Q022
    points: 12
    stem_latex: '小普同学在物理课上学习光的折射知识后，知道了近视眼镜的镜片是凹透镜。

      【生活观察】验光单中"$-2.75$"表示该镜片为近视眼镜，焦度为2.75。眼镜镜片度数$y$关于透镜焦度$\Phi$的函数解析式为$y=100\Phi$。

      （1）根据验光单，直接写出右眼和左眼眼镜镜片的度数；

      【问题解决】小普设计验证实验（材料一、二、三）。

      （2）根据材料一，求近视眼镜镜片的透镜焦度$\Phi$关于镜片焦距$f$的函数解析式；

      （3）根据材料三抽象出数学模型，镜片直径$AB$与光斑直径$A''B''$平行，$AB=6$cm，$A''B''=12$cm，镜片光心$O$到光屏的距离为0.3米。判断这副近视眼镜的度数是否与验光单匹配。

      '
    answer: （1）右眼275度，左眼275度；（2）$\Phi=\dfrac{1}{f}$；（3）匹配
    explanation: 官方参考答案：见详解。
    solution_steps:
    - title: 第（1）问
      content: 右眼焦度2.75，则度数$=100\times2.75=275$度；左眼同理。
    - title: 第（2）问
      content: 由$y=\dfrac{k}{f}$，$400=\dfrac{k}{0.25}$得$k=100$，故$y=\dfrac{100}{f}$。又$y=100\Phi$，故$\Phi=\dfrac{1}{f}$。
    - title: 第（3）问
      content: 利用相似三角形求出焦距$f$，再由$\Phi=\dfrac{1}{f}$求焦度，与验光单对比。
