  - type: choice
    id: Q005
    points: 4
    stem_latex: 已知一个正多边形的中心角等于$\dfrac{\pi}{3}$，那么下列关于这个正多边形的结论中，错误的是（\quad ）
    choices:
    - 边数为6
    - 每个外角都等于$\dfrac{\pi}{3}$
    - 边长与半径长的比为$\sqrt{3}$
    - 既是轴对称图形也是中心对称图形
    answer: C
    explanation: 官方参考答案：C。
    solution_steps:
    - title: 详解
      content: 中心角为$\dfrac{\pi}{3}$，边数$n=\dfrac{2\pi}{\pi/3}=6$，为正六边形。正六边形边长等于半径，比值为1而非$\sqrt{3}$，故C错误。
    source_solution_images: []
