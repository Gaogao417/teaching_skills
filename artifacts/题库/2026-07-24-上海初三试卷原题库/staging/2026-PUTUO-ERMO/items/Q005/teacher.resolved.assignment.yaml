    stem_latex: 已知一个正多边形的中心角等于 $60°$，那么下列关于这个正多边形的结论中，错误的是（　　）
    choices:
    - 边数为 6
    - 每个外角都等于 $60°$
    - 边长与半径长的比为 $1:\sqrt{3}$
    - 既是轴对称图形也是中心对称图形
    answer: C
    explanation: 正六边形边长等于半径，比值为 $1:1$，C 结论错误。
