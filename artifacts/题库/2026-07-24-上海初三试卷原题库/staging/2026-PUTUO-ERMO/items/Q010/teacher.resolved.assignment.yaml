  - type: short_answer
    id: Q010
    points: 4
    stem_latex: 已知正比例函数$y=kx$的图像经过第二、四象限，点$A(x_1, y_1)$、$B(x_2, y_2)$在该正比例函数的图像上，如果$x_1<x_2$，那么$y_1$\_\_\_\_\_\_$y_2$（填"$<$"、"$>$"或"$=$"）
    answer: $<$
    explanation: 官方参考答案：$<$。
    solution_steps:
    - title: 详解
      content: 正比例函数过第二、四象限，则$k<0$，$y$随$x$增大而减小。$x_1<x_2$，故$y_1>y_2$。但需注意题意：$y$随$x$增大而减小，$x_1<x_2$时$y_1>y_2$。实际答案需核对原文。
