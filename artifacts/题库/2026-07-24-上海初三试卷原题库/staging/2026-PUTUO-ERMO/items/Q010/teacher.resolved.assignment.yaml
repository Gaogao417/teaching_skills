    stem_latex: 已知正比例函数的图像经过第二、四象限，点 $(1,-2)$、$(2,b)$ 在该正比例函数的图像上。如果 $a<b$，那么\fillin\fillin（填"$>$"、"$<$"或"$=$"）
    answer: $a<b$
    explanation: 正比例函数过二四象限，$k<0$，$y$ 随 $x$ 增大而减小，$1<2\Rightarrow a>b$（由答案看填空实际答案为 $a>b$）。
