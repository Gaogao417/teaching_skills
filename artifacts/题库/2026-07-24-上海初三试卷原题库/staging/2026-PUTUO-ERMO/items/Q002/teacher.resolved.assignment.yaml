  - type: choice
    id: Q002
    points: 4
    stem_latex: 已知 $a$ 是 $b$ 的相反数，且 $ab<0$，那么下列式子中正确的是（　　）
    choices:
    - $a+b=0$
    - $a-b=2a$
    - $ab=-a^2$
    - $\dfrac{a}{b}=-1$
    answer: A
    explanation: $a$ 是 $b$ 的相反数，则 $a+b=0$，故 A 正确。
