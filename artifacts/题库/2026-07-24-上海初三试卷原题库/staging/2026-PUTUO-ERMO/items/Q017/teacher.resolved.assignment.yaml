    stem_latex: 在 $\triangle ABC$ 中，$\angle C=90°$，$AC=8$，$BC=6$（如图所示）。点 $D$ 在 $AB$ 边上（不与点 $A$、$B$ 重合），$DE\perp AC$，$DF\perp BC$，垂足分别为 $E$、$F$。$\odot I$ 的半径长为 $2$。如果 $\odot I$ 与 $DE$、$DF$ 都外切，那么 $\odot I$ 的半径长 $r$ 的取值范围是\fillin。
    answer: $2<r<\dfrac{12}{5}$
    explanation: 连 $ID$，$DE+DF-CD=r_1+r_2$，当 $D\to A$ 时 $r\to\frac{12}{5}$，当 $D\to C$ 时 $r\to 2$。
