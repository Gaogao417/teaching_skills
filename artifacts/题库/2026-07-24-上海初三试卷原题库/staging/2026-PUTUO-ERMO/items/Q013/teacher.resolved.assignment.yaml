    stem_latex: 近年来，AI工具逐渐融入学生学习生活中，某校为了了解本校学生使用AI工具的情况，随机抽取了部分学生进行问卷调查，并将调查所得数据整理后绘制成如图的条形统计图．如果该校共有1000名学生，那么根据调查结果，估计该校学生中使用两种及以上AI工具约有________人．
