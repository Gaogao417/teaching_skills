    stem_latex: 如图，已知 $G$ 是 $\triangle ABC$ 的重心，点 $E$ 在 $AB$ 边上，$BE=2EA$，$D$ 是 $BC$ 中点，连接 $DG$。如果 $AB=6$，$BC=8$，$AC=10$，那么点 $G$ 到直线 $AB$ 的距离是\fillin。
    answer: $\dfrac{8}{3}$
    explanation: 连 $DE$，由重心和中位线性质可得 $DE\perp AB$，$DG:GE=1:2$，$G$ 到 $AB$ 距离为 $DE$ 的 $\dfrac{1}{3}$。
