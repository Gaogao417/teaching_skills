    stem_latex: 如图，已知$G$是$\triangle ABC$的重心，点$E$在$BC$边上，$BE=2EC$，$D$是$AB$中点，连接$DE$．如果$AB=6$，$BC=5$，那么点$G$到直线$DE$的距离是________．
    answer: $\dfrac{3\sqrt{5}}{5}$
    explanation: 官方参考答案：$\dfrac{3\sqrt{5}}{5}$。
    solution_steps:
