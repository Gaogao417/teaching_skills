  blocks:
  - type: problem
    id: Q023
    points: 12
    stem_latex: '在平面直角坐标系中（如图所示），已知某抛物线的表达式为$y=ax^2+bx+c$。沿着$x$轴的正方向看，点$M$在抛物线的上升部分，设直线$MO$与$x$轴的夹角为$\alpha$。

      （1）如果$\tan\alpha=\dfrac{1}{2}$，$OM=\sqrt{5}$，求该抛物线的表达式；

      （2）已知点$N$在抛物线的下降部分，且$\angle MON=\alpha$。

      ①求$\dfrac{OM}{ON}$的值；

      ②平移抛物线，使新抛物线的顶点落在线段$MN$上，且新抛物线与$y$轴交于点$C$。已知点$M$的纵坐标为1，当四边形$OCMN$是以为腰的等腰梯形时，求点$M$的坐标。

      '
    answer: （1）$y=x^2-2x-3$；（2）①$\dfrac{OM}{ON}=1$；②见详解
    explanation: 官方参考答案：见详解。
    solution_steps:
    - title: 第（1）问
      content: 由$\tan\alpha=\dfrac{1}{2}$得$M$横纵坐标比例关系，结合$OM=\sqrt{5}$求出$M$坐标，代入抛物线表达式求解析式。
    - title: 第（2）①
      content: 过点$N$作平行线，利用角平分线定义和勾股定理求$\dfrac{OM}{ON}$的定值。
    - title: 第（2）②
      content: 由点$M$纵坐标简化坐标，求直线$MN$解析式，利用等腰梯形性质确定点$C$坐标，联立方程求解顶点。
