  - type: problem
    id: Q023
    points: 14
    stem_latex: 在平面直角坐标系中（如图所示），已知某抛物线的表达式为 $y=ax^2+bx+c$。沿着 $x$ 轴的正方向看，点 $M$ 在抛物线的上升部分，设直线 $MN$ 与 $x$ 轴的夹角为 $\alpha$。\n\n（1）如果 $\tan\alpha=\dfrac{3}{4}$，$M(1,5)$，求该抛物线的表达式。\n\n（2）已知点 $N$ 在抛物线的下降部分，且 $MN\perp OM$。\n\n①求 $\cos\alpha$ 的值；\n\n②平移抛物线，使新抛物线的顶点落在线段 $MN$ 上，且新抛物线与 $y$ 轴交于点 $C$。已知点 $M$ 的纵坐标为 $1$，当四边形 $OACB$ 是以 $OA$ 为腰的等腰梯形时，求点 $B$ 的坐标。
    answer: （1）$y=x^2+2x+2$；（2）①$\cos\alpha=\dfrac{4}{5}$；②$(1,-2)$ 或 $(\dfrac{3}{2},-\dfrac{9}{4})$
    explanation: （1）由 $\tan\alpha=3/4$ 和 $M(1,5)$ 求导数关系，待定系数法。（2）①由 $\tan\alpha$ 求 $\cos\alpha$。②由等腰梯形性质确定坐标。
    solution_steps:
    - title: 第（1）问
      content: 设 $M$ 处切线斜率 $k=\tan\alpha=3/4$，$M(1,5)$，待定系数法求 $a,b,c$。
    - title: 第（2）问 ①
      content: $\cos\alpha=4/5$。
    - title: 第（2）问 ②
      content: 由等腰梯形 $OA=BC$ 或 $OA=OB$ 的性质确定顶点坐标。
    solution_notes: 本题含大量 WMF 公式（抛物线、三角函数、坐标），LaTeX 从解析推断，需人工仔细核实所有条件和答案。
