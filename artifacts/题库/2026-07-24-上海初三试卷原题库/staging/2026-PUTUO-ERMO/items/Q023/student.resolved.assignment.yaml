    stem_latex: 在平面直角坐标系中（如图所示），已知某抛物线的表达式为 $y=ax^2+bx+c$。沿着 $x$ 轴的正方向看，点 $M$ 在抛物线的上升部分，设直线 $MN$ 与 $x$ 轴的夹角为 $\alpha$。\n\n（1）如果 $\tan\alpha=\dfrac{3}{4}$，$M(1,5)$，求该抛物线的表达式。\n\n（2）已知点 $N$ 在抛物线的下降部分，且 $MN\perp OM$。\n\n①求 $\cos\alpha$ 的值；\n\n②平移抛物线，使新抛物线的顶点落在线段 $MN$ 上，且新抛物线与 $y$ 轴交于点 $C$。已知点 $M$ 的纵坐标为 $1$，当四边形 $OACB$ 是以 $OA$ 为腰的等腰梯形时，求点 $B$ 的坐标。
