    stem_latex: '在平面直角坐标系中（如图所示），已知某抛物线的表达式为$y=ax^2+bx+c$。沿着$x$轴的正方向看，点$M$在抛物线的上升部分，设直线$MO$与$x$轴的夹角为$\alpha$。

      （1）如果$\tan\alpha=\dfrac{1}{2}$，$OM=\sqrt{5}$，求该抛物线的表达式；

      （2）已知点$N$在抛物线的下降部分，且$\angle MON=\alpha$。

      ①求$\dfrac{OM}{ON}$的值；

      ②平移抛物线，使新抛物线的顶点落在线段$MN$上，且新抛物线与$y$轴交于点$C$。已知点$M$的纵坐标为1，当四边形$OCMN$是以为腰的等腰梯形时，求点$M$的坐标。

      '
