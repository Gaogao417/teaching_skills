  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 已知点$A(1, m)$、$B(2, n)$在同一反比例函数的图像上，那么$m$\_\_\_\_\_\_$n$．
    answer: '2'
    explanation: 官方参考答案：2。
    solution_steps:
    - title: 详解
      content: 设反比例函数$y=\dfrac{k}{x}$，点$A$在图象上得$k=m$，点$B$在图象上得$2n=k$，故$m=2n$，$m-n=n$。需核对原题具体数值。
