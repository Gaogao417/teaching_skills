  - type: problem
    id: Q018
    points: 10
    stem_latex: 计算：$\sqrt{12}-\dfrac{1}{\sqrt{3}}+|1-\sqrt{3}|-(\sqrt{3})^0$．
    answer: $\dfrac{4\sqrt{3}}{3}$
    explanation: 官方参考答案：见详解。
    solution_steps:
    - title: 详解
      content: $\sqrt{12}=2\sqrt{3}$，$\dfrac{1}{\sqrt{3}}=\dfrac{\sqrt{3}}{3}$，$|1-\sqrt{3}|=\sqrt{3}-1$，$(\sqrt{3})^0=1$。原式$=2\sqrt{3}-\dfrac{\sqrt{3}}{3}+\sqrt{3}-1-1=\dfrac{4\sqrt{3}}{3}-2$。
