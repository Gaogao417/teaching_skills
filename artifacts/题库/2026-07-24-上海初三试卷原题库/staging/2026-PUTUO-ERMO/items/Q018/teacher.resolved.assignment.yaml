    stem_latex: 计算：$(-\sqrt{3})^0+\sqrt{12}\sin 60°-|\sqrt[3]{-8}|-(-2)^{-2}+\sqrt{(-1)^{2025}}$。
    answer: $3+2\sqrt{3}$
    explanation: 分母有理化、负整数指数幂、绝对值、分数指数幂化简后合并。
    solution_steps:
