  - type: choice
    id: Q004
    points: 4
    stem_latex: 某校举办校园歌手大奖赛，在评委评定的十个分数中，去掉一个最高分，去掉一个最低分，剩余的八个分数与原来的十个分数相比，一定不会变化的统计量是（　　）
    choices:
    - 平均数
    - 众数
    - 中位数
    - 方差
    answer: C
    explanation: 去掉两端各一个后，中间八数的中位数仍是原十数的中位数，故 C 正确。
