  blocks:
  - type: choice
    id: Q004
    points: 4
    stem_latex: 某校举办校园歌手大奖赛，在评委评定的十个分数中，去掉一个最高分，去掉一个最低分，剩余的八个分数与原来的十个分数相比，一定不会变化的统计量是（\quad ）
    choices:
    - 平均数
    - 众数
    - 中位数
    - 方差
    answer: C
    explanation: 官方参考答案：C。
    solution_steps:
    - title: 详解
      content: 将10个分数从小到大排序，原中位数是第5个和第6个数据的平均数。去掉最高分和最低分后，中间两个数仍是第5个和第6个，因此中位数一定不变。平均数、众数、方差均可能变化。
