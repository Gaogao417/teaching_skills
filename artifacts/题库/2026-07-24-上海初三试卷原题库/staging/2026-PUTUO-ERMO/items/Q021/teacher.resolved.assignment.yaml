  - type: problem
    id: Q021
    points: 12
    stem_latex: 已知：如图，在四边形 $ABCD$ 中，$\angle ABC=90°$，点 $E$ 在 $AD$ 边上，$AE=DE$，$EC=EB$。
    answer: （1）四边形 $ABCD$ 是平行四边形；（2）$AC=DF$
    explanation: （1）由 $AE=DE$、$EC=EB$ 得 $\angle A=\angle D$，$\angle AEC=\angle DEB$，由 $\angle ABC=90°$ 证平行四边形。（2）由平行四边形性质和等式推导 $AC=DF$。
    solution_steps:
    - title: 第（1）问
      content: 证明 $\angle A=\angle D$，$\angle AEC=\angle DEB$，$\angle A+\angle ABC+\angle BCD+\angle D=360°$，结合 $\angle ABC=90°$ 证两组对角互补，由 $\angle AEC=\angle DEB$ 证 $AB\parallel CD$，得平行四边形。
    - title: 第（2）问
      content: 由平行四边形性质 $AB=CD$，$AD=BC$，$AD\parallel BC$。代入 $AE=DE$、$EC=EB$ 的等式关系证 $AC=DF$。
    solution_notes: 题干含 WMF 公式，LaTeX 从解析推断，需人工核实几何条件和证明过程。
