    stem_latex: 2025 年中国国内生产总值（GDP）约为 $1.26\times10^{14}$ 元，预计 2026 年将比 2025 年增长 $5\%$，那么预计 2026 年比 2025 年增长\fillin 元。（结果用科学记数法表示）
    answer: $6.3\times10^{12}$
    explanation: $1.26\times10^{14}\times5\%=6.3\times10^{12}$。
    solution_notes: 公式为 WMF，LaTeX 从解析推断，需人工核实 GDP 数值和增长率。
