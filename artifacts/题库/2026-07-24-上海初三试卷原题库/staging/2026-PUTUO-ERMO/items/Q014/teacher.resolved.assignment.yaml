    id: Q014
    points: 4
    stem_latex: 2025年中国国内生产总值（GDP）约为$1.35\times10^{14}$元，预计2026年将比2025年增长$4\%$，那么预计2026年比2025年增长________元．（结果用科学记数法表示）
    answer: $5.4\times10^{12}$
    explanation: 官方参考答案：$5.4\times10^{12}$。
    solution_steps:
    - title: 详解
      content: 增长额$=1.35\times10^{14}\times4\%=5.4\times10^{12}$元。
