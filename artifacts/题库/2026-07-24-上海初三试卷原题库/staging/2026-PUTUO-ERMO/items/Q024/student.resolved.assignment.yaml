    stem_latex: '扇形$AOB$与扇形$COD$组成一个如图1的图形，其中扇形$AOB$的圆心角等于$\dfrac{\pi}{2}$，点$C$、$D$分别在半径$OA$、$OB$上，分别记扇形$AOB$、扇形$COD$的圆心角所对的弧为$\overset{\frown}{AB}$与$\overset{\frown}{CD}$，半径长分别为$R$与$r$。

      （1）已知$\overset{\frown}{AB}$的长与$\overset{\frown}{CD}$的长相等，$R=5$，$r=3$，求这个图形的面积$S$（结果保留$\pi$）；

      （2）连接$CD$，作$O$关于直线$CD$的对称图形。

      ①连接$OO''$，如果$OO''$与$\overset{\frown}{AB}$交于点$M$、$N$（点$M$在点$N$的左侧），且$MN=2\sqrt{2}$，求$R$与$r$之间的数量关系；

      ②如果$\overset{\frown}{CD}$所在的圆与$\overset{\frown}{AB}$所在的圆内切于点$F$（如图2所示），点$P$是$\overset{\frown}{CD}$上一点，连接$OP$并延长交$\overset{\frown}{AB}$于点$Q$，当$PQ=2$时，求$\angle POQ$的度数．

      '
