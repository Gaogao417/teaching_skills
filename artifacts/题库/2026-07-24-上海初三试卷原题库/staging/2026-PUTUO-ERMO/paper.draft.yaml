        block:
          stem_latex: '扇形 $OAB$ 与扇形 $OCD$ 组成如图 1 的图形，其中扇形 $OAB$ 的圆心角 $\angle AOB$ 等于 $90°$，点 $C$、$D$ 分别在半径 $OA$、$OB$ 上，分别记扇形 $OAB$、扇形 $OCD$ 的圆心角所对的弧为 $l_{AB}$ 与 $l_{CD}$，半径长分别为 $R$ 与 $r$。\n\n（1）已知 $l_{AB}$ 的长与 $l_{CD}$ 的长相等，$R=4$，求这个图形的面积 $S$（结果保留 $\pi$）。\n\n（2）连接 $AD$，作 $\triangle AOD$ 关于直线 $AD$ 的对称图形。\n\n①连接 $BC$，如果 $AD$ 与 $BC$ 交于点 $M$、$N$（点 $M$ 在点 $N$ 的左侧），且 $MN=\dfrac{\sqrt{2}}{2}$，求 $R$ 与 $r$ 之间的数量关系；\n\n②如果 $l_{AB}$ 所在的圆与 $l_{CD}$ 所在的圆内切于点 $F$（如图 2 所示），点 $P$ 是 $\widehat{AB}$ 上一点，连接 $PF$ 并延长交 $\widehat{CD}$ 于点 $Q$，当 $PQ=2DF$ 时，求 $\widehat{PQ}$ 的度数。'
          answer: '（1）$S=12\pi$；（2）①$R-r=\dfrac{\sqrt{2}}{2}MN$ 即 $R-r=\dfrac{1}{2}$；②$30°$'
          explanation: '（1）弧长相等 $\dfrac{\pi}{2}R=\dfrac{\pi}{2}r+r\cdot\dfrac{\pi}{2}$，$R=r+4$（由 $R=4$ 反推关系），用扇形面积公式。（2）①对称构造等腰直角三角形，勾股定理求关系。②圆内切，等腰三角形，由 $PQ=2DF$ 求 $\widehat{PQ}$ 度数。'
          solution_steps:
            - {title: '第（1）问', content: '弧长相等得 $R\cdot\dfrac{\pi}{2}=r\cdot\alpha$，求 $\alpha$，再用扇形面积公式。'}
            - {title: "第（2）问 ①", content: "记 $O$ 的对称点为 $O'$，由对称性和等腰直角三角形用勾股定理求 $R$ 与 $r$ 的关系。"}
            - {title: '第（2）问 ②', content: '由圆内切和 $PQ=2DF$ 构造等腰三角形，求弧的度数。'}
