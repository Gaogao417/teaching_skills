        block:
          stem_latex: '已知：如图，在四边形 $ABCD$ 中，$\angle ABC=90°$，点 $E$ 在 $AD$ 边上，$AE=DE$，$EC=EB$。'
          answer: '（1）四边形 $ABCD$ 是平行四边形；（2）$AC=DF$'
          explanation: '（1）由 $AE=DE$、$EC=EB$ 得 $\angle A=\angle D$，$\angle AEC=\angle DEB$，由 $\angle ABC=90°$ 证平行四边形。（2）由平行四边形性质和等式推导 $AC=DF$。'
