            - {title: '第（1）问', content: '证明 $\angle A=\angle D$，$\angle AEC=\angle DEB$，$\angle A+\angle ABC+\angle BCD+\angle D=360°$，结合 $\angle ABC=90°$ 证两组对角互补，由 $\angle AEC=\angle DEB$ 证 $AB\parallel CD$，得平行四边形。'}
            - {title: '第（2）问', content: '由平行四边形性质 $AB=CD$，$AD=BC$，$AD\parallel BC$。代入 $AE=DE$、$EC=EB$ 的等式关系证 $AC=DF$。'}
