      answer: (1)乙；$3$千米；(2)甲先到，时间差$1.5$小时；(3)$\dfrac{4}{3}$千米/时
      clue: 一次函数的应用
      solution_steps:
      - (1)由图象，$l_1$是乙的函数图象；$C$地在$B$地正北$6-3=3$千米处
      - (2)甲先到达$C$地。甲到达时间$6\div(4\div1)=1.5$小时，乙到达时间$(6-3)\div[(4-3)\div1]=3$小时，时间差$3-1.5=1.5$小时
      - (3)提速后速度$(6-4)\div(1.5+1-1)=\dfrac{4}{3}$千米/时
