      answer: (1)$y=-\dfrac12 x^2-x+4$；(2)$\dfrac13$；(3)$P(-3,\dfrac52)$
      clue: 二次函数综合题
      solution_steps:
      - (1)直线$y=x+4$：$x=0$时$y=4$，$C(0,4)$；$y=0$时$x=-4$，$A(-4,0)$。代入抛物线得$b=-1$，$c=4$，$\therefore y=-\dfrac12 x^2-x+4$
      - (2)对称轴$x=-1$，$P$与$C$关于$x=-1$对称，$P(-2,4)$，$PC=2$；作$PH\perp AC$于$H$。$\triangle OAC$为等腰直角三角形，$AC=4\sqrt2$，$\angle OAC=45^{\circ}$；由$PC\parallel OA$，$\angle PCA=45^{\circ}$，$\triangle PCH$为等腰直角三角形，$PH=CH=\sqrt2$，$AH=3\sqrt2$，$\therefore \tan\angle PAC=\dfrac{PH}{AH}=\dfrac13$
      - (3)第四顶点为$Q$，$PQ\parallel OA$，$PQ=OA=4$；设$P(t,-\dfrac12 t^2-t+4)$，则$Q(t+4,-\dfrac12 t^2-t+4)$，代入抛物线解得$t=-3$，$\therefore P(-3,\dfrac52)$
