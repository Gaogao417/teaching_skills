      answer: (1)$\angle CDB=30^{\circ}$；(2)$BD=2\sqrt{3}$，面积$=3\sqrt{3}$
      clue: 等腰梯形与解直角三角形
      solution_steps:
      - (1)$\because DC\parallel AB$，$AD=BC$，$\angle A=60^{\circ}$，$\therefore \angle CBA=\angle A=60^{\circ}$；$\because BD$平分$\angle ABC$，$\therefore \angle CDB=\angle ABD=\dfrac12\angle CBA=30^{\circ}$
      - (2)在$\triangle ABD$中，$\angle ADB=180^{\circ}-\angle A-\angle ABD=90^{\circ}$，$\therefore BD=AD\cdot\tan A=2\tan60^{\circ}=2\sqrt{3}$
      - 过$D$作$DH\perp AB$于$H$，$DH=AD\cdot\sin A=2\sin60^{\circ}=\sqrt{3}$
      - $\because \angle CDB=\angle CBD=30^{\circ}$，$\therefore DC=BC=AD=2$，$AB=2AD=4$
      - $S_{梯形ABCD}=\dfrac12(AB+CD)\cdot DH=\dfrac12(4+2)\sqrt{3}=3\sqrt{3}$
