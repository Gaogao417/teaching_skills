    block:
      stem_latex: 如图，在梯形$ABCD$中，$AD\parallel BC$，$AB=DC=5$，$AD=1$，$BC=9$，点$P$为边$BC$上一动点，作$PH\perp DC$，垂足$H$在边$DC$上，以点$P$为圆心$PH$为半径画圆，交射线$PB$于点$E$。(1)当圆$P$过点$A$时，求圆$P$的半径；(2)分别联结$EH$和$EA$，当$\triangle ABE\sim\triangle CEH$时，以点$B$为圆心$r$为半径的圆$B$与圆$P$相交，试求圆$B$的半径$r$的取值范围；(3)当劣弧$\widehat{EH}$沿直线$EH$翻折交$BC$于点$F$，试通过计算说明线段$EH$和$EF$的比值为定值，并求出此定值。
      answer: (1)半径为$3$；(2)$\dfrac52<r<\dfrac{59}{8}$；(3)$\dfrac{2\sqrt5}{3}$
      clue: 圆的综合题
      solution_steps:
      - (1)作$AM\perp BC$于$M$，连$AP$。由等腰梯形性质$BM=4$，$AM=3$，$\tan B=\tan C=\dfrac34$；设$PH=3k$，则$CH=4k$，$PC=5k$，$PM=5-5k$，$AP^2=9+(5-5k)^2$；由$PA=PH$得$9+(5-5k)^2=9k^2$，解得$k=1$或$k=\dfrac{17}{8}$（舍），$\therefore$圆$P$半径为$3$
      - (2)$PH=PE=3k$，$CH=4k$，$PC=5k$，$BE=9-8k$；由$\triangle ABE\sim\triangle CEH$，$\dfrac{AB}{BE}=\dfrac{CE}{CH}$，即$\dfrac{5}{9-8k}=\dfrac{8k}{4k}$，解得$k=\dfrac{13}{16}$，圆$P$半径$PH=\dfrac{39}{16}$；此时$BE=\dfrac52$，圆$B$与圆$P$相交，$\therefore \dfrac52<r<\dfrac{59}{8}$
      - (3)取$F$关于$EH$的对称点$G$，连$EG$，作$PQ\perp EG$于$Q$，$HN\perp BC$于$N$；可证$\triangle EPQ\cong\triangle PHN$，$EQ=PN$；由$\sin C=\dfrac35$，$\cos C=\dfrac45$，得$NC=\dfrac{16}{5}k$，$HN=\dfrac{12}{5}k$，$PN=\dfrac{9}{5}k$；$EF=2PN=\dfrac{18}{5}k$，$EH=\dfrac{12\sqrt5}{5}k$，$\therefore \dfrac{EH}{EF}=\dfrac{2\sqrt5}{3}$
