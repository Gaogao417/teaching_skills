      answer: (1) $y=-\dfrac{1}{2}x^2+2x+6$；(2) ① $CD=5$；② $F(4,6)$
      clue: (1) 对称轴 $-\dfrac{2}{2a}=2$ 得 $a=-\dfrac{1}{2}$；(2)① $F$ 在 $CD$ 中垂线；② $\triangle
