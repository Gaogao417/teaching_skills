    block:
      stem_latex: '春节期间甲乙两家商店各自推出优惠活动：甲——所购商品按原价打八折；乙——所购商品按原价每满 $300$ 元减 $80$ 元。设顾客在甲乙两家商店购买商品的原价都为
        $x$ 元。

        (1) 如果顾客在甲商店购买商品选择优惠活动后实际付款 $y$ 元，求 $y$ 关于 $x$ 的函数解析式；

        (2) 购买原价在 $500$ 元以下的商品时，如果分别选择甲、乙优惠后实际付款金额相等，求 $x$ 的值；

        (3) 顾客购买原价在 $900$ 元以下的商品时，如果选择乙比选择甲更合算，求 $x$ 的取值范围。'
      answer: (1) $y=0.8x$；(2) $x=400$；(3) $300\leqslant x<400$ 或 $600\leqslant x<800$
      clue: 乙分段：$0<x<300$ 付 $x$；$300\leqslant x<600$ 付 $x-80$；$600\leqslant x<900$
        付 $x-160$。
      solution_steps:
      - (1) $y=0.8x$。
      - (2) $0.8x=x-80$，$x=400$。
      - (3) $300\leqslant x<600$：$x-80<0.8x$ 得 $300\leqslant x<400$；$600\leqslant
        x<900$：$x-160<0.8x$ 得 $600\leqslant x<800$。
