    block:
      stem_latex: 已知方程 $\dfrac{x}{x^2-1}+\dfrac{1-x^2}{3x}=2$，如果设 $y=\dfrac{x}{x^2-1}$，那么原方程转化为关于
        $y$ 的整式方程为\u3000\u3000\u3000\u3000。
      answer: $y^2-2y+\dfrac{1}{3}=0$
      clue: 注意 $\dfrac{1-x^2}{3x}=-\dfrac{1}{3}\cdot\dfrac{x^2-1}{x}=-\dfrac{1}{3y}$。
      solution_steps:
      - 设 $y=\dfrac{x}{x^2-1}$，则 $\dfrac{1}{y}=\dfrac{x^2-1}{x}$，第二项 $=\dfrac{1}{3y}$。
      - 原方程化为 $y+\dfrac{1}{3y}=2$，两边乘 $3y$ 得 $3y^2+1=6y$，即 $y^2-2y+\dfrac{1}{3}=0$。
