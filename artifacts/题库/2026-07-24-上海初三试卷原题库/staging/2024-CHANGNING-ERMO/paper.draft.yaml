    block:
      stem_latex: 我们把以三角形的重心为圆心的圆叫做该三角形的重心圆。如图，在 $\triangle ABC$ 中，$AB=AC=10$，$BC=16$，如果
        $\triangle ABC$ 的重心圆与该三角形各边的公共点一共有 $4$ 个，那么它的半径 $r$ 的取值范围是\u3000\u3000\u3000\u3000。
      answer: $r=3.2$ 或 $4<r<2\sqrt{17}$
      clue: 重心到三边距离 $OE=OF=3.2$，到三顶点 $OB=OC=2\sqrt{17}$，$OD=2$，$OA=4$。
      solution_steps:
      - 重心 $O$：$AD=6$，$OD=2$，$OA=4$，$OB=OC=2\sqrt{17}$，$OE=OF=3.2$。
      - 与三边共 $4$ 个公共点：$r=3.2$（与两边各 $2$ 点、第三边切 $1$ 点... 实为 $r=3.2$ 恰切）或 $4<r<2\sqrt{17}$（与
        $AB$、$AC$ 各交 $2$ 点）。
