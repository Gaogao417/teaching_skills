    block:
      stem_latex: 解方程组：$\begin{cases} x-y=3 \text{①} \\ x^2-5xy+6y^2=0 \text{②} \end{cases}$
      answer: $\begin{cases} x=\dfrac{18}{5} \\ y=\dfrac{3}{5} \end{cases}$ 或 $\begin{cases}
        x=\dfrac{3}{2} \\ y=-\dfrac{3}{2} \end{cases}$
      clue: ②因式分解为 $(x-6y)(x+y)=0$，拆成两个二元一次方程组。
      solution_steps:
      - 由②$(x-6y)(x+y)=0$，得 $x=6y$ 或 $x=-y$。
      - $x=6y$ 代入①：$5y=3$，$y=\dfrac{3}{5}$，$x=\dfrac{18}{5}$。
      - $x=-y$ 代入①：$-2y=3$，$y=-\dfrac{3}{2}$，$x=\dfrac{3}{2}$。
