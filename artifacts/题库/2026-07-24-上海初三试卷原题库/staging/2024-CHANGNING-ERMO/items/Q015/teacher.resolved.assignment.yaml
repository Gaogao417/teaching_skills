  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如图，在 $\triangle ABC$ 中，点 $D$ 在边 $AB$ 上，且 $BD=2AD$，点 $E$ 是 $AC$ 的中点，连接 $DE$，设向量 $\overrightarrow{BA}=\vec{a}$，$\overrightarrow{BC}=\vec{b}$，那么 $\overrightarrow{DE}=$\u3000\u3000\u3000\u3000。
    answer: $\dfrac{1}{2}\vec{b}-\dfrac{1}{6}\vec{a}$
    clue: $\overrightarrow{DE}=\overrightarrow{DA}+\overrightarrow{AE}$，分别用 $\vec{a}$、$\vec{b}$ 表示。
    solution_steps:
    - $\overrightarrow{AC}=\vec{b}-\vec{a}$，$\overrightarrow{DA}=\dfrac{1}{3}\vec{a}$，$\overrightarrow{AE}=\dfrac{1}{2}(\vec{b}-\vec{a})$。
    - $\overrightarrow{DE}=\dfrac{1}{3}\vec{a}+\dfrac{1}{2}\vec{b}-\dfrac{1}{2}\vec{a}=\dfrac{1}{2}\vec{b}-\dfrac{1}{6}\vec{a}$。
