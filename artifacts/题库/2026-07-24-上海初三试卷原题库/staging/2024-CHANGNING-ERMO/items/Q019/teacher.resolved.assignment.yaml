  - type: problem
    id: Q019
    points: 10
    stem_latex: 计算：$8^{\frac{1}{3}}+|\sqrt{3}-3|-\dfrac{1}{2+\sqrt{3}}+(\pi-\sqrt{2})^0$
    answer: $4$
    clue: 立方根、绝对值、分母有理化、零指数幂分别化简。
    solution_steps:
    - $8^{\frac{1}{3}}=2$，$|\sqrt{3}-3|=3-\sqrt{3}$。
    - $\dfrac{1}{2+\sqrt{3}}=2-\sqrt{3}$，$(\pi-\sqrt{2})^0=1$。
    - 原式 $=2+(3-\sqrt{3})-(2-\sqrt{3})+1=4$。
