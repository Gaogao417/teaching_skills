  - type: problem
    id: Q024
    points: 12
    stem_latex: '在平面直角坐标系 $xOy$ 中，已知抛物线 $y=ax^2+2x+c$ 与 $x$ 轴分别交于点 $A$、$B$（点 $A$ 在点 $B$ 左侧），与 $y$ 轴交于点 $C(0,6)$，其对称轴为直线 $x=2$。

      (1) 求该抛物线的表达式；

      (2) 点 $F$ 是上述抛物线上位于第一象限的一个动点，直线 $AF$ 分别与 $y$ 轴、线段 $BC$ 交于点 $D$、$E$。①当 $CF=DF$ 时，求 $CD$ 的长；②联结 $AC$，如果 $\triangle ACF$ 的面积是 $\triangle CDE$ 面积的 $3$ 倍，求点 $F$ 的坐标。'
    answer: (1) $y=-\dfrac{1}{2}x^2+2x+6$；(2) ① $CD=5$；② $F(4,6)$
    clue: (1) 对称轴 $-\dfrac{2}{2a}=2$ 得 $a=-\dfrac{1}{2}$；(2)① $F$ 在 $CD$ 中垂线；② $\triangle EMD\sim\triangle FNA$。
    solution_steps:
    - (1) $-\dfrac{2}{2a}=2$ 得 $a=-\dfrac{1}{2}$，$c=6$，$\therefore y=-\dfrac{1}{2}x^2+2x+6$。
    - (2) $A(-2,0)$，$B(6,0)$，设 $F(m,-\dfrac{1}{2}m^2+2m+6)$，直线 $AF$ 交 $y$ 轴于 $D(0,6-m)$。
    - ① $CF=DF$：$\dfrac{1}{2}(6-m+6)=-\dfrac{1}{2}m^2+2m+6$，$m=5$，$CD=m=5$。
    - ② $BC: y=-x+6$，$E$ 横坐标 $DM=\dfrac{2m}{8-m}$，由 $DE:AF=DM:AN=1:3$ 得 $\dfrac{2m}{8-m}=\dfrac{1}{3}(m+2)$，$m=4$，$F(4,6)$。
