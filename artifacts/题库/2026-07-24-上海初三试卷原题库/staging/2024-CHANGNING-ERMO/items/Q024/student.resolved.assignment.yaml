    stem_latex: '在平面直角坐标系 $xOy$ 中，已知抛物线 $y=ax^2+2x+c$ 与 $x$ 轴分别交于点 $A$、$B$（点 $A$ 在点 $B$ 左侧），与 $y$ 轴交于点 $C(0,6)$，其对称轴为直线 $x=2$。

      (1) 求该抛物线的表达式；

      (2) 点 $F$ 是上述抛物线上位于第一象限的一个动点，直线 $AF$ 分别与 $y$ 轴、线段 $BC$ 交于点 $D$、$E$。①当 $CF=DF$ 时，求 $CD$ 的长；②联结 $AC$，如果 $\triangle ACF$ 的面积是 $\triangle CDE$ 面积的 $3$ 倍，求点 $F$ 的坐标。'
