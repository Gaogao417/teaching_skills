    stem_latex: 下列命题是假命题的是（　　）
    choices:
    - 对边之和相等的平行四边形是菱形
    - 一组邻边上的高相等的平行四边形是菱形
    - 一条对角线平分一组对角，另一条对角线平分一个内角的四边形是菱形
    - 被一条对角线分割成两个等腰三角形的平行四边形是菱形
    answer: D
    clue: 逐项用菱形判定验证，D 中等腰三角形未必邻边相等。
