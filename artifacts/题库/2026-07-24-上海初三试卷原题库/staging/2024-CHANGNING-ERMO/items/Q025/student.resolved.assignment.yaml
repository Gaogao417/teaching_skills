      (1) 当 $AD=4$ 时，判断点 $B$ 与 $\odot O$ 的位置关系，并说明理由；

      (2) 过点 $C$ 作 $CE\perp OD$，交 $OD$ 延长线于点 $E$。以点 $E$ 为圆心，$EC$ 为半径作 $\odot E$，延长 $CE$，交 $\odot E$ 于点 $C''$。①如果 $\odot O$ 与 $\odot E$ 的公共弦恰好经过线段 $EO$ 的中点，求 $CD$ 的长；②连接 $AC''$、$OC$，如果 $AC''$ 与 $\triangle BOC$ 的一条边平行，求 $\odot E$ 的半径长。'
