  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 为了解某校六年级 $300$ 名学生来校的方式，随机调查了 $50$ 名学生同一天来校的方式并绘制饼状图（自行车 $12\%$、公共交通 $32\%$、私家车 $26\%$、步行），那么估计该校六年级 $300$ 名学生中步行来学校的共有\u3000\u3000\u3000\u3000名。
    answer: $90$
    clue: 步行占比 $=1-12\%-32\%-26\%=30\%$。
    solution_steps:
    - 步行占比 $=1-26\%-12\%-32\%=30\%$。
    - $300\times30\%=90$ 名。
