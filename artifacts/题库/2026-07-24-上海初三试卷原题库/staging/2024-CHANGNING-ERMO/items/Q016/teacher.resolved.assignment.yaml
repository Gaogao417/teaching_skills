  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，正方形 $ABCD$ 中，点 $E$ 在对角线 $BD$ 上，点 $F$ 在边 $CD$ 上（点 $F$ 不与点 $C$ 重合），且 $\angle EAF=45^{\circ}$，那么 $\dfrac{CF}{BE}$ 的值为\u3000\u3000\u3000\u3000。
    answer: $\sqrt{2}$
    clue: 证 $\triangle ABE\sim\triangle ACF$，$\dfrac{CF}{BE}=\dfrac{AC}{AB}=\sqrt{2}$。
    solution_steps:
    - $\angle BAE=\angle CAE$（$\angle EAF=45°$ 减公共角），$\angle ABE=\angle ACF=45°$。
    - $\triangle ABE\sim\triangle ACF$，$\dfrac{CF}{BE}=\dfrac{AC}{AB}=\dfrac{\sqrt{2}AB}{AB}=\sqrt{2}$。
