    stem_latex: 下列函数中，函数值 $y$ 随自变量 $x$ 的值增大而增大的是（　　）
    choices:
    - $y=2x^2$
    - $y=-\dfrac{2}{x}$
    - $y=-2x$
    - $y=2x+1$
    answer: D
    clue: 一次函数 $k>0$ 时全程递增；二次函数、反比例函数均有递增递减区间。
