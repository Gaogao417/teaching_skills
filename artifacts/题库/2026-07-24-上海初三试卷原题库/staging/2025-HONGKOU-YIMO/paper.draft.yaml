      answer: $\dfrac{\sqrt3}{2}$
      solution_steps:
      - title: 计算
        content: 原式 $=\dfrac1{\sqrt3-2\times\dfrac12}-\dfrac12=\dfrac1{\sqrt3-1}-\dfrac12=\dfrac{\sqrt3}{2}$。
  - item_id: Q020
    question_number: 20
    question_type: problem
    points: 10
    question_evidence:
    - {source: documents/初三/2025届-上海市虹口区-初三一模数学-试卷及参考答案/003.png, box_px: [110, 955, 970, 1170]}
    official_solution:
      start_anchor: '20. 解：'
      end_anchor: '21. 解：'
      crops:
      - {source: documents/初三/2025届-上海市虹口区-初三一模数学-试卷及参考答案/006.png, box_px: [150, 975, 930, 1270]}
    block:
      stem_latex: 在平面直角坐标系 $xOy$ 中，抛物线 $y=x^2+2mx+m+1$ 经过点 $B(-1,0)$。（1）求 $m$ 的值以及抛物线的对称轴；（2）将该抛物线向右平移 $n$ 个单位后得到新抛物线，如果新抛物线经过原点，求 $n$ 的值。
      answer: （1）$m=2$，对称轴为直线 $x=-2$；（2）$n=1$ 或 $3$
      solution_steps:
      - title: 第（1）问
        content: 把 $B(-1,0)$ 代入，可得 $0=1-2m+m+1$，解得 $m=2$。$\therefore y=x^2+4x+3$，$\therefore$ 对称轴是直线 $x=-2$。
      - title: 第（2）问
        content: $\because y=x^2+4x+3=(x+2)^2-1$，设新抛物线的表达式为 $y=(x+2-n)^2-1$。$\because$ 新抛物线经过原点，$\therefore0=(0+2-n)^2-1$，解得 $n_1=1，n_2=3$，$\therefore n$ 的值是 $1$ 或 $3$。
