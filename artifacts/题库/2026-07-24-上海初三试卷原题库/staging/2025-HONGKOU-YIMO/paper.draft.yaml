    block:
      stem_latex: 如图14，在梯形 $ABCD$ 中，$AD\parallel BC$，$\angle BCD=90^\circ$，$CD=2$，$E$ 是 $CD$ 的中点，$AC、BE$ 交于点 $F$，且 $\angle ACD=2\angle EBC$。（1）求证：$CE=CF$；（2）如果 $BC=2AD$，求 $\tan\angle ABC$ 的值；（3）如果 $\angle ABE=\angle ACB$，求 $AD:BC$。
      answer: （1）见证明；（2）$\dfrac43$；（3）$\dfrac{\sqrt{41}-5}{2}$
      solution_steps:
      - title: 第（1）问
        content: $\because\angle BCD=90^\circ$，$\therefore\angle BEC=90^\circ-\angle EBC$，$\angle ACB=90^\circ-\angle ACD$。又 $\angle ACD=2\angle EBC$，$\angle CFE=\angle ACB+\angle EBC$，$\therefore\angle CFE=90^\circ-\angle ACD+\angle EBC=90^\circ-\angle EBC$。$\therefore\angle BEC=\angle CFE$，$\therefore CE=CF$。
      - title: 第（2）问
        content: 延长 $AD、BE$ 相交于点 $G$，过点 $A$ 作 $AH\perp BC$，垂足为点 $H$。由 $CD=2$ 且 $E$ 是 $CD$ 的中点，得 $DE=CE=1$。由 $AD\parallel BC$，$\dfrac{DG}{BC}=\dfrac{DE}{CE}=1$，即 $DG=BC$。又 $BC=2AD$，得 $AG=\dfrac32BC$。由 $CE=CF=1$ 得 $AF=\dfrac32$。结合平行线与直角三角形计算，得 $\tan\angle ABC=\dfrac43$。
      - title: 第（3）问
        content: 延长 $AD、BE$ 相交于点 $G$，过点 $A$ 作 $AH\perp BC$，垂足为点 $H$。设 $BC=x$，由相似关系得 $BH=\dfrac2x$，$AD=x-\dfrac2x$，$DG=\dfrac2x$，$AG=2x-\dfrac2x$，$AF=2-\dfrac2{x^2}$。由 $\triangle ABF\sim\triangle ACB$ 建立方程，解得 $x^2=\dfrac{7+\sqrt{41}}2$（另一根舍去）。$\therefore\dfrac{AD}{BC}=\dfrac{x^2-2}{x^2}=\dfrac{\sqrt{41}-5}{2}$。
