    stem_latex: 过三角形的重心作一条直线与这个三角形两边相交，如果截得的三角形与原三角形相似，那么我们把这条直线叫做这个三角形的“重似线”，这条直线与两边交点之间的线段叫做这个三角形的“重似线段”。如图7，在 $\triangle ABC$ 中，$AB=10$，$\tan B=\dfrac43$，$\tan C=2$，点 $D、E$ 分别在边 $AB、AC$ 上，如果线段 $DE$ 是 $\triangle ABC$ 的“重似线段”，那么 $DE=\fillin$。
