    stem_latex: 如图13，在平面直角坐标系 $xOy$ 中，已知抛物线 $y=-x^2+bx+3$ 与 $x$ 轴交于点 $A、B$（点 $A$ 在点 $B$ 的左侧），与 $y$ 轴交于点 $C$，联结 $AC$，$\tan\angle CAO=3$，抛物线的顶点为点 $D$。（1）求 $b$ 的值和点 $D$ 的坐标；（2）点 $P$ 是抛物线上一点（不与点 $B$ 重合），点 $P$ 关于 $x$ 轴的对称点恰好在直线 $BC$ 上。①求点 $P$ 的坐标；②点 $M$ 是抛物线上一点且在对称轴左侧，联结 $BM$，若 $\angle MBP=\angle ABD$，求点 $M$ 的坐标。
