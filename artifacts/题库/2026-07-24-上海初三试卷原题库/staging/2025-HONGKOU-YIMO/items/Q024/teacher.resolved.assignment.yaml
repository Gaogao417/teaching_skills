  - type: problem
    id: Q024
    points: 12
    stem_latex: 如图13，在平面直角坐标系 $xOy$ 中，已知抛物线 $y=-x^2+bx+3$ 与 $x$ 轴交于点 $A、B$（点 $A$ 在点 $B$ 的左侧），与 $y$ 轴交于点 $C$，联结 $AC$，$\tan\angle CAO=3$，抛物线的顶点为点 $D$。（1）求 $b$ 的值和点 $D$ 的坐标；（2）点 $P$ 是抛物线上一点（不与点 $B$ 重合），点 $P$ 关于 $x$ 轴的对称点恰好在直线 $BC$ 上。①求点 $P$ 的坐标；②点 $M$ 是抛物线上一点且在对称轴左侧，联结 $BM$，若 $\angle MBP=\angle ABD$，求点 $M$ 的坐标。
    answer: （1）$b=2$，$D(1,4)$；（2）①$P(-2,-5)$；②$M\left(-\dfrac23,\dfrac{11}{9}\right)$
    solution_steps:
    - title: 第（1）问
      content: 由题得点 $C(0,3)$，$\therefore OC=3$。在 $\mathrm{Rt}\triangle AOC$ 中，$\tan\angle CAO=\dfrac{OC}{OA}=3$，$\therefore OA=1$，$\therefore A(-1,0)$。抛物线经过点 $A$，得 $b=2$，抛物线为 $y=-x^2+2x+3=-(x-1)^2+4$，$\therefore D(1,4)$。
    - title: 第（2）问①
      content: 可得 $B(3,0)$，直线 $BC$ 的解析式为 $y=-x+3$。设 $P(t,-t^2+2t+3)$，则其关于 $x$ 轴的对称点 $P'(t,t^2-2t-3)$ 在直线 $BC$ 上，解得 $t=3$（舍）或 $t=-2$，所以 $P(-2,-5)$。
    - title: 第（2）问②
      content: 易得 $\angle ABC-\angle ABP=45^\circ$，点 $M$ 在 $BP$ 上方。由 $\angle MBP=\angle ABD$，得 $\angle ABM=\angle DBC$。在 $\mathrm{Rt}\triangle BCD$ 中，$CD=\sqrt2$，$BC=3\sqrt2$，$BD=2\sqrt5$，$\therefore\tan\angle DBC=\dfrac13$。设 $M(m,-m^2+2m+3)$，过点 $M$ 作 $MH\perp x$ 轴，得 $\dfrac{-m^2+2m+3}{3-m}=\dfrac13$，解得 $m_1=3$（舍），$m_2=-\dfrac23$，所以 $M\left(-\dfrac23,\dfrac{11}{9}\right)$。
