  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图8，在 $\triangle ABC$ 中，$AB=10$，$BC=5$，$\sin B=\dfrac35$，点 $D、E$ 在 $BC$ 的延长线上，联结 $AD、AE$，且 $AD=AC$。（1）求 $\tan\angle ADC$ 的值；（2）如果 $\angle E=\angle BAC$，求 $DE$ 的长。
    answer: （1）$2$；（2）$DE=9$
    solution_steps:
    - title: 第（1）问
      content: 过点 $A$ 作 $AH\perp CD$，垂足为点 $H$。在 $\mathrm{Rt}\triangle ABH$ 中，$AH=AB\sin B=10\times\dfrac35=6$，$BH=\sqrt{AB^2-AH^2}=8$，$\therefore CH=8-5=3$。在 $\mathrm{Rt}\triangle ACH$ 中，$\tan\angle ACD=\dfrac{AH}{CH}=2$。$\because AD=AC$，$\therefore\angle ADC=\angle ACD$，$\therefore\tan\angle ADC=2$。
    - title: 第（2）问
      content: $\because\angle E=\angle BAC$，$\angle ABC=\angle EBA$，$\therefore\triangle BAC\sim\triangle BEA$。$\therefore\dfrac{AB}{BE}=\dfrac{BC}{AB}$，即 $\dfrac{10}{BE}=\dfrac5{10}$，$\therefore BE=20$。又 $CD=2CH=6$，$\therefore DE=9$。
