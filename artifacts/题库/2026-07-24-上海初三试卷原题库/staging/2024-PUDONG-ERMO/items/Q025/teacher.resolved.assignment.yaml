  - type: problem
    id: Q025
    points: 14
    stem_latex: '$\odot O_1$ 和 $\odot O_2$ 相交于 $A$、$B$，线段 $O_1O_2$ 延长线交 $\odot O_2$ 于 $C$，$CA$、$CB$ 延长线分别交 $\odot O_1$ 于 $D$、$E$。

      (1) 连接 $AB$、$DE$，$AB$、$DE$ 分别与连心线 $O_1O_2$ 交于 $H$、$G$，求证：$AB\parallel DE$；

      (2) 如果 $O_1O_2=5$，①当 $G$ 与 $O$ 重合，$\odot O_1$ 半径为 $4$ 时，求 $\odot O_2$ 半径；②当 $BD\parallel AO_2$ 且 $\odot O_2$ 半径为 $2$ 时，求 $O_1G$ 的长。'
    answer: (1) 证明见详解；(2) ① $\odot O_2$ 半径为 $3$；② $O_1G=\dfrac{7}{4}$
    clue: (1) $CA=CB$，$\angle CAB=\angle D$；(2)① $A,H,E$ 共线，勾股定理；② $\triangle CAO_2\sim\triangle CO_1A$。
    solution_steps:
    - (1) $O_1O_2\perp AB$，$CA=CB$，$\angle CAB=\angle CBA=\angle D$，$AB\parallel DE$。
    - (2)① $A,H,E$ 共线，$AE\perp AC$，$AO_1=4,O_1H=2$，勾股求 $AO_2=3$。
    - (2)② $AC=\sqrt{14}$，$O_1H=\dfrac{7}{2}$，$\triangle CAH\sim\triangle CDG$，$O_1G=\dfrac{7}{4}$。
