    stem_latex: 小丽在大楼窗口 $A$ 测得校园内旗杆底部 $C$ 的俯角为 $\alpha$ 度，窗口离地面高度 $AB=h$（米），那么旗杆底部与大楼的距离 $BC=$\u3000\u3000\u3000\u3000米（用 $\alpha$ 的三角比和 $h$ 表示）。
    answer: $\dfrac{h}{\tan\alpha}$
    clue: $BC=\dfrac{AB}{\tan\alpha}$。
    solution_steps:
    - $BC=\dfrac{h}{\tan\alpha}$。
