    id: Q017
    points: 4
    stem_latex: 如图，点 $A$、$C$ 在 $y=-\dfrac{1}{x}$ 上，点 $B$ 在 $y=\dfrac{2}{x}$ 上，$AB\parallel x$ 轴，$BC\parallel y$ 轴，那么 $\triangle ABC$ 的面积等于\u3000\u3000\u3000\u3000。
    answer: $\dfrac{9}{4}$
    clue: $AB=3a$，$BC=\dfrac{3}{2a}$，$S=\dfrac{1}{2}\times3a\times\dfrac{3}{2a}$。
    solution_steps:
    - $A(-a,\dfrac{1}{a})$，$B(2a,\dfrac{1}{a})$，$C(2a,-\dfrac{1}{2a})$；$AB=3a$，$BC=\dfrac{3}{2a}$。
    - $S=\dfrac{1}{2}\times3a\times\dfrac{3}{2a}=\dfrac{9}{4}$。
