  - type: problem
    id: Q023
    points: 12
    stem_latex: '如图，在菱形 $ABCD$ 中，点 $E$ 在边 $CD$ 上，点 $F$ 在边 $BD$ 上，$EG\parallel BC$ 交 $AD$ 的延长线于点 $G$。

      (1) 求证：$DF^2=FG\cdot BF$；

      (2) 若 $BD\cdot DF=2AD\cdot DE$，求证：$AE\perp DC$。'
    answer: (1)(2) 证明见详解
    clue: (1) $\triangle ADF\sim\triangle EGF$，$\triangle ABF\sim\triangle EDF$；(2) $\triangle ADO\sim\triangle FDE$。
    solution_steps:
    - (1) $AD\parallel EG$，$\triangle ADF\sim\triangle EGF$，$\dfrac{AF}{EF}=\dfrac{DF}{FG}$；$AB\parallel CD$，$\triangle ABF\sim\triangle EDF$，$\dfrac{AF}{EF}=\dfrac{BF}{DF}$，$\therefore DF^2=FG\cdot BF$。
    - (2) $BD=2OD$，$\dfrac{AD}{DF}=\dfrac{OD}{DE}$，$\triangle ADO\sim\triangle FDE$，$\angle FED=\angle AOD=90°$，$AE\perp DC$。
