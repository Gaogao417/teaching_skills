  - type: problem
    id: Q021
    points: 10
    stem_latex: '如图，在 $\triangle ABC$ 中，$CD$ 是边 $AB$ 上的高。已知 $AB=AC$，$BC=\sqrt{10}$，$\tan\angle BAC=\dfrac{3}{4}$。

      (1) 求 $AD$ 的长；

      (2) 如果点 $E$ 是边 $AC$ 的中点，连接 $BE$，求 $\cot\angle ABE$ 的值。'
    answer: (1) $AD=4$；(2) $\cot\angle ABE=2$
    clue: (1) 设 $CD=3x,AD=4x$，$BD=x$，$10x^2=10$；(2) $EH=\dfrac{3}{2}$，$BH=3$。
    solution_steps:
    - (1) $CD=3x,AD=4x,BD=x$，$x^2+9x^2=10$，$x=1$，$AD=4$。
    - (2) $EH=\dfrac{3}{2}$，$AH=2$，$BH=3$，$\cot\angle ABE=\dfrac{BH}{EH}=2$。
