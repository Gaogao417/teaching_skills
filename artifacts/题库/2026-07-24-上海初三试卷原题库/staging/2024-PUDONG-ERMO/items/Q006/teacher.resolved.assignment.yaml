    stem_latex: 如图，在 $Rt\triangle ABC$ 中，$\angle ACB=90°$，$AC=4$，$BC=3$，$D$ 在 $AB$ 上且 $\dfrac{BD}{AD}=\dfrac{1}{3}$，$DE\parallel BC$ 交 $AC$ 于 $E$，那么以 $E$ 为圆心 $EC$ 为半径的 $\odot E$ 和以 $D$ 为圆心 $BD$ 为半径的 $\odot D$ 的位置关系是（　　）
