    id: Q009
    points: 4
    stem_latex: 方程 $\sqrt{x+2}=x$ 的根是\u3000\u3000\u3000\u3000。
    answer: $x=2$
    clue: 两边平方 $x+2=x^2$，检验增根。
    solution_steps:
    - $x^2-x-2=0$，$x_1=2$，$x_2=-1$（增根舍去），$x=2$。
