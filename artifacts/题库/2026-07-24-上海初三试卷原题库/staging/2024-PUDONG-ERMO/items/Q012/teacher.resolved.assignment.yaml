    stem_latex: 沿着 $x$ 轴的正方向看，如果抛物线 $y=(k-1)x^2+1$ 在 $y$ 轴左侧的部分是上升的，那么 $k$ 的取值范围是\u3000\u3000\u3000\u3000。
    answer: $k<1$
    clue: 左侧上升则开口向下，$k-1<0$。
    solution_steps:
    - 开口向下 $k-1<0$，$k<1$。
