    stem_latex: 解不等式组：$\begin{cases} 4x-2(x-1)<4 \\ \dfrac{x-1}{2}\leqslant\dfrac{2x}{3} \end{cases}$，并把解集在数轴上表示出来。
    answer: $-3\leqslant x<1$
    clue: 分别解两个不等式取交集。
    solution_steps:
    - ① $2x+2<4$，$x<1$；② $3(x-1)\leqslant4x$，$x\geqslant-3$。
    - 解集 $-3\leqslant x<1$。
