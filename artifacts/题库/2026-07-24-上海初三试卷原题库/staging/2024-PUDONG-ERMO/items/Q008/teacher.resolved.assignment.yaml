    stem_latex: 化简 $\dfrac{x}{x-1}+\dfrac{1}{1-x}$ 结果是\u3000\u3000\u3000\u3000。
    answer: $1$
    clue: $\dfrac{1}{1-x}=-\dfrac{1}{x-1}$。
    solution_steps:
    - $\dfrac{x}{x-1}-\dfrac{1}{x-1}=\dfrac{x-1}{x-1}=1$。
