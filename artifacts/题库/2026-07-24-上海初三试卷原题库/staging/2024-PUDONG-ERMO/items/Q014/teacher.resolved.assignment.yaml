    stem_latex: 如果梯形的下底长为 $7$，中位线长为 $5$，那么其上底长为\u3000\u3000\u3000\u3000。
    answer: $3$
    clue: 中位线 $=\dfrac{1}{2}(\text{上底}+\text{下底})$。
    solution_steps:
    - 上底 $=2\times5-7=3$。
