  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，已知 $\triangle ABC$ 中，中线 $AM$、$BN$ 相交于点 $G$，设 $\overrightarrow{AG}=\vec{a}$，$\overrightarrow{BG}=\vec{b}$，那么向量 $\overrightarrow{BC}$ 用向量 $\vec{a}$、$\vec{b}$ 表示为\u3000\u3000\u3000\u3000。
    answer: $\vec{a}+2\vec{b}$
    clue: $\overrightarrow{BM}=\dfrac{1}{2}\vec{a}+\vec{b}$，$\overrightarrow{BC}=2\overrightarrow{BM}$。
    solution_steps:
    - $\overrightarrow{BM}=\overrightarrow{BG}+\overrightarrow{GM}=\vec{b}+\dfrac{1}{2}\vec{a}$，$\overrightarrow{BC}=2\overrightarrow{BM}=\vec{a}+2\vec{b}$。
