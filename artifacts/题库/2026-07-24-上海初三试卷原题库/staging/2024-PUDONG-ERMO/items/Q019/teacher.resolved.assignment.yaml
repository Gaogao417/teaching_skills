    stem_latex: 计算：$\dfrac{1}{\sqrt{3}+\sqrt{2}}+|2-\sqrt{3}|+\left(\dfrac{1}{2}\right)^{-1}+27^{\frac{1}{3}}$
    answer: $7-\sqrt{2}$
    clue: 分母有理化、绝对值、负指数幂、立方根。
    solution_steps:
    - $\dfrac{1}{\sqrt{3}+\sqrt{2}}=\sqrt{3}-\sqrt{2}$，$|2-\sqrt{3}|=2-\sqrt{3}$，$(\dfrac{1}{2})^{-1}=2$，$27^{\frac{1}{3}}=3$。
    - 原式 $=(\sqrt{3}-\sqrt{2})+(2-\sqrt{3})+2+3=7-\sqrt{2}$。
