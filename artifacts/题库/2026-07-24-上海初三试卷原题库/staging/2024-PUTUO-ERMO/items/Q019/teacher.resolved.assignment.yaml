  - type: problem
    id: Q019
    points: 10
    stem_latex: 计算：$-2^2+8^{\frac{1}{2}}+\left(\dfrac{1}{4}\right)^{-2}-\dfrac{2}{2-\sqrt{2}}$
    answer: $10+\sqrt{2}$
    clue: 分数指数幂、负指数幂、分母有理化。
    solution_steps:
    - $-2^2=-4$，$8^{\frac{1}{2}}=2\sqrt{2}$，$(\dfrac{1}{4})^{-2}=16$，$\dfrac{2}{2-\sqrt{2}}=2+\sqrt{2}$。
    - 原式 $=-4+2\sqrt{2}+16-(2+\sqrt{2})=10+\sqrt{2}$。
