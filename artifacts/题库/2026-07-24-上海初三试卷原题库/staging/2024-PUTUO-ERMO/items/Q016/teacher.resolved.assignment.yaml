  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，梯形 $ABCD$ 中，$AD\parallel BC$，$AE\parallel DC$ 分别交 $BD$、$BC$ 于 $F$、$E$，$\dfrac{BE}{BC}=\dfrac{2}{3}$，设 $\overrightarrow{AD}=\vec{a}$，$\overrightarrow{AB}=\vec{b}$，那么向量 $\overrightarrow{FE}=$\u3000\u3000\u3000\u3000。
    answer: $\dfrac{4}{3}\vec{a}+\dfrac{2}{3}\vec{b}$
    clue: $\overrightarrow{FE}=\overrightarrow{BE}-\overrightarrow{BF}=2\vec{a}-\dfrac{2}{3}(\vec{a}-\vec{b})$。
    solution_steps:
    - $\overrightarrow{BF}=\dfrac{2}{3}(\vec{a}-\vec{b})$，$\overrightarrow{BE}=2\vec{a}$，$\overrightarrow{FE}=\dfrac{4}{3}\vec{a}+\dfrac{2}{3}\vec{b}$。
