  - type: problem
    id: Q022
    points: 10
    stem_latex: 甲乙两个外卖平台月工资计算方式相同。乙平台：底薪 $50$ 元/日，提成 $6$ 元/单，日送 $61$ 单，扣款 $32$ 元/单，违规 $10$ 单，税前月薪 $8832$ 元。甲平台：底薪 $70$ 元/日，提成 $5.5$ 元/单，扣款 $10$ 元/单。小张在甲平台的日均送单数和违规数据见条形图。是否需要跳槽？
    answer: 不需要跳槽
    clue: 计算甲平台期望月薪并与乙平台比较。
    solution_steps:
    - 计算甲平台日均送单数加权平均、违规送单数加权平均。
    - 代入工资公式比较，甲平台月薪不低于乙平台，不需要跳槽。
