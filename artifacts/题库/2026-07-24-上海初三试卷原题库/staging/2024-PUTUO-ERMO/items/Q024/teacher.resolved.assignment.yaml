  - type: problem
    id: Q024
    points: 12
    stem_latex: '在平面直角坐标系 $xOy$ 中，已知抛物线 $y=a(x-m)^2+n$（$a\neq0$）与 $x$ 轴交于 $A$、$B$，顶点 $P$ 在第一象限且 $\angle APB=90°$。

      (1) 当 $P(4,3)$ 时，求抛物线表达式；

      (2) 求待定系数 $a$ 与 $n$ 的数量关系；

      (3) 以 $P$ 为圆心 $PA$ 为半径作 $\odot P$，$\odot P$ 与直线 $y=x+\dfrac{n}{2}$ 交于 $M$、$N$，当 $P$ 在 $y=\dfrac{1}{2}x$ 上时，用 $a$ 表示 $MN$。'
    answer: (1) $y=-\dfrac{1}{3}(x-4)^2+3$；(2) $a=-\dfrac{1}{n}$；(3) $MN=-\dfrac{\sqrt{14}}{2a}$
    clue: (1) $\triangle PAB$ 等腰直角；(2) $A(m-n,0)$ 代入；(3) $PA\parallel MN$。
    solution_steps:
    - (1) $A(1,0)$，$a=-\dfrac{1}{3}$，$y=-\dfrac{1}{3}(x-4)^2+3$。
    - (2) $A(m-n,0)$，$an^2+n=0$，$a=-\dfrac{1}{n}$。
    - (3) $m=2n$，$PA\parallel MN$，$PD=\dfrac{3\sqrt{2}}{4}n$，$MD=\dfrac{\sqrt{14}}{4}n$，$MN=\dfrac{\sqrt{14}}{2}n=-\dfrac{\sqrt{14}}{2a}$。
