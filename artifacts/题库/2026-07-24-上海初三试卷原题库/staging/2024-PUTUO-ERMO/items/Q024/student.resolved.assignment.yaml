    stem_latex: '在平面直角坐标系 $xOy$ 中，已知抛物线 $y=a(x-m)^2+n$（$a\neq0$）与 $x$ 轴交于 $A$、$B$，顶点 $P$ 在第一象限且 $\angle APB=90°$。

      (1) 当 $P(4,3)$ 时，求抛物线表达式；

      (2) 求待定系数 $a$ 与 $n$ 的数量关系；

      (3) 以 $P$ 为圆心 $PA$ 为半径作 $\odot P$，$\odot P$ 与直线 $y=x+\dfrac{n}{2}$ 交于 $M$、$N$，当 $P$ 在 $y=\dfrac{1}{2}x$ 上时，用 $a$ 表示 $MN$。'
