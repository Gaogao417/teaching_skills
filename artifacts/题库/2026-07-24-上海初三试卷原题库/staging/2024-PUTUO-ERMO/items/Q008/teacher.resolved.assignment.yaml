    stem_latex: 方程 $\sqrt{2x+3}=x$ 的解为\u3000\u3000\u3000\u3000。
    answer: $3$
    clue: 两边平方 $2x+3=x^2$，检验增根。
    solution_steps:
    - $x^2-2x-3=0$，$x_1=3$，$x_2=-1$（增根舍去），$x=3$。
