  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程：$\dfrac{6x}{x^2-9}+\dfrac{x}{x+3}=2$
    answer: $x=6$
    clue: 去分母乘 $(x+3)(x-3)$，注意验根。
    solution_steps:
    - $6x+x(x-3)=2(x^2-9)$，$x^2-3x-18=0$，$(x-6)(x+3)=0$。
    - $x_1=6$，$x_2=-3$（增根舍去），$x=6$。
