    stem_latex: 已知正方形 $ABCD$ 的边长为 $4$，点 $E$、$F$ 在直线 $BC$ 上（$E$ 在 $F$ 左侧），$\angle EAF=45°$，如果 $BE=1$，那么 $CF$ 的长是\u3000\u3000\u3000\u3000。
    answer: $\dfrac{8}{5}$ 或 $\dfrac{8}{3}$
    clue: $\triangle AEB\cong\triangle AGD$，$\triangle EAF\cong\triangle GAF$，勾股定理。
    solution_steps:
    - 分 $E$ 在 $B$ 左/右两类讨论，$CF=\dfrac{8}{5}$ 或 $\dfrac{8}{3}$。
