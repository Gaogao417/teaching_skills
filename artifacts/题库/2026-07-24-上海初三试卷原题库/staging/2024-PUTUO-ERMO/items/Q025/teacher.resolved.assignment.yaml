  - type: problem
    id: Q025
    points: 14
    stem_latex: '如图，在梯形 $ABCD$ 中，$AD\parallel BC$（$AD<BC$），$\angle A=90°$，$BC=CD=6$。将梯形 $ABCD$ 绕点 $C$ 顺时针旋转，使 $B$ 与 $D$ 重合，$A$、$D$ 对应点分别为 $E$、$F$。

      (1) 当 $F$ 落在 $AD$ 延长线上时，求 $\angle BCD$；

      (2) 联结 $AE$，设 $AD=x$，$AE=y$。①求 $y$ 关于 $x$ 的函数解析式；②定义双同正多边形，$\angle BCF$ 为正多边形中心角，以 $BD$、$AE$ 为边的正多边形面积比为 $4:5$ 时，求边数。'
    answer: (1) $60°$；(2) ① $y=\dfrac{\sqrt{-3x^3+36x^2+108x}}{3}$；② 边数为 $12$
    clue: (1) 等边三角形；(2)① $\triangle BCD\sim\triangle ACE$；② 相似比 $2:\sqrt{5}$。
    solution_steps:
    - (1) $\angle BCD=\angle DCF=60°$（等边 $\triangle DCF$）。
    - (2)① $\triangle BCD\sim\triangle ACE$，$\dfrac{BD}{AE}=\dfrac{BC}{AC}$，$BD=2\sqrt{3x}$，$AC=\sqrt{-x^2+12x+36}$，$y=\dfrac{\sqrt{-3x^3+36x^2+108x}}{3}$。
    - (2)② 面积比 $4:5$ 得 $\dfrac{BC}{AC}=\dfrac{2\sqrt{5}}{5}$，$AC=3\sqrt{5}$，$\sin\angle BCD=\dfrac{1}{2}$，$\angle BCD=30°$，边数 $=12$。
