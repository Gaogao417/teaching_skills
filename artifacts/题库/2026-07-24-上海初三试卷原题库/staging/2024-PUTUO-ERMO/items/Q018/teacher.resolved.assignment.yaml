    stem_latex: 如图，在平面直角坐标系中，点 $A$、$C$ 在 $x$ 轴上，$B$ 在 $y$ 轴上，$D$、$E$ 分别在 $BC$、$AB$ 上，$BE=\dfrac{1}{2}AE$，$DE$ 延长线过原点 $O$，$BD=CD$，$A(5,0)$，$AO=3CO$，那么 $\tan\angle CDE=$\u3000\u3000\u3000\u3000。
    answer: $8-3\sqrt{7}$
    clue: $C(\dfrac{5}{3},0)$，$B(0,\dfrac{9}{4})$，角平分线性质。
    solution_steps:
    - $CO=\dfrac{5}{3}$，$B(0,\dfrac{9}{4})$，$BC=6$，$\tan\angle CDE=8-3\sqrt{7}$。
