    id: Q014
    points: 4
    stem_latex: 在直角坐标平面内，将点 $A$ 先向右平移 $4$ 个单位，再向上平移 $6$ 个单位得到点 $B$，如果 $A$ 和 $B$ 关于原点对称，那么点 $B$ 的坐标是\u3000\u3000\u3000\u3000。
    answer: $(2,3)$
    clue: $B(x+4,y+6)$，$A$、$B$ 关于原点对称。
    solution_steps:
    - $2x+4=0$，$x=-2$；$2y+6=0$，$y=-3$，$B(2,3)$。
