  - type: problem
    id: Q021
    points: 10
    stem_latex: '如图，在 $\triangle ABC$ 中，$\angle B=2\angle C$，点 $D$ 在边 $BC$ 上，$AB=AD=13$，$BC=23$。

      (1) 求 $BD$ 的长；

      (2) 求 $\tan C$ 的值。'
    answer: (1) $BD=10$；(2) $\tan C=\dfrac{2}{3}$
    clue: (1) $\angle ADB=2\angle C=\angle B$，$\angle C=\angle CAD$，$AD=CD$；(2) $AM=12,CM=18$。
    solution_steps:
    - (1) $\angle ADB=\angle B=2\angle C$，$\angle C=\angle CAD$，$CD=AD=13$，$BD=23-13=10$。
    - (2) $BM=DM=5$，$AM=12$，$CM=18$，$\tan C=\dfrac{12}{18}=\dfrac{2}{3}$。
