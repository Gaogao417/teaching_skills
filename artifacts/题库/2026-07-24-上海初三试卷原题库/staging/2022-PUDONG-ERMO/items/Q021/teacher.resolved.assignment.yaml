  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，$\triangle ABC$ 中 $\sin B=\dfrac{4}{5}$，$F$ 在 $BC$ 上，$AB=AF=5$，过 $F$ 作 $EF\perp CB$ 交 $AC$ 于 $E$，$AE:EC=3:5$，求 $BF$ 与 $\cot C$。
    answer: $BF=6$；$\cot C=2$
    clue: 等腰三线合一+相似。
    solution_steps:
    - 作 $AD\perp CB$，$AB=AF=5$，$BD=DF$，$AD=4$，$BD=3$，$BF=6$。
    - $EF\parallel AD$，$\triangle CEF\sim\triangle CAD$，$\dfrac{EF}{AD}=\dfrac{CE}{CA}=\dfrac{5}{8}$，$EF=\dfrac{5}{2}$，$CF=5$。
    - $\cot C=\dfrac{CF}{EF}=2$。
