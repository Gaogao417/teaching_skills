  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 写出一个对称轴为 $y$ 轴、开口向下且过点 $(1,-2)$ 的二次函数解析式______（答案不唯一）
    answer: $y=-x^{2}-1$
    clue: 设 $y=ax^{2}+c$（$a<0$）。
    solution_steps:
    - 取 $a=-1$，$c=-1$，$y=-x^{2}-1$ 满足。
