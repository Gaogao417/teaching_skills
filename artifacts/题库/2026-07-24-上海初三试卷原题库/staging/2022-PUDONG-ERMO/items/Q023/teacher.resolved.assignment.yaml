  - type: problem
    id: Q023
    points: 12
    stem_latex: '四边形 $ABCD$ 中 $AD\parallel BC$，$E$ 在 $BC$ 延长线，$AE$ 交 $BD$、$CD$ 于 $G$、$F$，$\dfrac{AD}{BE}=\dfrac{GF}{AG}$。

      (1) 求证：$AB\parallel CD$；

      (2) 若 $BC^{2}=GD\cdot BD$，$BG=GE$，求证：四边形 $ABCD$ 是菱形。'
    answer: 见证明
    clue: (1) 平行线分线段成比例；(2) 相似+菱形判定。
    solution_steps:
    - (1) $AD\parallel BC$，$\dfrac{AD}{BE}=\dfrac{DG}{BG}=\dfrac{GF}{AG}$，$\therefore AB\parallel CD$。
    - (2) 四边形 $ABCD$ 是平行四边形，$BC=AD$。$AD^{2}=GD\cdot BD$，$\triangle ADG\sim\triangle BDA$，$\angle DAG=\angle ABD=\angle BDC=\angle DBC$，$BC=CD$，$\therefore$ 是菱形。
