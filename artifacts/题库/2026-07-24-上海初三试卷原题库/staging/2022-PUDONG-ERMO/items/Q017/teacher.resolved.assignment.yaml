    stem_latex: 正 $n$ 边形的一个内角等于它的中心角的2倍，则 $n=$______
    answer: '6'
    clue: $\dfrac{180(n-2)}{n}=2\cdot\dfrac{360}{n}$。
    solution_steps:
    - $\dfrac{180(n-2)}{n}=\dfrac{720}{n}$，$n=6$。
