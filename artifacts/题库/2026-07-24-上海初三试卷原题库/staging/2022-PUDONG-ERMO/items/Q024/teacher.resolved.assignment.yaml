  - type: problem
    id: Q024
    points: 12
    stem_latex: '抛物线 $y=ax^{2}-2x+c$ 与直线 $y=-\dfrac{1}{2}x+3$ 分别交 $x$ 轴、$y$ 轴于 $B$、$C$，顶点为 $D$，联结 $CD$ 交 $x$ 轴于 $E$。

      (1) 求抛物线解析式及 $D$ 坐标；

      (2) 求 $\tan\angle BCD$；

      (3) $P$ 在直线 $BC$ 上，$\angle PEB=\angle BCD$，求 $P$。'
    answer: (1) $y=\dfrac{1}{4}x^{2}-2x+3$，$D(4,-1)$；(2) $\tan\angle BCD=\dfrac{1}{3}$；(3) $P\left(\dfrac{24}{5},\dfrac{3}{5}\right)$ 或 $(12,-3)$
    clue: (1) 待定系数；(2) 作高求正切；(3) 分上下。
    solution_steps:
    - (1) $B(6,0)$，$C(0,3)$，代入得 $a=\dfrac{1}{4}$，$c=3$，$y=\dfrac{1}{4}(x-4)^{2}-1$，$D(4,-1)$。
    - (2) $E(3,0)$，过 $B$ 作 $BF\perp CD$，$\tan\angle BCD=\dfrac{BF}{CF}=\dfrac{1}{3}$。
    - (3) $\tan\angle PEB=\dfrac{1}{3}$，设 $P(m,-\dfrac{1}{2}m+3)$，$P$ 在上方时 $m=\dfrac{24}{5}$；下方时 $m=12$。
