  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases} x^{2}-4xy+4y^{2}=4 \\ x+2y=6 \end{cases}$
    answer: $\begin{cases} x_{1}=4 \\ y_{1}=1 \end{cases}$ 或 $\begin{cases} x_{2}=2 \\ y_{2}=2 \end{cases}$
    clue: ①化为 $(x-2y)^{2}=4$。
    solution_steps:
    - ①化为 $(x-2y)^{2}=4$，$x-2y=\pm2$。
    - 与②联立解得 $\begin{cases}x=4\\y=1\end{cases}$ 或 $\begin{cases}x=2\\y=2\end{cases}$。
