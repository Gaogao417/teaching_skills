  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，$\square ABCD$ 中对角线 $AC$、$BD$ 交于 $O$，设 $\vec{AC}=\vec{a}$，$\vec{AB}=\vec{b}$，则 $\vec{BD}=$______
    answer: $\vec{a}-2\vec{b}$
    clue: $\vec{BD}=2\vec{BO}$。
    solution_steps:
    - $\vec{BO}=\vec{BA}+\vec{AO}=-\vec{b}+\dfrac{1}{2}\vec{a}$，$\vec{BD}=2\vec{BO}=\vec{a}-2\vec{b}$。
