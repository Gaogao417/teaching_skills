  - type: short_answer
    id: Q009
    points: 4
    stem_latex: 不等式组 $\begin{cases} -x>1 \\ 2x\leqslant4 \end{cases}$ 的解集是______
    answer: $x<-1$
    clue: 分别解再取交集。
    solution_steps:
    - 由 $-x>1$ 得 $x<-1$；由 $2x\leqslant4$ 得 $x\leqslant2$，$\therefore x<-1$。
