      end_anchor: $-7-4\sqrt{3}$
    block:
      stem_latex: 先化简再求值：$\left(a-1-\dfrac{3}{a+1}\right)\div\dfrac{a^{2}-4a+4}{a+1}$，其中
        $a=\sqrt{3}$。
      answer: $\dfrac{a+2}{a-2}$；代入得 $-7-4\sqrt{3}$
      clue: 分式化简。
      solution_steps:
      - 原式 $=\dfrac{(a+2)(a-2)}{a+1}\cdot\dfrac{a+1}{(a-2)^{2}}=\dfrac{a+2}{a-2}$。
      - $a=\sqrt{3}$ 时，原式 $=\dfrac{\sqrt{3}+2}{\sqrt{3}-2}=-7-4\sqrt{3}$。
