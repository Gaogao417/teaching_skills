      - (1) 令 $y=0$ 得 $A(6,0)$；令 $x=0$ 得 $B(0,3)$，故 $OA=6$，$OB=3$
      - $\because \angle AOB=90^{\circ}$，$\therefore \tan\angle ABO=\dfrac{OA}{OB}=\dfrac{6}{3}=2$
      - (2) 点 $A(6,0)$ 向左平移 12 个单位得 $C(-6,0)$
      - 设直线 $l$ 的解析式为 $y=-\frac{1}{2}x+b$，把 $C(-6,0)$ 代入得 $0=-\frac{1}{2}\times(-6)+b$，$\therefore b=-3$
      - 所以直线 $l$ 的解析式为 $y=-\frac{1}{2}x-3$
