      stem_latex: 如图，$\triangle ABC$ 的边 $AB$ 是 $\odot O$ 的直径，点 $C$ 在 $\odot O$ 上，已知 $AC=6\,\mathrm{cm}$，$BC=8\,\mathrm{cm}$，点 $P$、$Q$ 分别在边 $AB$、$BC$ 上，且点 $P$ 不与点 $A$、$B$ 重合，$BQ=k\cdot AP$（$k>0$），联接 $PC$、$PQ$。(1) 求 $\odot O$ 的半径长；(2) 当 $k=2$ 时，设 $AP=x$，$\triangle CPQ$ 的面积为 $y$，求 $y$ 关于 $x$ 的函数关系式，并写出定义域；(3) 如果 $\triangle CPQ$ 与 $\triangle ABC$ 相似，且 $\angle ACB=\angle CPQ$，求 $k$ 的值。
      answer: (1) 半径为 $5$；(2) $y=\dfrac{3}{5}x^{2}-\dfrac{42}{5}x+24$（$0<x<4$）；(3) $k=\dfrac{7}{20}$
      clue: 圆的综合题、相似三角形的判定和性质、勾股定理、平行线分线段成比例
      solution_steps:
      - (1) $\because AB$ 是直径，$\therefore \angle ACB=90^{\circ}$，$AB=\sqrt{AC^{2}+BC^{2}}=\sqrt{6^{2}+8^{2}}=10$，故 $\odot O$ 的半径为 $5$
      - (2) 作 $PH\perp BC$ 于 $H$，$\because PH\parallel AC$，$\therefore \dfrac{PH}{AC}=\dfrac{PB}{AB}$，即 $\dfrac{PH}{6}=\dfrac{10-x}{10}$，$PH=\dfrac{3}{5}(10-x)$
      - $k=2$ 时 $CQ=BC-BQ=8-2x$，$y=\dfrac{1}{2}\cdot CQ\cdot PH=\dfrac{1}{2}(8-2x)\cdot\dfrac{3}{5}(10-x)=\dfrac{3}{5}x^{2}-\dfrac{42}{5}x+24$，定义域 $0<x<4$
      - (3) $\because \triangle CPQ\sim\triangle ABC$，$\angle CPQ=\angle ACB=90^{\circ}$，又 $\angle CQP>\angle B$，$\therefore$ 只有 $\angle PCB=\angle B$，$PC=PB$
      - 由 $\angle B+\angle A=90^{\circ}$，$\angle ACP+\angle PCB=90^{\circ}$，得 $\angle A=\angle ACP$，$\therefore PA=PC=PB=5$
      - 由 $\triangle COQ\sim\triangle BCA$，得 $\dfrac{CO}{BC}=\dfrac{CQ}{AB}$，即 $\dfrac{5}{8}=\dfrac{8-5k}{10}$
      - 解得 $k=\dfrac{7}{20}$
