      stem_latex: 解方程组：$\begin{cases} 2x-y=6 \\ x^2-xy-2y^2=0 \end{cases}$
      answer: $\begin{cases} x=4 \\ y=2 \end{cases}$ 或 $\begin{cases} x=2 \\ y=-2
        \end{cases}$
      clue: ②因式分解 $(x+y)(x-2y)=0$。
      solution_steps:
      - 由②$(x+y)(x-2y)=0$，$x=2y$ 或 $x=-y$。
      - $x=2y$ 代入①：$3y=6$，$y=2$，$x=4$。
      - $x=-y$ 代入①：$-3y=6$，$y=-2$，$x=2$。
