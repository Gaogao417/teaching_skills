    id: Q012
    points: 4
    stem_latex: 在一个不透明袋子中，装有 $2$ 个红球和一些白球，如果从袋中随机摸出一个球是红球的概率为 $0.25$，那么白球的个数是\u3000\u3000\u3000\u3000。
    answer: $6$
    clue: $\dfrac{2}{n}=0.25$，$n=8$，白球 $6$。
    solution_steps:
    - $P=\dfrac{2}{n}=0.25$，$n=8$，白球 $8-2=6$。
