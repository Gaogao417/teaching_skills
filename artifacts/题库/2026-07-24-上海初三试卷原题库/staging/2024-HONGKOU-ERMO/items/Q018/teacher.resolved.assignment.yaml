    stem_latex: 如图，在扇形 $AOB$ 中，$\angle AOB=105°$，$OA=8$，点 $C$ 在半径 $OA$ 上，将 $\triangle BOC$ 沿着 $BC$ 翻折，点 $O$ 的对称点 $D$ 恰好落在弧 $AB$ 上，再将弧 $AD$ 沿着 $CD$ 翻折至弧 $A_1D$（点 $A_1$ 是点 $A$ 的对称点），那么 $OA_1$ 的长为\u3000\u3000\u3000\u3000。
    answer: $8\sqrt{2}-8$
    clue: $\triangle OBD$ 等边，$\angle OCD=90°$，$AC=8-4\sqrt{2}$。
    solution_steps:
    - $\triangle OBD$ 等边，$\angle OCD=90°$，$OC=CD=8-a$。
    - $2(8-a)^2=64$，$a=8-4\sqrt{2}$，$OA_1=8-2a=8\sqrt{2}-8$。
