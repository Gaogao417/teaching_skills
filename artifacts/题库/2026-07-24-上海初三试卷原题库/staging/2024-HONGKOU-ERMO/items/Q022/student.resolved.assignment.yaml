    stem_latex: '探究斜坡上两车之间距离。高架路面 $BM$ 离地面 $BH=25$ 米，斜坡 $AB$ 长 $65$ 米。大巴车侧面 $CK=10$ 米，$EC=3.5$ 米，停在斜坡上（$K$ 与 $B$ 重合），指示路牌底端 $P$ 距 $B$ 为 $6.5$ 米（$BP\perp BM$）。小轿车驾驶员眼睛到斜坡距离 $FD=1$ 米。

      任务一：求斜坡 $AB$ 的坡比；

      任务二：当小张正好可以看到整个指示路牌（$P$、$E$、$F$ 共线）时，求小张距大巴车尾 $EC$ 的距离 $CD$。'
