    stem_latex: 如图，正六边形螺帽的边长是 $4\,\text{cm}$，那么这个扳手的开口 $a$ 的值是\u3000\u3000\u3000\u3000。
    answer: $4\sqrt{3}$
    clue: $\angle ACB=120°$，$AD=2\sqrt{3}$，$a=4\sqrt{3}$。
    solution_steps:
    - $AD=\dfrac{\sqrt{3}}{2}\times4=2\sqrt{3}$，$a=AB=2AD=4\sqrt{3}$。
