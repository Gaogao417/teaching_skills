  - type: problem
    id: Q024
    points: 12
    stem_latex: '新定义：抛物线 $y=ax^2+bx+c$（$abc\neq0$）的\u201c轮换抛物线\u201d为 $y=cx^2+ax+b$。已知抛物线 $C_1:y=4mx^2+(4m-5)x+m$ 的轮换抛物线为 $C_2$，$C_1$、$C_2$ 与 $y$ 轴分别交于 $E$、$F$（$E$ 在 $F$ 上方），$C_2$ 顶点为 $P$。

      (1) 如果 $E(0,1)$，求 $C_2$ 的表达式；

      (2) 设 $C_2$ 对称轴与直线 $y=3x+8$ 交于点 $Q$，如果四边形 $PQEF$ 为平行四边形，求点 $E$ 的坐标；

      (3) 已知点 $M(-4,n)$ 在 $C_2$ 上，点 $N(-2,-7\dfrac{1}{2})$，当 $\triangle PMN\sim\triangle PEF$ 时，求 $m$ 的值。'
    answer: (1) $y=x^2+4x-1$；(2) $E(0,-\dfrac{2}{3})$；(3) $m=-1$ 或 $m=\dfrac{17}{32}$
    clue: (1) $m=1$；(2) $PQ=EF$ 列方程；(3) 面积比等于相似比平方。
    solution_steps:
    - (1) $E(0,1)$ 得 $m=1$，$C_1:y=4x^2-x+1$，$C_2:y=x^2+4x-1$。
    - (2) $C_2:y=mx^2+4mx+(4m-5)$，$P(-2,-5)$，$Q(-2,2)$，$EF=5-3m=PQ=7$，$m=-\dfrac{2}{3}$，$E(0,-\dfrac{2}{3})$。
    - (3) $M(-4,4m-5)$，$PN^2=\dfrac{25}{4}$，$PF^2=4+16m^2$；$\dfrac{5-3m}{5/2}=\dfrac{4+16m^2}{25/4}$，$m=-1$ 或 $\dfrac{17}{32}$。
    diagram_col:
