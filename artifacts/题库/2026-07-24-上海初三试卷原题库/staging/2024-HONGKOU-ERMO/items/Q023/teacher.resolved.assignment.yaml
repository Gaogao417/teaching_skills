  - type: problem
    id: Q023
    points: 12
    stem_latex: '如图，在 $Rt\triangle ABC$ 中，$\angle C=90°$，延长 $CB$ 至点 $D$，使得 $DB=CB$，过点 $A$、$D$ 分别作 $AE\parallel BC$，$DE\parallel BA$，$AE$ 与 $DE$ 相交于点 $E$，连接 $BE$。

      (1) 求证：$BE\perp CD$；

      (2) 连接 $AD$ 交 $BE$ 于点 $F$，连接 $CE$ 交 $AD$ 于点 $G$。如果 $\angle FBA=\angle ADB$，求证：$AG=\dfrac{\sqrt{2}}{3}AB$。'
    answer: (1)(2) 证明见详解
    clue: (1) 四边形 $AEBC$ 是矩形；(2) $\triangle AEG\sim\triangle DCG$，$\dfrac{AG}{AB}=\dfrac{\sqrt{2}}{3}$。
    solution_steps:
    - (1) 四边形 $AEDB$ 是平行四边形，$AE=BD=CB$，四边形 $AEBC$ 是平行四边形，$\angle C=90°$ 为矩形，$\therefore BE\perp CD$。
    - (2) 设 $EF=BF=a$，由 $\angle FBA=\angle ADB$ 得 $AE=\sqrt{2}a$；$\triangle AEG\sim\triangle DCG$，$\dfrac{AG}{DG}=\dfrac{1}{2}$。
    - $AG=\dfrac{2\sqrt{3}a}{3}$，$AB=\sqrt{6}a$，$\dfrac{AG}{AB}=\dfrac{\sqrt{2}}{3}$。
