  - type: problem
    id: Q021
    points: 10
    stem_latex: '如图，一次函数图像与反比例函数图像相交于点 $A(m,2)$ 和点 $B(2,-4)$，与 $y$ 轴交于点 $C$。点 $D(-1,n)$ 在反比例函数图像上，过点 $D$ 作 $x$ 轴的垂线交一次函数图像于点 $E$。

      (1) 求反比例函数和一次函数的解析式；

      (2) 求 $\triangle CDE$ 面积。'
    answer: (1) $y=-\dfrac{8}{x}$，$y=-x-2$；(2) $\dfrac{9}{2}$
    clue: (1) $B(2,-4)$ 代入反比例求 $k$，再求 $A$、$D$ 坐标待定系数求一次函数；(2) $DE=9$，底 $1$。
    solution_steps:
    - (1) $k=2\times(-4)=-8$，$y=-\dfrac{8}{x}$；$A(-4,2)$，$D(-1,8)$；$y=-x-2$。
    - (2) $C(0,-2)$，$E(-1,-1)$，$DE=9$，$S_{\triangle CDE}=\dfrac{1}{2}\times9\times1=\dfrac{9}{2}$。
