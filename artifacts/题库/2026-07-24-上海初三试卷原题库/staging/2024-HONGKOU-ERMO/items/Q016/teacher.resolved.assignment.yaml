  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，在梯形 $ABCD$ 中，$AD\parallel BC$，$BC=2AD$，点 $E$、$F$ 分别是边 $AB$、$CD$ 的中点，连接 $AC$，设 $\overrightarrow{AB}=\vec{a}$，$\overrightarrow{AC}=\vec{b}$，那么用向量 $\vec{a}$、$\vec{b}$ 表示向量 $\overrightarrow{EF}=$\u3000\u3000\u3000\u3000。
    answer: $-\dfrac{3}{4}\vec{a}+\dfrac{3}{4}\vec{b}$
    clue: 梯形中位线+向量三角形法则。
    solution_steps:
    - $\overrightarrow{BC}=-\vec{a}+\vec{b}$，$\overrightarrow{AD}=\dfrac{1}{2}\overrightarrow{BC}$。
    - $\overrightarrow{EF}=\overrightarrow{EA}+\overrightarrow{AD}+\overrightarrow{DF}=-\dfrac{3}{4}\vec{a}+\dfrac{3}{4}\vec{b}$。
