    id: Q011
    points: 4
    stem_latex: 将抛物线 $y=(x-2)^2+1$ 先向右平移 $3$ 个单位，再向下平移 $4$ 个单位后，所得到的新抛物线的表达式为\u3000\u3000\u3000\u3000。
    answer: $y=(x-5)^2-3$
    clue: 左加右减、上加下减。
    solution_steps:
    - $y=(x-2-3)^2+1-4=(x-5)^2-3$。
