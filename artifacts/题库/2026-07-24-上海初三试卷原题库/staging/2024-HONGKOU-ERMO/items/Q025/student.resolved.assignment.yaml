    stem_latex: '在梯形 $ABCD$ 中，$AD\parallel BC$，点 $E$ 在射线 $DA$ 上，点 $F$ 在射线 $AB$ 上，连接 $CE$、$DF$ 相交于点 $P$，$\angle EPF=\angle ABC$。

      (1) 如图①，如果 $AB=CD$，点 $E$、$F$ 分别在边 $AD$、$AB$ 上。求证：$\dfrac{AF}{DE}=\dfrac{DF}{CE}$；

      (2) 如图②，如果 $AD\perp CD$，$AB=5$，$BC=10$，$\cos\angle ABC=\dfrac{3}{5}$。在射线 $DA$ 的下方，以 $DE$ 为直径作半圆 $O$，半圆 $O$ 与 $CE$ 的另一个交点为点 $G$。设 $DF$ 与弧 $EG$ 的交点为 $Q$。①当 $DE=6$ 时，求 $EG$ 和 $AF$ 的长；②当点 $Q$ 为弧 $EG$ 的中点时，求 $AF$ 的长。'
