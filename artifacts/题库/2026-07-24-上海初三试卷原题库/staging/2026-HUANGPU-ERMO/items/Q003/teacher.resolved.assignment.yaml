  title: 一、选择题（本大题共6题，每题4分，满分24分）
  type: practice
  visibility: both
  blocks:
  - type: choice
    id: Q003
    points: 4
    stem_latex: \u89e3\u65b9\u7a0b$\dfrac{x^2-1}{x^2}-\dfrac{3x^2}{x^2-1}=2$\u65f6\uff0c\u4ee4$\dfrac{x^2-1}{x^2}=y$\uff0c\u90a3\u4e48\u6362\u5143\u540e\u53bb\u5206\u6bcd\u6574\u7406\u5f97\u5230\u7684\u6574\u5f0f\u65b9\u7a0b\u662f\uff08\quad\uff09
    choices:
    - $y^2-2y-3=0$
    - $y^2-2y+3=0$
    - $y^2+2y-3=0$
    - $y^2+2y+3=0$
    answer: A
    explanation: \u5b98\u65b9\u53c2\u8003\u7b54\u6848\uff1aA\u3002
    solution_steps:
    - \u4ee4$y=\dfrac{x^2-1}{x^2}$\uff0c\u5219$\dfrac{3x^2}{x^2-1}=\dfrac{3}{y}$\u3002
    - \u5c06\u5176\u4ee3\u5165\u539f\u65b9\u7a0b\u5f97\uff1ay-\dfrac{3}{y}=2$\u3002
    - \u65b9\u7a0b\u4e24\u8fb9\u540c\u4e58$y(y\neq 0)$\u53bb\u5206\u6bcd\u5f97\uff1ay^2-3=2y$\uff0c
    - \u79fb\u9879\u6574\u7406\u5f97\uff1ay^2-2y-3=0$\u3002
    clue: \u5c06\u539f\u65b9\u7a0b\u4e2d\u5bf9\u5e94\u90e8\u5206\u7528\u6362\u5143\u540e\u7684$y$\u66ff\u6362\uff0c\u518d\u53bb\u5206\u6bcd\u6574\u7406\u3002
