  - type: problem
    id: Q019
    points: 10
    stem_latex: \u8ba1\u7b97\uff1a$|2-\sqrt{3}|+\left(\dfrac{1}{2}-\dfrac{1}{3}\right)^0-\dfrac{2}{1-\cot30^\circ}$\u3002
    answer: 4
    explanation: \u5b98\u65b9\u53c2\u8003\u7b54\u6848\uff1a4\u3002
    solution_steps:
    - $|2-\sqrt{3}|=2-\sqrt{3}$\uff0c$\left(\dfrac{1}{2}-\dfrac{1}{3}\right)^0=1$\uff0c$\cot30^\circ=\sqrt{3}$,
    - $\therefore|2-\sqrt{3}|+\left(\dfrac{1}{2}-\dfrac{1}{3}\right)^0-\dfrac{2}{1-\cot30^\circ}=2-\sqrt{3}+1-\dfrac{2}{1-\sqrt{3}}$
    - $=3-\sqrt{3}-\dfrac{2(1+\sqrt{3})}{(1-\sqrt{3})(1+\sqrt{3})}=3-\sqrt{3}-\dfrac{2(1+\sqrt{3})}{-2}=3-\sqrt{3}+1+\sqrt{3}=4$
    clue: \u6839\u636e\u7edd\u5bf9\u503c\u7684\u6027\u8d28\uff0c\u96f6\u6b21\u5e66\uff0c\u7279\u6b8a\u4e09\u89d2\u51fd\u6570\u503c\uff0c\u4f9d\u6b21\u8ba1\u7b97\u3002
