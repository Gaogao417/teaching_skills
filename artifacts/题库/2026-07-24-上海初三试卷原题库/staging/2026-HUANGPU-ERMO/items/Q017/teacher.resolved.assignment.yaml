  - type: fillin
    id: Q017
    points: 4
    stem_latex: \u5df2\u77e5$AB$\u662f\u5706$O_1$\u548c$O_2$\u7684\u516c\u5171\u5f26\uff0c\u5982\u679c\u5f26$AB$\u662f\u5706$O_1$\u7684\u5185\u63a5\u6b63\u65b9\u5f62\u7684\u4e00\u8fb9\uff0c\u4e5f\u662f\u5706$O_2$\u7684\u5185\u63a5\u6b63\u516d\u8fb9\u5f62\u7684\u4e00\u8fb9\uff0c\u90a3\u4e48\u5706$O_1$\u4e0e$O_2$\u7684\u534a\u5f84\u4e4b\u6bd4\u662f________\u3002
    answer: $\sqrt{2}:2$
    explanation: \u5b98\u65b9\u53c2\u8003\u7b54\u6848\uff1a$\sqrt{2}:2$\u3002
    solution_steps:
    - \u8bbe\u516c\u5171\u5f26$AB=a$\uff0c$\odot O_1$\u534a\u5f84\u4e3a$r_1$\uff0c$\odot O_2$\u534a\u5f84\u4e3a$r_2$\u3002
    - \u0024AB$\u662f$\odot O_1$\u5185\u63a5\u6b63\u65b9\u5f62\u7684\u8fb9\uff0c\u6b63\u65b9\u5f62\u4e2d\u5fc3\u89d2\u4e3a$\dfrac{360^\circ}{4}=90^\circ$\uff0c
    - $\therefore \triangle AO_1B$\u662f\u7b49\u8170\u76f4\u89d2\u4e09\u89d2\u5f62\uff0c\u7531\u52fe\u80a1\u5b9a\u7406\u5f97$AB^2=r_1^2+r_1^2$\uff0c\u5373$a^2=2r_1^2$\uff0c\u89e3\u5f97$r_1=\dfrac{\sqrt{2}}{2}a$\uff0c
    - \u0024AB$\u662f$\odot O_2$\u5185\u63a5\u6b63\u516d\u8fb9\u5f62\u7684\u8fb9\uff0c\u6b63\u516d\u8fb9\u5f62\u4e2d\u5fc3\u89d2\u4e3a$\dfrac{360^\circ}{6}=60^\circ$\uff0c
    - \u53c8$O_2A=O_2B=r_2$\uff0c$\therefore \triangle AO_2B$\u662f\u7b49\u8fb9\u4e09\u89d2\u5f62\uff0c$\therefore r_2=AB=a$\uff0c
    - $\therefore r_1:r_2=\left(\dfrac{\sqrt{2}}{2}a\right):a=\sqrt{2}:2$\u3002
    clue: \u6839\u636e\u5185\u63a5\u6b63\u591a\u8fb9\u5f62\u7684\u6027\u8d28\u6c42\u51fa\u534a\u5f84\u3002
