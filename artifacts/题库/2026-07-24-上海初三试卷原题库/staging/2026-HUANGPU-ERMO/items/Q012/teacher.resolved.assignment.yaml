    - $\therefore \angle BAC=\angle EAD=360^\circ-90^\circ-90^\circ-40^\circ=140^\circ$\uff0c
    - \u0025\u5f53$\angle A$\u662f\u9510\u89d2\u65f6\uff0c\u7531\u9898\u610f\uff1a$AB=AC$\uff0c$\angle CDA=\angle BEA=90^\circ$\uff0c$\angle CHE=40^\circ$\uff0c
