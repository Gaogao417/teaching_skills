    choices:
    - $y=x$
    - $y=-x$
    - $y=\dfrac{4}{5}x$
    - $y=-\dfrac{5}{4}x$
    answer: C
    explanation: \u5b98\u65b9\u53c2\u8003\u7b54\u6848\uff1aC\u3002
    solution_steps:
    - \u6839\u636e\u5706\u4e2d\u6700\u957f\u7684\u5f26\u662f\u76f4\u5f84\uff0c\u53ef\u5f97\u7ecf\u8fc7\u5706\u5fc3\u7684\u76f4\u7ebf\u88ab\u5706\u6240\u622a\u5f97\u7684\u5f26\u6700\u957f\u3002
    - A\u3001\u5728\u76f4\u7ebf$y=x$\u4e2d\uff0c\u5f53$x=5$\u65f6\uff0cy=5$\uff0c\u76f4\u7ebf$y=x$\u4e0d\u7ecf\u8fc7\u5706\u5fc3$A(5,4)$\uff0c\u6545\u6b64\u9009\u9879\u9519\u8bef\uff1b
    - B\u3001\u5728\u76f4\u7ebf$y=-x$\u4e2d\uff0c\u5f53$x=5$\u65f6\uff0cy=-5$\uff0c\u76f4\u7ebf$y=-x$\u4e0d\u7ecf\u8fc7\u5706\u5fc3$A(5,4)$\uff0c\u6545\u6b64\u9009\u9879\u9519\u8bef\uff1b
    - C\u3001\u5728\u76f4\u7ebf$y=\dfrac{4}{5}x$\u4e2d\uff0c\u5f53$x=5$\u65f6\uff0cy=4$\uff0c\u76f4\u7ebf$y=\dfrac{4}{5}x$\u7ecf\u8fc7\u5706\u5fc3$A(5,4)$\uff0c\u6545\u6b64\u9009\u9879\u6b63\u786e\uff1b
    - D\u3001\u5728\u76f4\u7ebf$y=-\dfrac{5}{4}x$\u4e2d\uff0c\u5f53$x=5$\u65f6\uff0cy=-\dfrac{25}{4}$\uff0c\u76f4\u7ebf$y=-\dfrac{5}{4}x$\u4e0d\u7ecf\u8fc7\u5706\u5fc3$A(5,4)$\uff0c\u6545\u6b64\u9009\u9879\u9519\u8bef\u3002
    clue: \u5706\u4e2d\u6700\u957f\u7684\u5f26\u662f\u76f4\u5f84\uff0c\u7ecf\u8fc7\u5706\u5fc3\u7684\u76f4\u7ebf\u88ab\u5706\u622a\u5f97\u7684\u5f26\u6700\u957f\u3002
