  blocks:
  - type: choice
    id: Q002
    points: 4
    stem_latex: \u5982\u679c\u51fd\u6570$y=(k+1)x$与$y=\dfrac{k-1}{x}$\u7684\u56fe\u50cf\u6709\u516c\u5171\u70b9\uff0c\u90a3\u4e48\u4e0b\u5217$k$\u7684\u503c\u4e2d\uff0c\u6ee1\u8db3\u6761\u4ef6\u7684\u662f\uff08\quad\uff09
    choices:
    - $-1$
    - $0$
    - $1$
    - $2$
    answer: D
    explanation: \u5b98\u65b9\u53c2\u8003\u7b54\u6848\uff1aD\u3002
    solution_steps:
    - \u4e24\u4e2a\u51fd\u6570\u56fe\u50cf\u6709\u516c\u5171\u70b9\uff0c\u8bf4\u660e\u8054\u7acb\u4e24\u4e2a\u51fd\u6570\u7684\u89e3\u6790\u5f0f\u5f97\u5230\u7684\u65b9\u7a0b\u7ec4\u6709\u975e\u96f6\u89e3\u3002
    - \u8054\u7acb\u5f97\u5230\uff1a$(k+1)x=\dfrac{k-1}{x}$\uff0c\u6574\u7406\u5f97\u5230\uff1a$(k+1)x^2=k-1$\u3002
    - \u8981\u4f7f\u65b9\u7a0b\u6709\u89e3\uff0c\u9700\u8981$\dfrac{k-1}{k+1}>0$\uff0c\u5373\u5206\u5b50\u5206\u6bcd\u540c\u53f7\u3002
    - \u60c5\u51b5\u0024\uff1ak-1>0$且$k+1>0$\uff0c\u89e3\u5f97$k>1$\uff1b\u60c5\u51b5\u0025\uff1ak-1<0$且$k+1<0$\uff0c\u89e3\u5f97$k<-1$\u3002
    - \u7ed3\u5408\u9009\u9879\uff0c\u53ea\u6709$k=2$\u6ee1\u8db3\u6761\u4ef6\u3002
    clue: \u8054\u7acb\u65b9\u7a0b\u7ec4\uff0c\u5229\u7528\u5e73\u65b9\u7684\u975e\u8d1f\u6027\u5206\u6790\u3002
