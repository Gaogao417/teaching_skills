  - type: fillin
    id: Q016
    points: 4
    stem_latex: \u5df2\u77e5\u629b\u7269\u7ebf$y=-x^2-2x+3$\uff0c\u5c06\u5176\u5411\u53f3\u5e73\u79fb$n$\u4e2a\u5355\u4f4d\uff08$n>0$\uff09\uff0c\u4f7f\u5e73\u79fb\u540e\u6240\u5f97\u7684\u629b\u7269\u7ebf\u4e0e\u5750\u6807\u8f74\u6070\u597d\u53ea\u6709\u4e24\u4e2a\u516c\u5171\u70b9\uff0c\u90a3\u4e48$n$\u7684\u503c\u662f________\u3002
    answer: 3
    explanation: \u5b98\u65b9\u53c2\u8003\u7b54\u6848\uff1a3\u3002
    solution_steps:
    - $y=-x^2-2x+3=-(x+1)^2+4$\uff0c\u539f\u629b\u7269\u7ebf\u4e0e$y$\u8f74\u4ea4\u70b9\u4e3a$(0,3)$\u3002
    - \u5de6\u53f3\u5e73\u79fb\u4e0d\u6539\u53d8\u629b\u7269\u7ebf\u7684\u5224\u522b\u5f0f\uff0c\u56e0\u6b64\u5e73\u79fb\u540e\u629b\u7269\u7ebf\u59cb\u7ec8\u4e0e$x$\u8f74\u67092\u4e2a\u4ea4\u70b9\uff0c\u4e14\u4e00\u5b9a\u4e0e$y$\u8f74\u67091\u4e2a\u4ea4\u70b9\u3002
    - \u8981\u4f7f\u603b\u5171\u53ea\u6709\u4e24\u4e2a\u516c\u5171\u70b9\uff0c\u5219\u5fc5\u7136\u662f\u5176\u4e2d\u4e00\u4e2a$x$\u8f74\u4ea4\u70b9\u4e0e$y$\u8f74\u4ea4\u70b9\u91cd\u5408\u4e8e\u539f\u70b9\uff0c\u5373\u539f\u70b9\u5728\u5e73\u79fb\u540e\u7684\u629b\u7269\u7ebf\u4e0a\u3002
    - \u629b\u7269\u7ebf\u5411\u53f3\u5e73\u79fb$n(n>0)$\u4e2a\u5355\u4f4d\uff0c\u5e73\u79fb\u540e\u89e3\u6790\u5f0f\u4e3a\uff1ay=-(x+1-n)^2+4$\uff0c
    - \u5c06$(0,0)$\u4ee3\u5165\u5f97\uff1a-(1-n)^2+4=0$\uff0c\u89e3\u5f97$n=3$\uff08$n=-1$\u820d\u53bb\uff09\u3002
    clue: \u5e73\u79fb\u540e\u629b\u7269\u7ebf\u4e0e\u5750\u6807\u8f74\u6070\u597d\u53ea\u6709\u4e24\u4e2a\u516c\u5171\u70b9\uff0c\u8bf4\u660e\u539f\u70b9\u5728\u5e73\u79fb\u540e\u7684\u629b\u7269\u7ebf\u4e0a\u3002
