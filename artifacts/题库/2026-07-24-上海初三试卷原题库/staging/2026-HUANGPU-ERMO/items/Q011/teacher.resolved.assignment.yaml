    stem_latex: \u5df2\u77e5\u76f4\u7ebf$y=\dfrac{3}{4}x-6$\u4e0e\u5750\u6807\u8f74\u4ea4\u4e8e$A$\u3001$B$\u4e24\u70b9\uff0c\u90a3\u4e48\u7ebf\u6bb5$AB$\u7684\u957f\u662f________\u3002
    answer: 10
    explanation: \u5b98\u65b9\u53c2\u8003\u7b54\u6848\uff1a10\u3002
    solution_steps:
    - \u5728\u76f4\u7ebf$y=\dfrac{3}{4}x-6$\u4e2d\uff0c\u4ee4$x=0$\uff0c\u5219$y=-6$\uff1b
    - \u4ee4$y=0$\uff0c\u5219$\dfrac{3}{4}x-6=0$\uff0c\u89e3\u5f97$x=8$\uff1b
    - $\therefore A(0,-6)$\uff0c$B(8,0)$\u3002
    - $\therefore AB=\sqrt{OA^2+OB^2}=\sqrt{6^2+8^2}=10$\u3002
    clue: \u5148\u6c42\u51fa$A$\u3001$B$\u4e24\u70b9\u7684\u5750\u6807\uff0c\u518d\u6839\u636e\u52fe\u80a1\u5b9a\u7406\u6c42\u89e3\u3002
