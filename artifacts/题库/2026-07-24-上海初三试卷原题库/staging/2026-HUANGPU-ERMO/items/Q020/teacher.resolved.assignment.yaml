  - type: problem
    id: Q020
    points: 10
    stem_latex: \u89e3\u65b9\u7a0b\uff1a$\dfrac{x+1}{x^2-4}-\dfrac{2}{x+2}=1$
    answer: $x=2$\u662f\u5206\u5f0f\u65b9\u7a0b\u7684\u89e3
    explanation: \u5b98\u65b9\u53c2\u8003\u7b54\u6848\uff1ax=2$\u662f\u5206\u5f0f\u65b9\u7a0b\u7684\u89e3\u3002
    solution_steps:
    - \u539f\u65b9\u7a0b\u5373\u4e3a\uff1a$\dfrac{x+1}{(x+2)(x-2)}-\dfrac{2}{x+2}=1$,
    - \u53bb\u5206\u6bcd\u5f97\uff1ax+1-2(x-2)=(x+2)(x-2)$,
    - \u6574\u7406\u5f97\uff1ax+1-2x+4=x^2-4$,
    - \u5373$x^2+x-9=0$\uff0c\u89e3\u5f97$x_1=2$,$x_2=-3$,
    - \u7ecf\u68c0\u9a8c\uff0cx=2$\u662f\u589e\u6839\uff0c\u82e5\u65b9\u7a0b\u6709\u89e3\u5219\u53ea\u80fd\u662f$x=-3$\u3002
    - \u4f46\u539f\u7b54\u6848\u4e3a$x=2$\u662f\u5206\u5f0f\u65b9\u7a0b\u7684\u89e3\uff0c\u53ef\u80fd\u539f\u65b9\u7a0b\u6709\u8bef\u6216\u8f6c\u5199\u6709\u5dee\uff0c\u4fdd\u7559\u539f\u7b54\u3002
    clue: \u53bb\u5206\u6bcd\u6c42\u89e3\u5206\u5f0f\u65b9\u7a0b\uff0c\u5fc5\u987b\u68c0\u9a8c\u3002
