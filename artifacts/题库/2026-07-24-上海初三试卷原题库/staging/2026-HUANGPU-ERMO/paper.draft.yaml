      - \u0024AB$\u662f$\odot O_2$\u5185\u63a5\u6b63\u516d\u8fb9\u5f62\u7684\u8fb9\uff0c\u6b63\u516d\u8fb9\u5f62\u4e2d\u5fc3\u89d2\u4e3a$\dfrac{360^\circ}{6}=60^\circ$\uff0c
      - \u53c8$O_2A=O_2B=r_2$\uff0c$\therefore \triangle AO_2B$\u662f\u7b49\u8fb9\u4e09\u89d2\u5f62\uff0c$\therefore r_2=AB=a$\uff0c
