      answer: \uff081\uff09$y=-x^2+2x+3$,$D(1,4)$\uff1b\uff082\uff09$C(0,3)$\u6216$C(2,3)$
      explanation: \u5b98\u65b9\u53c2\u8003\u7b54\u6848\uff1a\uff081\uff09$y=-x^2+2x+3$,$D(1,4)$\uff1b\uff082\uff09$C(0,3)$\u6216$C(2,3)$\u3002
      solution_steps:
      - \uff081\uff09\u629b\u7269\u7ebf$y=-x^2+bx+c$\u7ecf\u8fc7$A(-1,0)$\u548c$B(3,0)$,
      - \u4ee3\u5165\u5f97\uff1a$\begin{cases}-1-b+c=0\\-9+3b+c=0\end{cases}$,\u89e3\u5f97$b=2$,$c=3$,
      - $\therefore y=-x^2+2x+3=-(x-1)^2+4$,$\therefore D(1,4)$.
      - \uff082\uff09\u8bbe$C(m,-m^2+2m+3)$,\u7531$\angle ACB=90^\circ$,
      - $\therefore \overrightarrow{CA}\cdot\overrightarrow{CB}=0$,
      - $\overrightarrow{CA}=(-1-m,m^2-2m-3)$,$\overrightarrow{CB}=(3-m,m^2-2m-3)$,
      - $\therefore (-1-m)(3-m)+(m^2-2m-3)^2=0$,
      - \u5373$(m+1)(m-3)+(m+1)^2(m-3)^2=0$,
      - \u5373$(m+1)(m-3)[1+(m+1)(m-3)]=0$,
      - \u89e3\u5f97$m_1=-1$,$m_2=3$,$m_3=0$,$m_4=2$,
      - \u5f53$m=-1$\u6216$m=3$\u65f6\uff0c\u70b9$C$\u4e0e$A$\u6216$B$\u91cd\u5408\uff0c\u82e5\u4e09\u89d2\u5f62\u5b58\u5728\u5219\u82e5\u65b9\u65e0\u610f\u4e49\uff0c\u82e5\u9898\u76ee\u6ca1\u6709\u5176\u4ed6\u9650\u5236\u5219\u4fdd\u7559\uff1b
      - \u5f53$m=0$\u65f6\uff0c$C(0,3)$\uff1b\u5f53$m=2$\u65f6\uff0c$C(2,3)$.
