  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图9，在正方形 $ABCD$ 中，点 $E,F$ 分别在边 $CD,BC$ 上，且 $CE=BF$，$DF$ 分别交 $AE,AC$ 于点 $P,Q$。（1）求证：$AE\perp DF$；（2）求证：$AQ\cdot BF=\sqrt2\,PQ\cdot DF$。
    answer: 见证明。
    solution_steps:
    - title: 第（1）问
      content: $\because$ 在正方形 $ABCD$ 中，$CD=BC,\ AD=CD,\ \angle ADE=\angle DCF=90^\circ$。又 $CE=BF$，所以 $DE=CF$，从而 $\triangle ADE\cong\triangle CDF$。由角关系得 $\angle APQ=90^\circ$，故 $AE\perp DF$。
      diagram_col:
        image_path: assets/solution-01.png
        width: 58mm
        variant: solution
        disclosure_policy: teacher_only
    - title: 第（2）问
      content: 过点 $E$ 作 $EG\perp AC$，垂足为 $G$。由 $\triangle APQ\sim\triangle AEG$，得 $\frac{AQ}{PQ}=\frac{AE}{EG}$。在正方形中 $\angle DCF=45^\circ$，故 $EG=\frac{\sqrt2}{2}CE=\frac{\sqrt2}{2}BF$；又由全等得 $AE=DF$。所以 $\frac{AQ}{PQ}=\frac{DF}{(\sqrt2/2)BF}$，即 $AQ\cdot BF=\sqrt2\,PQ\cdot DF$。
    source_solution_images:
    - image_path: assets/official-solution-01.png
      width: 0.96\linewidth
      variant: source_solution
      disclosure_policy: teacher_only
      label: 官方原解答第1页
