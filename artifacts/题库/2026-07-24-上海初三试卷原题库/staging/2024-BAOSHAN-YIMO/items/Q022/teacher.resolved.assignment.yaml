  - type: problem
    id: Q022
    points: 10
    stem_latex: 综合实践活动中，某小组利用木板和铅锤自制了一个简易测高仪测量塔高。测高仪 $ABCD$ 为矩形，$CD=30\mathrm{cm}$，顶点 $D$ 处挂了一个铅锤 $H$。图8是测量塔高的示意图，测高仪上的点 $C,D$ 与塔顶 $G$ 在一条直线上，铅垂线 $DH$ 交 $BC$ 于点 $M$。经测量，点 $D$ 距地面 $1.9\mathrm m$，到塔 $EG$ 的距离 $DF=13\mathrm m$，$CM=20\mathrm{cm}$。求塔 $EG$ 的高度（结果精确到 $1\mathrm m$）。
    answer: 约21米。
    solution_steps:
    - title: 解
      content: 在 $\mathrm{Rt}\triangle CDM$ 中，$\cot\angle CDM=\frac{CD}{CM}=\frac{30}{20}=\frac32$。又 $DF\perp EG$，由题意得 $\angle CDM=\angle DGF$。在 $\mathrm{Rt}\triangle DGF$ 中，$\cot\angle DGF=\frac{GF}{DF}=\frac32$。由 $DF=13$，得 $GF=\frac{39}{2}\mathrm m$。所以 $EG=GF+EF=\frac{39}{2}+1.9\approx21\mathrm m$。
