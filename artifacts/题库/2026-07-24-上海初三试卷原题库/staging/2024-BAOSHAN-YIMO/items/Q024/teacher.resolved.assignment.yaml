  - type: problem
    id: Q024
    points: 12
    stem_latex: 如图10，在平面直角坐标系 $xOy$ 中，将抛物线 $y=\frac12x^2$ 平移，使平移后的抛物线仍经过原点 $O$，新抛物线的顶点为 $M$（点 $M$ 在第四象限），对称轴与抛物线 $y=\frac12x^2$ 交于点 $N$，且 $MN=4$。（1）求平移后抛物线的表达式；（2）如果点 $N$ 平移后的对应点是点 $P$，判断以点 $O,M,N,P$ 为顶点的四边形的形状，并说明理由；（3）抛物线 $y=\frac12x^2$ 上的点 $A$ 平移后的对应点是点 $B$，$BC\perp MN$，垂足为点 $C$，如果 $\triangle ABC$ 是等腰三角形，求点 $A$ 的坐标。
    answer: （1）$y=\frac12(x-2)^2-2$；（2）正方形；（3）$(4,8),(2\sqrt2,4),(-2\sqrt2,4),(2,2)$。
    solution_steps:
    - title: 第（1）问
      content: 设 $N(t,\frac12t^2)\ (t>0)$，则 $M(t,\frac12t^2-4)$。平移后抛物线为 $y=\frac12(x-t)^2+\frac12t^2-4$。由其经过 $O(0,0)$，得 $t=2$（负值不合题意），所以 $y=\frac12(x-2)^2-2$。
    - title: 第（2）问
      content: 由题意得 $O(0,0),M(2,-2),N(2,2),P(4,0)$。四边形 $OMPN$ 是平行四边形，且 $MN=OP=4$，所以是矩形；又 $NO=NP=2\sqrt2$，所以四边形 $OMPN$ 是正方形。
    - title: 第（3）问
      content: 设 $A(a,\frac12a^2)$，则 $B(a+2,\frac12a^2-2),C(2,\frac12a^2-2)$。可得 $AB=2\sqrt2,\ AC=\sqrt{(a-2)^2+2^2},\ BC=\sqrt{a^2}$。分别令 $AB=AC$、$AB=BC$、$AC=BC$，解得点 $A$ 的坐标为 $(4,8),(2\sqrt2,4),(-2\sqrt2,4),(2,2)$。
