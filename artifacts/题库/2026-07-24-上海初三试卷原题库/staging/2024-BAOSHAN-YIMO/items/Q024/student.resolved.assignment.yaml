    stem_latex: 如图10，在平面直角坐标系 $xOy$ 中，将抛物线 $y=\frac12x^2$ 平移，使平移后的抛物线仍经过原点 $O$，新抛物线的顶点为 $M$（点 $M$ 在第四象限），对称轴与抛物线 $y=\frac12x^2$ 交于点 $N$，且 $MN=4$。（1）求平移后抛物线的表达式；（2）如果点 $N$ 平移后的对应点是点 $P$，判断以点 $O,M,N,P$ 为顶点的四边形的形状，并说明理由；（3）抛物线 $y=\frac12x^2$ 上的点 $A$ 平移后的对应点是点 $B$，$BC\perp MN$，垂足为点 $C$，如果 $\triangle ABC$ 是等腰三角形，求点 $A$ 的坐标。
