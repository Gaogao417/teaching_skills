  - type: problem
    id: Q021
    points: 10
    stem_latex: 在平面直角坐标系 $xOy$ 中，已知二次函数 $y=x^2+bx+c$ 的图像经过点 $A(1,0)$ 和 $B(0,3)$。（1）求该二次函数的表达式；（2）如果点 $E(4,m)$ 在该函数图像上，求 $\triangle ABE$ 的面积。
    answer: （1）$y=x^2-4x+3$；（2）6。
    solution_steps:
    - title: 第（1）问
      content: 由图像经过 $B(0,3)$，得 $c=3$；再代入 $A(1,0)$，得 $1+b+3=0$，所以 $b=-4$。故表达式为 $y=x^2-4x+3$。
    - title: 第（2）问
      content: 把 $x=4$ 代入，得 $y=3$，所以 $E(4,3)$。由 $B(0,3)$，可知 $BE\parallel x$ 轴，$BE=4$，点 $A$ 到 $BE$ 的距离为3，所以 $S_{\triangle ABE}=\frac12\cdot4\cdot3=6$。
