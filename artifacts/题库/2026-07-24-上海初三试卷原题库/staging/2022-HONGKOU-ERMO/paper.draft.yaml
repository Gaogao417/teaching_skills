        (1) 求证：$OM=ON$；

        (2) 当 $\angle BAC$ 为锐角时，如果 $AO^{2}=AM\cdot AC$，求证：四边形 $AMON$ 为等腰梯形。'
      answer: 见证明
      clue: (1) 证 $\triangle AOM\cong\triangle CON$；(2) 证 $\triangle AOM\sim\triangle
