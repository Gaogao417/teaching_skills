        CON$ 中 $OA=OC$，$\angle OAM=\angle OCN$，$AM=CN$，$\therefore \triangle AOM\cong\triangle
        CON$（SAS），$OM=ON$。
      - (2) $AO^{2}=AM\cdot AC\Rightarrow \dfrac{AO}{AM}=\dfrac{AC}{AO}$，$\angle OAB=\angle
        OAC$，$\therefore \triangle AOM\sim\triangle ACO$，$\angle AOM=\angle ACO$。
      - 由 $\angle OAB=\angle AOM$ 得 $AM=MO$，又 $OM\parallel AC$，结合 $AM=MO=ON$，四边形 $AMON$
        为等腰梯形。
