        $y$（米）与时间 $x$（分）的函数图象为折线（过 $(0,3000)$、$(24,0)$、$(40,1000)$）。

        (1) 两人从出发到相遇需要多少分钟？

        (2) 当 $0\leqslant x\leqslant24$ 时，求 $y$ 关于 $x$ 的解析式；

        (3) 当小杰到达乙处时，小丽距甲处还有多少米？'
      answer: (1) $24$ 分钟；(2) $y=-125x+3000$；(3) $1000$ 米
      clue: 相遇点即 $y=0$；用图象上点求解析式。
      solution_steps:
      - (1) 相遇即 $y=0$，由图知 $x=24$ 分钟。
      - (2) 图象过 $(0,3000)$、$(24,0)$，设 $y=kx+b$，解得 $y=-125x+3000$。
      - (3) $v_{\text{小杰}}+v_{\text{小丽}}=\dfrac{3000}{24}=125$，$v_{\text{小杰}}=\dfrac{3000}{40}=75$，$v_{\text{小丽}}=50$。
      - 小杰到乙时（40分），小丽已走 $40\times50=2000$，距甲 $3000-2000=1000$ 米。
