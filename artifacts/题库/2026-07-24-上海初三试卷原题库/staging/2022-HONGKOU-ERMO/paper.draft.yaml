      solution_steps:
      - $BM=\sqrt{BC^{2}+CM^{2}}=\dfrac{\sqrt{5}}{2}$。翻折得 $BE=BC=1$，$EM=CM=\dfrac{1}{2}$。
      - 由 $BE=BA$ 得 $\angle HBF=45^{\circ}$，$\angle HBF=\angle F$，$EF=\sqrt{2}EG$。
      - $S_{\triangle BEM}=\dfrac{1}{2}\times\dfrac{1}{2}\times1=\dfrac{1}{2}EG\times\dfrac{\sqrt{5}}{2}$，$EG=\dfrac{\sqrt{5}}{5}$，$\therefore
        EF=\dfrac{\sqrt{10}}{5}$。
