  - type: problem
    id: Q019
    points: 10
    stem_latex: 计算：$\dfrac{1}{\sqrt{3}+\sqrt{2}}+(\pi)^{0}+|\sqrt{2}-1|-12^{\frac{1}{2}}$
    answer: $-\sqrt{3}$
    clue: 分母有理化+零指数幂+绝对值+分数指数幂。
    solution_steps:
    - $\dfrac{1}{\sqrt{3}+\sqrt{2}}=\sqrt{3}-\sqrt{2}$，$(\pi)^{0}=1$，$|\sqrt{2}-1|=\sqrt{2}-1$，$12^{\frac{1}{2}}=2\sqrt{3}$。
    - 原式 $=(\sqrt{3}-\sqrt{2})+1+(\sqrt{2}-1)-2\sqrt{3}=-\sqrt{3}$。
