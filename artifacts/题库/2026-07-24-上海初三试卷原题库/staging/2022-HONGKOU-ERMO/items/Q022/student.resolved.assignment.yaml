    stem_latex: '健身步道甲、乙两处相距3000米，小杰、小丽分别从甲、乙同时出发相向而行（小杰较快），小杰到乙后停止，小丽继续到甲后停止。两人距离 $y$（米）与时间 $x$（分）的函数图象为折线（过 $(0,3000)$、$(24,0)$、$(40,1000)$）。

      (1) 两人从出发到相遇需要多少分钟？

      (2) 当 $0\leqslant x\leqslant24$ 时，求 $y$ 关于 $x$ 的解析式；

      (3) 当小杰到达乙处时，小丽距甲处还有多少米？'
