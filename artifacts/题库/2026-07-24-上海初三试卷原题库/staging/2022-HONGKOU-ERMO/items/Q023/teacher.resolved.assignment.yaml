  - type: problem
    id: Q023
    points: 12
    stem_latex: '如图，$AB$、$AC$ 是 $\odot O$ 的两条弦，$AB=AC$，$M$、$N$ 分别在 $AB$、$AC$ 上且 $AM=CN$（$AM<AN$），联结 $OM$、$ON$。

      (1) 求证：$OM=ON$；

      (2) 当 $\angle BAC$ 为锐角时，如果 $AO^{2}=AM\cdot AC$，求证：四边形 $AMON$ 为等腰梯形。'
    answer: 见证明
    clue: (1) 证 $\triangle AOM\cong\triangle CON$；(2) 证 $\triangle AOM\sim\triangle ACO$ 得 $OM\parallel AC$。
    solution_steps:
    - (1) $AB=AC\Rightarrow \angle OAB=\angle OAC=\angle OCA$。在 $\triangle AOM$、$\triangle CON$ 中 $OA=OC$，$\angle OAM=\angle OCN$，$AM=CN$，$\therefore \triangle AOM\cong\triangle CON$（SAS），$OM=ON$。
    - (2) $AO^{2}=AM\cdot AC\Rightarrow \dfrac{AO}{AM}=\dfrac{AC}{AO}$，$\angle OAB=\angle OAC$，$\therefore \triangle AOM\sim\triangle ACO$，$\angle AOM=\angle ACO$。
    - 由 $\angle OAB=\angle AOM$ 得 $AM=MO$，又 $OM\parallel AC$，结合 $AM=MO=ON$，四边形 $AMON$ 为等腰梯形。
