  - type: problem
    id: Q024
    points: 12
    stem_latex: '抛物线 $y=ax^{2}+bx+6$ 与 $x$ 轴交于 $A(-2,0)$、$B(6,0)$，与 $y$ 轴交于 $C$，顶点为 $D$，联结 $BC$ 交对称轴 $l$ 于 $E$。

      (1) 求抛物线表达式；

      (2) $P$ 在射线 $DE$ 上，若 $S_{\triangle PDB}=S_{\triangle CDB}$，求 $P$；

      (3) $M$ 在线段 $BE$ 上，$N$ 在对称轴 $l$ 右侧抛物线上，若 $\triangle EMN$ 是以 $EM$ 为腰的等腰直角三角形，求 $M$。'
    answer: (1) $y=-\dfrac{1}{2}x^{2}+2x+6$；(2) $P(2,2)$；(3) $M(4,2)$ 或 $(2+\sqrt{2},4-\sqrt{2})$
    clue: (1) 待定系数；(2) 面积相等求 $P$；(3) 分直角顶点分类。
    solution_steps:
    - (1) 设 $y=a(x+2)(x-6)$，代入 $(0,6)$ 得 $a=-\dfrac{1}{2}$，$\therefore y=-\dfrac{1}{2}x^{2}+2x+6$。
    - (2) $C(0,6)$，$D(2,8)$，$E(2,4)$，$DE=4$。$S_{\triangle CDB}=12$。设 $P(2,p)$，$DP=8-p$，$S_{\triangle PDB}=\dfrac{1}{2}\times4\times(8-p)=16-2p=12$，$p=2$，$P(2,2)$。
    - (3) ① $\angle MEN=90^{\circ}$：K型全等 $\triangle NEK\cong\triangle EML$，解得 $M(4,2)$。
    - ② $\angle EMN=90^{\circ}$：$EN\parallel OB$，$y_{N}=4$，$N(2+2\sqrt{2},4)$，由 $EM=MN$ 解得 $M(2+\sqrt{2},4-\sqrt{2})$。
