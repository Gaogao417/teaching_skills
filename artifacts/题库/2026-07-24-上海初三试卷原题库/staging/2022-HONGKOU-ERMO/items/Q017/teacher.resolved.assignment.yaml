  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 矩形 $ABCD$（$AB=4$，$BC=6$），$E$ 为 $BC$ 中点，$O$ 在 $AE$ 上，$\odot O$ 半径为1，如果 $\odot O$ 与矩形各边都没有公共点，那么 $AO$ 的取值范围是______
    answer: $\dfrac{5}{3}<AO<\dfrac{15}{4}$
    clue: 分别求与 $AB$、$BC$ 相切时的 $OA$。
    solution_steps:
    - $AE=\sqrt{AB^{2}+BE^{2}}=5$。
    - 与 $AB$ 相切：$\dfrac{OM}{BE}=\dfrac{OA}{AE}$，$OA=\dfrac{5}{3}$。
    - 与 $BC$ 相切：$OE=\dfrac{5}{4}$，$OA=5-\dfrac{5}{4}=\dfrac{15}{4}$。
    - $\therefore \dfrac{5}{3}<AO<\dfrac{15}{4}$。
