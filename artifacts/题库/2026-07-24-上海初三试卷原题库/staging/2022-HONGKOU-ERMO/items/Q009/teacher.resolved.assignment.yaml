  - type: short_answer
    id: Q009
    points: 4
    stem_latex: 方程 $\sqrt{2-x}=x$ 的解是______
    answer: $x=1$
    clue: 两边平方后求解并检验。
    solution_steps:
    - $2-x=x^{2}$，$x^{2}+x-2=0$，$(x+2)(x-1)=0$，$x=-2$ 或 $x=1$。
    - 由 $2-x\geqslant0$ 知 $x\leqslant2$，且 $x\geqslant0$，$\therefore x=1$。
