  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，平行四边形 $ABCD$ 中对角线 $AC$、$BD$ 交于 $E$，设 $\vec{AB}=\vec{a}$，$\vec{AD}=\vec{b}$，那么 $\vec{EB}=$______
    answer: $\dfrac{1}{2}\vec{a}-\dfrac{1}{2}\vec{b}$
    clue: $\vec{EB}=\dfrac{1}{2}\vec{DB}$。
    solution_steps:
    - $\vec{DB}=\vec{DC}+\vec{CB}=\vec{a}-\vec{b}$，$\vec{EB}=\dfrac{1}{2}\vec{DB}=\dfrac{1}{2}\vec{a}-\dfrac{1}{2}\vec{b}$。
