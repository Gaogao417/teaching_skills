    id: Q012
    points: 4
    stem_latex: 点 $A(x_{1},y_{1})$、$B(x_{2},y_{2})$ 在双曲线 $y=\dfrac{3}{x}$ 上，如果 $0<x_{1}<x_{2}$，那么 $y_{1}$ ______ $y_{2}$。
    answer: $>$
    clue: $k>0$ 第一象限内 $y$ 随 $x$ 增大而减小。
    solution_steps:
    - $k=3>0$，第一象限内 $y$ 随 $x$ 增大而减小，$0<x_{1}<x_{2}$，$\therefore y_{1}>y_{2}$。
