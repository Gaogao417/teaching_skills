  - type: problem
    id: Q021
    points: 10
    stem_latex: '如图，$\triangle ABC$ 中，$\angle B=45^{\circ}$，$CD$ 是 $AB$ 边上的中线，过 $D$ 作 $DE\perp BC$ 于 $E$，$CD=5$，$\sin\angle BCD=\dfrac{3}{5}$。

      (1) 求 $BC$ 的长；

      (2) 求 $\angle ACB$ 的正切值。'
    answer: (1) $BC=7$；(2) $\tan\angle ACB=6$
    clue: 解直角三角形+中线。
    solution_steps:
    - (1) $\mathrm{Rt}\triangle DEC$ 中 $DE=5\times\dfrac{3}{5}=3$，$CE=\sqrt{5^{2}-3^{2}}=4$。
    - $\mathrm{Rt}\triangle DEB$ 中 $\angle B=45^{\circ}$，$BE=DE=3$，$\therefore BC=3+4=7$。
    - (2) $BD=3\sqrt{2}$，$AB=2BD=6\sqrt{2}$。作 $AH\perp BC$，$BH=AH=6$，$CH=BC-BH=1$。
    - $\tan\angle ACB=\dfrac{AH}{CH}=\dfrac{6}{1}=6$。
