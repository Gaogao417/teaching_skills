  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases} 2x-3y=3 \\ x^{2}-9y^{2}=0 \end{cases}$
    answer: $\begin{cases} x=1 \\ y=-\dfrac{1}{3} \end{cases}$ 或 $\begin{cases} x=3 \\ y=1 \end{cases}$
    clue: 由①得 $9y^{2}=(2x-3)^{2}$ 代入②。
    solution_steps:
    - 由① $9y^{2}=(2x-3)^{2}$，代入②得 $x^{2}-(2x-3)^{2}=0$，即 $x^{2}-4x+3=0$。
    - $x=1$ 或 $x=3$。
    - $x=1$ 时 $y=-\dfrac{1}{3}$；$x=3$ 时 $y=1$。
