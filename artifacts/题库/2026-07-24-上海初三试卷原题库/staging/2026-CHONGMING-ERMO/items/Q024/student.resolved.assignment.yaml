    stem_latex: '在平面直角坐标系 $xOy$ 中，已知抛物线 $y=ax^2-6ax+c$（$a<0$）与 $x$ 轴交于 $A(1,0)$ 和点 $B$，顶点为 $D$。

      （1）求此抛物线的对称轴及点 $B$ 的坐标；

      （2）抛物线的对称轴与 $x$ 轴交于点 $M$，点 $P$ 是抛物线上横坐标为 $2$ 的一点，$BP$ 与对称轴交于点 $N$，连接 $BD$。

      ① 求 $S_{\triangle BDN}:S_{\triangle BMN}$ 的值；

      ② 设直线 $PD$ 与 $x$ 轴交于点 $F$，过点 $F$ 作 $BD$ 的平行线，与 $y$ 轴交于点 $E$，当四边形 $BDFE$ 是直角梯形时，求 $\tan\angle PBO$ 的值。'
