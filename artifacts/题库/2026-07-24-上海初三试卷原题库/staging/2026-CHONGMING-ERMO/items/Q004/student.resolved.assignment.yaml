    stem_latex: '某校为了解学生体育运动时间的情况，将调查所得的 $50$ 个数据整理成下表：


      | 体育运动时间（小时） | $1.5$ | $1.7$ | $1.8$ | $2$ | $2.2$ |

      |---|---|---|---|---|---|

      | 人数（人） | $10$ | $10$ | $20$ | $5$ | $5$ |


      对于这组数据，下列判断中，正确的是（\quad）'
    choices:
    - 众数和平均数相等
    - 中位数和平均数相等
    - 中位数和众数相等
    - 中位数、众数和平均数都相等
