    id: Q010
    points: 4
    stem_latex: 不等式组 $\begin{cases}\dfrac{x}{2}+1\geq 0\\3x-2<x\end{cases}$ 的解集是__________。
    answer: $-2\leq x<1$
    explanation: 官方参考答案：$-2\leq x<1$。
    solution_steps:
    - 解①：$\dfrac{x}{2}\geq -1$，$x\geq -2$。
    - 解②：$3x-x<2$，$2x<2$，$x<1$。
    - 取交集：$-2\leq x<1$。
