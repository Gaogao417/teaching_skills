  - type: fillin
    id: Q008
    points: 4
    stem_latex: 方程 $\sqrt{2x-1}=3$ 的解是__________。
    answer: $x=5$
    explanation: 官方参考答案：$x=5$。
    solution_steps:
    - 两边平方得 $2x-1=9$，$2x=10$，$x=5$。
    - 检验：$\sqrt{2\times5-1}=\sqrt{9}=3$，$x=5$ 是原方程的解。
