    id: Q016
    points: 4
    stem_latex: 在某次演习中，我国火箭军成功发射了一枚“东风$-31AG$”洲际弹道导弹，导弹平均速度为 $25$ 马赫，马赫为速度单位，$1$ 马赫约为 $340$ 米/秒．用科学记数法表示“东风$-31AG$”导弹的平均速度为__________米/秒．
    answer: $8.5\times 10^3$
    explanation: 官方参考答案：$8.5\times 10^3$。
    solution_steps:
    - $25\times 340=8500=8.5\times 10^3$。
