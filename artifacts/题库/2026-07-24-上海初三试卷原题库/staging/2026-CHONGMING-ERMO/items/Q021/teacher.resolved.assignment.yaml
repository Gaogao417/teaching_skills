  - type: problem
    id: Q021
    points: 10
    stem_latex: '如图，已知 $\odot O$ 是 $\triangle ABC$ 的外接圆，$AB$ 是 $\odot O$ 的直径，$AC$ 为 $\odot O$ 的弦，且 $AC=8$，点 $D$ 为 $\overset{\frown}{AC}$ 的中点，连接 $OD$，交 $AC$ 于点 $E$，$DE=2$。

      （1）求 $\odot O$ 的半径；

      （2）连接 $OA$，求 $\cos\angle OAE$ 的值。'
    answer: （1）$r=5$；（2）$\cos\angle OAE=\dfrac{4}{5}$
    explanation: 官方参考答案：（1）$5$；（2）$\dfrac{4}{5}$。
    solution_steps:
    - （1）$D$ 为 $\overset{\frown}{AC}$ 中点，$OD\perp AC$，$AE=EC=4$。设 $OE=x$，$r=x+2$。
    - 由 $OA^2=OE^2+AE^2$：$(x+2)^2=x^2+16$，$4x=12$，$x=3$，$r=5$。
    - （2）$\cos\angle OAE=\dfrac{AE}{OA}=\dfrac{4}{5}$。
