    id: Q017
    points: 4
    stem_latex: 如图，已知在正六边形 $ABCDEF$ 中，$AB=4$，点 $G$ 是边 $BC$ 的中点，连接 $FG$ 并延长，交 $DC$ 延长线于点 $H$，则 $CH$ 的长为__________。
    answer: $\dfrac{8}{3}$
    explanation: 官方参考答案：$\dfrac{8}{3}$。
    solution_steps:
    - 正六边形内角 $120^\circ$，延长 $CB$、$FA$ 交于 $M$，$\triangle ABM$ 为等边三角形，$MA=MB=AB=4$。
    - $G$ 为 $BC$ 中点，$BG=CG=2$，$MG=MB+BG=6$。
    - $\triangle MFG\sim\triangle CHG$，$\dfrac{CH}{MF}=\dfrac{CG}{MG}=\dfrac{2}{6}=\dfrac{1}{3}$，$MF=MA+AF=8$。
    - $CH=\dfrac{8}{3}$。
