  - type: fillin
    id: Q011
    points: 4
    stem_latex: 将抛物线 $y=x^2+2x-3$ 向上平移 $4$ 个单位后，所得的新抛物线与 $y$ 轴的交点坐标为_________。
    answer: $(0,1)$
    explanation: 官方参考答案：$(0,1)$。
    solution_steps:
    - 向上平移 $4$ 个单位：$y=x^2+2x-3+4=x^2+2x+1$。
    - 令 $x=0$，$y=1$，交点坐标为 $(0,1)$。
