    stem_latex: '如图$1$，$AB$ 是半圆 $O$ 的直径，点 $C$ 是半圆上一点，过点 $C$ 的直线交 $BA$ 的延长线于点 $D$，点 $E$ 是线段 $OB$ 上一点，且满足 $OE=AD$，过点 $E$ 作 $AB$ 的垂线交 $DC$ 的延长线于点 $F$，交 $BC$ 于点 $G$，且 $\angle F=2\angle ABC$。

      （1）求证：$\angle ACD=\angle ABC$；

      （2）如图$2$，当 $BE=3OE$ 时，求 $\dfrac{CF}{CD}$ 的值；

      （3）设 $EF$ 与 $\overset{\frown}{BC}$ 的交点为 $P$，连接 $OP$，交 $BC$ 于点 $M$，若以 $O$ 为圆心，$OE$ 长为半径的圆与以 $P$ 为圆心，$PM$ 为半径的圆外切，求 $\sin\angle ABC$ 的值。'
