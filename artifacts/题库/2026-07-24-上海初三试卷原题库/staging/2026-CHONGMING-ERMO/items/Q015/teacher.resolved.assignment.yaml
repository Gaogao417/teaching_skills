  - type: fillin
    id: Q015
    points: 4
    stem_latex: 在梯形 $ABCD$ 中，$AB\parallel CD$，$AB=2CD$，$AC$ 与 $BD$ 交于点 $P$，令 $\overrightarrow{AB}=\vec{a}$，$\overrightarrow{BC}=\vec{b}$，那么 $\overrightarrow{AP}=$__________；（用向量 $\vec{a}$、$\vec{b}$ 表示）
    answer: $\dfrac{2}{3}\vec{a}+\dfrac{2}{3}\vec{b}$
    explanation: 官方参考答案：$\dfrac{2}{3}\vec{a}+\dfrac{2}{3}\vec{b}$。
    solution_steps:
    - $\overrightarrow{AC}=\overrightarrow{AB}+\overrightarrow{BC}=\vec{a}+\vec{b}$。
    - $AB\parallel CD$，$\triangle ABP\sim\triangle CDP$，$\dfrac{AP}{CP}=\dfrac{AB}{CD}=2$。
    - $AP=\dfrac{2}{3}AC$，$\overrightarrow{AP}=\dfrac{2}{3}\vec{a}+\dfrac{2}{3}\vec{b}$。
