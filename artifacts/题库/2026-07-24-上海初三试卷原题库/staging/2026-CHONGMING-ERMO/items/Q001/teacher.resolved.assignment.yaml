    stem_latex: 下列二次根式中，与 $\sqrt{12}$ 是同类二次根式的是（\quad）
    choices:
    - $\sqrt{2}$
    - $\sqrt{3}$
    - $\sqrt{5}$
    - $\sqrt{6}$
    answer: B
    explanation: 官方参考答案：B。
    solution_steps:
    - $\sqrt{12}=\sqrt{4\times3}=2\sqrt{3}$，观察选项，只有 $\sqrt{3}$ 的被开方数为 $3$，故选B。
