  - type: fillin
    id: Q013
    points: 4
    stem_latex: 在一个平衡的天平左、右两端托盘上，分别放置质量为 $10\mathrm{g}$ 和 $25\mathrm{g}$ 的物品后，天平倾斜（如图所示），现从质量为 $5\mathrm{g}$，$10\mathrm{g}$，$15\mathrm{g}$ 的三件物品中，随机选取两件放置在天平的左端托盘上，则天平恢复平衡的概率为__________。
    answer: $\dfrac{1}{3}$
    explanation: 官方参考答案：$\dfrac{1}{3}$。
    solution_steps:
    - 要使天平恢复平衡，选取的两件物品质量为 $25-10=15(\mathrm{g})$。
    - 从 $5,10,15$ 中选两件共 $\mathrm{C}_3^2=6$ 种，和为 $15$ 的有 $(5,10)$ 共 $2$ 种。
    - 概率 $=\dfrac{2}{6}=\dfrac{1}{3}$。
