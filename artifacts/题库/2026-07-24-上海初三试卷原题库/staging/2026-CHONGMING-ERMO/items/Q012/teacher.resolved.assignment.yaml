  - type: fillin
    id: Q012
    points: 4
    stem_latex: 若关于 $x$ 的一元二次方程 $ax^2-2x+1=0$ 有实数根，则 $a$ 的取值范围是_____________。
    answer: $a\leq 1$ 且 $a\neq 0$
    explanation: 官方参考答案：$a\leq 1$ 且 $a\neq 0$。
    solution_steps:
    - 一元二次方程 $a\neq 0$，有实数根需 $\Delta=(-2)^2-4a\cdot 1\geq 0$。
    - $4-4a\geq 0$，$a\leq 1$。综合 $a\neq 0$，得 $a\leq 1$ 且 $a\neq 0$。
