    stem_latex: 计算：$(\sqrt{3})^{-1}-(\pi-1)^0+12^{\frac{1}{2}}-|\sqrt{3}-1|$
    answer: $\dfrac{4\sqrt{3}}{3}$
    explanation: 官方参考答案：$\dfrac{4\sqrt{3}}{3}$。
    solution_steps:
    - $(\sqrt{3})^{-1}=\dfrac{\sqrt{3}}{3}$，$(\pi-1)^0=1$，$12^{\frac{1}{2}}=2\sqrt{3}$，$|\sqrt{3}-1|=\sqrt{3}-1$。
    - $=\dfrac{\sqrt{3}}{3}-1+2\sqrt{3}-\sqrt{3}+1=\dfrac{\sqrt{3}}{3}+\sqrt{3}=\dfrac{4\sqrt{3}}{3}$。
