  - type: choice
    id: Q002
    points: 4
    stem_latex: 下列运算中，计算结果正确的是（\quad）
    choices:
    - $a^2\cdot 2a^3=2a^6$
    - $a^2+2a^3=3a^5$
    - $(a^2)^3=a^5$
    - $a^5\div 2a^2=\dfrac{1}{2}a^3$
    answer: D
    explanation: 官方参考答案：D。
    solution_steps:
    - 'A: $a^2\cdot 2a^3=2a^{2+3}=2a^5\neq 2a^6$，不符合；'
    - 'B: $a^2$ 与 $2a^3$ 不是同类项，不能合并，$a^2+2a^3\neq 3a^5$，不符合；'
    - 'C: $(a^2)^3=a^{2\times3}=a^6\neq a^5$，不符合；'
    - 'D: $a^5\div 2a^2=\dfrac{1}{2}a^{5-2}=\dfrac{1}{2}a^3$，正确。'
