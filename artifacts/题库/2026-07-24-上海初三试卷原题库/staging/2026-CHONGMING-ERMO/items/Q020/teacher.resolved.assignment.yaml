  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程：$\dfrac{x+1}{x^2-5x+6}-\dfrac{4}{x-3}=1$
    answer: $x=-1$
    explanation: 官方参考答案：$x=-1$。
    solution_steps:
    - $\dfrac{x+1}{(x-2)(x-3)}-\dfrac{4}{x-3}=1$。
    - 去分母：$x+1-4(x-2)=(x-2)(x-3)$。
    - 整理：$x^2-2x-3=0$，解得 $x=-1$ 或 $x=3$。
    - 经检验 $x=3$ 是增根，$x=-1$ 是分式方程的解。
