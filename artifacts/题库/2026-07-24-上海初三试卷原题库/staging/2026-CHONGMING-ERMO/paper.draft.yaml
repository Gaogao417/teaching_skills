    official_solution:
      start_anchor: 【答案】（1）快速充电的函数解析式为
      end_anchor: 车辆的电量不能充至
      word_evidence:
      - page_image: documents/初三/2026届-上海市崇明区-初三二模数学-试卷及解析/word/pages/026.png
        page_number: 26
    block:
      stem_latex: '背景：我国新能源汽车产销量连续$10$年全球第一，$2025$年出口$261.5$万辆，纯电动汽车占比超六成．


        素材$1$：工程师对某品牌的$A$款电动车进行充电测试，用快速充电桩和慢速充电桩分别对剩余电量为$0.2$的两台$A$款电动车同时充电，充电时，各自的电量与充电时间（小时）的函数图象分别为图中的线段$AB$和$CD$。


        素材$2$：暑假里，小明一家驾驶某品牌的$A$款电动车从家出发去外地旅游，途中发现电量不足，便驶入服务区充电．此时，车辆剩余电量为$0.2$，但服务区内的快速充电桩已满，只能先使用慢速充电桩充电．小明一家在慢速充电$40$分钟后，恰好有快速充电桩空出，立即改为快速充电（切换时间忽略不计）．由于行程安排，他们在服务区最多能停留$1.5$小时。


        （1）任务一：根据素材$1$，试分别对快速充电和慢速充电两种情况，写出$y$关于$x$的函数解析式，并分别指出自变量的取值范围。

        （2）任务二：当他们离开服务区时，车辆的电量能否充至$100\%$？请说明理由。'
      answer: （1）快速充电 $y_1=0.8x+0.2$（$0\leq x\leq 1$），慢速充电 $y_2=0.1x+0.2$（$0\leq x\leq
        8$）；（2）不能充至$100\%$
      explanation: 官方参考答案：（1）见解析；（2）不能充至$100\%$。
      solution_steps:
      - （1）快速充电过 $(0,0.2)$ 和 $(1,1)$，$y_1=0.8x+0.2$（$0\leq x\leq 1$）。
      - 慢速充电过 $(0,0.2)$ 和 $(8,1)$，$y_2=0.1x+0.2$（$0\leq x\leq 8$）。
      - （2）慢速充 $40$ 分钟 $=\dfrac{2}{3}$ 小时，$y_2=\dfrac{1}{10}\times\dfrac{2}{3}+\dfrac{1}{5}=\dfrac{4}{15}$。
      - 切换后快速充，$\dfrac{4}{15}=\dfrac{4}{5}x+\dfrac{1}{5}$，$x=\dfrac{1}{12}$。
      - 总时间 $\dfrac{2}{3}+\dfrac{1}{12}=\dfrac{3}{4}$ 小时，充到 $100\%$ 还需 $\dfrac{11}{12}$
        小时，$\dfrac{3}{4}+\dfrac{11}{12}=\dfrac{5}{3}>\dfrac{3}{2}$，不能充至 $100\%$。
