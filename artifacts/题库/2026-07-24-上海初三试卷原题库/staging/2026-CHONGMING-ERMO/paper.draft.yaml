        B$ 相交，且点 $C$ 在 $\odot D$ 的内部，则 $AD$ 的取值范围为（\quad）
      choices:
      - $3<AD<\dfrac{25}{6}$
      - $3<AD\leq\dfrac{25}{6}$
      - $\dfrac{25}{6}<AD<5$
      - $\dfrac{25}{6}<AD\leq 5$
      answer: C
      explanation: 官方参考答案：C。
      solution_steps:
      - 在 $\mathrm{Rt}\triangle ABC$ 中，$AB=\sqrt{5^2+12^2}=13$。
      - 设 $AD=r$，则 $BD=13-r$。两圆相交：$|r-5|<BD<r+5$，即 $|r-5|<13-r<r+5$。
      - 点 $C$ 在 $\odot D$ 内部：$CD<r$。由 $\cos A=\dfrac{12}{13}$，$CD^2=r^2+12^2-2\cdot
        r\cdot12\cdot\dfrac{12}{13}=r^2-\dfrac{288}{13}r+144<r^2$，解得 $r>\dfrac{25}{6}$。
      - 综合：$\dfrac{25}{6}<AD<5$。
