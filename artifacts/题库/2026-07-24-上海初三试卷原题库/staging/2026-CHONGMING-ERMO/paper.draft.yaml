      - （1）对称轴 $x=-\dfrac{-6a}{2a}=3$，$A(1,0)$ 关于 $x=3$ 对称得 $B(5,0)$。
      - （2)① $c=5a$，$y=a(x-3)^2-4a$，$D(3,-4a)$。$P(2,-3a)$，$BP$ 方程 $y=-ax+5a$，$N(3,2a)$。
      - $S_{\triangle BDN}:S_{\triangle BMN}=|DN|:|MN|=|-4a-2a|:|2a-0|=6|a|:2|a|=3:1$。
      - ② $PD$ 方程 $y=-ax-a$，$F(-1,0)$，$EF\parallel BD$，$E(0,2a)$。
      - 直角梯形分两种情况讨论，得 $\tan\angle PBO=\dfrac{\sqrt{5}}{2}$。
