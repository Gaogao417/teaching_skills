      - 中位数和平均数相等
      - 中位数和众数相等
      - 中位数、众数和平均数都相等
      answer: C
      explanation: 官方参考答案：C。
      solution_steps:
      - 运动时间为 $1.8$ 小时的人数最多（$20$ 人），众数为 $1.8$。
      - 总 $50$ 个数据，中位数为第 $25$、$26$ 个数据的平均数，均为 $1.8$，中位数 $=1.8$。
      - $\bar{x}=\dfrac{1.5\times10+1.7\times10+1.8\times20+2\times5+2.2\times5}{50}=\dfrac{89}{50}=1.78$。
      - 众数 $=1.8$，中位数 $=1.8$，平均数 $=1.78$，中位数和众数相等。
