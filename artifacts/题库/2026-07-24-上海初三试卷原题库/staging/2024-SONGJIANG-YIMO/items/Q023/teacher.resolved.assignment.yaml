  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，在 $\triangle ABC$ 中，点 $D、E$ 分别在边 $AB、AC$ 上，$DE\parallel BC$，$\angle BDC=\angle DEC$。证明：（1）$\triangle ADE\sim\triangle ACD$；（2）$\frac{CD^2}{BC^2}=\frac{AE}{AC}$。
    answer: 见证明。
    solution_steps:
    - title: 解答
      content: （1）由 $\angle BDC=\angle DEC$ 得 $\angle ADC=\angle AED$，又 $\angle A$ 为公共角，所以 $\triangle ADE\sim\triangle ACD$。（2）由 $DE\parallel BC$ 及题设得 $\triangle BDC\sim\triangle CED$，结合相似三角形面积比与 $DE/BC=AE/AC$，可得 $CD^2/BC^2=AE/AC$。
