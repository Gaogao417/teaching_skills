  - type: problem
    id: Q025
    points: 14
    stem_latex: 在 $\triangle ABC$ 中，$AC=BC$。点 $D$ 是射线 $AC$ 上一点（不与 $A、C$ 重合），点 $F$ 在线段 $BC$ 上，直线 $DF$ 交直线 $AB$ 于点 $E$，且 $CD^2=CF\cdot CB$。（1）当点 $D$ 在 $AC$ 的延长线上时：①证明 $DE=BD$；②若 $CE\parallel BD、CE=2$，求 $EF$；（2）若 $DF:DE=1:2$，求 $AE:EB$。
    answer: （1）①见证明；②$EF=\sqrt5-1$；（2）$AE:EB=1$ 或 $1:3$。
    solution_steps:
    - title: 第（1）问
      content: 由 $CD^2=CF\cdot CB$ 及夹角关系得 $\triangle DCB\sim\triangle FCD$，进而配合 $AC=BC$ 证明 $DE=BD$。若 $CE\parallel BD、CE=2$，利用全等与相似关系解得 $EF=\sqrt5-1$。
      diagram_col:
        image_path: assets/solution-01.png
        width: 58mm
        variant: solution
        disclosure_policy: teacher_only
    - title: 第（2）问：点 $D$ 在 $AC$ 的延长线上
      content: 过点 $D$ 作 $DH\parallel AB$，交 $BC$ 的延长线于点 $H$。由 $DF:DE=1:2$ 及图中的全等关系，得 $DH=AE=EB$，所以 $AE:EB=1$。
      diagram_col:
        image_path: assets/solution-02.png
        width: 58mm
        variant: solution
        disclosure_policy: teacher_only
    - title: 第（2）问：点 $D$ 在线段 $AC$ 上
      content: 过点 $D$ 作 $DG\parallel AB$，交 $BC$ 于点 $G$。由相似、全等关系及 $DF:DE=1:2$，得 $\frac{DG}{BE}=\frac{DF}{EF}=\frac13$，又 $DG=AE$，所以 $AE:EB=1:3$。
      diagram_col:
        image_path: assets/solution-03.png
        width: 66mm
        variant: solution
        disclosure_policy: teacher_only
