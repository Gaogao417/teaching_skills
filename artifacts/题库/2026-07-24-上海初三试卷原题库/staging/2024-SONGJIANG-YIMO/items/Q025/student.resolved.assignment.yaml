    stem_latex: 在 $\triangle ABC$ 中，$AC=BC$。点 $D$ 是射线 $AC$ 上一点（不与 $A、C$ 重合），点 $F$ 在线段 $BC$ 上，直线 $DF$ 交直线 $AB$ 于点 $E$，且 $CD^2=CF\cdot CB$。（1）当点 $D$ 在 $AC$ 的延长线上时：①证明 $DE=BD$；②若 $CE\parallel BD、CE=2$，求 $EF$；（2）若 $DF:DE=1:2$，求 $AE:EB$。
