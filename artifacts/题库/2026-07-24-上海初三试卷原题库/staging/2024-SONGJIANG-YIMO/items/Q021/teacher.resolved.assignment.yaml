  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在 $\triangle ABC$ 中，$AB=15、BC=14、\sin B=\frac45$，$AD\perp BC$ 于点 $D$。（1）求 $AC$；（2）点 $E$ 是边 $AC$ 的中点，求 $\cot\angle
      EBC$。
    answer: （1）$AC=13$；（2）$\cot\angle EBC=\frac{23}{12}$。
    solution_steps:
    - title: 解答
      content: 由 $AD=AB\sin B=12$，得 $BD=9、CD=5$，所以 $AC=13$。过 $E$ 作 $EH\perp BC$，由中位线关系得 $EH=6、CH=2.5$，故 $BH=11.5$，从而 $\cot\angle
        EBC=BH/EH=23/12$。
