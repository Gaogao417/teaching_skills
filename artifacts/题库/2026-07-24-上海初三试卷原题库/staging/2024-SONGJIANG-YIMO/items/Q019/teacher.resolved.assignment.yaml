  - type: problem
    id: Q019
    points: 10
    stem_latex: 二次函数 $y=ax^2+bx+c(a\ne0)$ 的部分对应值如表：$x=0,1,2,3,4$ 时，$y=3,0,-1,?,3$。（1）求解析式并写出顶点 $D$；（2）图像与 $y$ 轴交于 $A$，点 $P(5,t)$
      在图像上，求 $\triangle PAD$ 的面积。
    answer: （1）$y=(x-2)^2-1$，$D(2,-1)$；（2）$S_{\triangle PAD}=15$。
    solution_steps:
    - title: 解答
      content: 由表中 $x=0$ 与 $x=4$ 的函数值相等，得对称轴为 $x=2$，顶点为 $D(2,-1)$。设 $y=a(x-2)^2-1$，代入 $(1,0)$ 得 $a=1$。故 $y=(x-2)^2-1$。点 $A(0,3)、P(5,8)$，分割面积计算得
        $S_{\triangle PAD}=15$。
