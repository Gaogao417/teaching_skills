  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程：$\dfrac{3x-1}{x^{2}-1}-\dfrac{2x-1}{x-1}=1$
    answer: $x=-\dfrac{1}{3}$
    clue: 去分母化为整式方程，检验增根。
    solution_steps:
    - 两边乘 $(x+1)(x-1)$：$3x-1-(2x^{2}+x-1)=x^{2}-1$，即 $3x^{2}-2x-1=0$。
    - $x=1$ 或 $x=-\dfrac{1}{3}$，检验 $x=1$ 为增根，$\therefore x=-\dfrac{1}{3}$。
