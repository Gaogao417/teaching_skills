  - type: short_answer
    id: Q016
    points: 4
    stem_latex: $\triangle ABC$ 中 $DE\parallel BC$，$\triangle ADE$ 与四边形 $BCED$ 面积分别为4、5，$DE=4$，则 $BC=$______
    answer: '6'
    clue: 相似比由面积比求。
    solution_steps:
    - $S_{\triangle ABC}=9$，$k^{2}=\dfrac{4}{9}$，$k=\dfrac{2}{3}$，$BC=\dfrac{DE}{k}=6$。
