  - type: problem
    id: Q024
    points: 12
    stem_latex: '直线 $y=-x+4$ 与 $x$ 轴、$y$ 轴交于 $A$、$B$，抛物线 $y=-\dfrac{1}{2}x^{2}+bx+c$ 经过 $A$、$B$。

      (1) 求抛物线解析式；

      (2) 直线 $AB$ 与抛物线对称轴交于 $C$，求 $OC$；

      (3) $P$ 在 $OA$ 上，过 $P$ 作 $AB$ 的平行线交 $y$ 轴于 $Q$，把 $\triangle OPQ$ 沿 $PQ$ 翻折，$O$ 的对应点 $D$ 在抛物线上，求 $P$。'
    answer: (1) $y=-\dfrac{1}{2}x^{2}+x+4$；(2) $OC=\sqrt{10}$；(3) $P(2\sqrt{2},0)$
    clue: (1) 待定系数；(2) 对称轴与 $AB$ 交点；(3) 翻折得正方形。
    solution_steps:
    - (1) $A(4,0)$，$B(0,4)$，代入得 $b=1$，$c=4$，$y=-\dfrac{1}{2}x^{2}+x+4$。
    - (2) 对称轴 $x=1$，$C(1,3)$，$OC=\sqrt{1+9}=\sqrt{10}$。
    - (3) $\angle OPQ=\angle OQP=45^{\circ}$，四边形 $DPOQ$ 为正方形，$D(t,t)$。代入抛物线 $t=-\dfrac{1}{2}t^{2}+t+4$，$t=2\sqrt{2}$（负值舍），$P(2\sqrt{2},0)$。
