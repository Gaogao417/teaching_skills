    stem_latex: 点 $P(2,\sqrt{3})$，圆 $P$ 半径为 $2$，下列正确的是（\quad）
    choices:
    - 圆 $P$ 与 $x$ 轴有一个公共点，与 $y$ 轴有两个公共点
    - 圆 $P$ 与 $x$ 轴有两个公共点，与 $y$ 轴有一个公共点
    - 圆 $P$ 与 $x$ 轴、$y$ 轴都有两个公共点
    - 圆 $P$ 与 $x$ 轴、$y$ 轴都没有公共点
    answer: B
    clue: $P$ 到 $x$ 轴 $\sqrt{3}<2$ 相交，到 $y$ 轴 $2=2$ 相切。
