    id: Q018
    points: 4
    stem_latex: 菱形 $ABCD$（$AB=5$，$AC=8$）绕 $A$ 逆时针旋转得菱形 $AB^{\prime}CD^{\prime}$，$B^{\prime}$ 落在 $AC$ 上，则点 $C$ 与 $C^{\prime}$ 的距离为______
    answer: $\dfrac{8\sqrt{10}}{5}$
    clue: 旋转不变量+勾股定理。
    solution_steps:
    - $AO=4$，$OD=3$，$\sin\angle OAD=\dfrac{3}{5}$，$CE=\dfrac{24}{5}$，$EC^{\prime}=\dfrac{8}{5}$。
    - $CC^{\prime}=\sqrt{\left(\dfrac{24}{5}\right)^{2}+\left(\dfrac{8}{5}\right)^{2}}=\dfrac{8\sqrt{10}}{5}$。
