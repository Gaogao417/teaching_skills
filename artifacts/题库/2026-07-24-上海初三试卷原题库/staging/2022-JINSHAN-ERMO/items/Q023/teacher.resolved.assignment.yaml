  - type: problem
    id: Q023
    points: 12
    stem_latex: '$\triangle ABC$ 和 $\triangle ADE$ 都是等边三角形，$D$ 在 $BC$ 上，$F$ 在 $AB$ 上且 $BF=CD$。

      (1) 求证：$DE\parallel CF$；

      (2) 联结 $DF$，$AD$、$CF$ 交于 $M$，若 $DF^{2}=FM\cdot FC$，求证：$DF\parallel AC$。'
    answer: 见证明
    clue: (1) 全等+等边；(2) 相似。
    solution_steps:
    - (1) $\triangle ACD\cong\triangle CBF$，$\angle CAD=\angle BCF$；$\triangle ADE$ 等边，$\angle ADE=60^{\circ}$，推得 $\angle BDE=\angle BCF$，$\therefore DE\parallel CF$。
    - (2) $DF^{2}=FM\cdot FC\Rightarrow \dfrac{DF}{FM}=\dfrac{FC}{DF}$，$\triangle DFM\sim\triangle CFD$，$\angle FDM=\angle FCD=\angle CAD$，$\therefore DF\parallel AC$。
