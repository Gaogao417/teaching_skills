    stem_latex: 赵爽弦图大正方形边长为4，每个直角三角形较小锐角为30°，小正方形面积为______
    answer: $16-8\sqrt{3}$
    clue: 大正方形面积减4个三角形面积。
    solution_steps:
    - 直角三角形 $BC=2$，$AC=2\sqrt{3}$，面积 $2\sqrt{3}$。
    - 小正方形 $=16-4\times2\sqrt{3}=16-8\sqrt{3}$。
