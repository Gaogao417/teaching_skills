    stem_latex: 反比例函数 $y=\dfrac{k}{x}$（$k\neq0$）在每个象限内 $y$ 随 $x$ 增大而增大，则图象两分支在第______象限。
    answer: 二、四
    clue: $k<0$ 时图象在二、四象限。
