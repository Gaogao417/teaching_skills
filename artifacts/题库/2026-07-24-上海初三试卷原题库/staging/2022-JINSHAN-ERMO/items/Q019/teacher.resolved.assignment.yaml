    stem_latex: 计算：$12^{\frac{1}{2}}-\cot30^{\circ}-\left(\dfrac{1}{2}\right)^{-1}-\sqrt{(1-\sqrt{3})^{2}}$
    answer: '-1'
    clue: 分数指数幂、特殊角三角比、负指数幂、二次根式。
    solution_steps:
    - $12^{\frac{1}{2}}=2\sqrt{3}$，$\cot30^{\circ}=\sqrt{3}$，$\left(\dfrac{1}{2}\right)^{-1}=2$，$\sqrt{(1-\sqrt{3})^{2}}=\sqrt{3}-1$。
    - 原式 $=2\sqrt{3}-\sqrt{3}-2-(\sqrt{3}-1)=-1$。
