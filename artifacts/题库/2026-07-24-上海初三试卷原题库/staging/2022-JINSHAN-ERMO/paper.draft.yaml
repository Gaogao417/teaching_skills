    block:
      stem_latex: '弹簧长度 $y$（cm）与所挂重物 $x$（kg）是一次函数关系，$x=2$ 时 $y=13$，$x=10$ 时 $y=17$。

        (1) 求 $y$ 关于 $x$ 的关系式；

        (2) 弹簧长度不超过25 cm 时所挂重物最多多少？'
      answer: (1) $y=\dfrac{1}{2}x+12$；(2) 最多 $26$ kg
      clue: 待定系数+不等式。
      solution_steps:
      - (1) 由 $\begin{cases}2k+b=13\\10k+b=17\end{cases}$ 得 $k=\dfrac{1}{2}$，$b=12$，$y=\dfrac{1}{2}x+12$。
      - (2) $\dfrac{1}{2}x+12\leqslant25$，$x\leqslant26$，最多26 kg。
