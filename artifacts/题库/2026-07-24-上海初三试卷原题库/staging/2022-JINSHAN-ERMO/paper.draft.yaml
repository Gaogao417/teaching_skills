        (3) 若 $\triangle FPQ$ 是以 $FQ$ 为腰的等腰三角形，求 $AO$。'
      answer: (1) 见证明；(2) $y=-\dfrac{27}{40}x^{2}+3x$（$0<x\leqslant4$）；(3) $AO=\dfrac{40}{13}$
        或 $\dfrac{200}{53}$
