  - type: problem
    id: Q023
    points: 12
    stem_latex: '四边形 $ABCD$ 中，$E$、$F$ 分别为 $BC$、$DC$ 中点，$AE$、$AF$ 分别交 $BD$ 于 $M$、$N$，且 $BM=MN=ND$，联结 $CM$、$CN$。

      (1) 求证：四边形 $AMCN$ 是平行四边形；

      (2) 如果 $AE=AF$，求证：四边形 $ABCD$ 是菱形。'
    answer: 见证明
    clue: (1) 中位线；(2) 菱形判定。
    solution_steps:
    - (1) $M$、$N$ 分别为 $BN$、$DM$ 中点，$ME$、$NF$ 为中位线，$ME\parallel CN$，$NF\parallel CM$，$\therefore AM\parallel CN$，$AN\parallel CM$，四边形 $AMCN$ 是平行四边形。
    - (2) $ME=\dfrac{1}{3}AE$，$NF=\dfrac{1}{3}AF$，$AE=AF\Rightarrow ME=NF\Rightarrow AM=AN=CM=CN$，四边形 $AMCN$ 是菱形，$OM=ON$，$OA=OC$，$AC\perp MN$；又 $BM=DN\Rightarrow OB=OD$，$\therefore$ 四边形 $ABCD$ 是菱形。
