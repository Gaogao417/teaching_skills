  blocks:
  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如图，梯形 $ABCD$ 中，$AD\parallel BC$，对角线交于 $O$，$E$、$F$ 分别为 $AB$、$CD$ 中点，$AO:OC=1:4$，设 $\overrightarrow{AD}=\vec{a}$，那么 $\overrightarrow{EF}=$______
    answer: $\dfrac{5}{2}\vec{a}$
    clue: 中位线 $EF=\dfrac{1}{2}(AD+BC)$。
    solution_steps:
    - 由 $\triangle ADO\sim\triangle CBO$ 得 $AD:BC=1:4$，$BC=4\vec{a}$。
    - $EF$ 为中位线，$\overrightarrow{EF}=\dfrac{1}{2}(\vec{a}+4\vec{a})=\dfrac{5}{2}\vec{a}$。
