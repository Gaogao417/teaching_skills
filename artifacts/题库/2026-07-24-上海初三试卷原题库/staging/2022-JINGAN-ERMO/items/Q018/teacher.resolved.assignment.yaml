  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 如图，$\angle MON=30^{\circ}$，$A$ 在 $OM$ 上，$OA=1$，$P$ 在 $ON$ 上，将 $\angle MON$ 沿 $AP$ 翻折，设点 $O$ 落在 $O^{\prime}$ 处，如果 $AO^{\prime}\perp AO$，那么 $OP=$______
    answer: $-1+\sqrt{3}$ 或 $1+\sqrt{3}$
    clue: 分 $O^{\prime}$ 在 $OM$ 上方/下方，用勾股定理。
    solution_steps:
    - 当 $O^{\prime}$ 在 $OM$ 上方：$\triangle OAO^{\prime}$ 等腰直角，设 $OP=x$，列方程 $x^{2}+2x-2=0$，$OP=-1+\sqrt{3}$。
    - 当 $O^{\prime}$ 在 $OM$ 下方：列方程 $x^{2}-2x-2=0$，$OP=1+\sqrt{3}$。
