  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 正比例函数 $y=kx$（$k\neq0$）当 $x$ 增大时 $y$ 随之减小，那么 $k$ 的取值范围是______
    answer: $k<0$
    clue: $k<0$ 时递减。
    solution_steps:
    - $y$ 随 $x$ 增大而减小，$\therefore k<0$。
