    id: Q017
    points: 4
    stem_latex: 如图，半圆直径 $AB=2$，点 $C$、$D$ 三等分半圆弧，那么 $\triangle CBD$ 的面积为______
    answer: $\dfrac{\sqrt{3}}{4}$
    clue: $CD\parallel AB$，$S_{\triangle CBD}=S_{\triangle COD}$。
    solution_steps:
    - $\triangle COD$ 为等边三角形，$CD\parallel AB$，$S_{\triangle CBD}=S_{\triangle COD}$。
    - $OE=\dfrac{\sqrt{3}}{2}$，$CD=1$，$S=\dfrac{1}{2}\times1\times\dfrac{\sqrt{3}}{2}=\dfrac{\sqrt{3}}{4}$。
