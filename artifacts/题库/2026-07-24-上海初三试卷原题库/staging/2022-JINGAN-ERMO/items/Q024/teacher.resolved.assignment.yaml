  - type: problem
    id: Q024
    points: 12
    stem_latex: '点 $A(2,4)$，$B$ 在 $x$ 轴上且 $OB=AB$，二次函数图象经过 $O$、$A$、$B$，顶点为 $D$。

      (1) 求 $B$、$D$ 坐标；

      (2) 求对称轴与线段 $AB$ 的交点 $E$ 坐标；

      (3) 图象平移后 $A$ 落在原对称轴上、$D$ 落在线段 $AB$ 上，求平移后解析式。'
    answer: (1) $B(5,0)$，$D\left(\dfrac{5}{2},\dfrac{25}{6}\right)$；(2) $E\left(\dfrac{5}{2},\dfrac{10}{3}\right)$；(3) $y=-\dfrac{2}{3}(x-3)^{2}+\dfrac{8}{3}$
    clue: (1) $OB=AB$ 求 $B$；(2) 对称轴与 $AB$ 直线交点；(3) 平移。
    solution_steps:
    - (1) 设 $B(m,0)$，$m^{2}=(m-2)^{2}+16$，$m=5$，$B(5,0)$。代入 $O,A,B$ 得 $y=-\dfrac{2}{3}x^{2}+\dfrac{10}{3}x$，顶点 $D\left(\dfrac{5}{2},\dfrac{25}{6}\right)$。
    - (2) 直线 $AB$：$y=-\dfrac{4}{3}x+\dfrac{20}{3}$，对称轴 $x=\dfrac{5}{2}$，$E\left(\dfrac{5}{2},\dfrac{10}{3}\right)$。
    - (3) $A$ 落在原对称轴上，右移 $\dfrac{1}{2}$，新顶点横坐标 $3$，$D$ 落在 $AB$ 上时 $y=\dfrac{8}{3}$，新顶点 $(3,\dfrac{8}{3})$，$\therefore y=-\dfrac{2}{3}(x-3)^{2}+\dfrac{8}{3}$。
