  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 矩形 $ABCD$（$AB=6$，$BC=8$），以 $A$ 为圆心作圆，若 $B$、$C$、$D$ 至少一点在圆内、至少一点在圆外，则 $\odot A$ 半径 $r$ 的取值范围是______
    answer: $6<r<10$
    clue: $AB=6$，$AC=10$。
    solution_steps:
    - $AC=\sqrt{6^{2}+8^{2}}=10$，$B$ 在圆内、$C$ 在圆外，$\therefore 6<r<10$。
