      solution_steps:
      - 当 $O^{\prime}$ 在 $OM$ 上方：$\triangle OAO^{\prime}$ 等腰直角，设 $OP=x$，列方程 $x^{2}+2x-2=0$，$OP=-1+\sqrt{3}$。
