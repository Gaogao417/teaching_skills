  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，在 $\triangle ABC$ 中，点 $D$ 在边 $BC$ 上，$\angle ADE=\angle B$，$\angle EAF=\angle FDC$，$DE$ 与 $AC$ 交于点 $F$。（1）求证：$\frac{AB}{AC}=\frac{AD}{AE}$；（2）联结
      $BF$，如果 $AB^2=AF\cdot AC$，求证：$AD\cdot BC=AE\cdot BF$。
    answer: 见证明。
    solution_steps:
    - title: 解答
      content: （1）由角关系得 $\angle BAC=\angle DAE$，又 $\angle ADE=\angle B$，故 $\triangle ABC\sim\triangle ADE$，所以 $\frac{AB}{AC}=\frac{AD}{AE}$。（2）由
        $AB^2=AF\cdot AC$ 得 $\frac{AF}{AB}=\frac{AB}{AC}$，结合公共角可得 $\triangle ABF\sim\triangle ACB$，故 $\frac{AB}{AC}=\frac{BF}{CB}$。与（1）合并得到
        $AD\cdot BC=AE\cdot BF$。
