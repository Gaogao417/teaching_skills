  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在平面直角坐标系 $xOy$ 中，正比例函数 $y=2x$ 的图像与反比例函数 $y=\frac{k}{x}(k\ne0)$ 的图像交于点 $A(1,m)$。（1）求反比例函数解析式；（2）点 $B$ 在该反比例函数第一象限的图像上，过点
      $B$ 作 $BH\perp x$ 轴，垂足为 $H$。如果 $\angle AOH=\angle OBH$，求点 $B$ 的坐标。
    answer: （1）$y=\frac2x$；（2）$B(2,1)$。
    solution_steps:
    - title: 解答
      content: （1）由 $A(1,m)$ 在 $y=2x$ 上得 $A(1,2)$，故 $k=2$，反比例函数为 $y=\frac2x$。（2）在 $\mathrm{Rt}\triangle AOG$ 中 $\tan\angle
        AOG=2$，故 $\tan\angle OBH=2$。设 $B(b,\frac2b)$，则 $\frac{OH}{BH}=\frac{b}{2/b}=2$，解得 $b=2$，故 $B(2,1)$。
