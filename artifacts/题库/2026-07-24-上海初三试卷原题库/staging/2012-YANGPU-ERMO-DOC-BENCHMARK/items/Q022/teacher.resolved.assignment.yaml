  - type: problem
    id: Q022
    points: 10
    stem_latex: 某车一周每天行驶路程为 $6,6,8,8,10,20,12$（千米）。估计每月（30 天）路程；每 100 千米耗油 $x$ 升、油价 $y$ 元/升，表示月油费；当 $x=10,y=8$ 时估计年油费（精确到千元）。
    answer: 300 千米；$3xy$ 元；约 3 千元
    explanation: 以一周平均数估计总体。
    solution_steps:
    - title: 月路程
      content: 周平均每日 $10$ 千米，估计月路程 $30\times10=300$ 千米。
    - title: 油费
      content: 月耗油 $3x$ 升，月油费为 $3xy$ 元；年油费 $12\times3\times10\times8=2880$ 元，约 $3$ 千元。
    source_solution_images: []
