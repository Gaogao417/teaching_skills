  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在单位长度为 $1$ 的正方形网格中，一段圆弧经过格点 $A,B,C$。建立以 $O$ 为原点的直角坐标系，标出圆心 $D$ 并连接 $AD,CD$；写出 $C,D$ 坐标和半径；求 $\sin\angle ACO$。
    answer: $C(6,2),\ D(2,0),\ r=2,\ \sin\angle ACO=\frac35$
    explanation: 按弦的中垂线确定圆心，再用勾股定理和面积关系。
    solution_steps:
    - title: 作图与填空
      content: 作弦的中垂线确定 $D$；$C(6,2)$，$D(2,0)$，半径为 $2$。
    - title: 求正弦
      content: 连接 $AC,OC$，作辅助垂线，用面积关系求得 $\sin\angle ACO=\frac35$。
