  - type: problem
    id: Q020
    points: 10
    stem_latex: 解图示分式方程。
    answer: $x=1$
    explanation: 去分母后验根。
    solution_steps:
    - title: 去分母
      content: 同乘 $(x+3)(x-3)$，整理得 $x^2-4x+3=0$。
    - title: 验根
      content: 候选根为 $1,3$；$3$ 是增根，故 $x=1$。
