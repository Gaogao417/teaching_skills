  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，在梯形 $ABCD$ 中，$AD\parallel BC$，$BC=DC$，$CF$ 平分 $\angle BCD$，$DF\parallel AB$，$BF$ 的延长线交 $DC$ 于 $E$。求证：（1）$\triangle BFC\cong\triangle DFC$；（2）$AD=DE$。
    answer: 两结论均成立
    explanation: 先 SAS 证全等，再连接 $BD$ 证另一组全等。
    solution_steps:
    - title: 第（1）问
      content: $CF$ 平分 $\angle BCD$，且 $BC=DC$、$CF$ 公共，故 $\triangle BFC\cong\triangle DFC$（SAS）。
    - title: 第（2）问
      content: 连接 $BD$。由（1）得 $BF=DF$，结合平行线角和 $BC=DC$，证 $\triangle BAD\cong\triangle BED$，故 $AD=DE$。
