      - 点 $P$ 是 $\angle AOB$ 的平分线上一点，点 $M$、$N$ 分别在 $OA$、$OB$ 上，则 $PM=PN$
      - $\mathrm{Rt}\triangle ABC$ 中，若 $\angle B=30^{\circ}$，则 $AC=\frac{1}{2}AB$
      - 一边上的中线等于这边的一半的三角形是直角三角形
