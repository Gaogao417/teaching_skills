    block:
      stem_latex: 如图，在单位长度为 1 的正方形网格中，一段圆弧经过网格的交点 $A$、$B$、$C$.(1) 请完成如下操作：①以点 $O$ 为原点、网格边长为单位长，建立平面直角坐标系；②根据图形提供的信息，标出该圆弧所在圆的圆心 $D$，并连接 $AD$、$CD$.(2) 请在 (1) 的基础上，完成下列填空：①写出点的坐标：$C$ \_ 、$D$ \_；②$\odot D$ 的半径 $=$ \_；(3) 求 $\angle ACO$ 的正弦值.
      answer: $C(6,2)$，$D(2,0)$，半径 $2\sqrt{5}$，$\sin\angle ACO=\frac{3}{5}$
      clue: 坐标与图形、垂径定理、勾股定理、等积法
      solution_steps:
      - (1) 以 $O$ 为原点建系，作弦 $AB$、$BC$ 的中垂线，交点即圆心 $D$；
      - (2) ① $C(6,2)$，$D(2,0)$；②在 $\mathrm{Rt}\triangle AOD$ 中，$AD=\sqrt{4^{2}+2^{2}}=2\sqrt{5}$，即 $\odot D$ 半径为 $2\sqrt{5}$；
      - (3) 连 $AC$、$OC$，过 $C$ 作 $CH\perp AO$ 于 $H$，过 $A$ 作 $AM\perp CO$ 于 $M$。由 $\frac{1}{2}OA\cdot CH=\frac{1}{2}OC\cdot AM$，即 $\frac{1}{2}\times4\times6=\frac{1}{2}\times2\sqrt{10}\cdot AM$，得 $AM=\frac{6\sqrt{10}}{5}$；在 $\mathrm{Rt}\triangle AMC$ 中，$\sin\angle ACO=\frac{AM}{AC}=\frac{\frac{6\sqrt{10}}{5}}{2\sqrt{10}}=\frac{3}{5}$。
