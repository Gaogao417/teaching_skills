      stem_latex: 下列二次根式中，属于最简二次根式的是（ ）
      choices:
      - $\sqrt{12}$
      - $\sqrt{a^{2}-b^{2}}$
      - $\sqrt{a^{4}}$
      - $\sqrt{\frac{x}{3}}$
      answer: B
      clue: 最简二次根式的定义：被开方数不含分母且不含能开尽方的因数或因式
      solution_steps:
      - A、$\sqrt{12}=2\sqrt{3}$，被开方数含能开尽方的因数，不是最简二次根式；
      - B、$\sqrt{a^{2}-b^{2}}$，符合最简二次根式的定义；
      - C、$\sqrt{a^{4}}=a^{2}$，被开方数含能开尽方的因数，不是最简二次根式；
      - D、$\sqrt{\frac{x}{3}}$，被开方数含分母，不是最简二次根式。故选B。
