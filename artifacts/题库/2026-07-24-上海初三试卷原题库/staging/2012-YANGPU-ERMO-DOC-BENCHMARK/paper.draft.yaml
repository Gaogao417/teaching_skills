      answer: (1) 300 千米；(2) $3xy$；(3) 约 3 千元
      clue: 用样本估计总体、列代数式及代数式求值
      solution_steps:
      - (1) 这一周的平均路程 $\frac{6+6+8+8+10+20+12}{7}=10$ 千米/天，月路程 $10\times30=300$ 千米；
      - (2) 月耗油 $(300\div100)x=3x$ 升，月汽油费为 $3xy$ 元；
      - (3) 当 $x=10,y=8$ 时，年费用 $12\times3xy=12\times3\times10\times8=2880$ 元 $\approx3$ 千元。
