      stem_latex: 关于 $x$ 的一元二次方程 $x^{2}-ax-1=0$ 根的情况是（ ）
      choices:
      - 有两个相等的实数根
      - 没有实数根
      - 有两个不相等的实数根
      - 根的情况无法确定
      answer: C
      clue: 一元二次方程根的判别式 $\Delta=b^{2}-4ac$
      solution_steps:
      - $\Delta=(-a)^{2}-4\times1\times(-1)=a^{2}+4>0$，
      - 所以方程 $x^{2}-ax-1=0$ 有两个不相等的实数根。故选C。
