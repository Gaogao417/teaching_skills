      answer: (1) $y=-\frac{1}{4}x^{2}-x+3$，$D(-2,4)$；(3) $P(0,2)$
      clue: 待定系数法求二次函数解析式、相似三角形的判定与分类讨论
      solution_steps:
      - (1) 由题意 $\begin{cases}36a+6-c=0\\ -\frac{1}{2a}=-2\end{cases}$，解得 $a=-\frac{1}{4}$，$c=-3$，所以抛物线为 $y=-\frac{1}{4}x^{2}-x+3$，顶点 $D(-2,4)$；
      - (2) 过 $D$ 作 $DH\perp x$ 轴，在 $\mathrm{Rt}\triangle DHO$ 中 $\tan\angle AOD=\frac{4}{2}=2$；又 $B(0,3)$，$A(-6,0)$，在 $\mathrm{Rt}\triangle ABO$ 中 $\tan\angle ABO=\frac{6}{3}=2$，故 $\angle AOD=\angle ABO$；
      - (3) $\triangle AOB$ 为直角三角形，故 $\triangle ADP$ 也为直角三角形。情况1：若 $\angle DAP=90^{\circ}$，得 $P(0,-6)$，但此时 $\frac{AD}{AP}=\frac{2}{3}\neq\frac{OB}{AO}=\frac{1}{2}$，不相似，$P$ 不存在；情况2：若 $\angle ADP=90^{\circ}$，得 $P(0,2)$，此时 $\frac{DP}{AD}=\frac{1}{2}=\frac{OB}{AO}$，相似，$P(0,2)$ 成立；情况3：若 $\angle APD=90^{\circ}$，设 $P(0,t)$，由 $AP^{2}+PD^{2}=AD^{2}$ 得 $t^{2}-4t+12=0$，$\Delta<0$，无解。综上 $P(0,2)$。
