    block:
      stem_latex: "在分式方程$\\dfrac{x-1}{x^2}+\\dfrac{x^2}{x-1}=6$中，设$\\dfrac{x-1}{x^2}=y$，可得到关于$y$的整式方程为（\\quad）"
      choices:
      - "$y^2+6y+6=0$"
      - "$y^2-6y+6=0$"
      - "$y^2+6y+1=0$"
      - "$y^2-6y+1=0$"
      answer: D
      explanation: "官方参考答案：D。"
      solution_steps:
      - "$\\because\\dfrac{x-1}{x^2}=y$，$\\therefore\\dfrac{x^2}{x-1}=\\dfrac{1}{y}$"
      - "将其代入原分式方程可得$y+\\dfrac{1}{y}=6$"
      - "方程两边同乘$y$（$y\\neq0$），得$y^2+1=6y$"
      - "整理得：$y^2-6y+1=0$。"
      clue: "利用换元法，将换元后的式子代入原分式方程，去分母化简即可得到关于$y$的整式方程。"
