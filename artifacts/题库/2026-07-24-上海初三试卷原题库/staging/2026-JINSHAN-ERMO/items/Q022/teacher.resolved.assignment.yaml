  - type: problem
    id: Q022
    points: 12
    stem_latex: 如图，在平面直角坐标系$xOy$中，点$A$在反比例函数$y=\dfrac{k}{x}$（$k\neq0$，$x>0$）的图像上，过点$A$作$AB\perp x$轴于点$B$，点$C$在$y$轴上，且$AC=BC$，若$AB=4$，$OB=3$。
    answer: $y=\dfrac{12}{x}$
    explanation: 官方参考答案：$y=\dfrac{12}{x}$。
    solution_steps:
    - $\because AB\perp x$轴，$AB=4$，$OB=3$
    - $\therefore$点$A$的坐标为$(3,4)$
    - $\because$点$A$在反比例函数$y=\dfrac{k}{x}$的图像上
    - $\therefore k=3\times4=12$
    - $\therefore$反比例函数的解析式为$y=\dfrac{12}{x}$。
    clue: 根据点$A$的坐标和反比例函数的性质，求出$k$的值，即可得到反比例函数的解析式。
