    id: Q009
    points: 4
    stem_latex: 如果正比例函数$y=kx$的图像经过第一、三象限，那么$y$的值随着$x$的值增大而______。（填“增大”或“减小”）
    answer: 增大
    explanation: 官方参考答案：增大。
    solution_steps:
    - 根据正比例函数的性质可知，如果正比例函数$y=kx$的图像经过第一、三象限，那么$k>0$
    - 那么$y$的值随自变量$x$的值增大而增大。
    clue: 根据题目信息，正比例函数$y=kx$的图像经过第一、三象限，可得$k$的值大于$0$，即可得出结论。
