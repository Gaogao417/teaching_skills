    id: Q014
    points: 4
    stem_latex: 某商场销售一批衬衫，平均每天可售出20件，每件盈利40元。为了扩大销售，增加盈利，商场采取了降价措施。假设在一定范围内，衬衫的单价每降1元，______。如果降价后商场销售这批衬衫每天盈利1250元，那么衬衫的单价降了多少元？如果设衬衫的单价降了$x$元，根据题意，得$(20+2x)(40-x)=1250$。（补填上合适的条件）
    explanation: 官方参考答案：商场平均每天可多售出2件。
