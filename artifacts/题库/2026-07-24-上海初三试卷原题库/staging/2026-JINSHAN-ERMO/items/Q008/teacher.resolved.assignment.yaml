  - type: short_answer
    id: Q008
    points: 4
    stem_latex: 已知关于$x$的方程$\sqrt{x-6}=2$，那么$x=$______。
    answer: '10'
    explanation: 官方参考答案：10。
    solution_steps:
    - 对$\sqrt{x-6}=2$两边同时平方得：$x-6=4$
    - 解得：$x=10$
    - 检验：将$x=10$代入原方程得：$\sqrt{10-6}=\sqrt{4}=2$
    - 因此，$x=10$是原方程的根。
    clue: 解题思路为通过平方去掉根号，将原方程转化为一元一次方程求解，求解后检验得到最终结果。
