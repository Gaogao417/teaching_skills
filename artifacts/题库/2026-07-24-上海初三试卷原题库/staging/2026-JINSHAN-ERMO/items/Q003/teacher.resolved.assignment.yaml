  title: 一、选择题（本大题共5题，每题4分，满分20分）
  type: practice
  visibility: both
  blocks:
  - type: choice
    id: Q003
    points: 4
    stem_latex: 用纸板剪成的两个全等的直角三角形，一定能够拼成的四边形是（\quad）
    choices:
    - 直角梯形
    - 矩形
    - 菱形
    - 正方形
    answer: B
    explanation: 官方参考答案：B。
    solution_steps:
    - 任意两个全等直角三角形，将斜边重合拼接，两个直角分别位于斜边两侧时，可以拼成一个平行四边形，且该平行四边形有一个内角为直角，则一定能拼成矩形，故B选项正确；
    - 对于A选项，两个全等直角三角形无法拼成直角梯形，故A选项错误；
    - 对于C选项，只有当原直角三角形边长满足邻边相等时才能拼成菱形，不是任意全等直角三角形都可拼成，故C错误；
    - 对于D选项，只有两个全等等腰直角三角形才能拼成正方形，不是任意全等直角三角形都可拼成，故D错误。
    clue: 根据全等直角三角形的性质，将斜边重合拼接，分析各种四边形的判定条件。
