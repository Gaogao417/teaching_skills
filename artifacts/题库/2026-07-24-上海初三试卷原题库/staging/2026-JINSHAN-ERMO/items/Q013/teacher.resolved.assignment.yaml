  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 通常水分子的质量和体积都很小，已知1个水分子的质量约是$3\times10^{-26}$kg，1滴水（含有水分子数量约$1.7\times10^{21}$个）的质量约为______$\text{kg}$（用科学记数法表示）
    answer: $5.1\times10^{-5}$
    explanation: 官方参考答案：$5.1\times10^{-5}$。
    solution_steps:
    - $(3\times10^{-26})\times(1.7\times10^{21})$
    - $=(3\times1.7)\times(10^{-26}\times10^{21})$
    - $=5.1\times10^{-5}$
    - 则1滴水的质量约为$5.1\times10^{-5}$kg。
    clue: 本题可根据总质量等于单个水分子质量乘以水分子总个数，结合同底数幂的乘法运算法则和科学记数法的要求求解。
