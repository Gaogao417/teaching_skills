    stem_latex: 解不等式组：$\begin{cases}2x+3&x+11\\\dfrac{2x+5}{3}-1<2-x\end{cases}$。
    answer: 无解
    explanation: 官方参考答案：无解。
    solution_steps:
    - 解不等式①得：$x<8$
    - 解不等式②得：$x<\dfrac{4}{5}$
    - 则原不等式组无解。
    clue: 分别解两个不等式，然后取它们的交集，若交集为空集则不等式组无解。
