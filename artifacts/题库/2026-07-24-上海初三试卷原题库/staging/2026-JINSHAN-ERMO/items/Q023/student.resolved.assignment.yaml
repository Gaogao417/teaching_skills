    stem_latex: 如图，在$\triangle ABC$中，$\angle ACB=90^{\circ}$，$AC=BC=4$，点$D$是边$BC$上一点，$CD=1$，点$E$是边$AB$上一点，$AE=1$，连接$DE$，将$\triangle ADE$沿$DE$翻折，点$A$的对应点为$A'$，连接$A'C$，如果$A'C\parallel AB$，求$BE$的长。
    explanation: 官方参考答案：$BE=2\sqrt{2}-2$或$2\sqrt{5}$。
