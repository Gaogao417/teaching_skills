  blocks:
  - type: problem
    id: Q023
    points: 14
    stem_latex: 如图，在$\triangle ABC$中，$\angle ACB=90^{\circ}$，$AC=BC=4$，点$D$是边$BC$上一点，$CD=1$，点$E$是边$AB$上一点，$AE=1$，连接$DE$，将$\triangle ADE$沿$DE$翻折，点$A$的对应点为$A'$，连接$A'C$，如果$A'C\parallel AB$，求$BE$的长。
    answer: $BE=2\sqrt{2}-2$或$2\sqrt{5}$
    explanation: 官方参考答案：$BE=2\sqrt{2}-2$或$2\sqrt{5}$。
    solution_steps:
    - 分两种情况讨论：
    - 情况一：当$A'$在$AB$的下方时，过$C$作$CM\perp AB$于$M$
    - $\because AC=BC=4$，$\angle ACB=90^{\circ}$
    - $\therefore\triangle ABC$是等腰直角三角形
    - $\therefore AB=\sqrt{AC^2+BC^2}=4\sqrt{2}$
    - $\therefore CM=AM=BM=\dfrac{1}{2}AB=2\sqrt{2}$
    - $\because A'C\parallel AB$
    - $\therefore\triangle A'CD\sim\triangle BED$
    - $\therefore\dfrac{A'C}{BE}=\dfrac{CD}{BD}$
    - $\because CD=1$，$BD=BC-CD=4-1=3$
    - $\therefore\dfrac{A'C}{BE}=\dfrac{1}{3}$
    - 设$BE=x$，则$A'C=\dfrac{x}{3}$
    - 由翻折的性质可知：$A'D=AD$，$A'E=AE=1$
    - 在$\text{Rt}\triangle ACD$中，$AD=\sqrt{AC^2+CD^2}=\sqrt{16+1}=\sqrt{17}$
    - $\therefore A'D=\sqrt{17}$
    - 在$\triangle A'CD$中，由余弦定理得：$A'C^2=A'D^2+CD^2-2\cdot A'D\cdot CD\cdot\cos\angle A'DC$
    - 又$\because\angle A'DC=\angle ADE+\angle EDC$，且$\angle ADE=\angle A'DE$
    - 计算过程较为复杂，最终解得$x=2\sqrt{2}-2$
    - 情况二：当$A'$在$AB$的上方时，类似可解得$x=2\sqrt{5}$
    - 综上所述，$BE$的长为$2\sqrt{2}-2$或$2\sqrt{5}$。
    clue: 根据翻折的性质和相似三角形的判定与性质，结合勾股定理和余弦定理，分两种情况讨论求解。
