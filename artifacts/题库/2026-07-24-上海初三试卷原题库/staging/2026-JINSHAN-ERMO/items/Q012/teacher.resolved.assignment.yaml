  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 在$\triangle ABC$中，设$\vec{AB}=\vec{a}$，$\vec{AC}=\vec{b}$，点$D$在边$BC$上且$BD=2CD$，用$\vec{a}$、$\vec{b}$的线性组合表示$\vec{AD}=$______。
    answer: $\dfrac{1}{3}\vec{a}+\dfrac{2}{3}\vec{b}$
    explanation: 官方参考答案：$\dfrac{1}{3}\vec{a}+\dfrac{2}{3}\vec{b}$。
    solution_steps:
    - $\because\vec{AB}=\vec{a}$，$\vec{AC}=\vec{b}$
    - $\therefore\vec{BC}=\vec{AC}-\vec{AB}=\vec{b}-\vec{a}$
    - $\because$点$D$在边$BC$上，且$BD=2CD$
    - $\therefore\vec{BD}=\dfrac{2}{3}\vec{BC}=\dfrac{2}{3}(\vec{b}-\vec{a})$
    - $\therefore\vec{AD}=\vec{AB}+\vec{BD}=\vec{a}+\dfrac{2}{3}(\vec{b}-\vec{a})=\dfrac{1}{3}\vec{a}+\dfrac{2}{3}\vec{b}$。
    clue: 先求出$\vec{BC}$，再根据$BD=2CD$得到$\vec{BD}$，最后利用向量加法运算求出$\vec{AD}$。
