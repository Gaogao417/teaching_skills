  blocks:
  - type: choice
    id: Q001
    points: 4
    stem_latex: 下列实数中，有理数是（\quad）
    choices:
    - $\sqrt{3}$
    - $\sqrt{4}$
    - $\sqrt{5}$
    - $\sqrt{6}$
    answer: B
    explanation: 官方参考答案：B。
    solution_steps:
    - $\because\sqrt{4}=2$，$\therefore\sqrt{4}$是有理数，而$\sqrt{3}$、$\sqrt{5}$、$\sqrt{6}$是无理数；故选B。
    clue: 根据有理数的定义，能表示为两个整数之比的数是有理数，无限不循环小数是无理数。
