    id: Q011
    points: 4
    stem_latex: 在如图所示的月历表中任取1天，恰好这一天是星期日的概率是______。
    answer: $\dfrac{2}{15}$
    explanation: 官方参考答案：$\dfrac{2}{15}$。
    solution_steps:
    - 由图可知，该月历表中显示的日期从1号到30号，共有30天
    - 观察月历表可知，星期日的日期分别为7号，14号，21号，28号，共有4天
    - 则恰好这一天是星期日的概率为$\dfrac{4}{30}=\dfrac{2}{15}$。
    clue: 首先根据月历表确定该月的总天数，然后统计出其中是星期日的天数，最后根据概率公式求解即可。
