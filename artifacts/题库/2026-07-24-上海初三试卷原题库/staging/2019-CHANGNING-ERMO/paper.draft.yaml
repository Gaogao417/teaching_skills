    block:
      stem_latex: 某文具店每天售出甲、乙两种笔，统计后发现：甲、乙两种笔同一天售出量之间满足一次函数的关系，设甲、乙两种笔同一天的售出量分别为 $x$（支）、$y$（支），部分数据如表所示（每一列数据表示甲、乙两种笔同一天的售出量）。当 $x=4,6,8$ 时，$y=6,12,18$。(1) 求 $y$ 关于 $x$ 的函数关系式（不需要写出定义域）；(2) 某一天文具店售出甲、乙两种笔的营业额分别为30元和120元，如果乙种笔每支售价比甲种笔每支售价多2元，那么甲、乙两种笔这天各售出多少支？
      answer: (1) $y=3x-6$；(2) 甲种笔售出10支，乙种笔售出24支
      clue: 一次函数的应用
      solution_steps:
      - (1) 设 $y=kx+b$（$k\neq 0$），由点 $(4,6)$、$(6,12)$ 得 $\begin{cases}4k+b=6\\6k+b=12\end{cases}$，解得 $k=3$，$b=-6$，∴ $y=3x-6$。
      - (2) 设甲种笔售出 $x$ 支，则乙种笔售出 $(3x-6)$ 支，由题意 $\frac{120}{3x-6}-\frac{30}{x}=2$，整理得 $x^{2}-7x-30=0$，解得 $x_{1}=10$，$x_{2}=-3$（舍去），$3x-6=24$。
      - 答：甲、乙两种笔这天各售出 10 支、24 支。
