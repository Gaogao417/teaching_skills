    block:
      stem_latex: 如图，在 $\mathrm{Rt}\triangle ABC$ 中，$\angle ACB=90^{\circ}$，$AC=3$，$BC=4$，点 $P$ 在边 $AC$ 上（点 $P$ 与点 $A$ 不重合），以点 $P$ 为圆心、$PA$ 为半径作 $\odot P$ 交边 $AB$ 于另一点 $D$，$ED\perp DP$，交边 $BC$ 于点 $E$。(1) 求证：$BE=DE$；(2) 若 $BE=x$，$AD=y$，求 $y$ 关于 $x$ 的函数关系式并写出定义域；(3) 延长 $ED$ 交 $CA$ 的延长线于点 $F$，联结 $BP$，若 $\triangle BDP$ 与 $\triangle DAF$ 相似，求线段 $AD$ 的长。
      answer: (1) $BE=DE$；(2) $y=\frac{25-8x}{5}\ \left(\frac{7}{8}\leqslant x<\frac{25}{8}\right)$；(3) $AD=\frac{18}{5}$ 或 $\frac{70}{39}$
      clue: 圆的综合、相似三角形与分类讨论
      solution_steps:
      - (1) ∵ $ED\perp DP$，∴ $\angle EDP=90^{\circ}$，$\angle BDE+\angle PDA=90^{\circ}$；又 $\angle ACB=90^{\circ}$，$\angle B+\angle PAD=90^{\circ}$；∵ $PD=PA$，∴ $\angle PDA=\angle PAD$，∴ $\angle BDE=\angle B$，∴ $BE=DE$。
      - (2) $AD=y$，$BD=BA-AD=5-y$。过点 $E$ 作 $EH\perp BD$ 于 $H$，由(1) $BE=DE$，∴ $BH=\frac{1}{2}BD=\frac{5-y}{2}$。在 $\mathrm{Rt}\triangle ABC$ 中 $\cos B=\frac{BC}{AB}=\frac{4}{5}$，∴ $\frac{(5-y)/2}{x}=\frac{4}{5}$，解得 $y=\frac{25-8x}{5}\ \left(\frac{7}{8}\leqslant x<\frac{25}{8}\right)$。
      - (3) 设 $PD=a$，则 $AD=\frac{6}{5}a$，$BD=5-\frac{6}{5}a$；在等腰 $\triangle PDA$ 中 $\cos\angle PAD=\frac{3}{5}$，得 $\cos\angle DPA=\frac{7}{25}$；在 $\mathrm{Rt}\triangle PDF$ 中，$\cos\angle DPA=\frac{PD}{PF}=\frac{7}{25}$，∴ $PF=\frac{25a}{7}$，$AF=\frac{18a}{7}$。
      - ① 当 $\angle DBP=\angle ADF$ 时，$\frac{AD}{BD}=\frac{AF}{PD}$，即 $\frac{\frac{6}{5}a}{5-\frac{6}{5}a}=\frac{\frac{18a}{7}}{a}$，解得 $a=3$，$AD=\frac{18}{5}$。
      - ② 当 $\angle DBP=\angle F$ 时，$\frac{AD}{PD}=\frac{AF}{BD}$，即 $\frac{\frac{6}{5}a}{a}=\frac{\frac{18a}{7}}{5-\frac{6}{5}a}$，解得 $a=\frac{175}{117}$，$AD=\frac{70}{39}$。
      - 综上所述，线段 $AD$ 的长为 $\frac{18}{5}$ 或 $\frac{70}{39}$。
