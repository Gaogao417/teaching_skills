      stem_latex: 如图，平行四边形 $ABCD$ 的对角线 $AC$、$BD$ 交于点 $O$，点 $E$ 在边 $CB$ 的延长线上，且 $\angle EAC=90^{\circ}$，$AE^{2}=EB\cdot EC$。(1) 求证：四边形 $ABCD$ 是矩形；(2) 延长 $DB$、$AE$ 交于点 $F$，若 $AF=AC$，求证：$AE=BF$。
