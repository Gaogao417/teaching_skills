      stem_latex: 先化简，再求值：$\frac{x^{2}-4}{x^{2}+2x}\div\left(\frac{x^{2}+4}{x}-4\right)$，其中 $x=\sqrt{3}$。
      answer: $-\sqrt{3}-2$
      clue: 分式的化简求值
      solution_steps:
      - 原式 $=\frac{(x+2)(x-2)}{x(x+2)}\div\frac{x^{2}-4x+4}{x}$
      - $=\frac{x-2}{x}\cdot\frac{x}{(x-2)^{2}}$
      - $=\frac{1}{x-2}$
      - 当 $x=\sqrt{3}$ 时，原式 $=\frac{1}{\sqrt{3}-2}=-\sqrt{3}-2$。
