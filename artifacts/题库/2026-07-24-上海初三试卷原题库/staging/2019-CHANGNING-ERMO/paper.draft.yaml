    block:
      stem_latex: 如图，在 $\mathrm{Rt}\triangle ABC$ 中，$\angle ACB=90^{\circ}$，$AC=4$，$BC=3$，点 $D$ 是边 $AC$ 的中点，$CF\perp BD$，垂足为点 $F$，延长 $CF$ 与边 $AB$ 交于点 $E$。求：(1) $\angle ACE$ 的正切值；(2) 线段 $AE$ 的长。
      answer: (1) $\tan\angle ACE=\frac{2}{3}$；(2) $AE=\frac{40}{17}$
      clue: 解直角三角形
      solution_steps:
      - (1) ∵ $\angle ACB=90^{\circ}$，∴ $\angle ACE+\angle BCE=90^{\circ}$；又 $CF\perp BD$，∴ $\angle BCE+\angle CBD=90^{\circ}$，∴ $\angle ACE=\angle CBD$。
      - ∵ $AC=4$ 且 $D$ 是 $AC$ 的中点，∴ $CD=2$；在 $\mathrm{Rt}\triangle BCD$ 中，$\tan\angle CBD=\frac{CD}{BC}=\frac{2}{3}$，∴ $\tan\angle ACE=\frac{2}{3}$。
      - (2) 过点 $E$ 作 $EH\perp AC$ 于点 $H$。在 $\mathrm{Rt}\triangle ABC$ 中，$\tan A=\frac{BC}{AC}=\frac{3}{4}$，∴ $\frac{EH}{AH}=\frac{3}{4}$，设 $EH=3k$，$AH=4k$，则 $AE=5k$。
      - 在 $\mathrm{Rt}\triangle CEH$ 中，$\tan\angle ECA=\frac{EH}{CH}=\frac{2}{3}$，∴ $CH=\frac{9}{2}k$；$AC=AH+CH=\frac{17}{2}k=4$，解得 $k=\frac{8}{17}$，∴ $AE=\frac{40}{17}$。
