      clue: 相似三角形的判定与性质、矩形的性质
      solution_steps:
      - (1) ∵ $AE^{2}=EB\cdot EC$，∴ $\frac{AE}{EC}=\frac{EB}{AE}$；又 $\angle AEB=\angle CEA$，∴ $\triangle AEB\sim\triangle CEA$，∴ $\angle EBA=\angle EAC=90^{\circ}$，∴ $\angle CBA=90^{\circ}$，而四边形 $ABCD$ 是平行四边形，∴ 四边形 $ABCD$ 是矩形。
      - (2) 由 $\triangle AEB\sim\triangle CEA$ 得 $\frac{BE}{AB}=\frac{AE}{AC}$，$\angle EAB=\angle ECA$；∵ 矩形对角线互相平分，$OB=OC$，∴ $\angle OBC=\angle ECA=\angle EAB$，即 $\angle EBF=\angle EAB$。
      - 又 $\angle F=\angle F$，∴ $\triangle EBF\sim\triangle BAF$，∴ $\frac{BF}{AF}=\frac{BE}{AB}=\frac{AE}{AC}$；∵ $AF=AC$，∴ $BF=AE$，即 $AE=BF$。
