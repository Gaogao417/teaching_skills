        page_number: 36
    block:
      stem_latex: 如图，已知在平面直角坐标系 $xOy$ 中，抛物线 $y=\frac{4}{9}x^{2}+bx+c$ 经过原点，且与 $x$ 轴相交于点 $A$，点 $A$ 的横坐标为6，抛物线顶点为点 $B$。(1) 求这条抛物线的表达式和顶点 $B$ 的坐标；(2) 过点 $O$ 作 $OP\parallel AB$，在直线 $OP$ 上取一点 $Q$，使得 $\angle QAB=\angle OBA$，求点 $Q$ 的坐标；(3) 将该抛物线向左平移 $m$（$m>0$）个单位，所得新抛物线与 $y$ 轴负半轴相交于点 $C$ 且顶点仍然在第四象限，此时点 $A$ 移动到点 $D$ 的位置，$CB:DB=3:4$，求 $m$ 的值。
      answer: (1) $y=\frac{4}{9}x^{2}-\frac{8}{3}x$，顶点 $B(3,-4)$；(2) $Q\left(\frac{33}{25},\frac{44}{25}\right)$；(3) $m=\frac{21}{16}$
      clue: 二次函数综合题
      solution_steps:
      - (1) 点 $O(0,0)$、$A(6,0)$ 在抛物线上，∴ $\begin{cases}c=0\\ \frac{4}{9}\times 36+6b+c=0\end{cases}$，解得 $b=-\frac{8}{3}$，$c=0$，∴ $y=\frac{4}{9}x^{2}-\frac{8}{3}x=\frac{4}{9}(x-3)^{2}-4$，顶点 $B(3,-4)$。
      - (2) 直线 $AB$：$y=\frac{4}{3}x-8$；∵ $OP\parallel AB$，∴ 直线 $OP$：$y=\frac{4}{3}x$。设 $Q(3k,4k)$，由 $\angle QAB=\angle OBA$ 可知四边形 $OQAP$ 为等腰梯形，∴ $QA=OB$，即 $(6-3k)^{2}+(4k)^{2}=25$，解得 $k=\frac{11}{25}$（$k=1$ 舍去），∴ $Q\left(\frac{33}{25},\frac{44}{25}\right)$。
      - (3) 平移后新抛物线 $y=\frac{4}{9}(x-3+m)^{2}-4$，且 $0<m<3$。过点 $B$ 分别作 $x$、$y$ 轴的垂线，垂足为 $E$、$F$，由 $\frac{BF}{BE}=\frac{BC}{BD}=\frac{3}{4}$ 得 $\triangle BCF\sim\triangle BDE$，∴ $\frac{CF}{DE}=\frac{3}{4}$，$CF=\frac{3}{4}(3-m)$。
      - ∴ $OC=4-CF=4-\frac{3}{4}(3-m)$；又 $OC=4-\frac{4}{9}(3-m)^{2}$，联立解得 $m=\frac{21}{16}$（$m=3$ 舍去）。
