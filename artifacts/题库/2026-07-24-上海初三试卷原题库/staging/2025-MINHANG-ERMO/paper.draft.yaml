      - ① $2x+3>4x-8$，$x<\frac{11}{2}$。
      - ② $\frac{2(2x-1)-12}{6}\leq\frac{3(x-2)}{6}$，$4x-14\leq3x-6$，$x\leq8$。
      - $\therefore x<\frac{11}{2}$。
      clue: 分别解两个不等式取交集。
      answer: $x<\dfrac{11}{2}$
