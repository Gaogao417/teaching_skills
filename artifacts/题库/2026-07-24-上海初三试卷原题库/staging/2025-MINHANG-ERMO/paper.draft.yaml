        $\triangle ABC$ 中 $BE$ 为中线，$AD$ 平分 $\angle BAC$ 且 $AD\perp BE$，$EF\perp BE$，$AB=5$，$\tan\angle ABE=\frac{3}{4}$。
        (1) 求 $BE$；
        (2) 求 $\tan\angle EBC$。
      solution_steps:
      - (1) $AH=3$，$BH=4$，角平分线 $\angle BAH=\angle EAH$，$EH=4$，$BE=8$。
