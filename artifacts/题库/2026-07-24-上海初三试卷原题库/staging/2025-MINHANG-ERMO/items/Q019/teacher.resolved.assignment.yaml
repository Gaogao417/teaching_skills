  - type: problem
    id: Q019
    points: 10
    stem_latex: 先化简：$\left(1-\dfrac{1}{x+2}\right)\div\dfrac{x^{2}-1}{x^{2}+4x+4}$，再求 $x=\sqrt{2}$ 时的值。
    solution_steps:
    - 原式 $=\frac{x+1}{x+2}\times\frac{(x+2)^2}{(x+1)(x-1)}=\frac{x+2}{x-1}$。
    - 代入 $x=\sqrt{2}$：$\frac{\sqrt{2}+2}{\sqrt{2}-1}=4+3\sqrt{2}$。
    clue: 分式化简+分母有理化。
    answer: $\dfrac{x+2}{x-1}$，代入得 $4+3\sqrt{2}$
