    stem_latex: 方程 $\sqrt{12+x} = -x$ 的解是______
    answer: $x = -3$
    clue: 平方后检验增根。
    solution_steps:
    - $12+x=x^2$，$x^2-x-12=0$，$x=4$（增根）或 $x=-3$。
