  - type: problem
    id: Q021
    points: 10
    stem_latex: '$\triangle ABC$ 中 $BE$ 为中线，$AD$ 平分 $\angle BAC$ 且 $AD\perp BE$，$EF\perp BE$，$AB=5$，$\tan\angle ABE=\frac{3}{4}$。

      (1) 求 $BE$；

      (2) 求 $\tan\angle EBC$。'
    solution_steps:
    - (1) $AH=3$，$BH=4$，角平分线 $\angle BAH=\angle EAH$，$EH=4$，$BE=8$。
    - (2) $EF\parallel AD$，$\triangle CEF\sim\triangle CAD$，$F$ 为 $DC$ 中点。
    - $\triangle BHD\sim\triangle BFE$，$HD=\frac{1}{2}EF=\frac{1}{4}AD$。
    - $AH=3$，$HD=1$，$\tan\angle EBC=\frac{HD}{BE}=\frac{1}{4}$。
    clue: 角平分线+相似三角形+中位线。
    answer: (1) $BE=8$；(2) $\tan\angle EBC=\dfrac{1}{4}$
