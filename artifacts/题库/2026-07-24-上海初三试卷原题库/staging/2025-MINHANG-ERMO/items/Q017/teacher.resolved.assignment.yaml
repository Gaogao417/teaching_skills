    stem_latex: 等腰三角形底边长8，外接圆半径5，圆心到腰的距离为______
    answer: $\sqrt{5}$ 或 $2\sqrt{5}$
    clue: 圆心在三角形内或外两种情况。
    solution_steps:
    - 情况1：$OH=3$，$AB=4\sqrt{5}$，距离 $\sqrt{5}$。
    - 情况2：$ON=3$，$AB=2\sqrt{5}$，距离 $2\sqrt{5}$。
