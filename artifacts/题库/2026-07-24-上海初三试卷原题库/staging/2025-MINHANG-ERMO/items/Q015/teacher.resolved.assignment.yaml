  - type: short_answer
    id: Q015
    points: 4
    stem_latex: $\square ABCD$ 中，$E$ 是 $AB$ 中点，$DE$ 与 $AC$ 交于 $F$。$\overrightarrow{AB}=\vec{a}$，$\overrightarrow{AD}=\vec{b}$，$\overrightarrow{EF}=$______
    answer: $\dfrac{1}{3}\vec{b} - \dfrac{1}{6}\vec{a}$
    clue: $\triangle AEF\sim\triangle CDF$（$1:2$），$EF=\frac{1}{3}ED$。
    solution_steps:
    - $\overrightarrow{ED}=-\frac{1}{2}\vec{a}+\vec{b}$，$\overrightarrow{EF}=\frac{1}{3}\overrightarrow{ED}$。
    - $=\frac{1}{3}\vec{b}-\frac{1}{6}\vec{a}$。
