    stem_latex: 直角梯形 $ABCD$（$AD\parallel BC$，$\angle A=90^{\circ}$，$\angle C=30^{\circ}$，$AD=2$，$BC=5$）的周长为______
    answer: $7 + 3\sqrt{3}$
    clue: $DH=\sqrt{3}$，$CD=2\sqrt{3}$，$AB=\sqrt{3}$。
    solution_steps:
    - $CH=3$，$DH=\sqrt{3}$，$CD=2\sqrt{3}$。
    - 周长 $=2+5+\sqrt{3}+2\sqrt{3}=7+3\sqrt{3}$。
