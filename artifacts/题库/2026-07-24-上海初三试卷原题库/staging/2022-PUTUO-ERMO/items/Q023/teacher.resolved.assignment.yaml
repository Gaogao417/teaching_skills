  - type: problem
    id: Q023
    points: 12
    stem_latex: '四边形 $ABCD$ 中 $\angle BAD=\angle BCD=90^{\circ}$，$E$ 为 $BD$ 中点，$F$ 在 $AD$ 上，$CF$ 交 $BD$ 于 $G$，$CF\parallel AE$，$CF=\dfrac{1}{2}BD$。

      (1) 求证：四边形 $AECF$ 为菱形；

      (2) 若 $\angle DCG=\angle DEC$，求证：$AE^{2}=AD\cdot DC$。'
    answer: 见证明
    clue: (1) 直角三角形斜边中线；(2) 相似。
    solution_steps:
    - (1) $AE=CE=\dfrac{1}{2}BD=CF$，$CF\parallel AE$，四边形 $AECF$ 是平行四边形，又 $AE=CE$，$\therefore$ 是菱形。
    - (2) 菱形 $AECF$，$AF\parallel CE$，$\angle ADE=\angle DCG$，$\angle FAD=\angle DCE$，$\triangle DCF\sim\triangle EDA$，$\dfrac{AD}{DC}=\dfrac{AE}{CF}$，$AE=CF$，$\therefore AE^{2}=AD\cdot DC$。
