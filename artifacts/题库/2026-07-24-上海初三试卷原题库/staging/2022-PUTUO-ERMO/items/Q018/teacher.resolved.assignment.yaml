    stem_latex: 矩形 $ABCD$（$AB=3$，$BC=4$）绕 $A$ 旋转，$B^{\prime}$ 落在对角线 $BD$ 上，$DD^{\prime}$ 交 $B^{\prime}C^{\prime}$ 于 $E$，则 $DE=$______
    answer: $\dfrac{21}{20}$
    clue: 旋转+相似。
    solution_steps:
    - $BD=5$，$AF=2.4$，$BF=1.8$，$BB^{\prime}=3.6$，$B^{\prime}D=1.4$，由 $\triangle AB^{\prime}F\sim\triangle B^{\prime}ED$ 得 $DE=\dfrac{21}{20}$。
