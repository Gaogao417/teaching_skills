  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，梯形 $ABCD$ 中 $AD\parallel BC$，$BC=3AD$，设 $\overrightarrow{AB}=\vec{a}$，$\overrightarrow{DC}=\vec{b}$，则 $\overrightarrow{AD}=$______
    answer: $\dfrac{1}{2}\vec{b}-\dfrac{1}{2}\vec{a}$
    clue: 作 $DE\parallel AB$ 构造平行四边形。
    solution_steps:
    - $\overrightarrow{EC}=\vec{b}-\vec{a}$，$EC=2AD$，$\overrightarrow{AD}=\dfrac{1}{2}\overrightarrow{EC}=\dfrac{1}{2}\vec{b}-\dfrac{1}{2}\vec{a}$。
