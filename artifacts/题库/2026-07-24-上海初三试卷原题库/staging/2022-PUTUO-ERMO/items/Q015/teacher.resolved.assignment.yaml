    stem_latex: 如图，四边形 $ABCD$ 对角线交于 $O$，$AO=2$，$AD=4$，$OC=6$，$BC=8$，$\angle DAO=\angle CBO$，则 $AB:CD=$______
    answer: $\dfrac{2}{3}$
    clue: 两次相似。
    solution_steps:
    - $\triangle AOD\sim\triangle BOC$，$OB=4$，$OD=3$；$\triangle AOB\sim\triangle DOC$，$AB:CD=AO:OD=2:3$。
