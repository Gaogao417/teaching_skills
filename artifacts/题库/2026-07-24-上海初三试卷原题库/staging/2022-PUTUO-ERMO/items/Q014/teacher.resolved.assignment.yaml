    stem_latex: 如图，$\triangle ABC$ 中 $AB=AC$，$D$ 在 $BC$ 上，$AD=BD$，$\angle DAC=102^{\circ}$，则 $\angle BAD=$______度
    answer: '26'
    clue: 设 $\angle B=x$ 列方程。
    solution_steps:
    - 设 $\angle B=x$，$\angle BAD=x$，$\angle ADC=2x$，$2x+102^{\circ}+x=180^{\circ}$，$x=26^{\circ}$。
