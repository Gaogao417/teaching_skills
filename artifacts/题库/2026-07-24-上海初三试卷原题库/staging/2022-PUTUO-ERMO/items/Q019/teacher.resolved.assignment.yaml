  - type: problem
    id: Q019
    points: 10
    stem_latex: 先化简再求值：$\left(1-\dfrac{3}{2+a}\right)\div\dfrac{a^{2}-1}{a^{2}+a}$，其中 $a=\sqrt{3}$。
    answer: $\dfrac{a}{2+a}$；代入得 $2\sqrt{3}-3$
    clue: 分式化简。
    solution_steps:
    - 原式 $=\dfrac{a-1}{2+a}\cdot\dfrac{a}{a-1}=\dfrac{a}{2+a}$。
    - $a=\sqrt{3}$ 时，原式 $=\dfrac{\sqrt{3}}{2+\sqrt{3}}=2\sqrt{3}-3$。
