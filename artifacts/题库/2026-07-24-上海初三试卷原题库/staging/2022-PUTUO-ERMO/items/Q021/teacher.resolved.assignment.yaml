  - type: problem
    id: Q021
    points: 10
    stem_latex: '如图，$\triangle ABC$ 中 $\cos\angle ABC=\dfrac{2}{3}$，$BC=8$，$AB=9$，以 $B$、$C$ 为圆心大于 $\dfrac{1}{2}BC$ 的同样长为半径作弧交于 $M$、$N$，直线 $MN$ 交 $AB$、$BC$ 于 $D$、$E$。

      (1) $MN$ 是线段 $BC$ 的______，$BE=$______；

      (2) 求点 $A$ 到直线 $MN$ 的距离。'
    answer: (1) 垂直平分线，$4$；(2) $2$
    clue: (1) 作图痕迹为垂直平分线；(2) 解直角三角形。
    solution_steps:
    - (1) $MN$ 是 $BC$ 的垂直平分线，$BE=4$。
    - (2) 作 $AH\perp MN$，$BD=\dfrac{4}{\cos B}=6$，$AD=3$，$AH=AD\cos B=3\times\dfrac{2}{3}=2$。
