  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 在 $\triangle ABC$ 中，$\angle A=45^{\circ}$，$\angle B=30^{\circ}$，$CD$ 是 $AB$ 边上的高，$BC=6$，那么 $\triangle ADC$ 与 $\triangle BCD$ 的重心距是______
    answer: $\sqrt{3}+1$
    clue: 分别求两三角形重心坐标再求距离。
    solution_steps:
    - 由解直角三角形分别求 $\triangle ADC$、$\triangle BCD$ 的重心，再求两重心距离为 $\sqrt{3}+1$。
