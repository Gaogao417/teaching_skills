  blocks:
  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如图，$\triangle ABC$ 中，$D$ 在 $BC$ 上，$BD=2DC$，设 $\overrightarrow{AB}=\vec{a}$，$\overrightarrow{BC}=\vec{b}$，那么 $\overrightarrow{DA}=$______
    answer: $-\vec{a}-\dfrac{2}{3}\vec{b}$
    clue: $\overrightarrow{DA}=-\overrightarrow{AD}=-(\vec{a}+\dfrac{2}{3}\vec{b})$。
    solution_steps:
    - $\overrightarrow{BD}=\dfrac{2}{3}\overrightarrow{BC}=\dfrac{2}{3}\vec{b}$。
    - $\overrightarrow{AD}=\overrightarrow{AB}+\overrightarrow{BD}=\vec{a}+\dfrac{2}{3}\vec{b}$。
    - $\overrightarrow{DA}=-\overrightarrow{AD}=-\vec{a}-\dfrac{2}{3}\vec{b}$。
