    stem_latex: '梯形 $ABCD$ 中，$DC\parallel AB$，$\angle DAB=90^{\circ}$，$DC=3$，$DA=6$，$AB=9$，$E$ 在射线 $AB$ 上，过 $E$ 作 $EF\parallel AD$ 交射线 $DC$ 于 $F$，设 $AE=x$。

      (1) 当 $x=1$ 时，$EF$ 与 $AC$ 交于 $G$，求 $GE$；

      (2) 当 $x>3$ 时，$EF$ 与射线 $CB$ 交于 $H$。① 当 $3<x<9$ 时，动点 $M$（不与 $A$、$D$ 重合）在 $AD$ 上且 $AM=BE$，联结 $MH$ 交 $AC$ 于 $N$，问 $CH:HN$ 是否变化并求其值；② 联结 $AH$，若 $\angle HAE=\angle CAD$，求 $x$。'
