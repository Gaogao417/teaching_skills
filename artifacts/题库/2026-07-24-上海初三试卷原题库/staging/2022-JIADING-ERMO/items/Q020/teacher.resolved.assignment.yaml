  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases} x-2y=8 \\ x^{2}+5xy-6y^{2}=0 \end{cases}$
    answer: $\begin{cases} x_{1}=6 \\ y_{1}=-1 \end{cases}$ 或 $\begin{cases} x_{2}=-8 \\ y_{2}=-8 \end{cases}$
    clue: ②因式分解降次。
    solution_steps:
    - ②化为 $(x+6y)(x-y)=0$，得 $x=-6y$ 或 $x=y$。
    - $x=-6y$ 代入①：$-8y=8$，$y=-1$，$x=6$。
    - $x=y$ 代入①：$-y=8$，$y=-8$，$x=-8$。
