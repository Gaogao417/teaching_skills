    id: Q018
    points: 4
    stem_latex: 正方形 $ABCD$（$AB=5$），$E$ 在 $BC$ 上，$\triangle ABE$ 沿 $AE$ 翻折后 $B$ 落到正方形内点 $F$，联结 $BF$、$CF$、$DF$，若 $\angle BFC=90^{\circ}$，则 $DF=$______
    answer: $\sqrt{10}$
    clue: 翻折+直角条件。
    solution_steps:
    - 由翻折及 $\angle BFC=90^{\circ}$ 的条件，利用勾股定理可求得 $DF=\sqrt{10}$。
