    id: Q014
    points: 4
    stem_latex: 袋中5个红球、2个白球、1个黑球（除颜色外都相同），随机摸出一个恰为白球的概率是______
    answer: $\dfrac{1}{4}$
    clue: 白球数除以总数。
    solution_steps:
    - $P=\dfrac{2}{5+2+1}=\dfrac{2}{8}=\dfrac{1}{4}$。
