  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 用换元法解方程 $\dfrac{2x}{x+2}+\dfrac{x+2}{x}=3$，设 $\dfrac{x}{x+2}=y$，原方程化为关于 $y$ 的整式方程是______
    answer: $2y^{2}-3y+1=0$
    clue: $\dfrac{x+2}{x}=\dfrac{1}{y}$，代入。
    solution_steps:
    - $2y+\dfrac{1}{y}=3$，两边乘 $y$ 得 $2y^{2}-3y+1=0$。
