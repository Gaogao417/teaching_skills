    stem_latex: '抛物线 $y=ax^{2}+bx+3$ 经过 $A(3,0)$、$B(4,1)$，与 $y$ 轴交于 $C$。

      (1) 求抛物线表达式；

      (2) 求四边形 $OABC$ 的面积；

      (3) 抛物线对称轴为 $l$，$D$ 与 $B$ 关于 $l$ 对称，线段 $BC$ 上是否存在点 $E$ 使四边形 $ADCE$ 是菱形？若存在求 $E$，若不存在说明理由。'
