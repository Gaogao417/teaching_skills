      end_anchor: '1'
    block:
      stem_latex: 计算：$\left(\dfrac{1}{2}\right)^{-1}+\sqrt{2}(1-\sqrt{2})+\dfrac{1}{\sqrt{2}-1}-(\sqrt{2})^{3}$
      answer: '1'
      clue: 负指数幂、分母有理化、幂的运算。
      solution_steps:
      - $\left(\dfrac{1}{2}\right)^{-1}=2$，$\sqrt{2}(1-\sqrt{2})=\sqrt{2}-2$，$\dfrac{1}{\sqrt{2}-1}=\sqrt{2}+1$，$(\sqrt{2})^{3}=2\sqrt{2}$。
      - 原式 $=2+(\sqrt{2}-2)+(\sqrt{2}+1)-2\sqrt{2}=1$。
