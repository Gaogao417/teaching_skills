      start_anchor: $\angle BAE=\angle CAD$
      end_anchor: 平行四边形
    block:
      stem_latex: '四边形 $ABCD$ 中，$AC$ 为对角线，$AC=AD$，$E$ 在 $BC$ 上，$AB=AE$，$\angle BAE=\angle
        CAD$，联结 $DE$。

        (1) 求证：$BC=DE$；

        (2) 当 $AC=BC$ 时，求证：四边形 $ABCD$ 是平行四边形。'
      answer: (1) 见证明；(2) 见证明
      clue: (1) 证 $\triangle BAC\cong\triangle EAD$；(2) 证 $AD\parallel BC$ 且 $AD=BC$。
      solution_steps:
      - (1) $\angle BAE=\angle CAD\Rightarrow \angle BAC=\angle EAD$，又 $AB=AE$，$AC=AD$，$\triangle
        BAC\cong\triangle EAD$（SAS），$\therefore BC=DE$。
      - (2) $AC=BC$ 时 $\angle B=\angle CAB$，$AB=AE$ 时 $\angle B=\angle AEB$，可推 $\angle
        ACB=\angle BAE=\angle CAD$，$\therefore AD\parallel BC$；又 $AC=BC=AD$，$\therefore$
        四边形 $ABCD$ 是平行四边形。
