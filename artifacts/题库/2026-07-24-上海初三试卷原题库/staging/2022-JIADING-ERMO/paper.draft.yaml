        AB$ 于 $E$，$AE=16$，$\sin A=\dfrac{3}{5}$。

        (1) 求 $CD$；(2) 求 $\cot\angle DBC$。'
      answer: (1) $CD=12$；(2) $\cot\angle DBC=2$
      clue: 角平分线性质 $CD=DE$；解直角三角形。
      solution_steps:
      - (1) $\mathrm{Rt}\triangle AED$ 中 $\sin A=\dfrac{DE}{DA}=\dfrac{3}{5}$，$AE=16$，得
        $DE=12$，$DA=20$。
      - $BD$ 平分 $\angle ABC$，$\angle AED=\angle C=90^{\circ}$，$\therefore CD=DE=12$。
      - (2) $AC=32$，$\mathrm{Rt}\triangle ACB$ 中 $BC=24$。
      - $\mathrm{Rt}\triangle BCD$ 中 $\cot\angle DBC=\dfrac{BC}{CD}=\dfrac{24}{12}=2$。
