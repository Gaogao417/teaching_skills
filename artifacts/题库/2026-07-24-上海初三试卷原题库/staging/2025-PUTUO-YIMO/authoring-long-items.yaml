  - id: Q021
    source_key: 2025-PUTUO-YIMO-Q21
    question_number: 21
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [反比例函数, 一次函数, 锐角三角比]
    stem_latex: '如图10，在平面直角坐标系 $xOy$ 中，经过原点 $O$ 的直线与双曲线 $y=\dfrac6x$ 交于点 $A(2,m)$，点 $B$ 在射线 $OA$ 上，点 $C$ 的坐标为 $(7,0)$。（1）求直线 $OA$ 的表达式；（2）如果 $\tan\angle BCO=2$，求点 $B$ 的坐标。'
    answer: '（1）$y=\dfrac32x$；（2）$B(4,6)$。'
    official_solution_latex:
      - title: 第（1）问
        content: '$\because A(2,m)$ 在双曲线 $y=\dfrac6x$ 上，$\therefore m=3$，点 $A$ 的坐标为 $(2,3)$。设直线 $OA$ 的表达式为 $y=kx\ (k\ne0)$，代入点 $A$ 得 $k=\dfrac32$，所以 $y=\dfrac32x$。'
      - title: 第（2）问
        content: '过点 $B$ 作 $BH\perp x$ 轴，垂足为点 $H$。设 $B\left(b,\dfrac32b\right)$，则 $BH=\dfrac32b$，$CH=7-b$。在 $\mathrm{Rt}\triangle BCH$ 中，$\tan\angle BCO=\dfrac{BH}{CH}=2$，解得 $b=4$，所以 $B(4,6)$。'
    question_crops: [{source: documents/初三/2025届-上海市普陀区-初三一模数学-试卷及参考答案/005.png, box: [140, 90, 950, 575], file: source-question.png}]
    prompt_crops: [{source: documents/初三/2025届-上海市普陀区-初三一模数学-试卷及参考答案/005.png, box: [560, 220, 950, 575], file: prompt-01.png, width: 70mm}]
    solution_crops:
      - {source: documents/初三/2025届-上海市普陀区-初三一模数学-试卷及参考答案/008.png, box: [125, 1380, 960, 1527], file: official-solution-01.png}
      - {source: documents/初三/2025届-上海市普陀区-初三一模数学-试卷及参考答案/009.png, box: [125, 0, 960, 540], file: official-solution-02.png}
  - id: Q022
    source_key: 2025-PUTUO-YIMO-Q22
    question_number: 22
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [解直角三角形, 测量]
    stem_latex: '如图11，已知小河两岸各有一栋大楼 $AB$ 与 $CD$。将激光发射器分别置于地面点 $E$ 和点 $F$ 处，发射的两束光线都经过大楼 $AB$ 顶端 $A$，并分别投射到大楼 $CD$ 最高一层 $CG$ 的顶端 $C$ 和其底部 $G$ 处，并测得 $EF=6\text{ m}$，$\angle AEB=26.6^\circ$，$\angle AFB=22.6^\circ$。（点 $D$、$B$、$E$、$F$ 在同一水平线上。）（1）试求大楼 $AB$ 的高度；（2）这两栋大楼每层的高度都相同，大楼 $AB$ 共有五层。能否测得大楼 $CD$ 的高度？如果可以，试求大楼 $CD$ 的高度；如果不可以，说明理由。参考数据：$\sin22.6^\circ\approx\dfrac5{13}$，$\cos22.6^\circ\approx\dfrac{12}{13}$，$\tan22.6^\circ\approx\dfrac5{12}$，$\sin26.6^\circ\approx\dfrac{\sqrt5}{5}$，$\cos26.6^\circ\approx\dfrac{2\sqrt5}{5}$，$\tan26.6^\circ\approx\dfrac12$。'
    answer: '（1）15米；（2）可以，33米。'
    official_solution_latex:
      - title: 第（1）问
        content: '设大楼 $AB$ 的高度为 $x\text{ m}$。由 $\angle ABE=90^\circ$，得 $BE=\dfrac{AB}{\tan\angle AEB}\approx2x$，$BF=\dfrac{AB}{\tan\angle AFB}\approx\dfrac{12}{5}x$。由 $EF=BF-BE$，得 $\dfrac{12}{5}x-2x=6$，解得 $x=15$。所以大楼 $AB$ 的高度为15米。'
      - title: 第（2）问
        content: '大楼 $AB$ 高15米，共五层，且两栋大楼每层高度相同，所以 $CG=3\text{ m}$。设 $DG=y\text{ m}$，则 $DE\approx2(y+3)$，$DF\approx\dfrac{12}{5}y$。由 $EF=DF-DE$，得 $\dfrac{12}{5}y-2(y+3)=6$，解得 $y=30$。所以大楼 $CD$ 的高度为33米。'
    question_crops: [{source: documents/初三/2025届-上海市普陀区-初三一模数学-试卷及参考答案/005.png, box: [140, 545, 950, 1450], file: source-question.png}]
