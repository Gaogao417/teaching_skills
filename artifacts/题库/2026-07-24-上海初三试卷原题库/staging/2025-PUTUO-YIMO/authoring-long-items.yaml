  - id: Q019
    source_key: 2025-PUTUO-YIMO-Q19
    question_number: 19
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [特殊角三角比, 实数运算]
    stem_latex: '计算：$2\cos30^\circ+4\sin^2 60^\circ-\dfrac{\cot30^\circ}{3\tan30^\circ-\tan45^\circ}$。'
    answer: '$\dfrac{3+\sqrt3}{2}$'
    official_solution_latex:
      - title: 计算
        content: '原式 $=2\times\dfrac{\sqrt3}{2}+4\times\left(\dfrac{\sqrt3}{2}\right)^2-\dfrac{\sqrt3}{3\times\dfrac{\sqrt3}{3}-1}=\sqrt3+3-\dfrac{3+\sqrt3}{2}=\dfrac{3+\sqrt3}{2}$。'
    question_crops: [{source: documents/初三/2025届-上海市普陀区-初三一模数学-试卷及参考答案/004.png, box: [140, 800, 950, 1015], file: source-question.png}]
