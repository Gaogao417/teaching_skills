  - id: Q024
    source_key: 2025-PUTUO-YIMO-Q24
    question_number: 24
    question_type: problem
    section_title: 三、解答题
    points: 12
    difficulty: challenge
    skill_tags: [二次函数, 平移, 锐角]
    stem_latex: '在平面直角坐标系 $xOy$ 中（如图13），已知抛物线 $y=ax^2+bx-3\ (a\ne0)$ 的顶点 $A$ 的坐标为 $(1,-2)$，与 $y$ 轴交于点 $B$。将抛物线沿射线 $BA$ 方向平移，平移后抛物线的顶点记作 $M$，其横坐标为 $m$。平移后的抛物线与原抛物线交于点 $N$，且设点 $N$ 位于原抛物线对称轴的右侧，其横坐标为 $n$。（1）求原抛物线的表达式；（2）求 $m$ 关于 $n$ 的函数解析式；（3）在抛物线平移过程中，如果 $\angle NBM$ 是锐角，求平移距离的取值范围。'
    answer: '（1）$y=-x^2+2x-3$；（2）$m=2n$；（3）$\sqrt2<AM<5\sqrt2$。'
    official_solution_latex:
      - title: 第（1）问
        content: '由顶点 $(1,-2)$ 得 $-\dfrac{b}{2a}=1$，且 $a+b-3=-2$，解得 $a=-1$，$b=2$。所以原抛物线为 $y=-x^2+2x-3$。'
      - title: 第（2）问
        content: '点 $B(0,-3)$，直线 $AB$ 为 $y=x-3$。顶点 $M(m,m-3)$，平移后抛物线为 $y=-(x-m)^2+m-3$。交点 $N$ 横坐标为 $n$，代入两抛物线得 $(m-2n)(m-1)=0$。因 $m-1\ne0$，所以 $m=2n$。'
      - title: 第（3）问
        content: '过点 $B$ 作 $BG\perp MB$，交原抛物线于点 $G$。当点 $N$ 在 $AG$ 之间的抛物线上运动时，$\angle NBM$ 为锐角。当 $N$ 与 $G$ 重合时，由相似三角形得 $n=3$，从而 $AM=5\sqrt2$。又点 $N$ 在原抛物线对称轴右侧，所以 $AM>\sqrt2$。故平移距离的取值范围是 $\sqrt2<AM<5\sqrt2$。'
    question_crops: [{source: documents/初三/2025届-上海市普陀区-初三一模数学-试卷及参考答案/006.png, box: [140, 530, 950, 1450], file: source-question.png}]
    prompt_crops: [{source: documents/初三/2025届-上海市普陀区-初三一模数学-试卷及参考答案/006.png, box: [450, 850, 950, 1410], file: prompt-01.png, width: 86mm}]
    solution_crops:
      - {source: documents/初三/2025届-上海市普陀区-初三一模数学-试卷及参考答案/010.png, box: [125, 380, 960, 1527], file: official-solution-01.png}
      - {source: documents/初三/2025届-上海市普陀区-初三一模数学-试卷及参考答案/011.png, box: [125, 0, 960, 280], file: official-solution-02.png}
  - id: Q025
    source_key: 2025-PUTUO-YIMO-Q25
    question_number: 25
    question_type: problem
    section_title: 三、解答题
    points: 14
    difficulty: challenge
    skill_tags: [线垂三角形, 相似三角形, 勾股定理]
    stem_latex: '如果三角形的一个角的平分线与一条边上的中线互相垂直，那么这个三角形叫做“线垂”三角形，这个角叫做“分角”。“分角”的两边成倍半关系，该性质的逆命题也成立。已知 $\triangle ABC$ 是“线垂”三角形，$AB<BC$，$\angle ABC$ 是 $\triangle ABC$ 的“分角”。（1）如图14-1，$BD$ 是 $\triangle ABC$ 的角平分线，$AE$ 是 $\triangle ABC$ 的中线，$AE$ 与 $BD$ 相交于点 $F$，求 $BF:FD$ 的值；（2）在图14-2中画 $\triangle ABC$ 的一条分割线，使所分成的两个三角形都成为“线垂”三角形，并指出各自的“分角”，说明理由；（3）在（2）的条件下，记分割得到的两个三角形“分角”的平分线交于点 $O$，点 $O$ 与点 $A$、$B$、$C$ 的距离分别为 $a$、$b$、$c$，求 $a$、$b$、$c$ 满足的等量关系。'
    answer: '（1）$BF:FD=3:1$；（2）取 $BC$ 上一点 $M$，使 $BM=\dfrac12AB$，联结 $AM$；$\triangle ABM$ 的“分角”为 $\angle B$，$\triangle ACM$ 的“分角”为 $\angle MAC$；（3）$4a^2+b^2=c^2$。'
    official_solution_latex:
      - title: 第（1）问
        content: '过点 $E$ 作 $EG\parallel BD$，交 $AC$ 于点 $G$。由题意及 $AB<BC$，得 $BC=2AB$。又 $AE$ 是中线，所以 $BC=2BE$，故 $AB=BE$。由 $BD$ 为角平分线得 $AF=EF$。由 $EG\parallel BD$，得 $\dfrac{DF}{EG}=\dfrac{AF}{AE}=\dfrac12$，$\dfrac{EG}{BD}=\dfrac{EC}{BC}=\dfrac12$，所以 $BF:FD=3:1$。'
      - title: 第（2）问
        content: '在边 $BC$ 上取点 $M$，使 $BM=\dfrac12AB$，联结 $AM$。则 $\triangle ABM$ 是“线垂”三角形，$\angle B$ 是“分角”；由 $\dfrac{BM}{BA}=\dfrac{BA}{BC}=\dfrac12$ 且 $\angle B$ 为公共角，得 $\triangle ABM\sim\triangle CBA$，从而 $\dfrac{AM}{CA}=\dfrac12$，所以 $\triangle ACM$ 也是“线垂”三角形，$\angle MAC$ 是“分角”。'
      - title: 第（3）问
        content: '作 $\angle B$ 和 $\angle CAM$ 的平分线，交于点 $O$，联结 $OC$，延长 $AO$ 交 $BC$ 于点 $N$。可得 $BA=BN$，$BO\perp AN$，$ON=OA=a$。延长 $AN$ 至点 $G$，使 $NG=ON$，联结 $CG$。由全等关系得 $CG=b$，且 $\angle CGN=90^\circ$。在直角三角形 $OGC$ 中，由勾股定理得 $(2a)^2+b^2=c^2$，即 $4a^2+b^2=c^2$。'
    question_crops: [{source: documents/初三/2025届-上海市普陀区-初三一模数学-试卷及参考答案/007.png, box: [130, 80, 950, 1450], file: source-question.png}]
