  - id: Q020
    source_key: 2025-PUTUO-YIMO-Q20
    question_number: 20
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [平行线分线段成比例, 平面向量]
    stem_latex: '如图9，已知点 $E$、$F$ 分别在 $\triangle ABC$ 的边 $AB$ 和 $AC$ 上，$EF\parallel BC$，$BE=2AE$，点 $D$ 在 $BC$ 的延长线上，$BC=CD$，联结 $ED$ 与 $AC$ 交于点 $G$。（1）求 $\dfrac{EG}{GD}$ 的值；（2）设 $\overrightarrow{BA}=\vec a$，$\overrightarrow{BD}=\vec b$，那么 $\overrightarrow{AC}=$ \underline{\hspace{2cm}}，$\overrightarrow{EG}=$ \underline{\hspace{2cm}}。（用向量 $\vec a$、$\vec b$ 表示）'
    answer: '（1）$\dfrac13$；（2）$\overrightarrow{AC}=-\vec a+\dfrac12\vec b$，$\overrightarrow{EG}=-\dfrac16\vec a+\dfrac14\vec b$。'
    official_solution_latex:
      - title: 第（1）问
        content: '$\because EF\parallel BC$，$\therefore\dfrac{EF}{BC}=\dfrac{AE}{AB}$。$\because BE=2AE$，$\therefore\dfrac{EF}{BC}=\dfrac13$。又 $BC=CD$，所以 $\dfrac{EF}{CD}=\dfrac13$。$\because EF\parallel CD$，$\therefore\dfrac{EG}{GD}=\dfrac{EF}{CD}=\dfrac13$。'
      - title: 第（2）问
        content: '$\overrightarrow{AC}=-\vec a+\dfrac12\vec b$，$\overrightarrow{EG}=-\dfrac16\vec a+\dfrac14\vec b$。'
    question_crops: [{source: documents/初三/2025届-上海市普陀区-初三一模数学-试卷及参考答案/004.png, box: [140, 980, 950, 1450], file: source-question.png}]
    prompt_crops: [{source: documents/初三/2025届-上海市普陀区-初三一模数学-试卷及参考答案/004.png, box: [625, 1030, 950, 1440], file: prompt-01.png, width: 62mm}]
