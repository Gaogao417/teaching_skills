    stem_latex: 如图11，已知小河两岸各有一栋大楼 $AB$ 与 $CD$。将激光发射器分别置于地面点 $E$ 和点 $F$ 处，发射的两束光线都经过大楼 $AB$ 顶端 $A$，并分别投射到大楼 $CD$ 最高一层 $CG$ 的顶端 $C$ 和其底部 $G$ 处，并测得 $EF=6\text{ m}$，$\angle AEB=26.6^\circ$，$\angle AFB=22.6^\circ$。（点 $D$、$B$、$E$、$F$ 在同一水平线上。）（1）试求大楼 $AB$ 的高度；（2）这两栋大楼每层的高度都相同，大楼 $AB$ 共有五层。能否测得大楼 $CD$ 的高度？如果可以，试求大楼 $CD$ 的高度；如果不可以，说明理由。参考数据：$\sin22.6^\circ\approx\dfrac5{13}$，$\cos22.6^\circ\approx\dfrac{12}{13}$，$\tan22.6^\circ\approx\dfrac5{12}$，$\sin26.6^\circ\approx\dfrac{\sqrt5}{5}$，$\cos26.6^\circ\approx\dfrac{2\sqrt5}{5}$，$\tan26.6^\circ\approx\dfrac12$。
