  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图10，在平面直角坐标系 $xOy$ 中，经过原点 $O$ 的直线与双曲线 $y=\dfrac6x$ 交于点 $A(2,m)$，点 $B$ 在射线 $OA$ 上，点 $C$ 的坐标为 $(7,0)$。（1）求直线 $OA$ 的表达式；（2）如果 $\tan\angle BCO=2$，求点 $B$ 的坐标。
    answer: （1）$y=\dfrac32x$；（2）$B(4,6)$。
    solution_steps:
    - title: 第（1）问
      content: $\because A(2,m)$ 在双曲线 $y=\dfrac6x$ 上，$\therefore m=3$，点 $A$ 的坐标为 $(2,3)$。设直线 $OA$ 的表达式为 $y=kx\ (k\ne0)$，代入点 $A$ 得 $k=\dfrac32$，所以 $y=\dfrac32x$。
    - title: 第（2）问
      content: 过点 $B$ 作 $BH\perp x$ 轴，垂足为点 $H$。设 $B\left(b,\dfrac32b\right)$，则 $BH=\dfrac32b$，$CH=7-b$。在 $\mathrm{Rt}\triangle BCH$ 中，$\tan\angle BCO=\dfrac{BH}{CH}=2$，解得 $b=4$，所以 $B(4,6)$。
