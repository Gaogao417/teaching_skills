    stem_latex: 如果三角形的一个角的平分线与一条边上的中线互相垂直，那么这个三角形叫做“线垂”三角形，这个角叫做“分角”。“分角”的两边成倍半关系，该性质的逆命题也成立。已知 $\triangle ABC$ 是“线垂”三角形，$AB<BC$，$\angle ABC$ 是 $\triangle ABC$ 的“分角”。（1）如图14-1，$BD$ 是 $\triangle ABC$ 的角平分线，$AE$ 是 $\triangle ABC$ 的中线，$AE$ 与 $BD$ 相交于点 $F$，求 $BF:FD$ 的值；（2）在图14-2中画 $\triangle ABC$ 的一条分割线，使所分成的两个三角形都成为“线垂”三角形，并指出各自的“分角”，说明理由；（3）在（2）的条件下，记分割得到的两个三角形“分角”的平分线交于点 $O$，点 $O$ 与点 $A$、$B$、$C$ 的距离分别为 $a$、$b$、$c$，求 $a$、$b$、$c$ 满足的等量关系。
