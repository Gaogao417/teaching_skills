      start_anchor: 当 $20 \leq x \leq 80$ 时，设 $y$ 与 $x$ 的函数表达式
      end_anchor: $40$ 元或 $60$ 元
    block:
      stem_latex: 某商店以20元/千克的单价进货，销售量 $y$（千克）与销售单价 $x$（元/千克）成一次函数关系（如图）。（1）求 $y$ 与
        $x$ 的函数表达式；（2）要使销售利润达到800元，销售单价应定为每千克多少元？
      answer: (1) $y=\begin{cases}60 & (0<x<20)\\ -x+80 & (20\leqslant x\leqslant
        80)\end{cases}$；(2) 40元或60元
      clue: (1) 分段用待定系数法；(2) 利润 $=(x-20)y$，列方程求解。
      solution_steps:
      - (1) $0<x<20$ 时 $y=60$；$20\leqslant x\leqslant80$ 时由 $(20,60)$、$(80,0)$ 得 $y=-x+80$。
      - (2) $(x-20)(-x+80)=800$，$x_{1}=40$，$x_{2}=60$。
