        O$ 是 $\triangle PAB$ 的外接圆，记 $BP=m$。（1）如图2，当 $PA=PB$ 时，联结 $OB$，求证：$OB\perp
        BC$；（2）延长 $AP$ 交射线 $BC$ 于 $Q$，如果 $\triangle ABQ$ 是直角三角形，求 $PQ$ 的长；（3）当圆心 $O$
