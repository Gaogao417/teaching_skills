        $C$ 为圆心 $AC$ 为半径作弧交 $AC$ 延长线于 $D$；②以 $A$ 为圆心定长 $a$ 为半径作弧交 $\angle BAC$ 两边于
        $M,N$；③以 $D$ 为圆心 $a$ 为半径作弧交 $CD$ 于 $P$；④以 $P$ 为圆心 $MN$ 为半径作弧交前弧于 $Q$，连 $DQ$
        延长交 $BC$ 延长线于 $E$。（1）填空：$CD=AC$，由作图得 $\underline{\quad}=\underline{\quad}$，又
        $\angle ACB=\angle DCE$，$\therefore \triangle ABC\cong\triangle DEC$，理由是 $\underline{\quad}$；（2）联结
        $AE$，求 $\tan\angle EAD$ 的值．
      answer: (1) $\angle BAC=\angle CDE$，ASA；(2) $2$
      clue: (1) 作图得 $\angle BAC=\angle CDE$，ASA 全等；(2) 由全等得 $AB\parallel DE$、$AB=DE$，四边形
        $ABDE$ 为平行四边形，$\angle EAD=\angle BDC$，解直角三角形。
      solution_steps:
      - (1) $CD=AC$，作图得 $\angle BAC=\angle CDE$，又 $\angle ACB=\angle DCE$，$\triangle
        ABC\cong\triangle DEC$（ASA）。
      - (2) 过 $B$ 作 $BG\perp AD$ 于 $G$，设 $AG=x$，$BG=2x$，$x=\sqrt{5}$，$CG=\sqrt{5}$，$BG=2\sqrt{5}$。
      - 由全等 $AB\parallel DE$ 且 $AB=DE$，四边形 $ABDE$ 为平行四边形，$AE\parallel BD$，$\angle
        EAD=\angle BDC$。
      - $\tan\angle BDC=\dfrac{BG}{CG}=2$，$\therefore \tan\angle EAD=2$。
