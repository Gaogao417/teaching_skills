      answer: $\begin{cases} x_{1}=5 \\ y_{1}=-1 \end{cases}$ 或 $\begin{cases} x_{2}=3
        \\ y_{2}=-\dfrac{5}{3} \end{cases}$
      clue: 把 $x^{2}+6xy+9y^{2}$ 化为 $(x+3y)^{2}$，拆成两个一次方程组。
      solution_steps:
