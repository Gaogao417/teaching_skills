      answer: (1) 见解析；(2) $PQ=\dfrac{3\sqrt{5}}{5}$ 或 $\dfrac{5\sqrt{5}}{3}$；(3) $\sqrt{5}<m<5$
      clue: (1) $PA=PB$ 用垂径定理 + 菱形角平分线证垂直；(2) 分 $\angle AQB=90\degree$ 与 $\angle BAQ=90\degree$
        解直角三角形；(3) 由 $O$ 在 $AB$、$BC$ 上等边界情形确定 $m$ 范围。
      solution_steps:
      - (1) $PA=PB\Rightarrow \overset{\frown}{AP}=\overset{\frown}{BP}$，$OP\perp
        AB$；$OP=OB\Rightarrow \angle OBP=\angle OPB$；菱形 $\angle 1=\angle 2$，故 $\angle
        2+\angle OBP=90\degree$，$OB\perp BC$。
      - (2) 当 $\angle AQB=90\degree$，$AB$ 为直径，$AP=\sqrt{5}$；设 $PQ=x$，$(2\sqrt{5})^{2}=(2x)^{2}+(x+\sqrt{5})^{2}$，$x=\dfrac{3\sqrt{5}}{5}$。
      - 当 $\angle BAQ=90\degree$，$\tan\angle ABQ=\dfrac{4}{3}$，$AQ=\dfrac{8\sqrt{5}}{3}$，$AP=\sqrt{5}$，$PQ=\dfrac{5\sqrt{5}}{3}$。
      - (3) $O$ 在 $AB$ 上时 $m=\sqrt{5}$；$O$ 在 $BC$ 上时 $BO=\dfrac{5\sqrt{5}}{3}$；$P=D$
        或 $P=B$ 时 $m=5$；综合得圆心在菱形外部时 $\sqrt{5}<m<5$。
