      end_anchor: 故选：C
    block:
      stem_latex: 如图，在矩形 $ABCD$ 中，对角线 $AC$ 与 $BD$ 相交于点 $O$，$AB=5$，$BC=12$。分别以 $O$、$D$
        为圆心画圆，如果 $\odot O$ 与直线 $AD$ 相交、与直线 $CD$ 相离，且 $\odot D$ 与 $\odot O$ 内切，那么 $\odot
        D$ 的半径长 $r$ 的取值范围是（\quad）
      choices:
      - $\dfrac{1}{2}<r<4$
      - $\dfrac{5}{2}<r<6$
      - $9<r<\dfrac{25}{2}$
      - $9<r<13$
      answer: C
      clue: 求 $BD=13$、$O$ 到 $AD$、$CD$ 的距离，由内切与相交/相离条件定 $r$ 范围。
      solution_steps:
      - $BD=13$，$OD=\dfrac{13}{2}$；$O$ 到 $AD$ 距离 $\dfrac{5}{2}$，到 $CD$ 距离 $6$。
      - $\odot O$ 与 $AD$ 相交、与 $CD$ 相离，则其半径 $R$ 满足 $\dfrac{5}{2}<R<6$。
      - $\odot D$ 与 $\odot O$ 内切，$r=OD+R=\dfrac{13}{2}+R$，$\therefore 9<r<\dfrac{25}{2}$。
