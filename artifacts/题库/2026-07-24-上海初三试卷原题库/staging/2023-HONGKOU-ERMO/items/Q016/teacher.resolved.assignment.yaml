  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，在 $\triangle ABC$ 中，点 $D$、$E$ 分别在边 $BC$、$AC$ 上，$\angle ABE=\angle C$，$DE\parallel AB$，如果 $AB=6$，$AC=9$，那么 $S_{\triangle BDE}:S_{\triangle CDE}$ 的值是 ______
    answer: $4:5$
    clue: 由 $\triangle ABE\sim\triangle ACB$ 求 $AE$、$EC$，再用 $DE\parallel AB$ 得 $BD:DC$，面积比即 $BD:DC$。
    solution_steps:
    - $\triangle ABE\sim\triangle ACB$，$AE=\dfrac{AB^{2}}{AC}=4$，$EC=5$。
    - $DE\parallel AB\Rightarrow \dfrac{BD}{DC}=\dfrac{AE}{EC}=\dfrac{4}{5}$，$S_{\triangle BDE}:S_{\triangle CDE}=BD:DC=4:5$。
