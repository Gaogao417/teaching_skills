  blocks:
  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如图，在 $\parallelogram ABCD$ 中，点 $E$ 在边 $AD$ 上，且 $AE=2ED$，$CE$ 交 $BD$ 于点 $F$，如果 $\vec{AB}=\vec{a}$，$\vec{AD}=\vec{b}$，用 $\vec{a}$、$\vec{b}$ 表示向量 $\vec{DF}=$ ______
    answer: $\dfrac{1}{4}\vec{a}-\dfrac{1}{4}\vec{b}$
    clue: 由 $AE=2ED$ 证 $\triangle EDF\sim\triangle CBF$ 得 $DF=\dfrac{1}{4}DB$，再向量表示。
    solution_steps:
    - $\triangle EDF\sim\triangle CBF$，$\dfrac{DE}{BC}=\dfrac{1}{3}$，$DF=\dfrac{1}{4}DB$。
    - $\vec{DB}=\vec{a}-\vec{b}$，$\vec{DF}=\dfrac{1}{4}(\vec{a}-\vec{b})=\dfrac{1}{4}\vec{a}-\dfrac{1}{4}\vec{b}$。
