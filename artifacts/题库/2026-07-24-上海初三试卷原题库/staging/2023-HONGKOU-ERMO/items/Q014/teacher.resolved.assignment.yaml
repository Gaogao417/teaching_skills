  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 如果正六边形的边心距为 $3$，那么它的半径是 ______
    answer: $2\sqrt{3}$
    clue: 正六边形中心与相邻顶点及边心构成含 $30\degree$ 的直角三角形。
    solution_steps:
    - $\angle AOC=30\degree$，设 $AC=x$，$OA=2x$，$(2x)^{2}-x^{2}=3^{2}$，$x=\sqrt{3}$。
    - 半径 $OA=2\sqrt{3}$。
