  blocks:
  - type: short_answer
    id: Q010
    points: 4
    stem_latex: 已知抛物线 $y=x^{2}+bx+c$ 的对称轴为直线 $x=4$，点 $A(1,y_{1})$、$B(3,y_{2})$ 都在该抛物线上，那么 $y_{1}$ ______ $y_{2}$（填">"或"<"或"="）
    answer: '>'
    clue: 抛物线开口向上，离对称轴越远函数值越大。
    solution_steps:
    - 对称轴 $x=4$，$A$ 到对称轴距离 $3$，$B$ 到对称轴距离 $1$。
    - $\therefore y_{1}>y_{2}$。
