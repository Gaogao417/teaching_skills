  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 如图，在矩形 $ABCD$ 中，$AB=3$，$AD=4$，点 $E$ 在 $AB$ 上，将 $\triangle ADE$ 沿 $DE$ 翻折，点 $A$ 的对应点为 $P$，联结 $EP$、$DP$ 分别交边 $BC$ 于点 $F$、$G$，如果 $BF=\dfrac{1}{4}BC$，那么 $CG$ 的长是 ______
    answer: $\dfrac{6\sqrt{5}}{5}$
    clue: 延长 $EP$ 交 $DC$ 于 $Q$，由相似与折叠求 $BC$，再由 $\triangle EBF\sim\triangle GCD$ 求 $CG$。
    solution_steps:
    - $BF=\dfrac{1}{4}BC\Rightarrow \dfrac{BF}{FC}=\dfrac{1}{3}$；$\triangle EBF\sim\triangle QCF$，$CQ=3BE=3$，$DQ=6$。
    - 折叠得 $\angle AED=\angle QED$，又 $\angle AED=\angle EDQ$，$\therefore QE=QD=6$，$PQ=4$，$PD=2\sqrt{5}$，$BC=2\sqrt{5}$。
    - $\triangle EBF\sim\triangle GCD$，$\dfrac{EB}{CG}=\dfrac{BF}{CD}$，$CG=\dfrac{6\sqrt{5}}{5}$。
