  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 《四元玉鉴》记载"买椽"问题：六贯二百一十钱请人买椽，每株运费3文，少拿一株后剩下椽的运费恰等于一株椽的价钱。设这批椽 $x$ 株，可列分式方程为 ______
    answer: $\dfrac{6210}{x}=3(x-1)$
    clue: 一株椽价钱 $=\dfrac{6210}{x}$，等于 $(x-1)$ 株的运费。
    solution_steps:
    - 一株椽价钱 $\dfrac{6210}{x}$ 文；$(x-1)$ 株运费 $3(x-1)$ 文。
    - 列方程 $\dfrac{6210}{x}=3(x-1)$。
