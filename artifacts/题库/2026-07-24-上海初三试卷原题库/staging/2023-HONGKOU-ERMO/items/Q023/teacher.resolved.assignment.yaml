  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，在梯形 $ABCD$ 中，$AD\parallel BC$，$AB=CD$，点 $E$ 为 $BC$ 延长线上一点，$\angle ADB=\angle CDE$，点 $F$ 在 $BD$ 上，联结 $CF$。（1）求证：$AD\cdot DE=AC\cdot DC$；（2）如果 $AD\cdot CE=DF\cdot DB$，求证：四边形 $DFCE$ 为梯形．
    answer: (1)(2) 见解析
    clue: (1) 等腰梯形 + $\angle ADB=\angle CDE$ 证 $\triangle DAB\sim\triangle DCE$，结合 $AC=BD$；(2) 由比例证 $\triangle DBC\sim\triangle DCF$ 得 $FC\parallel DE$。
    solution_steps:
    - (1) 等腰梯形 $AC=BD$，$\angle DCE=\angle ADC=\angle DAB$，又 $\angle ADB=\angle CDE$，$\triangle DAB\sim\triangle DCE$。
    - $\dfrac{AD}{DC}=\dfrac{DB}{DE}$，$AD\cdot DE=DB\cdot DC=AC\cdot DC$。
    - (2) 由 $\triangle DAB\sim\triangle DCE$ 得 $AD\cdot CE=AB\cdot DC=CD^{2}$；又 $=DF\cdot DB$，$\therefore \dfrac{DC}{DB}=\dfrac{DF}{DC}$，$\triangle DBC\sim\triangle DCF$，$\angle DBC=\angle DCF=\angle ADB=\angle EDC$，$FC\parallel DE$，四边形 $DFCE$ 为梯形。
