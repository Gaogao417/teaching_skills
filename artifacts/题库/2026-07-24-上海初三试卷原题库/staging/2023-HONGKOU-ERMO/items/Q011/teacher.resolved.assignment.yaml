  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 如图，已知点 $A(-1,2)$，连接 $OA$，将线段 $OA$ 绕点 $O$ 顺时针旋转 $90\degree$ 得到线段 $OB$，如果点 $B$ 在反比例函数 $y=\dfrac{k}{x}\,(x>0)$ 的图像上，那么 $k$ 的值是 ______
    answer: $2$
    clue: 旋转 $90\degree$ 构造全等三角形求 $B$ 坐标，再求 $k$。
    solution_steps:
    - 作 $AC\perp x$ 轴、$BD\perp x$ 轴，证 $\triangle ACO\cong\triangle ODB$，$OD=2$，$BD=1$。
    - $B(2,1)$，$k=2\times1=2$。
