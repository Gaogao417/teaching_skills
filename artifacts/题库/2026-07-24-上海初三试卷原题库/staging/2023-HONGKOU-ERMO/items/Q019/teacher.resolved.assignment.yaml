  - type: problem
    id: Q019
    points: 10
    stem_latex: 先化简，再求值：$\dfrac{m^{2}}{m^{2}+4m+4}\div\dfrac{m}{m+2}-\dfrac{m-1}{m+2}$，其中 $m=\sqrt{3}-3$
    answer: $\dfrac{\sqrt{3}+1}{2}$
    clue: 分解因式后除法转乘法约分，同分母加减，最后代入有理化。
    solution_steps:
    - 原式 $=\dfrac{m^{2}}{(m+2)^{2}}\cdot\dfrac{m+2}{m}-\dfrac{m-1}{m+2}=\dfrac{m}{m+2}-\dfrac{m-1}{m+2}=\dfrac{1}{m+2}$。
    - $m=\sqrt{3}-3$ 时，原式 $=\dfrac{1}{\sqrt{3}-1}=\dfrac{\sqrt{3}+1}{2}$。
