    id: Q013
    points: 4
    stem_latex: 某校抽取部分学生参与"大阅读"问卷并绘制频率分布直方图（如图），得分在 $60$ 分到 $70$ 分（含60不含70）的频率是 ______
    answer: $0.2$
    clue: 各组频率之和为1，求该组频率/组距再乘组距。
    solution_steps:
    - $10\times(0.005+0.010+x+0.030+0.035)=1$，$x=0.02$。
    - 频率 $=10\times0.02=0.2$。
