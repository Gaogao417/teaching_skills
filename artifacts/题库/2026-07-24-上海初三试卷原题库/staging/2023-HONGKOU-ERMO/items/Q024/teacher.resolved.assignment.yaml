  - type: problem
    id: Q024
    points: 12
    stem_latex: 在平面直角坐标系 $xOy$ 中，抛物线 $y=x^{2}-2(m+1)x+2m-3$ 的顶点为 $A$，与 $y$ 轴交于 $B$，异于 $A$ 的点 $C(2,n)$ 在抛物线上。（1）如图，点 $B(0,1)$：①求 $A$ 的坐标和 $n$ 的值；②将抛物线向上平移后的新抛物线与 $x$ 轴一交点为 $D$，顶点 $A$ 移至 $A_{1}$，如果四边形 $DCAA_{1}$ 为平行四边形，求新抛物线表达式；（2）直线 $AC$ 与 $y$ 轴交于 $E$，如果 $BC\parallel AO$ 且 $B$ 在线段 $OE$ 上，求 $m$ 的值．
    answer: (1) ① $A(3,-8)$，$n=-7$；② $y=x^{2}-6x+8$；(2) $m=-1+\sqrt{5}$
    clue: (1) 由 $B$ 求 $m$，再求 $A,C$；平移后用平行四边形对边相等求 $A_1$；(2) 用 $BC\parallel AO$ 列方程，检验 $B$ 在 $OE$ 上。
    solution_steps:
    - (1)① $B(0,1)\Rightarrow 2m-3=1$，$m=2$，$y=x^{2}-6x+1=(x-3)^{2}-8$，$A(3,-8)$，$n=-7$。
    - ② $D(2,0)$，$AA_{1}=CD=7$，$A_{1}(3,-1)$，新抛物线 $y=(x-3)^{2}-1=x^{2}-6x+8$。
    - (2) $A(m+1,-m^{2}-4)$，$B(0,2m-3)$，$C(2,-2m-3)$；由 $BC\parallel AO$ 解得 $m=-1\pm\sqrt{5}$，检验 $B$ 在 $OE$ 上得 $m=-1+\sqrt{5}$。
