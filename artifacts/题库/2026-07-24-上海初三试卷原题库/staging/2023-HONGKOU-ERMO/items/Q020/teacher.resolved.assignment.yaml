  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases} x^{2}+6xy+9y^{2}=4 \\ x-3y=8 \end{cases}$
    answer: $\begin{cases} x_{1}=5 \\ y_{1}=-1 \end{cases}$ 或 $\begin{cases} x_{2}=3 \\ y_{2}=-\dfrac{5}{3} \end{cases}$
    clue: 把 $x^{2}+6xy+9y^{2}$ 化为 $(x+3y)^{2}$，拆成两个一次方程组。
    solution_steps:
    - $(x+3y)^{2}=4\Rightarrow x+3y=\pm2$。
    - 与 $x-3y=8$ 联立，解得 $\begin{cases} x_{1}=5 \\ y_{1}=-1 \end{cases}$ 或 $\begin{cases} x_{2}=3 \\ y_{2}=-\dfrac{5}{3} \end{cases}$。
