    block:
      stem_latex: '如图，点 $D、E$ 分别在 $\triangle ABC$ 的边 $AB、AC$ 上，$AE=EC，AE^2=\dfrac12AD\cdot AB$，联结 $DE$。（1）求证：$\triangle ADE\sim\triangle ACB$；（2）取 $AD$ 的中点 $F$，联结 $EF、BE$，求证：$\angle DEF=\angle CBE$。'
      answer: 两个结论均成立。
      solution_steps:
      - title: 第（1）问
        content: 因为 $AE=EC$，所以 $AC=2AE$。由 $AE^2=\dfrac12AD\cdot AB$ 得 $AE\cdot AC=AD\cdot AB$，即 $\dfrac{AE}{AB}=\dfrac{AD}{AC}$。又 $\angle DAE=\angle CAB$，所以 $\triangle ADE\sim\triangle ACB$。
      - title: 第（2）问
        content: 因为 $F$ 是 $AD$ 的中点，所以 $AD=2DF$。结合第（1）问的相似比例可得 $\dfrac{DF}{CB}=\dfrac{DE}{CE}$，且 $\angle FDE=\angle ECB$，所以 $\triangle DEF\sim\triangle CBE$，故 $\angle DEF=\angle CBE$。
