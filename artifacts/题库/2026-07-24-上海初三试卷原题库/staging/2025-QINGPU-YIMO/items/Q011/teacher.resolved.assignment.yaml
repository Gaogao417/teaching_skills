    stem_latex: 某公司10月份产值是120万元，设第四季度每个月产值的增长率相同，均为 $x\ (x>0)$，如果12月份的产值为 $y$ 万元，那么 $y$ 关于 $x$ 的函数解析式为 $\fillin$。
    answer: $y=120(1+x)^2$
    explanation: 官方参考答案：$y=120(1+x)^2$。
