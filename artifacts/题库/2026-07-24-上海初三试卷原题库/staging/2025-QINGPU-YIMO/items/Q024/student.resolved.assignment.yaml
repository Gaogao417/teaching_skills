    stem_latex: 在平面直角坐标系 $xOy$ 中，抛物线 $y=ax^2\ (a<0)$ 经过直线 $y=-x$ 上的点 $A$，已知 $OA=2\sqrt2$。（1）求该抛物线的表达式；（2）将抛物线先向右平移1个单位，再向上平移 $k\ (k>0)$ 个单位，所得新抛物线与 $y$ 轴相交于点 $C$，如果 $\tan\angle OCA=\dfrac49$：①求 $k$ 的值；②设新抛物线的顶点为点 $D$，新抛物线上的点 $B$ 是点 $A$ 的对应点，联结 $OD、CD$，在新抛物线的对称轴上存在点 $P$，使得 $\angle OPB=\angle ODC$，求点 $P$ 的坐标。
