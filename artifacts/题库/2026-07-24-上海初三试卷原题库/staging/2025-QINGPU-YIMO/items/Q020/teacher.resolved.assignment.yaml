  - type: problem
    id: Q020
    points: 10
    stem_latex: 抛物线 $y=ax^2+bx+c\ (a\ne0)$ 上部分点的横坐标 $x$、纵坐标 $y$ 的对应值如表。（1）写出该抛物线的开口方向、对称轴及顶点坐标；（2）设该抛物线与 $x$ 轴相交于点 $A$（点 $A$ 在对称轴的右侧），与 $y$ 轴相交于点 $B$，顶点为 $C$，求证：$\triangle ABC$ 是直角三角形。
    answer: （1）开口向上，对称轴为直线 $x=2$，顶点为 $(2,-1)$；（2）$\triangle ABC$ 是直角三角形。
    solution_steps:
    - title: 第（1）问
      content: 由表中对应值可知抛物线开口向上，对称轴为直线 $x=2$，顶点坐标为 $(2,-1)$。
    - title: 第（2）问
      content: $A(3,0)，B(0,3)，C(2,-1)$，所以 $AB^2=18，AC^2=2，BC^2=20$。因为 $AB^2+AC^2=BC^2$，所以 $\angle BAC=90^\circ$，$\triangle ABC$ 是直角三角形。
