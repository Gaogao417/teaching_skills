  - type: problem
    id: Q025
    points: 14
    stem_latex: 已知梯形 $ABCD$ 中，$AD\parallel BC，BC=4AD$，点 $E$ 在边 $AB$ 上，$AE=1，BE=2$，联结 $DE$。（1）如图1，联结 $EC$，求 $\triangle EAD$ 与 $\triangle EBC$ 的面积之比；（2）如图2，如果 $\angle EDC=90^\circ，\angle DEC=\angle DCB$，求 $\angle B$ 的正切值；（3）如图3，联结 $AC$ 交 $DE$ 于点 $F$，如果 $DA^2=DF\cdot DE$，且 $\dfrac{DE}{AC}=\cos B$，求边 $BC$ 的长。
    answer: （1）$1:8$；（2）$\tan B=\sqrt3$；（3）$BC=2\sqrt6$。
    solution_steps:
    - title: 第（1）问
      content: 延长 $DE$ 与 $CB$ 的延长线相交于点 $P$。由 $AD\parallel BC$ 得 $\triangle ADE\sim\triangle BPE$，结合 $AE:BE=1:2$ 与 $BC=4AD$，可得 $S_{\triangle EAD}:S_{\triangle EBC}=1:8$。
    - title: 第（2）问
      content: 延长 $DE$ 与 $CB$ 的延长线相交于点 $P$，过点 $E$ 作 $EG\perp BC$。由 $\angle DEC=\angle DCB$ 及直角条件得相似关系，推出 $\angle P=30^\circ$，再由直角三角形求得 $\tan B=\sqrt3$。
    - title: 第（3）问
      content: 以点 $D$ 为圆心、$DA$ 为半径作弧与 $BA$ 的延长线交于点 $P$，联结 $PD$，并作 $DH\perp AP$。由 $DA^2=DF\cdot DE$、$\dfrac{DE}{AC}=\cos B$ 及多组三角形相似关系，设 $PD=AD=a$，解得 $a=\dfrac{\sqrt6}{2}$，所以 $BC=4a=2\sqrt6$。
