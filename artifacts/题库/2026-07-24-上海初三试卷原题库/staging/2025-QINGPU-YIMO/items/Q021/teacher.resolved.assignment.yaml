  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在菱形 $ABCD$ 中，$AB=\sqrt5，\tan\angle CBD=\dfrac12$。（1）求对角线 $BD$ 的长；（2）求 $\sin\angle ABC$ 的值。
    answer: （1）$BD=4$；（2）$\sin\angle ABC=\dfrac45$。
    solution_steps:
    - title: 第（1）问
      content: 联结 $AC$ 与 $BD$ 交于点 $O$。由菱形性质，$BD=2OB，AC\perp BD$。在 $\mathrm{Rt}\triangle OBC$ 中，$\tan\angle CBD=\dfrac{OC}{OB}=\dfrac12$，又 $BC=\sqrt5$，得 $OC=1，OB=2$，所以 $BD=4$。
    - title: 第（2）问
      content: 过点 $A$ 作 $AE\perp BC$，垂足为 $E$。由菱形面积关系得 $AE=\dfrac{4\sqrt5}{5}$，所以 $\sin\angle ABC=\dfrac{AE}{AB}=\dfrac45$。
