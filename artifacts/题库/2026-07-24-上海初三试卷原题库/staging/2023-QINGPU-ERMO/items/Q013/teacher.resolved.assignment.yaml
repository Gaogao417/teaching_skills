  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 点 $M(-1,2)$ 和 $N$ 都在抛物线 $y=x^{2}-2x+c$ 上，$MN\parallel x$ 轴，那么 $N$ 的坐标为 ______
    answer: $(3,2)$
    clue: $MN\parallel x$ 轴则 $y_N=2$，由对称性求另一交点。
    solution_steps:
    - $M(-1,2)$ 代入得 $c=-1$；$y=2$ 时 $x=3$ 或 $-1$，$\therefore N(3,2)$。
