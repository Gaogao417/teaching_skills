  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases} x^{2}-9y^{2}=0 \\ x^{2}-2xy+y^{2}=4 \end{cases}$
    answer: $\begin{cases}x=\dfrac32\\y=-\dfrac12\end{cases}$，$\begin{cases}x=-\dfrac32\\y=\dfrac12\end{cases}$，$\begin{cases}x=3\\y=1\end{cases}$，$\begin{cases}x=-3\\y=-1\end{cases}$
    clue: ①②分别因式分解，组合成四个二元一次方程组。
    solution_steps:
    - ① $(x+3y)(x-3y)=0$；② $(x-y)^{2}=4$，$x-y=\pm2$。
    - 组合得四组解。
