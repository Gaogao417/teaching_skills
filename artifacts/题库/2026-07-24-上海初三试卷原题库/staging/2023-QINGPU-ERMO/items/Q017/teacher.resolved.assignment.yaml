  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 如图，点 $G(-3,1)$，$A(-1,3)$，$B(-4,0)$，$\odot C$ 以 $AB$ 为直径，那么点 $G$ 与 $\odot C$ 的最短距离为 ______
    answer: $\sqrt{2}$
    clue: 判断 $G$ 与圆的位置，$G$ 在 $AB$ 上时最短距离为到端点距离减半径。
    solution_steps:
    - 直线 $AB$：$y=x+4$，$G(-3,1)$ 在 $AB$ 上；$BG=\sqrt{1^{2}+1^{2}}=\sqrt{2}$，即最短距离。
