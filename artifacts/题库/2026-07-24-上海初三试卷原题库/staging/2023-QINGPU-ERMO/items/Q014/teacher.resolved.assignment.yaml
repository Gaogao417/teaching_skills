  blocks:
  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 点 $G$ 为 $\triangle ABC$ 的重心，$\vec{AB}=\vec{a}$，$\vec{AC}=\vec{b}$，那么 $\vec{AG}=$ ______（用 $\vec{a},\vec{b}$ 表示）
    answer: $\dfrac{1}{3}\vec{a}+\dfrac{1}{3}\vec{b}$
    clue: 重心向量 $\vec{AG}=\dfrac13(\vec{AB}+\vec{AC})$。
    solution_steps:
    - $\vec{AG}=\dfrac13(\vec{a}+\vec{b})=\dfrac13\vec{a}+\dfrac13\vec{b}$。
