    stem_latex: 如图反映轿车剩余油量 $q$（升）与行驶路程 $s$（千米）的函数关系，那么 $q$ 与 $s$ 的函数解析式为 ______
    answer: $q=-\dfrac{1}{8}s+50$
    clue: 由截距 $(0,50),(400,0)$ 用待定系数法。
    solution_steps:
    - 过 $(0,50),(400,0)$，$q=-\dfrac18s+50$。
