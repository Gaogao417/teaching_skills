    id: Q012
    points: 4
    stem_latex: 若一个正多边形的每一个外角都等于 $36\degree$，那么这个正多边形的中心角为 ______ 度
    answer: '36'
    clue: 外角和 $360\degree$ 除以外角得边数，中心角 $=360\degree\div n$。
    solution_steps:
    - $n=360\div36=10$，中心角 $=360\div10=36\degree$。
