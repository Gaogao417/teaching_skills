  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，$\triangle ABC$ 中 $BC=12$，$\tan B=\dfrac12$，$\angle C=45\degree$。（1）求 $AB$；（2）$D$ 在 $AB$ 上且 $\dfrac{AD}{BD}=\dfrac13$，连 $CD$，说明 $\angle BCD=\angle B$．
    answer: (1) $AB=4\sqrt{5}$；(2) 见解析
    clue: (1) 作 $AH\perp BC$，由 $\angle C=45\degree$ 及 $\tan B$ 求 $AH,BH$；(2) 作 $DG\perp BC$ 证 $DG$ 为 $BC$ 垂直平分线。
    solution_steps:
    - (1) $AH=CH=x$，$BH=2x$，$3x=12$，$x=4$，$AB=\sqrt{4^{2}+8^{2}}=4\sqrt{5}$。
    - (2) $DG\parallel AH$，$\dfrac{BG}{BH}=\dfrac{BD}{AB}=\dfrac34$，$BG=6=CG$，$DG$ 垂直平分 $BC$，$BD=CD$，$\angle BCD=\angle B$。
