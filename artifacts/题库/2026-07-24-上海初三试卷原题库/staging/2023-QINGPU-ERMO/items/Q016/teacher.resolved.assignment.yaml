    id: Q016
    points: 4
    stem_latex: 如图，圆柱形油槽截面油的最大深度为2分米，油面宽度8分米，那么该圆柱形油槽的内半径为 ______ 分米
    answer: '5'
    clue: 垂径定理 + 勾股定理列半径方程。
    solution_steps:
    - $AD=4$，设半径 $x$，$OD=x-2$，$x^{2}=(x-2)^{2}+4^{2}$，$x=5$。
