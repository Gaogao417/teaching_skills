  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 在 $-1,1,2$ 三个数中任取两个作为点 $P(x,y)$ 的横纵坐标，点 $P$ 在第二象限的概率为 ______
    answer: $\dfrac{1}{3}$
    clue: 列举所有坐标，数第二象限（$x<0,y>0$）的个数。
    solution_steps:
    - 共6种坐标，第二象限（$x<0,y>0$）有 $(-1,1),(-1,2)$ 共2个，$P=\dfrac{2}{6}=\dfrac13$。
