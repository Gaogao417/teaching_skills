  - type: choice
    id: Q005
    points: 4
    stem_latex: 平行四边形 $ABCD$ 对角线交于 $O$，下列补充条件能判定它是菱形的是（\quad）
    choices:
    - $OA=OC$
    - $OA=OB$
    - $\angle ABD=\angle CBD$
    - $\angle ABD=\angle CAB$
    answer: C
    clue: 邻边相等的平行四边形是菱形。
    solution_steps:
    - $\angle ABD=\angle CBD\Rightarrow CB=CD$，平行四边形为菱形。
