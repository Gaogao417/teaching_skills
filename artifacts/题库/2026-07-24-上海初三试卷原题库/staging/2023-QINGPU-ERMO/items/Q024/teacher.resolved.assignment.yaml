  - type: problem
    id: Q024
    points: 12
    stem_latex: 抛物线 $y=-\dfrac14x^{2}+bx+c$ 经过 $B(6,0),C(0,3)$，与 $x$ 轴另一交点为 $A$。（1）求解析式及 $A$；（2）向右平移 $m$（$m>0$）单位，$C\to D,A\to E$，若 $\angle DEC=90\degree$，求 $m$；（3）新抛物线顶点 $G$，对称轴右侧与 $x$ 轴交于 $F$，求 $C$ 到 $GF$ 的距离．
    answer: (1) $y=-\dfrac14x^{2}+x+3$，$A(-2,0)$；(2) $m=\dfrac{13}{2}$；(3) $\dfrac{19\sqrt{2}}{4}$
    clue: (1) 待定系数；(2) 由 $\angle DEC=90\degree$ 用 $\tan$ 列方程；(3) 平移后 $\angle GFP=45\degree$，用 $\sin45\degree$ 求距离。
    solution_steps:
    - (1) 代入得 $b=1,c=3$，$y=-\dfrac14x^{2}+x+3$，$A(-2,0)$。
    - (2) $\angle CAO=\angle OCE$，$\tan\angle CAO=\dfrac32=\dfrac{OE}{3}$，$OE=\dfrac92$，$m=AE=\dfrac{13}{2}$。
    - (3) 新抛物线顶点 $G(\dfrac{17}{2},4)$，$F(\dfrac{25}{2},0)$，$\angle GFP=45\degree$；$GF$ 交 $y$ 轴于 $M$，$CM=\dfrac{19}{2}$，$CH=CM\sin45\degree=\dfrac{19\sqrt2}{4}$。
