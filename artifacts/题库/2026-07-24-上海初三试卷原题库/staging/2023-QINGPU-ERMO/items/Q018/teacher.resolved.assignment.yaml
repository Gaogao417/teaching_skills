  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 如图，Rt$\triangle ABC$ 中 $\angle C=90\degree$，$BC=6$，$AB=10$，$D$ 为 $AB$ 中点，$M$ 在 $AC$ 上，将 $\triangle ADM$ 沿 $DM$ 翻折，$A$ 落在 $E$，如果 $EC\parallel AB$，那么 $CE=$ ______
    answer: $\dfrac{14}{5}$
    clue: 翻折保长保角，由 $EC\parallel AB$ 及全等/相似求 $CE$。
    solution_steps:
    - 翻折得 $\triangle ADM\cong\triangle EDM$，结合 $EC\parallel AB$ 构造全等，解得 $CE=\dfrac{14}{5}$。
