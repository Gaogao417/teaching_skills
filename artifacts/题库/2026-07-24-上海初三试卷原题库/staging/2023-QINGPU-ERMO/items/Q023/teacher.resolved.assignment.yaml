  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，平行四边形 $ABCD$ 中 $BD$ 平分 $\angle ABC$，$E$ 在 $BC$ 上，$AE$ 交 $BD$ 于 $F$，且 $AB^{2}=BF\cdot BD$。（1）求证：$F$ 在 $AB$ 的垂直平分线上；（2）求证：$AD\cdot AE=BE\cdot BD$．
    answer: (1)(2) 见解析
    clue: (1) 由 $AB^{2}=BF\cdot BD$ 证 $\triangle ABD\sim\triangle FBA$ 转角得 $AB=AF$；(2) 证两组相似转化比例。
    solution_steps:
    - (1) $\triangle ABD\sim\triangle FBA\Rightarrow \angle BAF=\angle BDA=\angle DBC=\angle DBA$，$\therefore AB=AF$，$F$ 在 $AB$ 垂直平分线上。
    - (2) $\triangle BEF\sim\triangle AEB\Rightarrow \dfrac{BE}{AE}=\dfrac{BF}{AB}=\dfrac{AB}{BD}$，$\therefore AB\cdot AE=BE\cdot BD$；又 $AB=AD$，$\therefore AD\cdot AE=BE\cdot BD$。
