  - type: problem
    id: Q025
    points: 14
    stem_latex: 如图，半圆 $O$ 直径 $AB=10$，$C$ 在半圆上，$BC=6$，$CH\perp AB$ 于 $H$，$D$ 是弧 $AC$ 上一点。（1）若 $D$ 是弧 $AB$ 中点，求 $\tan\angle DOC$；（2）连 $BD$ 交 $OC$ 于 $E$、交 $CH$ 于 $F$，设 $OE=m$：①用 $m$ 表示 $CF$；②以 $O$ 为圆心 $OE$ 为半径、$C$ 为圆心 $CF$ 为半径作圆，当两圆相交时求 $m$ 取值范围．
    answer: (1) $\dfrac{7}{24}$；(2)① $CF=\dfrac{600-120m}{125-7m}$；② $\dfrac57<m<5$
    clue: (1) $D$ 为弧 $AB$ 中点 $\Rightarrow OD\perp AB\parallel CH$，转角求正切；(2)① 作 $HG\parallel OC$ 构造两组相似表示 $CF$；② 由两圆外切临界求 $m$ 范围。
    solution_steps:
    - (1) $OD\parallel CH\Rightarrow \angle DOC=\angle OCH$；$CH=\dfrac{24}{5}$，$OH=\dfrac{7}{5}$，$\tan\angle DOC=\dfrac{OH}{CH}=\dfrac{7}{24}$。
    - (2)① 作 $HG\parallel OC$，$\triangle HGB\sim\triangle OEB\Rightarrow GH=\dfrac{18}{25}m$；$\triangle CEF\sim\triangle HGF\Rightarrow CF=\dfrac{600-120m}{125-7m}$。
    - (2)② 两圆外切时 $m+CF=5$，解得 $m=\dfrac57$ 或 $5$；相交时 $\dfrac57<m<5$（内切不可能）。
