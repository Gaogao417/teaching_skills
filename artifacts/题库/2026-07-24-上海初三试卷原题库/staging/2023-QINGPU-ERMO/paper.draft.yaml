      solution_steps:
      - (1) $\triangle ABD\sim\triangle FBA\Rightarrow \angle BAF=\angle BDA=\angle
        DBC=\angle DBA$，$\therefore AB=AF$，$F$ 在 $AB$ 垂直平分线上。
      - (2) $\triangle BEF\sim\triangle AEB\Rightarrow \dfrac{BE}{AE}=\dfrac{BF}{AB}=\dfrac{AB}{BD}$，$\therefore
        AB\cdot AE=BE\cdot BD$；又 $AB=AD$，$\therefore AD\cdot AE=BE\cdot BD$。
