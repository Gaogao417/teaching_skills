    block:
      stem_latex: 某校初三球类运动扇形图（如图），乒乓球80人占40%。（1）求篮球和足球总人数；（2）篮球、足球每人配备一只，篮球费用3000元、足球2400元，篮球单价比足球便宜10元，求篮球、足球人数．
      answer: (1) $100$ 人；(2) 篮球60人，足球40人
      clue: (1) 由乒乓球求总数再求篮足和；(2) 列分式方程，注意检验。
      solution_steps:
      - (1) 总数 $80\div40\%=200$，篮足共 $200\times(1-40\%-10\%)=100$ 人。
      - (2) 设篮球 $x$ 人，$\dfrac{3000}{x}+10=\dfrac{2400}{100-x}$，$x=60$，足球40人。
