        B$．
      answer: (1) $AB=4\sqrt{5}$；(2) 见解析
      clue: (1) 作 $AH\perp BC$，由 $\angle C=45\degree$ 及 $\tan B$ 求 $AH,BH$；(2) 作 $DG\perp
        BC$ 证 $DG$ 为 $BC$ 垂直平分线。
