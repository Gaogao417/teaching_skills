      - (2) $DG\parallel AH$，$\dfrac{BG}{BH}=\dfrac{BD}{AB}=\dfrac34$，$BG=6=CG$，$DG$
        垂直平分 $BC$，$BD=CD$，$\angle BCD=\angle B$。
