    stem_latex: 不等式组 $\begin{cases} x-3 < 0 \\ 2(x+2) \geq x \end{cases}$ 的解集是______
    answer: $-4 \leq x < 3$
    clue: 分别解两个不等式取交集。
    solution_steps:
    - ① $x<3$，② $x \geq -4$，$\therefore -4 \leq x < 3$。
