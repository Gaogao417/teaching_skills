  - type: problem
    id: Q023
    points: 12
    stem_latex: '在梯形 $ABCD$ 中，$AD \parallel BC$，$\angle BDC = 90^{\circ}$，点 $E$ 在 $BC$ 上，$\angle EDC = \angle ECD$，点 $F$ 在边 $AB$ 上，连接 $CF$ 分别交 $BD$、$ED$ 于点 $G$、$H$，且 $FH = CH$。

      (1) 求证：四边形 $ABED$ 为菱形；

      (2) 如果 $\angle BDE = \angle DFC$，求证：$4EH \cdot BE = BG \cdot BD$。'
    solution_steps:
    - (1) $\angle BDC=90^{\circ}$，$\angle EDC=\angle ECD$，$\therefore BE=DE=CE$，$E$ 为 $BC$ 中点。
    - $FH=CH$，$\therefore H$ 为 $CF$ 中点，$EH\parallel BF$。
    - $AD\parallel BC$，四边形 $ABED$ 为平行四边形，$BE=DE$，$\therefore$ 菱形。
    - (2) $\angle BDE=\angle DFC$，$\triangle FGD\sim\triangle BGC$，$\triangle FGB\sim\triangle DGC$。
    - $BF\cdot BC=BG\cdot BD$，$BC=2BE$，$FH=2EH$。
    - $\therefore 4EH\cdot BE=BG\cdot BD$。
    clue: 菱形判定+相似三角形乘积关系。
    answer: 证明见详解
