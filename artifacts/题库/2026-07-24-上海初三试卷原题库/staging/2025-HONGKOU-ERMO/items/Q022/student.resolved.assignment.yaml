    stem_latex: '工厂采购蓝莓加工蜜饯，年产量最多200吨。采购单价 $y$（万元/吨）与采购量 $x$（吨）成一次函数（100吨时1.8万/吨，200吨时1.6万/吨）。加工费1万元/吨，减重率50%。销售价统计：8万×15吨，10万×25吨，12万×5吨，14万×5吨。

      (1) 求 $y$ 与 $x$ 的函数解析式；

      (2) 求样本中蓝莓蜜饯的平均销售价；

      (3) 该工厂一年能否恰好获得780万元利润？如果能，求需要采购蓝莓的重量。'
