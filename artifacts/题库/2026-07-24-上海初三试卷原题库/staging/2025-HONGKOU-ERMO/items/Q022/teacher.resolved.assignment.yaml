  - type: problem
    id: Q022
    points: 10
    stem_latex: '工厂采购蓝莓加工蜜饯，年产量最多200吨。采购单价 $y$（万元/吨）与采购量 $x$（吨）成一次函数（100吨时1.8万/吨，200吨时1.6万/吨）。加工费1万元/吨，减重率50%。销售价统计：8万×15吨，10万×25吨，12万×5吨，14万×5吨。

      (1) 求 $y$ 与 $x$ 的函数解析式；

      (2) 求样本中蓝莓蜜饯的平均销售价；

      (3) 该工厂一年能否恰好获得780万元利润？如果能，求需要采购蓝莓的重量。'
    solution_steps:
    - (1) $y=-0.002x+2$。
    - (2) $\bar{p}=\dfrac{15\times8+25\times10+5\times12+5\times14}{50}=10$（万元/吨）。
    - (3) 利润 $=10\times\dfrac{x}{2}-(-0.002x+2)x-x=780$。
    - $0.002x^2+2x-780=0$，$x^2+1000x-390000=0$，$x=300$（舍负）。
    clue: 一次函数+加权平均+利润方程。
    answer: (1) $y=-0.002x+2$；(2) $10$ 万元/吨；(3) 能，采购 $300$ 吨
