  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 反比例函数的图像经过点 $A(2,m)$ 和点 $B(n,-1)$，如果点 $A$ 与 $B$ 关于原点对称，那么该反比例函数的解析式是______
    answer: $y = \dfrac{2}{x}$
    clue: 关于原点对称得 $A(2,1)$，$k=2$。
    solution_steps:
    - $n=-2$，$m=1$，$A(2,1)$，$k=2\times1=2$，$y=\dfrac{2}{x}$。
