  - type: problem
    id: Q021
    points: 10
    stem_latex: 在 $\triangle ABC$ 中，$AB = AC = 5\sqrt{5}$，$\tan C = 2$，点 $D$ 为边 $BC$ 中点，以 $D$ 为圆心，以 $DB$ 为半径作弧交边 $AB$ 于点 $E$，求 $BC$ 和 $BE$ 的长。
    solution_steps:
    - $AD\perp BC$，$\tan C=\dfrac{AD}{CD}=2$，设 $CD=x$，$AD=2x$。
    - $4x^2+x^2=125$，$x=5$，$BC=10$。
    - $DE=DB=5$，$DF\perp BE$，$BF=\sqrt{5}$，$BE=2\sqrt{5}$。
    clue: 等腰三角形三线合一+解直角三角形+垂径定理。
    answer: $BC=10$，$BE=2\sqrt{5}$
