    id: Q005
    points: 4
    stem_latex: 已知四边形 $ABCD$ 是平行四边形，对角线 $AC$、$BD$ 相交于点 $O$，下列条件中，不能判定四边形 $ABCD$ 是矩形的是（\quad）
    choices:
    - $AC=BD$
    - $OA=OB$
    - $\angle DAC=\angle BAC$
    - $\angle ABC=\angle BAD$
    answer: C
    clue: 对角线相等可判定矩形，邻角相等也可。$\angle DAC=\angle BAC$ 只说明对角线平分角。
