  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 将抛物线 $y = (x-4)^2$ 先向下平移 $3$ 个单位，再向左平移 $5$ 个单位，所得新抛物线的表达式是______
    answer: $y = (x+1)^2 - 3$
    clue: 下移3减3，左移5加5。
    solution_steps:
    - $y=(x-4+5)^2-3=(x+1)^2-3$。
