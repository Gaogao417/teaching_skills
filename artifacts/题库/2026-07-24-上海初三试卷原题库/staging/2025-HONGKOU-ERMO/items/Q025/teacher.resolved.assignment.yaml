  - type: problem
    id: Q025
    points: 14
    stem_latex: '阅读材料：直角三角形斜边中线等于斜边一半的逆命题。$AB$ 为半圆 $O$ 的直径，$CD$ 是半圆的弦，以 $CD$ 为直径作 $\odot M$。

      (1) 如图①，$CE \perp AB$ 于 $E$。

      ① 求证：$CE^2 = AE \cdot BE$；

      ② 已知 $BE=1$，$CE=3$，$\odot M$ 经过点 $O$（图②），求直线 $CD$ 与 $AB$ 夹角的正弦值；

      (2) $\odot M$ 与线段 $AB$ 交于 $P$、$Q$，$CD=6\sqrt{2}$，$AP:PQ:BQ=7:4:9$，求 $AB$ 的长。'
    solution_steps:
    - (1)① $\angle ACB=90^{\circ}$，$\triangle AEC\sim\triangle CEB$，$CE^2=AE\cdot BE$。
    - ② $AE=9$，$AB=10$，$OA=5$。$\triangle DHO\cong\triangle OEC$（AAS），$OH=3$，$DH=4$。
    - $CF=7$，$DF=1$，$CD=5\sqrt{2}$，$\sin\angle DCF=\dfrac{\sqrt{2}}{10}$。
    - (2) 设 $AP=7k$，$PQ=4k$，$BQ=9k$，$AB=20k$。分类讨论 $P$ 在 $Q$ 左/右侧。
    - 利用 $MH^2=OM^2-OH^2=MP^2-PH^2$ 求 $k$。
    clue: 圆的综合+相似三角形+全等+分类讨论+勾股定理。
    answer: (1)①证明见详解；②$\dfrac{\sqrt{2}}{10}$；(2) $AB=\dfrac{120\sqrt{103}}{103}$ 或 $\dfrac{24\sqrt{39}}{13}$
