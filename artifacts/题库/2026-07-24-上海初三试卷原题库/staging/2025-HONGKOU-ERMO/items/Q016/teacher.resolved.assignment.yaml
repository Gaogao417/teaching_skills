  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 在 $\mathrm{Rt}\triangle ABC$ 中，$\angle C = 90^{\circ}$，$AC = 4$，$AB = 5$，如果以点 $B$ 为圆心的 $\odot B$ 与以边 $AC$ 为直径的 $\odot O$ 外切，那么 $\odot B$ 的半径长是______
    answer: $\sqrt{13} - 2$
    clue: $BC=3$，$OB=\sqrt{13}$，$BP=OB-OC=\sqrt{13}-2$。
    solution_steps:
    - $BC=3$，$OC=2$，$OB=\sqrt{4+9}=\sqrt{13}$。
    - $BP=OB-OC=\sqrt{13}-2$。
