  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 已知点 $A(2,0)$、$B(6,0)$ 和 $C(4,2)$，平移 $\triangle ABC$ 得到 $\triangle A'B'C'$，如果点 $A'$、$B'$ 都在抛物线 $y = \dfrac{1}{2}x^2$ 上，那么点 $C$ 到点 $C'$ 的距离是______
    answer: $2\sqrt{5}$
    clue: 平移向量 $(-4,2)$，$CC'=\sqrt{16+4}=2\sqrt{5}$。
    solution_steps:
    - $A'、B'$ 纵坐标相同，$\frac{1}{2}(2+m)^2=\frac{1}{2}(6+m)^2$，$m=-4$。
    - $n=\frac{1}{2}(-2)^2=2$，$CC'=\sqrt{16+4}=2\sqrt{5}$。
