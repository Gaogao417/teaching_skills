    id: Q013
    points: 4
    stem_latex: 小品表演成员中六、七、八、九年级分别有 $4$、$6$、$5$、$3$ 名。随机选取 $1$ 位接受采访，选到九年级学生的概率是______
    answer: $\dfrac{1}{6}$
    clue: $3 \div (4+6+5+3) = \dfrac{3}{18} = \dfrac{1}{6}$。
    solution_steps:
    - $P=\dfrac{3}{18}=\dfrac{1}{6}$。
