  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 由六块相同的含 $30^{\circ}$ 的直角三角形拼成大正六边形，内部留小正六边形空隙。如果直角三角形最短边的长为 $2$，那么小正六边形的边心距是______
    answer: $\sqrt{3}$
    clue: 正六边形边长 $2$，边心距 $=\dfrac{1}{\tan30^{\circ}}=\sqrt{3}$。
    solution_steps:
    - 正六边形边长 $2$，$AG=1$，$\angle AOG=30^{\circ}$。
    - $OG=\dfrac{1}{\tan30^{\circ}}=\sqrt{3}$。
