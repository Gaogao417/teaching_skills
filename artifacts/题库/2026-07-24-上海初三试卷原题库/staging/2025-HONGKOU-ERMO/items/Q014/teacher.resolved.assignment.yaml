  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 在梯形 $ABCD$ 中，$AD \parallel BC$，$BC = 2AD$，点 $E$ 是边 $BC$ 的中点，连接 $AE$、$BD$ 交于点 $F$，设 $\vec{AD} = \vec{a}$，$\vec{DC} = \vec{b}$，那么用向量 $\vec{a}$、$\vec{b}$ 表示向量 $\vec{BF}$ 是______
    answer: $\vec{a} - \dfrac{1}{2}\vec{b}$
    clue: $\vec{BE}=\vec{a}$，$AECD$ 为平行四边形，$\vec{FE}=\frac{1}{2}\vec{b}$，$\vec{BF}=\vec{a}-\frac{1}{2}\vec{b}$。
    solution_steps:
    - $\vec{BE}=\vec{AD}=\vec{a}$，$\vec{AE}=\vec{DC}=\vec{b}$。
    - $\vec{FE}=\frac{1}{2}\vec{DC}=\frac{1}{2}\vec{b}$，$\vec{BF}=\vec{BE}-\vec{FE}=\vec{a}-\frac{1}{2}\vec{b}$。
