        抛物线 $y = mx^2 + 2nx - 3$ 交 $x$ 轴于 $A(-1, 0)$ 和 $B$，交 $y$ 轴于 $C$。
        (1) 求直线 $AC$ 的表达式，并用含 $n$ 的代数式表示抛物线的对称轴；
        (2) 直线 $x=-4$ 与抛物线交于 $D$，与直线 $AC$ 交于 $E$，$m<0$ 且 $DE=12$，求抛物线的表达式；
        (3) 抛物线对称轴 $x=1$，点 $P$ 在抛物线上第一象限，$AP$ 与 $y$ 轴交于 $E$，$F$ 在 $BC$ 上，$\angle PFE=90^{\circ}$，$S_{\triangle PEF}=4AE^2$，求 $P$ 的坐标。
      solution_steps:
      - (1) $C(0,-3)$，$AC: y=-3x-3$。$m=2n+3$，对称轴 $x=-\dfrac{n}{2n+3}$。
      - (2) $D(-4,24n+45)$，$E(-4,9)$，$|24n+36|=12$，$n=-2$，$y=-x^2-4x-3$。
      - (3) 对称轴 $x=1$ 得 $n=-1$，$y=x^2-2x-3$，$B(3,0)$。
      - $P(4,5)$，$F(4,1)$ 不在 $BC$ 上，$\therefore$ $P$ 不存在。
      clue: 二次函数综合+相似三角形+等腰直角三角形+存在性讨论。
      answer: (1) $y=-3x-3$，$x=-\dfrac{n}{2n+3}$；(2) $y=-x^2-4x-3$；(3) $P$ 不存在
