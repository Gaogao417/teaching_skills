      - $(3-2\sqrt{2})^{-1}=\dfrac{1}{3-2\sqrt{2}}=3+2\sqrt{2}$（分母有理化）
      - $\sqrt[3]{-8}=-2$
      - $\left(\dfrac{1}{4}\right)^{-\frac{3}{2}}=\left(\dfrac{1}{2}\right)^{-3}=8$
      - 原式 $=1+3+2\sqrt{2}+2+8=14+2\sqrt{2}$
      clue: 零指数幂、负指数幂+分母有理化、立方根。
      answer: $14+2\sqrt{2}$
