    block:
      stem_latex: 当 $a$ 是任意有理数时，下列代数式的值一定为正数的是（\quad）
      choices:
      - $a^2$
      - $a^2+a$
      - $a^2+a+\dfrac{1}{5}$
      - $a^2+a+1$
      answer: D
      explanation: 官方参考答案：D。
      solution_steps:
      - 'A、当 $a=0$ 时，$a^2=0$，$0$ 不是正数，故A选项不符合题意；'
