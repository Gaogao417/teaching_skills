    block:
      stem_latex: 函数 $f(x)=\dfrac{1-x}{x-2}$ 的定义域是（\quad）
      choices:
      - $x=1$
      - $x=2$
      - $x\neq 1$
      - $x\neq 2$
      answer: D
      explanation: 官方参考答案：D。
      solution_steps:
      - $\because$ 函数 $f(x)=\dfrac{1-x}{x-2}$ 中 $x-2$ 是分式，分式的分母不能为 $0$，
      - $\therefore x-2\neq 0$，解得 $x\neq 2$，
      - 因此函数的定义域为 $x\neq 2$。
