      - 'A、$2x\cdot 3x=6x^2$，选项计算正确，符合题意；'
      - 'B、$x+x=2x\neq x^2$，选项计算错误，不符合题意；'
      - 'C、$(-x)^3\div (-x)^2=-x^3\div x^2=-x\neq x$，选项计算错误，不符合题意；'
      - 'D、$\left(-\dfrac{1}{x}\right)^{-2}=\dfrac{1}{\left(-\dfrac{1}{x}\right)^2}=\dfrac{1}{\dfrac{1}{x^2}}=x^2\neq -x^2$，选项计算错误，不符合题意。'
