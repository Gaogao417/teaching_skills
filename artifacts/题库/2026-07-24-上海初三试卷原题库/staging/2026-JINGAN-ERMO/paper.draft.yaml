      answer: $a>1$ 且 $a\neq 7$
      explanation: 官方参考答案：$a>1$ 且 $a\neq 7$。
      solution_steps:
      - 方程两边同时乘以 $2(x-2)$ 得：$(x+2)+2(5-a)=a(x-2)$，
      - 去括号得：$x+2+10-2a=ax-2a$，移项并合并同类项得：$(1-a)x=-12$，
      - 解得 $x=\dfrac{12}{a-1}$，
      - $\because$ 关于 $x$ 的分式方程的解为正数，$\therefore \dfrac{12}{a-1}>0$，解得 $a>1$，
      - $\because$ 分式方程分母不能为零，即 $x-2\neq 0$，$\therefore x\neq 2$，$\therefore \dfrac{12}{a-1}\neq 2$，$\therefore a\neq 7$，
      - 综上所述，常数 $a$ 的取值范围 $a>1$ 且 $a\neq 7$。
