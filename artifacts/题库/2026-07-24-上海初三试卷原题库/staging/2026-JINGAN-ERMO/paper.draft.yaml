    block:
      stem_latex: 本市某街道办了一所老年食堂，该街道老人花 $1000$ 元可买到一张面值 $1080$ 元的就餐卡，其中 $80$ 元为政府出资补贴，凭卡就餐时，再按标价的九折在卡中扣款．张爷爷现持有一张面值 $1080$ 元的就餐卡，如果从四月 $1$ 日开始，在该月 $30$ 天中，他每天午餐、晚餐都到老年食堂就餐．假设他的每顿餐费标价相同，均为 $x$ 元，按九折付款后，到四月 $30$ 日结束时，卡内余额为 $y$ 元．
        | （$1$）求 $y$ 关于 $x$ 的函数解析式，并写出定义域． |
        | --- |
        | （$2$）如果张爷爷到月底结束时，卡内还有 $108$ 元结余，那么他该月每餐标价是多少元？ |
        | （$3$）如果张爷爷将卡内 $1080$ 元全部用完，此时算上政府补贴及餐费打折，他实际共获得多少元优惠？ |
      answer: （$1$）$y=1080-54x$，定义域为 $0<x\leqslant 20$；（$2$）$18$元；（$3$）$200$元
      explanation: 官方参考答案：（$1$）$y=1080-54x$，定义域为 $0<x\leqslant 20$；（$2$）$18$元；（$3$）$200$元。
      solution_steps:
      - '（$1$）张爷爷 $4$ 月份共就餐 $2\times 30=60$（顿），每顿实际扣款为 $0.9x$ 元，则总扣款为 $60\times 0.9x=54x$（元），'
      - '$\therefore y$ 关于 $x$ 的函数解析式为 $y=1080-54x$，$\because x>0$，且 $y=1080-54x\geqslant 0$，$\therefore 0<x\leqslant 20$；'
      - '（$2$）当 $y=108$ 时，$1080-54x=108$，解得 $x=18$，故他该月每餐标价是 $18$ 元；'
      - '（$3$）设消费的总餐费标价为 $A$ 元，由题意可得：$0.9A=1080$，$\therefore A=1200$，'
      - '故餐费九折优惠的金额为：$1200-1080=120$（元），$\because$ 政府补贴 $80$ 元，'
      - '故实际共获得优惠金额为 $120+80=200$（元）。'
