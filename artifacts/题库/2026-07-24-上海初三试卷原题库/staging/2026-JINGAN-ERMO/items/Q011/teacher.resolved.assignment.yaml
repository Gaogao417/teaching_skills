    id: Q011
    points: 4
    stem_latex: 方程 $\sqrt{x-1}\cdot\sqrt{x+1}=0$ 的解是\underline{\hspace{2cm}}．
    answer: $1$
    explanation: 官方参考答案：$1$。
    solution_steps:
    - 根据题意，得 $\begin{cases}x-1\geqslant 0\\x+1\geqslant 0\end{cases}$，解得 $x\geqslant 1$，
    - 将方程两边平方，得 $(x-1)(x+1)=0$，
    - 解得 $x_1=1$，$x_2=-1$，
    - 综上，$x=1$。
