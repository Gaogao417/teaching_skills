  blocks:
  - type: choice
    id: Q006
    points: 4
    stem_latex: 从四边形两条对角线的交点分别向四条边所在的直线作垂线，顺次连接四个垂足，如果我们把此时所得的四边形叫做原四边形的垂足四边形，那么下列说法正确的是（\quad）
    choices:
    - 等腰梯形的垂足四边形是等腰梯形
    - 矩形的垂足四边形是矩形
    - 平行四边形的垂足四边形是平行四边形
    - 菱形的垂足四边形是菱形
    answer: C
    explanation: 官方参考答案：C。
    solution_steps:
    - A、等腰梯形的对角线相等，但不一定互相垂直，当等腰梯形的对角线不互相垂直时，从对角线交点向四条边所在直线作垂线，顺次连接四个垂足得到的四边形不一定是等腰梯形，故A选项错误；
    - B、矩形的对角线相等且互相平分，但不一定互相垂直，当矩形的对角线不互相垂直时，从对角线交点向四条边所在直线作垂线，顺次连接四个垂足得到的四边形不一定是矩形，故B选项错误；
    - C、平行四边形的对角线互相平分，且是中心对称图形，对角线的交点是对称中心，从对角线交点向四条边所在直线作垂线，两组对边的垂足分别关于对称中心对称，故顺次连接四个垂足得到的四边形的对角线互相平分，则顺次连接四个垂足得到的四边形是平行四边形，故C选项正确；
    - D、菱形的对角线垂直且互相平分，但不一定相等，当菱形的对角线不相等时，从对角线交点向四条边所在直线作垂线，顺次连接四个垂足得到的四边形不一定是菱形，故D选项错误。
