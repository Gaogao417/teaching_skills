  - type: choice
    id: Q004
    points: 4
    stem_latex: 已知一组数据：$x_1$，$x_2$，$x_3$，它们的平均数是 $3$，方差是 $2$，那么数据 $2x_1$，$2x_2$，$2x_3$ 的平均数与方差分别是（\quad）
    choices:
    - $3$，$2$
    - $6$，$8$
    - $3$，$4$
    - $6$，$4$
    answer: B
    explanation: 官方参考答案：B。
    solution_steps:
    - $\because$ 一组数据 $x_1$，$x_2$，$x_3$ 的平均数是 $3$，方差是 $2$，
    - $\therefore\dfrac{x_1+x_2+x_3}{3}=3$，$s^2=\dfrac{(x_1-3)^2+(x_2-3)^2+(x_3-3)^2}{3}=2$，
    - 数据 $2x_1$，$2x_2$，$2x_3$ 的平均数为：$\dfrac{2x_1+2x_2+2x_3}{3}=\dfrac{2(x_1+x_2+x_3)}{3}=2\times 3=6$，
    - 数据 $2x_1$，$2x_2$，$2x_3$ 的方差为：$\dfrac{(2x_1-6)^2+(2x_2-6)^2+(2x_3-6)^2}{3}=\dfrac{4[(x_1-3)^2+(x_2-3)^2+(x_3-3)^2]}{3}=4\times 2=8$。
