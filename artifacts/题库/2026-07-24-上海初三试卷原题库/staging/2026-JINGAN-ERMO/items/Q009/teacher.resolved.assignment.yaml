  - type: fillin
    id: Q009
    points: 4
    stem_latex: 已知正比例函数 $y=kx$（$k\neq 0$）图像经过点 $\left(-1,2\right)$，那么当自变量 $x$ 的值增大时，$y$ 的值随之\underline{\hspace{2cm}}．（填"增大"或"减小"）
    answer: 减小
    explanation: 官方参考答案：减小。
    solution_steps:
    - 把 $(-1,2)$ 代入 $y=kx$，可得 $2=-k$，解得 $k=-2<0$，
    - 根据正比例函数的性质，当 $k<0$ 时，函数值 $y$ 随自变量 $x$ 的增大而减小。
