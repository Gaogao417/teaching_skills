  - type: fillin
    id: Q014
    points: 4
    stem_latex: 为提高学生身体素质，体育课开设了\u201c引体向上\u201d项目．现从某年级随机抽取了部分男生进行测试，绘制出不完整的统计图（如图所示），在本次调查获取的样本数据中，\u201c引体向上\u201d完成次数最少为 $6$ 次，最多为 $10$ 次，且次数在 $10$ 次的学生数占总人数的 $10\%$，那么本次调查样本的中位数为\underline{\hspace{2cm}}次．
    answer: $8$
    explanation: 官方参考答案：$8$。
    solution_steps:
    - 由条形统计图可知：本次调查抽取的总人数为 $4\div 10\%=40$（人），
    - $\therefore$ 完成\u201c引体向上\u201d的次数为 $7$ 的有 $40-6-10-8-4=12$（人），
    - 根据中位数的定义可知：本次调查样本中中位数为第 $20$ 和第 $21$ 个数据之和的平均数，由 $6+12=18$ 可知中位数落在 $8$ 次。
