  - type: fillin
    id: Q013
    points: 4
    stem_latex: 在 $\triangle ABC$ 中，点 $D$ 是边 $BC$ 的中点，$\overrightarrow{AB}=\vec{a}$，$\overrightarrow{AC}=\vec{b}$，那么 $\overrightarrow{AD}=$ \underline{\hspace{2cm}}．（用 $\vec{a}$、$\vec{b}$ 表示）
    answer: $\dfrac{1}{2}\left(\vec{a}+\vec{b}\right)$
    explanation: 官方参考答案：$\dfrac{1}{2}\left(\vec{a}+\vec{b}\right)$。
    solution_steps:
    - 延长 $AD$ 到 $E$，使得 $DE=AD$，连接 $BE$。
    - $\because AD=DE$，$\angle ADC=\angle BDE$，$CD=DB$，
    - $\therefore \triangle ADC\cong \triangle EDB$，
    - $\therefore AC=BE$，$\angle C=\angle EBD$，$\therefore BE\parallel AC$，
    - $\therefore \overrightarrow{BE}=\overrightarrow{AC}=\vec{b}$，
    - $\therefore \overrightarrow{AE}=\overrightarrow{AB}+\overrightarrow{BE}=\vec{a}+\vec{b}$，
    - $\therefore \overrightarrow{AD}=\dfrac{1}{2}\left(\vec{a}+\vec{b}\right)$。
