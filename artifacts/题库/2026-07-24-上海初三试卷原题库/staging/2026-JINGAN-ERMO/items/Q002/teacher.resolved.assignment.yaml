  title: 一、选择题（本大题共6题，每题4分，满分24分）
  type: practice
  visibility: both
  blocks:
  - type: choice
    id: Q002
    points: 4
    stem_latex: 下列计算正确的是（\quad）
    choices:
    - $2x\cdot 3x=6x^2$
    - $x+x=x^2$
    - $(-x)^3\div (-x)^2=x$
    - $\left(-\dfrac{1}{x}\right)^{-2}=-x^2$
    answer: A
    explanation: 官方参考答案：A。
    solution_steps:
    - A、$2x\cdot 3x=6x^2$，选项计算正确，符合题意；
    - B、$x+x=2x\neq x^2$，选项计算错误，不符合题意；
    - C、$(-x)^3\div (-x)^2=-x^3\div x^2=-x\neq x$，选项计算错误，不符合题意；
    - D、$\left(-\dfrac{1}{x}\right)^{-2}=\dfrac{1}{\left(-\dfrac{1}{x}\right)^2}=\dfrac{1}{\dfrac{1}{x^2}}=x^2\neq -x^2$，选项计算错误，不符合题意。
