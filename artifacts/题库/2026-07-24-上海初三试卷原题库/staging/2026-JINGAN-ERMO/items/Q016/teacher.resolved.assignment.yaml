  - type: fillin
    id: Q016
    points: 4
    stem_latex: 如果抛物线 $y=a(x+m)^{2}+k$（其中 $a$、$m$、$k$ 是常数，且 $a\neq 0$）经过点 $A(-1,0)$、$B(3,0)$，那么抛物线 $y=a(x+m-1)^{2}+k$ 与 $x$ 轴的交点坐标是\underline{\hspace{2cm}}．
    answer: $\left(0,0\right)$ 和 $\left(4,0\right)$
    explanation: 官方参考答案：$\left(0,0\right)$ 和 $\left(4,0\right)$。
    solution_steps:
    - 抛物线 $y=a(x+m-1)^{2}+k$ 是由抛物线 $y=a(x+m)^{2}+k$ 向右平移 $1$ 个单位得到的，
    - $\because$ 抛物线 $y=a(x+m)^{2}+k$ 经过点 $A(-1,0)$、$B(3,0)$，
    - $\therefore$ 抛物线 $y=a(x+m-1)^{2}+k$ 与 $x$ 轴的交点坐标为 $(-1+1,0)$ 和 $(3+1,0)$，即 $(0,0)$ 和 $(4,0)$。
