  - type: fillin
    id: Q012
    points: 4
    stem_latex: 我们知道，晾衣架中存在多组平行关系，现将其侧面抽象成几何图形（如图所示），已知 $AB\parallel MN\parallel PQ$，如果 $\angle 2=100°$，$\angle 3=130°$，那么 $\angle 1=$ \underline{\hspace{2cm}}$°$．
    answer: $50$
    explanation: 官方参考答案：$50$。
    solution_steps:
    - 延长 $AB$ 到点 $C$，
    - $\because AB\parallel MN$，$\therefore \angle 2+\angle CBD=180°$，
    - $\because \angle 2=100°$，$\therefore \angle CBD=180°-\angle 2=80°$，
    - $\therefore \angle CBE=\angle 3-\angle CBD=130°-80°=50°$，
    - $\because AB\parallel PQ$，$\therefore \angle 1=\angle CBE=50$。
