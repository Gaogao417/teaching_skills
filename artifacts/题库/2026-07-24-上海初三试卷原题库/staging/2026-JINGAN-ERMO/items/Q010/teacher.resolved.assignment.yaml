    stem_latex: 若关于 $x$ 的一元二次方程 $x^{2}+x-k=0$ 有两个相等的实数根，则 $k$ 的值为\underline{\hspace{2cm}}．
    answer: $-\dfrac{1}{4}$
    explanation: 官方参考答案：$-\dfrac{1}{4}$。
    solution_steps:
    - $\because$ 关于 $x$ 的一元二次方程 $x^{2}+x-k=0$ 有两个相等的实数根，
    - $\therefore \Delta=b^{2}-4ac=1+4k=0$，
    - 解得：$k=-\dfrac{1}{4}$。
