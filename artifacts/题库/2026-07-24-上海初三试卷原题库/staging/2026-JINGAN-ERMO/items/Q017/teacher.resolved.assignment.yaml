    id: Q017
    points: 4
    stem_latex: 如图，$\triangle ABC$ 中，点 $D$ 在边 $BC$ 上，$\angle DAC=\angle B$，$AC=BD=1$，$DC=x$，那么 $\dfrac{1}{x}-x$ 的值等于\underline{\hspace{2cm}}．
    answer: $1$
    explanation: 官方参考答案：$1$。
    solution_steps:
    - $\because \angle DAC=\angle B$，$\angle C=\angle C$，
    - $\therefore \triangle ACD\sim \triangle BCA$，
    - $\therefore \dfrac{AC}{BC}=\dfrac{DC}{AC}$，即 $\dfrac{1}{1+x}=\dfrac{x}{1}$，
    - $\therefore x(1+x)=1$，整理得 $x^{2}+x-1=0$，
    - 方程两边同除以 $x$，$x+1-\dfrac{1}{x}=0$，$\therefore \dfrac{1}{x}-x=1$。
