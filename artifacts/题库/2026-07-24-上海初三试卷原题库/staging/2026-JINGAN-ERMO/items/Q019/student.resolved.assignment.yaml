    stem_latex: 如图，点 $A$ 在反比例函数 $y=-\dfrac{3}{x}$ 的图像上，$AB\perp x$ 轴，垂足点 $B$ 在 $x$ 轴负半轴上，已知点 $B$，$C$ 关于原点对称．（$1$）当点 $A$ 的横坐标是 $-\dfrac{3}{2}$ 时，求 $\triangle ABC$ 的面积；（$2$）当 $\tan\angle ACB=\dfrac{1}{2}$，求直线 $AC$ 的表达式．
    explanation: 官方参考答案：（$1$）$3$；（$2$）$y=-\dfrac{1}{2}x+\dfrac{\sqrt{3}}{2}$。
