      stem_latex: 先化简，再求值：$\dfrac{a^2-2a+1}{a^2+3a}\div\left(1-\dfrac{4}{a+3}\right)$，其中
        $a=\sqrt{2}$。
      answer: $\dfrac{a-1}{a}$，$\dfrac{2-\sqrt{2}}{2}$
      explanation: 官方参考答案：$\dfrac{2-\sqrt{2}}{2}$。
      solution_steps:
      - $\dfrac{a^2-2a+1}{a^2+3a}\div\left(1-\dfrac{4}{a+3}\right)$
      - $=\dfrac{(a-1)^2}{a(a+3)}\div\dfrac{a+3-4}{a+3}$
      - $=\dfrac{(a-1)^2}{a(a+3)}\cdot\dfrac{a+3}{a-1}$
      - $=\dfrac{a-1}{a}$，
      - 当 $a=\sqrt{2}$ 时，原式 $=\dfrac{\sqrt{2}-1}{\sqrt{2}}=\dfrac{2-\sqrt{2}}{2}$。
