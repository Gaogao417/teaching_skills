      answer: （1）$\sqrt{3}-1$；（2）$\dfrac{\sqrt{6}-\sqrt{2}}{4}$
      explanation: 官方参考答案：（1）$\sqrt{3}-1$；（2）$\dfrac{\sqrt{6}-\sqrt{2}}{4}$。
      solution_steps:
      - （1）在 Rt$\triangle ACD$ 中，$\angle C=90°$，$\tan\angle CAD=\dfrac{CD}{AC}$，
      - $CD=AC\cdot\tan30°=\sqrt{3}\times\dfrac{\sqrt{3}}{3}=1$，
      - 在 Rt$\triangle ABC$ 中，$\angle C=90°$，$\angle B=45°$，可得 $BC=AC=\sqrt{3}$，
      - $BD=BC-CD=\sqrt{3}-1$。
      - （2）在 Rt$\triangle ACD$ 中，$AD=\dfrac{AC}{\cos30°}=\dfrac{\sqrt{3}}{\frac{\sqrt{3}}{2}}=2$，
