      - $DE=BD\cdot\sin45°=(\sqrt{3}-1)\times\dfrac{\sqrt{2}}{2}=\dfrac{\sqrt{6}-\sqrt{2}}{2}$，
      - 在 Rt$\triangle ADE$ 中，$\sin\angle BAD=\dfrac{DE}{AD}=\dfrac{\frac{\sqrt{6}-\sqrt{2}}{2}}{2}=\dfrac{\sqrt{6}-\sqrt{2}}{4}$。
