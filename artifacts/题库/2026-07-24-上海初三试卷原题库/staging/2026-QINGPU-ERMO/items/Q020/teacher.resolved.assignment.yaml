    stem_latex: 解不等式组 $\begin{cases}2(x-4)\geqslant 6 \quad ①\\8+x>5x-24 \quad ②\end{cases}$
    answer: $7\leqslant x<8$
    explanation: 官方参考答案：$7\leqslant x<8$。
    solution_steps:
