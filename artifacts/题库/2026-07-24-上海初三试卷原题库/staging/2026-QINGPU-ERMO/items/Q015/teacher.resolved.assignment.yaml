    stem_latex: 如果过 $n$ 边形的一个顶点可作 $5$ 条对角线，那么这个 $n$ 边形的内角和是 \_\_\_\_\_。
    answer: $1080°$
    explanation: 官方参考答案：$1080°$。
    solution_steps:
    - 过 $n$ 边形的一个顶点可作 $5$ 条对角线，$\therefore n-3=5$，解得 $n=8$，
    - $\therefore$ 这个 $n$ 边形的内角和是：$(8-2)\times180°=6\times180°=1080°$。
