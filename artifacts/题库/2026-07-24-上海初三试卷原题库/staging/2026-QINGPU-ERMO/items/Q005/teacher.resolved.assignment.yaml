  blocks:
  - type: choice
    id: Q005
    points: 4
    stem_latex: 如图，$AB\parallel CD$，如果 $\angle 1=63°$，$\angle 2=120°$，那么 $\angle 3$ 的度数为（\quad）
    choices:
    - $47°$
    - $57°$
    - $60°$
    - $63°$
    answer: B
    explanation: 官方参考答案：B。
    solution_steps:
    - $\because AB\parallel CD$，$\angle 1=63°$，
    - $\therefore \angle ACD=\angle 1=63°$。
    - 又 $\because \angle 2=120°$，
    - $\therefore \angle 3=\angle 2-\angle 1=120°-63°=57°$，故选B。
