  - type: fillin
    id: Q017
    points: 4
    stem_latex: 已知 $\triangle ABC$ 中，$\angle C=90°$，$AB=6$。将 $\triangle ABC$ 沿过点 $A$ 的直线翻折，使点 $C$ 落在斜边 $AB$ 上，折痕与边 $BC$ 的交点记为 $E$。如果 $\triangle CAE\sim\triangle CBA$，那么折痕 $AE$ 的长为 \_\_\_\_\_。
    answer: $2\sqrt{3}$
    explanation: 官方参考答案：$2\sqrt{3}$。
    solution_steps:
    - 由折叠性质和 $\triangle CAE\sim\triangle CBA$，可得 $\angle CAE=\angle CBA$，
    - 又 $\angle CAE=\angle BAE$，$\therefore \angle CAE+\angle BAE+\angle B=90°$，
    - $\therefore \angle B=\angle CAE=30°$，
    - 在 Rt$\triangle ABC$ 中，$\angle C=90°$，$AB=6$，$\therefore AC=3$，
    - $\cos30°=\dfrac{AC}{AE}$，$AE=\dfrac{AC}{\cos30°}=\dfrac{3}{\frac{\sqrt{3}}{2}}=2\sqrt{3}$。
