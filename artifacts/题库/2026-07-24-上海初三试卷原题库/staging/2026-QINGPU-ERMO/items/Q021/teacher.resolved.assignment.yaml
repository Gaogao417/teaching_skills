  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在 Rt$\triangle ABC$ 中，$\angle C=90°$，$\angle B=45°$，点 $D$ 在 $BC$ 边上，$\angle CAD=30°$，且 $AC=\sqrt{3}$。（1）求线段 $BD$ 的长；（2）求 $\sin\angle BAD$ 的值。
    answer: （1）$\sqrt{3}-1$；（2）$\dfrac{\sqrt{6}-\sqrt{2}}{4}$
    explanation: 官方参考答案：（1）$\sqrt{3}-1$；（2）$\dfrac{\sqrt{6}-\sqrt{2}}{4}$。
    solution_steps:
    - （1）在 Rt$\triangle ACD$ 中，$\angle C=90°$，$\tan\angle CAD=\dfrac{CD}{AC}$，
    - $CD=AC\cdot\tan30°=\sqrt{3}\times\dfrac{\sqrt{3}}{3}=1$，
    - 在 Rt$\triangle ABC$ 中，$\angle C=90°$，$\angle B=45°$，可得 $BC=AC=\sqrt{3}$，
    - $BD=BC-CD=\sqrt{3}-1$。
    - （2）在 Rt$\triangle ACD$ 中，$AD=\dfrac{AC}{\cos30°}=\dfrac{\sqrt{3}}{\frac{\sqrt{3}}{2}}=2$，
    - 过点 $D$ 作 $DE\perp AB$ 于点 $E$，在 Rt$\triangle BDE$ 中，$\angle B=45°$，
    - $DE=BD\cdot\sin45°=(\sqrt{3}-1)\times\dfrac{\sqrt{2}}{2}=\dfrac{\sqrt{6}-\sqrt{2}}{2}$，
    - 在 Rt$\triangle ADE$ 中，$\sin\angle BAD=\dfrac{DE}{AD}=\dfrac{\frac{\sqrt{6}-\sqrt{2}}{2}}{2}=\dfrac{\sqrt{6}-\sqrt{2}}{4}$。
