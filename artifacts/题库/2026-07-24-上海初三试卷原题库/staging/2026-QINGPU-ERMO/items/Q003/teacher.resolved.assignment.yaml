  - type: choice
    id: Q003
    points: 4
    stem_latex: 将分式方程 $x=\dfrac{2x}{x+1}$ 化为整式方程，下列答案正确的是（\quad）
    choices:
    - $2x^2-x-1=0$
    - $2x^2-x+1=0$
    - $x^2-2x+1=0$
    - $x^2-2x-1=0$
    answer: A
    explanation: 官方参考答案：A。
    solution_steps:
    - 把方程两边乘以 $x(x+1)$ 得 $x+1=2x^2$，
    - 方程化为一般式为 $2x^2-x-1=0$，故选A。
