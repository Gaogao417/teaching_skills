  blocks:
  - type: problem
    id: Q024
    points: 12
    stem_latex: '如图，在平面直角坐标系 $xOy$ 中，一次函数 $y=-\dfrac{4}{3}x+4$ 的图象分别与 $x$ 轴、$y$ 轴交于点 $A$、$B$，点 $C$ 是线段 $AB$ 上一点，$C$ 与 $B$ 不重合。以点 $C$ 为顶点的二次函数 $f(x)$ 的图象经过点 $B$。将该二次函数的图象平移后得到新抛物线 $g(x)$，点 $B$、$C$ 的对应点分别是 $B\prime$、$C\prime$，且点 $B\prime$ 的坐标为 $\left(\dfrac{3}{2},0\right)$，点 $C\prime$ 的纵坐标为 $-2$。（1）求点 $C$ 的坐标及二次函数 $f(x)$ 的解析式；（2）若点 $P$ 是新抛物线对称轴上一点，且以 $P$、$A$、$C$ 为顶点的三角形与 $\triangle ABC$ 相似，且相似比不等于 $1$，求点 $P$ 的坐标；（3）点 $D(4,y_1)$ 和 $E(x_2,y_2)$ 在新抛物线上，且对于任意实数 $x_2$，当 $m<x_2\leqslant m+1$ 时，$y_1>y_2$，求实数 $m$ 的取值范围。

      '
    answer: （1）$C\left(\dfrac{3}{2},2\right)$，$f(x)=\dfrac{8}{9}x^2-\dfrac{8}{3}x+4$；（2）点 $P$ 的坐标为 $\left(3,\dfrac{25}{8}\right)$；（3）$2\leqslant m<3$
    explanation: 官方参考答案：（1）$C\left(\dfrac{3}{2},2\right)$，$f(x)=\dfrac{8}{9}x^2-\dfrac{8}{3}x+4$；（2）$\left(3,\dfrac{25}{8}\right)$；（3）$2\leqslant m<3$。
    solution_steps:
    - （1）令 $x=0$，$y=-\dfrac{4}{3}\times0+4=4$，$\therefore B(0,4)$，$\therefore OB=4$，
    - 过点 $C$ 作 $CH\perp y$ 轴于点 $H$，$B'\left(\dfrac{3}{2},0\right)$，点 $C$ 的纵坐标为 $2$，
    - $\therefore y_B-y_C=2$，即 $BH=2$，$\because y_B=4$，$\therefore y_C=2$，
    - 将 $y_C=2$ 代入 $y=-\dfrac{4}{3}x+4$，得 $x_C=\dfrac{3}{2}$，$\therefore C\left(\dfrac{3}{2},2\right)$，
    - 设 $f(x)=a\left(x-\dfrac{3}{2}\right)^2+2$，将 $B(0,4)$ 代入得 $a=\dfrac{8}{9}$，
    - $\therefore f(x)=\dfrac{8}{9}\left(x-\dfrac{3}{2}\right)^2+2=\dfrac{8}{9}x^2-\dfrac{8}{3}x+4$；
    - （2）$f(x)$ 的对称轴为 $x=\dfrac{3}{2}$，向右平移 $\dfrac{3}{2}$ 个单位得 $g(x)$ 的对称轴 $x=3$，
    - 在 Rt$\triangle CBA$ 中，$AB'=OA-OB'=\dfrac{3}{2}$，$BC=2$，$AC=\sqrt{CB'^2+B'A^2}=\dfrac{5}{2}$，
    - $\cos\angle B'CA=\dfrac{B'C}{AC}=\dfrac{2}{\frac{5}{2}}=\dfrac{4}{5}$，
    - 当 $PC\perp AC$ 时，$\cos\angle CAP=\dfrac{AC}{AP}=\dfrac{4}{5}$，$AP=\dfrac{5}{4}AC=\dfrac{25}{8}$，
    - $\therefore$ 点 $P$ 的坐标为 $\left(3,\dfrac{25}{8}\right)$；
    - （3）$g(x)=\dfrac{8}{9}(x-3)^2-2=\dfrac{8}{9}x^2-\dfrac{16}{3}x+6$，
    - 将 $D(4,y_1)$ 代入得 $y_1=-\dfrac{10}{9}$，设 $y_F=y_D=-\dfrac{10}{9}$，则 $F\left(2,-\dfrac{10}{9}\right)$，
    - 由 $m<x_2\leqslant m+1$ 时 $y_1>y_2$ 恒成立，$\therefore 2\leqslant m<m+1<4$，
    - $\therefore 2\leqslant m<3$。
