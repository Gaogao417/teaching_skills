    stem_latex: 已知 $\triangle ABC$ 中，$AC=BC=5$，$AB=2\sqrt{5}$，点 $D$ 是射线 $CB$ 上一点，连接 $AD$，圆 $O$ 经过 $A$、$B$、$D$ 三点。（1）如图 $1$，当点 $D$ 在线段 $BC$ 上时，①记圆 $O$ 交 $AC$ 于点 $F$，求证：$AF=BD$；②设 $CD=m$，用 $m$ 表示圆 $O$ 的半径；（2）如图 $2$，在线段 $AD$ 的右侧，以 $AD$ 为底边作等腰 $\triangle EAD$，且始终满足 $\angle EAD=\angle BAC$。若以 $C$ 为圆心，$CE$ 为半径的圆 $C$ 与圆 $O$ 有公共点，请直接写出线段 $CD$ 的取值范围。
    explanation: 官方参考答案：（1）①$AF=BD$；②$\dfrac{\sqrt{5m^2-30m+125}}{4}$；（2）$0\leqslant m\leqslant 3$。
