    id: Q013
    points: 4
    stem_latex: 在不透明的布袋里有 $2$ 个红球和 $1$ 个白球，它们除颜色外其他都相同。从布袋里摸出一个球再放回袋中，摇匀后再摸出一个球，摸到一红一白两球的概率为 \_\_\_\_\_。
    answer: $\dfrac{4}{9}$
    explanation: 官方参考答案：$\dfrac{4}{9}$。
    solution_steps:
    - 画树状图，共有 $9$ 种等可能的结果，其中摸到的球是一红一白两球的结果有 $4$ 种，
    - $\therefore$ 摸到一红一白两球的概率为 $\dfrac{4}{9}$。
