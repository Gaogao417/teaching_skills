  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在四边形 $ABCD$ 中，$\angle BAD=90^\circ$，$AC\perp BC$，$DE\perp AC$，垂足为点 $E$，$AC=4$，$DE=3$。\\begin{enumerate}\\item 求 $AD:AB$ 的值；\\item 联结 $BD$ 交 $AC$ 于点 $F$，如果 $\\tan\\angle BAC=\\dfrac12$，求 $CF$ 的长。\\end{enumerate}
    answer: '1'
    solution_steps:
    - title: 官方解答
      content: （1）由直角关系得 $\angle ADE=\angle BAC$，且 $\triangle AED\sim\triangle BCA$，所以 $\dfrac{AD}{AB}=\dfrac{DE}{AC}=\dfrac34$。（2）在 $\mathrm{Rt}\triangle ABC$ 中，$BC=2$；由 $\triangle AED\sim\triangle BCA$ 得 $AE=\dfrac32$，故 $CE=\dfrac52$。又 $DE\parallel BC$，所以 $\dfrac{EF}{FC}=\dfrac{DE}{BC}=\dfrac32$，从而 $CF=1$。
