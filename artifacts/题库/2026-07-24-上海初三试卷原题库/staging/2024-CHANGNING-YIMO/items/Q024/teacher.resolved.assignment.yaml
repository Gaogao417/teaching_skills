  - type: problem
    id: Q024
    points: 12
    stem_latex: 已知抛物线 $y=\dfrac12x^2+bx+c$ 与 $x$ 轴交于 $A、B$ 两点（点 $A$ 在点 $B$ 的左侧），与 $y$ 轴交于点 $C$，直线 $y=-x-6$ 经过点 $A$ 与点 $C$。\\begin{enumerate}\\item 求抛物线的表达式；\\item 点 $P$ 在线段 $AC$ 下方的抛物线上，过点 $P$ 作 $BC$ 的平行线交线段 $AC$ 于点 $D$，交 $y$ 轴于点 $E$。①如果 $C、F$ 两点关于抛物线的对称轴对称，联结 $DF$，当 $DF\\perp CF$ 时，求 $\\angle PDF$ 的正切值；②如果 $PD:DE=3:5$，求点 $P$ 的坐标。\\end{enumerate}
    answer: $y=\dfrac12x^2+2x-6$；$\tan\angle PDF=\dfrac23$；$P(-8t,-64t^2+4t)$（$t=\dfrac38$ 或 $0$，舍去 $0$）
    solution_steps:
    - title: 官方解答
      content: （1）由直线得 $A(-6,0)$、$C(0,-6)$，代入抛物线，解得 $b=2,c=-6$，所以 $y=\dfrac12x^2+2x-6$。（2）①$B(2,0)$，$F(-4,-6)$。由平行、垂直关系得 $\angle PDF=\angle BCO$，故 $\tan\angle PDF=\dfrac{OB}{CO}=\dfrac23$。②作辅助线后由平行线分线段成比例得参数关系，代入抛物线，解得 $t=\dfrac38$（$t=0$ 舍去），所以 $P(-3,-\dfrac{15}{2})$。
