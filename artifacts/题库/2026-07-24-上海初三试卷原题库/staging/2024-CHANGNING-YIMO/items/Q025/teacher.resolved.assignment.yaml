  - type: problem
    id: Q025
    points: 14
    stem_latex: 已知 $\triangle ABC$ 中，$\angle ABC=22^\circ$，$BG$ 平分 $\angle ABC$，$AB=8$，$AG=\dfrac{16}{3}$，点 $D、E$ 分别是边 $BC、AC$ 上的点（点 $D$ 不与点 $B、C$ 重合），且 $\angle ADE=\angle ABC$，$AD、BG$ 相交于点 $F$。\\begin{enumerate}\\item 求 $BC$ 的长；\\item 如图 1，如果 $BF=2CE$，求 $BF:GF$ 的值；\\item 如果 $\triangle ADE$ 是以 $AD$ 为腰的等腰三角形，求 $BD$ 长。\\end{enumerate}
    answer: $BC=10$；$BF:GF=27:8$；$BD=1$ 或 $\dfrac{32}{5}$
    solution_steps:
    - title: 官方解答
      content: （1）由角平分线及相似关系得 $\triangle ABG\sim\triangle ACB$，所以 $\dfrac{AG}{AB}=\dfrac{BG}{AC}=\dfrac{CB}{BC}$，结合 $AB=8,AG=\dfrac{16}{3}$，解得 $BC=10$。（2）由角关系证明 $\triangle ABF\sim\triangle DCE$，结合 $BF=2CE$ 得 $BD=6$；再由 $GH\parallel CD$ 等比例关系，得 $BF:GF=27:8$。（3）分 $AD=AE$ 与 $AD=DE$ 两种情形讨论，分别由相似三角形和比例关系求得 $BD=1$ 或 $BD=\dfrac{32}{5}$。
