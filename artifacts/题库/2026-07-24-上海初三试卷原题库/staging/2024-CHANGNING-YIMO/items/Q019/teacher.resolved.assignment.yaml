  - type: problem
    id: Q019
    points: 12
    stem_latex: 已知抛物线 $y=2x^2+4x+1$。\\begin{enumerate}\\item 用配方法把它化为 $y=a(x+m)^2+k$ 的形式，并写出该抛物线的开口方向、对称轴和顶点坐标；\\item 如果将该抛物线上下平移，得到新的抛物线经过点 $(1,4)$，求平移后的抛物线的顶点坐标。\\end{enumerate}
    answer: $(-1,-4)$
    solution_steps:
    - title: 官方解答
      content: （1）$y=2(x+1)^2-1$，开口向上，对称轴是直线 $x=-1$，顶点坐标为 $(-1,-1)$。（2）设平移后的解析式为 $y=2(x+1)^2-1+m$，代入点 $(1,4)$，得 $m=-3$，所以顶点坐标为 $(-1,-4)$。
