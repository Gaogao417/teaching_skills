  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，在 $\triangle ABC$ 中，点 $D、E$ 分别是 $BC、AB$ 的中点，$AD=AC$，联结 $CE$ 并延长交 $AB$ 于点 $F$。\\begin{enumerate}\\item 证明：$\triangle ABC\sim\triangle DCE$；\\item 证明：$BF=4EF$。\\end{enumerate}
    answer: $BF=4EF$
    solution_steps:
    - title: 官方解答
      content: （1）由中点条件得 $\dfrac{BD}{DC}=1$、$\dfrac{AE}{EB}=1$，结合 $AD=AC$ 可得相应角相等，进而证明 $\triangle ABC\sim\triangle DCE$。（2）由 $AD=AC$ 及图中角关系可证 $\triangle AEF\sim\triangle CFA$，从而 $\dfrac{EF}{CF}=\dfrac14$；再结合前述相似关系，得 $BF=4EF$。
