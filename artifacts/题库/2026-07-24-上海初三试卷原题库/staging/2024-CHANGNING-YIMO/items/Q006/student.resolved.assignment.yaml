    stem_latex: 已知在 $\triangle ABC$ 与 $\triangle A'B'C'$ 中，点 $D、D'$ 分别在边 $BC、B'C'$ 上（点 $D$ 不与点 $B、C$ 重合，点 $D'$ 不与点 $B'、C'$ 重合）。如果 $\triangle ADC$ 与 $\triangle A'D'C'$ 相似，点 $A、D$ 分别对应点 $A'、D'$，那么添加下列条件可以证明 $\triangle ABC$ 与 $\triangle A'B'C'$ 相似的是：①$AD:A'D'=AB:A'B'$；②$AD、A'D'$ 分别是中线；③$AD、A'D'$ 分别是高。
