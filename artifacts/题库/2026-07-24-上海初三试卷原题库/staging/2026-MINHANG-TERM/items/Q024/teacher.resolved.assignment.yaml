  - type: problem
    id: Q024
    points: 12
    stem_latex: 如图，抛物线 $C_1:y=-\frac12x^2+bx+c$ 经过 $A(5,-6)$，对称轴为 $x=1$，顶点为 $D$。（1）求表达式及
      $D$；（2）点 $M$ 在 $C_1$ 上，过 $M$ 作 $x=m$，当 $M$ 在对称轴右侧时，抛物线在直线右侧部分的最高点纵坐标为 $2-m$，求
      $m$；（3）按题设构造点 $P,Q$，当顶点 $D$ 在 $\triangle PQM$ 内部时，写出 $m$ 的范围。
    answer: （1）$y=-\frac12x^2+x+\frac32,D(1,2)$；（2）$m=2+\sqrt3$；（3）$-3<m<1-\sqrt6$
      或 $m>1+\sqrt6$
    solution_steps:
    - title: 解答
      content: 依据官方评分标准，答案为：（1）$y=-\frac12x^2+x+\frac32,D(1,2)$；（2）$m=2+\sqrt3$；（3）$-3<m<1-\sqrt6$
        或 $m>1+\sqrt6$。
