    stem_latex: 表一给出送餐机器人对地面压强 $p$ 与接触面积 $S$ 的反比例关系，表二给出不同地面材料可承受的最大压强。（1）求 $p$ 关于
      $S$ 的函数表达式；（2）为确保在各种地面上均不造成破坏，求接触面积至少为多少平方米。
    answer: （1）$p=\frac{48}{S}$；（2）$2\times10^{-6}\,\mathrm m^2$
    solution_steps:
