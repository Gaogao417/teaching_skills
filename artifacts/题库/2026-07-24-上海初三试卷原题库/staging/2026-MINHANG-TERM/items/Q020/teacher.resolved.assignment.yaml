    stem_latex: 如图，在平行四边形 $ABCD$ 中，$E$ 是 $DC$ 中点，$AE$ 与对角线 $BD$ 交于 $G$，$\overrightarrow{AB}=\vec
      a,\overrightarrow{AD}=\vec b$。（1）用 $\vec a,\vec b$ 表示 $\overrightarrow{DB},\overrightarrow{AG}$；（2）作出
