    stem_latex: 下列关于向量的说法中，一定正确的是
    choices:
    - 若 $\vec b=-2\vec a$，则 $\vec a\parallel\vec b$
    - 若 $\vec e$ 是单位向量，则 $\vec e=1$
    - 向量 $\overrightarrow{AB}$ 与 $\overrightarrow{BA}$ 是相同向量
    - 若 $\vec a=\vec0$，则对任意实数 $k$ 有 $k\vec a=0$
