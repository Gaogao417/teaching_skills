    stem_latex: 如图，在 $\triangle ABC$ 中，点 $D$ 在 $AC$ 上。（1）当 $\angle ABC=90^\circ$：①若
      $BD\perp AC$，证明 $BD^2=AD\cdot CD$；②按图2条件求 $\cot C$。（2）按图3条件作点 $G,E,O$，求题设两三角形面积之比。
    answer: （1）①结论成立；②$\cot C=\frac34$；（2）$2-\sqrt2$
