    stem_latex: 方程 $\sqrt{2x+3} = x$ 的解为______
    answer: $x=3$
    clue: 平方后解一元二次方程，检验增根。
    solution_steps:
    - $2x+3=x^2$，$x^2-2x-3=0$，$x=3$（$x=-1$ 舍）。
