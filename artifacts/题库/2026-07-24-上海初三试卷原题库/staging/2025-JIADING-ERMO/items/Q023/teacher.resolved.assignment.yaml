  - type: problem
    id: Q023
    points: 12
    stem_latex: '平行四边形 $ABCD$，$AD=2AB$，$M$ 是 $AD$ 中点，$CE \perp AB$ 于 $E$，$EM$ 延长交 $CD$ 延长线于 $F$。

      (1) 求证：$\angle EMC=2\angle DMC$；

      (2) 求证：$CM^2=AB\cdot CF$。'
    solution_steps:
    - (1) $EM=MF$（中位线），$CE\perp DF$，$CM=EM=MF$（Rt△斜边中线）。
    - $\angle EMC=\angle F+\angle MCF=2\angle F$，$\angle DMC=2\angle F$。
    - (2) $\triangle CDM\sim\triangle CMF$，$\frac{CD}{CM}=\frac{CM}{CF}$，$CM^2=CD\cdot CF=AB\cdot CF$。
    clue: 直角三角形斜边中线+相似三角形。
    answer: 证明见详解
