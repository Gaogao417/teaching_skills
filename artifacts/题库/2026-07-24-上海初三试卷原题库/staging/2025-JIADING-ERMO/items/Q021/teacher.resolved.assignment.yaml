  - type: problem
    id: Q021
    points: 10
    stem_latex: '$AD$ 是半圆 $O$ 的直径，半径 $OB \perp$ 弦 $AC$ 于 $E$，$\overset{\frown}{CD}=2\overset{\frown}{AB}$。

      (1) 求 $\angle AOB$ 的度数；

      (2) 求 $\tan\angle BAC$ 的值。'
    solution_steps:
    - (1) $OB\perp AC$，$\overset{\frown}{AB}=\overset{\frown}{BC}$。$\overset{\frown}{CD}=2\overset{\frown}{AB}=\overset{\frown}{AC}$。
    - $\angle AOC=90^{\circ}$，$\angle AOB=45^{\circ}$。
    - (2) $EO=AE=x$，$OB=\sqrt{2}x$，$BE=(\sqrt{2}-1)x$。
    - $\tan\angle BAE=\frac{BE}{AE}=\sqrt{2}-1$。
    clue: 垂径定理+弧与圆心角+解直角三角形。
    answer: (1) $45^{\circ}$；(2) $\sqrt{2}-1$
