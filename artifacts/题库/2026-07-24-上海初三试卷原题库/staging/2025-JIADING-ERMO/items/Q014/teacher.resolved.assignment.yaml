    stem_latex: 从"虎""兔""龙""蛇"4张邮票中随机抽取2张，恰好是"虎"和"龙"的概率是______
    answer: $\dfrac{1}{6}$
    clue: $C_4^2=6$ 种组合，"虎""龙"占1种。
    solution_steps:
    - $P=\dfrac{1}{C_4^2}=\dfrac{1}{6}$。
