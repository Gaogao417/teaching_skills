  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 点 $E$ 是 $\triangle ABC$ 的重心，$\overrightarrow{AB}=\vec{a}$，$\overrightarrow{AC}=\vec{b}$，那么 $\overrightarrow{BE}=$______（用 $\vec{a}$、$\vec{b}$ 表示）
    answer: $\dfrac{1}{3}\vec{b}-\dfrac{2}{3}\vec{a}$
    clue: $\overrightarrow{BE}=\frac{2}{3}\overrightarrow{BD}=\frac{2}{3}(-\vec{a}+\frac{1}{2}\vec{b})$。
    solution_steps:
    - $\overrightarrow{BD}=-\vec{a}+\frac{1}{2}\vec{b}$，$\overrightarrow{BE}=\frac{2}{3}\overrightarrow{BD}=\frac{1}{3}\vec{b}-\frac{2}{3}\vec{a}$。
