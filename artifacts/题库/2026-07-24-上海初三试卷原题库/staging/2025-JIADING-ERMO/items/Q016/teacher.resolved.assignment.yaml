  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 二次函数 $y=-x^2+2x+3$ 向右平移 $m$（$m>0$）个单位后经过原点，$m=$______
    answer: '1'
    clue: $y=-(x-1)^2+4$，右移 $m$ 后 $-(-1-m)^2+4=0$，$m=1$。
    solution_steps:
    - $-(-1-m)^2+4=0$，$(1+m)^2=4$，$m=1$。
