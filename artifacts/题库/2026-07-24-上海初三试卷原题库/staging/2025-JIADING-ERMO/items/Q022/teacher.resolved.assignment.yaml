  - type: problem
    id: Q022
    points: 10
    stem_latex: '正五边形 $ABCDE$，仅用无刻度直尺作图。

      (1) 求 $\angle ABE$ 的度数；

      (2) 作以 $BE$ 为对角线的菱形 $ABME$ 并证明；

      (3) 在此基础上再设计一个新的正五边形。'
    solution_steps:
    - (1) $\angle A=108^{\circ}$，$\angle ABE=\frac{180-108}{2}=36^{\circ}$。
    - (2) 连 $BD$、$CE$ 交于 $M$，$AE\parallel BD$，$AB\parallel CE$，$AE=AB$，菱形。
    - (3) 各边延长线两两相交围成新正五边形。
    clue: 正五边形内角108°+全等+平行四边形判定。
    answer: (1) $36^{\circ}$；(2)(3) 见详解
