      solution_steps:
      - $(\sqrt{2}+1)^{-1}=\sqrt{2}-1$
      - $4\cos45^{\circ}=2\sqrt{2}$
      - $|\sqrt{3}-2|=2-\sqrt{3}$
      - $(3.14-\pi)^0=1$
      - 原式 $=\sqrt{2}-1+2\sqrt{2}+2-\sqrt{3}-1=3\sqrt{2}-\sqrt{3}$
      clue: 负指数幂+特殊角三角函数+绝对值+零指数幂。
      answer: $3\sqrt{2}-\sqrt{3}$
