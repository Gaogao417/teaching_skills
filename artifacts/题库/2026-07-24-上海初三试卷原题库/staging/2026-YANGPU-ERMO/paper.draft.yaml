        (iii) A班、B班测试成绩的平均数、众数、中位数如下：
        | | 平均数 | 众数 | 中位数 |
        |---|---|---|---|
        | A班 | 79.6 | 77 | p |
        | B班 | 79.4 | m | q |
        根据以上信息，回答下列问题：
        (1) $m$的值为\underline{\qquad}，$p$\underline{\qquad}$q$（填\u201c>\u201d\u201c=\u201d或\u201c<\u201d）；
        (2) 如果两个班级都各去掉一个最高分和一个最低分，那么下列判断正确的是\underline{\qquad}；
        A．两个班测试成绩的方差都增大；B．两个班测试成绩的方差都减小；
        C．A班测试成绩的方差增大，B班测试成绩的方差减小；
        D．A班测试成绩的方差减小，B班测试成绩的方差增大．
        (3) 为了选出冲击个人冠军的种子选手，学校对这次成绩90分以上的甲、乙、丙三位同学又单独进行了5次测试，平均数较大的选手排序靠前，如果平均数相同，那么方差较小的选手排序靠前．这5次测试的成绩如下：
        | | 测试1 | 测试2 | 测试3 | 测试4 | 测试5 | 方差 |
        |---|---|---|---|---|---|---|
        | 甲 | 93 | 90 | 92 | 93 | 92 | 1.2 |
        | 乙 | 91 | 92 | 92 | 92 | 92 | 0.16 |
        | 丙 | 94 | 90 | 90 | 94 | k | $S_丙^2$ |
        如果丙的排序居中，那么表中$k$（$k$为整数）的值为\underline{\qquad}，$S_丙^2=$ \underline{\qquad}．
      answer: '(1) $82$，$<$；(2) B；(3) $92$，$3.2$'
      explanation: 官方参考答案：(1) $82$，$<$；(2) B；(3) $92$，$3.2$。
      solution_steps:
      - '【小问1详解】'
      - '由B班的数据可得，众数$m=82$，中位数$q=\dfrac{81+82}{2}=81.5$；'
      - '由A班的频数分布直方图可得，第10，11个数据在$70\leqslant x<80$这一组，因此中位数$p<80$，故$p<q$；'
      - '【小问2详解】'
      - '如果两个班级都各去掉一个最高分和一个最低分，相当于将波动最大的两个数据去掉了，由方差的意义可得，两个班测试成绩的方差都减小；'
      - '【小问3详解】'
      - '由题意得，$\overline{x}_甲=(93+90+92+93+92)\div 5=92$，$\overline{x}_乙=(91+92+92+92+92)\div 5=91.8$；'
      - '$\overline{x}_丙=(94+90+90+94+k)\div 5=\dfrac{368+k}{5}$；'
      - '由平均数较大的选手排序靠前，如果平均数相同，那么方差较小的选手排序靠前，解得$91\leqslant k\leqslant 92$；'
      - '当$k=92$时，$\overline{x}_丙=92$，则$S_丙^2=\dfrac{(94-92)^2\times 2+(90-92)^2\times 2+(92-92)^2}{5}=3.2>S_乙^2$，成立；'
      - '$\therefore$表中$k$的值为$92$，$S_丙^2=3.2$。'
