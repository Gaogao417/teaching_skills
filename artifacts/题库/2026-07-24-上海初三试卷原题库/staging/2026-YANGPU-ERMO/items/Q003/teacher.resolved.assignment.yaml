  blocks:
  - type: choice
    id: Q003
    points: 4
    stem_latex: 下列方程中，有两个不相等的实数根的是（\quad）
    choices:
    - $x^2+1=0$
    - $x^2-2x+1=0$
    - $x^2+x+1=0$
    - $x^2+x-1=0$
    answer: D
    explanation: 官方参考答案：D。
    solution_steps:
    - 'A: $a=1,b=0,c=1$，$\Delta=0^2-4\times1\times1=-4<0$，无实数根，不符合题意；'
    - 'B: $a=1,b=-2,c=1$，$\Delta=(-2)^2-4\times1\times1=4-4=0$，有两个相等的实数根，不符合题意；'
    - 'C: $a=1,b=1,c=1$，$\Delta=1^2-4\times1\times1=1-4=-3<0$，无实数根，不符合题意；'
    - 'D: $a=1,b=1,c=-1$，$\Delta=1^2-4\times1\times(-1)=1+4=5>0$，有两个不相等的实数根，符合题意。'
    source_solution_images: []
