  blocks:
  - type: choice
    id: Q006
    points: 4
    stem_latex: 如图，在$\triangle ABC$中，$\angle ABC$的平分线与$\angle ACD$的平分线交于点$E$，连接$AE$，如果要求出$\angle CAE$的度数，只需知道下列哪个角的度数（\quad）
    choices:
    - $\angle ABC$
    - $\angle ACB$
    - $\angle BAC$
    - $\angle AEC$
    answer: C
    explanation: 官方参考答案：C。
    solution_steps:
    - 过点$E$作$EF\perp AB$交$BA$的延长线于点$F$，$EG\perp AC$交$AC$于点$G$，$EH\perp BC$交$BC$的延长线于点$H$；
    - $\because BE$平分$\angle ABC$，$EF\perp AB$，$EH\perp BC$，$\therefore EF=EH$；
    - $\because CE$平分$\angle ACD$，$EG\perp AC$，$EH\perp BC$，$\therefore EG=EH$；
    - $\therefore EF=EG$，又$\because EF\perp AB$，$EG\perp AC$，$\therefore AE$平分$\angle FAG$；
    - $\therefore \angle CAE=\dfrac{1}{2}\angle FAG=\dfrac{1}{2}(180^{\circ}-\angle BAC)$，只要知道$\angle BAC$的度数即可。
