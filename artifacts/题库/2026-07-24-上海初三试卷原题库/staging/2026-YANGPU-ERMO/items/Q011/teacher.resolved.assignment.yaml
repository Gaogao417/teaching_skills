    id: Q011
    points: 4
    stem_latex: 已知一斜坡的坡比为$1:2$，坡角为$\alpha$，那么$\sin\alpha=$ \underline{\qquad}．
    answer: $\dfrac{\sqrt{5}}{5}$
    explanation: 官方参考答案：$\dfrac{\sqrt{5}}{5}$。
    solution_steps:
    - 由题意，得$\tan\alpha=i=\dfrac{1}{2}$；
    - 设竖直直角边为$x$，水平直角边为$2x$，则斜边$=\sqrt{x^2+(2x)^2}=\sqrt{5}x$；
    - 则$\sin\alpha=\dfrac{x}{\sqrt{5}x}=\dfrac{\sqrt{5}}{5}$。
