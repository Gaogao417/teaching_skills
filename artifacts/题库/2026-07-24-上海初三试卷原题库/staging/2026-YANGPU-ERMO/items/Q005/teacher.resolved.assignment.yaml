  title: 一、选择题（本大题共6题，每题4分，满分24分）
  type: practice
  visibility: both
  blocks:
  - type: choice
    id: Q005
    points: 4
    stem_latex: 在平面直角坐标系$xOy$中，已知点$M(8,6)$，以$M$为圆心，$r$为半径的圆与$x$轴相交，与$y$轴相离，那么$r$可以取的值是（\quad）
    choices:
    - $6$
    - $7$
    - $8$
    - $10$
    answer: B
    explanation: 官方参考答案：B。
    solution_steps:
    - 点$M$的坐标为$(8,6)$，圆心$M$到$x$轴的距离$d_1=6$，到$y$轴的距离$d_2=8$；
    - 圆与$x$轴相交，与$y$轴相离，则$r>d_1$且$r<d_2$，即$6<r<8$；
    - 观察选项，只有$7$满足该范围，因此选B。
    source_solution_images: []
