  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程：$\dfrac{3}{x-1}-\dfrac{2}{x+1}=\dfrac{1}{x^2-1}$．
    answer: $x=-4$
    explanation: 官方参考答案：$x=-4$。
    solution_steps:
    - 去分母，得$3(x+1)-2(x-1)=1$；
    - 去括号，得$3x+3-2x+2=1$；
    - 解得$x=-4$；
    - 检验，当$x=-4$时，$x^2-1=15\neq 0$，$\therefore$方程的解为$x=-4$。
