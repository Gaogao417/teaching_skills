  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 在$\triangle ABC$中，点$D$在边$AB$上，$BD=2AD$，设$\overrightarrow{BA}=\vec{a}$，$\overrightarrow{BC}=\vec{b}$，那么$\overrightarrow{CD}$可用$\vec{a}$、$\vec{b}$表示为\underline{\qquad}．
    answer: $\dfrac{2}{3}\vec{a}-\vec{b}$
    explanation: 官方参考答案：$\dfrac{2}{3}\vec{a}-\vec{b}$。
    solution_steps:
    - 点$D$在边$AB$上，$BD=2AD$，$\therefore BD=\dfrac{2}{3}BA$；
    - $\because \overrightarrow{BA}=\vec{a}$，$\therefore \overrightarrow{BD}=\dfrac{2}{3}\vec{a}$；
    - $\because \overrightarrow{BC}=\vec{b}$，$\therefore \overrightarrow{CD}=\overrightarrow{BD}-\overrightarrow{BC}=\dfrac{2}{3}\vec{a}-\vec{b}$。
