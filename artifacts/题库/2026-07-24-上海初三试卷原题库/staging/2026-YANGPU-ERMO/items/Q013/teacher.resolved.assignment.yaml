  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 九年级（1）班羽毛球小组共有4名队员，其中两名男生，两名女生．从中随机选取两人，恰好能组成一组混双搭档的概率是\underline{\qquad}．
    answer: $\dfrac{2}{3}$
    explanation: 官方参考答案：$\dfrac{2}{3}$。
    solution_steps:
    - 记两名男生分别为男1，男2，两名女生分别为女1，女2，列表如下；
    - 可得共有12种等可能的结果，其中恰好能组成混双搭档（一男一女）的结果有8种；
    - 根据概率公式可得，恰好能组成一组混双搭档的概率为$\dfrac{8}{12}=\dfrac{2}{3}$。
    source_solution_images: []
