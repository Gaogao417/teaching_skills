    stem_latex: 综合与实践 【问题背景】折纸是一门将数学、艺术与工程完美结合的学科．通过折纸不仅能够创造出非常奇妙的图形，还可以发现一些有趣的数学问题，下面我们就利用一张正方形纸片来开展\u201c折纸与数学\u201d探究活动． 【操作探究】 (1) 小创小组将正方形纸片（如图1）按照图2至图3的方式操作，那么图3中$\angle ABG=$ \underline{\qquad}$^{\circ}$，并写出求解过程； (2) 小智小组将正方形纸片（如图4）按照图5至图7的方式操作，折痕$BE$、$BG$与折痕$AC$的交点分别是$H$、$Q$，经过多次操作和测量，发现线段$HQ$与$EG$的比值是一个定值，请你帮助小智小组求出$\dfrac{HQ}{GE}$的值； 【尝试应用】 (3) 如图7，设正方形$ABCD$的边长为$1$，$AE=m$，求$\dfrac{HQ}{QC}$的值（用含$m$的代数式表示）．
    explanation: 官方参考答案：(1) $30^{\circ}$；(2) $\dfrac{\sqrt{2}}{2}$；(3) $\dfrac{1+m^2}{1-m^2}$。
