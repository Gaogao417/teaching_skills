  - type: short_answer
    id: Q009
    points: 4
    stem_latex: 方程$\sqrt{3x+1}=2$的解是\underline{\qquad}．
    answer: $x=1$
    explanation: 官方参考答案：$x=1$。
    solution_steps:
    - 方程两边同时平方，得$3x+1=2^2$；
    - 整理得$3x+1=4$，移项得$3x=3$；
    - 系数化为1得$x=1$；
    - 检验：将$x=1$代入原方程，左边$=\sqrt{3\times1+1}=2=$右边，因此$x=1$是原方程的解。
