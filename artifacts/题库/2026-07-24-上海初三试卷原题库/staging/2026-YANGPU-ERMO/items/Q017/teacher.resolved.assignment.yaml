  blocks:
  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 已知正方形$ABCD$，$AB=1$，分别以点$A$、$C$为圆心画圆，如果点$B$在圆$A$外，且圆$A$与圆$C$外切，那么圆$C$的半径长$r$的取值范围是\underline{\qquad}．
    answer: $\sqrt{2}-1<r<\sqrt{2}$
    explanation: 官方参考答案：$\sqrt{2}-1<r<\sqrt{2}$。
    solution_steps:
    - 正方形$ABCD$中，$AB=1$，$\therefore AC=\sqrt{2}$；
    - 设圆$A$的半径为$R$，点$B$在圆$A$外，$\therefore 0<R<1$；
    - $\because$以$A$、$C$为圆心的两圆外切，$\therefore$两圆的半径的和为$\sqrt{2}$；
    - $\therefore R+r=\sqrt{2}$，$r=\sqrt{2}-R$，$\therefore \sqrt{2}-1<r<\sqrt{2}$。
