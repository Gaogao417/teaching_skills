    stem_latex: 解不等式组：$\begin{cases}x-1<0\\2x+3\geqslant\dfrac{1}{2}x\end{cases}$的解集是\underline{\qquad}．
    answer: $-2\leqslant x<1$
    explanation: 官方参考答案：$-2\leqslant x<1$。
    solution_steps:
    - 解不等式①得：$x<1$；
    - 解不等式②得：$x\geqslant -2$；
    - 所以不等式组的解集为$-2\leqslant x<1$。
