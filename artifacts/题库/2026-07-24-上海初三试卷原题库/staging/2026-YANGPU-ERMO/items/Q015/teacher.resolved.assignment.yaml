  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如果抛物线$y=x^2-x-6$上的点$A(-3,n)$和点$B$关于它的对称轴对称，那么点$B$的坐标是\underline{\qquad}．
    answer: $(4,6)$
    explanation: 官方参考答案：$(4,6)$。
    solution_steps:
    - 抛物线$y=x^2-x-6$中，$a=1$，$b=-1$，对称轴为$x=-\dfrac{-1}{2\times1}=\dfrac{1}{2}$；
    - 将$x=-3$代入抛物线解析式，得$n=(-3)^2-(-3)-6=6$，$\therefore$点$A$的坐标为$(-3,6)$；
    - 点$A$和点$B$关于抛物线对称轴对称，设点$B$的横坐标为$x$，可得$\dfrac{-3+x}{2}=\dfrac{1}{2}$，解得$x=4$；
    - $\therefore$点$B$的坐标为$(4,6)$。
