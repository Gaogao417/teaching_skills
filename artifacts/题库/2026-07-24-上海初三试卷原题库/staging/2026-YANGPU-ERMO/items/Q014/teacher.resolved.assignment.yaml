  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 将直线$y=3x-1$向上平移$m$个单位长度，如果平移后的直线经过第二象限，那么$m$的值可以是\underline{\qquad}．（写出一个即可）
    answer: $2$（答案不唯一）
    explanation: 官方参考答案：$2$（答案不唯一）。
    solution_steps:
    - 平移后的解析式为$y=3x-1+m$；
    - 平移后的直线经过第二象限，则$m-1>0$，即$m>1$；
    - $\therefore m$的值可以是$2$（答案不唯一）。
