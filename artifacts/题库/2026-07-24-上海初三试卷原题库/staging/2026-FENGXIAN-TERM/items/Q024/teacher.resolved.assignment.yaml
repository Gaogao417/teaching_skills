    stem_latex: 抛物线 $y=ax^2+bx+3(a\ne0)$ 与 $x$ 轴交于 $A(-1,0),B$，与 $y$ 轴交于 $C$，顶点 $D(1,m)$。（1）求
      $B,m$；（2）沿 $BC$ 方向平移，顶点为 $E$，分别研究梯形条件与角条件。
    answer: （1）$B(3,0),m=4$；（2）梯形时 $E(-7,12)$；角条件时 $E(-1,6)$。
    solution_steps:
