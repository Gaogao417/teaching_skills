    id: Q021
    points: 10
    stem_latex: 如图，在平行四边形 $ABCD$ 中，$E,F$ 三等分 $AD$，$BF$ 交 $AC$ 于 $G$，$BE$ 与 $CF$ 延长线交于
      $Q$。（1）求 $BG:EG:QE$；（2）若 $\overrightarrow{BA}=\vec a,\overrightarrow{BC}=\vec
      b$，表示 $\overrightarrow{CG},\overrightarrow{CQ}$。
    answer: （1）$3:1:2$；（2）$\overrightarrow{CG}=\frac23\vec a-\frac23\vec b$，$\overrightarrow{CQ}=\frac32\vec
      a-\frac12\vec b$。
    solution_steps:
    - title: 解答
      content: $\because$ 依据题设计算或证明，$\therefore$ （1）$3:1:2$；（2）$\overrightarrow{CG}=\frac23\vec
        a-\frac23\vec b$，$\overrightarrow{CQ}=\frac32\vec a-\frac12\vec b$。
