      - (2) $\angle B=\angle C=\angle DPE$，$\triangle BDP\sim\triangle CEP$。
      - $\dfrac{BD}{CP}=\dfrac{DP}{PE}=\dfrac{AB}{BC}$，$\dfrac{CP}{BC}=\dfrac{1}{3}$，$\dfrac{BD}{AB}=\dfrac{1}{3}$，$\dfrac{AD}{AB}=\dfrac{2}{3}$。
      - (3) 过 $P$ 作 $PH\perp AB$ 于 $H$，$PI\perp AC$ 于 $I$，$\triangle DHP\sim\triangle EIP$。
      - $\dfrac{HP}{AC}=\dfrac{BP}{BC}=\dfrac{2}{5}$，$\dfrac{IP}{AB}=\dfrac{CP}{BC}=\dfrac{3}{5}$。
      - $\dfrac{AB}{AC}=\dfrac{HP}{PI}=\dfrac{\sqrt{6}}{3}$，$BC=5$，$AB=\sqrt{10}$。
