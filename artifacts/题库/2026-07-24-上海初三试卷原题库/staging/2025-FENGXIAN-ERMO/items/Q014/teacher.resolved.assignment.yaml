  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 如图，《天工开物》中"碓"的平面示意图。$AB \perp CD$ 于 $B$，$AB$ 与水平线 $l$ 交于 $O$，$OE \perp l$。如果 $BC = 4$ 分米，$OB = 24$ 分米，$\sin \angle BOE = \dfrac{24}{25}$，那么点 $C$ 到水平线 $l$ 的距离 $CF$ 为______分米
    answer: $\dfrac{72}{25}$
    clue: 延长 $DC$ 交 $l$ 于 $G$，$\angle BGO=\angle BOE$，$\tan=\dfrac{24}{7}$，列方程求 $CF$。
    solution_steps:
    - $\angle BGO=\angle BOE$，$\sin\angle BGO=\dfrac{24}{25}$，设 $CF=24x$，$CG=25x$，$FG=7x$。
    - $\tan\angle BGO=\dfrac{24}{7}=\dfrac{AB}{BG}=\dfrac{24}{4+25x}$，$x=\dfrac{3}{25}$，$CF=\dfrac{72}{25}$。
