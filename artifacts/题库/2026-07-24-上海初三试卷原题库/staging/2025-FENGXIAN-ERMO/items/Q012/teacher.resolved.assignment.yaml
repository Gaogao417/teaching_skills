    id: Q012
    points: 4
    stem_latex: 如果关于 $x$ 的方程 $x^2 - x + m = 0$ 有实数根，那么 $m$ 的取值范围是______
    answer: $m \leq \dfrac{1}{4}$
    clue: $\Delta=1-4m\geq0$。
    solution_steps:
    - $\Delta=(-1)^2-4m \geq 0$，$m \leq \dfrac{1}{4}$。
