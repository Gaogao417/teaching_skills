    stem_latex: '"镶嵌相似形"：一个三角形三个顶点分别在另一个三角形的三边上，且两三角形相似。已知 $\triangle ABC$ 中，点 $P$、$D$、$E$ 分别在 $BC$、$AB$、$AC$ 上。

      (1) 如图1，$P$ 是 $BC$ 中点，$PD \parallel AC$，$PE \parallel AB$，求证：$\triangle PDE$ 是 $\triangle ABC$ 的镶嵌相似形；

      (2) 如图2，$AB = AC$，$BP = 2PC$，$\angle A = \angle PDE$，求 $\dfrac{AD}{AB}$ 的值；

      (3) 如图3，$\angle A = \angle DPE = 90^{\circ}$，$BP = 2$，$PC = 3$，$PE$ 与 $AB$ 不平行，求 $AB$ 的长。'
    solution_steps:
    - (1) $PD\parallel AC$，$PE\parallel AB$，$BP=PC$，$\therefore AD=BD$，$CE=AE$。
    - $\dfrac{DE}{BC}=\dfrac{PE}{AB}=\dfrac{DP}{AC}$，$\triangle PDE\sim\triangle ABC$。
    - (2) $\angle B=\angle C=\angle DPE$，$\triangle BDP\sim\triangle CEP$。
    - $\dfrac{BD}{CP}=\dfrac{DP}{PE}=\dfrac{AB}{BC}$，$\dfrac{CP}{BC}=\dfrac{1}{3}$，$\dfrac{BD}{AB}=\dfrac{1}{3}$，$\dfrac{AD}{AB}=\dfrac{2}{3}$。
    - (3) 过 $P$ 作 $PH\perp AB$ 于 $H$，$PI\perp AC$ 于 $I$，$\triangle DHP\sim\triangle EIP$。
    - $\dfrac{HP}{AC}=\dfrac{BP}{BC}=\dfrac{2}{5}$，$\dfrac{IP}{AB}=\dfrac{CP}{BC}=\dfrac{3}{5}$。
    - $\dfrac{AB}{AC}=\dfrac{HP}{PI}=\dfrac{\sqrt{6}}{3}$，$BC=5$，$AB=\sqrt{10}$。
    clue: 新定义相似形+平行线分线段成比例+相似三角形。
    answer: (1) 证明见详解；(2) $\dfrac{2}{3}$；(3) $AB=\sqrt{10}$
