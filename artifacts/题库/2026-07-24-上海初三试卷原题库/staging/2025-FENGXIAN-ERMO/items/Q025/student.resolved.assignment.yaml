      (1) 如图1，$P$ 是 $BC$ 中点，$PD \parallel AC$，$PE \parallel AB$，求证：$\triangle PDE$ 是 $\triangle ABC$ 的镶嵌相似形；

      (2) 如图2，$AB = AC$，$BP = 2PC$，$\angle A = \angle PDE$，求 $\dfrac{AD}{AB}$ 的值；

