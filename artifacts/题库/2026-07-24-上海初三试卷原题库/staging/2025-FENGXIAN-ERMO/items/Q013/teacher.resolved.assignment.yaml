    stem_latex: 点 $M$ 在线段 $AB$ 上，设 $\overrightarrow{AM} = \vec{a}$，$\overrightarrow{BM} = \vec{b}$，那么 $\overrightarrow{AB}$ 用向量 $\vec{a}$、$\vec{b}$ 表示为______
    answer: $\vec{a} - \vec{b}$
    clue: $\overrightarrow{AB}=\overrightarrow{AM}+\overrightarrow{MB}=\vec{a}+(-\vec{b})$。
    solution_steps:
    - $\overrightarrow{AB}=\overrightarrow{AM}+\overrightarrow{MB}=\vec{a}-\vec{b}$。
