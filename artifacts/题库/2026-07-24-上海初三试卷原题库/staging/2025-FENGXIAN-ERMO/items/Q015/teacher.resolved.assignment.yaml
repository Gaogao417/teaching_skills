  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 小王与小张先后从甲地出发前往8千米外的乙地。图中线段 $PA$、$OB$ 分别反映了小王和小张骑行路程 $S$（千米）关于小张所用时间 $t$（分钟）的函数关系。小张比小王早到乙地的时间是______分钟
    answer: '12'
    clue: 待定系数法求两条直线解析式，令 $S=8$ 求时间差。
    solution_steps:
    - $OB: S=\dfrac{1}{6}t$，$S=8$ 时 $t=48$。
    - $PA: S=\dfrac{1}{10}t+2$，$S=8$ 时 $t=60$。$60-48=12$。
