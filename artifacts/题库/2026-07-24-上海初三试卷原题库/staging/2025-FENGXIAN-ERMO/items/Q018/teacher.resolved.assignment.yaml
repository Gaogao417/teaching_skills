  blocks:
  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 在 $\triangle ABC$ 中，$\angle C=90^{\circ}$，$AC>BC$，$D$ 为 $AB$ 中点，过点 $D$ 的直线交 $AC$ 于点 $E$，如果 $DE$ 平分 $\triangle ABC$ 的周长，那么 $\dfrac{DE}{BC}=$______
    answer: $\dfrac{\sqrt{2}}{2}$
    clue: 中位线+周长平分条件，$EF=DF=\dfrac{a}{2}$，$DE=\dfrac{\sqrt{2}a}{2}$。
    solution_steps:
    - $DF=\dfrac{a}{2}$，$EF=\dfrac{a}{2}$，$DE=\sqrt{DF^2+EF^2}=\dfrac{\sqrt{2}a}{2}$。
    - $\dfrac{DE}{BC}=\dfrac{\sqrt{2}}{2}$。
