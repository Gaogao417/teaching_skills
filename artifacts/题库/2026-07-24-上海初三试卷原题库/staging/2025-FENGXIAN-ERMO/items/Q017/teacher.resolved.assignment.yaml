  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 在边长为 $2$ 的正六边形 $ABCDEF$ 中，$G$ 为 $AF$ 的中点，点 $Q$ 为正六边形边上任意一点，以 $CQ$ 为半径的 $\odot C$ 与以 $AG$ 为半径的 $\odot A$ 相交时，$\odot C$ 的半径 $r$ 的取值范围是______
    answer: $2\sqrt{3}-1 < r \leq 4$
    clue: 求两圆相交时 $r$ 的范围，需计算 $AC$、$AG$、$CF$ 等。
    solution_steps:
    - $AG=1$，$AC=2\sqrt{3}$，$AP=AC-AG=2\sqrt{3}-1$，$CF=4$。
    - $2\sqrt{3}-1<r\leq4$。
