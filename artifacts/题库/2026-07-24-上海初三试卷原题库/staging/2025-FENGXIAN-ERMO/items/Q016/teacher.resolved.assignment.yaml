    id: Q016
    points: 4
    stem_latex: 矩形 $ABCD$ 中，$AB = 12$，$AD = 27$，点 $F$ 在 $BC$ 边上，折叠矩形使 $FB$ 落在射线 $FD$ 上，折痕为 $GF$，点 $A$、$B$ 分别落在点 $A_1$、$B_1$ 处，若 $AG = 7$，那么 $B_1D$ 的长为______
    answer: '9'
    clue: $GD=20$，$DF=DG=20$，$CF=16$，$BF=11$，$B_1F=11$，$B_1D=9$。
    solution_steps:
    - $GD=AD-AG=20$，$\angle DGF=\angle BFG=\angle DFG$，$\therefore DF=DG=20$。
    - $CF=\sqrt{400-144}=16$，$BF=11$，$B_1F=BF=11$，$B_1D=20-11=9$。
