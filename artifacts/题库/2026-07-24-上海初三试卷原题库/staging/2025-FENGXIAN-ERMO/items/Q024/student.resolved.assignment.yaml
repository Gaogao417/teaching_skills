    stem_latex: '抛物线 $y=x^2+bx+c$ 与 $y$ 轴交于 $A(0,5)$，顶点 $P$ 在第一象限且在直线 $l:y=\dfrac{1}{2}x$ 上。

      (1) 求抛物线的表达式；

      (2) 向上平移直线 $l$，交抛物线于 $C$、$D$（$C$ 在左），当 $CD=OP$ 时，求 $C$ 点坐标；

      (3) 将抛物线向右平移 $m$ 个单位，平移后抛物线与原抛物线交于 $M$，顶点为 $N$，如果 $MN\perp l$，求 $m$ 的值。'
