  - type: problem
    id: Q020
    points: 10
    stem_latex: 解不等式组 $\begin{cases} 4(3+x)>3-2x \\ \dfrac{x}{3}-\dfrac{x-2}{2}\leqslant 1 \end{cases}$，将其解集在数轴上表示出来，并写出这个不等式组的整数解。
    solution_steps:
    - 由①得 $12+4x>3-2x$，$6x>-9$，$x>-\dfrac{3}{2}$。
    - 由②得 $\dfrac{2x-3(x-2)}{6}\leq1$，$2x-3x+6\leq6$，$x\geq0$ ... 不对，$-x\leq0$，$x\geq0$。
    - 实际：② $\dfrac{x}{3}-\dfrac{x-2}{2}\leq1$，通分 $\dfrac{2x-3x+6}{6}\leq1$，$\dfrac{-x+6}{6}\leq1$，$-x+6\leq6$，$x\geq0$。
    - $\therefore$ 解集 $-\dfrac{3}{2}<x\leq0$，整数解 $x=-1,0$。
    clue: 分别解两个不等式取交集。
    answer: 解集 $-\dfrac{3}{2}<x\leq0$，整数解 $x=-1,\,0$
