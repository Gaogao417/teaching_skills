  - type: short_answer
    id: Q010
    points: 4
    stem_latex: 方程 $\sqrt{x+2}=x$ 的根是______
    answer: $x=2$
    clue: 两边平方后解一元二次方程，检验增根。
    solution_steps:
    - 平方得 $x+2=x^2$，$x^2-x-2=0$，$x_1=2$，$x_2=-1$。
    - $\sqrt{x+2}=x\geq0$，舍去 $x=-1$，$\therefore x=2$。
