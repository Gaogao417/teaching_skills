    stem_latex: 正 $n$ 边形的内角等于外角的 $5$ 倍，那么 $n=$\u3000\u3000\u3000\u3000。
    answer: $12$
    clue: $\dfrac{(n-2)\times180°}{n}=5\times\dfrac{360°}{n}$。
    solution_steps:
    - $(n-2)\times180=5\times360$，$180n-360=1800$，$n=12$。
