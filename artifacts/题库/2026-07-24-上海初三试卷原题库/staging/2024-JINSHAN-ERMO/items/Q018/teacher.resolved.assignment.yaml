  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 如图，在 $Rt\triangle ABC$ 中，$\angle C=90°$，$AB=5$，$BC=3$，以点 $C$ 为圆心作半径为 $1$ 的圆 $C$，$P$ 是 $AB$ 上的点，以 $P$ 为圆心 $PB$ 为半径作圆 $P$，如果圆 $C$ 和圆 $P$ 有公共点，那么 $BP$ 的取值范围是\u3000\u3000\u3000\u3000。
    answer: $\dfrac{10}{7}\leqslant BP\leqslant 5$
    clue: 外切时 $(1+x)^2=(3-\dfrac{3}{5}x)^2+(\dfrac{4}{5}x)^2$ 得 $x=\dfrac{10}{7}$。
    solution_steps:
    - 外切：$(1+BP)^2=CP^2$，解得 $BP=\dfrac{10}{7}$。
    - $P$ 在 $B$ 时 $BP=5$（内含），范围 $\dfrac{10}{7}\leqslant BP\leqslant5$。
