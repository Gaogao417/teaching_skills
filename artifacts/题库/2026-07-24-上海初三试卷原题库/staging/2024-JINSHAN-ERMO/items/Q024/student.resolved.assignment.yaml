    stem_latex: '已知抛物线 $y=x^2+bx+c$ 经过点 $A(3,0)$、$B(0,-3)$，顶点为 $P$。

      (1) 求抛物线的解析式及顶点 $P$ 的坐标；

      (2) 平移抛物线，使得平移后的抛物线顶点 $Q$ 在直线 $AB$ 上，且 $Q$ 在 $y$ 轴右侧。①若点 $B$ 平移后得到的点 $C$ 在 $x$ 轴上，求此时抛物线的解析式；②若平移后的抛物线与 $y$ 轴相交于点 $D$，且 $\triangle BDQ$ 是直角三角形，求此时抛物线的解析式。'
