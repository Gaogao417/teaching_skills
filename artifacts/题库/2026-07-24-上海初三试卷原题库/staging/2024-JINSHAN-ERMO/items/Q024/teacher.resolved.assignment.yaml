  - type: problem
    id: Q024
    points: 12
    stem_latex: '已知抛物线 $y=x^2+bx+c$ 经过点 $A(3,0)$、$B(0,-3)$，顶点为 $P$。

      (1) 求抛物线的解析式及顶点 $P$ 的坐标；

      (2) 平移抛物线，使得平移后的抛物线顶点 $Q$ 在直线 $AB$ 上，且 $Q$ 在 $y$ 轴右侧。①若点 $B$ 平移后得到的点 $C$ 在 $x$ 轴上，求此时抛物线的解析式；②若平移后的抛物线与 $y$ 轴相交于点 $D$，且 $\triangle BDQ$ 是直角三角形，求此时抛物线的解析式。'
    answer: (1) $y=x^2-2x-3$，$P(1,-4)$；(2) ① $y=x^2-4x+3$；② $y=x^2-2x-1$
    clue: (1) 待定系数；(2)① $Q(t,t-3)$，$t=2$；② $\angle BQD=90°$，$t=1$。
    solution_steps:
    - (1) $9+3b+c=0$，$c=-3$，$b=-2$，$y=x^2-2x-3$，$P(1,-4)$。
    - (2)① $AB:y=x-3$，$Q(t,t-3)$，上移 $3$ 单位，$t-3=-1$，$t=2$，$y=(x-2)^2-1=x^2-4x+3$。
    - (2)② $D(0,t^2+t-3)$，$\angle BQD=90°$，$QB=QD$，$t=\dfrac{1}{2}(t^2+t)$，$t=1$，$y=x^2-2x-1$。
