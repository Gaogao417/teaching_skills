    stem_latex: '如图，等腰梯形 $ABCD$ 中，$AD\parallel BC$，$AB=DC$，以 $A$ 为圆心 $AB$ 为半径的圆与 $BC$ 交于 $E$、与 $CD$ 交于 $F$，联结 $AE$、$AC$、$BF$，$AE$、$AC$ 分别与 $BF$ 交于 $G$、$H$，$H$ 是 $AC$ 的中点。

      (1) 求证：四边形 $AECD$ 为平行四边形；

      (2) 如果 $AE\perp BF$，求 $\dfrac{AB}{BC}$ 的值；

      (3) 如果 $BG=GH$，求 $\angle ABC$ 的余弦值。'
