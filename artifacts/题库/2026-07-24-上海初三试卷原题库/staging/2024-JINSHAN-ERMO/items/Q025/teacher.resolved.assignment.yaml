  - type: problem
    id: Q025
    points: 14
    stem_latex: '如图，等腰梯形 $ABCD$ 中，$AD\parallel BC$，$AB=DC$，以 $A$ 为圆心 $AB$ 为半径的圆与 $BC$ 交于 $E$、与 $CD$ 交于 $F$，联结 $AE$、$AC$、$BF$，$AE$、$AC$ 分别与 $BF$ 交于 $G$、$H$，$H$ 是 $AC$ 的中点。

      (1) 求证：四边形 $AECD$ 为平行四边形；

      (2) 如果 $AE\perp BF$，求 $\dfrac{AB}{BC}$ 的值；

      (3) 如果 $BG=GH$，求 $\angle ABC$ 的余弦值。'
    answer: (1) 证明见详解；(2) $\dfrac{\sqrt{6}}{4}$；(3) $\cos\angle ABC=\dfrac{\sqrt{30}}{24}$
    clue: (1) $AE\parallel DC$；(2) $\triangle BEG\sim\triangle BCF$，$\triangle AHG\cong\triangle CHF$；(3) $BG=GH=HF$，勾股定理。
    solution_steps:
    - (1) $AB=AE=DC$，$\angle AEB=\angle BCD$，$AE\parallel DC$，$\therefore AECD$ 为平行四边形。
    - (2) $AE\perp BF$ 得 $BG=GF$，$\triangle BEG\sim\triangle BCF$，$\triangle AHG\cong\triangle CHF$，$AG=CF=2a$，$AB=3a$，$\dfrac{AB}{BC}=\dfrac{\sqrt{6}}{4}$。
    - (3) $BG=GH=HF$，$AI\perp BC$，$\triangle ABG\cong\triangle AFH$，$x^2-a^2=\dfrac{9}{4}x^2-25a^2$，$\cos\angle ABC=\dfrac{\sqrt{30}}{24}$。
