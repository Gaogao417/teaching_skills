    stem_latex: 如图，在 $Rt\triangle ABC$ 中，$\angle ACB=90°$，$AC=2$，$D$ 是 $AB$ 的中点，把 $\triangle BCD$ 沿 $CD$ 翻折，点 $B$ 落在点 $E$ 处，如果 $CE\perp AB$，那么 $BE=$\u3000\u3000\u3000\u3000。
    answer: $2\sqrt{3}$
    clue: $\angle DBC=30°$，$\triangle EBC$ 等边，$BE=BC=2\sqrt{3}$。
    solution_steps:
    - $\angle DCB=\angle DCF=30°$，$\angle DBC=30°$，$\triangle EBC$ 等边。
    - $BC=AC\tan60°=2\sqrt{3}$，$BE=BC=2\sqrt{3}$。
