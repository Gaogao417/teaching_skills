    stem_latex: '某农业合作社销售草莓，销售额 $y_1$（元）与销售量 $x$（千克）关系如射线 $l_1$，成本 $y_2$（元）与 $x$ 关系如射线 $l_2$（$l_1$、$l_2$ 交于 $(20,400)$，$l_2$ 过 $(0,200)$）。

