  - type: problem
    id: Q021
    points: 10
    stem_latex: '某农业合作社销售草莓，销售额 $y_1$（元）与销售量 $x$（千克）关系如射线 $l_1$，成本 $y_2$（元）与 $x$ 关系如射线 $l_2$（$l_1$、$l_2$ 交于 $(20,400)$，$l_2$ 过 $(0,200)$）。

      (1) 当销售量为多少时销售额和成本相等？

      (2) 每千克草莓的销售价格是多少？

      (3) 如果销售利润为 $2000$ 元，销售量为多少？'
    answer: (1) $20$ 千克；(2) $20$ 元；(3) $220$ 千克
    clue: (1) 交点；(2) $400\div20$；(3) $y_1-y_2=2000$。
    solution_steps:
    - (1) 交点 $x=20$ 千克。
    - (2) $400\div20=20$ 元/千克。
    - (3) $y_1=20x$，$y_2=10x+200$，$20x-(10x+200)=2000$，$x=220$。
