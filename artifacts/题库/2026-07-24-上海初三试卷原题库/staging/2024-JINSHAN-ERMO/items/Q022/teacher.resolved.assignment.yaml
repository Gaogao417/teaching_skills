    stem_latex: '用\u201c立杆测影\u201d法测教学楼高度：$2$ 米杆影长 $1.6$ 米，教学楼影长 $24$ 米。再测量上海中心大厦高度：$CD=60$ 米，$\cot\alpha=10.667$，$\cot\beta=10.161$（方案1），$\cot\gamma=10.159$，$\cot\theta=10.254$（方案2）。

      (1) 教学楼（$AB$）的高度；

      (2) 选一种方案计算上海中心大厦（$SH$）的高度（精确到 $1$ 米）。'
    answer: (1) $30$ 米；(2) 约 $632$ 米
    clue: (1) $\dfrac{2}{1.6}=\dfrac{x}{24}$；(2) $\cot$ 关系列方程。
    solution_steps:
    - (1) $\dfrac{2}{1.6}=\dfrac{x}{24}$，$x=30$ 米。
    - (2) 方案1：$10.667(x-30)=10.161x$，$x\approx632$ 米。
