  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如图，已知平行四边形 $ABCD$ 中，$\overrightarrow{AB}=\vec{a}$，$\overrightarrow{AC}=\vec{b}$，$E$ 为 $AD$ 上一点，$AE=2ED$，那么用 $\vec{a}$、$\vec{b}$ 表示 $\overrightarrow{AE}=$\u3000\u3000\u3000\u3000。
    answer: $\dfrac{2}{3}\vec{b}-\dfrac{2}{3}\vec{a}$
    clue: $\overrightarrow{AE}=\dfrac{2}{3}\overrightarrow{AD}=\dfrac{2}{3}\overrightarrow{BC}$。
    solution_steps:
    - $\overrightarrow{BC}=\vec{b}-\vec{a}$，$\overrightarrow{AE}=\dfrac{2}{3}(\vec{b}-\vec{a})$。
