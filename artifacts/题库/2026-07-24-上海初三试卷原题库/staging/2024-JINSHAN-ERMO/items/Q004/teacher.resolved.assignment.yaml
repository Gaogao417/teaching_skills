  - type: choice
    id: Q004
    points: 4
    stem_latex: 在气象学上，连续 $5$ 天的平均气温在 $10°\text{C}$ 以上即为春天的开始，那么下列表述正确的是（　　）
    choices:
    - 这 $5$ 天中每天采集的若干气温中最高气温一定都大于 $10°\text{C}$
    - 这 $5$ 天中每天采集的若干气温中最低气温一定都大于 $10°\text{C}$
    - 这 $5$ 天中每天采集的若干气温的中位数一定都大于 $10°\text{C}$
    - 这 $5$ 天中每天采集的若干气温的众数一定都大于 $10°\text{C}$
    answer: A
    clue: 平均数 $>10$ 则至少有一个值 $>10$，但最高一定 $>10$。
