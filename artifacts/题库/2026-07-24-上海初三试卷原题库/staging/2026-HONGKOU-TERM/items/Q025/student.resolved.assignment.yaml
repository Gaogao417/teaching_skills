    stem_latex: 如图15，在 $\triangle ABC$ 中，$\angle ACB=90^\circ,CD\parallel AB$ 且 $AC=AD$。（1）证明：$2AC^2=CD\cdot AB$；（2）联结 $BD$ 交 $AC$ 于 $E$，过点 $C$ 作 $CF\parallel AD$ 交 $BD$ 于 $F$。①过点 $C$ 作 $CG\perp AD$，分别交 $AD,BD$ 于 $G,H$，如图16。已知 $AB=5,\tan\angle ABC=\frac34$，求 $CF,CH$；②如图17，若 $F$ 为 $BE$ 的中点，求 $\frac{S_{\triangle ABC}}{S_{\triangle ADC}}$。
