  - type: problem
    id: Q025
    points: 14
    stem_latex: 如图15，在 $\triangle ABC$ 中，$\angle ACB=90^\circ,CD\parallel AB$ 且 $AC=AD$。（1）证明：$2AC^2=CD\cdot
      AB$；（2）联结 $BD$ 交 $AC$ 于 $E$，过点 $C$ 作 $CF\parallel AD$ 交 $BD$ 于 $F$。①过点 $C$ 作
      $CG\perp AD$，分别交 $AD,BD$ 于 $G,H$，如图16。已知 $AB=5,\tan\angle ABC=\frac34$，求 $CF,CH$；②如图17，若
      $F$ 为 $BE$ 的中点，求 $\frac{S_{\triangle ABC}}{S_{\triangle ADC}}$。
    answer: （1）结论成立；（2）①$CF=\frac{54}{25},CH=\frac{36}{25}$；②$\sqrt2$
    solution_steps:
    - title: 解答
      content: （1）作 $AM\perp CD$。由 $AC=AD$ 得 $CD=2CM$；又由相似得 $AC^2=CM\cdot AB$，故 $2AC^2=CD\cdot
        AB$。（2）①由直角三角形、平行线比例计算得 $CF=\frac{54}{25},CH=\frac{36}{25}$；②由平行线比例及 $F$ 为
        $BE$ 中点，得 $\frac{BE}{DE}=\sqrt2$，进而 $\frac{S_{\triangle ABC}}{S_{\triangle
        ADC}}=\sqrt2$。
