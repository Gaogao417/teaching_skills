  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图9，$D,E$ 分别是 $\triangle ABC$ 边 $AB,AC$ 上的点，且 $DE\parallel BC,DE=4,BC=12,AE=3$。（1）求
      $CE$；（2）如果 $\angle ACD=\angle ABC$，求 $CD$。
    answer: （1）$CE=6$；（2）$CD=4\sqrt3$
    solution_steps:
    - title: 解答
      content: （1）由 $DE\parallel BC$，$\frac{AE}{AC}=\frac{DE}{BC}$，得 $AC=9$，所以 $CE=6$。（2）由
        $\angle EDC=\angle DCB,\angle ACD=\angle ABC$，得 $\triangle EDC\sim\triangle
        DCB$，故 $\frac{DE}{CD}=\frac{CD}{CB}$，所以 $CD=4\sqrt3$。
