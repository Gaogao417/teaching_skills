  blocks:
  - type: problem
    id: Q020
    points: 10
    stem_latex: “已知抛物线 $C_1:y=ax^2+bx+c\ (a\ne0)$ 经过点 $A(0,-5),B(-1,0)$，\textbf{（缺失条件）}，求抛物线
      $C_1$ 的表达式。”黑色阴影部分因墨水污染无法辨认，查询得 $C_1$ 的表达式为 $y=x^2-4x-5$。（1）添加一个缺失条件；（2）将 $C_1$
      向上平移 $m$ 个单位得 $C_2$，若 $C_2$ 的顶点关于原点的对称点在 $C_1$ 上，求 $m$。
    answer: （1）例如：经过点 $(5,0)$；（2）$m=2$
    solution_steps:
    - title: 解答
      content: （1）可补充“经过点 $(5,0)$”（答案不唯一）。（2）$C_1:y=(x-2)^2-9$，$C_2$ 顶点为 $(2,-9+m)$，关于原点的对称点为
        $(-2,9-m)$。代入 $C_1$ 得 $9-m=7$，所以 $m=2$。
    source_solution_images:
    - image_path: assets/official-solution-01.png
      width: 0.96\linewidth
      variant: source_solution
      disclosure_policy: teacher_only
      label: 官方原解答第1页
