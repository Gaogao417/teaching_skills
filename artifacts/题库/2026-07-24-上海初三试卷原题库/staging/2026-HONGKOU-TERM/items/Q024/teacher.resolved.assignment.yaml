  - type: problem
    id: Q024
    points: 12
    stem_latex: 如图14，在平面直角坐标系 $xOy$ 中，抛物线 $y=ax^2+2ax+c\ (a\ne0)$ 交 $x$ 轴于 $A(-3,0)$
      和点 $B$，交 $y$ 轴于点 $C$，顶点为 $D$。（1）写出 $B$ 的坐标，并用含 $a$ 的式子表示 $D$；（2）平移得新抛物线，其最高点是
      $B$，与 $y$ 轴交于 $E$，若 $\triangle ACE$ 面积为6，求 $a$；（3）当 $D=(-1,-4)$，点 $P$ 在原抛物线上且
      $\angle ADP=45^\circ$，求 $P$。
    answer: （1）$B(1,0),D(-1,-4a)$；（2）$a=-1$；（3）$P(2,5)$ 或 $P(-\frac43,-\frac{35}{9})$
    solution_steps:
    - title: 解答
      content: （1）由根与对称轴得 $B(1,0)$；$c=-3a$，故 $y=a(x+1)^2-4a$，$D(-1,-4a)$。（2）新抛物线为
        $y=a(x-1)^2$，$E(0,a)$，由面积为6且开口向下得 $a=-1$。（3）分类讨论点 $P$ 在对称轴两侧，得 $P(2,5)$ 或
        $P(-\frac43,-\frac{35}{9})$。
