  - id: Q019
    source_key: GEN-TERM-Q19
    question_number: 19
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: foundation
    skill_tags: [特殊角三角比, 绝对值, 实数运算]
    stem_latex: '计算：$\sqrt6\cot60^\circ-\left|2\cos45^\circ-1\right|+4\sin^230^\circ$。'
    answer: '$2$'
    official_solution_latex:
      - title: 代入特殊角三角比
        content: '$\sqrt6\cot60^\circ-\left|2\cos45^\circ-1\right|+4\sin^230^\circ=\sqrt6\times\frac{\sqrt3}{3}-\left|2\times\frac{\sqrt2}{2}-1\right|+4\times\left(\frac12\right)^2$。'
      - title: 化简
        content: '$=\sqrt2-(\sqrt2-1)+1=2$。'
    question_crops:
