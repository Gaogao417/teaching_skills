  - id: Q020
    source_key: GEN-TERM-Q20
    question_number: 20
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [平面向量, 向量线性表示, 向量分解]
    stem_latex: |-
      如图，在 $\triangle ABC$ 中，点 $D$ 在边 $AC$ 上，且 $AD=2DC$；点 $E$ 在 $BD$ 的延长线上，$CE\parallel AB$。已知 $\overrightarrow{BA}=\vec a$，$\overrightarrow{BC}=\vec b$。
      \begin{enumerate}
      \item 用向量 $\vec a,\vec b$ 分别表示向量 $\overrightarrow{AC}$、$\overrightarrow{AE}$；
      \item 作出向量 $\overrightarrow{AD}$ 分别在 $\vec a,\vec b$ 方向上的分向量（写出结论，不要求写作法）。
      \end{enumerate}
    subquestions:
      - {latex: '用 $\vec a,\vec b$ 分别表示 $\overrightarrow{AC}$、$\overrightarrow{AE}$；'}
      - {latex: '作出 $\overrightarrow{AD}$ 在 $\vec a,\vec b$ 方向上的分向量。'}
    answer: '（1）$\overrightarrow{AC}=\vec b-\vec a$，$\overrightarrow{AE}=-\frac12\vec a+\vec b$；（2）见图。'
    official_solution_latex:
      - title: 第（1）问
        content: '$\overrightarrow{AC}=\vec b-\vec a$，$\overrightarrow{AE}=-\frac12\vec a+\vec b$。'
      - title: 第（2）问
        content: '向量 $\overrightarrow{AM}$、$\overrightarrow{AN}$ 就是向量 $\overrightarrow{AD}$ 分别在 $\vec a$、$\vec b$ 方向上的分向量。'
    question_crops:
      - {source: documents/初三/初三数学期末练习卷/004.png, box: [80, 0, 1000, 370], file: source-question.png}
    prompt_crops:
      - {source: documents/初三/初三数学期末练习卷/004.png, box: [725, 200, 975, 375], file: prompt-01.png, width: 58mm}
    solution_crops:
      - {source: documents/初三/初三数学期末练习卷/006.png, box: [105, 500, 850, 610], file: official-solution-01.png, label: 公众号原解答文字}
      - {source: documents/初三/初三数学期末练习卷/006.png, box: [740, 360, 1005, 540], file: official-solution-02.png, label: 公众号原解答作图}

  - id: Q021
    source_key: GEN-TERM-Q21
    question_number: 21
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [相似三角形, 几何证明, 线段比]
    stem_latex: |-
      如图，在 $\triangle ABC$ 中，点 $D,E$ 分别在边 $AB,AC$ 上，$AD\cdot AB=AE\cdot AC$，点 $F$ 是 $BE$ 与 $CD$ 的交点。
      \begin{enumerate}
      \item 求证：$\triangle FDB\sim\triangle FEC$；
      \item 如果 $AB=15$，$AC=18$，$AD=6$，求 $EF:DF$。
      \end{enumerate}
    subquestions:
      - {latex: '求证：$\triangle FDB\sim\triangle FEC$；'}
      - {latex: '若 $AB=15$，$AC=18$，$AD=6$，求 $EF:DF$。'}
    answer: '（1）证明见解析；（2）$EF:DF=13:9$。'
    official_solution_latex:
      - title: 第（1）问：由比例判相似
        content: |-
          因为 $AD\cdot AB=AE\cdot AC$，所以 $\dfrac{AD}{AE}=\dfrac{AC}{AB}$。
          又因为 $\angle DAC=\angle EAB$，所以 $\triangle DAC\sim\triangle EAB$，从而 $\angle ACD=\angle ABE$。
          因为 $\angle EFC=\angle DFB$，所以 $\triangle FDB\sim\triangle FEC$。
      - title: 第（2）问：求线段比
        content: |-
          由 $AD\cdot AB=AE\cdot AC$，且 $AB=15$，$AC=18$，$AD=6$，得 $6\times15=18\cdot AE$，所以 $AE=5$，$BD=15-6=9$，$EC=18-5=13$。
          由 $\triangle FDB\sim\triangle FEC$，得 $\dfrac{EF}{DF}=\dfrac{CE}{BD}$，所以 $EF:DF=13:9$。
    question_crops:
      - {source: documents/初三/初三数学期末练习卷/004.png, box: [80, 375, 1000, 590], file: source-question.png}
    prompt_crops:
      - {source: documents/初三/初三数学期末练习卷/004.png, box: [730, 440, 975, 605], file: prompt-01.png, width: 58mm}
    solution_crops:
      - {source: documents/初三/初三数学期末练习卷/006.png, box: [105, 605, 1015, 1110], file: official-solution-01.png}

  - id: Q022
    source_key: GEN-TERM-Q22
    question_number: 22
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [锐角三角比, 实际应用, 解直角三角形]
    render_stem_as_image: true
    stem_latex: |-
      阅读下列材料，回答问题。

      拉伸运动对身体机能的调节起着关键作用。从运动生理学角度来看，科学的拉伸可以改善关节活动范围，提升身体的灵活性和协调性。

      拉伸板是一种有效的拉伸工具，其侧面结构可以看作一个三角形。脚踏板 $AB$ 可绕底座铰链 $B$ 转动，支撑杆 $CD$ 的上端位于脚踏板的点 $D$ 处。通过移动支撑杆下端点 $C$ 的位置，可以改变脚踏板的倾斜角度。人在倾斜的脚踏板上时，身体重量会产生一个沿着踏板方向的拉伸力 $F$，其大小为
      \[
      F=mg\sin\alpha,
      \]
      其中 $m$（单位：千克）为体重，$g\approx10\text{牛/千克}$，$\alpha$ 是脚踏板与水平地面之间的夹角。

      小海有一款三档可调节拉伸板，三档的夹角 $\alpha$ 分别为 $20^\circ,25^\circ,30^\circ$。已知 $BD=30\text{ cm}$。
      \begin{enumerate}
      \item 小海的体重是 $50$ 千克，如果拉伸力 $F$ 在 $180$ 牛至 $220$ 牛可以达到锻炼目的，说明选择哪一档能达到锻炼目的；
      \item 当档位夹角为 $30^\circ$ 时，支撑杆 $CD$ 恰好与底座 $BM$ 垂直，求支撑杆下端点 $C$ 与铰链 $B$ 点的距离（结果保留根号）；
      \item 当档位夹角从 $30^\circ$ 调到 $20^\circ$ 时，支撑杆的位置变化到 $D_1C_1$，求支撑杆 $CD$ 的端点 $D$ 在竖直方向下降约多少厘米。
      \end{enumerate}
      参考数据（精确到 $0.01$）：$\sin20^\circ=0.34$，$\sin25^\circ=0.42$，$\cos20^\circ=0.94$，$\cos25^\circ=0.91$。
    subquestions:
      - {latex: '判断应选择的档位；'}
      - {latex: '求 $BC$；'}
      - {latex: '求点 $D$ 在竖直方向下降的距离。'}
    answer: '（1）$25^\circ$ 档；（2）$15\sqrt3\text{ cm}$；（3）约 $4.8\text{ cm}$。'
    official_solution_latex:
      - title: 第（1）问：比较三档拉伸力
        content: |-
          $F=mg\sin\alpha=50\text{ kg}\times10\text{ N/kg}\times\sin20^\circ\approx500\text{ N}\times0.34=170\text{ N}$；
          $F\approx500\text{ N}\times0.42=210\text{ N}$；
          $F=500\text{ N}\times0.50=250\text{ N}$。
          因为 $170<180<210<220<250$，所以小海选择 $25^\circ$ 档能达到锻炼目的。
      - title: 第（2）问：求水平距离
        content: '在 $\mathrm{Rt}\triangle DBC$ 中，$\angle BCD=90^\circ$，$BD=30\text{ cm}$，$\angle ABC=30^\circ$，所以 $BC=BD\cos\angle ABC=30\times\frac{\sqrt3}{2}=15\sqrt3\text{ cm}$。'
      - title: 第（3）问：求竖直下降距离
        content: |-
          在 $\mathrm{Rt}\triangle DBC$ 中，$DC=DB\sin\angle ABC=30\sin30^\circ=15\text{ cm}$。
          作 $D_1H\perp BM$，垂足为 $H$。由题意，$D_1B=DB=30\text{ cm}$，$\angle A_1BC_1=20^\circ$。
          在 $\mathrm{Rt}\triangle D_1BH$ 中，$D_1H=D_1B\sin\angle A_1BC_1=30\sin20^\circ\approx30\times0.34=10.2\text{ cm}$。
          所以点 $D$ 在竖直方向下降约 $15-10.2=4.8\text{ cm}$。
    question_crops:
      - {source: documents/初三/初三数学期末练习卷/004.png, box: [80, 590, 780, 625], file: source-question-header.png}
      - {source: documents/初三/初三数学期末练习卷/004.png, box: [80, 625, 1015, 1400], file: source-question.png}
    prompt_crops:
      - {source: documents/初三/初三数学期末练习卷/004.png, box: [80, 625, 1015, 1400], file: prompt-full-question.png, width: '0.98\linewidth'}
    solution_crops:
      - {source: documents/初三/初三数学期末练习卷/006.png, box: [105, 1110, 1015, 1527], file: official-solution-01.png, label: 公众号原解答第 1 页}
      - {source: documents/初三/初三数学期末练习卷/007.png, box: [105, 70, 1015, 365], file: official-solution-02.png, label: 公众号原解答第 2 页}

  - id: Q023
    source_key: GEN-TERM-Q23
    question_number: 23
    question_type: problem
    section_title: 三、解答题
    points: 12
    difficulty: challenge
    skill_tags: [相似三角形, 射影定理, 几何证明]
    stem_latex: |-
      如图，在 $\mathrm{Rt}\triangle ABC$ 中，$\angle BAC=90^\circ$，$AD\perp BC$，垂足为点 $D$。点 $E$ 是边 $AC$ 上一点，$EF\perp BC$，垂足为点 $F$，$AD,BE$ 交于点 $M$。
      \begin{enumerate}
      \item 如果 $BE$ 平分 $\angle ABC$，求证：$BM\cdot CE=AM\cdot BE$；
      \item 如果 $BD=CF$，求证：$\dfrac{EF}{AD}=\dfrac{AB^2}{AC^2}$。
      \end{enumerate}
    subquestions:
      - {latex: '若 $BE$ 平分 $\angle ABC$，证明 $BM\cdot CE=AM\cdot BE$；'}
      - {latex: '若 $BD=CF$，证明 $\dfrac{EF}{AD}=\dfrac{AB^2}{AC^2}$。'}
    answer: '两问证明见解析。'
    official_solution_latex:
      - title: 第（1）问
        content: |-
          因为 $\mathrm{Rt}\triangle ABC$ 中 $\angle BAC=90^\circ$，所以 $\angle ABC+\angle C=90^\circ$。
          因为 $AD\perp BC$，所以在 $\mathrm{Rt}\triangle ABD$ 中，$\angle ABC+\angle1=90^\circ$，从而 $\angle1=\angle C$。
          因为 $BE$ 平分 $\angle ABC$，所以 $\angle2=\angle3$，从而 $\triangle ABM\sim\triangle CBE$。
          因此 $\dfrac{BM}{BE}=\dfrac{AM}{CE}$，即 $BM\cdot CE=AM\cdot BE$。
      - title: 第（2）问
        content: |-
          因为 $\angle1=\angle C$，且 $\angle ABC$ 是公共角，所以 $\triangle BAD\sim\triangle BCA$。
          因此 $\dfrac{BD}{BA}=\dfrac{BA}{BC}$，即 $BD\cdot BC=BA^2$。同理可证 $CD\cdot CB=CA^2$。
          所以 $\dfrac{BD}{CD}=\dfrac{BA^2}{CA^2}$。又因为 $BD=CF$，所以 $\dfrac{CF}{CD}=\dfrac{BA^2}{CA^2}$。
          因为 $EF\perp BC$，$AD\perp BC$，所以 $EF\parallel AD$，从而 $\dfrac{EF}{AD}=\dfrac{CF}{CD}=\dfrac{AB^2}{AC^2}$。
    question_crops:
      - {source: documents/初三/初三数学期末练习卷/005.png, box: [80, 100, 1005, 390], file: source-question.png}
    prompt_crops:
      - {source: documents/初三/初三数学期末练习卷/005.png, box: [660, 190, 975, 388], file: prompt-01.png, width: 62mm}
    solution_crops:
      - {source: documents/初三/初三数学期末练习卷/007.png, box: [105, 365, 1015, 1165], file: official-solution-01.png}

  - id: Q024
    source_key: GEN-TERM-Q24
    question_number: 24
    question_type: problem
    section_title: 三、解答题
    points: 12
    difficulty: challenge
    skill_tags: [二次函数, 新定义, 抛物线对称性, 坐标几何]
    stem_latex: |-
      新定义：在平面直角坐标系中，抛物线上的点和它的顶点的连线与该条抛物线的对称轴所夹角的正切值称为抛物线上这个点的开口程度，规定抛物线顶点的开口程度为 $0$。

      如图，在平面直角坐标系 $xOy$ 中：
      \begin{enumerate}
      \item 抛物线 $y=x^2-4x+5$ 与 $y$ 轴交于点 $P$，求点 $P$ 的开口程度 $k_P$；
      \item 抛物线 $y=x^2-4x+a$ 与 $x$ 轴交于 $A,B$ 两点（$A$ 在 $B$ 的左侧）。如果点 $A$ 的开口程度 $k_A=1$，求 $a$；
      \item 将抛物线 $C_1:y=mx^2-2mx+n\ (m>0)$ 平移，使平移后的抛物线 $C_2$ 经过 $C_1$ 的顶点 $M$。记 $C_2$ 的顶点为 $N$，$C_2$ 的对称轴交 $C_1$ 于点 $Q$。如果 $C_1$ 上点 $Q$ 的开口程度与 $C_2$ 上点 $M$ 的开口程度相等，均为 $2$，且 $\triangle QMN$ 的面积为 $8$，求 $m$。
      \end{enumerate}
    subquestions:
      - {latex: '求 $k_P$；'}
      - {latex: '求 $a$；'}
      - {latex: '求 $m$。'}
    answer: '（1）$\frac12$；（2）$3$；（3）$\frac18$。'
    official_solution_latex:
      - title: 第（1）问
        content: |-
          因为 $y=x^2-4x+5=(x-2)^2+1$，记顶点为 $D$，所以 $P(0,5)$，$D(2,1)$，对称轴为直线 $x=2$。
          作 $PH\perp$ 直线 $x=2$，垂足为点 $H$，则 $PH=2$，$HD=4$，所以 $k_P=\tan\angle PDH=\dfrac{PH}{HD}=\dfrac12$。
      - title: 第（2）问
        content: |-
          因为 $y=x^2-4x+a=(x-2)^2+a-4$，记顶点为 $E$，所以 $E(2,a-4)$，对称轴为直线 $x=2$。记直线 $x=2$ 与 $x$ 轴交于点 $F$。
          因为抛物线与 $x$ 轴有两个交点，所以 $a-4<0$，即 $a<4$。
          因为 $k_A=\tan\angle AEF=\dfrac{AF}{EF}=1$，所以 $AF=EF=4-a$，从而 $A(a-2,0)$。
          把 $A(a-2,0)$ 代入 $y=(x-2)^2+a-4$，得 $(a-4)^2+a-4=0$，解得 $a=3$ 或 $a=4$。当 $a=4$ 时不合题意，舍去，所以 $a=3$。
      - title: 第（3）问
        content: |-
          作 $MG\perp QN$ 于点 $G$。因为 $C_1$ 上点 $Q$ 的开口程度与 $C_2$ 上点 $M$ 的开口程度相等，均为 $2$，所以 $k_Q=k_M=2$。
          因为 $k_Q=\tan\angle QMI$，$k_M=\tan\angle MNQ$，所以 $\angle QMI=\angle MNQ$。
          因为 $C_1,C_2$ 的对称轴互相平行，所以 $\angle QMI=\angle MQN$，从而 $\angle MQN=\angle MNQ$。
          所以 $\tan\angle MQN=\tan\angle MNQ$，且 $\dfrac{MG}{QG}=\dfrac{MG}{NG}=2$。
          设 $QG=NG=t\ (t>0)$，则 $MG=2t$。由 $S_{\triangle QMN}=\dfrac12QN\cdot MG=\dfrac12\cdot2t\cdot2t=8$，得 $t=2$。
          因为 $C_1:y=mx^2-2mx+n=m(x-1)^2+n-m$，所以 $M(1,n-m)$，且 $Q(-3,n-m+2)$ 或 $Q(5,n-m+2)$。
          将 $Q(-3,n-m+2)$ 或 $Q(5,n-m+2)$ 代入 $C_1$，解得 $m=\dfrac18$。
    question_crops:
      - {source: documents/初三/初三数学期末练习卷/005.png, box: [80, 395, 1005, 855], file: source-question.png}
