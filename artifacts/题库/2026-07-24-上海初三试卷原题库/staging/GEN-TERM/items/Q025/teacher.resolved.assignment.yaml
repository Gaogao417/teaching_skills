  blocks:
  - type: problem
    id: Q025
    points: 14
    stem_latex: '在 $\triangle ABC$ 中，$\angle BAC\ge90^\circ$，点 $D$ 为边 $AC$ 上一点，$\angle ABD=\angle ACB$，$CD=2$。将 $\triangle ABD$ 沿 $BD$ 翻折得到 $\triangle A_1BD$，点 $A_1$ 恰好落在边 $BC$ 的垂直平分线上。

      \begin{enumerate}

      \item 如图，如果点 $A_1$ 在边 $BC$ 上，求 $\dfrac{AD}{AB}$ 的值；

      \item 如图，如果 $AD=CD$，求 $BD$ 的长；

      \item 如果 $AB=CD$，求 $\angle BAC$ 的度数。

      \end{enumerate}'
    answer: （1）$\frac{\sqrt3}{3}$；（2）$\sqrt6+\sqrt2$；（3）$96^\circ$。
    subquestions:
    - latex: 当点 $A_1$ 在边 $BC$ 上时，求 $\dfrac{AD}{AB}$；
    - latex: 当 $AD=CD$ 时，求 $BD$；
    - latex: 当 $AB=CD$ 时，求 $\angle BAC$。
    solution_steps:
    - title: 第（1）问
      content: '由题意，$\triangle ABD\cong\triangle A_1BD$，$A_1$ 是 $BC$ 的中点。

        $\therefore\ S_{\triangle ABD}=S_{\triangle A_1BD}=S_{\triangle A_1CD}$，$\therefore\ \dfrac{S_{\triangle ABD}}{S_{\triangle ACB}}=\dfrac13$。

        $\because\ \angle ABD=\angle ACB$，$\angle A=\angle A$，

        $\therefore\ \triangle ABD\sim\triangle ACB$。

        $\therefore\ \dfrac{S_{\triangle ABD}}{S_{\triangle ACB}}=\left(\dfrac{AD}{AB}\right)^2=\dfrac13$。

        $\therefore\ \dfrac{AD}{AB}=\dfrac{\sqrt3}{3}$。'
      diagram_col:
        image_path: assets/solution-01.png
        width: 72mm
        variant: solution
        disclosure_policy: teacher_only
    - title: 第（2）问
      content: '联结 $AA_1,A_1C$。由题意，$BD$ 垂直平分 $AA_1$，交 $AA_1$ 于点 $M$。

        $\therefore\ AM=A_1M=\dfrac12AA_1$，$\angle AMD=90^\circ$。

        $\because\ AD=CD=2$，$\therefore\ \dfrac{AM}{MA_1}=\dfrac{AD}{DC}=1$，$\therefore\ DM\parallel A_1C$，$DM=\dfrac12A_1C$。

        $\therefore\ \angle AMD=\angle AA_1C=90^\circ$。

        $\because\ \angle ABD=\angle ACB$，$\angle BAD$ 是公共角，$\therefore\ \triangle ABD\sim\triangle ACB$，$\therefore\ \dfrac{AB}{AC}=\dfrac{AD}{AB}$。

        $\because\ AD=CD=2$，$\therefore\ AB=2\sqrt2$。

        由题意，$\triangle ABD\cong\triangle A_1BD$，$\therefore\ A_1B=AB=2\sqrt2$。

        $\because$ 点 $A_1$ 在 $BC$ 的垂直平分线上，$\therefore\ A_1B=A_1C=2\sqrt2$，$\therefore\ DM=\sqrt2$。

        在 $\mathrm{Rt}\triangle ADM$ 中，$AM=\sqrt{AD^2-DM^2}=\sqrt2$；在 $\mathrm{Rt}\triangle ABM$ 中，$BM=\sqrt{AB^2-AM^2}=\sqrt6$。

        $\therefore\ BD=BM+DM=\sqrt6+\sqrt2$。'
      diagram_col:
        image_path: assets/solution-02.png
        width: 76mm
        variant: solution
        disclosure_policy: teacher_only
    - title: 第（3）问
      content: '过点 $D$ 作 $DN\parallel AA_1$，交 $A_1C$ 于点 $N$。

        $\because\ \dfrac{A_1N}{A_1C}=\dfrac{AD}{AC}$，且由 $\triangle ABD\sim\triangle ACB$ 得 $\dfrac{AD}{AB}=\dfrac{AB}{AC}$。

        又 $\because\ AB=CD=2$，$\therefore\ \dfrac{AD}{CD}=\dfrac{CD}{AC}$。

        $\because$ 点 $D$ 为线段 $AC$ 的黄金分割点，$\therefore\ \dfrac{AD}{CD}=\dfrac{CD}{AC}=\dfrac{\sqrt5-1}{2}$。

        $\therefore\ AD=\sqrt5-1$，$A_1D=\sqrt5-1$，$AC=\sqrt5+1$。

        又 $\because\ A_1C=A_1B=AB=2$，$\therefore\ A_1N=3-\sqrt5$，$CN=\sqrt5-1$。

        $\therefore\ \dfrac{A_1N}{A_1D}=\dfrac{3-\sqrt5}{\sqrt5-1}=\dfrac{\sqrt5-1}{2}$。

        $\because\ \dfrac{A_1D}{A_1C}=\dfrac{A_1N}{A_1D}$，$\angle NA_1D=\angle DA_1C$，$\therefore\ \triangle A_1ND\sim\triangle A_1DC$。

        设 $\angle A_1CD=\angle A_1DN=\alpha$，则 $\angle DA_1C=\angle CDA_1=2\alpha$。

        在 $\triangle A_1CD$ 中，$\angle DA_1C+\angle CDA_1+\angle A_1CD=180^\circ$，$\therefore\ \alpha=36^\circ$。

        $\therefore\ \angle A_1DN=\angle NDC=36^\circ$。

        $\because\ DN\parallel AA_1$，$\therefore\ \angle CAA_1=\angle NDC=36^\circ$，$\therefore\ A_1A=A_1C$。

        又 $\because\ AB=A_1B=A_1C$，$\therefore\ AB=A_1B=A_1A$，$\therefore\ \triangle ABA_1$ 是等边三角形，$\angle BAA_1=60^\circ$。

        $\therefore\ \angle BAC=\angle BAA_1+\angle CAA_1=60^\circ+36^\circ=96^\circ$。'
      diagram_col:
        image_path: assets/solution-03.png
        width: 78mm
        variant: solution
        disclosure_policy: teacher_only
