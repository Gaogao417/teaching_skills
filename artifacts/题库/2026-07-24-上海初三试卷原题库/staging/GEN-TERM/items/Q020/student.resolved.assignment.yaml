    stem_latex: '如图，在 $\triangle ABC$ 中，点 $D$ 在边 $AC$ 上，且 $AD=2DC$；点 $E$ 在 $BD$ 的延长线上，$CE\parallel AB$。已知 $\overrightarrow{BA}=\vec a$，$\overrightarrow{BC}=\vec b$。

      \begin{enumerate}

      \item 用向量 $\vec a,\vec b$ 分别表示向量 $\overrightarrow{AC}$、$\overrightarrow{AE}$；

      \item 作出向量 $\overrightarrow{AD}$ 分别在 $\vec a,\vec b$ 方向上的分向量（写出结论，不要求写作法）。

      \end{enumerate}'
