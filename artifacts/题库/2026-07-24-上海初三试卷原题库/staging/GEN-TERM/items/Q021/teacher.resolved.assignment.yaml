  blocks:
  - type: problem
    id: Q021
    points: 10
    stem_latex: '如图，在 $\triangle ABC$ 中，点 $D,E$ 分别在边 $AB,AC$ 上，$AD\cdot AB=AE\cdot AC$，点 $F$ 是 $BE$ 与 $CD$ 的交点。

      \begin{enumerate}

      \item 求证：$\triangle FDB\sim\triangle FEC$；

      \item 如果 $AB=15$，$AC=18$，$AD=6$，求 $EF:DF$。

      \end{enumerate}'
    answer: （1）证明见解析；（2）$EF:DF=13:9$。
    subquestions:
    - latex: 求证：$\triangle FDB\sim\triangle FEC$；
    - latex: 若 $AB=15$，$AC=18$，$AD=6$，求 $EF:DF$。
    solution_steps:
    - title: 第（1）问：由比例判相似
      content: '因为 $AD\cdot AB=AE\cdot AC$，所以 $\dfrac{AD}{AE}=\dfrac{AC}{AB}$。

        又因为 $\angle DAC=\angle EAB$，所以 $\triangle DAC\sim\triangle EAB$，从而 $\angle ACD=\angle ABE$。

        因为 $\angle EFC=\angle DFB$，所以 $\triangle FDB\sim\triangle FEC$。'
    - title: 第（2）问：求线段比
      content: '由 $AD\cdot AB=AE\cdot AC$，且 $AB=15$，$AC=18$，$AD=6$，得 $6\times15=18\cdot AE$，所以 $AE=5$，$BD=15-6=9$，$EC=18-5=13$。

        由 $\triangle FDB\sim\triangle FEC$，得 $\dfrac{EF}{DF}=\dfrac{CE}{BD}$，所以 $EF:DF=13:9$。'
