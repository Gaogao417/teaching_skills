    stem_latex: '二次函数 $y=ax^2+bx+2$ 的自变量 $x$ 和函数值 $y$ 的部分取值如下表：

      \[

      \begin{array}{c|ccccccc}

      x & \cdots & -1 & 0 & 1 & 2 & 3 & \cdots\\ \hline

      y & \cdots & 5 & 2 & n & p & 5 & \cdots

      \end{array}

      \]

      比较大小：$n$ \underline{\hspace{1cm}} $p$（填“$>$”“$<$”或“$=$”）。'
