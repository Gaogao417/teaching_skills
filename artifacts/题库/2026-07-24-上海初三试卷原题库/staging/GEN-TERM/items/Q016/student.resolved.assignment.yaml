    stem_latex: 广场上音乐喷泉的喷头与地面齐平，喷出的水线呈一条抛物线。水线上水珠的高度 $y$（米）关于水珠与喷头的水平距离 $x$（米）的函数解析式是 $y=-\frac12x^2+3x$。水珠从喷出到落地时的水平距离为 \underline{\hspace{2cm}} 米。
