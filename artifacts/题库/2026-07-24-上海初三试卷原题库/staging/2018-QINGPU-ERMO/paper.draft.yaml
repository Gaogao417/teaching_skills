    block:
      stem_latex: 如图1，已知扇形 $MON$ 的半径为 $\sqrt{2}$，$\angle MON=90^\circ$，点 $B$ 在弧 $MN$ 上移动，联结 $BM$，作 $OD\perp BM$，垂足为点 $D$，$C$ 为线段 $OD$ 上一点，且 $OC=BM$，联结 $BC$ 并延长交半径 $OM$ 于点 $A$，设 $OA=x$，$\angle COM$ 的正切值为 $y$。(1) 如图2，当 $AB\perp OM$ 时，求证：$AM=AC$；(2) 求 $y$ 关于 $x$ 的函数关系式，并写出定义域；(3) 当 $\triangle OAC$ 为等腰三角形时，求 $x$ 的值。
      answer: (2) $y=\frac{x}{x+\sqrt{2}}$（$0<x<\sqrt{2}$）；(3) $x=\frac{\sqrt{14}-\sqrt{2}}{2}$
      clue: 圆的综合题
      solution_steps:
      - (1) $\because OD\perp BM$，$AB\perp OM$，$\therefore \angle ODM=\angle BAM=90^\circ$。$\because \angle ABM+\angle M=\angle DOM+\angle M$，$\therefore \angle ABM=\angle DOM$。$\because \angle OAC=\angle BAM$，$OC=BM$，$\therefore \triangle OAC\cong\triangle BAM$，$\therefore AC=AM$。
      - (2) 过 $D$ 作 $DE\parallel AB$ 交 $OM$ 于 $E$。$\because OB=OM$，$OD\perp BM$，$\therefore BD=DM$。$\because DE\parallel AB$，$\therefore AE=EM=\frac{1}{2}(\sqrt{2}-x)$，$OE=\frac{1}{2}(\sqrt{2}+x)$。
      - $\because DE\parallel AB$，$\therefore \frac{OA}{OE}=\frac{OC}{OD}=\frac{2DM}{OD}$，在 Rt$\triangle ODM$ 中 $y=\frac{DM}{OD}=\frac{OA}{2OE}=\frac{x}{2\times\frac{1}{2}(\sqrt{2}+x)}=\frac{x}{x+\sqrt{2}}$，定义域 $0<x<\sqrt{2}$。
      - (3)(i) 当 $OA=OC$ 时，$DM=\frac{1}{2}BM=\frac{1}{2}OC=\frac{1}{2}x$，$OD=\sqrt{2-\frac{1}{4}x^2}$，由 $y=\frac{DM}{OD}$ 得 $\frac{\frac{1}{2}x}{\sqrt{2-\frac{1}{4}x^2}}=\frac{x}{x+\sqrt{2}}$，解得 $x=\frac{\sqrt{14}-\sqrt{2}}{2}$（负值舍去）。
      - (ii) 当 $AO=AC$ 时，$\angle ACO>\angle COB=\angle AOC$，即 $\angle ACO>\angle AOC$，此种情况不存在；(iii) 当 $CO=CA$ 时，可得 $\angle BOA>90^\circ$，与 $\angle BOA\leq 90^\circ$ 矛盾，不存在。故 $x=\frac{\sqrt{14}-\sqrt{2}}{2}$。
