    block:
      stem_latex: 已知：如图，在平面直角坐标系 $xOy$ 中，抛物线 $y=ax^2+bx+3$ 的图象与 $x$ 轴交于点 $A(3,0)$，与 $y$ 轴交于点 $B$，顶点 $C$ 在直线 $x=2$ 上，将抛物线沿射线 $AC$ 的方向平移，当顶点 $C$ 恰好落在 $y$ 轴上的点 $D$ 处时，点 $B$ 落在点 $E$ 处。(1) 求这个抛物线的解析式；(2) 求平移过程中线段 $BC$ 所扫过的面积；(3) 已知点 $F$ 在 $x$ 轴上，点 $G$ 在坐标平面内，且以点 $C$、$E$、$F$、$G$ 为顶点的四边形是矩形，求点 $F$ 的坐标。
      answer: (1) $y=x^2-4x+3$；(2) 面积为 $12$；(3) $F\left(\frac{5}{2},0\right)$、$\left(-\frac{5}{2},0\right)$、$\left(\sqrt{5},0\right)$、$\left(-\sqrt{5},0\right)$
      clue: 二次函数综合题
      solution_steps:
      - (1) $\because$ 顶点 $C$ 在直线 $x=2$ 上，$\therefore -\frac{b}{2a}=2$，$\therefore b=-4a$。将 $A(3,0)$ 代入 $y=ax^2+bx+3$ 得 $9a+3b+3=0$，解得 $a=1,b=-4$，$\therefore$ 抛物线的解析式为 $y=x^2-4x+3$。
      - (2) $y=x^2-4x+3=(x-2)^2-1$，$\therefore C(2,-1)$。求得 $B(0,3)$，$D(0,-3)$，$BD=6$，$CN=2$。线段 $BC$ 所扫过的面积为平行四边形 $BCDE$ 的面积，$S=2S_{\triangle BCD}=2\times\frac{1}{2}\times BD\cdot CN=6\times 2=12$。
      - (3) 联结 $CE$，四边形 $BCDE$ 是平行四边形，点 $O$ 是对角线交点，$OE=OC=\sqrt{5}$。
      - (i) 当 $CE$ 为矩形的一边时，过 $C$ 作 $CF_1\perp CE$ 交 $x$ 轴于 $F_1(a,0)$，由 $OF_1^2=OC^2+CF_1^2$ 即 $a^2=(a-2)^2+5$，解得 $a=\frac{5}{2}$，$\therefore F_1\left(\frac{5}{2},0\right)$；同理 $F_2\left(-\frac{5}{2},0\right)$。
      - (ii) 当 $CE$ 为矩形的对角线时，以 $O$ 为圆心、$OC$ 长为半径画弧交 $x$ 轴于 $F_3,F_4$，$OF_3=OF_4=OC=\sqrt{5}$，得 $F_3\left(\sqrt{5},0\right)$、$F_4\left(-\sqrt{5},0\right)$。
