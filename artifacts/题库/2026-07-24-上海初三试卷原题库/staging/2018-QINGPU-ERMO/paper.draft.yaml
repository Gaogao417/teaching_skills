    block:
      stem_latex: 如图，海中有一个小岛 $A$，该岛四周 11 海里范围内有暗礁。有一货轮在海面上由西向正东方向航行，到达 $B$ 处时它在小岛南偏西 $60^\circ$ 的方向上，再往正东方向行驶 10 海里后恰好到达小岛南偏西 $45^\circ$ 方向上的点 $C$ 处。问：如果货轮继续向正东方向航行，是否会有触礁的危险？（参考数据：$\sqrt{2}\approx 1.41$，$\sqrt{3}\approx 1.73$）
      answer: 货轮继续向正东方向航行，不会有触礁的危险
      clue: 解直角三角形的应用——方向角问题
      solution_steps:
      - 过点 $A$ 作 $AH\perp BC$ 于 $H$。由题意 $\angle BAH=60^\circ$，$\angle CAH=45^\circ$，$BC=10$。设 $AH=x$，则 $CH=x$。
      - 在 Rt$\triangle ABH$ 中，$\because \tan\angle BAH=\frac{BH}{AH}$，$\therefore \tan 60^\circ=\frac{10+x}{x}$，即 $\sqrt{3}x=10+x$，
      - 解得 $x=5\sqrt{3}+5\approx 13.65$。$\because 13.65>11$，$\therefore$ 货轮继续向正东方向航行，不会有触礁的危险。
