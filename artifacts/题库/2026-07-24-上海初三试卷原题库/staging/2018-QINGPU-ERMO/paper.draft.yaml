    block:
      stem_latex: 如图，在梯形 $ABCD$ 中，$AD\parallel BC$，对角线 $AC$、$BD$ 交于点 $M$，点 $E$ 在边 $BC$ 上，且 $\angle DAE=\angle DCB$，联结 $AE$，$AE$ 与 $BD$ 交于点 $F$。(1) 求证：$DM^2=MF\cdot MB$；(2) 联结 $DE$，如果 $BF=3FM$，求证：四边形 $ABED$ 是平行四边形。
      answer: (1) $DM^2=MF\cdot MB$；(2) 四边形 $ABED$ 是平行四边形
      clue: 相似三角形的判定与性质、平行四边形的判定
      solution_steps:
      - (1) $\because AD\parallel BC$，$\therefore \angle DAE=\angle AEB$。$\because \angle DCB=\angle DAE$，$\therefore \angle DCB=\angle AEB$，$\therefore AE\parallel DC$。
      - $\therefore \triangle AMF\sim\triangle CMD$，$\therefore \frac{FM}{DM}=\frac{AM}{CM}$。
      - $\because AD\parallel BC$，$\therefore \triangle AMD\sim\triangle CMB$，$\therefore \frac{AM}{CM}=\frac{DM}{BM}$，$\therefore \frac{FM}{DM}=\frac{DM}{BM}$，即 $MD^2=MF\cdot MB$。
      - (2) 设 $FM=a$，则 $BF=3a$，$BM=4a$。由 $MD^2=MF\cdot MB$ 得 $MD^2=a\cdot 4a$，$\therefore MD=2a$，$\therefore DF=DM+MF=3a=BF$。
      - $\because AD\parallel BC$，$\therefore \triangle AFD\sim\triangle EFB$，$\therefore \frac{AF}{EF}=\frac{DF}{BF}=1$，$\therefore AF=EF$。对角线互相平分，$\therefore$ 四边形 $ABED$ 是平行四边形。
