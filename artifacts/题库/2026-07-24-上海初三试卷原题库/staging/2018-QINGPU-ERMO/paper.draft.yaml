      stem_latex: 下列方程有实数根的是（ ）
      choices:
      - $x^4+2=0$
      - $\sqrt{x^2-2}=-1$
      - $x^2+2x-1=0$
      - $\frac{x}{x-1}=\frac{1}{x-1}$
      answer: C
      clue: 根的判别式、高次方程、无理方程、分式方程
      solution_steps:
      - A：$\because x^4>0$，$\therefore x^4+2=0$ 无解；
      - B：$\because \sqrt{x^2-2}\geq 0$，$\therefore \sqrt{x^2-2}=-1$ 无解；
      - C：$x^2+2x-1=0$，$\Delta=4+8=12>0$，方程有实数根；
      - D：解分式方程得 $x=1$，经检验是增根；故选 C。
