    stem_latex: 在四边形 $ABCD$ 中，对角线 $AC$ 与 $BD$ 交于点 $O$，下列说法正确的是（　）。
    choices:
    - 如果 $AO\cdot BD=OD\cdot AC$，那么 $AB\parallel CD$
    - 如果 $AO\cdot OC=OD\cdot OB$，那么 $AB\parallel CD$
