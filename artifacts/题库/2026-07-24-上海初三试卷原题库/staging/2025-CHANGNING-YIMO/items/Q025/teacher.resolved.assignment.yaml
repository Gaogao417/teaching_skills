    id: Q025
    points: 14
    stem_latex: 已知在 $\triangle ABC$ 中，$AC=BC$，点 $D、E、F$ 分别在边 $AB、AC、BC$ 上，且 $\angle ADE=\angle BDF$，联结 $EF$。（1）如图1，如果 $BD=\dfrac14AB，DE\perp EF$，求 $\angle EDF$ 的余切值；（2）如图2，联结 $CD$ 交 $EF$ 于点 $G$，如果 $\dfrac{AE}{BF}=\dfrac23$，求 $\dfrac{EG}{FG}$ 的值；（3）如果 $AE=2，EC=1，\angle CEF=\angle AED$，且 $\triangle ADE$ 与 $\triangle EFC$ 相似，求 $AD$ 的长。
    answer: （1）$\cot\angle EDF=\dfrac3{\sqrt7}$；（2）$\dfrac{EG}{FG}=\dfrac32$；（3）$AD=5-\sqrt{13}$ 或 $\dfrac32$。
    solution_steps:
    - title: 解答
      content: 利用相似三角形、面积比和分类讨论，得到 $\cot\angle EDF=\dfrac3{\sqrt7}$，$\dfrac{EG}{FG}=\dfrac32$，且 $AD=5-\sqrt{13}$ 或 $\dfrac32$。
