    stem_latex: 如图，在直角坐标平面 $xOy$ 内，以点 $C$ 为顶点的抛物线 $y=x^2+bx+c$ 经过点 $A(4,3)$，与 $y$ 轴交于点 $B$，对称轴为直线 $x=2$。（1）求抛物线的表达式；（2）平移上述抛物线，所得新抛物线的对称轴为直线 $x=t$，顶点为点 $P$。①联结 $AB$，如果点 $P$ 在 $x$ 轴上且新抛物线与线段 $AB$ 有公共点，求 $t$ 的取值范围；②设新抛物线与直线 $x=2$ 交于点 $D$，如果点 $P$ 在原抛物线上，且 $\angle CPD=2\angle CBO$，求点 $P$ 的坐标。
