    stem_latex: 如图，在 $\triangle ABC$ 中，点 $D、E$ 分别在边 $AB、BC$ 上，联结 $CD、AE$ 交于点 $F$，$AF=FC，\angle ADC=\angle ACB$。（1）求证：$AC^2=CD\cdot AE$；（2）如果点 $E$ 是边 $BC$ 的中点，求证：$BC^2=2AD\cdot AB$。
    answer: 两个结论均成立。
    solution_steps:
    - title: 证明
      content: 通过两组三角形相似分别建立比例关系，可证 $AC^2=CD\cdot AE$ 及 $BC^2=2AD\cdot AB$。
