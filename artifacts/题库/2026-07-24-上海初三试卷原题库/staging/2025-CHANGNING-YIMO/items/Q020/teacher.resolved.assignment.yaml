  - type: problem
    id: Q020
    points: 10
    stem_latex: 如图，已知在 $\triangle ABC$ 中，中线 $AD、BE$ 交于点 $G$，$EF\parallel BC$ 交 $AD$ 于点 $F$。（1）如果 $FG=1$，求 $GD$ 和 $AF$ 的长；（2）如果 $\overrightarrow{AB}=\vec a，\overrightarrow{AC}=\vec b$，用 $\vec a、\vec b$ 表示 $\overrightarrow{EF}$。
    answer: （1）$GD=2，AF=3$；（2）$\overrightarrow{EF}=\dfrac14\vec a-\dfrac14\vec b$。
    solution_steps:
    - title: 解答
      content: 根据重心性质和平行线比例求得 $GD=2，AF=3$，并有 $\overrightarrow{EF}=\dfrac14\vec a-\dfrac14\vec b$。
