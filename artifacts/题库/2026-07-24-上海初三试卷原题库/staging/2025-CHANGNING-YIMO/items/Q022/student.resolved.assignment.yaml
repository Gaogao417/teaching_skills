    stem_latex: 如图是某地下车库的剖面图。无人机位于点 $E$，$AD$ 与底板 $BR$ 平行，测得 $AD=11.6$ 米，在点 $E$ 处测得坡道 $AB$ 上点 $C$ 的俯角为 $26.6^\circ$；$DE\perp AD$，$CE$ 与底板 $BR$ 平行，$DE=1.8$ 米。（1）求坡道 $AB$ 的坡度；（2）结合图中 $AP=16.4$ 米、$\angle PFA=45^\circ$ 等条件，判断高3米的货车能否进入地下车库并说明理由。（参考数据：$\sin26.6^\circ=0.45，\cos26.6^\circ=0.89，\tan26.6^\circ=0.5$。）
