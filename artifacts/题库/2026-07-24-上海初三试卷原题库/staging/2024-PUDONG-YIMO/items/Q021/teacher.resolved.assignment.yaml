  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在四边形 $ABCD$ 中，$AD\parallel BC、\angle ABC=90^\circ$，对角线 $AC、BD$ 相交于点 $O$，$AD=2、AB=3、BC=4$。（1）求 $\triangle
      BOC$ 的面积；（2）求 $\sin\angle ACD$。
    answer: （1）$S_{\triangle BOC}=4$；（2）$\sin\angle ACD=\frac{6\sqrt{13}}{65}$。
    solution_steps:
    - title: 解答
      content: 由平行线和相似三角形得 $OC/AC=2/3$。$S_{\triangle ABC}=6$，且 $\triangle BOC$ 与 $\triangle ABC$ 同高，所以 $S_{\triangle BOC}=4$。作辅助垂线计算得
        $DC=\sqrt{13}$、相应高 $DH=6/5$，因此 $\sin\angle ACD=DH/DC=6\sqrt{13}/65$。
