  - type: problem
    id: Q020
    points: 10
    stem_latex: 如图，在 $\triangle ABC$ 中，点 $D、E$ 分别在边 $AB、AC$ 上，且 $AD=2、DB=4、AE=3、EC=6$。（1）求 $\frac{DE}{BC}$；（2）联结 $DC$，如果 $\overrightarrow{DE}=\vec
      a、\overrightarrow{DA}=\vec b$，用 $\vec a、\vec b$ 表示 $\overrightarrow{CD}$。
    answer: （1）$\frac{DE}{BC}=\frac13$；（2）$\overrightarrow{CD}=2\vec b-3\vec a$。
    solution_steps:
    - title: 解答
      content: 由 $AD/DB=AE/EC=1/2$ 得 $DE\parallel BC$，故 $DE/BC=AD/AB=1/3$。又 $\overrightarrow{BC}=3\vec a、\overrightarrow{BD}=2\vec
        b$，所以 $\overrightarrow{CD}=\overrightarrow{BD}-\overrightarrow{BC}=2\vec b-3\vec a$。
