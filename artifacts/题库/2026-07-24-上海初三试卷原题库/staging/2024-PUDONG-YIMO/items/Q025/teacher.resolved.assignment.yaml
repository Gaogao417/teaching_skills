  - type: problem
    id: Q025
    points: 14
    stem_latex: 正方形 $ABCD$ 的边长为 $6$，点 $E$ 在射线 $BC$ 上且不与 $B、C$ 重合。过点 $A$ 作 $AF\perp AE$，交边 $CD$ 的延长线于 $F$，直线 $EF$ 分别交射线 $AC、AD$
      于点 $M、N$。（1）当 $E$ 在边 $BC$ 上且 $ND/AN=1/5$ 时，求 $\cot\angle BAE$；（2）当 $E$ 在边 $BC$ 延长线上，设 $BE=x、y=EN\cdot MF$，求 $y$ 关于 $x$
      的函数解析式和定义域；（3）当 $CE=3$ 时，求 $\triangle EMC$ 的面积。
    answer: （1）$2$ 或 $3$；（2）$y=x^2+36(x>6)$；（3）$\frac{27}{8}$ 或 $\frac{45}{8}$。
    solution_steps:
    - title: 解答
      content: （1）设 $BE=x$，由全等与平行线比例关系得到方程 $x^2-5x+6=0$，故 $x=2$ 或 $3$，从而余切为 $3$ 或 $2$。（2）由相似三角形得 $EN\cdot MF=AE^2$，而 $AE^2=x^2+36$，定义域为
        $x>6$。（3）按 $E$ 在边 $BC$ 上或延长线上分类，通过相似三角形面积比求得 $27/8$ 或 $45/8$。
