    stem_latex: 正方形 $ABCD$ 的边长为 $6$，点 $E$ 在射线 $BC$ 上且不与 $B、C$ 重合。过点 $A$ 作 $AF\perp AE$，交边 $CD$ 的延长线于 $F$，直线 $EF$ 分别交射线 $AC、AD$ 于点 $M、N$。（1）当 $E$ 在边 $BC$ 上且 $ND/AN=1/5$ 时，求 $\cot\angle BAE$；（2）当 $E$ 在边 $BC$ 延长线上，设 $BE=x、y=EN\cdot MF$，求 $y$ 关于 $x$ 的函数解析式和定义域；（3）当 $CE=3$ 时，求 $\triangle EMC$ 的面积。
