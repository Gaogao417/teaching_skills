  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，在梯形 $ABCD$ 中，$AD\parallel BC$，对角线 $AC、BD$ 相交于点 $E$，且 $\angle DEC=\angle DCB$。（1）证明 $\frac{AD}{CE}=\frac{AC}{CB}$；（2）点
      $F$ 在 $DB$ 的延长线上，联结 $AF$，$AF^2=AE\cdot AC$，证明 $EC\cdot AF=BC\cdot AE$。
    answer: 见证明。
    solution_steps:
    - title: 解答
      content: （1）由 $AD\parallel BC$ 和题设角关系得 $\triangle ADC\sim\triangle CEB$，所以 $AD/CE=AC/CB$。（2）由角关系得 $\triangle AED\sim\triangle
        ADC$，从而 $AD^2=AE\cdot AC=AF^2$，故 $AD=AF$；再结合 $AD/BC=AE/EC$ 得 $EC\cdot AF=BC\cdot AE$。
