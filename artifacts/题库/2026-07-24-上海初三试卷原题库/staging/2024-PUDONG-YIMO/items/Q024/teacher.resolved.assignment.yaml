  - type: problem
    id: Q024
    points: 12
    stem_latex: 抛物线 $M:y=-x^2+bx+c$ 经过点 $A(2,2)、B(0,2)$，顶点为 $C$，对称轴与 $x$ 轴交于点 $D$。（1）求抛物线 $M$ 的表达式和 $C$；（2）点 $P$ 在 $x$ 轴上，当
      $\triangle AOP$ 与 $\triangle ACD$ 相似时，求 $P$；（3）将 $M$ 向下平移 $t(t>0)$ 个单位得到 $N$，顶点为 $E$，再把点 $C$ 绕点 $E$ 顺时针旋转 $135^\circ$
      得到 $F$。当 $F$ 在 $N$ 上时，求 $t$。
    answer: （1）$y=-x^2+2x+2$，$C(1,3)$；（2）$P(6,0)$ 或 $P(\frac43,0)$；（3）$t=\sqrt2$。
    solution_steps:
    - title: 解答
      content: 代入 $A、B$ 得 $b=2、c=2$，所以 $M:y=-x^2+2x+2$，顶点 $C(1,3)$。由相似三角形的两种对应关系分别得 $OP=6$ 或 $OP=4/3$。平移后顶点 $E(1,3-t)$，按旋转关系写出
        $F$ 坐标并代入 $N$，得 $t=0$ 或 $t=\sqrt2$；因 $t>0$，故 $t=\sqrt2$。
