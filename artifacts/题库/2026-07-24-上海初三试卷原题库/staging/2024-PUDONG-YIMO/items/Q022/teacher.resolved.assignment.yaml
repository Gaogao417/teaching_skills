  - type: problem
    id: Q022
    points: 10
    stem_latex: 阅读题面中求 $\tan15^\circ$ 的方法，完成问题探究、知识迁移和拓展应用：在直角三角形中通过延长斜边并构造等腰三角形求半角正切；并证明拓展图中 $\tan\angle BPE=1$。
    answer: 问题探究：$\angle D=22.5^\circ$，$BD=\sqrt2t$，$\tan22.5^\circ=\sqrt2-1$；知识迁移：$\tan\frac12\angle ABC=\frac{\sqrt{13}-3}{2}$；拓展应用：$\tan\angle
      BPE=1$。
    solution_steps:
    - title: 解答
      content: 问题探究中由 $BD=AB$ 得 $\angle D=\angle BAD=22.5^\circ$，再由直角等腰三角形得 $AB=BD=\sqrt2t$，从而 $\tan22.5^\circ=\sqrt2-1$。知识迁移中设
        $AC=2k、BC=3k$，则 $AB=BD=\sqrt{13}k$，所以半角正切为 $(\sqrt{13}-3)/2$。拓展应用联结 $DE$，由勾股关系和等腰三角形角关系推得 $\angle BPE=45^\circ$，故
        $\tan\angle BPE=1$。
