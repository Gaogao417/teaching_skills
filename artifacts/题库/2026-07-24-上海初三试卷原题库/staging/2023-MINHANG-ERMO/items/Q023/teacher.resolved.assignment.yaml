  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，扇形 $AOB$ 中，$C,D$ 在 $\overset{\frown}{AB}$ 上，$\overset{\frown}{AD}=\overset{\frown}{CB}$，$F,E$ 分别在半径 $OA,OB$ 上，$OF=OE$，联结 $DE,CF$。（1）求证：$DE=CF$；（2）$P$ 为 $\overset{\frown}{CD}$ 中点，联结 $CD,EF,PO$，$PO$ 交 $CD$ 于 $M$、交 $EF$ 于 $N$，若 $PO\parallel DE$，求证：四边形 $MNED$ 是矩形．
    answer: (1)(2) 见解析
    clue: (1) 由等弧得角相等，证 $\triangle FOC\cong\triangle EOD$；(2) 由对称得 $EF\parallel CD$，结合 $PO\parallel DE$ 与垂直证矩形。
    solution_steps:
    - (1) $\overset{\frown}{AC}=\overset{\frown}{BD}\Rightarrow \angle FOC=\angle EOD$，$OF=OE$，$OC=OD$，$\triangle FOC\cong\triangle EOD$（SAS），$DE=CF$。
    - (2) $P$ 为 $\overset{\frown}{CD}$ 中点 $\Rightarrow OP\perp CD$，由对称 $EF\parallel CD$；又 $PO\parallel DE$，$\angle ONE=\angle OMD=90\degree$，四边形 $MNED$ 为矩形。
