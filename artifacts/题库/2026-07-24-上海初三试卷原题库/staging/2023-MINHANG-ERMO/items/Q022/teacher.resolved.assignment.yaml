  - type: problem
    id: Q022
    points: 10
    stem_latex: 如图，修建公路 $AD$ 需挖隧道 $BC$，$A,B,C,D$ 共线，$CE\perp AD$，$\angle ABE=143\degree$，$BE=1500$ 米。（1）求 $BC$（精确到个位）；（2）改用从 $B,C$ 两端同时相向开挖，效率提高20%，提前2天完工，求原计划单向每天挖多少米？（参考数据：$\cos37\degree\approx0.80$）．
    answer: (1) 约 $1200$ 米；(2) 原计划单向每天挖 $100$ 米
    clue: (1) 用 $\cos37\degree$ 求 $BC$；(2) 列分式方程，注意检验。
    solution_steps:
    - (1) $\angle CBE=37\degree$，$BC=BE\cos37\degree\approx1500\times0.80=1200$ 米。
    - (2) 设原计划每天 $x$ 米，$\dfrac{1200}{x}=\dfrac{1200}{1.2x}+2$，解得 $x=100$（检验合格）。
