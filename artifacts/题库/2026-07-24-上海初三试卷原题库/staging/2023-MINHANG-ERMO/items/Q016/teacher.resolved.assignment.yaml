  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，$A$ 在直线 $y=2x$ 上横坐标为1，$P$ 在 $x$ 轴正半轴，$B$ 在反比例函数 $y=\dfrac{k}{x}$（$x>0$）图像上，四边形 $OAPB$ 是矩形，那么 $k=$ ______
    answer: $-8$
    clue: 由矩形性质与相似求 $P,B$ 坐标，代入反比例解析式。
    solution_steps:
    - $A(1,2)$，$AO=\sqrt{5}$；$\triangle AOC\sim\triangle POA\Rightarrow PO=5$，$P(5,0)$。
    - 矩形对角线交点 $D(\dfrac{5}{2},0)$，$B(4,-2)$；代入 $-2=\dfrac{k}{4}$，$k=-8$。
