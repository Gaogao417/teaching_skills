  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 一斗清酒值10斗谷子，一斗酗酒值3斗谷子，拿30斗谷子共换5斗酒。设清酒 $x$ 斗，可列方程为 ______
    answer: $10x+3(5-x)=30$
    clue: 以谷子总量为等量列方程。
    solution_steps:
    - 清酒 $x$ 斗值 $10x$，酗酒 $(5-x)$ 斗值 $3(5-x)$，$10x+3(5-x)=30$。
