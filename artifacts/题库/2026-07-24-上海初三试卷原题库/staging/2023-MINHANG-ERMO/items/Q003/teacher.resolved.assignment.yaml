    stem_latex: 一次函数 $y=kx+b$（$k\neq0$）的图像经过第一、二、三象限，它的解析式可以是（\quad）
    choices:
    - $y=x+1$
    - $y=x-1$
    - $y=-x+1$
    - $y=-x-1$
    answer: A
    clue: 过一、二、三象限则 $k>0$，$b>0$。
    solution_steps:
    - 只有 $y=x+1$ 满足 $k=1>0$，$b=1>0$。
