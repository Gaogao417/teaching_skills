    id: Q017
    points: 4
    stem_latex: 如图，菱形 $ABCD$ 中 $AB=6$，$\angle A=80\degree$，将菱形绕 $D$ 逆时针旋转后 $A$ 落在初始边 $AB$ 上的点 $E$，那么 $E$ 到直线 $BD$ 的距离为 ______
    answer: '3'
    clue: 由旋转与菱形性质求 $\angle BDE$，再用正弦求距离。
    solution_steps:
    - $DE=AD=6$，$\angle ADB=50\degree$，$\angle ADE=20\degree$，$\angle BDE=30\degree$。
    - 距离 $=6\sin30\degree=3$。
