  - type: problem
    id: Q025
    points: 14
    stem_latex: 如图，Rt$\triangle ABC$ 中 $\angle ACB=90\degree$，$BC=1$，以 $BC$ 为边作 $\triangle DBC$（$D,A$ 在 $BC$ 异侧）满足 $BD=BC$，$\angle BCD=\angle ABC+45\degree$。（1）求证：$\angle A=\angle ABD$；（2）$E$ 为 $BC$ 中点，连 $DE$ 延长交 $AB$ 于 $F$，当 $\triangle BEF$ 为直角三角形时，求 $AC$；（3）设 $AB=x$，$CD=y$，求 $y$ 关于 $x$ 的函数解析式及定义域．
    answer: (1) 见解析；(2) $AC=2-\sqrt{3}$ 或 $\dfrac{1}{2}$；(3) $y=\dfrac{\sqrt{2}}{x}-2\sqrt{1-\dfrac{1}{x^{2}}}$（$1<x<\sqrt{2}$）
    clue: (1) 等腰 + 角度和转化；(2) 分 $\angle FEB=90\degree$、$\angle EFB=90\degree$ 两情形；(3) 作 $DM\perp AB$，用相似表示 $CD$。
    solution_steps:
    - (1) $BD=BC\Rightarrow \angle BCD=\angle D=\angle ABC+45\degree$，$\angle ABD=90\degree-\angle ABC=\angle A$。
    - (2)① $\angle FEB=90\degree$ 时 $\triangle BDC$ 等边，$\angle ABC=15\degree$，$AC=2-\sqrt{3}$；② $\angle EFB=90\degree$ 时 $AC=\dfrac{1}{2}$。
    - (3) 作 $DM\perp AB$，由 $\triangle ACB\sim\triangle BMD$ 得 $DM=\dfrac{1}{x}$，$BM=\sqrt{1-\dfrac{1}{x^{2}}}$，$y=CD=\dfrac{\sqrt{2}}{x}-2\sqrt{1-\dfrac{1}{x^{2}}}$（$1<x<\sqrt{2}$）。
