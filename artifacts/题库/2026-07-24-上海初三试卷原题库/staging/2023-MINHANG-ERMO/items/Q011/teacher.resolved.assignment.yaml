  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 如图，梯形 $ABCD$，$AD\parallel BC$，$BC=2AD$，设 $\vec{AD}=\vec{a}$，$\vec{AB}=\vec{b}$，那么 $\vec{AC}=$ ______（用 $\vec{a},\vec{b}$ 表示）
    answer: $2\vec{a}+\vec{b}$
    clue: $\vec{AC}=\vec{AB}+\vec{BC}$，$\vec{BC}=2\vec{a}$。
    solution_steps:
    - $\vec{BC}=2\vec{AD}=2\vec{a}$，$\vec{AC}=\vec{AB}+\vec{BC}=\vec{b}+2\vec{a}$。
