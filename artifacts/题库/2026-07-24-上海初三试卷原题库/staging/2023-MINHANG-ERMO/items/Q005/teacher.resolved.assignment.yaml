  - type: choice
    id: Q005
    points: 4
    stem_latex: 把抛物线 $y=2x^{2}$ 向下平移3个单位得新抛物线，下列描述不正确的是（\quad）
    choices:
    - 开口方向相同
    - 对称轴相同
    - 顶点的横坐标相同
    - 顶点的纵坐标相同
    answer: D
    clue: 平移不改变开口与对称轴，但顶点纵坐标改变。
    solution_steps:
    - 新抛物线 $y=2x^{2}-3$，顶点纵坐标 $0$ 与 $-3$ 不同，D 不正确。
