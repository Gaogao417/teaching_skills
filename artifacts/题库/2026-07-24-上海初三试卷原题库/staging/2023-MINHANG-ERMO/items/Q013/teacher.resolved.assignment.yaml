    stem_latex: 从甲、乙、丙三位宣讲员中随机抽取两人，恰好选中甲、丙两人的概率为 ______
    answer: $\dfrac{1}{3}$
    clue: 列举抽取两人的所有情况。
    solution_steps:
    - 三种情况（甲乙、甲丙、乙丙），甲丙占1种，$P=\dfrac{1}{3}$。
