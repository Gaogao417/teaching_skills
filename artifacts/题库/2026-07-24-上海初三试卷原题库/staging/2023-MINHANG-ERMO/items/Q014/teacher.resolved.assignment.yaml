    id: Q014
    points: 4
    stem_latex: 如果正六边形的半径长为 $2$，那么它的面积为 ______
    answer: $6\sqrt{3}$
    clue: 正六边形分为6个边长为半径的等边三角形。
    solution_steps:
    - $\triangle AOB$ 等边，$OG=\sqrt{3}$，$S_{\triangle AOB}=\sqrt{3}$，总面积 $6\sqrt{3}$。
