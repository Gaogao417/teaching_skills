  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 规定：两内角 $\alpha,\beta$ 满足 $2\alpha+\beta=90\degree$ 的三角形为"特征三角形"。如图，$\triangle ABC$ 中 $\angle ACB$ 为钝角，$AB=25$，$\tan A=\dfrac{4}{3}$，如果 $\triangle ABC$ 是特征三角形，那么 $AC=$ ______
    answer: $\dfrac{25}{3}$
    clue: 分 $\angle A=\alpha$ 与 $\angle A=\beta$ 两种情形讨论，结合三角函数求解。
    solution_steps:
    - 情形 $\angle A=\beta,\angle B=\alpha$ 时，$BC$ 平分 $\angle ABE$，由 $\tan A=\dfrac{4}{3}$ 及 $AB=25$ 解得 $AC=\dfrac{25}{3}$。
