  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，$\triangle ABC$ 中 $\angle ACB=90\degree$，$AC=2$，$BC=4$，$D$ 为 $AB$ 中点，过 $B$ 作 $CD$ 延长线的垂线交于 $E$。（1）求 $CD$；（2）求 $\dfrac{CD}{DE}$．
    answer: (1) $CD=\sqrt{5}$；(2) $\dfrac{CD}{DE}=\dfrac{5}{3}$
    clue: (1) 直角三角形斜边中线定理；(2) 证 $\triangle ACB\sim\triangle BEC$ 求 $BE$，再用勾股求 $DE$。
    solution_steps:
    - (1) $AB=2\sqrt{5}$，$D$ 为 $AB$ 中点，$CD=\dfrac{1}{2}AB=\sqrt{5}$。
    - (2) $\triangle ACB\sim\triangle BEC\Rightarrow BE=\dfrac{4\sqrt{5}}{5}$；$BD=\sqrt{5}$，$DE=\sqrt{BD^{2}-BE^{2}}=\dfrac{3\sqrt{5}}{5}$，$\dfrac{CD}{DE}=\dfrac{5}{3}$。
