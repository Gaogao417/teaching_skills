  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在 $\triangle ABC$ 中，$CD\perp AB$，$\sin A=\dfrac45$，$AB=13$，$CD=12$。求 $AD$ 的长和 $\tan B$ 的值。
    answer: $AD=9$，$\tan B=3$
    solution_steps:
    - title: 求 $AD$
      content: 在 $\mathrm{Rt}\triangle ACD$ 中，由 $\sin A=\frac{CD}{AC}=\frac45$ 得 $AC=15$，从而 $AD=9$。
    - title: 求 $\tan B$
      content: $BD=AB-AD=4$，所以 $\tan B=\dfrac{CD}{BD}=3$。
