  - type: choice
    id: Q005
    points: 4
    stem_latex: 已知四边形 $ABCD$ 中，$\angle A=\angle B=\angle C=90^\circ$。如果添加一个条件，即可推出该四边形是正方形，那么这个条件可以是（\quad）
    choices:
    - $\angle D=90^\circ$
    - $AB=CD$
    - $AD=BC$
    - $BC=CD$
    answer: D
    explanation: 已知条件先判定四边形为矩形；再由一组邻边 $BC=CD$ 相等可判定为正方形，故选 D。
