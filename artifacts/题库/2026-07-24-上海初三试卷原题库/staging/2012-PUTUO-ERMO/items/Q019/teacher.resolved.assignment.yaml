  - type: problem
    id: Q019
    points: 10
    stem_latex: 先化简，再求值：$\left(\dfrac{a^2-2a+1}{a^2-1}+\dfrac1a\right)\div\dfrac1{a+1}$，其中 $a=\sqrt2$。
    answer: $\dfrac{3\sqrt2}{2}$
    solution_steps:
    - title: 化简
      content: $\left(\dfrac{a-1}{a+1}+\dfrac1a\right)(a+1)=\dfrac{a^2+1}{a}$。
    - title: 代入
      content: 当 $a=\sqrt2$ 时，原式 $=\dfrac3{\sqrt2}=\dfrac{3\sqrt2}{2}$。
