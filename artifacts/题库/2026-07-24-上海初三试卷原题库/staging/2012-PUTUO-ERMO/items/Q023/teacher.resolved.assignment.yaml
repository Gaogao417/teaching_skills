  - type: problem
    id: Q023
    points: 12
    stem_latex: '如图，四边形 $ABCD$ 中，$AD\parallel BC$，点 $E$ 在 $CB$ 的延长线上，连接 $DE$ 交 $AB$ 于点 $F$，连接 $DB$，$\angle AFD=\angle DBE$，且 $DE^2=BE\cdot CE$。

      （1）求证：$\angle DBE=\angle CDE$；

      （2）当 $BD$ 平分 $\angle ABC$ 时，求证：四边形 $ABCD$ 是菱形。

      '
    answer: 证明见解析
    solution_steps:
    - title: 第（1）问
      content: 由 $DE^2=BE\cdot CE$ 得 $\dfrac{BE}{DE}=\dfrac{DE}{CE}$。又 $\angle E$ 为公共角，所以 $\triangle DBE\sim\triangle CDE$，从而 $\angle DBE=\angle CDE$。
    - title: 第（2）问
      content: 由 $\angle DBE=\angle AFD$ 及第（1）问得 $\angle CDE=\angle AFD$，故 $AB\parallel DC$。结合 $AD\parallel BC$，四边形 $ABCD$ 是平行四边形。又 $BD$ 平分 $\angle ABC$，结合平行线得 $AB=AD$，故该平行四边形是菱形。
