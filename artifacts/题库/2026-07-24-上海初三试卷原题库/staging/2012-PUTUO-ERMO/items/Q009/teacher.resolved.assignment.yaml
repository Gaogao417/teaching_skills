  - type: short_answer
    id: Q009
    points: 4
    stem_latex: 用换元法解分式方程 $\dfrac{x^2+1}{x}-\dfrac{2x}{x^2+1}=3$ 时，如果设 $\dfrac{x}{x^2+1}=y$，那么原方程可以化为关于 $y$ 的方程是 \underline{\hspace{3cm}}。
    answer: $2y^2+3y-1=0$
    solution_steps:
    - title: 换元
      content: 由 $y=\dfrac{x}{x^2+1}$，原方程化为 $\dfrac1y-2y=3$，整理得 $2y^2+3y-1=0$。
