    stem_latex: 在梯形的一条底边长为 $5$，中位线长为 $7$，那么另一条底边的长为 \underline{\hspace{2cm}}。
    answer: $9$
    solution_steps:
    - title: 中位线
      content: 设另一条底边长为 $x$，则 $\dfrac{5+x}{2}=7$，解得 $x=9$。
