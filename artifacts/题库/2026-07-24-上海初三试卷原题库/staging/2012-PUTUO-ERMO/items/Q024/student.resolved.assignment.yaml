    stem_latex: '二次函数 $y=\dfrac16(x+2\sqrt3)^2$ 的图象的顶点为 $A$，与 $y$ 轴交于点 $B$，以 $AB$ 为边在第二象限内作等边三角形 $ABC$。

      （1）求直线 $AB$ 的表达式和点 $C$ 的坐标；

      （2）点 $M(m,1)$ 在第二象限，且 $\triangle ABM$ 的面积等于 $\triangle ABC$ 的面积，求点 $M$ 的坐标；

      （3）以 $x$ 轴上的点 $N$ 为圆心、$1$ 为半径的圆，与以点 $C$ 为圆心、$CM$ 为半径的圆相切，直接写出点 $N$ 的坐标。

