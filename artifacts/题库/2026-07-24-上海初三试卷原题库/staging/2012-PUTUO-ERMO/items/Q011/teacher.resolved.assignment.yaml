    id: Q011
    points: 4
    stem_latex: 已知正比例函数 $y=(k-1)x$ 中，$y$ 的值随自变量 $x$ 的值增大而减小，那么 $k$ 的取值范围是 \underline{\hspace{2cm}}。
    answer: $k<1$
    solution_steps:
    - title: 利用单调性
      content: 由题意 $k-1<0$，所以 $k<1$。
