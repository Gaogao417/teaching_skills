  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 如图，将边长为 $4$ 的正方形 $ABCD$ 沿着折痕 $EF$ 折叠，使点 $B$ 落在边 $AD$ 的中点 $G$ 处，那么四边形 $BCFE$ 的面积等于 \underline{\hspace{2cm}}。
    answer: $6$
    solution_steps:
    - title: 求边长
      content: 由折叠得 $BE=GE$。设 $BE=x$，则 $AE=4-x$，$AG=2$，由 $(4-x)^2+2^2=x^2$ 得 $BE=2.5$。
    - title: 求面积
      content: 按原解答继续利用折叠角关系解直角三角形，得 $FC=0.5$，故 $S_{BCFE}=\dfrac12(BE+FC)\cdot BC=6$。
