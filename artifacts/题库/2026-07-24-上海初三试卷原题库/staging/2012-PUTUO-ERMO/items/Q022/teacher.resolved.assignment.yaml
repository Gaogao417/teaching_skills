  - type: problem
    id: Q022
    points: 10
    stem_latex: '图（甲）是 2011 年 6 月至 12 月上海商品房平均成交价格走势图（单位：万元/平方米）；图（乙）是 2011 年 12 月上海商品房成交价格段比例分布图，其中 $a$ 为每平方米成交价格。

      （1）写出图（甲）中七个月平均成交价格的中位数；

      （2）根据图（乙），求 $x$；

      （3）四个区域中每个区域随机抽出两个在售楼盘，共有可售商品房 2400 套，其中成交 200 套。估计全市 60000 套可售商品房中，已成交且每平方米价格低于 2 万元的套数。

      '
    answer: （1）$2.68$；（2）$6$；（3）$1150$ 套
    solution_steps:
    - title: 第（1）问
      content: 七个数据从小到大排列为 $2.43,2.56,2.61,2.68,2.68,2.69,2.70$，中位数为 $2.68$。
    - title: 第（2）问
      content: $x\%=1-55\%-17\%-22\%=6\%$，所以 $x=6$。
    - title: 第（3）问
      content: 估计全市成交套数为 $60000\times\frac{200}{2400}=5000$；其中价格低于 2 万元的比例为 $6\%+17\%=23\%$，故估计为 $5000\times23\%=1150$ 套。
