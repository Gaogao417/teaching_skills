  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases}x^2+5xy+6y^2=0,\\x+y=2.\end{cases}$
    answer: $(x,y)=(4,-2)$ 或 $(3,-1)$
    solution_steps:
    - title: 因式分解
      content: 由第一式得 $(x+2y)(x+3y)=0$，所以 $x+2y=0$ 或 $x+3y=0$。
    - title: 分别求解
      content: 分别与 $x+y=2$ 联立，得 $(x,y)=(4,-2)$ 或 $(3,-1)$。
