  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 在矩形 $ABCD$ 中，如果 $|\overrightarrow{AB}|=2$，$|\overrightarrow{BC}|=1$，那么 $|\overrightarrow{AB}+\overrightarrow{BC}|=$ \underline{\hspace{2cm}}。
    answer: $\sqrt5$
    solution_steps:
    - title: 向量与勾股定理
      content: $\overrightarrow{AB}+\overrightarrow{BC}=\overrightarrow{AC}$，且 $AC=\sqrt{2^2+1^2}=\sqrt5$。
