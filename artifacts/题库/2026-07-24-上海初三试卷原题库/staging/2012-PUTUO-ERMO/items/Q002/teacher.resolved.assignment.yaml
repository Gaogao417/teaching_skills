    stem_latex: 经过点 $(2,4)$ 的双曲线的表达式是（\quad）
    choices:
    - $y=2x$
    - $y=\dfrac{1}{2x}$
    - $y=\dfrac{8}{x}$
    - $y=x^2$
    answer: C
    explanation: 把 $(2,4)$ 代入各式，只有 $y=\frac8x$ 成立，故选 C。
