    stem_latex: 下列运算，计算结果错误的是（\quad）
    choices:
    - $a^4\cdot a^3=a^7$
    - $a^6\div a^3=a^3$
    - $(a^3)^2=a^5$
    - $a^3\cdot b^3=(a\cdot b)^3$
    answer: C
    explanation: 根据幂的运算法则，$(a^3)^2=a^6$，故选 C。
