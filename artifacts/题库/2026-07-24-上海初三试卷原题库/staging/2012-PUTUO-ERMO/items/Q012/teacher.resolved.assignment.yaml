  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 某种品牌的笔记本电脑原价为 $a$ 元，如果连续两次降价的百分率都为 $x$，那么两次降价后的价格为 \underline{\hspace{3cm}} 元。
    answer: $a(1-x)^2$
    solution_steps:
    - title: 连续降价
      content: 两次降价后的价格为 $a(1-x)(1-x)=a(1-x)^2$。
