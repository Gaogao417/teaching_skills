        official_solution:
          start_anchor: '8．（4分）方程'
          end_anchor: '9．（4分）用换元法'
          crops:
            - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/011.png
              box_px: [120, 120, 1370, 2050]
        block:
          stem_latex: '方程 $\sqrt{x^2-1}=2$ 的根是 \underline{\hspace{2cm}}。'
          answer: '$x=\pm\sqrt5$'
          solution_steps:
            - title: 解方程
              content: '两边平方，得 $x^2-1=4$，所以 $x=\pm\sqrt5$；经检验两根均符合原方程。'
      - item_id: Q009
        question_number: 9
        question_type: short_answer
        points: 4
        question_evidence:
          - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/002.png
            box_px: [140, 780, 1340, 1080]
        prompt: []
        official_solution:
          start_anchor: '9．（4分）用换元法'
          end_anchor: '10．（4分）如果关于 x'
          crops:
            - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/011.png
              box_px: [120, 120, 1370, 2050]
            - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/012.png
              box_px: [120, 120, 1370, 2050]
        block:
          stem_latex: '用换元法解分式方程 $\dfrac{x^2+1}{x}-\dfrac{2x}{x^2+1}=3$ 时，如果设 $\dfrac{x}{x^2+1}=y$，那么原方程可以化为关于 $y$ 的方程是 \underline{\hspace{3cm}}。'
          answer: '$2y^2+3y-1=0$'
          solution_steps:
            - title: 换元
              content: '由 $y=\dfrac{x}{x^2+1}$，原方程化为 $\dfrac1y-2y=3$，整理得 $2y^2+3y-1=0$。'
      - item_id: Q010
        question_number: 10
        question_type: short_answer
        points: 4
        question_evidence:
          - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/002.png
            box_px: [140, 1030, 1340, 1220]
        prompt: []
        official_solution:
          start_anchor: '10．（4分）如果关于 x'
          end_anchor: '11．（4分）已知正比例函数'
          crops:
            - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/012.png
              box_px: [120, 120, 1370, 2050]
        block:
          stem_latex: '如果关于 $x$ 的方程 $x^2-2x+a=0$ 有两个相等的实数根，那么 $a=$ \underline{\hspace{2cm}}。'
          answer: '$1$'
          solution_steps:
            - title: 判别式
              content: '$\Delta=4-4a=0$，解得 $a=1$。'
      - item_id: Q011
        question_number: 11
        question_type: short_answer
        points: 4
        question_evidence:
          - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/002.png
            box_px: [140, 1140, 1340, 1360]
        prompt: []
        official_solution:
          start_anchor: '11．（4分）已知正比例函数'
          end_anchor: '12．（4分）某种品牌'
          crops:
            - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/012.png
              box_px: [120, 120, 1370, 2050]
            - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/013.png
              box_px: [120, 120, 1370, 2050]
        block:
          stem_latex: '已知正比例函数 $y=(k-1)x$ 中，$y$ 的值随自变量 $x$ 的值增大而减小，那么 $k$ 的取值范围是 \underline{\hspace{2cm}}。'
          answer: '$k<1$'
          solution_steps:
            - title: 利用单调性
              content: '由题意 $k-1<0$，所以 $k<1$。'
      - item_id: Q012
        question_number: 12
        question_type: short_answer
        points: 4
        question_evidence:
          - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/002.png
            box_px: [140, 1300, 1340, 1510]
        prompt: []
        official_solution:
          start_anchor: '12．（4分）某种品牌'
          end_anchor: '13．（4分）已知三角形'
          crops:
            - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/013.png
              box_px: [120, 120, 1370, 2050]
        block:
          stem_latex: '某种品牌的笔记本电脑原价为 $a$ 元，如果连续两次降价的百分率都为 $x$，那么两次降价后的价格为 \underline{\hspace{3cm}} 元。'
          answer: '$a(1-x)^2$'
          solution_steps:
            - title: 连续降价
              content: '两次降价后的价格为 $a(1-x)(1-x)=a(1-x)^2$。'
      - item_id: Q013
        question_number: 13
        question_type: short_answer
        points: 4
        question_evidence:
          - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/002.png
            box_px: [140, 1460, 1340, 1660]
        prompt: []
        official_solution:
          start_anchor: '13．（4分）已知三角形 ABC'
          end_anchor: '14．（4分）在梯形'
          crops:
            - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/013.png
              box_px: [120, 120, 1370, 2050]
            - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/014.png
              box_px: [120, 120, 1370, 2050]
        block:
          stem_latex: '已知 $\triangle ABC$ 的重心 $G$ 到 $BC$ 边上中点 $D$ 的距离为 $2$，那么中线 $AD$ 长为 \underline{\hspace{2cm}}。'
          answer: '$6$'
          solution_steps:
            - title: 重心性质
              content: '$AG=2GD=4$，所以 $AD=AG+GD=6$。'
      - item_id: Q014
        question_number: 14
        question_type: short_answer
        points: 4
        question_evidence:
          - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/002.png
            box_px: [140, 1580, 1340, 1780]
        prompt: []
        official_solution:
          start_anchor: '14．（4分）在梯形'
          end_anchor: '15．（4分）如图，在三角形 ABC'
          crops:
            - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/014.png
              box_px: [120, 120, 1370, 2050]
        block:
          stem_latex: '在梯形的一条底边长为 $5$，中位线长为 $7$，那么另一条底边的长为 \underline{\hspace{2cm}}。'
          answer: '$9$'
          solution_steps:
            - title: 中位线
              content: '设另一条底边长为 $x$，则 $\dfrac{5+x}{2}=7$，解得 $x=9$。'
      - item_id: Q015
        question_number: 15
        question_type: short_answer
        points: 4
        question_evidence:
          - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/002.png
            box_px: [140, 1720, 1340, 2020]
          - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/003.png
            box_px: [0, 0, 1488, 2105]
        prompt:
          - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/doc-direct-extract/media/image16.png
            box_px: [0, 0, 104, 136]
            width: 45mm
        official_solution:
          start_anchor: '15．（4分）如图，在三角形 ABC'
          end_anchor: '16．（4分）如图，边长为 1'
          crops:
            - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/014.png
              box_px: [120, 120, 1370, 2050]
            - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/015.png
              box_px: [120, 120, 1370, 2050]
        block:
          stem_latex: '如图，在 $\triangle ABC$ 中，$DE\parallel BC$。如果 $DE=1$，$BC=4$，那么 $\triangle ADE$ 与 $\triangle ABC$ 面积的比是 \underline{\hspace{2cm}}。'
          answer: '$1:16$'
          solution_steps:
            - title: 相似三角形
              content: '$\triangle ADE\sim\triangle ABC$，相似比为 $1:4$，所以面积比为 $1:16$。'
      - item_id: Q016
        question_number: 16
        question_type: short_answer
        points: 4
        question_evidence:
          - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/003.png
            box_px: [140, 400, 1340, 780]
        prompt:
          - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/doc-direct-extract/media/image17.png
            box_px: [0, 0, 123, 74]
            width: 75mm
        official_solution:
          start_anchor: '16．（4分）如图，边长为 1'
          end_anchor: '17．（4分）在矩形 ABCD'
          crops:
            - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/015.png
              box_px: [120, 120, 1370, 2050]
            - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/016.png
              box_px: [120, 120, 1370, 2050]
        block:
          stem_latex: '如图，边长为 $1$ 的菱形 $ABCD$ 的两个顶点 $B$、$C$ 恰好落在扇形 $AEF$ 的弧 $EF$ 上，弧 $BC$ 的长度等于 \underline{\hspace{2cm}}（结果保留 $\pi$）。'
          answer: '$\dfrac{\pi}{3}$'
          solution_steps:
            - title: 求圆心角
              content: '连接 $AC$。由 $AB=BC=AC=1$，得 $\triangle ABC$ 是等边三角形，所以 $\angle BAC=60^\circ$。'
            - title: 求弧长
              content: '$\wideparen{BC}=\dfrac{60^\circ\pi\cdot1}{180^\circ}=\dfrac{\pi}{3}$。'
      - item_id: Q017
        question_number: 17
        question_type: short_answer
        points: 4
        question_evidence:
          - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/003.png
            box_px: [140, 720, 1340, 900]
        prompt: []
        official_solution:
          start_anchor: '17．（4分）在矩形 ABCD'
          end_anchor: '18．（4分）如图，将边长为 4'
          crops:
            - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/016.png
              box_px: [120, 120, 1370, 2050]
        block:
          stem_latex: '在矩形 $ABCD$ 中，如果 $|\overrightarrow{AB}|=2$，$|\overrightarrow{BC}|=1$，那么 $|\overrightarrow{AB}+\overrightarrow{BC}|=$ \underline{\hspace{2cm}}。'
          answer: '$\sqrt5$'
          solution_steps:
            - title: 向量与勾股定理
              content: '$\overrightarrow{AB}+\overrightarrow{BC}=\overrightarrow{AC}$，且 $AC=\sqrt{2^2+1^2}=\sqrt5$。'
      - item_id: Q018
        question_number: 18
        question_type: short_answer
        points: 4
