        block:
          stem_latex: |
            二次函数 $y=\dfrac16(x+2\sqrt3)^2$ 的图象的顶点为 $A$，与 $y$ 轴交于点 $B$，以 $AB$ 为边在第二象限内作等边三角形 $ABC$。
            （1）求直线 $AB$ 的表达式和点 $C$ 的坐标；
            （2）点 $M(m,1)$ 在第二象限，且 $\triangle ABM$ 的面积等于 $\triangle ABC$ 的面积，求点 $M$ 的坐标；
            （3）以 $x$ 轴上的点 $N$ 为圆心、$1$ 为半径的圆，与以点 $C$ 为圆心、$CM$ 为半径的圆相切，直接写出点 $N$ 的坐标。
          answer: '（1）$y=\dfrac{\sqrt3}{3}x+2$，$C(-2\sqrt3,4)$；（2）$M(-5\sqrt3,1)$；（3）见解析'
          solution_steps:
            - title: 第（1）问
              content: '$A(-2\sqrt3,0)$，$B(0,2)$，故直线 $AB$ 为 $y=\dfrac{\sqrt3}{3}x+2$。由等边三角形的位置关系得 $C(-2\sqrt3,4)$。'
            - title: 第（2）问
              content: '由两三角形同底等面积且 $C,M$ 在同侧，得 $CM\parallel AB$。过 $C$ 的平行线为 $y=\dfrac{\sqrt3}{3}x+6$，令 $y=1$，得 $M(-5\sqrt3,1)$。'
            - title: 第（3）问
              content: '$CM=6$。外切时 $CN=7$，内切时 $CN=5$。设 $N(n,0)$，由距离公式分别得 $n=-2\sqrt3\pm\sqrt{33}$ 或 $n=-2\sqrt3\pm3$，所以 $N$ 为这四个横坐标对应的点。'
