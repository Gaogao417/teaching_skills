        block:
          stem_latex: '计算：$(-2)^2=$ \underline{\hspace{2cm}}。'
          answer: '$4$'
          solution_steps:
            - title: 计算
              content: '$(-2)^2=(-2)\times(-2)=4$。'
      - item_id: Q008
        question_number: 8
        question_type: short_answer
        points: 4
        question_evidence:
          - source: documents/初三/2012届-上海市普陀区-初三二模数学-试卷及参考答案/pages-pages/002.png
