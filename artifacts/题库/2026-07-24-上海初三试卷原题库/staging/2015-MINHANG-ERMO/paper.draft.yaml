    block:
      stem_latex: 如图，已知在梯形 $ABCD$ 中，$AD\parallel BC$，$AB=DC=5$，$AD=4$，$M$、$N$ 分别是边 $AD$、$BC$ 上的任意一点，联结 $AN$、$DN$，点 $E$、$F$ 分别在线段 $AN$、$DN$ 上，且 $ME\parallel DN$，$MF\parallel AN$，联结 $EF$。(1) 如果 $EF\parallel BC$，求 $EF$ 的长；(2) 如果四边形 $MENF$ 的面积是 $\triangle ADN$ 的面积的 $\frac{3}{8}$，求 $AM$ 的长；(3) 如果 $BC=10$，试探索 $\triangle ABN$、$\triangle AND$、$\triangle DNC$ 能否两两相似？如果能，求 $AN$ 的长。
      answer: (1) $EF=2$；(2) $AM=1$ 或 $3$；(3) 能，$AN=2\sqrt{5}$
      clue: 相似形综合题
      solution_steps:
      - (1) 由 $EF\parallel BC$，$AD\parallel BC$ 得 $EF\parallel AD$，结合 $ME\parallel DN$，$MF\parallel AN$ 得 $AE=EN$，$NF=FD$
      - 故 $EF$ 是 $\triangle AND$ 的中位线，$EF=\frac{1}{2}AD=2$
      - (2) 设 $AM=x$，$\frac{S_{\triangle AME}}{S_{\triangle ADN}}=\frac{x^{2}}{16}$，$\frac{S_{\triangle DMF}}{S_{\triangle ADN}}=\frac{(4-x)^{2}}{16}$
      - 由 $[1-\frac{x^{2}}{16}-\frac{(4-x)^{2}}{16}]S_{\triangle AND}=\frac{3}{8}S_{\triangle AND}$ 解得 $x=1$ 或 $x=3$
      - (3) 过 $A$ 作 $AP\perp BC$，过 $D$ 作 $DQ\perp BC$，则 $BP=CQ=3$
      - 当 $\triangle ABN\sim\triangle DCN$ 时 $BN=CN=5$，$AN=\sqrt{AP^{2}+NP^{2}}=2\sqrt{5}$，此时三三角形两两相似
      - $\therefore AN=2\sqrt{5}$
