    block:
      stem_latex: 货车在公路 $A$ 处加满油后，以每小时60千米的速度匀速行驶，前往与 $A$ 处相距360千米的 $B$ 处。下表记录的是货车一次加满油后油箱剩余油量 $y$（升）与行驶时间 $x$（时）之间的关系：行驶时间 $x$（时）取0,1,2,3,4时，余油量 $y$（升）分别为150,120,90,60,30。(1) 如果 $y$ 关于 $x$ 的函数是一次函数，求这个函数解析式；(2) 货车行驶4小时后到达 $C$ 处，$C$ 的前方12千米的 $D$ 处有一加油站，那么在 $D$ 处至少加多少升油，才能使货车到达 $B$ 处卸货后能顺利返回 $D$ 处加油？（油箱内剩余油量应随时不少于10升）
      answer: (1) $y=-30x+150$；(2) 至少加 $94$ 升
      clue: 一次函数的应用
      solution_steps:
      - (1) 设 $y=kx+b$，代入 $(0,150)$、$(1,120)$
      - 解得 $k=-30$，$b=150$，故 $y=-30x+150$
      - (2) 设在 $D$ 处至少加 $W$ 升油
      - $150-4\times30-\frac{12}{60}\times30+W\geqslant \frac{360-4\times60-12}{60}\times30\times2+10$
      - 即 $24+W\geqslant118$，解得 $W\geqslant94$
