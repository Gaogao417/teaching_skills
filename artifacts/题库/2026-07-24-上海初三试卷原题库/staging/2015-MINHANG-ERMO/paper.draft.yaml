      - 在 Rt$\triangle ADE$ 中，$AE=\sqrt{4^{2}+6^{2}}=2\sqrt{13}$
      - $F$ 为斜边 $AE$ 中点，$DF=\frac{1}{2}AE=\sqrt{13}$
      - (2) 过 $C$ 作 $CM\perp AE$ 于 $M$，由 $CM^{2}=AC^{2}-AM^{2}=CE^{2}-EM^{2}$ 解得 $AM=\frac{14\sqrt{13}}{13}$，$CM=\frac{8\sqrt{13}}{13}$
      - $\tan\angle CAE=\frac{CM}{AM}=\frac{4}{7}$
