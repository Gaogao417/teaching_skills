      answer: (1) $y=\frac{4}{15}x^{2}-\frac{8}{15}x-4$，对称轴 $x=1$；(2) $2\sqrt{5}-3$；(3) $\frac{3}{5}$
      clue: 二次函数；等腰三角形；线段垂直平分线
      solution_steps:
      - (1) 把 $A(-3,0)$ 代入 $y=ax^{2}-2ax-4$ 得 $9a+6a-4=0$，$a=\frac{4}{15}$
      - 抛物线为 $y=\frac{4}{15}x^{2}-\frac{8}{15}x-4$，对称轴 $x=-\frac{-8/15}{2\times4/15}=1$
      - (2) 令 $y=0$ 得 $B(5,0)$，令 $x=0$ 得 $C(0,-4)$
      - $AC=\sqrt{3^{2}+4^{2}}=5$，$AD=AC=5$，故 $D(2,0)$，$BD=3$，$CD=2\sqrt{5}$
      - 两圆外切 $R_{C}+BD=CD$，$R_{C}=2\sqrt{5}-3$
      - (3) 由 $MN$ 被 $CD$ 垂直平分及 $AC=AD$ 推得 $DN\parallel AC$
      - $\frac{BN}{CN}=\frac{BD}{AD}=\frac{3}{5}$
