    stem_latex: '已知抛物线 $L:y=x^2-2x$，抛物线 $W$ 的顶点在 $L$ 上（非 $L$ 的顶点）且经过 $L$ 的顶点。

      (1) 求出一个满足条件的抛物线 $W$ 的表达式（取顶点 $(0,0)$，设 $W:y=ax^2$，代入 $L$ 顶点 $(1,-1)$ 求 $a$）；

      (2) 再写出一个满足条件的抛物线 $W$ 的表达式；

      (3) 如果 $L$ 和 $W$ 在 $x$ 轴上所截得的线段长相等，求 $W$ 的表达式。'
