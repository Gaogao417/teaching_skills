    id: Q010
    points: 4
    stem_latex: 已知关于 $x$ 的方程 $x^2+mx-1=0$，判断该方程的根的情况是\u3000\u3000\u3000\u3000。
    answer: 有两个不相等的实数根
    clue: $\Delta=m^2+4>0$。
    solution_steps:
    - $\Delta=m^2-4\times1\times(-1)=m^2+4>0$，两不等实根。
