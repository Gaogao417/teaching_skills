    stem_latex: 计算：$|1-\tan60°|-\dfrac{1}{\sqrt{3}+\sqrt{2}}+(2024-\sqrt{2024})^0$
    answer: $\sqrt{2}$
    clue: 特殊角三角函数、分母有理化、零指数幂。
    solution_steps:
    - $|1-\sqrt{3}|=\sqrt{3}-1$，$\dfrac{1}{\sqrt{3}+\sqrt{2}}=\sqrt{3}-\sqrt{2}$，$(2024-\sqrt{2024})^0=1$。
    - 原式 $=(\sqrt{3}-1)-(\sqrt{3}-\sqrt{2})+1=\sqrt{2}$。
