    stem_latex: 如图，$D$ 是等边 $\triangle ABC$ 边 $BC$ 上点，$BD:CD=2:3$，作 $AD$ 的垂线交 $AB$、$AC$ 分别于点 $E$、$F$，那么 $AE:AF=$\u3000\u3000\u3000\u3000。
    answer: $7:8$
    clue: 过 $D$ 作垂线构造相似，$\dfrac{AE}{AF}=\dfrac{AG}{AH}=\dfrac{7}{8}$。
    solution_steps:
    - $AG=\dfrac{19}{4}m$，$AH=\dfrac{38}{7}m$，$\dfrac{AE}{AF}=\dfrac{AG}{AH}=\dfrac{7}{8}$。
