    id: Q009
    points: 4
    stem_latex: 方程 $x=\sqrt{x+2}$ 的解是\u3000\u3000\u3000\u3000。
    answer: $x=2$
    clue: 两边平方后解一元二次方程，检验增根。
    solution_steps:
    - 平方得 $x^2=x+2$，$(x-2)(x+1)=0$，$x=2$ 或 $-1$，检验 $x=2$。
