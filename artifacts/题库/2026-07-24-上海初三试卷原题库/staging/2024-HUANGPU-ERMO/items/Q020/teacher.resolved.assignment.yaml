    stem_latex: 解不等式组：$\begin{cases} 2x-5\leqslant 0 \\ \dfrac{x-4}{2}+\dfrac{1-2x}{3}<0 \end{cases}$
    answer: $-10<x\leqslant\dfrac{5}{2}$
    clue: 分别解两个不等式取交集。
    solution_steps:
    - ① $x\leqslant\dfrac{5}{2}$，②通分得 $3(x-4)+2(1-2x)<0$，$-x-10<0$，$x>-10$。
    - 解集 $-10<x\leqslant\dfrac{5}{2}$。
