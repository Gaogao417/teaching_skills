  - type: problem
    id: Q023
    points: 12
    stem_latex: '如图，$M$、$N$ 分别是平行四边形 $ABCD$ 边 $AD$、$BC$ 的中点，对角线 $BD$ 交 $AN$、$CM$ 分别于点 $P$、$Q$。

      (1) 求证：$PQ=\dfrac{1}{3}BD$；

      (2) 当四边形 $ANCM$ 是正方形时，探究平行四边形 $ABCD$ 的形状特征。'
    answer: (1) 证明见详解；(2) $\angle ABC=45°$，$\angle BAD=135°$，$BC=\sqrt{2}\,AB$
    clue: (1) $AN\parallel CM$，$\dfrac{BP}{BQ}=\dfrac{1}{2}$；(2) $AN=NB$，$\angle ABC=45°$。
    solution_steps:
    - (1) $AN\parallel CM$，$\dfrac{BP}{BQ}=\dfrac{BN}{BC}=\dfrac{1}{2}$，$BP=PQ$；同理 $DQ=PQ$，$\therefore PQ=\dfrac{1}{3}BD$。
    - (2) $AN=NC=NB$，$\angle ANB=90°$，$\angle ABC=45°$，$\angle BAD=135°$，$BC=\sqrt{2}\,AB$。
