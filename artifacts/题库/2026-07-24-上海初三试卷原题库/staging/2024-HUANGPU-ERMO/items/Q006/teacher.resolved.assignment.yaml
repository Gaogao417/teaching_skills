  - type: choice
    id: Q006
    points: 4
    stem_latex: 小明研究梯形的相似分割。结论 $1$：存在与上、下底边相交的直线，能将等腰梯形分割成两个相似的图形；结论 $2$：不存在与两腰相交的直线能将等腰梯形分割成两个相似的图形。对这两个结论（　　）
    choices:
    - 结论 $1$、结论 $2$ 都正确
    - 结论 $1$ 正确、结论 $2$ 不正确
    - 结论 $1$ 不正确、结论 $2$ 正确
    - 结论 $1$、结论 $2$ 都不正确
    answer: B
    clue: 结论 $1$ 正确（上下底垂直平分线），结论 $2$ 不正确（存在与两腰相交的分割线）。
