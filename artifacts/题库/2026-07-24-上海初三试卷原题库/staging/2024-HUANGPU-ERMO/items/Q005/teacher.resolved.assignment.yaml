  - type: choice
    id: Q005
    points: 4
    stem_latex: 反比例函数 $y=\dfrac{1}{x}$ 的图像与 $x$ 轴没有公共点且与 $x$ 轴无限接近，下列说明理由正确的是（　　）
    choices:
    - 自变量 $x\neq0$ 且 $x$ 的值可以无限接近 $0$
    - 自变量 $x\neq0$ 且函数值 $y$ 可以无限接近 $0$
    - 函数值 $y\neq0$ 且 $x$ 的值可以无限接近 $0$
    - 函数值 $y\neq0$ 且函数值 $y$ 可以无限接近 $0$
    answer: D
    clue: $x\to\infty$ 时 $y\to0$，但 $y\neq0$。
