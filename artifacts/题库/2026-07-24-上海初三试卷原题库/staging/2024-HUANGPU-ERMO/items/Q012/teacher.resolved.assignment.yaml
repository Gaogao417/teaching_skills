    stem_latex: 一副 $52$ 张的扑克牌（无大、小王）被打乱后背面朝上，小华先抽取 $1$ 张取得黑桃 $A$，然后小王从剩下的牌中再任意抽取 $1$ 张，他恰好抽到 $A$ 的概率是\u3000\u3000\u3000\u3000。
    answer: $\dfrac{3}{51}$
    clue: 剩 $51$ 张中有 $3$ 张 $A$。
    solution_steps:
    - $P=\dfrac{3}{51}=\dfrac{1}{17}$。
