    id: Q015
    points: 4
    stem_latex: 如图，$D$、$E$ 分别是 $\triangle ABC$ 边 $AB$、$AC$ 上点，$AD=2BD$，$\angle ADE=\angle ABC$。记 $\overrightarrow{BA}=\vec{a}$，$\overrightarrow{BC}=\vec{b}$，那么向量 $\overrightarrow{BE}=$\u3000\u3000\u3000\u3000。
    answer: $\dfrac{1}{3}\vec{a}+\dfrac{2}{3}\vec{b}$
    clue: $DE\parallel BC$，$AE=\dfrac{2}{3}AC$。
    solution_steps:
    - $\overrightarrow{BE}=\overrightarrow{BA}+\dfrac{2}{3}\overrightarrow{AC}=\dfrac{1}{3}\vec{a}+\dfrac{2}{3}\vec{b}$。
