    id: Q002
    points: 4
    stem_latex: 已知第二象限内点 $P$ 到 $x$ 轴的距离为 $2$，到 $y$ 轴的距离为 $3$，那么点 $P$ 的坐标是（　　）
    choices:
    - $(-2,3)$
    - $(-3,2)$
    - $(2,-3)$
    - $(3,-2)$
    answer: B
    clue: 第二象限 $x<0,y>0$，到 $x$ 轴距离 $=|y|=2$，到 $y$ 轴距离 $=|x|=3$。
