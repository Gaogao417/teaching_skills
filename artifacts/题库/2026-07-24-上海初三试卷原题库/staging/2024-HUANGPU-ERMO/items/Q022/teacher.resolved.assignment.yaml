  - type: problem
    id: Q022
    points: 10
    stem_latex: '代金券\u201c满 $80$ 团 $1$ 张\u201d：花 $75$ 元购一张 $80$ 元代金券，可抵 $80$ 元消费，不找零。

      (1) 一笔 $375$ 元消费用 $4$ 张代金券，实际共支付多少元？

      (2) 当 $320<x<375$ 时，写出 $y$（实际支付）关于 $x$（消费额）的函数关系式；

      (3) 消费未满 $80$ 元，是否一定没必要\u201c团\u201d？'
    answer: (1) $355$ 元；(2) $y=x-20$；(3) 不是
    clue: (1) $375-4\times5$；(2) 用 $4$ 张券每张省 $5$ 元；(3) 消费 $76$ 元团一张只需 $75$ 元。
    solution_steps:
    - (1) $375-4(80-75)=355$ 元。
    - (2) $320<x<375$ 用 $4$ 张券，$y=x-4\times5=x-20$。
    - (3) 消费 $76\sim79$ 元时团一张券比不团划算。
    source_solution_images: []
