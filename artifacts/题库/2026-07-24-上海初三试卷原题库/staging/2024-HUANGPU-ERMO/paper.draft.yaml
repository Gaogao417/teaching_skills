      stem_latex: 如图，由 $4$ 个全等的直角三角形拼成大正方形 $ABCD$，内部形成小正方形 $MNPQ$。如果 $S_{MNPQ}=\dfrac{1}{2}S_{ABCD}$，那么
        $\tan\angle ABM=$\u3000\u3000\u3000\u3000。
      answer: $2-\sqrt{3}$
      clue: $(b-a)^2=\dfrac{1}{2}(a^2+b^2)$ 得 $\dfrac{a}{b}=2\pm\sqrt{3}$。
      solution_steps:
      - 设 $MB=b,AM=a$，$(b-a)^2=\dfrac{1}{2}(a^2+b^2)$，$a^2+b^2=4ab$，$\dfrac{a}{b}+\dfrac{b}{a}=4$。
      - $\dfrac{a}{b}=2-\sqrt{3}$（$<1$ 保留），$\tan\angle ABM=2-\sqrt{3}$。
