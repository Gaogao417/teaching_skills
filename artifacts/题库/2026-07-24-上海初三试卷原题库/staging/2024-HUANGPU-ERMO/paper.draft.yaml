      stem_latex: '如图，$D$ 是 $\triangle ABC$ 边 $AB$ 上点，已知 $\angle BCD=\angle A$，$AD=5$，$BD=4$。

        (1) 求边 $BC$ 的长；

        (2) 如果 $\triangle ACD\sim\triangle CBD$，求 $\angle ACB$ 的度数。'
      answer: (1) $BC=6$；(2) $\angle ACB=90°$
      clue: (1) $\triangle BCD\sim\triangle BAC$，$BC^2=BA\cdot BD$；(2) 勾股逆定理。
      solution_steps:
      - (1) $\triangle BCD\sim\triangle BAC$，$BC^2=BA\cdot BD=9\times4=36$，$BC=6$。
      - (2) $CD^2=AD\cdot BD=20$，$CD^2+BD^2=20+16=36=BC^2$，$\angle CDB=90°$，$\therefore\angle
        ACB=90°$。
