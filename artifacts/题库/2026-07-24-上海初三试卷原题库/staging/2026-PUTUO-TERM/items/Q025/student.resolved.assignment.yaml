    stem_latex: 如图，已知矩形 $ABCD$ 中，点 $E$ 是边 $AB$ 上一动点，在 $\triangle DEC$ 右侧作 $\triangle DCF$，使得 $\triangle DCF\sim\triangle DEC$，其中点 $C、F$ 分别与点 $E、C$ 对应。已知 $AB=2\sqrt3$，$BC=2$。（1）当点 $E$ 与点 $B$ 重合时，求四边形 $DECF$ 的面积；（2）点 $E$ 由点 $A$ 向点 $B$ 移动过程中，研究：①$\angle EDF$ 的大小；②$DF$ 的长；③$\tan\angle DFC$ 的值。填出变大、变小的量，并说明编号为②的量的变化理由；（3）当四边形 $DECF$ 的一条对角线平分另一条对角线时，求 $AE$ 的长。
