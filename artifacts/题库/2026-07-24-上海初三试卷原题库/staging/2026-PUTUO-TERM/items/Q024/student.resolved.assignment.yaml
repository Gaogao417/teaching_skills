    stem_latex: 在平面直角坐标系 $xOy$ 中（如图），已知抛物线 $y=a(x+2)^2+k(a>0)$ 与 $x$ 轴交于点 $A(-5,0)$，与 $y$ 轴交于点 $B$，顶点为 $P$。（1）用含 $a$ 的代数式分别表示点 $B、P$ 的坐标；（2）作过点 $B$ 和点 $P$ 的直线交 $x$ 轴于点 $C$。①当 $a$ 取不同的数值时，点 $C$ 是否会移动？说明理由；②当 $a=1$ 时，交点、顶点分别记作 $B_1、P_1$；当 $a=m(0<m<1)$ 时分别记作 $B_m、P_m$。若 $\angle P_mP_1B_m$ 的补角等于 $\angle P_mP_1B_1$ 的两倍，求 $m$。
