    stem_latex: 我们把一个三角形一条边上的中线与另一条边上的高的交点称为这个三角形的中垂点。已知在 $\triangle ABC$ 中，$AB=AC$，$\cos\angle ABC=\dfrac34$，$AD$ 为 $BC$ 边上的高，点 $O$ 在 $AD$ 上，联结 $CO$ 并延长交 $AB$ 于点 $E$。如果点 $O$ 是 $\triangle ABC$ 的中垂点，那么 $\dfrac{OE}{OC}$ 的值为 $\fillin$。
