      answer: $\begin{cases} x=3 \\ y=-1 \end{cases}$
      clue: ②因式分解。
      solution_steps:
      - ②化为 $(x+y)(x-2y)=10$，结合① $x+y=2$ 得 $x-2y=5$。
      - 联立 $\begin{cases}x+y=2\\x-2y=5\end{cases}$ 解得 $x=3$，$y=-1$。
