    block:
      stem_latex: '买2支康乃馨和3支百合共28元，买3支康乃馨和2支百合共27元。

        (1) 求一支康乃馨和一支百合各多少元；

        (2) 买康乃馨和百合共9支且百合不少于康乃馨，设康乃馨 $x$ 支费用 $w$ 元，求 $w$ 与 $x$ 的关系式及费用最少的方案。'
      answer: (1) 康乃馨 $5$ 元，百合 $6$ 元；(2) $w=54-x$，最少 $50$ 元（4支康乃馨、5支百合）
      clue: (1) 二元一次方程组；(2) 一次函数最值。
      solution_steps:
      - (1) $\begin{cases}2x+3y=28\\3x+2y=27\end{cases}$，$x=5$，$y=6$。
      - (2) $w=5x+6(9-x)=54-x$，$9-x\geqslant x$ 得 $x\leqslant4.5$，$x=4$ 时最少，$w=50$。
