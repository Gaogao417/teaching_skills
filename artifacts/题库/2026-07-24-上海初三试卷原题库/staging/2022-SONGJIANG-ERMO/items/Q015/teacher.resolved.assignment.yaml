  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如图，梯形 $ABCD$ 中 $AB\parallel CD$，$AB=2CD$，设 $\overrightarrow{AB}=\vec{a}$，$\overrightarrow{AC}=\vec{b}$，则 $\overrightarrow{AD}=$______
    answer: $\vec{b}-\dfrac{1}{2}\vec{a}$
    clue: $\overrightarrow{AD}=\overrightarrow{AC}-\overrightarrow{DC}$。
    solution_steps:
    - $\overrightarrow{DC}=\dfrac{1}{2}\vec{a}$，$\overrightarrow{AD}=\vec{b}-\dfrac{1}{2}\vec{a}$。
