  - type: problem
    id: Q021
    points: 10
    stem_latex: '如图，$\triangle ABC$ 的外接圆 $\odot O$ 中，$AB=AC=8$，$OA=5$，$O$ 为外心。

      (1) 求 $\angle BAO$ 的正弦值；

      (2) 求弦 $BC$ 的长。'
    answer: (1) $\sin\angle BAO=\dfrac{3}{5}$；(2) $BC=\dfrac{48}{5}$
    clue: (1) 作 $OD\perp AB$ 用勾股；(2) 延长 $AO$ 交 $BC$。
    solution_steps:
    - (1) 作 $OD\perp AB$ 于 $D$，$AD=4$，$OD=\sqrt{5^{2}-4^{2}}=3$，$\sin\angle BAO=\dfrac{OD}{OA}=\dfrac{3}{5}$。
    - (2) 延长 $AO$ 交 $BC$ 于 $E$，$AO\perp BC$，$BE=CE$。$AE=\sqrt{AB^{2}-BE^{2}}$，由 $\sin\angle BAO=\dfrac{3}{5}$ 得 $BE=\dfrac{24}{5}$，$BC=\dfrac{48}{5}$。
