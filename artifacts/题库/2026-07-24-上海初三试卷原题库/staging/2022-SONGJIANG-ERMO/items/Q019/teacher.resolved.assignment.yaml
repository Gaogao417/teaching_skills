  - type: problem
    id: Q019
    points: 10
    stem_latex: 计算：$\left(-\dfrac{1}{2}\right)^{-1}-\sqrt{18}+|1-\sqrt{2}|+\dfrac{1}{\sqrt{2}+1}$
    answer: $-\sqrt{2}-4$
    clue: 负指数幂、二次根式、绝对值、分母有理化。
    solution_steps:
    - $\left(-\dfrac{1}{2}\right)^{-1}=-2$，$\sqrt{18}=3\sqrt{2}$，$|1-\sqrt{2}|=\sqrt{2}-1$，$\dfrac{1}{\sqrt{2}+1}=\sqrt{2}-1$。
    - 原式 $=-2-3\sqrt{2}+\sqrt{2}-1+\sqrt{2}-1=-\sqrt{2}-4$。
