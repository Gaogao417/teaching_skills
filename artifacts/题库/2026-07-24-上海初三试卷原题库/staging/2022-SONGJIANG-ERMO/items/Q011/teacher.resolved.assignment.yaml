    id: Q011
    points: 4
    stem_latex: 反比例函数 $y=-\dfrac{1}{x}$ 图象过 $A(2,a)$、$B(3,b)$，则 $a$ ______ $b$（填\u201c$>$\u201d或\u201c$<$\u201d）。
    answer: $<$
    clue: $k<0$，$y$ 随 $x$ 增大而增大。
    solution_steps:
    - $k=-1<0$，$2<3$，$\therefore a<b$。
