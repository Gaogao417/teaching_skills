    stem_latex: 矩形 $ABCD$（$AB=2$，$BC=3$）绕 $B$ 顺时针旋转得矩形 $A^{\prime}BC^{\prime}D^{\prime}$，当 $A^{\prime}$ 落在对角线 $AC$ 上时，点 $C$ 与 $D^{\prime}$ 的距离是______
    answer: '2'
    clue: 旋转+全等。
    solution_steps:
    - $\triangle A^{\prime}CB\cong\triangle CA^{\prime}D^{\prime}$（SAS），$CD^{\prime}=A^{\prime}B=AB=2$。
