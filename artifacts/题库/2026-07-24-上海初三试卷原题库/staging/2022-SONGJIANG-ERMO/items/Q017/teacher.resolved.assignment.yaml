  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 定义两点 $P(x_{1},y_{1})$、$Q(x_{2},y_{2})$ 的\u201c直角距离\u201d为 $|x_{1}-x_{2}|+|y_{1}-y_{2}|$。直线 $y=-x+5$ 与坐标轴交于 $A$、$B$，$Q$ 在线段 $AB$ 上（不与 $A$、$B$ 重合），则 $O$、$Q$ 的直角距离是______
    answer: '5'
    clue: $|m|+|-m+5|=5$。
    solution_steps:
    - 设 $Q(m,-m+5)$，$0<m<5$，直角距离 $=m+(-m+5)=5$。
