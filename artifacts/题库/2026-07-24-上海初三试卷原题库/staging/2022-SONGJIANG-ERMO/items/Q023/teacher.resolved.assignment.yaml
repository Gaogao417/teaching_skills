  - type: problem
    id: Q023
    points: 12
    stem_latex: '如图，$\triangle DAB$ 和 $\triangle EBC$ 中 $DA=DB$，$EB=EC$，$\angle ADB=\angle BEC$，$A$、$B$、$C$ 共线，联结 $AE$、$ED$，$AE$ 与 $BD$ 交于 $F$。

      (1) 求证：$\dfrac{DF}{BF}=\dfrac{AB}{BC}$；

      (2) 若 $BE^{2}=BF\cdot BD$，求证：$DF=BE$。'
    answer: 见证明
    clue: (1) 等腰+平行；(2) 相似+全等。
    solution_steps:
    - (1) $DA=DB$，$EB=EC$，$\angle ADB=\angle BEC$，得 $\angle DAB=\angle EBC$，$AD\parallel BE$，$BD\parallel CE$，$\dfrac{DF}{BF}=\dfrac{AF}{EF}=\dfrac{AB}{BC}$。
    - (2) $BE^{2}=BF\cdot BD\Rightarrow \triangle EBF\sim\triangle DBE$，$\angle DEB=\angle BFE=\angle AFD$；又 $\angle ADF=\angle DBE$，$AD=BD$，$\triangle DAF\cong\triangle BDE$，$DF=BE$。
