  - type: choice
    id: Q005
    points: 4
    stem_latex: 如图，在$\mathrm{Rt}\triangle ABC$中，$\angle C=90^{\circ}$，点$D$为$AB$边的中点，沿着过点$D$的某条直线将$\triangle ABC$剪开，要使剪下来的一个小三角形与原三角形相似，有（\quad）种不同的剪法．
    choices:
    - 1种
    - 2种
    - 3种
    - 4种
    answer: C
    clue: 根据相似三角形的判定方法，过中点$D$有三种剪法使小三角形与原三角形相似。
    solution_steps:
    - title: 详解
      content: '要使剪下来的一个小三角形与原三角形相似，有以下$3$种剪法：

        $DF\parallel BC$，$DE\parallel AC$，$HD\perp AB$，

        可得$\triangle ADF\sim\triangle ABC$，$\triangle BDE\sim\triangle BAC$，$\triangle AHD\sim\triangle ABC$。

        '
