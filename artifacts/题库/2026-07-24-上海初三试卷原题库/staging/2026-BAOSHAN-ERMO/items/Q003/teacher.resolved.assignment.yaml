  - type: choice
    id: Q003
    points: 4
    stem_latex: 下列关系式中，$y$是$x$的反比例函数的是（\quad）
    choices:
    - $y=\dfrac{x}{2}$
    - $y=\dfrac{4}{x}$
    - $y=\dfrac{x^{2}}{3}$
    - $y=\dfrac{1}{x+1}$
    answer: B
    clue: 反比例函数的标准形式为$y=\dfrac{k}{x}$（$k$为常数，$k\neq 0$）。
    solution_steps:
    - title: 详解
      content: '反比例函数的标准形式为$y=\dfrac{k}{x}$（$k$为常数，$k\neq 0$）。

        A、$y=\dfrac{x}{2}$是正比例函数，不符合反比例函数定义，排除；

        B、$y=\dfrac{4}{x}$符合$y=\dfrac{k}{x}$的形式，其中$k=4\neq 0$，因此$y$是$x$的反比例函数，符合要求；

        C、$y=\dfrac{x^{2}}{3}$是二次函数，不符合反比例函数定义，排除；

        D、$y=\dfrac{1}{x+1}$是$y$关于$x+1$的反比例函数，不是$y$关于$x$的反比例函数，不符合定义，排除。

        '
