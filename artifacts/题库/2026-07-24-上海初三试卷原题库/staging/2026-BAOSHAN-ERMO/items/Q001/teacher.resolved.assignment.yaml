    stem_latex: 下列实数中，最小的数是（\quad）
    choices:
    - $-5$
    - $5$
    - $\dfrac{1}{5}$
    - $0$
    answer: A
    clue: 负数小于0，负数小于正数，比较四个数的大小。
    solution_steps:
    - title: 详解
      content: 实数大小比较中，负数小于0，负数小于正数，四个选项中唯一的负数$-5$一定小于$5$，$\dfrac{1}{5}$和$0$，因此最小的数是$-5$。
