    stem_latex: 在一个不透明的袋子里装有$5$个绿球、$2$个黄球和若干个红球，这些球除颜色不同外无其他差别．每次从袋子里摸出一个球记录下颜色后再放回，经过大量的重复试验，发现摸到红球的频率稳定在$0.3$，则袋中红球的个数是$\underline{\qquad}$．
