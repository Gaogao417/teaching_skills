  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 在一个不透明的袋子里装有$5$个绿球、$2$个黄球和若干个红球，这些球除颜色不同外无其他差别．每次从袋子里摸出一个球记录下颜色后再放回，经过大量的重复试验，发现摸到红球的频率稳定在$0.3$，则袋中红球的个数是$\underline{\qquad}$．
    answer: $3$
    clue: 设红球$x$个，由频率稳定值为概率列方程$\dfrac{x}{5+2+x}=0.3$。
    solution_steps:
    - title: 详解
      content: '设袋中红球有$x$个，根据题意得

        $\dfrac{x}{5+2+x}=0.3$

        整理得$x=0.3(7+x)$

        $x=2.1+0.3x$

        $0.7x=2.1$

        解得$x=3$

        经检验$x=3$是原分式方程的解，符合题意，

        所以袋中红球的个数是$3$。

        '
