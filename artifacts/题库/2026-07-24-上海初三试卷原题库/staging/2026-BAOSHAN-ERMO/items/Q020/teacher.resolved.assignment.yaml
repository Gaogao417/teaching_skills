  - type: problem
    id: Q020
    points: 10
    stem_latex: '解关于$x$的不等式组：$\begin{cases}3x-1\geqslant x+1\quad①\\2x+3>x\quad②\end{cases}$

      '
    answer: $x\geqslant 1$
    clue: 分别解两个不等式，取交集。
    solution_steps:
    - title: 详解
      content: '由①，得$2x\geqslant 2$，$x\geqslant 1$；

        由②，得$x>-3$。

        $\therefore$不等式组的解集为$x\geqslant 1$。

        '
