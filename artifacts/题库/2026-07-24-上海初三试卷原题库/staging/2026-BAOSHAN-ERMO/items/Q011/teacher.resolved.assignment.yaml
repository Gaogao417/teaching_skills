  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 已知关于$x$的方程$x^{2}-6x+m=0$有两个不相等的实数根，则$m$的取值范围是$\underline{\qquad}$．
    answer: $m<9$
    clue: 根的判别式$\Delta=b^{2}-4ac>0$，建立关于$m$的不等式。
    solution_steps:
    - title: 详解
      content: '$\because$关于$x$的方程$x^{2}-6x+m=0$有两个不相等的实数根，

        $\therefore\Delta=b^{2}-4ac=(-6)^{2}-4m=36-4m>0$，

        解得：$m<9$。

        '
