  - type: short_answer
    id: Q009
    points: 4
    stem_latex: 方程$\sqrt{3x+1}=4$的根是$\underline{\qquad}$．
    answer: $x=5$
    clue: 两边平方得$3x+1=16$，解方程后验证根是否符合意义。
    solution_steps:
    - title: 详解
      content: '两边平方，得$3x+1=16$，

        解得$x=5$。

        $\because 3x+1\geqslant 0$，

        解得$x\geqslant -\dfrac{1}{3}$，

        $\therefore x=5$是方程的根。

        '
