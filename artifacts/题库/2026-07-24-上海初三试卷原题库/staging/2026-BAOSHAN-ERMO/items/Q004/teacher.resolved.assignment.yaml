  - type: choice
    id: Q004
    points: 4
    stem_latex: 如图，$\angle ABC=30^{\circ}$，点$O$为射线$BC$上一点，$BO=8$，如果$\odot O$是以点$O$为圆心，半径为$3$的圆，那么$\odot O$与直线$BA$的位置关系是（\quad）
    choices:
    - 相离
    - 相切
    - 相交
    - 不能确定
    answer: A
    clue: 作$OD\perp AB$，求出$OD$的长，与半径比较大小。
    solution_steps:
    - title: 详解
      content: '作$OD\perp AB$于点$D$。

        $\because\angle ABC=30^{\circ}$，$BO=8$，

        $\therefore OD=\dfrac{1}{2}OB=4$。

        $\because\odot O$的半径为$3$，$4>3$，

        $\therefore\odot O$与直线$BA$的位置关系是相离。

        '
