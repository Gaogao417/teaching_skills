    stem_latex: 计算：$\left(\sqrt{12}-\sqrt{\dfrac{1}{3}}\right)\div\sqrt{3}$．
    answer: $2$
    clue: 利用分配律分别除以$\sqrt{3}$，化简即可。
    solution_steps:
    - title: 详解
      content: '$\left(\sqrt{12}-\sqrt{\dfrac{1}{3}}\right)\div\sqrt{3}$

        $=\sqrt{12}\div\sqrt{3}-\sqrt{\dfrac{1}{3}}\div\sqrt{3}$

        $=\sqrt{4}-\sqrt{\dfrac{1}{9}}$

        $=2-\dfrac{1}{3}$

        $=\dfrac{5}{3}$。

        '
