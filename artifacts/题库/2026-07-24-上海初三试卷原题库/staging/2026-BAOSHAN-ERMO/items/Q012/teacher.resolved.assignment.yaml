  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 2025年我国人工智能产业活力迸发、亮点纷呈，人工智能企业数量超6000家，核心产业规模预计突破1.2万亿元，将数据1.2万亿元用科学记数法表示为$\underline{\qquad}$元．
    answer: $1.2\times10^{12}$
    clue: 万亿$=10^{4}\times10^{8}=10^{12}$，所以1.2万亿$=1.2\times10^{12}$。
    solution_steps:
    - title: 详解
      content: $1.2$万亿$=1.2\times10^{4}\times10^{8}=1.2\times10^{12}$，故数据1.2万亿元用科学记数法表示为$1.2\times10^{12}$。
