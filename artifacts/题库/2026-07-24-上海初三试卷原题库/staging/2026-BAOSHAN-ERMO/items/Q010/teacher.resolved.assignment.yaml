  - type: short_answer
    id: Q010
    points: 4
    stem_latex: 计算：$\dfrac{1}{a^{2}-4}\div\dfrac{a}{a-2}=\underline{\qquad}$．
    answer: $\dfrac{1}{a(a+2)}$
    clue: 先用平方差公式因式分解分母，再将除法转化为乘法，约分。
    solution_steps:
    - title: 详解
      content: '$\dfrac{1}{a^{2}-4}\div\dfrac{a}{a-2}$

        $=\dfrac{1}{(a-2)(a+2)}\cdot\dfrac{a-2}{a}$

        $=\dfrac{1}{a(a+2)}$。

        '
