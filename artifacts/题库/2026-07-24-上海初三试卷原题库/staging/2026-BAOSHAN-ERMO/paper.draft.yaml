          clue: 由角平分线和平行线推出$AB=AE$，得$AE=\dfrac{1}{2}AD$，再用三角形法则$\overrightarrow{BE}=\overrightarrow{AE}-\overrightarrow{AB}$。
          solution_steps:
            - title: 详解
              content: |
                $\because\square ABCD$中，$\angle ABC$的平分线交$AD$于点$E$，
                $\therefore AD\parallel BC$，$\angle ABE=\angle CBE$，
                $\therefore\angle AEB=\angle CBE$，
                $\therefore\angle ABE=\angle AEB$，
                $\therefore AB=AE$。
                $\because AD=2AB$，
                $\therefore AD=2AE$，
                $\therefore\overrightarrow{AE}=\dfrac{1}{2}\overrightarrow{AD}=\dfrac{1}{2}\boldsymbol{a}$。
                $\because\overrightarrow{AB}=\boldsymbol{b}$，
                $\therefore\overrightarrow{BE}=\overrightarrow{AE}-\overrightarrow{AB}=\dfrac{1}{2}\boldsymbol{a}-\boldsymbol{b}$。

