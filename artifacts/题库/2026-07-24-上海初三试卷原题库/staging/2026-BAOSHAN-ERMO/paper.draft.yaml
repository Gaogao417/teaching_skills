          answer: （1）$90$；（2）$160$；（3）①$7$，$8$，$\dfrac{40}{7}$；②见解析
          clue: （1）圆心角$=360°\times$占比；（2）$C$人数$\div$占比$=$总人数；（3）按定义计算平均数、中位数、方差。
          solution_steps:
            - title: 第（1）问
              content: |
                解：$\dfrac{28}{160}\times360^{\circ}=90^{\circ}$，
                $\therefore$扇形统计图中"B舞蹈"所在扇形的圆心角度数为$90^{\circ}$。
            - title: 第（2）问
              content: |
                解：总人数：$40\div25\%=160$（人），
                B的人数：$160\times\dfrac{90}{360}=40$（人），
                则E的人数为：$160-40-28-40-12=40$（人）。
            - title: 第（3）问
              content: |
                解：①$\bar{x}_{乙}=\dfrac{3+4+8+8+8+9+9}{7}=7$；
                乙的数据排列为：$3,4,8,8,8,9,9$，则$b=8$；
                $c=\dfrac{1}{7}\left[(6-7)^{2}+(8-7)^{2}+(8-7)^{2}+(8-7)^{2}+(7-7)^{2}+(6-7)^{2}+(7-7)^{2}\right]=\dfrac{40}{7}$。
                ②甲、乙的平均数一样，说明甲、乙的平均水平接近，乙的中位数高于甲，说明乙的高分多，甲的方差小，说明成绩更加稳定。

