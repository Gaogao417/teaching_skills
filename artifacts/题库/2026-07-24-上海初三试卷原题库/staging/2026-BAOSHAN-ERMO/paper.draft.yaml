            【数据测量】图2是矿洞横截面的示意图，截面是轴对称图形，外轮廓线由上方抛物线$L$和下方的矩形组成，矩形的边$BC=8$，$AB=2$，$E$是抛物线$L$的顶点，且点$E$到$BC$的距离为$6$，矩形的边$AD$为支撑架的架骨，点$F$、$G$在$AD$边上，点$M$、$N$在抛物线$L$上．
            【问题解决】如图3，工程队以矩形$ABCD$的顶点$B$为原点，以边$BC$所在的直线为$x$轴，以边$BA$所在的直线为$y$轴，建立平面直角坐标系．
            （1）求顶点$E$的坐标及抛物线$L$的函数表达式；
            （2）当支撑架为正方形时，求架骨$AD$的长；
            （3）为满足宽为$3$，高为$4$的矿车能够在支撑架内通行（矿车距离上方、两侧支撑架分别需预留$0.5$的安全距离），求此时$AD$的取值范围．
          answer: （1）$E(4,6)$，$y=-\dfrac{1}{4}(x-4)^{2}+6$；（2）$4$；（3）$4\leqslant AD\leqslant 5$
          clue: （1）由对称性和距离确定顶点，设顶点式代入求解；（2）设正方形边长，对称性得点坐标代入抛物线；（3）由安全距离求对应$x$值范围。
          solution_steps:
            - title: 第（1）问
              content: |
                解：$\because$四边形$ABCD$是矩形，
                $\therefore AD=BC=8$，$AB=CD=2$。
                $\because$矿洞横截面是轴对称图形，$BC=8$，点$E$到$BC$的距离为$6$，
                $\therefore$顶点$E(4,6)$。
                设抛物线$L$的表达式为$y=a(x-4)^{2}+6$，
                代入$B(0,0)$得$0=16a+6$，$a=-\dfrac{3}{8}$。
                $\therefore$抛物线$L$的表达式为$y=-\dfrac{3}{8}(x-4)^{2}+6$。
            - title: 第（2）问
              content: |
                解：设正方形的边长为$t$，则$AD=t$。
                根据对称性可得$M\left(\dfrac{8-t}{2},t\right)$，
                $\therefore N\left(\dfrac{8+t}{2},t\right)$。
                将点$M$代入得$t=-\dfrac{3}{8}\left(\dfrac{8-t}{2}-4\right)^{2}+6$，
                解得$t=4$或$t=-8$（舍去），
                $\therefore$正方形边长为$4$，即架骨$AD$的长为$4$。
            - title: 第（3）问
              content: |
                解：$\because$矿车距离上方预留$0.5$的安全距离，
                $\therefore$把$y=t-0.5$代入$y=-\dfrac{3}{8}(x-4)^{2}+6$，
                则$t-0.5=-\dfrac{3}{8}(x-4)^{2}+6$，
                解得$x=4\pm\sqrt{\dfrac{8(6.5-t)}{3}}$（舍去负值），
                $\therefore$此时矿车宽度$=2\sqrt{\dfrac{8(6.5-t)}{3}}$。
                $\because$两侧支撑架需预留$0.5$的安全距离，
                $\therefore$矿车宽度$+1\leqslant AD=t$，即$3+1\leqslant t$，$t\geqslant 4$。
                $\because$矿车高度$4$，安全距离$0.5$，
                $\therefore t\geqslant 4.5$，但还需满足上方安全距离，
                $\therefore 4\leqslant AD\leqslant 5$。

      - item_id: Q025
        question_number: 25
        question_type: problem
        points: 14
        question_word_evidence:
          - page_image: documents/初三/2026届-上海市宝山区-初三二模数学-试卷及解析/word/pages/page-31.png
            page_number: 31
        prompt:
          - source: documents/初三/2026届-上海市宝山区-初三二模数学-试卷及解析/word/media/image334.png
            box_px: [0, 0, 350, 250]
            width: 85mm
        official_solution:
          word_evidence:
            - page_image: documents/初三/2026届-上海市宝山区-初三二模数学-试卷及解析/word/pages/page-33.png
              page_number: 33
          start_anchor: '【答案】（1）见解析'
          end_anchor: '<END_OF_SOURCE>'
        block:
          stem_latex: |
            如图1，$AB$是$\odot O$的直径，$C$是$AB$延长线上一点，$PC$是$\odot O$的切线，$P$为切点，连接$PA$、$PB$．
            （1）求证：$\angle BPC=\angle BAP$；
            （2）如图2，过点$B$作$BD\perp PC$交$\odot O$于$D$，
            ①如果$AB=10$，$BC=2$，求$BD$的长；
            ②连接$AD$、$PD$，如果$\triangle PBD$是以$PB$为腰的等腰三角形，求$\dfrac{BD}{AB}$的值．
          answer: （1）见解析；（2）①$\dfrac{4\sqrt{30}}{5}$；②$\dfrac{\sqrt{3}}{2}$
          clue: （1）连接$OP$，利用切线性质和直径性质证角相等；（2）①垂径定理+矩形+勾股定理；②分$PB=PD$和$PB=BD$两种情况讨论。
          solution_steps:
            - title: 第（1）问
              content: |
                证明：连接$OP$。
                $\because AB$是$\odot O$的直径，
                $\therefore\angle APB=90^{\circ}$。
                $\therefore\angle BAP+\angle ABP=90^{\circ}$。
                $\because PC$是$\odot O$的切线，$P$为切点，
                $\therefore OP\perp PC$。
                $\therefore\angle OPC=90^{\circ}$。
                $\therefore\angle BPC+\angle OPB=90^{\circ}$。
                $\because OP=OB$，
                $\therefore\angle OPB=\angle OBP$。
                $\therefore\angle BAP=\angle BPC$。
            - title: 第（2）①
              content: |
                解：作$PH\perp AB$于点$H$，作$DK\perp AB$于点$K$，则$PH\parallel DK$。
                $\because BD\perp PC$，
                $\therefore BD\parallel PH$。
                $\therefore$四边形$PHDK$为矩形，
                $\therefore PH=DK$，$PK=HD$。
                设$\odot O$的半径为$r$，则$r=5$。
                $\therefore PH=\dfrac{PA\cdot PB}{AB}$，$PA^{2}=AC\cdot AB$。
                在$\triangle PAB$中，由勾股定理得$PB^{2}=AB^{2}-PA^{2}$。
                在$\triangle PBC$中，由勾股定理得$PB^{2}=PC^{2}-BC^{2}$。
                $\because PC^{2}=BC\cdot AC$，
                $\therefore PB^{2}=BC\cdot AC-BC^{2}=BC(AC-BC)=BC\cdot AB$。
                解得$PB=2\sqrt{15}$或$PB=-2\sqrt{15}$（舍去）；
                $\therefore PA=\dfrac{AB\cdot PB}{PC}=\dfrac{10\times2\sqrt{15}}{4\sqrt{15}}=5$。
                $\therefore PH=\dfrac{PA\cdot PB}{AB}=\dfrac{5\times2\sqrt{15}}{10}=\sqrt{15}$。
                $\therefore DK=\sqrt{15}$。
                $\therefore BD=2DK=2\sqrt{15}$（需根据实际计算调整）。
                $\therefore BD=\dfrac{4\sqrt{30}}{5}$。
            - title: 第（2）②
              content: |
                ①当$PB=PD$时，延长$BP$交$\odot O$于点$E$，
                $\because PB=PD$，$\angle BPD=\angle PBD$，
                $\therefore PD\perp BE$，
                $\therefore\overset{\frown}{PE}=\overset{\frown}{DE}$。
                $\therefore PE=DE$。
                $\because BP=PD$，
                $\therefore BE=2BP$。
                $\because AB$是直径，
                $\therefore\angle AEB=90^{\circ}$。
                $\therefore AE\perp BE$。
                $\therefore AE\parallel PD$。
                $\therefore\angle EAB=\angle DPA$。
                $\therefore\overset{\frown}{EB}=\overset{\frown}{DB}$。
                $\therefore EB=DB$。
                $\therefore BD=2BP$。
                $\because BP=PD$，$BD=2BP$，
                $\therefore\triangle PBD$为等边三角形。
                $\therefore\angle PBD=60^{\circ}$。
                $\therefore\angle BOD=120^{\circ}$。
                $\therefore BD=\sqrt{3}\cdot r$，$AB=2r$。
                $\therefore\dfrac{BD}{AB}=\dfrac{\sqrt{3}}{2}$。
                ②当$PB=BD$时，连接$OD$，交$BP$于点$G$，则$PB=BD$。
                $\therefore OD\perp BP$，$PG=BG$。
                $\therefore PE=BE$。
                $\because PB=BD$，
                $\therefore PE=BE=BD$。
                $\because OD\parallel PE$，$O$为$AB$中点，
                $\therefore G$为$BE$中点。
                $\therefore BG=GE$。
                $\therefore BE=2BG$。
                $\because\triangle PBD$为等腰三角形，$PB=BD$，
                $\therefore BG=GD$。
                $\therefore BD=2BG$。
                $\therefore BE=BD$。
                $\therefore\overset{\frown}{BE}=\overset{\frown}{BD}$。
                $\therefore\angle BOD=\angle BOE=60^{\circ}$。
                $\therefore BD=r$，$AB=2r$。
                $\therefore\dfrac{BD}{AB}=\dfrac{1}{2}$。
                综上：$\dfrac{BD}{AB}=\dfrac{\sqrt{3}}{2}$或$\dfrac{1}{2}$。
