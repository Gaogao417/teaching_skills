        prompt: []
        official_solution:
          word_evidence:
            - page_image: documents/初三/2026届-上海市宝山区-初三二模数学-试卷及解析/word/pages/page-02.png
              page_number: 2
          start_anchor: '【答案】D'
          end_anchor: '3. 下列'
        block:
          stem_latex: '若$a>b$，则下列式子正确的是（\quad）'
          choices:
            - $-2a>-2b$
            - $\dfrac{1}{2}a<\dfrac{1}{2}b$
            - $2-a>2-b$
            - $a-2>b-2$
          answer: D
          clue: 逐项验证不等式性质：乘负数变号，乘正数不变号，加减不变号。
          solution_steps:
            - title: 详解
              content: |
                A、在不等式$a>b$的两边同时乘以$-2$，不等号的方向改变，即$-2a<-2b$，故本选项错误；
                B、在不等式$a>b$的两边同时乘以$\dfrac{1}{2}$，不等式仍成立，即$\dfrac{1}{2}a>\dfrac{1}{2}b$，故本选项错误；
                C、在不等式$a>b$的两边同时乘以$-1$，得到$-a<-b$，再在两边同时加上$2$，不等式仍成立，即$2-a<2-b$，故本选项错误；
                D、在不等式$a>b$的两边同时减去$2$，不等式仍成立，即$a-2>b-2$，故本选项正确；故选：D。

      - item_id: Q003
        question_number: 3
