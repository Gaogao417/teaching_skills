            - $5$
            - $\dfrac{1}{5}$
            - $0$
          answer: A
          clue: 负数小于0，负数小于正数，比较四个数的大小。
          solution_steps:
            - title: 详解
              content: '实数大小比较中，负数小于0，负数小于正数，四个选项中唯一的负数$-5$一定小于$5$，$\dfrac{1}{5}$和$0$，因此最小的数是$-5$。'

      - item_id: Q002
        question_number: 2
        question_type: choice
        points: 4
        question_word_evidence:
          - page_image: documents/初三/2026届-上海市宝山区-初三二模数学-试卷及解析/word/pages/page-02.png
