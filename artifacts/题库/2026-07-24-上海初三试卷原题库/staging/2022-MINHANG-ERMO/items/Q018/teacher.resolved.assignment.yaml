  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 如图，$\mathrm{Rt}\triangle ABC$ 中 $\angle ACB=90^{\circ}$，$M$ 为 $AB$ 中点，将 $AM$ 沿 $CM$ 翻折，$A$ 落在 $A^{\prime}$ 处，$A^{\prime}M\perp AB$ 交 $BC$ 于 $D$，则 $A^{\prime}D:DM=$______
    answer: $\sqrt{2}$
    clue: 角平分线+全等。
    solution_steps:
    - 作 $\angle ACB$ 平分线 $CF$，证 $\triangle A^{\prime}CD\cong\triangle FCD$，$A^{\prime}D=FD$。
    - $\sin\angle DFM=\dfrac{DM}{A^{\prime}D}=\dfrac{\sqrt{2}}{2}$，$\therefore A^{\prime}D:DM=\sqrt{2}$。
