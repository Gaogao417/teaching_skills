    stem_latex: 放学时间统计（甲10人占25%、乙26人、丙未知），扇形图中丙的圆心角是______度。
    answer: '36'
    clue: 总人数 $10\div25\%=40$，丙4人。
    solution_steps:
    - 总人数40，丙 $40-10-26=4$，圆心角 $\dfrac{4}{40}\times360^{\circ}=36^{\circ}$。
