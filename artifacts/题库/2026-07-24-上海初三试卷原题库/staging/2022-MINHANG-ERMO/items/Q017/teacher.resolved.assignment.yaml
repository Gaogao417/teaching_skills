    id: Q017
    points: 4
    stem_latex: 正六边形 $ABCDEF$ 对角线 $FB$ 上一点 $G$，$BG=3FG$，联结 $FC$，若 $\triangle EFG$ 面积为1，则 $\triangle FBC$ 面积为______
    answer: '4'
    clue: $EF\parallel BC$，$BF=4FG$。
    solution_steps:
    - $\angle CBF=\angle EFB=90^{\circ}$，$EF\parallel BC$，$BF=4FG$，$S_{\triangle FBC}=4S_{\triangle EFG}=4$。
