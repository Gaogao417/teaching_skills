  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases} x+y=5 \\ 4x^{2}-9y^{2}=0 \end{cases}$
    answer: $\begin{cases} x_{1}=15 \\ y_{1}=-10 \end{cases}$ 或 $\begin{cases} x_{2}=3 \\ y_{2}=2 \end{cases}$
    clue: ②因式分解降次。
    solution_steps:
    - ②化为 $(2x+3y)(2x-3y)=0$。
    - 与①联立解得 $\begin{cases}x=15\\y=-10\end{cases}$ 或 $\begin{cases}x=3\\y=2\end{cases}$。
