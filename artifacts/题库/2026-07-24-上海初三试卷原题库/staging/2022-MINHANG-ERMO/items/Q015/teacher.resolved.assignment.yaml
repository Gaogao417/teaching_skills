  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如图，过原点且平行于 $y=3x-1$ 的直线与反比例函数 $y=\dfrac{k}{x}$（$x>0$）交于 $C$，直线上 $A(1,3)$，$AB\perp x$ 轴交反比例图象于 $D$，$AD=2BD$，则 $C$ 的坐标为______
    answer: $\left(\dfrac{\sqrt{3}}{3},\sqrt{3}\right)$
    clue: 由 $AD=2BD$ 求 $D$，得 $k$，联立求 $C$。
    solution_steps:
    - $A(1,3)$，$AB=3$，$AD=2BD$，$BD=1$，$D(1,1)$，$k=1$，反比例 $y=\dfrac{1}{x}$。
    - 直线 $y=3x$ 与 $y=\dfrac{1}{x}$ 联立，$C\left(\dfrac{\sqrt{3}}{3},\sqrt{3}\right)$。
