  - type: problem
    id: Q023
    points: 12
    stem_latex: '矩形 $ABCD$，$E$ 在 $BC$ 上，将 $AE$ 绕 $E$ 顺时针旋转 $90^{\circ}$，$A$ 落在 $F$，$EF$ 交 $CD$ 于 $M$，过 $F$ 作 $FG\perp BC$ 交 $BC$ 延长线于 $G$。

      (1) 求证：$BE=FG$；

      (2) 若 $AB\cdot DM=EC\cdot AE$，求证：$AM$ 垂直平分 $DE$。'
    answer: 见证明
    clue: (1) AAS全等；(2) 相似+HL全等。
    solution_steps:
    - (1) $\angle GEF=\angle BAE$，$\angle ABE=\angle EGF=90^{\circ}$，$AE=EF$，$\triangle ABE\cong\triangle EGF$（AAS），$BE=FG$。
    - (2) $\triangle ABE\sim\triangle ECM$，$\dfrac{AB}{EC}=\dfrac{AE}{EM}$，$AB\cdot EM=EC\cdot AE=AB\cdot DM$，$\therefore EM=DM$。$\triangle AEM\cong\triangle ADM$（HL），$AE=AD$，$AM$ 垂直平分 $DE$。
