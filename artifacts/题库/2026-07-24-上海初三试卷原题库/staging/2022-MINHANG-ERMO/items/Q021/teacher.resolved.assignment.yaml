  - type: problem
    id: Q021
    points: 10
    stem_latex: 玩具厂接到6000箱订单，改良生产线后每天多生产20箱，提前10天完成，求改良前每天生产多少箱。
    answer: $100$ 箱
    clue: 分式方程。
    solution_steps:
    - 设改良前每天 $x$ 箱，$\dfrac{6000}{x}=\dfrac{6000}{x+20}+10$。
    - 整理 $x^{2}+20x-12000=0$，$x=100$（$x=-120$ 舍）。
    source_solution_images: []
