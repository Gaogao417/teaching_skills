  - type: problem
    id: Q022
    points: 10
    stem_latex: '定义等腰三角形底边与腰的比为顶角的\u201c正对\u201d，即 $\mathrm{pre}\,A=\dfrac{BC}{AB}$（$AB=AC$）。

      (1) $\mathrm{pre}\,60^{\circ}=$（A. $\dfrac{1}{2}$；B. $1$；C. $\dfrac{\sqrt{3}}{2}$；D. $2$）；

      (2) $0^{\circ}<A<180^{\circ}$ 时 $\mathrm{pre}\,A$ 的取值范围；

      (3) 若 $\sin A=\dfrac{8}{17}$（$A$ 为锐角），求 $\mathrm{pre}\,A$。'
    answer: (1) B（$1$）；(2) $0<\mathrm{pre}\,A<2$；(3) $\dfrac{2\sqrt{17}}{17}$
    clue: (1) 等边；(3) 作高用勾股。
    solution_steps:
    - (1) 顶角60°为等边三角形，$\mathrm{pre}\,60^{\circ}=1$。
    - (2) $A\to0^{\circ}$ 时 $\mathrm{pre}\,A\to0$；$A\to180^{\circ}$ 时 $\to2$，$\therefore 0<\mathrm{pre}\,A<2$。
    - (3) 作 $BD\perp AC$，设 $BD=8k$，$AB=17k$，$AD=15k$，$CD=2k$，$BC=2\sqrt{17}k$，$\mathrm{pre}\,A=\dfrac{2\sqrt{17}}{17}$。
