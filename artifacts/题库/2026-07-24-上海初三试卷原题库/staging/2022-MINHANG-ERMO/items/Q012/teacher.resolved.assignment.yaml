  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 标号1、2、3的三个球不放回地取两次作点 $P(x,y)$，点 $P$ 落在直线 $y=x+1$ 上的概率是______
    answer: $\dfrac{1}{3}$
    clue: 列举法。
    solution_steps:
    - 共6种，满足 $y=x+1$ 的有 (1,2)、(2,3) 共2种，$P=\dfrac{2}{6}=\dfrac{1}{3}$。
