    id: Q016
    points: 4
    stem_latex: 等腰 $\triangle ABC$（$AC=BC$）重心 $G$，以 $2$ 为半径的 $\odot G$ 与 $AC$、$BC$ 相切，$CG=2\sqrt{5}$，则 $AB=$______
    answer: $3\sqrt{5}$
    clue: 重心+切线+勾股。
    solution_steps:
    - 延长 $CG$ 交 $AB$ 于 $M$，$CM=3\sqrt{5}$，$GM=\sqrt{5}$，$GN=2$，$CN=4$。
    - 由勾股关系列方程解得 $AM=\dfrac{3\sqrt{5}}{2}$，$AB=3\sqrt{5}$。
