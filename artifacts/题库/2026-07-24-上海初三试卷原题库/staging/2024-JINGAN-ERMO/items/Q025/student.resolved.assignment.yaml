    stem_latex: '如图，$\triangle ABC$ 中，$AB=6$，$BC=9$，$\angle B$ 为锐角，$\cos\angle ABC=\dfrac{1}{3}$。

      (1) 求 $\sin C$ 的值；

      (2) 点 $P$ 在边 $AB$ 上，点 $Q$ 是边 $BC$ 的中点，$\odot P$ 经过点 $A$，$\odot P$ 与 $\odot Q$ 外切，$\odot Q$ 直径不大于 $BC$，设 $\odot P$ 半径为 $x$，$\odot Q$ 半径为 $y$，求 $y$ 关于 $x$ 的函数解析式及定义域；

      (3) 在(2)条件下，连接 $PQ$，如果 $\triangle BPQ$ 是等腰三角形，求 $AP$ 的长。'
