  - type: problem
    id: Q025
    points: 14
    stem_latex: '如图，$\triangle ABC$ 中，$AB=6$，$BC=9$，$\angle B$ 为锐角，$\cos\angle ABC=\dfrac{1}{3}$。

      (1) 求 $\sin C$ 的值；

      (2) 点 $P$ 在边 $AB$ 上，点 $Q$ 是边 $BC$ 的中点，$\odot P$ 经过点 $A$，$\odot P$ 与 $\odot Q$ 外切，$\odot Q$ 直径不大于 $BC$，设 $\odot P$ 半径为 $x$，$\odot Q$ 半径为 $y$，求 $y$ 关于 $x$ 的函数解析式及定义域；

      (3) 在(2)条件下，连接 $PQ$，如果 $\triangle BPQ$ 是等腰三角形，求 $AP$ 的长。'
    answer: (1) $\dfrac{4\sqrt{2}}{9}$；(2) $y=\sqrt{x^2-9x+\dfrac{153}{4}}-x$（$1\leqslant x<\dfrac{17}{4}$）；(3) $AP=\dfrac{3}{2}$ 或 $3$
    clue: (1) 作 $AH\perp BC$；(2) $PQ=x+y$，勾股定理；(3) 分 $BQ=BP$、$BP=PQ$ 讨论。
    solution_steps:
    - (1) $BH=2$，$AH=4\sqrt{2}$，$HC=7$，$AC=9$，$\sin C=\dfrac{4\sqrt{2}}{9}$。
    - (2) $BP=6-x$，$BQ=\dfrac{9}{2}$，$PG=2\sqrt{2}(6-x)/3$... 勾股定理得 $PQ=\sqrt{x^2-9x+\dfrac{153}{4}}$，$y=PQ-x$，$1\leqslant x<\dfrac{17}{4}$。
    - (3) $BQ=BP$：$x=\dfrac{3}{2}$；$BP=PQ$：$x=3$。$AP=\dfrac{3}{2}$ 或 $3$。
