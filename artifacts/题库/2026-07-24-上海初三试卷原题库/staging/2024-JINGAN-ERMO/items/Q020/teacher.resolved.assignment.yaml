    stem_latex: 解不等式组：$\begin{cases} 3-x\geqslant 0 \\ \dfrac{4}{3}x+\dfrac{3}{2}>-\dfrac{x}{6} \end{cases}$，并求其整数解。
    answer: 整数解为 $0,\,1,\,2,\,3$
    clue: 分别解两个不等式取交集。
    solution_steps:
    - ① $x\leqslant3$，② $8x+9>-x$，$9x>-9$，$x>-1$。
    - 解集 $-1<x\leqslant3$，整数解 $0,1,2,3$。
