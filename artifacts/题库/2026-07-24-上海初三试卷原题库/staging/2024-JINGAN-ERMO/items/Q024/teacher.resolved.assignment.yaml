  - type: problem
    id: Q024
    points: 12
    stem_latex: '已知抛物线关于直线 $x=\dfrac{5}{2}$ 对称，且经过点 $A(0,3)$、$B(3,0)$，点 $C$ 在抛物线上，$PQ\perp y$ 轴于 $Q$。

      (1) 求抛物线的表达式；

      (2) 求 $\tan\angle BAC$ 的值；

      (3) 如果 $\angle PAC=45°$，$PQ\perp y$ 轴于 $Q$，$P$ 在对称轴右方抛物线上，求点 $P$ 的坐标。'
    answer: (1) $y=\dfrac{1}{2}x^2-\dfrac{5}{2}x+3$；(2) $\dfrac{1}{3}$；(3) $P(\dfrac{17}{3},\dfrac{44}{9})$
    clue: (1) 待定系数；(2) $\angle ABC=90°$；(3) $\tan\angle APQ=\tan\angle BAC=\dfrac{1}{3}$。
    solution_steps:
    - (1) $y=a(x-\dfrac{5}{2})^2+k$，代入 $A$、$B$ 得 $a=\dfrac{1}{2},k=-\dfrac{1}{8}$，$y=\dfrac{1}{2}x^2-\dfrac{5}{2}x+3$。
    - (2) $C(4,1)$，$\angle ABC=90°$，$\tan\angle BAC=\dfrac{BC}{AB}=\dfrac{\sqrt{2}}{3\sqrt{2}}=\dfrac{1}{3}$。
    - (3) $\angle APQ=\angle BAC$，$\dfrac{AQ}{PQ}=\dfrac{1}{3}$，$P(m,3+\dfrac{m}{3})$ 代入抛物线，$m=\dfrac{17}{3}$，$P(\dfrac{17}{3},\dfrac{44}{9})$。
