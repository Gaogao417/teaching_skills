    id: Q018
    points: 4
    stem_latex: 如图，矩形 $ABCD$ 中，$AB=8$，$BC=17$，将该矩形绕着点 $A$ 旋转，得到四边形 $AB_1C_1D_1$，使点 $D$ 在直线 $B_1C_1$ 上，那么线段 $BB_1$ 的长度是\u3000\u3000\u3000\u3000。
    answer: $\dfrac{16\sqrt{17}}{17}$ 或 $\dfrac{64\sqrt{17}}{17}$
    clue: 分两种位置讨论，$\sin\angle ADB'=\dfrac{8}{17}$。
    solution_steps:
    - 情形一：$BB_1=\dfrac{16\sqrt{17}}{17}$；情形二：$BB_1=\dfrac{64\sqrt{17}}{17}$。
