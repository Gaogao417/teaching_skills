  - type: problem
    id: Q022
    points: 10
    stem_latex: '某区连续 $5$ 年 GDP 数据：第 $1\sim4$ 年分别为 $10.0$、$11.0$、$12.4$、$13.5$ 百亿元。选直线 $AB$（$y=x+9$）或直线 $AC$ 建模预测。

      (1) 求直线 $AC$ 的表达式；

      (2) 求直线 $AC$ 的偏离方差 $S_{AC}^2$，选择更合适的模型，预测第 $5$ 年 GDP。'
    answer: (1) $y=1.2x+8.8$；(2) $S_{AC}^2=0.0125$，选 $AC$，第 $5$ 年约 $14.8$ 百亿元
    clue: (1) 待定系数；(2) 偏离方差越小越优。
    solution_steps:
    - (1) $A(1,10)$，$C(3,12.4)$ 代入得 $y=1.2x+8.8$。
    - (2) $g(1)=10,g(2)=11.2,g(3)=12.4,g(4)=13.6$，$S_{AC}^2=\dfrac{1}{4}(0+0.04+0+0.01)=0.0125<0.1025$。
    - 选 $AC$，$g(5)=14.8$。
    source_solution_images: []
