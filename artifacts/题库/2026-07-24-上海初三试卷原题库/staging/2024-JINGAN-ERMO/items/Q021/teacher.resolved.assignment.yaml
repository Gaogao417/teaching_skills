  - type: problem
    id: Q021
    points: 10
    stem_latex: '如图，$CD$ 是 $\odot O$ 的直径，$AC$、$AB$、$BD$ 是 $\odot O$ 的弦，$AB\parallel CD$。

      (1) 求证：$AC=BD$；

      (2) 如果弦 $AB$ 长为 $8$，它与劣弧 $AB$ 组成的弓形高为 $2$，求 $CD$ 的长。'
    answer: (1) 证明见详解；(2) $CD=10$
    clue: (1) $\triangle AOC\cong\triangle BOD$；(2) $R^2=(R-2)^2+4^2$。
    solution_steps:
    - (1) $OE\perp AB$，$\angle AOC=\angle BOD$，$\triangle AOC\cong\triangle BOD$，$AC=BD$。
    - (2) $BE=4$，$OE=R-2$，$R^2=(R-2)^2+16$，$R=5$，$CD=10$。
