    stem_latex: 如图，直线 $l_1$ 与 $l_2$ 交于 $C(0,1)$，夹角 $90°$，$l_1$ 交 $x$ 负半轴于 $A$，$l_2$ 交 $x$ 正半轴于 $B(2,0)$，那么点 $A$ 的坐标是\u3000\u3000\u3000\u3000。
    answer: $(-\dfrac{1}{2},0)$
    clue: $\triangle ACO\sim\triangle CBO$，$\dfrac{CO}{BO}=\dfrac{AO}{CO}$。
    solution_steps:
    - $\dfrac{1}{2}=\dfrac{AO}{1}$，$AO=\dfrac{1}{2}$，$A(-\dfrac{1}{2},0)$。
