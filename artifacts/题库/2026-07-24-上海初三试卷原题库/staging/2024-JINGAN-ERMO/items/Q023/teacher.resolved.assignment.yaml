  - type: problem
    id: Q023
    points: 12
    stem_latex: '如图，直线 $EF$ 经过矩形 $ABCD$ 顶点 $D$，过 $A$、$C$ 作 $EF$ 的垂线垂足分别为 $E$、$F$，且 $DE=DF$，连接 $AC$。

      (1) 求证：$AD^2=AE\cdot AC$；

      (2) 连接 $BE$ 和 $BF$，求证：$BE=BF$。'
    answer: (1)(2) 证明见详解
    clue: (1) $OD\parallel AE$，$\triangle AED\sim\triangle ADC$；(2) $BD$ 垂直平分 $EF$。
    solution_steps:
    - (1) $OD$ 是梯形 $AEFC$ 中位线，$OD\parallel AE$，$\angle EAD=\angle ODA=\angle OAD$，$\triangle AED\sim\triangle ADC$，$AD^2=AE\cdot AC$。
    - (2) $OD\perp EF$，$DE=DF$，$\therefore BD$ 垂直平分 $EF$，$BE=BF$。
