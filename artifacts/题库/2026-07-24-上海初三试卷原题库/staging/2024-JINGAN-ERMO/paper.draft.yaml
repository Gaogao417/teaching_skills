        page_number: 16
      start_anchor: 本题考查的是分式的化简求值
      end_anchor: 本题考查求不等式组的整数解
    block:
      stem_latex: 先化简，再求值：$\dfrac{x^2-4}{x^2-4x+4}\div\dfrac{x+2}{x+1}-\dfrac{x}{x-2}$，其中
        $x=\sqrt{2}$。
      answer: $-\dfrac{\sqrt{2}+2}{2}$
      clue: 分式化简后分母有理化代入。
      solution_steps:
      - 原式 $=\dfrac{(x+2)(x-2)}{(x-2)^2}\cdot\dfrac{x+1}{x+2}-\dfrac{x}{x-2}=\dfrac{x+1}{x-2}-\dfrac{x}{x-2}=\dfrac{1}{x-2}$。
      - $x=\sqrt{2}$：$\dfrac{1}{\sqrt{2}-2}=-\dfrac{\sqrt{2}+2}{2}$。
