  - id: Q019
    source_key: 2025-FENGXIAN-YIMO-Q19
    question_number: 19
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: foundation
    skill_tags: [特殊角三角比, 实数运算]
    stem_latex: '计算：$\cos^245^\circ+\sqrt{(1-\tan60^\circ)^2}-\dfrac{2\cot45^\circ}{\cot30^\circ+2\cos60^\circ}$。'
    answer: '$\dfrac12$'
    official_solution_latex:
      - title: 计算
        content: '$\cos^245^\circ+\sqrt{(1-\tan60^\circ)^2}-\dfrac{2\cot45^\circ}{\cot30^\circ+2\cos60^\circ}=\left(\dfrac{\sqrt2}{2}\right)^2+\sqrt{(1-\sqrt3)^2}-\dfrac{2}{\sqrt3+1}=\dfrac12+(\sqrt3-1)-(\sqrt3-1)=\dfrac12$。'
    question_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/003.png, box: [125, 1080, 600, 1220], file: source-question.png}
    solution_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/006.png, box: [150, 455, 950, 715], file: official-solution-01.png}

  - id: Q020
    source_key: 2025-FENGXIAN-YIMO-Q20
    question_number: 20
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [反比例函数, 二次函数, 待定系数法]
    stem_latex: |
      新定义：若一个点的纵坐标是横坐标的3倍，那么称这个点为三倍点。已知反比例函数的图像经过点 $A(3,4)$，二次函数 $y=ax^2+bx+c\ (a\ne0)$ 的图像经过点 $A$ 及反比例函数图像上的三倍点，求二次函数的解析式。
    answer: '$y=-x^2+3x+4$'
    official_solution_latex:
      - title: 求反比例函数及其三倍点
        content: '设反比例函数解析式为 $y=\dfrac{k}{x}\ (k\ne0)$。由图像经过 $A(3,4)$，得 $4=\dfrac{k}{3}$，解得 $k=12$，所以 $y=\dfrac{12}{x}$。设其图像上的三倍点为 $(t,3t)$，则 $3t=\dfrac{12}{t}$，解得 $t=2$ 或 $t=-2$，所以两个三倍点为 $(2,6)$、$(-2,-6)$。'
      - title: 求二次函数解析式
        content: '把 $A(3,4)$、$(2,6)$、$(-2,-6)$ 代入 $y=ax^2+bx+c$，得 $\begin{cases}9a+3b+c=4,\\4a+2b+c=6,\\4a-2b+c=-6.\end{cases}$ 解得 $a=-1,\ b=3,\ c=4$。所以二次函数解析式为 $y=-x^2+3x+4$。'
    question_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/003.png, box: [125, 1215, 970, 1470], file: source-question.png}
    solution_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/006.png, box: [150, 715, 950, 1400], file: official-solution-01.png}

  - id: Q021
    source_key: 2025-FENGXIAN-YIMO-Q21
    question_number: 21
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [平行线分线段成比例, 相似三角形, 平面向量]
    stem_latex: |
      如图4，$AB\parallel CD$，$AC$ 与 $BD$ 相交于点 $E$，$AB=9$，$CD=6$，点 $F$ 在 $AD$ 上，$S_{\triangle DEF}:S_{\triangle AEF}=2:3$。
      \begin{enumerate}
      \item 求 $EF$ 的长；
      \item 设 $\overrightarrow{EC}=\vec a$，$\overrightarrow{EF}=\vec b$，用含 $\vec a$、$\vec b$ 的式子表示 $\overrightarrow{BE}$。
      \end{enumerate}
    answer: '（1）$EF=\dfrac{18}{5}$；（2）$\overrightarrow{BE}=\dfrac32\vec a+\dfrac52\vec b$。'
    official_solution_latex:
      - title: 第（1）问
        content: '由 $AB\parallel CD$，得 $\dfrac{AB}{CD}=\dfrac{BE}{DE}=\dfrac32$。又由 $\dfrac{S_{\triangle DEF}}{S_{\triangle AEF}}=\dfrac23$，得 $\dfrac{DF}{AF}=\dfrac23$，即 $\dfrac{AF}{DF}=\dfrac32$。所以 $\dfrac{AF}{DF}=\dfrac{BE}{ED}$，从而 $EF\parallel CD$，即 $EF\parallel AB$。于是 $\dfrac{EF}{AB}=\dfrac{DF}{AD}=\dfrac25$，所以 $\dfrac{EF}{9}=\dfrac25$，得 $EF=\dfrac{18}{5}$。'
      - title: 第（2）问
        content: '由 $AB\parallel CD$，得 $\dfrac{AE}{EC}=\dfrac{AB}{CD}=\dfrac32$，且 $\overrightarrow{AE}$ 与 $\overrightarrow{EC}$ 方向相同，所以 $\overrightarrow{AE}=\dfrac32\overrightarrow{EC}=\dfrac32\vec a$。又 $EF\parallel AB$，且 $\dfrac{EF}{AB}=\dfrac25$，所以 $\overrightarrow{BA}$ 与 $\overrightarrow{EF}$ 方向相同，$\overrightarrow{BA}=\dfrac52\overrightarrow{EF}=\dfrac52\vec b$。因此 $\overrightarrow{BE}=\overrightarrow{BA}+\overrightarrow{AE}=\dfrac32\vec a+\dfrac52\vec b$。'
    question_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/004.png, box: [125, 125, 970, 400], file: source-question.png}
    prompt_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/004.png, box: [680, 155, 950, 390], file: prompt-01.png, width: 58mm}
    solution_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/007.png, box: [150, 90, 950, 850], file: official-solution-01.png}

  - id: Q022
    source_key: 2025-FENGXIAN-YIMO-Q22
    question_number: 22
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [解直角三角形, 相似三角形, 实际应用]
    stem_latex: |
      桔槔（gao）是古代汉族的一种农用工具，也是一种原始的汲水工具。它的工作原理基于杠杆原理，通过一根竖立的支架加上一根杠杆，当中是支点，末端悬挂一个重物，前段悬挂水桶。线段 $OM$ 代表固定支架，点 $D$、点 $C$ 分别代表重物和水桶，线段 $BD$、$AC$ 是无弹力、固定长度的麻绳，绳长 $AC=3$ 米，木质杠杆 $AB=6$ 米。
      \begin{enumerate}
      \item 当水桶 $C$ 的位置低于地面0.5米（如图5-1所示），支架 $OM$ 与绳子 $BD$ 之间的距离 $OH$ 是1.6米，且 $\cot B=0.75$，求桔槔支架 $OM$ 的高度；
      \item 向上提水桶 $C$ 上升到地面上方0.6米（如图5-2所示），求此时重物 $D$ 相对于（1）中的位置下降的高度。
      \end{enumerate}
    answer: '（1）$OM=4.9$米；（2）下降$0.55$米。'
    official_solution_latex:
      - title: 第（1）问
        content: '过点 $A$ 作 $AN\perp OM$ 于点 $N$，地平线与 $CD$ 交于点 $I$。在 $\mathrm{Rt}\triangle OHB$ 中，$\cot B=0.75$，$OH=1.6$米，得 $BH=OH\cdot\cot B=1.2$米，$OB=\sqrt{BH^2+OH^2}=2$米。又 $AB=6$米，所以 $AO=4$米。在 $\mathrm{Rt}\triangle AON$ 中，$\cot\angle AON=0.75$，$OA=4$米，所以 $ON=2.4$米。由题意 $NM=AI=2.5$米，因此 $OM=ON+NM=4.9$米。'
      - title: 第（2）问
        content: '过点 $O$ 作 $OQ\perp BD$ 于点 $Q$，直线 $OQ$ 交直线 $AC$ 于点 $P$。由题意得 $PA=OM-AC-0.6=1.3$米。因为 $AP\parallel BQ$，所以 $\dfrac{AP}{BQ}=\dfrac{OA}{OB}$，得 $BQ=0.65$米。故点 $B$ 相对于（1）中的位置下降 $BH-BQ=1.2-0.65=0.55$米，即重物 $D$ 下降了0.55米。'
    question_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/004.png, box: [125, 405, 970, 1100], file: source-question.png}
    prompt_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/004.png, box: [80, 650, 970, 930], file: prompt-01.png, width: 0.96\linewidth}
    solution_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/007.png, box: [150, 835, 950, 1400], file: official-solution-01.png}

  - id: Q023
    source_key: 2025-FENGXIAN-YIMO-Q23
    question_number: 23
    question_type: problem
    section_title: 三、解答题
    points: 12
    difficulty: standard
    skill_tags: [比例中项, 相似三角形, 平行线证明]
    stem_latex: |
      已知：如图6，在 $\triangle ABC$ 中，点 $D$ 在边 $AC$ 上，点 $M$、$N$ 在边 $BC$ 上，$AB$ 是线段 $AD$ 与 $AC$ 的比例中项，$\angle BAN=\angle CAM$，$AM$、$AN$ 分别交 $BD$ 于点 $E$、$F$。
      \begin{enumerate}
      \item 求证：$\dfrac{BD}{AE}=\dfrac{BC}{AN}$；
      \item 若点 $O$ 为 $BD$ 边的中点，联结 $ON$，且 $BD^2=2BN\cdot BC$，求证：$ON\parallel AB$。
      \end{enumerate}
    answer: 见证明。
    official_solution_latex:
      - title: 第（1）问
        content: '因为 $AB$ 是线段 $AD$ 与 $AC$ 的比例中项，所以 $AB^2=AD\cdot AC$，即 $\dfrac{AD}{AB}=\dfrac{AB}{AC}$。又 $\angle BAD=\angle CAB$，所以 $\triangle ABD\sim\triangle ACB$，得 $\angle ADB=\angle ABC$。又 $\angle BAN=\angle CAM$，所以 $\triangle BAN\sim\triangle DAE$，得 $\dfrac{AE}{AN}=\dfrac{AD}{AB}$。由 $\triangle ABD\sim\triangle ACB$，得 $\dfrac{BD}{CB}=\dfrac{AD}{AB}$，因此 $\dfrac{BD}{CB}=\dfrac{AE}{AN}$，即 $\dfrac{BD}{AE}=\dfrac{BC}{AN}$。'
      - title: 第（2）问
        content: '因为 $O$ 为 $BD$ 的中点，且 $BD^2=2BN\cdot BC$，所以 $2BO\cdot BD=2BN\cdot BC$，即 $BO\cdot BD=BN\cdot BC$，得 $\dfrac{BO}{BC}=\dfrac{BN}{BD}$。又 $\angle NBO=\angle DBC$，所以 $\triangle OBN\sim\triangle CBD$，得 $\angle BON=\angle C$。由 $\triangle ABD\sim\triangle ACB$，得 $\angle ABD=\angle C$，所以 $\angle BON=\angle ABD$，故 $ON\parallel AB$。'
    question_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/004.png, box: [125, 1100, 970, 1470], file: source-question.png}
    prompt_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/004.png, box: [650, 1190, 950, 1400], file: prompt-01.png, width: 72mm}
    solution_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/008.png, box: [150, 90, 950, 700], file: official-solution-01.png}

  - id: Q024
    source_key: 2025-FENGXIAN-YIMO-Q24
    question_number: 24
    question_type: problem
    section_title: 三、解答题
    points: 12
    difficulty: challenge
    skill_tags: [二次函数, 抛物线平移, 相似三角形]
    stem_latex: |
      在直角坐标平面 $xOy$ 中，直线 $y=-\dfrac14x+2$ 向下平移5个单位后，正好经过抛物线 $y=ax^2+8ax+2$ 的顶点 $C$，抛物线与 $y$ 轴交于点 $B$。
      \begin{enumerate}
      \item 求点 $C$ 的坐标；
      \item 点 $M$ 在抛物线对称轴上，且位于 $C$ 点下方，当 $\angle MBC=\angle BCO$ 时，求点 $M$ 的坐标；
      \item 将原抛物线平移，顶点 $C$ 移至直线 $y=-\dfrac14x+2$ 上，记作点 $C_1$，新抛物线与 $y$ 轴的交点记作点 $B_1$。当 $\angle BB_1C_1=45^\circ$ 时，求 $BB_1$ 的长。
      \end{enumerate}
    answer: '（1）$C(-4,-2)$；（2）$M(-4,-6)$；（3）$BB_1=3$或$5$。'
    official_solution_latex:
      - title: 第（1）问
        content: '$y=ax^2+8ax+2=a(x+4)^2+2-16a$，所以顶点 $C(-4,2-16a)$。直线 $y=-\dfrac14x+2$ 向下平移5个单位后为 $y=-\dfrac14x-3$。点 $C$ 在该直线上，解得 $a=\dfrac14$，故 $C(-4,-2)$。'
      - title: 第（2）问
        content: '抛物线 $y=\dfrac14x^2+2x+2$ 与 $y$ 轴交于 $B(0,2)$。直线 $BC$ 与 $x$ 轴交于 $E(-2,0)$，在 $\mathrm{Rt}\triangle EOB$ 中，$OE=OB=2$，所以 $\angle BEO=\angle EBO=45^\circ$，$\angle CEO=135^\circ$。因为 $CM\parallel OB$，所以 $\angle MCB+\angle CBO=180^\circ$，得 $\angle MCB=135^\circ=\angle CEO$。由题设 $\angle MBC=\angle BCO$，所以 $\triangle BCM\sim\triangle CEO$。于是 $\dfrac{CM}{OE}=\dfrac{BC}{CE}=\dfrac{4\sqrt2}{2\sqrt2}=2$，得 $CM=4$，所以 $M(-4,-6)$。'
      - title: 第（3）问
        content: '设平移后的抛物线顶点为 $C_1(n,-\dfrac14n+2)$，则新抛物线解析式为 $y=\dfrac14(x-n)^2-\dfrac14n+2$，所以 $B_1(0,\dfrac14n^2-\dfrac14n+2)$。过 $C_1$ 作 $C_1H\perp y$ 轴于点 $H$。由 $\angle BB_1C_1=45^\circ$，得 $C_1H=B_1H$，所以 $n=\dfrac14n^2$ 或 $-n=\dfrac14n^2$，解得 $n=-4$ 或 $n=4$。当 $n=-4$ 时，$BB_1=\dfrac14n^2-\dfrac14n=5$；当 $n=4$ 时，$BB_1=\dfrac14n^2-\dfrac14n=3$。'
    question_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/005.png, box: [125, 75, 700, 570], file: source-question-header.png}
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/005.png, box: [550, 250, 1000, 710], file: source-question-diagram.png}
    solution_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/008.png, box: [150, 685, 950, 1510], file: official-solution-01.png}
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/009.png, box: [170, 95, 930, 390], file: official-solution-02.png}

  - id: Q025
    source_key: 2025-FENGXIAN-YIMO-Q25
    question_number: 25
    question_type: problem
    section_title: 三、解答题
    points: 14
    difficulty: challenge
    skill_tags: [矩形, 相似三角形, 分类讨论]
    stem_latex: |
      如图8，矩形 $ABCD$ 中，$AB=2BC$，点 $E$ 在射线 $BA$ 上，点 $F$ 在射线 $BC$ 上，且 $DF\perp DE$，射线 $EF$ 与对角线 $AC$ 交于点 $G$，与射线 $DC$ 交于点 $M$。
      \begin{enumerate}
      \item 当点 $E$ 在线段 $BA$ 上时，求 $\angle DFM$ 的正切值；
      \item 当 $G$ 是 $AC$ 中点时，求 $\dfrac{DM}{CM}$ 的值；
      \item 当 $BC=3$，且 $\triangle DGM$ 与 $\triangle DCF$ 相似时，直接写出 $AE$ 的长。
      \end{enumerate}
    answer: '（1）$\tan\angle DFM=\dfrac12$；（2）$\dfrac{DM}{CM}=\dfrac53$；（3）$AE=\dfrac{3\sqrt5-3}{2}$或$3\sqrt5-6$。'
    official_solution_latex:
      - title: 第（1）问
        content: '因为四边形 $ABCD$ 是矩形，所以 $\angle DAB=\angle ADC=\angle DCF=90^\circ$，$AB=CD$，$BC=AD$。又 $DF\perp DE$，所以 $\angle EDF=90^\circ=\angle ADC$，得 $\angle EDA=\angle DFC$。于是 $\triangle DAE\sim\triangle DCF$，所以 $\dfrac{DA}{DC}=\dfrac{DE}{DF}$。在 $\mathrm{Rt}\triangle DEF$ 中，$\tan\angle DFM=\dfrac{DE}{DF}=\dfrac{DA}{DC}=\dfrac12$。'
      - title: 第（2）问
        content: '由 $\dfrac{DA}{DE}=\dfrac{DC}{DF}$ 且 $\angle ADC=\angle EDF=90^\circ$，得 $\triangle DEF\sim\triangle DAC$。再由角关系可得 $\triangle GMC\sim\triangle DMF$，继而 $\triangle GMD\sim\triangle CMF$，所以 $\dfrac{GM}{GD}=\dfrac{CM}{CF}$。设 $AD=BC=m$，则 $AB=CD=2m$，$AC=\sqrt5m$。因为 $G$ 是 $AC$ 中点，且 $\angle DGM=90^\circ$，所以 $DG=GC=\dfrac{\sqrt5}{2}m$。由相似关系得 $GM=\dfrac{\sqrt5}{4}m$，从而在 $\mathrm{Rt}\triangle DGM$ 中，$DM=\dfrac54m$，$CM=CD-DM=\dfrac34m$，故 $\dfrac{DM}{CM}=\dfrac53$。'
      - title: 第（3）问
        content: '分类讨论 $\triangle DGM\sim\triangle DCF$ 的对应关系，可得 $AE=\dfrac{3\sqrt5-3}{2}$ 或 $AE=3\sqrt5-6$。'
    question_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/005.png, box: [125, 720, 970, 1010], file: source-question-header.png}
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/005.png, box: [125, 1000, 970, 1280], file: source-question-diagram.png}
    prompt_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/005.png, box: [150, 1010, 950, 1240], file: prompt-01.png, width: 0.96\linewidth}
    solution_crops:
      - {source: documents/初三/2025届-上海市奉贤区-初三一模数学-试卷及参考答案/009.png, box: [150, 390, 950, 1395], file: official-solution-01.png}
