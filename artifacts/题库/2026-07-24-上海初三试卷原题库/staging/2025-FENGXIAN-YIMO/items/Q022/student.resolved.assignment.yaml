    stem_latex: '桔槔（gao）是古代汉族的一种农用工具，也是一种原始的汲水工具。它的工作原理基于杠杆原理，通过一根竖立的支架加上一根杠杆，当中是支点，末端悬挂一个重物，前段悬挂水桶。线段 $OM$ 代表固定支架，点 $D$、点 $C$ 分别代表重物和水桶，线段 $BD$、$AC$ 是无弹力、固定长度的麻绳，绳长 $AC=3$ 米，木质杠杆 $AB=6$ 米。

      \begin{enumerate}

      \item 当水桶 $C$ 的位置低于地面0.5米（如图5-1所示），支架 $OM$ 与绳子 $BD$ 之间的距离 $OH$ 是1.6米，且 $\cot B=0.75$，求桔槔支架 $OM$ 的高度；

      \item 向上提水桶 $C$ 上升到地面上方0.6米（如图5-2所示），求此时重物 $D$ 相对于（1）中的位置下降的高度。

      \end{enumerate}

      '
