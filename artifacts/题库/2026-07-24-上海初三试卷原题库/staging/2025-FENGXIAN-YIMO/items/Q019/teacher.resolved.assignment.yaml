    stem_latex: 计算：$\cos^245^\circ+\sqrt{(1-\tan60^\circ)^2}-\dfrac{2\cot45^\circ}{\cot30^\circ+2\cos60^\circ}$。
    answer: $\dfrac12$
    solution_steps:
    - title: 计算
      content: $\cos^245^\circ+\sqrt{(1-\tan60^\circ)^2}-\dfrac{2\cot45^\circ}{\cot30^\circ+2\cos60^\circ}=\left(\dfrac{\sqrt2}{2}\right)^2+\sqrt{(1-\sqrt3)^2}-\dfrac{2}{\sqrt3+1}=\dfrac12+(\sqrt3-1)-(\sqrt3-1)=\dfrac12$。
