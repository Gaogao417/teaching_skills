    stem_latex: 一个边长为10厘米的正方形，如果它的边长减少 $x$ 厘米（$0<x<10$），则正方形的面积随之减少 $y$ 平方厘米，那么 $y$ 关于 $x$ 的函数解析式是 \underline{\hspace{2cm}}。
    answer: $y=20x-x^2$
