  - type: choice
    id: Q003
    points: 4
    stem_latex: 下列说法错误的是（　）
    choices:
      A: 如果 $\vec a$ 与 $\vec b$ 都是单位向量，那么 $|\vec a|=|\vec b|$
      B: 如果 $k\vec a=\vec0$，那么 $k=0$ 或 $\vec a=\vec0$
      C: 如果 $\vec a=-3\vec b$（$\vec b$ 为非零向量），那么 $\vec a+3\vec b=\vec0$
      D: 如果 $\vec a+\vec b=2\vec c$，$\vec a-\vec b=3\vec c$（$\vec c$ 为非零向量），那么 $\vec a$ 与 $\vec b$ 平行
