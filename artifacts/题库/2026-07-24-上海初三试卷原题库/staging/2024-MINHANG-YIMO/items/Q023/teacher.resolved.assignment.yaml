  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，在 $\triangle ABC$ 中，$D,E$ 在边 $AB$ 上，$AC^2=AD\cdot AB$，$AC=AE$，过点 $D$ 作 $DF\parallel CE$ 交边 $AC$ 于点 $F$。\begin{enumerate}\item 求证：$\triangle ACD\sim\triangle ABC$；\item 求证：$AE\cdot EB=AB\cdot FC$。\end{enumerate}
    answer: 证明见解答。
    solution_steps:
    - title: 官方解答
      content: （1）$\because AC^2=AD\cdot AB$，$\therefore\dfrac{AD}{AC}=\dfrac{AC}{AB}$。又 $\angle CAD=\angle BAC$，故 $\triangle ACD\sim\triangle ABC$。（2）由相似得 $\angle DCF=\angle B$。又 $AE=AC$，所以 $\angle AEC=\angle ACE$。结合角的分解得 $\angle ECB=\angle DCE$。由 $DF\parallel CE$ 得 $\angle DCE=\angle FDC$，故 $\triangle DFC\sim\triangle CEB$，$\dfrac{FB}{FC}=\dfrac{BC}{DC}$。再由 $\triangle ACD\sim\triangle ABC$ 得 $\dfrac{BC}{DC}=\dfrac{AB}{AC}$，且 $AC=AE$，所以 $\dfrac{FB}{FC}=\dfrac{AB}{AE}$，即 $AE\cdot FB=AB\cdot FC$。因 $FB=AE-EB$，故 $AE\cdot EB=AB\cdot FC$。
