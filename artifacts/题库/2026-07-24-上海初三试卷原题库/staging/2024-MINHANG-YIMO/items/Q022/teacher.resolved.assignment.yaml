  - type: problem
    id: Q022
    points: 10
    stem_latex: 诱发高速公路夜间行车安全事故的一个重要原因是眩光现象。夜间会车时，对向车辆车灯的强光射向驾驶员，存在安全隐患。目前主要措施是设置防眩装置遮挡车辆灯光，避免强光射向对向车道的驾驶员。如图，一条东西方向的双向笔直道路，中央隔离带中轴线 $l$ 垂直平分每块遮光板，遮光板宽度是 $0.2$ 米，即 $PO=MN=0.2$ 米。一辆摩托车自西向东行驶，车灯位于点 $A$ 时，光线 $AC$ 经过相邻 $2$ 个遮光板外侧的点 $O,M$，光线 $AD$ 经过遮光板外侧的点 $P$，点 $D,C$ 在对向车道驾驶员行驶路线上。$AB\perp DC$ 于点 $B$，两侧驾驶员行驶路线之间的距离 $AB=4$ 米，光线和行驶路线的夹角 $\angle BDA=11.4^\circ$，点 $A,B,C,D,P,Q,M,N$ 在同一平面内。（参考数据：$\tan11.4^\circ\approx\dfrac15$）\begin{enumerate}\item $BD$ 的长度是多少米？\item 相邻遮光板的距离 $PM$ 是多少米？\end{enumerate}
    answer: （1）$20$ 米；（2）$\dfrac{42}{19}$ 米
    solution_steps:
    - title: 官方解答
      content: （1）在 $\mathrm{Rt}\triangle ABD$ 中，$\angle ABD=90^\circ$，$AB=4$，$\tan\angle ADB=\dfrac{AB}{BD}=\dfrac15$，得 $BD=20$ 米。（2）延长 $MP$ 交 $AB$ 于点 $H$，则 $MH\perp AB$。由 $PQ=0.2$ 米、$AB=4$ 米，$AH=\dfrac12(AB-PQ)+PQ=2.1$ 米。$HP\parallel BD$，$\triangle AHP\sim\triangle ABD$，得 $HP=10.5$ 米。又 $MP\parallel OQ$，$\triangle MPO\sim\triangle MHA$，由 $\dfrac{MP}{PO}=\dfrac{MH}{AH}$，得 $MP=\dfrac{42}{19}$ 米。
