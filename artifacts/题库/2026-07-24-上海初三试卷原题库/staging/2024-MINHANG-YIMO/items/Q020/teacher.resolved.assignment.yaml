    id: Q020
    points: 10
    stem_latex: 如图，在平行四边形 $ABCD$ 中，点 $M,N$ 分别是边 $DC,BC$ 的中点，设 $\overrightarrow{AB}=\vec a$，$\overrightarrow{AD}=\vec b$。\begin{enumerate}\item $\overrightarrow{DB}=$ \fillin，$\overrightarrow{MN}=$ \fillin（用含有向量 $\vec a,\vec b$ 的式子表示）；\item 在图中画出 $\overrightarrow{AN}$ 在向量 $\vec a$ 和 $\vec b$ 方向上的分向量。（不要求写作法，但要保留作图痕迹，并写明结论）\end{enumerate}
    answer: （1）$\vec a-\vec b$，$\dfrac12\vec a-\dfrac12\vec b$；（2）画图、结论正确
    solution_steps:
