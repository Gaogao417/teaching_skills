    stem_latex: 如图，在 $\mathrm{Rt}\triangle ABC$ 中，$\angle ACB=90^\circ$，以 $AC,BC$ 为边在 $\triangle ABC$ 外部作等边三角形 $ACE$ 和等边三角形 $BCF$，且联结 $EF$。\begin{enumerate}\item 如图1，联结 $AF,EB$，求证：$\triangle ECB\cong\triangle ACF$；\item 如图2，延长 $AC$ 交线段 $EF$ 于点 $M$。\begin{enumerate}\item 当点 $C$ 是线段 $AM$ 的中点时，求 $\dfrac{AC}{BC}$ 的值；\item 请用直尺和圆规在直线 $AB$ 上方作等边三角形 $ABK$（不要求写作法，保留作图痕迹，备用图可使用），当点 $M$ 在 $\triangle ABK$ 的内部时，求 $\dfrac{AC}{BC}$ 的取值范围。\end{enumerate}\end{enumerate}
    answer: （1）证明见解答；（2）①$\dfrac{AC}{BC}=\dfrac{2\sqrt3}{3}$；②$\dfrac{\sqrt3}{3}<\dfrac{AC}{BC}<\dfrac{2\sqrt3}{3}$。
    solution_steps:
    - title: 官方解答
      content: （1）$\because \triangle AEC$ 和 $\triangle FCB$ 是等边三角形，$\therefore CE=CA$，$CF=CB$，且 $\angle ECA=\angle FCB=60^\circ$，所以 $\angle ECB=\angle ACF$。由边角边得 $\triangle ECB\cong\triangle ACF$。（2）①按原解延长 $FC$ 交 $AE$ 于 $H$。由角关系及 $CE=CA$ 得 $CH\perp EA$ 且 $AH=HE$。当 $C$ 为 $AM$ 中点时，$EM=MF$，从而 $FC=2CH$，计算得 $\dfrac{AC}{BC}=\dfrac{2\sqrt3}{3}$。②作等边三角形并分别讨论边界情形，原解得到当 $M$ 在等边三角形内部时：$\dfrac{\sqrt3}{3}<\dfrac{AC}{BC}<\dfrac{2\sqrt3}{3}$。
