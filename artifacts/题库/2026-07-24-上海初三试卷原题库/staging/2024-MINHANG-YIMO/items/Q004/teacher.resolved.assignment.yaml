    stem_latex: 如图，已知 $l_1\parallel l_2\parallel l_3$，直线 $l_1,l_2,l_3$ 分别交直线 $l_4$ 于点 $A,B,C$，交直线 $l_5$ 于点 $D,E,F$，那么下列比例式正确的是（　）
