      B: $\dfrac{AB}{DE}=\dfrac{BE}{AD}$
      C: $\dfrac{AB}{BC}=\dfrac{DF}{EF}$
      D: $\dfrac{DF}{EF}=\dfrac{CF}{BE}$
    explanation: 参考答案：A。
