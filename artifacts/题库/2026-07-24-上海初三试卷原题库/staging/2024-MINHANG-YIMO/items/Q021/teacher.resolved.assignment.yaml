  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在坐标平面 $xOy$ 中，一次函数 $y=x+2$ 的图像与反比例函数 $y=\dfrac{k}{x}$（$k\ne0$）的图像交于点 $A(a,3)$，与 $x$ 轴交于点 $B$。\begin{enumerate}\item 求这个反比例函数的解析式；\item 过点 $A$ 作 $AC\perp x$ 轴，垂足为点 $C$，将一次函数图像向右平移，且经过点 $C$，求平移后的一次函数的解析式。\end{enumerate}
    answer: （1）$y=\dfrac3x$；（2）$y=x-1$
    solution_steps:
    - title: 官方解答
      content: （1）$\because$ 一次函数图像 $y=x+2$ 经过点 $A(a,3)$，$\therefore A(1,3)$。$\because y=\dfrac{k}{x}$ 图像经过点 $A(1,3)$，$\therefore k=3$，故反比例函数为 $y=\dfrac3x$。（2）$\because AC\perp x$ 轴，$\therefore C(1,0)$。设平移后为 $y=x+b$，代入 $C(1,0)$ 得 $b=-1$，故 $y=x-1$。
