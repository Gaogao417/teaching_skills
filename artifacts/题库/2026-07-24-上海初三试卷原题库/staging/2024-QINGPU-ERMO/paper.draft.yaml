  - {item_id: Q023, question_number: 23, question_type: problem, points: 12, question_word_evidence: [{page_image: documents/初三/2024届-上海市青浦区-初三二模数学-试卷及解析/word/pages/page-4.png, page_number: 4}], prompt: [], official_solution: {word_evidence: [{page_image: documents/初三/2024届-上海市青浦区-初三二模数学-试卷及解析/word-answers/pages/page-5.png, page_number: 5}], start_anchor: 解答, end_anchor: 解答}, block: {stem_latex: '四边形 $ABCD$ 中 $AD\parallel BC$，$E$ 在 $AC$ 上 $EA=ED$，$\angle DAB=\angle DEC=\angle DCB$。(1) 求证菱形；(2) 延长 $DE$ 交 $AB$、$CB$ 延长线于 $F$、$G$，$GB=BC$，求证 $AD^2=2EF\cdot GD$。', answer: '(1)(2) 证明见详解', clue: '(1) $\angle ADE=\angle BAC$，$BA=BC$；(2) $\triangle AEF\sim\triangle GCD$。', solution_steps: ['(1) 平行四边形 + $BA=BC$ 得菱形。', '(2) $AF=\dfrac{1}{2}AD$，$\triangle AEF\sim\triangle GCD$，$AD^2=2EF\cdot GD$。']}}
  - {item_id: Q024, question_number: 24, question_type: problem, points: 12, question_word_evidence: [{page_image: documents/初三/2024届-上海市青浦区-初三二模数学-试卷及解析/word/pages/page-4.png, page_number: 4}], prompt: [], official_solution: {word_evidence: [{page_image: documents/初三/2024届-上海市青浦区-初三二模数学-试卷及解析/word-answers/pages/page-6.png, page_number: 6}], start_anchor: 解答, end_anchor: 解答}, block: {stem_latex: '抛物线 $y=ax^2+bx-3$ 与 $x$ 轴交于 $A(-3,0)$、$B(1,0)$，与 $y$ 轴交于 $C$。(1) 求表达式和 $C$；(2) $DG\perp x$ 轴交抛物线于 $G$，$\angle DGA=\angle DGC$ 时求 $\triangle GAC$ 面积；(3) $P$ 在第三象限，$OD=1$，$\angle DCB+\angle PBC=45°$，求 $P$。', answer: '(1) $y=x^2+2x-3$，$C(0,-3)$；(2) $S=\dfrac{15}{8}$；(3) $P(-1,-4)$', clue: '(1) 待定系数；(2) $\tan\angle DGA=\tan\angle DGC$；(3) $\angle DCB+\angle PBC=45°$。', solution_steps: ['(1) $a=1,b=2$，$y=x^2+2x-3$，$C(0,-3)$。', '(2) $m=-\dfrac{1}{2}$，$S_{\triangle GAC}=\dfrac{15}{8}$。', '(3) 直线 $BQ:y=2x-2$，$P(-1,-4)$。']}}
  - {item_id: Q025, question_number: 25, question_type: problem, points: 14, question_word_evidence: [{page_image: documents/初三/2024届-上海市青浦区-初三二模数学-试卷及解析/word/pages/page-5.png, page_number: 5}], prompt: [], official_solution: {word_evidence: [{page_image: documents/初三/2024届-上海市青浦区-初三二模数学-试卷及解析/word-answers/pages/page-7.png, page_number: 7}], start_anchor: 解答, end_anchor: '<END_OF_SOURCE>'}, block: {stem_latex: '$\triangle ABC$ 中 $AB=AC=2$，以 $C$ 为圆心 $CB$ 为半径的弧交射线 $BA$、$CA$ 于 $D$、$E$，$ED$ 与射线 $CB$ 交于 $F$。(1) $D$ 在 $AB$ 上时①$\angle ABC=\alpha$ 求 $\angle BDF$；②$BF=1$ 求 $\cos\angle ABC$；(2) $D$ 在 $BA$ 延长线上，$M$、$N$ 为 $BC$、$DF$ 中点，$MN\parallel CE$，求 $CB$。', answer: '(1)①$\dfrac{1}{2}\alpha$；②$\dfrac{\sqrt{2}}{4}$；(2) $CB=1+\sqrt{5}$', clue: '(1)①$BF=BD$；②$\triangle CBD\sim\triangle ABC$；(2) 中位线+比例。', solution_steps: ['(1)①$\angle BDF=\dfrac{1}{2}\alpha$。', '(1)②$BF=BD=1$，$\triangle CBD\sim\triangle ABC$，$\cos\angle ABC=\dfrac{\sqrt{2}}{4}$。', '(2) $BF=\dfrac{1}{2}x^2$，中位线比例得 $x=1+\sqrt{5}$。']}}
