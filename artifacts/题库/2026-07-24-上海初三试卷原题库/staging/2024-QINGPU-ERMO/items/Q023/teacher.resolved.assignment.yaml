  - type: problem
    id: Q023
    points: 12
    stem_latex: 四边形 $ABCD$ 中 $AD\parallel BC$，$E$ 在 $AC$ 上 $EA=ED$，$\angle DAB=\angle DEC=\angle DCB$。(1) 求证菱形；(2) 延长 $DE$ 交 $AB$、$CB$ 延长线于 $F$、$G$，$GB=BC$，求证 $AD^2=2EF\cdot GD$。
    answer: (1)(2) 证明见详解
    clue: (1) $\angle ADE=\angle BAC$，$BA=BC$；(2) $\triangle AEF\sim\triangle GCD$。
    solution_steps:
    - (1) 平行四边形 + $BA=BC$ 得菱形。
    - (2) $AF=\dfrac{1}{2}AD$，$\triangle AEF\sim\triangle GCD$，$AD^2=2EF\cdot GD$。
