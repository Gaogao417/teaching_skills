  - type: problem
    id: Q024
    points: 12
    stem_latex: 抛物线 $y=ax^2+bx-3$ 与 $x$ 轴交于 $A(-3,0)$、$B(1,0)$，与 $y$ 轴交于 $C$。(1) 求表达式和 $C$；(2) $DG\perp x$ 轴交抛物线于 $G$，$\angle DGA=\angle DGC$ 时求 $\triangle GAC$ 面积；(3) $P$ 在第三象限，$OD=1$，$\angle DCB+\angle PBC=45°$，求 $P$。
    answer: (1) $y=x^2+2x-3$，$C(0,-3)$；(2) $S=\dfrac{15}{8}$；(3) $P(-1,-4)$
    clue: (1) 待定系数；(2) $\tan\angle DGA=\tan\angle DGC$；(3) $\angle DCB+\angle PBC=45°$。
    solution_steps:
    - (1) $a=1,b=2$，$y=x^2+2x-3$，$C(0,-3)$。
    - (2) $m=-\dfrac{1}{2}$，$S_{\triangle GAC}=\dfrac{15}{8}$。
    - (3) 直线 $BQ:y=2x-2$，$P(-1,-4)$。
