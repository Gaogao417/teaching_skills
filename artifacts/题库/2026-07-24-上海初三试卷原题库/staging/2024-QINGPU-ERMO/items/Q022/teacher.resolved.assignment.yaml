    stem_latex: 学校租 $7$ 辆客车送 $275$ 人，甲型 $45$ 人/$1500$ 元，乙型 $33$ 人/$1200$ 元，租甲 $x$ 辆费用 $y$ 元。(1) 求 $y$ 与 $x$ 函数；(2) 费用不超过 $10200$ 元有几种方案；(3) 哪种最省钱？
    answer: (1) $y=300x+8400$；(2) $3$ 种；(3) 甲 $4$ 乙 $3$，$9600$ 元
    clue: (1) $y=1500x+1200(7-x)$；(2) $x\leqslant6$ 且 $x\geqslant4$；(3) $k>0$ 最小值在 $x=4$。
    solution_steps:
    - (1) $y=300x+8400$。
    - (2) $x=4,5,6$，共 $3$ 种。
    - (3) $x=4$ 最省钱，$y=9600$ 元。
