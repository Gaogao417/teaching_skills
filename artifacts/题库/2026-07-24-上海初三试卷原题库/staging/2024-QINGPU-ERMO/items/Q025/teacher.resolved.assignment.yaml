  - type: problem
    id: Q025
    points: 14
    stem_latex: $\triangle ABC$ 中 $AB=AC=2$，以 $C$ 为圆心 $CB$ 为半径的弧交射线 $BA$、$CA$ 于 $D$、$E$，$ED$ 与射线 $CB$ 交于 $F$。(1) $D$ 在 $AB$ 上时①$\angle ABC=\alpha$ 求 $\angle BDF$；②$BF=1$ 求 $\cos\angle ABC$；(2) $D$ 在 $BA$ 延长线上，$M$、$N$ 为 $BC$、$DF$ 中点，$MN\parallel CE$，求 $CB$。
    answer: (1)①$\dfrac{1}{2}\alpha$；②$\dfrac{\sqrt{2}}{4}$；(2) $CB=1+\sqrt{5}$
    clue: (1)①$BF=BD$；②$\triangle CBD\sim\triangle ABC$；(2) 中位线+比例。
    solution_steps:
    - (1)①$\angle BDF=\dfrac{1}{2}\alpha$。
    - (1)②$BF=BD=1$，$\triangle CBD\sim\triangle ABC$，$\cos\angle ABC=\dfrac{\sqrt{2}}{4}$。
    - (2) $BF=\dfrac{1}{2}x^2$，中位线比例得 $x=1+\sqrt{5}$。
