    stem_latex: 矩形 $ABCD$ 中 $AB=2,BC=4$，$\odot A$ 过 $B$，$\odot O$（$O$ 为对角线交点）与 $\odot A$ 有公共点且与 $CD$ 无公共点，$\odot O$ 半径 $r$ 的取值范围是\u3000\u3000\u3000\u3000。
    answer: $\sqrt{5}-2\leqslant r<2$ 或 $\sqrt{5}<r\leqslant\sqrt{5}+2$
    clue: 圆与圆位置关系+圆与直线位置关系。
