  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases} 2x+y=21 \\ x^2-2xy-3y^2=0 \end{cases}$
    answer: $\begin{cases} x=21 \\ y=-21 \end{cases}$ 或 $\begin{cases} x=9 \\ y=3 \end{cases}$
    clue: ②因式分解 $(x+y)(x-3y)=0$。
    solution_steps:
    - $(x+y)(x-3y)=0$，$x=-y$ 或 $x=3y$。
    - $x=-y$ 代入①：$x=21,y=-21$；$x=3y$ 代入①：$x=9,y=3$。
