  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，$AB$ 是 $\odot O$ 的直径，$AB$ 与 $CD$ 交于 $E$，弦 $AD=$ 弦 $CD$，且 $\overset{\frown}{BC}=\overset{\frown}{BD}$。(1) 求 $\angle ADC$ 的度数；(2) 如果 $OE=1$，求 $AD$ 的长。
    answer: (1) $\angle ADC=60°$；(2) $AD=2\sqrt{3}$
    clue: (1) $\triangle ACD$ 等边；(2) $DE=\sqrt{3}$。
    solution_steps:
    - (1) $AC=AD=CD$，$\triangle ACD$ 等边，$\angle ADC=60°$。
    - (2) $DE=\sqrt{3}$，$AD=2\sqrt{3}$。
