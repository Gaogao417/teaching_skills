  - type: fillin
    id: Q017
    points: 4
    stem_latex: 如图，已知弦 $AB$、$CD$ 在圆心 $O$ 的同侧，且 $AB$ 是 $\odot O$ 内接正三角形的一条边，$CD$ 是 $\odot O$ 内接正六边形的一条边，$AB \parallel CD$。如果 $AC$ 也是 $\odot O$ 的内接正 $n$ 边形的一条边，那么 $n$ 的值为__________。
    answer: $12$
    explanation: 官方参考答案：$12$。
    solution_steps:
    - 连接 $OA$、$OB$、$OC$、$OD$。
    - $\angle DOC=\frac{360°}{6}=60°$，$\angle AOB=\frac{360°}{3}=120°$。
    - $\angle AOC=\angle BOD=\frac{\angle AOB-\angle DOC}{2}=30°$。
    - $n=\frac{360°}{30°}=12$。
    clue: 利用正多边形中心角公式，求出 $AC$ 对应的中心角。
