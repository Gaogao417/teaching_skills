    id: Q012
    points: 4
    stem_latex: 将抛物线 $y=x^2-4x+1$ 向上平移 $2$ 个单位，得到新抛物线的表达式是__________。
    answer: $y=x^2-4x+3$
    explanation: 官方参考答案：$y=x^2-4x+3$。
    solution_steps:
    - 向上平移 $2$ 个单位：$y=x^2-4x+1+2=x^2-4x+3$。
    clue: 向上平移 $n$ 个单位，常数项加 $n$。
