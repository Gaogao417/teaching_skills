    stem_latex: 计算：$(\pi-\sqrt{10})^0+(2-\sqrt{3})^{-1}+\sqrt[3]{-27}+\cos30°$。
    answer: $\dfrac{3\sqrt{3}}{2}$
    explanation: 官方参考答案：$\dfrac{3\sqrt{3}}{2}$。
    solution_steps:
    - $(\pi-\sqrt{10})^0=1$，$(2-\sqrt{3})^{-1}=2+\sqrt{3}$，$\sqrt[3]{-27}=-3$，$\cos30°=\frac{\sqrt{3}}{2}$。
    - $=1+(2+\sqrt{3})+(-3)+\frac{\sqrt{3}}{2}=\frac{3\sqrt{3}}{2}$。
    clue: 分别计算零次幂、负指数幂、立方根和三角函数值。
