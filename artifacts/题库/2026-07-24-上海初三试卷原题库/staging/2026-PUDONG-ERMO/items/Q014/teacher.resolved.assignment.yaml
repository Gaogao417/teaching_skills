  - type: fillin
    id: Q014
    points: 4
    stem_latex: 如图，在 $\triangle ABC$ 中，$AB=BC$，$BD$ 平分 $\angle ABC$，如果 $\overrightarrow{AB}=\vec{a}$，$\overrightarrow{AC}=\vec{b}$，那么 $\overrightarrow{DB}$ 关于 $\vec{a}$、$\vec{b}$ 的分解式为__________。
    answer: $\vec{a}-\dfrac{1}{2}\vec{b}$
    explanation: 官方参考答案：$\vec{a}-\dfrac{1}{2}\vec{b}$。
    solution_steps:
    - 因为 $AB=BC$，$BD$ 平分 $\angle ABC$，所以 $AD=\frac{1}{2}AC$。
    - $\overrightarrow{AD}=\frac{1}{2}\vec{b}$。
    - $\overrightarrow{DB}=\overrightarrow{AB}-\overrightarrow{AD}=\vec{a}-\frac{1}{2}\vec{b}$。
    clue: 利用等腰三角形三线合一性质，角平分线也是中线。
