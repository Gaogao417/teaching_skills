  title: 一、选择题（本大题共6题，每题4分，满分24分）
  type: practice
  visibility: both
  blocks:
  - type: choice
    id: Q003
    points: 4
    stem_latex: 已知函数图像上的两点 $A(x_1,y_1)$、$B(x_2,y_2)$，当 $x_1 < x_2$ 时 $y_1 < y_2$，一定满足此规律的函数是（\quad）
    choices:
    - $y = x+1$
    - $y = 1$
    - $y = \frac{1}{x}$
    - $y = -x^2+1$
    answer: A
    explanation: 官方参考答案：A。
    solution_steps:
    - A：$y=x+1$ 是一次函数，且 $1>0$，当 $x_1 < x_2$ 时 $y_1 < y_2$，符合题意；
    - B：$y=1$，对任意 $x_1 < x_2$，都有 $y_1 = y_2 = 1$，不符合；
    - C：取 $x_1=-2$，$x_2=-1$，满足 $x_1 < x_2$，此时 $y_1 = -\frac{1}{2}$，$y_2 = -1$，$y_1 > y_2$，不符合；
    - D：取 $x_1=1$，$x_2=2$，满足 $x_1 < x_2$，此时 $y_1 = -1^2+1=0$，$y_2 = -2^2+1=-3$，$y_1 > y_2$，不符合。
    clue: 逐一验证各函数的单调性，一次函数系数为正时递增。
