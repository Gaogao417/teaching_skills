  - type: fillin
    id: Q010
    points: 4
    stem_latex: 方程 $\sqrt{x+2}=3$ 的解是__________。
    answer: $x=7$
    explanation: 官方参考答案：$x=7$。
    solution_steps:
    - 两边平方得 $x+2=9$，解得 $x=7$。
    - 检验：$\sqrt{7+2}=\sqrt{9}=3$，$x=7$ 是原方程的解。
    clue: 两边平方后求解，注意验根。
