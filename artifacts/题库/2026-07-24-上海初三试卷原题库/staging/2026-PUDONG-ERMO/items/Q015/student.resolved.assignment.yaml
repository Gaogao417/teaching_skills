    id: Q015
    points: 4
    stem_latex: 2026年3月29日，中关村论坛年会发布重大成果，中科院物理所团队首次实现二维金属。二维金属是极薄的单原子层金属材料，厚度超小。已知某二维金属材料厚度 $1.5 \times 10^{-10}$ 米，一根头发丝直径约 $0.03$ 毫米，换算为米是 $3 \times 10^{-5}$ 米。则头发丝直径是该二维金属材料厚度的__________倍。（用科学记数法表示）
    explanation: 官方参考答案：$2 \times 10^5$。
