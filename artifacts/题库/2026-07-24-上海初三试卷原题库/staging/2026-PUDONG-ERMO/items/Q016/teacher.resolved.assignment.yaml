  - type: fillin
    id: Q016
    points: 4
    stem_latex: 如图是地铁入口双翼闸机示意图。已知双翼边缘 $AC=BD=60$cm，与闸机侧立面夹角 $\angle PCA=\angle QDB=30°$，双翼展开时端点 $A$、$B$ 的间距为 $8$cm。当双翼收起时，可通过闸机的物体最大宽度为__________cm。
    answer: $68$
    explanation: 官方参考答案：$68$。
    solution_steps:
    - 过点 $A$ 作 $AE \perp PC$ 于点 $E$，过点 $B$ 作 $BF \perp QD$ 于点 $F$。
    - $AE=\frac{1}{2}AC=30$cm，$BF=\frac{1}{2}BD=30$cm。
    - 双翼收起时最大宽度为 $30+8+30=68$（cm）。
    clue: 作垂线构造直角三角形，利用 $30°$ 角的性质求距离。
