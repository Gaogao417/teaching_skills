    stem_latex: 已知四边形 $ABCD$ 中，$AB \parallel CD$，$AC=BD$，下列判断中的正确的是（\quad）
    choices:
    - 如果 $BC=AD$，那么四边形 $ABCD$ 是等腰梯形
    - 如果 $AD \parallel BC$，那么四边形 $ABCD$ 是菱形
    - 如果 $AC$ 平分 $BD$，那么四边形 $ABCD$ 是矩形
    - 如果 $AC \perp BD$，那么四边形 $ABCD$ 是正方形
    explanation: 官方参考答案：C。
