  blocks:
  - type: choice
    id: Q006
    points: 4
    stem_latex: 已知四边形 $ABCD$ 中，$AB \parallel CD$，$AC=BD$，下列判断中的正确的是（\quad）
    choices:
    - 如果 $BC=AD$，那么四边形 $ABCD$ 是等腰梯形
    - 如果 $AD \parallel BC$，那么四边形 $ABCD$ 是菱形
    - 如果 $AC$ 平分 $BD$，那么四边形 $ABCD$ 是矩形
    - 如果 $AC \perp BD$，那么四边形 $ABCD$ 是正方形
    answer: C
    explanation: 官方参考答案：C。
    solution_steps:
    - A：如果 $BC=AD$，那么四边形 $ABCD$ 可能是等腰梯形，也可能是矩形，错误；
    - B：如果 $AD \parallel BC$，那么四边形 $ABCD$ 是矩形，错误；
    - C：如果 $AC$ 平分 $BD$，那么四边形 $ABCD$ 是矩形，正确；
    - D：如果 $AC \perp BD$，那么四边形 $ABCD$ 不一定是正方形，错误。
    clue: 根据正方形、等腰梯形、矩形和菱形的判定定理逐一判断。
