  blocks:
  - type: choice
    id: Q005
    points: 4
    stem_latex: 第 $67$ 届国际奥林匹克数学竞赛（IMO）将于 $2026$ 年 $7$ 月在上海举行。在上届比赛中，中国队发挥出色，获得团体总分第一名，也是当届比赛中唯一一支所有队员都获得金牌的队伍。中国队参赛队员比赛成绩的方差可用以下公式来计算：$$S^2 = \frac{1}{6}\left[\left(42-\bar{x}\right)^2+\left(42-\bar{x}\right)^2+\left(40-\bar{x}\right)^2+\left(36-\bar{x}\right)^2+\left(36-\bar{x}\right)^2+\left(35-\bar{x}\right)^2\right]$$根据以上信息，下列叙述中不正确的是（\quad）
    choices:
    - 中国队共有 $6$ 名同学参赛
    - 众数是 $36$
    - 中位数是 $38$
    - 平均数是 $38.5$
    answer: B
    explanation: 官方参考答案：B。
    solution_steps:
    - A：方差公式中共有 $6$ 个数据项，中国队共有 $6$ 名同学参赛，正确；
    - B：$36$ 和 $42$ 都出现 $2$ 次，均为出现次数最多的数，众数是 $36$ 和 $42$，错误；
    - C：$6$ 个数据的中位数是第 $3$ 个和第 $4$ 个数据的平均数，即 $\frac{36+40}{2}=38$，正确；
    - D：平均数 $\bar{x}=\frac{35+36+36+40+42+42}{6}=\frac{231}{6}=38.5$，正确。
    clue: 从方差公式中提取数据：$42,42,40,36,36,35$，再逐一验证各统计量。
    source_solution_images: []
