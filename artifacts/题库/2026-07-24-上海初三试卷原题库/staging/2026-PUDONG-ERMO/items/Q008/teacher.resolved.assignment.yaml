    stem_latex: 化简：$\frac{2}{1-x}-\frac{2x}{1-x}=$__________。
    answer: $2$
    explanation: 官方参考答案：$2$。
    solution_steps:
    - $\frac{2}{1-x}-\frac{2x}{1-x}=\frac{2-2x}{1-x}=\frac{2(1-x)}{1-x}=2$。
    clue: 同分母分式相减，分子合并后约分。
