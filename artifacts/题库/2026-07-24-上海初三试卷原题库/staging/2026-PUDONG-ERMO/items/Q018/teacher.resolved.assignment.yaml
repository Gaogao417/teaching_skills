  - type: fillin
    id: Q018
    points: 4
    stem_latex: 如图，在 $\mathrm{Rt}\triangle ABC$ 中，$\angle C=90°$，$AC=5$，$BC=12$。点 $D$、$E$ 分别在边 $AC$、$BC$ 上，且 $\frac{CD}{CE}=\frac{3}{4}$。以 $E$ 为圆心，$ED$ 为半径作圆，如果 $\odot E$ 与 $\triangle ABC$ 的三边有三个公共点，那么 $CD$ 的值为__________。
    answer: $4$ 或 $\dfrac{36}{17}$
    explanation: 官方参考答案：$4$ 或 $\dfrac{36}{17}$。
    solution_steps:
    - 设 $CD=3x$，则 $CE=4x$，$DE=5x$，$AB=13$。
    - 情况①：$\odot E$ 与 $AB$ 相切时，$\triangle BFE \sim \triangle BCA$，$BE=13x$，$BC=17x=12$，$x=\frac{12}{17}$，$CD=3x=\frac{36}{17}$。
    - 情况②：$ED=EB$ 时，$BC=BE+CE=5x+4x=9x=12$，$x=\frac{4}{3}$，$CD=3x=4$。
    - 综上：$CD$ 的值为 $4$ 或 $\frac{36}{17}$。
    clue: 分两种情况讨论：$\odot E$ 与 $AB$ 相切，或 $ED=EB$。
