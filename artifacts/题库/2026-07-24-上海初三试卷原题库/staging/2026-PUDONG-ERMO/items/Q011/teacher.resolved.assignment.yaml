  blocks:
  - type: fillin
    id: Q011
    points: 4
    stem_latex: 如果关于 $x$ 的一元二次方程 $x^2-x+a=0$ 有实数根，那么 $a$ 的取值范围是_____________。
    answer: $a \leq \frac{1}{4}$
    explanation: 官方参考答案：$a \leq \frac{1}{4}$。
    solution_steps:
    - 有实数根需 $\Delta=(-1)^2-4a \geq 0$。
    - $1-4a \geq 0$，解得 $a \leq \frac{1}{4}$。
    clue: 利用一元二次方程根的判别式 $\Delta \geq 0$。
