    stem_latex: 分解因式：$4x^2-9y^2=$_________。
    answer: $(2x+3y)(2x-3y)$
    explanation: 官方参考答案：$(2x+3y)(2x-3y)$。
    solution_steps:
    - $4x^2-9y^2=(2x)^2-(3y)^2=(2x+3y)(2x-3y)$（平方差公式）。
    clue: 利用平方差公式 $a^2-b^2=(a+b)(a-b)$。
