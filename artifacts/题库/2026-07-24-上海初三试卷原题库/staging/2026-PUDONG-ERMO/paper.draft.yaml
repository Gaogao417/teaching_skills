      - 'C：$(xy^2)^2 = x^2(y^2)^2 = x^2y^4$，符合；'
      - 'D：$x^2y$ 与 $xy^2$ 不是同类项，无法合并，不能得到 $x^3y^3$，不符合。'
      clue: 逐项验证运算结果，注意幂的运算法则和同类项合并规则。
