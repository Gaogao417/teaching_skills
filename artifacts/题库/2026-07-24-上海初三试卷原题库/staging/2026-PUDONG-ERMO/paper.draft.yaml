      - 'C：取 $x_1=-2$，$x_2=-1$，满足 $x_1 < x_2$，此时 $y_1 = -\frac{1}{2}$，$y_2 = -1$，$y_1 > y_2$，不符合；'
      - 'D：取 $x_1=1$，$x_2=2$，满足 $x_1 < x_2$，此时 $y_1 = -1^2+1=0$，$y_2 = -2^2+1=-3$，$y_1 > y_2$，不符合。'
      clue: 逐一验证各函数的单调性，一次函数系数为正时递增。
