    stem_latex: 在一块等腰直角三角形铁皮上截一块矩形铁皮。如图，已有的铁皮是等腰直角三角形 $ABC$，它的底边 $AB$ 长20厘米。要截得的矩形 $DEMN$ 的边 $MN$ 在 $AB$ 上，顶点 $D、E$ 分别在边 $AC、BC$ 上，设 $DE$ 的长为 $x$ 厘米，矩形 $DEMN$ 的面积为 $y$ 平方厘米，那么 $y$ 关于 $x$ 的函数解析式是 $\fillin$。（不必写定义域）
    answer: $y=10x-\dfrac12x^2$
    explanation: 官方参考答案：$y=10x-\dfrac12x^2$。
