    stem_latex: 为了研究抛物线 $L_1:y=ax^2+bx+c$ 与 $L_2:y=-ax^2+bx-c$ 在同一平面直角坐标系中的位置特征，我们可以先取字母常数 $a、b、c$ 的一些特殊值，试着画出相应的抛物线，通过观察来发现 $L_1$ 与 $L_2$ 的位置特征。你的发现是：$\fillin$；理由是：$\fillin$。
    answer: 两者关于原点中心对称；如果点 $(s,t)$ 在 $L_1$ 上，那么点 $(-s,-t)$ 在 $L_2$ 上，反之亦然
