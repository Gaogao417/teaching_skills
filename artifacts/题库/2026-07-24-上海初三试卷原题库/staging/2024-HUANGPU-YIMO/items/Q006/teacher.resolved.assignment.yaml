    stem_latex: 如图，过矩形 $ABCD$ 的顶点分别作对角线的垂线，垂足分别为 $E、F、G、H$，依次联结四个垂足，可得到矩形 $EFGH$。设对角线 $AC$ 与 $BD$ 的夹角为 $\alpha\ (0<\alpha<90^\circ)$，那么矩形 $EFGH$ 与矩形 $ABCD$ 面积的比值为（　）。
