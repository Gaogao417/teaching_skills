  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在四边形 $ABCD$ 中，$AD\parallel BC$，$AD=1$，$BC=3$，对角线 $AC、BD$ 交于点 $E$。（1）设 $\overrightarrow{AC}=\vec a$，$\overrightarrow{BC}=\vec b$，试用 $\vec a、\vec b$ 的线性组合表示向量 $\overrightarrow{CD}$；（2）如果 $\angle ABC=90^\circ$，$AC\perp BD$，求四边形 $ABCD$ 的面积。
    answer: （1）$\overrightarrow{CD}=-\vec a+\dfrac13\vec b$；（2）$2\sqrt3$
    solution_steps:
    - title: 第（1）问
      content: $\overrightarrow{AD}=\dfrac13\vec b$，$\overrightarrow{CD}=\overrightarrow{CA}+\overrightarrow{AD}=-\vec a+\dfrac13\vec b$。
    - title: 第（2）问
      content: 证明 $\triangle DAB\sim\triangle ABC$，得 $AB=\sqrt3$，所以四边形 $ABCD$ 的面积为 $2\sqrt3$。
