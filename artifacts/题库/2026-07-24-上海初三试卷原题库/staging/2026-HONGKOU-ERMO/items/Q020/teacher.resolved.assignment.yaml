  - type: problem
    id: Q020
    points: 10
    stem_latex: 解不等式组：$\begin{cases}3(x+1) & x+5\text{①}\\10-\dfrac{5+3x}{2}>x\text{②}\end{cases}$
    answer: $1\leq x<3$
    explanation: 官方参考答案：$1\leq x<3$。
    solution_steps:
    - 解不等式①得：$3(x+1)\leq x+5$
    - $3x+3\leq x+5$
    - $2x\leq 2$
    - $x\leq 1$
    - 解不等式②得：$10-\dfrac{5+3x}{2}>x$
    - 不等式两边同乘 $2$ 得 $20-(5+3x)>2x$
    - $15-3x>2x$
    - $15>5x$
    - $x<3$
    - 不等式组的解集为 $1\leq x<3$。
    clue: 分别求出不等式组中两个不等式的解集，取两个解集的公共部分。
