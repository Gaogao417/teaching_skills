  - type: fillin
    id: Q015
    points: 4
    stem_latex: 如图，以正六边形 $ABCDEF$ 的顶点 $A$ 为圆心，$AB$ 的长为半径画圆，如果图中阴影部分的面积为 $3\pi$，那么该正六边形 $ABCDEF$ 的边长是________.
    answer: $3$
    explanation: 官方参考答案：$3$。
    solution_steps:
    - 正六边形的内角是 $\dfrac{(6-2)\times 180^\circ}{6}=120^\circ$，阴影部分的面积为 $3\pi$，
    - 设正六边形的边长为 $r$，
    - $\dfrac{120\pi\cdot r^2}{360}=3\pi$，
    - 解得 $r=3$。
    - 正六边形的边长为 $3$。
    clue: 根据正多边形内角和公式求出扇形的圆心角，然后按扇形面积公式计算即可。
