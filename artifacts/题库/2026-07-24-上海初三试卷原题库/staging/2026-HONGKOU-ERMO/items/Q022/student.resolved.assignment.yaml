    stem_latex: '根据以下素材，完成任务.


      素材一：如图1，如果 $EF\perp$ 平面镜 $AB$，入射光线 $CF$ 经平面镜 $AB$ 反射，得到反射光线 $FD$，那么反射角 $\angle DFE$ 等于入射角 $\angle CFE$，即 $\angle DFE=\angle CFE$.


      素材二：汉代初年的《淮南万毕术》中记载：“取大镜高悬，置水盆于其下，则见四邻......”. 意思是拿一面大的镜子，高高地悬挂起来，在它的下方放置一个盛满水的盆子，就能（从水盆里）看见周围邻居（的景象），如图2所示.


      素材三：图3是素材二中图2的示意图，将水盆记作点 $B$，墙角记为点 $P$，邻居记作点 $A$，镜子（平面镜）记作 $MN$，$OD\perp MN$ 于点 $O$，入射光线 $AO$ 经平面镜 $MN$ 反射，得到反射光线 $OB$，$BE\perp AB$ 于点 $B$，$OB$ 又作为入射光线通过水盆 $B$ 反射得到反射光线 $BC$，进入观察者的眼中（抽象为点 $C$）. 已知 $OP\perp AB$ 于点 $P$，$\angle AOD=45^\circ$，$\angle CBE=37^\circ$，水盆到墙角的距离 $BP=1.8$ 米.


      素材四：参考数据：$\sin 37^\circ\approx 0.6$，$\cos 37^\circ\approx 0.8$，$\tan 37^\circ\approx 0.75$.


      问题解决：


      (1) 任务一：求邻居 $A$ 到墙角 $P$ 的距离；


      (2) 任务二：如果入射光线 $OA$ 不变，将镜子 $MN$ 绕点 $O$ 顺时针旋转 $8^\circ$，在 $OP$ 左侧的观察者仍能通过水盆 $B$ 看到邻居 $A$，那么水盆 $B$ 应向左还是右平移？平移多少米？'
    explanation: 官方参考答案：(1) 3.2m; (2) 水盆B应向左平移，且平移1.4m。
