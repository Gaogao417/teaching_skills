    stem_latex: '已知抛物线 $y=ax^2+bx+c(a\neq 0)$.


      (1) 画抛物线时，如果列出的两组数据如表（信息不完整）所示，请直接写出该抛物线的对称轴，并求此时 $a$ 和 $c$ 之间的数量关系；


      | $x$ | $\cdots$ | $-1$ | $\cdots$ | $1$ | $\cdots$ |

      |---|---|---|---|---|---|

      | $y$ | $\cdots$ | $2$ | $\cdots$ | $2$ | $\cdots$ |


      (2) 已知点 $C$ 为抛物线与 $y$ 轴的交点，点 $A$、$B$ 在抛物线上，连接 $OA$、$AC$、$CB$ 和 $OB$.


      ① 如果四边形 $OACB$ 为正方形，那么 $b$ 的值是________，$a$ 和 $c$ 之间的数量关系是________；


      ② 如图，当 $a<0$ 时，已知四边形 $OACB$ 为菱形，$\cot\angle AOC=2$. 点 $P$ 在抛物线上且横坐标为 $2$，连接 $PA$、$PC$，如果 $\triangle PAC$ 的面积为 $12$，求抛物线的表达式.'
    explanation: 官方参考答案：(1) $x=0$，$a+c=2$; (2)① $b=0$，$ac=-2$; ② $y=-\dfrac{1}{2}x^2+16$。
