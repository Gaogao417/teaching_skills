    id: Q011
    points: 4
    stem_latex: 将二次函数 $y=(x-1)^2-4$ 的图象向左平移 $m(m>0)$ 个单位后经过原点，则 $m$ 的值为________.
    answer: $3$
    explanation: 官方参考答案：$3$。
    solution_steps:
    - 将二次函数 $y=(x-1)^2-4$ 的图象向左平移 $m$ 个单位后，新函数解析式为 $y=(x+m-1)^2-4$。
    - 由于图象经过原点，代入点 $(0,0)$ 得：$0=(0+m-1)^2-4$，
    - $(m-1)^2=4$，
    - $m-1=2$ 或 $m-1=-2$，
    - $m=3$ 或 $m=1$，
    - $m>0$，
    - $m=3$。
    clue: 根据二次函数图象平移规律'左加右减'，得到平移后的函数解析式，再代入原点坐标求解。
