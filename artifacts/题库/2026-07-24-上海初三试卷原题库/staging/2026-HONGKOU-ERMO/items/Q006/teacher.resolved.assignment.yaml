  blocks:
  - type: choice
    id: Q006
    points: 4
    stem_latex: 如图，在 $\triangle ABC$ 中，$\angle ACB=90^\circ$，$AB=5$，$BC=4$. 以点 $A$ 为圆心，$r$ 为半径作圆，当点 $C$ 在 $\odot A$ 内且点 $B$ 在 $\odot A$ 外时，$r$ 的值可能是（\quad）
    choices:
    - $2$
    - $3$
    - $4$
    - $5$
    answer: C
    explanation: 官方参考答案：C。
    solution_steps:
    - 在 $\triangle ABC$ 中，$\angle ACB=90^\circ$，$AB=5$，$BC=4$，
    - $AC=\sqrt{AB^2-BC^2}=3$，
    - 点 $C$ 在 $\odot A$ 内且点 $B$ 在 $\odot A$ 外，
    - $AC<r<AB$，即 $3<r<5$，
    - 观察四个选项可知，只有选项C符合，
    - 故选：C。
    clue: 利用勾股定理求出 $AC$，再根据点与圆的位置关系确定 $r$ 的范围。
    source_solution_images: []
