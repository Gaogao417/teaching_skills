    id: Q009
    points: 4
    stem_latex: 将二元二次方程 $x^2-5xy+6y^2=0$ 化为两个一次方程为________.
    answer: $x-3y=0$ 和 $x-2y=0$
    explanation: 官方参考答案：$x-3y=0$ 和 $x-2y=0$。
    solution_steps:
    - $x^2-5xy+6y^2=0$，
    - $(x-2y)(x-3y)=0$，
    - $x-3y=0$，$x-2y=0$。
    clue: 利用十字相乘法分解因式。
