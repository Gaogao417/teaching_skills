    stem_latex: '如图1，在扇形 $AOB$ 中，$\angle AOB=90^\circ$，点 $C$ 是弧 $AB$ 上一点，点 $D$ 是半径 $OB$ 上的点，联结 $CD$，$\angle OCD$ 的平分线和 $\angle COD$ 的平分线相交于点 $P$，联结 $BP$.


      (1) 求证：$\angle OPB=90^\circ+\dfrac{1}{2}\angle ODC$;


      (2) 联结 $BC$（如图2）. 如果 $CD\perp OB$，$CP=10$，$\triangle OPB$ 的外接圆 $\odot M$ 与扇形 $AOB$ 所在的圆 $\odot O$ 相交.


      ① 当 $\cos\angle CBD=\dfrac{1}{4}$ 时，求 $\odot M$ 与 $\odot O$ 的公共弦的长；


      ② 联结 $AM$ 和 $AP$，$AP$ 交 $OC$ 于点 $E$，当 $AM\perp OP$ 时，求 $\tan\angle PAM$ 的值和 $OE$ 的长.'
    explanation: 官方参考答案：(1) 见详解; (2) 40, $\dfrac{1}{3}$。
