  - type: fillin
    id: Q016
    points: 4
    stem_latex: 如图，在 $\square ABCD$ 中，对角线 $AC$、$BD$ 交于点 $O$，$G$ 为 $\triangle ACD$ 的重心，连接 $CG$ 并延长交 $AD$ 于点 $E$，设 $\overrightarrow{AC}=\vec{a}$，$\overrightarrow{BD}=\vec{b}$，那么用向量 $\vec{a}$、$\vec{b}$ 表示 $\overrightarrow{ED}$ 是________.
    answer: $\dfrac{1}{4}\vec{a}+\dfrac{1}{4}\vec{b}$
    explanation: 官方参考答案：$\dfrac{1}{4}\vec{a}+\dfrac{1}{4}\vec{b}$。
    solution_steps:
    - 在 $\square ABCD$ 中，对角线 $AC$、$BD$ 交于点 $O$，$\overrightarrow{AC}=\vec{a}$，$\overrightarrow{BD}=\vec{b}$，
    - $AD\parallel BC$，$\overrightarrow{OC}=\dfrac{1}{2}\overrightarrow{AC}=\dfrac{1}{2}\vec{a}$，$\overrightarrow{BO}=\dfrac{1}{2}\overrightarrow{BD}=\dfrac{1}{2}\vec{b}$，
    - $\overrightarrow{BC}=\overrightarrow{BO}+\overrightarrow{OC}=\dfrac{1}{2}\vec{a}+\dfrac{1}{2}\vec{b}$，
    - $G$ 为 $\triangle ACD$ 的重心，
    - $EG=\dfrac{1}{2}CG$，
    - $AD\parallel BC$，
    - $\triangle EDG\sim\triangle CBG$，
    - $\dfrac{ED}{BC}=\dfrac{EG}{CG}=\dfrac{1}{2}$，
    - $ED=\dfrac{1}{2}BC$，
    - $\overrightarrow{ED}=\dfrac{1}{2}\overrightarrow{BC}=\dfrac{1}{4}\vec{a}+\dfrac{1}{4}\vec{b}$。
    clue: 根据平行四边形的性质和重心的性质，利用相似三角形求解。
