  - type: fillin
    id: Q010
    points: 4
    stem_latex: 请写出一个常数 $c$ 的值，使得关于 $x$ 的方程 $x^2+2x-c=0$ 有两个不相等的实数根，那么 $c$ 的值可以是________.
    answer: $0$（答案不唯一，满足 $c>-1$ 即可）
    explanation: 官方参考答案：$0$（答案不唯一，满足 $c>-1$ 即可）。
    solution_steps:
    - 关于 $x$ 的一元二次方程 $x^2+2x-c=0$ 有两个不相等的实数根，
    - $\Delta=2^2-4\times 1\times (-c)>0$，
    - $4+4c>0$，
    - 解得 $c>-1$，
    - 那么 $c$ 的值可以是：$0$（答案不唯一，满足 $c>-1$ 即可）。
    clue: 利用一元二次方程根的判别式求出 $c$ 的取值范围。
