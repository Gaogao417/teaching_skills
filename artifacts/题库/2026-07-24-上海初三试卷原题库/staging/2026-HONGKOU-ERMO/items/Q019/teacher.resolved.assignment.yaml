  - type: problem
    id: Q019
    points: 10
    stem_latex: 先化简，再求值：$\dfrac{1}{x+1}-\dfrac{x+3}{x^2-1}\div\dfrac{x^2+4x+3}{x^2-2x+1}$. 其中 $x=\sqrt{2}$.
    answer: $\dfrac{2}{(x+1)^2}$; $6-4\sqrt{2}$
    explanation: 官方参考答案：$\dfrac{2}{(x+1)^2}$; $6-4\sqrt{2}$。
    solution_steps:
    - $\dfrac{1}{x+1}-\dfrac{x+3}{x^2-1}\div\dfrac{x^2+4x+3}{x^2-2x+1}$
    - $=\dfrac{1}{x+1}-\dfrac{x+3}{(x-1)(x+1)}\div\dfrac{(x+1)(x+3)}{(x-1)^2}$
    - $=\dfrac{1}{x+1}-\dfrac{x+3}{(x-1)(x+1)}\cdot\dfrac{(x-1)^2}{(x+1)(x+3)}$
    - $=\dfrac{1}{x+1}-\dfrac{x-1}{(x+1)^2}$
    - $=\dfrac{x+1}{(x+1)^2}-\dfrac{x-1}{(x+1)^2}$
    - $=\dfrac{2}{(x+1)^2}$，
    - 把 $x=\sqrt{2}$ 代入得：原式 $=\dfrac{2}{(\sqrt{2}+1)^2}=\dfrac{2}{2+1+2\sqrt{2}}=6-4\sqrt{2}$。
    clue: 先根据分式混合运算法则进行化简，然后再代入数据求值即可。
