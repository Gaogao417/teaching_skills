    stem_latex: '如图，$\triangle ABC$ 和 $\triangle ADE$ 都是等腰直角三角形，$\angle BAC=\angle DAE=90^\circ$，$AB=AC$，$AD=AE$，连接 $BD$、$CE$，$\angle ADB=90^\circ$，延长 $BD$ 交 $CE$ 于点 $F$，交 $AC$ 于点 $G$.


      (1) 求证：四边形 $ADFE$ 为正方形；


      (2) 如果 $\angle FBC=\angle ACF$，求证：$2AD^2=FG\cdot FB$.'
