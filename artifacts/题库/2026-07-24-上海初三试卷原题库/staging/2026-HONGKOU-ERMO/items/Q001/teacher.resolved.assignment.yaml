  blocks:
  - type: choice
    id: Q001
    points: 4
    stem_latex: 下列各式中，$\sqrt{a-4}$ 的有理化因式是（\quad）
    choices:
    - $\sqrt{a+4}$
    - $\sqrt{a-4}$
    - $\sqrt{a}+2$
    - $\sqrt{a}-2$
    answer: B
    explanation: 官方参考答案：B。
    solution_steps:
    - 两个含有根式的代数式相乘，若它们的积不含有根式，则这两个代数式互为有理化因式。
    - $\sqrt{a-4}\cdot\sqrt{a-4}=\left(\sqrt{a-4}\right)^2=a-4$，结果不含根号，符合有理化因式的定义。
    - 其余选项与 $\sqrt{a-4}$ 相乘后，结果仍含有根号，不符合要求。
    clue: 有理化因式是两个代数式相乘后积不含根号的配对。
