    stem_latex: '如图，在平面直角坐标系 $xOy$ 中，已知双曲线经过 $\triangle OAB$ 顶点 $B$ 和边 $OA$ 上的一点 $C$，$OC=2AC$，$OC=\sqrt{5}$. 设边 $OA$ 与 $x$ 轴正半轴的夹角为 $\alpha$，且 $\sin\alpha=\dfrac{\sqrt{5}}{5}$.


      (1) 求双曲线的表达式；


      (2) 如果 $AB\parallel x$ 轴，求点 $B$ 的坐标.'
    explanation: 官方参考答案：(1) $y=\dfrac{2}{x}$; (2) $B\left(\dfrac{4}{3},\dfrac{3}{2}\right)$。
