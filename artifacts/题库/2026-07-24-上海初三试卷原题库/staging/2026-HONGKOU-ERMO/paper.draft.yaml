    block:
      stem_latex: "如图1，在扇形 $AOB$ 中，$\\angle AOB=90^\\circ$，点 $C$ 是弧 $AB$ 上一点，点 $D$ 是半径 $OB$ 上的点，联结 $CD$，$\\angle OCD$ 的平分线和 $\\angle COD$ 的平分线相交于点 $P$，联结 $BP$.\n\n(1) 求证：$\\angle OPB=90^\\circ+\\dfrac{1}{2}\\angle ODC$;\n\n(2) 联结 $BC$（如图2）. 如果 $CD\\perp OB$，$CP=10$，$\\triangle OPB$ 的外接圆 $\\odot M$ 与扇形 $AOB$ 所在的圆 $\\odot O$ 相交.\n\n① 当 $\\cos\\angle CBD=\\dfrac{1}{4}$ 时，求 $\\odot M$ 与 $\\odot O$ 的公共弦的长；\n\n② 联结 $AM$ 和 $AP$，$AP$ 交 $OC$ 于点 $E$，当 $AM\\perp OP$ 时，求 $\\tan\\angle PAM$ 的值和 $OE$ 的长."
      answer: "(1) 见详解; (2) 40, $\\dfrac{1}{3}$"
      explanation: "官方参考答案：(1) 见详解; (2) 40, $\\dfrac{1}{3}$。"
      solution_steps:
      - "【小问1详解】"
      - "解：$\\because CP$ 平分 $\\angle OCD$，$OP$ 平分 $\\angle COD$，"
      - "$\\therefore \\angle POC=\\angle POD$，$\\angle PCO=\\angle PCD$"
      - "$OC=OB$，$\\angle POC=\\angle POB$，$OP=OP$，"
      - "$\\therefore \\triangle OCP\\cong\\triangle OBP(SAS)$，"
      - "$\\therefore \\angle OPC=\\angle OPB$，"
      - "在 $\\triangle OCD$ 中，$\\angle COD+\\angle OCD+\\angle ODC=180^\\circ$，"
      - "即 $2\\angle POD+2\\angle PCO+\\angle ODC=180^\\circ$，"
      - "$\\therefore \\angle POD+\\angle PCO=90^\\circ-\\dfrac{1}{2}\\angle ODC$，"
      - "在 $\\triangle OPC$ 中，$\\angle OPC=180^\\circ-\\angle POC-\\angle PCO=180^\\circ-(90^\\circ-\\dfrac{1}{2}\\angle ODC)=90^\\circ+\\dfrac{1}{2}\\angle ODC$，"
      - "$\\therefore \\angle OPB=\\angle OPC=90^\\circ+\\dfrac{1}{2}\\angle ODC$。"
      - "【小问2详解】"
      - "①$CD\\perp OB$，"
      - "$\\therefore \\angle CDO=90^\\circ$，即 $\\angle ODC=90^\\circ$，"
      - "由(1)问结论，$\\angle OPB=90^\\circ+\\dfrac{1}{2}\\angle ODC=90^\\circ+45^\\circ=135^\\circ$，"
      - "$\\because \\triangle OCP\\cong\\triangle OBP(SAS)$，"
      - "$\\therefore CP=BP=10$，"
      - "$\\therefore \\angle CPB=360^\\circ-135^\\circ-135^\\circ=90^\\circ$，"
      - "$\\triangle CPB$ 是等腰直角三角形，"
      - "$\\therefore BC=\\sqrt{CP^2+BP^2}=\\sqrt{100+100}=10\\sqrt{2}$，"
      - "在 $\\mathrm{Rt}\\triangle CDB$ 中，$\\cos\\angle CBD=\\dfrac{BD}{BC}=\\dfrac{1}{4}$，"
      - "设 $BD=k$，则 $BC=4k=10\\sqrt{2}$，"
      - "$\\therefore k=\\dfrac{5\\sqrt{2}}{2}$，即 $BD=\\dfrac{5\\sqrt{2}}{2}$，"
      - "$CD=\\sqrt{BC^2-BD^2}=\\sqrt{200-\\dfrac{25\\times 2}{4}}=\\sqrt{200-12.5}=\\sqrt{187.5}=\\dfrac{5\\sqrt{30}}{2}$，"
      - "设圆 $O$ 半径为 $R$，则 $OB=OC=R$，$OD=OB-BD=R-\\dfrac{5\\sqrt{2}}{2}$，"
      - "在 $\\mathrm{Rt}\\triangle ODC$ 中，$OC^2=OD^2+CD^2$，"
      - "$R^2=\\left(R-\\dfrac{5\\sqrt{2}}{2}\\right)^2+\\dfrac{375}{2}$，"
      - "$R^2=R^2-5\\sqrt{2}R+\\dfrac{25\\times 2}{4}+\\dfrac{375}{2}$，"
      - "解得，$R=20\\sqrt{2}$，"
      - "设圆 $O$ 与圆 $M$ 的另一个交点为 $Q$，连接 $BQ$、$OM$，"
      - "$BQ$ 是两圆的公共弦，"
      - "$\\because \\angle OPB=135^\\circ$，优弧 $OB$ 所对的圆心角为 $2\\times 135^\\circ=270^\\circ$，"
      - "$\\therefore$ 劣弧 $OB$ 所对的圆心角 $\\angle OMB=360^\\circ-270^\\circ=90^\\circ$，"
      - "$\\therefore OM\\perp BM$，"
      - "又 $OM$ 垂直平分公共弦 $BQ$，"
      - "$\\therefore OM\\perp BQ$，"
      - "$BM\\perp OM$，$BQ\\perp OM$，且 $B$ 为公共点，"
      - "$\\therefore B$、$M$、$Q$ 三点共线，"
      - "$BQ$ 过圆心 $M$，即 $BQ$ 是圆 $M$ 的直径，"
      - "$O$、$B$ 都在圆上，"
      - "$\\therefore OM=BM=R_M$，"
      - "$\\triangle OMB$ 是等腰直角三角形，"
      - "$\\therefore BM=\\dfrac{\\sqrt{2}}{2}OB=\\dfrac{\\sqrt{2}}{2}\\times 20\\sqrt{2}=20$，"
      - "$\\therefore BQ=2BM=40$"
      - "$\\therefore \\odot M$ 与 $\\odot O$ 的公共弦长为 $40$。"
      - "②延长 $CD$ 交圆 $O$ 于点 $N$，"
      - "$CD\\perp OB$，"
      - "$\\therefore OB$ 垂直平分弦 $CN$，"
      - "$\\therefore BC=BN$，$BC=BN$，"
      - "$\\therefore \\angle BCD=\\angle BNC$，"
      - "$\\because \\angle BNC=\\dfrac{1}{2}\\angle BOC$，"
      - "$\\therefore \\angle BCD=\\dfrac{1}{2}\\angle BOC$，"
      - "$\\because AM\\perp OP$，$M$ 是圆心，$OP$ 是圆 $M$ 的弦，"
      - "$\\therefore OG=PG$，即 $AM$ 是 $OP$ 的垂直平分线，"
      - "$\\therefore AO=AP$，"
      - "$\\therefore AM$ 平分 $\\angle OAP$，即 $\\angle PAM=\\dfrac{1}{2}\\angle OAP$，"
      - "$\\because OA\\perp OB$，$CD\\perp OB$，$AM\\perp OP$，$CB\\perp OP$，"
      - "$\\therefore \\angle AFO=\\angle CBO$"
      - "$\\therefore \\angle OAF=\\angle BCD$，即 $\\angle PAM=\\angle BCD$，"
      - "$\\therefore \\angle OAP=\\angle BOC$"
      - "$\\because \\angle AOB=\\angle CDB=90^\\circ$"
      - "在 $\\triangle AOP$ 和 $\\triangle OBC$ 中，"
      - "$\\because AO=OB$，$\\angle OAP=\\angle BOC$，$AP=AO=OC$，"
      - "$\\therefore \\triangle AOP\\cong\\triangle OBC(SAS)$，"
      - "$\\therefore OP=BC=10\\sqrt{2}$，"
      - "由 $\\triangle AOP\\cong\\triangle OBC$，$\\angle OAP=\\angle BOC$，"
      - "$\\therefore \\angle PAM=\\dfrac{1}{2}\\angle BOC=\\angle BCD$，"
      - "延长 $OP$ 交 $BC$ 于 $R$，"
      - "$\\because OP$ 平分 $\\angle BOC$，$OC=OB$，"
      - "$\\therefore OR\\perp BC$，$R$ 为 $BC$ 中点，"
      - "$\\therefore BR=\\dfrac{BC}{2}=5\\sqrt{2}$，"
      - "$\\therefore OR=OP+PR=10\\sqrt{2}+5\\sqrt{2}=15\\sqrt{2}$，"
      - "在 $\\mathrm{Rt}\\triangle BOR$ 中，"
      - "$\\tan\\angle BOR=\\dfrac{BR}{OR}=\\dfrac{5\\sqrt{2}}{15\\sqrt{2}}=\\dfrac{1}{3}$，"
      - "$\\therefore \\tan\\angle PAM=\\dfrac{1}{3}$。"
      clue: "（1）连接 $PB$，由 $CP$ 平分 $\\angle OCD$，$OP$ 平分 $\\angle COD$，得 $\\angle POC=\\angle POD$，$\\angle PCO=\\angle PCD$；由 $OC=OB$，$\\angle POC=\\angle POB$，$OP=OP$，证 $\\triangle OCP\\cong\\triangle OBP$，得 $\\angle OPC=\\angle OPB$；在 $\\triangle OCD$ 中由内角和定理得 $\\angle POD+\\angle PCO=90^\\circ-\\dfrac{1}{2}\\angle ODC$，在 $\\triangle OPC$ 中得 $\\angle OPC=90^\\circ+\\dfrac{1}{2}\\angle ODC$，即 $\\angle OPB=90^\\circ+\\dfrac{1}{2}\\angle ODC$；（2）①由 $CD\\perp OB$ 得 $\\angle ODC=90^\\circ$，由(1)知 $\\angle OPB=135^\\circ$，$\\triangle OCP\\cong\\triangle OBP$ 得 $CP=BP=10$，$\\angle CPB=90^\\circ$，$\\triangle CPB$ 等腰直角，$BC=10\\sqrt{2}$；由 $\\cos\\angle CBD=\\dfrac{1}{4}$ 在 $\\mathrm{Rt}\\triangle CDB$ 中求 $BD$、$CD$，再在 $\\mathrm{Rt}\\triangle ODC$ 中求圆 $O$ 半径 $R=20\\sqrt{2}$；设两圆另一交点为 $Q$，由 $\\angle OPB=135^\\circ$ 得劣弧 $OB$ 圆心角 $\\angle OMB=90^\\circ$，又 $OM$ 垂直平分公共弦 $BQ$，故 $B$、$M$、$Q$ 共线，$BQ$ 为圆 $M$ 直径，由等腰 $\\mathrm{Rt}\\triangle OMB$ 求 $BM=20$，$BQ=40$。②$BC$，延长 $CD$ 交圆 $O$ 于点 $N$，由垂径定理得 $BC=BN$，$\\angle BCD=\\angle BNC=\\dfrac{1}{2}\\angle BOC$；由 $AM\\perp OP$ 得 $AO=AP$（垂径定理），三线合一得 $\\angle PAM=\\dfrac{1}{2}\\angle OAP$；证 $\\triangle AOP\\cong\\triangle OBC$ 得 $\\angle OAP=\\angle BOC$，$OP=BC=10\\sqrt{2}$，从而 $\\angle PAM=\\dfrac{1}{2}\\angle BOC=\\angle BCD$；延长 $OP$ 交 $BC$ 于 $R$，由三线合一得 $R$ 为 $BC$ 中点，$BR=PR=5\\sqrt{2}$，$OR=15\\sqrt{2}$，在 $\\mathrm{Rt}\\triangle BOR$ 中 $\\tan\\angle BOR=\\dfrac{1}{3}$，即 $\\tan\\angle PAM=\\dfrac{1}{3}$。"
