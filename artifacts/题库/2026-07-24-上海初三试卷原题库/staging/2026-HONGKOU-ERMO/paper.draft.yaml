      start_anchor: "\u3010\u7b54\u6848\u3011(1)"
      end_anchor: "y=-\\dfrac{1}{2}x^2+16"
      word_evidence:
      - page_number: 33
        page_image: documents/初三/2026届-上海市虹口区-初三二模数学-试卷及解析/word/pages/033.png
    block:
      stem_latex: "已知抛物线 $y=ax^2+bx+c(a\\neq 0)$.\n\n(1) 画抛物线时，如果列出的两组数据如表（信息不完整）所示，请直接写出该抛物线的对称轴，并求此时 $a$ 和 $c$ 之间的数量关系；\n\n| $x$ | $\\cdots$ | $-1$ | $\\cdots$ | $1$ | $\\cdots$ |\n|---|---|---|---|---|---|\n| $y$ | $\\cdots$ | $2$ | $\\cdots$ | $2$ | $\\cdots$ |\n\n(2) 已知点 $C$ 为抛物线与 $y$ 轴的交点，点 $A$、$B$ 在抛物线上，连接 $OA$、$AC$、$CB$ 和 $OB$.\n\n① 如果四边形 $OACB$ 为正方形，那么 $b$ 的值是________，$a$ 和 $c$ 之间的数量关系是________；\n\n② 如图，当 $a<0$ 时，已知四边形 $OACB$ 为菱形，$\\cot\\angle AOC=2$. 点 $P$ 在抛物线上且横坐标为 $2$，连接 $PA$、$PC$，如果 $\\triangle PAC$ 的面积为 $12$，求抛物线的表达式."
      answer: "(1) 对称轴是 $x=0$，$a+c=2$; (2)① $b=0$，$ac=-2$; ② $y=-\\dfrac{1}{2}x^2+16$"
      explanation: "官方参考答案：(1) $x=0$，$a+c=2$; (2)① $b=0$，$ac=-2$; ② $y=-\\dfrac{1}{2}x^2+16$。"
      solution_steps:
      - "【小问1详解】"
      - "由表可知，抛物线经过点 $(-1,2)$ 和 $(1,2)$，"
      - "抛物线的对称轴是 $x=0$，"
      - "$x=-\\dfrac{b}{2a}=0$，"
      - "抛物线的解析式是 $y=ax^2+c(a\\neq 0)$，"
      - "把点 $(-1,2)$ 的坐标代入可得：$a+c=2$"
      - "【小问2详解】"
      - "①当 $x=0$ 时，可得：$y=ax^2+bx+c=c$，"
      - "点 $C$ 的坐标为 $(0,c)$，"
      - "四边形 $OACB$ 是正方形，$OC$ 是正方形的对角线，"
      - "点 $A$、$B$ 关于 $OC$ 对称，"
      - "抛物线的对称轴是 $x=0$，"
      - "$b=0$；"
      - "$AB=OC$，点 $A$、$B$ 的纵坐标是 $\\dfrac{c}{2}$，"
      - "可得：$ax^2+c=\\dfrac{c}{2}$，"
      - "整理得：$2ax^2+c=0$，"
      - "解得：$x=\\pm\\sqrt{-\\dfrac{c}{2a}}$，"
      - "点 $A$ 的坐标为 $\\left(-\\sqrt{-\\dfrac{c}{2a}},\\dfrac{c}{2}\\right)$，点 $B$ 的坐标为 $\\left(\\sqrt{-\\dfrac{c}{2a}},\\dfrac{c}{2}\\right)$，"
      - "$AB=2\\sqrt{-\\dfrac{c}{2a}}=\\dfrac{\\sqrt{-2ac}}{-a}$，"
      - "可得：$\\dfrac{\\sqrt{-2ac}}{-a}=c$，"
      - "$a^2c^2=-2ac$，"
      - "解得：$ac=-2$ 或 $ac=0$（不符合题意，舍去）；"
      - "②四边形 $OACB$ 为菱形，"
      - "$AB\\perp OC$，$AE=BE$，$CE=OE$，"
      - "$\\cot\\angle AOC=2$，"
      - "$OE=2AE$，"
      - "$OC=c$，"
      - "$OE=\\dfrac{c}{2}$，$AE=\\dfrac{c}{4}$，"
      - "点 $A$ 的坐标是 $\\left(-\\dfrac{c}{4},\\dfrac{c}{2}\\right)$，"
      - "把点 $A$ 的坐标 $\\left(-\\dfrac{c}{4},\\dfrac{c}{2}\\right)$ 代入 $y=ax^2+c$，"
      - "可得：$\\dfrac{ac^2}{16}+c=\\dfrac{c}{2}$，"
      - "解得：$c=-\\dfrac{8}{a}$，"
      - "抛物线的解析式为 $y=ax^2-\\dfrac{8}{a}$，点 $A$ 的坐标 $\\left(\\dfrac{2}{a},-\\dfrac{4}{a}\\right)$，"
      - "点 $P$ 的横坐标为 $2$，"
      - "$y_P=ax^2-\\dfrac{8}{a}=4a-\\dfrac{8}{a}$，"
      - "点 $P$ 的坐标为 $\\left(2,4a-\\dfrac{8}{a}\\right)$，"
      - "设直线 $AP$ 的解析式是 $y=mx+n(m\\neq 0)$，"
      - "$\\begin{cases}\\dfrac{2}{a}m+n=-\\dfrac{4}{a}\\\\2m+n=4a-\\dfrac{8}{a}\\end{cases}$"
      - "解得：$\\begin{cases}m=2(a+1)\\\\n=-\\dfrac{8}{a}-4\\end{cases}$"
      - "直线 $AP$ 的解析式是 $y=2(a+1)x-\\dfrac{8}{a}-4$，"
      - "当 $x=0$ 时，可得：$y=2(a+1)x-\\dfrac{8}{a}-4=-\\dfrac{8}{a}-4$，"
      - "点 $F$ 的坐标为 $\\left(0,-\\dfrac{8}{a}-4\\right)$，"
      - "$CF=c-\\left(-\\dfrac{8}{a}-4\\right)=-\\dfrac{8}{a}-\\left(-\\dfrac{8}{a}-4\\right)=4$，"
      - "$S_{\\triangle PAC}=S_{\\triangle AFC}+S_{\\triangle PFC}=\\dfrac{1}{2}\\times\\left(\\dfrac{c}{4}\\right)\\times 4+\\dfrac{1}{2}\\times 2\\times 4=12$，"
      - "$\\because c=-\\dfrac{8}{a}$，"
      - "$\\dfrac{1}{2}\\times\\left(-\\dfrac{2}{a}\\right)\\times 4+\\dfrac{1}{2}\\times 2\\times 4=12$，"
      - "$a=-\\dfrac{1}{2}$"
      - "$c=-\\dfrac{8}{a}=16$，"
      - "抛物线的解析式为 $y=-\\dfrac{1}{2}x^2+16$。"
      clue: "（1）根据表中两个点的坐标可知，抛物线经过点 $(-1,2)$ 和 $(1,2)$，并且这两点对称，所以可知对称轴为 $x=0$；（2）①根据正方形的性质可知抛物线的对称轴是 $x=0$，所以 $b=0$；根据正方形的对角线互相平分且相等，把点 $A$、$B$ 的坐标表示出来，并表示出 $AB$ 的长度，根据 $AB=OC$ 找出 $a$ 和 $c$ 的关系；②根据菱形的性质，可知点 $A$ 的坐标 $\\left(-\\dfrac{c}{4},\\dfrac{c}{2}\\right)$，把点 $A$ 的坐标代入抛物线的解析式，可得抛物线的解析式为 $y=ax^2-\\dfrac{8}{a}$，点 $A$ 的坐标 $\\left(\\dfrac{2}{a},-\\dfrac{4}{a}\\right)$，点 $P$ 的坐标为 $\\left(2,4a-\\dfrac{8}{a}\\right)$，用待定系数法求出直线 $AP$ 的解析式，根据解析式求出点 $F$ 的坐标，从而可知 $CF=4$，根据 $\\triangle PAC$ 的面积为 $12$，可得 $\\dfrac{1}{2}\\times\\left(\\dfrac{c}{4}\\right)\\times 4+\\dfrac{1}{2}\\times 2\\times 4=12$，解方程求出 $c$ 的值，再根据 $c=-\\dfrac{8}{a}$ 求出 $a$ 的值，从而得到抛物线的解析式。"
