      stem_latex: "一只不透明的袋子中，装有 $3$ 个白球和若干个红球，这些球除颜色外都相同，如果搅匀后从中任意摸出一个球，摸到白球的概率为 $\\dfrac{3}{5}$，那么红球的个数是（\\quad）"
      choices:
      - "$2$"
      - "$3$"
      - "$4$"
      - "$5$"
      answer: A
      explanation: "官方参考答案：A。"
      solution_steps:
      - "设红球的个数为 $x$，则袋子中总球数为 $(3+x)$ 个，"
      - "摸到白球的概率等于白球个数除以总球数，已知摸到白球的概率为 $\\dfrac{3}{5}$，"
      - "可得方程 $\\dfrac{3}{3+x}=\\dfrac{3}{5}$，"
      - "解得 $x=2$，经检验，$x=2$ 是原方程的解，"
      - "红球的个数为 $2$。"
      clue: "设红球个数为 $x$，根据概率公式列方程求解。"
