  - type: problem
    id: Q020
    points: 10
    stem_latex: 画二次函数 $y=ax^2+bx$ 的图像时，在“列表”的步骤中，小明列出如下表格（不完整）。请补全表格，并求该二次函数的解析式。
    answer: 表中空格均为 $0$；$y=-x^2+4x$。
    solution_steps:
    - title: 步骤 1
      content: 补全表格：当 $x=0$、$4$ 时，$y=0$。
      diagram_col:
        image_path: assets/solution-01.png
        width: 58mm
        variant: solution
        disclosure_policy: teacher_only
    - title: 步骤 2
      content: 把 $A(-1,-5)$ 和 $B(2,4)$ 代入 $y=ax^2+bx$，得 $\begin{cases}-5=a-b,\\4=4a+2b.\end{cases}$，解得 $\begin{cases}a=-1,\\b=4.\end{cases}$。因此抛物线的表达式为 $y=-x^2+4x$。
    diagram_col:
      image_path: assets/prompt-01.png
      width: 0.92\linewidth
      variant: prompt
      disclosure_policy: clean
    source_solution_images:
    - image_path: assets/official-solution-01.png
      width: 0.96\linewidth
      variant: source_solution
      disclosure_policy: teacher_only
      label: 官方原解答第1页
