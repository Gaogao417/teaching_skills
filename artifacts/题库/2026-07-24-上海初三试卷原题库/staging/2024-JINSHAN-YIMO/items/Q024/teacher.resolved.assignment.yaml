  - type: problem
    id: Q024
    points: 12
    stem_latex: 在平面直角坐标系 $xOy$ 中，抛物线 $y=ax^2+bx+c$ 经过点 $A(-1,0)$、$B(3,0)$、$C(0,-3)$。（1）求抛物线的表达式和顶点
      $P$ 的坐标；（2）点 $D$ 在抛物线对称轴上，$\angle PAD=90^\circ$，求点 $D$ 的坐标；（3）抛物线的对称轴和 $x$ 轴相交于点
      $M$，把抛物线平移，得到新抛物线的顶点为点 $Q$，$QB=QM$，$QO$ 的延长线交原抛物线为 $E$，$QO=OE$，求新抛物线的表达式。
    answer: （1）$y=x^2-2x-3$，$P(1,-4)$；（2）$D(1,1)$；（3）$y=x^2-4x-1$
    solution_steps:
    - title: 官方解答
      content: （1）由题意得 $a-b+c=0,9a+3b+c=0,c=-3$，解得 $a=1,b=-2,c=-3$，所以抛物线的表达式为 $y=x^2-2x-3$。又
        $y=(x-1)^2-4$，所以顶点 $P(1,-4)$。（2）对称轴为直线 $x=1$。设 $D(1,m)$，由 $\angle PAD=90^\circ$
        得 $PA^2+AD^2=PD^2$，解得 $m=1$，故 $D(1,1)$。（3）$M(1,0)$。作 $MH\perp x$ 轴，垂足为 $H$，则
        $OB=OM$，故 $MH=HB$，点 $H$ 的横坐标为 $2$。设 $Q(2,t)$，由 $QO=OE$ 知点 $Q$ 和点 $E$ 关于原点
        $O$ 对称，所以 $E(-2,-t)$。将 $x=-2$ 代入原抛物线得 $t=-5$，故 $Q(2,-5)$。新抛物线为 $y=(x-2)^2-5=x^2-4x-1$。
