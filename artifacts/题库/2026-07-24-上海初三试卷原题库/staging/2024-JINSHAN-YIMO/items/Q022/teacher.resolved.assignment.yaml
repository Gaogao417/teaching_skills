  - type: problem
    id: Q022
    points: 10
    stem_latex: 随着人民生活水平的日益提高，许多农村的房屋普遍进行了改造，小明家改造时在门前安装了一个遮阳棚。如图，在侧面示意图中，遮阳篷 $AB$
      长为 $4$ 米，与墙面 $AD$ 的夹角 $\angle BAD=75.5^\circ$，靠墙端 $A$ 离地高 $AD$ 为 $3$ 米，当太阳光线
      $BC$ 与地面 $DE$ 的夹角为 $45^\circ$ 时，求阴影 $CD$ 的长。（结果精确到 $0.1$ 米；参考数据：$\sin75.5^\circ\approx0.97$，$\cos75.5^\circ\approx0.25$，$\tan75.5^\circ\approx3.87$）
    answer: $1.9$ 米
    solution_steps:
    - title: 官方解答
      content: 作 $BM\perp ED$、$BN\perp AD$，垂足分别为 $M、N$。在 $\triangle ABN$ 中，$\angle
        ANB=90^\circ$，所以 $AN=AB\cos\angle BAD=4\times0.25=1$，$BN=AB\sin\angle BAD=4\times0.97=3.88$，$ND=2$。在四边形
        $BMDN$ 中，$\angle BMD=\angle MDA=\angle DNB=90^\circ$，所以四边形 $BMDN$ 是矩形，$BM=ND=2$，$BN=MD=3.88$。在
        $\triangle BCM$ 中，$\angle BMC=90^\circ$，$\angle BCM=45^\circ$，所以 $BM=MC=2$。故
        $CD=MD-MC=1.88\approx1.9$（米）。
