  - type: problem
    id: Q023
    points: 12
    stem_latex: 已知：如图，在四边形 $ABCD$ 中，对角线 $AC$ 和 $BD$ 相交于点 $O$，$\angle BAC=\angle BDC$。（1）求证：$\triangle
      AOD\sim\triangle BOC$；（2）过点 $A$ 作 $AE\parallel CD$，$AE$ 交 $BD$ 于点 $E$，求证：$AB\cdot
      AD=AE\cdot BC$。
    answer: 两问结论均成立
    solution_steps:
    - title: 官方解答
      content: （1）$\because\angle BAC=\angle BDC,\angle AOB=\angle DOC$，$\therefore\triangle
        AOB\sim\triangle DOC$，所以 $\frac{AO}{BO}=\frac{DO}{CO}$。又 $\angle AOD=\angle
        BOC$，$\therefore\triangle AOD\sim\triangle BOC$。（2）由 $\triangle AOB\sim\triangle
        DOC$ 得 $\angle BAO=\angle CDO$。$\because AE\parallel CD$，$\therefore\angle
        AED=\angle CDO$，故 $\angle AED=\angle BAC$。又由 $\triangle AOD\sim\triangle BOC$
        得 $\angle ADE=\angle BCA$，所以 $\triangle AED\sim\triangle BAC$，从而 $\frac{AE}{BA}=\frac{AD}{BC}$，即
        $AB\cdot AD=AE\cdot BC$。
