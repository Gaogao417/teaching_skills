  - type: choice
    id: Q005
    points: 4
    stem_latex: 选择不正确的说法。
    choices:
    - 如果 $k$ 是一个实数，$\vec a$ 是向量，那么 $k\vec a$ 与 $\vec a$ 方向相同
    - 如果向量 $\vec b$ 与非零向量 $\vec a$ 平行，那么存在唯一的实数 $m$，使 $\vec b=m\vec a$
    - 如果 $\vec e$ 是单位向量，那么 $|\vec e|=1$
    - 如果 $m$、$n$ 是实数，那么 $(m+n)\vec a=m\vec a+n\vec a$
