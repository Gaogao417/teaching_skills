  - type: problem
    id: Q020
    points: 10
    stem_latex: 在平面直角坐标系 $xOy$ 中，将抛物线 $y=x^2$ 向右平移2个单位，再向下平移1个单位后得到的新抛物线 $L$ 与 $x$ 轴交于点 $A$ 和 $B$（点 $A$ 在点 $B$ 左侧），与 $y$ 轴交于点 $C$，新抛物线 $L$ 的顶点为 $D$，联结 $BC$、$CD$。（1）请求出平移后新抛物线 $L$ 的表达式及点 $C$ 的坐标；（2）求 $\angle BCD$ 的正切值。
    answer: （1）$y=(x-2)^2-1$，$C(0,3)$；（2）$\tan\angle BCD=\dfrac13$。
    solution_steps:
    - title: 第（1）问
      content: 抛物线 $y=x^2$ 向右平移2个单位，再向下平移1个单位后得到的新抛物线 $L:y=(x-2)^2-1$。令 $x=0$，得 $y=3$，点 $C(0,3)$。
    - title: 第（2）问
      content: 由 $y=(x-2)^2-1$ 得顶点 $D(2,-1)$。由 $y=(x-2)^2-1=0$ 解得 $x_1=1,x_2=3$。点 $A$ 在点 $B$ 左侧，$\therefore B(3,0)$。$\therefore BC=3\sqrt2$，$BD=\sqrt2$，$CD=2\sqrt5$，$\therefore CD^2=BC^2+BD^2$，$\therefore\triangle BCD$ 是直角三角形，$\angle CBD=90^\circ$，$\therefore\tan\angle BCD=\frac{BD}{BC}=\frac13$。
      diagram_col:
        image_path: assets/solution-01.png
        width: 58mm
        variant: solution
        disclosure_policy: teacher_only
