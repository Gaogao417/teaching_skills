    stem_latex: 如何用尺规把一条线段进行黄金分割呢？教材54页的阅读材料给出了一种方法，请阅读材料并回答问题。（1）请写出图中 $\dfrac{AP}{AB}$ 的值；（2）我们把顶角为 $36^\circ$ 的等腰三角形称为黄金三角形，它的底边与腰的比是黄金分割数。请利用无刻度直尺和圆规，作出以线段 $EF$ 为底边的黄金三角形 $EFG$（不必写出作法，保留作图痕迹并写出结论）。
    answer: （1）$\dfrac{\sqrt5-1}{2}$；（2）见作图。
