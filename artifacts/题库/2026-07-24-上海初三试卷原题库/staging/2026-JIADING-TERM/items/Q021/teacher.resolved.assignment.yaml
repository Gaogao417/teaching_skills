  - type: problem
    id: Q021
    points: 10
    stem_latex: 上海市嘉定区法华塔被列为上海市文物保护单位，是“教化嘉定”的重要象征。小海想利用所学知识测量法华塔的高度，由于法华塔被防护栏保护起来，小海只能在防护栏外进行测量。如图9，小海在 $A$ 处用测角仪测得塔顶 $M$ 的仰角为 $37^\circ$，再往塔的方向前进30米至 $B$ 处（点 $N$ 为塔底中心，且点 $A$、$B$、$N$ 在同一水平线上），测得此时塔顶 $M$ 的仰角为 $60^\circ$，已知测角仪的高度为1.5米。请估算法华塔的高度。（参考数据：$\sin37^\circ\approx\frac35$，$\cos37^\circ\approx\frac45$，$\tan37^\circ\approx\frac34$，$\sqrt3\approx1.73$，结果精确到0.1米）
    answer: 约41.2米。
    solution_steps:
    - title: 解答
      content: 联结 $MN$，延长 $CD$ 交 $MN$ 于点 $H$。由题意知：$MN\perp AN$，$CD\parallel AB$，$CH\perp MN$，$AB=CD=30$，$CA=BD=HN=1.5$，$\angle MDH=60^\circ$，$\angle MCH=37^\circ$。在 $Rt\triangle MDH$ 中，$\tan\angle MDH=\frac{MH}{HD}=\tan60^\circ$，即 $HD=\frac{\sqrt3}{3}MH$。同理 $HC=\frac{MH}{\tan37^\circ}\approx\frac43MH$。$\because CD=HC-HD$，$\therefore\frac43MH-\frac{\sqrt3}{3}MH=30$，$\therefore MH=\frac{90}{4-\sqrt3}\approx39.65$，$\therefore MN=MH+HN\approx39.65+1.5\approx41.2$。答：法华塔的高度约为41.2米。
