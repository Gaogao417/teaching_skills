    block:
      stem_latex: '如图，过菱形 $ABCD$ 顶点 $A$ 分别作边 $BC、CD$ 的垂线，垂足为 $E、F$，交对角线 $BD$ 于点 $M、N$。（1）求证：$BM=DN$；（2）联结 $EN$，如果 $EN\parallel AB$，求 $\cos\angle ABC$ 的值；（3）如果 $\triangle ABM$ 与五边形 $CFNME$ 的面积均为1，求菱形 $ABCD$ 的面积。'
      answer: '（1）$BM=DN$；（2）$\cos\angle ABC=\dfrac{\sqrt5-1}{2}$；（3）面积为 $2\sqrt2+2$。'
      solution_steps:
      - title: 第（1）问
        content: 先证 $\triangle ABE\cong\triangle ADF$，再证 $\triangle MBE\cong\triangle NDF$，所以 $BM=DN$。
      - title: 第（2）问
        content: 由 $EN\parallel AB\parallel CD$ 及相似关系得 $DF=BE$，再由比例关系知 $N$ 为 $BD$ 的黄金分割点，因此 $\cos\angle ABC=\cos\angle ADC=\dfrac{DF}{AD}=\dfrac{\sqrt5-1}{2}$。
      - title: 第（3）问
        content: 联结 $AC$。由 $\triangle ABM$ 与五边形 $CFNME$ 面积均为1，结合菱形对称与相似关系可得 $BE=AE$，继而 $\dfrac{BM}{MD}=\dfrac{\sqrt2}{2}$，且 $S_{\triangle AMD}=\sqrt2$，所以菱形 $ABCD$ 的面积为 $2\sqrt2+2$。
