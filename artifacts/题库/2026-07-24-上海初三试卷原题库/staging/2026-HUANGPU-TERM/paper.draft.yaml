    block:
      stem_latex: '计算：$\dfrac2{\tan60^\circ+1}+\cot^230^\circ-2\sin45^\circ\cdot\cos45^\circ$。'
      answer: '$\sqrt3+1$'
      solution_steps:
      - title: 计算
        content: '原式 $=\dfrac2{\sqrt3+1}+(\sqrt3)^2-2\times\dfrac{\sqrt2}{2}\times\dfrac{\sqrt2}{2}=\sqrt3-1+3-1=\sqrt3+1$。'
  - item_id: Q018
