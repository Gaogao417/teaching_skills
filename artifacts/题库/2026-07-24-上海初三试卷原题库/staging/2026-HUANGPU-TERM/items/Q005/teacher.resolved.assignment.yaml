    stem_latex: 小明和小丽家在同一幢楼，小明住8楼，小丽住9楼。小明在家里看对面一幢楼顶部 $A$ 处的仰角为 $\alpha_1$，看底部 $B$ 处的俯角为 $\beta_1$；小丽看顶部 $A$ 处的仰角为 $\alpha_2$，看底部 $B$ 处的俯角为 $\beta_2$。下列结论正确的是（　）。
    choices:
    - $\alpha_1>\alpha_2$ 且 $\beta_1>\beta_2$
    - $\alpha_1>\alpha_2$ 且 $\beta_1<\beta_2$
    - $\alpha_1<\alpha_2$ 且 $\beta_1>\beta_2$
    - $\alpha_1<\alpha_2$ 且 $\beta_1<\beta_2$
    answer: B
    explanation: 官方参考答案：B。
