    stem_latex: 对于抛物线 $y=ax^2+bx+c$ 及点 $P$，当过点 $P$ 垂直于抛物线对称轴的直线与该抛物线有两个交点，且两个交点位于点 $P$ 的两侧时，称点 $P$ 为该抛物线的内点。现有抛物线 $L_1:y=-x^2+2x+2$ 和 $L_2:y=\dfrac14x^2+\dfrac34x-\dfrac12$，如果点 $M$ 既是 $L_1$ 的内点，又是 $L_2$ 的内点，那么点 $M$ 的纵坐标 $y_M$ 的取值范围是 $\fillin$。
