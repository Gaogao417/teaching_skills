  - type: problem
    id: Q020
    points: 12
    stem_latex: 如图，在 $\triangle ABC$ 中，$\angle ACB=90^\circ$，$OD$ 是 $\triangle ABC$ 的中位线，$P$ 是线段 $OA$ 上一点，联结 $PD$ 并延长交 $BC$ 的延长线于点 $Q$。（1）如果 $CQ=OD$，求证：$\angle PDQ=\angle PQD$；（2）过点 $P$ 作 $PT\parallel BC$ 交 $AC$ 于点 $T$，联结 $TO$ 并延长交 $CB$ 的延长线于点 $S$，再联结 $OQ$，求证：$OS=OQ$。
    answer: 两个结论均成立。
    solution_steps:
    - title: 第（1）问
      content: 联结 $OC$。由 $OD$ 是中位线得 $OD\parallel BC$，又 $OD=CQ$，所以四边形 $OCQD$ 是平行四边形，得 $\angle PDQ=\angle PQC=\angle OCB，\angle PQD=\angle B$。又 $\angle ACB=90^\circ$ 且 $O$ 是 $AB$ 中点，故 $OC=OB，\angle B=\angle OCB$，所以 $\angle PDQ=\angle PQD$。
    - title: 第（2）问
      content: 过点 $O$ 作 $OH\perp BC$，垂足为 $H$。由 $OB=OC$ 得 $BH=CH$。利用 $PT\parallel BC$ 与 $OD\parallel BC$ 的比例关系可得 $BS=CQ$，从而 $HS=HQ$。又 $OH\perp BC$，所以 $OS=OQ$。
