  - type: problem
    id: Q021
    points: 14
    stem_latex: 已知二次函数 $y=ax^2+bx+c\ (a\ne0)$ 的图像经过点 $A\left(\dfrac52,0\right)、B(0,5)$。（1）试用字母 $a$ 的代数式表示 $b$；（2）如果图像上存在点 $C$，使直线 $AB$ 垂直平分线段 $OC$，求此二次函数的解析式；（3）二次函数图像的对称轴是否可能平分线段 $AB$？如果能，求解析式；如果不能，说明理由。
    answer: （1）$b=-\dfrac52a-2$；（2）$y=\dfrac56x^2-\dfrac{49}{12}x+5$；（3）不能。
    solution_steps:
    - title: 第（1）问
      content: 由两点在图像上得 $0=\dfrac{25}{4}a+\dfrac52b+c，5=c$，解得 $b=-\dfrac52a-2$。
    - title: 第（2）问
      content: 令 $C(s,t)$。由直线 $AB$ 垂直平分 $OC$，得 $AC=AO，BC=BO$，解得 $C(4,2)$。将其代入并结合第（1）问，解得 $a=\dfrac56$，所以解析式为 $y=\dfrac56x^2-\dfrac{49}{12}x+5$。
    - title: 第（3）问
      content: 假设对称轴平分线段 $AB$，则通过中点条件列式会得到 $0\cdot a=8$，方程无解，所以不可能。
