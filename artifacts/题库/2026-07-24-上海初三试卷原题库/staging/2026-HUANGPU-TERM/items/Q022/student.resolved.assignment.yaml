    stem_latex: 铺设转角地板时使用宽度比为 $2:1$ 的甲、乙两种木地板。场景1为直角转角，场景2为 $60^\circ$ 转角，图示给出沿切割线拼接的方法及一种不用刻度尺、量角器、圆规确定乙种地板切割线的操作方案。（1）在场景1中，求乙种地板切割后产生的锐角正切值，即 $\tan\angle AON$；（2）在场景2中，求乙种地板切割后产生的锐角 $\angle BOQ$ 的正切值；（3）判断所给操作方案作出的切割线是否符合场景2要求，并说明理由。
