    stem_latex: 在平面直角坐标系 $xOy$ 中，过 $A\left(-1,0\right)$、$B\left(0,-3\right)$ 两点的抛物线 $y=x^{2}+bx+c$（其中 $b$、$c$ 是常数）与 $x$ 轴的另一个交点为 $C$，顶点为 $D$。\n\n（1）求这条抛物线的表达式；\n\n（2）如果点 $E\left(m,n\right)$ 在抛物线上，且在第四象限，过点 $E$ 作 $EF\parallel x$ 轴，与抛物线的另一个交点为 $F$，连接 $BC$，作 $EH\parallel y$ 轴，交 $BC$ 于点 $H$，连接 $FH$。\n\n①当 $\tan\angle FHE=\dfrac{1}{2}$ 时，求 $m$ 的值；\n\n②抛物线 $y=x^{2}+bx+c$ 关于直线 $EF$ 对称所得新抛物线的顶点为 $G$，如果点 $G$ 刚好落在线段 $FH$ 上，求点 $E$ 的坐标。
    explanation: 官方参考答案：（1）$y=x^{2}-2x-3$；（2）①$m=\dfrac{7-\sqrt{33}}{2}$ 或 $m=\dfrac{\sqrt{17}-1}{2}$；②点 $E\left(2,-3\right)$ 或 $E\left(\dfrac{1}{3},-\dfrac{32}{9}\right)$。
