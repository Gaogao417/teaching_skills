  - type: fillin
    id: Q017
    points: 4
    stem_latex: 如图，在 $\triangle ABC$ 中，$AB=AC$，$AO\perp BC$，垂足为点 $O$，点 $G$ 是 $\triangle ABC$ 的重心，$BC=18$，$AO=12$，点 $D$ 为边 $AB$ 上一动点，如果以点 $O$ 为圆心 $OG$ 为半径的 $\odot O$ 与以点 $D$ 为圆心的 $\odot D$ 相切，那么 $\odot D$ 的半径 $r$ 的取值范围是 \underline{\qquad}。
    answer: $\dfrac{16}{5}\leq r\leq 8$ 或 $\dfrac{56}{5}\leq r\leq 16$
    explanation: 官方参考答案：$\dfrac{16}{5}\leq r\leq 8$ 或 $\dfrac{56}{5}\leq r\leq 16$。
    solution_steps:
    - 在 $\triangle ABC$ 中，$AB=AC$，$AO\perp BC$，$BO=OC=\dfrac{1}{2}BC=9$，
    - 利用勾股定理求出 $AB=\sqrt{OB^{2}+OA^{2}}=15$，利用等面积法求出 $OE=\dfrac{36}{5}$，
    - 由重心的性质求出 $OG=\dfrac{1}{3}AO=4$，
    - 当 $\odot O$ 与 $\odot D$ 外切时，$\odot D$ 的半径 $r$ 取得最小值 $\dfrac{16}{5}$，最大值 $8$；
    - 当 $\odot O$ 与 $\odot D$ 内切时，$\odot D$ 的半径 $r$ 取得最小值 $\dfrac{56}{5}$，最大值 $16$；
    - 综上所述，$\odot D$ 的半径 $r$ 的取值范围是 $\dfrac{16}{5}\leq r\leq 8$ 或 $\dfrac{56}{5}\leq r\leq 16$。
