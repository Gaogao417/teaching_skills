    id: Q014
    points: 4
    stem_latex: DeepSeek可提供高效、精准的信息检索和智能对话服务。其用户总数在上线 $21$ 天后达到了 $3.36\times10^{7}$，那么平均每天上线人数用科学记数法表示为 \underline{\qquad}。
    answer: $1.6\times10^{6}$
    explanation: 官方参考答案：$1.6\times10^{6}$。
    solution_steps:
    - 由题意得，平均每天上线人数为 $\left(3.36\times10^{7}\right)\div21=\left(3.36\div21\right)\times10^{7}=0.16\times10^{7}=1.6\times10^{6}$。
