  blocks:
  - type: choice
    id: Q002
    points: 4
    stem_latex: 下列函数，图象不是一条直线的是（\quad）
    choices:
    - $y=x^{2}$
    - $y=x+1$
    - $y=1$
    - $y=x$
    answer: A
    explanation: 官方参考答案：A。
    solution_steps:
    - A：$y=x^{2}$是二次函数，图象是一条抛物线，符合题意；
    - B：$y=x+1$是一次函数，图象是一条直线，不符合题意；
    - C：$y=1$是一条平行于$x$轴的直线，不符合题意；
    - D：$y=x$是正比例函数，图象是一条直线，不符合题意。
