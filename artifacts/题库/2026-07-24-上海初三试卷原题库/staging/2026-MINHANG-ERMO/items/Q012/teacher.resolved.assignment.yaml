  blocks:
  - type: fillin
    id: Q012
    points: 4
    stem_latex: 从 $-1$，$2$，$4$ 这三个数中随机抽取其中的两个数，分别记作 $a$ 和 $b$。如果点 $P$ 的坐标为 $\left(a,b\right)$，那么点 $P$ 在第二象限内的概率是 \underline{\qquad}。
    answer: $\dfrac{1}{3}$
    explanation: 官方参考答案：$\dfrac{1}{3}$。
    solution_steps:
    - 列举所有等可能的点 $P\left(a,b\right)$，共有 $6$ 种等可能的结果，
    - 分别为：$\left(-1,2\right)$，$\left(-1,4\right)$，$\left(2,-1\right)$，$\left(2,4\right)$，$\left(4,-1\right)$，$\left(4,2\right)$，
    - 第二象限内点的坐标特征为横坐标小于 $0$，纵坐标大于 $0$，
    - 符合该特征的点有 $2$ 个，分别为 $\left(-1,2\right)$，$\left(-1,4\right)$，
    - 根据概率公式可得点 $P$ 在第二象限内的概率为 $\dfrac{2}{6}=\dfrac{1}{3}$。
