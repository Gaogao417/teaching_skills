    id: Q013
    points: 4
    stem_latex: 在 $\mathrm{Rt}\triangle ABC$ 中，$\angle C=90^{\circ}$，$\overrightarrow{AC}=3$，$\overrightarrow{CB}=2$，那么 $\left|\overrightarrow{AC}+\overrightarrow{CB}\right|=$ \underline{\qquad}。
    answer: $\sqrt{13}$
    explanation: 官方参考答案：$\sqrt{13}$。
    solution_steps:
    - 在 $\mathrm{Rt}\triangle ABC$ 中，$\angle C=90^{\circ}$，$AC=3$，$CB=2$，
    - 由勾股定理得 $\left|\overrightarrow{AB}\right|=AB=\sqrt{AC^{2}+BC^{2}}=\sqrt{3^{2}+2^{2}}=\sqrt{13}$，
    - $\therefore \left|\overrightarrow{AC}+\overrightarrow{CB}\right|=\left|\overrightarrow{AB}\right|=\sqrt{13}$。
