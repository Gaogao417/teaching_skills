  blocks:
  - type: choice
    id: Q001
    points: 4
    stem_latex: 下列实数中，比 $0$ 小的是（\quad）
    choices:
    - $\left(-1\right)^{2}$
    - $-\left(-1\right)$
    - $\left|-1\right|$
    - $-1$的倒数
    answer: D
    explanation: 官方参考答案：D。
    solution_steps:
    - A选项：$\left(-1\right)^{2}=1$，$1>0$，不符合要求；
    - B选项：$-\left(-1\right)=1$，$1>0$，不符合要求；
    - C选项：$\left|-1\right|=1$，$1>0$，不符合要求；
    - D选项：$-1$的倒数是$-1$，$-1<0$，符合要求。
