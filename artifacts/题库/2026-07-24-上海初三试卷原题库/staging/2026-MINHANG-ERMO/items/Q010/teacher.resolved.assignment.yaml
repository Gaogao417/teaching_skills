  - type: fillin
    id: Q010
    points: 4
    stem_latex: 如果关于 $x$ 的一元二次方程 $x^{2}+2x+m=0$ 有两个不相等的实数根，那么 $m$ 的取值范围为 \underline{\qquad}。
    answer: $m<1$
    explanation: 官方参考答案：$m<1$。
    solution_steps:
    - 一元二次方程 $x^{2}+2x+m=0$ 有两个不相等的实数根，
    - $\therefore \Delta=2^{2}-4m>0$，
    - $\therefore m<1$。
