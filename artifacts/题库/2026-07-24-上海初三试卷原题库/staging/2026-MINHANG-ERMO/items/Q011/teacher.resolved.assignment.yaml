    id: Q011
    points: 4
    stem_latex: 已知抛物线 $y=ax^{2}+bx+c$ 经过 $\left(1,1\right)$ 和 $\left(3,1\right)$ 两点，将该抛物线向右平移 $2$ 个单位，那么平移后的抛物线的对称轴为 \underline{\qquad}。
    answer: 直线 $x=4$
    explanation: 官方参考答案：直线 $x=4$。
    solution_steps:
    - 抛物线 $y=ax^{2}+bx+c$ 经过 $\left(1,1\right)$ 和 $\left(3,1\right)$ 两点，两点纵坐标相等，
    - 两点关于抛物线的对称轴对称，
    - 原抛物线的对称轴为：直线 $x=\dfrac{1+3}{2}=2$，
    - 将抛物线向右平移 $2$ 个单位时，对称轴同步向右平移 $2$ 个单位，
    - 平移后抛物线的对称轴为直线 $x=2+2=4$。
