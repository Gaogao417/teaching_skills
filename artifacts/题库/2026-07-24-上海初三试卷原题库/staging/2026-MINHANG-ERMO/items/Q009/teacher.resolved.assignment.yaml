    id: Q009
    points: 4
    stem_latex: 方程 $\sqrt{3-4x}=1$ 的解是 \underline{\qquad}。
    answer: $x=\dfrac{1}{2}$
    explanation: 官方参考答案：$x=\dfrac{1}{2}$。
    solution_steps:
    - $\sqrt{3-4x}=1$，两边平方，得 $3-4x=1$，
    - 移项，得 $-4x=1-3$，合并同类项，得 $-4x=-2$，
    - 系数化为1，得 $x=\dfrac{1}{2}$，
    - 检验：当 $x=\dfrac{1}{2}$ 时，左边 $\sqrt{3-4\times\dfrac{1}{2}}=1=$ 右边，
    - 因此 $x=\dfrac{1}{2}$ 是原方程的解。
