    stem_latex: 探究：在铁片上裁剪正方形。\n\n（1）如图 $\triangle ABC$ 是一块等边三角形的废铁片，利用其剪裁出顶点在边上的一个正方形铁片。\n\nI. 根据以下步骤画图：\n①在边 $AB$ 上取点 $G^{\prime}$（如图），过 $G^{\prime}$ 作 $G^{\prime}D^{\prime}\perp BC$，垂足为 $D^{\prime}$；\n②以 $G^{\prime}D^{\prime}$ 为边在 $\triangle ABC$ 内部作正方形 $G^{\prime}D^{\prime}E^{\prime}F^{\prime}$；\n③连接 $BF^{\prime}$ 并延长交 $AC$ 于点 $F$；\n④过 $F$ 作 $FE\parallel F^{\prime}E^{\prime}$ 交 $BC$ 于点 $E$、$FG\parallel F^{\prime}G^{\prime}$ 交 $AB$ 于点 $G$；过 $G$ 作 $GD\parallel G^{\prime}D^{\prime}$ 交 $BC$ 于点 $D$。\n\nII. 以上画图步骤作为条件，求证：四边形 $DEFG$ 是正方形。\n\n（2）如果 $\triangle ABC$ 是一块边长为 $3$、$4$、$5$ 的直角三角形废铁片，利用其剪裁一个顶点在边上的正方形铁片，那么这个正方形铁片的最大面积为 \underline{\qquad}。
    answer: （1）画图见解析；证明见解析；（2）$\dfrac{144}{49}$
    explanation: 官方参考答案：（1）画图见解析；证明见解析；（2）$\dfrac{144}{49}$。
    solution_steps:
    - （1）证明：$\because$ 四边形 $G^{\prime}D^{\prime}E^{\prime}F^{\prime}$ 是正方形，$FE\parallel F^{\prime}E^{\prime}$，$FG\parallel F^{\prime}G^{\prime}$，$GD\parallel G^{\prime}D^{\prime}$，
    - $\therefore \angle GDE=\angle FGD=\angle FED=\angle F^{\prime}E^{\prime}D^{\prime}=90^{\circ}$，四边形 $GDEF$ 为矩形，
    - 又 $F^{\prime}E^{\prime}=F^{\prime}G^{\prime}$，$FE\parallel F^{\prime}E^{\prime}$，$\triangle BE^{\prime}F^{\prime}\sim\triangle BEF$，
    - $\therefore \dfrac{FE}{F^{\prime}E^{\prime}}=\dfrac{FB}{F^{\prime}B}$，同理 $\dfrac{FG}{F^{\prime}G^{\prime}}=\dfrac{FB}{F^{\prime}B}$，
    - $\therefore \dfrac{FE}{F^{\prime}E^{\prime}}=\dfrac{FG}{F^{\prime}G^{\prime}}$，又 $F^{\prime}E^{\prime}=F^{\prime}G^{\prime}$，$\therefore FE=FG$，矩形 $GDEF$ 为正方形。
    - （2）在 $\triangle ABC$ 中，$\angle C=90^{\circ}$，$AC=3$，$BC=4$，$AB=5$，$S_{\triangle ABC}=6$，
    - ①当正方形的边在 $\triangle ABC$ 的直角边上时，设正方形 $DEFC$ 的边长为 $x$，$S_{\triangle ABC}=\dfrac{1}{2}\times3x+\dfrac{1}{2}\times4x=\dfrac{7}{2}x=6$，$x=\dfrac{12}{7}$，正方形面积为 $\left(\dfrac{12}{7}\right)^{2}=\dfrac{144}{49}$；
    - ②当正方形的边在 $\triangle ABC$ 的斜边上时，设正方形的边长为 $x$，解得 $x=\dfrac{60}{37}$，正方形面积为 $\left(\dfrac{60}{37}\right)^{2}=\dfrac{3600}{1369}$；
    - $\because \dfrac{144}{49}>\dfrac{3600}{1369}$，$\therefore$ 这个正方形铁片的最大面积为 $\dfrac{144}{49}$。
