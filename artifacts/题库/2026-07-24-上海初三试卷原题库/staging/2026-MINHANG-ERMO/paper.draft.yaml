      choices:
      - 'A'
      - 'B'
      - 'C'
      - 'D'
      answer: B
      explanation: 官方参考答案：B。
      solution_steps:
      - '设扇形的半径为 $r$，完全打开时的角度为 $t$，'
      - '$S=\dfrac{t\pi r}{360}$，当扇面张开的角度为 $n^{\circ}$ 时，扇面面积 $S_{n}=\dfrac{n\pi r}{360}$，'
      - '$m=\dfrac{S_{n}}{S}=\dfrac{\dfrac{n\pi r}{360}}{\dfrac{t\pi r}{360}}=\dfrac{n}{t}=\dfrac{1}{t}\cdot n$，'
      - '$\therefore m$ 与 $n$ 成正比例关系，故选B。'
