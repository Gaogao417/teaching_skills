      solution_steps:
      - '（1）证明：$\because AB=BC$，$\mathrm{Rt}\triangle ABC$ 为等腰直角三角形，'
      - '$\therefore \angle BAC=\angle BCA=45^{\circ}$，$\angle ABE=\angle ABC=90^{\circ}$，'
      - '$\because AE=EF$，$\triangle EAF$ 为等腰三角形，$\angle EAF=\angle EFA$，'
      - '又 $\angle EAF=\angle BAC+\angle EAB$，$\angle EAF=\angle BCA+\angle FEC$，'
      - '$\therefore \angle EAB=\angle FEC$，'
      - '$\because EF\perp AD$，$\angle AHE=\angle DHE=90^{\circ}$，'
      - '$\therefore \angle DHE=\angle FEC+\angle HDE=90^{\circ}$，'
      - '又 $\angle EAB+\angle AEB=\angle ABE=90^{\circ}$，'
      - '$\therefore \angle AEB=\angle HDE$，$\therefore AE=AD$，$\triangle AED$ 是等腰三角形，'
      - '$\because \angle ABE=\angle ABC=90^{\circ}$，$\therefore BD=BE$；'
      - '（2）证明：由（1）知 $\angle EAB=\angle FEC$，$BD=BE$，$\triangle AED$ 是等腰三角形，'
      - '$\therefore \angle EAB=\angle DAB=\angle FEC$，'
      - '又 $\angle AHE=\angle ABE=90^{\circ}$，$\angle ABE=\angle EBM=90^{\circ}$，$\angle EMB=\angle AMH$，'
      - '$\therefore \triangle AEB\sim\triangle EMB$，$\triangle AMH\sim\triangle EMB$，'
      - '$\therefore \dfrac{AE}{BE}=\dfrac{EM}{BM}$，$\dfrac{EM}{BM}=\dfrac{AM}{MH}$，'
      - '$\therefore \dfrac{AE}{BE}=\dfrac{AM}{MH}$，即 $\dfrac{AM}{AE}=\dfrac{MH}{BE}$，'
