    stem_latex: 如图，平行四边形 $ABCD$ 中，$AB=6$，$BC=5$。过点 $D$ 作 $DE\perp AB$，垂足为点 $E$；将 $\triangle ADE$ 绕点 $E$ 旋转得 $\triangle FGE$，点 $A$ 的对应点 $F$ 落在边 $AD$ 上，点 $D$ 的对应点 $G$ 落在边 $BC$ 上，连接 $FG$ 与 $DE$ 交于点 $H$，那么 $\dfrac{FH}{GH}=\fillin$。
    answer: $\dfrac7{32}$
    explanation: 官方参考答案：$\dfrac7{32}$。
