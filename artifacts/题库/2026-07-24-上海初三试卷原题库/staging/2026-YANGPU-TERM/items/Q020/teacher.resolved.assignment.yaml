  - type: problem
    id: Q020
    points: 10
    stem_latex: 二次函数 $y=ax^2+bx+c(a\ne0)$ 中，函数值 $y$ 与自变量 $x$ 之间的部分对应关系如表所示。（1）求该二次函数的解析式及其图像的对称轴；（2）设图像与 $x$ 轴相交于点 $A$（点 $A$
      在对称轴右侧），与 $y$ 轴相交于点 $B$，顶点为 $C$，求 $\triangle ABC$ 的面积。
    answer: （1）$y=-x^2+4x-3$，对称轴 $x=2$；（2）$3$。
    solution_steps:
    - title: 第（1）问
      content: 由表中三组数据建立方程，解得 $a=-1,b=4,c=-3$，所以 $y=-x^2+4x-3$，对称轴为直线 $x=2$。
    - title: 第（2）问
      content: 由解析式得 $A(3,0),B(0,-3),C(2,1)$。过 $C$ 作 $CH\perp y$ 轴，计算分割面积得 $S_{\triangle ABC}=3$。
