    stem_latex: 新定义：由边长为 $1$ 的小正方形构成的网格图形中，每个小正方形的顶点称为格点。如图，在 $8\times8$ 的网格中，$\triangle ABC$ 的顶点均在格点上。（1）$\sin\angle BAC=\fillin$；（2）仅用无刻度直尺作图并保留痕迹：①图1，在边
      $AB$ 上求作一点 $P$，使 $\angle ACP=45^\circ$；②图2，在边 $AC$ 上求作一点 $Q$，使 $BQ\perp AC$。
    answer: （1）$\dfrac{3\sqrt{10}}{10}$；（2）见作图。
