  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，在 $\triangle ABC$ 中，点 $D、E$ 分别在边 $BC、AC$ 上，$AB=AD$，$AD$ 与 $BE$ 交于点 $F$，且 $BC^2=AC\cdot EC$。（1）求证：$\angle
      ADB=\angle BEC$；（2）如果 $AB=BC$，求证：$AE\cdot AD=AF\cdot BE$。
    answer: 见证明。
    solution_steps:
    - title: 解答
      content: $\because BC^2=AC\cdot EC$，$\therefore \frac{BC}{AC}=\frac{EC}{BC}$。又 $\angle C=\angle C$，故 $\triangle BEC\sim\triangle
        ABC$，$\angle BEC=\angle ABC$。又 $AB=AD$，故 $\angle ADB=\angle ABC$，从而（1）成立。（2）由 $AB=BC$ 得 $\angle BAC=\angle C$；结合（1）可得
        $\angle ABE=\angle CAD$，再由 $\angle AEF=\angle AEF$ 得 $\triangle BEA\sim\triangle AEF$，故 $\frac{AE}{BE}=\frac{AF}{AB}$。又
        $AB=AD$，即 $AE\cdot AD=AF\cdot BE$。
