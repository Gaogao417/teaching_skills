    stem_latex: 下列命题正确的是
    choices:
    - 如果 $|\vec a|=|\vec b|$，那么 $\vec a=\vec b$
    - 如果 $\vec a、\vec b$ 都是单位向量，那么 $\vec a=\vec b$
    - 如果 $\vec a=-\vec b$，那么 $\vec a\parallel\vec b$
    - 如果 $m=0$ 或 $\vec a=\vec 0$，那么 $m\vec a=\vec 0$
