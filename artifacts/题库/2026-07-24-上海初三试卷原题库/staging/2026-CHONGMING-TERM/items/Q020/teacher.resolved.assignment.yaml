  - type: problem
    id: Q020
    points: 10
    stem_latex: 在平面直角坐标系 $xOy$ 中，已知抛物线 $y=x^2+bx+c$ 经过点 $A(3,-1)、B(0,-4)$。（1）求抛物线的表达式；（2）若将该抛线向上平移 $m(m>0)$ 个单位长度，使平移后的抛物线与
      $x$ 轴只有一个公共点，求 $m$ 的值。
    answer: （1）$y=x^2-2x-4$；（2）$m=5$。
    solution_steps:
    - title: 解答
      content: $\because$ 点 $A、B$ 在抛物线上，代入得 $b=-2,c=-4$，$\therefore y=x^2-2x-4=(x-1)^2-5$。向上平移后为 $y=(x-1)^2-5+m$；与 $x$ 轴只有一个公共点时
        $-5+m=0$，故 $m=5$。
