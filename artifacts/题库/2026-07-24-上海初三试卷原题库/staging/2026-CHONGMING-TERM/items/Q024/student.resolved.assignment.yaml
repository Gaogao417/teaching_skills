    stem_latex: 如图，在平面直角坐标系 $xOy$ 中，已知抛物线 $y=ax^2+2ax-3a(a<0)$ 与 $x$ 轴交于 $A、B$ 两点（点 $A$ 在点 $B$ 的左侧），与 $y$ 轴交于点 $C$，顶点为 $D$。（1）求点 $A、B$ 的坐标；（2）若点 $E$ 与点 $C$ 关于抛物线的对称轴对称，联结 $AE、AC$，若 $AC$ 平分 $\angle EAO$，求抛物线的表达式；（3）若点 $P$ 是抛物线第四象限上一动点，联结 $AD、AC、DP、CP$，线段 $DP$ 与 $AC$ 交于 $F$，与 $x$ 轴交于 $G$，当 $S_{\triangle ADF}=S_{\triangle CFP}$ 时，求 $\frac{DG}{GP}$ 的值。
