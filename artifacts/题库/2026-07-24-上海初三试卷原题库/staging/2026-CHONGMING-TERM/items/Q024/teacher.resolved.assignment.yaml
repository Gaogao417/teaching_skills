  - type: problem
    id: Q024
    points: 12
    stem_latex: 如图，在平面直角坐标系 $xOy$ 中，已知抛物线 $y=ax^2+2ax-3a(a<0)$ 与 $x$ 轴交于 $A、B$ 两点（点 $A$ 在点 $B$ 的左侧），与 $y$ 轴交于点 $C$，顶点为 $D$。（1）求点
      $A、B$ 的坐标；（2）若点 $E$ 与点 $C$ 关于抛物线的对称轴对称，联结 $AE、AC$，若 $AC$ 平分 $\angle EAO$，求抛物线的表达式；（3）若点 $P$ 是抛物线第四象限上一动点，联结 $AD、AC、DP、CP$，线段
      $DP$ 与 $AC$ 交于 $F$，与 $x$ 轴交于 $G$，当 $S_{\triangle ADF}=S_{\triangle CFP}$ 时，求 $\frac{DG}{GP}$ 的值。
    answer: （1）$A(-3,0),B(1,0)$；（2）$y=-\frac{\sqrt3}{3}x^2-\frac{2\sqrt3}{3}x+\sqrt3$；（3）$\frac45$。
    solution_steps:
    - title: 解答
      content: （1）令 $y=0$，得 $a(x+3)(x-1)=0$，故 $A(-3,0),B(1,0)$。（2）对称轴为 $x=-1$，$C(0,-3a)$，$E(-2,-3a)$。由角平分条件得 $EC=EA$，即 $2=\sqrt{1+9a^2}$，结合
        $a<0$ 得 $a=-\frac{\sqrt3}{3}$。（3）由面积条件推出 $CD\parallel AP$。设 $P(m,am^2+2am-3a)$，利用斜率关系得 $m=2$，故 $P(2,5a)$；再由平行线分线段成比例，$\frac{DG}{GP}=\frac{DN}{PQ}=\frac{-4a}{-5a}=\frac45$。
    - title: 续解1
      content: 见官方解答。
    - title: 续解2
      content: 见官方解答。
