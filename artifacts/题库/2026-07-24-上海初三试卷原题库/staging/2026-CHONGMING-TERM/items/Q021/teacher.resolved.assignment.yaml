  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在梯形 $ABCD$ 中，$AD\parallel BC$，且 $\frac{AD}{BC}=\frac23$，点 $E$ 是边 $AD$ 的中点，联结 $CE$ 交对角线 $BD$ 于点 $F$。（1）当
      $BD=6$ 时，求 $DF$ 的长；（2）设 $\overrightarrow{BA}=\vec a$，$\overrightarrow{BC}=\vec b$，请用 $\vec a、\vec b$ 表示 $\overrightarrow{BF}$。
    answer: （1）$DF=\frac32$；（2）$\overrightarrow{BF}=\frac34\vec a+\frac12\vec b$。
    solution_steps:
    - title: 解答
      content: $\because AD=2DE$ 且 $AD\parallel BC$，$\therefore \frac{DE}{BC}=\frac13=\frac{DF}{BF}$，从而 $\frac{DF}{BD}=\frac14$。（1）$DF=\frac14\times6=\frac32$。（2）$\overrightarrow{BD}=\vec
        a+\frac23\vec b$，故 $\overrightarrow{BF}=\frac34\overrightarrow{BD}=\frac34\vec a+\frac12\vec b$。
