    block:
      stem_latex: 已知：如图，在 $\triangle ABC$ 中，$AB=AC$，$D$ 是 $BC$ 中点，点 $E$ 在 $BA$ 延长线上，点 $F$ 在 $AC$ 边上，$\angle EDF=\angle B$。求证：（1）$\triangle BDE\sim\triangle CFD$；（2）$DF^2=EF\cdot CF$。
      answer: 两问结论均成立
      solution_steps:
      - title: 官方解答
        content: （1）$\because AB=AC$，$\therefore\angle B=\angle C$。又 $\angle EDC=\angle B+\angle BED=\angle EDF+\angle FDC$，且 $\angle EDF=\angle B$，所以 $\angle BED=\angle FDC$，故 $\triangle BDE\sim\triangle CFD$。（2）由相似得 $\frac{DE}{DF}=\frac{BE}{DC}$。又 $BD=DC$，所以 $\frac{DE}{DF}=\frac{BE}{BD}$，即 $\frac{DE}{BE}=\frac{DF}{BD}$。又 $\angle EDF=\angle B$，所以 $\triangle DFE\sim\triangle BDE$；进而 $\triangle DFE\sim\triangle CFD$，故 $\frac{EF}{DF}=\frac{DF}{CF}$，即 $DF^2=EF\cdot CF$。
