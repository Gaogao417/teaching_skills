      stem_latex: 在平面直角坐标系 $xOy$ 中（如图），已知点 $A(-2,0)$、$B(6,0)$、$C(0,8)$、$D(2,\frac{32}{3})$ 在同一个二次函数的图像上。（1）请从中选择适当的点坐标，求二次函数解析式；（2）如果射线 $BE$ 平分 $\angle ABC$，交 $y$ 轴于点 $E$，①现将抛物线沿对称轴向下平移，顶点落在线段 $BE$ 的点 $F$ 处，求此时抛物线顶点 $F$ 的坐标；②如果点 $P$ 在射线 $BE$ 上，当 $\triangle PBC$ 与 $\triangle BOE$ 相似时，请求点 $P$ 的坐标。
      answer: （1）$y=-\frac23(x-2)^2+\frac{32}{3}$；（2）①$F(2,2)$；②$P(-2,4)$或$(-4,5)$
      solution_steps:
      - title: 官方解答
        content: （1）由 $A(-2,0)、B(6,0)$ 可知对称轴为 $x=2$，且 $D(2,\frac{32}{3})$ 为顶点。设 $y=a(x-2)^2+\frac{32}{3}$，代入 $C(0,8)$ 得 $a=-\frac23$，故 $y=-\frac23(x-2)^2+\frac{32}{3}$。（2）在 $\mathrm{Rt}\triangle BOC$ 中，$OB=6,OC=8,CB=10$。①作 $EH\perp BC$ 于 $H$，由角平分线性质得 $OE=EH$。设 $OE=m$，由面积关系 $(8-m)\times6=10m$，得 $m=3$，故 $E(0,3)$。设对称轴交 $x$ 轴于 $M$，由 $\frac{FM}{MB}=\frac{OE}{OB}=\frac12$ 得 $F(2,2)$。②由相似关系分两种情形计算，得 $P_1(-2,4)$ 或 $P_2(-4,5)$。
