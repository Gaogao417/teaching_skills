    official_solution:
      start_anchor: '20.（1）'
      end_anchor: '21. 证明：'
      crops: [{source: documents/初三/2024届-上海市静安区-初三一模数学-试卷及参考答案/006.png, box_px: [110, 675, 970, 1170]}]
    block:
      stem_latex: 如图，在平面直角坐标系 $xOy$ 中，已知直线 $l$ 经过点 $A(1,0)$，与双曲线 $y=\frac mx\ (x>0)$ 交于点 $B(2,1)$。点 $P(a,2)$ 在直线 $AB$ 上，过点 $P$ 作 $x$ 轴的平行线分别交双曲线 $y=\frac mx\ (x>0)$ 和 $y=-\frac mx\ (x<0)$ 于点 $E、F$。（1）求 $m$ 的值和直线 $l$ 的表达式；（2）联结 $EB、FA$，求证：$EB\parallel FA$。
      answer: （1）$m=2$，$y=x-1$；（2）$EB\parallel FA$
      solution_steps:
      - title: 官方解答
        content: （1）点 $B(2,1)$ 在双曲线上，代入得 $m=2$。设直线 $l:y=kx+b$，由 $A、B$ 两点解得 $k=1,b=-1$，故 $y=x-1$。（2）点 $P(a,2)$ 在直线 $AB$ 上，得 $a=3$，即 $P(3,2)$。过点 $P$ 作 $x$ 轴平行线，得 $F(-1,2),E(1,2)$。于是 $EP=2,EF=2$，$BP=\sqrt2,BA=\sqrt2$，所以 $\frac{PE}{EF}=\frac{PB}{BA}$，故 $EB\parallel FA$。
