      stem_latex: 如图，已知 $AC$ 是矩形 $ABCD$ 的对角线，$DE\parallel AC$，$DE$ 交 $BC$ 延长线于 $E$，$AE$ 交 $DC$ 于 $F$，$BF$ 交 $AC$ 于 $G$。（1）求证：点 $G$ 是 $\triangle ABE$ 的重心；（2）如果 $BG=BC=2$，求 $\angle AEB$ 的正弦值。
      answer: （1）点 $G$ 是 $\triangle ABE$ 的重心；（2）$\sin\angle AEB=\frac{\sqrt5}{3}$
      solution_steps:
      - title: 官方解答
        content: （1）$\because$ 矩形 $ABCD$，$\therefore AD\parallel BE,AD=BC$。又 $DE\parallel AC$，所以四边形 $ADEC$ 是平行四边形，$AD=CE$，故 $BC=CE$；且 $AF=FE$。因此 $AC、BF$ 是 $\triangle ABE$ 的中线，点 $G$ 是重心。（2）由重心性质及 $BG=BC=2$，得 $GF=1,BF=3$。矩形 $ABCD$ 中 $\angle ABC=\angle FCB=90^\circ$，且 $EF=BF=3$。在 $\mathrm{Rt}\triangle ECF$ 中，$CE=2$，$CF=\sqrt5$，故 $\sin\angle AEB=\sin\angle FEC=\frac{\sqrt5}{3}$。
