    stem_latex: 计算：$\sqrt{(\sin45^\circ-1)^2}+\cos45^\circ+\cot30^\circ\cdot\sin60^\circ$。
    answer: $\frac52$
    solution_steps:
    - title: 解
      content: 原式$=\left|\frac{\sqrt2}{2}-1\right|+\frac{\sqrt2}{2}+\sqrt3\times\frac{\sqrt3}{2}=1-\frac{\sqrt2}{2}+\frac{\sqrt2}{2}+\frac32=\frac52$。
