      - 当 $\dfrac{OE}{OB_{1}}=\dfrac{A_{1}D}{C_{1}D}=\dfrac{1}{2}$ 时，$\dfrac{-y}{m-2}=\dfrac{1}{2}$，$E\left(0,1-\dfrac{m}{2}\right)$。
      - 当 $\dfrac{OE}{OB_{1}}=\dfrac{C_{1}D}{A_{1}D}=2$ 时，$\dfrac{-y}{m-2}=2$，$E(0,4-2m)$。
