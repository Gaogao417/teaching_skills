      - (2)① 平移后 $A_{1}(1-m,0)$、$B_{1}(2-m,0)$、$C_{1}(-m,-2)$，$D(-m,0)$，$\therefore
        OB_{1}=m-2$，$C_{1}D=2$，$A_{1}D=1$。
