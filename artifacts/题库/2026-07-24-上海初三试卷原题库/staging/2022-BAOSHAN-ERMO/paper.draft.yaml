      answer: (1) $y=-x^{2}+3x-2$；(2)① $E\left(0,1-\dfrac{m}{2}\right)$ 或 $E(0,4-2m)$；②
        $m=\dfrac{7}{2}$ 或 $m=5$
      clue: 待定系数求解析式；按对应边成比例两种情形求 $E$；由平行四边形对角线中点相同求 $F$ 再代入。
      solution_steps:
      - (1) 代入 $A(1,0)$、$B(2,0)$ 得 $\begin{cases}a+b-2=0\\4a+2b-2=0\end{cases}$，解得
