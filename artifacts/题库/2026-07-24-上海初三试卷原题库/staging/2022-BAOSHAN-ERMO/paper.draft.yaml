        (1) 求抛物线的表达式；

        (2) 将抛物线向左平移 $m$ 个单位（$m>2$），平移后点 $A$、$B$、$C$ 的对应点分别记作 $A_{1}$、$B_{1}$、$C_{1}$，过点
        $C_{1}$ 作 $C_{1}D\perp x$ 轴，垂足为点 $D$，点 $E$ 在 $y$ 轴负半轴上，使得以 $O$、$E$、$B_{1}$
        为顶点的三角形与 $\triangle A_{1}C_{1}D$ 相似，① 求点 $E$ 的坐标（用含 $m$ 的代数式表示）；② 如果平移后的抛物线上存在点
