  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 已知正比例函数 $y=kx$（$k$ 是常数，$k\neq0$）的图象经过第二、四象限，那么 $y$ 的值随着 $x$ 的值增大而______．（填\u201c增大\u201d或\u201c减小\u201d）
    answer: 减小
    clue: $k<0$ 时 $y$ 随 $x$ 增大而减小。
    solution_steps:
    - 图象过第二、四象限，则 $k<0$，$y$ 随 $x$ 增大而减小。
