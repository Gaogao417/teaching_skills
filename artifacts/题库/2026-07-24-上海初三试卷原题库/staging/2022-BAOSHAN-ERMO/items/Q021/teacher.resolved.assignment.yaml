  - type: problem
    id: Q021
    points: 10
    stem_latex: '在平面直角坐标系 $xOy$ 中，已知某个一次函数的图象平行于直线 $y=\dfrac{1}{2}x$，经过点 $A(-2,1)$，且与 $x$ 轴交于点 $B$。

      (1) 求这个一次函数的解析式；

      (2) 设点 $C$ 在 $y$ 轴上，当 $\triangle ABC$ 的面积等于2时，求点 $C$ 的坐标。'
    answer: (1) $y=\dfrac{1}{2}x+2$；(2) $C(0,0)$ 或 $C(0,4)$
    clue: 平行得 $k$，待定系数求 $b$；用面积差列含绝对值的方程。
    solution_steps:
    - (1) 设 $y=kx+b$，由平行得 $k=\dfrac{1}{2}$；代入 $A(-2,1)$ 得 $-1+b=1$，$b=2$，$\therefore y=\dfrac{1}{2}x+2$。
    - (2) 令 $y=0$ 得 $B(-4,0)$，直线与 $y$ 轴交于 $D(0,2)$。设 $C(0,t)$。
    - 由 $S_{\triangle BCD}-S_{\triangle ACD}=S_{\triangle ABC}=2$，即 $\dfrac{1}{2}|t-2|\cdot4-\dfrac{1}{2}|t-2|\cdot2=2$。
    - 解得 $t=0$ 或 $t=4$，$\therefore C(0,0)$ 或 $C(0,4)$。
