  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 一个封闭平面图形上及其内部任意两点距离的最大值称为该图形的\u201c直径\u201d，封闭图形的周长与直径的比值称为该图形的\u201c周率\u201d。如果正三角形、正方形和圆的周率依次记为 $a$、$b$、$c$，那么将 $a$、$b$、$c$ 从小到大排列为______
    answer: $b<a<c$
    clue: 分别算出正三角形周率3、正方形 $2\sqrt{2}$、圆 $\pi$ 再比较。
    solution_steps:
    - 正三角形周率 $a=\dfrac{3m}{m}=3$。
    - 正方形周率 $b=\dfrac{4x}{\sqrt{2}x}=2\sqrt{2}$。
    - 圆的周率 $c=\dfrac{2\pi r}{2r}=\pi$。
    - $\because 2\sqrt{2}<3<\pi$，$\therefore b<a<c$。
