  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，已知 $AC$、$BD$ 是梯形 $ABCD$ 的对角线，$AD\parallel BC$，$BC=2AD$，如果设 $\overrightarrow{AD}=\vec{a}$，$\overrightarrow{CA}=\vec{b}$，那么向量 $\overrightarrow{BD}$ 用向量 $\vec{a}$、$\vec{b}$ 表示为______
    answer: $3\vec{a}+\vec{b}$
    clue: 用 $\overrightarrow{BD}=\overrightarrow{BA}+\overrightarrow{AD}$ 转化。
    solution_steps:
    - $\overrightarrow{BC}=2\overrightarrow{AD}=2\vec{a}$。
    - $\overrightarrow{BA}=\overrightarrow{BC}+\overrightarrow{CA}=2\vec{a}+\vec{b}$。
    - $\overrightarrow{BD}=\overrightarrow{BA}+\overrightarrow{AD}=2\vec{a}+\vec{b}+\vec{a}=3\vec{a}+\vec{b}$。
