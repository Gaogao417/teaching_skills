  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程：$\dfrac{1}{x+2}+\dfrac{4}{x^{2}-4}=1$
    answer: $x=3$
    clue: 去分母化为整式方程，注意检验增根。
    solution_steps:
    - 去分母（同乘 $(x+2)(x-2)$）得 $x-2+4=x^{2}-4$，即 $x^{2}-x-6=0$。
    - 分解因式 $(x-3)(x+2)=0$，$x=3$ 或 $x=-2$。
    - 检验：$x=-2$ 使分母为0，是增根，舍去。
    - $\therefore$ 原方程的解为 $x=3$。
