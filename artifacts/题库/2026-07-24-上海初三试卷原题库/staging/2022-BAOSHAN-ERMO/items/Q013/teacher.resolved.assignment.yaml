  blocks:
  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 《九章算术》中有这样一个问题：\u201c今有共买物，人出八，盈三；人出七，不足四。\u201d意思是：有一群人共同出资买某物品，每人出8钱，盈余3钱；每人出7钱，不足4钱．那么根据条件，该物品值______钱．
    answer: '53'
    clue: 设人数为 $x$，由物品价值相等列方程。
    solution_steps:
    - 设有 $x$ 人，依题意 $8x-3=7x+4$。
    - 解得 $x=7$，物品值 $7x+4=53$ 钱。
