  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 北京冬奥会金牌榜前十位国家的金牌数依次为 16、12、9、8、8、8、7、7、6、5，那么这些国家获得金牌数的中位数是______枚．
    answer: '8'
    clue: 10个数据的中位数取第5、6个的平均。
    solution_steps:
    - 从小到大排列为 5，6，7，7，8，8，8，9，12，16。
    - 中位数 $=\dfrac{8+8}{2}=8$。
