  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 如图，矩形 $ABCD$ 中，$AB=3$，$BC=5$，$F$ 为边 $CD$ 上一点，沿 $AF$ 折叠，点 $D$ 恰好落在 $BC$ 边上的点 $E$ 处，那么线段 $DF:FC$ 的值为______
    answer: $\dfrac{5}{4}$
    clue: 翻折得 $AE=AD$、$DF=EF$，设 $CF=x$ 列勾股方程。
    solution_steps:
    - $AE=AD=5$，$BE=\sqrt{AE^{2}-AB^{2}}=4$，$EC=1$。
    - 设 $CF=x$，则 $DF=EF=3-x$，$(3-x)^{2}=x^{2}+1$，$x=\dfrac{4}{3}$。
    - $DF=\dfrac{5}{3}$，$\therefore DF:FC=\dfrac{5}{4}$。
