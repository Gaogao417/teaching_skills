  - type: short_answer
    id: Q009
    points: 4
    stem_latex: 不等式组 $\begin{cases} x-2<0 \\ 2x+3>1 \end{cases}$ 的解集是______
    answer: $-1<x<2$
    clue: 分别求每个不等式的解集再取交集。
    solution_steps:
    - 由 $x-2<0$ 得 $x<2$。
    - 由 $2x+3>1$ 得 $x>-1$。
    - $\therefore$ 解集为 $-1<x<2$。
