- id: Q019
  source_key: 2024-JIADING-YIMO-Q19
  question_number: 19
  question_type: problem
  points: 10
  section_title: 三、解答题
  stem_latex: 计算：$4(1-\cos30^\circ)+\frac{2\sin60^\circ}{2\tan45^\circ-3\cot60^\circ}$。
  answer: '7'
  official_solution_latex:
  - title: 计算
    content: 原式 $=4(1-\frac{\sqrt3}{2})+\frac{2\times\frac{\sqrt3}{2}}{2\times1-3\times\frac{\sqrt3}{3}}=4-2\sqrt3+\frac{\sqrt3}{2-\sqrt3}=4-2\sqrt3+\sqrt3(2+\sqrt3)=7$。
  question_crops:
  - source: documents/初三/2024届-上海市嘉定区-初三一模数学-试卷及参考答案/003.png
