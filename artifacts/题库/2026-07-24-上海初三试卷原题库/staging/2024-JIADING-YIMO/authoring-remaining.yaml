- id: Q023
  source_key: 2024-JIADING-YIMO-Q23
  question_number: 23
  question_type: problem
  points: 12
  section_title: 三、解答题
  stem_latex: 如图9，在 $\triangle ABC$ 中，$\angle ACB=90^\circ$，点 $D$ 是 $BC$ 延长线上一点，点 $E$ 是斜边 $AB$ 上一点，且 $BC\cdot BD=BE\cdot BA$。（1）求证：$AB\perp ED$；（2）联结 $AD$，在 $AB$ 上取一点 $F$，使 $AF=AC$，过点 $F$ 作 $FG\parallel BC$ 交 $AD$ 于点 $G$，求证：$FG=DE$。
  answer: 见证明。
  official_solution_latex:
  - title: 第（1）问
    content: $\because BC\cdot BD=BE\cdot BA$，$\therefore\frac{BC}{BE}=\frac{BA}{BD}$。又 $\angle B=\angle B$，所以 $\triangle ABC\sim\triangle DBE$。故 $\angle ACB=\angle DEB$。由 $\angle ACB=90^\circ$，得 $\angle DEB=90^\circ$，所以 $AB\perp ED$。
  - title: 第（2）问
    content: 由（1）得 $\triangle ABC\sim\triangle DBE$，所以 $\frac{AB}{DB}=\frac{AC}{DE}$，即 $\frac{DE}{DB}=\frac{AC}{AB}$。又 $FG\parallel BC$，所以 $\frac{FG}{DB}=\frac{AF}{AB}$。由 $AF=AC$，得 $\frac{DE}{DB}=\frac{FG}{DB}$，故 $FG=DE$。
