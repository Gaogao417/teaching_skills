- id: Q021
  source_key: 2024-JIADING-YIMO-Q21
  question_number: 21
  question_type: problem
  points: 10
  section_title: 三、解答题
  stem_latex: 如图7，在平行四边形 $ABCD$ 中，$H$ 是 $AB$ 上一点，且 $BH=2AH$，直线 $DH$ 与 $AC$ 相交于点 $G$。（1）求 $\frac{AG}{AC}$ 的值；（2）如果 $DH\perp AB$，$\cos\angle BCD=\frac13$，$AD=9$，求四边形 $ABCD$ 的面积。
  answer: （1）$\frac14$；（2）$54\sqrt2$。
  official_solution_latex:
  - title: 第（1）问
    content: $\because$ 四边形 $ABCD$ 是平行四边形，$\therefore AB=CD,\ AB\parallel DC$。于是 $\frac{AH}{CD}=\frac{AG}{GC}$，即 $\frac{AH}{AB}=\frac{AG}{GC}$。由 $BH=2AH$ 得 $AB=3AH$，所以 $\frac{AG}{GC}=\frac13$。又 $AG+GC=AC$，故 $\frac{AG}{AC}=\frac14$。
  - title: 第（2）问
    content: $\because$ 四边形 $ABCD$ 是平行四边形，$\therefore\angle BCD=\angle DAH$。由 $\cos\angle BCD=\frac13$，得 $\cos\angle DAH=\frac13$。又 $DH\perp AB$，在 $Rt\triangle AHD$ 中，$\cos\angle DAH=\frac{AH}{AD}$。由 $AD=9$ 得 $AH=3$，进而 $DH=6\sqrt2$。所以 $S_{ABCD}=DH\cdot AB=DH\cdot3AH=54\sqrt2$。
