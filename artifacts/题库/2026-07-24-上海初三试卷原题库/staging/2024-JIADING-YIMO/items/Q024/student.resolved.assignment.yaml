    stem_latex: 定义：对于抛物线 $y=ax^2+bx+c$（$a,b,c$ 是常数，$a\ne0$），若 $b^2=ac$，则称该抛物线是黄金抛物线。已知平面直角坐标系 $xOy$（图10），抛物线 $y=x^2-2x+k$ 是黄金抛物线，与 $y$ 轴交于点 $A$，顶点为 $D$。（1）求此黄金抛物线的表达式及 $D$ 点坐标；（2）点 $B(2,b)$ 在这个黄金抛物线上，①点 $C(c,-\frac12)$ 在这个黄金抛物线的对称轴上，求 $\angle OBC$ 的正弦值；②在射线 $AB$ 上是否存在点 $P$，使以点 $P,A,D$ 所组成的三角形与 $\triangle AOD$ 相似，且相似比不为1？若存在，求点 $P$ 的坐标；若不存在，说明理由。
