    stem_latex: 如图8，小山的顶部是一块平地，在这块平地上有一座古塔 $CD$。小山斜坡 $AB$ 的坡度为 $i=1:2.4$，坡长 $AB$ 为39米，在小山的坡底 $A$ 处测得该塔的塔顶 $C$ 的仰角为 $45^\circ$，在坡顶 $B$ 处测得该塔的塔顶 $C$ 的仰角为 $74^\circ$。（1）求坡顶 $B$ 到地面 $AH$ 的距离 $BH$ 的长；（2）求古塔 $CD$ 的高度（结果精确到1米）。参考数据：$\sin74^\circ\approx0.96$，$\cos74^\circ\approx0.28$，$\tan74^\circ\approx3.49$，$\cot74^\circ\approx0.29$。
