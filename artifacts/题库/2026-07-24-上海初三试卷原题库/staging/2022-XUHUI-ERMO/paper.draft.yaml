      start_anchor: 原式
      end_anchor: $\sqrt{5}-2$
    block:
      stem_latex: 先化简再求值：$\dfrac{a^{2}-3a+2}{a^{2}-4}\div\left(a+\dfrac{1-4a}{a+2}\right)$，其中
        $a=\sqrt{5}+3$。
      answer: $\dfrac{1}{a-1}$；代入得 $\sqrt{5}-2$
      clue: 分式化简。
      solution_steps:
      - 原式 $=\dfrac{(a-1)(a-2)}{(a+2)(a-2)}\div\dfrac{(a-1)^{2}}{a+2}=\dfrac{1}{a-1}$。
      - $a=\sqrt{5}+3$ 时，原式 $=\dfrac{1}{\sqrt{5}+2}=\sqrt{5}-2$。
  - item_id: Q020
