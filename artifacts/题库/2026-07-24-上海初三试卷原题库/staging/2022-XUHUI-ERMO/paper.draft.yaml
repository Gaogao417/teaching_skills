      end_anchor: $\dfrac{64}{3}$
    block:
      stem_latex: '正比例函数 $y=2x$ 与反比例函数 $y=\dfrac{m}{x}$（$x>0$）交于 $A(a,4)$，$B$ 在直线
        $y=2x$ 上且 $AB=2OA$。

        (1) 求反比例函数解析式；

        (2) 过 $B$ 作 $BC\perp x$ 轴交反比例函数图象于 $C$，求 $\triangle ABC$ 面积。'
      answer: (1) $y=\dfrac{8}{x}$；(2) $S_{\triangle ABC}=\dfrac{64}{3}$
      clue: (1) 由 $A$ 求 $m$；(2) 相似求 $C$。
      solution_steps:
      - (1) $A(2,4)$，$m=8$，$y=\dfrac{8}{x}$。
      - (2) $AB=2OA$，$\dfrac{OE}{OD}=\dfrac{1}{3}$，$OD=12$，$C\left(\dfrac{2}{3},12\right)$，$S_{\triangle
        ABC}=\dfrac{1}{2}\left(12-\dfrac{2}{3}\right)\times8=\dfrac{64}{3}$。
