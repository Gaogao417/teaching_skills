  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 抛物线与 $y=(x-1)^{2}+1$ 的\u201c和谐值\u201d（竖直方向最短距离）为2，写出一个符合条件的解析式______（答案不唯一）
    answer: $y=(x-1)^{2}+3$
    clue: 顶点纵坐标相差2。
    solution_steps:
    - 取 $y=(x-1)^{2}+3$，顶点 $(1,3)$ 与 $(1,1)$ 竖直距离为2。
