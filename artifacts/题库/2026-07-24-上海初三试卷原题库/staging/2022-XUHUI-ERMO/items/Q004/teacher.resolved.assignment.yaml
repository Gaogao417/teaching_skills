  - type: choice
    id: Q004
    points: 4
    stem_latex: 关于非零向量 $\vec{a}$、$\vec{b}$、$\vec{c}$，下列错误的是（\quad）
    choices:
    - 若 $\vec{a}=\vec{b}$，则 $|\vec{a}|=|\vec{b}|$
    - 若 $\vec{a}$、$\vec{b}$ 都是单位向量，则 $|\vec{a}|=|\vec{b}|$
    - 若 $\vec{a}=2\vec{b}$，则 $\vec{a}\parallel\vec{b}$
    - 若 $\vec{c}=\vec{a}+\vec{b}$，则 $|\vec{c}|=|\vec{a}|+|\vec{b}|$
    answer: D
    clue: 向量和的模不大于模的和。
