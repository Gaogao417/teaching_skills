    stem_latex: 20个粽子（10鲜肉、6红枣、其余赤豆），随意吃一个吃到赤豆粽的概率是______
    answer: $\dfrac{1}{5}$
    clue: 赤豆粽4个。
    solution_steps:
    - 赤豆粽 $20-10-6=4$ 个，$P=\dfrac{4}{20}=\dfrac{1}{5}$。
