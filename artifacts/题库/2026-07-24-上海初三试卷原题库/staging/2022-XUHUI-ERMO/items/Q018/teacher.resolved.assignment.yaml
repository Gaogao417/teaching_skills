  blocks:
  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 如图，$\mathrm{Rt}\triangle ABC$（$\angle C=90^{\circ}$，$BC=8$，$AC=6$），$D$ 为 $BC$ 中点，$E$ 在 $AB$ 上，沿 $DE$ 翻折 $\triangle BDE$ 到 $\triangle B^{\prime}DE$，$B^{\prime}D$ 交 $AB$ 于 $F$，若 $\triangle AB^{\prime}F$ 为直角三角形，则 $BE=$______
    answer: $2$ 或 $\dfrac{40}{17}$
    clue: 分直角顶点讨论。
    solution_steps:
    - 分 $\angle AB^{\prime}F=90^{\circ}$ 与 $\angle B^{\prime}AF=90^{\circ}$ 两种情况，由翻折与相似求得 $BE=2$ 或 $\dfrac{40}{17}$。
