    stem_latex: '如图，$AB$ 为半圆 $O$ 直径，$C$ 在 $AB$ 延长线上，$BC=OB$，$D$ 在半圆上（不与 $A$、$B$ 重合），$CE\perp CD$ 且 $CE=CD$，联结 $DE$。

      (1) 线段 $CD$ 交半圆于 $F$，若 $DF=BF$，求证：$\dfrac{BF}{CF}=\dfrac{1}{2}$；

      (2) 线段 $CD$ 交半圆于 $F$，若 $D$ 平分 $\overset{\frown}{AF}$，求 $\tan\angle DFA$；

      (3) 联结 $OE$ 交 $CD$ 于 $G$，当 $\triangle DOG\sim\triangle EGC$ 时，求 $\angle AOD$。'
