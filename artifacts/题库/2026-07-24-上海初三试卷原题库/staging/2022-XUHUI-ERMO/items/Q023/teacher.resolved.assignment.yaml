  - type: problem
    id: Q023
    points: 12
    stem_latex: '矩形 $ABCD$，$E$ 在 $CD$ 上（不与 $C$、$D$ 重合），过 $A$ 作 $AF\perp AE$ 交 $CB$ 延长线于 $F$，联结 $EF$ 交 $AB$ 于 $G$。

      (1) 求证：$\triangle AEF\sim\triangle DAC$；

      (2) 若 $FE$ 平分 $\angle AFB$，联结 $CG$，求证：四边形 $AGCE$ 为菱形。'
    answer: 见证明
    clue: (1) 相似；(2) 全等+菱形判定。
    solution_steps:
    - (1) $\angle FAB=\angle EAD$，$\triangle ABF\sim\triangle ADE$，$\dfrac{AD}{AE}=\dfrac{CD}{AF}$，$\angle D=\angle FAE=90^{\circ}$，$\triangle AEF\sim\triangle DAC$。
    - (2) $FE$ 平分 $\angle AFB$，$\triangle AFE\cong\triangle CFE$，$AE=EC$；$AB\parallel CD$ 得 $\angle AEF=\angle AGE$，$AE=AG$，$AG\parallel EC$ 且 $AG=EC$，四边形 $AGCE$ 为菱形。
