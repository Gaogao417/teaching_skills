    stem_latex: '直线 $y=kx+3$ 交 $x$、$y$ 轴于 $A$、$B$，抛物线 $y=-x^{2}+bx+c$ 过 $A$、$B$ 且与 $x$ 轴正半轴交于 $C(1,0)$，$P$ 在 $AB$ 上（横坐标 $m$），过 $P$ 作 $y$ 轴平行线交抛物线于 $M$。

      (1) 求抛物线与直线 $AB$ 解析式；

      (2) 当 $\triangle PBM$ 是以 $MP$ 为腰的等腰三角形时求 $P$；

      (3) 若顶点 $D$ 在以 $PM$、$PB$ 为邻边的平行四边形形内（不含边界），求 $m$ 范围。'
