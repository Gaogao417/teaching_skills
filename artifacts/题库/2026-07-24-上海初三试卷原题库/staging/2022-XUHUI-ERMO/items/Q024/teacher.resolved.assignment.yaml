  - type: problem
    id: Q024
    points: 12
    stem_latex: '直线 $y=kx+3$ 交 $x$、$y$ 轴于 $A$、$B$，抛物线 $y=-x^{2}+bx+c$ 过 $A$、$B$ 且与 $x$ 轴正半轴交于 $C(1,0)$，$P$ 在 $AB$ 上（横坐标 $m$），过 $P$ 作 $y$ 轴平行线交抛物线于 $M$。

      (1) 求抛物线与直线 $AB$ 解析式；

      (2) 当 $\triangle PBM$ 是以 $MP$ 为腰的等腰三角形时求 $P$；

      (3) 若顶点 $D$ 在以 $PM$、$PB$ 为邻边的平行四边形形内（不含边界），求 $m$ 范围。'
    answer: (1) $y=-x^{2}-2x+3$，$y=x+3$；(2) $P(-2,1)$ 或 $(\sqrt{2}-3,\sqrt{2})$；(3) $-2<m<-1$
    clue: (1) 待定系数；(2) 分类；(3) 数形结合。
    solution_steps:
    - (1) $B(0,3)$，$C(1,0)$ 代入得 $y=-x^{2}-2x+3$，$A(-3,0)$，直线 $y=x+3$。
    - (2) ① $MB=MP$：$P(-2,1)$；② $PM=BP$：$m=\sqrt{2}-3$，$P(\sqrt{2}-3,\sqrt{2})$。
    - (3) 顶点 $D(-1,4)$，过 $D$ 与 $AB$ 平行的直线 $y=x+5$ 与抛物线交于 $x=-2,-1$，$\therefore -2<m<-1$。
