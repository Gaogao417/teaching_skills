  - type: problem
    id: Q022
    points: 10
    stem_latex: 高桩舞狮表演中，三根高桩 $AB、CD、EF$ 都垂直于地面，点 $B、D、F$ 在同一直线上。舞狮者在点 $C$ 处测得点 $A、E$ 的仰角分别为 $35^\circ、47^\circ$，高桩 $AB$ 与 $EF$ 的高度相差1米，$BF=2$ 米。（1）求 $\angle ACE$；（2）求 $BD$ 的长（结果精确到0.01米）。
    answer: （1）$98^\circ$；（2）约$0.65$米
    solution_steps:
    - title: 官方解答
      content: （1）$\angle ACE=180^\circ-35^\circ-47^\circ=98^\circ$。（2）作 $CN\perp BF$，分别交 $AB、EF$ 于 $M、N$。设 $BD=x$ 米，则 $CN=2-x$，$AM=x\tan35^\circ$，$EN=(2-x)\tan47^\circ$。由 $EF-AB=EN-AM=1$，得 $x=\frac{2\tan47^\circ-1}{\tan47^\circ+\tan35^\circ}\approx0.65$。
