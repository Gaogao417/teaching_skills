  - type: problem
    id: Q021
    points: 10
    stem_latex: 已知：如图，在 $\mathrm{Rt}\triangle ABC$ 和 $\mathrm{Rt}\triangle DEF$ 中，$\angle C=\angle F=90^\circ$，且 $\frac{DE}{AB}=\frac{DF}{AC}$。求证：$\triangle DEF\sim\triangle ABC$。小明按题图框内①—④完成证明。（1）小明的证明从第几部分开始出现错误？说明理由；（2）请利用平行线作为辅助线，完成正确证明。
    answer: （1）从第③部分开始错误，理由是错误使用了平行线分线段成比例定理的逆定理；（2）见证明
    solution_steps:
    - title: 官方解答
      content: （1）从第③部分开始错误；由 $\frac{GH}{AB}=\frac{CG}{AC}$ 不能直接判定 $GH\parallel AB$，这是错误使用平行线分线段成比例定理的逆定理。（2）在 $AC$ 上截取 $CG=FD$，过点 $G$ 作 $GH\parallel AB$，交 $BC$ 于 $H$。由平行线得 $\frac{GH}{AB}=\frac{CG}{AC}$。结合 $\frac{DE}{AB}=\frac{DF}{AC}$ 与 $CG=DF$，得 $GH=DE$。在直角三角形 $GHC$ 与 $DEF$ 中，$CG=DF$、$GH=DE$，故两三角形全等；又 $\triangle GHC\sim\triangle ABC$，所以 $\triangle DEF\sim\triangle ABC$。
