  - type: problem
    id: Q023
    points: 12
    stem_latex: 已知：如图，在梯形 $ABCD$ 中，$AB\parallel CD$，连接 $AC、BD$，$\triangle ABC$ 是等边三角形，$DE\parallel BC$，$DE$ 与 $AC$ 交于点 $E$，且 $\angle ADB=2\angle DBC$。（1）求证：$\triangle ADE\sim\triangle DBC$；（2）求证：点 $E$ 是线段 $AC$ 的黄金分割点。
    answer: （1）见证明；（2）见证明
    solution_steps:
    - title: 官方解答
      content: （1）由 $AB\parallel CD$、$DE\parallel BC$ 及等边三角形的角关系可得 $\angle AED=\angle DCB$，再结合 $\angle ADB=2\angle DBC$ 作角的转化，得 $\triangle ADE\sim\triangle DBC$。（2）进一步得 $\angle EDC=60^\circ$，所以 $\triangle CDE$ 为等边三角形，$CE=DE=CD$；又 $AC=BC$。由相似关系得 $\frac{AE}{CD}=\frac{DE}{BC}$，故 $\frac{AE}{EC}=\frac{EC}{AC}$，所以点 $E$ 是线段 $AC$ 的黄金分割点。
