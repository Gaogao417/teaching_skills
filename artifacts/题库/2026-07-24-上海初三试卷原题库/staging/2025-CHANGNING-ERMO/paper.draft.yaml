    block:
      stem_latex: |-
        在 $\triangle ABC$ 中，$\angle ABC = 90^{\circ}$，$BD$ 是边 $AC$ 上的中线。以点 $B$ 为圆心，$BD$ 为半径的圆交线段 $CD$ 于点 $E$。
        (1) 如果 $\odot B$ 与边 $BC$ 交于点 $F$，$\overset{\frown}{FE} = \overset{\frown}{DE}$，求 $\angle DBE$ 的度数；
        (2) 当 $AE = 5EC$ 时，求 $\angle C$ 的正切值；
        (3) 以点 $E$ 为圆心，$BC$ 为半径的 $\odot E$ 与 $\odot B$ 相交，交点 $P$ 在边 $AB$ 上。如果 $BD = 1$，求 $AE$ 的长。
      solution_steps:
      - (1) $\overset{\frown}{FE}=\overset{\frown}{DE}$，$\therefore \angle 1=\angle 2=\alpha$。
      - 直角三角形斜边中线：$DB=DC=DA$，$\therefore \angle C=\angle DBC=2\alpha$。
      - $\angle 3=\angle C+\angle 1=3\alpha$，$BD=BE$，$\therefore \angle 3=\angle 4=3\alpha$。
      - $\triangle BDE$ 内角和：$7\alpha=180^{\circ}$，$\angle DBE=\dfrac{180^{\circ}}{7}$。
      - (2) 过 $B$ 作 $BK\perp AC$ 于 $K$，$DK=EK$。
      - 设 $EC=m$，$AE=5m$，$AC=6m$，$DB=DC=DA=3m$，$DE=2m$，$DK=EK=m$。
      - $BK=\sqrt{BD^2-DK^2}=\sqrt{9m^2-m^2}=2\sqrt{2}\,m$。
      - $\tan C=\dfrac{BK}{CK}=\dfrac{2\sqrt{2}\,m}{2m}=\sqrt{2}$。
      - (3) 连接 $PE$，$BE=BD=BP=CD=AD=1$，$BC=EP$。
      - $\triangle DBC\cong\triangle DPE$（SSS），$\therefore \angle DEB=\angle BEA$。
      - $\triangle DEB\sim\triangle BEA$，$\dfrac{BE}{AE}=\dfrac{ED}{BE}$。
      - 设 $AE=x$，$ED=x-1$，$\dfrac{1}{x}=x-1$，$x^2-x-1=0$。
      - $x=\dfrac{1+\sqrt{5}}{2}$（负值舍）。
      clue: 圆心角与弧、垂径定理、全等与相似三角形、黄金比方程。
      answer: (1) $\angle DBE=\dfrac{180^{\circ}}{7}$；(2) $\tan C=\sqrt{2}$；(3) $AE=\dfrac{1+\sqrt{5}}{2}$
