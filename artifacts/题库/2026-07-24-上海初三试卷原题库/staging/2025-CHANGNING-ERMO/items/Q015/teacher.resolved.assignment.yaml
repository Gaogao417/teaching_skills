  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 在菱形 $ABCD$ 中，$\angle ABC = 60^{\circ}$，$AB = 1$，那么 $|\overrightarrow{BA} + \overrightarrow{BC}| = $______
    answer: $\sqrt{3}$
    clue: 菱形对角线 $BD=2BO$，$BO=\sqrt{1-\frac{1}{4}}=\frac{\sqrt{3}}{2}$，$BD=\sqrt{3}$。
    solution_steps:
    - $\angle ABO=30^{\circ}$，$AO=\dfrac{1}{2}$，$BO=\dfrac{\sqrt{3}}{2}$，$BD=\sqrt{3}$。
    - $|\overrightarrow{BA}+\overrightarrow{BC}|=|\overrightarrow{BD}|=\sqrt{3}$。
    source_solution_images: []
