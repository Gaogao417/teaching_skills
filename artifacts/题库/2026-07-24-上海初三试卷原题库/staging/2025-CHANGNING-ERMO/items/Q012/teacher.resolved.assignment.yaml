  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 布袋里有2个红球、3个黄球、4个白球，它们除颜色外其他都相同。从布袋里摸出一个球恰好为红球的概率是______
    answer: $\dfrac{2}{9}$
    clue: 红球数除以总球数。
    solution_steps:
    - $P=\dfrac{2}{2+3+4}=\dfrac{2}{9}$。
