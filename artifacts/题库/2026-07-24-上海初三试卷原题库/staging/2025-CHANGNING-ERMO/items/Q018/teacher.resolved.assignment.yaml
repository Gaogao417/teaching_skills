  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 在梯形 $ABCD$ 中，$AD \parallel BC$，$\angle A = 90^{\circ}$，$AD = 3$，$AB = 4$，$BC = 6$。点 $E$ 在边 $BC$ 上，将 $\triangle ABE$ 沿着 $AE$ 翻折，点 $B$ 的对应点为点 $F$。如果 $EF \perp CD$，那么 $EC$ 的长为______
    answer: $\dfrac{14}{3}$
    clue: 延长 $AF$ 交 $BC$ 于 $G$，四边形 $AGCD$ 为平行四边形，折叠+勾股定理。
    solution_steps:
    - 延长 $AF$ 交 $BC$ 于 $G$，$AGCD$ 为平行四边形，$CG=3$，$BG=3$，$AG=5$，$GF=1$。
    - 设 $EG=x$，$EF=3-x$，$(3-x)^2+1=x^2$，$x=\frac{5}{3}$，$EC=\frac{5}{3}+3=\frac{14}{3}$。
