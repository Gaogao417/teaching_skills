  - type: problem
    id: Q021
    points: 10
    stem_latex: '在平面直角坐标系 $xOy$ 中，直线 $y = -\dfrac{1}{2}x + 1$ 与双曲线 $y = \dfrac{k}{x}$（$k$ 是常数，且 $k \neq 0$）交于点 $A(6, m)$。

      (1) 求 $k$ 与 $m$ 的值；

      (2) 直线 $y = -\dfrac{1}{2}x + 1$ 与 $x$ 轴交于点 $B$，过点 $B$ 作 $y$ 轴的平行线，交双曲线 $y = \dfrac{k}{x}$ 于点 $C$，求 $\triangle ABC$ 的面积。'
    solution_steps:
    - (1) 代入 $A(6,m)$ 到直线：$m=-\dfrac{1}{2}\times6+1=-2$，$\therefore A(6,-2)$。
    - 代入双曲线：$-2=\dfrac{k}{6}$，$\therefore k=-12$。
    - (2) $y=0$ 时 $x=2$，$B(2,0)$；$x=2$ 时 $y=-\dfrac{12}{2}=-6$，$C(2,-6)$。
    - $BC=6$，$A$ 到 $BC$ 水平距离 $=6-2=4$。
    - $S_{\triangle ABC}=\dfrac{1}{2}\times6\times4=12$。
    clue: 待定系数法求 $k,m$，再利用坐标求三角形面积。
    answer: (1) $k=-12$，$m=-2$；(2) $S_{\triangle ABC}=12$
