  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 我们把一个三角形的重心与外心之间的距离叫做该三角形的"变形值"。已知等腰三角形的腰长为5，底边长为8，那么它的"变形值"等于______
    answer: $\dfrac{13}{6}$
    clue: 求外心到顶点距离 $OA=\frac{25}{6}$，重心 $AG=\frac{2}{3}\times3=2$，变形值 $OG=\frac{25}{6}-2$。
    solution_steps:
    - $AD=3$，$R^2=(R-3)^2+16$，$R=\dfrac{25}{6}$。
    - $AG=\dfrac{2}{3}\times3=2$，$OG=\dfrac{25}{6}-2=\dfrac{13}{6}$。
