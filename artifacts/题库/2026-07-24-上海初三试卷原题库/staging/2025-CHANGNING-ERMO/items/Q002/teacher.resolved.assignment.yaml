    stem_latex: 已知方程组 $\begin{cases} x+2y=1 \\ 2x-y=2 \end{cases}$，那么代数式 $x-3y$ 的值是（\quad）
    choices:
    - '2'
    - '1'
    - '-1'
    - '-2'
    answer: B
    clue: 两式相减直接得到 $-x+3y=-1$，即 $x-3y=1$。
