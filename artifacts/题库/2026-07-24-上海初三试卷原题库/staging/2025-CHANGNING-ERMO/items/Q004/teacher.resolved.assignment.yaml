    stem_latex: 已知某篮球队有15名队员，他们身高的平均数和中位数都是185厘米，后来发现在登记身高时，将一名队员的身高由174厘米误写成184厘米，再经过重新计算后，正确的身高平均数为$m$厘米，中位数为$n$厘米，那么下列结论中正确的是（\quad）
    choices:
    - $m<185, n<185$
    - $m<185, n=185$
    - $m>185, n>185$
    - $m>185, n=185$
    answer: B
    clue: 平均数减小（多写了10cm除以15人），中位数不变（排序不变）。
