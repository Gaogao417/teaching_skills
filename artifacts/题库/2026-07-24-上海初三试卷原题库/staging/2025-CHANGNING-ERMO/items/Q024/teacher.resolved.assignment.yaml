  - type: problem
    id: Q024
    points: 12
    stem_latex: '顶点为 $A$ 的抛物线 $y = -\dfrac{1}{2}x^2 + mx - \dfrac{1}{2}m^2 + m + 1$ 与 $y$ 轴交于点 $B$。

      (1) 如果抛物线经过点 $(2, -1)$，且不经过第二象限，求抛物线的表达式；

      (2) 如果抛物线与坐标轴共有两个公共点，且在 $y$ 轴右侧是下降的，求 $m$ 的值；

      (3) 点 $A$ 在第一象限，点 $B$ 关于抛物线对称轴的对称点为点 $C$，将抛物线沿射线 $CA$ 方向平移，对应点为 $A'',B'',C''$，$B''C''$ 与 $AB$ 交于 $D$，$\tan \angle A''DB'' = 4$，$\dfrac{S_{\triangle ADC''}}{S_{\triangle ABC}} = \dfrac{1}{9}$，求点 $A$ 的坐标。'
    solution_steps:
    - (1) 代入 $(2,-1)$：$m^2-6m=0$，$m=0$ 或 $m=6$。不经过第二象限故 $m=6$。
    - $\therefore y=-\dfrac{1}{2}x^2+6x-11$。
    - (2) 对称轴 $x=m\leqslant0$。①过原点：$-\dfrac{1}{2}m^2+m+1=0$，$m=1-\sqrt{3}$。
    - ②与 $x$ 轴仅一交点：$\Delta=0$，$m=-1$。
    - $\therefore m=-1$ 或 $1-\sqrt{3}$。
    - (3) $A(m,m+1)$，$B(0,-\dfrac{1}{2}m^2+m+1)$，$C(2m,-\dfrac{1}{2}m^2+m+1)$。
    - $\triangle ADC'\sim\triangle ABC$，$\dfrac{C'D}{BC}=\dfrac{1}{3}$，$C'D=\dfrac{2}{3}m$，$MD=\dfrac{1}{3}m$。
    - $\tan\angle A'DB'=\dfrac{A'M}{DM}=4$，$\therefore \dfrac{\frac{1}{2}m^2}{\frac{1}{3}m}=4$，$m=\dfrac{8}{3}$。
    - $\therefore A\left(\dfrac{8}{3},\dfrac{11}{3}\right)$。
    clue: 二次函数图象与性质、抛物线平移、相似三角形面积比。
    answer: (1) $y=-\dfrac{1}{2}x^2+6x-11$；(2) $m=-1$ 或 $1-\sqrt{3}$；(3) $A\left(\dfrac{8}{3},\dfrac{11}{3}\right)$
