  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 反比例函数 $y=\dfrac{1+k^2}{x}$（$k$ 是常数）的图像经过点 $A(3,y_1)$，$B(5,y_2)$，那么 $y_1$______$y_2$。（填">"、"="或"<"）
    answer: '>'
    clue: $1+k^2>0$，双曲线在一、三象限，$3<5$ 同象限 $y$ 随 $x$ 增大而减小。
    solution_steps:
    - $1+k^2>0$，$y$ 随 $x$ 增大而减小，$3<5$，$\therefore y_1>y_2$。
