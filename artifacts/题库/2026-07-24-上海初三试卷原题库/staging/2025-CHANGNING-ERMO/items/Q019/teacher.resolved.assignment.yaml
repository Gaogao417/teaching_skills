  - type: problem
    id: Q019
    points: 10
    stem_latex: 计算：$\left|\sqrt{2} - 2\right| + \dfrac{1}{\sqrt{2} + \sqrt{3}} - \left(\dfrac{1}{8}\right)^{-\frac{1}{2}} - \dfrac{\sqrt{3}}{2025^0}$
    solution_steps:
    - $\left|\sqrt{2}-2\right|=2-\sqrt{2}$
    - $\dfrac{1}{\sqrt{2}+\sqrt{3}}=\sqrt{3}-\sqrt{2}$（分母有理化）
    - $\left(\dfrac{1}{8}\right)^{-\frac{1}{2}}=\sqrt{8}=2\sqrt{2}$
    - $\dfrac{\sqrt{3}}{2025^0}=\sqrt{3}$
    - 原式 $= (2-\sqrt{2})+(\sqrt{3}-\sqrt{2})-2\sqrt{2}-\sqrt{3}$
    - $= 2-\sqrt{2}+\sqrt{3}-\sqrt{2}-2\sqrt{2}-\sqrt{3}$
    - $= 2-4\sqrt{2}$
    clue: 绝对值、分母有理化、负指数幂、零指数幂。
    answer: $2-4\sqrt{2}$
    source_solution_images: []
