  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 甲、乙两人在同一起点出发，乙比甲晚5秒，图中 $l_1$、$l_2$ 分别表示甲、乙两人在赛跑中的路程 $s$（米）与时间 $t$（秒）的关系（图像不完整），已知 $l_2$ 的表达式为 $s = 6t - 30$，如果在 $t = 10$ 秒时乙追上甲，那么 $l_1$ 的表达式为______。（不要求写定义域）
    answer: $s=3t$
    clue: 交点 $(10,30)$，$l_1$ 过原点，待定系数法求 $k=3$。
    solution_steps:
    - $t=10$ 时 $s=6\times10-30=30$，交点 $(10,30)$。
    - 设 $l_1: s=kt$，代入 $(10,30)$ 得 $k=3$，$\therefore s=3t$。
