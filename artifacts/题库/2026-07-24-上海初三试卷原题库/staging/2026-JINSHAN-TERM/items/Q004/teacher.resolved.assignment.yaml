    - 如果 $\vec a=k\vec b\ (k\ne0)$，那么 $\vec a\parallel\vec b$
    - 如果两个相等的向量相减，那么结果为 $0$
    - 如果 $\vec a$ 和 $\vec b$ 都是单位向量，那么 $\vec a=\vec b$
    - 如果 $|\vec a|=|\vec b|$，那么 $\vec a=\vec b$
