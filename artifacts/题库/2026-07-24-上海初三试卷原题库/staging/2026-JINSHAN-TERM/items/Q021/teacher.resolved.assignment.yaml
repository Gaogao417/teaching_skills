  - type: problem
    id: Q021
    points: 12
    stem_latex: 如图，在平面直角坐标系 $xOy$ 中，已知抛物线 $y=ax^2-2anx+an^2+2n+1\ (a<0)$ 的顶点为 $A$，点 $B(-1,1)$、$C(3,1)$。（1）若抛物线经过点 $B$ 和 $C$，求 $a$ 的值；（2）如果 $\triangle ABC$ 的面积小于 $3$，求 $n$ 的取值范围；（3）点 $A$ 关于原点的对称点为 $D$，联结 $AC$、$CD$，且 $AC\perp CD$，直线 $BC$ 与抛物线交于点 $E$、$F$（点 $E$ 在点 $C$ 右侧），当 $\triangle ACE$ 与 $\triangle CDE$ 相似时，求抛物线的表达式。
    answer: （1）$a=-\frac12$；（2）$-\frac34<n<\frac34$ 且 $n\ne0$；（3）$y=-\frac12(x-1)^2+3$。
    solution_steps:
    - title: 第（1）问
      content: $\because$ 抛物线经过点 $B$ 和 $C$，代入得 $y=ax^2-2anx+an^2+2n+1$，且 $B(-1,1)$，$\therefore1=a(-1)^2-2an(-1)+an^2+2n+1$，解得 $a=-\frac12$。
    - title: 第（2）问
      content: $BC=4$，$A(n,2n+1)$，$\triangle ABC$ 的高为 $|2n|$。由 $\frac12\cdot4\cdot|2n|<3$，得 $-\frac34<n<\frac34$ 且 $n\ne0$。
    - title: 第（3）问
      content: $D(-n,-2n-1)$。由 $AC\perp CD$ 得 $5n^2+4n-9=0$，结合点的位置取 $n=1$。此时 $A(1,3)$、$D(-1,-3)$、$B(-1,1)$、$C(3,1)$。由 $\triangle ACE\sim\triangle CDE$ 的对应关系得 $CE=4$，故 $E(7,1)$，抛物线为 $y=-\frac12(x-1)^2+3$。
