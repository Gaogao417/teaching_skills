    stem_latex: 如图，在平面直角坐标系 $xOy$ 中，已知抛物线 $y=ax^2-2anx+an^2+2n+1\ (a<0)$ 的顶点为 $A$，点 $B(-1,1)$、$C(3,1)$。（1）若抛物线经过点 $B$ 和 $C$，求 $a$ 的值；（2）如果 $\triangle ABC$ 的面积小于 $3$，求 $n$ 的取值范围；（3）点 $A$ 关于原点的对称点为 $D$，联结 $AC$、$CD$，且 $AC\perp CD$，直线 $BC$ 与抛物线交于点 $E$、$F$（点 $E$ 在点 $C$ 右侧），当 $\triangle ACE$ 与 $\triangle CDE$ 相似时，求抛物线的表达式。
