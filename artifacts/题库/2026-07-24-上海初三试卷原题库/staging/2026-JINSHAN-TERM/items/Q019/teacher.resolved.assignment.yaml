  - type: problem
    id: Q019
    points: 10
    stem_latex: 在平面直角坐标系 $xOy$ 中，把抛物线 $y=x^2+bx+c$ 向下平移 $1$ 个单位长度，所得的新抛物线顶点坐标为 $A(-2,1)$。（1）求原抛物线的表达式；（2）若新抛物线与 $y$ 轴交于点 $C$，原抛物线顶点为 $B$，求 $\angle ACB$ 的正切值。
    answer: （1）$y=x^2+4x+6$；（2）$\tan\angle ACB=\frac18$。
    solution_steps:
    - title: 第（1）问
      content: 抛物线向下平移后为 $y=x^2+bx+c-1$。$\because$ 新抛物线顶点为 $A(-2,1)$，$\therefore-\frac b2=-2$，$b=4$；$1=(-2)^2+4(-2)+c-1$，$c=6$。$\therefore$ 原抛物线为 $y=x^2+4x+6$。
    - title: 第（2）问
      content: 原抛物线顶点为 $B(-2,2)$，新抛物线为 $y=x^2+4x+5$，$C(0,5)$。作 $BD\perp AC$ 于点 $D$，由面积关系求得 $BD=\frac{\sqrt5}{5}$，$CD=\frac{8\sqrt5}{5}$，$\therefore\tan\angle ACB=\frac{BD}{CD}=\frac18$。
