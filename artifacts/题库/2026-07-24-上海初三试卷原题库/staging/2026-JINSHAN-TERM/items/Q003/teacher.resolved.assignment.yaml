    stem_latex: 在平面直角坐标系 $xOy$ 中，对于抛物线 $y=a(x+1)^2+2$（其中 $a$ 是常数，且 $a\ne0$），下列叙述中正确的是（　）。
    answer: C
    choices:
    - 当 $a>0$ 时，抛物线开口向下
    - 抛物线与 $y$ 轴交点坐标为 $(0,2)$
    - 顶点坐标是 $(-1,2)$
    - 当 $a<0$ 时，顶点是抛物线的最低点
    explanation: 官方参考答案：C。
