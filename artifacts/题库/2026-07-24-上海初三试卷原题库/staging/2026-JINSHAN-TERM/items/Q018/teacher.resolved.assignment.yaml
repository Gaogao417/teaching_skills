  - type: problem
    id: Q018
    points: 10
    stem_latex: 如图，在 $\triangle ABC$ 中，$AB=AC$，点 $E$、$D$ 分别在边 $BC$、$AC$ 上，$\angle AED=\angle B$。（1）求证：$\triangle ABE\sim\triangle ECD$；（2）若 $AB=10$，$BC=16$，$BE=12$，求 $CD$ 的长。
    answer: （1）见证明；（2）$CD=4.8$。
    solution_steps:
    - title: 第（1）问
      content: $\because$ 在 $\triangle ABC$ 中，$AB=AC$，$\therefore\angle B=\angle C$。$\because\angle AED=\angle B$，$\angle AED=\angle BAE+\angle DEC$，$\therefore\angle DEC=\angle BAE$。$\therefore\triangle ABE\sim\triangle ECD$。
    - title: 第（2）问
      content: $\because\triangle ABE\sim\triangle ECD$，$\therefore\frac{BE}{CD}=\frac{AB}{EC}$。$\because AB=10,\ BC=16,\ BE=12$，$\therefore EC=4$，$\therefore\frac{12}{CD}=\frac{10}{4}$，$\therefore CD=4.8$。
