  - type: problem
    id: Q020
    points: 12
    stem_latex: 坡道改良：某教学楼门口坡道上下坡困难。坡道最大坡度为 $1:12$，垂直升高不宜超过 $75\text{ cm}$，超过时需设置休息平台。三组测量数据如第20题图1至图3所示；折返形坡道平面示意如第20题图4所示，要求单段坡道最大坡度为 $1:10$、水平长度最大 $560\text{ cm}$、休息平台宽度和轮椅入口宽度均不小于 $150\text{ cm}$，且 $A'T=30\text{ cm}$、$TI=520\text{ cm}$。（1）根据三组数据，求原坡道的坡度和坡高，并判断是否安全；（2）设计一种折返形坡道方案，写出坡道 $OV$、$VC$ 的坡度和坡高以及设计过程。
    answer: （1）原坡道坡度为 $\frac7{24}$，坡高为 $70\text{ cm}$，不安全；（2）一种方案见解答。
    solution_steps:
    - title: 第（1）问
      content: 如图2，在 $Rt\triangle NMK$ 中，$NK=91.2\text{ cm}$，$NM=26.6\text{ cm}$，$\tan\angle NKM=\frac{NM}{NK}=\frac7{24}$。$\because NK\parallel AB$，$\therefore\tan A=\frac7{24}>\frac1{12}$，所以不安全。如图1，在 $Rt\triangle ABC$ 中，$AC=250\text{ cm}$，$BC:AB=7:24$，由勾股定理得 $BC=70\text{ cm}$。
    - title: 第（2）问
      content: 方案：坡道 $VC$ 的坡高设计为 $56\text{ cm}$，坡度设计为 $1:10$；坡道 $OV$ 的坡高为 $70-56=14\text{ cm}$，坡度设计为 $1:10$，所以 $OW=140\text{ cm}$。经验证此时 $OT=210\text{ cm}$、$RF=170\text{ cm}$，符合要求。
