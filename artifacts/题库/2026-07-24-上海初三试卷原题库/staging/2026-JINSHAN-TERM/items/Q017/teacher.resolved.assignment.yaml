  - type: problem
    id: Q017
    points: 10
    stem_latex: 如图，在 $Rt\triangle ABC$ 中，$\angle ACB=90^\circ$，$\tan B=\frac5{12}$，点 $D$ 在边 $BC$ 上，$BD=8$，$CD=4$，过点 $D$ 作 $DE\perp AD$ 交 $AC$ 的延长线于点 $E$。（1）求 $AD$ 的长；（2）求 $\sin E$ 的值。
    answer: （1）$\sqrt{41}$；（2）$\frac{5\sqrt{41}}{41}$。
    solution_steps:
    - title: 第（1）问
      content: $\because BD=8,\ CD=4$，$\therefore BC=12$。$\because$ 在 $Rt\triangle ABC$ 中，$\angle ACB=90^\circ$，$\tan B=\frac5{12}$，$\therefore\frac5{12}=\frac{AC}{12}$，$\therefore AC=5$。$\because$ 在 $Rt\triangle ADC$ 中，$\angle ACB=90^\circ$，$\therefore AD=\sqrt{AC^2+CD^2}=\sqrt{41}$。
    - title: 第（2）问
      content: $\because DE\perp AD$，$\therefore\angle E+\angle CAD=90^\circ$。$\because\angle ADC+\angle CAD=90^\circ$，$\therefore\angle ADC=\angle E$。$\therefore\sin E=\sin\angle ADC=\frac{AC}{AD}=\frac5{41}\sqrt{41}$。
