  - type: problem
    id: Q021
    points: 10
    stem_latex: '$\mathrm{Rt}\triangle ABC$（$\angle ACB=90^{\circ}$，$AC=8$，$\tan A=\frac{3}{4}$），$CD$ 为中线，$BE\perp CD$ 交 $AC$ 于 $E$。

      (1) 求 $CE$；

      (2) 求 $\tan\angle EBA$。'
    solution_steps:
    - (1) $BC=6$，$AB=10$，$\triangle BCE\sim\triangle ACB$，$CE=\frac{BC^2}{AC}=\frac{9}{2}$。
    - (2) 建系求 $F$（$BE\cap CD$），$\tan\angle EBA=\frac{3}{4}$。
    clue: 相似三角形+解析法。
    answer: (1) $CE=\dfrac{9}{2}$；(2) $\tan\angle EBA=\dfrac{3}{4}$
