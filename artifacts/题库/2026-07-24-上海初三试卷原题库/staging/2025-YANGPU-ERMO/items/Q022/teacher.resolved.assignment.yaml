    stem_latex: '花圃一：等腰 $\triangle ABC$（$AB=AC=13$，$BC=24$），半圆步道圆心在 $BC$ 上，求最大半径；

      花圃二：梯形 $DEFG$（$DG\parallel EF$，$DG=9$，$EF=27$，$\angle E=45^{\circ}$，$\tan F=2$），圆心在 $EF$ 上，求最大半径。'
    solution_steps:
    - 花圃一：等面积法 $DE=\frac{60}{13}$cm。
    - 花圃二：角平分线作圆心，半径 $36\sqrt{2}-18\sqrt{5}$cm。
    clue: 切线性质+尺规作图+解直角三角形。
    answer: 花圃一 $\dfrac{60}{13}$cm；花圃二 $(36\sqrt{2}-18\sqrt{5})$cm
