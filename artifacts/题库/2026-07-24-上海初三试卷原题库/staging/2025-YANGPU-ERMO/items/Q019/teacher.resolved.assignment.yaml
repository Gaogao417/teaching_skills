  - type: problem
    id: Q019
    points: 10
    stem_latex: 先化简 $\left(a+1-\dfrac{2a-1}{a-1}\right)\div\dfrac{a^{2}-4a+4}{a-1}$，再求 $a=\sqrt{3}$ 时的值。
    solution_steps:
    - 原式 $=\frac{a(a-2)}{a-1}\cdot\frac{a-1}{(a-2)^2}=\frac{a}{a-2}$。
    - $a=\sqrt{3}$ 代入：$\frac{\sqrt{3}}{\sqrt{3}-2}=-3-2\sqrt{3}$。
    clue: 分式化简+分母有理化。
    answer: $-3-2\sqrt{3}$
