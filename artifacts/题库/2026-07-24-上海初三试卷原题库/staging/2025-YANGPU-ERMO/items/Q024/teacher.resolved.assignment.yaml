  - type: problem
    id: Q024
    points: 12
    stem_latex: '抛物线 $y=ax^2-2ax-3a$（$a>0$）与 $x$ 轴交于 $A$（左）、$B$，顶点 $D$，$CE\parallel x$ 轴。

      (1) 求 $A$、$B$ 坐标及对称轴；

      (2) $AE$ 平分 $\angle BAC$，求 $a$；

      (3) $S_{\triangle AFD}=S_{\triangle PFE}$ 时，$PD$ 是否过定点？'
    solution_steps:
    - (1) $A(-1,0)$，$B(3,0)$，对称轴 $x=1$。
    - (2) $AC=CE$，$1+9a^2=4$，$a=\frac{\sqrt{3}}{3}$。
    - (3) $DE\parallel AP$，$P(4,5a)$，$PD$ 过定点 $(\frac{7}{3},0)$。
    clue: 二次函数+角平分线+面积+定点。
    answer: (1) $A(-1,0)$，$B(3,0)$，$x=1$；(2) $a=\dfrac{\sqrt{3}}{3}$；(3) 过定点 $(\dfrac{7}{3},0)$
