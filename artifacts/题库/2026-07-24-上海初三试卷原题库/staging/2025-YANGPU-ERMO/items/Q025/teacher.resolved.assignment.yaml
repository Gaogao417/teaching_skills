  - type: problem
    id: Q025
    points: 14
    stem_latex: '$\odot O$ 直径 $AB=10$，$C$ 在 $AB$ 上，$DE\perp AB$ 过 $C$，$F$ 是弧 $BD$ 中点，$EF$ 交 $AB$ 于 $G$。

      (1) $G$ 与 $O$ 重合时求 $AC$；

      (2) $OD\perp EF$ 时求 $\frac{DE}{EF}$；

      (3) $AC=x$，$y=\frac{EG}{GF}$，求 $y$ 关于 $x$ 的解析式。'
    solution_steps:
    - (1) $\angle DEF=30^{\circ}$，$OC=\frac{5}{2}$，$AC=\frac{5}{2}$。
    - (2) 弧度方程 $x=36^{\circ}$，$\frac{DE}{EF}=\frac{\sqrt{5}-1}{2}$。
    - (3) $EC=\sqrt{x(10-x)}$，$BE=\sqrt{10(10-x)}$，$y=\frac{\sqrt{10x}}{5}$，$0<x<10$。
    clue: 圆综合+弧中点+黄金比+垂径定理+相似。
    answer: (1) $AC=\dfrac{5}{2}$；(2) $\dfrac{\sqrt{5}-1}{2}$；(3) $y=\dfrac{\sqrt{10x}}{5}$（$0<x<10$）
