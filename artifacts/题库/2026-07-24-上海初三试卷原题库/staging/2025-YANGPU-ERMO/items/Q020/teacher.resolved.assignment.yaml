    stem_latex: 解不等式组 $\begin{cases}6-3x>2(x-2)\\ \dfrac{2x-1}{2}-3x\leqslant 4\end{cases}$
    solution_steps:
    - ① $6-3x>2x-4$，$x<2$。
    - ② $2x-1-6x\leq8$，$x\geq-\frac{9}{4}$。
