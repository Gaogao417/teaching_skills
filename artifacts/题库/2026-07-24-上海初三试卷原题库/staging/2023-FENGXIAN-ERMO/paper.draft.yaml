      solution_steps:
      - (1) 菱形 $AB=AD$，$BC=CD$；$AE\perp BC$，$AF\perp CD\Rightarrow AF\perp AB$，$\angle
        BAE=\angle DAF$，$\triangle BAE\cong\triangle DAF$（AAS），$DF=BE$，$\therefore
        CE=CF$。
      - (2) $FG^{2}=AG\cdot DG\Rightarrow \dfrac{FG}{AG}=\dfrac{DG}{FG}$，又 $\angle
        G$ 公共，$\triangle DGF\sim\triangle FGA$。
      - 由 $CE=CF$、$AG\parallel BC$ 推得 $DF=DG$、$AF=FG$；进而 $\angle ADF=\angle AEG$，$\dfrac{AG}{AE}=\dfrac{AF}{DF}=\dfrac{AF}{BE}$。
