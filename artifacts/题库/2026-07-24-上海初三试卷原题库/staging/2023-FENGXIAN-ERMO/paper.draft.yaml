    block:
      stem_latex: 图1是某地下商业街入口的玻璃顶支架，图2是其示意图。立柱 $AB\perp$ 地面（$\angle BAC=90\degree$），$AB=2.7$
        米，$A,C,M$ 共水平线，$\angle ACB=33\degree$，支撑杆 $DE\perp BC$ 于 $E$，$\angle DBE=66\degree$，$CE=2.2$
        米。（1）求 $BD$ 的长；（2）求 $BD$ 的顶端 $D$ 到地面 $AM$ 的距离（精确到 $0.1$ 米）。（参考数据：$\sin33\degree\approx0.54$，$\sin66\degree\approx0.91$，$\cos33\degree\approx0.84$，$\cos66\degree\approx0.40$，$\tan33\degree\approx0.65$，$\tan66\degree\approx2.25$）
      answer: (1) $BD=7$ 米；(2) $D$ 到地面约 $6.5$ 米
      clue: (1) 解 Rt$\triangle ABC$ 求 $BC$，再解 Rt$\triangle DEB$ 求 $BD$；(2) 构造矩形用 $\sin33\degree$
        求 $DG$。
      solution_steps:
      - (1) Rt$\triangle ABC$ 中 $BC=\dfrac{AB}{\sin33\degree}\approx\dfrac{2.7}{0.54}=5$
        米；$BE=BC-CE=2.8$ 米。
      - Rt$\triangle DEB$ 中 $BD=\dfrac{BE}{\cos66\degree}\approx\dfrac{2.8}{0.40}=7$
        米。
      - (2) 过 $D$ 作 $DH\perp AM$，过 $B$ 作 $BG\perp DH$，矩形 $ABGH$，$GH=AB=2.7$，$\angle
        DBG=33\degree$。
      - $DG=BD\sin33\degree\approx7\times0.54\approx3.8$ 米，$DH=DG+GH\approx6.5$ 米。
