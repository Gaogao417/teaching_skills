        FE:EC=\dfrac{2-\sqrt{2}}{4}$。
      - (3) $\triangle BFD$ 等腰且 $CF\perp BD\Rightarrow BE=DE=4$，$BD=8$，又 $BC=BD$，$\therefore
        BC=8$。
