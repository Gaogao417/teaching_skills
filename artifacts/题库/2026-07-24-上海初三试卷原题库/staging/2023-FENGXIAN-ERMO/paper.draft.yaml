        $AD$ 的延长线于点 $G$。（1）求证：$CE=CF$；（2）如果 $FG^{2}=AG\cdot DG$，求证：$\dfrac{AG}{AE}=\dfrac{AF}{BE}$．
      answer: (1)(2) 见解析
      clue: (1) 由菱形性质证 $\triangle BAE\cong\triangle DAF$ 得 $DF=BE$，结合 $BC=CD$；(2)
