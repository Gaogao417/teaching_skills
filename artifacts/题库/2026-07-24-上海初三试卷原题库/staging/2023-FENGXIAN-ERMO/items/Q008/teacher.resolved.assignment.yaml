    stem_latex: 化简分式 $\dfrac{b}{ab+b}$ 的结果为 ______
    answer: $\dfrac{1}{a+1}$
    clue: 分子分母提取公因式后约分。
    solution_steps:
    - $\dfrac{b}{ab+b}=\dfrac{b}{b(a+1)}=\dfrac{1}{a+1}$。
