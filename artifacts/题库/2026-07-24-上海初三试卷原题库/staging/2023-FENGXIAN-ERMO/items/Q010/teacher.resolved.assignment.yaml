  - type: short_answer
    id: Q010
    points: 4
    stem_latex: 如果一个二次函数的图像顶点是原点，且它经过平移后能与 $y=-2x^{2}+x-1$ 的图像重合，那么这个二次函数的解析式是 ______
    answer: $y=-2x^{2}$
    clue: 平移不改变二次项系数，顶点在原点则常数项、一次项为0。
    solution_steps:
    - 平移后重合，二次项系数 $a=-2$；顶点在原点，解析式为 $y=-2x^{2}$。
