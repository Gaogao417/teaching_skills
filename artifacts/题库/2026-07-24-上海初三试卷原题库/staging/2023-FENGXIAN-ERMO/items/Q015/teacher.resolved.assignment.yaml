  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 在 $\triangle ABC$ 中，$AB=AC$，如果 $BC=10$，$\cos B=\dfrac{5}{13}$，那么 $\triangle ABC$ 的重心到底边的距离为 ______
    answer: '4'
    clue: 等腰三角形三线合一，由 $\cos B$ 求腰长与高，重心把高分为 $2:1$。
    solution_steps:
    - $D$ 为 $BC$ 中点，$AD\perp BC$，$BD=5$；$\cos B=\dfrac{BD}{AB}=\dfrac{5}{13}$，$AB=13$。
    - $AD=\sqrt{13^{2}-5^{2}}=12$；重心 $E$ 满足 $DE=\dfrac{1}{3}AD=4$。
