    stem_latex: 图1是某地下商业街入口的玻璃顶支架，图2是其示意图。立柱 $AB\perp$ 地面（$\angle BAC=90\degree$），$AB=2.7$ 米，$A,C,M$ 共水平线，$\angle ACB=33\degree$，支撑杆 $DE\perp BC$ 于 $E$，$\angle DBE=66\degree$，$CE=2.2$ 米。（1）求 $BD$ 的长；（2）求 $BD$ 的顶端 $D$ 到地面 $AM$ 的距离（精确到 $0.1$ 米）。（参考数据：$\sin33\degree\approx0.54$，$\sin66\degree\approx0.91$，$\cos33\degree\approx0.84$，$\cos66\degree\approx0.40$，$\tan33\degree\approx0.65$，$\tan66\degree\approx2.25$）
