  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在平面直角坐标系 $xOy$ 中，直线 $l$ 上有点 $A(3,2)$，将点 $A$ 先向左平移3个单位、再向下平移4个单位得到点 $B$，点 $B$ 恰好在直线 $l$ 上。（1）写出点 $B$ 的坐标，并求直线 $l$ 的表达式；（2）如果点 $C$ 在 $y$ 轴上，且 $\angle ABC=\angle ACB$，求点 $C$ 的坐标．
    answer: (1) $B(0,-2)$，$y=\dfrac{4}{3}x-2$；(2) $C(0,6)$
    clue: (1) 平移求 $B$，待定系数求直线；(2) 等角对等边得 $AC=AB$，由垂直平分求 $C$。
    solution_steps:
    - (1) $B(0,-2)$；设 $y=kx+b$，代入 $A,B$ 得 $k=\dfrac{4}{3},b=-2$，$y=\dfrac{4}{3}x-2$。
    - (2) $\angle ABC=\angle ACB\Rightarrow AC=AB$，$A$ 到 $y$ 轴距离即 $AB$ 在竖直方向的对称，$BO=4$，$\therefore C(0,6)$。
