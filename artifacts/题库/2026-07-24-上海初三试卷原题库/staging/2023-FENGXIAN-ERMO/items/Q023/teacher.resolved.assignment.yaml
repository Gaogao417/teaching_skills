  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，在菱形 $ABCD$ 中，$AE\perp BC$，$AF\perp CD$，垂足为 $E$、$F$，射线 $EF$ 交 $AD$ 的延长线于点 $G$。（1）求证：$CE=CF$；（2）如果 $FG^{2}=AG\cdot DG$，求证：$\dfrac{AG}{AE}=\dfrac{AF}{BE}$．
    answer: (1)(2) 见解析
    clue: (1) 由菱形性质证 $\triangle BAE\cong\triangle DAF$ 得 $DF=BE$，结合 $BC=CD$；(2) 由 $FG^{2}=AG\cdot DG$ 证相似，结合等腰与角的互余转化。
    solution_steps:
    - (1) 菱形 $AB=AD$，$BC=CD$；$AE\perp BC$，$AF\perp CD\Rightarrow AF\perp AB$，$\angle BAE=\angle DAF$，$\triangle BAE\cong\triangle DAF$（AAS），$DF=BE$，$\therefore CE=CF$。
    - (2) $FG^{2}=AG\cdot DG\Rightarrow \dfrac{FG}{AG}=\dfrac{DG}{FG}$，又 $\angle G$ 公共，$\triangle DGF\sim\triangle FGA$。
    - 由 $CE=CF$、$AG\parallel BC$ 推得 $DF=DG$、$AF=FG$；进而 $\angle ADF=\angle AEG$，$\dfrac{AG}{AE}=\dfrac{AF}{DF}=\dfrac{AF}{BE}$。
