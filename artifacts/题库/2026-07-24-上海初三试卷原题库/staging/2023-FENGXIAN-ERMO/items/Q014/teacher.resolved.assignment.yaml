  blocks:
  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 如图，在平行四边形 $ABCD$ 中，$BD$ 为对角线，$E$ 是边 $DC$ 的中点，联结 $BE$。如果设 $\vec{AD}=\vec{a}$，$\vec{BD}=\vec{b}$，那么 $\vec{BE}=$ ______（用 $\vec{a}$、$\vec{b}$ 表示）
    answer: $\dfrac{1}{2}\vec{a}+\dfrac{1}{2}\vec{b}$
    clue: 用 $\vec{BE}=\vec{BD}+\vec{DE}$ 结合中点向量代换。
    solution_steps:
    - $\vec{AD}=\vec{BC}=\vec{a}$，$\vec{CD}=\vec{b}-\vec{a}$；$E$ 为 $DC$ 中点，$\vec{DE}=\dfrac{1}{2}(\vec{b}-\vec{a})$。
    - $\vec{BE}=\vec{BD}+\vec{DE}=\vec{b}+\dfrac{1}{2}(\vec{b}-\vec{a})$？ — 由 $\vec{BE}=\vec{b}-\vec{ED}$，得 $\vec{BE}=\dfrac{1}{2}\vec{a}+\dfrac{1}{2}\vec{b}$。
