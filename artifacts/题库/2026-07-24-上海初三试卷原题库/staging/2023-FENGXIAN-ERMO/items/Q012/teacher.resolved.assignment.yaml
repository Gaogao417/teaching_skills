  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 布袋里有4个小球，分别标注数字 $-1,0,2,3$，从中任意摸出一个球，标注数字恰好是正数的概率是 ______
    answer: $\dfrac{1}{2}$
    clue: 正数个数除以总数。
    solution_steps:
    - 正数有 $2,3$ 共2个，$P=\dfrac{2}{4}=\dfrac{1}{2}$。
