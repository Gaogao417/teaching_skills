  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 如果正比例函数 $y=kx$（$k\neq0$）的图像经过点 $(4,-1)$，那么 $y$ 的值随 $x$ 的增大而 ______（填"增大"或"减小"）
    answer: 减小
    clue: 由点的坐标求 $k$，由 $k$ 的正负判断增减性。
    solution_steps:
    - $-1=4k$，$k=-\dfrac{1}{4}<0$，$y$ 随 $x$ 增大而减小。
