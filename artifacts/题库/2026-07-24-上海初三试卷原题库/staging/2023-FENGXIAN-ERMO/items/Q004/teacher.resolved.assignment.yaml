    stem_latex: 演讲比赛中7位评委给出某选手原始评分，评定时去掉一个最高分、一个最低分得5个有效评分。5个有效评分与7个原始评分相比，一定不变的是（\quad）
    choices:
    - 中位数
    - 众数
    - 平均数
    - 方差
