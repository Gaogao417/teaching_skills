  - type: choice
    id: Q001
    points: 4
    stem_latex: 下列实数中，有理数是（\quad）
    choices:
    - $\sqrt{8}$
    - $\sqrt{9}$
    - $\sqrt{10}$
    - $\sqrt{12}$
    answer: B
    clue: 有理数是有限小数或无限循环小数；开得尽方的根式是有理数。
    solution_steps:
    - $\sqrt{8}=2\sqrt{2}$、$\sqrt{10}$、$\sqrt{12}=2\sqrt{3}$ 均为无理数。
    - $\sqrt{9}=3$ 是整数，为有理数。
