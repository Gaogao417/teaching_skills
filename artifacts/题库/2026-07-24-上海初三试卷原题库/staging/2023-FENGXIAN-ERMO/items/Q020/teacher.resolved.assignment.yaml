  - type: problem
    id: Q020
    points: 10
    stem_latex: 解不等式组 $\begin{cases} \dfrac{1}{3}x - 1 \leqslant 3 - \dfrac{5}{3}x \\ \dfrac{x - 7}{15} < \dfrac{x - 2}{5} \end{cases}$，将解集在数轴上表示出来，并写出整数解．
    answer: $-\dfrac{1}{2}<x\leqslant2$，整数解为 $0,1,2$
    clue: 分别解两个不等式取交集，再在数轴上表示并取整数解。
    solution_steps:
    - 解①得 $x\leqslant2$；解②得 $x>-\dfrac{1}{2}$。
    - $\therefore -\dfrac{1}{2}<x\leqslant2$，整数解为 $0,1,2$。
