    stem_latex: 下列计算正确的是（\quad）
    choices:
    - $a^{3}+a^{2}=a^{5}$
    - $a^{3}-a^{2}=a$
    - $a^{3}\cdot a^{2}=a^{6}$
    - $a^{3}\div a^{2}=a$
    answer: D
    clue: 逐项验证合并同类项、同底数幂乘除法。
    solution_steps:
    - A、B 不能合并；C、$a^{3}\cdot a^{2}=a^{5}$。
    - D、$a^{3}\div a^{2}=a$，正确。
