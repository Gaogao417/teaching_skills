  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如果四边形有一组邻边相等，且一条对角线平分这组邻边的夹角，称这样的四边形为"准菱形"。有一个"准菱形"相等的邻边长为2，这两条边的夹角是 $90\degree$，那么这个"准菱形"的另外一组邻边的中点间的距离是 ______
    answer: $\sqrt{2}$
    clue: 用勾股定理求那条对角线，再用三角形中位线定理。
    solution_steps:
    - Rt$\triangle ABD$ 中 $BD=\sqrt{2^{2}+2^{2}}=2\sqrt{2}$。
    - $E,F$ 为 $CD,BC$ 中点，$EF$ 为 $\triangle BCD$ 的中位线，$EF=\dfrac{1}{2}BD=\sqrt{2}$。
