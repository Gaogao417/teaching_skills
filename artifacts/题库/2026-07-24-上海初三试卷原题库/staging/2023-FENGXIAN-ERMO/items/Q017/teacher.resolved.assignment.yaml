  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 如图，某电信公司提供 $A$、$B$ 两种方案的移动通讯费用 $y$（元）与通话时间 $x$（分）的关系。如果通讯费用为60元，那么 $A$ 方案与 $B$ 方案的通话时间相差 ______ 分钟
    answer: '35'
    clue: 分别用待定系数法求两方案超出免费时长后的解析式，令 $y=60$ 求 $x$ 再作差。
    solution_steps:
    - $A$ 方案：$y_{1}=0.4x-16$（$x>120$），$y=60$ 时 $x=190$。
    - $B$ 方案：$y_{2}=0.4x-30$（$x>200$），$y=60$ 时 $x=225$。
    - 相差 $225-190=35$（分）。
