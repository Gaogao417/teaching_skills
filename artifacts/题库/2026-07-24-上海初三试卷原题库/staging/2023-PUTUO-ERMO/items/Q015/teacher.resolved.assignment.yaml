  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如图，斜坡 $AB$ 坡度 $i_{1}=1:\sqrt{3}$，不改变坡高 $AH$ 将坡度变缓为 $i_{2}=1:2.4$，已知 $AB=10$ 米，那么 $AC=$ ______ 米
    answer: '13'
    clue: 由 $i_1$ 求 $AH$，再由 $i_2$ 求 $CH$，勾股求 $AC$。
    solution_steps:
    - $\angle ABH=30\degree$，$AH=5$；$i_2=1:2.4\Rightarrow CH=12$。
    - $AC=\sqrt{5^{2}+12^{2}}=13$。
