    id: Q014
    points: 4
    stem_latex: 某校抽20名初三学生调查交通方式，扇形图如图（步行50%、公交25%、私家车2人），该校初三200人中骑自行车上学的约有 ______ 人
    answer: '30'
    clue: 用样本中骑车频率估计总体。
    solution_steps:
    - 样本中骑车 $20-10-5-2=3$ 人，$200\times\dfrac{3}{20}=30$（人）。
