  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 矩形 $ABCD$ 中 $AB=5$，$AD=8$，$E$ 在 $AD$ 上且 $AE=3$，以 $E$ 为圆心 $AE$ 为半径作 $\odot E$，$F$ 在 $BC$ 上以 $CF$ 为半径作 $\odot F$。如果 $\odot F$ 与 $\odot E$ 外切，那么 $CF=$ ______
    answer: $\dfrac{41}{16}$
    clue: 外切则 $EF=r+3$，作 $FH\perp AD$ 用勾股列方程。
    solution_steps:
    - 设 $\odot F$ 半径 $r$，$EF=r+3$，$FH=5$，$EH=5-r$。
    - $(r+3)^{2}=(5-r)^{2}+5^{2}$，$r=\dfrac{41}{16}$。
