  blocks:
  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 如图，$\triangle ABC$ 中 $\angle BAC=90\degree$，$AB=6$，$AC=4$，$D$ 为 $AB$ 中点，$E$ 为射线 $CA$ 上一点，将 $\triangle ADE$ 沿 $DE$ 翻折得 $\triangle A'DE$，如果 $\angle EA'C=90\degree$，那么 $AE=$ ______
    answer: $\dfrac{3}{2}$ 或 $6$
    clue: 分 $E$ 在线段 $CA$ 上与在 $CA$ 延长线上两种情形，用翻折与勾股求解。
    solution_steps:
    - 情形一（$E$ 在 $CA$ 上）：$A'C=2$，$x^{2}+2^{2}=(4-x)^{2}$，$x=\dfrac32$。
    - 情形二（$E$ 在延长线）：由相似得 $A'E_1=6$，$AE=6$。
