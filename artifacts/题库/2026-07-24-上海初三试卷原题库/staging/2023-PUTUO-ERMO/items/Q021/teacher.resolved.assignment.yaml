  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，$\triangle ABC$ 中 $AD\perp BC$ 于 $D$，$DE\parallel AC$，$\cos C=\dfrac{4}{5}$，$AC=10$，$BE=2AE$。（1）求 $BD$；（2）求 $\triangle BDE$ 面积．
    answer: (1) $BD=16$；(2) $32$
    clue: (1) 由 $\cos C$ 求 $CD$，由 $DE\parallel AC$ 及 $BE=2AE$ 求 $BD$；(2) 求 $AD$ 后按面积比计算。
    solution_steps:
    - (1) $CD=8$；$DE\parallel AC\Rightarrow \dfrac{BD}{CD}=\dfrac{BE}{AE}=2$，$BD=16$。
    - (2) $AD=6$；$S_{\triangle BDE}=\dfrac23\times\dfrac12\times6\times16=32$。
