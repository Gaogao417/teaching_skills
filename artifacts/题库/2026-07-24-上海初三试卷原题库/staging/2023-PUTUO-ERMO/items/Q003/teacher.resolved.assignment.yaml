    id: Q003
    points: 4
    stem_latex: 函数 $y=kx$（$k\neq0$）的图像经过第一、三象限，下列说法正确的是（\quad）
    choices:
    - $k<0$
    - 图像一定经过点 $(1,k)$
    - 图像是双曲线
    - $y$ 随 $x$ 增大而减小
    answer: B
    clue: 过一、三象限则 $k>0$，$x=1$ 时 $y=k$。
    solution_steps:
    - $k>0$，图像过 $(1,k)$，B 正确。
