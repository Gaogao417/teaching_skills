    id: Q009
    points: 4
    stem_latex: 方程 $\sqrt{x+2}=x$ 的根是 ______
    answer: $x=2$
    clue: 两边平方后求解并检验。
    solution_steps:
    - $x+2=x^{2}$，$x=\pm2$；检验舍去 $x=-1$，$x=2$。
