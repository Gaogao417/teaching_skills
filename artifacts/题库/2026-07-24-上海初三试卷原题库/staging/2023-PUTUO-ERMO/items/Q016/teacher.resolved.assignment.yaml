  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，$AD\parallel BC$，$AC,BD$ 交于 $O$，$BO=2OD$，设 $\vec{AD}=\vec{a}$，$\vec{AB}=\vec{b}$，那么 $\vec{OC}=$ ______（用 $\vec{a},\vec{b}$ 表示）
    answer: $\dfrac{4}{3}\vec{a}+\dfrac{2}{3}\vec{b}$
    clue: 由 $\triangle AOD\sim\triangle COB$ 得 $OC=\dfrac23 AC$，再向量表示。
    solution_steps:
    - $\dfrac{AO}{OC}=\dfrac{AD}{BC}=\dfrac12$，$BC=2\vec{a}$，$\vec{AC}=\vec{b}+2\vec{a}$。
    - $\vec{OC}=\dfrac23\vec{AC}=\dfrac43\vec{a}+\dfrac23\vec{b}$。
