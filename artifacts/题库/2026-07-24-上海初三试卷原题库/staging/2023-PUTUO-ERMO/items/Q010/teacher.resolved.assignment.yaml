    stem_latex: 关于 $x$ 的方程 $x^{2}-3x+m=0$ 有两个相等的实数根，那么 $m=$ ______
    answer: $\dfrac{9}{4}$
    clue: 两等根则 $\Delta=0$。
    solution_steps:
    - $\Delta=9-4m=0$，$m=\dfrac{9}{4}$。
