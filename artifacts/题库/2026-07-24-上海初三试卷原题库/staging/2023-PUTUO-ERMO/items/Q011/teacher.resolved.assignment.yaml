  blocks:
  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 近视眼镜度数 $y$（度）与镜片焦距 $x$（米）成反比例，400度眼镜焦距0.25米，那么 $y$ 关于 $x$ 的函数解析式是 ______
    answer: $y=\dfrac{100}{x}$
    clue: 设 $y=\dfrac{k}{x}$，由已知求 $k$。
    solution_steps:
    - $400=\dfrac{k}{0.25}$，$k=100$，$y=\dfrac{100}{x}$。
    source_solution_images: []
