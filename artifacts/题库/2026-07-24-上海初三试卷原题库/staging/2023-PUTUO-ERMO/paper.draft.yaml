      start_anchor: 设当 $x > 200$ 时，$y$ 与 $x$ 之间的函数解析式
      end_anchor: $40$ 元
    block:
      stem_latex: 购物节 $A,B$ 两店促销：$A$ 店超过200元部分打 $a$ 折（$y$ 与 $x$ 关系如图，过 $(200,200),(600,440)$）；$B$
        店全场七折。（1）$A$ 店超200元时求 $y$ 与 $x$ 解析式；（2）求 $a$；（3）$A$ 店单价比 $B$ 店贵1元，相同数量优盘 $A$
        店实付800元、$B$ 店819元，求 $A$ 店优盘单价．
      answer: (1) $y=\dfrac35x+80$（$x>200$）；(2) $a=6$；(3) $40$ 元
      clue: (1) 待定系数；(2) 由折扣定义求 $a$；(3) 由两店实付反推商品总额与单价。
      solution_steps:
      - (1) 由 $(200,200),(600,440)$ 得 $y=\dfrac35x+80$（$x>200$）。
      - (2) $(600-200)\times\dfrac{a}{10}=440-200$，$a=6$。
      - (3) $A$ 店 $y=800\Rightarrow x=1200$；$B$ 店总额 $\dfrac{819}{0.7}=1170$；差额30元即单价差1元对应30个，$A$
        店单价 $\dfrac{1200}{30}=40$ 元。
