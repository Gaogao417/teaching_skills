    block:
      stem_latex: 如图，四边形 $ABCD$ 中 $AB\parallel CD$，$\angle BAD=90\degree$，对角线 $AC,BD$
        交于 $O$，$E$ 在 $BC$ 上，$AE\perp BD$ 于 $F$，$AB\cdot DC=BF\cdot BD$。（1）求证：四边形 $ABCD$
        是矩形；（2）（设 $OG\perp AC$ 于 $G$）求证：$EC=2GD$．
      answer: (1)(2) 见解析
      clue: (1) 证 $\triangle ABF\sim\triangle DBA$ 得 $AB^{2}=BF\cdot BD$，结合条件得 $AB=CD$；(2)
        证 $\triangle GOD\sim\triangle EAC$。
      solution_steps:
      - (1) $\angle BAE=\angle ADB\Rightarrow \triangle ABF\sim\triangle DBA\Rightarrow
        AB^{2}=BF\cdot BD$；又 $AB\cdot CD=BF\cdot BD\Rightarrow AB=CD$，平行且相等，$\angle
        BAD=90\degree$，故为矩形。
      - (2) 矩形中 $\angle ADB=\angle ACB$，$OG\perp AC,\ AE\perp BD\Rightarrow \angle
        GOD=\angle EAC$，$\triangle GOD\sim\triangle EAC$，$\dfrac{GD}{EC}=\dfrac{DO}{AC}=\dfrac12$，$EC=2GD$。
