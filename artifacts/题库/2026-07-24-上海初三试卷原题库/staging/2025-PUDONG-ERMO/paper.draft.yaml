    block:
      stem_latex: 解方程：$\dfrac{4x}{x^{2}-9}-1=\dfrac{2}{x+3}-\dfrac{2}{x-3}$
      solution_steps:
      - 去分母乘 $x^2-9$：$4x-(x^2-9)=2(x-3)-2(x+3)$。
      - $-x^2+4x+21=0$，$x^2-4x-21=0$，$(x-7)(x+3)=0$。
      - $x=7$ 或 $x=-3$（增根舍去），$\therefore x=7$。
      clue: 分式方程去分母+检验增根。
      answer: $x=7$
