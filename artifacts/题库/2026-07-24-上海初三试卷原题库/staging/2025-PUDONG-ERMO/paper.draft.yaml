      solution_steps:
      - (1) $y=-\frac{1}{6}(x-6)^2+6=-\frac{1}{6}x^2+2x$。
      - (2) $D(6+m,6-n)$，$n=\frac{1}{6}m^2$。
      - ① $AB=AD$，$m^2+n^2=36$，$n=3\sqrt{5}-3$，$\sin\angle DAE=\frac{n}{6}=\frac{\sqrt{5}-1}{2}$。
      - ② $n^2=m(m+6)$，$(\frac{m^2}{6})^2=m(m+6)$，$m^3-36m=216$。
      clue: 二次函数+平移+中垂线+相似三角形。
      answer: (1) $y=-\dfrac{1}{6}x^2+2x$；(2)① $\sin\angle DAE=\dfrac{\sqrt{5}-1}{2}$；② $m^3-36m=216$
