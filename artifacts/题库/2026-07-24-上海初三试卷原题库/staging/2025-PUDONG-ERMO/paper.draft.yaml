        抛物线 $C_1$ 顶点 $A(6,6)$ 过原点，$y=6$ 交 $y$ 轴于 $B$。
        (1) 求 $C_1$ 表达式；
        (2) 右移 $m$ 下移 $n$ 得 $C_2$，顶点 $D$ 在 $C_1$ 上。
