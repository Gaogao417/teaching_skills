    stem_latex: '正方形 $ABCD$，$E$ 在 $AB$ 上，$F$ 在 $CD$ 上，$AF=CE$。$BD$ 交 $EC$ 于 $M$、交 $AF$ 于 $N$。

      (1) 求证：四边形 $AMCN$ 是菱形；

      (2) $CP\perp CE$ 交 $BD$ 延长线于 $P$，$CM^2=MN\cdot NB$，求证 $\frac{NC}{NP}=\frac{PD}{PC}$。'
    solution_steps:
    - (1) $\triangle BEC\cong\triangle DFA$（HL），$AE=CF$，$AECF$ 为平行四边形。
    - $\triangle CBM\cong\triangle ADN$（ASA），$CM=AN$，$AC\perp MN$，菱形。
    - (2) $\triangle CNM\sim\triangle BNC$，$\angle NCM=45^{\circ}$，$\triangle NCD\sim\triangle NPC$，$CD=DP$。
    clue: 正方形+全等+菱形判定+相似三角形。
