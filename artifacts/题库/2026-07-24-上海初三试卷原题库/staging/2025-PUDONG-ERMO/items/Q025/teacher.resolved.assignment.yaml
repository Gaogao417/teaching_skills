  - type: problem
    id: Q025
    points: 14
    stem_latex: '$AB$、$CD$ 是 $\odot O$（半径2）的两条直径，$P$ 在 $BA$ 延长线上，$PC$ 交 $\odot O$ 于 $E$。

      (1) $PC=PO$ 时求证 $CO^2=CE\cdot CP$；

      (2) 连 $DE$ 交 $OA$ 于 $M$，$PA=2$。

      ① $M$ 是 $\triangle PCD$ 重心，求 $\cos\angle BOC$；

      ② $\triangle BDE$ 为等腰三角形，求 $PE$。'
    solution_steps:
    - (1) $\triangle POC\sim\triangle OEC$，$CO^2=CE\cdot CP$。
    - (2)① $\cos\angle BOC=\frac{1}{4}$。
    - ② 分 $ED=BE$ 和 $DE=DB$ 两种情况：$PE=\sqrt{6}$ 或 $2\sqrt{2}$。
    clue: 圆综合+相似三角形+重心+等腰三角形分类讨论。
    answer: (1) 证明见详解；(2)① $\cos\angle BOC=\dfrac{1}{4}$；② $PE=\sqrt{6}$ 或 $2\sqrt{2}$
