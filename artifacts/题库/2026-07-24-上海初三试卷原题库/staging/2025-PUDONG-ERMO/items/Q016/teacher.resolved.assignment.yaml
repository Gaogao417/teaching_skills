  - type: short_answer
    id: Q016
    points: 4
    stem_latex: $\triangle ABC$ 中 $D$ 在 $AB$ 上，$\angle ACD=\angle B$，$AD=2$，$AC=\sqrt{6}$，$\overrightarrow{BA}=\vec{a}$，$\overrightarrow{BC}=\vec{b}$，$\overrightarrow{CD}=$______
    answer: $\dfrac{1}{3}\vec{a}-\vec{b}$
    clue: $\triangle ACD\sim\triangle ABC$，$AB=3$，$BD=\frac{1}{3}AB$。
    solution_steps:
    - $AC^2=AD\cdot AB$，$AB=3$，$BD=1=\frac{1}{3}AB$。
    - $\overrightarrow{CD}=\overrightarrow{BD}-\overrightarrow{BC}=\frac{1}{3}\vec{a}-\vec{b}$。
