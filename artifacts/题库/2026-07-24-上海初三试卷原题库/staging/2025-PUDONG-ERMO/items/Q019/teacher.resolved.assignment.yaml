    stem_latex: 计算：$\left|\sqrt{3}-2\right|+\left(\pi-2025\right)^{0}-\sqrt{9}+\dfrac{1}{2-\sqrt{3}}$
    solution_steps:
    - $|\sqrt{3}-2|=2-\sqrt{3}$
    - $(\pi-2025)^0=1$
    - $\sqrt{9}=3$
    - $\frac{1}{2-\sqrt{3}}=2+\sqrt{3}$
    - 原式 $=2-\sqrt{3}+1-3+2+\sqrt{3}=2$
    clue: 绝对值+零指数幂+算术平方根+分母有理化。
    answer: '2'
