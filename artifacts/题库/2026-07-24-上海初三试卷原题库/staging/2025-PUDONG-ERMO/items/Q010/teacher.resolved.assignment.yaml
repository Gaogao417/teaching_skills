    stem_latex: 方程 $\sqrt{15-2x}=-x$ 的解是______
    answer: $x=-5$
    clue: 平方后检验增根。
    solution_steps:
    - $15-2x=x^2$，$x^2+2x-15=0$，$x=-5$（$x=3$ 增根）。
