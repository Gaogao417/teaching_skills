  - id: Q022
    source_key: 2025-CHONGMING-YIMO-Q22
    question_number: 22
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [解直角三角形, 俯角, 测高]
    stem_latex: '九年级数学活动小组用航拍无人机进行测高实践。如图，无人机从地面 $AB$ 的中点 $C$ 处竖直上升20米到达 $D$ 处，测得实验楼顶部 $E$ 的俯角为 $55^\circ$，综合楼顶部 $F$ 的俯角为 $37^\circ$，已知实验楼 $BE$ 高度为8米，且图中点 $A$、$B$、$C$、$D$、$E$、$F$ 在同一平面内，求综合楼 $AF$ 的高度。（参考数据：$\sin37^\circ\approx0.60$，$\cos37^\circ\approx0.80$，$\tan37^\circ\approx0.75$；$\sin55^\circ\approx0.82$，$\cos55^\circ\approx0.57$，$\cot55^\circ\approx0.70$，精确到0.1米。）'
    answer: '约13.7米。'
    official_solution_latex:
      - title: 解
        content: '作 $DM\perp AF$，$DN\perp BE$，垂足为 $M$、$N$。由题意，$\angle MDF=37^\circ$，$\angle NDE=55^\circ$，$AM=CD=BN=20$米，$DM=DN$，$BE=8$米，所以 $EN=12$米。在 $\mathrm{Rt}\triangle DEN$ 中，$DN=12\cot55^\circ\approx8.4$米。在 $\mathrm{Rt}\triangle DMF$ 中，$MF=8.4\tan37^\circ\approx6.3$米，所以 $AF=AM-MF\approx13.7$米。'
    question_crops: [{source: documents/初三/2025届-上海市崇明区-初三一模数学-试卷及参考答案/005.png, box: [140, 160, 950, 710], file: source-question.png}]
