  - id: Q020
    source_key: 2025-CHONGMING-YIMO-Q20
    question_number: 20
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [二次函数, 图像平移, 锐角三角比]
    stem_latex: |
      已知抛物线 $y=x^2-2x-3$ 的顶点为 $P$，与 $y$ 轴相交于点 $Q$。
      \begin{enumerate}
      \item 求点 $P$、$Q$ 的坐标；
      \item 将该二次函数图像向上平移，使平移后所得图像经过坐标原点，与 $x$ 轴的另一个交点为 $M$，求 $\sin\angle OMQ$ 的值。
      \end{enumerate}
    answer: '（1）$P(1,-4)$，$Q(0,-3)$；（2）$\dfrac{3\sqrt{13}}{13}$。'
    official_solution_latex:
      - title: 第（1）问
        content: '$y=(x-1)^2-4$，所以 $P(1,-4)$；令 $x=0$，得 $y=-3$，所以 $Q(0,-3)$。'
      - title: 第（2）问
        content: '设平移后解析式为 $y=x^2-2x+m$，代入 $(0,0)$ 得 $m=0$，故 $y=x(x-2)$，另一交点 $M(2,0)$。$OM=2$，$OQ=3$，在 $\mathrm{Rt}\triangle OMQ$ 中，$QM=\sqrt{13}$，所以 $\sin\angle OMQ=\dfrac{OQ}{QM}=\dfrac{3\sqrt{13}}{13}$。'
    question_crops: [{source: documents/初三/2025届-上海市崇明区-初三一模数学-试卷及参考答案/004.png, box: [140, 430, 950, 810], file: source-question.png}]
    solution_crops: [{source: documents/初三/2025届-上海市崇明区-初三一模数学-试卷及参考答案/008.png, box: [140, 750, 950, 1400], file: official-solution-01.png}]

  - id: Q021
    source_key: 2025-CHONGMING-YIMO-Q21
    question_number: 21
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [梯形, 相似三角形, 平面向量]
    stem_latex: |
      如图，四边形 $ABCD$ 中，$AD\parallel BC$，$AC$ 与 $BD$ 相交于点 $O$，$BO=16$，$DO=8$，$AO=5$。
      \begin{enumerate}
      \item 求 $CO$ 的长；
      \item 设 $\overrightarrow{BA}=\vec a$，$\overrightarrow{BC}=\vec b$，试用 $\vec a$、$\vec b$ 表示 $\overrightarrow{CO}$。
      \end{enumerate}
    answer: '（1）$CO=10$；（2）$\overrightarrow{CO}=\dfrac23\vec a-\dfrac23\vec b$。'
    official_solution_latex:
      - title: 第（1）问
        content: '$\because AD\parallel BC$，$\therefore\dfrac{AO}{CO}=\dfrac{DO}{BO}$。由 $AO=5$，$DO=8$，$BO=16$，得 $\dfrac5{CO}=\dfrac8{16}$，所以 $CO=10$。'
      - title: 第（2）问
        content: '$CO=2AO$，所以 $CO=\dfrac23CA$，且 $\overrightarrow{CO}$ 与 $\overrightarrow{CA}$ 同向，故 $\overrightarrow{CO}=\dfrac23\overrightarrow{CA}$。又 $\overrightarrow{CA}=\overrightarrow{BA}-\overrightarrow{BC}=\vec a-\vec b$，所以 $\overrightarrow{CO}=\dfrac23\vec a-\dfrac23\vec b$。'
    question_crops: [{source: documents/初三/2025届-上海市崇明区-初三一模数学-试卷及参考答案/004.png, box: [140, 800, 950, 1380], file: source-question.png}]
