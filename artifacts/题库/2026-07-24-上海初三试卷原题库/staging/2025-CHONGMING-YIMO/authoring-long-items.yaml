  - id: Q019
    source_key: 2025-CHONGMING-YIMO-Q19
    question_number: 19
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: foundation
    skill_tags: [特殊角三角比, 实数运算]
    stem_latex: '计算：$\tan^260^\circ+\dfrac{\cot45^\circ-\cos30^\circ}{2\sin30^\circ}$。'
    answer: '$4-\dfrac{\sqrt3}{2}$'
    official_solution_latex:
      - title: 解
        content: '原式$=(\sqrt3)^2+\dfrac{1-\frac{\sqrt3}{2}}{2\times\frac12}=4-\dfrac{\sqrt3}{2}$。'
    question_crops: [{source: documents/初三/2025届-上海市崇明区-初三一模数学-试卷及参考答案/004.png, box: [140, 180, 950, 430], file: source-question.png}]
