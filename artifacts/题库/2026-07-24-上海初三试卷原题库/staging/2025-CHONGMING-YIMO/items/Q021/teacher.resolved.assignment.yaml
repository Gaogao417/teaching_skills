  - type: problem
    id: Q021
    points: 10
    stem_latex: '如图，四边形 $ABCD$ 中，$AD\parallel BC$，$AC$ 与 $BD$ 相交于点 $O$，$BO=16$，$DO=8$，$AO=5$。

      \begin{enumerate}

      \item 求 $CO$ 的长；

      \item 设 $\overrightarrow{BA}=\vec a$，$\overrightarrow{BC}=\vec b$，试用 $\vec a$、$\vec b$ 表示 $\overrightarrow{CO}$。

      \end{enumerate}

      '
    answer: （1）$CO=10$；（2）$\overrightarrow{CO}=\dfrac23\vec a-\dfrac23\vec b$。
    solution_steps:
    - title: 第（1）问
      content: $\because AD\parallel BC$，$\therefore\dfrac{AO}{CO}=\dfrac{DO}{BO}$。由 $AO=5$，$DO=8$，$BO=16$，得 $\dfrac5{CO}=\dfrac8{16}$，所以 $CO=10$。
    - title: 第（2）问
      content: $CO=2AO$，所以 $CO=\dfrac23CA$，且 $\overrightarrow{CO}$ 与 $\overrightarrow{CA}$ 同向，故 $\overrightarrow{CO}=\dfrac23\overrightarrow{CA}$。又 $\overrightarrow{CA}=\overrightarrow{BA}-\overrightarrow{BC}=\vec a-\vec b$，所以 $\overrightarrow{CO}=\dfrac23\vec a-\dfrac23\vec b$。
