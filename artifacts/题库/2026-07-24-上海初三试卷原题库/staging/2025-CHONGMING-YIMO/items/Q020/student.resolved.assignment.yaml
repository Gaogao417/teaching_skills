    stem_latex: '已知抛物线 $y=x^2-2x-3$ 的顶点为 $P$，与 $y$ 轴相交于点 $Q$。

      \begin{enumerate}

      \item 求点 $P$、$Q$ 的坐标；

      \item 将该二次函数图像向上平移，使平移后所得图像经过坐标原点，与 $x$ 轴的另一个交点为 $M$，求 $\sin\angle OMQ$ 的值。

      \end{enumerate}

      '
