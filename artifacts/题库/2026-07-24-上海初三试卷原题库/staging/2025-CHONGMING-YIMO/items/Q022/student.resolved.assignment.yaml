    stem_latex: 九年级数学活动小组用航拍无人机进行测高实践。如图，无人机从地面 $AB$ 的中点 $C$ 处竖直上升20米到达 $D$ 处，测得实验楼顶部 $E$ 的俯角为 $55^\circ$，综合楼顶部 $F$ 的俯角为 $37^\circ$，已知实验楼 $BE$ 高度为8米，且图中点 $A$、$B$、$C$、$D$、$E$、$F$ 在同一平面内，求综合楼 $AF$ 的高度。（参考数据：$\sin37^\circ\approx0.60$，$\cos37^\circ\approx0.80$，$\tan37^\circ\approx0.75$；$\sin55^\circ\approx0.82$，$\cos55^\circ\approx0.57$，$\cot55^\circ\approx0.70$，精确到0.1米。）
