    stem_latex: '已知 $\mathrm{Rt}\triangle ABC$ 中，$\angle ACB=90^\circ$，$AC=6$，$BC=8$，$CD\perp AB$，垂足为 $D$，点 $F$ 是线段 $CD$ 上一点（不与 $C$、$D$ 重合），过点 $B$ 作 $BE\perp AF$ 交 $AF$ 的延长线于点 $E$，$AE$ 与 $BC$ 交于点 $H$，联结 $CE$。

      \begin{enumerate}

      \item 求证：$\dfrac{AH}{CH}=\dfrac{BH}{EH}$；

      \item 当 $CE\parallel AB$ 时，求 $CE$ 的长；

      \item 当 $\triangle CFH$ 是等腰三角形时，求 $CH$ 的长。

      \end{enumerate}

      '
