    stem_latex: 抛物线$y = ax^2 - 2ax - 4$与$x$轴交于$A$、$B$，与$y$轴交于$C$，$OB = OC$。（1）求表达式；（2）沿$CB$方向平移，$\triangle A^\prime BB^\prime$面积比$\triangle ABC$大3。①求新对称轴；②$P$在新抛物线上，$\angle PB^\prime B = \angle ACB$，求$P$坐标。
    solution_steps:
    - (1) $C(0,-4)$，$B(4,0)$，$a=\frac{1}{2}$，$y=\frac{1}{2}x^2-x-4$
    - (2)① $A(-2,0)$，$S_{\triangle ABC}=12$，$S_{\triangle A^\prime BB^\prime}=15$
    - 高$h=5$，$B^\prime(9,5)$，$A^\prime(3,5)$
    - 新抛物线$y=\frac{1}{2}x^2-6x+\frac{27}{2}$，对称轴$x=6$
    - ② $\tan\angle ACB=\frac{1}{2}$，设$P(a,\frac{1}{2}a^2-6a+\frac{27}{2})$
    - $\frac{PE}{B^\prime E}=\frac{1}{2}$，$a=2$，$P(2,\frac{17}{2})$
    clue: 二次函数综合：解析式、平移、面积、三角函数。
    answer: (1) $y=\dfrac{1}{2}x^2-x-4$; (2)① $x=6$; ② $P(2,\dfrac{17}{2})$
