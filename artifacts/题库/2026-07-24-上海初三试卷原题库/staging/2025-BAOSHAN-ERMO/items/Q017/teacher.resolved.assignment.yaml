    id: Q017
    points: 4
    stem_latex: 如图，梯形$ABCD$中，$AD \parallel BC$，$E$、$F$分别是边$BC$、$AD$上的点，且$AF = BE = \dfrac{1}{4}BC$，$FG \parallel AC$，交$BC$的延长线于点$G$，$EF$与$AC$交于点$H$，如果$AC - AB = a$，那么四边形$CGFH$与四边形$ABEH$周长的差是______（结果用含$a$的代数式表示）
    answer: $\dfrac{3}{2}a$
    clue: 利用平行四边形和相似三角形转化周长差。
    solution_steps:
    - 利用平行四边形和相似三角形转化周长差。
