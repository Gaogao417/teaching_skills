    id: Q013
    points: 4
    stem_latex: 已知正比例函数$y=\left(1-\dfrac{k}{2}\right)x$，$y$的值随$x$的值增大而减小，那么$k$的值可以是______（写出一个符合题意的$k$的值即可）
    answer: 3（答案不唯一，k>2即可）
    clue: y随x增大而减小，则1-k/2<0，即k>2。
