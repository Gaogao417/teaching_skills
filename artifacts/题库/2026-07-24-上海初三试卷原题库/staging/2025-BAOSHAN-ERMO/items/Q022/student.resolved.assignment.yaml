    stem_latex: 【问题】$\triangle ABC$中$\angle ACB=90\degree$，$AC=3$，$BC=4$，$D$在$AB$上，$AD=\frac{1}{3}AB$，求$CD$。【发现】坐标法：$D(\frac{4}{3},2)$，$CD=\frac{2\sqrt{13}}{3}$。【运用】$AC=8$，$BC=6$，$CD=3$，$CE=4$，$AM=\frac{1}{4}AB$，$DN=\frac{1}{2}DE$，求$MN$。
