    id: Q018
    points: 4
    stem_latex: '如图，平行四边形$ABCD$，$AB = 2BC$，对角线$AC \perp BC$，将$\triangle ABC$绕点$B$旋转，使得点$A$落在直线$CD$上的点$A^\prime$处，那么$S_{\triangle A^\prime BC} : S_{\triangle ABC}$的值是______'
    answer: $\dfrac{\sqrt{13} \pm 1}{4}$
    clue: 以B为圆心画圆确定A'位置，相似和勾股定理分两种情况。
