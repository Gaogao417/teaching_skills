    stem_latex: 如图，将宽均为1的两张矩形纸片，交叉放置，形成的锐角为$\alpha(0<\alpha<90^{\circ})$，那么重叠部分（阴影部分）的周长是______（结果用含$\alpha$的三角比的代数式表示）
    answer: $\dfrac{4}{\sin\alpha}$
    clue: 重叠部分是菱形，边长用解直角三角形求出。
