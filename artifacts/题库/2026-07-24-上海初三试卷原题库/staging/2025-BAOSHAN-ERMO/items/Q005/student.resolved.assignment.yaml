    stem_latex: 《孙子算经》中有一道题：用一根绳子去量一根木头的长，绳子还剩余4.5尺；将绳子对折再量木头，则木头还剩余1尺，问木头长多少尺？如果设木头长为x尺，那么下列方程正确的是（\quad）
    choices:
    - $0.5(x-4.5)=x+1$
    - $0.5(x+4.5)=x-1$
    - $x+4.5=2x-1$
    - $x-4.5=2x+1$
