    stem_latex: 计算：$(-\sqrt{2})^2 + \left(-\dfrac{1}{3}\right)^{-1} + |1 - \sqrt{3}| - 2\sin 60\degree$
    solution_steps:
    - 原式 $= 2 + (-3) + (\sqrt{3} - 1) - 2 \times \dfrac{\sqrt{3}}{2}$
    - $= -1 + \sqrt{3} - 1 - \sqrt{3}$
    - $= -2$
    clue: 负整数指数幂、绝对值、特殊角三角函数值。
    answer: $-2$
