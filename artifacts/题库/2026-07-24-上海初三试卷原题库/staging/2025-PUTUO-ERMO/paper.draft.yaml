    block:
      stem_latex: 先化简 $\dfrac{4a}{a^2+a}-\dfrac{a-1}{a^2-1}$，再求 $a=\sqrt{3}$ 时的值。
      solution_steps:
      - $=\frac{4}{a+1}-\frac{1}{a+1}=\frac{3}{a+1}$。
      - $a=\sqrt{3}$ 代入：$\frac{3}{\sqrt{3}+1}=\frac{3\sqrt{3}-3}{2}$。
      clue: 分式化简+分母有理化。
      answer: $\dfrac{3}{a+1}$，代入得 $\dfrac{3\sqrt{3}-3}{2}$
