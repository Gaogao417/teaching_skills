  - type: problem
    id: Q024
    points: 12
    stem_latex: '抛物线 $y=ax^2+bx+3$（$a\neq0$）开口向下，过 $B(3,0)$、$C(0,3)$，对称轴 $x=1$。

      (1) ① 求表达式；② $\angle CPB=90^{\circ}$ 时求 $P$ 横坐标；

      (2) $P$ 关于 $BC$ 的对称点是 $\triangle AOC$ 重心 $G$，求 $a$。'
    solution_steps:
    - (1)① $a=-1$，$b=2$，$y=-x^2+2x+3$。
    - ② 以 $BC$ 为直径作圆交抛物线于 $P$，$m^2-m-1=0$，$m=\frac{\sqrt{5}+1}{2}$。
    - (2) $G(\frac{1}{3a},1)$，$GK=PK$，$m=2$，$a=\frac{-3-\sqrt{15}}{6}$。
    clue: 二次函数+圆周角定理+重心+对称点。
    answer: (1)① $y=-x^2+2x+3$；② $\dfrac{\sqrt{5}+1}{2}$；(2) $a=\dfrac{-3-\sqrt{15}}{6}$
