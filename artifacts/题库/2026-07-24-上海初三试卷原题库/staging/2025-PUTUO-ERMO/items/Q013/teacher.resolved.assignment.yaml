    stem_latex: $\square ABCD$ 中 $E$ 在 $DC$ 上 $DE=2EC$，$AE$ 延长交 $BC$ 延长线于 $F$。$\overrightarrow{BA}=\vec{a}$，$\overrightarrow{BC}=\vec{b}$，$\overrightarrow{EF}=$______
    answer: $-\dfrac{1}{3}\vec{a}+\dfrac{1}{2}\vec{b}$
    clue: $\triangle CEF\sim\triangle DEA$，$\overrightarrow{CF}=\frac{1}{2}\vec{b}$。
    solution_steps:
    - $\overrightarrow{CE}=-\frac{1}{3}\vec{a}$，$\overrightarrow{CF}=\frac{1}{2}\vec{b}$。
    - $\overrightarrow{EF}=-\frac{1}{3}\vec{a}+\frac{1}{2}\vec{b}$。
