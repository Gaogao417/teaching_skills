  - type: problem
    id: Q021
    points: 10
    stem_latex: '四边形 $ABCD$，$BD\perp DC$，$AB=2$，$AD=4$，$DC=\sqrt{5}$，$\cot\angle CBD=2$。

      (1) 求 $\tan\angle ADB$；

      (2) $AC$ 交 $BD$ 于 $O$，求 $BO$。'
    solution_steps:
    - (1) $BD=2\sqrt{5}$，$\angle A=90^{\circ}$，$\tan\angle ADB=\frac{1}{2}$。
    - (2) $BC=5$，$\angle ADB=\angle CBD$，$AD\parallel BC$，$\triangle ADO\sim\triangle CBO$。
    - $\frac{4}{5}=\frac{2\sqrt{5}-OB}{OB}$，$OB=\frac{10\sqrt{5}}{9}$。
    clue: 勾股定理+相似三角形。
    answer: (1) $\tan\angle ADB=\dfrac{1}{2}$；(2) $OB=\dfrac{10\sqrt{5}}{9}$
