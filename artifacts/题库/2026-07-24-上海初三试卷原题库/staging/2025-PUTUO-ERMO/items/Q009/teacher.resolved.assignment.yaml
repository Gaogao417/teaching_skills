    stem_latex: 方程 $\sqrt{3-2x} = x$ 的解是______
    answer: $x=1$
    clue: 平方后检验增根。
    solution_steps:
    - $3-2x=x^2$，$x^2+2x-3=0$，$x=1$（$x=-3$ 增根）。
