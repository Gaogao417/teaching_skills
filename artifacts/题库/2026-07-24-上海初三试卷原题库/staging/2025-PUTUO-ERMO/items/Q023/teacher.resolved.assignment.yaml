    id: Q023
    points: 12
    stem_latex: '平行四边形 $ABCD$，$DE\perp BC$ 延长线于 $E$，$BO\cdot BD=BC\cdot BE$。

      (1) 求证：菱形；

      (2) $AE\perp CD$，求证 $\frac{CF}{DE}=\frac{OC}{BO}$。'
    solution_steps:
    - (1) $\triangle BOC\sim\triangle BED$，$\angle BOC=90^{\circ}$，菱形。
    - (2) $\triangle CED\cong\triangle DFA$，$DE=AF$，$\triangle BOC\sim\triangle AFC$。
    clue: 相似三角形+菱形判定+全等。
    answer: 证明见详解
