    stem_latex: '借助函数知识平分/三等分线段 $MN$。

      (1) 三等分时借助函数 $y=$______；

      (2) 作出坐标为 $(\frac{4}{b}, \frac{2}{b})$ 的点 $Q$，写出画图步骤。'
    solution_steps:
    - (1) $y=\frac{1}{3}x$。
    - (2) 画 $y=\frac{4}{x}$ 和 $y=\frac{2}{x}$，过 $B$ 作垂线交两曲线于 $C$、$D$，转移坐标。
    clue: 正比例函数+反比例函数+尺规作图。
    answer: (1) $y=\dfrac{1}{3}x$；(2) 见详解
