    id: Q010
    points: 4
    stem_latex: 方程 $(x-1)^2 = a$ 有两个相等的实数根，$a=$______
    answer: '0'
    clue: $\Delta=4a=0$。
    solution_steps:
    - $x^2-2x+1-a=0$，$\Delta=4(1-a)-4+4a=4a=0$，$a=0$。
