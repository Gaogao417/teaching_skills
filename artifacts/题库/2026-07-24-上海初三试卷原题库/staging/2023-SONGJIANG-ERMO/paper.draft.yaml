        ______
      answer: $y=-x^{2}-2x$
      clue: 由系数和与对称轴相同列条件。
      solution_steps:
      - 设友好函数 $y=ax^{2}+bx$，$2+a=1\Rightarrow a=-1$；对称轴相同 $\dfrac{-b}{2(-1)}=-1\Rightarrow
        b=-2$，$y=-x^{2}-2x$。
