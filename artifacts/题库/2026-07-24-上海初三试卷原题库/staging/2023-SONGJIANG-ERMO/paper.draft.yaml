      - (2) $B(t,-1)$，旋转构造 $\triangle BEO\cong\triangle CDB\Rightarrow C(t+1,t-1)$，代入抛物线得
        $t=1$，$C(2,0)$。
      - (3) 由 $\angle BOD=45\degree$ 及等腰直角三角形性质得 $\dfrac{t-1}{1}=\dfrac1t$，$t=\dfrac{\sqrt5+1}{2}$。
