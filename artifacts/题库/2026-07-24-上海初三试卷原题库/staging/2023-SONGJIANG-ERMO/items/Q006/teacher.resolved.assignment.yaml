    stem_latex: 如图，点 $G$ 是 $\triangle ABC$ 的重心，四边形 $AEGD$ 与 $\triangle ABC$ 面积的比值是（\quad）
    choices:
    - $\dfrac{1}{2}$
    - $\dfrac{1}{3}$
    - $\dfrac{1}{4}$
    - $\dfrac{2}{5}$
    answer: B
    clue: 由中位线与重心比例求四边形面积。
    solution_steps:
    - $S_{\triangle ADE}=\dfrac14 S_{\triangle ABC}$，$S_{\triangle DEG}=\dfrac1{12}S_{\triangle ABC}$，$S_{AEGD}=\dfrac13 S_{\triangle ABC}$。
