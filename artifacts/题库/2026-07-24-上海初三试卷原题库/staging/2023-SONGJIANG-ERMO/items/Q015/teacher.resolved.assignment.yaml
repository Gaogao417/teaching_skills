    id: Q015
    points: 4
    stem_latex: 相交两圆半径分别为 $R$ 和 $r$，圆心距为6，且 $R=2r$，写出一个符合条件的 $r$ 的值 ______
    answer: $4$
    clue: 相交则 $R-r<d<R+r$，即 $r<6<3r$。
    solution_steps:
    - $2<r<6$，取 $r=4$（答案不唯一）。
