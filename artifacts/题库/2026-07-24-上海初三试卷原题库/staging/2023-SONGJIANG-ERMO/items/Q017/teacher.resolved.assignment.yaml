  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 平行四边形 $ABCD$ 中 $AB=4$，$\angle ABC$ 与 $\angle DCB$ 的角平分线交 $AD$ 于 $E,F$，且 $EF=3$，则边 $AD$ 的长为 ______
    answer: $5$ 或 $11$
    clue: 由角平分线 + 平行得等腰，分 $E,F$ 顺序两种情形。
    solution_steps:
    - $AE=AB=4$，$DF=CD=4$；$E,F$ 顺序排列时 $AD=4+3+4=11$，$F,E$ 顺序时 $AD=(4-3)+4=5$。
