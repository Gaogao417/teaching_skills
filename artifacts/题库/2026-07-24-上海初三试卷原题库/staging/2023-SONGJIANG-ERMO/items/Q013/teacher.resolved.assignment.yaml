    stem_latex: 抛物线 $y=x^{2}$ 向左平移1个单位，所得新抛物线的解析式为 ______
    answer: $y=(x+1)^{2}$
    clue: 左加右减，顶点由 $(0,0)$ 变 $(-1,0)$。
