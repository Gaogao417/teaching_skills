  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 如图，矩形 $ABCD$ 中，$E$ 在 $AD$ 上且 $AE=2ED$，设 $\vec{AB}=\vec{a}$，$\vec{BC}=\vec{b}$，那么 $\vec{BE}=$ ______（用 $\vec{a},\vec{b}$ 表示）
    answer: $-\vec{a}+\dfrac{2}{3}\vec{b}$
    clue: $\vec{BE}=\vec{BA}+\vec{AE}$，$\vec{AE}=\dfrac23\vec{AD}$。
    solution_steps:
    - $AE=\dfrac23AD=\dfrac23\vec{b}$，$\vec{BE}=-\vec{a}+\dfrac23\vec{b}$。
