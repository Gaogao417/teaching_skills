  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，正方形 $ABCD$，$E,F$ 分别为 $CD,AD$ 中点，$AE$ 与 $BF$ 交于 $M$，$DN\perp AE$ 于 $N$。（1）求证：$AM=MN$；（2）求 $\sin\angle MBE$．
    answer: (1) 见解析；(2) $\dfrac{3}{5}$
    clue: (1) 证 $\triangle ABF\cong\triangle DAE$ 得 $AM\perp BF$，结合 $FM\parallel DN$；(2) 由 $\tan\angle DAE=\dfrac12$ 及勾股求边长比。
    solution_steps:
    - (1) $\triangle ABF\cong\triangle DAE$（SAS）$\Rightarrow \angle DAE=\angle ABF\Rightarrow AM\perp BF$；$FM\parallel DN$，$\dfrac{AF}{FD}=\dfrac{AM}{MN}=1\Rightarrow AM=MN$。
    - (2) 设 $NE=a$，$DN=2a$，$DE=\sqrt5a$，$ME=3a$，$BE=5a$，$\sin\angle MBE=\dfrac{ME}{BE}=\dfrac35$。
