  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases} x-2y-1=0 \\ x^{2}+2xy+y^{2}=4 \end{cases}$
    answer: $\begin{cases} x=\dfrac{5}{3} \\ y=\dfrac{1}{3} \end{cases}$ 或 $\begin{cases} x=-1 \\ y=-1 \end{cases}$
    clue: ②化为 $(x+y)^{2}=4$，拆为两个一次方程组。
    solution_steps:
    - $(x+y)^{2}=4\Rightarrow x+y=\pm2$，与 $x-2y-1=0$ 联立解得两组解。
