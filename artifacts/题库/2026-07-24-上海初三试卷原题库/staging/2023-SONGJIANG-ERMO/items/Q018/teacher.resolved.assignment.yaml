  blocks:
  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 规定：二次项系数之和为1、图像都过原点且对称轴相同的两个二次函数互为"友好函数"，那么 $y=2x^{2}+4x$ 的友好函数是 ______
    answer: $y=-x^{2}-2x$
    clue: 由系数和与对称轴相同列条件。
    solution_steps:
    - 设友好函数 $y=ax^{2}+bx$，$2+a=1\Rightarrow a=-1$；对称轴相同 $\dfrac{-b}{2(-1)}=-1\Rightarrow b=-2$，$y=-x^{2}-2x$。
    source_solution_images: []
