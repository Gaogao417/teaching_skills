  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 在反比例函数 $y=\dfrac{1}{x}$ 图像上有两点 $A(x_{1},y_{1})$、$B(x_{2},y_{2})$，如果 $0<x_{1}<x_{2}$，那么 $y_{1}$ ______ $y_{2}$
    answer: '>'
    clue: 反比例函数 $k>0$ 时在每个象限内 $y$ 随 $x$ 增大而减小。
    solution_steps:
    - $k=1>0$，$0<x_1<x_2\Rightarrow y_1>y_2$。
