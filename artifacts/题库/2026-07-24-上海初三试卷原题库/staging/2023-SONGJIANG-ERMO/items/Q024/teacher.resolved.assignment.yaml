  - type: problem
    id: Q024
    points: 12
    stem_latex: 直线 $y=-x+2$ 与 $y$ 轴交于 $A$，抛物线 $y=(x-t)^{2}-1$（$t>0$）顶点为 $B$。（1）若抛物线过 $A$，求解析式；（2）将 $OB$ 顺时针旋转90°到 $OC$，$C$ 在抛物线上，求 $C$；（3）$BD\parallel y$ 轴交直线于 $D$，当 $\angle BOD=45\degree$ 时求 $t$．
    answer: (1) $y=(x-\sqrt{3})^{2}-1$；(2) $C(2,0)$；(3) $t=\dfrac{\sqrt{5}+1}{2}$
    clue: (1) 代入 $A$ 求 $t$；(2) 由旋转构造全等求 $C$ 再代入；(3) 由 $\angle BOD=45\degree$ 列正切方程。
    solution_steps:
    - (1) $A(0,2)$，$2=t^{2}-1\Rightarrow t=\sqrt3$，$y=(x-\sqrt3)^{2}-1$。
    - (2) $B(t,-1)$，旋转构造 $\triangle BEO\cong\triangle CDB\Rightarrow C(t+1,t-1)$，代入抛物线得 $t=1$，$C(2,0)$。
    - (3) 由 $\angle BOD=45\degree$ 及等腰直角三角形性质得 $\dfrac{t-1}{1}=\dfrac1t$，$t=\dfrac{\sqrt5+1}{2}$。
