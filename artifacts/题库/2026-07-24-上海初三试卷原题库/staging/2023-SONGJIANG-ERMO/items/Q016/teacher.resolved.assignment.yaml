    stem_latex: 如图，客车与私家车相向而行，两车距离 $s$（千米）与时间 $x$（时）关系如图。私家车速度90千米/时、客车60千米/时，那么相遇点 $A$ 的坐标是 ______
    answer: $(4,0)$
    clue: 相遇时 $s=0$，由速度和求相遇时间。
    solution_steps:
