  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，四边形 $ABCD$ 中 $AD\parallel BC$，$AD\perp CD$，$AD=1$，$CD=2$。（1）若 $BC=3$，求 $\cot B$；（2）若 $AB=BC$，求四边形 $ABCD$ 面积．
    answer: (1) $1$；(2) $3.5$
    clue: (1) 构造矩形 $ADCE$，$\cot B=\dfrac{BE}{AE}$；(2) 设 $AB=BC=x$ 用勾股求 $x$ 再算面积。
    solution_steps:
    - (1) 矩形 $ADCE$，$CE=1,AE=2,BE=2$，$\cot B=\dfrac{2}{2}=1$。
    - (2) 设 $AB=BC=x$，$BE=x-1$，$x^{2}=(x-1)^{2}+4$，$x=2.5$；面积 $=\dfrac12\times2\times2.5+\dfrac12\times1\times2=3.5$。
