      start_anchor: 解：$\begin{cases} 4x^2 - y^2 = 15$
      end_anchor: $\begin{cases} x = 2 \\ y = -1 \end{cases}$
    block:
      stem_latex: 解方程组：$\begin{cases} 4x^2 - y^2 = 15 \\ 2x - y = 5 \end{cases}$．
      answer: $\begin{cases} x=2 \\ y=-1 \end{cases}$
      clue: 把 $4x^2-y^2$ 因式分解，与 $2x-y=5$ 联立求 $2x+y$。
      solution_steps:
      - 由① $(2x+y)(2x-y)=15$，将② $2x-y=5$ 代入得 $2x+y=3$ ③。
      - ②+③得 $4x=8$，$x=2$；②-③得 $-2y=2$，$y=-1$。
      - $\therefore \begin{cases} x=2 \\ y=-1 \end{cases}$。
