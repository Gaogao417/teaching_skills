        $y$ 取 $-1,4,-2,-1$。那么这个点是（\quad）
      choices:
      - $\left(-2,-1\right)$
      - $\left(-\dfrac{1}{2},4\right)$
      - $\left(1,-2\right)$
      - $\left(2,-1\right)$
      answer: A
      clue: 反比例函数图象上点的横纵坐标乘积为常数，逐一验算。
      solution_steps:
      - $\left(-2\right)\times\left(-1\right)=2$，$\left(-\dfrac{1}{2}\right)\times4=-2$，$\left(-2\right)\times1=-2$，$2\times\left(-1\right)=-2$。
      - $\left(-\dfrac{1}{2},4\right)$、$\left(1,-2\right)$、$\left(2,-1\right)$ 横纵坐标乘积相同，在同一反比例函数图象上。
      - 点 $\left(-2,-1\right)$ 乘积为 $2$，不在该图象上。
