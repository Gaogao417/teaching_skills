      end_anchor: $2\sqrt{2}-\dfrac{1}{2}$
    block:
      stem_latex: 计算：$\left(\dfrac{8}{27}\right)^{-\frac{1}{3}} - |\sqrt{2} - 3| +
        \dfrac{1}{2\sin 45\degree - 1}$．
      answer: $2\sqrt{2}-\dfrac{1}{2}$
      clue: 分数指数幂化简、绝对值去括号、分母有理化，逐项计算。
      solution_steps:
      - 原式 $=\dfrac{3}{2}-(3-\sqrt{2})+\dfrac{1}{2\times\dfrac{\sqrt{2}}{2}-1}$
      - $=\dfrac{3}{2}-3+\sqrt{2}+\dfrac{1}{\sqrt{2}-1}$
      - $=\dfrac{3}{2}-3+\sqrt{2}+\dfrac{\sqrt{2}+1}{(\sqrt{2}-1)(\sqrt{2}+1)}$
      - $=\dfrac{3}{2}-3+\sqrt{2}+\sqrt{2}+1$
      - $=2\sqrt{2}-\dfrac{1}{2}$
