      stem_latex: 某校开设了 $A$、$B$、$C$、$D$、$E$ 五类兴趣课，为了解学生喜爱情况，从全校500名学生中随机抽取若干名进行"你最喜爱的兴趣课"问卷调查（每人选一类）。根据调查结果绘制出条形统计图和扇形统计图（均尚未完成）。（1）求本次问卷调查中最喜欢
        $E$ 类课程的学生人数，并补全相应的条形图；（2）估计该校全体学生中最喜欢 $D$ 类兴趣课的人数．
      answer: (1) 最喜欢 $E$ 类5名；(2) 约140名
      clue: 由 $A$ 类人数与百分比求样本总量，再求各部分人数并用样本比例估计总体。
      solution_steps:
      - (1) $20\div40\%=50$（人）。
      - 最喜欢 $B$ 类：$50\times12\%=6$（人）；最喜欢 $E$ 类：$50\times10\%=5$（人）；最喜欢 $D$ 类：$50-5-20-6-5=14$（人）。
      - 补全条形图（图略）。
      - (2) $500\times\dfrac{14}{50}=140$（人）。
