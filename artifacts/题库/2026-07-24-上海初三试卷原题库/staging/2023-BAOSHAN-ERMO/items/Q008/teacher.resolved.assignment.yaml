    stem_latex: 分解因式：$-2x^2+8=$ ________．
    answer: $-2\left(x+2\right)\left(x-2\right)$
    clue: 先提公因式 $-2$，再用平方差公式。
    solution_steps:
    - $-2x^2+8=-2\left(x^2-4\right)=-2\left(x+2\right)\left(x-2\right)$。
