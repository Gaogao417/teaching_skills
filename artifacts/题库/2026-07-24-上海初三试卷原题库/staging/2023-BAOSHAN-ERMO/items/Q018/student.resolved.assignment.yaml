    stem_latex: 如果一个三角形的两个内角 $\alpha$ 与 $\beta$ 满足 $2\alpha+\beta=90\degree$，那么称这样的三角形为“倍角互余三角形”。已知在 Rt$\triangle ABC$ 中，$\angle ACB=90\degree$，$AC=4$，$BC=5$，点 $D$ 在边 $BC$ 上，且 $\triangle ABD$ 是“倍角互余三角形”，那么 $BD$ 的长等于 ________．
