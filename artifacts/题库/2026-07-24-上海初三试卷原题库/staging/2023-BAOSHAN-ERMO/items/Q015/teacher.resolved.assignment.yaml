  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 如图，在正五边形 $ABCDE$ 中，$F$ 是边 $BC$ 延长线上一点，连接 $AC$，那么 $\angle ACF$ 的度数为 ________．
    answer: $144\degree$
    clue: 正五边形内角 $108\degree$，等腰得 $\angle ACB=36\degree$，邻补角求 $\angle ACF$。
    solution_steps:
    - $\angle B=\dfrac{1}{5}(5-2)\times180\degree=108\degree$。
    - $\because AB=BC$，$\therefore \angle ACB=\dfrac{1}{2}(180\degree-108\degree)=36\degree$。
    - $\angle ACF=180\degree-\angle ACB=144\degree$。
