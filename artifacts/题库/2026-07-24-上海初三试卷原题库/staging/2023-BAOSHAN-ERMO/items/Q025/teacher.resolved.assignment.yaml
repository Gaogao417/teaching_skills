  - type: problem
    id: Q025
    points: 14
    stem_latex: 如图，已知半圆 $O$ 的直径 $AB=4$，$C$ 是圆外一点，$\angle ABC$ 的平分线交半圆 $O$ 于点 $D$，且 $\angle BCD=90\degree$，联结 $OC$ 交 $BD$ 于点 $E$．（1）当 $\angle ABC=45\degree$ 时，求 $OC$ 的长；（2）当 $\angle ABC=60\degree$ 时，求 $\dfrac{OE}{EC}$ 的值；（3）当 $\triangle BOE$ 为直角三角形时，求 $\sin\angle OCB$ 的值．
    answer: (1) $\sqrt{6}$；(2) $\dfrac{2}{3}$；(3) $\dfrac{\sqrt{2}}{2}$ 或 $\dfrac{\sqrt{5}-1}{2}$
    clue: 作 $OM\perp BC$ 构造矩形 $OMCD$；(1)(2) 解直角三角形；(3) 按 $\triangle BOE$ 的哪个角为直角分类讨论。
    solution_steps:
    - (1) 作 $OM\perp BC$ 于 $M$，连接 $OD$；$\angle BCD=90\degree$，$OM\parallel DC$。
    - $BD$ 平分 $\angle ABC$，$\angle ABD=\angle CBD$；$OD=OB$ 得 $\angle ABD=\angle ODB$，$\therefore \angle CBD=\angle ODB$，$OD\parallel BC$。
    - 四边形 $OMCD$ 是矩形，$CM=OD=OB=2$。
    - $\angle ABC=45\degree$，$\triangle OBM$ 等腰直角，$OM=BM=\sqrt{2}$。
    - $OC=\sqrt{CM^2+OM^2}=\sqrt{4+2}=\sqrt{6}$。
    - (2) 同理四边形 $OMCD$ 是矩形，$CM=2$；$\angle ABC=60\degree$，$\angle BOM=30\degree$，$BM=1$，$BC=3$。
    - $OD\parallel BC$，$\triangle DOE\sim\triangle BCE$，$\dfrac{OE}{EC}=\dfrac{OD}{BC}=\dfrac{2}{3}$。
    - (3) 当 $\angle OEB=90\degree$ 时，由垂径 $DE=BE$，$OE$ 为 $BD$ 的中垂线，$DC=BC$，$\angle DCO=\angle BCO=45\degree$，$\sin\angle OCB=\dfrac{\sqrt{2}}{2}$。
    - 当另一角为直角（$\angle EOB$ 情形）时，$\angle OCB=\angle BOM$，$\triangle OCB\sim\triangle BOM$。
    - $\dfrac{OC}{OB}=\dfrac{OB}{BM}$，解得 $BM=\sqrt{5}-1$，$BC=\sqrt{5}+1$，$\sin\angle OCB=\dfrac{OB}{BC}=\dfrac{2}{\sqrt{5}+1}=\dfrac{\sqrt{5}-1}{2}$。
    - 综上 $\sin\angle OCB=\dfrac{\sqrt{2}}{2}$ 或 $\dfrac{\sqrt{5}-1}{2}$。
