  - type: short_answer
    id: Q010
    points: 4
    stem_latex: 已知关于 $x$ 的方程 $x^2+2x-m=0$ 有两个相等的实数根，那么 $m=$ ________．
    answer: $-1$
    clue: 一元二次方程有两等根的条件是判别式 $\Delta=0$。
    solution_steps:
    - $\Delta=2^2-4\times1\times\left(-m\right)=0$，解得 $m=-1$。
