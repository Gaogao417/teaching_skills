  - type: choice
    id: Q001
    points: 4
    stem_latex: 下列运算正确的是（\quad）
    choices:
    - $a^2+a^3=a^6$
    - $a^2+a^3=a^5$
    - $a^2\cdot a^3=a^6$
    - $\left(a^3\right)^2=a^6$
    answer: D
    clue: 逐项验证幂的运算：合并同类项、同底数幂相乘、幂的乘方。
    solution_steps:
    - A、$a^2$ 与 $a^3$ 不是同类项，不能合并，错误。
    - B、同理不能合并，错误。
    - C、$a^2\cdot a^3=a^{2+3}=a^5$，错误。
    - D、$\left(a^3\right)^2=a^6$，正确。
