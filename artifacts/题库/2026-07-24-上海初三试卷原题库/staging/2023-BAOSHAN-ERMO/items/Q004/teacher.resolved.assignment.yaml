  - type: choice
    id: Q004
    points: 4
    stem_latex: 已知点 $D$、$E$ 分别在 $\triangle ABC$ 的边 $CA$、$BA$ 的延长线上，$DE\parallel BC$，$DE:BC=1:3$，设 $\vec{DA}=\vec{a}$，那么 $\vec{CD}$ 用向量 $\vec{a}$ 表示为（\quad）
    choices:
    - $3\vec{a}$
    - $-3\vec{a}$
    - $4\vec{a}$
    - $-4\vec{a}$
    answer: D
    clue: 由平行得相似三角形，对应边成比例求 $AD:AC$，再用向量方向判断符号。
    solution_steps:
    - $\because DE\parallel BC$，$\therefore \triangle ADE\sim\triangle ACB$。
    - $\dfrac{AD}{AC}=\dfrac{DE}{BC}=\dfrac{1}{3}$，$\therefore AC=3AD$，$CD=4AD$。
    - $\because \vec{DA}=\vec{a}$，$\therefore \vec{CD}=-4\vec{a}$。
    source_solution_images: []
