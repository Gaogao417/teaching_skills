  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 已知一次函数 $y=3x+m$ 的图像经过点 $(-1,1)$，那么 $m=$ ________．
    answer: $4$
    clue: 将点的坐标代入解析式求待定系数。
    solution_steps:
    - $\because$ 图像过 $(-1,1)$，$\therefore -1\times3+m=1$。
    - 解得 $m=4$。
