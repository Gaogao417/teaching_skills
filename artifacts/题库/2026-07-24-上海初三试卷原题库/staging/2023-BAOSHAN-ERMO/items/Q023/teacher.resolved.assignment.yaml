  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，四边形 $ABCD$ 中，$AD\parallel BC$，$AC$、$BD$ 交于点 $O$，$OB=OC$。（1）求证：$AB=CD$；（2）$E$ 是边 $BC$ 上一点，连接 $DE$ 交 $AC$ 于点 $F$，如果 $AO^2=OF\cdot OC$，求证：四边形 $ABED$ 是平行四边形．
    answer: (1)(2) 见解析
    clue: (1) 由平行+等腰得 $OA=OD$，再证 $\triangle ACB\cong\triangle DBC$；(2) 由比例式证 $\triangle AOB\sim\triangle FOD$ 得 $DE\parallel AB$。
    solution_steps:
    - (1) $\because OB=OC$，$\therefore \angle OBC=\angle OCB$。
    - $\because AD\parallel BC$，$\therefore \angle DAO=\angle OCB$，$\angle ADO=\angle OBC$。
    - $\therefore \angle DAO=\angle ADO$，$OA=OD$，$AC=BD$。
    - 在 $\triangle ACB$ 和 $\triangle DBC$ 中，$AC=BD$，$\angle ACB=\angle DBC$，$BC=CB$，$\triangle ACB\cong\triangle DBC$（SAS）。
    - $\therefore AB=CD$。
    - (2) 由(1) $OA=OD$，$OB=OC$；$AO^2=OF\cdot OC$，$\therefore \dfrac{AO}{OF}=\dfrac{OC}{AO}=\dfrac{OB}{OD}$。
    - 又 $\angle AOB=\angle DOF$，$\therefore \triangle AOB\sim\triangle FOD$。
    - $\therefore \angle ABO=\angle ODF$，$DE\parallel AB$；又 $AD\parallel BC$，$\therefore$ 四边形 $ABED$ 是平行四边形。
