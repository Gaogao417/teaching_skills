  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 在平面直角坐标系中，若点 $P(x-3,x)$ 在第二象限，则 $x$ 的取值范围为 ________．
    answer: $0<x<3$
    clue: 第二象限点的横坐标为负、纵坐标为正，列不等式组求解。
    solution_steps:
    - 第二象限内点坐标：横坐标为负，纵坐标为正。
    - $\begin{cases} x-3<0 \\ x>0 \end{cases}$，解得 $0<x<3$。
    source_solution_images: []
