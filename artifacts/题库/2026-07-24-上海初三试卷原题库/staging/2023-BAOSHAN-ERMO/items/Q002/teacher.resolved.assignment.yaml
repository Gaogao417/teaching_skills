  - type: choice
    id: Q002
    points: 4
    stem_latex: 估计 $\sqrt{5}$ 的值在（\quad）
    choices:
    - 1和2之间
    - 2和3之间
    - 3和4之间
    - 4和5之间
    answer: B
    clue: 找与被开方数相邻的完全平方数，定位根号的取值区间。
    solution_steps:
    - $\because 4<5<9$，$\therefore 2<\sqrt{5}<3$。
    - $\therefore \sqrt{5}$ 的值在 2 和 3 之间。
