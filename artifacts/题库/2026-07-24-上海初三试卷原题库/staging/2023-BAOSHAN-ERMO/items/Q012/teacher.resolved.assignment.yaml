  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 一个不透明的袋子里装有3个白球和1个红球，这些小球除颜色外无其他差别，如果从袋子中随机摸出一个小球，那么摸出的小球是红球的概率是 ________．
    answer: $\dfrac{1}{4}$
    clue: 概率等于目标情况数除以总情况数。
    solution_steps:
    - 共有 $3+1=4$ 种等可能结果，其中红球1种。
    - $P=\dfrac{1}{4}$。
