  - type: choice
    id: Q003
    points: 4
    stem_latex: 如果一个三角形的两边长分别为 $5\text{cm}$、$10\text{cm}$，那么这个三角形的第三边的长可以是（\quad）
    choices:
    - $3\text{cm}$
    - $5\text{cm}$
    - $10\text{cm}$
    - $16\text{cm}$
    answer: C
    clue: 三角形第三边介于两边之差与两边之和之间。
    solution_steps:
    - 设第三边长为 $x\text{cm}$，则 $10-5<x<10+5$，即 $5<x<15$。
    - 选项 $10\text{cm}$ 满足条件。
