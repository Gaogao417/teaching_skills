  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，已知点 $E$ 在矩形 $ABCD$ 的边 $AD$ 上，且 $BC=EC=8$，$\angle ABE=15\degree$，那么 $AB$ 的长等于 ________．
    answer: $4$
    clue: 由等腰 $\triangle BCE$ 得 $\angle CED=30\degree$，含 $30\degree$ 角的直角三角形求 $CD=AB$。
    solution_steps:
    - $\because AD\parallel BC$，$\therefore \angle AEB=\angle EBC=90\degree-15\degree=75\degree$。
    - $\because BC=EC$，$\therefore \angle CEB=\angle EBC=75\degree$，$\angle CED=180\degree-75\degree-75\degree=30\degree$。
    - $CD=\dfrac{1}{2}CE=4$，$\therefore AB=CD=4$。
