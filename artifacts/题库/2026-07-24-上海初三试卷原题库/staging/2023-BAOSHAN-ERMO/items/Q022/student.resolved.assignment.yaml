    stem_latex: 一种牛奶包装盒（如图1），图2是其一个侧面的示意图，由盒身矩形 $BCDE$ 和房顶等腰三角形 $ABE$ 组成。已知 $BC=4.5$ 厘米，$CD=8$ 厘米，$AB=AE=5$ 厘米。（1）求房顶点 $A$ 到盒底边 $CD$ 的距离；（2）设计新造型，折线段 $ABC$ 的长度及矩形 $BCDE$ 的面积均不改变，且 $\sin\angle ABE=\dfrac{5}{13}$，$BC>CD$，求新造型盒身的高度（即 $BC$ 的长）．
