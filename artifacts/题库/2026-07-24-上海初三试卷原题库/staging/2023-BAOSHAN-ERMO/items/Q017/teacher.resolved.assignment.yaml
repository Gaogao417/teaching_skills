  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 如图，已知 $\triangle ABC$ 中，$\angle BAC=30\degree$，$\angle B=70\degree$，如果将 $\triangle ABC$ 绕点 $C$ 顺时针旋转到 $\triangle A'B'C$，使点 $B$ 的对应点 $B'$ 落在边 $AC$ 上，那么 $\angle AA'B'$ 的度数是 ________．
    answer: $20\degree$
    clue: 旋转对应角相等，等腰 $\triangle ACA'$ 求底角，再差求 $\angle AA'B'$。
    solution_steps:
    - $\angle ACB=180\degree-70\degree-30\degree=80\degree$。
    - 旋转得 $\angle B'A'C=\angle BAC=30\degree$，$\angle A'CA=\angle ACB=80\degree$，$A'C=AC$。
    - $\angle CAA'=\angle CA'A=\dfrac{1}{2}(180\degree-80\degree)=50\degree$。
    - $\angle AA'B'=\angle CA'A-\angle B'A'C=50\degree-30\degree=20\degree$。
