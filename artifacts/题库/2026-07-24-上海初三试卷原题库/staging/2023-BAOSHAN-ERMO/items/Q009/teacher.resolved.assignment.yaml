  - type: short_answer
    id: Q009
    points: 4
    stem_latex: 若分式 $\dfrac{1}{x-3}$ 有意义，则 $x$ 的取值范围是 ________．
    answer: $x\neq 3$
    clue: 分式有意义即分母不为零。
    solution_steps:
    - 分式有意义，则分母 $x-3\neq 0$，$\therefore x\neq 3$。
