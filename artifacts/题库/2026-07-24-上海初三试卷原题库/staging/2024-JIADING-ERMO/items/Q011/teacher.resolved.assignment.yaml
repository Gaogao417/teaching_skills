  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 用换元法解方程 $\dfrac{x}{x-1}+\dfrac{x-1}{x}=2$ 时，如果设 $\dfrac{x}{x-1}=y$，那么原方程可化为关于 $y$ 的整式方程是\u3000\u3000\u3000\u3000。
    answer: $y^2-2y+1=0$
    clue: $\dfrac{x-1}{x}=\dfrac{1}{y}$，$y+\dfrac{1}{y}=2$。
    solution_steps:
    - $y+\dfrac{1}{y}=2$，两边乘 $y$ 得 $y^2-2y+1=0$。
    source_solution_images: []
