  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases} x+2y=8 \\ x^2-xy-12y^2=0 \end{cases}$
    answer: $\begin{cases} x=\dfrac{16}{3} \\ y=\dfrac{4}{3} \end{cases}$ 或 $\begin{cases} x=24 \\ y=-8 \end{cases}$
    clue: ②因式分解 $(x-4y)(x+3y)=0$。
    solution_steps:
    - 由②$(x-4y)(x+3y)=0$，$x=4y$ 或 $x=-3y$。
    - $x=4y$ 代入①：$6y=8$，$y=\dfrac{4}{3}$，$x=\dfrac{16}{3}$。
    - $x=-3y$ 代入①：$-y=8$，$y=-8$，$x=24$。
