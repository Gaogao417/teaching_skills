    stem_latex: 如图，在 $\triangle ABC$ 中，线段 $AD$ 是边 $BC$ 上的中线，点 $E$ 是 $AD$ 的中点，设向量 $\overrightarrow{AB}=\vec{a}$，$\overrightarrow{BC}=\vec{b}$，那么向量 $\overrightarrow{AE}=$\u3000\u3000\u3000\u3000。
    answer: $\dfrac{1}{2}\vec{a}+\dfrac{1}{4}\vec{b}$
    clue: $\overrightarrow{AD}=\vec{a}+\dfrac{1}{2}\vec{b}$，$\overrightarrow{AE}=\dfrac{1}{2}\overrightarrow{AD}$。
    solution_steps:
    - $\overrightarrow{AD}=\vec{a}+\dfrac{1}{2}\vec{b}$，$\overrightarrow{AE}=\dfrac{1}{2}\vec{a}+\dfrac{1}{4}\vec{b}$。
