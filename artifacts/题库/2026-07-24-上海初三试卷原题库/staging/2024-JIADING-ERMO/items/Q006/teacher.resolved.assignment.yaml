    stem_latex: 在 $\triangle ABC$ 中，$AB=AC=8$，$\cos\angle B=\dfrac{1}{4}$，以点 $C$ 为圆心，半径为 $6$ 的圆记作 $\odot C$，那么下列说法正确的是（　　）
    choices:
    - 点 $A$ 在圆 $C$ 外，点 $B$ 在圆 $C$ 上
    - 点 $A$ 在圆 $C$ 上，点 $B$ 在圆 $C$ 内
    - 点 $A$ 在圆 $C$ 外，点 $B$ 在圆 $C$ 内
    - 点 $A$、$B$ 都在圆 $C$ 外
    answer: C
    clue: $BC=4<6$（$B$ 内），$AC=8>6$（$A$ 外）。
