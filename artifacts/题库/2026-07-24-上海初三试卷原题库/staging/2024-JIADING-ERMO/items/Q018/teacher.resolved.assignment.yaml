  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 定义：如果三角形有两个内角的差为 $90°$，那么这样的三角形叫做准直角三角形。已知在 $Rt\triangle ACB$ 中，$\angle C=90°$，$AC=4$，$AB=12$，如果点 $D$ 在边 $BC$ 上，且 $\triangle ADB$ 是准直角三角形，那么 $CD=$\u3000\u3000\u3000\u3000。
    answer: $\sqrt{2}$ 或 $2\sqrt{2}$
    clue: 分 $\angle ADB-\angle DAB=90°$ 和 $\angle ADB-\angle B=90°$ 两类讨论。
    solution_steps:
    - 情形一：$\angle DAB=\angle DBC$，$DC=\dfrac{1}{3}BD$，$DC=2\sqrt{2}$。
    - 情形二：$\angle B=\angle DAC$，$\triangle ACD\sim\triangle BCA$，$CD=\sqrt{2}$。
