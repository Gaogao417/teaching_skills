  - type: problem
    id: Q019
    points: 10
    stem_latex: 计算：$\sqrt{12}-\dfrac{2}{\sqrt{2}-1}+|2-\sqrt{3}|+8^{\frac{1}{2}}$
    answer: $\sqrt{3}$
    clue: 二次根式化简、分母有理化、绝对值、分数指数幂。
    solution_steps:
    - $\sqrt{12}=2\sqrt{3}$，$\dfrac{2}{\sqrt{2}-1}=2(\sqrt{2}+1)$，$|2-\sqrt{3}|=2-\sqrt{3}$，$8^{\frac{1}{2}}=2\sqrt{2}$。
    - 原式 $=2\sqrt{3}-2\sqrt{2}-2+2-\sqrt{3}+2\sqrt{2}=\sqrt{3}$。
