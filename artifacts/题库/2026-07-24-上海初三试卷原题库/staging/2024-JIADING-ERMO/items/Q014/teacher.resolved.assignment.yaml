    stem_latex: 从印有正方形、平行四边形、等边三角形、直角梯形、正六边形、圆的六张卡片中随机抽一张，恰好是中心对称图形的概率是\u3000\u3000\u3000\u3000。
    answer: $\dfrac{2}{3}$
    clue: 中心对称图形有正方形、平行四边形、正六边形、圆共 $4$ 个。
    solution_steps:
    - $P=\dfrac{4}{6}=\dfrac{2}{3}$。
