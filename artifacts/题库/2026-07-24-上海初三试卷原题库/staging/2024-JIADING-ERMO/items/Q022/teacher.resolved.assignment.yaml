  - type: problem
    id: Q022
    points: 10
    stem_latex: '某企业 $2022$ 年 $1$ 至 $3$ 月利润分别为 $96$、$?$、$100$ 万元。

      (1) 如果利润 $y$ 是月份数 $x$ 的一次函数，求 $2$ 月份利润；

      (2) 从 $3$ 月起经技术改革，$5$ 月份利润 $121$ 万元，若 $3$ 至 $5$ 月月增长率相等，求月平均增长率。'
    answer: (1) $98$ 万元；(2) $10\%$
    clue: (1) $y=2x+94$；(2) $100(1+x)^2=121$。
    solution_steps:
    - (1) $y=kx+b$，$\begin{cases}k+b=96\\3k+b=100\end{cases}$，$k=2,b=94$，$y(2)=98$。
    - (2) $100(1+x)^2=121$，$x=0.1=10\%$。
