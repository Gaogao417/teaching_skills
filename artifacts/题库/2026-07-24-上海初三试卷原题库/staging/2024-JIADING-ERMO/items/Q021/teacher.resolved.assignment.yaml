  - type: problem
    id: Q021
    points: 10
    stem_latex: '某东西方向海岸线上有 $A$、$B$ 两个码头，$AB=60$ 千米，船 $C$ 在附近航行。

      (1) 由 $A$ 测得 $C$ 在北偏东 $55°$，由 $B$ 测得 $C$ 在北偏西 $35°$，求 $AC$（保留 $3$ 位有效数字）；（参考数据 $\cos35°\approx0.8192$）

      (2) 由 $A$ 测得 $C$ 在北偏东 $30°$，由 $B$ 测得 $C$ 在北偏西 $15°$，$CH\perp AB$，求 $CH$（保留根号）。'
    answer: (1) $AC\approx49.2$ 千米；(2) $CH=15\sqrt{3}+45$ 千米
    clue: (1) $\angle ACB=90°$；(2) 过 $B$ 作 $BG\perp AC$，$\angle ACB=45°$。
    solution_steps:
    - (1) $\angle ACB=90°$，$AC=AB\cos35°\approx49.2$ 千米。
    - (2) $GB=30\sqrt{3}$，$AG=30$，$\angle ACB=45°$，$GC=30\sqrt{3}$，$AC=30+30\sqrt{3}$。
    - $CH=AC\sin60°=(30+30\sqrt{3})\times\dfrac{\sqrt{3}}{2}=15\sqrt{3}+45$。
