  - type: problem
    id: Q020
    points: 10
    stem_latex: 如图，已知在 $\triangle ABC$ 中，$BC=18$，点 $D$ 在边 $BC$ 上，$DE\parallel AB$，$9DE=4AB$。（1）求 $BD$ 的长；（2）联结 $AD$，设 $\overrightarrow{AB}=\vec a,\ \overrightarrow{AC}=\vec b$，试用 $\vec a,\vec b$ 表示 $\overrightarrow{AD}$。
    answer: （1）10；（2）$\overrightarrow{AD}=\frac49\vec a+\frac59\vec b$。
    solution_steps:
    - title: 第（1）问
      content: $\because DE\parallel AB,\ 9DE=4AB$，$\therefore\frac{DE}{AB}=\frac{CD}{BC}=\frac49$。由 $BC=18$ 得 $CD=8$，所以 $BD=18-8=10$。
    - title: 第（2）问
      content: $\overrightarrow{BC}=\vec b-\vec a$，$\overrightarrow{DC}=\frac49\overrightarrow{BC}=\frac49\vec b-\frac49\vec a$，故 $\overrightarrow{AD}=\overrightarrow{AC}-\overrightarrow{DC}=\frac49\vec a+\frac59\vec b$。
