  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，已知在梯形 $ABCD$ 中，$AD\parallel BC$，$E$ 是边 $BC$ 上一点，$AE$ 与对角线 $BD$ 相交于点 $F$，且 $BE^2=EF\cdot AE$。（1）求证：$\triangle DAB\sim\triangle AFB$；（2）联结 $AC$，与 $BD$ 相交于点 $O$，若 $AB\cdot OB=BC\cdot AF$，求证：$AF^2=OD\cdot BF$。
    answer: 见证明。
    solution_steps:
    - title: 第（1）问
      content: 由 $BE^2=EF\cdot AE$，得 $\frac{BE}{EF}=\frac{AE}{BE}$。又 $\angle BEF=\angle AEB$，故 $\triangle BEF\sim\triangle AEB$，从而 $\angle EBF=\angle BAE$。由 $AD\parallel BC$ 得角关系，故 $\triangle DAB\sim\triangle AFB$。
      diagram_col:
        image_path: assets/solution-01.png
        width: 58mm
        variant: solution
        disclosure_policy: teacher_only
    - title: 第（2）问
      content: 由 $AB\cdot OB=BC\cdot AF$ 得 $\frac{AB}{BC}=\frac{AF}{OB}$，结合 $\angle BAF=\angle OBC$ 得 $\triangle ABF\sim\triangle BCO$，所以 $AF=AO$。再由角关系得 $\triangle BAF\sim\triangle ADO$，所以 $\frac{AO}{BF}=\frac{OD}{AF}$，故 $AF^2=OD\cdot BF$。
