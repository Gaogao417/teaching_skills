    stem_latex: '在平面直角坐标系 $xOy$ 中，抛物线 $y=-\dfrac13x^2+bx+c$ 的顶点为 $D$。

      \begin{enumerate}

      \item 为了确定这条抛物线，需要再添加一个条件，请从以下两个条件中选择一个：

      ①它与 $y$ 轴交点的坐标是 $(0,-1)$；②顶点 $D$ 的坐标为 $(1,\dfrac43)$。

      你选择的条件是 \underline{\hspace{1cm}}（填写编号），并求 $b$、$c$ 的值。

      \item 由（1）中确定的抛物线与 $x$ 轴正半轴交于点 $A$，求 $\tan\angle DAO$ 的值。

      \end{enumerate}

      '
