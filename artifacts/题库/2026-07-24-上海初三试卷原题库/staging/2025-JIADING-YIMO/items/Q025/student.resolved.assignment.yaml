    stem_latex: '如图13，在 $\triangle ABC$ 中，$AB=AC$，过点 $C$ 作 $CD\perp AB$，垂足为点 $D$，点 $D$ 在 $AB$ 边上（不与点 $A$ 重合），点 $E$ 是边 $AC$ 上的点，且满足 $CD=CE$，设 $k=\tan B$。

      \begin{enumerate}

      \item 求证：$\angle CDE=\angle BCD+45^\circ$；

      \item 如图14，过点 $D$ 作 $DH\perp BC$，垂足为点 $H$，求证：$DE=\sqrt2(CH-DH)$；

      \item 设点 $F$ 是 $CD$ 的中点，联结 $EF$ 并延长交边 $BC$ 于点 $G$，当 $\triangle CFG$ 与 $\triangle BCD$ 相似时，求 $k$ 的值。

      \end{enumerate}

      '
