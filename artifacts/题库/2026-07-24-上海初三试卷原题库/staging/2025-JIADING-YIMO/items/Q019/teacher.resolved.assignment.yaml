    stem_latex: 计算：$\sin^245^\circ-\dfrac{2\cos60^\circ}{\cot30^\circ-\tan45^\circ}$。
    answer: $-\dfrac{\sqrt3}{2}$
    solution_steps:
    - title: 计算
      content: $\sin^245^\circ-\dfrac{2\cos60^\circ}{\cot30^\circ-\tan45^\circ}=\left(\dfrac{\sqrt2}{2}\right)^2-\dfrac{2\times\dfrac12}{\sqrt3-1}=\dfrac12-\dfrac{\sqrt3+1}{2}=-\dfrac{\sqrt3}{2}$。
