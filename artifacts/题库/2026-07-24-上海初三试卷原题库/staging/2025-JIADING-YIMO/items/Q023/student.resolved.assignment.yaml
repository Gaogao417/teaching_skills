    stem_latex: '火车作为我国重要的交通运输形式之一，其轨道的平顺性和稳定性直接影响列车的运行安全。我国目前轨道检测的主要方法是机械检测，通过使用机械传感器和无损检测设备（包括激光三角位移传感器、超声波传感器等）来测量轨道的各种参数（几何尺寸、轨距、高差和曲率），从而判断轨道是否有损伤或缺陷。某校科创活动小组率先就“激光三角位移计”这一设备开展了学习与探究。


      阅读概述、发现原理与建立模型见原题图片。如图11，直线 $M''N''\parallel l_1\parallel l_2$，直线 $MN$ 垂直于 $l_1$ 和 $l_2$，垂足分别为 $M$ 和 $N$，线段 $MM''$ 与线段 $NN''$ 交于点 $O$，$\angle M''MP=\alpha$。

      \begin{enumerate}

      \item 设 $MN=m$，请用含 $m$ 和 $\alpha$ 的式子表示点 $N$ 到直线 $MM''$ 的距离；

      \item 已知 $M''N''=5$，$OM''=23$，$OM=132$，求 $MN$ 的长度（结果精确到个位，$\sin\alpha\approx0.8$，$\cos\alpha\approx0.6$，$\cot\alpha\approx0.75$）。

      \end{enumerate}

      '
    diagram_col:
      image_path: assets/prompt-01.png
