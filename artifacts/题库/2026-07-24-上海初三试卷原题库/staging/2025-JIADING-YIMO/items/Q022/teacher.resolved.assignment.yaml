  - type: problem
    id: Q022
    points: 12
    stem_latex: '如图10，在 $\triangle ABC$ 中，$\angle BAC=90^\circ$，$AB=AC$，点 $E$ 是边 $AB$ 的中点，联结 $CE$，作 $AF\perp CE$，垂足为点 $F$，联结 $BF$。

      \begin{enumerate}

      \item 求证：$\triangle EFB\sim\triangle EBC$；

      \item 取 $BC$ 边的中点 $D$，联结 $DF$，求证：$\dfrac{DF}{EF}=\sqrt2$。

      \end{enumerate}

      '
    answer: 见证明。
    solution_steps:
    - title: 第（1）问
      content: $\because\angle BAC=90^\circ,\ AF\perp CE$，$\therefore\angle EFA=\angle EAC=90^\circ$。又 $\because\angle AEF=\angle CEA$，$\therefore\triangle EAF\sim\triangle ECA$。$\therefore\dfrac{EA}{EC}=\dfrac{EF}{EA}$。$\because$ 点 $E$ 是边 $AB$ 的中点，即 $EA=EB$，$\therefore\dfrac{EB}{EC}=\dfrac{EF}{EB}$。又 $\because\angle BEF=\angle CEB$，$\therefore\triangle EFB\sim\triangle EBC$。
    - title: 第（2）问
      content: 如图2，由（1）知 $\triangle EFB\sim\triangle EBC$，$\therefore\angle EBF=\angle ECB,\ \angle EFB=\angle EBC$。$\because\angle BAC=90^\circ,\ AB=AC$，$\therefore\angle CBA=45^\circ$，$\therefore\angle EFB=\angle EBC=45^\circ$。又 $\because\angle BFA=\angle AFE+\angle EFB=135^\circ$，$\angle CFB=180^\circ-\angle EFB=135^\circ$，$\therefore\angle BFA=\angle CFB$。又由 $\angle ABF=\angle BCF$，$\therefore\triangle BFA\sim\triangle CFB$。$\because$ 点 $E$ 是边 $AB$ 的中点，点 $D$ 是边 $BC$ 的中点，$\therefore\dfrac{DF}{EF}=\dfrac{BC}{AB}$。在 $\mathrm{Rt}\triangle ABC$ 中，$\cos\angle ABC=\dfrac{AB}{BC}=\dfrac{\sqrt2}{2}$，即 $\dfrac{BC}{AB}=\sqrt2$。$\therefore\dfrac{DF}{EF}=\sqrt2$。
