    stem_latex: '在平面直角坐标系 $xOy$ 中，抛物线 $y=ax^2+bx-1$ 经过点 $(2,3)$ 和点 $(-4,3)$。

      \begin{enumerate}

      \item 求该抛物线的表达式；

      \item 如图12，该抛物线上有三个点 $A$、$B$、$C$，$AB\parallel x$ 轴，$\angle ACB=90^\circ$，$\angle BAC=30^\circ$，$AB$ 与抛物线的对称轴交于点 $M$（点 $A$ 在对称轴的左侧）。

      \begin{enumerate}

      \item 如果点 $C$ 到抛物线对称轴的距离为 $t$，请用含 $t$ 的代数式表示点 $B$ 的横坐标；

      \item 求点 $C$ 的横坐标。

      \end{enumerate}

      \end{enumerate}

      '
