  - id: Q023
    source_key: 2025-JIADING-YIMO-Q23
    question_number: 23
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [激光三角位移, 解直角三角形, 相似三角形]
    stem_latex: |
      火车作为我国重要的交通运输形式之一，其轨道的平顺性和稳定性直接影响列车的运行安全。我国目前轨道检测的主要方法是机械检测，通过使用机械传感器和无损检测设备（包括激光三角位移传感器、超声波传感器等）来测量轨道的各种参数（几何尺寸、轨距、高差和曲率），从而判断轨道是否有损伤或缺陷。某校科创活动小组率先就“激光三角位移计”这一设备开展了学习与探究。

      阅读概述、发现原理与建立模型见原题图片。如图11，直线 $M'N'\parallel l_1\parallel l_2$，直线 $MN$ 垂直于 $l_1$ 和 $l_2$，垂足分别为 $M$ 和 $N$，线段 $MM'$ 与线段 $NN'$ 交于点 $O$，$\angle M'MP=\alpha$。
      \begin{enumerate}
      \item 设 $MN=m$，请用含 $m$ 和 $\alpha$ 的式子表示点 $N$ 到直线 $MM'$ 的距离；
      \item 已知 $M'N'=5$，$OM'=23$，$OM=132$，求 $MN$ 的长度（结果精确到个位，$\sin\alpha\approx0.8$，$\cos\alpha\approx0.6$，$\cot\alpha\approx0.75$）。
      \end{enumerate}
    answer: '（1）$m\cos\alpha$；（2）$MN=60$。'
    official_solution_latex:
      - title: 第（1）问
        content: |
          如图3，过点 $N$ 作直线 $MM'$ 的垂线，垂足为点 $H$。$\because\angle PMN=90^\circ,\ \angle M'OP=\alpha$，$\therefore\angle NMH=90^\circ-\alpha$。又 $\because\angle H=90^\circ$，$\therefore\angle MNH=\alpha$。在 $\mathrm{Rt}\triangle MHN$ 中，$\cos\angle MNH=\dfrac{NH}{MN}$。$\because MN=m$，$\therefore$ 点 $N$ 到直线 $MM'$ 的距离 $NH=m\cos\alpha$。（也可以是 $NH=m\sin(90^\circ-\alpha)$）
      - title: 第（2）问
        content: |
          $\because\sin\alpha\approx0.8,\ \cos\alpha\approx0.6$。由（1）得 $NH=m\cos\alpha\approx0.6m$，同理可得 $MH=m\sin\alpha\approx0.8m$。如图3，过点 $N'$ 作 $MM'$ 的垂线，垂足为点 $G$。$\because MP\parallel M'N'$，$\therefore\angle N'M'G=\angle M'MP=\alpha$。在 $\mathrm{Rt}\triangle M'GN'$ 中，$\angle M'GN'=90^\circ$。$\because M'N'=5$，$\therefore M'G=5\cos\alpha\approx3,\ N'G=5\sin\alpha\approx4$。$\because OM'=23,\ OM=132$，$\therefore GO=OM'-M'G=23-3=20$。$\because\angle N'GO=\angle NHO=90^\circ$，$\therefore N'G\parallel NH$，$\therefore\dfrac{N'G}{NH}=\dfrac{GM}{HM}$。可得方程 $\dfrac4{0.6m}=\dfrac{20}{132+0.8m}$，解得 $m=60$，所以 $MN=60$。
    question_crops:
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/006.png, box: [120, 125, 960, 990], file: source-question-01.png}
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/007.png, box: [150, 95, 930, 1405], file: source-question-02.png}
    prompt_crops:
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/007.png, box: [250, 845, 915, 1235], file: prompt-01.png, width: 0.96\linewidth}
    solution_crops:
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/012.png, box: [170, 235, 930, 900], file: official-solution-01.png}
  - id: Q024
    source_key: 2025-JIADING-YIMO-Q24
    question_number: 24
    question_type: problem
    section_title: 三、解答题
    points: 12
    difficulty: challenge
    skill_tags: [二次函数, 待定系数法, 解直角三角形]
    stem_latex: |
      在平面直角坐标系 $xOy$ 中，抛物线 $y=ax^2+bx-1$ 经过点 $(2,3)$ 和点 $(-4,3)$。
      \begin{enumerate}
      \item 求该抛物线的表达式；
      \item 如图12，该抛物线上有三个点 $A$、$B$、$C$，$AB\parallel x$ 轴，$\angle ACB=90^\circ$，$\angle BAC=30^\circ$，$AB$ 与抛物线的对称轴交于点 $M$（点 $A$ 在对称轴的左侧）。
      \begin{enumerate}
      \item 如果点 $C$ 到抛物线对称轴的距离为 $t$，请用含 $t$ 的代数式表示点 $B$ 的横坐标；
      \item 求点 $C$ 的横坐标。
      \end{enumerate}
      \end{enumerate}
    answer: '（1）$y=\dfrac12x^2+x-1$；（2）①$2t-1$；②$\dfrac{2\sqrt3}{3}-1$。'
    official_solution_latex:
      - title: 第（1）问
        content: '$\because$ 抛物线 $y=ax^2+bx-1$ 经过点 $(2,3)$ 和点 $(-4,3)$，$\therefore\begin{cases}4a+2b-1=3,\\16a-4b-1=3.\end{cases}$ 解得 $\begin{cases}a=\dfrac12,\\b=1.\end{cases}$。$\therefore$ 抛物线的表达式为 $y=\dfrac12x^2+x-1$。'
      - title: 第（2）问①
        content: '抛物线的对称轴是直线 $x=-1$，图4，联结 $CM$，作 $CG\perp$ 直线 $x=-1$，$CH\perp AB$。$\because AB\parallel x$ 轴，$\therefore$ 四边形 $MGCH$ 是矩形，点 $M$ 是 $AB$ 的中点。$\because$ 点 $C$ 到抛物线对称轴的距离为 $t$，$\therefore CG=MH=t$。$\because\angle ACB=90^\circ$，$\therefore CM=BM$。$\because\angle BAC=30^\circ$，$\therefore\angle B=60^\circ$，$\triangle BMC$ 是等边三角形。$\therefore CB=CM$，$MH=HB$，$\therefore BM=MH+HB=2t$。$\therefore$ 点 $B$ 的横坐标是 $2t-1$。'
      - title: 第（2）问②
        content: '$\because\angle BHC=90^\circ,\ \angle B=60^\circ,\ BH=t$，$\therefore CH=BH\cdot\tan B=\sqrt3t$。即点 $B$ 的纵坐标比点 $C$ 的纵坐标大 $\sqrt3t$，因为点 $C$ 的横坐标是 $t-1$，可得 $\dfrac12(t-1)^2+(t-1)-1+\sqrt3t=\dfrac12(2t-1)^2+(2t-1)-1$。解得 $t_1=0$（点 $A,B,C$ 重合，舍），$t_2=\dfrac{2\sqrt3}{3}$。$\therefore$ 点 $C$ 的横坐标是 $\dfrac{2\sqrt3}{3}-1$。'
    question_crops:
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/008.png, box: [125, 125, 970, 690], file: source-question.png}
    prompt_crops:
