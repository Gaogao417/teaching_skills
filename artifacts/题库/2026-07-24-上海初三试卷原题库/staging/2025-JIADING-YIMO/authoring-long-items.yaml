  - id: Q019
    source_key: 2025-JIADING-YIMO-Q19
    question_number: 19
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: foundation
    skill_tags: [特殊角三角比, 实数运算]
    stem_latex: '计算：$\sin^245^\circ-\dfrac{2\cos60^\circ}{\cot30^\circ-\tan45^\circ}$。'
    answer: '$-\dfrac{\sqrt3}{2}$'
    official_solution_latex:
      - title: 计算
        content: '$\sin^245^\circ-\dfrac{2\cos60^\circ}{\cot30^\circ-\tan45^\circ}=\left(\dfrac{\sqrt2}{2}\right)^2-\dfrac{2\times\dfrac12}{\sqrt3-1}=\dfrac12-\dfrac{\sqrt3+1}{2}=-\dfrac{\sqrt3}{2}$。'
    question_crops:
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/004.png, box: [125, 1210, 970, 1425], file: source-question.png}
    solution_crops:
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/010.png, box: [175, 420, 930, 700], file: official-solution-01.png}
  - id: Q020
    source_key: 2025-JIADING-YIMO-Q20
    question_number: 20
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [二次函数, 待定系数法, 锐角三角比]
    stem_latex: |
      在平面直角坐标系 $xOy$ 中，抛物线 $y=-\dfrac13x^2+bx+c$ 的顶点为 $D$。
      \begin{enumerate}
      \item 为了确定这条抛物线，需要再添加一个条件，请从以下两个条件中选择一个：
      ①它与 $y$ 轴交点的坐标是 $(0,-1)$；②顶点 $D$ 的坐标为 $(1,\dfrac43)$。
      你选择的条件是 \underline{\hspace{1cm}}（填写编号），并求 $b$、$c$ 的值。
      \item 由（1）中确定的抛物线与 $x$ 轴正半轴交于点 $A$，求 $\tan\angle DAO$ 的值。
      \end{enumerate}
    answer: '（1）②，$b=\dfrac23$，$c=1$；（2）$\dfrac23$。'
    official_solution_latex:
      - title: 第（1）问
        content: '②。$\because$ 抛物线的顶点是 $(1,\dfrac43)$，$\therefore$ 它的表达式为 $y=-\dfrac13(x-1)^2+\dfrac43$，化为一般式 $y=-\dfrac13x^2+\dfrac23x+1$，得 $b=\dfrac23,\ c=1$。'
      - title: 第（2）问
        content: '由 $-\dfrac13(x-1)^2+\dfrac43=0$ 解得 $x_1=-1,\ x_2=3$，得 $A(3,0)$。过点 $D(1,\dfrac43)$ 作 $x$ 轴的垂线，垂足为 $H$，则 $DH=\dfrac43$，$AH=3-1=2$。在 $\mathrm{Rt}\triangle AHD$ 中，$\angle AHD=90^\circ$，$\tan\angle DAO=\dfrac{DH}{AH}=\dfrac23$。'
    question_crops:
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/005.png, box: [125, 125, 970, 420], file: source-question.png}
    solution_crops:
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/010.png, box: [170, 695, 930, 1135], file: official-solution-01.png}
  - id: Q021
    source_key: 2025-JIADING-YIMO-Q21
    question_number: 21
    question_type: problem
    section_title: 三、解答题
    points: 10
    difficulty: standard
    skill_tags: [相似三角形, 解直角三角形, 三角形面积]
    stem_latex: |
      如图9，在 $\triangle ABC$ 中，点 $D$、$E$ 分别在边 $BC$、$AC$ 上，$BD=12$，$CD=15$，且 $\angle BAD=\angle C$。
      \begin{enumerate}
      \item 求线段 $AB$ 的长；
      \item 当 $\angle ADE=\angle C$，$\angle B=60^\circ$ 时，求 $\triangle EDC$ 的面积。
      \end{enumerate}
    answer: '（1）$AB=18$；（2）$S_{\triangle EDC}=\dfrac{75\sqrt3}{2}$。'
    official_solution_latex:
      - title: 第（1）问
        content: '$\because$ 在 $\triangle ABD$ 和 $\triangle CBA$ 中，$\angle BAD=\angle C$，$\angle B=\angle B$，$\therefore\triangle ABD\sim\triangle CBA$。$\therefore\dfrac{AB}{CB}=\dfrac{BD}{BA}$。$\because BD=12,\ CD=15$，$\therefore BC=BD+CD=27$。$\therefore\dfrac{AB}{27}=\dfrac{12}{BA}$，可得 $AB=18$。'
      - title: 第（2）问
        content: '$\because\angle BAD=\angle C,\ \angle ADE=\angle C$，$\therefore\angle BAD=\angle ADE$，$\therefore AB\parallel DE$。$\therefore\dfrac{DE}{AB}=\dfrac{CD}{CB}=\dfrac{15}{27}$，可得 $DE=10$。如图1，作 $EH\perp BC$，垂足为点 $H$。$\because AB\parallel DE$，$\therefore\angle EDH=\angle B=60^\circ$。在 $\mathrm{Rt}\triangle EDH$ 中，$EH=DE\cdot\sin\angle EDH=5\sqrt3$。$\therefore S_{\triangle EDC}=\dfrac12CD\cdot EH=\dfrac{75\sqrt3}{2}$。'
    question_crops:
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/005.png, box: [125, 445, 970, 825], file: source-question.png}
    prompt_crops:
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/005.png, box: [620, 545, 955, 800], file: prompt-01.png, width: 66mm}
    solution_crops:
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/010.png, box: [170, 1110, 930, 1460], file: official-solution-01.png}
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/011.png, box: [170, 115, 930, 690], file: official-solution-02.png}
  - id: Q022
    source_key: 2025-JIADING-YIMO-Q22
    question_number: 22
    question_type: problem
    section_title: 三、解答题
    points: 12
    difficulty: standard
    skill_tags: [相似三角形, 直角三角形, 中点]
    stem_latex: |
      如图10，在 $\triangle ABC$ 中，$\angle BAC=90^\circ$，$AB=AC$，点 $E$ 是边 $AB$ 的中点，联结 $CE$，作 $AF\perp CE$，垂足为点 $F$，联结 $BF$。
      \begin{enumerate}
      \item 求证：$\triangle EFB\sim\triangle EBC$；
      \item 取 $BC$ 边的中点 $D$，联结 $DF$，求证：$\dfrac{DF}{EF}=\sqrt2$。
      \end{enumerate}
    answer: 见证明。
    official_solution_latex:
      - title: 第（1）问
        content: '$\because\angle BAC=90^\circ,\ AF\perp CE$，$\therefore\angle EFA=\angle EAC=90^\circ$。又 $\because\angle AEF=\angle CEA$，$\therefore\triangle EAF\sim\triangle ECA$。$\therefore\dfrac{EA}{EC}=\dfrac{EF}{EA}$。$\because$ 点 $E$ 是边 $AB$ 的中点，即 $EA=EB$，$\therefore\dfrac{EB}{EC}=\dfrac{EF}{EB}$。又 $\because\angle BEF=\angle CEB$，$\therefore\triangle EFB\sim\triangle EBC$。'
      - title: 第（2）问
        content: '如图2，由（1）知 $\triangle EFB\sim\triangle EBC$，$\therefore\angle EBF=\angle ECB,\ \angle EFB=\angle EBC$。$\because\angle BAC=90^\circ,\ AB=AC$，$\therefore\angle CBA=45^\circ$，$\therefore\angle EFB=\angle EBC=45^\circ$。又 $\because\angle BFA=\angle AFE+\angle EFB=135^\circ$，$\angle CFB=180^\circ-\angle EFB=135^\circ$，$\therefore\angle BFA=\angle CFB$。又由 $\angle ABF=\angle BCF$，$\therefore\triangle BFA\sim\triangle CFB$。$\because$ 点 $E$ 是边 $AB$ 的中点，点 $D$ 是边 $BC$ 的中点，$\therefore\dfrac{DF}{EF}=\dfrac{BC}{AB}$。在 $\mathrm{Rt}\triangle ABC$ 中，$\cos\angle ABC=\dfrac{AB}{BC}=\dfrac{\sqrt2}{2}$，即 $\dfrac{BC}{AB}=\sqrt2$。$\therefore\dfrac{DF}{EF}=\sqrt2$。'
    question_crops:
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/005.png, box: [125, 845, 970, 1285], file: source-question.png}
    prompt_crops:
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/005.png, box: [650, 925, 955, 1265], file: prompt-01.png, width: 64mm}
    solution_crops:
      - {source: documents/初三/2025届-上海市嘉定区-初三一模数学-试卷及参考答案/011.png, box: [170, 680, 930, 1415], file: official-solution-01.png}
