  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，在平行四边形 $ABCD$ 中，对角线 $AC$、$BD$ 交于 $E$，$M$ 是边 $DC$ 延长线上的一点，联结 $AM$，与边 $BC$ 交于 $F$，与对角线 $BD$ 交于点 $G$。（1）求证：$AG^{2}=GF\cdot GM$；（2）联结 $CG$，如果 $\angle BAG=\angle BCG$，求证：平行四边形 $ABCD$ 是菱形．
    answer: (1)(2) 见解析
    clue: (1) 由两组平行得双相似传递比例；(2) 由角的条件证 $\triangle CGF\sim\triangle MGC$ 得 $AG=CG$，再推对角线互相垂直。
    solution_steps:
    - (1) $AD\parallel BC$，$AB\parallel CD$，$\triangle AGB\sim\triangle MGD$，$\triangle AGD\sim\triangle FGB$。
    - $\dfrac{AG}{GM}=\dfrac{BG}{GD}=\dfrac{FG}{GA}$，$\therefore AG^{2}=GF\cdot GM$。
    - (2) $AB\parallel DM\Rightarrow \angle BAG=\angle CMG=\angle BCG$，又 $\angle MGC=\angle CGF$，$\triangle CGF\sim\triangle MGC$，$CG^{2}=MG\cdot FG$。
    - 由 $AG^{2}=GF\cdot GM$ 得 $AG=CG$；又 $AE=EC$，$\therefore GE\perp AC$，即 $BD\perp AC$，平行四边形为菱形。
