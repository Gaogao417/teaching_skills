  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 已知一个反比例函数图像经过点 $P(-2,3)$，则该反比例函数的图像在各自的象限内，函数值 $y$ 随自变量 $x$ 的值逐渐增大而 ______（填"增大"或"减小"）
    answer: 增大
    clue: 由 $k$ 的正负判断反比例函数的增减性。
    solution_steps:
    - $k=-2\times3=-6<0$。
    - $\therefore$ 在各象限内 $y$ 随 $x$ 增大而增大。
