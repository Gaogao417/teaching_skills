    id: Q004
    points: 4
    stem_latex: 如图是小明某一天测得的7次体温情况的折线统计图，下列信息不正确的是（\quad）
    choices:
    - 测得的最高体温为 $37.1\degree\text{C}$
    - 前3次测得的体温在下降
    - 这组数据的众数是 $36.8$
    - 这组数据的中位数是 $36.6$
    answer: D
    clue: 由折线图读最高体温、升降趋势，按定义求众数、中位数。
    solution_steps:
    - 7次体温最高 $37.1\degree\text{C}$，A正确；前3次下降，B正确。
    - 众数为 $36.8$，C正确；中位数应为 $36.8$，D错误。
