  - type: problem
    id: Q022
    points: 10
    stem_latex: 某学校计划购买甲、乙两种消毒剂，预计购进乙种数量 $y$（瓶）与甲种数量 $x$（瓶）之间的函数关系如图所示。（1）求 $y$ 关于 $x$ 的函数解析式；（2）用2100元购甲种、2400元购乙种，甲单价比乙单价贵30元，求选购的甲、乙数量．
    answer: (1) $y=-2x+120$；(2) 甲30瓶、乙60瓶
    clue: (1) 待定系数法求一次函数；(2) 由单价关系列分式方程，注意检验。
    solution_steps:
    - (1) 图像过 $(20,80)$、$(50,20)$，$\begin{cases}80=20k+b\\20=50k+b\end{cases}$，$k=-2$，$b=120$，$y=-2x+120$。
    - (2) 设乙单价 $a$ 元，甲单价 $(a+30)$ 元，$\dfrac{2400}{a}=-2\times\dfrac{2100}{a+30}+120$。
    - 整理得 $a^{2}-25a-600=0$，$a=40$（检验合格）；甲 $70$ 元，甲 $\dfrac{2100}{70}=30$ 瓶，乙 $\dfrac{2400}{40}=60$ 瓶。
