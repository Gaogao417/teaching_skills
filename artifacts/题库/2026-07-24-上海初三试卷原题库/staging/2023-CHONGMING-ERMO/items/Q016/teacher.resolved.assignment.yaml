  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 已知梯形 $ABCD$ 中，$AD\parallel BC$，$BC=2AD$，设 $\vec{AB}=\vec{a}$，$\vec{AD}=\vec{b}$，那么 $\vec{DC}$ 可用 $\vec{a}$、$\vec{b}$ 表示为 ______
    answer: $\vec{a}+\vec{b}$
    clue: 用 $\vec{DC}=\vec{BC}-\vec{BD}$ 结合向量代换。
    solution_steps:
    - $\vec{BD}=\vec{AD}-\vec{AB}=\vec{b}-\vec{a}$；$\vec{BC}=2\vec{AD}=2\vec{b}$。
    - $\vec{DC}=\vec{BC}-\vec{BD}=2\vec{b}-(\vec{b}-\vec{a})=\vec{a}+\vec{b}$。
