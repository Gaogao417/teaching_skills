  blocks:
  - type: short_answer
    id: Q011
    points: 4
    stem_latex: 已知关于 $x$ 的一元二次方程 $x^{2}-2x-m=0$ 没有实数根，那么 $m$ 的取值范围为 ______
    answer: $m<-1$
    clue: 方程无实数根则判别式 $\Delta<0$。
    solution_steps:
    - $\Delta=(-2)^{2}-4\times1\times(-m)=4+4m<0$，解得 $m<-1$。
    source_solution_images: []
