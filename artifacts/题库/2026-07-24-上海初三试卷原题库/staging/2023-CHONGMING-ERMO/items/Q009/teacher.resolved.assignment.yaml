  - type: short_answer
    id: Q009
    points: 4
    stem_latex: 不等式组 $\begin{cases}x-1\geqslant 0\\2x-3<x\end{cases}$ 的解集是 ______
    answer: $1\leqslant x<3$
    clue: 分别解两个不等式求交集。
    solution_steps:
    - 解①得 $x\geqslant1$；解②得 $x<3$。
    - $\therefore$ 解集为 $1\leqslant x<3$。
