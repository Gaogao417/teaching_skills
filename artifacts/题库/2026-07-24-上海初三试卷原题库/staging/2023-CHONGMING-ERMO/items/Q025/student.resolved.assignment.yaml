    stem_latex: 如图，在 Rt$\triangle ABC$ 中，$\angle ACB=90\degree$，$AC=6$，$BC=3$。点 $D$ 是边 $AC$ 上一动点（不与 $A$、$C$ 重合），联结 $BD$，过点 $C$ 作 $CF\perp BD$，分别交 $BD$、$AB$ 于点 $E$、$F$。（1）当 $CD=2$ 时，求 $\angle ACF$ 的正切值；（2）设 $CD=x$，$\dfrac{AF}{BF}=y$，求 $y$ 关于 $x$ 的函数解析式，并写出定义域；（3）联结 $FD$ 并延长，与边 $BC$ 的延长线交于点 $G$，若 $\triangle DGC$ 与 $\triangle BAC$ 相似，求 $\dfrac{AF}{BF}$ 的值．
