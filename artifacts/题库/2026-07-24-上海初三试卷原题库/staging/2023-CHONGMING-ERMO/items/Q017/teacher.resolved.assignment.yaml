  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 如图，$\triangle ABC$ 和 $\triangle ADE$ 都是等边三角形，点 $D$ 是 $\triangle ABC$ 的重心，那么 $\dfrac{S_{\triangle ADE}}{S_{\triangle ABC}}=$ ______
    answer: $\dfrac{1}{3}$
    clue: 重心性质求 $AD$，再由相似三角形面积比等于相似比平方。
    solution_steps:
    - 延长 $AD$ 交 $BC$ 于 $F$，重心 $AD=\dfrac{2}{3}AF$；等边 $\triangle ABC$ 中 $AF=\dfrac{\sqrt{3}}{2}AB$。
    - $\therefore AD=\dfrac{\sqrt{3}}{3}AB$；$\triangle ADE\sim\triangle ABC$，$\dfrac{S_{\triangle ADE}}{S_{\triangle ABC}}=\left(\dfrac{AD}{AB}\right)^{2}=\dfrac{1}{3}$。
