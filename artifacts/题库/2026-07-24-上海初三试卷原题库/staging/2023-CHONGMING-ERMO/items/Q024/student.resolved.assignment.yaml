    stem_latex: 在直角坐标平面 $xOy$ 中，直线 $y=-x+5$ 分别与 $x$ 轴、$y$ 轴交于 $A$、$B$，抛物线 $y=x^{2}+bx+c$ 经过 $A$、$B$，点 $D$ 是抛物线的顶点。（1）求抛物线的解析式及顶点 $D$ 的坐标；（2）抛物线与 $x$ 轴另一交点为 $C$，点 $M\left(a,-\dfrac{7}{4}\right)$ 在抛物线对称轴左侧的图像上，将抛物线向上平移 $m$ 个单位（$m>0$）使点 $M$ 落在 $\triangle ABC$ 内，求 $m$ 的取值范围；（3）对称轴与直线 $AB$ 交于 $E$，$P$ 是线段 $AB$ 上的动点（$P$ 不与 $E$ 重合），过 $P$ 作 $y$ 轴的平行线交原抛物线于 $Q$，当 $PE=QD$ 时，求点 $Q$ 的坐标．
