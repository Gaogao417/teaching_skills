  blocks:
  - type: choice
    id: Q005
    points: 4
    stem_latex: 下列命题是真命题的是（\quad）
    choices:
    - 四边都相等的四边形是正方形
    - 一组邻边相等的矩形是正方形
    - 对角线互相垂直平分的四边形是正方形
    - 对角线互相垂直且相等的四边形是正方形
    answer: B
    clue: 逐项用正方形的判定定理判断。
    solution_steps:
    - A、四边相等的四边形是菱形，假命题。
    - B、一组邻边相等的矩形是正方形，真命题。
    - C、对角线互相垂直平分的四边形是菱形，假命题。
    - D、对角线互相垂直且相等不一定为正方形，假命题。
