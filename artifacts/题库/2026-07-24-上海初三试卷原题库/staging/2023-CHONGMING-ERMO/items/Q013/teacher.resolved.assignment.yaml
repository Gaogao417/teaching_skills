  - type: short_answer
    id: Q013
    points: 4
    stem_latex: 在六张卡片上分别写有 $6$、$-\dfrac{22}{7}$、$3.1415$、$\sqrt{3}$、$0$、$\sin45\degree$ 六个数，从中随机抽取一张，卡片上的数为无理数的概率是 ______
    answer: $\dfrac{1}{3}$
    clue: 先判定各数是否为无理数，再用概率公式。
    solution_steps:
    - $\sin45\degree=\dfrac{\sqrt{2}}{2}$；六个数中 $\sqrt{3}$、$\sin45\degree$ 是无理数，共2个。
    - $P=\dfrac{2}{6}=\dfrac{1}{3}$。
