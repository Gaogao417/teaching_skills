  - type: choice
    id: Q003
    points: 4
    stem_latex: 如果函数 $y=\dfrac{1}{2}x+m$ 的图像经过第一、三、四象限，那么 $m$ 的取值范围是（\quad）
    choices:
    - $m>0$
    - $m=0$
    - $m<0$
    - $m\leqslant0$
    answer: C
    clue: 一次函数 $y=kx+b$（$k>0$）过一、三、四象限时 $b<0$。
    solution_steps:
    - $\because k=\dfrac{1}{2}>0$ 且图像过一、三、四象限，$\therefore m<0$。
