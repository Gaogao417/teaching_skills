  - type: short_answer
    id: Q010
    points: 4
    stem_latex: 方程 $\sqrt{x+2}=x$ 的根是 ______
    answer: $x=2$
    clue: 两边平方化为一元二次方程，注意检验（舍增根）。
    solution_steps:
    - 两边平方得 $x+2=x^{2}$，$x_{1}=2$，$x_{2}=-1$。
    - $\because \sqrt{x+2}=x\geqslant0$，舍去 $x=-1$，$\therefore x=2$。
