    block:
      stem_latex: 已知在 $\triangle ABC$ 中，$AB=AC=5$，$BC=6$，如果以 $A$ 为圆心 $r$ 为半径的 $\odot
        A$ 和以 $BC$ 为直径的 $\odot D$ 相交，那么 $r$ 的取值范围是（\quad）
      choices:
      - $1<r<4$
      - $4<r<10$
      - $1<r<7$
      - $7<r<10$
      answer: C
      clue: 求圆心距 $AD$，两圆相交则 $|R-r|<d<R+r$。
      solution_steps:
      - $BD=DC=3$，由勾股定理 $AD=\sqrt{AB^{2}-BD^{2}}=4$，$\odot D$ 半径为 $3$。
      - 两圆相交则 $|r-3|<4<r+3$，解得 $1<r<7$。
