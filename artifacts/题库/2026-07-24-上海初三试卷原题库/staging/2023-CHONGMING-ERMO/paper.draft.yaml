    block:
      stem_latex: 在直角坐标平面 $xOy$ 中，直线 $y=-x+5$ 分别与 $x$ 轴、$y$ 轴交于 $A$、$B$，抛物线 $y=x^{2}+bx+c$
        经过 $A$、$B$，点 $D$ 是抛物线的顶点。（1）求抛物线的解析式及顶点 $D$ 的坐标；（2）抛物线与 $x$ 轴另一交点为 $C$，点 $M\left(a,-\dfrac{7}{4}\right)$
        在抛物线对称轴左侧的图像上，将抛物线向上平移 $m$ 个单位（$m>0$）使点 $M$ 落在 $\triangle ABC$ 内，求 $m$ 的取值范围；（3）对称轴与直线
        $AB$ 交于 $E$，$P$ 是线段 $AB$ 上的动点（$P$ 不与 $E$ 重合），过 $P$ 作 $y$ 轴的平行线交原抛物线于 $Q$，当
        $PE=QD$ 时，求点 $Q$ 的坐标．
      answer: (1) $y=x^{2}-6x+5$，$D(3,-4)$；(2) $\dfrac{7}{4}<m<\dfrac{7}{2}$；(3) $Q(2,-3)$
        或 $Q(4,-3)$
      clue: (1) 待定系数；(2) 平移后比较 $M$ 纵坐标与直线 $AB$ 在该 $x$ 处的值；(3) 构造平行四边形用对角线中点坐标相等求 $P$，分
        $P$ 在 $E$ 左、右两类。
      solution_steps:
      - (1) $y=-x+5$ 与两轴交 $A(5,0)$、$B(0,5)$；代入抛物线得 $b=-6$，$c=5$，$y=x^{2}-6x+5=(x-3)^{2}-4$，$D(3,-4)$。
      - (2) $y=-\dfrac{7}{4}$ 时 $x=\dfrac{3}{2}$（对称轴左侧），$M\left(\dfrac{3}{2},-\dfrac{7}{4}\right)$；直线在
        $x=\dfrac{3}{2}$ 处 $y=\dfrac{7}{2}$。
      - 平移后 $M'$ 纵坐标 $-\dfrac{7}{4}+m$ 需 $<\dfrac{7}{2}$，且 $m>0$，$\therefore \dfrac{7}{4}<m<\dfrac{7}{2}$。
      - (3) $E(3,2)$；$PE=QD$ 且 $PQ\parallel y$ 轴，构造平行四边形使 $QT=QD$，由对角线中点坐标相同列方程。
      - 解得 $P$ 对应 $m=2$ 或由对称 $m=4$，$\therefore Q(2,-3)$ 或 $Q(4,-3)$。
