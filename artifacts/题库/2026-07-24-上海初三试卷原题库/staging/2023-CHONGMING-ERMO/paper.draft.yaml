        ABC$ 的顶点 $A$、$C$，交 $AB$ 边于点 $D$，$AD=4\sqrt{3}$，点 $C$ 是 $\overset{\frown}{AD}$
        的中点。（1）求 $\odot O$ 的半径长；（2）联结 $DC$，求 $\sin\angle BCD$．
      answer: (1) $\dfrac{7}{2}$；(2) $\dfrac{\sqrt{7}}{14}$
      clue: (1) 弧中点 $\Rightarrow$ 弦 $AC=CD$、垂径，用勾股列半径方程；(2) 等积法求 $D$ 到 $BC$ 的距离再算正弦。
      solution_steps:
      - (1) $C$ 为 $\overset{\frown}{AD}$ 中点，$AC=CD$，$OE\perp AD$，$AE=DE=2\sqrt{3}$，$CE=\sqrt{AC^{2}-AE^{2}}=3$。
      - 设半径 $r$，$OE=r-3$，Rt$\triangle AEO$ 中 $r^{2}=(r-3)^{2}+(2\sqrt{3})^{2}$，$r=\dfrac{7}{2}$。
      - (2) $CE\perp AD$，$BE=\sqrt{BC^{2}-CE^{2}}=3\sqrt{3}$，$BD=BE-DE=\sqrt{3}$。
      - $S_{\triangle BDC}=\dfrac{1}{2}BD\cdot CE=\dfrac{1}{2}BC\cdot DF$，$DF=\dfrac{\sqrt{3}}{2}$；$CD=AC=\sqrt{21}$。
      - $\sin\angle BCD=\dfrac{DF}{CD}=\dfrac{\sqrt{7}}{14}$。
