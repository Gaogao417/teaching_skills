    block:
      stem_latex: 如图，已知锐角$\angle MBN$的正切值等于3，$\triangle PBD$中，$\angle BDP=90^{\circ}$，点$D$在$\angle MBN$的边$BN$上，点$P$在$\angle MBN$内，$PD=3$，$BD=9$，直线$l$经过点$P$，并绕点$P$旋转，交射线$BM$于点$A$，交射线$DN$于点$C$，设$\frac{CA}{CP}=x$。(1)求$x=2$时，点$A$到$BN$的距离；(2)设$\triangle ABC$的面积为$y$，求$y$关于$x$的函数解析式，并写出函数的定义域；(3)当$\triangle ABC$因$l$的旋转成为等腰三角形时，求$x$的值
      answer: (1)6；(2)$y=\frac{12x^{2}}{x-1}$($1<x\leq 9$)；(3)$x=5$或$\frac{13}{5}$或$1+\frac{4\sqrt{10}}{5}$
      clue: 几何变换综合题
      solution_steps:
      - (1)过点$A$作$AH\perp BC$于$H$，∵$PD\perp BC$，∴$PD\parallel AH$
      - ∴$\frac{AH}{PD}=\frac{CA}{CP}=x=2$，∴$AH=2PD=6$，即点$A$到$BN$的距离为6
      - (2)∵$PD\parallel AH$，∴$\frac{CA}{CP}=\frac{AH}{PD}=x$，∴$AH=3x$
      - 由$\tan\angle MBN=3$，得$BH=\frac{AH}{3}=x$
      - 由$\frac{CD}{HD}=\frac{PD}{AH}$，即$\frac{CD}{CD+9-x}=\frac{3}{3x}$，解得$CD=\frac{9-x}{x-1}$
      - ∴$BC=BD+CD=9+\frac{9-x}{x-1}=\frac{8x}{x-1}$
      - ∴$S_{\triangle ABC}=\frac{1}{2}AH\cdot BC=\frac{1}{2}\cdot 3x\cdot\frac{8x}{x-1}=\frac{12x^{2}}{x-1}$，即$y=\frac{12x^{2}}{x-1}$，定义域$1<x\leq 9$
      - (3)①当$AB=AC$时，$\tan\angle PCB=\tan\angle MBC=3$，∴$\frac{PD}{CD}=3$，$CD=1$，$BC=10$，由$\frac{8x}{x-1}=10$得$x=5$
      - ②当$CB=CA$时，过$C$作$CE\perp AB$，由$\cos\angle MBN=\frac{\sqrt{10}}{10}$，$\frac{BE}{BC}=\frac{\sqrt{10}}{10}$，解得$x=\frac{13}{5}$
      - ③当$BA=BC$时，由$\sqrt{10}x=\frac{8x}{x-1}$，解得$x=1+\frac{4\sqrt{10}}{5}$
      - ∴$x=5$或$\frac{13}{5}$或$1+\frac{4\sqrt{10}}{5}$
