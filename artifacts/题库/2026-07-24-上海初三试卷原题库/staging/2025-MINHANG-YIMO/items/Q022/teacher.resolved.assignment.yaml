  - type: problem
    id: Q022
    points: 10
    stem_latex: 如图，一种遮阳伞的截面由主伞骨 $OA$ 和 $OB$、支伞骨 $CM$ 和 $DM$ 以及伞柄 $OH$ 组成，伞柄 $OH$ 垂直于地面且平分 $\angle AOB$，$OA=OB=l$ 厘米，$OC=OD=\frac15OA$，$OH=h$ 厘米。当点 $C、M、D$ 三点在同一直线上时，遮阳伞完全打开，此时 $\angle AOB$ 最大为 $150^\circ$。（1）当 $OA=OB=120$ 厘米，i）完全打开时求 $A、B$ 之间的距离；ii）在伞打开过程中，点 $M$ 上升了多少厘米；（2）设 $\angle AOB=2\alpha$，求平行阳光下遮阳伞遮住的地面 $EF$ 长，并提出只改变一个条件来增大 $EF$ 的建议。
    answer: （1）i）$60\sqrt6+60\sqrt2$厘米；ii）$24+12\sqrt2$厘米；（2）$EF=2l\sin\alpha+2(h-l\cos\alpha)\cot75^\circ$，可增大$h$
    solution_steps:
    - title: 官方解答
      content: （1）完全打开时 $\angle AOB=150^\circ$，由等腰三角形计算得 $AB=60\sqrt6+60\sqrt2$ 厘米；由 $OC=OD=24$ 及支撑关系得点 $M$ 上升 $24+12\sqrt2$ 厘米。（2）依据图中水平半宽及太阳光线投影，$EF=2l\sin\alpha+2(h-l\cos\alpha)\cot75^\circ$；可只增大伞柄高度 $h$。
