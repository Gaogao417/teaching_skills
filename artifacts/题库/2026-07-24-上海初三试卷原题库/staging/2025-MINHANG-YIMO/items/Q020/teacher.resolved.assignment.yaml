  - type: problem
    id: Q020
    points: 10
    stem_latex: 已知：如图，点 $A、B$ 在射线 $OM$ 上，点 $C、D$ 在射线 $ON$ 上，$AD、BC$ 交于点 $P$，$\frac{OB}{OA}=\frac{OD}{OC}=\frac53$。设 $\overrightarrow{OA}=\vec a$，$\overrightarrow{OC}=\vec b$。（1）用 $\vec a、\vec b$ 表示 $\overrightarrow{AC}$、$\overrightarrow{BD}$；（2）由（1）可知 $\overrightarrow{AC}$ 与 $\overrightarrow{BD}$ 是什么向量；（3）如果 $|AP|=6$，求 $|DA|$。
    answer: （1）$\overrightarrow{AC}=\vec b-\vec a$，$\overrightarrow{BD}=\frac53\vec b-\frac53\vec a$；（2）平行向量；（3）$16$
    solution_steps:
    - title: 官方解答
      content: （1）$\overrightarrow{AC}=\vec b-\vec a$，$\overrightarrow{BD}=\frac53\vec b-\frac53\vec a$。（2）二者为平行向量。（3）由比例关系计算得 $|DA|=16$。
