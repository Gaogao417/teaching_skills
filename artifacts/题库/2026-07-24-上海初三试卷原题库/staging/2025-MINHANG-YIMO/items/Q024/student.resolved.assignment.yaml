    stem_latex: 已知抛物线 $C_1:y=-x^2+bx+c$ 与 $y$ 轴交于点 $A(0,3)$，顶点 $P$ 在直线 $x=1$ 上。（1）求 $C_1$ 的解析式及顶点 $P$；（2）将 $C_1$ 向右平移 $m\ (m>0)$ 个单位，再向下平移 $n\ (n>0)$ 个单位，得到 $C_2$，顶点为 $Q$，与 $C_1$ 的交点为 $B$，若四边形 $PABQ$ 是平行四边形，求 $m、n$ 的关系式；（3）在（2）的条件下，$C_2$ 的对称轴与直线 $AP$ 交于点 $E$，与 $C_1$ 交于点 $F$，且 $S_{\triangle PEQ}:S_{\triangle BFQ}=3:1$，求 $C_1$ 上落在平行四边形 $PABQ$ 内部的点的横坐标 $t$ 的范围。
