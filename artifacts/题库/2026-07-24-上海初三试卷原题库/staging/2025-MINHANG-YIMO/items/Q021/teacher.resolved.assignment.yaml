  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，已知直线 $y=2x-4$ 与 $x$ 轴交于点 $A$，与 $y$ 轴交于点 $B$，与双曲线 $y=\frac{k}{x}$ 在第一象限分支交于点 $C$，过点 $C$ 作 $x$ 轴的平行线，交 $y$ 轴于点 $D$，$OB=2OD$。（1）求点 $A、B$ 的坐标；（2）求 $k$ 的值；（3）求 $\sin\angle ACO$ 的值。
    answer: （1）$A(2,0)$，$B(0,-4)$；（2）$k=6$；（3）$\frac{4\sqrt{65}}{65}$
    solution_steps:
    - title: 官方解答
      content: （1）令 $y=0$ 得 $A(2,0)$；令 $x=0$ 得 $B(0,-4)$。（2）$OB=2OD$，故 $D(0,2)$，点 $C(3,2)$，所以 $k=6$。按官方答案图与计算，$\sin\angle ACO=\frac{4\sqrt{65}}{65}$。
