  - type: problem
    id: Q023
    points: 12
    stem_latex: 如图，在四边形 $ABCD$ 中，对角线 $BD$ 平分 $\angle ADC$，且 $BD=AD$，点 $E$ 在线段 $BD$ 上且 $DE=DC$，联结 $AE$ 并延长交 $BC$ 于点 $F$，联结 $CE$ 并延长交 $AB$ 于点 $G$。（1）求证：$AE=BC$；（2）求证：$AG\cdot EF=FC\cdot BG$。
    answer: 两问结论均成立
    solution_steps:
    - title: 官方解答
      content: （1）由 $BD$ 平分 $\angle ADC$、$BD=AD$、$DE=DC$，证明 $\triangle AED\cong\triangle BCD$，得 $AE=BC$。（2）利用角关系证明 $\triangle AEG\sim\triangle CEF$，得 $\frac{AG}{FC}=\frac{GE}{EF}$；再证 $GB=GE$，故 $\frac{AG}{FC}=\frac{BG}{EF}$，即 $AG\cdot EF=FC\cdot BG$。
