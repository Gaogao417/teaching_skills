      solution_steps:
      - (1) $\angle ADC=\angle FDE=90^{\circ}$，$DE=DC$，$AD=FD$，$\therefore \triangle
        ADC\cong\triangle FDE$（SAS），$\angle E=\angle ACD$。
      - $\angle EFD=\angle CFG$，$\angle ACD+\angle CFG=\angle E+\angle EFD=90^{\circ}$，$\therefore
        \angle CGF=90^{\circ}$，$AC\perp BE$。
      - (2) 由 $\triangle EDF\sim\triangle BCF$ 得 $\dfrac{CF}{DF}=\dfrac{BC}{DE}=\dfrac{AD}{DE}$；由
        $\triangle EAB\sim\triangle CDA$ 得 $\dfrac{AC}{BE}=\dfrac{AD}{DE}$，$\therefore
        \dfrac{CF}{DF}=\dfrac{AC}{BE}$。
