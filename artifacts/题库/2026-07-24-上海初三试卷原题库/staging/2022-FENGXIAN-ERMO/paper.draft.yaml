      answer: $\begin{cases} x_{1}=4 \\ y_{1}=2 \end{cases}$ 或 $\begin{cases} x_{2}=1
        \\ y_{2}=-1 \end{cases}$
      clue: 把②因式分解降次。
      solution_steps:
      - ②化为 $(x-2y)(x+y)=0$，得 $x=2y$ 或 $x=-y$。
      - $x=2y$ 代入①：$y=2$，$x=4$。
      - $x=-y$ 代入①：$-2y=2$，$y=-1$，$x=1$。
