  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，$\mathrm{Rt}\triangle ABC$ 中，$\angle C=90^{\circ}$，$D$ 在 $AC$ 上，$\angle DBC=\angle A$。若 $AC=4$，$\cos A=\dfrac{4}{5}$，则 $BD=$______
    answer: $\dfrac{15}{4}$
    clue: 由 $\cos A$ 求 $AB$、$BC$，再由 $\angle DBC=\angle A$ 求 $BD$。
    solution_steps:
    - $AB=\dfrac{AC}{\cos A}=5$，$BC=\sqrt{AB^{2}-AC^{2}}=3$。
    - $\cos\angle DBC=\cos A=\dfrac{4}{5}=\dfrac{BC}{BD}$，$\therefore BD=\dfrac{15}{4}$。
