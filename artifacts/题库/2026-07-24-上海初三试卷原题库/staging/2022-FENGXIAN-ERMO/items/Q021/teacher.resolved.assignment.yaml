  - type: problem
    id: Q021
    points: 10
    stem_latex: '如图，$\triangle OAB$ 中 $OA$ 在 $x$ 轴正半轴上，$\angle OAB=90^{\circ}$，$AO=AB=4$，$C$ 为斜边 $OB$ 中点，反比例函数 $y=\dfrac{k}{x}$ 第一象限图象过 $C$、交 $AB$ 于 $D$。

      (1) 求反比例函数解析式；

      (2) 求 $\dfrac{S_{\triangle BCD}}{S_{\triangle OAD}}$。'
    answer: (1) $y=\dfrac{4}{x}$；(2) $\dfrac{3}{2}$
    clue: (1) 求 $C$ 坐标；(2) 求 $D$ 坐标后算面积。
    solution_steps:
    - (1) $B(4,4)$，$C(2,2)$，$k=4$，$\therefore y=\dfrac{4}{x}$。
    - (2) $D$ 在 $AB$ 上，$x_{D}=4$，$y_{D}=1$，$D(4,1)$。
    - $S_{\triangle OAD}=\dfrac{1}{2}\times4\times1=2$，$BD=3$，$S_{\triangle BCD}=\dfrac{1}{2}\times3\times2=3$，比值 $=\dfrac{3}{2}$。
