  - type: short_answer
    id: Q018
    points: 4
    stem_latex: 矩形 $ABCD$（$AB=8$，$AD=4$），$E$ 在 $DC$ 上，沿 $AE$ 翻折，$D$ 的对应点为 $P$，$\angle CEP=30^{\circ}$，则 $DE=$______
    answer: $8-4\sqrt{3}$
    clue: 翻折得 $AD=AP$、$DE=PE$，用 $30^{\circ}$ 直角三角形。
    solution_steps:
    - 过 $P$ 作 $PM\perp CD$，$AP=AD=4$。$\angle PEM=\angle APN=30^{\circ}$，$AN=2$，$PN=2\sqrt{3}$。
    - $PM=4-2\sqrt{3}$，$PE=2PM=8-4\sqrt{3}$，$\therefore DE=PE=8-4\sqrt{3}$。
