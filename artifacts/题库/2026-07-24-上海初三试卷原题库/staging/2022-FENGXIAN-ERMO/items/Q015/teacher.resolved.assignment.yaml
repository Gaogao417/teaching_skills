  blocks:
  - type: short_answer
    id: Q015
    points: 4
    stem_latex: 梯形 $ABCD$ 中，$AB\parallel CD$，$AB=2CD$，$E$ 是腰 $BC$ 中点，设 $\vec{BC}=\vec{a}$，$\vec{DC}=\vec{b}$，那么 $\vec{AE}=$______
    answer: $2\vec{b}+\dfrac{1}{2}\vec{a}$
    clue: $\vec{AE}=\vec{AB}+\vec{BE}$。
    solution_steps:
    - $\vec{AB}=2\vec{DC}=2\vec{b}$，$\vec{BE}=\dfrac{1}{2}\vec{BC}=\dfrac{1}{2}\vec{a}$。
    - $\vec{AE}=\vec{AB}+\vec{BE}=2\vec{b}+\dfrac{1}{2}\vec{a}$。
    source_solution_images: []
