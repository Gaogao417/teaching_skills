  - type: short_answer
    id: Q008
    points: 4
    stem_latex: 单项式 $3x^{m}y$ 与 $-5x^{3}y^{n-1}$ 是同类项，那么 $m^{n}$ 的值是______
    answer: '9'
    clue: 同类项相同字母指数相同。
    solution_steps:
    - $m=3$，$n-1=1$ 得 $n=2$，$\therefore m^{n}=3^{2}=9$。
