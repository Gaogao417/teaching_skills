  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 等边 $\triangle ABC$（$AB=2\sqrt{3}$），以 $BC$ 为直径的 $\odot D$ 与以 $A$ 为圆心的 $\odot A$ 相切，那么 $\odot A$ 的半径 $r=$______
    answer: $3-\sqrt{3}$ 或 $3+\sqrt{3}$
    clue: $AD=3$，分内切/外切。
    solution_steps:
    - $BD=\sqrt{3}$，$AD=AB\sin60^{\circ}=3$。
    - 内切：$r=AD-DQ=3-\sqrt{3}$；外切：$r=AD+DQ=3+\sqrt{3}$。
