    stem_latex: '直线 $y=-\dfrac{1}{2}x+2$ 与 $x$ 轴、$y$ 轴分别交于 $A$、$B$。抛物线 $y=-\dfrac{1}{2}x^{2}+bx+c$ 经过 $A$、$B$，顶点为 $C$。

      (1) 求抛物线表达式；

      (2) 将抛物线沿 $y$ 轴向上平移，新顶点为 $D$，若 $\angle BDC=\angle OAB$，求平移距离；

      (3) 抛物线上点 $M$（横坐标 $m$），将抛物线向左平移 $3$ 个单位，$M$ 的对应点 $Q$ 落在 $\triangle OAB$ 内，求 $m$ 的取值范围。'
