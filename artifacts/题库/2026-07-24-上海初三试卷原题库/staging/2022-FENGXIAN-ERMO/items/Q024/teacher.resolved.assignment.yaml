  - type: problem
    id: Q024
    points: 12
    stem_latex: '直线 $y=-\dfrac{1}{2}x+2$ 与 $x$ 轴、$y$ 轴分别交于 $A$、$B$。抛物线 $y=-\dfrac{1}{2}x^{2}+bx+c$ 经过 $A$、$B$，顶点为 $C$。

      (1) 求抛物线表达式；

      (2) 将抛物线沿 $y$ 轴向上平移，新顶点为 $D$，若 $\angle BDC=\angle OAB$，求平移距离；

      (3) 抛物线上点 $M$（横坐标 $m$），将抛物线向左平移 $3$ 个单位，$M$ 的对应点 $Q$ 落在 $\triangle OAB$ 内，求 $m$ 的取值范围。'
    answer: (1) $y=-\dfrac{1}{2}x^{2}+\dfrac{3}{2}x+2$；(2) 平移距离 $\dfrac{15}{8}$；(3) $3<m<4$
    clue: (1) 待定系数；(2) 由 $\tan$ 相等求 $D$；(3) 平移后边界。
    solution_steps:
    - (1) $B(0,2)$，$A(4,0)$，代入得 $b=\dfrac{3}{2}$，$c=2$，$\therefore y=-\dfrac{1}{2}x^{2}+\dfrac{3}{2}x+2$。
    - (2) 顶点 $C\left(\dfrac{3}{2},\dfrac{25}{8}\right)$。过 $B$ 作 $BE\perp DC$ 于 $E$，$BE=\dfrac{3}{2}$，$\tan\angle BDC=\tan\angle OAB=\dfrac{1}{2}$，$DE=3$，平移距离 $DC=3+2-\dfrac{25}{8}=\dfrac{15}{8}$。
    - (3) $B$ 关于对称轴 $x=\dfrac{3}{2}$ 的对称点为 $(3,2)$，向左平移3个单位后 $Q$ 落在 $\triangle OAB$ 内，$\therefore 3<m<4$。
