  - type: problem
    id: Q022
    points: 10
    stem_latex: '圆形车载手机支架：滑动杆 $AB$ 两端在圆 $O$ 上，支撑杆 $CD$ 的 $C$ 固定在圆 $O$ 上、$D$ 为 $AB$ 中点（$AB\parallel$水平线，$CD\perp$水平线）。当 $AB$ 过圆心 $O$ 时宽度最大为 $10$ cm。

      (1) 当 $AB$ 宽度调整为 $6$ cm 时，求 $CD$ 的高度；

      (2) 如图，手机被锁住时锁住高度与手机宽度相等（$AE=AB$），求手机宽度。'
    answer: (1) $CD=9$ cm；(2) 手机宽度 $8$ cm
    clue: (1) 垂径定理+勾股；(2) 正方形+勾股。
    solution_steps:
    - (1) 直径 $10$，$OA=5$，$AB=6$，$AD=3$，$OD=\sqrt{5^{2}-3^{2}}=4$，$CD=OC+OD=9$ cm。
    - (2) $AE=CD=AB$，四边形 $AEFB$ 为正方形。设 $AD=x$，$AB=2x$，$OD=2x-5$，$5^{2}=x^{2}+(2x-5)^{2}$，$x=4$，$AB=8$ cm。
