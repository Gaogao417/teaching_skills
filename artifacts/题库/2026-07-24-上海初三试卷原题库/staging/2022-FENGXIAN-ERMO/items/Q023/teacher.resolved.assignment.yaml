  - type: problem
    id: Q023
    points: 12
    stem_latex: '如图，矩形 $ABCD$ 中，$E$ 在边 $AD$ 的延长线上，$DE=DC$，联结 $BE$ 交 $DC$ 于 $F$、交对角线 $AC$ 于 $G$，$AD=FD$。

      (1) 求证：$AC\perp BE$；

      (2) 求证：$\dfrac{CF}{DF}=\dfrac{AC}{BE}$。'
    answer: 见证明
    clue: (1) 证 $\triangle ADC\cong\triangle FDE$；(2) 相似三角形比例转化。
    solution_steps:
    - (1) $\angle ADC=\angle FDE=90^{\circ}$，$DE=DC$，$AD=FD$，$\therefore \triangle ADC\cong\triangle FDE$（SAS），$\angle E=\angle ACD$。
    - $\angle EFD=\angle CFG$，$\angle ACD+\angle CFG=\angle E+\angle EFD=90^{\circ}$，$\therefore \angle CGF=90^{\circ}$，$AC\perp BE$。
    - (2) 由 $\triangle EDF\sim\triangle BCF$ 得 $\dfrac{CF}{DF}=\dfrac{BC}{DE}=\dfrac{AD}{DE}$；由 $\triangle EAB\sim\triangle CDA$ 得 $\dfrac{AC}{BE}=\dfrac{AD}{DE}$，$\therefore \dfrac{CF}{DF}=\dfrac{AC}{BE}$。
