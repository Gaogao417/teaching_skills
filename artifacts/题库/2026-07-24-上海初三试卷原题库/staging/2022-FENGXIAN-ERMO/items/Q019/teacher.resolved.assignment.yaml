  - type: problem
    id: Q019
    points: 10
    stem_latex: 先化简，再求值：$\left(1-\dfrac{1}{x+2}\right)\div\dfrac{x^{2}-1}{x+2}$，其中 $x=\sqrt{2}+1$。
    answer: $\dfrac{\sqrt{2}}{2}$
    clue: 分式化简后代入。
    solution_steps:
    - 原式 $=\dfrac{x+1}{x+2}\cdot\dfrac{x+2}{(x+1)(x-1)}=\dfrac{1}{x-1}$。
    - 当 $x=\sqrt{2}+1$ 时，原式 $=\dfrac{1}{\sqrt{2}}=\dfrac{\sqrt{2}}{2}$。
