    stem_latex: 抛物线与 $x$ 轴交于 $A(-2,0),B(4,0)$，与 $y$ 轴正半轴交于 $C$，顶点为 $D$，且 $OB=OC$。（1）求表达式和 $D$；（2）第一象限点 $P$ 满足角条件，将抛物线右移使 $P$
      移到 $O$，若存在 $N$ 使 $PMON$ 为平行四边形，求平移距离。
    answer: （1）$y=-\frac12x^2+x+4$，$D(1,\frac92)$；（2）$4+2\sqrt2$。
    solution_steps:
    - title: 解答
      content: $\because$ 依据题设计算或证明，$\therefore$ （1）$y=-\frac12x^2+x+4$，$D(1,\frac92)$；（2）$4+2\sqrt2$。
