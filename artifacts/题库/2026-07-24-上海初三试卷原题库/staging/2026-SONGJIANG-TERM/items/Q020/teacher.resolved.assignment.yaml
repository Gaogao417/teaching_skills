    stem_latex: 画二次函数 $y=x^2+bx+c$ 的图像时给出部分表格。（1）求表中 $b,c,m,n$；（2）画出大致图像并描述变化趋势。
    answer: （1）$b=2,c=-3,m=-3,n=-4$；（2）对称轴 $x=-1$，左降右升。
