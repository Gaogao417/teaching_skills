    stem_latex: 如图，在 $\triangle ABC$ 中，$\angle B=45^\circ,AB=\sqrt6,AC=\sqrt7$，$D$ 在 $BC$ 上，$\angle ADC=120^\circ$。（1）求 $BD$；（2）求
      $\cos\angle CAD$。
    answer: （1）$BD=\sqrt3+1$；（2）$\cos\angle CAD=\frac{5\sqrt7}{14}$。
