  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在四边形 $ABCD$ 中，$AD\parallel BC$，$AD=4$，$BC=5$，对角线 $AC、BD$ 交于点 $E$。（1）设 $\overrightarrow{BC}=\vec a$，$\overrightarrow{BD}=\vec b$，用 $\vec a、\vec b$ 的线性组合表示 $\overrightarrow{AE}$；（2）已知 $AD\perp CD$，$\tan\angle DAC=\frac12$，求 $\sin\angle ABC$ 的值。
    answer: （1）$\overrightarrow{AE}=\frac45\vec a-\frac49\vec b$；（2）$\frac{2\sqrt5}{5}$
    solution_steps:
    - title: 官方解答
      content: 由 $AD\parallel BC$ 得对角线分点比例，$\overrightarrow{AE}=\frac45\vec a-\frac49\vec b$。再由直角三角形与相似关系计算得 $\sin\angle ABC=\frac{2\sqrt5}{5}$。
