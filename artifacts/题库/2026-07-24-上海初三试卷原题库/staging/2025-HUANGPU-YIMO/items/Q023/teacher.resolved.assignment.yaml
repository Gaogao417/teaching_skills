  - type: problem
    id: Q023
    points: 12
    stem_latex: 已知在 $\triangle ABC$ 中，$CD$ 平分 $\angle ACB$，$E$ 是 $CD$ 延长线上一点，$AE=AD$，$F$ 是 $AB$ 延长线上的点，连接 $CF$。（1）求证：$\triangle CEA\sim\triangle CDB$；（2）如果 $CF\parallel AE$，求证：$\frac{BD}{AD}=\frac{BF}{CF}$。
    answer: 两结论均成立
    solution_steps:
    - title: 官方证明
      content: 由 $AE=AD$、角平分线及对顶角关系得到两角对应相等，故 $\triangle CEA\sim\triangle CDB$。再由 $CF\parallel AE$ 得角关系，证明 $\triangle CFB\sim\triangle AFC$，结合前一相似三角形的比例即可得 $\frac{BD}{AD}=\frac{BF}{CF}$。
