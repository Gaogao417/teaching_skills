  - type: problem
    id: Q025
    points: 14
    stem_latex: 已知平行四边形 $ABCD$ 中，$AB=9$，$BC=5$，$\sin B=\frac45$，$P$ 是边 $AB$ 上一动点，过点 $P$ 作 $PE\perp PC$，交射线 $CD$ 于点 $E$，交 $AC$ 于点 $H$，$F$ 是 $PE$ 上的点，$\frac{FP}{PC}=\frac23$，连接 $CF$。（1）求证：$\angle BAC=\angle PCF$；（2）当 $\triangle APC\sim\triangle EFC$ 时，求 $BP$；（3）当 $\frac{S_{\triangle HFC}}{S_{\triangle PHC}}=\frac13$ 时，求 $\frac{AH}{AC}$。
    answer: （1）结论成立；（2）$BP=\frac{17}{3}$；（3）$\frac{AH}{AC}=\frac27$ 或 $\frac15$
    solution_steps:
    - title: 官方解答
      content: 作 $CG\perp AB$，由 $BC=5$、$\sin B=\frac45$ 得 $BG=3$、$CG=4$，从而 $\tan\angle BAC=\frac23=\tan\angle PCF$，得（1）。由平行线、相似三角形及比例关系得（2）$BP=\frac{17}{3}$。（3）按点 $F$ 在线段 $PH$ 的延长线上或在线段 $PH$ 上分类，分别得到 $\frac{AH}{AC}=\frac27$ 或 $\frac15$。
