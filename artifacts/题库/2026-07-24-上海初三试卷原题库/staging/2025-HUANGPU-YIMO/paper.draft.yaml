    block:
      stem_latex: >-
        在平面直角坐标系 $xOy$ 中，抛物线 $y=-x^2+4x+c\ (c>0)$ 与 $x$ 轴交于 $A、B$ 两点（$A$ 在 $B$ 的右侧），与 $y$ 轴交于点 $C$，顶点为 $P$，直线 $PC$ 与 $x$ 轴交于点 $D$。（1）用含 $c$ 的代数式表示点 $P、D$ 的坐标；（2）将抛物线上下、左右各平移一次，所得新抛物线的顶点 $P'$ 落在线段 $PC$ 的延长线上，新抛物线与 $y$ 轴交于 $E$，且 $P'E\perp PP'$。①求两次平移的方向和距离；②点 $A$ 的对应点 $A'$ 满足 $DA'$ 被 $y$ 轴平分，求原抛物线的表达式。
      answer: '（1）$P(2,c+4)$，$D(-\frac c2,0)$；（2）①向左平移$\frac52$个单位、向下平移5个单位；②$y=-x^2+4x+5$'
      solution_steps:
      - title: 官方解答
        content: >-
          （1）由顶点式及直线 $PC$ 得 $P(2,c+4)$、$D(-\frac c2,0)$。（2）由 $P'$ 在线段 $PC$ 延长线且 $P'E\perp PP'$，计算得 $P'(-\frac12,c-1)$，故向左平移 $\frac52$、向下平移5。再由 $DA'$ 被 $y$ 轴平分列式，取符合 $c>0$ 的解 $c=5$，故原式为 $y=-x^2+4x+5$。
