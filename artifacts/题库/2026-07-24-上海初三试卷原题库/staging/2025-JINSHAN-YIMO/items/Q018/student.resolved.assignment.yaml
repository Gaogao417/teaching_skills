    stem_latex: 在平面直角坐标系 $xOy$ 中，将抛物线 $l_1:y=ax^2+bx+c$（$a\ne0$）以原点为中心旋转 $180^\circ$ 得抛物线 $l_2$，称 $l_2$ 是 $l_1$ 的“中心对称抛物线”。已知抛物线 $y_1=x^2-3x-4$，将 $y_1$ 向左平移 $n$ 个单位，与 $x$ 轴的交点从左到右依次为 $A$、$B$；将 $y_1$ 的中心对称抛物线 $y_2$ 向右也平移 $n$ 个单位，与 $x$ 轴的交点从左到右依次为 $C$、$D$。当线段 $BC$ 是线段 $AB$、$BD$ 的比例中项时，$n$ 的值为 \fillin。
