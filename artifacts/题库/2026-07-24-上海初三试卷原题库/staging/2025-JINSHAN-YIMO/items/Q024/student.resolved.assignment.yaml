    stem_latex: 在平面直角坐标系 $xOy$ 中（如图），已知抛物线 $f(x)=x^2+(b+1)x+b$（$b<0$），$f(x)$ 的图像与 $x$ 轴的两个交点为点 $P$、点 $Q$（其中点 $P$ 在点 $Q$ 左侧）。\begin{enumerate}\item 若将 $f(x)$ 的图像向上平移 $2$ 个单位，得到的新抛物线 $g(x)$ 经过点 $(1,-3)$，求 $g(x)$；\item 若 $f(x)$ 的图像在直线 $x=1$ 的右侧呈上升趋势，求 $b$ 的取值范围；\item 在（1）中所求的 $g(x)$ 的图像与 $y$ 轴的交点记为点 $B$，与 $x$ 轴的正半轴交点记为点 $A$，点 $M$ 在 $g(x)$ 的图像上。当直线 $MQ$ 与直线 $PB$ 垂直，且 $QP=\dfrac35QA$ 时，求点 $M$ 的坐标。\end{enumerate}
