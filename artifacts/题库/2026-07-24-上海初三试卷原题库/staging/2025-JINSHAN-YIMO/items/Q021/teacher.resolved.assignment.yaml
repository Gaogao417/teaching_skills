  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，在矩形 $ABCD$ 中，$AB=2$，$BC=4$，对角线 $AC$、$BD$ 相交于点 $O$，点 $E$ 在边 $AD$ 上，且 $\angle AEO=\angle AOE$。\begin{enumerate}\item 求 $AE$ 的长；\item 求 $\tan\angle AEO$ 的值。\end{enumerate}
    answer: （1）$AE=\sqrt5$；（2）$\tan\angle AEO=\sqrt5+2$。
    solution_steps:
    - title: 官方解答
      content: （1）在矩形 $ABCD$ 中，$\angle ABC=90^\circ$，$OA=OC=\dfrac12AC$。由 $AB=2$，$BC=4$，得 $AC=2\sqrt5$，所以 $AO=\sqrt5$。又 $\angle AEO=\angle AOE$，故 $AE=AO=\sqrt5$。（2）过点 $O$ 作 $OH\perp AD$，垂足为 $H$。由矩形及中点关系得 $OH=1$。在 $\mathrm{Rt}\triangle AHO$ 中，$AO=\sqrt5$，$OH=1$，所以 $AH=2$；于是 $EH=\sqrt5-2$，故 $\tan\angle AEO=\dfrac{OH}{EH}=\sqrt5+2$。
