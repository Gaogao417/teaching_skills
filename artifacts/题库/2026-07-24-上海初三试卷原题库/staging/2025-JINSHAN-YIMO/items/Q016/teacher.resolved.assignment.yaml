    stem_latex: 某校初三数学活动小组利用尺规把线段 $AB$ 分割成两条线段：（1）过点 $B$ 作 $BC\perp AB$，使 $BC=\dfrac12AB$；（2）联结 $AC$，在线段 $CA$ 上截取 $CD=CB$；（3）在线段 $AB$ 上截取 $AE=AD$。那么 $\dfrac{AE}{BE}=$ \fillin。
    answer: $\dfrac{\sqrt5+1}{2}$
