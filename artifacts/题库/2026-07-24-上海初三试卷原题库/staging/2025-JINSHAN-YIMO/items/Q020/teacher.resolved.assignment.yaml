  - type: problem
    id: Q020
    points: 10
    stem_latex: 在平面直角坐标系 $xOy$ 中，已知抛物线 $y=ax^2+bx$ 经过点 $A(-4,3)$ 和 $B(2,1)$。\begin{enumerate}\item 求抛物线的表达式；\item 若点 $C(6,m)$ 在抛物线 $y=ax^2+bx$ 上，求 $\angle ACO$ 的正弦值。\end{enumerate}
    answer: （1）$y=\dfrac5{24}x^2+\dfrac1{12}x$；（2）$\sin\angle ACO=\dfrac{\sqrt5}{5}$。
    solution_steps:
    - title: 官方解答
      content: （1）将 $A(-4,3)$、$B(2,1)$ 代入 $y=ax^2+bx$，得 $\begin{cases}3=16a-4b,\\1=4a+2b.\end{cases}$ 解得 $a=\dfrac5{24}$，$b=\dfrac1{12}$，所以 $y=\dfrac5{24}x^2+\dfrac1{12}x$。（2）点 $C(6,m)$ 在抛物线上，得 $m=8$，即 $C(6,8)$。由 $C(6,8)$、$A(-4,3)$、$O(0,0)$ 得 $OA=5$，$OC=10$，$AC=5\sqrt5$，且 $OA^2+OC^2=AC^2$，故 $\triangle AOC$ 为直角三角形，$\sin\angle ACO=\dfrac{OA}{AC}=\dfrac1{\sqrt5}$。
    solution_notes:
    - 官方解答在判定直角三角形处写作“△ABC”，结合点坐标与后续 $\sin\angle ACO$ 应为“△AOC”；原错字保留在来源截图。
