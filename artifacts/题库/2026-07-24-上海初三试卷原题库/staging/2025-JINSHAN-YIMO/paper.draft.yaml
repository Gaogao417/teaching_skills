            - {source: documents/初三/2025届-上海市金山区-初三一模数学-试卷及参考答案/008.png, box_px: [150, 120, 930, 950]}
        block:
          stem_latex: '如图，$\triangle ABC$ 和 $\triangle DEF$ 都是直角三角形纸片，$\angle A=\angle D=90^\circ$，且 $\triangle ABC$ 与 $\triangle DEF$ 不相似。其中 $AB=a$，$AC=b$，$DE=m$，$DF=n$（$n>b>a>m$）。是否存在经过锐角顶点的一条直线，能把 $\triangle ABC$ 或 $\triangle DEF$ 分割成两个三角形，使分割所得的两个三角形中有一个三角形（面积记为 $S$）与没有分割的三角形相似？如果存在：（1）写出一个分割方案并证明；（2）按照该方案求 $S$ 的值。'
          answer: '存在。例如过点 $E$ 的直线交边 $DF$ 于点 $G$，使 $\angle DEG=\angle B$；此时 $S=\dfrac{bm^2}{2a}$。'
          solution_steps:
            - title: 官方解答
              content: '过点 $E$ 的直线交边 $DF$ 于点 $G$，使 $\angle DEG=\angle B$。由 $\angle A=\angle D=90^\circ$，$AB=a$，$AC=b$，$DE=m$，$DF=n$，有 $\tan B=\dfrac ba$，$\tan C=\dfrac ab$，$\tan E=\dfrac nm$，$\tan F=\dfrac mn$。因 $n>b>a>m$，所以 $\tan E>\tan B>\tan C>\tan F$，即 $\angle E>\angle B>\angle C>\angle F$，方案可行。又 $\angle A=\angle D=90^\circ$，$\angle DEG=\angle B$，故 $\triangle ABC\sim\triangle DEG$。由 $\dfrac{AB}{DE}=\dfrac{AC}{DG}$，得 $DG=\dfrac{bm}{a}$，所以 $S=\dfrac12DE\cdot DG=\dfrac{bm^2}{2a}$。其余答案有 $S=\dfrac{am^2}{2b}$、$\dfrac{a^2m}{2n}$、$\dfrac{b^2m}{2n}$。'
