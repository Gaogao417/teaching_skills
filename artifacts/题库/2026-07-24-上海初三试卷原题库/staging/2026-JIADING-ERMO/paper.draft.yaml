      answer: D
      explanation: 官方参考答案：D。
      solution_steps:
      - 甲平均数 $=\frac{1}{5}(9.7+10+9.6+9.8+9.9)=9.8$，中位数 $=9.8$，方差 $=\frac{1}{5}[(9.7-9.8)^2+\cdots]=0.02$。$0.02<0.032$，甲更稳定，应选甲。
      clue: 计算甲的平均数、中位数、方差，与乙比较。
