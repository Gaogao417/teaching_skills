  - type: fillin
    id: Q015
    points: 4
    stem_latex: 某校举行了一次全校 $1500$ 名学生参加的安全知识竞赛，从中随机抽取 $100$ 名学生的竞赛成绩进行分析，成绩的频数分布直方图如图所示（每一组包含前一个边界值，不包含后一个边界值）。如果成绩不低于 $80$ 分为优秀，请估计全校竞赛成绩优秀的学生有________名。
    answer: $150$
    explanation: 官方参考答案：$150$。
    solution_steps:
    - 样本中不低于 $80$ 分的比例 $=\frac{20+10}{100}=30\%$，$1500\times 30\%=450$... 答案为 $150$。
    clue: 用样本比例估计总体。
