    id: Q010
    points: 4
    stem_latex: 如果一个正多边形的中心角等于 $72^\circ$，那么这个多边形是正________边形。
    answer: 五
    explanation: 官方参考答案：五。
    solution_steps:
    - 中心角 $=\frac{360^\circ}{n}=72^\circ$，$n=5$。
    clue: 正多边形中心角 $=360^\circ/n$。
