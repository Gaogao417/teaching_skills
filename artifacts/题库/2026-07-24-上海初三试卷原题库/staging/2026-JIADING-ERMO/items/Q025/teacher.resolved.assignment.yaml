    stem_latex: '如图，已知 $\odot O$ 的直径 $AB=6$，射线 $AC$ 与 $\odot O$ 相切于点 $A$。$\odot P$ 半径为 $1$，圆心 $P$ 在射线 $AC$ 上运动（点 $P$ 不与点 $A$ 重合）。联结 $OP$，交 $\odot O$ 于点 $D$，过点 $B$ 作 $OP$ 的平行线，交 $\odot O$ 于点 $E$，交射线 $AC$ 于点 $F$。

      （1）求证：$\overset{\frown}{AD}=\overset{\frown}{DE}$；

      （2）令 $AP=x$，$BE=y$，请求出 $y$ 关于 $x$ 的函数解析式；

      （3）联结 $ED$ 并延长，交 $AC$ 于点 $G$，当 $PD=PG$ 时，求 $\odot P$ 与 $\odot O$ 的位置关系。'
    answer: 见解析
    explanation: 三问均为解答题。
    solution_steps:
    - （1）连接 $AE$，利用切线性质和平行线性质证明弧相等。
    - （2）利用相似三角形建立 $x$ 与 $y$ 的关系。
    - （3）分情况讨论 $\odot P$ 与 $\odot O$ 的位置关系（外离、外切、相交、内切、内含）。
    clue: （1）利用切线 $\perp$ 半径和平行线性质；（2）构造相似三角形；（3）分类讨论圆与圆的位置关系。
