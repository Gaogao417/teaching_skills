  blocks:
  - type: fillin
    id: Q014
    points: 4
    stem_latex: 如图，已知点 $D$、$E$ 分别是 $\triangle ABC$ 的边 $AB$ 和 $AC$ 的中点，如果向量 $\overrightarrow{AB}=\vec{a}$，$\overrightarrow{AC}=\vec{b}$，那么向量 $\overrightarrow{DE}=$________（结果用 $\vec{a}$、$\vec{b}$ 表示）。
    answer: $\dfrac{1}{2}(\vec{b}-\vec{a})$
    explanation: 官方参考答案：$\dfrac{1}{2}(\vec{b}-\vec{a})$。
    solution_steps:
    - $\overrightarrow{BC}=\overrightarrow{AC}-\overrightarrow{AB}=\vec{b}-\vec{a}$，$DE$ 为中位线，$\overrightarrow{DE}=\frac{1}{2}\overrightarrow{BC}=\frac{1}{2}(\vec{b}-\vec{a})$。
    clue: 利用三角形中位线定理和向量减法。
