  - type: fillin
    id: Q016
    points: 4
    stem_latex: 药物燃烧时，室内每立方米空气中的含药量 $y$（毫克）与时间 $x$（分钟）之间的函数关系如图所示（药物燃烧时为正比例函数，燃烧后为反比例函数）。现测得药物 $8$ 分钟燃毕，此时含药量为 $6$ 毫克。当含药量不低于 $3$ 毫克为有效浓度，则此次药物维持有效浓度的时长是________分钟。
    answer: $12$
    explanation: 官方参考答案：$12$。
    solution_steps:
    - 燃烧时 $y=\frac{3}{4}x$（$0\leq x\leq 8$），燃烧后 $y=\frac{48}{x}$（$x>8$）。$y=3$ 时 $x=4$（燃烧时）和 $x=16$（燃烧后），$16-4=12$ 分钟。
    clue: 分别求出正比例和反比例函数解析式，再求 $y=3$ 时的两个 $x$ 值。
