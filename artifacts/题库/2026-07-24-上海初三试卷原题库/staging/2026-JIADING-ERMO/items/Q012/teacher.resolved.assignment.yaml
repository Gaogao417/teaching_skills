  - type: fillin
    id: Q012
    points: 4
    stem_latex: 已知该小行星与地球的最近距离约为月球远地点距离的 $45$ 倍，月球远地点距离约为 $4\times 10^5$ 千米，则该小行星与地球的最近距离约为________千米。
    answer: $1.8\times 10^7$
    explanation: 官方参考答案：$1.8\times 10^7$。
    solution_steps:
    - $45\times 4\times 10^5=180\times 10^5=1.8\times 10^7$。
    clue: 科学记数法乘法运算。
