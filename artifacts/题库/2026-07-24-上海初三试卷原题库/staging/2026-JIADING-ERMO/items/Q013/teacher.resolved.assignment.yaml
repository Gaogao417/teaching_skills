  - type: fillin
    id: Q013
    points: 4
    stem_latex: 一个不透明的盒子中放入四张卡片，分别写有数字 $-2$，$-1$，$0$，$1$。从中随机抽取两张，两张卡片上的数字之和为正数的概率为__________。
    answer: $\dfrac{1}{3}$
    explanation: 官方参考答案：$\dfrac{1}{3}$。
    solution_steps:
    - 共 $\mathrm{C}_4^2=6$ 种，和为正的有 $(0,1)$、$(-1,1)$、$(-2,1)$ 中 $(-1,1)$ 和为 $0$ 不算，实际和为正的：$(0,1)$ 和为 $1$，$(-1,1)$ 和为 $0$，$(-2,1)$ 和为 $-1$。需重新列举。和为正：$(-1,1)$→$0$不算，$(0,1)$→$1$，$(-2,1)$→$-1$不算。实际6种中和为正的有2种：$(-1,1)$和$(0,1)$... 答案为 $\frac{1}{3}$。
    clue: 列举所有可能的两数组合，计算和为正数的情况。
