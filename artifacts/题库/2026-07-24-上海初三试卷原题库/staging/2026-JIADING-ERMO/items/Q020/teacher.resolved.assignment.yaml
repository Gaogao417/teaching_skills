  - type: problem
    id: Q020
    points: 10
    stem_latex: 解不等式组 $\begin{cases}2(x+1)>x\\1-2x\geq \dfrac{x+7}{2}\end{cases}$，并把它的解集在数轴上表示出来。
    answer: $-2<x\leq -1$
    explanation: 官方参考答案：$-2<x\leq -1$。
    solution_steps:
    - 由①得 $x>-2$；由②得 $1-2x\geq\frac{x+7}{2}$，$2-4x\geq x+7$，$-5x\geq 5$，$x\leq -1$。解集为 $-2<x\leq -1$。
    clue: 分别解两个不等式，取交集。
