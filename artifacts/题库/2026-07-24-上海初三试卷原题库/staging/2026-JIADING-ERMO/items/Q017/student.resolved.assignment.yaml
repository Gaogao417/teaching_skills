    stem_latex: 我们称能完全覆盖某平面图形的圆为该平面图形的覆盖圆，直径最小的覆盖圆称为最小覆盖圆。矩形 $ABCD$ 中，$AB=1$，$BC=2$，则矩形 $ABCD$ 的最小覆盖圆的半径为__________。
