  - type: fillin
    id: Q017
    points: 4
    stem_latex: 我们称能完全覆盖某平面图形的圆为该平面图形的覆盖圆，直径最小的覆盖圆称为最小覆盖圆。矩形 $ABCD$ 中，$AB=1$，$BC=2$，则矩形 $ABCD$ 的最小覆盖圆的半径为__________。
    answer: $\dfrac{\sqrt{5}}{2}$
    explanation: 官方参考答案：$\dfrac{\sqrt{5}}{2}$。
    solution_steps:
    - 矩形最小覆盖圆以对角线为直径，$AC=\sqrt{1^2+2^2}=\sqrt{5}$，半径 $=\frac{\sqrt{5}}{2}$。
    clue: 矩形的最小覆盖圆是以对角线为直径的圆。
