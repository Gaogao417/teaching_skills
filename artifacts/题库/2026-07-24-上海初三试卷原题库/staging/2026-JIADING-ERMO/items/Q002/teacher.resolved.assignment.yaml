  - type: choice
    id: Q002
    points: 4
    stem_latex: 下列函数中，函数值 $y$ 随自变量 $x$ 的值增大而增大的是（\quad）
    choices:
    - $y=\dfrac{1}{2}x$
    - $y=x^2$
    - $y=-x-3$
    - $y=\dfrac{2}{x}$
    answer: A
    explanation: 官方参考答案：A。
    solution_steps:
    - 'A: 正比例函数 $k=\frac{1}{2}>0$，$y$ 随 $x$ 增大而增大；B: $x>0$ 时增大，$x<0$ 时减小；C: $k=-1<0$，$y$ 随 $x$ 增大而减小；D: $k=2>0$，在每个象限内 $y$ 随 $x$ 增大而减小。'
    clue: 根据各类函数的单调性逐项判断。
