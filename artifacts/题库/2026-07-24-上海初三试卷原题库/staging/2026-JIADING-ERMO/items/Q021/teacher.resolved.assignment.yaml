  - type: problem
    id: Q021
    points: 10
    stem_latex: 无人机对茶园进行病虫害防治。已知使用无人机每小时对茶园打药的作业面积比人工每小时多 $50$ 亩，且对 $600$ 亩茶园使用无人机打药的时间比人工打药的时间少 $50$ 小时，求使用无人机每小时对茶园打药的作业面积。
    answer: 使用无人机每小时作业面积为 $60$ 亩
    explanation: 官方参考答案：$60$ 亩。
    solution_steps:
    - 设无人机每小时 $x$ 亩，则人工每小时 $(x-50)$ 亩。$\frac{600}{x}=\frac{600}{x-50}-50$，解得 $x_1=60$，$x_2=-10$（舍去）。
    clue: 设未知数，根据时间差列分式方程。
