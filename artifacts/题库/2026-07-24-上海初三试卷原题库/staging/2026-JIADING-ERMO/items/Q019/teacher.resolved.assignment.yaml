    stem_latex: 计算：$|1-\sqrt{3}|+\dfrac{1}{\sqrt{3}-\sqrt{2}}-8^{\frac{1}{2}}+\left(\dfrac{1}{2}\right)^{-2}$。
    answer: $2\sqrt{3}-\sqrt{2}+3$
    explanation: 官方参考答案：$2\sqrt{3}-\sqrt{2}+3$。
    solution_steps:
    - $=\sqrt{3}-1+\frac{\sqrt{3}+\sqrt{2}}{(\sqrt{3}-\sqrt{2})(\sqrt{3}+\sqrt{2})}-2\sqrt{2}+4$
    - $=\sqrt{3}-1+\sqrt{3}+\sqrt{2}-2\sqrt{2}+4=2\sqrt{3}-\sqrt{2}+3$。
    clue: 分别化简绝对值、分母有理化、分数指数幂、负整数指数幂。
