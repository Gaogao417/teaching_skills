  - type: fillin
    id: Q008
    points: 4
    stem_latex: 方程 $\sqrt{2x-3}=3-x$ 的解是__________。
    answer: $x=2$
    explanation: 官方参考答案：$x=2$。
    solution_steps:
    - 两边平方得 $2x-3=(3-x)^2$，整理 $x^2-8x+12=0$，$(x-2)(x-6)=0$。检验 $x=6$ 不合（$\sqrt{9}=3\neq -3$），$x=2$ 合。
    clue: 无理方程需两边平方后检验。
