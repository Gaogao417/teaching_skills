  - type: fillin
    id: Q009
    points: 4
    stem_latex: 如果关于 $x$ 的一元二次方程 $x^2-2x+c=0$ 无实数根，那么实数 $c$ 的取值范围是__________。
    answer: $c>1$
    explanation: 官方参考答案：$c>1$。
    solution_steps:
    - $\Delta=(-2)^2-4c=4-4c<0$，解得 $c>1$。
    clue: 无实数根等价于判别式 $\Delta<0$。
