  - type: fillin
    id: Q018
    points: 4
    stem_latex: 如图，已知 $\odot O$ 的直径为 $10$，翻折劣弧 $BC$ 使其与直径 $AB$ 交于点 $D$，如果 $BD=8$，那么折痕 $BC$ 的长为__________。
    answer: $3\sqrt{10}$
    explanation: 官方参考答案：$3\sqrt{10}$。
    solution_steps:
    - 连接 $AC$、$DC$，$CE\perp AB$ 于 $E$。$AD=2$，$AE=DE=1$，$BE=9$。由 $\cos\angle ABC$ 在两个直角三角形中相等，$\frac{9}{BC}=\frac{BC}{10}$，$BC=3\sqrt{10}$。
    clue: 利用翻折性质和圆周角定理，构造直角三角形。
