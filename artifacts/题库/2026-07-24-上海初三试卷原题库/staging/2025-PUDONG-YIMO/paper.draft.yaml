            - {source: documents/初三/2025届-上海市浦东新区-初三一模数学-试卷及参考答案/009.png, box_px: [150, 120, 930, 880]}
        block:
          stem_latex: '如图，在 $\triangle ABC$ 中，$\angle ABC=90^\circ$，点 $D$ 是边 $AB$ 上的一点，联结 $CD$，过点 $B$ 作 $BE\perp CD$，垂足为点 $E$。\begin{enumerate}\item 求证：$\triangle BDE\sim\triangle CBE$；\item 如果 $AB=BC$，联结 $AE$ 并延长，与边 $BC$ 相交于点 $F$。当点 $F$ 是 $BC$ 的中点时，求证：$BD^2=AD\cdot AB$。\end{enumerate}'
          answer: 证明见官方解答。
          solution_steps:
            - title: 官方解答
              content: '（1）$\because BE\perp CD$，$\therefore\angle DEB=\angle CEB=90^\circ$；又 $\angle ABC=90^\circ$，故 $\triangle BDE\sim\triangle CBE$。（2）方法一：$\because BE\perp CD$，点 $F$ 是 $BC$ 的中点，$\therefore CF=EF$，从而 $\angle ECF=\angle CEF$。由（1）得 $\angle ECB=\angle DBE$，所以 $\angle CEF=\angle AED$，继而 $\triangle AED\sim\triangle ABE$，得 $\dfrac{AE}{AB}=\dfrac{ED}{BE}=\dfrac{AD}{AE}$。又由（1）得 $\dfrac{AB}{BE}=\dfrac{ED}{BC}$。设 $FB=FC=FE=a$，则 $AB=2a$，$AF=\sqrt5a$，$AE=(\sqrt5-1)a$，故 $AD=(3-\sqrt5)a$，$BD=(\sqrt5-1)a$，于是 $AE=BD$，结合 $AE^2=AD\cdot AB$，得 $BD^2=AD\cdot AB$。'
