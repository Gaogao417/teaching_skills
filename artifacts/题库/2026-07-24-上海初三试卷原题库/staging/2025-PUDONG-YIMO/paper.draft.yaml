        official_solution:
          start_anchor: '24. 解：'
          end_anchor: '25. 解：'
          crops:
            - {source: documents/初三/2025届-上海市浦东新区-初三一模数学-试卷及参考答案/010.png, box_px: [150, 120, 930, 1010]}
        block:
          stem_latex: '如图，在平面直角坐标系 $xOy$ 中，抛物线 $M_1:y=ax^2-2ax+c$ 与 $x$ 轴交于点 $A(-3,0)$ 和点 $B$，与 $y$ 轴交于点 $C(0,5)$。\begin{enumerate}\item 求抛物线 $M_1$ 的解析式；\item 把抛物线 $M_1$ 向下平移 $m$ 个单位（$m>0$）得到抛物线 $M_2$，记 $M_2$ 的顶点为 $D$，与 $y$ 轴交于点 $E$，直线 $DE$ 与 $x$ 轴交于点 $P$。\begin{enumerate}\item 当点 $P$ 与点 $A$ 重合时，求 $m$ 的值；\item 记点 $B$ 平移后的对应点为 $B^\prime$，如果 $BD\parallel B^\prime P$，求此时点 $D$ 的坐标。\end{enumerate}\end{enumerate}'
          answer: '（1）$y=-\dfrac13x^2+\dfrac23x+5$；（2）①$m=4$；②$D(1,-\dfrac83)$ 或 $D(1,-\dfrac43)$。'
          solution_steps:
            - title: 官方解答
              content: '（1）将 $A(-3,0)$、$C(0,5)$ 代入，解得 $a=-\dfrac13$，$c=5$，所以 $M_1:y=-\dfrac13x^2+\dfrac23x+5$。（2）$M_2:y=-\dfrac13(x-1)^2+\dfrac{16}{3}-m$，所以 $D(1,\dfrac{16}{3}-m)$，$E(0,5-m)$，直线 $DE$ 与 $x$ 轴交于 $P(3m-15,0)$。①由 $P=A(-3,0)$ 得 $m=4$。②由 $BD\parallel B^\prime P$ 分点 $P$ 在点 $B$ 左、右两侧讨论，解得 $m=8$ 或 $m=\dfrac{20}{3}$，所以 $D(1,-\dfrac83)$ 或 $D(1,-\dfrac43)$。'
