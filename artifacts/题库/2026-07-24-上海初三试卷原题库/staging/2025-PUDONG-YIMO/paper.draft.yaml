          end_anchor: '23. 证明：'
          crops:
            - {source: documents/初三/2025届-上海市浦东新区-初三一模数学-试卷及参考答案/007.png, box_px: [150, 530, 930, 1450]}
            - {source: documents/初三/2025届-上海市浦东新区-初三一模数学-试卷及参考答案/008.png, box_px: [150, 120, 930, 850]}
        block:
          stem_latex: '上海世博文化公园的双子山是近期游客的热门打卡地。某校实践小组利用所学知识测量双子山主峰的高度，他们设计了两个测量方案，并完成了实地测量。方案一测量距离 $CD=10\text{ m}$，仰角 $\alpha=12^\circ$、$\beta=11.5^\circ$；方案二测量高度 $CD=1.3\text{ m}$，仰角 $\alpha=12^\circ$、$\beta=11.7^\circ$。任务一：选择其中一种方案，求双子山主峰 $AB$ 的高度（结果保留 $1$ 位小数）。参考数据：$\tan12^\circ=0.213$，$\cot12^\circ=4.705$，$\tan11.5^\circ=0.204$，$\cot11.5^\circ=4.915$，$\tan11.7^\circ=0.207$，$\cot11.7^\circ=4.829$。任务二：官网显示双子山主峰高度为 $48$ 米，请用一句话说明求出的高度与 $48$ 米不一致的原因。'
          answer: '任务一：选择方案一可得约 $48.3$ 米或 $47.6$ 米；选择方案二可得约 $50.8$ 米、$45.4$ 米、$46.8$ 米或 $49.9$ 米等。任务二：从测量误差、海拔口径或近似精度等角度合理说明。'
          solution_steps:
            - title: 官方解答（方案一示例）
              content: '选择方案一。在 $\mathrm{Rt}\triangle ABC$ 中，$\tan\alpha=\dfrac{AB}{BC}$，故 $AB=BC\tan\alpha$；在 $\mathrm{Rt}\triangle ABD$ 中，$\tan\beta=\dfrac{AB}{BD}$，故 $AB=BD\tan\beta$。又 $BD-BC=CD=10$，所以 $BC\tan12^\circ=BC\tan11.5^\circ+10\tan11.5^\circ$，解得 $BC\approx226.67$，$AB\approx48.3$ 米。用余切法可得 $AB\cot11.5^\circ-AB\cot12^\circ=10$，解得 $AB\approx47.6$ 米。任务二：可从物理（测量）、地理（海拔）或数学（乘除选择、精确度）等角度说明，言之有理即可。'
