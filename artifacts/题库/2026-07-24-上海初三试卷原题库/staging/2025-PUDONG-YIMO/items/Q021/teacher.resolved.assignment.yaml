  - type: problem
    id: Q021
    points: 10
    stem_latex: 如图，平行四边形 $ABCD$ 中，点 $E$ 为边 $CD$ 上的一点，$CE=2DE$，$AC$ 与 $BE$ 相交于点 $F$，设 $\overrightarrow{AB}=\vec a$，$\overrightarrow{AD}=\vec b$。\begin{enumerate}\item 用向量 $\vec a$、$\vec b$ 分别表示：$\overrightarrow{CE}$、$\overrightarrow{AE}$、$\overrightarrow{AF}$；\item 在图中求作 $\overrightarrow{AF}$ 分别在 $\vec a$、$\vec b$ 方向上的分向量。（不要求写作法，但要指出所作图中表示结论的分向量）\end{enumerate}
    answer: （1）$\overrightarrow{CE}=-\dfrac23\vec a$，$\overrightarrow{AE}=\dfrac13\vec a+\vec b$，$\overrightarrow{AF}=\dfrac35\vec a+\dfrac35\vec b$；（2）正确作图并写出结论。
