    stem_latex: 上海世博文化公园的双子山是近期游客的热门打卡地。某校实践小组利用所学知识测量双子山主峰的高度，他们设计了两个测量方案，并完成了实地测量。方案一测量距离 $CD=10\text{ m}$，仰角 $\alpha=12^\circ$、$\beta=11.5^\circ$；方案二测量高度 $CD=1.3\text{ m}$，仰角 $\alpha=12^\circ$、$\beta=11.7^\circ$。任务一：选择其中一种方案，求双子山主峰 $AB$ 的高度（结果保留 $1$ 位小数）。参考数据：$\tan12^\circ=0.213$，$\cot12^\circ=4.705$，$\tan11.5^\circ=0.204$，$\cot11.5^\circ=4.915$，$\tan11.7^\circ=0.207$，$\cot11.7^\circ=4.829$。任务二：官网显示双子山主峰高度为 $48$ 米，请用一句话说明求出的高度与 $48$ 米不一致的原因。
