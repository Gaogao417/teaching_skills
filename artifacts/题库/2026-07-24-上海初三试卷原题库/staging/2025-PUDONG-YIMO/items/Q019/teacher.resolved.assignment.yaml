    stem_latex: 计算：$\dfrac{2\cos60^\circ}{2\sin45^\circ-\cot45^\circ}-\sqrt3\tan60^\circ$。
    answer: $\sqrt2-2$
    solution_steps:
    - title: 官方解答
      content: 原式 $=\dfrac{2\times\frac12}{2\times\frac{\sqrt2}{2}-1}-\sqrt3\times\sqrt3=\dfrac1{\sqrt2-1}-3=\sqrt2-2$。
