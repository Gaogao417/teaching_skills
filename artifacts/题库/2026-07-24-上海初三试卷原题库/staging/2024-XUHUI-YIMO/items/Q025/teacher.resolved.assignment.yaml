    stem_latex: 如图，在 $\mathrm{Rt}\triangle ABC$ 中，$\angle BAC=90^\circ,\ AB=AC=2\sqrt2$，点 $D$ 是边 $AB$ 上的动点（点 $D$ 不与点 $B$ 重合），以 $CD$ 为斜边在直线 $BC$ 上方作等腰直角三角形 $DEC$。（1）当点 $D$ 是边 $AB$ 的中点时，求 $\sin\angle DCB$；（2）联结 $AE$，点 $D$ 在边 $AB$ 上运动时，$\angle EAC$ 的大小是否变化？说明理由或求其大小；（3）设 $DE$ 与 $AC$ 交于点 $G$，点 $P$ 是边 $BC$ 上的一点，且 $\angle CPD=\angle CGD$，如果点 $P$ 到直线 $CD$ 的距离等于线段 $GE$ 的长度，求 $\triangle CDE$ 的面积。
    answer: （1）$\frac{\sqrt{10}}{10}$；（2）不变，$\angle EAC=45^\circ$；（3）$8-4\sqrt2$。
