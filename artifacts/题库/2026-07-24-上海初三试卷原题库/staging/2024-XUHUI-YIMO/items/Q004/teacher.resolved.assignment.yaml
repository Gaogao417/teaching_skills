    stem_latex: 如图，已知平行四边形 $ABCD$ 的对角线 $AC$ 和 $BD$ 交于点 $O$，设 $\overrightarrow{OA}=\vec a,\ \overrightarrow{OB}=\vec b$，那么向量 $\overrightarrow{OC},\overrightarrow{OD},\overrightarrow{AB},\overrightarrow{BC}$ 关于 $\vec a,\vec b$ 的分解式中，下列结论正确的是（　）。
