    stem_latex: 如图，小杰在学习了“仰角、俯角、坡比”后，在小区设计测量方案：斜坡 $CD$ 的坡比是 $i=1:6$，在斜坡底端 $C$ 测得高楼顶端 $A$ 的仰角是 $60^\circ$，沿斜坡走到 $D$ 处再测得仰角是 $37^\circ$，已知 $B,C,E$ 三点在一直线上，且 $BC=20\sqrt3$ 米。（1）求高楼 $AB$ 的高度；（2）求点 $D$ 离地面的距离（结果精确到0.1米）。
    answer: （1）60米；（2）约6.2米。
