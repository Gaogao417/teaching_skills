    stem_latex: 如图，在梯形 $ABCD$ 中，$AD\parallel BC$，$BD$ 平分 $\angle ABC$，$CD=BD=8,\ AB=5$。（1）求 $BC$ 的长；（2）设 $\overrightarrow{AB}=\vec a,\ \overrightarrow{BC}=\vec b$，求向量 $\overrightarrow{BD}$（用向量 $\vec a,\vec b$ 表示）。
    answer: （1）$\frac{64}{5}$；（2）$\overrightarrow{BD}=\frac{25}{64}\vec b-\vec a$。
