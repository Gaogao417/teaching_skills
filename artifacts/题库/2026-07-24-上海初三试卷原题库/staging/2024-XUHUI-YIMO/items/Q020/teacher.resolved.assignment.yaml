    stem_latex: 已知抛物线 $y=-x^2+bx+3$ 与 $y$ 轴交于点 $C$，与 $x$ 轴交于点 $A(-1,0)$ 和点 $B$，顶点为 $D$。（1）求此抛物线的表达式及顶点 $D$ 坐标；（2）联结 $CD,BD$，求 $\angle CDB$ 的余弦值。
    answer: （1）$y=-x^2+2x+3,\ D(1,4)$；（2）$\frac{\sqrt{10}}{10}$。
