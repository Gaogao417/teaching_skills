    stem_latex: 如图，在平面直角坐标系 $xOy$ 中，第二象限的点 $M$ 在抛物线 $y=ax^2\ (a>0)$ 上，点 $M$ 到两坐标轴的距离都是2。（1）求该抛物线的表达式；（2）将抛物线先向右平移 $\frac32$ 个单位，再向下平移 $k\ (k>0)$ 个单位，所得新抛物线与 $x$ 轴交于点 $A(m,0),B(n,0)$，已知 $m<n,\ mn=-4$，与 $y$ 轴交于点 $C$。①求 $k$；②设直线 $y=-\frac43x$ 与新抛物线对称轴交于点 $D$，点 $P$ 是该直线上位于点 $D$ 下方的一点，联结 $CD,CP$，如果 $\tan\angle PCD=\frac34$，求点 $P$ 的坐标。
