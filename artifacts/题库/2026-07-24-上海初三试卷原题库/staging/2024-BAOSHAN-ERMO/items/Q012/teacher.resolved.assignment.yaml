  - type: short_answer
    id: Q012
    points: 4
    stem_latex: 某厂生产了 $1000$ 只灯泡。从中随机抽取了 $50$ 只灯泡进行检测，结果有 $28$ 只灯泡的使用寿命超过了 $2500$ 小时，那么估计这 $1000$ 只灯泡中使用寿命超过 $2500$ 小时的灯泡的数量为\u3000\u3000\u3000\u3000只。
    answer: $560$
    clue: 用样本比例估计总体。
    solution_steps:
    - 设所求数量为 $x$，则 $28:50=x:1000$，解得 $x=560$。
