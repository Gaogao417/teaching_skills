  - type: problem
    id: Q023
    points: 12
    stem_latex: '（本题满分 $12$ 分，第(1)小题满分 $6$ 分，第(2)小题满分 $6$ 分）如图10，在 $\odot O$ 中，直径 $AB$ 垂直于弦 $CD$，垂足为点 $E$，联结 $AC$、$DO$，延长 $DO$ 交 $AC$ 于点 $F$。

      (1) 求证：$AF^2=OF\cdot DF$；

      (2) 如果 $CD=8$，$BE=2$，求 $OF$ 的长。'
    answer: (1) 证明见详解；(2) $OF=\dfrac{25}{11}$
    clue: (1) 联结 $AD$，证 $\triangle AFO\sim\triangle AFD$；(2) 垂径定理+勾股定理求半径，再用相似列比例。
    solution_steps:
    - (1) 联结 $AD$，$AB\perp CD$ 得 $CE=DE$，$AC=AD$，$\angle FAO=\angle DAO$。
    - $OA=OD$ 得 $\angle DAO=\angle ODA$，$\therefore\angle FAO=\angle ODA$。
    - 又 $\angle AFO=\angle AFD$，$\therefore\triangle AFO\sim\triangle AFD$，$\therefore\dfrac{AF}{OF}=\dfrac{DF}{AF}$，即 $AF^2=OF\cdot DF$。
    - (2) $CE=DE=4$，设 $OD=OB=r$，$OE=r-2$，$(r-2)^2+4^2=r^2$，$r=5$，$OE=3$，$AE=8$。
    - $AD=\sqrt{8^2+4^2}=4\sqrt{5}$，由相似 $\dfrac{AF}{OF}=\dfrac{DF}{AF}=\dfrac{AO}{AD}=\dfrac{5}{4\sqrt{5}}$。
    - 设 $OF=x$，$AF=y$，$\dfrac{y}{x}=\dfrac{x+5}{y}=\dfrac{5}{4\sqrt{5}}$，解得 $x=\dfrac{25}{11}$。
