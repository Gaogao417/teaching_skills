  - type: problem
    id: Q021
    points: 10
    stem_latex: '（本题满分 $10$ 分，第(1)小题满分 $5$ 分，第(2)小题满分 $5$ 分）如图7，在平面直角坐标系 $xOy$ 中，直线 $y=x+3$ 与 $x$ 轴、$y$ 轴分别交于点 $A$、$B$，与反比例函数 $y=\dfrac{k}{x}$ 的图像交于点 $C(2,m)$。

      (1) 求反比例函数的解析式；

      (2) 过点 $C$ 作 $x$ 轴的平行线 $l$，如果点 $D$ 在直线 $l$ 上，且 $CD=3$，求 $\triangle ABD$ 的面积。'
    answer: (1) $y=\dfrac{10}{x}$；(2) $\dfrac{9}{2}$
    clue: (1) 直线求 $C$ 坐标再代入反比例函数；(2) $S_{\triangle ABD}=S_{\triangle ACD}-S_{\triangle BCD}$。
    solution_steps:
    - (1) $y=x+3$ 过 $C(2,m)$，$m=5$，$C(2,5)$；$k=2\times5=10$，$\therefore y=\dfrac{10}{x}$。
    - (2) $A(-3,0)$，$B(0,3)$，$D$ 在直线 $y=5$ 上，$CD=3$。
    - $S_{\triangle ABD}=S_{\triangle ACD}-S_{\triangle BCD}=\dfrac{1}{2}\times3\times(5-2)=\dfrac{9}{2}$。
