    stem_latex: 我国天文学家算出了仙女星系\u201c体重\u201d。计算得到仙女星系质量约为 $11400$ 亿倍太阳质量。把数据 $11400$ 亿用科学记数法表示应是\u3000\u3000\u3000\u3000。
    answer: $1.14\times10^{12}$
    clue: $11400$ 亿 $=11400\times10^8=1.14\times10^{12}$。
    solution_steps:
    - $11400\text{亿}=1.14\times10^4\times10^8=1.14\times10^{12}$。
