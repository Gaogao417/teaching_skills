  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图4，把某场馆的一个正方形区域改造成一个由矩形和半圆形组成的活动场地，矩形 $ABCD$ 是观众观演区，阴影部分是舞台，$CD$ 是半圆 $O$ 的直径，弦 $EF$ 与 $CD$ 平行。已知 $EF$ 长 $8$ 米，舞台区域最大深度为 $2$ 米，如果每平方米最多可以坐 $3$ 名观众，那么观演区可容纳\u3000\u3000\u3000\u3000名观众。
    answer: $150$
    clue: 垂径定理求半径 $r$，再算矩形面积。
    solution_steps:
    - 联结 $OE$，$OH\perp EF$ 于 $H$，$OH=r-2$，$EH=4$。
    - $r^2=(r-2)^2+4^2$，解得 $r=5$，$\therefore AB=CD=10$，$AD=5$。
    - 观演区面积 $=5\times10=50$ 平方米，可容纳 $50\times3=150$ 人。
    diagram_col:
      image_path: assets/prompt-01.png
      width: 55mm
      variant: prompt
      disclosure_policy: clean
