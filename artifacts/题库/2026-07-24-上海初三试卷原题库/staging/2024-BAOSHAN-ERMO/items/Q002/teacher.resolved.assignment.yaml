    stem_latex: 如果关于 $x$ 的一元二次方程 $x^2-x-m=0$ 有两个相等的实数根，那么实数 $m$ 的值是（$\blacktriangle$）
    choices:
    - $-1$
    - $-\dfrac{1}{4}$
    - $\dfrac{1}{4}$
    - $1$
    answer: B
    clue: 两相等实数根则 $\Delta=1+4m=0$。
