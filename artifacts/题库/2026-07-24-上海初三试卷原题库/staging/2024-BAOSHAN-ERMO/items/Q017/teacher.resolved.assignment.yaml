  - type: short_answer
    id: Q017
    points: 4
    stem_latex: 如图5，边长分别为 $5$，$3$，$2$ 的三个正方形拼接在一起，它们的一边在同一直线上，那么图中阴影三角形①和②的面积之比 $\dfrac{S_1}{S_2}$ 的比值为\u3000\u3000\u3000\u3000。
    answer: $\dfrac{4}{25}$
    clue: 用相似三角形（A 型、X 型）求两阴影三角形底边，面积比等于相似比平方。
    solution_steps:
    - $\triangle$①底边 $\dfrac{3}{5}$，$\triangle$②底边 $\dfrac{3}{2}$。
    - $\dfrac{S_1}{S_2}=\left(\dfrac{3/5}{3/2}\right)^2=\dfrac{4}{25}$。
