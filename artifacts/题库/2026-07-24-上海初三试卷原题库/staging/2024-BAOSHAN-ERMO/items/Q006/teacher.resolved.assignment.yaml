    stem_latex: 如图1，$\triangle ABC$ 中，$\angle C=90^{\circ}$，$AB=5$，$\tan B=\dfrac{1}{2}$，如果以点 $C$ 为圆心，半径为 $R$ 的 $\odot C$ 与线段 $AB$ 有两个交点，那么 $\odot C$ 的半径 $R$ 的取值范围是（$\blacktriangle$）
    choices:
