    - $2\leq R\leq\sqrt{5}$
    - $\sqrt{5}\leq R\leq 2\sqrt{5}$
    - $0<R\leq\sqrt{5}$
    answer: A
    clue: 圆与线段有两交点需 $R>$ 弦心距且 $R\leq$ 近端点距，弦心距 $CD=2$。
