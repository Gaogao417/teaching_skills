      (1) 求直线 $PA$ 的表达式；

      (2) 如果将 $\triangle POA$ 绕点 $O$ 逆时针旋转 $90^{\circ}$，点 $A$ 落在抛物线上的点 $Q$ 处，求抛物线的表达式；

      (3) 将(2)中得到的抛物线沿射线 $PA$ 平移，平移后抛物线的顶点为 $B$，与 $y$ 轴交于点 $C$。如果 $PC=\sqrt{2}\,AB$，求 $\tan\angle PBC$ 的值。'
