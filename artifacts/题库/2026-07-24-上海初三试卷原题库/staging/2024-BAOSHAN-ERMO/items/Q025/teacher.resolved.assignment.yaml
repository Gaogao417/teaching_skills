    id: Q025
    points: 14
    stem_latex: '（本题满分 $14$ 分）已知 $AB$ 是半圆 $O$ 的直径，$C$ 是半圆 $O$ 上不与 $A$、$B$ 重合的点，将弧 $AC$ 沿直线 $AC$ 翻折，翻折所得的弧交直径 $AB$ 于点 $D$，$E$ 是点 $D$ 关于直线 $AC$ 的对称点。

      (1) 如图12，点 $D$ 恰好落在点 $O$ 处。

      ① 用尺规作图在图12中作出点 $E$（保留作图痕迹），联结 $AE$、$CE$、$CD$，求证：四边形 $ADCE$ 是菱形；

      ② 联结 $BE$，与 $AC$、$CD$ 分别交于点 $F$、$G$，求 $\dfrac{FG}{BE}$ 的值；

      (2) 如果 $AB=10$，$OD=1$，求折痕 $AC$ 的长。'
    answer: (1)①证明见详解；②$\dfrac{1}{6}$；(2) $4\sqrt{5}$ 或 $\sqrt{70}$
    clue: (1)①由轴对称得四边相等证菱形；②平行线分线段成比例求 $FG/BE$；(2) 分 $D$ 在 $O$ 左、右两类，构造全等三角形求 $AC$。
    solution_steps:
    - (1)① $E$ 是 $D$ 关于 $AC$ 的对称点，$AE=AD$，$CE=CD$；又 $AD=CD$，$\therefore AE=AD=CE=CD$，四边形 $ADCE$ 是菱形。
    - (1)② 菱形 $ADCE$ 中 $CD\parallel AE$，$\dfrac{BG}{GE}=\dfrac{BO}{AO}=1$，$BG=GE$。
    - $\dfrac{EC}{OB}=\dfrac{CG}{GO}=1$，$\therefore\dfrac{CG}{CO}=\dfrac{CG}{AE}=\dfrac{1}{2}$。
    - $OC\parallel AE$，$\dfrac{FG}{FE}=\dfrac{CG}{AE}=\dfrac{1}{2}$，$\dfrac{FG}{GE}=\dfrac{1}{3}$；$BE=2GE$，$\therefore\dfrac{FG}{BE}=\dfrac{1}{6}$。
    - (2)①当 $D$ 在 $O$ 右侧，$AD=AE=6$，作 $OG\perp AE$、$CH\perp AB$，证 $\triangle OAG\cong\triangle COH$，$AG=OH=3$。
    - $Rt\triangle COH$ 中 $CH=\sqrt{5^2-3^2}=4$，$Rt\triangle ACH$ 中 $AC=\sqrt{8^2+4^2}=4\sqrt{5}$。
    - (2)②当 $D$ 在 $O$ 左侧，同理得 $AC=\sqrt{70}$。
    - 综上 $AC=4\sqrt{5}$ 或 $\sqrt{70}$。
