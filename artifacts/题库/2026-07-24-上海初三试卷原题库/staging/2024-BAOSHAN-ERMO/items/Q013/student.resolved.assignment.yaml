    id: Q013
    points: 4
    stem_latex: 《孙子算经》记载：今有木，不知长短。引绳度之，余绳四尺五寸；屈绳量之，不足一尺。其大意是：用一根绳子去量一根长木，绳子还剩余 $4.5$ 尺；将绳子对折再量长木，长木多出 $1$ 尺。那么长木的长度为\u3000\u3000\u3000\u3000尺。
