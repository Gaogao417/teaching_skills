        尺；将绳子对折再量长木，长木多出 $1$ 尺。那么长木的长度为\u3000\u3000\u3000\u3000尺。
      answer: $6.5$
      clue: 设绳长 $2x$，则木长 $2x-4.5$ 与 $x+1$ 相等。
      solution_steps:
      - 设绳长 $2x$，木长 $2x-4.5=x+1$，解得 $x=5.5$。
