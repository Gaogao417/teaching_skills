      answer: $x_1=\dfrac{1}{2},\;x_2=1$
      clue: 去分母化为整式方程，注意验根。
      solution_steps:
      - 两边乘 $2x(x+1)$，得 $6x=(x+1)+2x(x+1)$。
      - 整理得 $2x^2-3x+1=0$，$(2x-1)(x-1)=0$。
      - $x_1=\dfrac{1}{2}$，$x_2=1$，经检验均为原方程的根。
