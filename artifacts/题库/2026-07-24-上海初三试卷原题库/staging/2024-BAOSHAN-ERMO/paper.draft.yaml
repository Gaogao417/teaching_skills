      stem_latex: '（本题满分 $12$ 分，第(1)小题满分 $4$ 分，第(2)小题满分 $4$ 分，第(3)小题满分 $4$ 分）在平面直角坐标系
        $xOy$ 中（如图11），已知开口向下的抛物线 $y=ax^2-2x+4$ 经过点 $P(0,4)$，顶点为 $A$。

        (1) 求直线 $PA$ 的表达式；

        (2) 如果将 $\triangle POA$ 绕点 $O$ 逆时针旋转 $90^{\circ}$，点 $A$ 落在抛物线上的点 $Q$ 处，求抛物线的表达式；

        (3) 将(2)中得到的抛物线沿射线 $PA$ 平移，平移后抛物线的顶点为 $B$，与 $y$ 轴交于点 $C$。如果 $PC=\sqrt{2}\,AB$，求
        $\tan\angle PBC$ 的值。'
      answer: (1) $y=-x+4$；(2) $y=-\dfrac{1}{2}x^2-2x+4$；(3) $\dfrac{1}{3}$
      clue: (1) 配方求 $A$ 再待定系数；(2) 旋转构造全等求 $Q$ 代入解 $a$；(3) 平移后用 $PC=\sqrt{2}AB$ 求 $m$，再求正切。
      solution_steps:
      - (1) $y=ax^2-2x+4=a\left(x-\dfrac{1}{a}\right)^2+4-\dfrac{1}{a}$，$A\left(\dfrac{1}{a},4-\dfrac{1}{a}\right)$。
      - 设 $PA: y=kx+4$，代入 $A$ 得 $k=-1$，$\therefore y=-x+4$。
      - (2) $\triangle AOM\cong\triangle QON$，$A\left(\dfrac{1}{a},4-\dfrac{1}{a}\right)$
        旋转得 $Q\left(\dfrac{1}{a}-4,\dfrac{1}{a}\right)$。
      - 代入抛物线得 $8a^2+2a-1=0$，$a=-\dfrac{1}{2}$（$a=\dfrac{1}{4}$ 舍去），$\therefore y=-\dfrac{1}{2}x^2-2x+4$。
      - (3) $y=-\dfrac{1}{2}(x+2)^2+6$，$A(-2,6)$，平移后 $B(m,4-m)$，$C\left(0,-\dfrac{1}{2}m^2-m+4\right)$。
      - $AB=\sqrt{2}|m+2|$，$PC=\dfrac{1}{2}m^2+m$，由 $PC=\sqrt{2}AB$ 得 $\dfrac{1}{2}m^2+m=-2(m+2)$，$m=-4$。
      - $B(-4,8)$，$C(0,0)$，作 $CD\perp PA$ 于 $D$，$CD=DP=2\sqrt{2}$，$BD=6\sqrt{2}$。
      - $\tan\angle PBC=\dfrac{CD}{BD}=\dfrac{2\sqrt{2}}{6\sqrt{2}}=\dfrac{1}{3}$。
