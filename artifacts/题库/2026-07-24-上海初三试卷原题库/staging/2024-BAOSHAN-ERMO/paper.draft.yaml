        $y=x+3$ 与 $x$ 轴、$y$ 轴分别交于点 $A$、$B$，与反比例函数 $y=\dfrac{k}{x}$ 的图像交于点 $C(2,m)$。

        (1) 求反比例函数的解析式；

        (2) 过点 $C$ 作 $x$ 轴的平行线 $l$，如果点 $D$ 在直线 $l$ 上，且 $CD=3$，求 $\triangle ABD$ 的面积。'
      answer: (1) $y=\dfrac{10}{x}$；(2) $\dfrac{9}{2}$
      clue: (1) 直线求 $C$ 坐标再代入反比例函数；(2) $S_{\triangle ABD}=S_{\triangle ACD}-S_{\triangle
