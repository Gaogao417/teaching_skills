        EF$，$AB=AE$，得 $\dfrac{BE}{AE}=\dfrac{EF}{BE}$，$\triangle EBF\sim\triangle
        EAB$，$\angle FBE=\angle BAE$，$\therefore \angle ECF=\angle BAE$。
