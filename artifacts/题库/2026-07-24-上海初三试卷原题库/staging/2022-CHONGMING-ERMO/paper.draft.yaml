        ABC$ 中，$\angle C=90^{\circ}$，$AC>BC$，若 $\mathrm{Rt}\triangle ABC$ 是\u201c匀称三角形\u201d，那么
        $BC:AC:AB=$______
      answer: $\sqrt{3}:2:\sqrt{7}$
      clue: 只有 $BE=AC$ 满足，设 $AC=2a$ 用勾股定理。
      solution_steps:
      - 设 $AC=2a$，$BE$ 为 $AC$ 边中线且 $BE=AC=2a$，$CE=a$。
      - $\mathrm{Rt}\triangle BCE$ 中 $BC=\sqrt{BE^{2}-CE^{2}}=\sqrt{3}a$。
      - $\mathrm{Rt}\triangle ABC$ 中 $AB=\sqrt{BC^{2}+AC^{2}}=\sqrt{7}a$。
      - $\therefore BC:AC:AB=\sqrt{3}:2:\sqrt{7}$。
