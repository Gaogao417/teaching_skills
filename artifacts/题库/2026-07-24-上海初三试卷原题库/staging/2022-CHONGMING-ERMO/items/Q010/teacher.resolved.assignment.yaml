  - type: short_answer
    id: Q010
    points: 4
    stem_latex: 关于 $x$ 的一元二次方程 $x^{2}-mx-m+3=0$ 有两个相等的实数根，那么 $m$ 的值为______
    answer: $2$ 或 $-6$
    clue: $\Delta=0$。
    solution_steps:
    - $\Delta=m^{2}-4(-m+3)=m^{2}+4m-12=0$，$(m+6)(m-2)=0$，$m=2$ 或 $m=-6$。
