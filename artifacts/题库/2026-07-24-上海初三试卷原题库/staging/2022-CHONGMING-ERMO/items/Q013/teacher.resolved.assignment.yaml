    stem_latex: 袋中装有3个红球和5个黑球（除颜色外都相同），任意摸出一个球是红球的概率为______
    answer: $\dfrac{3}{8}$
    clue: 红球数除以总球数。
    solution_steps:
    - $P=\dfrac{3}{3+5}=\dfrac{3}{8}$。
