  - type: problem
    id: Q019
    points: 10
    stem_latex: 计算：$2^{-1}+\sin30^{\circ}-\dfrac{1}{\sqrt{3}+1}-(\sqrt{3}-1)^{0}$
    answer: $\dfrac{1-\sqrt{3}}{2}$
    clue: 负指数幂、特殊角三角比、分母有理化、零指数幂。
    solution_steps:
    - $2^{-1}=\dfrac{1}{2}$，$\sin30^{\circ}=\dfrac{1}{2}$，$(\sqrt{3}-1)^{0}=1$。
    - $\dfrac{1}{\sqrt{3}+1}=\dfrac{\sqrt{3}-1}{(\sqrt{3}+1)(\sqrt{3}-1)}=\dfrac{\sqrt{3}-1}{2}$。
    - 原式 $=\dfrac{1}{2}+\dfrac{1}{2}-\dfrac{\sqrt{3}-1}{2}-1=\dfrac{1-\sqrt{3}}{2}$。
