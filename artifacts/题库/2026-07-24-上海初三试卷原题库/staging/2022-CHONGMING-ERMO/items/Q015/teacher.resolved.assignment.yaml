    id: Q015
    points: 4
    stem_latex: 一个多边形的内角和是外角和的2倍，则这个多边形的边数为______
    answer: '6'
    clue: 内角和 $=(n-2)\times180^{\circ}$，外角和 $360^{\circ}$。
    solution_steps:
    - $(n-2)\times180=2\times360=720$，$n-2=4$，$n=6$。
