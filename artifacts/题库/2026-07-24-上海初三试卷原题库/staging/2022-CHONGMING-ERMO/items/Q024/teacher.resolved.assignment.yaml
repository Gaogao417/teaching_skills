  - type: problem
    id: Q024
    points: 12
    stem_latex: '抛物线 $y=ax^{2}+bx+3$ 与 $x$ 轴交于 $A$、$B$，与 $y$ 轴交于 $C$，$A(-1,0)$，对称轴 $x=1$，点 $E$ 在对称轴上，$EF\perp CE$ 交 $x$ 轴于 $F$。

      (1) 求抛物线解析式；

      (2) 当 $\triangle CEF$ 与 $\triangle ABC$ 相似时，求 $EF$；

      (3) 将 $\triangle ECF$ 沿 $CE$ 翻折，$F$ 落在 $y$ 轴上点 $N$ 处，求 $N$ 的坐标。'
    answer: (1) $y=-x^{2}+2x+3$；(2) $EF=\dfrac{9}{4}$；(3) $N(0,3\sqrt{2}+1)$
    clue: 待定系数；相似对应边分类；翻折得 $CF=EF$。
    solution_steps:
    - (1) 由对称轴 $-\dfrac{b}{2a}=1$ 及 $A(-1,0)$、$C(0,3)$ 代入，解得 $a=-1$，$b=2$，$\therefore y=-x^{2}+2x+3$。
    - (2) $B(3,0)$，$C(0,3)$，直线 $BC$：$y=-x+3$。设 $F(m,-m+3)$，$E(m,-m^{2}+2m+3)$，$EF=-m^{2}+3m$，$CF=\sqrt{2}m$。
    - 由 $\triangle CEF\sim\triangle ABC$ 两种对应，解得 $EF=\dfrac{20}{9}$（情形①）或 $EF=\dfrac{9}{4}$（情形②）；按题意取 $EF=\dfrac{9}{4}$。
    - (3) 翻折得 $CN=CF$、$\angle NCE=\angle ECF$，由 $NC\parallel EF$ 推得 $CF=EF$，即 $-n^{2}+3n=\sqrt{2}n$，$n=3-\sqrt{2}$，$CF=3\sqrt{2}-2$。
    - $ON=OC+CN=3+(3\sqrt{2}-2)=3\sqrt{2}+1$，$\therefore N(0,3\sqrt{2}+1)$。
