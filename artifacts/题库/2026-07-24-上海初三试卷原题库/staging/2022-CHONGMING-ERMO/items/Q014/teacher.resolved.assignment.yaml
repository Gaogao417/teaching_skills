  - type: short_answer
    id: Q014
    points: 4
    stem_latex: 《九章算术》：甲袋黄金9枚、乙袋白银11枚，称重两袋相同；两袋互换1枚后甲袋比乙袋轻13两。设每枚黄金重 $x$ 两、白银重 $y$ 两，可列方程组为______
    answer: $\begin{cases} 9x=11y \\ (10y+x)-(8x+y)=13 \end{cases}$
    clue: 等量关系：原两袋相等；交换后差13两。
    solution_steps:
    - 由两袋原重相等得 $9x=11y$。
    - 交换1枚后甲袋 $8x+y$、乙袋 $10y+x$，差13两：$(10y+x)-(8x+y)=13$。
