  - type: problem
    id: Q020
    points: 10
    stem_latex: 解方程组：$\begin{cases} x+2y=2 \\ x^{2}-5xy+4y^{2}=0 \end{cases}$
    answer: $\begin{cases} x_{1}=\dfrac{2}{3} \\ y_{1}=\dfrac{2}{3} \end{cases}$ 或 $\begin{cases} x_{2}=\dfrac{4}{3} \\ y_{2}=\dfrac{1}{3} \end{cases}$
    clue: 把②因式分解降次。
    solution_steps:
    - 由② $(x-y)(x-4y)=0$，得 $x=y$ 或 $x=4y$。
    - 当 $x=y$，代入① $3y=2$，$x=y=\dfrac{2}{3}$。
    - 当 $x=4y$，代入① $6y=2$，$y=\dfrac{1}{3}$，$x=\dfrac{4}{3}$。
