    id: Q011
    points: 4
    stem_latex: 函数 $y=\dfrac{x}{\sqrt{3x+1}}$ 中自变量 $x$ 的取值范围是______
    answer: $x>-\dfrac{1}{3}$
    clue: 分母不为零且根号内非负。
    solution_steps:
    - $3x+1>0$，$\therefore x>-\dfrac{1}{3}$。
