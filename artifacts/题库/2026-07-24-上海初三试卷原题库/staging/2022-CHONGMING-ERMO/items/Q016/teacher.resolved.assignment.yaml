  - type: short_answer
    id: Q016
    points: 4
    stem_latex: 如图，在平行四边形 $ABCD$ 中，$E$ 是 $CD$ 中点，$AE$ 交 $BD$ 于 $F$，设 $\overrightarrow{AB}=\vec{a}$，$\overrightarrow{BC}=\vec{b}$，那么 $\overrightarrow{BF}=$______
    answer: $\dfrac{2}{3}\vec{b}-\dfrac{2}{3}\vec{a}$
    clue: 由 $DE\parallel AB$ 得 $BF:FD=2:1$。
    solution_steps:
    - $\overrightarrow{BD}=\overrightarrow{BC}+\overrightarrow{CD}=\vec{b}-\vec{a}$。
    - $DE\parallel AB$，$BF:FD=BA:ED=2:1$，$\therefore \overrightarrow{BF}=\dfrac{2}{3}\overrightarrow{BD}=\dfrac{2}{3}\vec{b}-\dfrac{2}{3}\vec{a}$。
