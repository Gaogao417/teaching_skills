  - type: problem
    id: Q022
    points: 10
    stem_latex: '健身苑点\u201c侧摆器\u201d：摆臂 $OA=80$ 厘米，$A$ 为最低位置、$B$ 为最高位置，$\angle BOA=25^{\circ}$。

      (1) 求踏板中心在最高与最低位置时的高度差（精确到0.1厘米，$\sin25^{\circ}\approx0.423$，$\cos25^{\circ}\approx0.906$，$\tan25^{\circ}\approx0.466$）；

      (2) 原计划消耗400大卡，加快频率后每小时多耗100大卡，结果提早12分钟完成，求原计划锻炼时间。'
    answer: (1) 约 $7.5$ 厘米；(2) $1$ 小时
    clue: (1) 解直角三角形求 $AD$；(2) 分式方程。
    solution_steps:
    - (1) 过 $B$ 作 $BD\perp OA$ 于 $D$，$OD=80\cos25^{\circ}\approx72.48$，$AD=80-72.48\approx7.5$ 厘米。
    - (2) 设原计划 $x$ 小时，$\dfrac{400}{x-\frac{1}{5}}-\dfrac{400}{x}=100$，解得 $x=1$（$x=-\dfrac{4}{5}$ 舍去）。
