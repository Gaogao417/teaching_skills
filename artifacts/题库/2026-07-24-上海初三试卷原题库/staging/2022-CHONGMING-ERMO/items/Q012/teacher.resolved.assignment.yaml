    id: Q012
    points: 4
    stem_latex: 当 $0<k<1$ 时，一次函数 $y=(k-1)x+k$ 的图像不经过第______象限。
    answer: 三
    clue: $k-1<0$，$k>0$，过二、四、一象限。
    solution_steps:
    - $0<k<1$，$\therefore k-1<0$，$k>0$，图像过一、二、四象限，不过第三象限。
