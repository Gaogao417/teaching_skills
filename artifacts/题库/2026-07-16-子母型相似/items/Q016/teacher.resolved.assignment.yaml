    id: Q016
    points: 10
    label: 对应边与共线边互化
    stem_latex: '如图，在 $\triangle ABC$ 中，$\angle ABD=\angle ACB$。


      已知 $AC=3$，$AB=\sqrt{6}$。求 $CD$ 的长。'
    answer_space:
      type: steps
      height: 54mm
      step_count: 5
    answer: $CD=1$。
    explanation: 利用子母形中间边重复对应的特点，在对应边关系与共线整段、分段之间转换。
    solution_steps:
    - title: 由等角判相似
      content: 由题设等角以及 $A$ 点的公共角，得 $\triangle ABD\sim\triangle ACB$。
    - title: 锁定重复出现的对应边
      content: 对应关系为 $AB\leftrightarrow AC$、$AD\leftrightarrow AB$，因此可用 $AB$ 连接两组对应边。
    - title: 由对应边反求共线边
      content: 由 $\dfrac{AC}{AB}=\dfrac{AB}{AD}$，即 $AB^2=AC\cdot AD$，得 $AD=\dfrac{AB^2}{AC}=2$。
    - title: 处理同一直线上的整段与分段
      content: 点 $D$ 在线段 $AC$ 上，所以 $CD=AC-AD=3-2$。
    - title: 求值并验算
      content: 化简得 $CD=1$；并且 $AD+CD=AC$。
    teaching:
      teaching_goal: 由对应边反求共线分段
      source_relations:
      - explanation:nested
      - nested_middle_side_geometric_mean
