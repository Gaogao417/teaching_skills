    id: Q042
    points: 10
    label: 对应边与共线边互化
    stem_latex: '如图，在 $\triangle ABC$ 中，$\angle ABD=\angle ACB$。


      已知 $AB=2\sqrt{6}$，$AD=4$。求 $AC$ 的长。'
    answer_space:
      type: steps
      height: 54mm
      step_count: 5
    answer: $AC=6$。
    explanation: 利用子母形中间边重复对应的特点，在对应边关系与共线整段、分段之间转换。
    solution_steps:
    - title: 由等角判相似
      content: 由题设等角以及 $A$ 点的公共角，得 $\triangle ABD\sim\triangle ACB$。
    - title: 锁定对应关系
      content: 对应关系为 $AB\leftrightarrow AC$、$AD\leftrightarrow AB$。
    - title: 写出中间边平方关系
      content: 由 $\dfrac{AC}{AB}=\dfrac{AB}{AD}$，得 $AB^2=AC\cdot AD$。
    - title: 反求共线整段
      content: 所以 $AC=\dfrac{AB^2}{AD}=6$。
    - title: 验算
      content: 代回后两组对应边的比相等，故 $AC=6$。
    teaching:
      teaching_goal: 由对应中间边与内侧共线边求整段
      source_relations:
