    id: Q041
    points: 10
    label: 对应边与共线边互化
    stem_latex: '如图，在 $\triangle ABC$ 中，$\angle ABD=\angle ACB$。


      已知 $AC=6$，$AB=2\sqrt{6}$。求 $AD$ 的长。'
    answer_space:
      type: steps
      height: 54mm
      step_count: 5
    answer: $AD=4$。
    explanation: 利用子母形中间边重复对应的特点，在对应边关系与共线整段、分段之间转换。
    solution_steps:
    - title: 由等角判相似
      content: 由题设等角以及 $A$ 点的公共角，得 $\triangle ABD\sim\triangle ACB$。
    - title: 锁定对应关系
      content: 对应关系为 $AB\leftrightarrow AC$、$AD\leftrightarrow AB$。
    - title: 写出中间边平方关系
      content: 由 $\dfrac{AC}{AB}=\dfrac{AB}{AD}$，得 $AB^2=AC\cdot AD$。
    - title: 反求共线边
      content: 所以 $AD=\dfrac{AB^2}{AC}=4$。
    - title: 验算
      content: 代回可得 $\dfrac{AC}{AB}=\dfrac{AB}{AD}$，故 $AD=4$。
    teaching:
      teaching_goal: 由对应边反求内侧共线边
      source_relations:
      - explanation:nested
      - nested_middle_side_geometric_mean
      - collinear_segment_difference
      expected_blocker: 仍按普通构型寻找两组彼此分离的对应边，忽略 $AB$ 在比例链中重复出现。
      entry_point: corresponding_side_bidirectional_collinear_segment
      scaffold_level: low
