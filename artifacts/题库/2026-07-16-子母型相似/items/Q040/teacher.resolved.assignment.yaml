      upgrade_rule: 能主动写出 $AB^2=AC\cdot AD$，并根据已知方向决定先乘方还是先作差。
      fallback_move: 把 $AC,AD$ 看成同一直线上的大、小三角形边，再观察比例链中重复的 $AB$。
