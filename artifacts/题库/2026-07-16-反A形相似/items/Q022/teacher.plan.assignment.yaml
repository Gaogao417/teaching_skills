    label: 求指定边
    stem_latex: '如图，$\angle PAB=\angle PDC$。


      已知 $PB=2\sqrt{6}$，$PA=6$，$PC=8$。求 $PD$ 的长。'
    answer_space:
      type: steps
      height: 54mm
      step_count: 5
    answer: $PD=4\sqrt{6}$。
    explanation: 使用整数与整系数根式写出精确比例，再完成相似判定、对应和计算。
    solution_steps:
    - title: 整理已知边长比
      content: 题中给出的两边均为整数或整系数根式，因此可直接写成 $PB:PA=2\sqrt{6}:6$。
    - title: 由等角判相似
      content: 由题设等角和构型自带的另一组等角，得 $\triangle PAB\sim\triangle PDC$。
    - title: 按顶点确认对应边
      content: 三组小三角形边与大三角形边依次为：$PA\leftrightarrow PD$，$PB\leftrightarrow PC$，$AB\leftrightarrow DC$。
    - title: 保持比例方向一致
      content: 统一保持两组对应边的方向，可列 $\dfrac{PB}{PC}=\dfrac{PA}{PD}$，再代入 $PC=8$。
    - title: 求值并验算
      content: 解得 $PD=4\sqrt{6}$；代回后两组对应边的比完全相等。
    teaching:
      teaching_goal: 独立确定对应关系并求指定边
      source_relations:
      - explanation:reverse_a
      - similar_triangles_corresponding_sides
      - exact_integer_radical_ratio
      expected_blocker: 两组比例的对应顺序不一致，或根式乘除没有保持精确形式。
