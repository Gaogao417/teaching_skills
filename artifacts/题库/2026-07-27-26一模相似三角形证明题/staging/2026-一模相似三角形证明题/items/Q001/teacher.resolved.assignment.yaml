  blocks:
  - type: problem
    id: Q001
    points: 12
    stem_latex: 如图，在菱形 $ABCD$ 中，$E$ 是 $CD$ 上一点，联结 $BE$ 并延长，交 $AD$ 的延长线于点 $G$，交 $AC$
      于点 $F$。（1）求证：$BE\cdot BF=BG\cdot EF$；（2）若 $E$ 是 $CD$ 的中点，且 $AF\cdot CF=2BF^2$，求证：$BE\perp
      CD$。
    answer: （1）见证明；（2）$BE\perp CD$。
    solution_steps:
    - title: 第（1）问
      content: '四边形 $ABCD$ 是菱形，$\therefore AB\parallel CD$，$AG\parallel BC$。

        $\therefore \dfrac{BE}{EF}=\dfrac{AC}{CF}$，$\dfrac{BG}{BF}=\dfrac{AC}{CF}$。

        $\therefore \dfrac{BE}{EF}=\dfrac{BG}{BF}$，即 $BE\cdot BF=BG\cdot EF$。'
    - title: 第（2）问
      content: '$E$ 是 $CD$ 的中点，$\therefore CE=\dfrac{1}{2}CD=\dfrac{1}{2}AB$。

        $AB\parallel CD$，$\therefore \dfrac{CE}{AB}=\dfrac{CF}{AF}=\dfrac{EF}{BF}=\dfrac{1}{2}$，即
        $CF=\dfrac{1}{2}AF$。

        $AF\cdot CF=2BF^2$，$\therefore CF^2=BF^2$，$\therefore CF=BF$。

        $\therefore \angle FBC=\angle FCB=\angle FCE$。

        $\angle CEF=\angle BEC$，$\therefore \triangle ECF\sim\triangle EBC$。

        $\therefore \dfrac{EF}{CE}=\dfrac{CE}{BE}$，即 $CE^2=EF\cdot BE$。

        设 $EF=a$，则 $BF=CF=2a$，$BE=3a$，$\therefore CE^2=3a^2$。

        $\therefore CE^2+EF^2=CF^2$，$\therefore \angle CEF=90^\circ$，即 $BE\perp CD$。'
