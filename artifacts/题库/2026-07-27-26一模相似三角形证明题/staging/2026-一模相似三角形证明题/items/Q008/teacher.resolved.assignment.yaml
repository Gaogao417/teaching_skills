  - type: problem
    id: Q008
    points: 12
    stem_latex: 如图，在梯形 $ABCD$ 中，$AD\parallel BC,AB\perp BC$，$E$ 在 $AB$ 上，$DE$ 与 $AC$
      交于 $G$，$CE$ 平分 $\angle ACB$ 且 $DE\perp CE$。（1）证明 $AE^2=AG\cdot AC$；（2）证明 $AG\cdot
      GC=EG\cdot ED$。
    answer: 两结论均成立。
    solution_steps:
    - title: 第（1）问
      content: '$\angle AED+\angle DEC=\angle B+\angle BCE$，$\angle DEC=\angle B=90^\circ$，$\therefore
        \angle AED=\angle BCE$。

        又 $CE$ 平分 $\angle ACB$，$\therefore \angle ACE=\angle BCE$，$\therefore \angle
        AED=\angle ACE$。

        $\angle EAG=\angle CAE$，$\therefore \triangle AEG\sim\triangle ACE$。

        $\therefore \dfrac{AE}{AC}=\dfrac{AG}{AE}$，即 $AE^2=AG\cdot AC$。'
    - title: 第（2）问
      content: '$\because \triangle AEG\sim\triangle ACE$，$\therefore \dfrac{AG}{AE}=\dfrac{EG}{EC}$，即
        $\dfrac{AG}{EG}=\dfrac{AE}{EC}$。

        $\angle DAE=\angle CEG=90^\circ$，$\angle AED=\angle ECG$，$\therefore \triangle
        ADE\sim\triangle EGC$。

        $\therefore \dfrac{DE}{CG}=\dfrac{AE}{CE}$，$\therefore \dfrac{AG}{EG}=\dfrac{DE}{CG}$，即
        $AG\cdot GC=EG\cdot ED$。'
