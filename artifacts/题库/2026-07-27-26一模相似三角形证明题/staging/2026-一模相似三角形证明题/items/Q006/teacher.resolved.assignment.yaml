  - type: problem
    id: Q006
    points: 12
    stem_latex: 已知：如图，四边形 $ABCD$ 中，点 $E$ 在边 $BC$ 上，$DE$ 交 $AC$ 于点 $F$，$\angle AED=\angle
      B$，$AE^2=AF\cdot AC$。（1）求证：$\triangle ABE\sim\triangle ECF$；（2）如果 $\dfrac{AD}{AE}=\dfrac{AC}{EC}$，求证：$DE\cdot
      AC=AE\cdot BC$。
    answer: （1）$\triangle ABE\sim\triangle ECF$；（2）$DE\cdot AC=AE\cdot BC$。
    solution_steps:
    - title: 第（1）问
      content: $\because AE^2=AF\cdot AC$，$\therefore \dfrac{AF}{AE}=\dfrac{AE}{AC}$。又
        $\angle FAE=\angle EAC$，故 $\triangle AFE\sim\triangle AEC$，从而 $\angle AEF=\angle
        ACB$。由 $\angle AED=\angle B$，得 $\angle B=\angle ACB$。又由角的和差得 $\angle FEC=\angle
        BAE$，所以 $\triangle ABE\sim\triangle ECF$。
    - title: 第（2）问
      content: 由 $\angle B=\angle ACB$ 得 $AB=AC$。由 $\triangle ABE\sim\triangle ECF$
        及已知比例可得 $AE=AD$，所以 $\angle ADE=\angle AED=\angle ACB$；又 $\angle AED=\angle
        B$，故 $\triangle AED\sim\triangle ABC$。于是 $\dfrac{AD}{AC}=\dfrac{DE}{CB}$，即
        $DE\cdot AC=AE\cdot BC$。
