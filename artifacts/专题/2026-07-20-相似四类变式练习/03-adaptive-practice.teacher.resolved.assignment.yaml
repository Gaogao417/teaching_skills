- id: shared-angle-two-maps
  title: ''
  type: practice
  visibility: both
  blocks:
  - type: problem
    id: q14-variant
    points: 10
    label: 第 3 题
    stem_latex: |
      如图，点 $D$ 在 $\triangle ABC$ 的边 $AB$ 上，$AD=3$，$AB=12$，$AC=8$。过点 $D$ 的直线交 $AC$ 于点 $E$，使以点 $A,D,E$ 为顶点的三角形与 $\triangle ABC$ 相似，求所有可能的 $AE$。
    answer_space:
      type: steps
      height: 62mm
      step_count: 6
    answer: $AE=2$ 或 $AE=\dfrac92$。
    explanation: 共同角只锁定 $A\leftrightarrow A$，其余两个顶点还有两种对应，必须分别列比。
    solution_steps:
    - title: 锁定共同角
      content: 因为 $D\in AB$、$E\in AC$，所以 $\angle DAE=\angle BAC$，从而 $A\leftrightarrow
        A$。
    - title: 第一种对应
      content: 若 $D\leftrightarrow B$、$E\leftrightarrow C$，则 $\dfrac{AD}{AE}=\dfrac{AB}{AC}$，即
        $\dfrac3{AE}=\dfrac{12}{8}$，得 $AE=2$。
    - title: 第二种对应
      content: 若 $D\leftrightarrow C$、$E\leftrightarrow B$，则 $\dfrac{AE}{AD}=\dfrac{AB}{AC}$，即
        $\dfrac{AE}{3}=\dfrac{12}{8}$，得 $AE=\dfrac92$。两值都满足 $0<AE<8$。
    teaching:
      teaching_goal: 共角锁定一个顶点后，完整分类其余两点的对应。
      source_relations:
      - fallback:structure_analysis:similarity_shared_angle_two_vertex_maps
      model_fusion:
        model_count: 1
        models:
        - similarity_shared_angle_two_vertex_maps
        fusion_role: single_model
      expected_blocker: 只写一种对应，或比例式上下顺序不一致。
      entry_point: build_relation
      scaffold_level: medium
      variation_depth: changed_numbers
      complexity_note: 两个比例方程均为一步可解，只增加一次线段内的位置检验。
      upgrade_rule: 能在不试错的情况下写出两张顶点对应表。
      fallback_move: 先只写 $A\leftrightarrow A$，再把 $D,E$ 互换一次。
    diagram_col:
      kind: tikz
      tikz_code: ''
      tikz_path: build/diagram/jobs/practice-similarity4-q14-prompt/rendered/prompt.fragment.tex
      diagram_ref: practice.similarity4.q14.prompt
      diagram_job_id: practice-similarity4-q14-prompt
