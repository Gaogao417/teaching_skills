- id: square-perpendicular-similarity
  title: ''
  type: practice
  visibility: both
  blocks:
  - type: problem
    id: q12-variant
    points: 10
    label: 第 1 题
    stem_latex: |
      如图，在正方形 $ABCD$ 中，$E$ 为 $AB$ 边的中点，$G,F$ 分别为 $AD,BC$ 边上的点。若 $AG=4$，$BF=9$，$\angle GEF=90^\circ$，求 $GF$ 的长。
    answer_space:
      type: steps
      height: 54mm
      step_count: 5
    answer: $GF=13$。
    explanation: 垂直转等角后，先用相似定出正方形边长，再在梯形 $ABFG$ 中添高收尾。
    solution_steps:
    - title: 证明相似
      content: 由 $AG\perp AE$、$BE\perp BF$且 $GE\perp EF$，得 $\angle AGE=\angle BEF$，所以
        $\triangle AGE\sim\triangle BEF$。
    - title: 求正方形边长
      content: 设 $AE=BE=x$。由 $\dfrac{AG}{BE}=\dfrac{AE}{BF}$，得 $\dfrac4x=\dfrac x9$，所以
        $x=6$，$AB=12$。
    - title: 梯形添高后勾股
      content: 过 $G$ 作 $GH\perp BC$ 于 $H$，则 $GH=AB=12$，$HF=BF-AG=5$。因此 $GF=\sqrt{12^2+5^2}=13$。
    teaching:
      teaching_goal: 练习垂直转等角、相似定尺度与直角三角形收尾。
      source_relations:
      - fallback:structure_analysis:square_perpendicular_similarity_two_finishes
      model_fusion:
        model_count: 1
        models:
        - square_perpendicular_similarity_two_finishes
        fusion_role: single_model
      expected_blocker: 相似对应边写反，或忘记 $AE=BE$。
      entry_point: build_relation
      scaffold_level: medium
      variation_depth: changed_numbers
      complexity_note: 比例方程得整数，收尾是 $5$-$12$-$13$ 勾股数。
      upgrade_rule: 能独立写对应顺序，并在一次勾股中求出 $GF$。
      fallback_move: 先标出 $A,B,E$ 附近的三个直角。
    diagram_col:
      kind: tikz
      tikz_code: ''
      tikz_path: build/diagram/jobs/practice-similarity4-q12-prompt/rendered/prompt.fragment.tex
      diagram_ref: practice.similarity4.q12.prompt
