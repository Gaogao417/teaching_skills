- id: two-altitudes-similarity-count
  title: ''
  type: practice
  visibility: both
  blocks:
  - type: problem
    id: q13-variant
    points: 10
    label: 第 2 题
    stem_latex: |
      如图，$AD,BE$ 是锐角 $\triangle ABC$ 的两条高，垂足分别为 $D,E$，$AD,BE$ 相交于点 $O$。
      请找出图中四个两两相似的直角三角形，并写出全部相似三角形的配对，说明共有多少对。
    answer_space:
      type: steps
      height: 68mm
      step_count: 6
    answer: 四个三角形为 $\triangle BDO,\triangle AEO,\triangle ADC,\triangle BEC$，共 $6$
      对。
    explanation: 用“同款锐角+直角”找全四个对象，再通过两两配对并去重得到 6 对。
    solution_steps:
    - title: 找等角
      content: 由两条高可得 $\angle DBO=\angle EAO=90^\circ-\angle C$。
    - title: 找出四个三角形
      content: 同时含上述锐角和一个直角的三角形为 $\triangle BDO,\triangle BEC,\triangle AEO,\triangle
        ADC$，它们两两相似。
    - title: 列全配对
      content: $BDO-AEO$、$BDO-ADC$、$BDO-BEC$、$AEO-ADC$、$AEO-BEC$、$ADC-BEC$，共 $6$ 对。
    teaching:
      teaching_goal: 从两条高中主动找等角，并做无重复配对。
      source_relations:
      - fallback:structure_analysis:altitudes_equal_angle_similarity_handshake_count
      model_fusion:
        model_count: 1
        models:
        - altitudes_equal_angle_similarity_handshake_count
        fusion_role: single_model
      expected_blocker: 能找到四个三角形，但列配对时漏掉或重复。
      entry_point: hidden_structure
      scaffold_level: medium
      variation_depth: partially_hidden
      complexity_note: 不引入组合数符号，只做 4 个对象的小规模配对。
      upgrade_rule: 能写出四个对象，并用固定顺序列出不重复的六对。
      fallback_move: 先分别写出含 $B$ 点锐角和含 $A$ 点锐角的两个直角三角形。
    diagram_col:
      kind: tikz
      tikz_code: ''
      tikz_path: build/diagram/jobs/practice-similarity4-q13-prompt/rendered/prompt.fragment.tex
      diagram_ref: practice.similarity4.q13.prompt
