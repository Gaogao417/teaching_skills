- id: trapezoid-three-parallels
  title: ''
  type: practice
  visibility: both
  blocks:
  - type: problem
    id: q17-variant
    points: 10
    label: 第 4 题
    stem_latex: |
      如图，四边形 $ABCD$ 为梯形，$AB\parallel EF\parallel CD$，点 $E$ 在 $AD$ 上，点 $F$ 在 $BC$ 上。已知 $AE:ED=2:1$，$AB=5$，$CD=11$，求 $EF$。
    answer_space:
      type: steps
      height: 60mm
      step_count: 6
    answer: $EF=9$。
    explanation: 过 $A$ 作 $BC$ 的平行线，把梯形分成平行四边形和一个 A 字形相似构型。
    solution_steps:
    - title: 作辅助线
      content: 过 $A$ 作 $AH\parallel BC$，交 $EF,CD$ 于 $G,H$。则 $ABCH$、$ABFG$ 均为平行四边形。
    - title: 搬运并作差
      content: 所以 $HC=GF=AB=5$，从而 $DH=CD-HC=11-5=6$。
    - title: 用 A 字形相似求分段
      content: 在 $\triangle ADH$ 中，$EG\parallel DH$，所以 $\dfrac{EG}{DH}=\dfrac{AE}{AD}=\dfrac23$，得
        $EG=4$。因此 $EF=EG+GF=4+5=9$。
    teaching:
      teaching_goal: 选择过顶点的平行辅助线，把梯形截线题转成一次 A 字形相似。
      source_relations:
      - fallback:structure_analysis:trapezoid_three_parallels_three_a_shape_methods
      model_fusion:
        model_count: 1
        models:
        - trapezoid_three_parallels_three_a_shape_methods
        fusion_role: single_model
      expected_blocker: 知道要用相似，但找不到完整的三角形。
      entry_point: find_entry
      scaffold_level: medium
      variation_depth: changed_numbers
      complexity_note: 上下底差为 6，与 $2:1$ 的内分比配合得整数。
      upgrade_rule: 能一次作出 $AH\parallel BC$，并正确读出 $DH=CD-AB$。
      fallback_move: 先只标出平行四边形 $ABCH$，写出 $HC=AB$。
    diagram_col:
      kind: tikz
      tikz_code: ''
      tikz_path: build/diagram/jobs/practice-similarity4-q17-prompt/rendered/prompt.fragment.tex
      diagram_ref: practice.similarity4.q17.prompt
      diagram_job_id: practice-similarity4-q17-prompt
      width: 60mm
      caption: 三条平行线把两条腰按同一比例分割。
      variant: prompt
      disclosure_policy: clean
      artifact_hash: sha256:3caf26aa19f24a7301f985af83e4996837aa2c41aad91f4d8cfc038a30158763
      packages:
      - tikz
      libraries: []
