meta:
  title: "第 12、13 题相似综合讲解"
  subtitle: "学生讲义"
  grade: "九年级"
  subject: "数学"
  version: "student"
  source_artifacts:
    structure_analysis: "artifacts/专题/2026-07-18-第12与13题相似综合讲解/01-structure-analysis.md"

render:
  template: "exam-zh-explanation"
  paper_size: "a4paper"

sections:
  - id: "problem-12-similarity-two-finishes"
    title: "第 12 题：先相似定尺度，再用两种方法求 $GF$"
    show_title: true
    type: "explanation"
    visibility: "student"
    blocks:
      - type: "problemcard"
        id: "problem-12-card"
        label: "第 12 题"
        stem_latex: |
          如图，在正方形 $ABCD$ 中，$E$ 为 $AB$ 边的中点，$G,F$ 分别为 $AD,BC$ 边上的点。若 $AG=2$，$BF=4$，$\angle GEF=90^\circ$，求 $GF$ 的长。
        diagram_slot:
          slot_id: "explanation.problem12.prompt"
          diagram_ref: "explanation.problem12.prompt"
          variant: "prompt"
          disclosure_policy: "clean"
          required: true
          on_failure: "fail_assignment"
          placement: "block_center"
          layout_role: "center_block"
          display_profile: "worksheet_geometry_center"
          caption: '先在正方形中找出两组直角，再观察 $GE\perp EF$ 带来的等角。'
          diagram_kind: "synthetic_geometry"
          teaching_intent: "explanation_prompt"
          problem_context:
            stem_latex: '正方形 $ABCD$ 中，$E$ 是 $AB$ 中点，$G\in AD$，$F\in BC$，$AG=2$，$BF=4$，$GE\perp EF$，求 $GF$。'
            source_problem_text: "画正方形 ABCD，A 左下、B 右下、C 右上、D 左上。E 是 AB 中点，G 在 AD 上且 AG=2，F 在 BC 上且 BF=4。连接 GE、EF、GF。只显示题设对象与点名；不要画 GH，不要显示相似式、计算式或答案。"
          semantic_constraints:
            given_objects: [A, B, C, D, E, F, G]
            given_constraints:
              - ABCD is a square in order A-B-C-D
              - E is the midpoint of AB
              - G lies on AD and AG=2
              - F lies on BC and BF=4
              - GE is perpendicular to EF
              - segments GE, EF, and GF are visible
            clean_forbidden:
              - do not draw point H or segment GH
              - do not imply GF is parallel to AB
              - do not show similar-triangle notation, calculations, or the answer
          visual_requirements:
            required_visible_annotations:
              markers:
                - {type: right_angle, vertex: E, arms: [G, F]}
              texts: []

      - type: "solution"
        id: "problem-12-route-overview"
        title: "路线总览：公共阶段后分成两种收尾"
        items:
          - content_latex: |
              \begin{center}
              \begin{tikzpicture}[>=Stealth,every node/.style={font=\small,align=center}]
                \node[draw,rounded corners,fill=blue!5,text width=3.2cm,minimum height=1.1cm] (common) at (0,0)
                  {公共阶段 a\\相似求 $AE,BE$};
                \node[draw,rounded corners,fill=green!6,text width=3.3cm,minimum height=1.1cm] (m1) at (4.5,0.9)
                  {方法一 b1\\求 $GE,EF$};
                \node[draw,rounded corners,fill=green!6,text width=3.3cm,minimum height=1.1cm] (r1) at (9,0.9)
                  {$\triangle GEF$ 勾股\\$GF=6$};
                \node[draw,rounded corners,fill=orange!8,text width=3.3cm,minimum height=1.1cm] (m2) at (4.5,-0.9)
                  {方法二 b2\\作 $GH\perp BF$};
                \node[draw,rounded corners,fill=orange!8,text width=3.3cm,minimum height=1.1cm] (r2) at (9,-0.9)
                  {$\triangle GHF$ 勾股\\$GF=6$};
                \draw[->,thick] (common.east) -- (m1.west);
                \draw[->,thick] (m1.east) -- (r1.west);
                \draw[->,thick] (common.east) -- (m2.west);
                \draw[->,thick] (m2.east) -- (r2.west);
              \end{tikzpicture}
              \end{center}

      - type: "route"
        id: "problem-12-route-common"
        steps:
          - id: "problem-12-step-a-similar"
            latex: "公共阶段 a：先证相似，求出 $AE,BE$"
            content_latex: |
              $\because \angle GAE=\angle EBF=90^\circ$，且 $GE\perp EF$、$AE\perp BF$，\\
              $\therefore \angle AGE=\angle BEF$。\\
              $\therefore \triangle AGE\sim\triangle BEF$。\\
              设 $AE=BE=x$，则 $\dfrac{AG}{BE}=\dfrac{AE}{BF}$，即 $\dfrac2x=\dfrac x4$。\\
              解得 $x=2\sqrt2$，所以 $AE=BE=2\sqrt2$，$AB=4\sqrt2$。

      - type: "dual_explanation"
        id: "problem-12-solution-common"
        side_title: "公共入口"
        side_items:
          - kind: "hint"
            title: "相似顺序怎么对"
            content_latex: '先对直角：$A\leftrightarrow B$；再对相等锐角：$G\leftrightarrow E$；最后才是 $E\leftrightarrow F$。'
          - kind: "mistake"
            title: "根为什么取正"
            content_latex: '$x$ 表示线段长度，所以由 $x^2=8$ 只取 $x=2\sqrt2$。'
        solution_title: "公共阶段 a"
        solution_step_ids:
          - "problem-12-step-a-similar"

      - type: "route"
        id: "problem-12-route-method-1"
        steps:
          - id: "problem-12-step-b1"
            latex: '方法一 b1：求 $GE,EF$，再在 $\triangle GEF$ 中勾股'
            content_latex: |
              \textbf{解直角 $\triangle AGE$}：已知 $\angle GAE=90^\circ$，$AG=2$，$AE=2\sqrt2$，得 $GE=2\sqrt3$。\\
              \textbf{解直角 $\triangle EBF$}：已知 $\angle EBF=90^\circ$，$BE=2\sqrt2$，$BF=4$，得 $EF=2\sqrt6$。\\
              $\because \angle GEF=90^\circ$，\\
              $\therefore GF=\sqrt{GE^2+EF^2}=\sqrt{12+24}=6$。

      - type: "dual_explanation"
        id: "problem-12-solution-method-1"
        side_title: "方法一观察"
        side_items:
          - kind: "hint"
            title: "在哪个三角形收尾"
            content_latex: '题设已给 $GE\perp EF$，所以只要分别求出两条直角边 $GE,EF$，就能在 $\triangle GEF$ 中求 $GF$。'
        solution_title: "方法一 b1：利用题设直角"
        solution_step_ids:
          - "problem-12-step-b1"

      - type: "route"
        id: "problem-12-route-method-2"
        steps:
          - id: "problem-12-step-b2-helper"
            latex: '方法二 b2：过 $G$ 作 $GH\perp BF$ 于 $H$，解梯形 $ABFG$'
            content_latex: |
              过 $G$ 作 $GH\perp BF$ 于 $H$。\\
              $\because AG\parallel BF$，且 $AB\perp AG$，\\
              $\therefore$ 四边形 $ABHG$ 为矩形。\\
              $\therefore GH=AB=4\sqrt2$，$BH=AG=2$，$HF=BF-BH=2$。
            diagram_slot:
              slot_id: "explanation.problem12.solution.gh"
              diagram_ref: "explanation.problem12.solution.gh"
              variant: "solution"
              disclosure_policy: "annotated"
              reuse_geometry_from: "explanation.problem12.prompt"
              required: true
              on_failure: "fail_assignment"
              placement: "step_diagram"
              layout_role: "solution_annotation"
              display_profile: "worksheet_geometry_center"
              caption: "补出 $GH$ 后，梯形 $ABFG$ 中出现矩形 $ABHG$ 和直角三角形 $GHF$。"
              diagram_kind: "synthetic_geometry"
              teaching_intent: "explanation_solution"
              semantic_constraints:
                given_objects: [A, B, C, D, E, F, G, H]
                given_constraints:
                  - reuse the complete prompt geometry
                  - H lies on BF
                  - GH is perpendicular to BF
                  - segment GH is visible as an auxiliary segment
                  - auxiliary segment GH is rendered as a dashed line
                solution_allowed_annotations:
                  - show the right angle at H
                  - show GH as the newly added auxiliary segment
              visual_requirements:
                required_visible_annotations:
                  markers:
                    - {type: right_angle, vertex: H, arms: [G, F]}
                  texts: []

          - id: "problem-12-step-b2-finish"
            latex: '在 $\triangle GHF$ 中勾股，求出 $GF$'
            content_latex: |
              \textbf{解直角 $\triangle GHF$}：已知 $\angle GHF=90^\circ$，$GH=4\sqrt2$，$HF=2$，\\
              得 $GF=\sqrt{GH^2+HF^2}=\sqrt{32+4}=6$。

      - type: "dual_explanation"
        id: "problem-12-solution-method-2"
        side_title: "方法二观察"
        side_items:
          - kind: "hint"
            title: "辅助线解决什么"
            content_latex: '给梯形 $ABFG$ 作高后，$ABHG$ 成为矩形，能直接读出 $GH=AB$、$BH=AG$。'
          - kind: "hint"
            title: "在哪个三角形收尾"
            content_latex: '方法二不再计算 $GE,EF$，而是在新出现的直角三角形 $GHF$ 中一次勾股。'
        solution_title: "方法二 b2：梯形添高"
        solution_step_ids:
          - "problem-12-step-b2-helper"
          - "problem-12-step-b2-finish"

  - id: "problem-13-mark-angles-count-pairs"
    title: "第 13 题：标等角找相似，用“握手”数出 6 对"
    show_title: true
    type: "explanation"
    visibility: "student"
    layout:
      break_before: true
    blocks:
      - type: "problemcard"
        id: "problem-13-card"
        label: "第 13 题"
        stem_latex: |
          如图，$AD,BE$ 是 $\triangle ABC$ 的两条高，$AD,BE$ 相交于点 $O$，问图中共有多少对相似三角形。
        diagram_slot:
          slot_id: "explanation.problem13.prompt"
          diagram_ref: "explanation.problem13.prompt"
          variant: "prompt"
          disclosure_policy: "clean"
          required: true
          on_failure: "fail_assignment"
          placement: "block_center"
          layout_role: "center_block"
          display_profile: "worksheet_geometry_center"
          caption: '把 $\angle DBO$ 与 $\angle EAO$ 标成同款弧角，再找同时含弧角和直角的三角形。'
          diagram_kind: "synthetic_geometry"
          teaching_intent: "explanation_prompt"
          problem_context:
            stem_latex: '$AD,BE$ 是锐角 $\triangle ABC$ 的两条高，垂足分别为 $D,E$，交于 $O$。求图中相似三角形的对数。'
            source_problem_text: "画锐角三角形 ABC，A 在上方，B 左下，C 右下。D 在 BC 内部，AD 垂直 BC；E 在 AC 内部，BE 垂直 AC；AD 与 BE 在三角形内部交于 O。标出 D、E 两处直角；将角 DBO 与角 EAO 用完全相同的单弧标记。不要添加长度、等腰、中点、角平分线、相似式或答案。"
          semantic_constraints:
            given_objects: [A, B, C, D, E, O]
            given_constraints:
              - ABC is an acute scalene triangle
              - D lies on BC and AD is perpendicular to BC
              - E lies on AC and BE is perpendicular to AC
              - AD and BE intersect at O inside triangle ABC
              - angle DBO equals angle EAO and both carry matching single-arc marks
            clean_forbidden:
              - do not imply AB equals AC or any other pair of sides
              - do not add midpoint or angle-bisector marks
              - do not show triangle highlights, similar-triangle notation, pair counts, or the answer
          visual_requirements:
            required_visible_annotations:
              markers:
                - {type: right_angle, vertex: D, arms: [A, B]}
                - {type: right_angle, vertex: E, arms: [B, A]}
                - {type: angle_arc, vertex: B, arms: [D, O]}
                - {type: angle_arc, vertex: A, arms: [E, O]}
              texts: []

      - type: "route"
        id: "problem-13-route"
        steps:
          - id: "problem-13-step-mark-angles"
            latex: "先由两条高标出一组等角"
            content_latex: |
              $\because BE\perp AC$，\\
              $\therefore \angle DBO=90^\circ-\angle C$。\\
              $\because AD\perp BC$，\\
              $\therefore \angle EAO=90^\circ-\angle C$。\\
              $\therefore \angle DBO=\angle EAO$，把它们标成同款弧角。

          - id: "problem-13-step-find-four"
            latex: "再找含弧角的四个直角三角形"
            content_latex: |
              含 $B$ 点弧角的直角三角形：$\triangle BDO,\triangle BEC$。\\
              含 $A$ 点弧角的直角三角形：$\triangle AEO,\triangle ADC$。\\
              四个三角形都含一个弧角和一个直角，\\
              $\therefore \triangle BDO\sim\triangle AEO\sim\triangle ADC\sim\triangle BEC$。

          - id: "problem-13-step-handshake"
            latex: "最后用“每个都有 3 个伙伴”计数，再除以 2 去重"
            content_latex: |
              四个三角形中，每个三角形都和另外三个三角形相似，先得 $4\times3=12$ 次。\\
              但“$A$ 与 $B$ 相似”和“$B$ 与 $A$ 相似”是同一对，每一对都被重复计算了 $2$ 次。\\
              所以相似三角形共有 $\dfrac{4\times3}{2}=6$ 对。

      - type: "dual_explanation"
        id: "problem-13-solution"
        side_title: "小贴士"
        side_items:
          - kind: "hint"
            title: "为什么一个弧角能找到两个"
            content_latex: '$B$ 点的同一个弧角同时属于 $\triangle BDO$ 与 $\triangle BEC$；$A$ 点的同一个弧角同时属于 $\triangle AEO$ 与 $\triangle ADC$。'
          - kind: "hint"
            title: "找三角形的筛子"
            content_latex: '不要看大小和朝向，只检查两件事：有没有同款弧角？有没有 $90^\circ$？'
          - kind: "mistake"
            title: "为什么要除以 2"
            content_latex: '“$A$ 与 $B$ 相似”和“$B$ 与 $A$ 相似”只是顺序相反，表示同一对；$4\times3$ 把每一对恰好数了两次。'
        solution_title: "解答"
        solution_step_ids:
          - "problem-13-step-mark-angles"
          - "problem-13-step-find-four"
          - "problem-13-step-handshake"

      - type: "summary_dual"
        id: "problem-13-summary"
        left_title: "答案"
        left_items:
          - latex: "第 12 题：$GF=6$。"
          - latex: "第 13 题：共有 $6$ 对相似三角形。"
        right_title: "方法提醒"
        right_items:
          - latex: "第 12 题：相似定尺度，勾股有两种入口。"
          - latex: '第 13 题：标等角、找四个，用 $\dfrac{4\times3}{2}$ 握手计数。'
