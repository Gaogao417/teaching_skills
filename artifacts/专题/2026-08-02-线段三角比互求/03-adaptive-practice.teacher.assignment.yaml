sections:
  - id: "common-triples-1"
    title: "一、常见勾股数：先把方向做对"
    type: "practice"
    visibility: "both"
    blocks:
      - type: "choice"
        id: "q01"
        points: 4
        stem: '在 $\operatorname{Rt}\triangle ABC$ 中，$\angle B=90^\circ$，$AB=3$，$BC=4$，则 $\sin C=$（\quad）'
        choices: {A: '$\dfrac34$', B: '$\dfrac35$', C: '$\dfrac45$', D: '$\dfrac43$'}
        answer: "B"
        explanation: '$AC=5$，相对 $\angle C$，对边为 $AB$，故 $\sin C=AB/AC=3/5$。'
        teaching:
          teaching_goal: "从两条整数边求正弦。"
          source_relations: ["fallback:structure_analysis:right_triangle_segment_ratio_bidirectional"]
          model_fusion: {model_count: 1, models: ["right_triangle_segment_ratio_bidirectional"], fusion_role: "single_model"}
          expected_blocker: "把邻边放进正弦分子。"
          entry_point: "build_relation"
          scaffold_level: "medium"
          variation_depth: "same_structure"
          complexity_note: "直接识别 3-4-5。"
          upgrade_rule: "能先口答对边与斜边，再列式。"
          fallback_move: "先写对 AB、邻 BC、斜 AC。"
          number_selection: {database_id: "question-bank-training-numbers", family_id: "right_triangle_integer_triples", entry_id: "pythagorean-3-4-5"}

      - type: "fillin"
        id: "q02"
        points: 4
        stem: '在 $\operatorname{Rt}\triangle ABC$ 中，$\angle B=90^\circ$，$AB=5$，$BC=12$，则 $\tan C=$\fillin。'
        answer: '$\dfrac5{12}$'
        explanation: '$\tan C=AB/BC=5/12$，不需要先求斜边。'
        teaching:
          teaching_goal: "看到正切只取两条直角边。"
          source_relations: ["fallback:structure_analysis:right_triangle_segment_ratio_bidirectional"]
          model_fusion: {model_count: 1, models: ["right_triangle_segment_ratio_bidirectional"], fusion_role: "single_model"}
          expected_blocker: "机械补斜边或写成倒数。"
          entry_point: "find_entry"
          scaffold_level: "medium"
          variation_depth: "changed_numbers"
          complexity_note: "5-12-13 中无需使用 13。"
          upgrade_rule: "能判断本题无需勾股。"
          fallback_move: "只圈出正切所需的对边、邻边。"
          number_selection: {database_id: "question-bank-training-numbers", family_id: "right_triangle_integer_triples", entry_id: "pythagorean-5-12-13"}

      - type: "problem"
        id: "q03"
        points: 4
        label: "第 3 题"
        stem_latex: |
          在 $\operatorname{Rt}\triangle ABC$ 中，$\angle B=90^\circ$，
          $\sin C=\dfrac7{25}$，$BC=24$，求 $AC$。
        answer_space: {type: "steps", height: "28mm", step_count: 3}
        answer: '$AC=25$。'
        explanation: "把正弦读成对边与斜边的份数，再用 7-24-25 的邻边份数定倍数。"
        solution_steps:
          - title: "还原份数"
            content: '$\sin C=AB/AC=7/25$，故 $AB:BC:AC=7:24:25$。'
          - title: "由已知边定倍数"
            content: '$BC=24$，缩放倍数为 $1$，所以 $AC=25$。'
        teaching:
          teaching_goal: "由正弦反求斜边。"
          source_relations: ["fallback:structure_analysis:right_triangle_segment_ratio_bidirectional"]
          model_fusion: {model_count: 1, models: ["right_triangle_segment_ratio_bidirectional"], fusion_role: "single_model"}
          expected_blocker: "不能从 7:25 补出邻边份数 24。"
          entry_point: "build_relation"
          scaffold_level: "medium"
          variation_depth: "changed_question"
          complexity_note: "整数份数，无额外缩放。"
          upgrade_rule: "能从两项三角比补全三项份数。"
          fallback_move: "计算 $25^2-7^2$。"
          number_selection: {database_id: "question-bank-training-numbers", family_id: "right_triangle_integer_triples", entry_id: "pythagorean-7-24-25"}

  - id: "common-triples-2"
    title: "二、常见勾股数：交换已知与所求"
    type: "practice"
    visibility: "both"
    blocks:
      - type: "fillin"
        id: "q04"
        points: 4
        stem: '在 $\operatorname{Rt}\triangle ABC$ 中，$\angle B=90^\circ$，$\cos C=\dfrac{15}{17}$，$AC=17$，则 $AB=$\fillin。'
        answer: '$8$'
        explanation: '$BC:AC=15:17$，补成 $AB:BC:AC=8:15:17$，故 $AB=8$。'
        teaching:
          teaching_goal: "由余弦与斜边反求对边。"
          source_relations: ["fallback:structure_analysis:right_triangle_segment_ratio_bidirectional"]
          model_fusion: {model_count: 1, models: ["right_triangle_segment_ratio_bidirectional"], fusion_role: "single_model"}
          expected_blocker: "把余弦 15/17 误读成 AB/AC。"
          entry_point: "build_relation"
          scaffold_level: "medium"
          variation_depth: "changed_question"
          complexity_note: "直接使用 8-15-17。"
          upgrade_rule: "能先指出 15 对应邻边。"
          fallback_move: '先写 $\cos C=BC/AC$。'
          number_selection: {database_id: "question-bank-training-numbers", family_id: "right_triangle_integer_triples", entry_id: "pythagorean-8-15-17"}

      - type: "problem"
        id: "q05"
        points: 4
        label: "第 5 题"
        stem_latex: |
          在 $\operatorname{Rt}\triangle ABC$ 中，$\angle B=90^\circ$，
          $\tan C=\dfrac34$，$AC=10$。求 $AB$ 和 $BC$。
        answer_space: {type: "steps", height: "32mm", step_count: 3}
        answer: '$AB=6$，$BC=8$。'
        explanation: "正切给出两条直角边份数 3:4，斜边份数为 5，再由 AC=10 定倍数。"
        solution_steps:
          - title: "还原三边份数"
            content: '$\tan C=AB/BC=3/4$，故 $AB:BC:AC=3:4:5$。'
          - title: "同倍缩放"
            content: '$AC=10=5\times2$，所以 $AB=3\times2=6$，$BC=4\times2=8$。'
        teaching:
          teaching_goal: "由正切和斜边同时求两直角边。"
          source_relations: ["fallback:structure_analysis:right_triangle_segment_ratio_bidirectional"]
          model_fusion: {model_count: 1, models: ["right_triangle_segment_ratio_bidirectional"], fusion_role: "single_model"}
          expected_blocker: "知道 3:4，却忘记斜边是 5 份。"
          entry_point: "transfer"
          scaffold_level: "medium"
          variation_depth: "changed_question"
          complexity_note: "3-4-5 整体放大 2 倍。"
          upgrade_rule: "能由任意一种三角比补成完整三边份数。"
          fallback_move: '先计算 $\sqrt{3^2+4^2}$。'
          number_selection: {database_id: "question-bank-training-numbers", family_id: "right_triangle_integer_triples", entry_id: "pythagorean-3-4-5"}

      - type: "fillin"
        id: "q06"
        points: 4
        stem: '在 $\operatorname{Rt}\triangle ABC$ 中，$\angle B=90^\circ$，$AB=\dfrac{12}{7}$，$BC=\dfrac{16}{7}$，则 $\sin C=$\fillin。'
        answer: '$\dfrac35$'
        explanation: '$AC=20/7$，故 $\sin C=(12/7)/(20/7)=3/5$。'
        teaching:
          teaching_goal: "识别共同分母并化回 3-4-5。"
          source_relations: ["fallback:structure_analysis:right_triangle_segment_ratio_bidirectional"]
          model_fusion: {model_count: 1, models: ["right_triangle_segment_ratio_bidirectional"], fusion_role: "single_model"}
          expected_blocker: "被分母 7 干扰，未先看共同缩放。"
          entry_point: "transfer"
          scaffold_level: "medium"
          variation_depth: "changed_representation"
          complexity_note: "3-4-5 乘 4/7。"
          upgrade_rule: "能先约共同因子再做勾股。"
          fallback_move: "三边同时乘 7/4。"
          number_selection: {database_id: "question-bank-training-numbers", family_id: "integer_right_triangles_fraction_scaled", entry_id: "scaled-pythagorean-3-4-5-by-4-over-7"}

  - id: "scaled-triples-1"
    title: "三、分数倍勾股数：从边求比、从比求边"
    type: "practice"
    visibility: "both"
    blocks:
      - type: "choice"
        id: "q07"
        points: 4
        stem: '在 $\operatorname{Rt}\triangle ABC$ 中，$\angle B=90^\circ$，$AB=\dfrac52$，$BC=6$，则 $\cos C=$（\quad）'
        choices: {A: '$\dfrac5{12}$', B: '$\dfrac5{13}$', C: '$\dfrac{12}{13}$', D: '$\dfrac{13}{12}$'}
        answer: "C"
        explanation: '$AC=13/2$，所以 $\cos C=BC/AC=6/(13/2)=12/13$。'
        teaching:
          teaching_goal: "分数倍 5-12-13 中求余弦。"
          source_relations: ["fallback:structure_analysis:right_triangle_segment_ratio_bidirectional"]
          model_fusion: {model_count: 1, models: ["right_triangle_segment_ratio_bidirectional"], fusion_role: "single_model"}
          expected_blocker: "把 6 直接写成分子而漏除斜边。"
          entry_point: "solve_and_check"
          scaffold_level: "low"
          variation_depth: "changed_representation"
          complexity_note: "5-12-13 乘 1/2。"
          upgrade_rule: "能识别分数边仍保持原三角比。"
          fallback_move: "把三边同时乘 2。"
          number_selection: {database_id: "question-bank-training-numbers", family_id: "integer_right_triangles_fraction_scaled", entry_id: "scaled-pythagorean-5-12-13-by-1-over-2"}

      - type: "fillin"
        id: "q08"
        points: 4
        stem: '在 $\operatorname{Rt}\triangle ABC$ 中，$\angle B=90^\circ$，$\tan C=\dfrac34$，$AC=\dfrac52$，则 $AB=$\fillin。'
        answer: '$\dfrac32$'
        explanation: '$AB:BC:AC=3:4:5$，斜边由 5 份变为 $5/2$，倍数为 $1/2$，故 $AB=3/2$。'
        teaching:
          teaching_goal: "由正切和分数斜边定缩放。"
          source_relations: ["fallback:structure_analysis:right_triangle_segment_ratio_bidirectional"]
          model_fusion: {model_count: 1, models: ["right_triangle_segment_ratio_bidirectional"], fusion_role: "single_model"}
          expected_blocker: "除以 2 时只处理斜边。"
          entry_point: "transfer"
          scaffold_level: "low"
          variation_depth: "changed_representation"
          complexity_note: "3-4-5 乘 1/2。"
          upgrade_rule: "能用分数倍统一缩放三边。"
          fallback_move: "先求 1 份等于 1/2。"
          number_selection: {database_id: "question-bank-training-numbers", family_id: "integer_right_triangles_fraction_scaled", entry_id: "scaled-pythagorean-3-4-5-by-1-over-2"}

      - type: "problem"
        id: "q09"
        points: 4
        label: "第 9 题"
        stem_latex: |
          在 $\operatorname{Rt}\triangle ABC$ 中，$\angle B=90^\circ$，
          $\cos C=\dfrac45$，$AC=4$，求 $BC$。
        answer_space: {type: "steps", height: "28mm", step_count: 3}
        answer: '$BC=\dfrac{16}{5}$。'
        explanation: "余弦就是邻边与斜边之比，可直接用份数缩放。"
        solution_steps:
          - title: "读出边比"
            content: '$\cos C=BC/AC=4/5$。'
          - title: "按斜边缩放"
            content: '$AC=4$，故 $BC=4\times\dfrac45=\dfrac{16}{5}$。'
        teaching:
          teaching_goal: "由余弦直接求邻边。"
          source_relations: ["fallback:structure_analysis:right_triangle_segment_ratio_bidirectional"]
          model_fusion: {model_count: 1, models: ["right_triangle_segment_ratio_bidirectional"], fusion_role: "single_model"}
          expected_blocker: "把 4/5 误当成固定边长而不是比例。"
          entry_point: "solve_and_check"
          scaffold_level: "low"
          variation_depth: "changed_question"
          complexity_note: "3-4-5 乘 4/5。"
          upgrade_rule: "能在无需补第三边时直接求目标边。"
          fallback_move: "先写 $BC=(4/5)AC$。"
          number_selection: {database_id: "question-bank-training-numbers", family_id: "integer_right_triangles_fraction_scaled", entry_id: "scaled-pythagorean-3-4-5-by-4-over-5"}

  - id: "scaled-triples-2"
    title: "四、分数倍勾股数：识别公因子"
    type: "practice"
    visibility: "both"
    blocks:
      - type: "fillin"
        id: "q10"
        points: 4
        stem: '在 $\operatorname{Rt}\triangle ABC$ 中，$\angle B=90^\circ$，$AB=\dfrac{10}{3}$，$BC=8$，则 $\tan C=$\fillin。'
        answer: '$\dfrac5{12}$'
        explanation: '$\tan C=(10/3)/8=5/12$。'
        teaching:
          teaching_goal: "分数与整数混合时直接化简正切。"
          source_relations: ["fallback:structure_analysis:right_triangle_segment_ratio_bidirectional"]
          model_fusion: {model_count: 1, models: ["right_triangle_segment_ratio_bidirectional"], fusion_role: "single_model"}
