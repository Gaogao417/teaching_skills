          variation_depth: "changed_representation"
          complexity_note: "3-4-5 乘 2/3。"
          upgrade_rule: "能用一次份数还原连续回答多个三角比。"
          fallback_move: "把两条已知边同时乘 3/2。"
          number_selection: {database_id: "question-bank-training-numbers", family_id: "integer_right_triangles_fraction_scaled", entry_id: "scaled-pythagorean-3-4-5-by-2-over-3"}

  - id: "answer-key"
    title: "答案"
    type: "answer_key"
    visibility: "teacher"
    layout:
      break_before: true
    blocks:
      - type: "solution"
