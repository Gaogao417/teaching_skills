      - type: "problem"
        id: "q11"
        points: 4
        label: "第 11 题"
        stem_latex: |
          在 $\operatorname{Rt}\triangle ABC$ 中，$\angle B=90^\circ$，
          $\sin C=\dfrac35$，$BC=5$，求 $AC$。
        answer_space: {type: "steps", height: "28mm", step_count: 3}
        answer: '$AC=\dfrac{25}{4}$。'
        explanation: "3-4-5 中邻边为 4 份；4 份变为 5，倍数是 5/4。"
        solution_steps:
          - title: "补全份数"
            content: '$\sin C=3/5$，故 $AB:BC:AC=3:4:5$。'
          - title: "确定倍数"
            content: '$BC=5=4\times\dfrac54$，故 $AC=5\times\dfrac54=\dfrac{25}{4}$。'
        teaching:
          teaching_goal: "由已知邻边确定非整数缩放倍数。"
          source_relations: ["fallback:structure_analysis:right_triangle_segment_ratio_bidirectional"]
          model_fusion: {model_count: 1, models: ["right_triangle_segment_ratio_bidirectional"], fusion_role: "single_model"}
          expected_blocker: "把已知 BC=5 当作斜边 5 份。"
          entry_point: "transfer"
          scaffold_level: "low"
          variation_depth: "partially_hidden"
          complexity_note: "3-4-5 乘 5/4。"
          upgrade_rule: "能按边的角色选择正确份数定倍数。"
          fallback_move: "先在 3:4:5 下写 AB、BC、AC。"
          number_selection: {database_id: "question-bank-training-numbers", family_id: "integer_right_triangles_fraction_scaled", entry_id: "scaled-pythagorean-3-4-5-by-5-over-4"}

      - type: "choice"
        id: "q12"
        points: 4
        stem: '在 $\operatorname{Rt}\triangle ABC$ 中，$\angle B=90^\circ$，$AB=\dfrac{21}{5}$，$BC=\dfrac{28}{5}$，则 $\cot C=$（\quad）'
        choices: {A: '$\dfrac34$', B: '$\dfrac43$', C: '$\dfrac35$', D: '$\dfrac45$'}
        answer: "B"
        explanation: '$\cot C=BC/AB=(28/5)/(21/5)=4/3$。'
        teaching:
          teaching_goal: "辨析正切与余切的倒数关系。"
          source_relations: ["fallback:structure_analysis:right_triangle_segment_ratio_bidirectional"]
          model_fusion: {model_count: 1, models: ["right_triangle_segment_ratio_bidirectional"], fusion_role: "single_model"}
          expected_blocker: "按正切写成 3/4。"
          entry_point: "transfer"
          scaffold_level: "low"
          variation_depth: "changed_question"
          complexity_note: "3-4-5 乘 7/5。"
          upgrade_rule: "能不依赖口诀写出 cot=邻/对。"
          fallback_move: '先写 $\cot C=BC/AB$。'
          number_selection: {database_id: "question-bank-training-numbers", family_id: "integer_right_triangles_fraction_scaled", entry_id: "scaled-pythagorean-3-4-5-by-7-over-5"}

  - id: "scaled-triples-3"
    title: "五、双向混合：不看题号，只看已知与所求"
    type: "practice"
    visibility: "both"
    blocks:
      - type: "fillin"
        id: "q13"
        points: 4
        stem: '在 $\operatorname{Rt}\triangle ABC$ 中，$\angle B=90^\circ$，$\cos C=\dfrac45$，$AC=3$，则 $AB=$\fillin。'
        answer: '$\dfrac95$'
        explanation: '$AB:BC:AC=3:4:5$，斜边 5 份变为 3，倍数为 3/5，故 $AB=9/5$。'
        teaching:
          teaching_goal: "余弦给邻斜比，补出对边份数。"
          source_relations: ["fallback:structure_analysis:right_triangle_segment_ratio_bidirectional"]
          model_fusion: {model_count: 1, models: ["right_triangle_segment_ratio_bidirectional"], fusion_role: "single_model"}
