          number_selection: {database_id: "question-bank-training-numbers", family_id: "integer_right_triangles_fraction_scaled", entry_id: "scaled-pythagorean-3-4-5-by-3-over-5"}

      - type: "problem"
        id: "q14"
        points: 4
        label: "第 14 题"
        stem_latex: |
          在 $\operatorname{Rt}\triangle ABC$ 中，$\angle B=90^\circ$，
          $\tan C=\dfrac34$，$AC=\dfrac{35}{4}$，求 $BC$。
        answer_space: {type: "steps", height: "28mm", step_count: 3}
        answer: '$BC=7$。'
        explanation: "由 3:4:5 和分数斜边确定倍数 7/4。"
        solution_steps:
          - title: "还原三边份数"
            content: '$\tan C=3/4$，故 $AB:BC:AC=3:4:5$。'
          - title: "同倍缩放"
            content: '$AC=35/4=5\times7/4$，所以 $BC=4\times7/4=7$。'
        teaching:
          teaching_goal: "从分数斜边反推整数直角边。"
          source_relations: ["fallback:structure_analysis:right_triangle_segment_ratio_bidirectional"]
          model_fusion: {model_count: 1, models: ["right_triangle_segment_ratio_bidirectional"], fusion_role: "single_model"}
          expected_blocker: "把 35/4 直接乘 4/5 时化简不稳。"
          entry_point: "hidden_structure"
          scaffold_level: "low"
          variation_depth: "partially_hidden"
          complexity_note: "3-4-5 乘 7/4。"
          upgrade_rule: "能选择份数法或直接比例法并得到一致结果。"
          fallback_move: "先求 1 份为 7/4。"
          number_selection: {database_id: "question-bank-training-numbers", family_id: "integer_right_triangles_fraction_scaled", entry_id: "scaled-pythagorean-3-4-5-by-7-over-4"}

      - type: "problem"
        id: "q15"
        points: 4
        label: "第 15 题"
        stem_latex: |
          在 $\operatorname{Rt}\triangle ABC$ 中，$\angle B=90^\circ$，
          $AB=2$，$BC=\dfrac83$。求 $\sin C$ 和 $\cos C$。
        answer_space: {type: "steps", height: "34mm", step_count: 3}
        answer: '$\sin C=\dfrac35$，$\cos C=\dfrac45$。'
        explanation: "两条直角边同乘 3/2 可还原为 3 和 4，斜边相应为 5。"
        solution_steps:
          - title: "化回熟悉份数"
            content: '$AB:BC=2:\dfrac83=3:4$，故 $AB:BC:AC=3:4:5$。'
          - title: "分别列比"
            content: '$\sin C=AB/AC=3/5$，$\cos C=BC/AC=4/5$。'
        teaching:
          teaching_goal: "收束双向流程并同时输出两个三角比。"
          source_relations: ["fallback:structure_analysis:right_triangle_segment_ratio_bidirectional"]
          model_fusion: {model_count: 1, models: ["right_triangle_segment_ratio_bidirectional"], fusion_role: "single_model"}
