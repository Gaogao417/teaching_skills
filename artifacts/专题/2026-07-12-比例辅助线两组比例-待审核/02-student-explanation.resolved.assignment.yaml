      packages:
      - tikz
      libraries: []
  - type: route
    id: example-route
    show_navigation: false
    steps:
    - id: step-helper
      latex: 作辅助线
      content_latex: 过 $C$ 作 $CF\parallel AD$，交直线 $BE$ 于 $F$。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/explanation-example-helper/rendered/solution.fragment.tex
        diagram_ref: explanation.example.helper
        diagram_job_id: explanation-example-helper
        width: 70mm
        caption: 蓝字标出题目给出的两组比；过 $C$ 作 $CF\parallel AD$。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:36e814663e02dc676223ff609d57a75ce1922ba926010010a8ce6c0ff9a76b4b
        packages:
        - tikz
        libraries: []
    - id: step-eight
      latex: 解第一组 8 字
      content_latex: $\because CF\parallel AP$。\\ $\therefore \triangle EAP\sim\triangle
        ECF$。\\ $AE:EC=2:3$，故 $AP:CF=2:3$。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/explanation-example-model1/rendered/solution.fragment.tex
        diagram_ref: explanation.example.model1
        diagram_job_id: explanation-example-model1
        width: 70mm
        caption: 第二步解 8 字：由蓝色 $2:3$ 标出红色 $AP:CF=2:3$。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:3869f75a2f321e47a0ad2a67c9c0908ce00586763eabca1427244c3d07c7da27
        packages:
        - tikz
        libraries: []
    - id: step-a
      latex: 解第二组 A 字
      content_latex: $BD:BC=4:(4+5)=4:9$。\\ $\because CF\parallel DP$。\\ $\therefore
        \triangle BDP\sim\triangle BCF$。沿用 $CF=3$ 份，故只标 $PD=\frac{4}{3}$ 份。
      diagram_col:
        kind: tikz
        tikz_code: ''
        tikz_path: build/diagram/jobs/explanation-example-model2/rendered/solution.fragment.tex
        diagram_ref: explanation.example.model2
        diagram_job_id: explanation-example-model2
        width: 70mm
        caption: 第三步解 A 字：第一组红字保持不变，只新增 $PD=4/3$ 份。
        variant: solution
        disclosure_policy: annotated
        artifact_hash: sha256:a1c9b4e5b132bc68cb6ce7d3098a0221a41380d172530ef927066d94b60efd5b
        packages:
        - tikz
        libraries: []
    - id: step-unify
      latex: 比较两条边的份数
      content_latex: 图中已有 $AP=2$ 份、$PD=\frac{4}{3}$ 份。\\ $\therefore AP:PD=2:\frac{4}{3}=3:2$。
  - type: dual_explanation
    id: example-solution
    side_title: 看图提醒
    side_items:
    - kind: hint
      title: 颜色怎么读
      content_latex: 蓝字只表示题目给出的比；红字表示本步由相似得到的对应边份数。
    - kind: mistake
      title: 第二组先补整段
      content_latex: $BD:DC=4:5$，所以 $BD:BC=4:9$。
    solution_title: 解答
    solution_step_ids:
    - step-helper
    - step-eight
    - step-a
    - step-unify
