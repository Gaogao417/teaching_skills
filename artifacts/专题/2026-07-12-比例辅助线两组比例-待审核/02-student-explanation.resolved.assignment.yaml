  - type: problemcard
    id: example-card
    label: 例题
    stem_latex: 如图，点 $D$ 在线段 $BC$ 上，点 $E$ 在线段 $AC$ 上，$AD$ 与 $BE$ 交于点 $P$。已知 $AE:EC=2:3$，$BD:DC=4:5$，求
      $AP:PD$。
    diagram_col:
      kind: tikz
      tikz_code: ''
      tikz_path: build/diagram/jobs/explanation-example-prompt/rendered/prompt.fragment.tex
      diagram_ref: explanation.example.prompt
