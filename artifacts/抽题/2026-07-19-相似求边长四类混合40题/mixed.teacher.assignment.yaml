    answer: $AB=4$。
    explanation: 利用子母形中间边重复对应的特点，在对应边关系与共线整段、分段之间转换。
    solution_steps:
    - title: 先求小三角形的共线边
      content: 因为点 $D$ 在线段 $AC$ 上，所以 $AD=AC-CD=5-\frac{9}{5}=\frac{16}{5}$。
    - title: 由等角判相似
      content: 由题设等角以及 $A$ 点的公共角，得 $\triangle ABD\sim\triangle ACB$。
    - title: 锁定重复出现的对应边
      content: 对应关系为 $AB\leftrightarrow AC$、$AD\leftrightarrow AB$，因此线段 $AB$ 在比例链中重复出现。
    - title: 把共线边转成对应边
      content: 由 $\dfrac{AC}{AB}=\dfrac{AB}{AD}$，得 $AB^2=AC\cdot AD=5\times \frac{16}{5}$。
    - title: 求值并验算
      content: 边长取正，得 $AB=4$；代回可得 $\dfrac{AC}{AB}=\dfrac{AB}{AD}$。
