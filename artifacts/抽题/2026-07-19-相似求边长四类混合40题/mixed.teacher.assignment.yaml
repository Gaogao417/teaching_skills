  - type: problem
    id: M001
    points: 10
    label: 第 1 题
    stem_latex: '如图，在 $\triangle ABC$ 中，$\angle ABD=\angle ACB$。


      已知 $AC=9$，$CD=3$。求 $AB$ 的长。'
    answer_space:
      type: steps
      height: 54mm
      step_count: 5
    answer: $AB=3\sqrt{6}$。
    explanation: 利用子母形中间边重复对应的特点，在对应边关系与共线整段、分段之间转换。
    solution_steps:
    - title: 先求小三角形的共线边
      content: 因为点 $D$ 在线段 $AC$ 上，所以 $AD=AC-CD=9-3=6$。
    - title: 由等角判相似
      content: 由题设等角以及 $A$ 点的公共角，得 $\triangle ABD\sim\triangle ACB$。
    - title: 锁定重复出现的对应边
      content: 对应关系为 $AB\leftrightarrow AC$、$AD\leftrightarrow AB$，因此线段 $AB$ 在比例链中重复出现。
    - title: 把共线边转成对应边
      content: 由 $\dfrac{AC}{AB}=\dfrac{AB}{AD}$，得 $AB^2=AC\cdot AD=9\times 6$。
    - title: 求值并验算
      content: 边长取正，得 $AB=3\sqrt{6}$；代回可得 $\dfrac{AC}{AB}=\dfrac{AB}{AD}$。
    teaching:
      teaching_goal: 由共线整段与分段求对应边
      source_relations:
      - explanation:nested
      - nested_middle_side_geometric_mean
      - collinear_segment_difference
      expected_blocker: 仍按普通构型寻找两组彼此分离的对应边，忽略 $AB$ 在比例链中重复出现。
      entry_point: corresponding_side_bidirectional_collinear_segment
      scaffold_level: medium
      variation_depth: changed_representation
      complexity_note: 条件只在 $AB,AC$ 这组对应关系与 $AD,CD,AC$ 这组共线关系之间切换。
      upgrade_rule: 能主动写出 $AB^2=AC\cdot AD$，并根据已知方向决定先乘方还是先作差。
      fallback_move: 先用 $AD=AC-CD$ 把共线分段换成小三角形的边。
