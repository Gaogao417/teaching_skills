    label: 第 39 题
    stem_latex: '如图，$\angle PAB=\angle PDC$。


      已知 $PA=\sqrt{6}$，$PB=2\sqrt{2}$，$PC=4$。判断还可以求出哪条边，并求出它的长度。'
    answer_space:
      type: steps
      height: 54mm
      step_count: 5
    answer: $PD=2\sqrt{3}$。
    explanation: 使用整数与整系数根式写出精确比例，再完成相似判定、对应和计算。
    solution_steps:
    - title: 整理已知边长比
      content: 题中给出的两边均为整数或整系数根式，因此可直接写成 $PA:PB=\sqrt{6}:2\sqrt{2}$。
    - title: 由等角判相似
      content: 由题设等角和构型自带的另一组等角，得 $\triangle PAB\sim\triangle PDC$。
    - title: 按顶点确认对应边
      content: 三组小三角形边与大三角形边依次为：$PA\leftrightarrow PD$，$PB\leftrightarrow PC$，$AB\leftrightarrow DC$。
    - title: 保持比例方向一致
      content: 统一保持两组对应边的方向，可列 $\dfrac{PA}{PD}=\dfrac{PB}{PC}$，再代入 $PC=4$。
    - title: 求值并验算
      content: 解得 $PD=2\sqrt{3}$；代回后两组对应边的比完全相等。
