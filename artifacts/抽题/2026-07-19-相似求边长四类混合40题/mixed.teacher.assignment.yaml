      已知 $PB=4$，$PA=2\sqrt{6}$，$PC=6$。求 $PD$ 的长。'
    answer_space:
      type: steps
      height: 54mm
      step_count: 5
    answer: $PD=3\sqrt{6}$。
    explanation: 使用整数与整系数根式写出精确比例，再完成相似判定、对应和计算。
    solution_steps:
    - title: 整理已知边长比
      content: 题中给出的两边均为整数或整系数根式，因此可直接写成 $PB:PA=4:2\sqrt{6}$。
    - title: 由等角判相似
      content: 由题设等角和构型自带的另一组等角，得 $\triangle PAB\sim\triangle PDC$。
    - title: 按顶点确认对应边
      content: 三组小三角形边与大三角形边依次为：$PA\leftrightarrow PD$，$PB\leftrightarrow PC$，$AB\leftrightarrow DC$。
    - title: 保持比例方向一致
      content: 统一保持两组对应边的方向，可列 $\dfrac{PB}{PC}=\dfrac{PA}{PD}$，再代入 $PC=6$。
    - title: 求值并验算
      content: 解得 $PD=3\sqrt{6}$；代回后两组对应边的比完全相等。
    teaching:
      teaching_goal: 用相似对应边直接求指定边
      source_relations:
      - explanation:reverse_a
      - similar_triangles_corresponding_sides
      - exact_integer_radical_ratio
      expected_blocker: 两组比例的对应顺序不一致，或根式乘除没有保持精确形式。
      entry_point: exact_ratio_then_equal_angles_to_similarity
      scaffold_level: high
      variation_depth: changed_numbers
      complexity_note: 数库提供同一基准三角形的两条整数/整系数根式边；另一三角形只给一条整数对应边。数库边受素因数与比例限制，精确派生的未知边不限制为整数或小素因数。
      upgrade_rule: 能在题干不提示时主动写出精确边长比并保持对应方向。
      fallback_move: 先圈出一组完整对应边，再用同一方向写另一组对应边。
