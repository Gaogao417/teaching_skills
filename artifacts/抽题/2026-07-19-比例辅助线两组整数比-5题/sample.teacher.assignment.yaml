  - type: problem
    id: Q011
    points: 10
    label: 第 1 题
    stem_latex: 如图，点 $D$ 在线段 $BC$ 上，点 $E$ 在线段 $AC$ 上，$AD$ 与 $BE$ 交于点 $P$。已知 $AP:PD=5:3$，$BP:PE=3:1$，求 $AE:EC$。
    answer_space:
      type: steps
      height: 36mm
      step_count: 4
    answer: $AE:EC=1:1$。
    explanation: 第一组相似标共同边，第二组沿用它，只给另一条目标边新增份数。
    solution_steps:
    - title: 作辅助线
      content: 过 A 作 AF 平行 EP，交直线 BC 于 F。蓝字标出题目给出的两组比。
      diagram_col:
        kind: tikz
        tikz_code: ''
