sections:
- id: similarity-three-step
  title: 反A一图四相似——找等角、选判定、写格式
  show_title: true
  type: explanation
  visibility: student
  blocks:

  - type: solution
    id: method-overview
    title: 相似证明三步法
    items:
    - latex: \textbf{第一步 找等角}——在两个三角形里先找到一对相等的角：公共顶点处的\textbf{公共角}，或交点 $O$ 处的\textbf{对顶角}。
    - latex: \textbf{第二步 选判定}——能找到第二对等角就用 $\textbf{AA}$；夹这个角的两组对应边成比例就用 $\textbf{SAS}$。
    - latex: \textbf{第三步 写格式}——按固定格式书写：``在 $\triangle XXX$ 和 $\triangle YYY$ 中''$\to$写条件（$\because$）$\to$下结论（$\therefore$）。
    - content_latex: |
        \textbf{关键原则：用什么判定证，就推出另一种结论。}\\
        用 $\text{AA}$ 证（给两对角相等）$\to$ 推出\textbf{三组对应边成比例}；\\
        用 $\text{SAS}$ 证（给一对角 $+$ 夹角两组边比）$\to$ 推出\textbf{其余对应角相等}。

  - type: problemcard
    id: composite-figure
    label: 例图
    stem_latex: |
      如图，在 $\triangle ABC$ 中，点 $D$、$E$ 分别在 $AB$、$AC$ 上，且 $\angle ADE=\angle ACB$。
      连接 $BE$、$CD$，相交于点 $O$——四边形 $DECB$ 的两条对角线把下面分出一个``八''字。
      从 $\angle ADE=\angle ACB$ 出发，图中一共可以推出\textbf{四对}相似三角形。
    diagram_col:
      kind: tikz
      tikz_code: |-
        \begin{tikzpicture}[scale=0.62,every node/.style={font=\small}]
          \coordinate (A) at (3,6);
          \coordinate (B) at (0,0);
          \coordinate (C) at (6,0);
          \coordinate (D) at (1.8,3.6);
          \coordinate (E) at (4.2,3.6);
          \coordinate (O) at (intersection of B--E and C--D);
          \draw(A)--(B)--(C)--cycle;
          \draw(B)--(E);
          \draw(C)--(D);
          \draw(D)--(E);
          \fill(A)circle(1.5pt)node[above]{$A$};
          \fill(B)circle(1.5pt)node[below left]{$B$};
          \fill(C)circle(1.5pt)node[below right]{$C$};
          \fill(D)circle(1.5pt)node[left]{$D$};
          \fill(E)circle(1.5pt)node[right]{$E$};
          \fill(O)circle(1.5pt)node[below right]{$O$};
        \end{tikzpicture}
      width: 60mm
      caption: 先看公共顶点 $A$（公共角），再看对角线交点 $O$（对顶角）。

  # ── ① 反A形 ──────────────────────────────────
  - type: route
    id: route-a
    show_navigation: false
    steps:
    - id: a-proof
      latex: ① 反A形 △ADE∽△ACB
      content_latex: |-
        \textbf{找等角：}$\angle DAE=\angle CAB$（$A$ 是公共顶点，$D$ 在 $AB$ 上、$E$ 在 $AC$ 上）。\\
        \textbf{选判定：}已知 $\angle ADE=\angle ACB$，凑出第二对等角，用 $\text{AA}$。\\
        在 $\triangle ADE$ 和 $\triangle ACB$ 中，\\
        $\because \angle DAE=\angle CAB$（公共角）\\
        $\quad\angle ADE=\angle ACB$（已知）\\
        $\therefore \triangle ADE\sim\triangle ACB$（两角分别相等）\\
    - id: a-derive
      latex: 推出什么
      content_latex: |-
        $\therefore \angle AED=\angle ABC$（角相等）\\
        $\quad\dfrac{AD}{AC}=\dfrac{AE}{AB}=\dfrac{DE}{CB}$（边成比例）\\
        \textit{用 AA 证相似，推出的是\textbf{边成比例}——它正是 ② 要用的条件。}
  - type: dual_explanation
    id: dual-a
    label: "① 反A形"
    stem_latex: 求证 $\triangle ADE\sim\triangle ACB$，并写出它推出了什么。
    plain_solution: true
    side_title: 写一写
    side_items:
    - kind: hint
      title: 这次推出了什么？
      content_latex: 用 $\text{AA}$ 证 $\to$ 推出\textbf{边成比例} $\dfrac{AD}{AC}=\dfrac{AE}{AB}$，下一组马上要用。
    - kind: hint
      title: "``反''在哪里"
      content_latex: 对应是交叉的：$D\leftrightarrow C$，$E\leftrightarrow B$，不是 $D$ 对 $B$、$E$ 对 $C$。
    solution_step_ids:
    - a-proof
    - a-derive

  # ── ② 共角换位 ──────────────────────────────
  - type: route
    id: route-b
    show_navigation: false
    steps:
    - id: b-proof
      latex: ② 共角换位 △ADC∽△AEB
      content_latex: |-
        \textbf{找等角：}$\angle DAC=\angle EAB$（同一个公共角 $A$，三角形换成 $\triangle ADC$ 和 $\triangle AEB$）。\\
        \textbf{选判定：}把 ① 的边比交叉相乘：$AD\cdot AB=AE\cdot AC$，即 $\dfrac{AD}{AE}=\dfrac{AC}{AB}$，用 $\text{SAS}$。\\
        在 $\triangle ADC$ 和 $\triangle AEB$ 中，\\
        $\because \angle DAC=\angle EAB$（公共角）\\
        $\quad\dfrac{AD}{AE}=\dfrac{AC}{AB}$（由①）\\
        $\therefore \triangle ADC\sim\triangle AEB$（两边成比例且夹角相等）\\
    - id: b-derive
      latex: 推出什么
      content_latex: |-
        $\therefore \angle ADC=\angle AEB,\ \angle ACD=\angle ABE$（角相等）\\
        $\quad\dfrac{DC}{EB}=\dfrac{AD}{AE}=\dfrac{AC}{AB}$（边成比例）\\
        \textit{用 SAS 证相似，推出的是\textbf{角相等}——$\angle ADC=\angle AEB$ 正是 ③ 要用的条件。}
  - type: dual_explanation
    id: dual-b
    label: "② 共角换位"
    stem_latex: 求证 $\triangle ADC\sim\triangle AEB$，并写出它推出了什么。
    plain_solution: true
    side_title: 写一写
    side_items:
    - kind: hint
      title: 边比从哪来
      content_latex: ① 得 $\dfrac{AD}{AC}=\dfrac{AE}{AB}$，交叉相乘得 $AD\cdot AB=AC\cdot AE$，再交换内项得 $\dfrac{AD}{AE}=\dfrac{AC}{AB}$。
    - kind: hint
      title: 这次推出了什么？
      content_latex: 用 $\text{SAS}$ 证 $\to$ 推出\textbf{角相等} $\angle ADC=\angle AEB$，下一组马上要用。
    solution_step_ids:
    - b-proof
    - b-derive

  # ── ③ 蝶形 ──────────────────────────────────
  - type: route
    id: route-c
    show_navigation: false
    steps:
    - id: c-proof
      latex: ③ 蝶形 △ODB∽△OEC
      content_latex: |-
        \textbf{找等角：}$O$ 是 $BE$ 与 $CD$ 的交点，$\angle DOB=\angle EOC$（对顶角）。\\
        \textbf{选判定：}由 ② 的 $\angle ADC=\angle AEB$ 取补角：$\angle ODB=180^\circ-\angle ADC$，$\angle OEC=180^\circ-\angle AEB$，等角的补角相等，凑出第二对等角，用 $\text{AA}$。\\
        在 $\triangle ODB$ 和 $\triangle OEC$ 中，\\
        $\because \angle DOB=\angle EOC$（对顶角）\\
        $\quad\angle ODB=\angle OEC$（等角的补角相等）\\
        $\therefore \triangle ODB\sim\triangle OEC$（两角分别相等）\\
    - id: c-derive
      latex: 推出什么
      content_latex: |-
        $\therefore \dfrac{OD}{OE}=\dfrac{OB}{OC}=\dfrac{DB}{EC}$（边成比例）\\
        \textit{用 AA 证相似，推出的是\textbf{边成比例}——它正是 ④ 要用的条件。}
  - type: dual_explanation
    id: dual-c
    label: "③ 蝶形"
    stem_latex: 求证 $\triangle ODB\sim\triangle OEC$，并写出它推出了什么。
    plain_solution: true
    side_title: 写一写
    side_items:
    - kind: hint
      title: 角从哪来
      content_latex: $D$ 在 $AB$ 上，$\angle ODB$ 与 $\angle ADC$ 互补；$E$ 在 $AC$ 上，$\angle OEC$ 与 $\angle AEB$ 互补。由②等角的补角相等。
    - kind: hint
      title: 为什么叫蝶形
      content_latex: $\triangle ODB$ 和 $\triangle OEC$ 像一对翅膀挂在交点 $O$ 两侧；对应仍是交叉的：$D\leftrightarrow E$，$B\leftrightarrow C$。
    solution_step_ids:
    - c-proof
    - c-derive

  # ── ④ 8字型 ──────────────────────────────
  - type: route
    id: route-d
    show_navigation: false
    steps:
    - id: d-proof
      latex: ④ 8字型 △ODE∽△OBC
      content_latex: |-
        \textbf{找等角：}$\angle DOE=\angle BOC$（对顶角）。\\
        \textbf{选判定：}把 ③ 的边比交叉相乘：$OD\cdot OC=OE\cdot OB$，即 $\dfrac{OD}{OB}=\dfrac{OE}{OC}$，用 $\text{SAS}$。\\
        在 $\triangle ODE$ 和 $\triangle OBC$ 中，\\
        $\because \angle DOE=\angle BOC$（对顶角）\\
        $\quad\dfrac{OD}{OB}=\dfrac{OE}{OC}$（由③）\\
        $\therefore \triangle ODE\sim\triangle OBC$（两边成比例且夹角相等）\\
    - id: d-derive
      latex: 推出什么
      content_latex: |-
        $\therefore \angle ODE=\angle OBC,\ \angle OED=\angle OCB$（角相等）\\
        $\quad\dfrac{DE}{BC}=\dfrac{OD}{OB}=\dfrac{OE}{OC}$（边成比例）\\
        \textit{④ 的相似比与 ① 相同——$DE$ 在 $BC$ 上方，两线交于 $O$，正是``八''字。}
  - type: dual_explanation
    id: dual-d
    label: "④ 8字型"
    stem_latex: 求证 $\triangle ODE\sim\triangle OBC$，并写出它推出了什么。
    plain_solution: true
    side_title: 写一写
    side_items:
    - kind: hint
      title: 边比从哪来
      content_latex: ③ 得 $\dfrac{OD}{OE}=\dfrac{OB}{OC}$，交叉相乘得 $OD\cdot OC=OB\cdot OE$，再交换内项得 $\dfrac{OD}{OB}=\dfrac{OE}{OC}$。
    - kind: hint
      title: 8 字怎么看
      content_latex: $DE$ 一横在上、$BC$ 一横在下，$BE$ 与 $CD$ 交叉穿过 $O$——整个就是数字 $8$。对应：$D\leftrightarrow B$，$E\leftrightarrow C$。
    solution_step_ids:
    - d-proof
    - d-derive

  - type: method_reminder
    id: summary
    title: 一图四相似速记
    items:
    - latex: '\textbf{公共角 $A$}$\;\to\;$① 反A形 $\triangle ADE\sim\triangle ACB$（AA）、② 共角换位 $\triangle ADC\sim\triangle AEB$（SAS）。'
    - latex: '\textbf{对顶角 $O$}$\;\to\;$③ 蝶形 $\triangle ODB\sim\triangle OEC$（AA）、④ 8 字型 $\triangle ODE\sim\triangle OBC$（SAS）。'
    - latex: '\textbf{链条}：①推出边比 $\to$ ②的 SAS 用；②推出角 $\to$ ③的 AA 用；③推出边比 $\to$ ④的 SAS 用。上一组推出的，正是下一组要用的。'
    - latex: '\textbf{写结论}：用 $\text{AA}$ 证 $\to$ 推出\textbf{边成比例}；用 $\text{SAS}$ 证 $\to$ 推出\textbf{角相等}。'
