  - type: problem
    id: Q048
    points: 10
    label: 第 1 题
    stem_latex: '如图，$\angle OAC=\angle ODB$。


      已知 $AC=6$，$OC=3\sqrt{6}$，$DB=4$。判断还可以求出哪条边，并求出它的长度。'
    answer_space:
      type: steps
      height: 54mm
      step_count: 5
    answer: $OB=2\sqrt{6}$。
    explanation: 使用整数与整系数根式写出精确比例，再完成相似判定、对应和计算。
    solution_steps:
    - title: 整理已知边长比
      content: 题中给出的两边均为整数或整系数根式，因此可直接写成 $AC:OC=6:3\sqrt{6}$。
    - title: 由等角判相似
      content: 由题设等角和构型自带的另一组等角，得 $\triangle AOC\sim\triangle DOB$。
    - title: 按顶点确认对应边
      content: 三组小三角形边与大三角形边依次为：$AO\leftrightarrow OD$，$OC\leftrightarrow OB$，$AC\leftrightarrow DB$。
    - title: 保持比例方向一致
      content: 统一保持两组对应边的方向，可列 $\dfrac{AC}{DB}=\dfrac{OC}{OB}$，再代入 $DB=4$。
    - title: 求值并验算
      content: 解得 $OB=2\sqrt{6}$；代回后两组对应边的比完全相等。
    teaching:
      teaching_goal: 由三条已知边判断唯一可求边并计算
      source_relations:
      - explanation:butterfly
      - similar_triangles_corresponding_sides
      - exact_integer_radical_ratio
      expected_blocker: 两组比例的对应顺序不一致，或根式乘除没有保持精确形式。
      entry_point: exact_ratio_then_equal_angles_to_similarity
      scaffold_level: low
      variation_depth: partially_hidden
      complexity_note: 数库提供同一基准三角形的两条整数/整系数根式边；另一三角形只给一条整数对应边。数库边受素因数与比例限制，精确派生的未知边不限制为整数或小素因数。
      upgrade_rule: 能在题干不提示时主动写出精确边长比并保持对应方向。
      fallback_move: 先圈出一组完整对应边，再用同一方向写另一组对应边。
      number_selection:
        database_id: question-bank-training-numbers
        family_id: noncoprime_radicand_pairs
        entry_id: noncoprime-a4-b6-x3-y3
        values_latex:
        - '6'
        - 3\sqrt{6}
        squared_ratio:
        - 3
        - 2
        largest_prime_factor_max: 5
        max_ratio: sqrt(3)
        source_fractional_coefficients_allowed: false
        unknown_value_restrictions: none_beyond_positive_exact_value
      geometry_selection:
        database_id: similarity-triangle-realizations
        entry_id: butterfly-noncoprime-a4-b6-x3-y3-s2-t1-small-n4
        model: butterfly
