    id: Q037
    points: 10
    label: 第 1 题
    stem_latex: '如图，$AB\parallel CD$。

      已知 $PB=\sqrt{5}$，$PD=\sqrt{30}$，$PA=3\sqrt{5}$，求 $PC$。'
    answer_space:
      type: steps
      height: 42mm
      step_count: 4
    answer: $PC=3\sqrt{30}$。
    explanation: 已知边与未知边都不在平行线段 $AB,CD$ 上，先求两侧对应线段的比。先算 $\dfrac{PB}{PD}=\dfrac{\sqrt{5}}{\sqrt{30}}=\dfrac{1}{\sqrt{6}}$。约分后，$PC$ 对应 $\sqrt{6}$ 份，$PA$ 对应 $1$ 份。$PC=PA\times\dfrac{\sqrt{6}}{1}=3\sqrt{5}\times\dfrac{\sqrt{6}}{1}=3\sqrt{30}$。
    solution_steps:
    - title: 先判断
      content: 已知边与未知边都不在平行线段 $AB,CD$ 上，先求两侧对应线段的比。
    - title: 计算并约分
      content: $\dfrac{PB}{PD}=\dfrac{\sqrt{5}}{\sqrt{30}}=\dfrac{1}{\sqrt{6}}$。
    - title: 标份数
      content: 约分后，$PC$ 对应 $\sqrt{6}$ 份，$PA$ 对应 $1$ 份。
    - title: 按份数公式求边
      content: $PC=PA\times\dfrac{\sqrt{6}}{1}=3\sqrt{5}\times\dfrac{\sqrt{6}}{1}=3\sqrt{30}$。
