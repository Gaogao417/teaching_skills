    label: 第 11 题
    stem_latex: '如图，$AB\parallel CD$。

      已知 $PA=14$，$PC=26$，$CD=65$，求 $AB$。'
    answer_space:
      type: steps
      height: 42mm
      step_count: 4
    answer: $AB=35$。
    explanation: 已知边与未知边中出现平行线段 $CD$、$AB$，先求两个相似三角形的比。先算 $\dfrac{PA}{PC}=\dfrac{14}{26}=\dfrac{7}{13}$。约分后，$AB$ 对应 7 份，$CD$ 对应 13 份。$AB=CD\times\dfrac{7}{13}=65\times\dfrac{7}{13}=35$。
